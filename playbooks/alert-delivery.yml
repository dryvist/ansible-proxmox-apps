---
- name: Load deployment inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Fetch delivery credentials
  ansible.builtin.import_playbook: alert-delivery/00-secrets.yml

- name: Provision delivery databases
  ansible.builtin.import_playbook: alert-delivery/05-databases.yml

- name: Deploy notification workflows
  ansible.builtin.import_playbook: alert-delivery/10-notifications.yml

- name: Deploy incident workflows
  ansible.builtin.import_playbook: alert-delivery/20-incidents.yml

- name: Retire verified legacy delivery
  ansible.builtin.import_playbook: alert-delivery/30-cutover.yml
