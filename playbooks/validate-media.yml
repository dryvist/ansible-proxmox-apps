        - name: Assert at least one download client is present and enabled
          ansible.builtin.assert:
            that:
              - (validate_media_sonarr_downloadclients.json | selectattr('enable') | list | length) > 0
            fail_msg: "Sonarr has no enabled download client — nothing can ever download."
            quiet: true

        - name: Assert every Sonarr download client never auto-deletes torrents
          ansible.builtin.assert:
            that:
              - item.removeCompletedDownloads == servarr_wiring_remove_completed_downloads
              - item.removeFailedDownloads == servarr_wiring_remove_failed_downloads
            fail_msg: >-
              Sonarr download client '{{ item.name }}' has
              removeCompletedDownloads={{ item.removeCompletedDownloads }}/
              removeFailedDownloads={{ item.removeFailedDownloads }} — expected
              both false, so torrents keep seeding after import instead of
              qBittorrent deleting the data.
            quiet: true
          loop: "{{ validate_media_sonarr_downloadclients.json }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Fetch Sonarr media management settings
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_sonarr_port }}/api/v3/config/mediamanagement"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_sonarr_api_key }}"
            status_code: 200
          register: validate_media_sonarr_mediamgmt
          changed_when: false

        - name: Assert Sonarr media-management settings match servarr_wiring policy
          ansible.builtin.assert:
            that:
              - validate_media_sonarr_mediamgmt.json.copyUsingHardlinks == true
              - validate_media_sonarr_mediamgmt.json.recycleBin == servarr_wiring_recycler_bin_path
              - (validate_media_sonarr_mediamgmt.json.minimumFreeSpaceWhenImporting | int)
                == (servarr_wiring_min_free_space_mb | int)
            fail_msg: >-
              Sonarr media-management settings drifted from servarr_wiring's
              policy (hardlinks/recycle bin/min free space) — imports may copy
              instead of hardlink, or skip the recycle bin.
            quiet: true

        - name: Fetch Sonarr root folder
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_sonarr_port }}/api/v3/rootfolder"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_sonarr_api_key }}"
            status_code: 200
          register: validate_media_sonarr_rootfolder
          changed_when: false

        - name: Assert Sonarr root folder is accessible and matches the expected path
          ansible.builtin.assert:
            that:
              - >-
                (validate_media_sonarr_rootfolder.json
                 | selectattr('path', 'equalto', seerr_sonarr_root_folder)
                 | selectattr('accessible') | list | length) > 0
            fail_msg: >-
              Sonarr's root folder ({{ seerr_sonarr_root_folder }}) is missing
              or inaccessible: {{ validate_media_sonarr_rootfolder.json }}.
            quiet: true

        - name: Publish Sonarr root folder path for cross-app consistency check
          ansible.builtin.set_fact:
            validate_media_sonarr_rootfolder_path: "{{ seerr_sonarr_root_folder }}"

        - name: Fetch Sonarr queue (informational)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_sonarr_port }}/api/v3/queue"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_sonarr_api_key }}"
            status_code: 200
          register: validate_media_sonarr_queue
          changed_when: false

        - name: Fetch Sonarr health report
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_sonarr_port }}/api/v3/health"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_sonarr_api_key }}"
            status_code: 200
          register: validate_media_sonarr_health
          changed_when: false

        - name: Split Sonarr health issues into error / non-error
          ansible.builtin.set_fact:
            validate_media_sonarr_health_errors: >-
              {{ validate_media_sonarr_health.json | selectattr('type', 'equalto', 'error') | list }}
            validate_media_sonarr_health_other: >-
              {{ validate_media_sonarr_health.json | rejectattr('type', 'equalto', 'error') | list }}

        - name: Assert Sonarr reports no error-level health issues
          ansible.builtin.assert:
            that:
              - validate_media_sonarr_health_errors | length == 0
            fail_msg: >-
              Sonarr reports error-level health issues:
              {{ validate_media_sonarr_health_errors | map(attribute='message') | list }}
            quiet: true

        - name: Display Sonarr validation results
          ansible.builtin.debug:
            msg: |
              Sonarr {{ validate_media_sonarr_status.json.version }} validation on {{ inventory_hostname }}:
              - Synced indexers: {{ validate_media_sonarr_indexers.json | length }}
                ({{ validate_media_sonarr_indexers.json | map(attribute='name') | list }})
              - Download clients (safe, none auto-delete):
                {{ validate_media_sonarr_downloadclients.json | map(attribute='name') | list }}
              - Root folder accessible: {{ seerr_sonarr_root_folder }}
              - Queue: {{ validate_media_sonarr_queue.json.totalRecords | default('n/a') }} item(s)
              - Health: {{ validate_media_sonarr_health_errors | length }} error(s),
                {{ validate_media_sonarr_health_other | length }} warning(s)/notice(s)
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-sonarr

- name: Validate qBittorrent Safety Settings (download-vpn LXC)
  # Facts are needed here (unlike the other plays) to derive the LAN interface
  # the same way roles/download_vpn/tasks/main.yml Phase 0 does, so the
  # auth-bypass-whitelist assertion below compares against a value this
  # playbook computed independently rather than trusting the role's own
  # rendered config.
  hosts: download_vpn_group
  become: false
  gather_facts: true
  tags:
    - qbittorrent
    - validation

  vars_files:
    - ../roles/download_vpn/defaults/main.yml

  tasks:
    - name: "Validate qBittorrent (isolated — failure does not abort downstream plays)"
      block:
        - name: Fetch qBittorrent app version
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ download_vpn_qbittorrent_web_port }}/api/v2/app/version"
            method: GET
            status_code: 200
            # This endpoint returns a bare version string, not JSON, so the
            # value is only reachable through .content — and uri populates
            # .content only when asked. Without this the assertion below reads
            # an absent key, defaults to '', and reports a healthy daemon as a
            # broken API.
            return_content: true
          register: validate_media_qbt_version
          changed_when: false

        - name: Assert qBittorrent reports a version
          ansible.builtin.assert:
            that:
              - (validate_media_qbt_version.content | default('')) | length > 0
            fail_msg: "qBittorrent's /api/v2/app/version did not report a version — API may be broken."
            quiet: true

        - name: Fetch qBittorrent preferences
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ download_vpn_qbittorrent_web_port }}/api/v2/app/preferences"
            method: GET
            status_code: 200
          register: validate_media_qbt_prefs
          changed_when: false

        # Derive the LAN interface exactly as roles/download_vpn/tasks/main.yml
        # Phase 0 does: first gathered interface that is neither loopback nor
        # the wg interface and carries an IPv4 address.
        - name: Derive the LAN interface (mirrors download_vpn role's own derivation)
          ansible.builtin.set_fact:
            validate_media_qbt_lan_interface: >-
              {{ ansible_facts.interfaces
                 | reject('equalto', 'lo')
                 | reject('equalto', download_vpn_wg_interface)
                 | map('extract', ansible_facts)
                 | selectattr('ipv4', 'defined')
                 | selectattr('ipv4.address', 'defined')
                 | map(attribute='device') | list | first
                 | default('eth0', true) }}

        - name: Derive the expected auth-bypass whitelist (container's own /24)
          ansible.builtin.set_fact:
            validate_media_qbt_expected_whitelist: >-
              {{ (ansible_facts[validate_media_qbt_lan_interface].ipv4.address ~ '/24')
                 | ansible.utils.ipaddr('network/prefix') }}

        - name: Assert qBittorrent safety invariants
          ansible.builtin.assert:
            that:
              - validate_media_qbt_prefs.json.dht == false
              - validate_media_qbt_prefs.json.pex == false
              - validate_media_qbt_prefs.json.lsd == false
              - validate_media_qbt_prefs.json.max_ratio_act == 0
              - validate_media_qbt_prefs.json.max_active_torrents == -1
              - validate_media_qbt_prefs.json.max_active_uploads == -1
              - validate_media_qbt_prefs.json.up_limit == validate_media_qbt_prefs.json.alt_up_limit
              - validate_media_qbt_prefs.json.current_network_interface == download_vpn_wg_interface
              - validate_media_qbt_prefs.json.anonymous_mode == false
            fail_msg: >-
              qBittorrent safety invariants drifted:
              dht={{ validate_media_qbt_prefs.json.dht }}
              pex={{ validate_media_qbt_prefs.json.pex }}
              lsd={{ validate_media_qbt_prefs.json.lsd }}
              max_ratio_act={{ validate_media_qbt_prefs.json.max_ratio_act }}
              (want 0=stop, never delete)
              max_active_torrents={{ validate_media_qbt_prefs.json.max_active_torrents }}
              max_active_uploads={{ validate_media_qbt_prefs.json.max_active_uploads }}
              (want -1=unlimited — a seeding obligation must never silently stop)
              up_limit={{ validate_media_qbt_prefs.json.up_limit }}
              alt_up_limit={{ validate_media_qbt_prefs.json.alt_up_limit }}
              current_network_interface={{ validate_media_qbt_prefs.json.current_network_interface }}
              (want {{ download_vpn_wg_interface }} — anything else can leak outside the tunnel)
              anonymous_mode={{ validate_media_qbt_prefs.json.anonymous_mode }}
            quiet: true

        - name: Assert the WebUI auth-bypass whitelist is scoped to the container's own /24
          ansible.builtin.assert:
            that:
              - validate_media_qbt_prefs.json.bypass_auth_subnet_whitelist == validate_media_qbt_expected_whitelist
            fail_msg: >-
              qBittorrent's bypass_auth_subnet_whitelist is
              '{{ validate_media_qbt_prefs.json.bypass_auth_subnet_whitelist }}',
              expected '{{ validate_media_qbt_expected_whitelist }}' (the
              container's own /24). A wider value — e.g. a /16 — lets far more
              of the network skip the login form than intended.
            quiet: true

        - name: Fetch qBittorrent torrents (state counts only — no names, no tracker URLs)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ download_vpn_qbittorrent_web_port }}/api/v2/torrents/info"
            method: GET
            status_code: 200
          register: validate_media_qbt_torrents
          changed_when: false
          no_log: true

        - name: Display qBittorrent validation results
          ansible.builtin.debug:
            msg: |
              qBittorrent {{ validate_media_qbt_version.content }} validation on {{ inventory_hostname }}:
              - DHT/PeX/LSD: off (as required)
              - max_ratio_act: stop, never delete
              - max_active_torrents/uploads: unlimited (as required)
              - alt_up_limit == up_limit: {{ validate_media_qbt_prefs.json.up_limit }} B/s
              - current_network_interface: {{ validate_media_qbt_prefs.json.current_network_interface }}
              - anonymous_mode: {{ validate_media_qbt_prefs.json.anonymous_mode }}
              - auth-bypass whitelist: {{ validate_media_qbt_expected_whitelist }}
              - Torrents by state (counts only):
                {% for _g in validate_media_qbt_torrents.json | groupby('state') %}
                {{ _g.grouper }}={{ _g.list | length }} {% endfor %}

              - Total torrents: {{ validate_media_qbt_torrents.json | length }}
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-qbittorrent

