              - (validate_media_sonarr_status.json.version | default('')) | length > 0
            fail_msg: "Sonarr's /system/status did not report a version — API may be broken."
            quiet: true

        - name: Fetch Sonarr indexers (synced from Prowlarr)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_sonarr_port }}/api/v3/indexer"
            method: GET
            headers:
