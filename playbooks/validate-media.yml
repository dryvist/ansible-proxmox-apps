- name: Validate Plex Libraries
  hosts: plex_group
  become: false
  gather_facts: false
  tags:
    - plex
    - validation

  vars_files:
    - ../roles/plex/defaults/main.yml

  tasks:
    - name: "Plex validation (isolated — failure does not abort downstream plays)"
      block:
        - name: Fetch Plex server identity (unauthenticated, reports a version)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ plex_local_api_port }}/identity"
            method: GET
            headers:
              Accept: application/json
            status_code: 200
          register: validate_media_plex_identity
          changed_when: false

        - name: Assert Plex reports a version
          ansible.builtin.assert:
            that:
              - (validate_media_plex_identity.json.MediaContainer.version | default('')) | length > 0
            fail_msg: "Plex's /identity did not report a version — API may be broken."
            quiet: true

        # Same token discovery as roles/plex/tasks/libraries.yml: an account
        # override (PLEX_TOKEN) or the on-server PlexOnlineToken once claimed.
        - name: Read Preferences.xml to discover the server's Plex token
          ansible.builtin.slurp:
            src: "{{ plex_preferences_path }}"
          register: validate_media_plex_prefs_file
          failed_when: false
          no_log: true

        - name: Resolve the effective Plex token
          ansible.builtin.set_fact:
            validate_media_plex_token: >-
              {{ plex_account_token if (plex_account_token | length > 0)
                 else (validate_media_plex_prefs_file.content | default('') | b64decode
                       | regex_findall('PlexOnlineToken="([^"]+)"') | first | default('')) }}
          no_log: true

        - name: Fetch Plex library sections
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ plex_local_api_port }}/library/sections"
            method: GET
            headers: >-
              {{ {'Accept': 'application/json'}
                 | combine({'X-Plex-Token': validate_media_plex_token}
                           if (validate_media_plex_token | length > 0) else {}) }}
            status_code: 200
          register: validate_media_plex_sections
          changed_when: false
          no_log: true

        - name: Assert every configured Plex library exists at its expected path
          ansible.builtin.assert:
            that:
              - >-
                (validate_media_plex_sections.json.MediaContainer.Directory
                 | selectattr('title', 'equalto', item.name)
                 | selectattr('type', 'equalto', item.type)
                 | list | length) > 0
            fail_msg: >-
              Plex library '{{ item.name }}' ({{ item.type }}) is missing —
              expected it pointed at {{ item.location }}.
            quiet: true
          loop: "{{ plex_libraries }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Publish Plex library locations for cross-app consistency check
          ansible.builtin.set_fact:
            validate_media_plex_locations: >-
              {{ validate_media_plex_sections.json.MediaContainer.Directory
                 | map(attribute='Location') | flatten
                 | map(attribute='path') | list }}

        - name: Display Plex validation results
          vars:
            _plex_version: "{{ validate_media_plex_identity.json.MediaContainer.version }}"
            _plex_titles: >-
              {{ validate_media_plex_sections.json.MediaContainer.Directory
                 | map(attribute='title') | list }}
          ansible.builtin.debug:
            msg: |
              Plex {{ _plex_version }} validation on {{ inventory_hostname }}:
              - Libraries: {{ _plex_titles }}
              - Locations: {{ validate_media_plex_locations }}
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-plex

