- name: Validate Sortarr
  hosts: sortarr_group
  become: false
  gather_facts: false
  tags:
    - sortarr
    - validation

  vars_files:
    - ../roles/sortarr/defaults/main.yml

  tasks:
    - name: "Sortarr validation (isolated — failure does not abort downstream plays)"
      block:
        # This version of Sortarr has no /api/health — /api/config is the
        # closest read-only "is it actually serving the API" probe.
        - name: Verify SORTARR_BASIC_AUTH_PASS is set
          ansible.builtin.assert:
            that:
              - sortarr_basic_auth_pass | length > 0
            fail_msg: >-
              SORTARR_BASIC_AUTH_PASS is not set. Run with sops exec-env +
              doppler run so the role's own credential is in the environment.
            quiet: true

        - name: Fetch Sortarr config endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ sortarr_web_port }}/api/config"
            method: GET
            url_username: "{{ sortarr_basic_auth_user }}"
            url_password: "{{ sortarr_basic_auth_pass }}"
            force_basic_auth: true
            status_code: 200
          register: validate_media_sortarr_config
          changed_when: false
          no_log: true

        - name: Display Sortarr validation results
          ansible.builtin.debug:
            msg: "Sortarr validation on {{ inventory_hostname }}: /api/config reachable."
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-sortarr

- name: Validate cross-app root-folder / library-path consistency
  # A single-app check cannot catch this: Sonarr and Radarr each believe their
  # own root folder is correct in isolation, and so does Plex — the drift only
  # shows up when the three are compared against each other.
  hosts: localhost
  gather_facts: false
  # ansible_become, not the `become:` keyword — see the summary play below.
  vars:
    ansible_become: false
  tags:
    - consistency
    - validation

  tasks:
    - name: "Cross-app consistency validation (isolated — failure does not abort downstream plays)"
      block:
        - name: Assert Sonarr's root folder matches a Plex library location
          vars:
            _sonarr_path: "{{ hostvars['sonarr'].validate_media_sonarr_rootfolder_path | default('__unset__') }}"
            _plex_locations: "{{ hostvars['plex'].validate_media_plex_locations | default([]) }}"
          ansible.builtin.assert:
            that:
              - _sonarr_path in _plex_locations
            fail_msg: >-
              Sonarr's root folder ({{ _sonarr_path }}) does not match any Plex
              library location ({{ _plex_locations }}) — Sonarr can import a
              show that Plex will never show, or vice versa.
            quiet: true
          when: >-
            (groups['sonarr_group'] | default([]) | length > 0)
            and (groups['plex_group'] | default([]) | length > 0)

        - name: Assert Radarr's root folder matches a Plex library location
          vars:
            _radarr_path: "{{ hostvars['radarr'].validate_media_radarr_rootfolder_path | default('__unset__') }}"
            _plex_locations: "{{ hostvars['plex'].validate_media_plex_locations | default([]) }}"
          ansible.builtin.assert:
            that:
              - _radarr_path in _plex_locations
            fail_msg: >-
              Radarr's root folder ({{ _radarr_path }}) does not match any
              Plex library location ({{ _plex_locations }}) — Radarr can
              import a movie that Plex will never show, or vice versa.
            quiet: true
          when: >-
            (groups['radarr_group'] | default([]) | length > 0)
            and (groups['plex_group'] | default([]) | length > 0)
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-consistency

- name: Media Stack Validation Summary
  hosts: localhost
  gather_facts: false
  # ansible_become, not the `become:` keyword: group_vars/all.yml sets
  # ansible_become for managed nodes, the implicit localhost inherits it, and a
  # connection variable outranks the play keyword. `become: false` here looked
  # like it disabled escalation and did not — harmless only because this play
  # runs nothing but debug.
  vars:
    ansible_become: false
  tags:
    - summary

  tasks:
    - name: Display media validation summary
      ansible.builtin.debug:
        msg: |
          ============================================
          MEDIA STACK VALIDATION COMPLETE
          ============================================
          Prowlarr:     indexers present + enabled, applications synced, health, private-indexer freeleech/seed floors
          Radarr:       >=1 indexer synced, download client safety flags, media-management policy, root folder
          Sonarr:       >=1 indexer synced, download client safety flags, media-management policy, root folder
          qBittorrent:  DHT/PeX/LSD off, stop-never-delete, unlimited active
                        torrents/uploads, VPN-interface binding, narrow
                        auth-bypass whitelist
          FlareSolverr: reachable
          Plex:         configured libraries present at expected paths
          Seerr:        reachable, reports a version
          Sortarr:      reachable
          Consistency:  Sonarr/Radarr root folders match Plex library paths
          --------------------------------------------
          If all green, the pipeline is wired AND every safety invariant this
          stack relies on is still true. A title stuck at Missing/0B is then a
          CONTENT problem (no release exists on the configured trackers), not a
          wiring problem. Confirm with a known blockbuster:
            Radarr -> Add New -> Dune (2021) -> Search All.
          Run with --tags deep to actively test indexers against trackers
          (a failing live test on a healthy indexer points at the VPN exit IP).
          Scope to one app with e.g. --tags qbittorrent.
          ============================================

- name: Fail the run if any isolated play recorded a failure
  # Same end-of-run gate as site.yml (issue #672): every play above records
  # its own failures into site_isolated_failures instead of letting them abort
  # the rest of this playbook, so this final play is what makes the exit code
  # non-zero again when that happened.
  hosts: localhost
  gather_facts: false
  tags:
    - always

  tasks:
    - name: Surface isolated play failures
      vars:
        _all_isolated_failures: >-
          {{ groups['all'] | union(['localhost'])
             | map('extract', hostvars, 'site_isolated_failures')
             | select('defined') | flatten }}
      ansible.builtin.fail:
        msg: >-
          {{ _all_isolated_failures | length }} isolated play failure(s) —
          the rest of validate-media.yml still ran: {{ _all_isolated_failures | join('; ') }}
      when: _all_isolated_failures | length > 0
