---
# Media Stack Validation Playbook
# Answers one question: "is the *arr pipeline wired, or is it just bad inputs?"
# — and now also: "is every safety invariant we rely on (killswitch bypass
# scope, seed-forever-not-delete policy, DHT/PEX/LSD off) still true?"
#
# Every play below is READ-ONLY (GET, never POST/PUT/DELETE outside the
# opt-in --tags deep indexer test) and idempotent. It probes:
#   - Prowlarr (download_vpn_group): indexer presence/health, Application sync
#     level, and (once a private indexer exists) freeleech + seed-floor fields.
#   - Radarr / Sonarr: indexer sync, download-client safety flags, root-folder
#     accessibility + media-management settings.
#   - qBittorrent (download_vpn_group): the killswitch-adjacent safety
#     invariants — DHT/PEX/LSD off, stop-never-delete, unlimited active
#     torrents/uploads, alt speed == normal speed, VPN-interface binding,
#     narrow auth-bypass subnet.
#   - Plex / Seerr / Sortarr / FlareSolverr: reachable, reporting a version.
#   - Cross-app consistency: Sonarr/Radarr root folders MUST match Plex's
#     library paths — a single-app check misses this class of drift.
#
# One failing assertion must never mask the rest: every play below is wrapped
# in block/rescue -> tasks/record_isolated_failure.yml (issue #672 pattern,
# same as site.yml) so a failure on one host still lets every other play run,
# and the final "Fail the run" gate makes the exit code reflect the failure
# anyway. This suite reports a COMPLETE drift picture from one run.
#
# It reuses each role's own defaults/main.yml (vars_files) so expected values
# (ports, API keys, safety settings, root-folder paths) stay defined in ONE
# place — this playbook restates only what genuinely has no source (the
# private-indexer freeleech/seed floors; no private indexer is wired yet).
#
# Usage (API keys/passwords come from SOPS/Doppler env, same as the roles):
#   sops exec-env secrets.enc.yaml 'doppler run -- ansible-playbook \
#     -i inventory/hosts.yml playbooks/validate-media.yml'
#
# Scope to one app with --tags: prowlarr, radarr, sonarr, qbittorrent,
# flaresolverr, plex, seerr, sortarr, consistency. The `validation` tag covers
# all of them.
#
# Add --tags deep to actively test every Prowlarr indexer against its tracker
# (live calls through the VPN; slow). Without it, only presence/enabled is checked.

- name: Import OpenTofu infrastructure inventory
  import_playbook: ../inventory/load_tofu.yml

- name: Validate Prowlarr Indexers (download-vpn LXC)
  hosts: download_vpn_group
  become: false
  gather_facts: false
  tags:
    - prowlarr
    - validation

  # Pull the expected indexer list, deterministic API key, sync level, and
  # ports from the wiring role's defaults instead of redefining them here.
  vars_files:
    - ../roles/servarr_wiring/defaults/main.yml

  vars:
    # No existing source for these: no private indexer is wired today (see
    # servarr_wiring_prowlarr_indexers — all four are public), so nothing in
    # the repo defines a seed-floor policy yet. TRaSH-Guides-typical values;
    # tune here (only here) when the first private indexer is added.
    # ponytail: inline constants, not a new role var — nothing else consumes them.
    validate_media_private_min_seed_time_minutes: 2880
    validate_media_private_min_pack_seed_time_minutes: 4320
    validate_media_private_min_seed_ratio: 1.0

  tasks:
    - name: "Prowlarr validation (isolated — failure does not abort downstream plays)"
      block:
        - name: Verify PROWLARR_API_KEY is set
          ansible.builtin.assert:
            that:
              - servarr_wiring_prowlarr_api_key | length > 0
            fail_msg: >-
              PROWLARR_API_KEY is not set. Run with sops exec-env + doppler run
              so servarr_wiring's deterministic key is in the environment.
            quiet: true

        - name: Fetch Prowlarr system status
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ servarr_wiring_prowlarr_port }}/api/v1/system/status
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
            status_code: 200
          register: validate_media_prowlarr_status
          changed_when: false

        - name: Assert Prowlarr reports a version
          ansible.builtin.assert:
            that:
              - (validate_media_prowlarr_status.json.version | default('')) | length > 0
            fail_msg: "Prowlarr's /system/status did not report a version — API may be broken."
            quiet: true

        - name: Fetch Prowlarr indexers
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ servarr_wiring_prowlarr_port }}/api/v1/indexer
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
            status_code: 200
          register: validate_media_prowlarr_indexers
          changed_when: false

        - name: Assert each configured indexer is present and enabled
          ansible.builtin.assert:
            that:
              - >-
                (validate_media_prowlarr_indexers.json
                 | selectattr('name', 'equalto', item)
                 | list | length) > 0
              - >-
                (validate_media_prowlarr_indexers.json
                 | selectattr('name', 'equalto', item)
                 | selectattr('enable')
                 | list | length) > 0
            fail_msg: >-
              Indexer '{{ item }}' is missing or disabled in Prowlarr. It never
              synced to Radarr/Sonarr, so searches for real titles return nothing.
            quiet: true
          loop: "{{ servarr_wiring_prowlarr_indexers }}"

        # Safety invariant: private indexers must carry freeleech + seed-floor
        # settings so Prowlarr never pushes a ratio-risking config to the *arr
        # apps.
        #
        # These live as entries in the indexer's `fields` array, keyed by name
        # (e.g. "torrentBaseSettings.seedTime") — NOT as a nested
        # `torrentBaseSettings` object. Reading the nested path silently
        # produced the default on every indexer, so the check compared 0
        # against the floor: it could only ever fail, and only ever for the
        # wrong reason. Flatten the array to a mapping first, and assert
        # against that.
        - name: Flatten each indexer's fields into a name/value mapping
          ansible.builtin.set_fact:
            validate_media_private_indexers: >-
              {{ validate_media_prowlarr_indexers.json
                 | selectattr('privacy', 'defined')
                 | selectattr('privacy', 'equalto', 'private')
                 | map('combine', {}) | list }}
          no_log: true

        - name: Assert private indexers carry freeleech + seed-floor settings
          ansible.builtin.assert:
            that:
              - (_f['freeleech'] | default(false)) | bool
              - (_f['torrentBaseSettings.seedTime'] | default(0)) | int
                >= validate_media_private_min_seed_time_minutes
              - (_f['torrentBaseSettings.packSeedTime'] | default(0)) | int
                >= validate_media_private_min_pack_seed_time_minutes
              - (_f['torrentBaseSettings.seedRatio'] | default(0)) | float
                >= validate_media_private_min_seed_ratio
            fail_msg: >-
              Private indexer '{{ item.name }}' is missing freeleech or is
              below the configured seed floors — this risks a ratio ban on a
              private tracker.
            quiet: true
          vars:
            _f: >-
              {{ dict(item.fields | default([])
                      | map(attribute='name') | list
                      | zip(item.fields | default([])
                            | map(attribute='value', default='') | list)) }}
          loop: "{{ validate_media_private_indexers }}"
          loop_control:
            label: "{{ item.name }}"
          # An indexer's fields carry its credentials, and assert prints the
          # whole loop item on failure — which published the account password
          # into the run log the first time a private indexer existed. The
          # fail_msg above names the indexer, which is all the operator needs.
          no_log: true
          when: (item.privacy | default('public')) == 'private'

        - name: Fetch Prowlarr Applications (Sonarr/Radarr sync targets)
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ servarr_wiring_prowlarr_port }}/api/v1/applications
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
            status_code: 200
          register: validate_media_prowlarr_applications
          changed_when: false

        - name: Assert every Prowlarr application syncs at the configured level
          ansible.builtin.assert:
            that:
              - item.syncLevel == servarr_wiring_sync_level
            fail_msg: >-
              Prowlarr application '{{ item.name }}' has syncLevel
              '{{ item.syncLevel }}', not '{{ servarr_wiring_sync_level }}' —
              indexer changes here will not fully propagate to it.
            quiet: true
          loop: "{{ validate_media_prowlarr_applications.json }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Fetch Prowlarr health report
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ servarr_wiring_prowlarr_port }}/api/v1/health
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
            status_code: 200
          register: validate_media_prowlarr_health
          changed_when: false

        - name: Split Prowlarr health issues into error / non-error
          ansible.builtin.set_fact:
            validate_media_prowlarr_health_errors: >-
              {{ validate_media_prowlarr_health.json | selectattr('type', 'equalto', 'error') | list }}
            validate_media_prowlarr_health_other: >-
              {{ validate_media_prowlarr_health.json | rejectattr('type', 'equalto', 'error') | list }}

        - name: Assert Prowlarr reports no error-level health issues
          # "Update available" and similar are 'warning'/'notice' — surfaced in
          # the summary, never failed on. Only 'error' fails the suite.
          ansible.builtin.assert:
            that:
              - validate_media_prowlarr_health_errors | length == 0
            fail_msg: >-
              Prowlarr reports error-level health issues:
              {{ validate_media_prowlarr_health_errors | map(attribute='message') | list }}
            quiet: true

        # Active test: ask Prowlarr to hit every indexer's tracker live. Off by
        # default (the 'never' tag); opt in with --tags deep. This is the automated
        # equivalent of curling apibay through the tunnel — a failing test here on a
        # healthy indexer points at the VPN exit IP being throttled by the tracker.
        - name: Actively test every Prowlarr indexer against its tracker
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ servarr_wiring_prowlarr_port }}/api/v1/indexer/testall
            method: POST
            headers:
              X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
            status_code: [200, 201]
          register: validate_media_prowlarr_testall
          changed_when: false
          tags:
            - never
            - deep

        - name: Display Prowlarr validation results
          ansible.builtin.debug:
            msg: |
              Prowlarr {{ validate_media_prowlarr_status.json.version }} validation on {{ inventory_hostname }}:
              - Configured indexers present + enabled: {{ servarr_wiring_prowlarr_indexers | join(', ') }}
              - Total indexers in Prowlarr: {{ validate_media_prowlarr_indexers.json | length }}
              - Applications synced at '{{ servarr_wiring_sync_level }}':
                {{ validate_media_prowlarr_applications.json | map(attribute='name') | list }}
              - Health: {{ validate_media_prowlarr_health_errors | length }} error(s),
                {{ validate_media_prowlarr_health_other | length }} warning(s)/notice(s)
                {{ validate_media_prowlarr_health.json | map(attribute='message') | list }}
              - Active tracker test (deep only): {{
                  (validate_media_prowlarr_testall.json
                   | selectattr('isValid') | list | length
                   | string) + ' / '
                  + (validate_media_prowlarr_testall.json | length | string) + ' valid'
                  if validate_media_prowlarr_testall is defined
                  else 'skipped (add --tags deep)' }}
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-prowlarr

- name: Validate Radarr (indexer sync, download client safety, root folder)
  hosts: radarr_group
  become: false
  gather_facts: false
  tags:
    - radarr
    - validation

  vars_files:
    - ../roles/servarr_wiring/defaults/main.yml
    - ../roles/seerr/defaults/main.yml

  tasks:
    - name: "Radarr validation (isolated — failure does not abort downstream plays)"
      block:
        - name: Verify RADARR_API_KEY is set
          ansible.builtin.assert:
            that:
              - servarr_wiring_radarr_api_key | length > 0
            fail_msg: >-
              RADARR_API_KEY is not set. Run with sops exec-env + doppler run.
            quiet: true

        - name: Fetch Radarr system status
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/system/status"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_status
          changed_when: false

        - name: Assert Radarr reports a version
          ansible.builtin.assert:
            that:
              - (validate_media_radarr_status.json.version | default('')) | length > 0
            fail_msg: "Radarr's /system/status did not report a version — API may be broken."
            quiet: true

        - name: Fetch Radarr indexers (synced from Prowlarr)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/indexer"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_indexers
          changed_when: false

        - name: Assert at least one indexer is present in Radarr
          ansible.builtin.assert:
            that:
              - (validate_media_radarr_indexers.json | length) > 0
            fail_msg: >-
              Radarr has zero indexers. The Prowlarr -> Radarr Application sync did
              not push any — Radarr cannot search for any movie regardless of title.
            quiet: true

        - name: Fetch Radarr download clients
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/downloadclient"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_downloadclients
          changed_when: false

        - name: Assert at least one download client is present and enabled
          ansible.builtin.assert:
            that:
              - (validate_media_radarr_downloadclients.json | selectattr('enable') | list | length) > 0
            fail_msg: "Radarr has no enabled download client — nothing can ever download."
            quiet: true

        - name: Assert every Radarr download client never auto-deletes torrents
          ansible.builtin.assert:
            that:
              - item.removeCompletedDownloads == servarr_wiring_remove_completed_downloads
              - item.removeFailedDownloads == servarr_wiring_remove_failed_downloads
            fail_msg: >-
              Radarr download client '{{ item.name }}' has
              removeCompletedDownloads={{ item.removeCompletedDownloads }}/
              removeFailedDownloads={{ item.removeFailedDownloads }} — expected
              both false, so torrents keep seeding after import instead of
              qBittorrent deleting the data.
            quiet: true
          loop: "{{ validate_media_radarr_downloadclients.json }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Fetch Radarr media management settings
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/config/mediamanagement"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_mediamgmt
          changed_when: false

        - name: Assert Radarr media-management settings match servarr_wiring policy
          ansible.builtin.assert:
            that:
              - validate_media_radarr_mediamgmt.json.copyUsingHardlinks == true
              - validate_media_radarr_mediamgmt.json.recycleBin == servarr_wiring_recycler_bin_path
              - (validate_media_radarr_mediamgmt.json.minimumFreeSpaceWhenImporting | int)
                == (servarr_wiring_min_free_space_mb | int)
            fail_msg: >-
              Radarr media-management settings drifted from servarr_wiring's
              policy (hardlinks/recycle bin/min free space) — imports may copy
              instead of hardlink, or skip the recycle bin.
            quiet: true

        - name: Fetch Radarr root folder
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/rootfolder"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_rootfolder
          changed_when: false

        - name: Assert Radarr root folder is accessible and matches the expected path
          ansible.builtin.assert:
            that:
              - >-
                (validate_media_radarr_rootfolder.json
                 | selectattr('path', 'equalto', seerr_radarr_root_folder)
                 | selectattr('accessible') | list | length) > 0
            fail_msg: >-
              Radarr's root folder ({{ seerr_radarr_root_folder }}) is missing
              or inaccessible: {{ validate_media_radarr_rootfolder.json }}.
            quiet: true

        - name: Publish Radarr root folder path for cross-app consistency check
          ansible.builtin.set_fact:
            validate_media_radarr_rootfolder_path: "{{ seerr_radarr_root_folder }}"

        - name: Fetch Radarr queue (informational)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/queue"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_queue
          changed_when: false

        - name: Fetch Radarr health report
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_radarr_port }}/api/v3/health"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_radarr_api_key }}"
            status_code: 200
          register: validate_media_radarr_health
          changed_when: false

        - name: Split Radarr health issues into error / non-error
          ansible.builtin.set_fact:
            validate_media_radarr_health_errors: >-
              {{ validate_media_radarr_health.json | selectattr('type', 'equalto', 'error') | list }}
            validate_media_radarr_health_other: >-
              {{ validate_media_radarr_health.json | rejectattr('type', 'equalto', 'error') | list }}

        - name: Assert Radarr reports no error-level health issues
          ansible.builtin.assert:
            that:
              - validate_media_radarr_health_errors | length == 0
            fail_msg: >-
              Radarr reports error-level health issues:
              {{ validate_media_radarr_health_errors | map(attribute='message') | list }}
            quiet: true

        - name: Display Radarr validation results
          ansible.builtin.debug:
            msg: |
              Radarr {{ validate_media_radarr_status.json.version }} validation on {{ inventory_hostname }}:
              - Synced indexers: {{ validate_media_radarr_indexers.json | length }}
                ({{ validate_media_radarr_indexers.json | map(attribute='name') | list }})
              - Download clients (safe, none auto-delete):
                {{ validate_media_radarr_downloadclients.json | map(attribute='name') | list }}
              - Root folder accessible: {{ seerr_radarr_root_folder }}
              - Queue: {{ validate_media_radarr_queue.json.totalRecords | default('n/a') }} item(s)
              - Health: {{ validate_media_radarr_health_errors | length }} error(s),
                {{ validate_media_radarr_health_other | length }} warning(s)/notice(s)
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: validate-media-radarr

- name: Validate Sonarr (indexer sync, download client safety, root folder)
  hosts: sonarr_group
  become: false
  gather_facts: false
  tags:
    - sonarr
    - validation

  vars_files:
    - ../roles/servarr_wiring/defaults/main.yml
    - ../roles/seerr/defaults/main.yml

  tasks:
    - name: "Sonarr validation (isolated — failure does not abort downstream plays)"
      block:
        - name: Verify SONARR_API_KEY is set
          ansible.builtin.assert:
            that:
              - servarr_wiring_sonarr_api_key | length > 0
            fail_msg: >-
              SONARR_API_KEY is not set. Run with sops exec-env + doppler run.
            quiet: true

        - name: Fetch Sonarr system status
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ servarr_wiring_sonarr_port }}/api/v3/system/status"
            method: GET
            headers:
              X-Api-Key: "{{ servarr_wiring_sonarr_api_key }}"
            status_code: 200
          register: validate_media_sonarr_status
