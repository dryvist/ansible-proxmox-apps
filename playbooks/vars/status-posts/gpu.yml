---
# Local LLM utilization per serving lane, from the accelerator recording rules
# in the metrics store (roles/prometheus_stack). Each row expands to one line
# per lane (by: accelerator), averaged over 4 h.
status_post_title: Local LLM utilization, 4 h
status_post_rows:
  - component: lanes
    label: "tokens, 4 h:"
    query: '100 * avg_over_time(accelerator:token_utilization:ratio{accelerator!=""}[4h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 90
    yellow: 45
    sparkline: true
  - component: lanes
    label: "slot duty, 4 h:"
    query: '100 * avg_over_time(accelerator:slot_duty_cycle:ratio{accelerator!=""}[4h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 50
    yellow: 25
  - component: lanes
    label: "busy, 4 h:"
    query: 'avg_over_time(accelerator:busy_percent:avg5m{accelerator!=""}[4h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 50
    yellow: 25
  - component: lanes
    label: "prompt cache, 4 h:"
    query: '100 * avg_over_time(accelerator:prompt_cache_hit:ratio{accelerator!=""}[4h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 80
    yellow: 60
