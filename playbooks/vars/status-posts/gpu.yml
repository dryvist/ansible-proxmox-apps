---
# Local LLM utilization per serving lane, from the accelerator recording rules
# in the metrics store (roles/prometheus_stack). Each row expands to one line
# per lane (by: accelerator), averaged over 24 h.
status_post_title: Local LLM utilization, 24 h
status_post_rows:
  - component: lanes
    label: "tokens, 24 h:"
    query: '100 * avg_over_time(accelerator:token_utilization:ratio{accelerator!=""}[24h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 90
    yellow: 45
    sparkline: true
    dashboard: local-llm-scoreboard
  - component: lanes
    label: "slot duty, 24 h:"
    query: '100 * avg_over_time(accelerator:slot_duty_cycle:ratio{accelerator!=""}[24h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 50
    yellow: 25
    dashboard: local-llm-scoreboard
  - component: lanes
    label: "busy, 24 h:"
    query: 'avg_over_time(accelerator:busy_percent:avg5m{accelerator!=""}[24h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 50
    yellow: 25
    dashboard: local-llm-scoreboard
  - component: lanes
    label: "prompt cache, 24 h:"
    query: '100 * avg_over_time(accelerator:prompt_cache_hit:ratio{accelerator!=""}[24h])'
    by: accelerator
    unit: "%"
    decimals: 0
    green: 80
    yellow: 60
    dashboard: local-llm-scoreboard
