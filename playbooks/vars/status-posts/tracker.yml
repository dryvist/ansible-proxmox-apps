---
# Hourly tracker status: Vikunja task and Zammad ticket load from the
# tracker collectors (roles/prometheus_stack, *.collector.yml.j2).
# Thresholds are provisional until the tracker owners set service targets.
status_post_title: Tracker status
status_post_rows:
  - component: Vikunja
    label: "open tasks:"
    query: sum(vikunja_open_tasks)
    green: 4000
    yellow: 5500
    higher_is_better: false
    sparkline: true
  - component: Vikunja
    label: "open over 90 days:"
    query: 'sum(vikunja_open_tasks_by_age{age="gt_90d"})'
    green: 400
    yellow: 800
    higher_is_better: false
  - component: Vikunja
    label: "created in 24 h:"
    query: sum(vikunja_tasks_created_24h)
    green: 100
    yellow: 300
    higher_is_better: false
  - component: Vikunja
    label: "done in 24 h:"
    query: sum(vikunja_tasks_done_24h)
    green: 50
    yellow: 10
    sparkline: true
  - component: Zammad
    label: "open tickets:"
    query: sum(zammad_open_tickets)
    green: 500
    yellow: 800
    higher_is_better: false
    sparkline: true
  - component: Zammad
    label: "open over 7 days:"
    query: 'sum(zammad_open_tickets_by_age{age=~"7d_30d|30d_90d|gt_90d"})'
    green: 300
    yellow: 600
    higher_is_better: false
  - component: Zammad
    label: "closed in 24 h:"
    query: sum(zammad_tickets_closed_24h)
    green: 50
    yellow: 10
    sparkline: true
