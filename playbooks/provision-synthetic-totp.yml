---
# One-time provisioning: seed the svc-synthetic-ui TOTP secret into BOTH
# Authelia's storage backend and OpenBao's TOTP secrets engine, from a single
# seed generated here and never written to disk or OpenBao's KV store.
#
#   BAO_ADDR=... BAO_TOKEN=... ansible-playbook playbooks/provision-synthetic-totp.yml
#
# BAO_TOKEN must be a privileged token able to enable the totp/ secrets
# engine and write totp/keys/<user> — the same bootstrap-class access the
# openbao role's own init tasks use for a first-time engine mount (see
# roles/openbao/tasks/init/07-ssh-ca-engine.yml). There is no dedicated
# identity for this one-time step; ui-synthetic (GitHub Actions OIDC role,
# roles/openbao/tasks/init/09c-github-oidc.yml +
# roles/openbao/templates/ui-synthetic-policy.hcl.j2) is deliberately
# read-only on totp/code/svc-synthetic-ui only and cannot perform it.
#
# Idempotent: if OpenBao already holds the key, this is a no-op (Authelia's
# own side is trusted to already match it — see the residual note below).
# If OpenBao holds no key, this seeds a fresh one on both sides. If OpenBao
# holds no key but Authelia's storage already has a configuration (Authelia's
# own `generate` command refuses without --force), that is a half-seeded pair
# and this play FAILS LOUDLY rather than guessing which side is correct.
#
# Residual (documented ceiling, not fixed here): Authelia's CLI has no
# non-mutating way to check whether a user's TOTP configuration exists
# without exposing the secret (`storage user totp export` dumps every
# config's raw secret to a file) or risking overwriting one (`generate`
# without --force refuses safely, but only when attempted). So the one
# mismatch direction this play cannot detect is OpenBao already holding the
# key while Authelia's storage was independently reset — that needs a manual
# check before re-running. Re-seeding this playbook on its own does NOT
# rotate; rotation is a deliberate operator action (delete both sides first).
- name: Provision the synthetic UI TOTP secret (Authelia + OpenBao)
  hosts: authelia_group
  gather_facts: false
  vars:
    totp_user: svc-synthetic-ui
    totp_algorithm: SHA1
    totp_digits: 6
    totp_period: 30
    totp_bao_addr: "{{ lookup('ansible.builtin.env', 'BAO_ADDR') }}"
    totp_bao_token: "{{ lookup('ansible.builtin.env', 'BAO_TOKEN') }}"
    # Overridable so a test can point it at a stub CLI without touching PATH.
    totp_bao_cmd: bao
  tasks:
    # authelia_binary_path / authelia_config_file are authelia role defaults;
    # this playbook has no roles: stanza, so they are loaded explicitly —
    # same idiom as rotate-key.yml's include_vars for a single defaults file.
    - name: Load the Authelia role's core defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/authelia/defaults/main/00-core.yml"

    - name: Load the ui-synthetic identity's mount-name defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/openbao/defaults/main/05f-ui-synthetic.yml"

    - name: Refuse to run without OpenBao coordinates
      ansible.builtin.assert:
        that:
          - totp_bao_addr | length > 0
          - totp_bao_token | length > 0
          - (groups['openbao_group'] | default([])) | length > 0
        fail_msg: >-
          Needs BAO_ADDR and BAO_TOKEN in the environment (a privileged
          token — see this file's header) and an openbao_group host in
          inventory.
        quiet: true

    - name: Check whether OpenBao's TOTP engine is mounted
      ansible.builtin.command:
        cmd: "{{ totp_bao_cmd }} secrets list -format=json"
      environment:
        BAO_ADDR: "{{ totp_bao_addr }}"
        BAO_TOKEN: "{{ totp_bao_token }}"
      delegate_to: "{{ groups['openbao_group'][0] }}"
      register: totp_mounts
      changed_when: false

    - name: Enable the TOTP secrets engine
      ansible.builtin.command:
        cmd: "{{ totp_bao_cmd }} secrets enable -path={{ openbao_totp_mount }} totp"
      environment:
        BAO_ADDR: "{{ totp_bao_addr }}"
        BAO_TOKEN: "{{ totp_bao_token }}"
      delegate_to: "{{ groups['openbao_group'][0] }}"
      changed_when: true
      when: (openbao_totp_mount ~ '/') not in (totp_mounts.stdout | from_json).keys()

    - name: Check whether OpenBao already holds this user's TOTP key
      ansible.builtin.command:
        cmd: "{{ totp_bao_cmd }} read -format=json {{ openbao_totp_mount }}/keys/{{ totp_user }}"
      environment:
        BAO_ADDR: "{{ totp_bao_addr }}"
        BAO_TOKEN: "{{ totp_bao_token }}"
      delegate_to: "{{ groups['openbao_group'][0] }}"
      register: totp_bao_check
      changed_when: false
      failed_when: false

    - name: Generate a candidate seed (used only if OpenBao has no key yet)
      ansible.builtin.set_fact:
        totp_candidate_seed: >-
          {{ lookup('community.general.random_string', length=32, upper=true,
             numbers=true, special=false) }}
      no_log: true
      when: (totp_bao_check.rc | default(1)) != 0

    - name: Attempt to seed Authelia's TOTP configuration (fails harmlessly if it already exists)
      ansible.builtin.command:
        argv: >-
          {{ [authelia_binary_path, 'storage', 'user', 'totp', 'generate', totp_user,
              '--config', authelia_config_file, '--secret', totp_candidate_seed,
              '--algorithm', totp_algorithm, '--digits', totp_digits | string,
              '--period', totp_period | string] }}
      register: totp_authelia_generate
      changed_when: totp_authelia_generate.rc == 0
      failed_when: >-
        totp_authelia_generate.rc != 0
        and 'already has a TOTP configuration' not in (totp_authelia_generate.stderr | default(''))
      no_log: true
      when: (totp_bao_check.rc | default(1)) != 0

    - name: Fail loudly when OpenBao has no key but Authelia already does (half-seeded pair)
      ansible.builtin.assert:
        that:
          - totp_authelia_generate.rc == 0
        fail_msg: >-
          OpenBao holds no TOTP key for {{ totp_user }}, but Authelia's storage
          already has a configuration for it (its own `generate` refused
          without --force). This is a half-seeded pair from a prior partial
          run or a manual change — resolve it by hand (delete one side, then
          re-run this play) rather than having it guess which value is live.
        quiet: true
      when: (totp_bao_check.rc | default(1)) != 0

    - name: Import the freshly seeded secret into OpenBao's TOTP engine
      ansible.builtin.command:
        argv:
          - "{{ totp_bao_cmd }}"
          - write
          - "{{ openbao_totp_mount }}/keys/{{ totp_user }}"
          - generate=false
          - "key={{ totp_candidate_seed }}"
          - "algorithm={{ totp_algorithm }}"
          - "digits={{ totp_digits }}"
          - "period={{ totp_period }}"
      environment:
        BAO_ADDR: "{{ totp_bao_addr }}"
        BAO_TOKEN: "{{ totp_bao_token }}"
      delegate_to: "{{ groups['openbao_group'][0] }}"
      changed_when: true
      no_log: true
      when: (totp_bao_check.rc | default(1)) != 0

    - name: Say what happened
      ansible.builtin.debug:
        msg: >-
          {{ totp_user }}'s TOTP secret is seeded on both sides (or already
          was — no change made this run). Nothing here stores the seed after
          this play exits; _ui-live.yml reads codes through the ui-synthetic
          GitHub Actions OIDC role (read-only on totp/code/{{ totp_user }}).
