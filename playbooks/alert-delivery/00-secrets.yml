---
- name: Load alert delivery secrets
  hosts: ntfy_group:n8n_group:postgres_ai_group
  gather_facts: false
  become: false
  vars_files:
    - vars.yml
  tasks:
    - name: Fetch configured delivery domains
      when: alert_delivery_enabled | bool
      block:
        - name: Load the resource-domain declarations
          ansible.builtin.include_vars:
            file: ../../roles/openbao_secrets/defaults/main/01-domains.yml
            name: alert_delivery_secret_defaults

        - name: Fetch app and Slack bot credentials
          ansible.builtin.include_role:
            name: openbao_secrets
          vars:
            openbao_secrets_domains: >-
              {{ (alert_delivery_secret_defaults.openbao_secrets_domains
                  | selectattr('name', 'equalto', 'apps') | list)
                 + [{'name': 'slack-ops', 'paths':
                     [{'mount': 'secrets-external', 'path': 'platform/slack-ops'}]}] }}
            openbao_secrets_domain_groups: {}

        - name: Publish runtime credential inputs
          ansible.builtin.set_fact:
            bao_apps_secrets: "{{ hostvars['localhost'].openbao_secrets_by_domain['apps'] | default({}) }}"
            bao_slack_ops_secrets: "{{ hostvars['localhost'].openbao_secrets_by_domain['slack-ops'] | default({}) }}"
          no_log: true
