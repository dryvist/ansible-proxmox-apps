---
- name: Provision independent delivery databases
  hosts: postgres_ai_group
  become: true
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Converge the delivery database cluster
      when: alert_delivery_enabled | bool
      block:
        - name: Gather database host facts
          ansible.builtin.include_tasks: ../tasks/gather.yml

        - name: Provision managed delivery databases
          ansible.builtin.include_role:
            name: postgres
