---
- name: Deploy incident workers
  hosts: n8n_group
  become: true
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: Converge incident delivery
      when: alert_delivery_enabled | bool
      block:
        - name: Prepare incident workflows
          ansible.builtin.include_role:
            name: alert_delivery
          vars:
            alert_delivery_mode: incident

        - name: Deploy workflows on the existing n8n instance
          ansible.builtin.include_role:
            name: n8n_docker
          vars:
            n8n_docker_managed_credentials: "{{ alert_delivery_incident_credentials }}"
            n8n_docker_managed_workflows: "{{ alert_delivery_managed_workflows }}"
