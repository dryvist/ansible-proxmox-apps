---
# Shared steps of playbooks/upgrade.yml: end the hosts this upgrade does not
# own (non-Debian and NVIDIA-driver guests), then apply the Debian distribution
# upgrade.
- name: Gather minimal guest facts
  ansible.builtin.setup:
    gather_subset:
      - min

# NixOS and other non-Debian guests have their own update path.
- name: End the host on non-Debian guests
  ansible.builtin.meta: end_host
  when: ansible_facts.os_family != 'Debian'

- name: Check for an NVIDIA driver
  ansible.builtin.stat:
    path: /proc/driver/nvidia/version
  register: guest_os_upgrade_nvidia_driver

# GPU-driver guests are upgraded by the AI serving and benchmark flow.
- name: End the host on NVIDIA driver guests
  ansible.builtin.meta: end_host
  when: guest_os_upgrade_nvidia_driver.stat.exists

- name: Wait for package locks and recover incomplete dpkg state
  ansible.builtin.import_role:
    name: apt_recovery

- name: Apply Debian distribution upgrades
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
  async: 1800
  poll: 0
  register: guest_os_upgrade_job
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Wait for Debian distribution upgrades
  ansible.builtin.async_status:
    jid: "{{ guest_os_upgrade_job.ansible_job_id }}"
  register: guest_os_upgrade_status
  until: guest_os_upgrade_status.finished
  retries: 180
  delay: 10
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: guest_os_upgrade_reboot_required
