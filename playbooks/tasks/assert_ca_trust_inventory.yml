---
- name: Select active CA-trust contract VMs
  ansible.builtin.set_fact:
    ca_trust_contract_vms: >-
      {{ (tofu_data.vms | default({}) | dict2items)
         if (converge_stopped_vms | default(false) | bool)
         else (tofu_data.vms | default({}) | dict2items
               | rejectattr('value.started', 'defined') | list
               + (tofu_data.vms | default({}) | dict2items
                  | selectattr('value.started', 'defined')
                  | rejectattr('value.started', 'equalto', false) | list)) }}
    ca_trust_contract_docker_vms: >-
      {{ (tofu_data.docker_vms | default({}) | dict2items)
         if (converge_stopped_vms | default(false) | bool)
         else (tofu_data.docker_vms | default({}) | dict2items
               | rejectattr('value.started', 'defined') | list
               + (tofu_data.docker_vms | default({}) | dict2items
                  | selectattr('value.started', 'defined')
                  | rejectattr('value.started', 'equalto', false) | list)) }}
    ca_trust_resolved_hosts: >-
      {{ ((groups['vms'] | default([]))
          + (groups['splunk_vms'] | default([]))
          + (groups['docker_vms'] | default([]))) | unique | list }}
  changed_when: false

- name: Build the deduplicated CA-trust host contract
  ansible.builtin.set_fact:
    ca_trust_expected_hosts: >-
      {{ ((ca_trust_contract_vms | map(attribute='key') | list)
          + (tofu_data.splunk_vm | default({}) | dict2items
             | map(attribute='key') | list)
          + (ca_trust_contract_docker_vms | map(attribute='key') | list))
         | unique | list }}
  changed_when: false

- name: Assert every active contract VM belongs to the CA-trust host groups
  ansible.builtin.assert:
    that:
      - ca_trust_expected_hosts | difference(ca_trust_resolved_hosts) | length == 0
    fail_msg: >-
      The CA-trust inventory is missing active VM entries from its contract:
      {{ ca_trust_expected_hosts | difference(ca_trust_resolved_hosts) | join(', ') }}.
