---
# Reads the Nautobot credentials a collection flow needs and fails before any
# role runs when one is empty. The application fields (Nautobot URL and the
# Proxmox credentials) come from the shared apps domain facts. This file fetches
# that domain itself, because the collection playbooks run on localhost with no
# pre-fetch. The read credential (the role-minted inventory_ro_token in
# apps/nautobot) and the write credential under apps/nautobot/sync-write
# still come from the run's own token. Secret paths and
# fields are declared once in inventory/group_vars/nautobot_group.yml.
#
# Inputs: nautobot_collection_write_required (bool, default false),
#         nautobot_collection_pve_required (bool, default false).
# Sets:   nautobot_collection_read_token, nautobot_collection_nautobot_url,
#         and, when required, nautobot_collection_write_token and the
#         nautobot_collection_pve_* credentials.
- name: Load the shared OpenBao domain-to-group map
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/site/vars/openbao_secrets_domain_groups.yml"

- name: Fetch the OpenBao apps domain for Nautobot
  ansible.builtin.include_role:
    name: dryvist.secrets_management.openbao_secrets
  vars:
    openbao_secrets_active_groups:
      - nautobot_group

- name: Publish the shared secret-domain facts
  ansible.builtin.import_tasks: publish_secret_domain_facts.yml

- name: Read the Nautobot read credential
  community.hashi_vault.vault_kv2_get:
    url: "{{ lookup('env', 'BAO_ADDR') }}"
    auth_method: token
    token: "{{ lookup('env', 'BAO_TOKEN') | default(lookup('env', 'VAULT_TOKEN'), true) }}"
    engine_mount_point: secret
    path: "{{ nautobot_collection_read_token_secret.path }}"
  register: nautobot_collection_read_credential
  no_log: true

- name: Read the Nautobot write credential
  community.hashi_vault.vault_kv2_get:
    url: "{{ lookup('env', 'BAO_ADDR') }}"
    auth_method: token
    token: "{{ lookup('env', 'BAO_TOKEN') | default(lookup('env', 'VAULT_TOKEN'), true) }}"
    engine_mount_point: secret
    path: "{{ nautobot_collection_write_token_secret.path }}"
  register: nautobot_collection_write_credential
  no_log: true
  when: nautobot_collection_write_required | default(false) | bool

- name: Collect the credentials in one place
  ansible.builtin.set_fact:
    nautobot_collection_read_token: >-
      {{ nautobot_collection_read_values[nautobot_collection_read_token_secret.field] | default('', true) }}
    nautobot_collection_nautobot_url: >-
      {{ bao_apps_secrets[nautobot_collection_app_secret.fields.nautobot_url] | default('', true) }}
    nautobot_collection_write_token: >-
      {{ nautobot_collection_write_values[nautobot_collection_write_token_secret.field] | default('', true)
         if nautobot_collection_write_required | default(false) | bool else 'unused' }}
    nautobot_collection_pve_token_id: >-
      {{ bao_apps_secrets[nautobot_collection_app_secret.fields.pve_token_id] | default('', true)
         if nautobot_collection_pve_required | default(false) | bool else 'unused' }}
    nautobot_collection_pve_token_secret: >-
      {{ bao_apps_secrets[nautobot_collection_app_secret.fields.pve_token_secret] | default('', true)
         if nautobot_collection_pve_required | default(false) | bool else 'unused' }}
    nautobot_collection_pve_ca: >-
      {{ bao_apps_secrets[nautobot_collection_app_secret.fields.pve_ca] | default('', true)
         if nautobot_collection_pve_required | default(false) | bool else 'unused' }}
  vars:
    nautobot_collection_read_values: "{{ nautobot_collection_read_credential.secret }}"
    nautobot_collection_write_values: "{{ nautobot_collection_write_credential.secret | default({}) }}"
  no_log: true

- name: Name every empty credential
  ansible.builtin.set_fact:
    nautobot_collection_empty_credentials: >-
      {{ {
           'read_token': nautobot_collection_read_token,
           'nautobot_url': nautobot_collection_nautobot_url,
           'write_token': nautobot_collection_write_token,
           'pve_token_id': nautobot_collection_pve_token_id,
           'pve_token_secret': nautobot_collection_pve_token_secret,
           'pve_ca': nautobot_collection_pve_ca,
         } | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}

- name: Require every needed credential to be non-empty
  ansible.builtin.assert:
    that: nautobot_collection_empty_credentials | length == 0
    fail_msg: "Empty Nautobot collection credentials: {{ nautobot_collection_empty_credentials | join(', ') }}"
