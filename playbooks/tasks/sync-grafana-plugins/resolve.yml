---
- name: Resolve plugin metadata from the Grafana API on the controller
  ansible.builtin.uri:
    url: >-
      {{ grafana_plugins_api }}/{{ item.name }}{{
      '/versions/' ~ item.pin_version if item.pin_version | default('') | length > 0 else '' }}
    method: GET
    return_content: true
    status_code: 200
    timeout: 30
  loop: "{{ grafana_stack_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  register: grafana_plugins_metadata
  changed_when: false

- name: Require resolved versions and matching pin overrides
  ansible.builtin.assert:
    that:
      - item.json.version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - item.item.pin_version | default(item.json.version, true) == item.json.version
    fail_msg: "Invalid catalog version for {{ item.item.name }}; keeping the existing mirror."
  loop: "{{ grafana_plugins_metadata.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Initialize the desired Grafana plugin artifacts
  ansible.builtin.set_fact:
    grafana_plugins_desired: []

- name: Select linux amd64 plugin archives
  ansible.builtin.set_fact:
    grafana_plugins_desired: >-
      {{ grafana_plugins_desired + [{
        'name': item.item.name,
        'desired_version': item.json.version,
        'asset_url': grafana_plugins_api ~ '/' ~ item.item.name ~ '/versions/'
          ~ item.json.version ~ '/download?os=linux&arch=amd64'
      }] }}
  loop: "{{ grafana_plugins_metadata.results }}"
  loop_control:
    label: "{{ item.item.name }}"
