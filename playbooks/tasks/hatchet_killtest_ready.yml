---
# Polls Hatchet /ready on each listed guest. Each poll is its own include, so the
# first failed poll fails the host and stops the remaining polls.
- name: Poll Hatchet /ready, count {{ hatchet_killtest_ready_polls }}
  ansible.builtin.include_tasks: hatchet_killtest_ready_poll.yml
  loop: "{{ range(hatchet_killtest_ready_polls | int) | list }}"
  loop_control:
    loop_var: hatchet_killtest_poll
