---
# One power action (the stop) on the kill-test target. PVE lets a token read its own
# tasks, so the UPID is polled until stopped with exitstatus OK, within 60 s.
- name: "Send the power action to the target guest: {{ hatchet_killtest_action }}"
  ansible.builtin.uri:
    url: "{{ hatchet_killtest_guest_api }}/status/{{ hatchet_killtest_action }}"
    method: POST
    headers:
      Authorization: "{{ hatchet_killtest_auth }}"
    unredirected_headers: [Authorization]
    follow_redirects: none
    ca_path: "{{ hatchet_killtest_ca.path }}"
    status_code: 200
  register: hatchet_killtest_power
  no_log: true

- name: Record the UPID of {{ hatchet_killtest_action }}
  ansible.builtin.set_fact:
    hatchet_killtest_upids: >-
      {{ hatchet_killtest_upids | default({})
         | combine({hatchet_killtest_action: hatchet_killtest_power.json.data}) }}

- name: "Require the power task to finish OK within 60 seconds: {{ hatchet_killtest_action }}"
  ansible.builtin.uri:
    url: >-
      {{ hatchet_killtest_api }}/nodes/{{ hatchet_killtest_node }}/tasks/{{
      hatchet_killtest_upids[hatchet_killtest_action] | urlencode }}/status
    headers:
      Authorization: "{{ hatchet_killtest_auth }}"
    unredirected_headers: [Authorization]
    follow_redirects: none
    ca_path: "{{ hatchet_killtest_ca.path }}"
  register: hatchet_killtest_task
  until: (hatchet_killtest_task.json.data.status | default('')) == 'stopped'
  retries: 12
  delay: 5
  failed_when: >-
    (hatchet_killtest_task.json.data.status | default('')) != 'stopped'
    or (hatchet_killtest_task.json.data.exitstatus | default('')) != 'OK'
  no_log: true
