---
# One power action (the stop) on the kill-test target. PVE lets a token read its own
# tasks, so the UPID is polled until stopped with exitstatus OK, within 51 s.
- name: Send stop to the target guest
  ansible.builtin.uri:
    url: "{{ hatchet_killtest_guest_api }}/status/stop"
    method: POST
    headers:
      Authorization: "{{ hatchet_killtest_auth }}"
    unredirected_headers: [Authorization]
    follow_redirects: none
    ca_path: "{{ hatchet_killtest_ca.path }}"
    status_code: 200
    timeout: 5
  register: hatchet_killtest_power
  no_log: true

- name: Record the UPID of stop
  ansible.builtin.set_fact:
    hatchet_killtest_upids: >-
      {{ hatchet_killtest_upids | default({})
         | combine({'stop': hatchet_killtest_power.json.data}) }}

- name: Require the stop task to finish OK within 60 seconds
  ansible.builtin.uri:
    url: >-
      {{ hatchet_killtest_api }}/nodes/{{ hatchet_killtest_node }}/tasks/{{
      hatchet_killtest_upids['stop'] | urlencode }}/status
    headers:
      Authorization: "{{ hatchet_killtest_auth }}"
    unredirected_headers: [Authorization]
    follow_redirects: none
    ca_path: "{{ hatchet_killtest_ca.path }}"
    timeout: 3
  register: hatchet_killtest_task
  until: >-
    (hatchet_killtest_task.json.data.status | default('')) == 'stopped'
    or now(utc=True).timestamp()
    >= (hatchet_killtest_deadline_epoch | float - hatchet_killtest_recovery_reserve | float - 3)
  retries: 7
  delay: 3
  failed_when: false
  when: >-
    now(utc=True).timestamp()
    < (hatchet_killtest_deadline_epoch | float - hatchet_killtest_recovery_reserve | float - 3)
  no_log: true

- name: Require the stop task to finish OK before the recovery cutoff
  ansible.builtin.assert:
    that:
      - (hatchet_killtest_task.json.data.status | default('')) == 'stopped'
      - (hatchet_killtest_task.json.data.exitstatus | default('')) == 'OK'
      - >-
        now(utc=True).timestamp()
        < (hatchet_killtest_deadline_epoch | float - hatchet_killtest_recovery_reserve | float)
    fail_msg: The stop task did not finish OK before the recovery cutoff.
    quiet: true
