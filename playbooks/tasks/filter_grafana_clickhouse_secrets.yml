---
# KV reads return an entire document. Keep only the reader field for a
# Grafana-only fetch; database consumers still need the full domain.
- name: Keep only the Grafana reader field when no database consumer is in scope
  ansible.builtin.set_fact:
    openbao_secrets_by_domain: >-
      {{ hostvars['localhost'].openbao_secrets_by_domain | combine({'clickhouse':
           (hostvars['localhost'].openbao_secrets_by_domain['clickhouse'] | default({})
            | dict2items | selectattr('key', 'equalto', 'GRAFANA_PASSWORD') | items2dict)}) }}
  when:
    - "'grafana_group' in openbao_secrets_domain_groups_source['clickhouse']"
    - >-
      openbao_secrets_active_groups
      | intersect(openbao_secrets_domain_groups_source['clickhouse'] | difference(['grafana_group']))
      | length == 0
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  no_log: true
