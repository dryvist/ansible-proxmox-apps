---
# The full domain belongs to the database consumers. Grafana needs one KV
# document only, and must not trigger any ClickHouse read while disabled.
- name: Add enabled in-scope Grafana readers to the ClickHouse consumers
  ansible.builtin.set_fact:
    openbao_secrets_domain_groups_source: >-
      {{ openbao_secrets_domain_groups_source
         | combine({'clickhouse': (openbao_secrets_domain_groups_source['clickhouse']
                                  + ['grafana_group']) | unique | list}) }}
    openbao_secrets_catalog: >-
      {{ openbao_secrets_catalog | combine({'openbao_secrets_domains':
           (openbao_secrets_catalog.openbao_secrets_domains
            | rejectattr('name', 'equalto', 'clickhouse') | list)
           + [_clickhouse_domain | combine({'paths': ['ai/clickhouse']}
                if not _full_clickhouse_consumer else {})]}) }}
  vars:
    _clickhouse_domain: >-
      {{ openbao_secrets_catalog.openbao_secrets_domains
         | selectattr('name', 'equalto', 'clickhouse') | first }}
    _full_clickhouse_consumer: >-
      {{ openbao_secrets_active_groups
         | intersect(openbao_secrets_domain_groups_source['clickhouse'] | difference(['grafana_group']))
         | length > 0 }}
  loop: "{{ groups.get('grafana_group', []) | intersect(ansible_play_hosts_all) }}"
  when: hostvars[item].grafana_stack_clickhouse_enabled | default(false) | bool
