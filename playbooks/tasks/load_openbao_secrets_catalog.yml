---
# Loads the OpenBao resource-domain catalog from the pinned dryvist.secrets_management
# collection into openbao_secrets_catalog. Pass its openbao_secrets_domains to
# dryvist.homelab.openbao_secrets: the role's own default catalog is a different list.
- name: Load the OpenBao domain catalog from the installed secrets collection
  ansible.builtin.include_vars:
    file: >-
      {{ lookup('ansible.builtin.first_found',
                files=['ansible_collections/dryvist/secrets_management/playbooks/group_vars/all/openbao_secrets.yml'],
                paths=lookup('ansible.builtin.config', 'COLLECTIONS_PATHS')) }}
    name: openbao_secrets_catalog
