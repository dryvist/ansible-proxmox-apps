---
# One bounded start attempt on the kill-test target, skipped once an earlier
# attempt succeeded. Nothing here fails the run: the attempt records
# hatchet_killtest_started, true when the start task ends OK or PVE reports the
# guest already running, and the caller asserts it after the last attempt.
- name: "Start attempt {{ hatchet_killtest_attempt }}"
  when: not (hatchet_killtest_started | bool)
  block:
    - name: "Send start to the target guest, attempt {{ hatchet_killtest_attempt }}"
      ansible.builtin.uri:
        url: "{{ hatchet_killtest_guest_api }}/status/start"
        method: POST
        headers:
          Authorization: "{{ hatchet_killtest_auth }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
        ca_path: "{{ hatchet_killtest_ca.path }}"
        status_code: 200
      register: hatchet_killtest_start_post
      failed_when: false
      no_log: true

    - name: "Poll the start task, attempt {{ hatchet_killtest_attempt }}"
      ansible.builtin.uri:
        url: >-
          {{ hatchet_killtest_api }}/nodes/{{ hatchet_killtest_node }}/tasks/{{
          hatchet_killtest_start_post.json.data | urlencode }}/status
        headers:
          Authorization: "{{ hatchet_killtest_auth }}"
        unredirected_headers: [Authorization]
        follow_redirects: none
        ca_path: "{{ hatchet_killtest_ca.path }}"
      register: hatchet_killtest_start_task
      until: (hatchet_killtest_start_task.json.data.status | default('')) == 'stopped'
      retries: 12
      delay: 5
      failed_when: false
      when: (hatchet_killtest_start_post.status | default(0)) == 200
      no_log: true

    - name: "Record start attempt {{ hatchet_killtest_attempt }}"
      vars:
        _task: "{{ (hatchet_killtest_start_task.json | default({})).data | default({}) }}"
      ansible.builtin.set_fact:
        hatchet_killtest_started: >-
          {{ (_task.status | default('')) == 'stopped'
             and ((_task.exitstatus | default('')) == 'OK'
                  or 'already running' in (_task.exitstatus | default(''))) }}
        hatchet_killtest_upids: >-
          {{ hatchet_killtest_upids | default({})
             | combine({'start_' ~ hatchet_killtest_attempt:
                        (hatchet_killtest_start_post.json | default({})).data | default('')}) }}
