---
# Fleet entrypoint. Every play that used to live inline here now lives under
# site/, imported below in the EXACT order they ran before the split — order
# is load-bearing: a play that fails for 100% of its hosts aborts every
# remaining play in the SAME ansible-playbook process (site_isolated_failures
# is how independent leaf-app plays avoid that; see
# tasks/record_isolated_failure.yml), and several plays depend on state a
# prior phase left behind (DNS before anything that resolves a hostname,
# Postgres before Nautobot/Zammad/Vikunja, Authelia before Traefik, etc — see
# each file's own phase-comment banners for the specific dependency).
#
# `--tags`/`--limit` from any caller of this file work exactly as before:
# import_playbook does not filter or rename tags, hosts, or play names — it
# only relocates where the play text lives. Splitting further inside a file
# (e.g. one apt_cacher_ng play plus its apt-proxy sibling in 01-) never
# crosses a file boundary that would change --tags matching.
- name: Load infrastructure inventory, publish telemetry, pre-fetch secrets
  import_playbook: site/00-load-and-telemetry.yml

- name: Baseline infra — apt cache, registry mirror, NTP, SSH CA, syslog, storage
  import_playbook: site/01-baseline-infra.yml

- name: DNS and the syslog/netflow pipeline (Technitium, Cribl, HAProxy, netmon)
  import_playbook: site/02-dns-and-pipeline.yml

- name: Notifications and core apps (mailpit, ntfy, healthchecks, postgres, ...)
  import_playbook: site/03-notifications-and-core-apps.yml

- name: OpenBao, collaboration apps, SSO, and ingress (Authelia, Traefik, ...)
  import_playbook: site/04-secrets-and-collab-apps.yml

- name: Converge the media stack and gate the run on isolated-play failures
  import_playbook: site/05-media-and-gate.yml
