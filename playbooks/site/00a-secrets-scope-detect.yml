---
# =============================================================================
# Phase 0-secrets-scope: detect out-of-play OpenBao domain consumers
# Two consumers of the domains fetched by the pre-fetch play in
# 00-load-and-telemetry.yml are never hosts of that play itself (by design —
# see the comment on the monitoring republish play at the bottom of that
# file): the servarr child converge (bao_media_secrets plus the monitoring
# domain's GATUS_EXTERNAL_TOKEN, forwarded as env by
# playbooks/site/05-media-and-gate.yml) and the deadman watchdog group set
# (bao_monitoring_secrets, republished there). A third detector records
# whether the pre-fetch play's normal managed_secrets_group is in scope. If
# it is not, the pre-fetch play adds localhost to its hosts pattern; the
# runner already adds localhost to a scoped --limit. The fetch still runs
# once on the controller, and no media or watchdog host joins that play.
# Because the two consumers are outside the normal `hosts:` pattern, whether
# --limit selected any of their hosts can't be read from that play's own
# ansible_play_hosts_all — so, same as playbooks/site/05-media-and-gate.yml's
# own `_media_in_scope`, a detector play whose `hosts:` IS the group in
# question records the scope via localhost facts.
#
# Split into its own file (imported by 00-load-and-telemetry.yml) to keep
# that file under its token budget — see .token-limits.yaml.
# =============================================================================

- name: Detect whether this run's --limit includes a managed secrets host
  hosts: managed_secrets_group
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record that a managed secrets host is in scope
      ansible.builtin.set_fact:
        openbao_secrets_managed_group_in_scope: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true

- name: Detect whether this run's --limit includes a media-stack host
  hosts: media_group
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record that a media-stack host is in scope
      ansible.builtin.set_fact:
        openbao_secrets_media_group_in_scope: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true

- name: Detect whether this run's --limit includes a deadman watchdog host
  hosts: technitium_dns_group:traefik_group:haproxy_group:openbao_group:docker_vms
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record that a deadman watchdog host is in scope
      ansible.builtin.set_fact:
        openbao_secrets_deadman_group_in_scope: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true
