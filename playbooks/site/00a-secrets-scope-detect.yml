---
# =============================================================================
# Phase 0-secrets-scope: detect out-of-play OpenBao domain consumers
# The servarr child converge (bao_media_secrets plus the monitoring domain's
# GATUS_EXTERNAL_TOKEN, forwarded as env by playbooks/site/05-media-and-gate.yml)
# and the deadman watchdog group set (bao_monitoring_secrets, republished
# there) are never hosts of the pre-fetch play itself by design; see its
# monitoring republish comment. YouTrack Hub is a localhost-only consumer. Its
# detector uses ansible_run_tags to mark that the controller is a consumer; the
# pre-fetch then includes localhost when its normal managed_secrets_group is
# out of scope and selects the apps domain even though YouTrack is not an
# inventory group. The fetch still runs once on the controller, and no media
# or watchdog host joins that play.
# Because the media and deadman consumers are outside the normal `hosts:`
# pattern, whether --limit selected any of their hosts can't be read from that
# play's own ansible_play_hosts_all — so, same as
# playbooks/site/05-media-and-gate.yml's own `_media_in_scope`, detector plays
# whose `hosts:` IS the group in question record their scope via localhost
# facts. YouTrack uses tag selection because its consumer is localhost itself.
#
# Split into its own file (imported by 00-load-and-telemetry.yml) to keep
# that file under its token budget — see .token-limits.yaml.
# =============================================================================

- name: Detect whether this run selects the YouTrack localhost consumer
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record whether the YouTrack localhost play is selected
      ansible.builtin.set_fact:
        openbao_secrets_youtrack_in_scope: >-
          {{ 'youtrack' in ansible_run_tags }}

- name: Detect whether this run's --limit includes a managed secrets host
  hosts: managed_secrets_group
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record that a managed secrets host is in scope
      ansible.builtin.set_fact:
        openbao_secrets_managed_group_in_scope: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true

- name: Detect whether this run's --limit includes a media-stack host
  hosts: media_group
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record that a media-stack host is in scope
      ansible.builtin.set_fact:
        openbao_secrets_media_group_in_scope: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true

- name: Detect whether this run's --limit includes a deadman watchdog host
  hosts: technitium_dns_group:traefik_group:haproxy_group:openbao_group:docker_vms
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Record that a deadman watchdog host is in scope
      ansible.builtin.set_fact:
        openbao_secrets_deadman_group_in_scope: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true
