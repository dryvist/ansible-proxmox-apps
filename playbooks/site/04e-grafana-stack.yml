---
# Phase 8g-4: Grafana + VictoriaMetrics observability stack (grafana_stack).
#
# AI coding-agent observability backend: VictoriaMetrics receives Prometheus
# remote_write from the stream pipeline; Grafana renders the provisioned
# dashboards behind the Authelia-gated Traefik vhost. Contract:
# terraform-proxmox docs/AI_OBSERVABILITY.md.
# =============================================================================

- name: Configure Grafana observability stack
  hosts: grafana_group
  become: true
  gather_facts: false
  tags:
    - grafana
    - dashboard
    - observability
    - collaboration
  tasks:
    - name: Converge grafana stack (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks:
            file: ../tasks/gather.yml
            apply:
              tags:
                - grafana
                - dashboard
                - observability
                - collaboration
                - grafana_stack_deploy
                - grafana_stack_provisioning
          tags:
            - grafana_stack_deploy
            - grafana_stack_provisioning
        - name: Include grafana stack deploy part
          ansible.builtin.include_role:
            name: grafana_stack
            tasks_from: deploy
            apply:
              tags:
                - grafana
                - dashboard
                - observability
                - collaboration
                - grafana_stack_deploy
          tags:
            - grafana_stack_deploy
        - name: Include grafana provisioning part
          ansible.builtin.include_role:
            name: grafana_stack
            tasks_from: provisioning
            allow_duplicates: true
            apply:
              tags:
                - grafana
                - dashboard
                - observability
                - collaboration
                - grafana_stack_provisioning
          tags:
            - grafana_stack_provisioning
        - name: Include grafana stack restart and health checks
          ansible.builtin.include_role:
            name: grafana_stack
            tasks_from: verify
            allow_duplicates: true
            apply:
              tags:
                - grafana
                - dashboard
                - observability
                - collaboration
                - grafana_stack_deploy
          tags:
            - grafana_stack_deploy
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks:
            file: ../tasks/record_isolated_failure.yml
            apply:
              tags:
                - grafana
                - dashboard
                - observability
                - collaboration
                - grafana_stack_deploy
                - grafana_stack_provisioning
          tags:
            - grafana_stack_deploy
            - grafana_stack_provisioning
          vars:
            _isolated_play_name: grafana_stack
