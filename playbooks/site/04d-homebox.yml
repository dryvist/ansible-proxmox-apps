---
# =============================================================================
# Phase 8g-5: Homebox home inventory (native binary, shared Postgres, restic
# backups). Requires DNS and Postgres to have converged first.
#
# Its own file, imported immediately after 04, so 04 stays inside its token
# budget (same reason as 04b and 04c).
# =============================================================================

- name: Configure Homebox home inventory
  hosts: homebox_group
  become: true
  gather_facts: false
  tags:
    - homebox
  tasks:
    - name: Converge homebox (isolated — failure does not abort downstream plays)
      block:
        - name: Gather the minimal fact set the PostgreSQL repository task reads
          ansible.builtin.setup:
            gather_subset:
              - min
        - name: Include homebox role
          ansible.builtin.include_role:
            name: homebox
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: homebox
