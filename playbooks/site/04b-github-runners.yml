---
# =============================================================================
# Phase 8.4a: GitHub Actions Runners
# CI runners on docker-host VM — isolated from dev/test workloads.
#
# Its own file, imported immediately after 04, for two reasons that both point
# the same way:
#
# 1. Order. The runner host holds no stored token. A per-host `bao agent`
#    authenticates with the `github-runner` AppRole and renders a short-lived
#    GitHub App installation token for the containers to register with. That
#    mint is authorized by the `github-runner` policy the openbao role writes,
#    and the agent's template engine reaches the mint path with a GET, so the
#    policy must already grant `read` on it before the agent starts. Converged
#    ahead of openbao — as this play was, in its old slot in 03 — the agent
#    gets a 403 on every render and the role fails waiting for a token file
#    that will never appear.
# 2. Size. site/04 is at the per-file token ceiling; folding this play back
#    into it puts the file over the gate.
#
# Anything added here must still run after the openbao play in 04. Adding it
# to 04 directly is what breaks (2); moving it earlier is what breaks (1).
# =============================================================================

- name: Deploy GitHub Actions runners
  hosts: docker_vms
  become: true
  gather_facts: false
  tags:
    - github_runner
    - ci
  tasks:
    # No `when:` guard on the include. There used to be one, testing the
    # converge environment for the runner credential, and it was the defect:
    # with the credential absent the whole role was skipped and the play recap
    # stayed green, so a fleet that never got deployed looked identical to one
    # that did. The role asserts its own inputs instead; a missing credential
    # now fails here, is recorded by the rescue below, and fails the run at the
    # end-of-site gate without aborting unrelated plays.
    - name: Converge github_runner (isolated — failure does not abort downstream plays)
      block:
        - name: Include github_runner role
          ansible.builtin.include_role:
            name: github_runner
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: github_runner
