---
# =============================================================================
# Phase 0a: Docker daemon configuration (registry mirror, storage driver)
#
# Its own file, split out of 01-baseline-infra.yml, for one reason: the
# site/ token-limit gate caps each file's rendered size, and this play once
# grew SITE past it. Imported immediately after 01, so nothing about when it
# runs changes -- Docker still gets its daemon.json here, before anything on
# these hosts depends on it.
# =============================================================================

# The CI runner VMs are docker hosts too: every Molecule image they pull
# through their daemon rides the same mirror, which is where the cold-pull
# minutes in the Molecule matrix go.
- name: Configure Docker registry mirror on docker hosts
  hosts: lxc_containers:docker_vms:!registry_group
  become: true
  gather_facts: false
  tags:
    - registry_mirror
    - docker
    - lxc
    - docker_vms
    - baseline
  handlers:
    - name: Apply netplan
      ansible.builtin.command:
        cmd: netplan apply
      changed_when: true

    - name: Flush resolved caches
      ansible.builtin.command:
        cmd: resolvectl flush-caches
      changed_when: false
  tasks:
    # fuse-overlayfs is the unprivileged-LXC workaround for Docker on ZFS; a VM
    # keeps whatever image store it already runs on. Pinning a driver there
    # would boot the daemon against an empty store, so the pin is LXC-only and
    # needs the virtualization fact even though the play skips fact gathering.
    - name: Gather the virtualization type
      when: inventory_hostname in groups.get('docker_group', [])
      ansible.builtin.setup:
        filter:
          - ansible_virtualization_type

    - name: Install fuse-overlayfs before pinning it as the storage driver
      when:
        - inventory_hostname in groups.get('docker_group', [])
        - ansible_facts['virtualization_type'] | default('') == 'lxc'
      ansible.builtin.apt:
        name: fuse-overlayfs
        state: present

    # A VM's resolvers come from its own default gateway, which forwards
    # every estate zone, and are declared once, in the VM module, at create
    # time only -- an existing VM keeps whatever it booted with. LXC
    # containers are out of scope: their resolvers are managed live by the
    # container module, not by this play.
    - name: Gather the default route
      when: inventory_hostname in groups['docker_vms']
      ansible.builtin.setup:
        filter:
          - ansible_default_ipv4

    - name: Assert the default route fact carries an interface and a gateway
      when: inventory_hostname in groups['docker_vms']
      ansible.builtin.assert:
        that:
          - ansible_facts['default_ipv4']['interface'] | default('') | length > 0
          - ansible_facts['default_ipv4']['gateway'] | default('') | length > 0
        fail_msg: >-
          No default-route fact on this VM -- the netplan resolver override
          below would render with no interface or no DNS server.

    # A single hand-placed override file existed before this task did the
    # same job in Ansible; one file owns the setting going forward.
    - name: Remove the hand-placed resolver override
      when: inventory_hostname in groups['docker_vms']
      ansible.builtin.file:
        path: /etc/netplan/60-dns-interim.yaml
        state: absent
      notify: Apply netplan

    # An earlier shape of this file sorted after the cloud-init file; remove
    # it from any host it already reached.
    - name: Remove the earlier-sorting resolver override
      when: inventory_hostname in groups['docker_vms']
      ansible.builtin.file:
        path: /etc/netplan/70-estate-dns.yaml
        state: absent
      notify: Apply netplan

    # Netplan concatenates nameserver lists across files in lexical order
    # and resolved uses the first server, so this file sorts BEFORE the
    # cloud-init file for its address to be tried first. World-readable
    # netplan files draw a runtime warning, hence 0600.
    - name: Configure the estate resolver on docker VMs
      when: inventory_hostname in groups['docker_vms']
      ansible.builtin.copy:
        dest: /etc/netplan/10-estate-dns.yaml
        content: |
          network:
            version: 2
            ethernets:
              {{ ansible_facts['default_ipv4']['interface'] }}:
                nameservers:
                  addresses: [{{ ansible_facts['default_ipv4']['gateway'] }}]
                  search: [{{ tofu_data.domain }}]
        owner: root
        group: root
        mode: "0600"
      notify:
        - Apply netplan
        - Flush resolved caches

    # Handlers run at end of play; the getent probe below needs the new
    # resolver already active, not queued behind it.
    - name: Apply any pending netplan/resolver changes before the probe
      when: inventory_hostname in groups['docker_vms']
      ansible.builtin.meta: flush_handlers

    # A guest name failing to resolve here means the resolver override did
    # not take, and every apt/Docker pull that needs one will fail the same
    # way -- fail loudly at the source instead of downstream.
    - name: Verify a guest name resolves through the new resolver
      when:
        - inventory_hostname in groups['docker_vms']
        - groups['apt_cacher_group'] | default([]) | length > 0
      ansible.builtin.command:
        cmd: >-
          getent hosts {{ groups['apt_cacher_group'] | sort | first }}.{{ tofu_data.domain }}
      changed_when: false

    # docker_engine is the single renderer. Hosts without dockerd skip this
    # play's file and service tasks; their app role writes the complete config
    # before installing Docker so the daemon starts with its final settings.
    - name: Check whether the Docker daemon binary is installed
      when: inventory_hostname in groups.get('docker_group', [])
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: docker_daemon_dockerd

    - name: Configure Docker daemon on installed Docker hosts
      ansible.builtin.include_role:
        name: docker_engine
        tasks_from: daemon_json.yml
      when:
        - groups['registry_group'] | default([]) | length > 0
        - inventory_hostname in groups.get('docker_group', [])
        - docker_daemon_dockerd.stat.exists | default(false)

    - name: Ensure Docker is running
      when:
        - inventory_hostname in groups.get('docker_group', [])
        - docker_daemon_dockerd.stat.exists | default(false)
      ansible.builtin.systemd:
        name: docker
        state: started
