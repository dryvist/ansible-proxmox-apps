# =============================================================================
# Phase 5b: Shared PostgreSQL + Nautobot IPAM/DCIM (issue #138)
# Postgres (the shared native DB backend) must converge before Nautobot, which
# connects to it by FQDN on the data VLAN. Both read their secrets from the
# openbao_secrets pre-play (apps domain) with an env fallback. gather_facts is
# on: the postgres role derives the PGDG apt repo from ansible_distribution_release.
# =============================================================================

- name: Configure shared PostgreSQL
  hosts: postgres_group
  become: true
  gather_facts: true
  tags:
    - postgres
    - database
  roles:
    - role: postgres

- name: Configure ai-VLAN PostgreSQL (Hindsight memory cluster)
  hosts: postgres_ai_group
  become: true
  gather_facts: true
  # serial keeps the converge primary-then-standby: the standby's basebackup
  # needs a running, already-converged primary.
  serial: 1
  tags:
    - postgres_ai
    - database
  roles:
    - role: postgres

- name: Configure Nautobot IPAM/DCIM
  hosts: nautobot_group
  become: true
  gather_facts: true
  tags:
    - nautobot
  tasks:
    - name: Converge nautobot (isolated — failure does not abort downstream plays)
      block:
        - name: Include nautobot role
          ansible.builtin.include_role:
            name: nautobot
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: nautobot

# =============================================================================
# Phase 7: GitHub Actions Runners
# CI runners on docker-host VM — isolated from dev/test workloads
# =============================================================================

- name: Deploy GitHub Actions runners
  hosts: docker_vms
  become: true
  gather_facts: false
  tags:
    - github_runner
    - ci
  tasks:
    - name: Converge github_runner (isolated — failure does not abort downstream plays)
      block:
        - name: Include github_runner role
          ansible.builtin.include_role:
            name: github_runner
          when: github_runner_access_token | default('') | length > 0
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: github_runner

# =============================================================================
# Phase 7a: Agent Sandbox Egress Boundary
# Internal `agents` docker network + allowlisting CONNECT proxy on the
# docker-host VM. Agent containers themselves are launched ad hoc by
# dryvist/nix-agent-sandbox (`agent run --host`), never by Ansible.
# =============================================================================

- name: Deploy agent sandbox egress boundary
  hosts: docker_vms
  become: true
  gather_facts: false
  tags:
    - agent_sandbox
  tasks:
    - name: Converge agent_sandbox (isolated — failure does not abort downstream plays)
      block:
        - name: Include agent_sandbox role
          ansible.builtin.include_role:
            name: agent_sandbox
          when: inventory_hostname == agent_sandbox_host | default('docker-host')
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: agent_sandbox

# =============================================================================
# Phase 7a1: OpenTofu CLI on the IaC execution host
# LAN-touching OpenTofu operations (init against the remote backend, plan,
# state ops) run from the iac-platform VM, not a workstation. This installs
# the tofu binary plus the direnv/jq/doppler tooling the flow needs — never
# any credential: backend coordinates and the API token come from the
# operator's environment at call time and are never written to the guest.
# =============================================================================

- name: Install the OpenTofu CLI on the IaC execution host
  hosts: docker_vms
  become: true
  gather_facts: false
  tags:
    - opentofu_cli
    - iac
  tasks:
    - name: Converge opentofu_cli (isolated — failure does not abort downstream plays)
      block:
        - name: Include opentofu_cli role
          ansible.builtin.include_role:
            name: opentofu_cli
          when: inventory_hostname == opentofu_cli_host | default('iac-platform')
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: opentofu_cli

