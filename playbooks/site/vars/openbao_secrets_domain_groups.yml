---
# Domain name -> ansible groups whose membership in this run means that
# domain's secrets are actually consumed. Traced by grepping every reference
# to each bao_<domain>_secrets fact (roles, group_vars, and cross-playbook
# consumers) — see the PR that introduced this map for the full trace. A
# domain absent here, or mapped to an empty list, is always fetched: the
# conservative default for a domain this repo has no evidence anyone still
# reads.
#
# Loaded via vars_files by 00-load-and-telemetry.yml's pre-fetch play, split
# out to keep that file under its token budget — see .token-limits.yaml.
openbao_secrets_domain_groups:
  apps:
    - n8n_group
    - cribl_stream_group
    - prometheus_group
    - postgres_group
    - postgres_ai_group
    - hindsight_group
    - nautobot_group
    - zammad_group
    - vikunja_group
    - homarr_group
    - authelia_group
    - grafana_group
    - ntfy_group
    - ai_orchestration_group
  local-llm:
    - zammad_group
    - cribl_stream_group
    - ai_orchestration_group
  media:
    - homarr_group
    - media_group
  ntfy:
    - ntfy_group
  monitoring:
    - ntfy_group
    - media_group
    - status_group
    - technitium_dns_group
    - traefik_group
    - haproxy_group
    - openbao_group
    - docker_vms
