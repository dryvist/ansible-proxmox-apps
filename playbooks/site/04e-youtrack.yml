---
# =============================================================================
# Phase 8g-1b: YouTrack Hub settings (the YouTrack OCI instance is managed
# elsewhere). The role only reconciles Hub settings through its HTTPS API.
# =============================================================================

- name: Configure YouTrack Hub settings
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  # `never`: runs only from its own template (--tags youtrack), so a full or
  # --limit converge never needs the apps domain on the controller for it.
  tags:
    - never
    - youtrack
  vars:
    bao_apps_secrets: >-
      {{ hostvars['localhost'].openbao_secrets_by_domain['apps'] | default({}) }}
    youtrack_hub_admin_token: >-
      {{ bao_apps_secrets.youtrack_hub_admin_token
         | default(undef(), true)
         | mandatory('YOUTRACK_HUB_ADMIN_TOKEN missing: OpenBao fetch did not supply it') }}
  tasks:
    - name: Converge youtrack (isolated — failure does not abort downstream plays)
      block:
        - name: Include YouTrack Hub role
          ansible.builtin.include_role:
            name: youtrack
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: youtrack
