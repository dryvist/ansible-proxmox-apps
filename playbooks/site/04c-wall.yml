---
# =============================================================================
# Server-room wall: static pages plus a read-only data gateway (roles/wall).
# Its own file so 04 stays inside its token budget; no ordering dependency
# beyond the inventory load in 00.
# =============================================================================
- name: Configure the server-room wall
  hosts: wall_group
  become: true
  gather_facts: false
  tags:
    - wall
    - dashboard
  tasks:
    - name: Converge wall (isolated — failure does not abort downstream plays)
      block:
        - name: Gather facts
          ansible.builtin.include_tasks: ../tasks/gather.yml
        - name: Include wall role
          ansible.builtin.include_role:
            name: wall
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: wall
