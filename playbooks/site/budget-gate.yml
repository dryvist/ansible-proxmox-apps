---
# Wall-clock budget for a converge, checked between every stage of site.yml.
#
# The gate itself lives once, in the dryvist.homelab collection
# (homelab-contracts), not once per ansible-proxmox-* repo — see
# ansible/roles/converge_gate there for the cap derivation (Semaphore's
# forwarded SEMAPHORE_MAX_TASK_DURATION_SEC minus a margin, clamped
# CONVERGE_WALL_CLOCK_CAP override on main, the --limit rerun hint) and
# ansible.cfg here for why a single task is bounded separately
# (task_timeout). Both are needed; neither replaces the other.
- name: Gate the converge on its wall-clock budget
  import_playbook: dryvist.homelab.converge_gate
