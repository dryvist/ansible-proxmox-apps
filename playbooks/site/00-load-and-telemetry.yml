---
# Import OpenTofu infrastructure data before running application playbooks
# This populates the inventory dynamically from tofu_inventory.json
# Must run with gather_facts: false to avoid Gathering Facts task
- name: Load OpenTofu infrastructure inventory
  import_playbook: ../../inventory/load_tofu.yml

# =============================================================================
# Phase 0-telemetry: publish converge-freshness configuration
# Hands the `converge_telemetry` callback plugin its tofu-derived endpoint,
# the inventory roster and the repo git SHA. The callback (not a play) decides
# per host whether the converge actually succeeded, using Ansible's own
# end-of-run counters — see callback_plugins/converge_telemetry.py.
# The HEC token is deliberately NOT published here; the callback reads
# SPLUNK_HEC_TOKEN itself so the secret never enters run stats.
# =============================================================================

- name: Publish converge-freshness telemetry configuration
  hosts: localhost
  gather_facts: false
  become: false
  tags:
    - always
  vars:
    ansible_become: false
    # Every inventory host the run could have converged. localhost is the
    # control node, never a converge target, so it is excluded from both the
    # roster and the FQDN map.
    converge_telemetry_roster: >-
      {{ groups['all'] | default([]) | reject('equalto', 'localhost') | list }}
    # inventory hostname -> FQDN. `hostname` is set as a real fact on every
    # guest by inventory/load_tofu.yml, which always runs before this play.
    converge_telemetry_fqdns: >-
      {{ dict(converge_telemetry_roster | zip(
           converge_telemetry_roster
           | map('extract', hostvars, 'hostname')
           | map('regex_replace', '$', '.' ~ tofu_data.domain)
           | list)) }}
  tasks:
    - name: Read the repository revision being converged
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ playbook_dir }}/../.."
      register: converge_telemetry_head
      changed_when: false
      failed_when: false
      # Read-only, so it is safe under --check. Without this the task skips in
      # check mode and git_sha publishes as an empty string.
      check_mode: false

    # Prints nothing on a detached HEAD (how CI, and possibly the plane, check
    # out) rather than failing, and the budget gate treats empty like any
    # non-main branch -- an undeterminable branch can never unlock the cap
    # override. `branch` is on ansible-lint's read-only git allow-list;
    # `symbolic-ref` is not.
    - name: Read the branch being converged
      ansible.builtin.command:
        cmd: git branch --show-current
        chdir: "{{ playbook_dir }}/../.."
      register: converge_telemetry_branch
      changed_when: false
      failed_when: false
      check_mode: false

    # Read by the shared dryvist.homelab.converge_gate playbook (imported via
    # site/budget-gate.yml) between every stage of site.yml. Kept on
    # localhost, which every scoped run includes (--limit must name it for
    # the inventory loader to run at all). converge_gate_started_epoch is
    # the collection role's own fact name (prefixed per its var-naming
    # convention) — setting it here, before the first gate, means every
    # gate checkpoint measures elapsed time from THIS point rather than
    # resetting its own clock at the first stage boundary it happens to run
    # at.
    - name: Start the converge wall clock
      ansible.builtin.set_fact:
        converge_gate_started_epoch: "{{ now().timestamp() | int }}"
        converge_branch: "{{ converge_telemetry_branch.stdout | default('') | trim }}"

    - name: Publish converge-freshness configuration for the callback plugin
      ansible.builtin.set_stats:
        aggregate: false
        data:
          converge_telemetry:
            # A dry run converges nothing, so the callback must stay silent for
            # it — publishing a "success" event would refresh the freshness
            # clock of a host that was never touched. The callback also reads
            # the CLI --check flag itself; this is the belt to that's braces,
            # and it is the only signal available to an API-driven run.
            check_mode: "{{ ansible_check_mode }}"
            hec_url: "{{ splunk_hec_base_url }}/services/collector/event"
            index: "{{ converge_telemetry_index | default('ansible') }}"
            verify_tls: "{{ converge_telemetry_verify_tls | default(false) | bool }}"
            timeout: "{{ converge_telemetry_timeout | default(10) | int }}"
            git_sha: "{{ converge_telemetry_head.stdout | default('') | trim }}"
            roster: "{{ converge_telemetry_roster }}"
            fqdns: "{{ converge_telemetry_fqdns }}"
            # Was the inventory this run converged against current with desired
            # state? Set by the inventory_resolve role in load_tofu.yml above,
            # and OMITTED (not defaulted) when it could not check — the callback
            # publishes no claim at all in that case, because a converge that
            # never checked must not report the artifact current.
            desired_state_current: "{{ tofu_desired_state_current | default(omit) }}"
            desired_state_published: "{{ tofu_desired_state_published | default(omit) }}"
            desired_state_live: "{{ tofu_desired_state_live | default(omit) }}"

# Machine-identity AppRole pairs: read the env document once, with the
# converge identity's token, into a localhost fact that roles and delegated
# tasks take from hostvars['localhost'] (see openbao_platform_env). Nothing
# falls back to the controller's environment for these pairs.
- name: Pre-fetch machine-identity AppRole pairs from the env document
  hosts: localhost
  gather_facts: false
  become: false
  tags:
    - always
  vars:
    ansible_become: false
    _bao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
    _bao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
    # Only pairs a role cannot run without. SLACK_ADMIN is read when present
    # but not required: its rotator skips itself when the pair is unset
    # (openbao_slack_rotate_role_id).
    _required_keys: >-
      {{ ['SNAPSHOT', 'SPLUNK_MCP_ROTATE', 'SECRET_AGE_AUDIT', 'GITHUB_RUNNER']
         | product(['_ROLE_ID', '_SECRET_ID'])
         | map('join') | map('regex_replace', '^', 'OPENBAO_APPROLE_') | list }}
  tasks:
    - name: Require an OpenBao endpoint and a converge token
      ansible.builtin.assert:
        that:
          - _bao_addr | length > 0
          - _bao_token | length > 0
        fail_msg: >-
          BAO_ADDR and BAO_TOKEN must be set (scripts/run-ansible.sh exports
          the converge identity's token) to read the env document.
        quiet: true

    - name: Read the env document
      ansible.builtin.uri:
        url: "{{ _bao_addr }}/v1/secret/data/platform/ansible/env"
        headers:
          X-Vault-Token: "{{ _bao_token }}"
        status_code: 200
      register: _platform_env_read
      changed_when: false
      no_log: true

    - name: Keep only the AppRole pairs
      ansible.builtin.set_fact:
        openbao_platform_env_doc: >-
          {{ _platform_env_read.json.data.data | dict2items
             | selectattr('key', 'match', '^OPENBAO_APPROLE_[A-Z0-9_]+_(ROLE|SECRET)_ID$')
             | items2dict }}
      no_log: true

    - name: Require every pair a role consumes
      ansible.builtin.assert:
        that:
          - _missing | length == 0
        fail_msg: "The env document is missing {{ _missing }}."
        quiet: true
      vars:
        _missing: "{{ _required_keys | reject('in', openbao_platform_env_doc) | list }}"

# Configure application stacks based on OpenTofu infrastructure

# =============================================================================
# Phase 0-secrets: OpenBao resource-domain secrets pre-fetch
# Reads each resource-domain's KV subtree (its own least-privilege AppRole)
# into a per-domain `bao_<domain>_secrets` fact so every consumer role can
# resolve its secrets bao-first with an env fallback. Runs once on the
# controller and publishes to the union of every domain's consuming groups;
# each domain SKIPS CLEANLY when BAO_ADDR or that domain's own role_id/
# secret_id envs are unset.
# =============================================================================

- name: Pre-fetch resource-domain secrets from OpenBao
  hosts: >-
    ai_orchestration_group:n8n_group:
    cribl_stream_group:cribl_edge:
    object_storage_group:
    netmon_group:prometheus_group:unifi_metrics_group:
    postgres_group:postgres_ai_group:hindsight_group:nautobot_group:zammad_group:vikunja_group:
    immich_group:homarr_group:authelia_group:grafana_group:ntfy_group
  gather_facts: false
  # `always`: every consumer role resolves its secrets bao-first, so a tagged
  # converge (--tags zammad, --tags nautobot, ...) MUST still run this play —
  # under the old `openbao_secrets, ai` tags a tagged converge skipped the
  # fetch and templated empty passwords (zammad database.yml, 2026-07-16).
  # The role still skips cleanly when BAO_ADDR / a domain's AppRole envs are
  # unset, so `always` costs nothing in env-less runs.
  tags:
    - always
  # Wrapped in block/rescue for play-level failure isolation (issue #672): a
  # hard failure on one host in this large combined-group play (e.g. an
  # undefined var) would otherwise be 100% of that host's "batch" and abort
  # every remaining play in site.yml, not just this one. See
  # tasks/record_isolated_failure.yml for the mechanism.
  tasks:
    - name: Converge OpenBao secrets pre-fetch (isolated — failure does not abort downstream plays)
      block:
        - name: Fetch each resource-domain's KV subtree via its own AppRole
          ansible.builtin.include_role:
            name: openbao_secrets

        # Publish each domain's shared, un-prefixed fact at the playbook layer
        # (like tofu_data in load_tofu.yml). openbao_secrets_by_domain was
        # computed once on the delegated controller; a domain that was skipped
        # (BAO_ADDR or that domain's creds unset) is simply absent from the dict,
        # so `default({})` covers it the same as a host outside this play.
        - name: Publish each domain's merged secrets to every host in this play
          ansible.builtin.set_fact:
            bao_observability_secrets: "{{ openbao_secrets_by_domain['observability'] | default({}) }}"
            bao_local_cloud_secrets: "{{ openbao_secrets_by_domain['local-cloud'] | default({}) }}"
            bao_monitoring_secrets: "{{ openbao_secrets_by_domain['monitoring'] | default({}) }}"
            bao_local_llm_secrets: "{{ openbao_secrets_by_domain['local-llm'] | default({}) }}"
            bao_apps_secrets: "{{ openbao_secrets_by_domain['apps'] | default({}) }}"
            bao_ntfy_secrets: "{{ openbao_secrets_by_domain['ntfy'] | default({}) }}"
            bao_media_secrets: "{{ openbao_secrets_by_domain['media'] | default({}) }}"
          vars:
            openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
          no_log: true

        # bao_media_secrets ALSO has a second consumer that is not one of this
        # play's hosts: playbooks/site/05-media-and-gate.yml hands it to the
        # media stack's child ansible-playbook as localhost's own environment.
        # The publish above already reaches every group_vars consumer in this
        # play (Homarr included); this delegate_facts + run_once is the same
        # mechanism openbao_secrets_by_domain itself uses to additionally put
        # a copy on localhost specifically, since localhost is not one of the
        # hosts above.
        - name: Publish the media domain's secrets to localhost too
          ansible.builtin.set_fact:
            bao_media_secrets: "{{ openbao_secrets_by_domain['media'] | default({}) }}"
          vars:
            openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
          delegate_to: localhost
          delegate_facts: true
          run_once: true
          no_log: true
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: openbao-secrets-prefetch

# =============================================================================
# Phase 0-secrets-monitoring: republish the monitoring domain to the deadman
# targets only. These hosts are NOT in the combined pre-fetch play above on
# purpose: that play publishes every fetched domain's fact to every host it
# touches, and DNS/proxy/OpenBao-node/docker-VM hosts must never see the apps,
# local-llm, observability, local-cloud or ntfy domains they have no business
# holding. No new fetch and no new AppRole: this reads the SAME
# openbao_secrets_by_domain the play above already fetched onto localhost.
# This play therefore depends on the combined pre-fetch play above having run
# in the same invocation: a converge limited to only these deadman hosts
# republishes an empty dict here, silently, with no error.
# =============================================================================

- name: Republish the monitoring domain to the deadman watchdog's own hosts
  hosts: technitium_dns_group:traefik_group:haproxy_group:openbao_group:docker_vms
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Publish only bao_monitoring_secrets to these hosts
      ansible.builtin.set_fact:
        bao_monitoring_secrets: "{{ openbao_secrets_by_domain['monitoring'] | default({}) }}"
      vars:
        openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
      no_log: true
