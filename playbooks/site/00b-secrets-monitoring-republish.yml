---
# =============================================================================
# Phase 0-secrets-monitoring: republish the monitoring domain to the deadman
# targets only. These hosts are NOT in the combined pre-fetch play in
# 00-load-and-telemetry.yml on purpose: that play publishes every fetched
# domain's fact to every host it touches, and DNS/proxy/OpenBao-node/
# docker-VM hosts must never see the apps, local-llm, observability,
# local-cloud or ntfy domains they have no business holding. No new fetch and
# no new AppRole: this reads the SAME openbao_secrets_by_domain the pre-fetch
# play already fetched onto localhost. This play therefore depends on the
# pre-fetch play having run in the same invocation: a converge limited to
# only these deadman hosts republishes an empty dict here, silently, with no
# error.
#
# Split into its own file (imported by 00-load-and-telemetry.yml right after
# the pre-fetch play) to keep that file under its token budget — see
# .token-limits.yaml.
# =============================================================================

- name: Republish the monitoring domain to the deadman watchdog's own hosts
  hosts: technitium_dns_group:traefik_group:haproxy_group:openbao_group:docker_vms
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Publish only bao_monitoring_secrets to these hosts
      ansible.builtin.set_fact:
        bao_monitoring_secrets: "{{ openbao_secrets_by_domain['monitoring'] | default({}) }}"
      vars:
        openbao_secrets_by_domain: "{{ hostvars['localhost'].openbao_secrets_by_domain | default({}) }}"
      no_log: true
