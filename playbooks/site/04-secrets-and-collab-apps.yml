# =============================================================================
# Phase 8d: HTTPS ingress (Traefik)
# Fronts every service web UI at https://<name>.<domain> (no ports) with a
# wildcard Let's Encrypt cert fetched via Route53 DNS-01. On the media VLAN so
# it reaches the media UIs at L2; other VLANs' UIs route in (UniFi).
# =============================================================================

- name: Configure Traefik HTTPS ingress
  hosts: traefik_group
  become: true
  gather_facts: true
  tags:
    - traefik
    - ingress
  tasks:
    - name: Converge traefik + keepalived (isolated — failure does not abort downstream plays)
      block:
        - name: Include traefik role
          ansible.builtin.include_role:
            name: traefik
        # keepalived floats the ingress VRRP virtual IP across every Traefik
        # instance so a node loss migrates ingress automatically (no manual DR).
        # No-ops below 2 ingress instances / without a published VIP.
        - name: Include keepalived role
          ansible.builtin.include_role:
            name: keepalived
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: traefik

# =============================================================================
# Phase 9: Systemd Restart Policies
# Apply restart-on-failure policies to all managed services
# Each group defines its services via group_vars
# =============================================================================

- name: Apply systemd restart policies to all managed services
  hosts: all
  become: true
  gather_facts: false
  tags:
    - restart-policy
    - hardening

  roles:
    - role: systemd_restart_policy
      when: systemd_restart_policy_services | default([]) | length > 0

# =============================================================================
# Phase 9b: Windows VDI baseline (RDP enablement)
# =============================================================================
- name: Configure Windows VDI baseline (RDP)
  hosts: windows_group
  become: false
  gather_facts: false
  # A guest that is genuinely powered off drops out of the run instead of
  # failing it, and still shows as unreachable in the recap. `started` cannot
  # answer this: it declares whether terraform powers a guest on at CREATE, not
  # whether it is running now — every VDI guest publishes started = false while
  # serving desktops, so gating on it skips the whole group and reports green.
  ignore_unreachable: true
  tags:
    - windows
    - vdi
  roles:
    - role: windows_baseline

# =============================================================================
# Phase 9c: VDI split-tunnel routing
# Any guest tagged `vdi` keeps the estate's own networks on its LAN instead of
# losing them to a VPN client running inside the guest. Tag-driven rather than
# connection-driven: this is the desktop policy, not a WinRM capability.
# =============================================================================
- name: Preserve internal routes on VDI guests running a VPN client
  hosts: vdi_group
  become: false
  gather_facts: false
  # See Phase 9b: unreachability, not desired-state `started`, is what says a
  # guest cannot be converged right now.
  ignore_unreachable: true
  tags:
    - vdi
    - vdi-routes
  roles:
    - role: vdi_local_routes

# =============================================================================
# Phase 10: End-of-run failure gate (issue #672)
# Every independent app play above records its own failures into
# site_isolated_failures (see tasks/record_isolated_failure.yml) instead of
# letting them abort the rest of the run. This final play is what makes the
# overall ansible-playbook exit code non-zero again when that happened, so
# CI/cron/exit-code monitoring is never silently green on a real failure.
# =============================================================================

# =============================================================================
# Static document host: nginx serving a directory of files over plain HTTP,
# behind the reverse proxy that terminates TLS. The role has no datastore and
# no state — a rebuild is a re-publish.
#
# `static_site_source_dir` is intentionally not set here. It is a control-node
# path whose contents are never committed to this repo, so it is supplied at
# converge time (`-e static_site_source_dir=...`); the role fails loudly when
# it is missing rather than publishing an empty document root.
# =============================================================================

- name: Serve a static document root
  hosts: static_site_group
  become: true
  tags:
    - static_site
    - web
  roles:
    - role: static_site
