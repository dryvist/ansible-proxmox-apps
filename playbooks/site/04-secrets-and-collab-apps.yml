---
# Phase 8.4: OpenBao secrets-management engine (machine/IaC/dynamic secrets)
# 5-voter Raft HA cluster (quorum 3) with on-prem static-key auto-unseal — no
# cloud. The role installs the native binary, renders the Raft + static-seal
# config, and (on the bootstrap host only) initializes the cluster, the secret
# hierarchy, the RBAC policies, and the AppRoles (terraform / ansible /
# ai-readonly / ai-elevated / snapshot). Peers join + self-unseal automatically.
# Recovery shares + AppRole creds are written 0600 to the controller for the
# operator to transcribe/load and delete (gitignored). Requires OPENBAO_STATIC_
# SEAL_KEY in the environment (Doppler tier-0).
# =============================================================================

- name: Configure OpenBao secrets-management engine
  hosts: openbao_group
  become: true
  gather_facts: false
  tags:
    - openbao
    - secrets
    - secrets-management
  tasks:
    - name: Converge openbao (isolated — failure does not abort downstream plays)
      block:
        - name: Include openbao role
          ansible.builtin.include_role:
            name: openbao
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: openbao

- name: Deploy OpenBao Raft-voter health telemetry (read-only, isolated)
  hosts: openbao_group
  become: true
  gather_facts: false
  tags:
    - openbao
    - openbao_voter_health
    - secrets
    - secrets-management
  tasks:
    - name: Converge openbao_voter_health (isolated — failure does not abort downstream plays)
      block:
        - name: Include openbao_voter_health role
          ansible.builtin.include_role:
            name: openbao_voter_health
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: openbao_voter_health

# =============================================================================
# Phase 8.4a: GitHub Actions Runners
# CI runners on docker-host VM — isolated from dev/test workloads.
#
# This play lives here, not in its old slot in site/03, because it depends on
# the openbao play above. The runner host holds no stored token: a per-host
# `bao agent` authenticates with the `github-runner` AppRole and renders a
# short-lived GitHub App installation token for the containers to register
# with. That mint is authorized by the `github-runner` policy the openbao role
# writes, and the agent's template engine reaches the mint path with a GET, so
# the policy must already grant `read` on it before the agent starts. Ordered
# ahead of openbao the agent gets a 403 on every render and the role fails
# waiting for a token file that will never appear.
# =============================================================================

- name: Deploy GitHub Actions runners
  hosts: docker_vms
  become: true
  gather_facts: false
  tags:
    - github_runner
    - ci
  tasks:
    # No `when:` guard on the include. There used to be one, testing the
    # converge environment for the runner credential, and it was the defect:
    # with the credential absent the whole role was skipped and the play recap
    # stayed green, so a fleet that never got deployed looked identical to one
    # that did. The role asserts its own inputs instead; a missing credential
    # now fails here, is recorded by the rescue below, and fails the run at the
    # end-of-site gate without aborting unrelated plays.
    - name: Converge github_runner (isolated — failure does not abort downstream plays)
      block:
        - name: Include github_runner role
          ansible.builtin.include_role:
            name: github_runner
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks: ../tasks/record_isolated_failure.yml
          vars:
            _isolated_play_name: github_runner

