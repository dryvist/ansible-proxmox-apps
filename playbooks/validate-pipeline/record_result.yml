---
- name: Record validation result for the pipeline summary
  ansible.builtin.set_fact:
    validate_pipeline_results: >-
      {{ validate_pipeline_results | default({}) | combine({
           validate_pipeline_result_key: {
             'status': validate_pipeline_result_status,
             'reason': validate_pipeline_result_reason | default(''),
           }
         }) }}
  register: validate_pipeline_result
  changed_when: false
