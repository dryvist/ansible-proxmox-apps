---
- name: Fail when declared validation containers are not live
  ansible.builtin.fail:
    msg: >-
      Validation did not cover declared containers that are not running:
      {% for tier in validate_pipeline_tier_coverage_registered.ansible_facts.validate_pipeline_tier_coverage_snapshot
         | selectattr('missing') %}
      {{ tier.name }}:
      {% for container in tier.missing %}
      {{ container.container }} (status '{{ container.status }}')
      {% endfor %}
      {% endfor %}
  when: >-
    validate_pipeline_tier_coverage_registered.ansible_facts.validate_pipeline_tier_coverage_snapshot
    | selectattr('missing') | list | length > 0
