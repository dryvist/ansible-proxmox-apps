---
- name: Pipeline Summary
  hosts: localhost
  gather_facts: false
  tags:
    - summary

  # Dynamic inventory exposes LXC tags and runtime status, but not which
  # playbook host patterns consume them; this is the validator's one mapping.
  vars:
    validate_pipeline_tiers:
      - name: HAProxy
        group: haproxy_group
        required_tags: []
        any_tags: [haproxy, loadbalancer]
        checks:
          - { label: HAProxy, key: haproxy }
      - name: Cribl Edge
        group: cribl_edge
        required_tags: [cribl, edge]
        any_tags: []
        checks:
          - { label: Cribl Edge, key: cribl_edge }
          - { label: Cribl Edge metrics, key: cribl_edge_metrics }
          - { label: E2E syslog via Cribl Edge, key: e2e_syslog, first_host: true }
          - { label: E2E via HAProxy, key: e2e_haproxy, first_host: true }
      - name: Cribl Stream
        group: cribl_stream_group
        required_tags: [cribl, stream]
        any_tags: []
        checks:
          - { label: Cribl Stream, key: cribl_stream }
          - { label: NetFlow, key: netflow, first_host: true }
      - name: Mailpit
        group: mailpit_group
        required_tags: []
        any_tags: [smtp]
        checks:
          - { label: Mailpit, key: mailpit }
      - name: ntfy
        group: ntfy_group
        required_tags: []
        any_tags: [push]
        checks:
          - { label: ntfy, key: ntfy }
      - name: MSSQL
        group: mssql_group
        required_tags: []
        any_tags: [database]
        checks:
          - { label: MSSQL, key: mssql }

  tasks:
    - name: Derive declared and live validation tier coverage
      ansible.builtin.import_tasks: tier_coverage.yml

    - name: Display validation outcomes from registered play results
      ansible.builtin.debug:
        msg: |
          PIPELINE VALIDATION SUMMARY
          {% for tier in validate_pipeline_tiers %}
          {% set coverage = (
               validate_pipeline_tier_coverage_registered.ansible_facts.validate_pipeline_tier_coverage_snapshot
             | selectattr('name', 'equalto', tier.name) | first) %}
          {% for check in tier.checks %}
          {% set group_name = check.group | default(tier.group) %}
          {% set hosts = groups.get(group_name, []) %}
          {% set expected_hosts = hosts[:1] if check.first_host | default(false) else hosts %}
          {% set outcomes = namespace(results=[]) %}
          {% for host in expected_hosts %}
          {% set result = hostvars[host].get('validate_pipeline_result', {})
             .get('ansible_facts', {}).get('validate_pipeline_results', {})
             .get(check.key) %}
          {% if result is not none %}
          {% set outcomes.results = outcomes.results + [result] %}
          {% endif %}
          {% endfor %}
          {% set statuses = outcomes.results | map(attribute='status') | list %}
          {% if coverage.missing | length > 0 %}
          {{ check.label }}: FAILED ({{ coverage.missing | map(attribute='container') | join(', ') }} not running)
          {% elif expected_hosts | length == 0 and coverage.declared | length == 0 %}
          {{ check.label }}: SKIPPED (no declared or matched hosts for {{ tier.name }})
          {% elif outcomes.results | length != expected_hosts | length %}
          {{ check.label }}: FAILED (validation result was not registered for every target)
          {% elif statuses | select('equalto', 'skipped') | list | length == statuses | length %}
          {% set reasons = outcomes.results | map(attribute='reason')
             | reject('equalto', '') | unique | join('; ') %}
          {{ check.label }}: SKIPPED ({{ reasons }})
          {% elif statuses | select('equalto', 'validated') | list | length == statuses | length %}
          {{ check.label }}: VALIDATED
          {% else %}
          {{ check.label }}: FAILED (registered validation result is incomplete)
          {% endif %}
          {% endfor %}
          {% endfor %}

    - name: Fail when a declared validation tier was dropped from the live inventory
      ansible.builtin.import_tasks: fail_missing_tiers.yml
