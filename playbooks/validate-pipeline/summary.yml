---
- name: Pipeline Summary
  hosts: localhost
  gather_facts: false
  tags:
    - summary

  tasks:
    - name: Display pipeline validation summary
      ansible.builtin.debug:
        msg: |
          ============================================
          LOGGING PIPELINE VALIDATION COMPLETE
          ============================================
          HAProxy:      Config valid, ports listening
          Cribl Edge:   LXC services healthy, APIs responding
          Cribl Stream: LXC services healthy, APIs responding
          Cribl Edge:   Metrics API responding
          Mailpit:      Docker running, SMTP+Web healthy
          ntfy:         Docker running, health endpoint healthy
          MSSQL:        Docker running, port 1433 listening
          {% if ansible_check_mode -%}
          E2E:          SKIPPED (check mode — no data injected)
          {% else -%}
          E2E:          Data flowing through pipeline
          E2E (direct): Every source family landed in its index via Cribl Edge
          E2E (HAProxy): Every source family landed via the standard frontends
          NetFlow:      Port listening + event in Splunk
          Latency:      Events appeared within 120s
          {% endif -%}
          ============================================
          Pipeline is ready for log ingestion!
