---
- name: Initialize validation tier membership
  ansible.builtin.set_fact:
    validate_pipeline_tier_members: []

- name: Derive declared and live validation tier members
  ansible.builtin.set_fact:
    validate_pipeline_tier_members: >-
      {{ validate_pipeline_tier_members + [{
           'tier': item.0.name,
           'container': item.1.key,
           'status': _container_status,
         }] }}
  vars:
    _live_nodes: "{{ hostvars['localhost'].get('add_lxc_hosts_live_node', {}) }}"
    _live_status: "{{ hostvars['localhost'].get('add_lxc_hosts_live_status', {}) }}"
    _container_status: >-
      {{ _live_status.get(
           item.1.value.vmid | string,
           'running' if (_live_nodes | length == 0) else 'absent'
         ) }}
  loop: >-
    {{ query('nested', validate_pipeline_tiers,
             hostvars['localhost'].get('tofu_data', {}).get('containers', {})
             | dict2items) }}
  loop_control:
    label: "{{ item.0.name }} / {{ item.1.key }}"
  when:
    - item.0.required_tags | difference(item.1.value.tags | default([])) | length == 0
    - >-
      item.0.any_tags | length == 0 or
      item.0.any_tags | intersect(item.1.value.tags | default([])) | length > 0

- name: Build validation tier coverage from the recorded inventory state
  ansible.builtin.set_fact:
    validate_pipeline_tier_coverage: >-
      {{ validate_pipeline_tier_coverage | default([]) + [{
           'name': item.name,
           'group': item.group,
           'declared': _members,
           'missing': _members | rejectattr('status', 'equalto', 'running') | list,
         }] }}
  vars:
    _members: >-
      {{ validate_pipeline_tier_members
         | selectattr('tier', 'equalto', item.name) | list }}
  loop: "{{ validate_pipeline_tiers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Register computed validation tier coverage
  ansible.builtin.set_fact:
    validate_pipeline_tier_coverage_snapshot: "{{ validate_pipeline_tier_coverage }}"
  changed_when: false
  register: validate_pipeline_tier_coverage_registered
