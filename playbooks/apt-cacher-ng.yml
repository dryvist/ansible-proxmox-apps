---
# Apt-Cacher-NG Deployment Playbook
# Installs and configures apt-cacher-ng caching proxy

- name: Deploy Apt-Cacher-NG
  hosts: apt_cacher_group
  become: true
  gather_facts: true

  roles:
    - apt_cacher_ng

  post_tasks:
    - name: Display client configuration instructions
      ansible.builtin.debug:
        msg:
          - "Apt-Cacher-NG deployed successfully!"
          - ""
          - "Clients are wired automatically by playbooks/site.yml, which deploys"
          - "an apt Proxy-Auto-Detect script probing every apt_cacher_group"
          - "instance by FQDN (fail-open to DIRECT)."
          - ""
          - >-
            Admin interface:
            http://{{ inventory_hostname }}.{{ tofu_data.domain }}:{{
            apt_cacher_ng_port }}/{{ apt_cacher_ng_report_page }}
