---
# Fixture proving the dynamic include_role tag-gating mechanism
# playbooks/site/04a-openbao.yml relies on: the include's OWN `tags:` gate
# whether it is entered at all under a given `--tags` filter, and once
# entered, each loaded task is filtered individually by its OWN tags
# (including the special `always` tag, which fires whenever the include is
# entered, regardless of which specific tag matched it in). Never run
# directly for its own sake — see
# tests/test_openbao_include_role_tag_scoping.py, which runs it three ways
# (an unrelated tag, the seed-equivalent tag, and the umbrella tag) and
# asserts on the MARKER: lines in its stdout.
- name: Fixture play mimicking playbooks/site/04a-openbao.yml's tag structure
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - fx_umbrella
  tasks:
    - name: Include fixture role
      ansible.builtin.include_role:
        name: fixture_role
      tags:
        - fx_kv_seed
        - fx_rbac
