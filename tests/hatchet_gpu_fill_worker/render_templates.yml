---
- name: Render the Hatchet GPU fill worker templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - render_vars.yml

  tasks:
    - name: Load Hatchet role defaults for fixture assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/hatchet_docker/defaults/main.yml"
        name: _hatchet_role_defaults

    - name: Create a temporary render directory
      ansible.builtin.tempfile:
        state: directory
        prefix: hatchet_worker_template_
      register: _hatchet_render_dir

    - name: Render the default-off Hatchet compose template
      ansible.builtin.template:
        src: "{{ _template_dir }}/docker-compose.yml.j2"
        dest: "{{ _hatchet_render_dir.path }}/compose-off.yml"
        mode: "0600"

    - name: Read the default-off Hatchet compose template
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/compose-off.yml"
      register: _hatchet_compose_off

    - name: Assert the default-off compose has no worker service
      ansible.builtin.assert:
        that:
          - "'hatchet-worker:' not in (_hatchet_compose_off.content | b64decode)"

    - name: Render the enabled Hatchet compose template
      ansible.builtin.template:
        src: "{{ _template_dir }}/docker-compose.yml.j2"
        dest: "{{ _hatchet_render_dir.path }}/compose-on.yml"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true

    - name: Read the enabled Hatchet compose template
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/compose-on.yml"
      register: _hatchet_compose_on

    - name: Assert the enabled compose contains the pinned worker and secret wiring
      ansible.builtin.assert:
        that:
          - "'hatchet-worker:' in (_hatchet_compose_on.content | b64decode)"
          - "'gpu_fill_corpus' not in (_hatchet_compose_on.content | b64decode)"
          - >-
            'python:3.13.18-slim-trixie@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb'
            in (_hatchet_compose_on.content | b64decode)
          - >-
            'HATCHET_CLIENT_TOKEN: "render-worker-token-placeholder"'
            in (_hatchet_compose_on.content | b64decode)
          - >-
            'HATCHET_CLIENT_HOST_PORT: "192.0.2.22:443"'
            in (_hatchet_compose_on.content | b64decode)
          - >-
            'HERMES_API_TOKEN: "render-platform-token-placeholder"'
            in (_hatchet_compose_on.content | b64decode)
          - "'/app/gpu_fill_worker:ro' in (_hatchet_compose_on.content | b64decode)"
          - "'/tmp/gpu-fill-worker.json:ro' in (_hatchet_compose_on.content | b64decode)"
          - "'ai-llm-prompts' not in (_hatchet_compose_on.content | b64decode)"
          - "'LANGFUSE_HOST' not in (_hatchet_compose_on.content | b64decode)"
          - "'langfuse==' not in (_hatchet_compose_on.content | b64decode)"
          - "'pyyaml==' not in (_hatchet_compose_on.content | b64decode)"
          - "'condition: service_healthy' in (_hatchet_compose_on.content | b64decode)"
          - "'pip install --no-cache-dir' in (_hatchet_compose_on.content | b64decode)"
          - "'hatchet-sdk==1.44.0' in (_hatchet_compose_on.content | b64decode)"
          - "'promptfoo' not in (_hatchet_compose_on.content | b64decode)"
          - "'openrouter' not in (_hatchet_compose_on.content | b64decode | lower)"

    - name: Render the worker JSON configuration
      ansible.builtin.template:
        src: "{{ _template_dir }}/gpu_fill_worker_config.json.j2"
        dest: "{{ _hatchet_render_dir.path }}/worker.json"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true

    - name: Read and parse the worker JSON configuration
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/worker.json"
      register: _hatchet_worker_config

    - name: Assert the JSON config contains only the worker-facing role and platform fields
      ansible.builtin.assert:
        that:
          - "(_hatchet_worker_config.content | b64decode | from_json).roles.medium.max_runs == 3"
          - >-
            (_hatchet_worker_config.content | b64decode | from_json).platforms.hermes.run_url
            == 'https://192.0.2.24/run'
          - >-
            (_hatchet_worker_config.content | b64decode | from_json).platforms.hermes.auth_env
            == 'HERMES_API_TOKEN'
          - >-
            (_hatchet_worker_config.content | b64decode | from_json).platforms.hermes.timeout_s
            == 120
          - >-
            (_hatchet_worker_config.content | b64decode | from_json).latency_guard.prometheus_url
            == 'http://192.0.2.23:9090'
          - >-
            (_hatchet_worker_config.content | b64decode | from_json).latency_guard.max_ratio == 1.2
          - "'auth_secret_key' not in (_hatchet_worker_config.content | b64decode)"
          - "'evals' not in (_hatchet_worker_config.content | b64decode | from_json)"
          - "'fill' not in (_hatchet_worker_config.content | b64decode | from_json)"

    - name: Render worker JSON configuration with trace judging
      ansible.builtin.template:
        src: "{{ _template_dir }}/gpu_fill_worker_config.json.j2"
        dest: "{{ _hatchet_render_dir.path }}/worker-tracejudge.json"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true
        hatchet_docker_worker_tracejudge_enabled: true
        hatchet_docker_worker_platforms: "{{ _hatchet_role_defaults.hatchet_docker_worker_chat_platforms }}"
        hatchet_docker_worker_tracejudge_cron: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_cron }}
        hatchet_docker_worker_tracejudge_sample_per_agent: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_sample_per_agent }}
        hatchet_docker_worker_tracejudge_platform: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_platform }}
        hatchet_docker_worker_tracejudge_langfuse_base_url: >-
          {{ hatchet_docker_eval_langfuse_host }}
        hatchet_docker_worker_tracejudge_slack_webhook_env: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_slack_webhook_env }}
        hatchet_docker_worker_tracejudge_output_dir: "{{ hatchet_docker_data_dir }}/tracejudge"

    - name: Read and parse worker JSON configuration with trace judging
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/worker-tracejudge.json"
      register: _hatchet_worker_config_tracejudge

    - name: Assert trace judging uses the configured schedule, local platform, and env names
      ansible.builtin.assert:
        that:
          - (_hatchet_worker_config_tracejudge.content | b64decode | from_json).tracejudge.cron == '43 2 * * *'
          - (_hatchet_worker_config_tracejudge.content | b64decode | from_json).tracejudge.sample_per_agent == 10
          - (_hatchet_worker_config_tracejudge.content | b64decode | from_json).tracejudge.platform == 'pro6000-direct'
          - >-
            (_hatchet_worker_config_tracejudge.content | b64decode | from_json).tracejudge.auth_env.public_key
            == 'LANGFUSE_PUBLIC_KEY'
          - >-
            (_hatchet_worker_config_tracejudge.content | b64decode | from_json).tracejudge.auth_env.secret_key
            == 'LANGFUSE_SECRET_KEY'
          - >-
            (_hatchet_worker_config_tracejudge.content | b64decode | from_json).tracejudge.output_dir
            == '/tmp/hatchet/tracejudge'

    - name: Render compose with trace judging enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/docker-compose.yml.j2"
        dest: "{{ _hatchet_render_dir.path }}/compose-tracejudge.yml"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true
        hatchet_docker_worker_tracejudge_enabled: true
        hatchet_docker_worker_platforms: "{{ _hatchet_role_defaults.hatchet_docker_worker_chat_platforms }}"
        hatchet_docker_worker_tracejudge_cron: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_cron }}
        hatchet_docker_worker_tracejudge_sample_per_agent: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_sample_per_agent }}
        hatchet_docker_worker_tracejudge_platform: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_platform }}
        hatchet_docker_worker_tracejudge_langfuse_base_url: >-
          {{ hatchet_docker_eval_langfuse_host }}
        hatchet_docker_worker_tracejudge_slack_webhook_env: >-
          {{ _hatchet_role_defaults.hatchet_docker_worker_tracejudge_slack_webhook_env }}
        hatchet_docker_worker_tracejudge_output_dir: "{{ hatchet_docker_data_dir }}/tracejudge"

    - name: Read compose with trace judging enabled
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/compose-tracejudge.yml"
      register: _hatchet_compose_tracejudge

    - name: Assert trace judging mounts lessons and injects Langfuse and Slack credentials
      ansible.builtin.assert:
        that:
          - "'/tmp/hatchet/tracejudge:/tracejudge' in (_hatchet_compose_tracejudge.content | b64decode)"
          - "'LANGFUSE_PUBLIC_KEY: \"render-langfuse-public-key\"' in (_hatchet_compose_tracejudge.content | b64decode)"
          - "'LANGFUSE_SECRET_KEY: \"render-langfuse-secret-key\"' in (_hatchet_compose_tracejudge.content | b64decode)"
          - >-
            'SLACK_WEBHOOK_URL: "render-slack-webhook-placeholder"'
            in (_hatchet_compose_tracejudge.content | b64decode)
          - "(_hatchet_compose_tracejudge.content | b64decode).count('LANGFUSE_PUBLIC_KEY:') == 1"

    - name: Render the worker JSON configuration with evals
      ansible.builtin.template:
        src: "{{ _template_dir }}/gpu_fill_worker_config.json.j2"
        dest: "{{ _hatchet_render_dir.path }}/worker-evals.json"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true
        hatchet_docker_eval_enabled: true

    - name: Read and parse the worker JSON configuration with evals
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/worker-evals.json"
      register: _hatchet_worker_config_evals

    - name: Assert the eval config uses role defaults and configured schedules
      ansible.builtin.assert:
        that:
          - >-
            (_hatchet_worker_config_evals.content | b64decode | from_json).evals.cron
            == hatchet_docker_eval_cron
          - >-
            (_hatchet_worker_config_evals.content | b64decode | from_json).evals.judges_sync_cron
            == hatchet_docker_eval_judges_sync_cron
          - >-
            (_hatchet_worker_config_evals.content | b64decode | from_json).evals.prompts_dir
            == hatchet_docker_eval_prompts_dir
          - >-
            (_hatchet_worker_config_evals.content | b64decode | from_json).evals.roles
            == hatchet_docker_eval_roles

    - name: Render the worker JSON configuration without the latency guard
      ansible.builtin.template:
        src: "{{ _template_dir }}/gpu_fill_worker_config.json.j2"
        dest: "{{ _hatchet_render_dir.path }}/worker-no-guard.json"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true
        hatchet_docker_worker_latency_guard_enabled: false

    - name: Read the worker JSON configuration without the latency guard
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/worker-no-guard.json"
      register: _hatchet_worker_config_no_guard

    - name: Assert the disabled latency guard is omitted from worker config
      ansible.builtin.assert:
        that:
          - >-
            'latency_guard' not in
            (_hatchet_worker_config_no_guard.content | b64decode | from_json)
          - >-
            'evals' not in
            (_hatchet_worker_config_no_guard.content | b64decode | from_json)
          - >-
            'tracejudge' not in
            (_hatchet_worker_config_no_guard.content | b64decode | from_json)

    - name: Render the worker compose with evals enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/docker-compose.yml.j2"
        dest: "{{ _hatchet_render_dir.path }}/compose-evals.yml"
        mode: "0600"
      vars:
        hatchet_docker_worker_enabled: true
        hatchet_docker_eval_enabled: true

    - name: Read the worker compose with evals enabled
      ansible.builtin.slurp:
        src: "{{ _hatchet_render_dir.path }}/compose-evals.yml"
      register: _hatchet_compose_evals

    - name: Assert eval compose mounts prompts and injects package versions and env
      ansible.builtin.assert:
        that:
          - >-
            (hatchet_docker_data_dir ~ '/ai-llm-prompts:' ~ hatchet_docker_eval_prompts_dir ~ ':ro')
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            ('LANGFUSE_HOST: ' ~ (hatchet_docker_eval_langfuse_host | to_json))
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            ('LITELLM_BASE_URL: ' ~ (hatchet_docker_eval_litellm_base_url | to_json))
            in (_hatchet_compose_evals.content | b64decode)
          - "'LANGFUSE_PUBLIC_KEY: \"render-langfuse-public-key\"' in (_hatchet_compose_evals.content | b64decode)"
          - "'LANGFUSE_SECRET_KEY: \"render-langfuse-secret-key\"' in (_hatchet_compose_evals.content | b64decode)"
          - "'LITELLM_API_KEY: \"render-litellm-api-key\"' in (_hatchet_compose_evals.content | b64decode)"
          - >-
            ('AI_PROMPTS_DIR: ' ~ (hatchet_docker_eval_prompts_dir | to_json))
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            ('SOURCE_COMMIT: ' ~ (hatchet_docker_eval_prompts_ref | to_json))
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            ('langfuse==' ~ hatchet_docker_eval_langfuse_version)
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            ('pyyaml==' ~ hatchet_docker_eval_pyyaml_version)
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            'promptfoo@0.124.1"' in (_hatchet_compose_evals.content | b64decode)
          - >-
            'https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.gz'
            in (_hatchet_compose_evals.content | b64decode)
          - >-
            'b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406  /tmp/node.tar.gz'
            in (_hatchet_compose_evals.content | b64decode)
          - "'openrouter' not in (_hatchet_compose_evals.content | b64decode | lower)"

    - name: Remove the temporary render directory
      ansible.builtin.file:
        path: "{{ _hatchet_render_dir.path }}"
        state: absent
