---
# Shared render inputs for the Hatchet GPU fill worker template playbooks.
ansible_become: false
ingress_domain: 192.0.2.25
hatchet_docker_eval_cron: "{{ _hatchet_role_defaults.hatchet_docker_eval_cron }}"
hatchet_docker_eval_judges_sync_cron: "{{ _hatchet_role_defaults.hatchet_docker_eval_judges_sync_cron }}"
hatchet_docker_eval_roles: "{{ _hatchet_role_defaults.hatchet_docker_eval_roles }}"
hatchet_docker_eval_langfuse_host: "{{ _hatchet_role_defaults.hatchet_docker_eval_langfuse_host }}"
hatchet_docker_eval_litellm_base_url: "{{ _hatchet_role_defaults.hatchet_docker_eval_litellm_base_url }}"
hatchet_docker_eval_prompts_dir: "{{ _hatchet_role_defaults.hatchet_docker_eval_prompts_dir }}"
hatchet_docker_eval_prompts_ref: "{{ _hatchet_role_defaults.hatchet_docker_eval_prompts_ref }}"
hatchet_docker_eval_langfuse_version: "{{ _hatchet_role_defaults.hatchet_docker_eval_langfuse_version }}"
hatchet_docker_eval_pyyaml_version: "{{ _hatchet_role_defaults.hatchet_docker_eval_pyyaml_version }}"
hatchet_docker_eval_promptfoo_version: "{{ _hatchet_role_defaults.hatchet_docker_eval_promptfoo_version }}"
hatchet_docker_eval_node_version: "{{ _hatchet_role_defaults.hatchet_docker_eval_node_version }}"
hatchet_docker_eval_node_linux_x64_sha256: "{{ _hatchet_role_defaults.hatchet_docker_eval_node_linux_x64_sha256 }}"
hatchet_docker_data_dir: /tmp/hatchet
hatchet_docker_migrate_image: HATCHET_MIGRATE_IMAGE
hatchet_docker_admin_image: HATCHET_ADMIN_IMAGE
hatchet_docker_engine_image: HATCHET_ENGINE_IMAGE
hatchet_docker_dashboard_image: HATCHET_DASHBOARD_IMAGE
hatchet_docker_db_host: 192.0.2.20
hatchet_docker_db_port: 5432
hatchet_docker_db_user: hatchet
hatchet_docker_db_password: render-test-placeholder
hatchet_docker_db_name: hatchet
hatchet_docker_db_ssl_mode: disable
hatchet_docker_server_auth_cookie_secrets: render-cookie-placeholder-a render-cookie-placeholder-b
hatchet_docker_fqdn: 192.0.2.21
hatchet_docker_server_encryption_master_keyset: render-master-keyset-placeholder
hatchet_docker_server_encryption_jwt_private_keyset: render-private-keyset-placeholder
hatchet_docker_server_encryption_jwt_public_keyset: render-public-keyset-placeholder
hatchet_docker_server_url: https://192.0.2.21
hatchet_docker_grpc_container_port: 7070
hatchet_docker_engine_broadcast_address: 192.0.2.22:443
hatchet_docker_admin_email: admin@192.0.2.21
hatchet_docker_admin_password: render-admin-placeholder
hatchet_docker_admin_name: Hatchet Admin
hatchet_docker_web_port: 8888
hatchet_docker_grpc_port: 7077
hatchet_docker_health_port: 18733
hatchet_docker_ui_container_port: 80
hatchet_docker_api_container_port: 8080
hatchet_docker_health_container_port: 8733
hatchet_docker_restart_policy: unless-stopped
hatchet_docker_worker_image: >-
  python:3.13.18-slim-trixie@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
hatchet_docker_worker_sdk_version: "1.44.0"
hatchet_docker_worker_latency_guard_enabled: true
hatchet_docker_worker_latency_guard_prometheus_url: http://192.0.2.23:9090
hatchet_docker_worker_latency_guard_query: sum(rate(requests_total[5m]))
hatchet_docker_worker_latency_guard_max_ratio: 1.2
hatchet_docker_eval_enabled: false
hatchet_docker_worker_fill_enabled: false
hatchet_docker_worker_release_digest_enabled: false
hatchet_docker_worker_release_digest_cron: "23 11 * * *"
hatchet_docker_worker_release_digest_chat_platform: pro6000-direct
hatchet_docker_worker_release_digest_auth_env: SLACK_RELEASE_DIGEST_WEBHOOK
hatchet_docker_worker_release_digest_repositories: []
hatchet_docker_worker_fill_roles: {}
hatchet_docker_worker_fill_cron: "{{ _hatchet_role_defaults.hatchet_docker_worker_fill_cron }}"
hatchet_docker_worker_fill_corpus_dir: "{{ _hatchet_role_defaults.hatchet_docker_worker_fill_corpus_dir }}"
hatchet_docker_worker_fill_output_dir: "{{ _hatchet_role_defaults.hatchet_docker_worker_fill_output_dir }}"
hatchet_docker_worker_fill_corpus_host_dir: >-
  {{ _hatchet_role_defaults.hatchet_docker_worker_fill_corpus_host_dir }}
hatchet_docker_worker_fill_output_host_dir: >-
  {{ _hatchet_role_defaults.hatchet_docker_worker_fill_output_host_dir }}
hatchet_docker_worker_roles:
  medium:
    max_runs: 3
hatchet_docker_worker_platforms:
  - name: hermes
    run_url: https://192.0.2.24/run
    auth_env: HERMES_API_TOKEN
    auth_secret_key: hermes_api_token
    timeout_s: 120
  - name: pro6000-direct
    kind: chat
    base_url: https://router.example.invalid/v1
    model: pro6000-direct
    max_tokens: 1024
    auth_env: GPU_FILL_ROUTER_API_KEY
    auth_secret_key: gpu_fill_llm_router_key
    timeout_s: 300
bao_apps_secrets:
  hatchet_worker_token: render-worker-token-placeholder
  hermes_api_token: render-platform-token-placeholder
  hatchet_eval_langfuse_public_key: render-langfuse-public-key
  hatchet_eval_langfuse_secret_key: render-langfuse-secret-key
  hatchet_eval_litellm_api_key: render-litellm-api-key
  gpu_fill_llm_router_key: render-gpu-fill-router-key
bao_ntfy_secrets:
  homelab_ops: https://hooks.example.invalid/slack-digest-placeholder
platform_alerts_slack_webhook_key: homelab_ops
_template_dir: "{{ playbook_dir }}/../../roles/hatchet_docker/templates"
