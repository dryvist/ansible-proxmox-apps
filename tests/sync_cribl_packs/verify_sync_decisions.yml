---
# Verifies the repo-name filter and the needs_sync decision logic from
# playbooks/tasks/sync-cribl-packs/discover-and-resolve.yml and
# sync-and-publish.yml, without touching the network or object storage.
#
# Run: ansible-playbook -i localhost, tests/sync_cribl_packs/verify_sync_decisions.yml
- name: Test cc- repo-name filtering
  hosts: localhost
  gather_facts: false
  vars:
    org_repos:
      - {name: cc-stream-unifi-firewall-io}
      - {name: cc-edge-vscode-io}
      - {name: not-a-pack}
      - {name: homelab-contracts}
      - {name: cc-stream-unifi-firewall-io} # duplicate: a second page re-listing the same repo
  tasks:
    - name: Filter to cc-* names, deduped and sorted
      ansible.builtin.set_fact:
        filtered: >-
          {{ org_repos | map(attribute='name') | select('match', '^cc-')
             | unique | sort | list }}

    - name: Only cc-* repos survive, deduplicated
      ansible.builtin.assert:
        that:
          - filtered == ['cc-edge-vscode-io', 'cc-stream-unifi-firewall-io']
        fail_msg: "unexpected filtered set: {{ filtered }}"
        success_msg: "cc- filter is correct: {{ filtered }}"

- name: Test org repo page continuation decisions
  hosts: localhost
  gather_facts: false
  vars:
    cribl_packs_list_org: dryvist
    cases:
      - name: short-page
        entries: 99
        page: 1
        expect: false
      - name: full-first-page
        entries: 100
        page: 1
        expect: true
      - name: empty-page
        entries: 0
        page: 1
        expect: false
      - name: full-fifth-page
        entries: 100
        page: 5
        expect: false
  tasks:
    - name: Continue only for full pages below the page cap
      ansible.builtin.assert:
        that:
          - >-
            (cribl_packs_org_page.json | length == 100
            and cribl_packs_org_pages[cribl_packs_list_org] < 5) == item.expect
        fail_msg: "case {{ item.name }}: unexpected page continuation decision"
        success_msg: "case {{ item.name }}: OK"
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cribl_packs_org_page:
          json: "{{ range(0, item.entries) | list }}"
        cribl_packs_org_pages:
          dryvist: "{{ item.page }}"

- name: Test GitHub token source selection
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      - name: mint-with-env-token
        bao_addr: http://openbao.test
        bao_token: test-token
        vault_token: ''
        github_token: FAKE-env
        expect_source: openbao
        expect_available: true
      - name: mint-with-vault-token
        bao_addr: http://openbao.test
        bao_token: ''
        vault_token: test-token
        github_token: ''
        expect_source: openbao
        expect_available: true
      - name: env-token
        bao_addr: ''
        bao_token: ''
        vault_token: ''
        github_token: FAKE-env
        expect_source: env
        expect_available: true
      - name: incomplete-openbao-env-fallback
        bao_addr: http://openbao.test
        bao_token: ''
        vault_token: ''
        github_token: FAKE-env
        expect_source: env
        expect_available: true
      - name: no-token-source
        bao_addr: ''
        bao_token: ''
        vault_token: ''
        github_token: ''
        expect_source: missing
        expect_available: false
  tasks:
    - name: Resolve source availability using the production predicates
      ansible.builtin.assert:
        that:
          - >-
            (cribl_packs_github_bao_addr | length > 0
            and cribl_packs_github_bao_token | length > 0)
            == cribl_packs_github_bao_enabled
          - (cribl_packs_github_env_token | length > 0) == cribl_packs_github_env_enabled
          - >-
            ('openbao' if cribl_packs_github_bao_enabled
            else 'env' if cribl_packs_github_env_enabled else 'missing')
            == cribl_packs_github_token_source
          - (cribl_packs_github_token_source != 'missing') == item.expect_available
          - cribl_packs_github_token_source == item.expect_source
        fail_msg: "case {{ item.name }}: unexpected token source decision"
        success_msg: "case {{ item.name }}: OK (source={{ item.expect_source }})"
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cribl_packs_github_bao_addr: "{{ item.bao_addr }}"
        cribl_packs_github_bao_token: "{{ item.bao_token | default(item.vault_token, true) }}"
        cribl_packs_github_env_token: "{{ item.github_token }}"
        cribl_packs_github_bao_enabled: >-
          {{ cribl_packs_github_bao_addr | length > 0 and cribl_packs_github_bao_token | length > 0 }}
        cribl_packs_github_env_enabled: "{{ cribl_packs_github_env_token | length > 0 }}"
        cribl_packs_github_token_source: >-
          {{ 'openbao' if cribl_packs_github_bao_enabled
             else 'env' if cribl_packs_github_env_enabled else 'missing' }}

- name: Test per-org minted GitHub token selection
  hosts: localhost
  gather_facts: false
  vars:
    cribl_packs_github_orgs: [dryvist, jpe-cribl]
    cribl_packs_github_token_source: openbao
    cribl_packs_github_minted_tokens:
      dryvist: FAKE-dryvist
      jpe-cribl: FAKE-jpe-cribl
  tasks:
    - name: Initialize selected test tokens
      ansible.builtin.set_fact:
        cribl_packs_github_tokens: {}
      no_log: true

    - name: Select minted test tokens using the production expression
      ansible.builtin.set_fact:
        cribl_packs_github_tokens: >-
          {{ cribl_packs_github_tokens | combine({
            cribl_packs_token_org:
              cribl_packs_github_minted_tokens[cribl_packs_token_org]
              if cribl_packs_github_token_source == 'openbao'
              else cribl_packs_github_env_token
          }) }}
      loop: "{{ cribl_packs_github_orgs }}"
      loop_control:
        loop_var: cribl_packs_token_org
      no_log: true

    - name: Verify listing and release tokens use their owning org
      ansible.builtin.assert:
        that:
          - >-
            {'Authorization': 'Bearer ' ~ cribl_packs_github_tokens[cribl_packs_list_org]}
            == {'Authorization': 'Bearer FAKE-dryvist'}
          - >-
            {'Authorization': 'Bearer ' ~ cribl_packs_github_tokens[item.split('/')[0]]}
            == {'Authorization': 'Bearer FAKE-jpe-cribl'}
        quiet: true
      vars:
        cribl_packs_list_org: dryvist
      loop: [jpe-cribl/cc-pack]
      no_log: true

- name: Test single environment GitHub token selection
  hosts: localhost
  gather_facts: false
  vars:
    cribl_packs_github_orgs: [dryvist, jpe-cribl]
    cribl_packs_github_token_source: env
    cribl_packs_github_env_token: FAKE-env
  tasks:
    - name: Initialize selected test tokens
      ansible.builtin.set_fact:
        cribl_packs_github_tokens: {}
      no_log: true

    - name: Select environment test tokens using the production expression
      ansible.builtin.set_fact:
        cribl_packs_github_tokens: >-
          {{ cribl_packs_github_tokens | combine({
            cribl_packs_token_org:
              cribl_packs_github_minted_tokens[cribl_packs_token_org]
              if cribl_packs_github_token_source == 'openbao'
              else cribl_packs_github_env_token
          }) }}
      loop: "{{ cribl_packs_github_orgs }}"
      loop_control:
        loop_var: cribl_packs_token_org
      no_log: true

    - name: Verify every org uses the single environment token
      ansible.builtin.assert:
        that:
          - >-
            {'Authorization': 'Bearer ' ~ cribl_packs_github_tokens[cribl_packs_list_org]}
            == {'Authorization': 'Bearer FAKE-env'}
          - >-
            {'Authorization': 'Bearer ' ~ cribl_packs_github_tokens[item.split('/')[0]]}
            == {'Authorization': 'Bearer FAKE-env'}
        quiet: true
      vars:
        cribl_packs_list_org: dryvist
      loop: [jpe-cribl/cc-pack]
      no_log: true

- name: Test extra GitHub orgs from the environment
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      - name: empty
        raw: ''
        expect: [dryvist, jpe-cribl]
      - name: one-extra
        raw: extra-one
        expect: [dryvist, jpe-cribl, extra-one]
      - name: whitespace-empty-entries-and-duplicate
        raw: ' extra-one , ,extra-two,dryvist '
        expect: [dryvist, jpe-cribl, extra-one, extra-two]
  tasks:
    - name: Resolve extra orgs using the production expression
      ansible.builtin.assert:
        that:
          - cribl_packs_github_orgs == item.expect
        fail_msg: "case {{ item.name }}: unexpected org list {{ cribl_packs_github_orgs }}"
        success_msg: "case {{ item.name }}: OK"
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cribl_packs_extra_orgs_raw: "{{ item.raw }}"
        cribl_packs_github_orgs: >-
          {{ (['dryvist', 'jpe-cribl'] +
              (cribl_packs_extra_orgs_raw | split(',') | map('trim')
               | reject('equalto', '') | list)) | unique | list }}

    - name: Verify the production playbook uses the environment variable and unique filter
      ansible.builtin.assert:
        that:
          - "'CRIBL_PACKS_EXTRA_GITHUB_ORGS' in cribl_packs_sync_playbook"
          - "'unique' in cribl_packs_sync_playbook"
        quiet: true
      vars:
        cribl_packs_sync_playbook: >-
          {{ lookup('file', playbook_dir ~ '/../../playbooks/sync-cribl-packs.yml') }}

- name: Test every GitHub request task hides its result
  hosts: localhost
  gather_facts: false
  vars:
    task_dir: "{{ playbook_dir }}/../../playbooks/tasks/sync-cribl-packs"
    task_files: [list-org-repos.yml, discover-and-resolve.yml, mint-github-tokens.yml]
  tasks:
    - name: Load every sync task file
      ansible.builtin.set_fact:
        loaded_tasks: >-
          {{ loaded_tasks | default([])
             + (lookup('ansible.builtin.file', task_dir ~ '/' ~ item) | from_yaml) }}
      loop: "{{ task_files }}"

    - name: Find the tasks that send an Authorization header
      ansible.builtin.set_fact:
        header_tasks: "{{ header_tasks | default([]) + [item] }}"
      loop: "{{ loaded_tasks }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      when: "'Authorization' in (item | to_json)"

    - name: The check is not vacuous
      ansible.builtin.assert:
        that:
          - header_tasks | default([]) | length == 2
        quiet: true

    - name: No Authorization-bearing task shows its result
      ansible.builtin.assert:
        that:
          - item.no_log | default(false) | bool
        fail_msg: "task {{ item.name }} sends an Authorization header without no_log"
        quiet: true
      loop: "{{ header_tasks }}"
      loop_control:
        label: "{{ item.name }}"

- name: Test needs_sync decisions (object-storage tag vs resolved latest)
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      # No object in the bucket yet -> MUST sync
      - name: missing-object
        item: {rc: 1, stdout: "", item: {name: a, desired_version: v1.0.0}}
        expect: true
      # Bucket tag matches resolved latest -> already current, skip
      - name: already-current
        item: {rc: 0, stdout: "v1.0.0", item: {name: a, desired_version: v1.0.0}}
        expect: false
      # Bucket tag is an older release -> MUST sync
      - name: drifted
        item: {rc: 0, stdout: "v0.9.0", item: {name: a, desired_version: v1.0.0}}
        expect: true
      # Trailing whitespace from `aws ... --output text` must not force a
      # spurious re-sync of an already-current pack.
      - name: whitespace-tolerant
        item: {rc: 0, stdout: "v1.0.0\n", item: {name: a, desired_version: v1.0.0}}
        expect: false
  tasks:
    - name: Evaluate needs_sync for each case
      ansible.builtin.assert:
        that:
          - >-
            (
              item.item.rc != 0
              or (item.item.stdout | default('') | trim) != (item.item.item.desired_version | string | trim)
            ) == item.expect
        fail_msg: "case {{ item.name }}: expected needs_sync={{ item.expect }}"
        success_msg: "case {{ item.name }}: OK (needs_sync={{ item.expect }})"
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"
