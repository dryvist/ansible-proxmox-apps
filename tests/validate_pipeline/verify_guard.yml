---
- name: Set skipped-container input for summary guard tests
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Provide skipped containers to the summary play
      ansible.builtin.set_fact:
        add_lxc_hosts_skipped_containers: "{{ validate_pipeline_test_skipped | default([]) }}"

- name: Run the production summary and unavailable-container guard
  import_playbook: ../../playbooks/validate-pipeline/summary.yml
