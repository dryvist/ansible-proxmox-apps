---
# Nautobot seed-bundle assembly verification (offline).
#
# Usage:
#   ansible-playbook tests/nautobot_seed/verify_seed_bundle.yml -c local
#
# Covers roles/nautobot/tasks/seed_bundle.yml, which Molecule cannot: the role's
# Molecule scenario pins nautobot_build_seed false because the bundle stamps
# generated_at and would break idempotence.
#
# Asserts that each source contributes independently:
#   - tofu inventory alone builds the virtual_machines slice
#   - the sibling-repo sources stay absent without failing the run
#   - the nodes slice takes `commissioned` and the emitted `name` from the
#     desired-state object, keyed by the live node name rather than the
#     inventory host key
#   - an all-sources-absent run fails loudly instead of writing an empty bundle
#
# The bundle is written to a temp path, never to a real Nautobot guest.

- name: Verify nautobot seed-bundle assembly
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # inventory/group_vars/all.yml sets ansible_become: true estate-wide and
    # localhost inherits it, but this play only writes a bundle into a temp dir
    # as the current user. It must be the `ansible_become` var, not the
    # `become:` play keyword — the connection variable wins, so the keyword is
    # silently ignored. tests/template_render opts out the same way.
    ansible_become: false
    # This playbook exercises ASSEMBLY, one source at a time, so most slices are
    # legitimately empty in it. The per-array guard is covered on its own in
    # verify_empty_array_guard.yml; exempting every core class keeps it inert
    # here rather than turning each single-source scenario into a failure.
    nautobot_seed_core_arrays: [nodes, devices, virtual_machines]
    nautobot_seed_allow_empty: [nodes, devices, virtual_machines]
    # Stands in for what inventory/load_tofu.yml delegates to localhost. Two
    # guest kinds, one leased (ip carries an FQDN, because the lease is the only
    # authority for its address) and one static, so both branches are exercised.
    # Addresses are RFC 5737 documentation values, not homelab values.
    seed_test_tofu_data:
      containers:
        seed-test-ct:
          hostname: seed-test-ct
          vmid: 999001
          node: proxmox1
          tags:
            - container
            - testing
          mac: "02:00:00:00:00:01"
          ip: "seed-test-ct.example.invalid"
      vms:
        seed-test-vm:
          hostname: seed-test-vm
          vmid: 999002
          node: proxmox2
          tags: []
          mac: "02:00:00:00:00:02"
          ip: "192.0.2.12"

    # Role vars the tasks read. All sibling-repo sources deliberately unset —
    # this is the tofu-only path.
    nautobot_seed_sops_path: ""
    nautobot_seed_fixed_ips_path: ""
    nautobot_seed_hosts_yml_path: ""
    nautobot_seed_hardware_path: ""
    # Absent, like the other sibling sources — which for drives is not merely
    # "contributes nothing": the drive sync DELETES what it stops seeing, so an
    # absent path must leave the slice empty AND leave the job unenrolled,
    # rather than publish an empty slice. Asserted below.
    nautobot_seed_drives_path: ""
    nautobot_seed_networks: []
    nautobot_seed_racks: []
    nautobot_seed_hosts_group: proxmox
    # The bundle lands in a temp dir owned by whoever runs the test, so leave
    # ownership alone — the nautobot user/group only exists on the real guest.
    nautobot_user: "{{ omit }}"
    nautobot_group: "{{ omit }}"

  tasks:
    - name: Build the bundle from the tofu inventory alone
      vars:
        nautobot_seed_file: "{{ seed_tmp.path }}/nautobot_seed.json"
      block:
        - name: Publish the tofu inventory as a host fact, as load_tofu.yml does
          ansible.builtin.set_fact:
            tofu_data: "{{ seed_test_tofu_data }}"

        - name: Create a temp dir for the rendered bundle
          ansible.builtin.tempfile:
            state: directory
            suffix: nautobot-seed
          register: seed_tmp

        - name: Assemble the seed bundle
          ansible.builtin.include_tasks: ../../roles/nautobot/tasks/seed_bundle.yml

        - name: Read the rendered bundle back
          ansible.builtin.slurp:
            src: "{{ seed_tmp.path }}/nautobot_seed.json"
          register: seed_rendered

        - name: Parse the rendered bundle
          ansible.builtin.set_fact:
            seed_bundle: "{{ seed_rendered.content | b64decode | from_json }}"

        - name: Both guests reach virtual_machines with vmid, node and tags intact
          vars:
            seed_vms: "{{ seed_bundle.virtual_machines | items2dict(key_name='name', value_name='vmid') }}"
            seed_ct: >-
              {{ seed_bundle.virtual_machines
                 | selectattr('name', 'equalto', 'seed-test-ct') | first }}
            seed_vm: >-
              {{ seed_bundle.virtual_machines
                 | selectattr('name', 'equalto', 'seed-test-vm') | first }}
          ansible.builtin.assert:
            that:
              - seed_bundle.virtual_machines | length == 2
              - seed_vms['seed-test-ct'] | int == 999001
              - seed_ct.cluster == 'proxmox1'
              - seed_ct.tags == ['container', 'testing']
              # Leased guest: no address is recorded, because none exists
              # outside the lease. ip_type keeps the distinction honest rather
              # than inventing an address to fill the field.
              - seed_ct.ip == ''
              - seed_ct.ip_type == 'dhcp'
              - seed_ct.role == 'container'
              # Static guest with no tags falls back to the 'vm' role, and its
              # address is statically configured rather than reserved.
              - seed_vm.ip == '192.0.2.12'
              - seed_vm.ip_type == 'host'
              - seed_vm.role == 'vm'
              - seed_vm.cluster == 'proxmox2'
            fail_msg: >-
              The tofu inventory did not survive assembly into virtual_machines.
            quiet: true

        - name: Slices with no source are present and empty, never missing
          ansible.builtin.assert:
            that:
              - seed_bundle.devices | length == 0
              - seed_bundle.nodes | length == 0
              - seed_bundle.reservations | length == 0
              - seed_bundle.vlans | length == 0
              - seed_bundle.prefixes | length == 0
              - seed_bundle.drives | length == 0
              - seed_bundle.schema_version == '1.0.0'
            fail_msg: >-
              An absent source must yield an empty slice, not a missing key —
              ssot_common.load_seed keys off these names.
            quiet: true

        # `drives` is the one slice whose emptiness is dangerous rather than
        # inert: its sync deletes what it stops seeing. An absent path must
        # still produce the KEY (so load_seed does not invent it) while the
        # runner leaves the job unenrolled — the two together are what make an
        # ungathered estate converge quietly instead of wiping the inventory.
        - name: The drives key exists even with no source
          ansible.builtin.assert:
            that:
              - "'drives' in seed_bundle"
            fail_msg: >-
              The bundle has no `drives` key at all. load_seed would default it,
              but the bundle is the contract and a missing key hides whether the
              gathering role ran.
            quiet: true
      always:
        - name: Remove the temp dir
          ansible.builtin.file:
            path: "{{ seed_tmp.path }}"
            state: absent
          when: seed_tmp.path is defined

    # The desired-state object is keyed by LIVE node name; the hosts inventory
    # is keyed by inventory host name, and the two are diverging as the
    # inventory keys get renamed. `inv-a` below is the trap: the desired-state
    # object carries BOTH a live-name entry (uncommissioned, renaming the node
    # to `dev-a`) and a decoy entry under the inventory key (commissioned,
    # renaming to `decoy-a`), so a lookup by the wrong key reads as commissioned
    # and emits the wrong name, failing this test either way.
    - name: The nodes slice reads commissioned and name from the desired state by live node name
      vars:
        nautobot_seed_hosts_yml_path: "{{ nodes_tmp.path }}/hosts.yml"
        nautobot_seed_file: "{{ nodes_tmp.path }}/nautobot_seed.json"
      block:
        - name: Create a temp dir for the hosts inventory and the bundle
          ansible.builtin.tempfile:
            state: directory
            suffix: nautobot-seed-nodes
          register: nodes_tmp

        - name: Publish a desired state carrying the node commissioning flags
          ansible.builtin.set_fact:
            tofu_data:
              nodes:
                live-a:
                  commissioned: false
                  nautobot_device_name: dev-a
                inv-a:
                  commissioned: true
                  nautobot_device_name: decoy-a
                live-b:
                  commissioned: true
                  nautobot_device_name: null

        - name: Write a hosts inventory whose keys differ from the live node names
          ansible.builtin.copy:
            dest: "{{ nodes_tmp.path }}/hosts.yml"
            mode: "0600"
            content: |
              ---
              all:
                children:
                  proxmox:
                    hosts:
                      inv-a:
                        ansible_host: 192.0.2.21
                        proxmox_node_name: live-a
                      inv-b:
                        ansible_host: 192.0.2.22
                        proxmox_node_name: live-b
                      inv-c:
                        ansible_host: 192.0.2.23

        - name: Assemble the seed bundle from the hosts inventory
          ansible.builtin.include_tasks: ../../roles/nautobot/tasks/seed_bundle.yml

        - name: Parse the rendered bundle
          ansible.builtin.set_fact:
            nodes_bundle: >-
              {{ lookup('ansible.builtin.file', nodes_tmp.path ~ '/nautobot_seed.json') | from_json }}

        - name: Commissioning and name follow the desired state, and the rest of the node fields survive
          vars:
            nodes_by_name: >-
              {{ dict(nodes_bundle.nodes | map(attribute='name')
                      | zip(nodes_bundle.nodes)) }}
          ansible.builtin.assert:
            that:
              - nodes_bundle.nodes | length == 3
              # nautobot_device_name on the live-name entry wins over both the
              # inventory key and the decoy entry's name.
              - "'dev-a' in nodes_by_name"
              - "'inv-a' not in nodes_by_name"
              - "'decoy-a' not in nodes_by_name"
              # Live name says uncommissioned; the inventory-key decoy says the
              # opposite, so `false` here proves the live-name lookup.
              - nodes_by_name['dev-a'].commissioned == false
              - nodes_by_name['dev-a'].role == 'pve-node'
              - nodes_by_name['dev-a'].mgmt_ip == '192.0.2.21'
              # Entry present but nautobot_device_name unset: the inventory key
              # is the name, and the other fields are unaffected.
              - nodes_by_name['inv-b'].commissioned == true
              - nodes_by_name['inv-b'].role == 'pve-node'
              - nodes_by_name['inv-b'].mgmt_ip == '192.0.2.22'
              # Absent from the desired-state nodes map: inventory key, and
              # default to commissioned.
              - nodes_by_name['inv-c'].commissioned == true
              - nodes_by_name['inv-c'].mgmt_ip == '192.0.2.23'
            fail_msg: >-
              The nodes slice did not take commissioned and name from the
              desired-state object keyed by the live node name.
            quiet: true
      always:
        - name: Remove the nodes temp dir
          ansible.builtin.file:
            path: "{{ nodes_tmp.path }}"
            state: absent
          when: nodes_tmp.path is defined

    - name: An all-sources-absent build fails instead of writing an empty bundle
      vars:
        nautobot_seed_file: /dev/null
      block:
        - name: Drop the tofu inventory so no source remains
          ansible.builtin.set_fact:
            tofu_data: {}

        - name: Assemble with every source absent
          ansible.builtin.include_tasks: ../../roles/nautobot/tasks/seed_bundle.yml

        - name: Reaching here means the guard did not fire
          ansible.builtin.fail:
            msg: >-
              seed_bundle.yml built a bundle with no source available; the
              "at least one seed source" assert should have failed the run.
      rescue:
        - name: Confirm the failure was the source guard, not an unrelated error
          ansible.builtin.assert:
            that:
              - "'no seed source is available' in (ansible_failed_result.msg | default('') | string)"
            fail_msg: >-
              Expected the "no seed source is available" assert, got:
              {{ ansible_failed_result.msg | default('(no message)') }}
            quiet: true
