---
# The production status playbook uses dynamic include_role so --list-tasks
# stops at "Include status_stack role". Import the real role statically here
# to expose its tasks to Ansible's own tag selection without running them.
- name: List production status_stack role tasks
  hosts: status_group
  gather_facts: false
  tasks:
    - name: Import status_stack role tasks
      ansible.builtin.import_role:
        name: status_stack
