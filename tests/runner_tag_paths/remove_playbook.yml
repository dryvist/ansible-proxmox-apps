---
# Runs the real roles/github_runner/tasks/remove_containers.yml against a
# `docker` stub that tests/test_github_runner_tag_paths.py puts first on PATH.
- name: Run the runner container removal against a stubbed docker
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # inventory/group_vars/all.yml turns become on; the stub needs no root.
    ansible_become: false
    github_runner_container_prefix: github-runner
  tasks:
    - name: Run the removal
      ansible.builtin.include_tasks: ../../roles/github_runner/tasks/remove_containers.yml
