---
# Fixture for tests/test_github_runner_tag_paths.py: the tag structure of
# playbooks/site/04b-github-runners.yml and the runner_prune_now /
# runner_container_audit imports in roles/github_runner/tasks/main.yml, with
# debug markers in place of the real tasks. The test asserts the real files
# carry the same tags, so this run proves what the real converge selects.
- name: Fixture play mimicking playbooks/site/04b-github-runners.yml
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - github_runner
    - ci
    - openbao
  tasks:
    - name: Converge the fixture role (isolated)
      block:
        - name: Include fixture role
          ansible.builtin.include_role:
            name: fixture_runner
            apply:
              tags: [github_runner, ci, openbao]
          tags: [runner_prune_now, runner_container_audit]
      rescue:
        - name: Record isolated failure and continue
          ansible.builtin.include_tasks:
            file: ../../playbooks/tasks/record_isolated_failure.yml
            apply:
              tags: [github_runner, ci, openbao, runner_prune_now, runner_container_audit]
          tags: [runner_prune_now, runner_container_audit]
          vars:
            _isolated_play_name: github_runner

    - name: Report recorded isolated failures
      ansible.builtin.debug:
        msg: "MARKER:RECORDED={{ site_isolated_failures | default([]) | length }}"
      tags: [always]
