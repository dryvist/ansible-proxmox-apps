---
# Runs the real roles/github_runner/tasks/container_audit.yml against a
# `docker` stub that tests/test_github_runner_tag_paths.py puts first on PATH.
- name: Run the runner container audit against a stubbed docker
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # inventory/group_vars/all.yml turns become on; the stub needs no root.
    ansible_become: false
    github_runner_container_prefix: github-runner
    github_runner_review_slots: 2
  tasks:
    - name: Run the audit
      ansible.builtin.include_tasks: ../../roles/github_runner/tasks/container_audit.yml

    - name: Write the audit rows for the test to read
      ansible.builtin.copy:
        content: "{{ github_runner_audit | to_json }}"
        dest: "{{ audit_out }}"
        mode: "0600"
