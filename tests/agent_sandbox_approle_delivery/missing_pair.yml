---
- name: Run the credentials tag without a pair
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    openbao_platform_env_doc: {}
  tasks:
    - name: Include agent_sandbox role
      ansible.builtin.include_role:
        name: agent_sandbox
        apply:
          tags:
            - agent_sandbox
      tags:
        - agent_sandbox_credentials
