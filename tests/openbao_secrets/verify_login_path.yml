---
# Proves the openbao_secrets login-path decision against the PRODUCTION task
# file (roles/openbao_secrets/tasks/login_path.yml) for one issuer domain that
# also holds a stored pair. tests/test_openbao_secrets_login_path.py runs it
# with and without flow-lock on PATH and passes the expected path.
#
# Run: ansible-playbook -i localhost, -c local tests/openbao_secrets/verify_login_path.yml \
#        -e issuer_available=true -e expect_use_issuer=false

- name: Verify the openbao_secrets login-path decision
  hosts: localhost
  gather_facts: false
  vars:
    openbao_domain:
      name: harness
      workstation_issuer_role: harness-workstation
    openbao_secrets_domain_role_id: fixture-role-id
    openbao_secrets_domain_secret_id: fixture-secret-id
    openbao_secrets_domain_issuer_available: "{{ issuer_available | bool }}"
  tasks:
    - name: Include the production login-path decision
      ansible.builtin.include_tasks: ../../roles/openbao_secrets/tasks/login_path.yml

    - name: Assert the login path
      ansible.builtin.assert:
        that:
          - (openbao_secrets_domain_use_issuer | bool) == (expect_use_issuer | bool)
          - openbao_secrets_domain_login_configured | bool
        fail_msg: >-
          use_issuer={{ openbao_secrets_domain_use_issuer }},
          expected {{ expect_use_issuer }}.
        success_msg: "login path as expected: use_issuer={{ openbao_secrets_domain_use_issuer }}"
        quiet: true
