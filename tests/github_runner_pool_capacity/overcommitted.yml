---
# Fixture for tests/test_github_runner_pool_capacity.py: a 4 vCPU / 8 GiB
# host asked to run the default 3-slot pool, a default review pool, and the
# enabled heavy pool. The gate must fail the converge with the summed
# numbers. Every input is declared here rather than loaded from the role
# defaults, so the fixture is independent of how play vars and vars_files
# merge; the review pool lists no overrides on purpose, exercising the
# role-wide defaults in the sum.
- name: Over-commit every runner pool on one small host
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    # The capacity facts as a real converge would have gathered them.
    ansible_processor_vcpus: 4
    ansible_memtotal_mb: 8192
    github_runner_replicas: 3
    github_runner_cpu_limit: "1.0"
    github_runner_memory_limit: "4g"
    github_runner_labels_common: "self-hosted,Linux,X64"
    github_runner_active_review_orgs:
      - org: example-org-a
    github_runner_heavy_pool_enabled: true
    github_runner_heavy_pool_replicas: 1
    github_runner_heavy_pool_label: heavy
    github_runner_heavy_pool_cpu_limit: "8.0"
    github_runner_heavy_pool_memory_limit: "24g"
    github_runner_host_cpu_reserve: 1
    github_runner_host_memory_reserve_mb: 2048

  tasks:
    - name: Run the capacity gate
      ansible.builtin.include_tasks: ../../roles/github_runner/tasks/validate_pool_limits.yml
