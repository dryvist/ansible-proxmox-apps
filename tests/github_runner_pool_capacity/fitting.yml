---
# Fixture for tests/test_github_runner_pool_capacity.py: the default 3-slot
# pool on a host big enough for it. The gate must pass, proving it does not
# fail every declaration -- and with the heavy pool left disabled, that a
# disabled pool adds no demand.
- name: Fit the standard pool inside one host
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    # The capacity facts as a real converge would have gathered them.
    ansible_processor_vcpus: 8
    ansible_memtotal_mb: 32768
    github_runner_replicas: 3
    github_runner_cpu_limit: "1.0"
    github_runner_memory_limit: "4g"
    github_runner_labels_common: "self-hosted,Linux,X64"
    github_runner_active_review_orgs: []
    github_runner_heavy_pool_enabled: false
    github_runner_heavy_pool_replicas: 1
    github_runner_heavy_pool_label: heavy
    github_runner_heavy_pool_cpu_limit: "8.0"
    github_runner_heavy_pool_memory_limit: "24g"
    github_runner_host_cpu_reserve: 1
    github_runner_host_memory_reserve_mb: 2048

  tasks:
    - name: Run the capacity gate
      ansible.builtin.include_tasks: ../../roles/github_runner/tasks/validate_pool_limits.yml
