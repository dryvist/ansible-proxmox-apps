---
# Fixture for tests/test_github_runner_pool_capacity.py: a host that cannot
# report its capacity. No capacity facts are declared, fact gathering is off,
# and the interpreter does not exist, so the gate's own gathering fails. The
# gate must still fail closed with its own message.
- name: Refuse a host whose capacity cannot be read
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    ansible_python_interpreter: /nonexistent/python3
    github_runner_replicas: 1
    github_runner_cpu_limit: "0.1"
    github_runner_memory_limit: "64m"
    github_runner_labels_common: "self-hosted,Linux,X64"
    github_runner_active_review_orgs: []
    github_runner_heavy_pool_enabled: false
    github_runner_heavy_pool_replicas: 1
    github_runner_heavy_pool_label: heavy
    github_runner_heavy_pool_cpu_limit: "8.0"
    github_runner_heavy_pool_memory_limit: "24g"
    github_runner_host_cpu_reserve: 0
    github_runner_host_memory_reserve_mb: 0

  tasks:
    # A fact cache from an earlier run would supply the facts and let the gate
    # pass; start from none whatever cache the caller configured.
    - name: Clear any cached facts so the gate starts without them
      ansible.builtin.meta: clear_facts

    - name: Run the capacity gate
      ansible.builtin.include_tasks: ../../roles/github_runner/tasks/validate_pool_limits.yml
