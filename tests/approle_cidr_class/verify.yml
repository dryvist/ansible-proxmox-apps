---
# The reconcile identity must not declare as machine-only.
#
# It runs from the execution plane AND is the documented workstation path for
# read-only queries. It is currently unbound in the store, which is why the
# workstation use works; the moment the declared class is actually applied, a
# machine-only class refuses the workstation on source address while the
# credentials stay valid. That reads as a broken credential rather than a
# misclassified one, and the same mistake has already been made once here for
# the platform deploy identity.
#
# The map is RENDERED from the role's own defaults rather than restated: it is
# built by combining a default over every declared name, so a restated copy
# would drift the moment either half changes.
- name: Verify the AppRole source-address class map
  hosts: localhost
  gather_facts: false

  vars:
    role_defaults: "{{ playbook_dir }}/../../roles/openbao/defaults/main"
    # Any non-empty values will do: the assertions are about CLASS NAMES, not
    # about the ranges, and no real range is ever committed here.
    openbao_management_cidrs: "192.0.2.0/24"
    openbao_workstation_cidrs: "198.51.100.0/24"
    openbao_ci_cidrs: "203.0.113.0/24"
    openbao_ssh_source_cidrs: "192.0.2.0/24"

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: "{{ role_defaults }}"

    # include_vars outranks play vars, so the fixture ranges have to be set
    # AFTER the load or the defaults' own (env-derived, empty here) values win
    # and every class resolves empty. The class definitions are lazy templates,
    # so setting the inputs now is enough for them to resolve.
    - name: Supply the range inputs the class definitions read
      ansible.builtin.set_fact:
        openbao_management_cidrs: "192.0.2.0/24"
        openbao_workstation_cidrs: "198.51.100.0/24"
        openbao_ci_cidrs: "203.0.113.0/24"

    - name: The reconcile identity is declared, or this test is asserting nothing
      ansible.builtin.assert:
        that:
          - "'openbao-reconcile' in (openbao_approles | map(attribute='name') | list)"
        fail_msg: >-
          openbao-reconcile is not in the declared AppRole set, so the class map
          below cannot contain it and every assertion here would pass vacuously.

    - name: It must reach both the execution plane and the workstation
      vars:
        cls: "{{ openbao_approle_cidr_class_map['openbao-reconcile'] }}"
      ansible.builtin.assert:
        that:
          - cls != 'machine'
          - cls in ['machine_or_workstation', 'workstation']
        fail_msg: >-
          openbao-reconcile declares class '{{ cls }}'. A machine-only class
          refuses the documented workstation callers on source address once the
          class is applied, with credentials that are perfectly valid — the
          same failure the platform deploy identity already hit. Move those
          callers first if this is to be narrowed.

    - name: A class that carries a role must resolve to a non-empty range
      vars:
        cls: "{{ openbao_approle_cidr_class_map['openbao-reconcile'] }}"
      ansible.builtin.assert:
        that:
          - (openbao_approle_cidr_classes[cls] | default('')) | length > 0
        fail_msg: >-
          Class '{{ cls }}' resolves to an empty range, which binds nothing.
          An empty class is indistinguishable from no binding at all.

    - name: The provisioning tier must reach both the workstation and the store host
      vars:
        cls: "{{ openbao_approle_cidr_class_map['admin'] }}"
      ansible.builtin.assert:
        that:
          - cls == 'machine_or_workstation'
        fail_msg: >-
          admin declares class '{{ cls }}'. Its secret_id is redeemed on the
          operator's workstation and the token is then used by the openbao play
          on the store host, so a single-segment class refuses one of the two
          with valid credentials and the run reports 403 permission denied.

    - name: The interactive repo-create identity is redeemed from the workstation
      vars:
        cls: "{{ openbao_approle_cidr_class_map['github-repo-create'] }}"
      ansible.builtin.assert:
        that:
          - cls == 'workstation'
        fail_msg: >-
          github-repo-create declares class '{{ cls }}'. The helper runs it only
          from an interactive terminal on the operator's workstation, so any
          other class refuses every real caller on source address.

    - name: The unattended admin identity is redeemed from the workstation
      vars:
        cls: "{{ openbao_approle_cidr_class_map['github-admin-unattended'] }}"
      ansible.builtin.assert:
        that:
          - cls == 'workstation'
        fail_msg: >-
          The unattended admin identity declares class '{{ cls }}'; it is
          redeemed only from the workstation.

    # include_vars outranks task vars too, so the fixture realm is a fact.
    - name: Declare a fixture write realm
      ansible.builtin.set_fact:
        openbao_github_write_scopes: {"github-write-fixture": ["fixture-repo"]}

    - name: A write realm inherits github-write's class instead of the machine default
      vars:
        cls: "{{ openbao_approle_cidr_class_map['github-write-fixture'] }}"
      ansible.builtin.assert:
        that:
          - cls == openbao_approle_cidr_class_overrides['github-write']
        fail_msg: >-
          Realm github-write-fixture declares class '{{ cls }}'. A realm is
          redeemed from the same workstation as github-write; the machine
          default refuses it on source address with valid credentials.

    - name: The unbound opt-out stays deliberate, not a dumping ground
      vars:
        unbound_names: >-
          {{ openbao_approle_cidr_class_map | dict2items
             | selectattr('value', 'equalto', 'unbound')
             | map(attribute='key') | list | sort }}
      ansible.builtin.assert:
        that:
          - unbound_names | length <= 2
        fail_msg: >-
          {{ unbound_names | length }} identities declare the unbound class
          ({{ unbound_names | join(', ') }}). Each one needs a written reason
          next to it; unbound is the documented opt-out, not the fallback.

    # include_vars outranks task vars, so the fixture bind is a fact.
    - name: Supply a documentation-range dispatcher bind for open-llm
      ansible.builtin.set_fact:
        openbao_open_llm_secret_id_cidr: "192.0.2.10/32"

    - name: The open-llm role is machine class, bound to one /32, with a renewable 15m/60m token
      vars:
        role: "{{ openbao_approles | selectattr('name', 'equalto', 'open-llm') | first }}"
        # Renewal rides the default policy's renew-self; no role write may drop it.
        role_writes: >-
          {{ lookup('file', playbook_dir ~ '/../../roles/openbao/tasks/init/10-approles.yml')
             ~ lookup('file', playbook_dir ~ '/../../roles/openbao/tasks/init/10c-approle-ttl-bounds.yml') }}
      ansible.builtin.assert:
        that:
          - openbao_approle_cidr_class_map['open-llm'] == 'machine'
          - role.secret_id_bound_cidrs == '192.0.2.10/32'
          - role.token_ttl == '15m'
          - role.token_max_ttl == '60m'
          - (role.token_policies | default([role.policy])) == ['open-llm']
          - role.token_no_default_policy is not defined
          - role_writes is not search('no_default_policy')
        fail_msg: >-
          open-llm declares class '{{ openbao_approle_cidr_class_map['open-llm'] }}',
          bind '{{ role.secret_id_bound_cidrs | default('') }}', token
          {{ role.token_ttl | default('') }}/{{ role.token_max_ttl | default('') }}.
          It must be the machine class bound to the dispatcher's /32, 15m
          renewable to 60m, keep the default policy, and carry only its own policy.

    - name: Retired identities are declared nowhere and slated for deletion
      ansible.builtin.assert:
        that:
          - openbao_retired_approles | sort == ['claude-identity', 'github-admin-claude', 'github-agents', 'open-llm-workstation']
          - openbao_approles | map(attribute='name') | select('in', openbao_retired_approles) | list == []
          - openbao_approle_cidr_class_overrides | list | select('in', openbao_retired_approles) | list == []
          - openbao_base_policies_static | map(attribute='name') | select('in', openbao_retired_policies) | list == []
        fail_msg: >-
          A retired AppRole or policy is still declared, so the converge would
          recreate what it deletes.
