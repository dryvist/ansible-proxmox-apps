---
# Proves the confidential-client secret guards actually fire.
#
# They previously read `| default('', true) | mandatory('...')`, which never
# raises: mandatory fires only on an UNDEFINED value, and the default to its
# left has already turned a missing key into an empty string. A secret absent
# from the store therefore rendered empty, was hashed into the config, and left
# the relying party holding a credential that can never match — a converge
# reporting success over a login that cannot work.
#
# Both directions are asserted. A guard that only passes the present case is
# satisfied by the broken state too.
- name: Verify authelia client-secret guards
  hosts: localhost
  connection: local
  gather_facts: false
  # Listed literally, NOT derived from authelia_oidc_confidential_clients:
  # that list carries each client's secret_plain, whose whole purpose is to
  # raise when the store is absent — as it is here. The COUNTS below are
  # derived from this list, so adding a client can never leave a stale number
  # asserting against fewer guards than the role actually ships.
  vars:
    guarded_secret_vars:
      - authelia_oidc_homarr_client_secret_plain
      - authelia_oidc_langfuse_client_secret_plain
      - authelia_oidc_phoenix_client_secret_plain
      - authelia_oidc_semaphore_client_secret_plain
      - authelia_oidc_terrakube_dex_client_secret_plain
      - authelia_oidc_grafana_client_secret_plain
  tasks:
    - name: Load the authelia role defaults
      ansible.builtin.include_vars:
        dir: ../../roles/authelia/defaults/main

    - name: Resolve each client secret with the store absent (must raise)
      ansible.builtin.debug:
        msg: "{{ lookup('vars', item) }}"
      loop: "{{ guarded_secret_vars }}"
      register: guard_absent
      ignore_errors: true

    - name: Assert every guard fired, and named its own field
      ansible.builtin.assert:
        that:
          - guard_absent.results | rejectattr('failed', 'defined') | list | length == 0
          - guard_absent.results | selectattr('failed') | list | length
            == guarded_secret_vars | length
          - guard_absent.results
            | map(attribute='msg') | select('search', 'missing from OpenBao')
            | list | length == guarded_secret_vars | length
        fail_msg: >-
          A client-secret guard did not fire with the store absent. That is the
          disarmed shape returning, and it renders an empty secret.

    - name: Resolve the same secrets with the store populated (must pass through)
      ansible.builtin.debug:
        msg: "{{ lookup('vars', item) }}"
      loop:
        - authelia_oidc_homarr_client_secret_plain
        - authelia_oidc_semaphore_client_secret_plain
      register: guard_present
      vars:
        bao_apps_secrets:
          authelia_oidc_homarr_client_secret: homarr-real
          authelia_oidc_semaphore_client_secret: semaphore-real

    - name: Assert the real values pass through untouched
      ansible.builtin.assert:
        that:
          - guard_present.results[0].msg == 'homarr-real'
          - guard_present.results[1].msg == 'semaphore-real'
        fail_msg: "The guard altered or dropped a value that was present."
