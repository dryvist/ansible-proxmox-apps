---
- name: Verify shared apps PostgreSQL routing authority
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../inventory/group_vars/all.yml
    - ../../inventory/group_vars/postgres_group.yml
    - ../../inventory/group_vars/nautobot_group.yml
    - ../../inventory/group_vars/vikunja_group.yml
    - ../../inventory/group_vars/zammad_group.yml
  tasks:
    - name: Set the published inventory domain fixture
      ansible.builtin.set_fact:
        tofu_data:
          domain: example.test

    - name: Assert every apps-tier consumer follows the declared primary
      ansible.builtin.assert:
        that:
          - postgres_apps_primary_host == 'postgres-apps'
          - postgres_primary_host == postgres_apps_primary_host
          - nautobot_db_host == 'postgres-apps.example.test'
          - vikunja_db_host == 'postgres-apps.example.test'
          - zammad_db_host == 'postgres-apps.example.test'

    - name: Model a deliberate apps-tier failover
      ansible.builtin.set_fact:
        postgres_apps_primary_host: postgres

    - name: Assert one override moves the cluster role and every client
      ansible.builtin.assert:
        that:
          - postgres_primary_host == 'postgres'
          - nautobot_db_host == 'postgres.example.test'
          - vikunja_db_host == 'postgres.example.test'
          - zammad_db_host == 'postgres.example.test'

- name: Verify the AI PostgreSQL tier remains independent
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../inventory/group_vars/all.yml
    - ../../inventory/group_vars/postgres_ai_group.yml

  tasks:
    - name: Assert the AI primary declaration is unchanged
      ansible.builtin.assert:
        that:
          - postgres_primary_host == 'postgres-ai-1'
          - postgres_cluster_group == 'postgres_ai_group'

# The pgBackRest stanza is the unit of exclusive write access to a repo: two
# instances archiving into one stanza put a WAL segment there under a name the
# live cluster wrote different content to, and pgBackRest then refuses every
# later push. So the stanza must follow the HOST and nothing else — in
# particular it must never follow the cluster's primary, because a standby that
# named the primary's stanza would start writing into it the moment it was
# promoted, while the ex-primary still held the same name.
- name: Verify the pgBackRest stanza is owned by the host, not the cluster role
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../roles/postgres/defaults/main.yml

  tasks:
    - name: Assert a standby's stanza and repo path are its own
      # Set on the task, not the play: vars_files outranks play vars, so a play
      # var here would lose to the empty default this file loads.
      vars:
        # This host is a member of the apps pair but NOT its primary, so the
        # role resolves it to a standby — the case that must own its own stanza.
        postgres_primary_host: postgres-apps
      ansible.builtin.assert:
        that:
          - postgres_role == 'standby'
          - postgres_pgbackrest_stanza == inventory_hostname
          - postgres_pgbackrest_repo_path == '/postgres/' ~ inventory_hostname
          - postgres_pgbackrest_stanza != postgres_primary_host
        fail_msg: >-
          The pgBackRest stanza or repo path follows something other than
          inventory_hostname, so two hosts in one cluster can resolve to the
          same stanza and archive into each other's repository.
