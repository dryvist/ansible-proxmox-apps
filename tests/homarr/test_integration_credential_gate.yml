---
# Regression test for Vikunja 3447: SONARR_API_KEY went missing from OpenBao
# in production and the combined API-key/integrations/board-tile command
# (roles/homarr/tasks/integrations.yml) failed at variable resolution before
# it ever ran — one unrelated, optional credential took the whole task down,
# including the board-tile sync this repo's dashboard work depends on.
#
# WHY this is a test: a missing key is a routine OpenBao state, not a code
# bug, and the failure mode is a raised exception during Jinja templating —
# invisible to anything short of actually rendering these variables. A green
# converge elsewhere proves nothing about this path.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/homarr/test_integration_credential_gate.yml -i localhost, -c local
- name: Verify Sonarr's missing key does not break the combined integrations list
  hosts: localhost
  gather_facts: false
  vars:
    ingress_domain: pve.example.test
    # SONARR_API_KEY deliberately absent — the exact live failure. Every
    # other media secret present, so a regression that widens the gate past
    # Sonarr shows up as a missing entry below, not just a lucky green.
    bao_media_secrets:
      RADARR_API_KEY: radarr-fixture-key
      SEERR_API_KEY: seerr-fixture-key
      PLEX_TOKEN: plex-fixture-token
  vars_files:
    - "{{ playbook_dir }}/../../inventory/group_vars/homarr_group.yml"
    - "{{ playbook_dir }}/../../roles/homarr/defaults/main.yml"
  tasks:
    - name: Resolving the combined integrations list does not raise
      ansible.builtin.assert:
        quiet: true
        that:
          - (homarr_integrations + homarr_sonarr_integration + homarr_proxmox_integration) is sequence
        fail_msg: >-
          Rendering the integrations list raised — a missing, unrelated
          credential (Sonarr) must not break the combined
          API-key/integrations/board-tile command.
        success_msg: "The list rendered without raising."

    - name: Sonarr is skipped; every other integration still present
      ansible.builtin.assert:
        quiet: true
        that:
          - "'Sonarr' not in _names"
          - "'Radarr' in _names"
          - "'Jellyseerr' in _names"
          - "'Plex' in _names"
        fail_msg: "Expected Sonarr alone to be missing, got: {{ _names }}"
        success_msg: "Sonarr alone is gated out; Radarr/Jellyseerr/Plex are unaffected."
      vars:
        _names: >-
          {{ (homarr_integrations + homarr_sonarr_integration + homarr_proxmox_integration)
             | map(attribute='name') | list }}
