---
# Each media integration must render only when its own key resolves; a
# missing key must not break the others or the combined command's variable
# resolution.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/homarr/test_integration_credential_gate.yml -i localhost, -c local
- name: Verify each media integration is independently key-gated
  hosts: localhost
  gather_facts: false
  vars:
    ingress_domain: pve.example.test
  # Role-default fallbacks load first, group_vars' real bao_media_secrets-
  # driven values second, so the later file's keys win — matching real
  # variable precedence (role defaults lowest, group_vars higher).
  vars_files:
    - "{{ playbook_dir }}/../../roles/homarr/defaults/main.yml"
    - "{{ playbook_dir }}/../../inventory/group_vars/homarr_group.yml"
  tasks:
    - name: All four keys present renders all four
      vars:
        bao_media_secrets:
          SONARR_API_KEY: sonarr-fixture-key
          RADARR_API_KEY: radarr-fixture-key
          SEERR_API_KEY: seerr-fixture-key
          PLEX_TOKEN: plex-fixture-token
        _names: "{{ homarr_integrations | map(attribute='name') | list }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - _names | length == 4
          - "'Sonarr' in _names"
          - "'Radarr' in _names"
          - "'Jellyseerr' in _names"
          - "'Plex' in _names"
        fail_msg: "Expected all four, got: {{ _names }}"
        success_msg: "All four render when every key resolves."

    - name: One missing key skips only that integration; the other three are unaffected
      vars:
        base_media_secrets:
          SONARR_API_KEY: sonarr-fixture-key
          RADARR_API_KEY: radarr-fixture-key
          SEERR_API_KEY: seerr-fixture-key
          PLEX_TOKEN: plex-fixture-token
        bao_media_secrets: "{{ base_media_secrets | combine({item.field: ''}) }}"
        _names: "{{ homarr_integrations | map(attribute='name') | list }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - item.name not in _names
          - _names | length == 3
        fail_msg: "Expected only {{ item.name }} missing, got: {{ _names }}"
        success_msg: "{{ item.name }} alone is gated out; the other three are unaffected."
      loop:
        - {name: Sonarr, field: SONARR_API_KEY}
        - {name: Radarr, field: RADARR_API_KEY}
        - {name: Jellyseerr, field: SEERR_API_KEY}
        - {name: Plex, field: PLEX_TOKEN}

    - name: All four keys missing renders an empty list without raising
      vars:
        bao_media_secrets: {}
      ansible.builtin.assert:
        quiet: true
        that:
          - homarr_integrations == []
        fail_msg: "Expected an empty list, got: {{ homarr_integrations }}"
        success_msg: "Every key absent renders cleanly to []."
