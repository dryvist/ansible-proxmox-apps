---
# Every integration always renders — a missing or broken credential must
# never remove a row from the list, and must never break the combined
# command's variable resolution.
#
# `tofu_data`/`ansible_host` are set close to real shape, and every
# assertion round-trips the combined list through `to_json` — the same full
# leaf-by-leaf resolution the real command's stdin does — so a broken field
# elsewhere in the dict (not just an empty secret) is caught here too.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/homarr/test_integration_credential_gate.yml -i localhost, -c local
- name: Verify every integration always renders regardless of its credential
  hosts: localhost
  gather_facts: false
  vars:
    ingress_domain: pve.example.test
    ansible_host: molecule-fixture.test
    tofu_data:
      constants:
        service_ports:
          proxmox_web: 8006
  # Role-default fallbacks load first, group_vars' real bao_media_secrets-
  # driven values second, so the later file's keys win — matching real
  # variable precedence (role defaults lowest, group_vars higher).
  vars_files:
    - "{{ playbook_dir }}/../../roles/homarr/defaults/main.yml"
    - "{{ playbook_dir }}/../../inventory/group_vars/homarr_group.yml"
  tasks:
    - name: All keys present renders all five integrations
      vars:
        bao_media_secrets:
          SONARR_API_KEY: sonarr-fixture-key
          RADARR_API_KEY: radarr-fixture-key
          SEERR_API_KEY: seerr-fixture-key
          PLEX_TOKEN: plex-fixture-token
        bao_apps_secrets:
          homarr_proxmox_token_id: proxmox-fixture-id
          homarr_proxmox_token_secret: proxmox-fixture-secret
        _all: "{{ homarr_integrations + homarr_proxmox_integration }}"
        _names: "{{ _all | map(attribute='name') | list }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - _names | length == 5
          - "'Sonarr' in _names"
          - "'Radarr' in _names"
          - "'Jellyseerr' in _names"
          - "'Plex' in _names"
          - "'Proxmox' in _names"
          - (_all | to_json) is string
        fail_msg: "Expected all five, got: {{ _names }}"
        success_msg: "All five render when every key resolves."

    - name: One missing key still renders every integration; none disappear
      vars:
        base_media_secrets:
          SONARR_API_KEY: sonarr-fixture-key
          RADARR_API_KEY: radarr-fixture-key
          SEERR_API_KEY: seerr-fixture-key
          PLEX_TOKEN: plex-fixture-token
        bao_media_secrets: "{{ base_media_secrets | combine({item: ''}) }}"
        _all: "{{ homarr_integrations + homarr_proxmox_integration }}"
        _names: "{{ _all | map(attribute='name') | list }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - _names | length == 5
          - (_all | to_json) is string
        fail_msg: "Missing {{ item }} dropped a row: got {{ _names }}"
        success_msg: "{{ item }} empty still leaves all five rows present."
      loop:
        - SONARR_API_KEY
        - RADARR_API_KEY
        - SEERR_API_KEY
        - PLEX_TOKEN

    - name: Every key missing (media and Proxmox) still renders all five, empty secrets and all
      vars:
        bao_media_secrets: {}
        bao_apps_secrets: {}
        _all: "{{ homarr_integrations + homarr_proxmox_integration }}"
        _names: "{{ _all | map(attribute='name') | list }}"
        _empty_secret_names: >-
          {{ _all
             | selectattr('secrets', 'defined')
             | selectattr('secrets.0.value', 'eq', '')
             | map(attribute='name') | list }}
      ansible.builtin.assert:
        quiet: true
        that:
          - _names | length == 5
          - "'Sonarr' in _empty_secret_names"
          - (_all | to_json) is string
        fail_msg: "Expected all five present with empty secrets, got names={{ _names }} empty={{ _empty_secret_names }}"
        success_msg: "Every key absent still renders all five, each with an empty (visibly rejectable) secret."
