---
- name: Assert validator groups retain exact fixture LXC membership
  ansible.builtin.assert:
    that:
      - (groups['haproxy_group'] | intersect(fixture_lxc_names) | sort) == ['haproxy']
      - (groups['cribl_edge'] | intersect(fixture_lxc_names) | sort) == ['cribl-edge-01', 'cribl-edge-02']
      - >-
        (groups['cribl_stream_group'] | intersect(fixture_lxc_names) | sort)
        == ['cribl-stream-01', 'cribl-stream-02']
      - (groups['mailpit_group'] | intersect(fixture_lxc_names) | sort) == ['mailpit']
      - (groups['ntfy_group'] | intersect(fixture_lxc_names) | sort) == ['ntfy']
      - (groups['mssql_group'] | intersect(fixture_lxc_names) | sort) == ['mssql']
    fail_msg: >-
      A validator group no longer matches its exact LXC membership in
      tests/inventory_load/tofu_inventory.json.
  vars:
    fixture_lxc_names: "{{ tofu_data.containers.keys() | list }}"
