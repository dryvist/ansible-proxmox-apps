---
# Split out of verify_inventory.yml (2026-09-20) to stay under the repo's
# per-file token budget (.token-limits.yaml) -- both are runner-pool sizing
# checks against the same resolved inventory, so they're grouped here rather
# than inlined individually.
- name: Verify every plane host has its runner pool torn down to 0
  ansible.builtin.import_tasks: verify_runner_plane_hosts.yml

- name: Verify every docker_vms host keeps review_slots within its pool size
  ansible.builtin.import_tasks: verify_runner_review_slots.yml

- name: Verify the agent sandbox host is the only member of its group, with no runner pool
  ansible.builtin.import_tasks: verify_agent_sandbox_host.yml

- name: Verify reviewed host keys materialize before guest connections
  ansible.builtin.import_tasks: verify_ssh_host_key_pin.yml
