---
# Media-stack group membership + media_ports constant. Imported by
# verify_inventory.yml (kept under the shared token limit).
- name: Verify download-vpn is in download_vpn_group (vpn tag)
  ansible.builtin.assert:
    that:
      - groups['download_vpn_group'] is defined
      - "'download-vpn' in groups['download_vpn_group']"
      # Must NOT leak into other media groups.
      - "'download-vpn' not in (groups['sonarr_group'] | default([]))"
    fail_msg: >-
      download_vpn_group should contain 'download-vpn' (vpn tag);
      got {{ groups['download_vpn_group'] | default([]) }}

- name: Verify sonarr/radarr/plex/seerr are in their groups
  ansible.builtin.assert:
    that:
      - "'sonarr' in (groups['sonarr_group'] | default([]))"
      - "'radarr' in (groups['radarr_group'] | default([]))"
      - "'plex' in (groups['plex_group'] | default([]))"
      - "'seerr' in (groups['seerr_group'] | default([]))"
      # seerr must NOT leak into the *arr/plex app groups.
      - "'seerr' not in (groups['sonarr_group'] | default([]))"
      - "'seerr' not in (groups['plex_group'] | default([]))"
    fail_msg: >-
      media app groups misassigned —
      sonarr_group={{ groups['sonarr_group'] | default([]) }},
      radarr_group={{ groups['radarr_group'] | default([]) }},
      plex_group={{ groups['plex_group'] | default([]) }},
      seerr_group={{ groups['seerr_group'] | default([]) }}

- name: Verify all five media guests are in media_group
  ansible.builtin.assert:
    that:
      - groups['media_group'] is defined
      - "'download-vpn' in groups['media_group']"
      - "'sonarr' in groups['media_group']"
      - "'radarr' in groups['media_group']"
      - "'plex' in groups['media_group']"
      - "'seerr' in groups['media_group']"
    fail_msg: >-
      media_group should contain all five media guests (media tag);
      got {{ groups['media_group'] | default([]) }}

- name: Verify media_ports constant is present
  ansible.builtin.assert:
    that:
      - tofu_data.constants.media_ports is defined
      - tofu_data.constants.media_ports.qbittorrent_web == 8080
      - tofu_data.constants.media_ports.prowlarr_web == 9696
      - tofu_data.constants.media_ports.seerr_web == 5055
    fail_msg: >-
      tofu_data.constants.media_ports missing or incorrect —
      expected qbittorrent_web: 8080, prowlarr_web: 9696, seerr_web: 5055
