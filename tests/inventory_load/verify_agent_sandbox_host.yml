---
# The agent_sandbox_host group is tag-driven: only the agent-sandbox-tagged
# docker VM joins it, so the sandbox role never lands on a CI or plane host,
# and the sandbox host never runs a CI runner pool.
- name: Verify only the agent-sandbox-tagged docker VM is in agent_sandbox_host
  ansible.builtin.assert:
    that:
      - groups['agent_sandbox_host'] | default([]) == ['ai-sandbox-01']
      - "'ai-sandbox-01' in groups['docker_vms']"
      - "'docker-host' not in groups['agent_sandbox_host']"
      - "'iac-platform' not in groups['agent_sandbox_host']"
      - not (hostvars['ai-sandbox-01'].github_runner_enabled | bool)
      - hostvars['ai-sandbox-01'].github_runner_replicas | int == 0
    fail_msg: >-
      agent_sandbox_host should be exactly ['ai-sandbox-01'] with its
      runner pool off; got {{ groups['agent_sandbox_host'] | default([]) }}
