---
- name: Verify skipped fixture containers record their loader groups
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load the LXC inventory tasks from the skipped-container branch
      ansible.builtin.import_tasks: ../../inventory/load_tofu/add_lxc_hosts.yml

    - name: Assert the fixture container retains its original group assignment
      ansible.builtin.assert:
        that:
          - add_lxc_hosts_skipped_containers | length == 1
          - add_lxc_hosts_skipped_containers[0].container == 'cribl-edge-01'
          - add_lxc_hosts_skipped_containers[0].vmid | int == 180
          - add_lxc_hosts_skipped_containers[0].status == 'stopped'
          - >-
            add_lxc_hosts_skipped_containers[0].groups
            == ['lxc_containers', 'all', 'managed_linux_guests',
                'managed_secrets_group', 'cribl_edge']
        fail_msg: >-
          The skipped inventory fixture did not record cribl-edge-01 with its
          original groups, vmid, and status.
