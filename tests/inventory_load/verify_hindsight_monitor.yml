---
- name: Verify the inventory-derived Hindsight monitor contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_become: false
    tofu_data: "{{ lookup('ansible.builtin.file', 'tofu_inventory.json') | from_json }}"
  tasks:
    - name: Exercise the real monitor-target generator
      ansible.builtin.import_tasks: verify_monitor_targets.yml
