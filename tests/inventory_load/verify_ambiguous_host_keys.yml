---
- name: Assert the fixture publishes no ambiguous guest key
  ansible.builtin.assert:
    that:
      - load_tofu_ambiguous_host_keys == []
    fail_msg: >-
      The fixture inventory reported ambiguous guest keys:
      {{ load_tofu_ambiguous_host_keys | join(', ') }}

- name: Find ambiguous keys in a fixture with one key in two guest maps
  ansible.builtin.import_tasks: ../../inventory/load_tofu/ambiguous_host_keys.yml
  vars:
    load_tofu_guest_maps:
      containers: {pbs: {}, alone: {}}
      vms: {pbs: {}, splunk-like: {}}
      docker_vms: {other: {}}

- name: Assert only the shared key is excluded
  ansible.builtin.assert:
    that:
      - load_tofu_ambiguous_host_keys == ['pbs']
    fail_msg: >-
      Expected only 'pbs' to be ambiguous, got
      {{ load_tofu_ambiguous_host_keys | join(', ') }}
