---
# github_runner_group (inventory/group_vars/docker_vms.yml) names the GitHub
# organization runner group every proxmox runner registers into. Read the
# resolved value off each docker_vms host, so a host_vars override to another
# group, or an edit to the group_vars value, fails here rather than at the
# next converge of that host.
- name: Verify the docker_vms group has members to check
  ansible.builtin.assert:
    that:
      - groups['docker_vms'] | default([]) | length > 0
    fail_msg: >-
      docker_vms has no members, so the runner group check below would pass
      without checking anything.

- name: Verify every docker_vms host registers into the homelab runner group
  ansible.builtin.assert:
    that:
      - hostvars[item].github_runner_group == 'homelab'
    fail_msg: >-
      {{ item }} has github_runner_group={{ hostvars[item].github_runner_group
      | default('(undefined)') }}, not homelab - set it in
      inventory/group_vars/docker_vms.yml or drop the host_vars override.
  loop: "{{ groups['docker_vms'] | default([]) }}"

- name: Verify every docker_vms host registers its review slots into the homelab-ai runner group
  ansible.builtin.assert:
    that:
      - hostvars[item].github_runner_review_group == 'homelab-ai'
    fail_msg: >-
      {{ item }} has github_runner_review_group={{ hostvars[item].github_runner_review_group
      | default('(undefined)') }}, not homelab-ai - set it in
      inventory/group_vars/docker_vms.yml or drop the host_vars override.
  loop: "{{ groups['docker_vms'] | default([]) }}"
