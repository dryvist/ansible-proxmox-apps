---
# Inventory load verification playbook
# Validates that load_tofu.yml correctly assigns dynamic groups
# from OpenTofu inventory tags.
#
# Usage (CI - uses fixture):
#   TOFU_INVENTORY_PATH=$PWD/tests/inventory_load/tofu_inventory.json \
#     ansible-playbook tests/inventory_load/verify_inventory.yml \
#       -i inventory/hosts.yml -c local
#
# Covers:
#   - haproxy_group assigned for 'haproxy' tagged containers              (PR #117)
#   - cribl_edge group assigned for 'cribl'+'edge' tagged containers     (PR #36)
#   - cribl_stream_group assigned for 'cribl'+'stream' tagged containers
#   - mssql_group assigned for 'database' tagged containers              (PR #72)
#   - apt_cacher_group assigned for 'apt-cache' tagged containers
#   - lxc_containers populated for all tofu containers
#   - splunk_group / cribl_docker_group populated from their sections
#
# Note: hosts.yml pre-populates some groups (haproxy_group, cribl_edge,
# lxc_containers) with static hosts. These tests verify that tofu
# dynamic hosts are correctly added on top of any static entries.
# Static apt_cacher host has been removed from hosts.yml (container never provisioned).

- name: Load OpenTofu inventory
  import_playbook: ../../inventory/load_tofu.yml

- name: Verify dynamic group assignments
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Read resolved PCT transport options
      ansible.builtin.command:
        argv:
          - ansible-config
          - dump
          - --type
          - connection
          - community.proxmox.proxmox_pct_remote
          - --format
          - json
        chdir: "{{ playbook_dir }}/../.."
      register: pct_transport_config
      changed_when: false
      vars:
        ansible_become: false

    - name: Verify PCT transport does not request a PTY
      ansible.builtin.assert:
        that:
          - >-
            (
              pct_transport_config.stdout | from_json | first | dict2items | first
            ).value
            | selectattr('name', 'equalto', 'pty')
            | map(attribute='value')
            | list == [false]
        fail_msg: >-
          community.proxmox.proxmox_pct_remote must resolve pty=false because
          automation-ansible SSH certificates intentionally omit permit-pty

    - name: Verify tofu_data constants were loaded
      ansible.builtin.assert:
        that:
          - hostvars['localhost']['tofu_data'] is defined
          - hostvars['localhost']['tofu_data']['constants'] is defined
          - hostvars['localhost']['tofu_data']['constants']['service_ports'] is defined
          - hostvars['localhost']['tofu_data']['constants']['syslog_ports'] is defined
          - hostvars['localhost']['tofu_data']['constants']['syslog_port_map'] is defined
          - hostvars['localhost']['tofu_data']['constants']['syslog_port_map']['unifi']['standard'] is defined
        fail_msg: >-
          tofu_data.constants missing — inventory/load_tofu.yml
          did not load constants correctly

    - name: Verify netflow_ports in constants
      ansible.builtin.assert:
        that:
          - tofu_data.constants.netflow_ports is defined
          - tofu_data.constants.netflow_ports.unifi == 2055
        fail_msg: >-
          tofu_data.constants.netflow_ports missing or incorrect —
          expected unifi: 2055

    - name: Verify notification_ports in constants
      ansible.builtin.assert:
        that:
          - tofu_data.constants.notification_ports is defined
          - tofu_data.constants.notification_ports.mailpit_smtp == 1025
          - tofu_data.constants.notification_ports.mailpit_web == 8025
          - tofu_data.constants.notification_ports.ntfy_http == 8080
        fail_msg: >-
          tofu_data.constants.notification_ports missing or incorrect —
          expected mailpit_smtp: 1025, mailpit_web: 8025, ntfy_http: 8080

    - name: Verify vector_db_ports in constants
      ansible.builtin.assert:
        that:
          - tofu_data.constants.vector_db_ports is defined
          - tofu_data.constants.vector_db_ports.qdrant_http == 6333
          - tofu_data.constants.vector_db_ports.qdrant_grpc == 6334
        fail_msg: >-
          tofu_data.constants.vector_db_ports missing or incorrect —
          expected qdrant_http: 6333, qdrant_grpc: 6334

    - name: Verify tofu containers are in lxc_containers group
      ansible.builtin.assert:
        that:
          - groups['lxc_containers'] is defined
          - "'haproxy' in groups['lxc_containers']"
          - "'cribl-edge-01' in groups['lxc_containers']"
          - "'cribl-edge-02' in groups['lxc_containers']"
          - "'cribl-stream-01' in groups['lxc_containers']"
          - "'cribl-stream-02' in groups['lxc_containers']"
          - "'mssql' in groups['lxc_containers']"
          - "'apt-cacher-ng-10' in groups['lxc_containers']"
          - "'apt-cacher-ng-30' in groups['lxc_containers']"
          - "'qdrant' in groups['lxc_containers']"
          - "'mailpit' in groups['lxc_containers']"
          - "'ntfy' in groups['lxc_containers']"
          - "'openproject' in groups['lxc_containers']"
        fail_msg: >-
          lxc_containers group is missing tofu hosts;
          current members: {{ groups['lxc_containers'] | default([]) | join(', ') }}

    - name: Verify haproxy_group contains 'haproxy'-tagged container
      ansible.builtin.assert:
        that:
          - groups['haproxy_group'] is defined
          - "'haproxy' in groups['haproxy_group']"
        fail_msg: >-
          haproxy_group should contain 'haproxy' (haproxy tag);
          got {{ groups['haproxy_group'] | default([]) }}

    - name: Verify cribl_edge group contains tofu 'cribl'+'edge' tagged containers
      ansible.builtin.assert:
        that:
          - groups['cribl_edge'] is defined
          - "'cribl-edge-01' in groups['cribl_edge']"
          - "'cribl-edge-02' in groups['cribl_edge']"
        fail_msg: >-
          cribl_edge should contain 'cribl-edge-01' and 'cribl-edge-02' (cribl+edge tags);
          got {{ groups['cribl_edge'] | default([]) }}

    - name: Verify cribl_stream_group contains tofu 'cribl'+'stream' tagged containers
      ansible.builtin.assert:
        that:
          - groups['cribl_stream_group'] is defined
          - "'cribl-stream-01' in groups['cribl_stream_group']"
          - "'cribl-stream-02' in groups['cribl_stream_group']"
        fail_msg: >-
          cribl_stream_group should contain 'cribl-stream-01' and 'cribl-stream-02' (cribl+stream tags);
          got {{ groups['cribl_stream_group'] | default([]) }}

    - name: Verify Cribl Edge and Stream groups are disjoint
      ansible.builtin.assert:
        that:
          - >-
            (groups['cribl_edge'] | intersect(groups['cribl_stream_group'])) | length == 0
        fail_msg: >-
          cribl_edge and cribl_stream_group overlap; a guest would receive
          conflicting Cribl service configuration.

    - name: Verify cribl-stream-01 is NOT in cribl_edge group
      ansible.builtin.assert:
        that:
          - "'cribl-stream-01' not in groups['cribl_edge']"
        fail_msg: >-
          cribl-stream-01 should NOT be in cribl_edge (has stream tag, not edge tag);
          got {{ groups['cribl_edge'] | default([]) }}

    - name: Verify mssql_group contains 'database'-tagged container
      ansible.builtin.assert:
        that:
          - groups['mssql_group'] is defined
          - "'mssql' in groups['mssql_group']"
        fail_msg: >-
          mssql_group should contain 'mssql' (database tag);
          got {{ groups['mssql_group'] | default([]) }}

    - name: Verify splunk is in splunk_group
      ansible.builtin.assert:
        that:
          - groups['splunk_group'] is defined
          - "'splunk' in groups['splunk_group']"
        fail_msg: >-
          splunk_group should contain 'splunk';
          got {{ groups['splunk_group'] | default([]) }}

    - name: Verify docker VMs are in cribl_docker_group
      ansible.builtin.assert:
        that:
          - groups['cribl_docker_group'] is defined
          - "'docker-host' in groups['cribl_docker_group']"
        fail_msg: >-
          cribl_docker_group should contain 'docker-host';
          got {{ groups['cribl_docker_group'] | default([]) }}

    - name: Assert the apt-cacher-ng HA pair is in apt_cacher_group
      ansible.builtin.assert:
        that:
          - "'apt_cacher_group' in groups"
          - "'apt-cacher-ng-10' in groups['apt_cacher_group']"
          - "'apt-cacher-ng-30' in groups['apt_cacher_group']"
        fail_msg: >-
          both apt-cacher-ng instances should be in apt_cacher_group
          (tag: apt-cache); got {{ groups['apt_cacher_group'] | default([]) }}

    - name: Verify mailpit is in mailpit_group
      ansible.builtin.assert:
        that:
          - groups['mailpit_group'] is defined
          - "'mailpit' in groups['mailpit_group']"
        fail_msg: >-
          mailpit_group should contain 'mailpit' (smtp tag);
          got {{ groups['mailpit_group'] | default([]) }}

    - name: Verify ntfy is in ntfy_group
      ansible.builtin.assert:
        that:
          - groups['ntfy_group'] is defined
          - "'ntfy' in groups['ntfy_group']"
        fail_msg: >-
          ntfy_group should contain 'ntfy' (push tag);
          got {{ groups['ntfy_group'] | default([]) }}

    - name: Verify openproject is in openproject_group
      ansible.builtin.assert:
        that:
          - groups['openproject_group'] is defined
          - "'openproject' in groups['openproject_group']"
        fail_msg: >-
          openproject_group should contain 'openproject' (openproject tag);
          got {{ groups['openproject_group'] | default([]) }}

    - name: Verify download-vpn is in download_vpn_group (vpn tag)
      ansible.builtin.assert:
        that:
          - groups['download_vpn_group'] is defined
          - "'download-vpn' in groups['download_vpn_group']"
          # Must NOT leak into other media groups.
          - "'download-vpn' not in (groups['sonarr_group'] | default([]))"
        fail_msg: >-
          download_vpn_group should contain 'download-vpn' (vpn tag);
          got {{ groups['download_vpn_group'] | default([]) }}

    - name: Verify sonarr/radarr/plex/seerr are in their groups
      ansible.builtin.assert:
        that:
          - "'sonarr' in (groups['sonarr_group'] | default([]))"
          - "'radarr' in (groups['radarr_group'] | default([]))"
          - "'plex' in (groups['plex_group'] | default([]))"
          - "'seerr' in (groups['seerr_group'] | default([]))"
          # seerr must NOT leak into the *arr/plex app groups.
          - "'seerr' not in (groups['sonarr_group'] | default([]))"
          - "'seerr' not in (groups['plex_group'] | default([]))"
        fail_msg: >-
          media app groups misassigned —
          sonarr_group={{ groups['sonarr_group'] | default([]) }},
          radarr_group={{ groups['radarr_group'] | default([]) }},
          plex_group={{ groups['plex_group'] | default([]) }},
          seerr_group={{ groups['seerr_group'] | default([]) }}

    - name: Verify all five media guests are in media_group
      ansible.builtin.assert:
        that:
          - groups['media_group'] is defined
          - "'download-vpn' in groups['media_group']"
          - "'sonarr' in groups['media_group']"
          - "'radarr' in groups['media_group']"
          - "'plex' in groups['media_group']"
          - "'seerr' in groups['media_group']"
        fail_msg: >-
          media_group should contain all five media guests (media tag);
          got {{ groups['media_group'] | default([]) }}

    - name: Verify media_ports constant is present
      ansible.builtin.assert:
        that:
          - tofu_data.constants.media_ports is defined
          - tofu_data.constants.media_ports.qbittorrent_web == 8080
          - tofu_data.constants.media_ports.prowlarr_web == 9696
          - tofu_data.constants.media_ports.seerr_web == 5055
        fail_msg: >-
          tofu_data.constants.media_ports missing or incorrect —
          expected qbittorrent_web: 8080, prowlarr_web: 9696, seerr_web: 5055

    # Leased-guest contract (terraform-proxmox): `ip` carries the FQDN, because
    # the guest's address lives only in the DHCP lease. load_tofu.yml surfaces
    # exactly ONE address fact per guest — container_ip — so no consumer has to
    # choose between two competing sources.
    - name: Verify a leased guest is surfaced by name
      ansible.builtin.assert:
        that:
          - "'immich' in groups['lxc_containers']"
          - "'immich' in (groups['immich_group'] | default([]))"
          - hostvars['immich'].container_ip == 'immich.example.net'
        fail_msg: >-
          leased guest hostvars wrong —
          container_ip={{ hostvars['immich'].container_ip | default('(undefined)') }}

    # Regression guard: the second address fact is gone and must stay gone.
    # Reintroducing it would restore the "prefer the reservation, else the name"
    # branch that every consumer used to carry its own copy of.
    - name: Verify no second address fact is surfaced for any guest
      ansible.builtin.assert:
        that:
          - hostvars['immich'].container_reserved_ip is not defined
          - hostvars['haproxy'].container_reserved_ip is not defined
        fail_msg: >-
          container_reserved_ip is defined again — there must be exactly one
          address fact per guest (container_ip).

    # add_host swallows a `hostname:` arg (alias of `name`), so load_tofu.yml
    # must set it as a real per-host fact — the technitium_dns A-record builder
    # and the *_docker site-URL defaults depend on it. Without it the builder
    # silently skips EVERY host and creates zero records.
    - name: Verify the hostname fact is set on every guest type
      ansible.builtin.assert:
        that:
          - hostvars['haproxy'].hostname is defined
          - hostvars['haproxy'].hostname == 'haproxy'
          - hostvars['immich'].hostname == 'immich'
          - hostvars['splunk'].hostname is defined
          - hostvars['docker-host'].hostname is defined
        fail_msg: >-
          hostname fact missing from dynamically-added hosts —
          haproxy={{ hostvars['haproxy'].hostname | default('(undefined)') }},
          immich={{ hostvars['immich'].hostname | default('(undefined)') }},
          splunk={{ hostvars['splunk'].hostname | default('(undefined)') }},
          docker-host={{ hostvars['docker-host'].hostname | default('(undefined)') }}

    # Two VM guests carried ssh_ca_trust_rollout_enabled: true for weeks with
    # no SSH_KNOWN_HOSTS pin and no converge ever reaching them — nothing
    # caught it. This is the check that would have: for every VM the
    # inventory says opts into the CA rollout, assert its connection address
    # (the same ansible_host add_host sets, FQDN or IP) has a pin. Reads the
    # materialised known_hosts FILE (a fixture in CI; point
    # SSH_KNOWN_HOSTS_FILE at the real file for a live check) — never the
    # secret value itself.
    # run-ansible.sh exports SSH_KNOWN_HOSTS_FILE alongside the pin it
    # materializes, so a real converge checks the ACTUAL pin. Falling back to
    # the CI fixture whenever the var is merely unset would make a real
    # converge without it (or a broken export) pass vacuously instead of
    # failing on a genuinely missing pin — so the fixture is CI-only
    # (CI=true, set by GitHub Actions).
    - name: Refuse to fall back to the CI fixture outside CI
      ansible.builtin.assert:
        that:
          - lookup('env', 'SSH_KNOWN_HOSTS_FILE') | length > 0 or lookup('env', 'CI') | bool
        fail_msg: >-
          SSH_KNOWN_HOSTS_FILE is not set and this isn't CI — run-ansible.sh
          should have exported it alongside the known_hosts it materializes.

    - name: Read the SSH known_hosts file used for CA-rollout coverage
      ansible.builtin.set_fact:
        ssh_known_hosts_coverage_content: >-
          {{ lookup('file',
             lookup('env', 'SSH_KNOWN_HOSTS_FILE')
             | default(playbook_dir ~ '/ssh_known_hosts_fixture.txt', true)) }}

    - name: Compute the CA-rollout VM address list
      ansible.builtin.set_fact:
        ssh_ca_rollout_addresses: >-
          {{ ((groups['vms'] | default([]))
              + (groups['splunk_vms'] | default([]))
              + (groups['docker_vms'] | default([])))
             | unique
             | map('extract', hostvars)
             | selectattr('ssh_ca_trust_rollout_enabled', 'true')
             | map(attribute='ansible_host')
             | list }}

    - name: Assert every CA-rollout VM address has a known_hosts pin
      ansible.builtin.assert:
        that:
          - item in ssh_known_hosts_coverage_content
        fail_msg: >-
          {{ item }} carries ssh_ca_trust_rollout_enabled but has no
          SSH_KNOWN_HOSTS pin — CA trust can never bootstrap on it
          non-interactively.
      loop: "{{ ssh_ca_rollout_addresses }}"

    - name: Display group membership summary
      ansible.builtin.debug:
        msg: |
          Inventory group verification PASSED:
          - lxc_containers:      {{ groups['lxc_containers'] | default([]) | join(', ') }}
          - haproxy_group:       {{ groups['haproxy_group'] | default([]) | join(', ') }}
          - cribl_edge:          {{ groups['cribl_edge'] | default([]) | join(', ') }}
          - cribl_stream_group:  {{ groups['cribl_stream_group'] | default([]) | join(', ') }}
          - mssql_group:         {{ groups['mssql_group'] | default([]) | join(', ') }}
          - splunk_group:        {{ groups['splunk_group'] | default([]) | join(', ') }}
          - cribl_docker_group:  {{ groups['cribl_docker_group'] | default([]) | join(', ') }}
          - apt_cacher_group:    {{ groups['apt_cacher_group'] | default([]) | join(', ') }}
          - mailpit_group:      {{ groups['mailpit_group'] | default([]) | join(', ') }}
          - ntfy_group:         {{ groups['ntfy_group'] | default([]) | join(', ') }}
          - openproject_group:  {{ groups['openproject_group'] | default([]) | join(', ') }}
