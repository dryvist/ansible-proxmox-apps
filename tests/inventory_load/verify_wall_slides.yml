---
# Wall slide vars moved out of group_vars/all.yml (token-limit) are re-loaded as
# per-host facts by inventory/load_tofu/load_wall_slides.yml. Verify they are
# present on the dynamic hosts load_tofu.yml created — NOT on the controller.
# Imported from tests/inventory_load/verify_inventory.yml via import_tasks.
- name: Verify wall slide vars loaded per-host after the move out of all.yml
  ansible.builtin.assert:
    that:
      # The controller (localhost) is excluded from the load loop; assert on the
      # first dynamically-added host instead.
      - dh is defined
      - hostvars[dh]['wall_slides'] is defined
      - hostvars[dh]['wall_slides'] | length == 3
      - hostvars[dh]['wall_slides'] | map(attribute='route') | list
        == ['glance', 'homarr-v2', 'unifi-insights']
      - hostvars[dh]['wall_slides'][1]['path'] == '/boards/wall'
      - hostvars[dh]['homarr_wall_board'] == 'wall'
      - hostvars[dh]['wall_kiosk_route_names']
        == ['wall', 'glance', 'homarr-v2', 'unifi-insights']
    fail_msg: >-
      wall_slides / homarr_wall_board / wall_kiosk_route_names not loaded on
      the dynamic hosts — inventory/load_tofu/load_wall_slides.yml did not run
      or did not reach the hosts created by inventory/load_tofu.yml.
  vars:
    dh: "{{ (groups['all'] | reject('equalto', 'localhost') | list) | first }}"
