---
- name: Verify Glance containers are included in the apps secret prefetch
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_become: false
    tofu_data:
      domain: example.internal
      nodes: {}
      containers:
        glance-poc:
          vmid: 193
          ip: 192.0.2.193
          fqdn: glance.example.internal
          ansible_connection: community.proxmox.proxmox_pct_remote
          tags: [glance]
          node: node-a
  tasks:
    - name: Load Glance into the resolved LXC inventory
      ansible.builtin.include_tasks: ../../inventory/load_tofu/add_lxc_hosts.yml

    - name: Assert Glance reaches the role group and secret prefetch group
      ansible.builtin.assert:
        that:
          - "'glance-poc' in groups['glance_group']"
          - "'glance-poc' in groups['managed_secrets_group']"
        fail_msg: >-
          Glance containers must reach the apps secret prefetch before the
          application roles run.
