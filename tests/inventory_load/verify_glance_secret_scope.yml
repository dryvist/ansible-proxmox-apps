---
- name: Verify Glance belongs to the apps secret domain
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_become: false
    tofu_data:
      domain: example.internal
      nodes: {}
      containers:
        glance-poc:
          vmid: 193
          ip: 192.0.2.193
          fqdn: glance.example.internal
          ansible_connection: community.proxmox.proxmox_pct_remote
          tags: [managed-secrets, glance]
          node: node-a
  tasks:
    - name: Load Glance into the resolved LXC inventory
      ansible.builtin.include_tasks: ../../inventory/load_tofu/add_lxc_hosts.yml

    - name: Load the apps secret domain groups
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../playbooks/site/vars/openbao_secrets_domain_groups.yml"

    - name: Assert Glance belongs to the apps secret domain
      ansible.builtin.assert:
        that:
          - "'glance-poc' in groups['glance_group']"
        fail_msg: >-
          Glance containers must be added to the glance_group so the apps
          secret domain includes their group.

    - name: Assert the apps secret domain includes the Glance group
      ansible.builtin.assert:
        that:
          - "'glance_group' in openbao_secrets_domain_groups.apps"
        fail_msg: >-
          The apps secret domain must include glance_group.
