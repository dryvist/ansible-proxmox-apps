---
# Regression for ../../inventory/load_tofu/propagate_facts.yml delegating
# set_fact to a Homarr host using the upstream PCT connection. The task must
# keep its local connection override and populate the delegated facts. Runs the
# real loader files against stubbed tofu_data with a Homarr-tagged container
# and no live nodes:
#   ansible-playbook tests/inventory_load/verify_propagate_facts_persistent_delegate.yml \
#     -i tests/inventory_load/localhost.yml
- name: Propagate facts to an upstream PCT delegate for any tag set
  hosts: localhost
  gather_facts: false
  vars:
    tofu_data:
      domain: example.internal
      nodes: {}
      containers:
        homarr-poc:
          vmid: 192
          ip: 192.168.0.192
          fqdn: homarr-poc.example.internal
          hostname: homarr-poc
          ansible_connection: community.proxmox.proxmox_pct_remote
          tags: [homarr]
          node: node-a
    monitor_targets: {}
  tasks:
    - name: Add the Homarr-tagged container with its real connection vars
      ansible.builtin.include_tasks: ../../inventory/load_tofu/add_lxc_hosts.yml

    - name: Propagate facts the way the loader does
      ansible.builtin.include_tasks: ../../inventory/load_tofu/propagate_facts.yml

    - name: Assert the delegate uses the upstream transport and received the facts
      ansible.builtin.assert:
        that:
          - hostvars['homarr-poc'].ansible_connection == 'community.proxmox.proxmox_pct_remote'
          - hostvars['homarr-poc'].hostname == 'homarr-poc'
          - hostvars['homarr-poc'].tofu_data.domain == 'example.internal'
