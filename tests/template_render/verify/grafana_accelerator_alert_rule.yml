---
- name: Render and verify the Grafana accelerator under-utilization alert
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../roles/grafana_stack/defaults/main.yml
  vars:
    ansible_become: false
    _rules_template: >-
      {{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/rules-accelerator.yml.j2
    _notification_policy_template: >-
      {{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/notification-policies.yml.j2
  tasks:
    - name: Render the accelerator rule and notification policy
      ansible.builtin.set_fact:
        _accelerator_doc: >-
          {{ lookup('ansible.builtin.template', _rules_template) | from_yaml }}
        _accelerator_policy: >-
          {{ (lookup('ansible.builtin.template', _notification_policy_template)
              | from_yaml).policies[0] }}
      vars:
        grafana_stack_prometheus_url: http://prometheus.example.test:9090

    - name: Assert the accelerator rule targets the GPU accelerators
      ansible.builtin.assert:
        that:
          - _accelerator_groups | length == 1
          - _accelerator_group.name == 'accelerator-busy'
          - _accelerator_group.folder == grafana_stack_alert_folder
          - _accelerator_rules | length == 1
          - _accelerator_rule.uid == 'accelerator-underutilized'
          - _accelerator_rule.labels.severity == 'critical'
          - _accelerator_rule.labels.ntfy | string == 'true'
          - "'accelerator:busy_percent:avg5m' in _accelerator_expr"
          - "'[4h]' in _accelerator_expr"
          - "'gpu-primary' in _accelerator_expr"
          - "'gpu-secondary' in _accelerator_expr"
          - _accelerator_rule.condition == 'B'
          - _accelerator_rule.for == '0s'
          - _accelerator_rule.noDataState == 'Alerting'
          - _accelerator_rule.execErrState == 'Error'
          - _accelerator_evaluator.type == 'lt'
          - _accelerator_evaluator.params == [50]
        fail_msg: >-
          The accelerator rule must cover only gpu-primary and gpu-secondary
          over the 4-hour window and page on a missing busy series.
      vars:
        _accelerator_groups: "{{ _accelerator_doc.groups }}"
        _accelerator_group: "{{ _accelerator_groups[0] }}"
        _accelerator_rules: "{{ _accelerator_group.rules }}"
        _accelerator_rule: "{{ _accelerator_rules[0] }}"
        _accelerator_expr: "{{ _accelerator_rule.data[0].model.expr }}"
        _accelerator_evaluator: "{{ _accelerator_rule.data[1].model.conditions[0].evaluator }}"

    - name: Assert the critical route uses the declared repeat interval
      ansible.builtin.assert:
        that:
          - _accelerator_policy.routes | length == 3
          - _accelerator_policy.routes[2].object_matchers == [['severity', '=', 'critical']]
          - _accelerator_policy.routes[2].receiver == grafana_stack_alert_contact_point_name
          - _accelerator_policy.routes[2].repeat_interval == grafana_stack_alert_critical_repeat_interval
          - _accelerator_policy.routes[2].repeat_interval == '4h'
        fail_msg: >-
          Critical alerts must route through the critical matcher at the
          declared critical repeat interval.
