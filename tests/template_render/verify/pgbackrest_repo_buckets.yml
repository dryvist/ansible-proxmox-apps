---
# pgbackrest.conf bucket names: repo1 and repo2 come from separate inputs, and
# the committed defaults are placeholders the role refuses to deploy.
- name: Verify the pgBackRest repo1 and repo2 bucket names come from separate inputs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Render inputs are play vars, as in pgbackrest_async_archiving.yml. Nothing
    # here contacts a repo.
    postgres_pgbackrest_stanza: fixture-host
    postgres_data_dir: /var/lib/postgresql/17/main
    postgres_port: 5432
    postgres_backup_s3_bucket: fixture-repo1
    postgres_backup_s3_endpoint: s3.fixture.invalid
    postgres_backup_s3_region: us-east-1
    postgres_backup_s3_uri_style: path
    postgres_backup_s3_access_key_id: fixture-key
    postgres_backup_s3_secret_access_key: fixture-secret
    postgres_pgbackrest_repo_path: /postgres/fixture-host
    postgres_pgbackrest_retention_full: 4
    postgres_pgbackrest_repo2_enabled: true
    postgres_pgbackrest_repo2_path: /postgres/fixture-host
    postgres_backup_repo2_s3_bucket: fixture-repo2
    postgres_backup_repo2_s3_endpoint: s3.us-west-004.fixture.invalid
    postgres_backup_repo2_s3_region: us-west-004
    postgres_backup_repo2_s3_uri_style: path
    postgres_backup_repo2_s3_access_key_id: fixture-key-2
    postgres_backup_repo2_s3_secret_access_key: fixture-secret-2
    postgres_pgbackrest_repo2_retention_full: 4
    postgres_pgbackrest_archive_async: false
    postgres_pgbackrest_spool_path: /var/spool/pgbackrest
    postgres_pgbackrest_queue_max: 4GiB
    postgres_pgbackrest_repo1_cipher_type: none
    postgres_pgbackrest_repo1_cipher_pass: ""
    postgres_pgbackrest_repo2_cipher_type: none
    postgres_pgbackrest_repo2_cipher_pass: ""

  tasks:
    # Namespaced on purpose: a plain include_vars would set the role's variable
    # names on localhost and leak them into every later verify play.
    - name: Load the pgBackRest role defaults into a namespace
      ansible.builtin.include_vars:
        file: "../../../roles/postgres/defaults/main/02-pgbackrest.yml"
        name: _pgbr_bucket_defaults

    - name: Assert the committed bucket defaults are the two placeholders
      ansible.builtin.assert:
        that:
          - _pgbr_bucket_defaults.postgres_backup_s3_bucket == 'example-pgbackrest-repo1'
          - _pgbr_bucket_defaults.postgres_backup_repo2_s3_bucket == 'example-pgbackrest-repo2'
        fail_msg: >-
          With neither environment key set, the bucket defaults must resolve to
          example-pgbackrest-repo1 and example-pgbackrest-repo2.

    - name: Assert the placeholder test matches placeholders and not real inputs
      ansible.builtin.assert:
        that:
          - _pgbr_bucket_defaults.postgres_backup_s3_bucket is match('example-')
          - _pgbr_bucket_defaults.postgres_backup_repo2_s3_bucket is match('example-')
          - not (postgres_backup_s3_bucket is match('example-'))
          - not (postgres_backup_repo2_s3_bucket is match('example-'))
        fail_msg: >-
          The match('example-') test used by tasks/pgbackrest.yml must be true
          for the committed defaults and false for the fixture names.

    - name: Render pgbackrest.conf with repo2 enabled
      ansible.builtin.template:
        src: "../../../roles/postgres/templates/pgbackrest.conf.j2"
        dest: "{{ _fixture_dir }}/pgbackrest_repo_buckets.conf"
        mode: "0600"

    - name: Read the rendered configuration
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/pgbackrest_repo_buckets.conf"
      register: _pgbr_buckets_raw

    - name: Assert each repo renders its own bucket
      ansible.builtin.assert:
        that:
          - "'repo1-s3-bucket=fixture-repo1' in (_pgbr_buckets_raw.content | b64decode)"
          - "'repo2-s3-bucket=fixture-repo2' in (_pgbr_buckets_raw.content | b64decode)"
          - "'repo2-s3-bucket=fixture-repo1' not in (_pgbr_buckets_raw.content | b64decode)"
        fail_msg: >-
          pgbackrest.conf.j2 must render repo1-s3-bucket and repo2-s3-bucket
          from their own variables.
