---
- name: Verify the cribl_stream Phoenix destination renders unconditionally
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/cribl_stream/templates"
    # The key is deliberately EMPTY — same contract as cribl_stream_langfuse.yml:
    # a `{% raw %}{% if ..._phoenix_api_key | length > 0 %}{% endraw %}` gate
    # would silently delete the destination instead of failing the converge,
    # so both blocks below must render with no credential at all. This play
    # sets the vars directly, so the defaults' `mandatory` never evaluates.
    cribl_stream_phoenix_api_key: ""
    cribl_stream_phoenix_url: "https://phoenix.example.invalid/v1/traces"
    # Langfuse vars are fixture scaffolding here (asserted by their own play).
    cribl_stream_langfuse_public_key: "fixture"
    cribl_stream_langfuse_secret_key: "fixture"
    cribl_stream_langfuse_url: "https://langfuse.example.invalid/api/public/otel"
    # Remaining vars are fixture scaffolding, not under test.
    cribl_stream_splunk_hec_url: "https://splunk.example.invalid/services/collector/event"
    cribl_stream_splunk_hec_token: "fixture-token"
    cribl_stream_splunk_hec_tls_verify: true
    cribl_stream_pq_enabled: true
    cribl_stream_hec_namespace: ""
    cribl_stream_per_index_indexes: []
    cribl_stream_netflow_port: 2055
    cribl_stream_otel_port: 4318
    cribl_stream_s2s_port: 9997
    cribl_stream_prometheus_rw_port: 8428
    cribl_stream_prometheus_rw_api_path: /api/v1/write
    cribl_stream_ai_log_routing: {}
    cribl_stream_ai_input_types: {}

  tasks:
    - name: Render the cribl_stream outputs and inputs templates
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.yml.j2"
        dest: "{{ _fixture_dir }}/test_cribl_stream_{{ item }}.yml"
        mode: "0644"
      loop:
        - outputs
        - inputs

    - name: Read the rendered cribl_stream fixtures
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_cribl_stream_{{ item }}.yml"
      loop:
        - outputs
        - inputs
      register: _cribl_stream_raw

    - name: Decode the rendered cribl_stream fixtures
      ansible.builtin.set_fact:
        _cribl_stream_outputs: "{{ _cribl_stream_raw.results[0].content | b64decode }}"
        _cribl_stream_inputs: "{{ _cribl_stream_raw.results[1].content | b64decode }}"

    - name: Assert the Phoenix output and its input connection render with an empty key
      ansible.builtin.assert:
        that:
          - "'phoenix_otlp:' in _cribl_stream_outputs"
          - "'authType: token' in _cribl_stream_outputs"
          - "'- output: phoenix_otlp' in _cribl_stream_inputs"
          - "'pipeline: otel_traces_phoenix' in _cribl_stream_inputs"
        fail_msg: >-
          The phoenix_otlp destination or its in_otel connection did not render
          with an empty credential — a credential-conditional gate has been
          reintroduced, which silently deletes the destination instead of
          failing the converge.

    - name: Cribl Stream Phoenix rendering verification PASSED
      ansible.builtin.debug:
        msg: >-
          phoenix_otlp renders in both outputs.yml and inputs.yml regardless of
          credential presence.
