---
- name: Render traefik ACME EnvironmentFile to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/acme.env.j2"
    dest: "{{ _fixture_dir }}/test_traefik_acme.env"
    mode: "0600"

- name: Read rendered ACME EnvironmentFile
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/test_traefik_acme.env"
  register: _traefik_env_raw

- name: Decode ACME EnvironmentFile
  ansible.builtin.set_fact:
    _traefik_env: "{{ _traefik_env_raw.content | b64decode }}"

- name: Assert EnvironmentFile carries the Route53 creds + zone id
  ansible.builtin.assert:
    that:
      - "'AWS_ACCESS_KEY_ID=AKIATESTACCESSKEYID00' in _traefik_env"
      - "'AWS_SECRET_ACCESS_KEY=' in _traefik_env"
      - "'AWS_REGION=us-east-1' in _traefik_env"
      # AWS_HOSTED_ZONE_ID set -> lego can skip ListHostedZonesByName.
      - "'AWS_HOSTED_ZONE_ID=Z0123456789ABCDEFGHIJ' in _traefik_env"
    fail_msg: "acme.env.j2 missing one of the Route53 DNS-01 env vars"

- name: Render multi-zone certificate environment using production discovery selection
  ansible.builtin.template:
    src: "{{ _template_dir }}/acme.env.j2"
    dest: "{{ _fixture_dir }}/test_traefik_acme_multizone.env"
    mode: "0600"
  vars:
    traefik_acme_route53_discovery: >-
      {{ (traefik_ingress_routes | selectattr('tls_domains', 'defined')
          | map(attribute='tls_domains') | flatten
          | reject('equalto', traefik_base_domain)
          | reject('search', '[.]' ~ (traefik_base_domain | regex_escape) ~ '$')
          | list | length) > 0 }}

- name: Read the multi-zone certificate environment
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/test_traefik_acme_multizone.env"
  register: _traefik_multizone_env

- name: Require Route53 zone discovery for certificates spanning zones
  ansible.builtin.assert:
    that:
      - "'AWS_HOSTED_ZONE_ID' not in (_traefik_multizone_env.content | b64decode)"
