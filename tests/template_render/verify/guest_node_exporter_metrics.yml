---
# Keep guest swap and pressure metrics at Prometheus scrape time. The scrape
# config reads this exact list from inventory/group_vars/prometheus_group.yml.
- name: Verify guest node_exporter health metric retention
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../../../inventory/group_vars/prometheus_group.yml"
  tasks:
    - name: Assert the guest exporter retains memory, swap, load, and PSI families
      ansible.builtin.assert:
        that:
          - "'node_memory_Mem(Total|Available)_bytes' in guest_node_exporter_keep_metrics"
          - "'node_memory_Swap(Free|Total)_bytes' in guest_node_exporter_keep_metrics"
          - "'node_load(1|5|15)' in guest_node_exporter_keep_metrics"
          - "'node_pressure_.*' in guest_node_exporter_keep_metrics"
