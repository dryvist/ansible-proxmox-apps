---
- name: Verify the macmon Prometheus scrape job
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _pst_tpl: "{{ playbook_dir }}/../../../roles/prometheus_stack/templates/prometheus.yml.j2"
    _fixture_mac_workstations:
      mac-primary:
        host: mac-primary.example.invalid
        roles: [mac-primary-serving]
      mac-secondary:
        host: mac-secondary.example.invalid
        roles: [mac-secondary-serving]
    _fixture_tofu_data:
      domain: test.example
      workstations: "{{ _fixture_mac_workstations }}"
      constants:
        service_ports:
          prometheus_web: 9090
          blackbox_exporter: 9115
          node_exporter: 9100
          llm_router_api: 4321
          llm_fast_api: 10434
          smokeping_prober: 9374
          gatus_web: 8080
          agentgateway_metrics: 15020
        memory_ports:
          hindsight_api: 8888
          hindsight_cp: 9999
      nodes: {}
      containers:
        agentgateway:
          ip: agw.test.example
          tags: [agentgateway]
        cribl-stream-01:
          ip: stream.test.example
          tags: [cribl-stream]

  vars_files:
    - "../../../roles/prometheus_stack/defaults/main.yml"
    - "../../../inventory/group_vars/prometheus_group.yml"

  tasks:
    - name: Publish fixture inventory values
      ansible.builtin.set_fact:
        tofu_data: "{{ _fixture_tofu_data }}"
        wan_hop_discovery_isp_hops: []

    - name: Render prometheus.yml
      ansible.builtin.set_fact:
        _rendered: "{{ lookup('template', _pst_tpl) | from_yaml }}"

    - name: Isolate the macmon job
      ansible.builtin.set_fact:
        _jobs: "{{ _rendered.scrape_configs | selectattr('job_name', 'equalto', 'macmon') | list }}"

    - name: Assert the Mac metrics endpoint is scraped from derived inventory values
      ansible.builtin.assert:
        quiet: true
        that:
          - _jobs | length == 1
          - _jobs[0].scrape_interval == '60s'
          - _jobs[0].metrics_path == '/metrics'
          - _jobs[0].static_configs | length == 2
          - _jobs[0].static_configs[0].targets == ['mac-primary.example.invalid:9090']
          - _jobs[0].static_configs[0].labels.accelerator == 'mac-primary'
          - _jobs[0].static_configs[1].targets == ['mac-secondary.example.invalid:9090']
          - _jobs[0].static_configs[1].labels.accelerator == 'mac-secondary'
        fail_msg: >-
          Expected two role-labelled macmon scrapes at the default metrics port.
          Rendered: {{ _jobs }}

    - name: Drop the secondary Mac workstation from the fixture inventory
      ansible.builtin.set_fact:
        tofu_data: >-
          {{ _fixture_tofu_data | combine({
            'workstations': _fixture_mac_workstations
              | dict2items
              | rejectattr('key', 'equalto', 'mac-secondary')
              | items2dict
          }) }}

    - name: Report the missing Mac role through the shared warning task
      ansible.builtin.include_tasks: >-
        {{ playbook_dir }}/../../../roles/prometheus_stack/tasks/macmon_inventory_warnings.yml

    - name: Render prometheus.yml without the secondary Mac
      ansible.builtin.set_fact:
        _jobs_primary_only: >-
          {{ (lookup('template', _pst_tpl) | from_yaml).scrape_configs
             | selectattr('job_name', 'equalto', 'macmon') | list }}

    - name: Assert a missing workstation role omits only its Mac target
      ansible.builtin.assert:
        quiet: true
        that:
          - _jobs_primary_only[0].static_configs | length == 1
          - _jobs_primary_only[0].static_configs[0].labels.accelerator == 'mac-primary'
          - _jobs_primary_only[0].static_configs[0].targets == ['mac-primary.example.invalid:9090']
          - prometheus_stack_macmon_missing_roles == ['mac-secondary-serving']
          - prometheus_stack_macmon_missing_role_warnings.results | length == 1
          - "'mac-secondary-serving' in prometheus_stack_macmon_missing_role_warnings.results[0].msg"
        fail_msg: >-
          Expected the missing mac-secondary-serving role to be logged and omitted.
          Rendered: {{ _jobs_primary_only }}
