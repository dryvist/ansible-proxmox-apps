---
# Render gatus-config.yaml.j2 and assert:
# - catalog endpoints group by the same "Category · UI/API" split the Glance
#   board already uses (audience_widget in generated-services.yml.j2), using
#   dashboard_catalog_group_titles — the same map, not a second hand-kept list.
# - the ntfy alert routing overrides (keystone/node/service/deadman) still
#   target the group names those endpoints actually render with, so renaming
#   the catalog groups above never silently breaks urgent-topic routing.
- name: Render and verify gatus grouping
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    ansible_managed: "test fixture"
    status_stack_data_dir: /opt/status-stack
    status_stack_gatus_data_dir: "{{ status_stack_data_dir }}/gatus/data"
    status_stack_gatus_storage_path: /data/gatus.db
    status_stack_interval: "60s"
    status_stack_ui_dashboard_heading: "Homelab Status"
    status_stack_ntfy_url: "https://ntfy.example.test/observability"
    status_stack_ntfy_topic_degraded: "observability"
    status_stack_ntfy_topic_urgent: "keystone"
    status_stack_ntfy_priority_degraded: 3
    status_stack_ntfy_priority_urgent: 5
    status_stack_failure_threshold: 3
    status_stack_authelia_error_patterns:
      - "invalid_client"
    status_stack_authelia_public_url: "https://authelia.example.test"
    status_stack_catalog_status_overrides:
      override-check: [200, 302]
    status_stack_authenticated_endpoints: []
    status_stack_kuma_keystones:
      - name: Traefik HTTPS
        url: "https://traefik.example.test/"
    status_stack_oidc_clients: []
    status_stack_deadman_endpoints:
      - { name: technitium-dns, heartbeat: 5m }
    status_stack_deadman_token: "test-deadman-token"
    status_stack_monitor_targets:
      icmp:
        - { name: pve-node-1, fqdn: pve-node-1.example.test, group: node }
      tcp: []
      http:
        - name: splunk-mgmt
          fqdn: splunk.example.test
          port: 8089
          path: "/"
          group: service
          expect_status: [200]
    dashboard_catalog_group_titles:
      apps: Apps
      ai: AI
      media_svc: Media
      other: Other
    dashboard_catalog_services_monitor:
      - name: plex
        title: Plex
        group: media_svc
        ui: true
        sso: true
        url: "https://plex.example.test"
        probe_url: "http://192.0.2.6:32400"
      - name: sonarr-api
        title: Sonarr API
        group: media_svc
        ui: false
        sso: true
        url: "https://sonarr.example.test/api"
        probe_url: ""
      - name: litellm
        title: LiteLLM
        group: ai
        ui: false
        sso: true
        url: "https://litellm.example.test"
        probe_url: ""
      - name: nautobot
        title: Nautobot
        group: apps
        ui: true
        sso: true
        url: "https://nautobot.example.test"
        probe_url: "http://nautobot-guest.example.test:8080"
      - name: public-check
        group: apps
        ui: true
        sso: false
        url: "https://public-check.example.test"
        probe_url: "http://public-check-guest.example.test:8080"
      - name: override-check
        group: apps
        ui: true
        sso: true
        url: "https://override-check.example.test"
        probe_url: "http://override-check-guest.example.test:8080"
      - name: probe-path-check
        group: apps
        ui: true
        sso: true
        url: "https://probe-path-check.example.test"
        probe_url: "http://probe-path-check-guest.example.test:8080"
        probe_path: "/health"

  tasks:
    - name: Render gatus-config.yaml
      ansible.builtin.template:
        src: "../../../roles/status_stack/templates/gatus-config.yaml.j2"
        dest: "{{ render_tmp }}/gatus-config.yaml"
        mode: "0600"

    - name: Read back the rendered config
      ansible.builtin.slurp:
        src: "{{ render_tmp }}/gatus-config.yaml"
      register: _gatus_raw

    - name: Parse the rendered config
      ansible.builtin.set_fact:
        _gatus: "{{ _gatus_raw.content | b64decode | from_yaml }}"

    - name: Assert Gatus stores alert history in SQLite
      ansible.builtin.assert:
        that:
          - _gatus.storage.type == 'sqlite'
          - _gatus.storage.path == '/data/gatus.db'
        fail_msg: >-
          Gatus alert history must use the SQLite database at
          {{ status_stack_gatus_storage_path }}.

    - name: Render and parse the status stack compose definition
      ansible.builtin.set_fact:
        _status_stack_compose: >-
          {{ lookup('ansible.builtin.template', _compose_template) | from_yaml }}
      vars:
        _compose_template: >-
          {{ playbook_dir }}/../../../roles/status_stack/templates/docker-compose.yml.j2
        status_stack_gatus_image: fixture/gatus
        status_stack_gatus_container_name: gatus
        status_stack_kuma_image: fixture/uptime-kuma
        status_stack_kuma_container_name: uptime-kuma
        status_stack_kuma_port: "3001"
        status_stack_autokuma_image: fixture/autokuma
        status_stack_autokuma_container_name: autokuma
        status_stack_autokuma_static_monitors_dir: >-
          {{ status_stack_data_dir }}/autokuma/static-monitors
        status_stack_autokuma_kuma_url: http://127.0.0.1:3001
        status_stack_kuma_admin_username: fixture
        status_stack_effective_kuma_password: fixture-kuma-password

    - name: Assert Gatus data survives a container replacement
      ansible.builtin.assert:
        that:
          - >-
            '/opt/status-stack/gatus/config.yaml:/config/config.yaml:ro'
            in _status_stack_compose.services.gatus.volumes
          - >-
            '/opt/status-stack/gatus/data:/data'
            in _status_stack_compose.services.gatus.volumes
        fail_msg: >-
          Gatus must keep its read-only config mount and persist the SQLite
          data directory at {{ status_stack_gatus_data_dir }}:/data.

    - name: Assert catalog endpoints group as "Category · UI/API"
      ansible.builtin.assert:
        that:
          - (_gatus.endpoints | selectattr('name', 'eq', 'plex') | first).group == 'Media · UI'
          - (_gatus.endpoints | selectattr('name', 'eq', 'sonarr-api') | first).group == 'Media · API'
          - (_gatus.endpoints | selectattr('name', 'eq', 'litellm') | first).group == 'AI · API'
        fail_msg: >-
          Catalog endpoints must group as "<dashboard_catalog_group_titles
          label> · UI/API", mirroring the Glance board's audience split:
          {{ _gatus.endpoints | map(attribute='group') | list }}

    - name: Assert direct defaults reject 400 without changing other branches
      ansible.builtin.assert:
        that:
          - "'[STATUS] != 400' in _by_name.plex.conditions"
          - "'[STATUS] != 400' in _by_name.nautobot.conditions"
          - "'[STATUS] != 400' not in _by_name['public-check'].conditions"
          - _by_name['override-check'].conditions == ['[STATUS] == any(200, 302)', '[RESPONSE_TIME] < 3000']
          - _by_name['probe-path-check'].conditions == ['[STATUS] == 200', '[RESPONSE_TIME] < 3000']
        fail_msg: >-
          Only default direct probes must reject HTTP 400. Public rows, status
          overrides, and probe_path rows retain their existing conditions.
        success_msg: >-
          Direct defaults reject HTTP 400; public, override, and probe_path
          conditions are unchanged.
      vars:
        _by_name: "{{ dict(_gatus.endpoints | map(attribute='name') | zip(_gatus.endpoints)) }}"

    - name: Assert ntfy urgent-topic routing still targets the real endpoint groups
      ansible.builtin.assert:
        that:
          - _override_groups | sort == ['deadman', 'keystone', 'node', 'service']
          # Every override group must be a group some endpoint actually renders
          # with, or the urgent route is silently dead.
          - "'node' in _endpoint_groups"
          - "'service' in _endpoint_groups"
          - "'keystone' in _endpoint_groups"
          - "'deadman' in _endpoint_groups"
          # Catalog groups (the ones this change renamed) must NOT collide
          # with a routing override group.
          - "'Media · UI' not in _override_groups"
        fail_msg: >-
          ntfy override groups {{ _override_groups }} must match the group
          names Gatus endpoints actually carry: {{ _endpoint_groups }}
      vars:
        _override_groups: "{{ _gatus.alerting.ntfy.overrides | map(attribute='group') | list }}"
        _endpoint_groups: >-
          {{ (_gatus.endpoints | map(attribute='group') | list)
             + (_gatus['external-endpoints'] | map(attribute='group') | list) }}

    - name: Assert the dashboard UI is set to group-sorted
      ansible.builtin.assert:
        that:
          - _gatus.ui['default-sort-by'] == 'group'
          - _gatus.ui['dashboard-heading'] == 'Homelab Status'
          - _gatus.ui['dark-mode'] == true
        fail_msg: "gatus-config.yaml.j2 must set ui.default-sort-by: group and ui.dark-mode: true: {{ _gatus.ui }}"

    - name: Gatus grouping verification PASSED
      ansible.builtin.debug:
        msg: |
          Gatus grouping assertions passed:
          - Catalog endpoints group as "<Category> · UI/API" from dashboard_catalog_group_titles
          - keystone/node/service/deadman routing overrides still match real endpoint groups
          - ui.default-sort-by is group
