---
- name: Verify the active json_exporter executor list
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../roles/prometheus_stack/defaults/main/10-json-exporter.yml"

  tasks:
    - name: Assert a blank credential drops the executor and a present one keeps it
      vars:
        prometheus_stack_json_exporter_credentials: "{{ item.credentials }}"
      ansible.builtin.assert:
        that:
          - prometheus_stack_json_exporter_active_executors | map(attribute='name') | list == item.names
      loop:
        - { credentials: {}, names: [] }
        - { credentials: { zcode: "   " }, names: [] }
        - { credentials: { other: "fixture" }, names: [] }
        - { credentials: { zcode: "fixture" }, names: [zcode] }
      loop_control:
        label: "{{ item.names }}"
