---
- name: Verify the active json_exporter executor list
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../roles/prometheus_stack/defaults/main/10-json-exporter.yml"

  tasks:
    - name: Assert the feature flag and a present credential keep an executor and anything else drops it
      vars:
        prometheus_stack_json_exporter_quota_enabled: "{{ item.enabled }}"
        prometheus_stack_json_exporter_credentials: "{{ item.credentials }}"
      ansible.builtin.assert:
        that:
          - prometheus_stack_json_exporter_active_executors | map(attribute='name') | list == item.names
      loop:
        - { enabled: false, credentials: {}, names: [] }
        - { enabled: false, credentials: { zcode: "fixture" }, names: [] }
        - { enabled: true, credentials: {}, names: [] }
        - { enabled: true, credentials: { zcode: "   " }, names: [] }
        - { enabled: true, credentials: { other: "fixture" }, names: [] }
        - { enabled: true, credentials: { zcode: "fixture" }, names: [zcode] }
      loop_control:
        label: "{{ item.names }}"
