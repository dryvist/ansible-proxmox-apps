---
- name: Verify dispatcher access templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../roles/agent_sandbox/defaults/main.yml"
  vars:
    ansible_become: false
    _dispatch_templates: "{{ playbook_dir }}/../../../roles/agent_sandbox/templates"
    _dispatch_state_task: >-
      {{ (lookup('file', playbook_dir ~ '/../../../roles/agent_sandbox/tasks/main/deploy.yml')
      | from_yaml | selectattr('name', 'equalto', 'Create the host dispatcher state directory')
      | first)['ansible.builtin.file'] }}
  tasks:
    - name: Allocate a state task render fixture
      ansible.builtin.tempfile:
        state: file
        suffix: .j2
      register: _dispatch_state_fixture

    - name: Write the state task fixture
      ansible.builtin.copy:
        content: "{{ _dispatch_state_task | to_yaml }}"
        dest: "{{ _dispatch_state_fixture.path }}"
        mode: "0600"

    - name: Assert enabled dispatcher owns its state directory
      ansible.builtin.assert:
        that:
          - _dispatch_state_rendered.owner == agent_sandbox_dispatch_user
          - _dispatch_state_rendered.group == agent_sandbox_dispatch_user
          - _dispatch_state_rendered.mode == '0700'
      vars:
        agent_sandbox_dispatch_access_enabled: true
        _dispatch_state_rendered: "{{ lookup('template', _dispatch_state_fixture.path) | from_yaml }}"

    - name: Assert disabled access retains the operator state directory
      ansible.builtin.assert:
        that:
          - _dispatch_state_rendered.owner == agent_sandbox_operator_user
          - _dispatch_state_rendered.group == agent_sandbox_operator_user
      vars:
        agent_sandbox_dispatch_access_enabled: false
        _dispatch_state_rendered: "{{ lookup('template', _dispatch_state_fixture.path) | from_yaml }}"

    - name: Remove the state task render fixture
      ansible.builtin.file:
        path: "{{ _dispatch_state_fixture.path }}"
        state: absent

    - name: Render dispatcher access templates
      vars:
        agent_sandbox_dispatch_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA client-one
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB client-two
      ansible.builtin.set_fact:
        _dispatch_keys: "{{ lookup('template', _dispatch_templates ~ '/dispatch-authorized-keys.j2') }}"
        _dispatch_sshd: "{{ lookup('template', _dispatch_templates ~ '/dispatch-sshd.conf.j2') }}"

    - name: Assert every key is restricted to the dispatcher
      ansible.builtin.assert:
        that:
          - _dispatch_keys.splitlines() | length == 2
          - >-
            _dispatch_keys.splitlines() | select('match',
            '^restrict,command="/usr/local/bin/agent-dispatch-ssh" ssh-ed25519 ') | list | length == 2
          - "'    ForceCommand /usr/local/bin/agent-dispatch-ssh' in _dispatch_sshd"
          - "'    DisableForwarding yes' in _dispatch_sshd"
          - "'    PermitTTY no' in _dispatch_sshd"
          - "'    PermitUserRC no' in _dispatch_sshd"
          - "'    AuthenticationMethods publickey' in _dispatch_sshd"
          - "'Match User agent-dispatch' in _dispatch_sshd"
          - "'    AuthorizedKeysFile /etc/ssh/agent-dispatch-keys/agent-dispatch' in _dispatch_sshd"

    - name: Assert an empty list revokes all keys
      ansible.builtin.assert:
        that:
          - lookup('template', _dispatch_templates ~ '/dispatch-authorized-keys.j2') | default('', true) | trim == ''
      vars:
        agent_sandbox_dispatch_authorized_keys: []
