---
# One malformed CI-fix config for the shape assert in openhands_ci_fix.yml.
- name: Verify the CI-fix shape assert rejects one malformed config
  block:
    - name: Run the CI-fix shape assert
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_shape.yml"
      vars:
        _openhands_ci_fix: "{{ _ci_fix_case }}"
        openhands_ci_fix_profiles_create: "{{ _ci_fix_case.create | default(false) }}"

    - name: Fail if the shape assert accepted a malformed config
      ansible.builtin.fail:
        msg: "The CI-fix shape assert accepted {{ _ci_fix_case | to_json }}"
  rescue:
    - name: Confirm the shape assert rejected the config
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Assert the CI-fix config has the expected shape'
