---
- name: Render and verify ntfy_docker templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Mirror roles/ntfy_docker/defaults/main.yml
    ntfy_docker_image: "binwiederhier/ntfy:v2.17.0"
    ntfy_docker_container_name: ntfy
    ntfy_docker_http_port: 8080
    ntfy_docker_data_dir: /opt/ntfy
    ntfy_docker_cache_duration: "5m"
    ntfy_docker_attachment_cache_dir: /var/cache/ntfy/attachments
    # Mirror roles/ntfy_docker/defaults/main.yml: topics that skip all-alerts.
    # No test topic below is excluded, so every existing assertion is unchanged.
    ntfy_docker_all_alerts_excluded_topics:
      - hermes-all
      - hermes-noise
      - router-budget
    ntfy_docker_ai_jobs_enabled: false
    ntfy_docker_auth_dir: /opt/ntfy/auth
    ntfy_docker_auth_file: /var/lib/ntfy/user.db
    # Shape-mirror of the role default: service name + ingress base over HTTPS.
    # A literal placeholder domain stands in for the environment lookup so the
    # assertion below is exact rather than dependent on the runner's env.
    ntfy_docker_base_url: "https://{{ ntfy_docker_container_name }}.example.test"
    _template_dir: "../../../../roles/ntfy_docker/templates"

  tasks:
    - name: Render and verify the ntfy compose and server configs
      ansible.builtin.include_tasks: ntfy_docker/render_compose_and_server.yml

    - name: Verify the Slack fan-out routing
      ansible.builtin.include_tasks: ntfy_docker/slack_fanout_routing.yml

    - name: Verify the Slack fan-out guards and env files
      ansible.builtin.include_tasks: ntfy_docker/slack_fanout_guards.yml

    - name: Verify the canary units and script
      ansible.builtin.include_tasks: ntfy_docker/canary.yml

    - name: Ntfy template rendering PASSED
      ansible.builtin.debug:
        msg: |
          Ntfy template assertions passed:
          - docker-compose.yml.j2: HTTP port 8080:80, image, config mount
          - server.yml.j2: cache-file, listen-http, cache-duration
          - Slack fan-out: all-alerts + per-topic instances, unseeded key fails
          - canary: fronted publish + read-back, off-site ping only when seeded
