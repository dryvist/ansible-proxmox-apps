---
# =============================================================================
# agent_sandbox — container-egress filter, compose pins and egress allowlist
# =============================================================================
# The nftables table is the backstop behind the internal docker network: if it
# renders with an extra accept, or without its default drop, a container that
# ignores its proxy settings reaches the internet and nothing else turns red.
# The allowlist contains exact hosts plus the two documented Cursor suffixes;
# every entry is asserted here, positive and negative.
#
# The published Web bind and ingress source are inventory-derived. No
# container address or network subnet is hand-pinned here.
#
# Registered and set_fact values persist into the later plays of the same run
# and outrank their task vars, so every name here carries the _as_ prefix.
- name: Render and verify the agent_sandbox filter and allowlist
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../roles/agent_sandbox/defaults/main.yml"

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "{{ playbook_dir }}/../../../roles/agent_sandbox/templates"
    # Simulate the former host-only secret-store hostname variable. The
    # container-facing list must ignore any such ambient/internal domain.
    agent_sandbox_internal_domains: [openbao.example.invalid]
  tasks:
    - name: Set the test inventory-derived addresses and secret group id
      ansible.builtin.set_fact:
        ingress_domain: example.invalid
        agent_sandbox_zcode_web_bind_address: 192.0.2.20
        agent_sandbox_zcode_web_secret_gid: 1901
        agent_sandbox_zcode_web_ingress_source_ips:
          - 192.0.2.10
        agent_sandbox_dispatch_alert_url: https://ntfy.example.invalid
        agent_sandbox_dispatch_alert_token: tk_RenderFixtureOnly987

    - name: Render the ruleset, compose and allowlist
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.src }}"
        dest: "{{ _fixture_dir }}/test_agent_sandbox_{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: agent-sandbox.nft.j2, dest: agent-sandbox.nft }
        - { src: docker-compose.yml.j2, dest: docker-compose.yml }
        - { src: allowed-domains.txt.j2, dest: allowed-domains.txt }

    - name: Render the private refused-login alert environment fixture
      ansible.builtin.template:
        src: "{{ _template_dir }}/dispatcher-alert.env.j2"
        dest: "{{ _fixture_dir }}/test_agent_sandbox_dispatcher-alert.env"
        mode: "0600"

    - name: Render CI resolver environment, units and helper fixtures
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.src }}"
        dest: "{{ _fixture_dir }}/test_agent_sandbox_{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: ci-resolver.env.j2, dest: ci-resolver.env }
        - { src: ci-resolver.service.j2, dest: ci-resolver.service }
        - { src: ci-resolver-workbook.service.j2, dest: ci-resolver-workbook.service }
        - { src: ci-resolver-workbook.timer.j2, dest: ci-resolver-workbook.timer }
        - { src: ci-resolver-learn.service.j2, dest: ci-resolver-learn.service }
        - { src: ci-resolver-learn.timer.j2, dest: ci-resolver-learn.timer }
        - { src: ci-resolver-secret.sh.j2, dest: ci-resolver-secret }

    - name: Read the rendered files
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_agent_sandbox_{{ item }}"
      register: _as_rendered
      loop:
        - agent-sandbox.nft
        - docker-compose.yml
        - allowed-domains.txt
        - dispatcher-alert.env
        - ci-resolver.env
        - ci-resolver.service
        - ci-resolver-workbook.service
        - ci-resolver-workbook.timer
        - ci-resolver-learn.service
        - ci-resolver-learn.timer
        - ci-resolver-secret

    - name: Decode the rendered files
      ansible.builtin.set_fact:
        _as_nft: "{{ _as_rendered.results[0].content | b64decode }}"
        _as_compose: "{{ _as_rendered.results[1].content | b64decode }}"
        _as_domains: "{{ _as_rendered.results[2].content | b64decode | split('\n')
          | reject('match', '^[ ]*(#|$)') | map('trim') | list }}"
        _as_dispatcher_alert_env: "{{ _as_rendered.results[3].content | b64decode }}"
        _as_ci_resolver_env: "{{ _as_rendered.results[4].content | b64decode }}"
        _as_ci_resolver_service: "{{ _as_rendered.results[5].content | b64decode }}"
        _as_ci_resolver_workbook_service: "{{ _as_rendered.results[6].content | b64decode }}"
        _as_ci_resolver_workbook_timer: "{{ _as_rendered.results[7].content | b64decode }}"
        _as_ci_resolver_learn_service: "{{ _as_rendered.results[8].content | b64decode }}"
        _as_ci_resolver_learn_timer: "{{ _as_rendered.results[9].content | b64decode }}"
        _as_ci_resolver_secret_helper: "{{ _as_rendered.results[10].content | b64decode }}"

    - name: Collect the CI resolver environment variable names
      ansible.builtin.set_fact:
        _as_ci_resolver_env_names: >-
          {{ _as_ci_resolver_env | regex_findall('(?m)^(CI_RESOLVER_[A-Z_]+)=') | sort }}

    - name: Collect the rules that match the agent bridge
      ansible.builtin.set_fact:
        _as_rules: "{{ _as_nft | split('\n')
          | select('search', '^[ ]*iifname \"' ~ agent_sandbox_bridge ~ '\" ')
          | map('trim') | list }}"

    - name: Assert container egress is default-drop except the proxy port
      vars:
        _as_accepts: "{{ _as_rules | select('search', ' accept$') | list }}"
        _as_bridge: "{{ agent_sandbox_bridge }}"
      ansible.builtin.assert:
        that:
          - "'chain DOCKER-USER {' in _as_nft"
          - "'hook forward' in _as_nft"
          # Exactly one allowance from the agent bridge: the proxy port, on
          # the bridge itself.
          - _as_accepts | length == 1
          - >-
            ('iifname "' ~ _as_bridge ~ '" oifname "' ~ _as_bridge ~ '" tcp dport '
            ~ agent_sandbox_proxy_port ~ ' accept') in _as_accepts
          # The last rule for the agent bridge is the unconditional drop.
          - _as_rules | last is search('counter drop$')
          # The default inbound drop still applies after the exact Web exception.
          - _as_nft is search('oifname "' ~ _as_bridge ~ '" counter drop')
          # Other container bridges may not forward at all.
          - _as_nft is search('iifname "docker0" counter drop')
          - >-
            _as_nft is search('iifname "br-[*]" iifname != [{] "' ~ _as_bridge
            ~ '", "' ~ agent_sandbox_egress_bridge ~ '" [}] counter drop')
        fail_msg: >-
          The container-egress ruleset must accept only the proxy and exact Web
          ingress paths and drop all other bridge traffic. Rendered: {{ _as_nft }}

    - name: Assert the ruleset has no catch-all allowance
      ansible.builtin.assert:
        that:
          # Every accept names a port or the established-flow state.
          - >-
            _as_nft | split('\n') | select('search', ' accept$')
            | reject('search', 'dport|ct state') | list | length == 0
          - "'0.0.0.0/0' not in _as_nft"
          - "'policy drop' not in _as_nft"
          - "'flush ruleset' not in _as_nft"
        fail_msg: >-
          The container-egress ruleset must not carry a catch-all accept or
          touch rules outside its own table.

    - name: Assert only inventoried Traefik may reach the published Web service
      vars:
        _as_ingress_rules: "{{ _as_nft | split('\\n')
          | select('search', 'oifname \"' ~ agent_sandbox_bridge ~ '\" ip saddr ')
          | list }}"
      ansible.builtin.assert:
        that:
          - _as_ingress_rules | length == agent_sandbox_zcode_web_ingress_source_ips | length
          - >-
            ('oifname "' ~ agent_sandbox_bridge ~ '" ip saddr ' ~ item ~ ' tcp dport '
            ~ agent_sandbox_zcode_web_port ~ ' ct status dnat ct original proto-dst '
            ~ agent_sandbox_zcode_web_host_port ~ ' accept') in _as_nft
        fail_msg: >-
          The published Web port must be reachable only from inventoried
          Traefik addresses through Docker's expected DNAT mapping.
      loop: "{{ agent_sandbox_zcode_web_ingress_source_ips }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert bridge names and all addresses come from inventory
      vars:
        _as_ipv4: '[0-9][0-9]?[0-9]?[.][0-9]+[.][0-9]+[.][0-9]+'
      ansible.builtin.assert:
        that:
          - agent_sandbox_bridge | length <= 15
          - agent_sandbox_egress_bridge | length <= 15
          - agent_sandbox_bridge != agent_sandbox_egress_bridge
          - "('com.docker.network.bridge.name: ' ~ agent_sandbox_bridge) in _as_compose"
          - "('com.docker.network.bridge.name: ' ~ agent_sandbox_egress_bridge) in _as_compose"
          - "'ipv4_address:' not in _as_compose"
          - "'subnet:' not in _as_compose"
          - >-
            (_as_nft | regex_findall(_as_ipv4) | unique | sort)
            == (agent_sandbox_zcode_web_ingress_source_ips | unique | sort)
          - >-
            ('"' ~ agent_sandbox_zcode_web_bind_address ~ ':'
            ~ agent_sandbox_zcode_web_host_port ~ ':'
            ~ agent_sandbox_zcode_web_port ~ '"') in _as_compose
        fail_msg: >-
          The compose network must pin the bridge names the ruleset keys off,
          each name must fit an interface name, and every rendered IP must
          originate in the runtime inventory.

    - name: Assert the Web service is pinned and hardened
      ansible.builtin.assert:
        that:
          - >-
            agent_sandbox_zcode_web_image
            == ('ghcr.io/dryvist/nix-agent-sandbox/agent@sha256:'
            ~ 'a0d818a658dd93233623ca5523c23bfd0f7b47ec56cb60d9cbc5d05271a01868')
          - "('image: ' ~ agent_sandbox_zcode_web_image) in _as_compose"
          - "('container_name: ' ~ agent_sandbox_zcode_web_container) in _as_compose"
          - "'restart: unless-stopped' in _as_compose"
          - "'group_add:' in _as_compose"
          - "'\"1901\"' in _as_compose"
          - >-
            ('user: "' ~ '1000:1000' ~ '"') in _as_compose
          - "'read_only: true' in _as_compose"
          - "'cap_drop: [ALL]' in _as_compose"
          - "'no-new-privileges:true' in _as_compose"
          - "('mem_limit: ' ~ agent_sandbox_zcode_web_memory_limit) in _as_compose"
          - "('cpus: ' ~ agent_sandbox_zcode_web_cpus) in _as_compose"
          - "('pids_limit: ' ~ agent_sandbox_zcode_web_pids_limit | string) in _as_compose"
          - "('source: ' ~ agent_sandbox_zcode_web_env_file) in _as_compose"
          - "'target: /run/agent-service.env' in _as_compose"
          - "'target: /home/agent/.zcode' in _as_compose"
          - "'target: /home/agent/work' in _as_compose"
          - "'AGENT_WEB_TOKEN=' not in _as_compose"
          - "'ZAI_SUBSCRIPTION_KEY=' not in _as_compose"
        fail_msg: >-
          ZCode Web must use the immutable image digest, non-root hardening,
          persistent state mounts, and a read-only credential file mount.

    - name: Assert the refused-login alert environment carries the alert settings
      ansible.builtin.assert:
        that:
          - "'AGENT_DISPATCH_NTFY_ALERT_URL=' ~ agent_sandbox_dispatch_alert_url in _as_dispatcher_alert_env"
          - "'AGENT_DISPATCH_NTFY_ALERT_TOKEN=' ~ agent_sandbox_dispatch_alert_token in _as_dispatcher_alert_env"
        fail_msg: >-
          The dispatcher's refused-login alert settings render into their
          root-only environment file.

    - name: Assert CI resolver environment names and default values
      vars:
        _as_expected_ci_resolver_env_names:
          - CI_RESOLVER_APP_ID
          - CI_RESOLVER_DISPATCH_CMD
          - CI_RESOLVER_GH_TOKEN_CMD
          - CI_RESOLVER_MAX_ATTEMPTS
          - CI_RESOLVER_ORG
          - CI_RESOLVER_REPOS
          - CI_RESOLVER_SHADOW
          - CI_RESOLVER_STATE_DIR
          - CI_RESOLVER_TOKEN_REPO
          - CI_RESOLVER_VIKUNJA_PROJECT
          - CI_RESOLVER_VIKUNJA_TOKEN_CMD
          - CI_RESOLVER_VIKUNJA_URL
          - CI_RESOLVER_WORKBOOK_DIR
          - CI_RESOLVER_ZAMMAD_GROUP
          - CI_RESOLVER_ZAMMAD_TOKEN_CMD
          - CI_RESOLVER_ZAMMAD_URL
      ansible.builtin.assert:
        that:
          - _as_ci_resolver_env_names == _as_expected_ci_resolver_env_names | sort
          - agent_sandbox_ci_resolver_enabled is false
          - agent_sandbox_ci_resolver_shadow is true
          - "'CI_RESOLVER_APP_ID=' in _as_ci_resolver_env"
          - "'CI_RESOLVER_ORG=dryvist' in _as_ci_resolver_env"
          - "'CI_RESOLVER_GH_TOKEN_CMD=/usr/local/lib/agent-sandbox/ci-resolver-secret token' in _as_ci_resolver_env"
          - "'CI_RESOLVER_TOKEN_REPO=dryvist/.github' in _as_ci_resolver_env"
          - "'CI_RESOLVER_DISPATCH_CMD=/usr/local/bin/agent-dispatch' in _as_ci_resolver_env"
          - "'CI_RESOLVER_WORKBOOK_DIR=/var/lib/ci-resolver/prompts/automation/ci-workbook' in _as_ci_resolver_env"
          - "'CI_RESOLVER_STATE_DIR=/var/lib/ci-resolver' in _as_ci_resolver_env"
          - "'CI_RESOLVER_MAX_ATTEMPTS=3' in _as_ci_resolver_env"
          - "'CI_RESOLVER_REPOS=' in _as_ci_resolver_env"
          - "'CI_RESOLVER_SHADOW=1' in _as_ci_resolver_env"
          - "('CI_RESOLVER_VIKUNJA_URL=https://vikunja.' ~ ingress_domain) in _as_ci_resolver_env"
          - "'CI_RESOLVER_VIKUNJA_PROJECT=44' in _as_ci_resolver_env"
          - "('CI_RESOLVER_ZAMMAD_URL=https://zammad.' ~ ingress_domain) in _as_ci_resolver_env"
          - >-
            _as_ci_resolver_env is search(
            "CI_RESOLVER_ZAMMAD_GROUP='Homelab Infrastructure'")
          - >-
            _as_ci_resolver_env is not search(
            '(?i)(tk_[A-Za-z0-9]{12,}|gh[opsu]_[A-Za-z0-9]{12,}|Bearer\\s+[A-Za-z0-9._-]{12,})')
        fail_msg: >-
          The CI resolver environment must contain the complete contract,
          derived service URLs, and no token value.

    - name: Assert CI resolver service uses the dispatcher account and restrictions
      ansible.builtin.assert:
        that:
          - "'Type=simple' in _as_ci_resolver_service"
          - "('User=' ~ agent_sandbox_dispatch_user) in _as_ci_resolver_service"
          - "('Group=' ~ agent_sandbox_dispatch_user) in _as_ci_resolver_service"
          - >-
            ('ExecStart=/usr/bin/python3 ' ~ agent_sandbox_ci_resolver_script
            ~ ' tick --loop 30') in _as_ci_resolver_service
          - "'Restart=always' in _as_ci_resolver_service"
          - "'RestartSec=30' in _as_ci_resolver_service"
          - "'StateDirectory=ci-resolver' in _as_ci_resolver_service"
          - "'UMask=0077' in _as_ci_resolver_service"
          - "'NoNewPrivileges=yes' in _as_ci_resolver_service"
          - "'ProtectSystem=full' in _as_ci_resolver_service"
          - "'ProtectHome=yes' in _as_ci_resolver_service"
          - "'PrivateTmp=yes' in _as_ci_resolver_service"
        fail_msg: >-
          The CI resolver service must run under the restricted dispatcher
          account with the declared systemd protections.

    - name: Assert workbook refresh and daily learning units
      ansible.builtin.assert:
        that:
          - "'Type=oneshot' in _as_ci_resolver_workbook_service"
          - >-
            'git -C /var/lib/ci-resolver/prompts pull --ff-only --depth 1'
            in _as_ci_resolver_workbook_service
          - "'OnCalendar=hourly' in _as_ci_resolver_workbook_timer"
          - "'RuntimeDirectory=ci-resolver-learn' in _as_ci_resolver_learn_service"
          - >-
            'git clone --depth 1 https://github.com/dryvist/ai-llm-prompts.git
            /run/ci-resolver-learn/workbook' in _as_ci_resolver_learn_service
          - >-
            'learn --workbook-repo /run/ci-resolver-learn/workbook
            --publish dryvist/ai-llm-prompts' in _as_ci_resolver_learn_service
          - "'OnCalendar=daily' in _as_ci_resolver_learn_timer"
          - "'RandomizedDelaySec=1h' in _as_ci_resolver_learn_timer"
          - "'Persistent=true' in _as_ci_resolver_learn_timer"
        fail_msg: >-
          Workbook refresh must be hourly, and learning must clone a fresh
          workbook under its runtime directory before publishing.

    - name: Assert the CI resolver secret helper keeps credentials in memory
      ansible.builtin.assert:
        that:
          - >-
            '"permissions":{"checks":"write","actions":"write","contents":"write","pull_requests":"write"}'
            in _as_ci_resolver_secret_helper
          - "'github-agents/token' in _as_ci_resolver_secret_helper"
          - "'auth/approle/login' in _as_ci_resolver_secret_helper"
          - "'auth/token/revoke-self' in _as_ci_resolver_secret_helper"
          - "'--data-binary @-' in _as_ci_resolver_secret_helper"
          - "'--header @<(printf' in _as_ci_resolver_secret_helper"
          - >-
            _as_ci_resolver_secret_helper
            | regex_findall('(?m)(?:[0-9]+)?>(?=[^=\\s])([^\\s;|)]+)')
            | difference(['/dev/null', '&2']) | length == 0
        fail_msg: >-
          The secret helper must request exactly four write permissions,
          revoke its OpenBao token, and avoid writing credentials to files.

    # Exact-host entries plus the Cursor suffix entries required by its CLI.
    - name: Assert the allowlist carries the Z.ai hosts and Cursor domains
      ansible.builtin.assert:
        that:
          - agent_sandbox_egress_domains.cursorAgent == ['.cursor.sh', '.cursorapi.com']
          - >-
            _as_domains | select('search', '(^|[.])z[.]ai$') | sort | list ==
            ['api.z.ai', 'cdn-zcode.z.ai', 'chat.z.ai', 'zcode.z.ai']
          - _as_domains | select('match', '^[.]') | sort | list == ['.cursor.sh', '.cursorapi.com']
          - _as_domains | select('search', 'aliyuncs|oss-|sentry|telemetry|analytics') | list | length == 0
          - "'api.anthropic.com' in _as_domains"
          - "'github.com' in _as_domains"
          - "'cache.nixos.org' in _as_domains"
          - agent_sandbox_router_host in _as_domains
          - _as_domains | select('search', 'openbao') | list | length == 0
        fail_msg: >-
          The allowlist must hold exactly the Z.ai hosts and the documented
          Cursor suffixes and router endpoint, no CDN, telemetry host or
          internal secret-store hostname, and keep the existing hosts.
          Rendered: {{ _as_domains }}
