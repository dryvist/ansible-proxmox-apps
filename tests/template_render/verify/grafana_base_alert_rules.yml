---
- name: Render and verify the Grafana base alert rules
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../roles/grafana_stack/defaults/main.yml
  vars:
    ansible_become: false
    _base_rules_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/rules.yml.j2"
  tasks:
    - name: Render the base alert rules
      ansible.builtin.set_fact:
        _base_rule_groups: "{{ lookup('ansible.builtin.template', _base_rules_template) | from_yaml }}"
      vars:
        grafana_stack_prometheus_url: http://prometheus.example.test:9090

    - name: Assert disk alerts cover PVE and guest filesystems at the escalation levels
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _disk_rules | map(attribute='uid') | list
            == ['disk-usage-warning', 'disk-usage-high', 'disk-usage-critical']
          - _disk_rules | map(attribute='labels.severity') | list == ['info', 'warning', 'critical']
          - >-
            _disk_rules | map(attribute='data') | map('last') | map(attribute='model')
            | map(attribute='conditions') | map('first') | map(attribute='evaluator')
            | map(attribute='params') | map('first') | list == [80, 90, 95]
          - _disk_rules | selectattr('for', 'equalto', '15m') | list | length == 3
          - >-
            _disk_rules | map(attribute='data') | map('first') | map(attribute='model')
            | map(attribute='expr') | unique | list | length == 1
          - "'job=~' in _disk_rules[0].data[0].model.expr"
          - "'pve_node_exporter' in _disk_rules[0].data[0].model.expr"
          - "'guest_node_exporter' in _disk_rules[0].data[0].model.expr"
          - "'node_filesystem_avail_bytes' in _disk_rules[0].data[0].model.expr"
          - "'node_filesystem_size_bytes' in _disk_rules[0].data[0].model.expr"
          - "'fstype!~' in _disk_rules[0].data[0].model.expr"
          - "'tmpfs|overlay' in _disk_rules[0].data[0].model.expr"
        fail_msg: >-
          Disk alerts must cover real filesystems from both exporter jobs at
          80/90/95 percent with info/warning/critical escalation.
        success_msg: Three disk alert levels cover PVE and guest filesystems.
      vars:
        _disk_rules: >-
          {{ _base_rule_groups.groups | map(attribute='rules') | flatten
             | selectattr('uid', 'match', '^disk-usage-') | list }}

    - name: Assert the frozen-ETL rule tests the aggregate, not every series
      ansible.builtin.assert:
        that:
          - _frozen_rule_query is match('^sum\\(increase\\(claude_jsonl_cache_read_tokens_total\\[6h\\]\\)\\)$')
        fail_msg: >-
          claude-jsonl-etl-frozen must sum the counter over all series; a
          per-series test fires once for every finished session.
      vars:
        _frozen_rule_query: >-
          {{ (_base_rule_groups.groups | map(attribute='rules') | flatten
              | selectattr('uid', 'equalto', 'claude-jsonl-etl-frozen') | first).data
             | selectattr('refId', 'equalto', 'A') | map(attribute='model.expr') | first }}
