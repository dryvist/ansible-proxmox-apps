---
- name: Render and verify the bmc_hw_metrics collector gate
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "{{ playbook_dir }}/../../../roles/cribl_stream/templates"
    cribl_stream_bmc_enabled: true
    cribl_stream_bmc_host: "bmc.example.invalid"
    cribl_stream_bmc_chassis: System.Embedded.1
    cribl_stream_bmc_manager: iDRAC.Embedded.1
    cribl_stream_bmc_tls_verify: false
    cribl_stream_bmc_node_name: "bmc-node.example.invalid"
    cribl_stream_bmc_log_schedule: "* * * * *"
    cribl_stream_bmc_log_earliest: "-15m"
    cribl_stream_bmc_log_latest: "-1m"
    cribl_stream_alerts_slack_webhook: "https://example.invalid/alert-hook"

  tasks:
    - name: Render the thermal collector with the read-only credential present
      ansible.builtin.template:
        src: "{{ _template_dir }}/collectors/bmc_redfish_thermal/collector.yml.j2"
        dest: "{{ _fixture_dir }}/bmc_hw_metrics_present.yml"
        mode: "0644"
      vars:
        cribl_stream_bmc_username: cribl-ro
        cribl_stream_bmc_password: placeholder-password

    - name: Assert the read-only username renders, never an admin fallback
      ansible.builtin.assert:
        quiet: true
        that:
          - "'username: \"cribl-ro\"' in _rendered"
        fail_msg: "collector.yml.j2 did not render the read-only username"
      vars:
        _rendered: "{{ lookup('file', _fixture_dir ~ '/bmc_hw_metrics_present.yml') }}"

    - name: Render the thermal collector with an empty credential
      ansible.builtin.template:
        src: "{{ _template_dir }}/collectors/bmc_redfish_thermal/collector.yml.j2"
        dest: "{{ _fixture_dir }}/bmc_hw_metrics_absent.yml"
        mode: "0644"
      vars:
        cribl_stream_bmc_username: ""
        cribl_stream_bmc_password: ""

    - name: Assert an empty credential renders empty, never an admin fallback string
      ansible.builtin.assert:
        quiet: true
        that:
          - "'username: \"\"' in _rendered"
          - "'BMC_USERNAME' not in _rendered"
        fail_msg: >-
          collector.yml.j2 must never render the BMC admin credential; the
          task-level gate is what keeps this file from being deployed at all
      vars:
        _rendered: "{{ lookup('file', _fixture_dir ~ '/bmc_hw_metrics_absent.yml') }}"

    - name: Render the bmc_hw_metrics pipeline
      ansible.builtin.template:
        src: "{{ _template_dir }}/pipelines/bmc_hw_metrics/conf.yml.j2"
        dest: "{{ _fixture_dir }}/bmc_hw_metrics_pipeline.yml"
        mode: "0644"
      vars:
        cribl_stream_bmc_node_name: "bmc-node.example.invalid"

    - name: Render the SEL collector
      ansible.builtin.template:
        src: "{{ _template_dir }}/collectors/bmc_redfish_logs/collector.yml.j2"
        dest: "{{ _fixture_dir }}/bmc_redfish_sel.yml"
        mode: "0644"
      vars:
        bmc_log: {id: sel, service: Sel}
        cribl_stream_bmc_username: cribl-ro
        cribl_stream_bmc_password: placeholder-password

    - name: Render the Lifecycle collector with its alert fan-out
      ansible.builtin.template:
        src: "{{ _template_dir }}/collectors/bmc_redfish_logs/collector.yml.j2"
        dest: "{{ _fixture_dir }}/bmc_redfish_lifecycle.yml"
        mode: "0644"
      vars:
        bmc_log: {id: lifecycle, service: Lclog}
        cribl_stream_bmc_username: cribl-ro
        cribl_stream_bmc_password: placeholder-password

    - name: Render the BMC log schedule
      ansible.builtin.template:
        src: "{{ _template_dir }}/collectors/bmc_redfish_logs/schedule.yml.j2"
        dest: "{{ _fixture_dir }}/bmc_redfish_schedule.yml"
        mode: "0644"
      vars:
        bmc_log: {id: lifecycle, service: Lclog}

    - name: Render the BMC Redfish event pipelines
      ansible.builtin.template:
        src: "{{ _template_dir }}/pipelines/{{ item.name }}/conf.yml.j2"
        dest: "{{ _fixture_dir }}/{{ item.name }}.yml"
        mode: "0644"
      loop:
        - {name: bmc_redfish_events}
        - {name: bmc_uncorrectable_memory}
      loop_control:
        label: "{{ item.name }}"
      vars:
        cribl_stream_bmc_node_name: "bmc-node.example.invalid"

    - name: Assert both Redfish log sources route through Stream to their intended sinks
      vars:
        _sel: "{{ lookup('file', _fixture_dir ~ '/bmc_redfish_sel.yml') }}"
        _sel_config: "{{ lookup('file', _fixture_dir ~ '/bmc_redfish_sel.yml') | from_yaml }}"
        _lifecycle: "{{ lookup('file', _fixture_dir ~ '/bmc_redfish_lifecycle.yml') }}"
        _schedule: "{{ lookup('file', _fixture_dir ~ '/bmc_redfish_schedule.yml') }}"
        _events: "{{ lookup('file', _fixture_dir ~ '/bmc_redfish_events.yml') }}"
        _alert: "{{ lookup('file', _fixture_dir ~ '/bmc_uncorrectable_memory.yml') }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - "'LogServices/Sel/Entries' in _sel"
          - "'LogServices/Lclog/Entries' in _lifecycle"
          - "'Created gt' in _sel and 'Created le' in _sel"
          - "'disableTimeFilter: true' in _sel"
          - "'pipeline: bmc_redfish_events' in _sel"
          - "'pipeline: bmc_redfish_events' in _lifecycle"
          - "'output: slack_grafana_alerts' in _lifecycle"
          - "'output: slack_grafana_alerts' not in _sel"
          - "'earliest: \"-15m\"' in _schedule and 'latest: \"-1m\"' in _schedule"
          - "'maxConcurrentRuns: 1' in _schedule and 'skippable: false' in _schedule"
          - "'stateTracking:' in _sel and 'enabled: true' in _sel"
          - "'Created gt' in _sel and 'state.latestTime' in _sel"
          - _sel_config.__scheduling.stateTracking.enabled | bool
          - _sel_config.conf.retryRules.retryConnectTimeout | bool
          - _sel_config.conf.retryRules.retryConnectReset | bool
          - "'sourcetype: lifecycle ?' in _events and \"'ipmi:sel'\" in _events"
          - "'destField: __bmcRedfishEvent' in _events"
          - "\"MessageId !== 'MEM0001' && MessageId !== 'UEFI0079'\" in _alert"
        fail_msg: >-
          Redfish SEL/Lifecycle collectors must query bounded time ranges, preserve
          records in hardware HEC, and fan only uncorrectable lifecycle records
          to the configured alert webhook.

    - name: Assert the source Redfish sensor arrays are deleted before publish_metrics
      ansible.builtin.assert:
        quiet: true
        that:
          - "'delete __e.Temperatures;' in _rendered_pipeline"
          - "'delete __e.Fans;' in _rendered_pipeline"
          - "'delete __e.PowerSupplies;' in _rendered_pipeline"
        fail_msg: >-
          conf.yml.j2 must delete the source Temperatures/Fans/PowerSupplies
          arrays before publish_metrics, or dimensions: "*" turns them into
          dimensions on every emitted metric.
      vars:
        _rendered_pipeline: "{{ lookup('file', _fixture_dir ~ '/bmc_hw_metrics_pipeline.yml') }}"

    - name: Bmc hw_metrics gate verification PASSED
      ansible.builtin.debug:
        msg: >-
          collector.yml.j2 renders the read-only username when set and never
          references an admin credential fallback when credentials are empty,
          while the Redfish log collectors checkpoint timestamps, retry
          transient resets, retain log events, and alert on uncorrectable
          lifecycle records.
