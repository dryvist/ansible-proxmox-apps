---
# Render and verify the Glance board: one "Services" page carrying every
# catalog group (network and media included) from dashboard_catalog_services.
- name: Render and verify glance generated-services templates
  hosts: localhost
  connection: local
  gather_facts: false

  # The role's REAL defaults, so the opt-in switch under test is the one that
  # ships. Relative to THIS file (vars_files resolve at parse time). A play-level
  # vars_files, not an include_vars task: a task-level include_vars outranks the
  # task `vars:` below and would silently force the "enabled" render back off.
  vars_files:
    - "../../../roles/glance/defaults/main.yml"

  vars:
    ansible_become: false
    ansible_managed: "test fixture"
    glance_monitor_enabled: true
    glance_monitor_interval: "1m"
    dashboard_catalog_group_order:
      - apps
      - ai
      - media_svc
      - mgmt
      - siem
      - data
      - nonprod
      - other
    # Same shape as dashboard_catalog_tasks/main.yml's set_fact — including
    # `section: ~` on every entry, which the macro's selectattr('section')
    # requires present (a bare dict lacking the key fails the attribute
    # lookup, unlike the real catalog which always sets it, even to none).
    dashboard_catalog_services:
      - name: vikunja
        title: Vikunja
        group: apps
        ui: true
        section: ~
        desc: "Task tracking"
        url: "https://vikunja.example.test"
        probe_url: ""
      - name: technitium
        title: Technitium
        group: dns
        ui: true
        section: ~
        desc: "DNS server"
        url: "https://technitium.example.test"
        probe_url: "http://192.0.2.5:5380"
      - name: plex
        title: Plex
        group: media_svc
        ui: true
        section: ~
        desc: "Media server"
        url: "https://plex.example.test"
        probe_url: ""
      - name: sonarr
        title: Sonarr
        group: media_svc
        ui: true
        section: ~
        desc: "TV automation"
        url: "https://sonarr.example.test"
        probe_url: ""
      - name: sonarr-api
        title: Sonarr API
        group: media_svc
        ui: false
        section: ~
        desc: ""
        url: "https://sonarr.example.test/api"
        probe_url: ""
      - name: llm
        title: LLM router
        group: ai
        ui: true
        section: ~
        desc: ""
        url: "https://router.example.invalid/ui"
        probe_url: "http://router.example.invalid"

  tasks:
    - name: Render generated-services.yml
      ansible.builtin.template:
        src: "../../../roles/glance/templates/generated-services.yml.j2"
        dest: "{{ render_tmp }}/glance-generated-services.yml"
        mode: "0600"

    - name: Read back the rendered pages
      ansible.builtin.slurp:
        src: "{{ render_tmp }}/glance-generated-services.yml"
      register: _glance_raw

    - name: Parse the rendered pages
      ansible.builtin.set_fact:
        _glance_pages: "{{ _glance_raw.content | b64decode | from_yaml }}"

    - name: Assert the opt-in LLM profile widget is absent by default
      ansible.builtin.assert:
        that:
          - >-
            (_glance_pages[0].columns[0].widgets
             | selectattr('title', 'defined')
             | selectattr('title', 'equalto', 'LLM profile') | list | length) == 0
          - "'GLANCE_LLM_PROFILE' not in (_glance_raw.content | b64decode)"
        fail_msg: "the LLM profile widget (or its token reference) rendered while disabled"

    - name: Assert a catalog without an llm row leaves the router URL empty, never undefined
      ansible.builtin.assert:
        that:
          - glance_llm_profile_router_base_url == ''
        fail_msg: "the router base URL default must degrade to '' so the role's input assert can report it"
      vars:
        dashboard_catalog_services:
          - {name: vikunja, probe_url: ""}

    - name: Assert exactly one page renders, the Services board
      ansible.builtin.assert:
        that:
          - _glance_pages | length == 1
          - _glance_pages[0].name == 'Services'
        fail_msg: "expected the single Services page, got {{ _glance_pages | map(attribute='name') | list }}"

    - name: Assert the media and network groups render on the Services board
      ansible.builtin.assert:
        that:
          - "'media_svc' in (_glance_pages[0] | string)"
          - "'dns' in (_glance_pages[0] | string)"
        fail_msg: "media_svc/dns groups missing from the single Services board"

    - name: Render generated-services.yml with the LLM profile widget enabled
      ansible.builtin.template:
        src: "../../../roles/glance/templates/generated-services.yml.j2"
        dest: "{{ render_tmp }}/glance-generated-services-enabled.yml"
        mode: "0600"
      vars:
        glance_llm_profile_enabled: true

    - name: Read back the enabled LLM profile widget
      ansible.builtin.slurp:
        src: "{{ render_tmp }}/glance-generated-services-enabled.yml"
      register: _glance_enabled_raw

    - name: Parse the enabled Glance pages
      ansible.builtin.set_fact:
        _glance_enabled_pages: "{{ _glance_enabled_raw.content | b64decode | from_yaml }}"

    - name: Assert the enabled LLM profile widget calls both router endpoints
      ansible.builtin.assert:
        that:
          - _glance_profile_widgets | length == 1
          - _glance_profile_widgets[0].url == 'http://router.example.invalid/health'
          - _glance_profile_widgets[0].headers.Authorization == _glance_profile_bearer
          - _glance_profile_widgets[0].subrequests.model_info.url == _glance_model_info_url
          - _glance_profile_widgets[0].subrequests.model_info.headers.Authorization == _glance_profile_bearer
          - "'requests' not in _glance_profile_widgets[0]"
        fail_msg: "the enabled LLM profile widget is missing an endpoint, subrequest or bearer reference"
      vars:
        _glance_profile_bearer: "Bearer ${GLANCE_LLM_PROFILE_BEARER_TOKEN}"
        _glance_model_info_url: "http://router.example.invalid/v2/model/info?page=1&size=100"
        _glance_profile_widgets: >-
          {{ _glance_enabled_pages[0].columns[0].widgets
             | selectattr('title', 'defined')
             | selectattr('title', 'equalto', 'LLM profile') | list }}

    # Glance rewrites every ${NAME} in the whole file, comments included, and
    # refuses to start when a name is unset. The only reference allowed is the
    # token the unit's environment file provides.
    - name: Assert the only environment reference in the rendered file is the bearer token
      ansible.builtin.assert:
        that:
          - >-
            (_glance_enabled_raw.content | b64decode
             | regex_findall('[$][{][^}]*[}]') | unique | list)
            == ['${GLANCE_LLM_PROFILE_BEARER_TOKEN}']
        fail_msg: "an environment reference other than the bearer token would abort Glance at startup"

    - name: Render the unit with and without the LLM profile widget
      ansible.builtin.template:
        src: "../../../roles/glance/templates/glance.service.j2"
        dest: "{{ render_tmp }}/glance-{{ item.name }}.service"
        mode: "0600"
      vars:
        glance_llm_profile_enabled: "{{ item.enabled }}"
      loop:
        - {name: disabled, enabled: false}
        - {name: enabled, enabled: true}
      loop_control:
        label: "{{ item.name }}"

    # systemd refuses to start a unit whose EnvironmentFile is missing, so the
    # reference must exist exactly when the role installs the file.
    - name: Assert the unit loads the bearer file only when the widget is enabled
      ansible.builtin.assert:
        that:
          - "'EnvironmentFile=' not in lookup('file', render_tmp ~ '/glance-disabled.service')"
          - "'EnvironmentFile=/etc/glance/llm-profile.env' in lookup('file', render_tmp ~ '/glance-enabled.service')"
        fail_msg: "the unit's EnvironmentFile reference does not follow glance_llm_profile_enabled"

    # The template runs inside Glance's Go engine: inside `range` the context is
    # the element (`.String`), the named extra request is read with
    # `.Subrequest`, and the /health list is flat (`model_id`), joined to the
    # deployment's `model_info` from the second request.
    - name: Assert the widget template reads the documented accessors
      ansible.builtin.assert:
        that:
          - "'.Subrequest \"model_info\"' in _glance_profile_template"
          - "'.JSON.Array \"healthy_endpoints\"' in _glance_profile_template"
          - "'.String \"model_id\"' in _glance_profile_template"
          - "'.String \"model_info.id\"' in _glance_profile_template"
          - "'.String \"model_info.profile\"' in _glance_profile_template"
          - "'.Response.StatusCode' in _glance_profile_template"
          - "'.JSON.String' not in _glance_profile_template"
        fail_msg: "the widget template uses an accessor Glance v0.8.6 or LiteLLM /health does not provide"
      vars:
        _glance_profile_template: >-
          {{ (_glance_enabled_pages[0].columns[0].widgets
              | selectattr('title', 'defined')
              | selectattr('title', 'equalto', 'LLM profile') | first).template }}
