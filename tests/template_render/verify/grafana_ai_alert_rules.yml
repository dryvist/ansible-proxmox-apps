---
# Renders roles/grafana_stack/templates/alerting/rules-ai.yml.j2 with the role
# defaults and checks the four AI rules and their label matchers.
- name: Render and verify the Grafana AI alert rules
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../../roles/grafana_stack/defaults/main.yml
  vars:
    # group_vars/all.yml sets ansible_become for managed nodes and implicit
    # localhost inherits it; rendering a template needs no root.
    ansible_become: false
    _rules_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/rules-ai.yml.j2"
    _contactpoints_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/contactpoints.yml.j2"
    _token_env_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/cribl-hec-token.env.j2"
    _datasource_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/datasource.yml.j2"
    _compose_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/docker-compose.yml.j2"
    _base_rules_template: "{{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/rules.yml.j2"
    _notification_policy_template: >-
      {{ playbook_dir }}/../../../roles/grafana_stack/templates/alerting/notification-policies.yml.j2
  tasks:
    - name: Render the LiteLLM datasource with default role settings
      ansible.builtin.set_fact:
        _grafana_datasources: "{{ lookup('ansible.builtin.template', _datasource_template) | from_yaml }}"
      vars:
        grafana_stack_prometheus_url: http://prometheus.example.test:9090
        grafana_stack_vm_port: 8428

    - name: Assert the read-only LiteLLM datasource is constrained to its host
      ansible.builtin.assert:
        that:
          - grafana_stack_litellm_prices_enabled | bool
          - _litellm_datasource.name == 'LiteLLM prices'
          - _litellm_datasource.uid == 'litellm-prices'
          - _litellm_datasource.type == 'yesoreyeram-infinity-datasource'
          - _litellm_datasource.access == 'proxy'
          - _litellm_datasource.url == 'https://raw.githubusercontent.com'
          - not (_litellm_datasource.isDefault | bool)
          - not (_litellm_datasource.editable | bool)
          - _litellm_datasource.jsonData.allowedHosts == ['https://raw.githubusercontent.com']
          - not (_litellm_datasource.jsonData.allowDangerousHTTPMethods | bool)
          - _litellm_datasource.secureJsonData is not defined
        fail_msg: "LiteLLM datasource provisioning is missing or broader than its contract"
      vars:
        _litellm_datasource: >-
          {{ _grafana_datasources.datasources
             | selectattr('uid', 'equalto', 'litellm-prices') | first }}

    - name: Render Grafana compose with the Infinity plugin enabled
      ansible.builtin.set_fact:
        _grafana_compose: "{{ lookup('ansible.builtin.template', _compose_template) | from_yaml }}"
      vars:
        grafana_hostname: grafana
        ingress_domain: example.test
        grafana_stack_oidc_issuer: https://authelia.example.test
        grafana_stack_oidc_client_secret: fixture-oidc-client-secret
        grafana_stack_prometheus_url: http://prometheus.example.test:9090
        grafana_stack_vm_port: 8428

    - name: Assert Grafana installs Infinity with the current plugin variable
      ansible.builtin.assert:
        that:
          - >-
            _grafana_compose['services']['grafana']['environment']['GF_PLUGINS_PREINSTALL']
            == 'yesoreyeram-infinity-datasource'

    - name: Assert Grafana enables SQLite WAL and locked-query retries
      ansible.builtin.assert:
        that:
          - _grafana_compose['services']['grafana']['environment']['GF_DATABASE_WAL'] == 'true'
          - _grafana_compose['services']['grafana']['environment']['GF_DATABASE_QUERY_RETRIES'] == '5'

    - name: Render the datasource and compose with LiteLLM prices disabled
      ansible.builtin.set_fact:
        _grafana_datasources_disabled: >-
          {{ lookup('ansible.builtin.template', _datasource_template) | from_yaml }}
        _grafana_compose_disabled: >-
          {{ lookup('ansible.builtin.template', _compose_template) | from_yaml }}
      vars:
        grafana_hostname: grafana
        ingress_domain: example.test
        grafana_stack_oidc_issuer: https://authelia.example.test
        grafana_stack_oidc_client_secret: fixture-oidc-client-secret
        grafana_stack_litellm_prices_enabled: false
        grafana_stack_prometheus_url: http://prometheus.example.test:9090
        grafana_stack_vm_port: 8428

    - name: Assert disabling LiteLLM prices omits the datasource and plugin install
      ansible.builtin.assert:
        that:
          - >-
            _grafana_datasources_disabled.datasources
            | selectattr('uid', 'equalto', 'litellm-prices') | list | length == 0
          - >-
            'GF_PLUGINS_PREINSTALL' not in
            _grafana_compose_disabled['services']['grafana']['environment']

    - name: Render the AI alert rules
      ansible.builtin.set_fact:
        _ai_rules: "{{ (lookup('ansible.builtin.template', _rules_template) | from_yaml).groups[0].rules }}"
      vars:
        # Task vars outrank the defaults loaded through vars_files.
        grafana_stack_prometheus_url: http://prometheus.example.test:9090

    - name: Assert the four rules render with their matchers and safe ZDR alert states
      ansible.builtin.assert:
        that:
          - _ai_rules | map(attribute='uid') | list
            == ['llm-router-down', 'llm-judge-failing', 'hermes-llm-failures', 'zdr-key-non-zdr-model']
          - ('api_key_alias=~`litellm\\-local\\-workstation|hindsight`') in _zdr_expr
          - ('requested_model=~`free\\-zdrless`') in _zdr_expr
          - ('api_key_alias!=""') in _zdr_expr
          - ('requested_model!=""') in _zdr_expr
          - _zdr_rule.noDataState == 'OK'
          - _zdr_rule.execErrState == 'Error'
          - _hermes_threshold == grafana_stack_alert_hermes_error_count - 1
        fail_msg: >-
          The ZDR alert must require populated key/model labels, stay OK with
          no matching data, and expose query errors without firing a breach.
      vars:
        _zdr_rule: "{{ _ai_rules | selectattr('uid', 'equalto', 'zdr-key-non-zdr-model') | first }}"
        _zdr_expr: "{{ _zdr_rule.data[0].model.expr }}"
        _hermes_threshold: >-
          {{ (_ai_rules | selectattr('uid', 'equalto', 'hermes-llm-failures')
              | first).data[1].model.conditions[0].evaluator.params[0] }}

    - name: Render without a Prometheus datasource
      ansible.builtin.set_fact:
        _ai_rules_no_prom: "{{ (lookup('ansible.builtin.template', _rules_template) | from_yaml).groups[0].rules }}"
      vars:
        grafana_stack_prometheus_url: ""

    - name: Assert only the router rule depends on the Prometheus datasource
      ansible.builtin.assert:
        that:
          - _ai_rules_no_prom | map(attribute='uid') | list
            == ['llm-judge-failing', 'hermes-llm-failures', 'zdr-key-non-zdr-model']

    - name: Assert the judge rule reads the Edge process metric
      ansible.builtin.assert:
        that:
          - >-
            'absent_over_time(judge_process_start_time_seconds{telemetry_role="judge",process_set="judge"}[5m])'
            in _judge_expr
          - "_judge_for == '1m'"
          - "_judge_summary == 'The judge process has not reported from Cribl Edge for 6 minutes.'"
      vars:
        _judge_rule: "{{ _ai_rules | selectattr('uid', 'equalto', 'llm-judge-failing') | first }}"
        _judge_expr: "{{ _judge_rule.data[0].model.expr }}"
        _judge_for: "{{ _judge_rule.for }}"
        _judge_summary: "{{ _judge_rule.annotations.summary }}"

    - name: Render the Cribl HEC contact point with fixture values
      ansible.builtin.set_fact:
        _ai_contactpoint: >-
          {{ (lookup('ansible.builtin.template', _contactpoints_template)
              | from_yaml).contactPoints[0].receivers[0] }}
        _ai_alert_token_env: "{{ lookup('ansible.builtin.template', _token_env_template) }}"
        _ai_notification_policy: >-
          {{ (lookup('ansible.builtin.template', _notification_policy_template)
              | from_yaml).policies[0] }}
      vars:
        grafana_stack_alert_cribl_hec_url: >-
          http://syslog.example.test:8088/services/collector/raw?index=ansible&source=grafana-alert&sourcetype=grafana%3Aalert
        grafana_stack_alert_cribl_hec_token: fixture-hec-token-not-real

    - name: Assert the contact point routes to Stream with an env-backed HEC credential
      ansible.builtin.assert:
        that:
          - _ai_contactpoint.type == 'webhook'
          - >-
            _ai_contactpoint.settings.url ==
            (
            'http://syslog.example.test:8088/services/collector/raw?'
            'index=ansible&source=grafana-alert&'
            'sourcetype=grafana%3Aalert'
            )
          - _ai_contactpoint.settings.authorization_scheme == 'Splunk'
          - _ai_contactpoint.settings.authorization_credentials == '$GRAFANA_ALERT_CRIBL_HEC_TOKEN'
          - _ai_contactpoint.secureSettings is not defined
          - "'GRAFANA_ALERT_CRIBL_HEC_TOKEN=fixture-hec-token-not-real' in _ai_alert_token_env"
          - _ai_notification_policy.receiver == 'cribl-alerts'
        fail_msg: >-
          Grafana's contact point must post to the Stream HEC raw input and
          resolve its credential from the protected env file, not contact ntfy
          or embed the credential in provisioning YAML.

    - name: Render the base alert rules
      ansible.builtin.set_fact:
        _base_rule_groups: "{{ lookup('ansible.builtin.template', _base_rules_template) | from_yaml }}"

    - name: Assert the frozen-ETL rule tests the aggregate, not every series
      ansible.builtin.assert:
        that:
          - _frozen_rule_query is match('^sum\\(increase\\(claude_jsonl_cache_read_tokens_total\\[6h\\]\\)\\)$')
        fail_msg: >-
          claude-jsonl-etl-frozen must sum the counter over all series; a
          per-series test fires once for every finished session.
      vars:
        _frozen_rule_query: >-
          {{ (_base_rule_groups.groups | map(attribute='rules') | flatten
              | selectattr('uid', 'equalto', 'claude-jsonl-etl-frozen') | first).data
             | selectattr('refId', 'equalto', 'A') | map(attribute='model.expr') | first }}
