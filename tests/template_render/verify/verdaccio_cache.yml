---
- name: Render and verify Verdaccio config and systemd unit
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../roles/verdaccio_cache/defaults/main.yml"
  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    ansible_architecture: x86_64
    _service_hardening_template: "{{ playbook_dir }}/../../roles/_shared/templates/systemd-service-hardening.conf.j2"
  tasks:
    - name: Render Verdaccio config and systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/verdaccio_cache/templates/{{ item.src }}"
        dest: "{{ _fixture_dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - src: config.yaml.j2
          dest: verdaccio.yaml
        - src: verdaccio-cache.service.j2
          dest: verdaccio-cache.service

    - name: Read rendered Verdaccio config and systemd unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/{{ item }}"
      loop:
        - verdaccio.yaml
        - verdaccio-cache.service
      register: _verdaccio_rendered

    - name: Assert rendered Verdaccio contracts
      ansible.builtin.assert:
        that:
          - "'listen: 0.0.0.0:4873' in (_verdaccio_rendered.results[0].content | b64decode)"
          - "'max_users: -1' in (_verdaccio_rendered.results[0].content | b64decode)"
          - "'publish: $authenticated' in (_verdaccio_rendered.results[0].content | b64decode)"
          - "'proxy: npmjs' in (_verdaccio_rendered.results[0].content | b64decode)"
          - "'StandardOutput=journal' in (_verdaccio_rendered.results[1].content | b64decode)"
          - "'22.23.4' in (_verdaccio_rendered.results[1].content | b64decode)"
          - "'UMask=0027' in (_verdaccio_rendered.results[1].content | b64decode)"
          - "'ProtectControlGroups=true' in (_verdaccio_rendered.results[1].content | b64decode)"
