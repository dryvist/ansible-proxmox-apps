---
# One credential-shape case for pgbackrest_s3_inputs_present.yml. A separate
# file because set_fact must run in its own task, ahead of the assert, for
# each looped case.
- name: "Override the S3 inputs: {{ item.name }}"
  ansible.builtin.set_fact:
    postgres_backup_s3_endpoint: "{{ item.endpoint }}"
    postgres_backup_s3_access_key_id: "{{ item.access_key_id }}"
    postgres_backup_s3_secret_access_key: "{{ item.secret_access_key }}"

- name: "Assert credentials_present matches: {{ item.name }}"
  ansible.builtin.assert:
    that:
      - (postgres_pgbackrest_credentials_present | bool) == (item.expect_present | bool)
    fail_msg: >-
      {{ item.name }}: expected credentials_present={{ item.expect_present }},
      got {{ postgres_pgbackrest_credentials_present }}.
    quiet: true
