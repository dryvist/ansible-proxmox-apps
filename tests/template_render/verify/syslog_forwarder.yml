---
# =============================================================================
# syslog_forwarder — the rsyslog drop-in that forwards every log to the central
# syslog VIP (-> HAProxy -> Cribl Edge -> Splunk). Render + assert the omfwd rule.
# =============================================================================
- name: Render and verify syslog_forwarder template
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Mirror roles/syslog_forwarder/defaults/main.yml with scrubbed values.
    syslog_forwarder_target_host: "syslog.pve.example.com"
    syslog_forwarder_target_port: 1517
    syslog_forwarder_protocol: tcp
    syslog_forwarder_queue_max_disk_space: 256m
    syslog_forwarder_keepalive: "on"
    syslog_forwarder_keepalive_probes: 3
    syslog_forwarder_keepalive_interval: 30
    syslog_forwarder_keepalive_time: 120
    syslog_forwarder_max_message_size: 64k
    # Mirror the group_vars wiring: program-specific routes rendered above
    # the catch-all (traefik -> the proxy family standard frontend).
    syslog_forwarder_program_routes:
      - program: traefik
        port: 523
    # Mirror the download_vpn_group wiring: tail a file-only logger via imfile.
    # The second entry mirrors docker_vms.yml's github_runner_arc-gated k3s
    # wildcard input (inventory/group_vars/docker_vms.yml) — both render
    # through the same imfile loop, so one fixture proves both shapes.
    syslog_forwarder_imfile_inputs:
      - file: /data/.qbittorrent-profile/qBittorrent/data/logs/qbittorrent.log
        tag: qbittorrent
      - file: /var/log/containers/*.log
        tag: k3s-containers
    syslog_forwarder_imfile_work_directory: /var/spool/rsyslog
    _sf_template_dir: "../../../roles/syslog_forwarder/templates"

  tasks:
    - name: Render the syslog forward rule to /tmp
      ansible.builtin.template:
        src: "{{ _sf_template_dir }}/10-forward-cribl.conf.j2"
        dest: "{{ _fixture_dir }}/test_syslog_forward.conf"
        mode: "0644"

    - name: Read rendered syslog forward rule
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_syslog_forward.conf"
      register: _sf_raw

    - name: Decode rendered syslog forward rule
      ansible.builtin.set_fact:
        _sf: "{{ _sf_raw.content | b64decode }}"

    - name: Assert all logs forward to the VIP over TCP with a disk-assisted queue
      ansible.builtin.assert:
        that:
          # All facilities/severities, via the omfwd output module.
          - "'*.*' in _sf"
          - "'action(type=' in _sf"
          - "'omfwd' in _sf"
          # To the stable syslog CNAME on the Linux port, over TCP.
          - "'syslog.pve.example.com' in _sf"
          - "'1517' in _sf"
          - "'protocol' in _sf"
          - "'tcp' in _sf"
          # Disk-assisted queue so a receiver outage buffers instead of dropping.
          - "'queue.filename' in _sf"
          - "'cribl_fwd' in _sf"
          - "'256m' in _sf"
          # The per-program action and catch-all both probe TCP keepalive.
          - _sf.count('KeepAlive="on"') == 2
          - _sf.count('KeepAlive.Probes="3"') == 2
          - _sf.count('KeepAlive.Interval="30"') == 2
          - _sf.count('KeepAlive.Time="120"') == 2
        fail_msg: >-
          10-forward-cribl.conf.j2 did not render the expected omfwd rule
          (selector/target/port/protocol/queue/TCP keepalive).

    - name: Assert program routes render above the catch-all and stop
      ansible.builtin.assert:
        that:
          - "\"if $programname == 'traefik' then {\" in _sf"
          - "'port=\"523\"' in _sf"
          - "'queue.filename=\"cribl_fwd_traefik\"' in _sf"
          - "'stop' in _sf"
          # Order is load-bearing: the program route must precede the
          # catch-all *.* rule, or the catch-all consumes the line first.
          - "_sf.index(\"$programname == 'traefik'\") < _sf.index('*.*')"
        fail_msg: >-
          10-forward-cribl.conf.j2 did not render the program route above the
          catch-all with its own disk queue and a stop.

    - name: Assert imfile input renders for the file-only logger
      ansible.builtin.assert:
        that:
          - "'load=' ~ '\"imfile\"' in _sf"
          - "'qbittorrent.log' in _sf"
        fail_msg: imfile input for the file-only logger did not render.

    - name: Assert imfile input renders for the k3s container-log wildcard
      ansible.builtin.assert:
        that:
          - "'/var/log/containers/*.log' in _sf"
          - "'k3s-containers' in _sf"
        fail_msg: imfile input for the k3s container-log wildcard did not render.

    - name: Assert imfile's global workDirectory renders and precedes the module load
      ansible.builtin.assert:
        that:
          - "'workDirectory=' ~ '\"/var/spool/rsyslog\"' in _sf"
          - "_sf.index('workDirectory=') < _sf.index('load=' ~ '\"imfile\"')"
        fail_msg: >-
          global(workDirectory=...) must render before module(load="imfile") or
          the standalone config-validate step fails (imfile has no working dir
          in scope without it).

    - name: Assert maxMessageSize is raised and precedes every action
      ansible.builtin.assert:
        that:
          - "'maxMessageSize=' ~ '\"64k\"' in _sf"
          - "_sf.index('maxMessageSize=') < _sf.index('omfwd')"
        fail_msg: >-
          global(maxMessageSize=...) must render before the first omfwd action.
          rsyslog applies it only to inputs and actions defined after it, and
          this drop-in is the first one it reads, so an ordering regression
          silently restores the 8 KB default — which truncates oversized
          records with no error anywhere.

    - name: Syslog forwarder template rendering PASSED
      ansible.builtin.debug:
        msg: "syslog_forwarder: omfwd rule -> syslog.pve.example.com:1517/tcp with disk queue"

- name: Derive Docker program routes from published AI constants
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../roles/syslog_forwarder/defaults/main.yml"

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _sf_template_dir: "{{ playbook_dir }}/../../../roles/syslog_forwarder/templates"
    tofu_data: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../inventory_load/tofu_inventory.json') | from_json }}
    syslog_forwarder_program_names:
      - agentgateway
      - dify
      - hindsight
      - langflow
      - langfuse
      - langgraph
      - phoenix
      - qdrant
      - unpublished
    _syslog_forwarder_expected_program_routes:
      - program: agentgateway
        port: 10341
      - program: dify
        port: 10342
      - program: hindsight
        port: 10343
      - program: langflow
        port: 10344
      - program: langfuse
        port: 10345
      - program: langgraph
        port: 10346
      - program: phoenix
        port: 10351
      - program: qdrant
        port: 10347

  tasks:
    - name: Assert published Docker programs resolve to their constants and missing routes are skipped
      ansible.builtin.assert:
        that:
          - syslog_forwarder_program_routes == _syslog_forwarder_expected_program_routes
        fail_msg: >-
          Docker program routes must use the matching published `<program>_docker`
          port, and omit names without a published route.

    - name: Render all derived program routes
      ansible.builtin.template:
        src: "{{ _sf_template_dir }}/10-forward-cribl.conf.j2"
        dest: "{{ _fixture_dir }}/test_syslog_forward_derived.conf"
        mode: "0644"

    - name: Read rendered derived program routes
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_syslog_forward_derived.conf"
      register: _sf_derived_raw

    - name: Decode rendered derived program routes
      ansible.builtin.set_fact:
        _sf_derived: "{{ _sf_derived_raw.content | b64decode }}"

    - name: Assert every derived program route renders before the catch-all
      ansible.builtin.assert:
        that:
          - "_sf_derived.count('# Program route:') == 8"
          - "_sf_derived.index('Program route:') < _sf_derived.index('*.*')"
          - "'unpublished' not in _sf_derived"
        fail_msg: >-
          Every published Docker route must render before the catch-all, and
          an unpublished name must not produce a route.

- name: Render and verify the host's Docker syslog program route
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../roles/syslog_forwarder/defaults/main.yml"
    - "{{ playbook_dir }}/../../../inventory/host_vars/iac-platform.yml"

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _sf_template_dir: "{{ playbook_dir }}/../../../roles/syslog_forwarder/templates"
    tofu_data: >-
      {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../inventory_load/tofu_inventory.json') | from_json }}
    _expected_host_program_routes:
      - program: semaphore
        port: 10352

  tasks:
    - name: Assert the host program name resolves to its published route
      ansible.builtin.assert:
        that:
          - syslog_forwarder_program_routes == _expected_host_program_routes
        fail_msg: "The host program name must resolve to its matching published route."

    - name: Render the host program route
      ansible.builtin.template:
        src: "{{ _sf_template_dir }}/10-forward-cribl.conf.j2"
        dest: "{{ _fixture_dir }}/test_syslog_forward_host.conf"
        mode: "0644"

    - name: Read rendered host program route
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_syslog_forward_host.conf"
      register: _sf_host_raw

    - name: Decode rendered host program route
      ansible.builtin.set_fact:
        _sf_host: "{{ _sf_host_raw.content | b64decode }}"

    - name: Assert the host route renders before the catch-all
      ansible.builtin.assert:
        that:
          - "'Program route: semaphore' in _sf_host"
          - "'port=\"10352\"' in _sf_host"
          - "_sf_host.index(\"$programname == 'semaphore'\") < _sf_host.index('*.*')"
        fail_msg: >-
          The host's Docker program route must render before the catch-all
          and use the published port.
