---
- name: Render and verify raw_cache with two upstreams
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../roles/raw_cache/defaults/main.yml"
  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    raw_cache_upstreams:
      - name: github_raw
        upstream: https://raw.githubusercontent.com
      - name: github_releases
        upstream: https://github.com
    raw_cache_resolvers:
      - 192.0.2.53
  tasks:
    - name: Render raw_cache nginx configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/raw_cache/templates/raw-cache.conf.j2"
        dest: "{{ _fixture_dir }}/raw-cache.conf"
        mode: "0644"

    - name: Read rendered raw_cache nginx configuration
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/raw-cache.conf"
      register: _raw_cache_config

    - name: Assert raw_cache upstream routes, cache keys, redirects and disk limit
      ansible.builtin.assert:
        that:
          - "'location ^~ /github_raw/' in (_raw_cache_config.content | b64decode)"
          - "'location ^~ /github_releases/' in (_raw_cache_config.content | b64decode)"
          - "'map $request_uri $raw_cache_request_url {' in (_raw_cache_config.content | b64decode)"
          - "'~^/github_raw(/.*)$ https://raw.githubusercontent.com$1;' in (_raw_cache_config.content | b64decode)"
          - "'~^/github_releases(/.*)$ https://github.com$1;' in (_raw_cache_config.content | b64decode)"
          - >-
            'Original $request_uri survives the rewrite and includes query arguments.'
            in (_raw_cache_config.content | b64decode)
          - "'proxy_cache_key $raw_cache_request_url' in (_raw_cache_config.content | b64decode)"
          - "'error_page 301 302 303 307 308 = @raw_cache_follow;' in (_raw_cache_config.content | b64decode)"
          - "'max_size=20g' in (_raw_cache_config.content | b64decode)"
          - "'resolver 192.0.2.53 valid=300s ipv6=off;' in (_raw_cache_config.content | b64decode)"
