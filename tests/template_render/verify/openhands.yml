---
- name: Render and verify openhands units and service env
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../roles/openhands/defaults/main.yml"
  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _service_hardening_template: "{{ playbook_dir }}/../../../roles/_shared/templates/systemd-service-hardening.conf.j2"
    # Mirror inventory/group_vars/all.yml: the router base URL in the role
    # defaults builds from the ingress domain.
    ingress_domain: "{{ lookup('ansible.builtin.env', 'PROXMOX_SUBDOMAIN') }}"
    # The service reads the router key bao-first in the group_vars; the
    # render fixtures carry a placeholder, never a real value.
    openhands_router_key: "test-placeholder"
    openhands_service_secrets:
      session-api-key: "test-placeholder"
      secret-key: "test-placeholder"
      automation-kv-secret: "test-placeholder"
      automation-local-api-key: "test-placeholder"
    _template_dir: "{{ playbook_dir }}/../../../roles/openhands/templates"
    _agent_server_exec: >-
      {{ openhands_services_venv }}/bin/agent-server
      --host 127.0.0.1 --port {{ openhands_agent_server_port }}
    _automation_exec: >-
      {{ openhands_services_venv }}/bin/uvicorn openhands.automation.app:app
      --host 127.0.0.1 --port {{ openhands_automation_port }}
  tasks:
    - name: Render the openhands units with the service disabled (the default)
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}"
        dest: "{{ _fixture_dir }}/{{ item | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop:
        - openhands-agent-server.service.j2
        - openhands-automation.service.j2

    - name: Read the rendered agent server unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands-agent-server.service"
      register: _openhands_agent_server_unit

    - name: Read the rendered automation unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands-automation.service"
      register: _openhands_automation_unit

    - name: Decode the rendered units
      ansible.builtin.set_fact:
        _agent_server_unit: "{{ _openhands_agent_server_unit.content | b64decode }}"
        _automation_unit: "{{ _openhands_automation_unit.content | b64decode }}"

    - name: Assert the agent server unit contract
      ansible.builtin.assert:
        that:
          - "'User=' ~ openhands_user in _agent_server_unit"
          - "'WorkingDirectory=' ~ openhands_state_dir in _agent_server_unit"
          - "'ExecStart=' ~ _agent_server_exec in _agent_server_unit"
          - "'UMask=0027' in _agent_server_unit"
          - "'NoNewPrivileges=true' in _agent_server_unit"
          - "'ProtectSystem=strict' in _agent_server_unit"
          - "'ReadWritePaths=' ~ openhands_state_dir in _agent_server_unit"
          - "'EnvironmentFile=' not in _agent_server_unit"
          - "'test-placeholder' not in _agent_server_unit"
        fail_msg: "the agent server unit does not render its disabled-state contract"

    - name: Assert the automation unit contract
      ansible.builtin.assert:
        that:
          - "'ExecStart=' ~ _automation_exec in _automation_unit"
          - "'UMask=0027' in _automation_unit"
          - "'EnvironmentFile=' not in _automation_unit"
          - "'test-placeholder' not in _automation_unit"
        fail_msg: "the automation unit does not render its disabled-state contract"

    - name: Render the service environment file
      ansible.builtin.template:
        src: "{{ _template_dir }}/openhands.env.j2"
        dest: "{{ _fixture_dir }}/openhands.env"
        mode: "0600"

    - name: Read the rendered service environment file
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands.env"
      register: _openhands_env_raw

    - name: Decode the rendered service environment file
      ansible.builtin.set_fact:
        _openhands_env: "{{ _openhands_env_raw.content | b64decode }}"

    - name: Assert the service environment file contract
      ansible.builtin.assert:
        that:
          - "'OH_SESSION_API_KEYS_0=' ~ openhands_service_secrets['session-api-key'] in _openhands_env"
          - "'OH_SECRET_KEY=' ~ openhands_service_secrets['secret-key'] in _openhands_env"
          - "'AUTOMATION_AGENT_SERVER_URL=http://127.0.0.1:' ~ (openhands_agent_server_port | string) in _openhands_env"
          - >-
            'AUTOMATION_AGENT_SERVER_API_KEY='
            ~ openhands_service_secrets['session-api-key'] in _openhands_env
          - "'AUTOMATION_DB_URL=sqlite+aiosqlite:///' ~ openhands_automation_db_path in _openhands_env"
          - "'AUTOMATION_WORKSPACE_BASE=' ~ openhands_automation_workspace_base in _openhands_env"
          - "'AUTOMATION_KV_SECRET=' ~ openhands_service_secrets['automation-kv-secret'] in _openhands_env"
          - "'AUTOMATION_LOCAL_API_KEY=' ~ openhands_service_secrets['automation-local-api-key'] in _openhands_env"
          - "'LLM_MODEL=' ~ openhands_router_model in _openhands_env"
          - "'LLM_BASE_URL=https://llm.' ~ ingress_domain ~ '/v1' in _openhands_env"
          - "'LLM_API_KEY=' ~ openhands_router_key in _openhands_env"
        fail_msg: "the service environment file does not render the router and local-mode wiring"

    - name: Render the agent server unit with the service enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/openhands-agent-server.service.j2"
        dest: "{{ _fixture_dir }}/openhands-agent-server-enabled.service"
        mode: "0644"
      vars:
        openhands_service_enabled: true

    - name: Decode the enabled agent server unit
      ansible.builtin.set_fact:
        _agent_server_unit_enabled: >-
          {{ lookup('ansible.builtin.file', _fixture_dir ~ '/openhands-agent-server-enabled.service') }}

    - name: Assert the enabled unit loads the environment file
      ansible.builtin.assert:
        that:
          - "'EnvironmentFile=' ~ openhands_service_env_file in _agent_server_unit_enabled"
          - "'test-placeholder' not in _agent_server_unit_enabled"
        fail_msg: >-
          the enabled unit must load the environment file and never carry a
          key value itself

    - name: OpenHands template rendering PASSED
      ansible.builtin.debug:
        msg: |
          openhands template assertions passed:
          - both units render the pinned venv, loopback ports and shared hardening
          - disabled by default: no EnvironmentFile line and no key value anywhere
          - enabled: the unit loads the root-owned environment file
          - the env file wires local agent-server mode, SQLite state and the router LLM
