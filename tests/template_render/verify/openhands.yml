---
- name: Render and verify the openhands launcher unit and its gate
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../roles/openhands/defaults/main.yml"
  vars:
    ansible_become: false
    # This play gathers no facts. The Node directory derives from the
    # architecture fact, so the fixture supplies the one value it needs.
    ansible_architecture: x86_64
    _fixture_dir: "{{ render_tmp }}"
    _service_hardening_template: "{{ playbook_dir }}/../../../roles/_shared/templates/systemd-service-hardening.conf.j2"
    _service_common_template: "{{ playbook_dir }}/../../../roles/openhands/templates/openhands-service-common.conf.j2"
    # Mirror inventory/group_vars/all.yml: the router base URL in the role
    # defaults builds from the ingress domain.
    ingress_domain: "{{ lookup('ansible.builtin.env', 'PROXMOX_SUBDOMAIN') }}"
    _template_dir: "{{ playbook_dir }}/../../../roles/openhands/templates"
    _canvas_exec: >-
      {{ openhands_node_dir }}/bin/node {{ openhands_canvas_dir }}/bin/agent-canvas
      --public --port {{ openhands_canvas_port }}
  tasks:
    - name: Verify the service input gate rejects a missing router-key file
      block:
        - name: Run the role gate without a router-key file
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../../roles/openhands/tasks/assert_service_inputs.yml"
          vars:
            openhands_service_enabled: true
            openhands_router_key_file: ""
            openhands_backend_key_file: /run/openhands/backend-key

        - name: Fail if the role gate accepted a missing router-key file
          ansible.builtin.fail:
            msg: "The service input gate accepted a missing router-key file."
      rescue:
        - name: Confirm the role gate rejected the missing router-key file
          ansible.builtin.assert:
            that:
              - "'openhands_router_key_file' in ansible_failed_result.assertion"

    - name: Verify the service input gate rejects a missing backend-key file
      block:
        - name: Run the role gate without a backend-key file
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../../roles/openhands/tasks/assert_service_inputs.yml"
          vars:
            openhands_service_enabled: true
            openhands_router_key_file: /run/openhands/router-key
            openhands_backend_key_file: ""

        - name: Fail if the role gate accepted a missing backend-key file
          ansible.builtin.fail:
            msg: "The service input gate accepted a missing backend-key file."
      rescue:
        - name: Confirm the role gate rejected the missing backend-key file
          ansible.builtin.assert:
            that:
              - "'openhands_backend_key_file' in ansible_failed_result.assertion"

    - name: Verify the service input gate accepts both key-file paths
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/assert_service_inputs.yml"
      vars:
        openhands_service_enabled: true
        openhands_router_key_file: /run/openhands/router-key
        openhands_backend_key_file: /run/openhands/backend-key

    - name: Render the launcher unit with the service disabled (the default)
      ansible.builtin.template:
        src: "{{ _template_dir }}/openhands-canvas.service.j2"
        dest: "{{ _fixture_dir }}/openhands-canvas.service"
        mode: "0644"

    - name: Read the rendered launcher unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands-canvas.service"
      register: _openhands_canvas_unit_raw

    - name: Decode the rendered launcher unit
      ansible.builtin.set_fact:
        _canvas_unit: "{{ _openhands_canvas_unit_raw.content | b64decode }}"

    - name: Assert the launcher unit contract with the service disabled
      ansible.builtin.assert:
        that:
          - "'User=' ~ openhands_user in _canvas_unit"
          - "'WorkingDirectory=' ~ openhands_state_dir in _canvas_unit"
          - "'Environment=HOME=' ~ openhands_state_dir in _canvas_unit"
          - "'Environment=PATH=' ~ openhands_node_dir ~ '/bin:' in _canvas_unit"
          - "'ExecStart=/bin/sh -ec' in _canvas_unit"
          - "'exec ' ~ _canvas_exec in _canvas_unit"
          - "'UMask=0027' in _canvas_unit"
          - "'NoNewPrivileges=true' in _canvas_unit"
          - "'ProtectSystem=strict' in _canvas_unit"
          - "'ReadWritePaths=' ~ openhands_state_dir in _canvas_unit"
          - "'Restart=on-failure' in _canvas_unit"
          - "'WantedBy=multi-user.target' in _canvas_unit"
          - "'Environment=OH_CONVERSATION_RUNTIME=docker' in _canvas_unit"
          - >-
            'Environment=OH_CONVERSATION_CONTAINER_MEMORY='
            ~ (openhands_conversation_memory_limit | string) in _canvas_unit
          - >-
            'Environment=OH_CONVERSATION_CONTAINER_CPUS='
            ~ (openhands_conversation_cpus | string) in _canvas_unit
          - >-
            'Environment=OH_CONVERSATION_CONTAINER_PIDS_LIMIT='
            ~ (openhands_conversation_pids_limit | string) in _canvas_unit
          - "'LoadCredential=' not in _canvas_unit"
          - "'EnvironmentFile=' not in _canvas_unit"
          - "'Environment=LOCAL_BACKEND_API_KEY=' not in _canvas_unit"
          - "'openhands-secrets-agent' not in _canvas_unit"
        fail_msg: "the launcher unit does not render its disabled-state contract"

    - name: Render the launcher unit with the service enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/openhands-canvas.service.j2"
        dest: "{{ _fixture_dir }}/openhands-canvas-enabled.service"
        mode: "0644"
      vars:
        openhands_service_enabled: true
        openhands_backend_key_file: /run/openhands/backend-key

    - name: Read the enabled launcher unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands-canvas-enabled.service"
      register: _openhands_canvas_unit_enabled_raw

    - name: Decode the enabled launcher unit
      ansible.builtin.set_fact:
        _canvas_unit_enabled: "{{ _openhands_canvas_unit_enabled_raw.content | b64decode }}"

    - name: Assert the enabled unit loads its keys as credentials and never carries a value
      ansible.builtin.assert:
        that:
          - "'LoadCredential=openhands-backend-key:/run/openhands/backend-key' in _canvas_unit_enabled"
          - "'LoadCredential=openhands-secret-key:' ~ openhands_secrets_dir ~ '/secret-key' in _canvas_unit_enabled"
          - >-
            'LoadCredential=openhands-automation-kv-secret:'
            ~ openhands_secrets_dir ~ '/automation-kv-secret' in _canvas_unit_enabled
          - "'$$CREDENTIALS_DIRECTORY/openhands-backend-key' in _canvas_unit_enabled"
          - "'Environment=LOCAL_BACKEND_API_KEY=' not in _canvas_unit_enabled"
          - "'openhands_backend_key_file' not in _canvas_unit_enabled"
          - "'EnvironmentFile=' not in _canvas_unit_enabled"
          - "'After=openhands-secrets-agent.service' in _canvas_unit_enabled.split('[Service]')[0]"
          - "'Wants=openhands-secrets-agent.service' in _canvas_unit_enabled.split('[Service]')[0]"
        fail_msg: >-
          the enabled launcher unit must load its keys as credentials and never
          carry a key value itself, and must order after the key agent

    - name: Render the launcher key agent configuration and unit with the service enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.src }}"
        dest: "{{ _fixture_dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - src: openhands-secrets-agent.hcl.j2
          dest: openhands-secrets-agent.hcl
        - src: openhands-secrets-agent.service.j2
          dest: openhands-secrets-agent.service
      loop_control:
        label: "{{ item.dest }}"
      vars:
        openhands_service_enabled: true
        openhands_store_addr: https://openbao.example.invalid
        openhands_backend_key_file: /run/openhands/backend-key
        openhands_router_key_file: /run/openhands/router-key

    - name: Read the rendered key agent files
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/{{ item }}"
      loop:
        - openhands-secrets-agent.hcl
        - openhands-secrets-agent.service
      loop_control:
        label: "{{ item }}"
      register: _key_agent_raw

    - name: Decode the rendered key agent files
      ansible.builtin.set_fact:
        _key_agent_hcl: "{{ _key_agent_raw.results[0].content | b64decode }}"
        _key_agent_unit: "{{ _key_agent_raw.results[1].content | b64decode }}"

    - name: Assert the key agent renders both fields from one KV path at 0600 and fails on a missing field
      ansible.builtin.assert:
        that:
          - "'secret/data/apps/openhands' in _key_agent_hcl"
          - "'.Data.data.openhands_backend_api_key' in _key_agent_hcl"
          - "'.Data.data.openhands_llm_router_key' in _key_agent_hcl"
          - (_key_agent_hcl | regex_findall('perms\s*=\s*"0600"') | length) == 2
          - (_key_agent_hcl | regex_findall('error_on_missing_key\s*=\s*true') | length) == 2
          - (_key_agent_hcl | regex_findall('destination\s*=\s*"/run/openhands/backend-key"') | length) == 1
          - (_key_agent_hcl | regex_findall('destination\s*=\s*"/run/openhands/router-key"') | length) == 1
          - (_key_agent_hcl | regex_findall('role_id_file_path\s*=\s*"/etc/openhands/approle/role_id"') | length) == 1
          - (_key_agent_hcl | regex_findall('remove_secret_id_file_after_reading\s*=\s*false') | length) == 1
          - "'try-restart openhands-canvas.service' in _key_agent_hcl"
        fail_msg: >-
          the key agent must render both key files at 0600 from one KV path with
          error_on_missing_key, and must keep the secret_id file on restart
        quiet: true

    - name: Assert the key agent unit starts before the launcher and restarts on failure
      ansible.builtin.assert:
        that:
          - "'Before=openhands-canvas.service' in _key_agent_unit"
          - "'Restart=on-failure' in _key_agent_unit"
          - "'WantedBy=multi-user.target' in _key_agent_unit"
          - "'ExecStart=/usr/bin/bao agent -config=/etc/openhands/openhands-secrets-agent.hcl' in _key_agent_unit"
        fail_msg: "the key agent unit does not render its ordering, restart or exec contract"
        quiet: true

    - name: OpenHands launcher template rendering PASSED
      ansible.builtin.debug:
        msg: |
          openhands launcher assertions passed:
          - the unit runs the installed node and agent-canvas on the launcher port with the shared hardening
          - disabled by default: no credentials loaded and no key value anywhere
          - enabled: the three keys load as credentials, read by the launcher from $CREDENTIALS_DIRECTORY
          - the input gate requires the router and backend key files

    - name: Verify the CI-fix loader is skipped while disabled
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_config.yml"
      vars:
        openhands_ci_fix_enabled: false
        openhands_ci_fix_config: ""

    - name: Assert the CI-fix loader is not ready while disabled
      ansible.builtin.assert:
        that:
          - not _openhands_ci_fix_ready
        fail_msg: "the CI-fix loader must not be ready while openhands_ci_fix_enabled is false"
        quiet: true

    - name: Verify the CI-fix loader is skipped on an empty config
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_config.yml"
      vars:
        openhands_ci_fix_enabled: true
        openhands_ci_fix_config: ""

    - name: Assert the CI-fix loader is not ready on an empty config
      ansible.builtin.assert:
        that:
          - not _openhands_ci_fix_ready
        fail_msg: "the CI-fix loader must not be ready when OPENHANDS_CI_FIX_CONFIG is empty"
        quiet: true

    - name: Verify the CI-fix loader is skipped on unparseable config
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_config.yml"
      vars:
        openhands_ci_fix_enabled: true
        openhands_ci_fix_config: not json

    - name: Assert the CI-fix loader is not ready on unparseable config
      ansible.builtin.assert:
        that:
          - not _openhands_ci_fix_ready
        fail_msg: "the CI-fix loader must not be ready when OPENHANDS_CI_FIX_CONFIG is not a JSON object"
        quiet: true

    - name: Verify the CI-fix loader is ready on a valid config
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_config.yml"
      vars:
        openhands_ci_fix_enabled: true
        openhands_ci_fix_config: '{"owners":["example-org"],
          "profile_public":"00000000-0000-0000-0000-000000000001",
          "profile_private":"00000000-0000-0000-0000-000000000002"}'

    - name: Assert the CI-fix loader is ready with the parsed config
      ansible.builtin.assert:
        that:
          - _openhands_ci_fix_ready
          - _openhands_ci_fix.owners == ['example-org']
        fail_msg: "the CI-fix loader must be ready with the parsed owners when given a valid config"
        quiet: true

    - name: Verify the CI-fix shape assert rejects each malformed config
      ansible.builtin.include_tasks: openhands_ci_fix_shape_case.yml
      loop:
        - owners: []
          profile_public: "00000000-0000-0000-0000-000000000001"
          profile_private: "00000000-0000-0000-0000-000000000002"
        - owners: "example-org"
          profile_public: "00000000-0000-0000-0000-000000000001"
          profile_private: "00000000-0000-0000-0000-000000000002"
        - owners: [example-org]
          profile_public: "not-a-uuid"
          profile_private: "00000000-0000-0000-0000-000000000002"
      loop_control:
        loop_var: _ci_fix_case

    - name: Build the CI-fix bodies from a well-formed config
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_bodies.yml"
      vars:
        _openhands_ci_fix:
          owners: [example-org, example-org-2]
          profile_public: "00000000-0000-0000-0000-000000000001"
          profile_private: "00000000-0000-0000-0000-000000000002"

    - name: Assert the CI-fix bodies carry the visibility, owners and profile
      ansible.builtin.assert:
        that:
          - _openhands_ci_fix_bodies | length == 2
          - _openhands_ci_fix_bodies[0].name == 'ci-fix-public'
          - _openhands_ci_fix_bodies[1].name == 'ci-fix-private'
          - "'repository.private == `false`' in _openhands_ci_fix_bodies[0].trigger.filter"
          - "'repository.private == `true`' in _openhands_ci_fix_bodies[1].trigger.filter"
          - >-
            "contains(['example-org', 'example-org-2'], repository.owner.login)"
            in _openhands_ci_fix_bodies[0].trigger.filter
          - >-
            "contains(['CI Gate'], workflow_run.name)"
            in _openhands_ci_fix_bodies[0].trigger.filter
          - _openhands_ci_fix_bodies[1].agent_profile_id == '00000000-0000-0000-0000-000000000002'
          - not _openhands_ci_fix_bodies[0].enabled
          - _openhands_ci_fix_bodies[0].prompt == openhands_ci_fix_prompt
        fail_msg: "the CI-fix bodies did not render as expected"
        quiet: true

    - name: Plan the CI-fix writes with no existing automations
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_plan.yml"
      vars:
        _openhands_ci_fix_existing: []

    - name: Assert both CI-fix automations are created
      ansible.builtin.assert:
        that:
          - _openhands_ci_fix_plan | map(attribute='action') | list == ['create', 'create']
          - _openhands_ci_fix_plan[0].changes == _openhands_ci_fix_bodies[0]
        quiet: true

    - name: Plan the CI-fix writes when both already match
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_plan.yml"
      vars:
        _openhands_ci_fix_existing: >-
          {{ _openhands_ci_fix_bodies
             | map('combine', {'id': '11111111-1111-1111-1111-111111111111'}) | list }}

    - name: Assert nothing changes when both already match
      ansible.builtin.assert:
        that:
          - _openhands_ci_fix_plan | map(attribute='action') | list == ['none', 'none']
        quiet: true

    - name: Plan the CI-fix writes with one drifted prompt and one enabled automation
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/ci_fix_plan.yml"
      vars:
        _openhands_ci_fix_existing:
          - >-
            {{ _openhands_ci_fix_bodies[0]
               | combine({'id': '11111111-1111-1111-1111-111111111111', 'prompt': 'old'}) }}
          - >-
            {{ _openhands_ci_fix_bodies[1]
               | combine({'id': '22222222-2222-2222-2222-222222222222', 'enabled': true,
                          'trigger': _openhands_ci_fix_bodies[1].trigger | combine({'extra': 'kept'})}) }}

    - name: Assert only the drifted prompt is updated
      ansible.builtin.assert:
        that:
          - _openhands_ci_fix_plan[0].action == 'update'
          - _openhands_ci_fix_plan[0].id == '11111111-1111-1111-1111-111111111111'
          - _openhands_ci_fix_plan[0].changes.keys() | list == ['prompt']
          - _openhands_ci_fix_plan[1].action == 'none'
        quiet: true
