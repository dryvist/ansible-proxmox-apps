---
- name: Render and verify the openhands launcher unit and its gate
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../roles/openhands/defaults/main.yml"
  vars:
    ansible_become: false
    # This play gathers no facts. The Node directory derives from the
    # architecture fact, so the fixture supplies the one value it needs.
    ansible_architecture: x86_64
    _fixture_dir: "{{ render_tmp }}"
    _service_hardening_template: "{{ playbook_dir }}/../../../roles/_shared/templates/systemd-service-hardening.conf.j2"
    _service_common_template: "{{ playbook_dir }}/../../../roles/openhands/templates/openhands-service-common.conf.j2"
    # Mirror inventory/group_vars/all.yml: the router base URL in the role
    # defaults builds from the ingress domain.
    ingress_domain: "{{ lookup('ansible.builtin.env', 'PROXMOX_SUBDOMAIN') }}"
    _template_dir: "{{ playbook_dir }}/../../../roles/openhands/templates"
    _canvas_exec: >-
      {{ openhands_node_dir }}/bin/node {{ openhands_canvas_dir }}/bin/agent-canvas
      --public --port {{ openhands_canvas_port }}
  tasks:
    - name: Verify the service input gate rejects a missing router-key file
      block:
        - name: Run the role gate without a router-key file
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../../roles/openhands/tasks/assert_service_inputs.yml"
          vars:
            openhands_service_enabled: true
            openhands_router_key_file: ""
            openhands_backend_key_file: /run/openhands/backend-key

        - name: Fail if the role gate accepted a missing router-key file
          ansible.builtin.fail:
            msg: "The service input gate accepted a missing router-key file."
      rescue:
        - name: Confirm the role gate rejected the missing router-key file
          ansible.builtin.assert:
            that:
              - "'openhands_router_key_file' in ansible_failed_result.assertion"

    - name: Verify the service input gate rejects a missing backend-key file
      block:
        - name: Run the role gate without a backend-key file
          ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../../../roles/openhands/tasks/assert_service_inputs.yml"
          vars:
            openhands_service_enabled: true
            openhands_router_key_file: /run/openhands/router-key
            openhands_backend_key_file: ""

        - name: Fail if the role gate accepted a missing backend-key file
          ansible.builtin.fail:
            msg: "The service input gate accepted a missing backend-key file."
      rescue:
        - name: Confirm the role gate rejected the missing backend-key file
          ansible.builtin.assert:
            that:
              - "'openhands_backend_key_file' in ansible_failed_result.assertion"

    - name: Verify the service input gate accepts both key-file paths
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/openhands/tasks/assert_service_inputs.yml"
      vars:
        openhands_service_enabled: true
        openhands_router_key_file: /run/openhands/router-key
        openhands_backend_key_file: /run/openhands/backend-key

    - name: Render the launcher unit with the service disabled (the default)
      ansible.builtin.template:
        src: "{{ _template_dir }}/openhands-canvas.service.j2"
        dest: "{{ _fixture_dir }}/openhands-canvas.service"
        mode: "0644"

    - name: Read the rendered launcher unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands-canvas.service"
      register: _openhands_canvas_unit_raw

    - name: Decode the rendered launcher unit
      ansible.builtin.set_fact:
        _canvas_unit: "{{ _openhands_canvas_unit_raw.content | b64decode }}"

    - name: Assert the launcher unit contract with the service disabled
      ansible.builtin.assert:
        that:
          - "'User=' ~ openhands_user in _canvas_unit"
          - "'WorkingDirectory=' ~ openhands_state_dir in _canvas_unit"
          - "'Environment=HOME=' ~ openhands_state_dir in _canvas_unit"
          - "'Environment=PATH=' ~ openhands_node_dir ~ '/bin:' in _canvas_unit"
          - "'ExecStart=/bin/sh -ec' in _canvas_unit"
          - "'exec ' ~ _canvas_exec in _canvas_unit"
          - "'UMask=0027' in _canvas_unit"
          - "'NoNewPrivileges=true' in _canvas_unit"
          - "'ProtectSystem=strict' in _canvas_unit"
          - "'ReadWritePaths=' ~ openhands_state_dir in _canvas_unit"
          - "'Restart=on-failure' in _canvas_unit"
          - "'WantedBy=multi-user.target' in _canvas_unit"
          - "'Environment=OH_CONVERSATION_RUNTIME=docker' in _canvas_unit"
          - >-
            'Environment=OH_CONVERSATION_CONTAINER_MEMORY='
            ~ (openhands_conversation_memory_limit | string) in _canvas_unit
          - >-
            'Environment=OH_CONVERSATION_CONTAINER_CPUS='
            ~ (openhands_conversation_cpus | string) in _canvas_unit
          - >-
            'Environment=OH_CONVERSATION_CONTAINER_PIDS_LIMIT='
            ~ (openhands_conversation_pids_limit | string) in _canvas_unit
          - "'LoadCredential=' not in _canvas_unit"
          - "'EnvironmentFile=' not in _canvas_unit"
          - "'Environment=LOCAL_BACKEND_API_KEY=' not in _canvas_unit"
        fail_msg: "the launcher unit does not render its disabled-state contract"

    - name: Render the launcher unit with the service enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/openhands-canvas.service.j2"
        dest: "{{ _fixture_dir }}/openhands-canvas-enabled.service"
        mode: "0644"
      vars:
        openhands_service_enabled: true
        openhands_backend_key_file: /run/openhands/backend-key

    - name: Read the enabled launcher unit
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/openhands-canvas-enabled.service"
      register: _openhands_canvas_unit_enabled_raw

    - name: Decode the enabled launcher unit
      ansible.builtin.set_fact:
        _canvas_unit_enabled: "{{ _openhands_canvas_unit_enabled_raw.content | b64decode }}"

    - name: Assert the enabled unit loads its keys as credentials and never carries a value
      ansible.builtin.assert:
        that:
          - "'LoadCredential=openhands-backend-key:/run/openhands/backend-key' in _canvas_unit_enabled"
          - "'LoadCredential=openhands-secret-key:' ~ openhands_secrets_dir ~ '/secret-key' in _canvas_unit_enabled"
          - >-
            'LoadCredential=openhands-automation-kv-secret:'
            ~ openhands_secrets_dir ~ '/automation-kv-secret' in _canvas_unit_enabled
          - "'$$CREDENTIALS_DIRECTORY/openhands-backend-key' in _canvas_unit_enabled"
          - "'Environment=LOCAL_BACKEND_API_KEY=' not in _canvas_unit_enabled"
          - "'openhands_backend_key_file' not in _canvas_unit_enabled"
          - "'EnvironmentFile=' not in _canvas_unit_enabled"
        fail_msg: >-
          the enabled launcher unit must load its keys as credentials and never
          carry a key value itself

    - name: OpenHands launcher template rendering PASSED
      ansible.builtin.debug:
        msg: |
          openhands launcher assertions passed:
          - the unit runs the installed node and agent-canvas on the launcher port with the shared hardening
          - disabled by default: no credentials loaded and no key value anywhere
          - enabled: the three keys load as credentials, read by the launcher from $CREDENTIALS_DIRECTORY
          - the input gate requires the router and backend key files
