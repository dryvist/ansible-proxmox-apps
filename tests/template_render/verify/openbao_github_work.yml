---
# The github-work mount: two sets, two policies, two AppRoles, and the converge
# checks (roles/openbao/tasks/init/05b-github-app-set-checks.yml) run against
# fixture responses. Each policy must grant exactly its own work set path and
# neither the other set nor the raw endpoint; the sets must carry the declared
# maps with no administration; the AppRoles must be inert for the converge and
# human-minted.
- name: Render and verify the github-work mount, sets, policies and AppRoles
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    # OpenBao and Authelia role files ship in the pinned
    # dryvist.secrets_management collection; read them from its installed roles
    # directory, never from this repo's roles/.
    secrets_roles_dir: >-
      {{ lookup('ansible.builtin.first_found',
                files=['ansible_collections/dryvist/secrets_management/roles'],
                paths=lookup('ansible.builtin.config', 'COLLECTIONS_PATHS')) }}
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "{{ secrets_roles_dir }}/openbao/templates"
    _checks: "{{ secrets_roles_dir }}/openbao/tasks/init/05b-github-app-set-checks.yml"
    ansible_managed: "test fixture"
    _read:
      contents: read
      metadata: read
      pull_requests: read
      issues: read
      actions: read
      checks: read
    _write:
      contents: write
      pull_requests: write
      issues: write
      actions: read
      checks: read
      metadata: read
    _administration_keys: [administration, organization_administration]
    _empty_fixture: {results: []}
    _work_policies:
      - policy: "{{ openbao_github_work_read_policy_name }}"
        template: github-work-read-policy.hcl.j2
        set_name: work-read
      - policy: "{{ openbao_github_work_write_policy_name }}"
        template: github-work-write-policy.hcl.j2
        set_name: work-write
    _work_approles:
      - approle: "{{ openbao_github_work_read_approle_name }}"
        policy: "{{ openbao_github_work_read_policy_name }}"
      - approle: "{{ openbao_github_work_write_approle_name }}"
        policy: "{{ openbao_github_work_write_policy_name }}"
    _work_secret_id_paths:
      - "auth/approle/role/{{ openbao_github_work_read_approle_name }}/secret-id"
      - "auth/approle/role/{{ openbao_github_work_write_approle_name }}/secret-id"

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: "{{ secrets_roles_dir }}/openbao/defaults/main"

    - name: Pin the unconfigured case
      ansible.builtin.set_fact:
        openbao_github_work_installation_id: ""
        # Fixture workspace names: a real converge reads these from the runtime
        # environment, and the declared policy list renders them.
        openbao_terrakube_network_workspace: example-network
        openbao_terrakube_aws_workspace: example-aws

    - name: Assert no installation ID yields no sets, no mount and no policy
      ansible.builtin.assert:
        that:
          - openbao_github_work_permission_sets == []
          - openbao_github_work_mount not in (openbao_github_app_mounts | map(attribute='mount') | list)
          - >-
            _work_policies | map(attribute='policy')
            | select('in', openbao_policies | map(attribute='name') | list) | list == []
        quiet: true

    - name: Pin the configured case
      ansible.builtin.set_fact:
        openbao_github_work_installation_id: "1"

    - name: Assert a configured installation declares the mount, the policy and both sets
      ansible.builtin.assert:
        that:
          - openbao_github_work_mount in (openbao_github_app_mounts | map(attribute='mount') | list)
          - >-
            _work_policies | map(attribute='policy')
            | reject('in', openbao_policies | map(attribute='name') | list) | list == []
          - >-
            (openbao_github_work_permission_sets | items2dict(key_name='name', value_name='permissions'))
            == {'work-read': _read, 'work-write': _write}
          - >-
            (openbao_github_work_permission_sets | map(attribute='installation_id') | unique | list)
            == [openbao_github_work_installation_id]
          - openbao_github_work_permission_sets | selectattr('repositories', 'defined') | list == []
        quiet: true

    - name: Assert the work sets carry no administration
      ansible.builtin.assert:
        that:
          - >-
            (openbao_github_work_permission_sets | map(attribute='permissions') | map('dict2items')
             | flatten | selectattr('key', 'in', _administration_keys) | list) == []
        quiet: true

    - name: Render the work policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.template }}"
        dest: "{{ _fixture_dir }}/{{ item.set_name }}-policy.hcl"
        mode: "0644"
      loop: "{{ _work_policies }}"

    - name: Read the rendered work policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/{{ item.set_name }}-policy.hcl"
      loop: "{{ _work_policies }}"
      register: _work_policy_raw

    - name: Assert each work policy grants exactly its own work set and no other path
      vars:
        _m: "{{ openbao_github_work_mount }}"
        _work_read_text: "{{ _work_policy_raw.results[0].content | b64decode }}"
        _work_write_text: "{{ _work_policy_raw.results[1].content | b64decode }}"
        _work_read_policy_paths: >-
          {{ _work_read_text | regex_findall('(?m)^path "([^"]+)"') }}
        _work_write_policy_paths: >-
          {{ _work_write_text | regex_findall('(?m)^path "([^"]+)"') }}
      ansible.builtin.assert:
        that:
          - _work_read_policy_paths == [_m ~ '/token/work-read']
          - _work_write_policy_paths == [_m ~ '/token/work-write']
          - _m ~ '/token' not in (_work_read_policy_paths + _work_write_policy_paths)
          - _work_read_text is not search('administration')
          - _work_write_text is not search('administration')
          - (_work_read_text | regex_findall('capabilities = (.*)') | select('search', 'list|delete|sudo') | list) == []
          - >-
            (_work_write_text | regex_findall('capabilities = (.*)')
             | select('search', 'list|delete|sudo') | list) == []
        fail_msg: >-
          The work policies grant {{ _work_read_policy_paths }} (read) and
          {{ _work_write_policy_paths }} (write). Each must grant exactly its own
          work set on {{ _m }}, with no raw token path and no list, delete or
          sudo capability.
        quiet: true

    - name: Assert the work sets hold their declared maps and resolve to the whole installation
      ansible.builtin.include_tasks: "{{ _checks }}"
      vars:
        gm:
          mount: "{{ openbao_github_work_mount }}"
          permission_sets: "{{ openbao_github_work_permission_sets }}"
        openbao_github_app_mount_public_repos: "{{ _empty_fixture }}"
        openbao_github_app_mount_private_repos: "{{ _empty_fixture }}"

    - name: Assert the resolved work sets keep their maps and carry no repository list
      ansible.builtin.assert:
        that:
          - >-
            (openbao_github_app_mount_sets | items2dict(key_name='name', value_name='permissions'))
            == {'work-read': _read, 'work-write': _write}
          - openbao_github_app_mount_sets | selectattr('repositories', 'defined') | list == []
        quiet: true

    - name: Refuse an administration grant on a work set
      vars:
        _bad_sets: >-
          {{ openbao_github_work_permission_sets | selectattr('name', 'equalto', 'work-read') | list
             | map('combine', {'permissions': _read | combine({'administration': 'write'})}) | list }}
      block:
        - name: Reset the resolved set list
          ansible.builtin.set_fact:
            openbao_github_app_mount_sets: []
            _refused: false
        - name: Run the converge checks with an administration grant on a work set
          ansible.builtin.include_tasks: "{{ _checks }}"
          vars:
            gm:
              mount: "{{ openbao_github_work_mount }}"
              permission_sets: "{{ _bad_sets }}"
            openbao_github_app_mount_public_repos: "{{ _empty_fixture }}"
            openbao_github_app_mount_private_repos: "{{ _empty_fixture }}"
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            _refused: true
      always:
        - name: Assert the converge checks refused the administration grant
          ansible.builtin.assert:
            that: _refused | bool
            quiet: true

    - name: Assert each work AppRole is human-minted, workstation-bound and short-lived
      vars:
        _role: >-
          {{ openbao_approles | selectattr('name', 'equalto', item.approle) | first }}
      ansible.builtin.assert:
        that:
          - _role.policy == item.policy
          - _role.manage_secret_id is defined and not _role.manage_secret_id
          - _role.token_ttl == '30m'
          - _role.secret_id_ttl == '0s'
          - _role.secret_id_num_uses == 0
          - openbao_approle_cidr_class_map[item.approle] == 'workstation'
          - item.approle not in openbao_rotate_doppler_sync_domains
        quiet: true
      loop: "{{ _work_approles }}"

    - name: Assert github-work is retired and no longer declared
      ansible.builtin.assert:
        that:
          - "'github-work' in openbao_retired_approles"
          - "'github-work' in openbao_retired_policies"
          - "'github-work' not in (openbao_approles | map(attribute='name') | list)"
          - "'github-work' not in (openbao_policies | map(attribute='name') | list)"
        quiet: true

    - name: Render the human-unlock and approle-issuer policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.j2"
        dest: "{{ _fixture_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - human-unlock-policy.hcl
        - approle-issuer-policy.hcl

    - name: Read the rendered human-unlock and approle-issuer policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/{{ item }}"
      register: _unlock_issuer_raw
      loop:
        - human-unlock-policy.hcl
        - approle-issuer-policy.hcl

    - name: Assert human-unlock mints both work secret_ids and approle-issuer mints neither
      vars:
        _unlock_paths: >-
          {{ _unlock_issuer_raw.results[0].content | b64decode
             | regex_findall('(?m)^path "([^"]+)"') }}
        _issuer_paths: >-
          {{ _unlock_issuer_raw.results[1].content | b64decode
             | regex_findall('(?m)^path "([^"]+)"') }}
      ansible.builtin.assert:
        that:
          - _work_secret_id_paths | select('in', _unlock_paths) | list == _work_secret_id_paths
          - _work_secret_id_paths | select('in', _issuer_paths) | list == []
        fail_msg: >-
          human-unlock must mint the secret_id of each work AppRole (the roles are
          inert), and approle-issuer must mint neither.
        quiet: true
