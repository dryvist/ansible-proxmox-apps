---
- name: Render and verify cribl_stream templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Mirror roles/cribl_stream/defaults/main/ (only vars inputs.yml.j2 uses;
    # the real defaults derive these from tofu_data constants).
    cribl_stream_netflow_port: 2055
    cribl_hec_input_port: 8088
    cribl_stream_s2s_port: 10300
    cribl_stream_pve_metrics_port: 10370
    cribl_stream_s2s_metrics_port: 10360
    cribl_stream_otel_port: 4318
    cribl_stream_pq_enabled: true
    cribl_stream_alerts_slack_webhook: "https://hooks.example.invalid/grafana-alerts"
    cribl_stream_alerts_ntfy_url: "https://ntfy.example.invalid"
    cribl_stream_alerts_ntfy_topic: observability
    cribl_stream_alerts_ntfy_publish_url: "https://ntfy.example.invalid/"
    cribl_stream_grafana_ntfy_cutover_verified: false
    cribl_stream_alerts_splunk_search_url: >-
      https://splunk.example.invalid/en-US/app/search/search?q=search%20sourcetype%3Dgrafana%3Aalert
    grafana_stack_alert_contact_point_name: cribl-alerts
    grafana_stack_alert_repeat_interval: 30m
    grafana_stack_alert_warning_repeat_interval: 1h
    cribl_stream_prometheus_rw_port: 9201
    cribl_stream_prometheus_rw_api_path: /api/v1/write
    cribl_stream_victoriametrics_rw_url: "http://grafana.example.invalid:8428/api/v1/write"
    cribl_stream_prometheus_rw_url: "http://prometheus.example.invalid:9090/api/v1/write"
    cribl_stream_prometheus_splunk_keep_jobs:
      - blackbox_.*
      - smokeping
      - traefik
      - llm_router
      - llm_gpu_engine
      - dcgm_exporter
      - guest_node_exporter
    tofu_data:
      containers:
        guest_lxc_fixture:
          vmid: 101
          hostname: guest-lxc-fixture
          node: node-fixture
      vms:
        guest_vm_fixture:
          vmid: 102
          hostname: guest-vm-fixture
          node: node-fixture
      docker_vms:
        guest_docker_vm_fixture:
          vmid: 103
          hostname: guest-docker-vm-fixture
          node: node-fixture
      splunk_vm:
        guest_splunk_vm_fixture:
          vmid: 104
          hostname: guest-splunk-vm-fixture
          node: node-fixture
    # Mirror the ai_log_routing-derived defaults (representative subset: one
    # tcpjson CLI source, one rsyslog-fed syslog-type source with an explicit
    # override, and one *_docker source that must classify as syslog by
    # suffix alone — no cribl_stream_ai_input_types entry for it below).
    cribl_stream_ai_log_routing:
      claude_code: { port: 10311, index: claude, sourcetype: "claude:code" }
      homelab_llm: { port: 10323, index: llm, sourcetype: llamaswap }
      qdrant_docker: { port: 10347, index: qdrant, sourcetype: "qdrant:app" }
    cribl_stream_ai_input_types:
      homelab_llm: syslog
      openbao_audit: syslog
    cribl_stream_hec_namespace: ""
    cribl_stream_per_index_indexes: >-
      {{ (['ansible', 'netflow', 'ai_usage', 'cribl_internal', 'unifi_metrics', 'llm_pricefeed']
          + (cribl_stream_ai_log_routing.values() | map(attribute='index') | list))
         | unique | list }}
    # unpoller Prometheus scraper source (in_unpoller) fixture values.
    cribl_stream_unpoller_scrape_target: "localhost:9130"
    cribl_stream_unpoller_poll_minutes: 1
    # Langfuse OTLP leg — keys present, so the gated output + input
    # connection render (the absent-key path renders nothing to assert).
    cribl_stream_langfuse_url: "https://langfuse.example.com/api/public/otel"
    cribl_stream_langfuse_public_key: "PLACEHOLDER_PUBLIC_KEY"
    cribl_stream_langfuse_secret_key: "PLACEHOLDER_SECRET_KEY"
    cribl_stream_phoenix_url: "https://phoenix.example.com/v1/traces"
    cribl_stream_phoenix_api_key: "PLACEHOLDER_PHOENIX_API_KEY"
    # outputs.yml.j2 stand-ins (per-index render below).
    cribl_stream_splunk_hec_url: "https://splunk-hec.pve.example.com/services/collector/event"
    cribl_stream_splunk_hec_token: "test-hec-token-placeholder"
    cribl_stream_splunk_hec_tls_verify: false
    cribl_stream_splunk_hec_post_processing_pipeline: test-pack/test_redaction
    _template_dir: "../../../roles/cribl_stream/templates"

  tasks:
    - name: Render all cribl_stream fixtures and decode their content
      ansible.builtin.include_tasks: cribl_stream/render_and_decode.yml

    - name: Render Splunk trace fixtures
      ansible.builtin.include_tasks: cribl_stream/render_splunk_traces.yml

    - name: Assert on the rendered inputs and outputs
      ansible.builtin.include_tasks: cribl_stream/assertions_inputs.yml

    - name: Assert the OpenBao audit _time expression
      ansible.builtin.include_tasks: cribl_stream/assertions_inputs_openbao_audit.yml

    - name: Assert the Ansible converge HEC input
      ansible.builtin.include_tasks: cribl_stream/assertions_inputs_hec.yml

    - name: Assert on the metrics-fan-out inputs and outputs
      ansible.builtin.include_tasks: cribl_stream/assertions_inputs_metrics.yml

    - name: Assert on the rendered pipelines
      ansible.builtin.include_tasks: cribl_stream/assertions_pipelines.yml

    - name: Assert the bounded Splunk trace route
      ansible.builtin.include_tasks: cribl_stream/assertions_splunk_traces.yml

    - name: Assert the ClickHouse Prometheus route
      ansible.builtin.include_tasks: cribl_stream/assertions_clickhouse.yml

    - name: Assert alert notification filtering
      ansible.builtin.include_tasks: cribl_stream/assertions_alerts.yml

    - name: Assert on the UniFi-derived-metric pipelines
      ansible.builtin.include_tasks: cribl_stream/assertions_pipelines_unifi.yml

    - name: Assert on the PVE guest-identity lookup
      ansible.builtin.include_tasks: cribl_stream/assertions_pipelines_pve_guest.yml

    - name: Assert on the vscode index routing
      ansible.builtin.include_tasks: cribl_stream/assertions_pipelines_vscode.yml

    - name: Assert on the Phoenix trace pipeline
      ansible.builtin.include_tasks: cribl_stream/assertions_pipelines_phoenix.yml

    - name: Cribl Stream template rendering PASSED
      ansible.builtin.debug:
        msg: |
          cribl_stream template assertions passed:
          - inputs.yml.j2: tcpjson S2S + prometheus_rw + in_unpoller → splunk_hec + victoriametrics_rw
          - force_splunk_meta: conditional evals + valid mask schema (matchRegex/replaceExpr)
          - prometheus_to_netmon: eval coerces non-finite values + stamps index=netmon_metrics
          - prometheus_to_unifi_metrics: eval coerces non-finite values + stamps index=unifi_metrics
