---
# The LLM GPU engine scrape job assembled from role defaults and inventory.
# Renders the REAL template against the REAL role defaults and the REAL
# prometheus_group group_vars (vars_files), so the expression under test is
# the one that ships.
#
# No llm_vllm_group members means no GPU scrape jobs. A seeded inventory
# member renders one engine job plus the separate GPU hardware exporter job.
# The container_ip-only fixture models the DHCP-lease shape used by inventory.
#
# tofu_data is set as a FACT for the same reason as prometheus_llm_router_scrape.yml
# (llm_gpu_engine_metrics_port reads hostvars['localhost']['tofu_data']), so this
# play belongs in the same trailing, fact-publishing block of verify_templates.yml.
- name: Verify the LLM GPU engine scrape job renders once per inventory guest
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _pst_tpl: "{{ playbook_dir }}/../../../roles/prometheus_stack/templates/prometheus.yml.j2"
    _legacy_engine_job_names:
      - llama_server
      - sglang_server
      - vllm_server
      - strata_server
    _engine_job_names: "{{ _legacy_engine_job_names + ['llm_gpu_engine'] }}"
    _fixture_tofu_data:
      domain: test.example
      constants:
        service_ports:
          prometheus_web: 9090
          blackbox_exporter: 9115
          llm_router_api: 4321
          llm_fast_api: 10434
          smokeping_prober: 9374
          node_exporter: 9100
          gatus_web: 8080
          agentgateway_metrics: 15020
        memory_ports:
          hindsight_api: 8888
          hindsight_cp: 9999
      nodes: {}
      containers:
        agentgateway:
          ip: agw.test.example
          tags: [agentgateway]
        cribl-stream-01:
          ip: stream.test.example
          tags: [cribl-stream]

  vars_files:
    - "../../../roles/prometheus_stack/defaults/main.yml"
    - "../../../inventory/group_vars/prometheus_group.yml"

  tasks:
    - name: Publish the fixture inventory as a fact
      ansible.builtin.set_fact:
        tofu_data: "{{ _fixture_tofu_data }}"
        wan_hop_discovery_isp_hops: []

    - name: Render prometheus.yml with no llm_vllm_group members
      ansible.builtin.set_fact:
        _no_members: "{{ lookup('template', _pst_tpl) | from_yaml }}"

    - name: No group members renders no legacy or unified engine job
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _no_members.scrape_configs
            | selectattr('job_name', 'in', _engine_job_names)
            | list | length == 0
        fail_msg: >-
          With llm_vllm_group empty the template still rendered an engine
          scrape job. An empty target list must omit the job, not scrape nothing.
        success_msg: No group members, no job.

    - name: No group members render no GPU telemetry jobs
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            _no_members.scrape_configs
            | selectattr('job_name', 'in', ['dcgm_exporter', 'llm_gpu_engine'])
            | list | length == 0
        success_msg: No GPU guest, no GPU telemetry jobs.

    - name: Add a DHCP-lease-style llm_vllm_group member (container_ip only, no static ip)
      ansible.builtin.add_host:
        name: llm-vllm-under-test
        groups: llm_vllm_group
        container_ip: vllm-under-test.test.example

    - name: Render prometheus.yml with the group populated
      ansible.builtin.set_fact:
        _seeded: "{{ lookup('template', _pst_tpl) | from_yaml }}"

    - name: Isolate engine and GPU exporter jobs
      ansible.builtin.set_fact:
        _engine_jobs: "{{ _seeded.scrape_configs | selectattr('job_name', 'equalto', 'llm_gpu_engine') | list }}"
        _dcgm_jobs: "{{ _seeded.scrape_configs | selectattr('job_name', 'equalto', 'dcgm_exporter') | list }}"
        _legacy_engine_jobs: >-
          {{ _seeded.scrape_configs
             | selectattr('job_name', 'in', _legacy_engine_job_names)
             | list }}

    - name: Seeded render carries exactly one job with the group-derived target
      ansible.builtin.assert:
        quiet: true
        that:
          - _engine_jobs | length == 1
          - _engine_jobs[0].metrics_path == '/metrics'
          - _engine_jobs[0].params.format == ['prometheus']
          - _engine_jobs[0].static_configs[0].targets == ['vllm-under-test.test.example:10434']
          - _engine_jobs[0].static_configs[0].labels.guest == 'llm-vllm-under-test'
          - _legacy_engine_jobs | length == 0
        fail_msg: >-
          Seeded render has {{ _engine_jobs | length }} unified engine job(s):
          {{ _engine_jobs }} and {{ _legacy_engine_jobs | length }} legacy jobs.
          Expected one inventory-derived target with a guest label and no
          engine-specific duplicate scrapes.
        success_msg: One unified engine scrape and no legacy engine jobs.

    - name: Seeded inventory renders GPU and engine metrics targets
      ansible.builtin.assert:
        quiet: true
        that:
          - _dcgm_jobs | length == 1
          - _dcgm_jobs[0].metrics_path == '/metrics'
          - _dcgm_jobs[0].static_configs[0].targets == ['vllm-under-test.test.example:9400']
          - _dcgm_jobs[0].static_configs[0].labels.guest == 'llm-vllm-under-test'
          - _engine_jobs[0].static_configs[0].targets == ['vllm-under-test.test.example:10434']
        success_msg: GPU exporter and unified engine job use the group-derived guest.
