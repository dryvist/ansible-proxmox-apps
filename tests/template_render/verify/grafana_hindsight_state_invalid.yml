---
- name: Set a malformed fixture inventory
  ansible.builtin.set_fact:
    tofu_data: {constants: {service_state: {hindsight_enabled: "false"}}}

- name: Test the production guard with a malformed value
  block:
    - name: Invoke the role guard
      ansible.builtin.include_tasks: "../../../roles/{{ guarded_role }}/tasks/assert_hindsight_state.yml"
  rescue:
    - name: Record the expected rejection
      ansible.builtin.set_fact:
        _invalid_hindsight_state_rejected: true

- name: Require the guard to reject the malformed value
  ansible.builtin.assert:
    that: _invalid_hindsight_state_rejected | default(false) | bool

- name: Reset the rejection marker for the next guard
  ansible.builtin.set_fact:
    _invalid_hindsight_state_rejected: false
