---
- name: Assert the Grafana alert pipeline filters and publishes through ntfy
  ansible.builtin.assert:
    that:
      - "'grafana_alerts_ntfy' in _cribl_stream_defaults.cribl_stream_pipelines"
      - (_cribl_stream_grafana_alerts_pipeline | from_yaml).functions[0].filter == "sourcetype !== 'grafana:alert'"
      - "'output: ntfy_grafana_alerts' in _cribl_stream_inputs"
      - "'pipeline: grafana_alerts_ntfy' in _cribl_stream_inputs"
      - "'id: ntfy_grafana_alerts' in _cribl_stream_outputs_pi"
      - "'url: \"https://ntfy.example.invalid/observability\"' in _cribl_stream_outputs_pi"
      - "'customContentType: text/plain' in _cribl_stream_outputs_pi"
      - "'customSourceExpression: _raw' in _cribl_stream_outputs_pi"
      - "'slack_grafana_alerts' not in _cribl_stream_outputs_pi"
