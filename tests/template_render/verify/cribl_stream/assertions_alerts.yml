---
- name: Assert Grafana alert delivery is grouped and split from Nautobot Slack
  vars:
    _cribl_stream_grafana_functions: >-
      {{ (_cribl_stream_grafana_alerts_pipeline | from_yaml).functions }}
    _cribl_stream_nautobot_functions: >-
      {{ (_cribl_stream_nautobot_alerts_pipeline | from_yaml).functions }}
    _cribl_stream_verified_ntfy_functions: >-
      {{ (_cribl_stream_grafana_alerts_ntfy_verified | from_yaml).functions }}
    _cribl_stream_verified_slack_functions: >-
      {{ (_cribl_stream_grafana_alerts_slack_verified | from_yaml).functions }}
    _cribl_stream_policy: >-
      {{ (lookup('ansible.builtin.template',
          playbook_dir ~ '/../../../roles/grafana_stack/templates/alerting/notification-policies.yml.j2')
          | from_yaml).policies[0] }}
  ansible.builtin.assert:
    that:
      - "'grafana_alerts_ntfy' in _cribl_stream_defaults.cribl_stream_pipelines"
      - "'grafana_alerts_slack' in _cribl_stream_defaults.cribl_stream_pipelines"
      - not (_cribl_stream_defaults.cribl_stream_grafana_ntfy_cutover_verified | bool)
      - _cribl_stream_grafana_functions[0].filter == "sourcetype === 'grafana:alert'"
      - "'github_actions_ntfy' in _cribl_stream_grafana_functions[0].conf.code"
      - _cribl_stream_grafana_functions[1].id == 'drop'
      - "'grafana:alert:canary' in _cribl_stream_grafana_functions[1].filter"
      - "'github_actions_ntfy' in _cribl_stream_grafana_functions[1].filter"
      - >-
        _cribl_stream_grafana_functions[2].filter ==
        "sourcetype === 'grafana:alert:canary' || (sourcetype ===
        'grafana:alert' && github_actions_ntfy)"
      - "'JSON.parse(__e._raw)' in _cribl_stream_grafana_functions[2].conf.code"
      - "'sourceLinks' in _cribl_stream_grafana_functions[2].conf.code"
      - "'ntfy_parts' in _cribl_stream_grafana_functions[2].conf.code"
      - "'entityKeys' in _cribl_stream_grafana_functions[2].conf.code"
      - "'grafana_state_reason' in _cribl_stream_grafana_functions[2].conf.code"
      - _cribl_stream_grafana_functions[3].id == 'unroll'
      - _cribl_stream_grafana_functions[3].conf.srcExpr == 'ntfy_parts'
      - _cribl_stream_grafana_functions[3].conf.dstField == 'ntfy_part'
      - >-
        not _cribl_stream_grafana_functions[3].conf.srcExpr.startswith('__')
        and not _cribl_stream_grafana_functions[3].conf.dstField.startswith('__')
      - _cribl_stream_grafana_functions[4].id == 'code'
      - "'ntfy_part' in _cribl_stream_grafana_functions[4].conf.code"
      - "'delete __e.ntfy_parts;' in _cribl_stream_grafana_functions[4].conf.code"
      - "'delete __e.ntfy_part;' in _cribl_stream_grafana_functions[4].conf.code"
      - "'delete __e.github_actions_ntfy;' in _cribl_stream_grafana_functions[4].conf.code"
      - _cribl_stream_nautobot_functions[0].filter == "sourcetype === 'nautobot:drift'"
      - _cribl_stream_nautobot_functions[1].filter == "sourcetype === 'grafana:alert'"
      - "'github_actions_ntfy' in _cribl_stream_nautobot_functions[1].conf.code"
      - "'critical' in _cribl_stream_nautobot_functions[2].filter"
      - >-
        'grafana:alert' in _cribl_stream_nautobot_functions[2].filter
        and 'false || github_actions_ntfy' in _cribl_stream_nautobot_functions[2].filter
      - >-
        _cribl_stream_verified_ntfy_functions[0].filter ==
        "sourcetype === 'grafana:alert'"
      - >-
        _cribl_stream_verified_ntfy_functions[1].filter ==
        "sourcetype !== 'grafana:alert:canary' && sourcetype !== 'grafana:alert'"
      - >-
        _cribl_stream_verified_ntfy_functions[2].filter ==
        "sourcetype === 'grafana:alert:canary' || sourcetype === 'grafana:alert'"
      - >-
        'grafana:alert' in _cribl_stream_verified_slack_functions[2].filter
        and 'true || github_actions_ntfy' in _cribl_stream_verified_slack_functions[2].filter
      - _cribl_stream_policy.group_by == ['grafana_folder', 'alertname', 'severity']
      - _cribl_stream_policy.group_wait == '30s'
      - _cribl_stream_policy.group_interval == '5m'
      - _cribl_stream_policy.repeat_interval == grafana_stack_alert_repeat_interval
      - _cribl_stream_policy.routes[0].object_matchers == [['severity', '=', 'warning']]
      - _cribl_stream_policy.routes[0].repeat_interval == '1h'
      - _cribl_stream_policy.routes[1].object_matchers == [['severity', '=', 'info']]
      - _cribl_stream_policy.routes[1].repeat_interval == '1h'
    fail_msg: >-
      Grafana alert deliveries must retain all details through bounded ntfy
      continuations; critical Nautobot must remain on the separate direct Slack
      leg, and warning and info repeats should move to one hour.
