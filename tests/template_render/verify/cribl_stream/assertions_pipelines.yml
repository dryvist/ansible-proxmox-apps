---
- name: Assert force_splunk_meta evals are conditional and mask schema is valid
  ansible.builtin.assert:
    that:
      - "'index ||' in _cribl_stream_meta_pipeline"
      - "'sourcetype ||' in _cribl_stream_meta_pipeline"
      - "'matchRegex' in _cribl_stream_meta_pipeline"
      - "'replaceExpr' in _cribl_stream_meta_pipeline"
      - "'regex:' not in _cribl_stream_meta_pipeline"
      # Copilot datatypes stamp index=openai — there is no 'copilot' index;
      # openai is the designated Copilot/OpenAI CLI index (ai_log_routing).
      - "\"? 'openai'\" in _cribl_stream_meta_pipeline"
      - "\"? 'copilot'\" not in _cribl_stream_meta_pipeline"
      # antigravity-cli-* datatypes stamp the colon sourcetype form
      # (antigravity:cli:session / :history), mirroring gemini-cli-;
      # the general antigravity- branch stays for antigravity-brain etc.
      - "\"replace('antigravity-cli-','antigravity:cli:')\" in _cribl_stream_meta_pipeline"
    fail_msg: >-
      force_splunk_meta must keep conditional evals (index || ...) so
      Edge-stamped events pass through, and the mask rules must use
      matchRegex/replaceExpr — regex/replacement keys fail function init
      and silently disable the whole pipeline

- name: Assert force_splunk_meta renders as parseable YAML
  ansible.builtin.assert:
    that:
      - "(_cribl_stream_meta_pipeline | from_yaml).functions | length == 2"
    fail_msg: "force_splunk_meta conf.yml must parse as YAML with eval + mask functions"

- name: Assert prometheus_to_netmon stamps index=netmon_metrics and sourcetype=prometheus:metrics
  ansible.builtin.assert:
    that:
      - "(_cribl_stream_prom_pipeline | from_yaml).functions | length == 1"
      - "'netmon_metrics' in _cribl_stream_prom_pipeline"
      - "'prometheus:metrics' in _cribl_stream_prom_pipeline"
      - "'Number.isFinite' in _cribl_stream_prom_pipeline"
    fail_msg: >-
      prometheus_to_netmon pipeline must have exactly one eval function
      that coerces non-finite metric values and stamps index=netmon_metrics
      and sourcetype=prometheus:metrics

- name: Assert prometheus_to_unifi_metrics stamps index=unifi_metrics and sourcetype=prometheus:metrics
  ansible.builtin.assert:
    that:
      - "(_cribl_stream_unifi_pipeline | from_yaml).functions | length == 1"
      - "'unifi_metrics' in _cribl_stream_unifi_pipeline"
      - "'prometheus:metrics' in _cribl_stream_unifi_pipeline"
      - "'Number.isFinite' in _cribl_stream_unifi_pipeline"
    fail_msg: >-
      prometheus_to_unifi_metrics pipeline must have exactly one eval
      function that coerces non-finite metric values and stamps
      index=unifi_metrics and sourcetype=prometheus:metrics

- name: Assert otel_traces parses as YAML and keeps the trace-only drop first
  ansible.builtin.assert:
    that:
      - "(_cribl_stream_otel_traces | from_yaml).functions | length == 8"
      - "(_cribl_stream_otel_traces | from_yaml).functions[0].id == 'drop'"
      - "(_cribl_stream_otel_traces | from_yaml).output == 'langfuse_otlp'"
    fail_msg: >-
      otel_traces conf.yml must parse as YAML with the full enrichment chain
      and MUST still drop non-trace signals first — the Langfuse destination
      ingests traces only, and a metric or log on this leg jams the
      persistent queue until real spans stop flowing

- name: Assert otel_traces strips valueless attributes before the output
  ansible.builtin.assert:
    that:
      - "(_cribl_stream_otel_traces | from_yaml).functions[-1].id == 'code'"
      - "\"__e.attributes\" in _cribl_stream_otel_traces"
      - "\"delete __e.attributes\" in _cribl_stream_otel_traces"
    fail_msg: >-
      otel_traces must strip any attribute whose value is undefined or null
      as its LAST function, after every enrichment step's `x || undefined`
      has had a chance to run, using a Code function against `__e` (not an
      Eval "add" expression — Eval's value grammar rejects any function
      literal, e.g. an arrow function passed to .filter(), so that form is
      accepted by Ansible's template render but silently never executes on
      the real Cribl instance). The Langfuse worker throws "Cannot read
      properties of undefined (reading 'stringValue')" and drops the whole
      span on the shape an undefined/null attribute value produces.

- name: Assert otel_traces_phoenix keeps the guards and none of the Langfuse rewrites
  ansible.builtin.assert:
    that:
      - "(_cribl_stream_otel_traces_phoenix | from_yaml).functions | length == 4"
      - "(_cribl_stream_otel_traces_phoenix | from_yaml).functions[0].id == 'drop'"
      - "(_cribl_stream_otel_traces_phoenix | from_yaml).functions[-1].id == 'mask'"
      - "(_cribl_stream_otel_traces_phoenix | from_yaml).output == 'phoenix_otlp'"
      - "'langfuse.' not in (_cribl_stream_otel_traces_phoenix | regex_replace('#.*', ''))"
    fail_msg: >-
      otel_traces_phoenix must be the Langfuse leg minus its langfuse.*
      rewrites: drop non-traces first, drop plumbing, trim noise, redact
      last, and never write a langfuse.*-prefixed attribute — Phoenix reads
      the emitted GenAI attributes as-is, and a rewrite here would be a
      second copy of the Langfuse mapping to drift.

- name: Assert otel_traces maps emitter identity onto the Langfuse attribute contract
  ansible.builtin.assert:
    that:
      - "\"attributes['langfuse.user.id']\" in _cribl_stream_otel_traces"
      - "\"attributes['langfuse.session.id']\" in _cribl_stream_otel_traces"
      - "\"attributes['langfuse.trace.name']\" in _cribl_stream_otel_traces"
      - "\"attributes['langfuse.trace.tags']\" in _cribl_stream_otel_traces"
      - "\"attributes['langfuse.environment']\" in _cribl_stream_otel_traces"
      - "\"attributes['user.id']\" in _cribl_stream_otel_traces"
      - "\"attributes['session.id']\" in _cribl_stream_otel_traces"
    fail_msg: >-
      otel_traces must map the identity attributes emitters already send
      (user.id, session.id) onto the langfuse.*-prefixed attributes the
      backend actually reads. Without this mapping every trace lands with a
      null user, no session and an empty tag list — the data arrives and is
      then thrown away at the last hop.

- name: Assert otel_traces never synthesizes a session id
  ansible.builtin.assert:
    that:
      - "'Date.now' not in _cribl_stream_otel_traces"
      - "'activity_window' not in (_cribl_stream_otel_traces | regex_replace('#.*', ''))"
    fail_msg: >-
      session ids must come from the emitter or stay absent. A
      collector-derived session (time-window hash or similar) invents
      boundaries that do not exist, merges unrelated activity from one
      principal, and sends late-arriving spans into a different session
      than their siblings.

- name: Assert otel_traces normalizes token usage to the GenAI semantic convention
  ansible.builtin.assert:
    that:
      - "\"attributes['gen_ai.usage.input_tokens']\" in _cribl_stream_otel_traces"
      - "\"attributes['gen_ai.usage.output_tokens']\" in _cribl_stream_otel_traces"
      - "\"attributes['gen_ai.usage.cache_read_input_tokens']\" in _cribl_stream_otel_traces"
      - "\"attributes['gen_ai.usage.cache_creation_input_tokens']\" in _cribl_stream_otel_traces"
      - "\"attributes['cache_read_tokens']\" in _cribl_stream_otel_traces"
      - "\"attributes['cache_creation_tokens']\" in _cribl_stream_otel_traces"
      - "\"attributes['input_tokens']\" in _cribl_stream_otel_traces"
    fail_msg: >-
      coding-agent CLIs emit bare input_tokens/output_tokens; the backend
      reads gen_ai.usage.*, including the two cache keys it folds into cached
      and cache-creation usage. Without the mapping every generation shows zero
      usage and cost panels stay empty even though the numbers arrived.

- name: Assert otel_traces drops non-LLM MCP-server plumbing from the Langfuse leg only
  ansible.builtin.assert:
    that:
      - "'transport_worker' in _cribl_stream_otel_traces"
      - "'persist_rollout_items' in _cribl_stream_otel_traces"
      - "'transport_worker' not in _cribl_stream_otel_pipeline"
    fail_msg: >-
      MCP-server internals (auth, transport_worker, rollout persistence)
      carry no model, tokens or content and crowd out real generations.
      They must be dropped on the Langfuse leg and RETAINED on the Splunk
      leg (otel_stamp), so failure and latency evidence survives.

- name: Assert otel_traces redaction uses the valid mask schema
  ansible.builtin.assert:
    that:
      - "'matchRegex:' in _cribl_stream_otel_traces"
      - "'replaceExpr:' in _cribl_stream_otel_traces"
      - "'regex:' not in _cribl_stream_otel_traces"
      - "'replacement:' not in _cribl_stream_otel_traces"
      - "'sk-REDACTED' in _cribl_stream_otel_traces"
    fail_msg: >-
      mask rules must use matchRegex/replaceExpr — the regex/replacement
      keys are invalid and make the entire pipeline fail to load, which
      would take the whole Langfuse leg down rather than just the masking.
      Redaction must be in place BEFORE message-content capture is enabled
      at the emitters, since server-side masking is a licensed backend
      feature and is not available to us.

- name: Assert the OTLP destination endpoint carries no signal path
  ansible.builtin.assert:
    that:
      - not (cribl_stream_langfuse_url is search('/v1/traces$'))
    fail_msg: >-
      The OTLP destination appends the signal path itself. An endpoint that
      already ends in the signal path is posted to a doubled path, which 404s
      and stops trace delivery while every sibling leg keeps working.

- name: Assert unifi_syslog_to_metrics uses native Aggregations + Publish Metrics + Lookup
  vars:
    _unifi_syslog_fn_ids: >-
      {{ (_cribl_stream_unifi_syslog_pipeline | from_yaml).functions
         | map(attribute='id') | list }}
  ansible.builtin.assert:
    that:
      - "_unifi_syslog_fn_ids == ['drop', 'eval', 'lookup', 'eval', 'aggregation', 'publish_metrics', 'eval']"
      - "\"sourcetype !== 'ubiquiti:firewall'\" in _cribl_stream_unifi_syslog_pipeline"
      - "'unifi_vlan_map.csv' in _cribl_stream_unifi_syslog_pipeline"
      - "\"'unifi_firewall_action_total'\" in _cribl_stream_unifi_syslog_pipeline"
      - "'type: counter' in _cribl_stream_unifi_syslog_pipeline"
      - "'-A-' in _cribl_stream_unifi_syslog_pipeline"
      - "'-D-' in _cribl_stream_unifi_syslog_pipeline"
      - "\"'unifi_metrics'\" in _cribl_stream_unifi_syslog_pipeline"
    fail_msg: >-
      unifi_syslog_to_metrics must lead with a native Drop function filtered
      to sourcetype ubiquiti:firewall (this pipeline shares in_cribl_s2s with
      every other S2S-forwarded sourcetype), then derive action (-A-/-D- tag)
      and vlan (brN interface, joined against unifi_vlan_map.csv), aggregate
      by vlan+action with a native Aggregations function, and emit
      unifi_firewall_action_total as a counter via Publish Metrics —
      native functions only, no custom script.

- name: Assert ipfix_to_metrics derives both VLAN and WAN byte counters natively
  vars:
    _ipfix_metrics_fn_ids: >-
      {{ (_cribl_stream_ipfix_metrics_pipeline | from_yaml).functions
         | map(attribute='id') | list }}
  ansible.builtin.assert:
    that:
      - >-
        _ipfix_metrics_fn_ids ==
        ['eval', 'lookup', 'eval', 'aggregation', 'publish_metrics', 'publish_metrics', 'eval']
      - "\"'unifi_vlan_bytes_total'\" in _cribl_stream_ipfix_metrics_pipeline"
      - "\"'unifi_wan_bytes_total'\" in _cribl_stream_ipfix_metrics_pipeline"
      - "'unifi_vlan_map.csv' in _cribl_stream_ipfix_metrics_pipeline"
      - "'inputSnmp' in _cribl_stream_ipfix_metrics_pipeline"
      - "\"'unifi_metrics'\" in _cribl_stream_ipfix_metrics_pipeline"
    fail_msg: >-
      ipfix_to_metrics must derive vlan/direction/is_wan from the
      NetFlow/IPFIX fields, run a single Aggregations function grouped by
      vlan+direction+is_wan, and emit unifi_vlan_bytes_total /
      unifi_wan_bytes_total via two filtered Publish Metrics functions —
      native functions only.

- name: Assert pve_metrics_normalize keeps every path segment after the object id
  ansible.builtin.assert:
    that:
      - "'.slice(3)' in _cribl_stream_pve_metrics_pipeline"
      - "'.slice(4)' in _cribl_stream_pve_metrics_pipeline"
      - "\".join('_')\" in _cribl_stream_pve_metrics_pipeline"
      - "'__parts.length' not in _cribl_stream_pve_metrics_pipeline"
      - "'host_metrics' in _cribl_stream_pve_metrics_pipeline"
      - "\"'pve:metrics'\" in _cribl_stream_pve_metrics_pipeline"
    fail_msg: >-
      pve_metrics_normalize must build the metric name from every path
      segment after the object id (slice(3) for nodes/qemu/lxc, slice(4)
      for storages, joined with '_') — taking only the last segment
      collapses distinct keys like memory.used and swap.used onto the
      same metric name.

- name: Assert slice(3)/join('_') does not collide two real PVE node keys
  vars:
    _pve_key_memory: >-
      {{ ('proxmox.nodes.pve-node-a.memory.used'.split('.'))[3:] | join('_') }}
    _pve_key_swap: >-
      {{ ('proxmox.nodes.pve-node-a.swap.used'.split('.'))[3:] | join('_') }}
  ansible.builtin.assert:
    that:
      - "_pve_key_memory == 'memory_used'"
      - "_pve_key_swap == 'swap_used'"
      - "_pve_key_memory != _pve_key_swap"
    fail_msg: >-
      memory.used and swap.used must resolve to distinct metric-name
      suffixes (memory_used vs swap_used) — the old __parts[length-1]
      logic collapsed both to just "used".

- name: Assert the UniFi VLAN lookup CSV renders vlan_id/network_name rows
  ansible.builtin.assert:
    that:
      - "'vlan_id,network_name' in _cribl_stream_unifi_vlan_map"
      - "'40,siem' in _cribl_stream_unifi_vlan_map"
      - "'0,Default' in _cribl_stream_unifi_vlan_map"
    fail_msg: >-
      lookups/unifi_vlan_map.csv.j2 must render one vlan_id,network_name
      row per cribl_stream_unifi_networks entry — this is the join key both
      derived-metric pipelines use to turn a VLAN id into a network name.
