---
- name: Read rendered cribl_stream templates
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: _cribl_stream_rendered
  loop:
    - "{{ _fixture_dir }}/test_cribl_stream_inputs.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_force_splunk_meta.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_prometheus_to_netmon.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_prometheus_to_unifi_metrics.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_ai_stamp.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_outputs_per_index.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_traces.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_traces_phoenix.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_unifi_syslog_to_metrics.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_ipfix_to_metrics.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_unifi_vlan_map.csv"
    - "{{ _fixture_dir }}/test_cribl_stream_pve_metrics_normalize.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_metrics_to_splunk.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_metrics_to_victoriametrics.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_ansible_converge.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_ntfy.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_slack.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_pve_guest_map.csv"
    - "{{ _fixture_dir }}/test_cribl_stream_inputs_drift_token.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_ntfy_verified.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_slack_verified.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_inputs_per_index.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_traces_phoenix_keep_all.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_traces_arize.yml"

- name: Decode cribl_stream rendered content
  ansible.builtin.set_fact:
    _cribl_stream_inputs: "{{ _cribl_stream_rendered.results[0].content | b64decode }}"
    _cribl_stream_meta_pipeline: "{{ _cribl_stream_rendered.results[1].content | b64decode }}"
    _cribl_stream_prom_pipeline: "{{ _cribl_stream_rendered.results[2].content | b64decode }}"
    _cribl_stream_unifi_pipeline: "{{ _cribl_stream_rendered.results[3].content | b64decode }}"
    _cribl_stream_ai_pipeline: "{{ _cribl_stream_rendered.results[4].content | b64decode }}"
    _cribl_stream_outputs_pi: "{{ _cribl_stream_rendered.results[5].content | b64decode }}"
    _cribl_stream_otel_traces: "{{ _cribl_stream_rendered.results[6].content | b64decode }}"
    _cribl_stream_otel_traces_phoenix: "{{ _cribl_stream_rendered.results[7].content | b64decode }}"
    _cribl_stream_unifi_syslog_pipeline: "{{ _cribl_stream_rendered.results[8].content | b64decode }}"
    _cribl_stream_ipfix_metrics_pipeline: "{{ _cribl_stream_rendered.results[9].content | b64decode }}"
    _cribl_stream_unifi_vlan_map: "{{ _cribl_stream_rendered.results[10].content | b64decode }}"
    _cribl_stream_pve_metrics_pipeline: "{{ _cribl_stream_rendered.results[11].content | b64decode }}"
    _cribl_stream_otel_metrics_splunk_pipeline: "{{ _cribl_stream_rendered.results[12].content | b64decode }}"
    _cribl_stream_otel_metrics_victoriametrics_pipeline: "{{ _cribl_stream_rendered.results[13].content | b64decode }}"
    _cribl_stream_ansible_converge_pipeline: "{{ _cribl_stream_rendered.results[14].content | b64decode }}"
    _cribl_stream_grafana_alerts_pipeline: "{{ _cribl_stream_rendered.results[15].content | b64decode }}"
    _cribl_stream_nautobot_alerts_pipeline: "{{ _cribl_stream_rendered.results[16].content | b64decode }}"
    _cribl_stream_pve_guest_map: "{{ _cribl_stream_rendered.results[17].content | b64decode }}"
    _cribl_stream_inputs_drift_token: "{{ _cribl_stream_rendered.results[18].content | b64decode }}"
    _cribl_stream_grafana_alerts_ntfy_verified: "{{ _cribl_stream_rendered.results[19].content | b64decode }}"
    _cribl_stream_grafana_alerts_slack_verified: "{{ _cribl_stream_rendered.results[20].content | b64decode }}"
    _cribl_stream_inputs_per_index: "{{ _cribl_stream_rendered.results[21].content | b64decode }}"
    _cribl_stream_otel_traces_phoenix_keep_all: "{{ _cribl_stream_rendered.results[22].content | b64decode }}"
    _cribl_stream_otel_traces_arize: "{{ _cribl_stream_rendered.results[23].content | b64decode }}"
