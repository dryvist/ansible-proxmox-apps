---
- name: Assert Ansible converge HEC preserves its metadata through the Stream source
  vars:
    _cribl_stream_hec_input: >-
      {{ (_cribl_stream_inputs | from_yaml).inputs['splunk_hec:in_splunk_hec'] }}
  ansible.builtin.assert:
    that:
      - _cribl_stream_hec_input.type == 'splunk_hec'
      - _cribl_stream_hec_input.port | int == 8088
      - _cribl_stream_hec_input.authTokens[0].token == cribl_stream_splunk_hec_token
      - _cribl_stream_hec_input.connections[0].output == 'splunk_hec'
      - _cribl_stream_hec_input.connections[0].pipeline == 'ansible_converge'
      - _cribl_stream_hec_input.connections[1].output == 'ntfy_grafana_alerts'
      - _cribl_stream_hec_input.connections[1].pipeline == 'grafana_alerts_ntfy'
    fail_msg: >-
      the Stream HEC input must authenticate the callback and forward through
      the Ansible marker pipeline without replacing the HEC index or sourcetype

- name: Assert the alert HEC input uses the Grafana-only fan-out pipeline
  vars:
    _cribl_stream_alert_output: >-
      {{ (_cribl_stream_outputs_pi | from_yaml).outputs.ntfy_grafana_alerts }}
  ansible.builtin.assert:
    that:
      - _cribl_stream_alert_output.type == 'webhook'
      - _cribl_stream_alert_output.url == cribl_stream_alerts_ntfy_url
      - _cribl_stream_alert_output.method == 'POST'
      - _cribl_stream_alert_output.customContentType == 'text/plain'
      - _cribl_stream_alert_output.customSourceExpression == '_raw'
      - _cribl_stream_alert_output.onBackpressure == 'queue'
      - _cribl_stream_alert_output.pqMode == 'error'
      - _cribl_stream_alert_output.pqOnBackpressure == 'drop'
    fail_msg: >-
      Grafana alert envelopes must flow through Stream to the ntfy observability
      topic while the original HEC-to-Splunk event leg remains intact.
