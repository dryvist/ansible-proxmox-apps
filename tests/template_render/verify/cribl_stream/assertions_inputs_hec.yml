---
- name: Assert Ansible converge HEC preserves its metadata through the Stream source
  vars:
    _cribl_stream_hec_input: >-
      {{ (_cribl_stream_inputs | from_yaml).inputs['splunk_hec:in_splunk_hec'] }}
  ansible.builtin.assert:
    that:
      - _cribl_stream_hec_input.type == 'splunk_hec'
      - _cribl_stream_hec_input.port | int == 8088
      - _cribl_stream_hec_input.authTokens[0].token == cribl_stream_splunk_hec_token
      - _cribl_stream_hec_input.connections[0].output == 'splunk_hec'
      - _cribl_stream_hec_input.connections[0].pipeline == 'ansible_converge'
    fail_msg: >-
      the Stream HEC input must authenticate the callback and forward through
      the Ansible marker pipeline without replacing the HEC index or sourcetype
