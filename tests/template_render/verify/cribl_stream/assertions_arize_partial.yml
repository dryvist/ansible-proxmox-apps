---
- name: Reject a partial Arize AX credential set
  vars:
    cribl_stream_arize_url: "{{ arize_partial.url }}"
    cribl_stream_arize_api_key: "{{ arize_partial.api_key }}"
    cribl_stream_arize_space_id: "{{ arize_partial.space_id }}"
  block:
    - name: Run the role Arize AX validation
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../../roles/cribl_stream/tasks/resolve_arize.yml"

    - name: Fail if partial Arize AX values were accepted
      ansible.builtin.fail:
        msg: Partial Arize AX values unexpectedly passed validation.
  rescue:
    - name: Assert the partial Arize AX failure explains the required values
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg is search('Set all three Arize AX values')
        fail_msg: >-
          A partial Arize AX credential set must fail with the required
          environment variable names.
