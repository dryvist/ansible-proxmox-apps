---
# Renders the llm HEC index guard and the shared MLX pipeline, then decodes
# both for assertions_llm_hec_index_guard.yml. The splunk_hec_llm output
# itself comes from render_grafana_alerts.yml via _cribl_stream_outputs_pi.
- name: Render llm_hec_index_guard conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/llm_hec_index_guard/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_llm_hec_index_guard.yml"
    mode: "0644"

- name: Render mlx_metrics_only_to_pack conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/mlx_metrics_only_to_pack/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_mlx_metrics_only_to_pack.yml"
    mode: "0644"

- name: Slurp the rendered llm index guard and MLX pipelines
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ _fixture_dir }}/test_cribl_stream_llm_hec_index_guard.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_mlx_metrics_only_to_pack.yml"
  register: _cribl_stream_llm_guard_rendered

- name: Decode the rendered llm index guard and MLX pipelines
  ansible.builtin.set_fact:
    _cribl_stream_llm_index_guard: "{{ _cribl_stream_llm_guard_rendered.results[0].content | b64decode }}"
    _cribl_stream_mlx_pack_pipeline: "{{ _cribl_stream_llm_guard_rendered.results[1].content | b64decode }}"
