---
- name: Render otel_traces_to_splunk conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_traces_to_splunk/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_traces_to_splunk.yml"
    mode: "0644"
  vars:
    cribl_stream_hec_namespace: "fixture-hec-namespace"

- name: Render secret_redaction conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/secret_redaction/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_secret_redaction.yml"
    mode: "0644"
  vars:
    cribl_stream_ansi_csi_pattern: "{{ _cribl_stream_defaults.cribl_stream_ansi_csi_pattern }}"
    cribl_stream_secret_redaction_rules: "{{ _cribl_stream_defaults.cribl_stream_secret_redaction_rules }}"
    cribl_stream_otel_splunk_safe_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_splunk_safe_attributes }}"

- name: Render ansi_csi_strip conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/ansi_csi_strip/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_ansi_csi_strip.yml"
    mode: "0644"
  vars:
    cribl_stream_ansi_csi_pattern: "{{ _cribl_stream_defaults.cribl_stream_ansi_csi_pattern }}"

- name: Slurp the rendered Splunk trace fixtures
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ _fixture_dir }}/test_cribl_stream_otel_traces_to_splunk.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_secret_redaction.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_ansi_csi_strip.yml"
  register: _cribl_stream_splunk_trace_rendered

- name: Decode rendered Splunk trace fixtures
  ansible.builtin.set_fact:
    _cribl_stream_otel_traces_splunk_pipeline: >-
      {{ _cribl_stream_splunk_trace_rendered.results[0].content | b64decode }}
    _cribl_stream_secret_redaction_pipeline: >-
      {{ _cribl_stream_splunk_trace_rendered.results[1].content | b64decode }}
    _cribl_stream_ansi_csi_strip_pipeline: >-
      {{ _cribl_stream_splunk_trace_rendered.results[2].content | b64decode }}
