---
- name: Render cribl_stream inputs.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/inputs.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_inputs.yml"
    mode: "0644"

- name: Render force_splunk_meta conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/force_splunk_meta/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_force_splunk_meta.yml"
    mode: "0644"

- name: Render prometheus_to_netmon conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/prometheus_to_netmon/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_prometheus_to_netmon.yml"
    mode: "0644"

- name: Render ai_stamp conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/ai_stamp/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_ai_stamp.yml"
    mode: "0644"

- name: Render otel_stamp conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_stamp/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_stamp.yml"
    mode: "0644"

# The otel_traces enrichment chain is driven entirely by lists in the role
# defaults. Load them rather than restating the values here: a copy in the test
# would let the two drift, and the assertions would then pass against test-local
# data while the deployed pipeline used something else.
- name: Load cribl_stream role defaults for the otel_traces enrichment lists
  ansible.builtin.include_vars:
    file: "{{ _template_dir }}/../defaults/main.yml"
    name: _cribl_stream_defaults

- name: Render otel_traces conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_traces/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_traces.yml"
    mode: "0644"
  # Scoped to this task, and wired key by key: `vars` must be a literal
  # dictionary, and loading the whole defaults file into play scope would
  # override the Langfuse credential fixtures that outputs.yml.j2 needs. Only
  # the names are restated here — every VALUE still comes from the role
  # defaults, so the test cannot drift from what actually deploys.
  vars:
    cribl_stream_otel_drop_span_names: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_span_names }}"
    cribl_stream_otel_user_id_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_user_id_sources }}"
    cribl_stream_otel_session_id_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_session_id_sources }}"
    cribl_stream_otel_trace_name_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_trace_name_sources }}"
    cribl_stream_otel_trace_name_fallback: "{{ _cribl_stream_defaults.cribl_stream_otel_trace_name_fallback }}"
    cribl_stream_otel_tag_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_tag_sources }}"
    cribl_stream_otel_default_environment: "{{ _cribl_stream_defaults.cribl_stream_otel_default_environment }}"
    cribl_stream_otel_usage_aliases: "{{ _cribl_stream_defaults.cribl_stream_otel_usage_aliases }}"
    cribl_stream_otel_metadata_passthrough: "{{ _cribl_stream_defaults.cribl_stream_otel_metadata_passthrough }}"
    cribl_stream_otel_noise_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_noise_attributes }}"
    cribl_stream_otel_drop_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_attributes }}"
    cribl_stream_otel_redaction_rules: "{{ _cribl_stream_defaults.cribl_stream_otel_redaction_rules }}"
    cribl_stream_otel_redaction_fields: "{{ _cribl_stream_defaults.cribl_stream_otel_redaction_fields }}"

- name: Render outputs.yml.j2 with per-index HEC enabled to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/outputs.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_outputs_per_index.yml"
    mode: "0644"
  vars:
    # Documentation-only namespace UUID (RFC 4122 test value).
    cribl_stream_hec_namespace: "11111111-2222-4333-8444-555555555555"

- name: Read rendered cribl_stream templates
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: _cribl_stream_rendered
  loop:
    - "{{ _fixture_dir }}/test_cribl_stream_inputs.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_force_splunk_meta.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_prometheus_to_netmon.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_ai_stamp.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_outputs_per_index.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_stamp.yml"
    - "{{ _fixture_dir }}/test_cribl_stream_otel_traces.yml"

- name: Decode cribl_stream rendered content
  ansible.builtin.set_fact:
    _cribl_stream_inputs: "{{ _cribl_stream_rendered.results[0].content | b64decode }}"
    _cribl_stream_meta_pipeline: "{{ _cribl_stream_rendered.results[1].content | b64decode }}"
    _cribl_stream_prom_pipeline: "{{ _cribl_stream_rendered.results[2].content | b64decode }}"
    _cribl_stream_ai_pipeline: "{{ _cribl_stream_rendered.results[3].content | b64decode }}"
    _cribl_stream_outputs_pi: "{{ _cribl_stream_rendered.results[4].content | b64decode }}"
    _cribl_stream_otel_pipeline: "{{ _cribl_stream_rendered.results[5].content | b64decode }}"
    _cribl_stream_otel_traces: "{{ _cribl_stream_rendered.results[6].content | b64decode }}"
