---
# The defaults read hostvars['localhost'], which sees facts but not play vars.
- name: Expose the fixture tofu_data as a host fact
  ansible.builtin.set_fact:
    tofu_data: "{{ tofu_data }}"

- name: Load the PVE guest map role defaults
  ansible.builtin.include_vars:
    file: "../../../../roles/cribl_stream/defaults/main/60-pve-metrics.yml"
    name: _cribl_stream_pve_defaults

- name: Promote the PVE guest inventory defaults
  ansible.builtin.set_fact:
    cribl_stream_pve_guest_containers: >-
      {{ _cribl_stream_pve_defaults.cribl_stream_pve_guest_containers }}
    cribl_stream_pve_guest_vms: >-
      {{ _cribl_stream_pve_defaults.cribl_stream_pve_guest_vms }}

# Keep the source-preprocessing pipeline name single-sourced with the role.
- name: Load cribl_stream role defaults
  ansible.builtin.include_vars:
    dir: "../../../../roles/cribl_stream/defaults/main"
    name: _cribl_stream_defaults

- name: Promote shared agent telemetry tag defaults
  ansible.builtin.set_fact:
    cribl_stream_role_dir: "{{ (playbook_dir ~ '/../../../roles/cribl_stream') | realpath }}"
    cribl_stream_otel_agent_tag_defaults: "{{ _cribl_stream_defaults.cribl_stream_otel_agent_tag_defaults }}"

- name: Resolve the Arize AX render fixture state
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../../../roles/cribl_stream/tasks/resolve_arize.yml"

- name: Promote the derived run dimensions after the canonical schema
  ansible.builtin.set_fact:
    cribl_stream_otel_run_tags: "{{ _cribl_stream_defaults.cribl_stream_otel_run_tags }}"

- name: Render cribl_stream inputs.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/inputs.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_inputs.yml"
    mode: "0644"
  vars:
    cribl_stream_nautobot_drift_hec_token: ""

- name: Render cribl_stream inputs.yml.j2 with the Nautobot drift token
  ansible.builtin.template:
    src: "{{ _template_dir }}/inputs.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_inputs_drift_token.yml"
    mode: "0644"
  vars:
    cribl_stream_nautobot_drift_hec_token: fixture-nautobot-drift-token

- name: Render cribl_stream inputs.yml.j2 with per-index HEC outputs
  ansible.builtin.template:
    src: "{{ _template_dir }}/inputs.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_inputs_per_index.yml"
    mode: "0644"
  vars:
    cribl_stream_nautobot_drift_hec_token: ""
    cribl_stream_hec_namespace: "11111111-2222-4333-8444-555555555555"

- name: Render force_splunk_meta conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/force_splunk_meta/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_force_splunk_meta.yml"
    mode: "0644"

- name: Render prometheus_to_netmon conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/prometheus_to_netmon/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_prometheus_to_netmon.yml"
    mode: "0644"

- name: Render prometheus_to_unifi_metrics conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/prometheus_to_unifi_metrics/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_prometheus_to_unifi_metrics.yml"
    mode: "0644"

- name: Render pve_metrics_normalize conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/pve_metrics_normalize/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_pve_metrics_normalize.yml"
    mode: "0644"

- name: Render ai_stamp conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/ai_stamp/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_ai_stamp.yml"
    mode: "0644"

- name: Render otel_traces conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_traces/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_traces.yml"
    mode: "0644"
  # Scoped to this task, and wired key by key: `vars` must be a literal
  # dictionary, and loading the whole defaults file into play scope would
  # override the Langfuse credential fixtures that outputs.yml.j2 needs. Only
  # the names are restated here — every VALUE still comes from the role
  # defaults, so the test cannot drift from what actually deploys.
  vars:
    cribl_stream_otel_drop_span_names: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_span_names }}"
    cribl_stream_otel_user_id_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_user_id_sources }}"
    cribl_stream_otel_session_id_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_session_id_sources }}"
    cribl_stream_otel_bucket_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_bucket_sources }}"
    cribl_stream_otel_trace_bucket_seconds: "{{ _cribl_stream_defaults.cribl_stream_otel_trace_bucket_seconds }}"
    cribl_stream_otel_ns_per_second: "{{ _cribl_stream_defaults.cribl_stream_otel_ns_per_second }}"
    cribl_stream_otel_trace_name_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_trace_name_sources }}"
    cribl_stream_otel_trace_name_fallback: "{{ _cribl_stream_defaults.cribl_stream_otel_trace_name_fallback }}"
    cribl_stream_otel_tag_sources: "{{ _cribl_stream_defaults.cribl_stream_otel_tag_sources }}"
    cribl_stream_otel_default_environment: "{{ _cribl_stream_defaults.cribl_stream_otel_default_environment }}"
    cribl_stream_otel_usage_aliases: "{{ _cribl_stream_defaults.cribl_stream_otel_usage_aliases }}"
    cribl_stream_otel_metadata_passthrough: "{{ _cribl_stream_defaults.cribl_stream_otel_metadata_passthrough }}"
    cribl_stream_otel_noise_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_noise_attributes }}"
    cribl_stream_otel_drop_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_attributes }}"
    cribl_stream_secret_redaction_rules: "{{ _cribl_stream_defaults.cribl_stream_secret_redaction_rules }}"
    cribl_stream_otel_redaction_fields: "{{ _cribl_stream_defaults.cribl_stream_otel_redaction_fields }}"

- name: Test Langfuse trace-hour expressions with Node
  ansible.builtin.command:
    argv:
      - node
      - "{{ playbook_dir }}/../../cribl_stream_trace_hour_bucket.test.cjs"
  changed_when: false

# The Phoenix leg loops over a strict SUBSET of the same lists — only the
# names it consumes are wired, so a langfuse.* rewrite creeping into that
# template would fail to render here rather than ship.
- name: Render otel_traces_phoenix conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_traces_phoenix/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_traces_phoenix.yml"
    mode: "0644"
  vars:
    cribl_stream_phoenix_trace_keep_one_in: "{{ _cribl_stream_defaults.cribl_stream_phoenix_trace_keep_one_in }}"
    cribl_stream_phoenix_health_check_team_alias: >-
      {{ _cribl_stream_defaults.cribl_stream_phoenix_health_check_team_alias }}
    cribl_stream_otel_metadata_passthrough: "{{ _cribl_stream_defaults.cribl_stream_otel_metadata_passthrough }}"
    cribl_stream_otel_drop_span_names: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_span_names }}"
    cribl_stream_otel_noise_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_noise_attributes }}"
    cribl_stream_otel_drop_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_attributes }}"
    cribl_stream_secret_redaction_rules: "{{ _cribl_stream_defaults.cribl_stream_secret_redaction_rules }}"
    cribl_stream_otel_redaction_fields: "{{ _cribl_stream_defaults.cribl_stream_otel_redaction_fields }}"

- name: Render otel_traces_phoenix conf.yml.j2 with sampling disabled
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_traces_phoenix/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_traces_phoenix_keep_all.yml"
    mode: "0644"
  vars:
    cribl_stream_phoenix_trace_keep_one_in: 1
    cribl_stream_phoenix_health_check_team_alias: >-
      {{ _cribl_stream_defaults.cribl_stream_phoenix_health_check_team_alias }}
    cribl_stream_otel_metadata_passthrough: "{{ _cribl_stream_defaults.cribl_stream_otel_metadata_passthrough }}"
    cribl_stream_otel_drop_span_names: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_span_names }}"
    cribl_stream_otel_noise_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_noise_attributes }}"
    cribl_stream_otel_drop_attributes: "{{ _cribl_stream_defaults.cribl_stream_otel_drop_attributes }}"
    cribl_stream_secret_redaction_rules: "{{ _cribl_stream_defaults.cribl_stream_secret_redaction_rules }}"
    cribl_stream_otel_redaction_fields: "{{ _cribl_stream_defaults.cribl_stream_otel_redaction_fields }}"

- name: Render the public agent trace projection
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_traces_arize/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_traces_arize.yml"
    mode: "0644"

- name: Render otel_metrics_to_splunk conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_metrics_to_splunk/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_metrics_to_splunk.yml"
    mode: "0644"

- name: Render otel_metrics_to_victoriametrics conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/otel_metrics_to_victoriametrics/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_otel_metrics_to_victoriametrics.yml"
    mode: "0644"

# Non-empty fixture (matches the CSV render below): exercises the branch
# where the network list is published and the Lookup function is rendered.
# The empty-list branch (no Lookup, no CSV) is covered by
# tests/test_unifi_vlan_pipeline_contract.py, which renders both templates
# directly via Ansible's Templar with cribl_stream_unifi_networks == [].
- name: Render unifi_syslog_to_metrics conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/unifi_syslog_to_metrics/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_unifi_syslog_to_metrics.yml"
    mode: "0644"
  vars:
    cribl_stream_unifi_networks:
      - { key: vlan_siem, name: siem, vlan: 40 }
      - { key: lan_main, name: Default, vlan: 0 }

- name: Render ipfix_to_metrics conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/ipfix_to_metrics/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_ipfix_to_metrics.yml"
    mode: "0644"
  vars:
    cribl_stream_unifi_networks:
      - { key: vlan_siem, name: siem, vlan: 40 }
      - { key: lan_main, name: Default, vlan: 0 }

- name: Render the unifi_vlan_map.csv lookup to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/lookups/unifi_vlan_map.csv.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_unifi_vlan_map.csv"
    mode: "0644"
  vars:
    cribl_stream_unifi_networks:
      - { key: vlan_siem, name: siem, vlan: 40 }
      - { key: lan_main, name: Default, vlan: 0 }

- name: Render the pve_guest_map.csv lookup to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/lookups/pve_guest_map.csv.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_pve_guest_map.csv"
    mode: "0644"

- name: Render ansible_converge conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/ansible_converge/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_ansible_converge.yml"
    mode: "0644"

- name: Render Grafana alert fixtures and check their formatter
  ansible.builtin.include_tasks: render_grafana_alerts.yml

- name: Read and decode the rendered Cribl fixtures
  ansible.builtin.include_tasks: decode.yml
