---
# vscode index routing assertion, split out of assertions_pipelines.yml
# to keep that file under the CI token-limit gate.

- name: Assert vscode-* datatypes use their declared AI-client index
  ansible.builtin.assert:
    that:
      - "\"startsWith('vscode-') ? 'vscode'\" in _cribl_stream_meta_pipeline"
    fail_msg: >-
      force_splunk_meta must stamp index=vscode on vscode-* datatypes so
      their events reach the declared AI-client index
