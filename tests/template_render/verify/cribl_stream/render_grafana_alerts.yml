---
- name: Render grafana_alerts_ntfy conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/grafana_alerts_ntfy/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_ntfy.yml"
    mode: "0644"
  vars:
    cribl_stream_alerts_ntfy_url: "https://ntfy.example.test"
    cribl_stream_alerts_ntfy_topic: observability
    cribl_stream_alerts_splunk_search_url: >-
      https://splunk.example.test/en-US/app/search/search?q=search%20sourcetype%3Dgrafana%3Aalert%2A

- name: Render grafana_alerts_slack conf.yml.j2 to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/grafana_alerts_slack/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_slack.yml"
    mode: "0644"

- name: Render verified Grafana ntfy pipeline to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/grafana_alerts_ntfy/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_ntfy_verified.yml"
    mode: "0644"
  vars:
    cribl_stream_grafana_ntfy_cutover_verified: true
    cribl_stream_alerts_ntfy_url: "https://ntfy.example.test"
    cribl_stream_alerts_ntfy_topic: observability
    cribl_stream_alerts_splunk_search_url: >-
      https://splunk.example.test/en-US/app/search/search?q=search%20sourcetype%3Dgrafana%3Aalert%2A

- name: Render verified Grafana direct Slack pipeline to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/pipelines/grafana_alerts_slack/conf.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_grafana_alerts_slack_verified.yml"
    mode: "0644"
  vars:
    cribl_stream_grafana_ntfy_cutover_verified: true

- name: Render outputs.yml.j2 with per-index HEC enabled to /tmp
  ansible.builtin.template:
    src: "{{ _template_dir }}/outputs.yml.j2"
    dest: "{{ _fixture_dir }}/test_cribl_stream_outputs_per_index.yml"
    mode: "0644"
  vars:
    cribl_stream_victoriametrics_otlp_endpoint: >-
      {{ _cribl_stream_defaults.cribl_stream_victoriametrics_otlp_endpoint }}
    cribl_stream_per_index_indexes: >-
      {{ _cribl_stream_defaults.cribl_stream_per_index_indexes }}
    # Documentation-only namespace UUID (RFC 4122 test value).
    cribl_stream_hec_namespace: "11111111-2222-4333-8444-555555555555"

- name: Test the rendered ntfy webhook JSON expression and publish endpoint
  ansible.builtin.command:
    argv:
      - node
      - "{{ playbook_dir }}/../../cribl_stream_alert_format.test.cjs"
      - "{{ _fixture_dir }}/test_cribl_stream_outputs_per_index.yml"
  changed_when: false
