---
- name: Assert the public trace output enforces the native projection
  vars:
    _arize: "{{ _cribl_stream_otel_traces_arize | from_yaml }}"
    _arize_output: "{{ (_cribl_stream_outputs_pi | from_yaml).outputs.arize_otlp }}"
  ansible.builtin.assert:
    that:
      - _arize.output == 'arize_otlp'
      - _arize.functions | map(attribute='id') | list == ['drop', 'eval', 'drop', 'eval']
      - "\"attributes.privacy_class !== 'public'\" == _arize.functions[2].filter"
      - _arize_output.pipeline == 'otel_traces_arize'
      - _arize_output.systemFields == []
      - _arize_output.endpoint == cribl_stream_arize_url

# otel_traces_phoenix assertions, split out of assertions_pipelines.yml
# to keep that file under the CI token-limit gate.

- name: Assert otel_traces_phoenix keeps the guards and none of the Langfuse rewrites
  vars:
    _phoenix: "{{ _cribl_stream_otel_traces_phoenix | from_yaml }}"
    _phoenix_keep_all: "{{ _cribl_stream_otel_traces_phoenix_keep_all | from_yaml }}"
  ansible.builtin.assert:
    that:
      - _phoenix.functions | length == 10
      - _phoenix.functions[0].id == 'drop'
      - _phoenix.functions[3].id == 'drop'
      - >-
        _phoenix.functions[3].filter ==
        "attributes['litellm.team.alias'] === '" ~
        _cribl_stream_defaults.cribl_stream_phoenix_health_check_team_alias ~
        "'"
      - _phoenix.functions[4].id == 'drop'
      - >-
        'traceId' in _phoenix.functions[4].filter
        and '% 4 !== 0' in _phoenix.functions[4].filter
      - >-
        '/^[0-9a-f]{32}$/i.test(String(__e.trace_id ?? __e.traceId))' in _phoenix.functions[4].filter
      - >-
        "attributes.agent === 'unknown'" in _phoenix.functions[4].filter
      - _phoenix.functions[-1].id == 'mask'
      - _phoenix.output == 'phoenix_otlp'
      - "'langfuse.' not in (_cribl_stream_otel_traces_phoenix | regex_replace('#.*', ''))"
      - _phoenix_keep_all.functions | length == 9
      - "'traceId' not in _cribl_stream_otel_traces_phoenix_keep_all"
    fail_msg: >-
      otel_traces_phoenix must drop non-traces and router health checks,
      sample whole traces, drop plumbing, trim noise, redact credentials,
      keep every trace when sampling is disabled, and omit Langfuse rewrites.
