---
# Metrics-fan-out assertions, split out of assertions_inputs.yml (that file
# hit the CI token-limit gate as this group grew across three PRs). Every
# source here shares the same shape: fan to both victoriametrics_rw and
# Splunk, next to its own raw-event connection where it has one.

- name: Assert the S2S metrics input goes only to victoriametrics_rw
  ansible.builtin.assert:
    that:
      - "'type: tcpjson' in _cribl_stream_inputs"
      - "'id: in_cribl_s2s_metrics' in _cribl_stream_inputs"
      - "'port: 10360' in _cribl_stream_inputs"
    fail_msg: >-
      inputs.yml.j2 must include a dedicated in_cribl_s2s_metrics tcpjson
      input on its own port, connected only to victoriametrics_rw — it
      must not share in_cribl_s2s's force_splunk_meta connection (Splunk
      already receives these events directly from Edge's HEC output)

- name: Assert unpoller scraper input fans to Splunk and VictoriaMetrics
  ansible.builtin.assert:
    that:
      - "'prometheus:in_unpoller' in _cribl_stream_inputs"
      - "'type: prometheus' in _cribl_stream_inputs"
      - "'discoveryType: static' in _cribl_stream_inputs"
      - "'localhost:9130' in _cribl_stream_inputs"
      - "'pollInterval: 30' in _cribl_stream_inputs"
      - "'pipeline: prometheus_to_unifi_metrics' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('output: victoriametrics_rw') == 5"
    fail_msg: >-
      inputs.yml.j2 must include the unpoller Prometheus SCRAPER source
      (in_unpoller, static discovery, fixture target localhost:9130),
      connected to BOTH (prometheus_to_unifi_metrics -> splunk_hec) and
      victoriametrics_rw, per the operator's every-source-to-every-sink rule
      — five total victoriametrics_rw connections render in this fixture:
      prometheus_rw, in_cribl_s2s_metrics, this input, unifi_syslog_to_metrics
      and ipfix_to_metrics, each fanning its own source to that same sink

- name: Assert victoriametrics_rw Prometheus remote_write output renders
  ansible.builtin.assert:
    that:
      - "'victoriametrics_rw:' in _cribl_stream_outputs_pi"
      - "'type: prometheus' in _cribl_stream_outputs_pi"
      - "'url: \"http://grafana.example.invalid:8428/api/v1/write\"' in _cribl_stream_outputs_pi"
    fail_msg: >-
      outputs.yml.j2 must define victoriametrics_rw as type: prometheus
      targeting the fixture URL (FQDN + victoriametrics port + /api/v1/write)

- name: Assert unifi_syslog_to_metrics fans off the existing in_cribl_s2s input
  ansible.builtin.assert:
    that:
      - "'tcpjson:in_cribl_s2s' in _cribl_stream_inputs"
      - "'pipeline: force_splunk_meta' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: force_splunk_meta') == 1"
      - "'pipeline: unifi_syslog_to_metrics' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: unifi_syslog_to_metrics') == 2"
    fail_msg: >-
      inputs.yml.j2 must NOT add a new syslog listener — the UDW's firewall
      syslog already arrives via Cribl Edge -> S2S on the existing
      in_cribl_s2s input. unifi_syslog_to_metrics must attach there as two
      ADDITIONAL connections (splunk_hec + victoriametrics_rw), leaving the
      single existing force_splunk_meta connection (the raw-event path)
      untouched.

- name: Assert in_ipfix keeps its raw connection and adds a metrics fan-out
  ansible.builtin.assert:
    that:
      - "'pipeline: ipfix' in _cribl_stream_inputs"
      - "'pipeline: ipfix_to_metrics' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: ipfix_to_metrics') == 2"
    fail_msg: >-
      inputs.yml.j2 must keep in_ipfix's existing raw-event connection
      (pipeline: ipfix) UNCHANGED and add two more connections
      (splunk_hec + victoriametrics_rw) running pipeline: ipfix_to_metrics,
      so the derived byte-counter metrics reach both stores without
      touching the raw netflow event route.
