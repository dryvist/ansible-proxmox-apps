---
# Metrics-fan-out assertions, split out of assertions_inputs.yml (that file
# hit the CI token-limit gate as this group grew across three PRs). The Edge
# S2S metrics input keeps its VictoriaMetrics leg and conditionally adds the
# Prometheus receiver; Splunk already receives these events directly from Edge.

- name: Assert the S2S metrics input keeps both metric-store legs
  ansible.builtin.assert:
    that:
      - "'type: tcpjson' in _cribl_stream_inputs"
      - "'id: in_cribl_s2s_metrics' in _cribl_stream_inputs"
      - "'port: 10360' in _cribl_stream_inputs"
      - >-
        ((_cribl_stream_inputs | from_yaml).inputs['tcpjson:in_cribl_s2s_metrics'].connections
        | map(attribute='output') | list) == ['victoriametrics_rw', 'prometheus_rw']
    fail_msg: >-
      inputs.yml.j2 must include a dedicated in_cribl_s2s_metrics tcpjson
      input on its own port, connected to victoriametrics_rw and the optional
      prometheus_rw output — it must not share in_cribl_s2s's force_splunk_meta
      connection (Splunk already receives these events directly from Edge's HEC output)

- name: Assert unpoller scraper input fans to Splunk and VictoriaMetrics
  ansible.builtin.assert:
    that:
      - "'prometheus:in_unpoller' in _cribl_stream_inputs"
      - "'type: prometheus' in _cribl_stream_inputs"
      - "'discoveryType: static' in _cribl_stream_inputs"
      - "'localhost:9130' in _cribl_stream_inputs"
      - "'targetList:' in _cribl_stream_inputs"
      - "'interval: 1' in _cribl_stream_inputs"
      - "'logLevel: info' in _cribl_stream_inputs"
      - "'pollInterval' not in _cribl_stream_inputs"
      - "'pipeline: prometheus_to_unifi_metrics' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('output: victoriametrics_rw') == 8"
    fail_msg: >-
      inputs.yml.j2 must include the unpoller Prometheus SCRAPER source
      (in_unpoller, static discovery, fixture target localhost:9130),
      connected to BOTH (prometheus_to_unifi_metrics -> splunk_hec) and
      victoriametrics_rw, per the operator's every-source-to-every-sink rule
      — eight total victoriametrics_rw connections render in this fixture:
      prometheus_rw, in_cribl_s2s_metrics, this input, unifi_syslog_to_metrics,
      ipfix_to_metrics, in_pve_metrics, mlx_metrics_normalize and
      cribl:CriblMetrics, each fanning its own source to that same sink

- name: Assert mlx_metrics_normalize fans off the existing in_cribl_s2s input
  ansible.builtin.assert:
    that:
      - "'pipeline: mlx_metrics_normalize' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: mlx_metrics_normalize') == 2"
    fail_msg: >-
      inputs.yml.j2 must NOT add a new listener for the Mac Edge
      llm_metrics traffic — it already arrives on in_cribl_s2s like every
      other S2S-forwarded sourcetype. mlx_metrics_normalize must attach
      there as two ADDITIONAL connections (one Splunk leg + one
      victoriametrics_rw leg), leaving the existing force_splunk_meta
      connection (the raw-event path, index=llm) untouched. The fixture
      renders with cribl_stream_hec_namespace unset, so the Splunk leg
      here is the fallback plain splunk_hec output — see
      assertions_inputs.yml's per-index assertions for the
      HEC_NAMESPACE-set branch (splunk_hec_llm, reused rather than a
      dedicated splunk_hec_llm_metrics output).

- name: Assert victoriametrics_rw Prometheus remote_write output renders
  ansible.builtin.assert:
    that:
      - "'victoriametrics_rw:' in _cribl_stream_outputs_pi"
      - "'type: prometheus' in _cribl_stream_outputs_pi"
      - "'url: \"http://grafana.example.invalid:8428/api/v1/write\"' in _cribl_stream_outputs_pi"
    fail_msg: >-
      outputs.yml.j2 must define victoriametrics_rw as type: prometheus
      targeting the fixture URL (FQDN + victoriametrics port + /api/v1/write)

- name: Assert prometheus_rw output renders for Edge metrics
  ansible.builtin.assert:
    that:
      - "'prometheus_rw:' in _cribl_stream_outputs_pi"
      - "'type: prometheus' in _cribl_stream_outputs_pi"
      - "'url: \"http://prometheus.example.invalid:9090/api/v1/write\"' in _cribl_stream_outputs_pi"
    fail_msg: >-
      outputs.yml.j2 must define prometheus_rw as type: prometheus and target
      the fixture receiver URL when the inventory URL is set

- name: Assert the OTLP metrics route reaches VictoriaMetrics
  ansible.builtin.assert:
    that:
      - "'victoriametrics_otlp:' in _cribl_stream_outputs_pi"
      - "'endpoint: \"http://grafana.example.invalid:8428/opentelemetry\"' in _cribl_stream_outputs_pi"
      - "'systemFields: []' in _cribl_stream_outputs_pi"
      - "'pipeline: otel_metrics_to_victoriametrics' in _cribl_stream_inputs"
      - "(_cribl_stream_otel_metrics_victoriametrics_pipeline | from_yaml).output == 'victoriametrics_otlp'"
    fail_msg: >-
      extracted OTLP metrics must reach the VictoriaMetrics OTLP endpoint
      derived from the existing remote-write host and port; the destination
      must preserve the producer's metric dimensions and the route must drop
      non-metrics before export

- name: Assert unifi_syslog_to_metrics fans off the existing in_cribl_s2s input
  ansible.builtin.assert:
    that:
      - "'tcpjson:in_cribl_s2s' in _cribl_stream_inputs"
      - "'pipeline: force_splunk_meta' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: force_splunk_meta') == 1"
      - "'pipeline: unifi_syslog_to_metrics' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: unifi_syslog_to_metrics') == 2"
    fail_msg: >-
      inputs.yml.j2 must NOT add a new syslog listener — the UDW's firewall
      syslog already arrives via Cribl Edge -> S2S on the existing
      in_cribl_s2s input. unifi_syslog_to_metrics must attach there as two
      ADDITIONAL connections (splunk_hec + victoriametrics_rw), leaving the
      single existing force_splunk_meta connection (the raw-event path)
      untouched.

- name: Assert in_ipfix keeps its raw connection and adds a metrics fan-out
  ansible.builtin.assert:
    that:
      - "'pipeline: ipfix' in _cribl_stream_inputs"
      - "'pipeline: ipfix_to_metrics' in _cribl_stream_inputs"
      - "_cribl_stream_inputs.count('pipeline: ipfix_to_metrics') == 2"
    fail_msg: >-
      inputs.yml.j2 must keep in_ipfix's existing raw-event connection
      (pipeline: ipfix) UNCHANGED and add two more connections
      (splunk_hec + victoriametrics_rw) running pipeline: ipfix_to_metrics,
      so the derived byte-counter metrics reach both stores without
      touching the raw netflow event route.
