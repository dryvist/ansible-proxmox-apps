---
- name: Render and verify the cribl_edge syslog pipeline (unifi fw split)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Mirror roles/cribl_edge/defaults/main.yml: a representative subset of the
    # tofu syslog_port_map plus the firewall-split and hardware-reclassify match
    # patterns. HEC namespace is set so the per-index outputs + os router render.
    cribl_edge_syslog_routing:
      unifi: { standard: 514, high: 1514, index: unifi, sourcetype: "ubiquiti:unifi" }
      linux: { standard: 517, high: 1517, index: os, sourcetype: syslog }
    cribl_edge_syslog_port_mappings: { unifi: 1514, linux: 1517 }
    cribl_edge_unifi_fw_match: >-
      \[[A-Z][A-Z0-9_-]*-[AD]\]|\bIN=\S* OUT=\S* MAC=|suricata
    cribl_edge_hardware_match: >-
      smartd|medium error|failed command|I\/O error|vdev_state=|\bZED\b|\bZFS\b
    cribl_edge_hec_namespace: "12345678-1234-5678-1234-567812345678"
    cribl_edge_hec_url: "https://splunk-hec.pve.example.com"
    cribl_edge_hec_token: "test-hec-token-placeholder"
    cribl_edge_hec_input_port: 8088
    cribl_edge_hec_input_token: ""
    cribl_edge_langfuse_public_key: ""
    cribl_edge_per_index_indexes: [unifi, firewall, os, netmon, hardware]
    # cribl_edge ships in the dryvist.homelab collection (homelab-contracts),
    # not in this repo's roles/. Resolve its templates under whichever
    # configured collections path the install landed in, so the test works
    # against a default ~/.ansible install and an explicit
    # ANSIBLE_COLLECTIONS_PATH alike.
    _template_dir: >-
      {{ lookup('ansible.builtin.first_found',
                files=['templates'],
                paths=(lookup('ansible.builtin.config', 'COLLECTIONS_PATHS')
                       | map('regex_replace', '$',
                             '/ansible_collections/dryvist/homelab/roles/cribl_edge')
                       | list)) }}

  tasks:
    - name: Render the edge syslog pipeline to /tmp
      ansible.builtin.template:
        src: "{{ _template_dir }}/pipelines/syslog/conf.yml.j2"
        dest: "{{ _fixture_dir }}/test_cribl_edge_syslog_pipeline.yml"
        mode: "0644"

    - name: Read the rendered edge syslog pipeline
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_cribl_edge_syslog_pipeline.yml"
      register: _edge_syslog_raw

    - name: Decode and parse the rendered edge syslog pipeline
      ansible.builtin.set_fact:
        _edge_syslog: "{{ _edge_syslog_raw.content | b64decode }}"
        _edge_syslog_yaml: "{{ _edge_syslog_raw.content | b64decode | from_yaml }}"

    - name: Extract the rendered index/sourcetype expressions
      ansible.builtin.set_fact:
        _edge_index_expr: >-
          {{ (_edge_syslog_yaml.functions | first).conf.add
             | selectattr('name', 'equalto', 'index') | map(attribute='value') | first }}
        _edge_sourcetype_expr: >-
          {{ (_edge_syslog_yaml.functions | first).conf.add
             | selectattr('name', 'equalto', 'sourcetype') | map(attribute='value') | first }}

    - name: Assert the unifi firewall/IPS split branch precedes the plain unifi branch
      ansible.builtin.assert:
        that:
          # The fw branch tests _raw against the match pattern on the unifi port.
          - "\".test(_raw) ? 'firewall' :\" in _edge_index_expr"
          - "\".test(_raw) ? 'ubiquiti:firewall' :\" in _edge_sourcetype_expr"
          # Ternary chains evaluate in order — the fw branch MUST come first,
          # otherwise the plain unifi branch swallows every gateway line.
          - "_edge_index_expr.index(\".test(_raw) ? 'firewall'\") < _edge_index_expr.index(\"? 'unifi'\")"
          # Non-unifi families are untouched (single plain branch each).
          - "\"__inputId.includes('1517') ? 'os' :\" in _edge_index_expr"
          - "_edge_index_expr.count('.test(_raw)') == 1"
        fail_msg: >-
          The unifi firewall/IPS split did not render before the plain unifi
          branch (or leaked into other families): {{ _edge_index_expr }}

    - name: Assert the hardware reclassify eval renders (os-scoped, sets index=hardware)
      ansible.builtin.assert:
        that:
          # A dedicated eval, scoped to index=='os', matches the hardware
          # signatures on _raw and overrides index -> 'hardware'.
          - "\"index == 'os' && /\" in _edge_syslog"
          - "'smartd' in _edge_syslog"
          - "\"value: \\\"'hardware'\\\"\" in _edge_syslog"
        fail_msg: >-
          The hardware reclassify eval (index==os && hardware_match ->
          index=hardware) did not render into the syslog pipeline:
          {{ _edge_syslog }}

    # The reclassify only moves os -> hardware if the OUTPUT follows: the os
    # families pin an output router that reads the stamped index and ships
    # index=hardware to the dedicated hardware HEC output. Render outputs +
    # inputs and prove that wiring, mirroring the unifi assertion above.
    - name: Render the edge outputs + inputs to /tmp
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: outputs.yml.j2, dest: "{{ _fixture_dir }}/test_cribl_edge_outputs.yml" }
        - { src: inputs.yml.j2, dest: "{{ _fixture_dir }}/test_cribl_edge_inputs.yml" }

    - name: Read + parse the rendered outputs + inputs
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _edge_oi_raw
      loop:
        - "{{ _fixture_dir }}/test_cribl_edge_outputs.yml"
        - "{{ _fixture_dir }}/test_cribl_edge_inputs.yml"

    - name: Decode the rendered outputs + inputs
      ansible.builtin.set_fact:
        _edge_outputs: "{{ _edge_oi_raw.results[0].content | b64decode | from_yaml }}"
        _edge_inputs: "{{ _edge_oi_raw.results[1].content | b64decode | from_yaml }}"

    - name: Assert the os router ships index=hardware to the hardware HEC output
      ansible.builtin.assert:
        that:
          # Dedicated hardware HEC output exists (one index = one HEC).
          - "'splunk_hec_hardware' in _edge_outputs.outputs"
          # The os router keys on the stamped index and routes hardware first.
          - "_edge_outputs.outputs.splunk_hec_os_router.type == 'router'"
          - "_edge_outputs.outputs.splunk_hec_os_router.rules[0].filter == \"index=='hardware'\""
          - "_edge_outputs.outputs.splunk_hec_os_router.rules[0].output == 'splunk_hec_hardware'"
          - "_edge_outputs.outputs.splunk_hec_os_router.rules[0].final"
          - "_edge_outputs.outputs.splunk_hec_os_router.rules[1].output == 'splunk_hec_os'"
        fail_msg: >-
          The os output router did not route index=hardware to
          splunk_hec_hardware: {{ _edge_outputs.outputs.splunk_hec_os_router | default('MISSING') }}

    - name: Assert the os-family input pins the router; other families pin their own output
      ansible.builtin.assert:
        that:
          - "_edge_inputs.inputs.in_syslog_1517.connections[0].output == 'splunk_hec_os_router'"
          - "_edge_inputs.inputs.in_syslog_1514.connections[0].output == 'splunk_hec_unifi'"
        fail_msg: >-
          The os-family syslog input did not pin splunk_hec_os_router (or the
          unifi family was wrongly rerouted).

    - name: Cribl Edge syslog pipeline rendering PASSED
      ansible.builtin.debug:
        msg: |
          cribl_edge syslog pipeline assertions passed:
          - unifi fw/IPS split branch (regex on _raw) renders BEFORE the plain
            unifi branch, stamping index=firewall sourcetype=ubiquiti:firewall
          - other families keep their single plain branch
          - hardware reclassify eval (os-scoped) overrides index=hardware, and
            the os router ships index=hardware to splunk_hec_hardware while the
            os-family input pins that router
