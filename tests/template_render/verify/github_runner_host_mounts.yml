---
# Split out of github_runner.yml to stay under the repo's per-file token budget
# (.token-limits.yaml). Imported by that play, so it shares its vars
# (_template_dir, _fixture_dir, github_runner_docker_gid) and facts (_unit).
#
# Each slot reads RUNNER_HOST_MOUNTS from its own file. Slot 1 is a review
# slot and slot 3 is pooled, because github_runner_review_slots is 2 here.
- name: Render a review slot's and a pooled slot's host mounts files
  ansible.builtin.template:
    src: "{{ _template_dir }}/runner-mounts.env.j2"
    dest: "{{ _fixture_dir }}/test_runner.env-{{ github_runner_slot }}.mounts"
    mode: "0644"
  loop: [1, 3]
  loop_control:
    loop_var: github_runner_slot
  vars:
    # vars_files (role defaults) outrank play vars, so the boundary is set here.
    github_runner_review_slots: 2

- name: Read the rendered host mounts files
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/test_runner.env-{{ item }}.mounts"
  register: _mounts_raw
  loop: [1, 3]

- name: Keep each file's RUNNER_HOST_MOUNTS line
  ansible.builtin.set_fact:
    _review_mounts: >-
      {{ (_mounts_raw.results[0].content | b64decode).splitlines() | select('match', 'RUNNER_HOST_MOUNTS=') | list }}
    _pooled_mounts: >-
      {{ (_mounts_raw.results[1].content | b64decode).splitlines() | select('match', 'RUNNER_HOST_MOUNTS=') | list }}

- name: Assert the unit takes its host mounts from the slot's mounts file
  ansible.builtin.assert:
    that:
      - _unit | select('search', '^EnvironmentFile=/etc/github-runner/runner\\.env-%i\\.mounts$') | length > 0
      - _unit | select('search', '^\\s+\\$RUNNER_HOST_MOUNTS\\s') | length > 0
      - _unit | select('search', 'docker\\.sock|--group-add|_diag') | length == 0
      - _review_mounts == ['RUNNER_HOST_MOUNTS=']
    fail_msg: >-
      The unit must read RUNNER_HOST_MOUNTS from the slot's mounts file and
      name no host mount itself; a review slot's file must mount nothing.

- name: Assert a pooled slot keeps its _diag, tool cache, docker group and socket
  ansible.builtin.assert:
    that:
      - >-
        _pooled_mounts | select('search', '--volume\\s+' ~ github_runner_diag_host_dir ~ '/3:/actions-runner/_diag')
        | length > 0
      - >-
        _pooled_mounts | select('search', '--volume\\s+' ~ github_runner_tool_cache_host_dir ~ '/3:'
        ~ github_runner_tool_cache_mount) | length > 0
      - >-
        _pooled_mounts | select('search', '(^|\\s)--group-add\\s+' ~ (github_runner_docker_gid | string | regex_escape)
        ~ '\\s+--volume\\s+/var/run/docker\\.sock:/var/run/docker\\.sock') | length > 0
    fail_msg: >-
      A pooled slot must keep its per-slot _diag directory (its log files
      outlive --rm), its tool cache, the docker group and the Docker socket.
