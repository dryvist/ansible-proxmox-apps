---
- name: Render and verify the Authelia access-control rules
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    # The role defaults derive several values from tofu_data and the
    # environment. Only access_control is asserted here, so these are minimal
    # stand-ins that let the template render offline.
    tofu_data:
      domain: example.test
      constants:
        service_ports:
          authelia_portal: 9091
    authelia_oidc_hmac_secret: x
    authelia_oidc_jwks_key: x
    authelia_oidc_hermes_client_id: x
    authelia_oidc_hermes_redirect_uri: "https://x.example.test/cb"
    # One digest per confidential client, keyed by name. The role builds this
    # at converge time from the persisted digest files; the template looks a
    # name up, so a stand-in per client is all the render needs.
    #
    # Listed literally, NOT derived from authelia_oidc_confidential_clients:
    # that list carries each client's plaintext, which now raises when the
    # secret store is absent (as it is here). Listing the names is also
    # self-policing — a client added to the template without a stub here fails
    # this render, which is exactly how the previous two stale names surfaced.
    authelia_oidc_client_secret_hashes:
      homarr: x
      langfuse: x
      phoenix: x
      semaphore: x
      terrakube_dex: x
      grafana: x
    # Supplied by inventory/group_vars/all.yml at run time.
    ingress_domain: example.test
    grafana_hostname: grafana

  tasks:
    - name: Load the authelia role defaults
      ansible.builtin.include_vars:
        dir: "../../../roles/authelia/defaults/main"

    - name: Render the Authelia configuration
      ansible.builtin.template:
        src: "../../../roles/authelia/templates/configuration.yml.j2"
        dest: "{{ render_tmp }}/authelia-configuration.yml"
        mode: "0600"

    - name: Read back the rendered access-control rules
      ansible.builtin.slurp:
        src: "{{ render_tmp }}/authelia-configuration.yml"
      register: _authelia_raw

    - name: Parse the rendered configuration
      ansible.builtin.set_fact:
        _authelia_rules: >-
          {{ (_authelia_raw.content | b64decode | from_yaml)['access_control']['rules'] }}

    - name: Assert every bypass rule is scoped to a machine-API prefix, never the whole host
      ansible.builtin.assert:
        that:
          # A bypass entry must never widen to the entire domain. `policy:
          # bypass` with an unanchored or absent resource would hand the app's
          # browser UI to anyone, which is the failure this guard exists for.
          - _authelia_rules
            | selectattr('policy', 'eq', 'bypass')
            | rejectattr('resources', 'defined')
            | list | length == 0
          # Two machine-API roots are allowed, and only these two. Most apps
          # serve theirs under /api. OTLP collectors do not: the protocol puts
          # ingest at /v1/<signal> off the root, so a trace sink's bypass can
          # never match /api. Both alternatives stay anchored and narrow, which
          # is the property this guard actually protects.
          - _authelia_rules
            | selectattr('policy', 'eq', 'bypass')
            | map(attribute='resources') | flatten
            | reject('match', '\\^/(api|v1/)') | list | length == 0
        fail_msg: >-
          an Authelia bypass rule is missing a resource scope or does not
          anchor to /api or /v1/: {{ _authelia_rules }}

    - name: Assert Phoenix bypasses only its OTLP ingest, leaving the UI gated
      ansible.builtin.assert:
        that:
          # Regression guard, the Langfuse shape. Phoenix serves its browser UI
          # and its bearer-keyed OTLP ingest on one host. Cribl Stream cannot
          # complete a browser login, so the ingest path must bypass -- and
          # nothing else may, or the console goes public.
          - _phoenix_rule.resources == ['^/v1/traces(?:/.*)?$']
        fail_msg: >-
          Phoenix bypass is not scoped to /v1/traces (got
          {{ _phoenix_rule.resources }})
      vars:
        _phoenix_rule: >-
          {{ _authelia_rules
             | selectattr('policy', 'eq', 'bypass')
             | selectattr('domain', 'search', 'phoenix')
             | first }}

    - name: Assert Langfuse bypasses only /api/public, leaving /api/auth gated
      ansible.builtin.assert:
        that:
          # Regression guard. Langfuse serves NextAuth browser session and
          # sign-in routes under /api/auth. A blanket ^/api bypass — the value
          # this template hardcoded for every domain before the resource became
          # per-entry — would expose them unauthenticated.
          - _langfuse_rule.resources == ['^/api/public(?:/.*)?$']
          - "'^/api(?:/.*)?$' not in _langfuse_rule.resources"
        fail_msg: >-
          Langfuse bypass is not narrowed to /api/public
          (got {{ _langfuse_rule.resources }}); /api/auth would be exposed
      vars:
        _langfuse_rule: >-
          {{ _authelia_rules
             | selectattr('policy', 'eq', 'bypass')
             | selectattr('domain', 'search', 'langfuse')
             | first }}

    - name: Assert the default resource still applies to entries that omit it
      ansible.builtin.assert:
        that:
          # Entries without an explicit `resource` must keep the historical
          # value, so adding the per-entry knob changed no existing behaviour.
          - _zammad_rule.resources == ['^/api(?:/.*)?$']
        fail_msg: >-
          the default bypass resource changed for entries that omit it
          (got {{ _zammad_rule.resources }})
      vars:
        _zammad_rule: >-
          {{ _authelia_rules
             | selectattr('policy', 'eq', 'bypass')
             | selectattr('domain', 'search', 'zammad')
             | first }}

    - name: Assert Semaphore bypasses only its machine-consumed API paths
      ansible.builtin.assert:
        that:
          # Regression guard. Every real Semaphore API path enforces its own
          # bearer auth except /api/auth, which is the unauthenticated
          # browser login / OIDC-initiation surface. The bypass must cover
          # the machine-consumed paths and never widen to the default
          # blanket resource, which would expose /api/auth/login.
          - "'^/api(?:/.*)?$' not in _semaphore_rule.resources"
          - _semaphore_paths | reject('match', _semaphore_rule.resources[0]) | list | length == 0
          - _semaphore_auth_paths | select('match', _semaphore_rule.resources[0]) | list | length == 0
        fail_msg: >-
          Semaphore bypass does not cover its machine API paths, or exposes
          /api/auth (got {{ _semaphore_rule.resources }})
      vars:
        _semaphore_rule: >-
          {{ _authelia_rules
             | selectattr('policy', 'eq', 'bypass')
             | selectattr('domain', 'search', 'semaphore')
             | first }}
        # Paths that returned 401 without a bearer token, probed live, plus
        # the intentionally public health check.
        _semaphore_paths:
          - /api/ping
          - /api/info
          - /api/apps
          - /api/projects
          - /api/project/1
          - /api/users
          - /api/user
          - /api/user/tokens
          - /api/events
          - /api/runners
          - /api/options
          # /api/users/{id} (PUT, sets a user's admin flag) -- regression case
          # for a suffix group missing on one alternative only.
          - /api/users/5
          # GET /project/{id}/users REQUIRES sort/order query params --
          # regression case for a bare `$` rejecting a path with a query.
          - /api/project/1/users?sort=name&order=asc
        # Semaphore's own unauthenticated browser login/OIDC-initiation
        # surface, which must stay gated behind the portal.
        _semaphore_auth_paths:
          - /api/auth/login
          - /api/auth/oidc/authelia/login

    - name: Authelia access-control verification PASSED
      ansible.builtin.debug:
        msg: |
          Authelia access-control assertions passed:
          - every bypass rule is scoped to an /api prefix
          - Langfuse is narrowed to /api/public, so /api/auth stays gated
          - Semaphore's allowlist covers its API paths without exposing /api/auth
          - entries omitting `resource` keep the previous default
