---
# Regression guard for the 403 that broke Semaphore task 323
# (playbooks/openbao-rotate-approles.yml, scheduled mode): the rotate
# identity's policy granted mint/destroy on each domain AppRole's secret-id
# but not the role-id read or the secret-id/lookup sub-path
# tasks/openbao_rotate_one_domain.yml also calls, and the scheduled
# identity's own self-rotation block was missing three of those four grants
# outright. Render the real policy and assert every path
# openbao_rotate_one_domain.yml calls is granted, for one domain AND for the
# scheduled self-rotation identity.
- name: Verify the approle-secret-id-rotate policy grants every path the rotate task calls
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/openbao/templates"

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Render the approle-secret-id-rotate policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/approle-secret-id-rotate-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/approle-secret-id-rotate-policy.hcl"
        mode: "0644"

    - name: Read the rendered policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/approle-secret-id-rotate-policy.hcl"
      register: _rotate_policy_raw

    - name: Reduce the rendered policy to its granted paths
      ansible.builtin.set_fact:
        _rotate_policy_paths: >-
          {{ (_rotate_policy_raw.content | b64decode)
             | regex_findall('(?m)^path "([^"]+)"') }}

    # tasks/openbao_rotate_one_domain.yml's calls on a per-role name, for
    # every identity this policy rotates: one openbao_secrets domain
    # (observability) and the scheduled identity rotating itself.
    - name: Assert every role-scoped call this task makes is granted, per identity
      vars:
        _required_suffixes:
          - role-id
          - secret-id
          - secret-id/lookup
          - secret-id-accessor/destroy
        _missing: >-
          {{ _required_suffixes
             | map('regex_replace', '^(.*)$', 'auth/approle/role/' ~ item ~ '/\1')
             | reject('in', _rotate_policy_paths) | list }}
      ansible.builtin.assert:
        that:
          - _missing | length == 0
        fail_msg: >-
          {{ item }}: missing grant(s) {{ _missing }}. Every path
          tasks/openbao_rotate_one_domain.yml calls for a role name must be
          granted for that identity, or its rotation 403s partway through.
        quiet: true
      loop: >-
        {{ [openbao_observability_approle_name,
            openbao_approle_secret_id_rotate_scheduled_approle_name]
           + openbao_host_secret_zero_approle_names }}

    # The read this policy deliberately does NOT grant: rotate reads each
    # domain's declared secret_id_ttl from
    # openbao_approle_secret_id_ttl_overrides (08a-admin-and-ttls.yml), never
    # a live `auth/approle/role/<name>` GET -- regranting that read here
    # would be the wider, non-minimal fix this repo chose not to make.
    - name: Assert the bare role-config path is never granted
      ansible.builtin.assert:
        that:
          - >-
            ('auth/approle/role/' ~ openbao_observability_approle_name)
            not in _rotate_policy_paths
        fail_msg: >-
          The rotate policy grants a bare auth/approle/role/<name> read.
          Rotation is meant to read the declared secret_id_ttl from
          openbao_approle_secret_id_ttl_overrides instead.
        quiet: true

    # tasks/openbao_rotate_one_domain.yml GETs the Doppler sync token from
    # this KV path once (openbao-rotate-approles.yml), then reuses it to
    # republish openbao_rotate_doppler_sync_domains' pairs -- the read grant must
    # exist or the whole run 403s at that GET before any domain rotates.
    - name: Assert the Doppler sync token KV path is granted read
      ansible.builtin.assert:
        that:
          - >-
            ('secret/data/' ~ openbao_rotate_doppler_token_kv_path)
            in _rotate_policy_paths
        fail_msg: >-
          The rotate policy does not grant read on
          secret/data/{{ openbao_rotate_doppler_token_kv_path }}. The Doppler
          sync GET in openbao-rotate-approles.yml will 403.
        quiet: true
