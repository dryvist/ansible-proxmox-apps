---
# Regression guard for the 403 that broke Semaphore task 323
# (playbooks/openbao-rotate-approles.yml, scheduled mode): the rotate
# identity's policy granted mint/destroy on each domain AppRole's secret-id
# but not the role-id read or the secret-id/lookup sub-path
# tasks/openbao_rotate_one_domain.yml also calls, and the scheduled
# identity's own self-rotation block was missing three of those four grants
# outright. Render the real policy and assert every path
# openbao_rotate_one_domain.yml calls is granted, for one domain AND for the
# scheduled self-rotation identity.
- name: Verify the approle-secret-id-rotate policy grants every path the rotate task calls
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/openbao/templates"

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Render the approle-secret-id-rotate policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/approle-secret-id-rotate-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/approle-secret-id-rotate-policy.hcl"
        mode: "0644"

    - name: Read the rendered policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/approle-secret-id-rotate-policy.hcl"
      register: _rotate_policy_raw

    - name: Reduce the rendered policy to its granted paths
      ansible.builtin.set_fact:
        _rotate_policy_paths: >-
          {{ (_rotate_policy_raw.content | b64decode)
             | regex_findall('(?m)^path "([^"]+)"') }}

    - name: Assert each granted path is rendered once
      ansible.builtin.assert:
        that:
          - _rotate_policy_paths | length == (_rotate_policy_paths | unique | length)
        fail_msg: The rotate policy rendered a duplicate path for overlapping catalogs.
        quiet: true

    - name: Assert reconcile uses per-call issuance instead of stored rotation credentials
      vars:
        _reconcile: >-
          {{ openbao_approles | selectattr('name', 'equalto',
               openbao_reconcile_approle_name) | first }}
      ansible.builtin.assert:
        that:
          - _reconcile.secret_id_ttl == '15m'
          - _reconcile.secret_id_num_uses | int == 1
          - openbao_reconcile_approle_name not in openbao_secrets_domain_approle_names
          - openbao_reconcile_approle_name not in openbao_host_secret_zero_approle_names
          - openbao_reconcile_approle_name not in openbao_rotate_doppler_sync_domains
          - openbao_reconcile_approle_name not in openbao_approle_rotation_lookup_proof_names
          - openbao_reconcile_approle_name not in openbao_approle_secret_id_ttl_overrides
          - (_reconcile.token_ttl | community.general.to_seconds | int) == 28800
          - (_reconcile.token_max_ttl | community.general.to_seconds | int) == 28800
        fail_msg: >-
          Reconcile must use per-call one-use secret_ids and retain its 8-hour token window.
        quiet: true

    - name: Render the parameterized issuer policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/approle-issuer-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/approle-issuer-policy.hcl"
        mode: "0644"

    - name: Read the rendered policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/approle-issuer-policy.hcl"
      register: _issuer_policy_raw

    - name: Assert the issuer has generic grants only for per-call AppRoles
      vars:
        _issuer_excluded: >-
          {{ openbao_reconcile_excluded_policies
             | reject('equalto', openbao_reconcile_policy_name) | list }}
        _issuer_per_call_roles: >-
          {{ openbao_approles
             | selectattr('secret_id_issuance', 'defined')
             | selectattr('secret_id_issuance', 'equalto', 'per_call')
             | rejectattr('manage_secret_id', 'defined')
             | map(attribute='name')
             | reject('in', _issuer_excluded)
             | reject('equalto', openbao_approle_issuer_approle_name)
             | list }}
        _issuer_paths: >-
          {{ (_issuer_policy_raw.content | b64decode)
             | regex_findall('(?m)^path "([^"]+)"') }}
      ansible.builtin.assert:
        that:
          - openbao_reconcile_approle_name in _issuer_per_call_roles
          - openbao_flow_lock_approle_name in _issuer_per_call_roles
          - (openbao_observability_approle_name ~ '-workstation') in _issuer_per_call_roles
          - (openbao_local_cloud_approle_name ~ '-workstation') in _issuer_per_call_roles
          - (openbao_monitoring_approle_name ~ '-workstation') in _issuer_per_call_roles
          - (openbao_media_approle_name ~ '-workstation') in _issuer_per_call_roles
          - (openbao_apps_approle_name ~ '-workstation') in _issuer_per_call_roles
          - openbao_secrets_domain_approle_names | select('in', _issuer_per_call_roles) | list | length == 0
          - >-
            ('auth/approle/role/' ~ item ~ '/role-id') in _issuer_paths
          - >-
            ('auth/approle/role/' ~ item ~ '/secret-id') in _issuer_paths
          - >-
            ('auth/approle/role/' ~ item ~ '/secret-id-accessor/destroy') in _issuer_paths
        fail_msg: >-
          approle-issuer must grant role-id, secret-id, and accessor-destroy
          only for each explicitly per-call AppRole. Missing for {{ item }}.
        quiet: true
      loop: "{{ _issuer_per_call_roles }}"

    - name: Assert every per-call issuer target has one-use bounds
      vars:
        _issuer_per_call_roles: >-
          {{ openbao_approles
             | selectattr('secret_id_issuance', 'defined')
             | selectattr('secret_id_issuance', 'equalto', 'per_call')
             | list }}
      ansible.builtin.assert:
        that:
          - (item.secret_id_ttl | community.general.to_seconds | int) == 900
          - item.secret_id_num_uses | int == 1
        fail_msg: >-
          Per-call AppRole {{ item.name }} must issue 15-minute, one-use
          secret IDs.
        quiet: true
      loop: "{{ _issuer_per_call_roles }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the issuer cannot mint its own bootstrap secret_id
      vars:
        _issuer_paths: >-
          {{ (_issuer_policy_raw.content | b64decode)
             | regex_findall('(?m)^path "([^"]+)"') }}
      ansible.builtin.assert:
        that:
          - >-
            ('auth/approle/role/' ~ openbao_approle_issuer_approle_name ~ '/secret-id')
            not in _issuer_paths
        fail_msg: The issuer policy must exclude its own bootstrap secret_id.
        quiet: true

    # tasks/openbao_rotate_one_domain.yml's calls on a per-role name, for
    # every identity this policy rotates: one openbao_secrets domain
    # (observability) and the scheduled identity rotating itself.
    - name: Assert every role-scoped call this task makes is granted, per identity
      vars:
        _required_suffixes:
          - role-id
          - secret-id
          - secret-id/lookup
          - secret-id-accessor/destroy
        _missing: >-
          {{ _required_suffixes
             | map('regex_replace', '^(.*)$', 'auth/approle/role/' ~ item ~ '/\1')
             | reject('in', _rotate_policy_paths) | list }}
      ansible.builtin.assert:
        that:
          - _missing | length == 0
        fail_msg: >-
          {{ item }}: missing grant(s) {{ _missing }}. Every path
          tasks/openbao_rotate_one_domain.yml calls for a role name must be
          granted for that identity, or its rotation 403s partway through.
        quiet: true
      loop: >-
        {{ (openbao_secrets_domain_approle_names
            + [openbao_approle_secret_id_rotate_scheduled_approle_name]
            + openbao_host_secret_zero_approle_names) | unique }}

    # The read this policy deliberately does NOT grant: rotate reads each
    # domain's declared secret_id_ttl from
    # openbao_approle_secret_id_ttl_overrides (08a-admin-and-ttls.yml), never
    # a live `auth/approle/role/<name>` GET -- regranting that read here
    # would be the wider, non-minimal fix this repo chose not to make.
    - name: Assert the bare role-config path is never granted
      ansible.builtin.assert:
        that:
          - >-
            ('auth/approle/role/' ~ openbao_observability_approle_name)
            not in _rotate_policy_paths
        fail_msg: >-
          The rotate policy grants a bare auth/approle/role/<name> read.
          Rotation is meant to read the declared secret_id_ttl from
          openbao_approle_secret_id_ttl_overrides instead.
        quiet: true

    # tasks/openbao_rotate_one_domain.yml GETs the Doppler sync token from
    # this KV path once (openbao-rotate-approles.yml), then reuses it to
    # republish openbao_rotate_doppler_sync_domains' pairs -- the read grant must
    # exist or the whole run 403s at that GET before any domain rotates.
    - name: Assert the Doppler sync token KV path is granted read
      ansible.builtin.assert:
        that:
          - >-
            ('secret/data/' ~ openbao_rotate_doppler_token_kv_path)
            in _rotate_policy_paths
        fail_msg: >-
          The rotate policy does not grant read on
          secret/data/{{ openbao_rotate_doppler_token_kv_path }}. The Doppler
          sync GET in openbao-rotate-approles.yml will 403.
        quiet: true
