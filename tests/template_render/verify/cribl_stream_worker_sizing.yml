---
# RED->GREEN coverage for cribl_stream_worker_count (roles/cribl_stream/
# defaults/main.yml): renders cribl.yml.j2 through the real Templar at three
# RAM points and asserts the derived count, not just that the template
# renders. Before the formula existed this role always shipped Cribl's own
# default (count: -2, memory: 2048) regardless of the container's declared
# RAM — a 2048 MB guest and an 8192 MB guest got identical worker sizing.
- name: Render and verify cribl_stream worker-process sizing
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "{{ playbook_dir }}/../../../roles/cribl_stream/templates"
    cribl_stream_worker_heap_mb: 2048

  tasks:
    # 2048 MB, 2 vCPUs: floor((2048-512)/2048)=0 -> clamped up to the min of 1.
    - name: Render cribl.yml.j2 at 2048 MB / 2 vCPUs
      ansible.builtin.template:
        src: "{{ _template_dir }}/cribl.yml.j2"
        dest: "{{ _fixture_dir }}/test_cribl_worker_2048.yml"
        mode: "0644"
      vars:
        ansible_memtotal_mb: 2048
        ansible_processor_vcpus: 2
        cribl_stream_worker_count: >-
          {{ [
               [ ((ansible_memtotal_mb | int - 512) // cribl_stream_worker_heap_mb), 1 ] | max,
               (ansible_processor_vcpus | default(ansible_processor_count | default(1))) | int
             ] | min }}

    # 4096 MB, 2 vCPUs: floor((4096-512)/2048)=1, cores clamp doesn't bite.
    - name: Render cribl.yml.j2 at 4096 MB / 2 vCPUs
      ansible.builtin.template:
        src: "{{ _template_dir }}/cribl.yml.j2"
        dest: "{{ _fixture_dir }}/test_cribl_worker_4096.yml"
        mode: "0644"
      vars:
        ansible_memtotal_mb: 4096
        ansible_processor_vcpus: 2
        cribl_stream_worker_count: >-
          {{ [
               [ ((ansible_memtotal_mb | int - 512) // cribl_stream_worker_heap_mb), 1 ] | max,
               (ansible_processor_vcpus | default(ansible_processor_count | default(1))) | int
             ] | min }}

    # 8192 MB, 2 vCPUs: floor((8192-512)/2048)=3, but only 2 vCPUs exist, so
    # the cores clamp bites and wins over the RAM-only figure.
    - name: Render cribl.yml.j2 at 8192 MB / 2 vCPUs
      ansible.builtin.template:
        src: "{{ _template_dir }}/cribl.yml.j2"
        dest: "{{ _fixture_dir }}/test_cribl_worker_8192.yml"
        mode: "0644"
      vars:
        ansible_memtotal_mb: 8192
        ansible_processor_vcpus: 2
        cribl_stream_worker_count: >-
          {{ [
               [ ((ansible_memtotal_mb | int - 512) // cribl_stream_worker_heap_mb), 1 ] | max,
               (ansible_processor_vcpus | default(ansible_processor_count | default(1))) | int
             ] | min }}

    - name: Read rendered worker-sizing fixtures
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: _cribl_worker_rendered
      loop:
        - "{{ _fixture_dir }}/test_cribl_worker_2048.yml"
        - "{{ _fixture_dir }}/test_cribl_worker_4096.yml"
        - "{{ _fixture_dir }}/test_cribl_worker_8192.yml"

    - name: Decode rendered worker-sizing fixtures
      ansible.builtin.set_fact:
        _cribl_worker_2048: "{{ _cribl_worker_rendered.results[0].content | b64decode }}"
        _cribl_worker_4096: "{{ _cribl_worker_rendered.results[1].content | b64decode }}"
        _cribl_worker_8192: "{{ _cribl_worker_rendered.results[2].content | b64decode }}"

    - name: Assert worker count scales with RAM and clamps to vCPU count
      ansible.builtin.assert:
        that:
          - "'count: 1' in _cribl_worker_2048"
          - "'memory: 2048' in _cribl_worker_2048"
          - "'count: 1' in _cribl_worker_4096"
          - "'count: 2' in _cribl_worker_8192"
        fail_msg: >-
          cribl.yml.j2 must render workers.count = 1 at 2048 MB (RAM-starved,
          clamped up to the minimum of 1), workers.count = 1 at 4096 MB
          (floor((4096-512)/2048) = 1), and workers.count = 2 at 8192 MB
          (floor((8192-512)/2048) = 3, clamped down to the 2-vCPU ceiling) —
          a fixed worker count regardless of declared RAM is exactly the
          regression this formula exists to remove.

    - name: Cribl Stream worker-sizing assertions PASSED
      ansible.builtin.debug:
        msg: "cribl_stream_worker_count scales with RAM and clamps to vCPU count"
