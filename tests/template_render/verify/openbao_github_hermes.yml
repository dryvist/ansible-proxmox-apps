---
# The github-hermes mount: five sets, two policies, and the converge checks
# (roles/openbao/tasks/init/05b-github-app-set-checks.yml) run against fixture
# GitHub API responses.
- name: Render and verify the github-hermes mount, sets and policies
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    # OpenBao and Authelia role files ship in the pinned
    # dryvist.secrets_management collection; read them from its installed roles
    # directory, never from this repo's roles/.
    secrets_roles_dir: >-
      {{ lookup('ansible.builtin.first_found',
                files=['ansible_collections/dryvist/secrets_management/roles'],
                paths=lookup('ansible.builtin.config', 'COLLECTIONS_PATHS')) }}
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "{{ secrets_roles_dir }}/openbao/templates"
    _checks: "{{ secrets_roles_dir }}/openbao/tasks/init/05b-github-app-set-checks.yml"
    ansible_managed: "test fixture"
    _review: {pull_requests: write, issues: write, contents: read, checks: read, metadata: read}
    _read: "{{ openbao_github_read_permissions }}"
    _author: {contents: write, pull_requests: write, metadata: read}
    _public_fixture:
      - {name: pub-a}
      - {name: pub-b}
    _private_fixture:
      total_count: 4
      repositories:
        - {name: example-docs, full_name: example-org/example-docs, private: true, owner: {login: example-org}}
        - {name: priv-a, full_name: example-org/priv-a, private: true, owner: {login: example-org}}
        - {name: pub-a, full_name: dryvist/pub-a, private: false, owner: {login: dryvist}}
        - {name: other-priv, full_name: elsewhere/other-priv, private: true, owner: {login: elsewhere}}
    _private_widened_fixture:
      total_count: 5
      repositories:
        - {name: example-docs, full_name: example-org/example-docs, private: true, owner: {login: example-org}}
        - {name: extra, full_name: example-org/extra, private: true, owner: {login: example-org}}
        - {name: priv-a, full_name: example-org/priv-a, private: true, owner: {login: example-org}}
        - {name: pub-a, full_name: dryvist/pub-a, private: false, owner: {login: dryvist}}
        - {name: other-priv, full_name: elsewhere/other-priv, private: true, owner: {login: elsewhere}}

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: "{{ secrets_roles_dir }}/openbao/defaults/main"

    - name: Confirm the documentation source default reads the environment
      ansible.builtin.assert:
        that:
          - >-
            openbao_github_oidc_docs_repository
            == (lookup('env', 'OPENBAO_GITHUB_DOCS_SOURCE_REPO') | default('', true))
        quiet: true

    - name: Pin the unconfigured case
      ansible.builtin.set_fact:
        openbao_github_hermes_installation_id: ""
        # Fixture workspace names: a real converge reads these from the runtime
        # environment, and the declared policy list renders them.
        openbao_terrakube_network_workspace: example-network
        openbao_terrakube_aws_workspace: example-aws

    - name: Assert no installation ID yields no sets and no mount
      ansible.builtin.assert:
        that:
          - openbao_github_hermes_permission_sets == []
          - openbao_github_hermes_mount not in (openbao_github_app_mounts | map(attribute='mount'))

    - name: Assert no installation ID declares neither Hermes policy (an empty render must never reach a write)
      ansible.builtin.assert:
        that:
          - openbao_github_hermes_public_policy_name not in (openbao_policies | map(attribute='name') | list)
          - openbao_github_hermes_private_policy_name not in (openbao_policies | map(attribute='name') | list)

    - name: Pin the configured case
      ansible.builtin.set_fact:
        openbao_github_hermes_installation_id: "1"
        openbao_github_hermes_author_public_repos: [pub-a]
        openbao_github_oidc_docs_repository: example-org/example-docs
        openbao_aws_hermes_webhook_consumer_role_arn: fixture-arn

    - name: Assert a configured installation declares both Hermes policies
      ansible.builtin.assert:
        that:
          - openbao_github_hermes_public_policy_name in (openbao_policies | map(attribute='name') | list)
          - openbao_github_hermes_private_policy_name in (openbao_policies | map(attribute='name') | list)

    - name: Prepare fixture permission sets
      ansible.builtin.set_fact:
        _fixture_permission_sets: >-
          {{ (openbao_github_hermes_permission_sets
              | rejectattr('name', 'equalto', 'hermes-review-private') | list)
             + [(openbao_github_hermes_permission_sets
                 | selectattr('name', 'equalto', 'hermes-review-private') | first
                 | combine({'private_repos_of': 'example-org'}))] }}

    - name: Assert the five sets carry exactly their maps and scopes
      ansible.builtin.assert:
        that:
          - openbao_github_hermes_mount in (openbao_github_app_mounts | map(attribute='mount'))
          - >-
            (openbao_github_hermes_permission_sets | items2dict(key_name='name', value_name='permissions'))
            == {'hermes-review-public': _review, 'hermes-review-private': _review,
                'hermes-read-public': _read,
                'hermes-author-public': _author, 'hermes-author-private': _author}
          - (openbao_github_hermes_permission_sets | selectattr('public_repos_of', 'defined')
             | map(attribute='name') | list) == ['hermes-review-public', 'hermes-read-public']
          - (openbao_github_hermes_permission_sets | selectattr('private_repos_of', 'defined')
             | map(attribute='name') | list) == ['hermes-review-private']
          - >-
            (openbao_github_hermes_permission_sets
             | selectattr('name', 'equalto', 'hermes-read-public') | first).tier == 'hermes-private'
          - >-
            (openbao_github_hermes_permission_sets
             | selectattr('name', 'equalto', 'hermes-read-public') | first).installation_id
            == openbao_github_hermes_installation_id
          - >-
            (openbao_github_hermes_permission_sets
             | selectattr('name', 'equalto', 'hermes-read-public') | first).public_repos_of == 'dryvist'
          - openbao_github_hermes_author_private_repos_full_names == [openbao_github_oidc_docs_repository]
          - >-
            openbao_github_hermes_author_private_repos
            == [openbao_github_oidc_docs_repository | regex_replace('^[^/]+/', '')]

    - name: Render the policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.j2"
        dest: "{{ _fixture_dir }}/hermes-{{ item }}"
        mode: "0644"
      loop: &policies
        - hermes-public-policy.hcl
        - hermes-private-policy.hcl
        - github-mint-policy.hcl
        - github-read-policy.hcl
        - github-write-policy.hcl
        - open-llm-policy.hcl
        - github-docs-publisher-policy.hcl
        - ai-public-policy.hcl
        - ai-orchestrator-policy.hcl
        - hermes-policy.hcl

    - name: Read the rendered policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/hermes-{{ item }}"
      register: _raw
      loop: *policies

    - name: Assert each hermes policy mints its own visibility only, and no other policy reaches the mount
      vars:
        _paths: >-
          {{ _raw.results | map(attribute='content') | map('b64decode')
             | map('regex_findall', '(?m)^path "([^"]+)"') | list }}
        _m: "{{ openbao_github_hermes_mount }}"
      ansible.builtin.assert:
        that:
          - _paths[0] == [_m ~ '/token/hermes-review-public', _m ~ '/token/hermes-author-public']
          - >-
            _paths[1] == [_m ~ '/token/hermes-review-private', _m ~ '/token/hermes-read-public',
                          _m ~ '/token/hermes-author-private',
                          openbao_kv_mount ~ '/data/' ~ openbao_hermes_webhook_kv_path,
                          openbao_aws_mount ~ '/sts/' ~ openbao_aws_hermes_webhook_consumer_role_name]
          - _m ~ '/token' not in (_paths[0] + _paths[1])
          - (_paths[0] + _paths[2:] | flatten) | select('search', 'hermes-webhook') | list == []
          - _paths[2:] | flatten | select('match', '^' ~ _m ~ '/') | list == []

    - name: Run the converge checks against fixture responses
      ansible.builtin.include_tasks: "{{ _checks }}"
      vars:
        gm:
          mount: "{{ openbao_github_hermes_mount }}"
          permission_sets: "{{ _fixture_permission_sets }}"
        openbao_github_app_mount_public_repos:
          results:
            - {item: {name: hermes-review-public}, json: "{{ _public_fixture }}"}
            - {item: {name: hermes-read-public}, json: "{{ _public_fixture }}"}
        openbao_github_app_mount_private_repos:
          results: [{item: {item: {name: hermes-review-private}}, json: "{{ _private_fixture }}"}]

    - name: Assert the resolved repository lists follow visibility
      ansible.builtin.assert:
        that:
          - >-
            (openbao_github_app_mount_sets | items2dict(key_name='name', value_name='repositories'))
            == {'hermes-review-public': ['pub-a', 'pub-b'],
                'hermes-review-private': ['example-docs', 'priv-a'],
                'hermes-read-public': ['pub-a', 'pub-b'],
                'hermes-author-public': ['pub-a'],
                'hermes-author-private': ['example-docs']}

    - name: Verify an empty source value emits no private author permission set
      block:
        - name: Empty the configured source for the fail-closed case
          ansible.builtin.set_fact:
            openbao_github_oidc_docs_repository: ""
        - name: Assert the empty source leaves no private author scope
          ansible.builtin.assert:
            that:
              - openbao_github_hermes_author_private_repos_full_names == []
              - openbao_github_hermes_author_private_repos == []
              - >-
                openbao_github_hermes_permission_sets
                | selectattr('name', 'equalto', 'hermes-author-private') | list == []
            quiet: true
      always:
        - name: Restore the test value
          ansible.builtin.set_fact:
            openbao_github_oidc_docs_repository: example-org/example-docs

    - name: "Refuse a private repository on the public allowlist"
      vars:
        _bad_sets: >-
          {{ (openbao_github_hermes_permission_sets | selectattr('name', 'equalto', 'hermes-review-public') | list)
             + (openbao_github_hermes_permission_sets | selectattr('name', 'equalto', 'hermes-author-public')
                | map('combine', {'repositories': ['priv-a']}) | list) }}
      block:
        - name: Reset the resolved set list
          ansible.builtin.set_fact:
            openbao_github_app_mount_sets: []
            _refused: false
        - name: "Run the converge checks with a private repository on the public allowlist"
          ansible.builtin.include_tasks: "{{ _checks }}"
          vars:
            gm:
              mount: "{{ openbao_github_hermes_mount }}"
              permission_sets: "{{ _bad_sets }}"
            openbao_github_app_mount_public_repos:
              results:
                - {item: {name: hermes-review-public}, json: "{{ _public_fixture }}"}
                - {item: {name: hermes-read-public}, json: "{{ _public_fixture }}"}
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            _refused: true
      always:
        - name: "Assert the converge checks refused a private repository on the public allowlist"
          ansible.builtin.assert:
            that: _refused | bool

    - name: "Refuse an administration grant"
      vars:
        _bad_sets: >-
          {{ openbao_github_hermes_permission_sets | selectattr('name', 'equalto', 'hermes-review-public')
             | map('combine', {'permissions': _review | combine({'administration': 'read'})}) | list }}
      block:
        - name: Reset the resolved set list
          ansible.builtin.set_fact:
            openbao_github_app_mount_sets: []
            _refused: false
        - name: "Run the converge checks with an administration grant"
          ansible.builtin.include_tasks: "{{ _checks }}"
          vars:
            gm:
              mount: "{{ openbao_github_hermes_mount }}"
              permission_sets: "{{ _bad_sets }}"
            openbao_github_app_mount_public_repos:
              results:
                - {item: {name: hermes-review-public}, json: "{{ _public_fixture }}"}
                - {item: {name: hermes-read-public}, json: "{{ _public_fixture }}"}
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            _refused: true
      always:
        - name: "Assert the converge checks refused an administration grant"
          ansible.builtin.assert:
            that: _refused | bool

    - name: Refuse a widened private author allowlist
      block:
        - name: Widen the private author list for the mutation case
          ansible.builtin.set_fact:
            openbao_github_hermes_author_private_repos: [example-docs, extra]
            _fixture_permission_sets: >-
              {{ (openbao_github_hermes_permission_sets
                  | rejectattr('name', 'equalto', 'hermes-review-private') | list)
                 + [(openbao_github_hermes_permission_sets
                     | selectattr('name', 'equalto', 'hermes-review-private') | first
                     | combine({'private_repos_of': 'example-org'}))] }}
            openbao_github_app_mount_sets: []
            _refused: false
        - name: Run the converge checks with the widened private allowlist
          ansible.builtin.include_tasks: "{{ _checks }}"
          vars:
            gm:
              mount: "{{ openbao_github_hermes_mount }}"
              permission_sets: "{{ _fixture_permission_sets }}"
            openbao_github_app_mount_public_repos:
              results:
                - {item: {name: hermes-review-public}, json: "{{ _public_fixture }}"}
                - {item: {name: hermes-read-public}, json: "{{ _public_fixture }}"}
            openbao_github_app_mount_private_repos:
              results: [{item: {item: {name: hermes-review-private}}, json: "{{ _private_widened_fixture }}"}]
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            _refused: true
      always:
        - name: Restore the declared private allowlist
          ansible.builtin.set_fact:
            openbao_github_hermes_author_private_repos: [example-docs]
        - name: Assert the converge checks refused the widened private allowlist
          ansible.builtin.assert:
            that: _refused | bool
