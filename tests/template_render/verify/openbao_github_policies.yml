---
# The GitHub token tiers are a privilege boundary expressed entirely in Jinja
# loops over one shared list, so a set added for one identity silently reaches
# every other policy whose loop does not exclude it. `github-mint` is the
# dangerous one: it is attached to every apply-tier estate actor and selects by
# REJECTING the admin tier, so any new tier is included by default. A write
# grant landing there would hand repository write to identities that are only
# ever meant to read, and nothing about the diff that added it would say so.
#
# Rendering is the only place this is observable: the declarations look correct
# in isolation, and no converge assertion compares one policy against another.
- name: Render and verify the GitHub tier policies
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/openbao/templates"
    ansible_managed: "test fixture"
    _publisher_path: >-
      {{ openbao_github_mount }}/token/{{ openbao_github_docs_publisher_set_name }}
    _publisher_kv_paths:
      - "{{ openbao_kv_mount }}/data/apps/{{ openbao_github_docs_publisher_kv_app }}"
      - "{{ openbao_kv_mount }}/metadata/apps/{{ openbao_github_docs_publisher_kv_app }}"
    _repo_create_path: >-
      {{ openbao_github_mount }}/token/dryvist-repo-create
    _org_admin_path: >-
      {{ openbao_github_mount }}/token/dryvist-org-admin

  tasks:
    # The real defaults, not a mirrored subset: the composition of
    # openbao_github_permission_sets from its base list plus the conditional
    # publish tier IS what is under test, so a hand-written fixture would test
    # the fixture. `dir` resolves relative to this file.
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Assert general write installation scope defaults off
      ansible.builtin.assert:
        that:
          - openbao_github_write_installation_scope is sameas false
        fail_msg: The general write policy must retain its per-repository allowlist by default.

    - name: Save the configured general write allowlist
      ansible.builtin.set_fact:
        _github_write_original_repos: "{{ openbao_github_write_repo_allowlist }}"

    - name: Pin the general write allowlist to a fixture repository
      ansible.builtin.set_fact:
        openbao_github_write_repo_allowlist: [fixture-repo]

    - name: Render the general write policy with its default scope
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-write-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/github-write-default.hcl"
        mode: "0644"

    - name: Read the general write policy rendered with its default scope
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/github-write-default.hcl"
      register: _github_write_default_raw

    - name: Assert the default general write policy renders its repository allowlist
      ansible.builtin.assert:
        that:
          - >-
            (_github_write_default_raw.content | b64decode)
            is search('(?s)"repositories" = \[\s*"fixture-repo"\s*\]')
        fail_msg: The default general write policy must render the configured repository allowlist.

    - name: Enable installation scope for the contract render
      ansible.builtin.set_fact:
        openbao_github_write_installation_scope: true

    - name: Render the general write policy with installation scope enabled
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-write-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/github-write-installation.hcl"
        mode: "0644"

    - name: Read the general write policy rendered with installation scope
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/github-write-installation.hcl"
      register: _github_write_installation_raw

    - name: Assert installation scope renders the installation selector
      ansible.builtin.assert:
        that:
          - >-
            '"repositories" = []' in
            (_github_write_installation_raw.content | b64decode)
          - >-
            'fixture-repo' not in
            (_github_write_installation_raw.content | b64decode)
        fail_msg: Installation scope must leave repository selection to the GitHub installation.

    - name: Restore the configured general write policy defaults
      ansible.builtin.set_fact:
        openbao_github_write_installation_scope: false
        openbao_github_write_repo_allowlist: "{{ _github_write_original_repos }}"

    # set_fact, not task vars: include_vars sits ABOVE task vars in Ansible's
    # precedence order, so a task-level override of a value it loaded is
    # ignored. Pinning both cases here also keeps the result independent of
    # whether the caller happens to have the publisher variable in its own
    # environment.
    - name: Pin the publisher repository list to the unconfigured case
      ansible.builtin.set_fact:
        openbao_github_docs_publisher_repos: []

    - name: Render the publisher policy with no repository configured
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-docs-publisher-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/unset-github-docs-publisher-policy.hcl"
        mode: "0644"

    - name: Read the policy rendered without a publisher repository
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/unset-github-docs-publisher-policy.hcl"
      register: _publisher_unset_raw

    # An omitted `repositories` on a permission set means every repository of
    # the installation. A publisher with no configured repository must
    # therefore grant nothing at all, rather than a write grant with no bound.
    - name: Assert an unconfigured publisher grants no path
      ansible.builtin.assert:
        that:
          - >-
            (_publisher_unset_raw.content | b64decode)
            | regex_findall('(?m)^path "([^"]+)"') | length == 0
        fail_msg: >-
          The docs-publisher policy grants a path with no publisher repository
          configured. An unbounded set would carry write over the whole
          installation.

    - name: Pin the publisher repository list and agents installation to the configured case
      ansible.builtin.set_fact:
        openbao_github_docs_publisher_repos: [fixture-repo]
        openbao_github_agents_installation_id: "4242"

    - name: Render the tier policies with a publisher repository configured
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.j2"
        dest: "{{ _fixture_dir }}/set-{{ item }}"
        mode: "0644"
      loop: &tier_policies
        - github-docs-publisher-policy.hcl
        - github-mint-policy.hcl
        - github-read-policy.hcl
        - github-repo-create-policy.hcl
        - github-org-admin-policy.hcl
        - github-write-policy.hcl
        - open-llm-policy.hcl
        - ai-public-policy.hcl

    - name: Read the policies rendered with a publisher repository
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/set-{{ item }}"
      register: _tier_raw
      loop: *tier_policies

    - name: Reduce each rendered policy to its path lines
      ansible.builtin.set_fact:
        _publisher_paths: "{{ _paths[0] }}"
        _mint_paths: "{{ _paths[1] }}"
        _read_paths: "{{ _paths[2] }}"
        _repo_create_paths: "{{ _paths[3] }}"
        _org_admin_paths: "{{ _paths[4] }}"
        _write_paths: "{{ _paths[5] }}"
        _open_llm_paths: "{{ _paths[6] }}"
        _open_llm_text: "{{ _tier_raw.results[6].content | b64decode }}"
        _ai_public_paths: "{{ _paths[7] }}"
      vars:
        _paths: >-
          {{ _tier_raw.results | map(attribute='content') | map('b64decode')
             | map('regex_findall', '(?m)^path "([^"]+)"') | list }}

    - name: Assert the publisher policy grants exactly its own set
      ansible.builtin.assert:
        that:
          - _publisher_paths == [_publisher_path] + _publisher_kv_paths
        fail_msg: >-
          The docs-publisher policy grants {{ _publisher_paths }}. It must
          grant exactly its own permission set and one app bucket:
          no raw token endpoint, no read or admin set, no lock subtree.

    - name: Assert no other tier inherits the publisher's grant
      ansible.builtin.assert:
        that:
          - _publisher_path not in _mint_paths
          - _publisher_path not in _read_paths
        fail_msg: >-
          A tier other than docs-publisher grants the publisher's set.
          github-mint selects by rejecting tiers, so a new write-bearing tier
          is included there unless it is rejected explicitly.

    - name: Assert the repo-create policy grants exactly its own set
      ansible.builtin.assert:
        that:
          - _repo_create_paths == [_repo_create_path]
        fail_msg: >-
          The github-repo-create policy grants {{ _repo_create_paths }}. It
          must grant exactly the dryvist-repo-create set: no raw token
          endpoint, no read/publish/admin set.

    - name: Assert no other tier inherits the repo-create grant
      ansible.builtin.assert:
        that:
          - _repo_create_path not in _mint_paths
          - _repo_create_path not in _read_paths
        fail_msg: >-
          A tier other than github-repo-create grants administration:write.
          github-mint selects by rejecting tiers, so a new tier is included
          there by default unless it is rejected explicitly — this is the one
          tier where that omission is worst, since administration:write is
          the one permission GitHub requires to create or delete a repository.

    - name: Assert the org-admin policy grants exactly its own set, and no other tier does
      ansible.builtin.assert:
        that:
          - _org_admin_paths == [_org_admin_path]
          - _org_admin_path not in _mint_paths
          - _org_admin_path not in _read_paths
          - _org_admin_path not in _repo_create_paths
        fail_msg: >-
          github-org-admin grants {{ _org_admin_paths }}, or another tier
          grants organization_administration:write. It must be exactly the
          dryvist-org-admin set and appear nowhere else.

    - name: Assert everyday writes use the everyday mount and never the admin mount
      ansible.builtin.assert:
        that:
          - (openbao_github_everyday_mount ~ '/token') in _write_paths
          - _write_paths | select('match', '^' ~ openbao_github_mount ~ '/') | list == []
          - _mint_paths | select('match', '^' ~ openbao_github_mount ~ '/token/read-') | list == []
          - _read_paths | select('match', '^' ~ openbao_github_mount ~ '/') | list == []
        fail_msg: >-
          An everyday read or write policy reaches the admin mount
          ({{ openbao_github_mount }}). Everyday tokens must come only from
          {{ openbao_github_everyday_mount }}.

    - name: Assert open-llm holds exactly its bucket read and the pinned agents mint
      vars:
        _token_stanza: >-
          {{ _open_llm_text | regex_search('(?ms)path "' ~ openbao_github_agents_mount ~ '/token" [{].*?^[}]') }}
      ansible.builtin.assert:
        that:
          - >-
            _open_llm_paths == [openbao_kv_mount ~ '/data/apps/open-llm',
                                openbao_kv_mount ~ '/metadata/apps/open-llm',
                                openbao_github_agents_mount ~ '/token']
          - >-
            'required_parameters = ["installation_id", "repositories"]' in _token_stanza
          - >-
            '"installation_id" = ["4242"]' in _token_stanza
          - _token_stanza | regex_findall('(?m)^ +"([a-z_]+)" =') == ['installation_id', 'repositories', 'permissions']
          - _token_stanza is not search('org_name|repository_ids')
          - >-
            _open_llm_paths | select('match', '^(github|github-admin|' ~ openbao_github_hermes_mount ~ ')/')
            | list == []
          - >-
            _open_llm_text | regex_findall('capabilities = (.*)')
            | select('search', 'list|delete|sudo') | list == []
        fail_msg: >-
          open-llm grants {{ _open_llm_paths }}. It must read exactly
          secret/apps/open-llm and mint only from
          {{ openbao_github_agents_mount }}/token, pinned to one installation,
          with org_name and repository_ids refused.

    - name: Assert no other tier reaches the agents mount
      ansible.builtin.assert:
        that:
          - >-
            (_publisher_paths + _mint_paths + _read_paths + _repo_create_paths
             + _org_admin_paths + _write_paths + _ai_public_paths)
            | select('match', '^' ~ openbao_github_agents_mount ~ '/') | list == []
          - _ai_public_paths | select('match', '^github') | list == []
        fail_msg: Only open-llm may mint from {{ openbao_github_agents_mount }}.

    - name: Pin the agents installation to the unconfigured case
      ansible.builtin.set_fact:
        openbao_github_agents_installation_id: ""

    - name: Render the open-llm policy with no agents installation configured
      ansible.builtin.template:
        src: "{{ _template_dir }}/open-llm-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/unset-open-llm-policy.hcl"
        mode: "0644"

    - name: Read the open-llm policy rendered without an installation
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/unset-open-llm-policy.hcl"
      register: _open_llm_unset_raw

    - name: Assert an unconfigured installation leaves open-llm only its bucket read
      ansible.builtin.assert:
        that:
          - >-
            (_open_llm_unset_raw.content | b64decode) | regex_findall('(?m)^path "([^"]+)"')
            == [openbao_kv_mount ~ '/data/apps/open-llm', openbao_kv_mount ~ '/metadata/apps/open-llm']
        fail_msg: With no installation ID the open-llm policy must render no mint grant.

    # The agents mount is declared with no sets, so the converge's set checks
    # must resolve to nothing; its undeclared-set cleanup then removes any
    # stored set.
    - name: Run the set checks for the agents mount
      ansible.builtin.include_tasks: ../../../roles/openbao/tasks/init/05b-github-app-set-checks.yml
      vars:
        gm: "{{ openbao_github_app_mounts | selectattr('mount', 'equalto', openbao_github_agents_mount) | first }}"
        openbao_github_app_mount_public_repos: {results: []}
        openbao_github_app_mount_private_repos: {results: []}

    - name: Assert the agents mount declares and resolves no permission set
      ansible.builtin.assert:
        that:
          - >-
            (openbao_github_app_mounts | selectattr('mount', 'equalto', openbao_github_agents_mount)
             | first).permission_sets == []
          - openbao_github_app_mount_sets == []
        fail_msg: The agents mount must carry no permission set; its App installation is the scope.

    - name: Assert no set on the per-App mounts carries administration
      ansible.builtin.assert:
        that:
          - item.permissions is mapping
          - "'administration' not in item.permissions"
          - "'organization_administration' not in item.permissions"
        fail_msg: "{{ item.mount }}/permissionset/{{ item.name }} carries administration."
        quiet: true
      loop: >-
        {{ openbao_github_permission_sets
           | rejectattr('mount', 'equalto', openbao_github_mount) | list }}
      loop_control:
        label: "{{ item.mount }}/{{ item.name }}"
