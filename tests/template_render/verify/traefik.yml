---
# =============================================================================
# traefik — static config, dynamic routers, and the ACME EnvironmentFile
# =============================================================================
# Render-only: proves the Route53 DNS-01 resolver, the wildcard cert request on
# each router, the inventory-derived backends, and that the creds land in the
# EnvironmentFile (not the dynamic config). No live ACME / Traefik in CI.
- name: Render and verify traefik templates
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Mirror roles/traefik/defaults/main.yml (scrubbed domain + test creds).
    traefik_base_domain: "pve.example.com"
    # ACME email is optional; empty here to prove it is OMITTED from the rendered
    # config (no email literal ever lives in a committed file).
    traefik_acme_email: ""
    traefik_acme_ca_server: "https://acme-v02.api.letsencrypt.org/directory"
    traefik_acme_storage: /etc/traefik/acme/acme.json
    traefik_dynamic_dir: /etc/traefik/dynamic
    traefik_acme_dns_resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
    # Split-horizon: the pre-check resolves the challenge name against internal
    # DNS, which is authoritative for the subdomain and answers NXDOMAIN. Skip
    # the client-side check; the CA still validates against the real authority.
    traefik_acme_disable_propagation_check: true
    traefik_acme_delay_before_checks: "60s"
    traefik_dashboard_enabled: true
    # basicAuth reads a usersFile the role generates on the host at build time;
    # only the path is in the config — never a credential.
    traefik_dashboard_users_file: /etc/traefik/dashboard.htpasswd
    # Authelia fronts the public dashboard; basicAuth survives as break-glass on
    # its own private entryPoint, because a middleware chain is AND, not OR.
    traefik_dashboard_sso: true
    traefik_dashboard_breakglass_enabled: true
    traefik_dashboard_breakglass_port: 8083
    traefik_dashboard_breakglass_entrypoint: dashboardbg
    # Observability. The OTLP base URL is derived from the `otel` ingress row by
    # the same expression the role defaults use, so the fixture exercises the
    # derivation rather than hardcoding an endpoint past it.
    traefik_metrics_enabled: true
    traefik_metrics_port: 8082
    traefik_metrics_entrypoint: metrics
    traefik_metrics_add_routers_labels: true
    traefik_tracing_enabled: true
    traefik_tracing_service_name: traefik
    traefik_tracing_sample_rate: 1.0
    traefik_tracing_otlp_base_url: >-
      {{ (traefik_routes | selectattr('name', 'equalto', 'otel') | list | first
          | default({}, true)).servers | default([], true) | first | default('', true) }}
    traefik_tls_min_version: VersionTLS12
    traefik_openbao_oauth_callback_enabled: true
    traefik_openbao_oauth_callback_path: /oauth/slack/callback
    traefik_openbao_oauth_callback_priority: 10000
    # Test creds (placeholders) for the EnvironmentFile.
    traefik_acme_aws_access_key_id: "AKIATESTACCESSKEYID00"
    traefik_acme_aws_secret_access_key: "testsecretplaceholderplaceholderplaceholde"
    traefik_acme_aws_region: "us-east-1"
    traefik_acme_route53_zone_id: "Z0123456789ABCDEFGHIJ"
    # The tofu-owned ingress table (tofu_data.ingress) the builder consumes:
    # single-backend {name, ip, port} rows plus the Proxmox apex {name, apex,
    # backends[], port} pool. Scrubbed/documentation values only. The real
    # builder (mirrored in the first task below) turns these into traefik_routes.
    traefik_ingress_routes:
      - { name: plex, ip: "192.0.2.10", port: 32400 }
      # The OAuth return receiver uses this existing OpenBao ingress hostname;
      # it is a no-op Traefik router, not an OpenBao backend request.
      - { name: openbao, ip: "192.0.2.20", port: 8200, sticky: true, health_check: true }
      # HTTPS backend with a self-signed cert (e.g. Splunk Web) -> insecure_tls.
      # sso: true -> the router gets the authelia forwardAuth middleware.
      - { name: splunk, ip: "192.0.2.12", port: 8000, scheme: https, insecure_tls: true, sso: true }
      # The Authelia portal row itself (never sso-gated); its backend url is
      # what the forwardAuth middleware dials.
      - { name: authelia, ip: "192.0.2.14", port: 9091 }
      # The OTLP trace collector row. Present so the tracing endpoint is derived
      # from the ingress table rather than written twice.
      - { name: otel, ip: "192.0.2.30", port: 4318 }
      # Shared host: root dashboard plus an unauthenticated webhook path.
      - { name: hermes-dashboard, hostname: hermes, ip: "192.0.2.15", port: 8080,
          sso: true }
      - { name: hermes, hostname: hermes, path_prefix: /webhooks/, priority: 100,
          ip: "192.0.2.15", port: 8644, sso: false }
      # Proxmox cluster-UI apex: load-balanced pool over the node FQDNs, sticky
      # + health-checked, https to self-signed node backends.
      - name: proxmox
        apex: true
        backends: ["proxmox1.example.com", "proxmox2.example.com", "proxmox3.example.com"]
        port: 8006
        scheme: https
        insecure_tls: true
        sticky: true
        health_check: true
      # MCP-fabric pool: the health check probes a DIFFERENT port than the
      # traffic port (agentgateway stats /metrics) via health_check_port.
      - name: mcp
        backends: ["agentgateway-10.example.com", "agentgateway-30.example.com"]
        port: 8080
        health_check: true
        health_check_path: /metrics
        health_check_port: 15020
    _template_dir: "../../../roles/traefik/templates"

  tasks:
    - name: Build and assert the traefik_routes ingress-table transform
      ansible.builtin.include_tasks: traefik/route_builder.yml

    - name: Render and assert the traefik static config
      ansible.builtin.include_tasks: traefik/static_config.yml

    - name: Render and assert the traefik dynamic config
      ansible.builtin.include_tasks: traefik/dynamic_config.yml

    - name: Render and assert the ACME EnvironmentFile
      ansible.builtin.include_tasks: traefik/acme_env.yml

    - name: Traefik template rendering PASSED
      ansible.builtin.debug:
        msg: |
          Traefik template assertions passed:
          - traefik.yml.j2: route53 DNS-01 resolver, secured API, TLS >= 1.2, no leaked creds
          - dynamic.yml.j2: per-service routers + backends, wildcard SAN, secured dashboard
          - acme.env.j2: AWS creds + AWS_HOSTED_ZONE_ID in the root-only EnvironmentFile
