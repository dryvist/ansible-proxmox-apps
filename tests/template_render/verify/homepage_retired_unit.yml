---
# Asserts the Homepage role stops and removes the retired source-build unit
# before it deploys the compose project.
- name: Verify the retired Homepage unit is stopped before compose deploys
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false

  tasks:
    - name: Load the Homepage role task names
      ansible.builtin.set_fact:
        _homepage_task_names: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../roles/homepage/tasks/main.yml')
             | from_yaml | map(attribute='name') | list }}

    - name: Assert the retired unit is stopped and removed before compose deploys
      ansible.builtin.assert:
        that:
          - "'Stop and disable the retired source-build homepage unit' in _homepage_task_names"
          - "'Remove the retired source-build homepage unit' in _homepage_task_names"
          - >-
            _homepage_task_names.index('Stop and disable the retired source-build homepage unit')
            < _homepage_task_names.index('Deploy homepage via docker compose')
          - >-
            _homepage_task_names.index('Remove the retired source-build homepage unit')
            < _homepage_task_names.index('Deploy homepage via docker compose')
        fail_msg: >-
          The Homepage role must stop and disable the retired source-build unit,
          and remove its file, before it deploys the compose project.
        success_msg: "Homepage retires the source-build unit before compose deploys."
