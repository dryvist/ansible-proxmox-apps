---
- name: Verify the cribl_stream Langfuse destination renders unconditionally
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - cribl_stream/telemetry_vars.yml

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/cribl_stream/templates"
    # Remaining vars are fixture scaffolding, not under test.
    cribl_stream_splunk_hec_url: "https://splunk.example.invalid/services/collector/event"
    cribl_stream_splunk_hec_token: "fixture-token"
    cribl_stream_splunk_hec_tls_verify: true
    cribl_stream_pq_enabled: true
    cribl_stream_hec_namespace: ""
    cribl_stream_per_index_indexes: []
    cribl_hec_input_port: 8088
    cribl_stream_netflow_port: 2055
    cribl_stream_otel_port: 4318
    cribl_stream_s2s_port: 9997
    cribl_stream_pve_metrics_port: 10370
    cribl_stream_s2s_metrics_port: 10360
    cribl_stream_prometheus_rw_port: 8428
    cribl_stream_prometheus_rw_api_path: /api/v1/write
    cribl_stream_victoriametrics_rw_url: "http://grafana.example.invalid:8428/api/v1/write"
    cribl_stream_victoriametrics_otlp_endpoint: "http://victoriametrics.example.invalid:8428/opentelemetry"
    cribl_stream_unpoller_scrape_target: "localhost:9130"
    cribl_stream_unpoller_poll_minutes: 1
    cribl_stream_ai_log_routing: {}
    cribl_stream_ai_input_types: {}

  tasks:
    - name: Render the cribl_stream outputs and inputs templates
      # Task vars override the populated shared fixture for this empty-key case.
      vars:
        cribl_stream_langfuse_public_key: ""
        cribl_stream_langfuse_secret_key: ""
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.yml.j2"
        dest: "{{ _fixture_dir }}/test_cribl_stream_{{ item }}.yml"
        mode: "0644"
      loop:
        - outputs
        - inputs

    - name: Read the rendered cribl_stream fixtures
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/test_cribl_stream_{{ item }}.yml"
      loop:
        - outputs
        - inputs
      register: _cribl_stream_raw

    - name: Decode the rendered cribl_stream fixtures
      ansible.builtin.set_fact:
        _cribl_stream_outputs: "{{ _cribl_stream_raw.results[0].content | b64decode }}"
        _cribl_stream_inputs: "{{ _cribl_stream_raw.results[1].content | b64decode }}"

    - name: Assert the Langfuse output and its input connection render with empty keys
      ansible.builtin.assert:
        that:
          - "'langfuse_otlp:' in _cribl_stream_outputs"
          - "'- output: langfuse_otlp' in _cribl_stream_inputs"
        fail_msg: >-
          The langfuse_otlp destination or its in_otel connection did not render
          with empty credentials — a credential-conditional gate has been
          reintroduced, which silently deletes the destination instead of
          failing the converge.

    - name: Cribl Stream Langfuse rendering verification PASSED
      ansible.builtin.debug:
        msg: >-
          langfuse_otlp renders in both outputs.yml and inputs.yml regardless of
          credential presence.
