---
# =============================================================================
# pgbackrest.conf async-archiving block
# =============================================================================
# The postgres molecule scenario never enables pgBackRest (it needs a live S3
# endpoint), so this template has no coverage there. It now renders on every
# postgres primary by default, and the async block is the part that keeps a
# repo outage from filling pg_wal and halting the primary — a typo in the key
# name or a missing spool-path degrades silently to synchronous archiving.
- name: Render and verify the pgBackRest async-archiving configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    # Mirror the role defaults (roles/postgres/defaults/main.yml). Dummy
    # endpoints and keys — nothing here contacts a repo.
    postgres_pgbackrest_stanza: fixture-host
    postgres_data_dir: /var/lib/postgresql/17/main
    postgres_port: 5432
    postgres_backup_s3_bucket: fixture-bucket
    postgres_backup_s3_endpoint: s3.fixture.invalid
    postgres_backup_s3_region: us-east-1
    postgres_backup_s3_uri_style: path
    postgres_backup_s3_access_key_id: fixture-key
    postgres_backup_s3_secret_access_key: fixture-secret
    postgres_pgbackrest_repo_path: /postgres/fixture-host
    postgres_pgbackrest_retention_full: 4
    postgres_pgbackrest_repo2_enabled: true
    postgres_pgbackrest_repo2_path: /postgres/fixture-host
    postgres_backup_repo2_s3_bucket: fixture-bucket
    postgres_backup_repo2_s3_endpoint: s3.us-west-004.fixture.invalid
    postgres_backup_repo2_s3_region: us-west-004
    postgres_backup_repo2_s3_uri_style: path
    postgres_backup_repo2_s3_access_key_id: fixture-key-2
    postgres_backup_repo2_s3_secret_access_key: fixture-secret-2
    postgres_pgbackrest_repo2_retention_full: 4
    postgres_pgbackrest_spool_path: /var/spool/pgbackrest
    postgres_pgbackrest_queue_max: 4GiB
    # Encryption defaults to off on both repos; the cipher case overrides repo2
    # locally so the negative assertions below stay meaningful.
    postgres_pgbackrest_repo1_cipher_type: none
    postgres_pgbackrest_repo1_cipher_pass: ""
    postgres_pgbackrest_repo2_cipher_type: none
    postgres_pgbackrest_repo2_cipher_pass: ""

  tasks:
    - name: Render pgbackrest.conf with async archiving enabled
      ansible.builtin.template:
        src: "../../../roles/postgres/templates/pgbackrest.conf.j2"
        dest: "{{ _fixture_dir }}/pgbackrest-async.conf"
        mode: "0600"
      vars:
        postgres_pgbackrest_archive_async: true

    - name: Render pgbackrest.conf with async archiving disabled
      ansible.builtin.template:
        src: "../../../roles/postgres/templates/pgbackrest.conf.j2"
        dest: "{{ _fixture_dir }}/pgbackrest-sync.conf"
        mode: "0600"
      vars:
        postgres_pgbackrest_archive_async: false

    - name: Read both rendered configurations
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/{{ item }}"
      loop:
        - pgbackrest-async.conf
        - pgbackrest-sync.conf
      register: _pgbackrest_rendered_raw

    - name: Decode both rendered configurations
      ansible.builtin.set_fact:
        _pgbackrest_async: "{{ _pgbackrest_rendered_raw.results[0].content | b64decode }}"
        _pgbackrest_sync: "{{ _pgbackrest_rendered_raw.results[1].content | b64decode }}"

    # spool-path without archive-async is inert, and archive-async without a
    # spool-path makes archive-push fail outright, so both must appear together
    # or not at all. archive-push-queue-max rides with them: it is the pg_wal
    # bound during a repo outage — without it, async still fills the disk.
    - name: Assert async archiving renders all three keys, and the negative case renders none
      ansible.builtin.assert:
        that:
          - "'archive-async=y' in _pgbackrest_async"
          - "'spool-path=/var/spool/pgbackrest' in _pgbackrest_async"
          - "'archive-push-queue-max=4GiB' in _pgbackrest_async"
          - "'archive-async' not in _pgbackrest_sync"
          - "'spool-path' not in _pgbackrest_sync"
          - "'archive-push-queue-max' not in _pgbackrest_sync"
          # Guards against the async block being emitted outside [global],
          # where pgBackRest would reject it.
          - _pgbackrest_async.index('archive-async') > _pgbackrest_async.index('[global]')
          - >-
            _pgbackrest_async.index('archive-async')
            < _pgbackrest_async.index('[' ~ postgres_pgbackrest_stanza ~ ']')
        fail_msg: >-
          pgbackrest.conf.j2 no longer emits archive-async, spool-path, and
          archive-push-queue-max together inside [global] when async archiving
          is enabled.

    # Repository encryption. The failure that matters is silence: a cipher that
    # is configured but renders nothing produces plaintext backups while the
    # inventory claims they are encrypted. So assert the negative case too —
    # the default must emit no cipher keys at all, and enabling one repo must
    # not leak keys into the other, because the two repos are encrypted at
    # different times (repo2 at creation, repo1 only via a destructive
    # stanza re-create).
    - name: Render pgbackrest.conf with repo2 encrypted and repo1 not
      ansible.builtin.template:
        src: "../../../roles/postgres/templates/pgbackrest.conf.j2"
        dest: "{{ _fixture_dir }}/pgbackrest-cipher.conf"
        mode: "0600"
      vars:
        postgres_pgbackrest_archive_async: false
        postgres_pgbackrest_repo2_cipher_type: aes-256-cbc
        postgres_pgbackrest_repo2_cipher_pass: fixture-passphrase

    - name: Read the encrypted-repo2 configuration
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/pgbackrest-cipher.conf"
      register: _pgbackrest_cipher_raw

    - name: Decode the encrypted-repo2 configuration
      ansible.builtin.set_fact:
        _pgbackrest_cipher: "{{ _pgbackrest_cipher_raw.content | b64decode }}"

    - name: Assert cipher keys render per-repo, and not at all by default
      ansible.builtin.assert:
        that:
          - "'repo2-cipher-type=aes-256-cbc' in _pgbackrest_cipher"
          - "'repo2-cipher-pass=fixture-passphrase' in _pgbackrest_cipher"
          # repo1 was left at the default, so it must stay plaintext.
          - "'repo1-cipher-type' not in _pgbackrest_cipher"
          - "'repo1-cipher-pass' not in _pgbackrest_cipher"
          # The default render (async fixture above) carries no cipher at all.
          - "'cipher-type' not in _pgbackrest_sync"
          - "'cipher-pass' not in _pgbackrest_sync"
        fail_msg: >-
          pgbackrest.conf.j2 no longer renders repo cipher keys per-repo. Either
          an enabled cipher emits nothing (plaintext backups while the inventory
          claims encryption), or one repo's cipher leaked into the other.

    - name: PgBackRest async-archiving render verification PASSED
      ansible.builtin.debug:
        msg: |
          pgbackrest.conf.j2 assertions passed:
          - archive-async=y, spool-path, archive-push-queue-max render together when enabled
          - none of them render when disabled
          - the async block lands inside [global], before the stanza section
