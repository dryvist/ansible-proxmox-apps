---
# Render the real Prometheus template and inventory vars to verify the PVE
# and guest exporter scrape jobs receive their inventory targets.
- name: Verify the PVE and guest exporter scrape jobs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    llm_large_serving_host: llm-large-under-test
    _pst_tpl: "{{ playbook_dir }}/../../../roles/prometheus_stack/templates/prometheus.yml.j2"
    _fixture_tofu_data:
      domain: test.example
      constants:
        service_ports:
          prometheus_web: 9090
          victoriametrics: 18428
          blackbox_exporter: 9115
          node_exporter: 9100
          llm_router_api: 4321
          llm_fast_api: 10434
          smokeping_prober: 9374
          gatus_web: 8080
          agentgateway_metrics: 15020
        memory_ports:
          hindsight_api: 8888
          hindsight_cp: 9999
        serving:
          host: llm-large-under-test
      nodes:
        node-alpha:
          commissioned: true
        node-beta: {}
        node-gamma:
          commissioned: false
      containers:
        grafana:
          hostname: metrics-store
        agentgateway:
          ip: agw.test.example
          tags: [agentgateway]
        cribl-stream-01:
          ip: stream.test.example
          tags: [cribl-stream]
        object-store-under-test:
          ip: object-store.test.example
          ansible_connection: ssh

  vars_files:
    - "../../../roles/prometheus_stack/defaults/main.yml"
    - "../../../inventory/group_vars/prometheus_group/00-remote-write.yml"
    - "../../../inventory/group_vars/prometheus_group/10-pve-exporters.yml"
    - "../../../inventory/group_vars/prometheus_group/15-github-actions-exporter.yml"
    - "../../../inventory/group_vars/prometheus_group/20-guest-exporters.yml"
    - "../../../inventory/group_vars/prometheus_group/30-tagged-exporters.yml"
    - "../../../inventory/group_vars/prometheus_group/40-gpu-exporters.yml"
    - "../../../inventory/group_vars/prometheus_group/50-macmon-exporters.yml"
    - "../../../inventory/group_vars/prometheus_group/60-scrape-configs.yml"

  tasks:
    - name: Publish the fixture inventory as a fact
      ansible.builtin.set_fact:
        tofu_data: "{{ _fixture_tofu_data }}"
        wan_hop_discovery_isp_hops: []

    - name: Render prometheus.yml
      ansible.builtin.set_fact:
        _rendered: "{{ lookup('template', _pst_tpl) | from_yaml }}"

    - name: Isolate the PVE exporter job
      ansible.builtin.set_fact:
        _jobs: "{{ _rendered.scrape_configs | selectattr('job_name', 'equalto', 'pve_exporter') | list }}"

    - name: Assert the job uses commissioned inventory nodes and exporter relabeling
      ansible.builtin.assert:
        quiet: true
        that:
          - _jobs | length == 1
          - _jobs[0].scrape_interval == '60s'
          - _jobs[0].scrape_timeout == '55s'
          - _jobs[0].metrics_path == '/pve'
          - _jobs[0].params.module == ['default']
          - _jobs[0].params.cluster == ['1']
          - _jobs[0].params.node == ['1']
          - _jobs[0].static_configs[0].targets == ['node-alpha.test.example', 'node-beta.test.example']
          - _jobs[0].relabel_configs[0].source_labels == ['__address__']
          - _jobs[0].relabel_configs[0].target_label == '__param_target'
          - _jobs[0].relabel_configs[1].source_labels == ['__param_target']
          - _jobs[0].relabel_configs[1].target_label == 'instance'
          - _jobs[0].relabel_configs[2].target_label == '__address__'
          - _jobs[0].relabel_configs[2].replacement == '127.0.0.1:9221'
        fail_msg: >-
          The PVE exporter job must query each commissioned node through the
          local exporter and pass the node as __param_target. Rendered: {{ _jobs }}
        success_msg: One PVE exporter scrape job with inventory targets and relabeling.

    - name: Isolate the GitHub Actions exporter job
      ansible.builtin.set_fact:
        _github_actions_jobs: >-
          {{ _rendered.scrape_configs
             | selectattr('job_name', 'equalto', 'github_actions_exporter')
             | list }}

    - name: Assert the GitHub Actions exporter is scraped beside Prometheus
      ansible.builtin.assert:
        quiet: true
        that:
          - _github_actions_jobs | length == 1
          - _github_actions_jobs[0].scrape_interval == '60s'
          - _github_actions_jobs[0].scrape_timeout == '30s'
          - >-
            _github_actions_jobs[0].static_configs[0].targets
            == [prometheus_stack_github_actions_exporter_address]
        fail_msg: >-
          The GitHub Actions exporter job must target the local exporter with
          an explicit interval and timeout. Rendered: {{ _github_actions_jobs }}
        success_msg: GitHub Actions exporter target and scrape timing render correctly.

    - name: Isolate the PVE node_exporter job
      ansible.builtin.set_fact:
        _pve_node_jobs: "{{ _rendered.scrape_configs | selectattr('job_name', 'equalto', 'pve_node_exporter') | list }}"

    - name: Assert the PVE node_exporter job scrapes commissioned nodes with an explicit timeout
      ansible.builtin.assert:
        quiet: true
        that:
          - _pve_node_jobs | length == 1
          - _pve_node_jobs[0].scrape_interval == '60s'
          - _pve_node_jobs[0].scrape_timeout == '30s'
          - "'node-alpha.test.example:9100' in _pve_node_jobs[0].static_configs[0].targets"
          - "'node-gamma.test.example:9100' not in _pve_node_jobs[0].static_configs[0].targets"
        fail_msg: >-
          The PVE node_exporter job must set scrape_timeout 30s and target only
          commissioned nodes. Rendered: {{ _pve_node_jobs }}
        success_msg: PVE node_exporter job has an explicit 30s timeout and commissioned targets.

    - name: Isolate the PVE zfs_exporter job
      ansible.builtin.set_fact:
        _pve_zfs_jobs: "{{ _rendered.scrape_configs | selectattr('job_name', 'equalto', 'pve_zfs_exporter') | list }}"

    # The fixture service_ports declares no zfs_exporter key, so the port
    # rendered here is the group_vars default (9134).
    - name: Assert the PVE zfs_exporter job scrapes each commissioned node on 9134
      ansible.builtin.assert:
        quiet: true
        that:
          - _pve_zfs_jobs | length == 1
          - _pve_zfs_jobs[0].scrape_interval == '60s'
          - _pve_zfs_jobs[0].scrape_timeout == '30s'
          - >-
            _pve_zfs_jobs[0].static_configs[0].targets
            == ['node-alpha.test.example:9134', 'node-beta.test.example:9134']
          - "'node-gamma.test.example:9134' not in _pve_zfs_jobs[0].static_configs[0].targets"
        fail_msg: >-
          The pve_zfs_exporter job must set scrape_timeout 30s and build one
          target per commissioned node on port 9134. Rendered: {{ _pve_zfs_jobs }}
        success_msg: pve_zfs_exporter job targets each commissioned node on 9134.

    - name: Isolate the guest node_exporter job
      ansible.builtin.set_fact:
        _guest_jobs: "{{ _rendered.scrape_configs | selectattr('job_name', 'equalto', 'guest_node_exporter') | list }}"

    - name: Assert the guest job scrapes the inventory guest and keeps filesystem series
      ansible.builtin.assert:
        quiet: true
        that:
          - _guest_jobs | length == 1
          - _guest_jobs[0].scrape_interval == '60s'
          - _guest_jobs[0].scrape_timeout == '30s'
          - >-
            _guest_jobs[0].static_configs
            | selectattr('labels.guest', 'equalto', 'object-store-under-test')
            | selectattr('targets', 'equalto', ['object-store.test.example:9100'])
            | list | length == 1
          - _guest_jobs[0].metric_relabel_configs[0].action == 'keep'
          - "'node_filesystem_(avail|size)_bytes' in _guest_jobs[0].metric_relabel_configs[0].regex"
        fail_msg: >-
          The guest exporter job must target inventory guests and keep filesystem
          metrics. Rendered: {{ _guest_jobs }}
        success_msg: Guest target and filesystem metrics render in guest_node_exporter.

    - name: Load the cribl_stream group vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../inventory/group_vars/cribl_stream_group.yml"
        name: _cribl_gv

    - name: Splunk keep-job list gates pve_exporter but not pve_zfs_exporter
      ansible.builtin.assert:
        quiet: true
        that:
          - "'pve_exporter' in _cribl_gv.cribl_stream_prometheus_splunk_keep_jobs"
          - "'pve_zfs_exporter' not in _cribl_gv.cribl_stream_prometheus_splunk_keep_jobs"
        fail_msg: >-
          cribl_stream_prometheus_splunk_keep_jobs must include pve_exporter
          and leave pve_zfs_exporter off the Splunk metrics leg.
        success_msg: >-
          pve_exporter passes the Splunk metrics leg; pve_zfs_exporter stays
          VictoriaMetrics-only.
