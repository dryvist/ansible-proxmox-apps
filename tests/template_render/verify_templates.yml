---
# Template rendering verification playbook
# Renders every role's templates offline and asserts on expected content.
#
# Usage:
#   ansible-playbook tests/template_render/verify_templates.yml -c local
#
# One play per role/concern lives under verify/, imported below in the exact
# order they used to appear in this file (order has no runtime significance —
# every play only depends on `render_tmp`, set by the first play here — but
# keeping it stable makes diffs against history readable).
#
# Every play (here and under verify/) sets `ansible_become: false`.
# group_vars/all.yml sets `ansible_become: true` for managed nodes, and the
# implicit localhost inherits it, so without the override each play escalates
# to root to render a fixture into /tmp — needless privilege that fails
# outright wherever the caller has no passwordless sudo (a workstation, a
# runner image without sudo installed). The play keyword `become: false` does
# NOT override it — the connection variable wins — so the override has to be
# `ansible_become` in play vars. Add it to any new play here or under verify/.
#
# Fixtures render under `_fixture_dir` (== render_tmp), a directory created
# fresh per run by the first play below and deleted by the last, never a fixed
# path. The runners are long-lived and shared, so a fixed path collides with
# whatever a previous job left behind — including root-owned files from
# before the become fix above, which an unprivileged rename cannot replace —
# and with any job running the same scenario concurrently.
#
# Deriving the directory from RUNNER_TEMP would only cover GitHub Actions:
# that variable is unset everywhere else, so the fallback lands back on the
# fixed paths this exists to avoid. A per-run directory needs no environment
# variable and makes no assumption about who cleans the executor's temp space.
# Use `_fixture_dir` for any new fixture here.
#
# Every play under verify/ uses "{{ playbook_dir }}/../../roles/..." (never a
# bare "../../roles/...") for template/vars_files paths. playbook_dir is this
# top-level entrypoint's directory regardless of which imported file a task
# lives in, so the path stays correct no matter how verify/ is reorganized —
# a bare relative path would instead resolve against the imported file's own
# directory and break the moment it moved one level deeper than this file.

- name: Create the per-run fixture output directory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false

  tasks:
    - name: Create a directory unique to this run
      ansible.builtin.tempfile:
        state: directory
        prefix: verify_templates_
      register: _render_tmp

    - name: Publish the fixture directory to every later play
      ansible.builtin.set_fact:
        render_tmp: "{{ _render_tmp.path }}"

    - name: Report where this run's fixtures are being written
      ansible.builtin.debug:
        msg: "Rendering fixtures under {{ render_tmp }}"

- name: Render and verify cribl_docker_stack templates
  import_playbook: verify/cribl_docker_stack.yml

- name: Render and verify mailpit_docker templates
  import_playbook: verify/mailpit_docker.yml

- name: Render and verify ntfy_docker templates
  import_playbook: verify/ntfy_docker.yml

- name: Render and verify github_runner templates
  import_playbook: verify/github_runner.yml

- name: Render and verify the openbao listener XFF block
  import_playbook: verify/openbao_listener_xff.yml

- name: Render and verify openproject_docker templates
  import_playbook: verify/openproject_docker.yml

- name: Render and verify haproxy templates
  import_playbook: verify/haproxy.yml

- name: Render and verify traefik templates
  import_playbook: verify/traefik.yml

- name: Render and verify syslog_forwarder template
  import_playbook: verify/syslog_forwarder.yml

- name: Render and verify cribl_stream templates
  import_playbook: verify/cribl_stream.yml

- name: Render and verify the cribl_edge syslog pipeline
  import_playbook: verify/cribl_edge_syslog.yml

- name: Render and verify unifi_metrics templates
  import_playbook: verify/unifi_metrics.yml

- name: Verify wan_hop_discovery parse/fold logic + smokeping target render
  import_playbook: verify/wan_hop_discovery.yml

- name: Render and verify the pgBackRest async-archiving configuration
  import_playbook: verify/pgbackrest_async_archiving.yml

- name: Verify the pgBackRest initial-backup detection expression
  import_playbook: verify/pgbackrest_initial_backup.yml

- name: Verify the pgBackRest stanza is cluster-scoped, not host-scoped
  import_playbook: verify/pgbackrest_stanza_scoped.yml

- name: Render and verify the Authelia access-control rules
  import_playbook: verify/authelia_access_control.yml

- name: Verify the cribl_stream Langfuse destination renders unconditionally
  import_playbook: verify/cribl_stream_langfuse.yml

- name: Remove the per-run fixture output directory
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false

  tasks:
    # ponytail: a failed run leaves its directory behind. Harmless — the name
    # is unique so nothing collides with it, and the fixtures are useful when
    # debugging the failure. Add a rescue only if leftovers ever cost disk.
    - name: Delete this run's rendered fixtures
      ansible.builtin.file:
        path: "{{ render_tmp }}"
        state: absent

# Reads role files straight from the tree; renders nothing, so it needs none of
# the fixture machinery above and is safe either side of the cleanup play.
- name: Verify every provisioned Grafana dashboard has a stable uid
  import_playbook: verify/grafana_dashboard_uid.yml

# LAST on purpose. This play publishes a fixture tofu_data as a fact, because
# the expression it exercises reads hostvars['localhost']['tofu_data'] and play
# vars never land in hostvars. A fact outranks the play vars every other verify
# play uses for its own tofu_data, and meta: clear_facts does not clear it for
# the implicit localhost — so anything imported after this would render against
# the fixture. Add new imports ABOVE this block.
- name: Verify the PVE node_exporter scrape targets
  import_playbook: verify/pve_node_exporter_targets.yml
