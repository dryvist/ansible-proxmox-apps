---
# Replays every include_vars task in playbooks/openbao-rotate-approles.yml
# that runs in scheduled mode (no `when`, or a `when` on
# rotate_scheduled_mode), then asserts the scheduled identity's own AppRole
# name resolves. The self-rotation step templates that name, so a run that
# cannot resolve it fails before any domain rotates.
#
# Usage: ansible-playbook tests/openbao_rotate/verify_scheduled_self_rotate_vars.yml -c local

- name: Verify the scheduled rotation run loads its own AppRole name
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _rotate_playbook_dir: "{{ playbook_dir }}/../../playbooks"
    _rotate_tasks: >-
      {{ (lookup('ansible.builtin.file', _rotate_playbook_dir ~ '/openbao-rotate-approles.yml')
          | from_yaml)[0].tasks }}
    _rotate_task_names: "{{ _rotate_tasks | map(attribute='name') | list }}"
    _login_source_task: >-
      {{ _rotate_tasks
         | selectattr('name', 'equalto', 'Resolve the role_id/secret_id to authenticate with this run')
         | first }}

  tasks:
    - name: Load each scheduled-mode var source the playbook loads
      ansible.builtin.include_vars:
        dir: "{{ _path if _src.dir is defined else omit }}"
        file: "{{ _path if _src.file is defined else omit }}"
      vars:
        _src: "{{ item['ansible.builtin.include_vars'] }}"
        _path: "{{ (_src.dir | default(_src.file)) | replace('{{ playbook_dir }}', _rotate_playbook_dir) }}"
      # A source path built from a run-time variable (not playbook_dir) cannot
      # name the AppRole list files, so it is skipped.
      # selectattr cannot select on a dotted module key, so filter here.
      when:
        - "'ansible.builtin.include_vars' in item"
        - item.when is not defined or 'rotate_scheduled_mode' in (item.when | string)
        - (_src.dir | default(_src.file)) is search('playbook_dir')
      loop: "{{ _rotate_tasks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert the self-rotation target name resolves
      ansible.builtin.assert:
        that:
          - openbao_approle_secret_id_rotate_scheduled_approle_name is defined
          - openbao_approle_secret_id_rotate_scheduled_approle_name | length > 0
        fail_msg: >-
          playbooks/openbao-rotate-approles.yml does not load
          openbao_approle_secret_id_rotate_scheduled_approle_name in
          scheduled mode; the self-rotation step fails on it.

    - name: Assert the scheduled identity rotates itself first and a failed domain cannot stop the run
      ansible.builtin.assert:
        that:
          - >-
            _login_source_task['ansible.builtin.set_fact']['rotate_login_role_id']
            is search('rotate_scheduled_role_id')
          - >-
            _login_source_task['ansible.builtin.set_fact']['rotate_login_secret_id']
            is search('rotate_scheduled_secret_id')
          - >-
            _rotate_task_names.index("Authenticate as approle-secret-id-rotate")
            < _rotate_task_names.index("Rotate each domain's AppRole secret_id in turn")
          - >-
            _rotate_task_names.index("Rotate the scheduled identity's own secret_id (scheduled mode)")
            < _rotate_task_names.index("Rotate each domain's AppRole secret_id in turn")
          - >-
            _rotate_task_names.index("Rotate each domain's AppRole secret_id in turn")
            < _rotate_task_names.index("Fail the run when any identity did not rotate")
          - _rotate_task_names[-1] == "Fail the run when any identity did not rotate"
          - >-
            (lookup('ansible.builtin.file', _rotate_playbook_dir ~ '/tasks/openbao_rotate_one_domain.yml')
             | from_yaml | selectattr('rescue', 'defined') | map(attribute='rescue') | flatten
             | map('dict2items') | flatten | map(attribute='key')
             | select('equalto', 'ansible.builtin.set_fact') | list | length) == 1
        fail_msg: >-
          The scheduled run must authenticate with its dedicated identity, rotate that
          identity before the domain loop, keep going past a failed domain (rescue in
          tasks/openbao_rotate_one_domain.yml), and end with the failure report.
        quiet: true
