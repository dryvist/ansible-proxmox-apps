---
# Pins the contract the three estate boards share.
#
# WHY these are tests: every failure here is silent. A board rendered from an
# empty or mis-shaped catalog converges green and publishes a dashboard that is
# simply wrong — empty, or full of links that resolve nowhere, or full of status
# dots that all read "down" because the probe hit an SSO login page. None of
# that fails a converge.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/dashboard_catalog/test_catalog.yml -i localhost, -c local
- name: Verify the shared dashboard catalog
  hosts: localhost
  gather_facts: false
  vars:
    _role_dir: "{{ playbook_dir }}/../../roles/dashboard_catalog_services"
    dashboard_catalog_base_domain: "pve.example.test"
    tofu_data:
      ingress:
        # A normal container-backed browser service.
        - name: vikunja
          group: apps
          ip: "10.0.0.10"
          port: 3456
          sso: true
        # Hostname differs from the route name — the case that broke Hermes
        # OIDC when a route was renamed.
        - name: hermes-agent
          hostname: hermes
          group: ai
          ip: "10.0.0.20"
          port: 8080
          sso: true
          title: "Hermes · Agent (dashboard)"
        # Pool-backed: no `ip`, several `backends`.
        - name: openbao
          group: mgmt
          backends: ["10.0.0.30", "10.0.0.31"]
          port: 8200
          sso: false
        # Apex row — fqdn is the base domain itself, not a label under it.
        - name: proxmox
          apex: true
          group: mgmt
          backends: ["node1.pve.example.test"]
          port: 8006
          scheme: https
          sso: false
        # A board itself — post-#1614 there is no exclude list: every fronted
        # service is catalogued, boards included.
        - name: homarr
          group: apps
          ip: "10.0.0.40"
          port: 7575
        # Pool-backed LLM router whose board link lands on a sub-path. The
        # url_path rides the LINK only; the probe stays guest-direct.
        - name: llm
          group: ai
          backends: ["10.0.0.50", "10.0.0.51"]
          port: 4000
          sso: false
          ui: true
          url_path: "/ui"
          desc: "OpenAI-compatible model router"
        # A compat route reaching a UI another route already tiles — this one
        # opts out of every board with dashboard: false.
        - name: llm-ui-legacy
          group: ai
          ip: "10.0.0.50"
          port: 4000
          sso: true
          dashboard: false
  tasks:
    - name: Build the catalog
      ansible.builtin.include_role:
        name: dashboard_catalog

    - name: Every fronted service is catalogued, boards included
      ansible.builtin.assert:
        quiet: true
        that:
          - "'homarr' in (dashboard_catalog_services | map(attribute='name') | list)"
          - dashboard_catalog_services | length == 6
        fail_msg: >-
          A fronted service is missing from the catalog — the board would
          silently omit it in the browser while the converge stays green.
        success_msg: "All six fixture rows are catalogued, homarr included."

    - name: Title defaults to name and honours an explicit override
      ansible.builtin.assert:
        quiet: true
        that:
          - _by_name.vikunja.title == 'vikunja'
          - _by_name['hermes-agent'].title == 'Hermes · Agent (dashboard)'
        fail_msg: >-
          A board tile's title is either not defaulting to the route name or
          not honouring tofu's own override — vikunja title:
          {{ _by_name.vikunja.title }}, hermes-agent title:
          {{ _by_name['hermes-agent'].title }}
        success_msg: "title defaults to name and an explicit override wins."
      vars:
        _by_name: "{{ dict(dashboard_catalog_services | map(attribute='name') | zip(dashboard_catalog_services)) }}"

    - name: Every link is a clean HTTPS URL with no port
      ansible.builtin.assert:
        quiet: true
        that:
          - dashboard_catalog_services | selectattr('url', 'search', ':[0-9]+') | list | length == 0
          - dashboard_catalog_services | rejectattr('url', 'match', '^https://') | list | length == 0
        fail_msg: >-
          A catalog link carries a port or is not HTTPS. A ported link bypasses
          Traefik and therefore Authelia — the whole point of the clean URL.
        success_msg: "Every link is portless HTTPS."

    - name: A route whose hostname differs from its name uses the HOSTNAME
      ansible.builtin.assert:
        quiet: true
        that:
          - _by_name['hermes-agent'].fqdn == 'hermes.pve.example.test'
          - _by_name['vikunja'].fqdn == 'vikunja.pve.example.test'
        fail_msg: >-
          fqdn was composed from the route name instead of its hostname. That
          publishes a link to a host that does not exist.
        success_msg: "hostname wins over name, as in the traefik role."
      vars:
        _by_name: "{{ dict(dashboard_catalog_services | map(attribute='name') | zip(dashboard_catalog_services)) }}"

    - name: An apex route resolves to the base domain itself
      ansible.builtin.assert:
        quiet: true
        that:
          - _by_name['proxmox'].fqdn == 'pve.example.test'
        fail_msg: "An apex row was given a label under the base domain."
        success_msg: "Apex rows resolve to the base domain."
      vars:
        _by_name: "{{ dict(dashboard_catalog_services | map(attribute='name') | zip(dashboard_catalog_services)) }}"

    # The distinction the whole probe design rests on.
    - name: Probes address the guest directly, never the public URL
      ansible.builtin.assert:
        quiet: true
        that:
          - _by_name['vikunja'].probe_url == 'http://10.0.0.10:3456'
          - _by_name['openbao'].probe_url == 'http://10.0.0.30:8200'
          - dashboard_catalog_services | selectattr('probe_url', 'search', 'pve.example.test') | list | length <= 1
        fail_msg: >-
          A probe points at the public hostname. It issues an unauthenticated
          HEAD, so Authelia answers with a login page and EVERY service reports
          down while the converge stays green.
        success_msg: "Probes hit the guest; links hit the vhost."
      vars:
        _by_name: "{{ dict(dashboard_catalog_services | map(attribute='name') | zip(dashboard_catalog_services)) }}"

    # The url_path distinction: appended to the click-through link, never the probe.
    - name: An ingress url_path joins the link but never the probe
      ansible.builtin.assert:
        quiet: true
        that:
          - _by_name['llm'].url == 'https://llm.pve.example.test/ui'
          - _by_name['llm'].probe_url == 'http://10.0.0.50:4000'
          - _by_name['llm'].ui == true
          - _by_name['llm'].sso == false
        fail_msg: >-
          The llm link dropped its url_path, or the probe gained one. A probe
          with a url_path is an unauthenticated HEAD against Authelia's login
          page: every service reads down while the converge stays green.
        success_msg: "url_path rides the link only; the llm probe stays guest-direct."
      vars:
        _by_name: "{{ dict(dashboard_catalog_services | map(attribute='name') | zip(dashboard_catalog_services)) }}"

    - name: Every entry carries a group
      ansible.builtin.assert:
        quiet: true
        that:
          - dashboard_catalog_services | rejectattr('group') | list | length == 0
        fail_msg: "An entry has no group — it would land in no section on any board."
        success_msg: "Every entry is grouped."

    - name: A route carrying dashboard=false gets no tile on any board
      ansible.builtin.assert:
        quiet: true
        that:
          - "'llm-ui-legacy' not in (dashboard_catalog_services | map(attribute='name') | list)"
        fail_msg: >-
          A route with dashboard=false was catalogued anyway — it would render
          as a second tile for a UI another route already tiles.
        success_msg: "dashboard=false keeps a compat route off every board."

    - name: A route carrying dashboard=false is still monitored by Gatus
      ansible.builtin.assert:
        quiet: true
        that:
          - "'llm-ui-legacy' in (dashboard_catalog_services_monitor | map(attribute='name') | list)"
          - dashboard_catalog_services_monitor | length == 7
        fail_msg: >-
          dashboard=false dropped a route from monitoring, not just board
          tiling — a broken compat redirect would silently go unmonitored
          while every board stays green.
        success_msg: >-
          dashboard_catalog_services_monitor carries every fronted route,
          dashboard=false included.
