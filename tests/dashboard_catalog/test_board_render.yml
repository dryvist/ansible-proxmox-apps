---
# Renders each board's real templates and parses the output.
#
# WHY: a template that renders malformed YAML still converges green — the file
# lands, the service restarts, and the board is broken in the browser. Nothing
# upstream of the browser notices. So parse the artifact, and check the two
# properties that matter: every link is portless HTTPS, and no probe address
# leaks into a link.
#
# Run (from the REPO ROOT):
#   ansible-playbook tests/dashboard_catalog/test_board_render.yml -i localhost, -c local
- name: Verify the rendered board configs
  hosts: localhost
  gather_facts: false
  vars:
    dashboard_catalog_base_domain: "pve.example.test"
    homepage_site_monitor_enabled: false
    glance_monitor_enabled: false
    glance_host: "0.0.0.0"
    glance_port: 8080
    homepage_title: "Homelab"
    tofu_data:
      ingress:
        - {name: vikunja, group: apps, ip: "10.0.0.10", port: 3456, sso: true}
        - {name: hermes-agent, hostname: hermes, group: ai, ip: "10.0.0.20", port: 8080, sso: true}
        - {name: plex, group: media_svc, ip: "10.0.0.50", port: 32400, sso: false}
  tasks:
    - name: Build the catalog
      ansible.builtin.include_role:
        name: dashboard_catalog

    # include_role does not leave the role's defaults bound for a lookup()
    # rendered from the PLAY, so the board templates would see
    # dashboard_catalog_group_order as undefined. Load them explicitly — the
    # converge gets them because the board roles include this role themselves.
    - name: Bind the catalog role defaults for the template renders below
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/dashboard_catalog/defaults/main.yml"

    - name: Render and parse Homepage services.yaml
      ansible.builtin.set_fact:
        _homepage_services: >-
          {{ lookup('template', playbook_dir ~ '/../../roles/homepage/templates/services.yaml.j2') | from_yaml }}

    - name: Render and parse Homepage settings.yaml
      ansible.builtin.set_fact:
        _homepage_settings: >-
          {{ lookup('template', playbook_dir ~ '/../../roles/homepage/templates/settings.yaml.j2') | from_yaml }}

    - name: Render and parse the Glance generated page
      ansible.builtin.set_fact:
        _glance_page: >-
          {{ lookup('template', playbook_dir ~ '/../../roles/glance/templates/generated-services.yml.j2') | from_yaml }}

    - name: Every board parses and lists every catalogued service
      ansible.builtin.assert:
        quiet: true
        that:
          - _homepage_services | length == 3
          - _homepage_settings.layout.keys() | list | length == 3
          - _glance_page | length == 1
          - _glance_hrefs | length == 3
        fail_msg: >-
          A board rendered but does not carry every service. An incomplete board
          converges green and simply omits things in the browser.
        success_msg: "All three boards render every catalogued service."
      vars:
        _glance_hrefs: >-
          {{ _glance_page[0].columns[0].widgets
             | map(attribute='groups') | flatten
             | map(attribute='links') | flatten | list }}

    - name: No rendered link carries a port or a guest address
      ansible.builtin.assert:
        quiet: true
        that:
          - _all_links | select('search', ':[0-9]+') | list | length == 0
          - _all_links | select('search', '10\\.0\\.0\\.') | list | length == 0
          - _all_links | reject('match', '^https://') | list | length == 0
        fail_msg: >-
          A rendered link carries a port or a raw guest address, so the click
          bypasses Traefik and therefore Authelia — the entire point of the
          clean URL. Rendered links were: {{ _all_links }}
        success_msg: "Every rendered link across all boards is portless HTTPS."
      vars:
        _homepage_links: >-
          {{ _homepage_services | map('dict2items') | flatten
             | map(attribute='value') | flatten
             | map('dict2items') | flatten
             | map(attribute='value') | map(attribute='href') | list }}
        _glance_links: >-
          {{ _glance_page[0].columns[0].widgets
             | map(attribute='groups') | flatten
             | map(attribute='links') | flatten
             | map(attribute='url') | list }}
        _all_links: "{{ _homepage_links + _glance_links }}"
