---
# Verifies the reconcile condition from roles/object_storage/tasks/lifecycle.yml.
# Each case asserts whether the put-bucket-lifecycle-configuration task fires.
- name: Test lifecycle reconcile condition
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    live_events_90: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled","Filter":{"Prefix":""},
      "NoncurrentVersionExpiration":{"NoncurrentDays":1},"Expiration":{"ExpiredObjectDeleteMarker":true}},
      {"ID":"expire-current-events","Status":"Enabled","Filter":{"Prefix":"events/"},"Expiration":{"Days":90}}]}
    live_events_missing: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled","Filter":{"Prefix":""},
      "NoncurrentVersionExpiration":{"NoncurrentDays":1},"Expiration":{"ExpiredObjectDeleteMarker":true}}]}
    live_3650: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "NoncurrentVersionExpiration":{"NoncurrentDays":3650}}]}
    live_30: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "NoncurrentVersionExpiration":{"NoncurrentDays":30}}]}
    live_30_markers: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "NoncurrentVersionExpiration":{"NoncurrentDays":30},
      "Expiration":{"ExpiredObjectDeleteMarker":true}}]}
    live_30_markers_prefix: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "Filter":{"Prefix":""},
      "NoncurrentVersionExpiration":{"NoncurrentDays":30},
      "Expiration":{"ExpiredObjectDeleteMarker":true}},
      {"ID":"expire-noncurrent-postgres","Status":"Enabled",
      "Filter":{"Prefix":"postgres/"},
      "NoncurrentVersionExpiration":{"NoncurrentDays":1},
      "Expiration":{"ExpiredObjectDeleteMarker":true}}]}
    live_30_markers_prefix_7: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "Filter":{"Prefix":""},
      "NoncurrentVersionExpiration":{"NoncurrentDays":30},
      "Expiration":{"ExpiredObjectDeleteMarker":true}},
      {"ID":"expire-noncurrent-postgres","Status":"Enabled",
      "Filter":{"Prefix":"postgres/"},
      "NoncurrentVersionExpiration":{"NoncurrentDays":7},
      "Expiration":{"ExpiredObjectDeleteMarker":true}}]}
    live_30_markers_prefix_no_marker: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "Filter":{"Prefix":""},
      "NoncurrentVersionExpiration":{"NoncurrentDays":30},
      "Expiration":{"ExpiredObjectDeleteMarker":true}},
      {"ID":"expire-noncurrent-postgres","Status":"Enabled",
      "Filter":{"Prefix":"postgres/"},
      "NoncurrentVersionExpiration":{"NoncurrentDays":1}}]}
    live_extra_scoped_rule: >-
      {"Rules":[{"ID":"expire-noncurrent","Status":"Enabled",
      "NoncurrentVersionExpiration":{"NoncurrentDays":30}},
      {"ID":"expire-noncurrent-cribl","Status":"Enabled",
      "Filter":{"Prefix":"cribl/"},
      "NoncurrentVersionExpiration":{"NoncurrentDays":14}}]}
    cases:
      - name: current-prefix-matching-days
        item: {rc: 0, stdout: "{{ live_events_90 }}", item: "{{ _langfuse_bucket }}"}
        expect: false
      - name: current-prefix-different-days
        item:
          rc: 0
          stdout: "{{ live_events_90 | replace('Days\":90', 'Days\":89') }}"
          item: "{{ _langfuse_bucket }}"
        expect: true
      - name: current-prefix-missing-rule
        item: {rc: 0, stdout: "{{ live_events_missing }}", item: "{{ _langfuse_bucket }}"}
        expect: true
      # backups bucket declares 30 but live is 3650 -> MUST fire
      - name: declared-30-live-3650
        item: {rc: 0, stdout: "{{ live_3650 }}", item: {name: b, noncurrent_expiration_days: 30}}
        expect: true
      # already reconciled -> must NOT fire (idempotent)
      - name: declared-30-live-30
        item: {rc: 0, stdout: "{{ live_30 }}", item: {name: b, noncurrent_expiration_days: 30}}
        expect: false
      # no declaration, live differs from global default -> must NOT fire
      # (hand-tightened retention is preserved)
      - name: undeclared-live-30
        item: {rc: 0, stdout: "{{ live_30 }}", item: {name: a}}
        expect: false
      # no lifecycle config at all -> MUST fire
      - name: no-config
        item: {rc: 255, stdout: "", item: {name: a}}
        expect: true
      # config exists but no expiration rule -> MUST fire
      - name: config-without-rule
        item: {rc: 0, stdout: '{"Rules":[]}', item: {name: a}}
        expect: true
      # delete-marker expiry declared but live rule lacks it -> MUST fire
      - name: markers-declared-live-without
        item:
          rc: 0
          stdout: "{{ live_30 }}"
          item: {name: b, noncurrent_expiration_days: 30, expire_delete_markers: true}
        expect: true
      # delete-marker expiry declared and already live -> must NOT fire
      - name: markers-declared-live-with
        item:
          rc: 0
          stdout: "{{ live_30_markers }}"
          item: {name: b, noncurrent_expiration_days: 30, expire_delete_markers: true}
        expect: false
      # delete-marker expiry not declared -> a live marker rule is left alone
      - name: markers-undeclared-live-with
        item:
          rc: 0
          stdout: "{{ live_30_markers }}"
          item: {name: b, noncurrent_expiration_days: 30}
        expect: false
      # prefix rule declared but missing from the live config -> MUST fire
      - name: prefix-declared-live-missing
        item:
          rc: 0
          stdout: "{{ live_30_markers }}"
          item:
            name: b
            noncurrent_expiration_days: 30
            expire_delete_markers: true
            prefix_lifecycle_rules:
              - {prefix: postgres/, noncurrent_expiration_days: 1, expire_delete_markers: true}
        expect: true
      # prefix rule live with different noncurrent days -> MUST fire
      - name: prefix-declared-live-days-differ
        item:
          rc: 0
          stdout: "{{ live_30_markers_prefix_7 }}"
          item:
            name: b
            noncurrent_expiration_days: 30
            expire_delete_markers: true
            prefix_lifecycle_rules:
              - {prefix: postgres/, noncurrent_expiration_days: 1, expire_delete_markers: true}
        expect: true
      # prefix rule live and fully reconciled -> must NOT fire (idempotent)
      - name: prefix-declared-live-match
        item:
          rc: 0
          stdout: "{{ live_30_markers_prefix }}"
          item:
            name: b
            noncurrent_expiration_days: 30
            expire_delete_markers: true
            prefix_lifecycle_rules:
              - {prefix: postgres/, noncurrent_expiration_days: 1, expire_delete_markers: true}
        expect: false
      # prefix rule live but missing its delete-marker expiry -> MUST fire
      - name: prefix-declared-live-scoped-marker-missing
        item:
          rc: 0
          stdout: "{{ live_30_markers_prefix_no_marker }}"
          item:
            name: b
            noncurrent_expiration_days: 30
            expire_delete_markers: true
            prefix_lifecycle_rules:
              - {prefix: postgres/, noncurrent_expiration_days: 1, expire_delete_markers: true}
        expect: true
      # The reconcile condition does not fire, but the ownership guard below
      # rejects this undeclared rule before any lifecycle document can be put.
      - name: prefix-undeclared-live-extra-scoped-rule
        item:
          rc: 0
          stdout: "{{ live_extra_scoped_rule }}"
          item: {name: a, noncurrent_expiration_days: 30}
        expect: false
    guard_cases:
      - name: declared-current-and-base-ids
        item: {rc: 0, stdout: "{{ live_events_90 }}", item: "{{ _langfuse_bucket }}"}
        expect: true
      - name: foreign-live-rule-id
        item: {rc: 0, stdout: "{{ live_extra_scoped_rule }}", item: {name: a}}
        expect: false
      - name: current-rule-not-declared
        item: {rc: 0, stdout: "{{ live_events_90 }}", item: {name: a}}
        expect: false
      - name: no-such-lifecycle-configuration
        item: {rc: 255, stdout: "", stderr: NoSuchLifecycleConfiguration, item: {name: a}}
        expect: true
  tasks:
    - name: Load the object-storage role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/object_storage/defaults/main/00-core.yml"
        name: _object_storage_defaults

    - name: Select the Langfuse declaration and reset the offline IAM accumulator
      ansible.builtin.set_fact:
        _langfuse_bucket: >-
          {{ _object_storage_defaults.object_storage_default_buckets
             | selectattr('name', 'equalto', 'langfuse') | first }}
        object_storage_bucket_credentials: {}

    - name: Exercise the empty IAM role loop without credentials or network
      ansible.builtin.include_tasks: ../../roles/object_storage/tasks/iam_bucket.yml
      vars:
        object_storage_iam_bucket_config: "{{ _langfuse_bucket }}"
        object_storage_iam_bucket: "{{ _langfuse_bucket.name }}"
        object_storage_iam_roles: [ro, rw]

    - name: Assert the IAM opt-out leaves no provisioning work
      ansible.builtin.assert:
        that:
          - _langfuse_bucket.iam_roles == []
          - object_storage_bucket_credentials == {}
          - object_storage_bucket_credentials.keys() | list == []
          - not (object_storage_bucket_credentials | default({}) | length > 0)

    - name: Evaluate the ownership guard for each case
      vars:
        _owned_ids: >-
          {{ ['expire-noncurrent']
             + (item.item.item.prefix_lifecycle_rules | default([])
                | selectattr('noncurrent_expiration_days', 'defined')
                | map(attribute='prefix') | map('replace', '/', '-') | map('trim', '-')
                | map('regex_replace', '^', 'expire-noncurrent-') | list)
             + (item.item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
                | map(attribute='prefix') | map('replace', '/', '-') | map('trim', '-')
                | map('regex_replace', '^', 'expire-current-') | list) }}
        _foreign_ids: >-
          {{ ((item.item.stdout | from_json).Rules | map(attribute='ID', default='(missing ID)')
              | difference(_owned_ids)) if item.item.rc == 0 else [] }}
      ansible.builtin.assert:
        that:
          - (_foreign_ids | length == 0) == item.expect
        fail_msg: "case {{ item.name }}: expected guard={{ item.expect }}, foreign IDs={{ _foreign_ids }}"
      loop: "{{ guard_cases }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Evaluate the condition for each case
      ansible.builtin.assert:
        that:
          - >-
            (
              item.item.rc != 0 or
              (item.item.stdout | default('')) is not search('NoncurrentVersionExpiration') or
              (
                item.item.item.noncurrent_expiration_days is defined and
                (
                  (item.item.stdout | from_json).Rules
                  | selectattr('ID', 'defined')
                  | selectattr('ID', 'equalto', 'expire-noncurrent')
                  | map(attribute='NoncurrentVersionExpiration.NoncurrentDays')
                  | first | default(-1)
                ) != item.item.item.noncurrent_expiration_days
              ) or
              (
                (item.item.item.expire_delete_markers | default(false)) and
                (item.item.stdout | default('')) is not search('ExpiredObjectDeleteMarker')
              ) or
              (
                (item.item.item.prefix_lifecycle_rules | default([])) | length > 0 and
                (
                  (
                    (item.item.stdout | from_json).Rules
                    | selectattr('Filter.Prefix', 'defined')
                    | rejectattr('Filter.Prefix', 'equalto', '')
                    | selectattr('NoncurrentVersionExpiration', 'defined')
                    | map(attribute='NoncurrentVersionExpiration.NoncurrentDays')
                    | list
                  ) != (
                    item.item.item.prefix_lifecycle_rules
                    | selectattr('noncurrent_expiration_days', 'defined')
                    | map(attribute='noncurrent_expiration_days')
                    | list
                  ) or
                  (
                    (item.item.stdout | from_json).Rules
                    | selectattr('Filter.Prefix', 'defined')
                    | rejectattr('Filter.Prefix', 'equalto', '')
                    | selectattr('Expiration.ExpiredObjectDeleteMarker', 'defined')
                    | length
                  ) != (
                    item.item.item.prefix_lifecycle_rules
                    | selectattr('noncurrent_expiration_days', 'defined')
                    | selectattr('expire_delete_markers', 'defined')
                    | selectattr('expire_delete_markers')
                    | length
                  )
                )
              ) or
              (
                (
                  (item.item.stdout | from_json).Rules
                  | selectattr('Filter.Prefix', 'defined') | selectattr('Expiration.Days', 'defined')
                  | map(attribute='Filter.Prefix')
                  | zip((item.item.stdout | from_json).Rules
                        | selectattr('Filter.Prefix', 'defined') | selectattr('Expiration.Days', 'defined')
                        | map(attribute='Expiration.Days')) | sort
                ) != (
                  item.item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
                  | map(attribute='prefix')
                  | zip(item.item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
                        | map(attribute='expiration_days')) | sort
                )
              )
            ) == item.expect
        fail_msg: "case {{ item.name }}: expected fires={{ item.expect }}"
        success_msg: "case {{ item.name }}: OK (fires={{ item.expect }})"
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"
