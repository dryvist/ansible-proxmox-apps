---
# Exercise the corrected primary/secondary derivation with the SAME expression
# the role uses, across the cases that matter. Pure fact arithmetic, no host
# contact.
- name: Verify the DNS secondary derivation never contains the primary
  hosts: localhost
  gather_facts: false
  vars:
    cases:
      # Today's live shape: the lowest-vmid guess named a STOPPED member, so
      # the bootstrap secondary list holds the real primary's own address, and
      # no member reports the secondary role.
      - name: "guess named a non-primary; no live secondaries"
        role_map:
          - {ip: "10.0.2.2", role: "primary"}
        bootstrap_secondaries: ["10.0.2.3", "10.0.2.2"]
        bootstrap_primary: "10.0.2.4"
        expect_primary: "10.0.2.2"
        expect_secondaries: ["10.0.2.3"]
      - name: "a live secondary exists"
        role_map:
          - {ip: "10.0.2.2", role: "primary"}
          - {ip: "10.0.2.3", role: "secondary"}
        bootstrap_secondaries: ["10.0.2.3", "10.0.2.2"]
        bootstrap_primary: "10.0.2.4"
        expect_primary: "10.0.2.2"
        expect_secondaries: ["10.0.2.3"]
      - name: "single member: it is its own primary, no secondaries"
        role_map:
          - {ip: "10.0.2.2", role: "primary"}
        bootstrap_secondaries: []
        bootstrap_primary: "10.0.2.2"
        expect_primary: "10.0.2.2"
        expect_secondaries: []
      - name: "bootstrap list held ONLY the primary"
        role_map:
          - {ip: "10.0.2.2", role: "primary"}
        bootstrap_secondaries: ["10.0.2.2"]
        bootstrap_primary: "10.0.2.4"
        expect_primary: "10.0.2.2"
        expect_secondaries: []
      - name: "no live role map at all (first bootstrap)"
        role_map: []
        bootstrap_secondaries: ["10.0.2.3"]
        bootstrap_primary: "10.0.2.2"
        expect_primary: "10.0.2.2"
        expect_secondaries: ["10.0.2.3"]
  tasks:
    - name: Evaluate the derivation for each case
      vars:
        _live_primaries: >-
          {{ item.role_map | selectattr('role', 'equalto', 'primary')
             | map(attribute='ip') | reject('equalto', '') | list }}
        _live_secondaries: >-
          {{ item.role_map | selectattr('role', 'equalto', 'secondary')
             | map(attribute='ip') | reject('equalto', '') | list }}
        _primary: >-
          {{ _live_primaries | first | default(item.bootstrap_primary, true) }}
        _secondaries: >-
          {{ (_live_secondaries if (_live_secondaries | length > 0)
              else item.bootstrap_secondaries)
             | reject('equalto', (_live_primaries | first
                                  | default(item.bootstrap_primary, true)))
             | list }}
      ansible.builtin.assert:
        that:
          - _primary == item.expect_primary
          - _secondaries == item.expect_secondaries
          # The property the guard downstream enforces.
          - _primary not in _secondaries
        success_msg: >-
          OK  {{ item.name }} -> primary={{ _primary }}
          secondaries={{ _secondaries }}
        fail_msg: >-
          FAIL {{ item.name }} -> primary={{ _primary }} (want
          {{ item.expect_primary }}) secondaries={{ _secondaries }} (want
          {{ item.expect_secondaries }})
      loop: "{{ cases }}"
      loop_control:
        label: "{{ item.name }}"

- name: Verify inventory aliases through the DNS record builder
  hosts: localhost
  gather_facts: false
  vars:
    technitium_dns_apply: false
    technitium_dns_zone: example.test
    technitium_dns_host: 192.0.2.53
    technitium_dns_proxmox_endpoint_ips: []
    technitium_dns_ingress_aliases: [ingress-owned, INGRESS-CASE]
    technitium_dns_explicit_ingress_names: [explicit-ingress.example.test]
    technitium_dns_cname_records:
      - {name: service-owned, target: service-target}
      - {name: SERVICE-CASE, target: service-target}
    technitium_dns_extra_cname_records:
      - {name: extra-owned, target: extra-target.other.test}
      - {name: EXTRA-CASE, target: extra-target.other.test}
    technitium_dns_extra_a_records:
      - {name: extra-a-owned, ip: 192.0.2.54, zone: example.test}
    fixture_hosts:
      - {name: leased-name, hostname: leased-node, container_ip: leased-node.guest.test}
      - {name: ADDRESSED-NAME, hostname: addressed-node, container_ip: 192.0.2.10}
      - {name: same-name, hostname: same-name, container_ip: same-name.guest.test}
      - {name: SAME-CASE, hostname: same-case, container_ip: same-case.guest.test}
      - {name: no-hostname, container_ip: unnamed.guest.test}
      - {name: addressed-node, hostname: canonical-target, container_ip: canonical-target.guest.test}
      - {name: ingress-owned, hostname: ingress-target, container_ip: ingress-target.guest.test}
      - {name: ingress-case, hostname: ingress-case-target, container_ip: ingress-case-target.guest.test}
      - {name: explicit-ingress, hostname: explicit-target, container_ip: explicit-target.guest.test}
      - {name: service-owned, hostname: service-target, container_ip: service-target.guest.test}
      - {name: service-case, hostname: service-case-target, container_ip: service-case-target.guest.test}
      - {name: extra-owned, hostname: extra-target, container_ip: extra-target.guest.test}
      - {name: extra-case, hostname: extra-case-target, container_ip: extra-case-target.guest.test}
      - {name: extra-a-owned, hostname: extra-a-target, container_ip: extra-a-target.guest.test}
      - {name: invalid_label, hostname: invalid-target, container_ip: invalid-target.guest.test}
      - {name: invalid.label, hostname: dotted-target, container_ip: dotted-target.guest.test}
      - {name: "-leading", hostname: leading-target, container_ip: leading-target.guest.test}
      - {name: "trailing-", hostname: trailing-target, container_ip: trailing-target.guest.test}
      - name: "{{ 'a' * 64 }}"
        hostname: long-target
        container_ip: long-target.guest.test
    expected_inventory_cnames:
      - {name: leased-name, target: leased-node.guest.test}
      - {name: addressed-name, target: addressed-node.example.test}
  tasks:
    - name: Add synthetic hostvars without contacting guests
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        container_ip: "{{ item.container_ip }}"
      loop: "{{ fixture_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Store canonical hostnames as synthetic guest facts
      ansible.builtin.set_fact:
        hostname: "{{ item.hostname }}"
      delegate_to: "{{ item.name }}"
      delegate_facts: true
      loop: "{{ fixture_hosts | selectattr('hostname', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build records with inventory aliases enabled by default
      ansible.builtin.include_role:
        name: technitium_dns
        tasks_from: main/build_records.yml

    - name: Assert leased and addressed targets and exclude occupied or invalid names
      ansible.builtin.assert:
        that:
          - >-
            technitium_dns_inventory_cname_records | sort(attribute='name')
            == expected_inventory_cnames | sort(attribute='name')
          - "{'name': 'addressed-node', 'ip': '192.0.2.10'} in technitium_dns_a_records"
          - "'leased-node' not in (technitium_dns_a_records | map(attribute='name') | list)"
        success_msg: Inventory aliases use canonical targets and preserve existing record owners

    - name: Rebuild records with inventory aliases disabled
      ansible.builtin.include_role:
        name: technitium_dns
        tasks_from: main/build_records.yml
      vars:
        technitium_dns_inventory_name_cnames: false

    - name: Assert disabling aliases clears the generated list
      ansible.builtin.assert:
        that:
          - technitium_dns_inventory_cname_records == []
