---
# Each container also gets one upgrade_wave_<n> group: n is its position in the
# sorted declared container keys, floor-divided by 12 (at most 12 guests per wave).
add_lxc_hosts_groups: >-
  {{
    ['lxc_containers', 'all', 'managed_linux_guests'] +
    (
      ['managed_secrets_group']
      if (
        'managed-secrets' in (item.value.tags | default([])) or
        'openproject' in (item.value.tags | default([]))
      )
      else []
    ) +
    (['docker_group'] if 'docker' in (item.value.tags | default([])) else []) +
    (['pbs_group'] if 'pbs' in (item.value.tags | default([])) else []) +
    (
      ['haproxy_group']
      if ('haproxy' in (item.value.tags | default([]))
          or 'loadbalancer' in (item.value.tags | default([])))
      else []
    ) +
    (
      ['cribl_edge']
      if (
        'edge' in (item.value.tags | default([])) and
        'cribl' in (item.value.tags | default([]))
      )
      else []
    ) +
    (
      ['cribl_stream_group']
      if (
        'stream' in (item.value.tags | default([])) and
        'cribl' in (item.value.tags | default([]))
      )
      else []
    ) +
    (
      ['grafana_group']
      if 'grafana' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['clickhouse_group']
      if 'clickhouse' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['langfuse_group']
      if 'langfuse' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['mailpit_group']
      if 'smtp' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['ntfy_group']
      if 'push' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['mssql_group']
      if 'database' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['postgres_group']
      if 'postgres' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['postgres_ai_group']
      if 'postgres_ai' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['nautobot_group']
      if 'nautobot' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['ai_orchestration_group']
      if 'ai-orchestration' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['llm_router_group']
      if 'llm-router' in (item.value.tags | default([]))
      else []
    ) +
    (['llm_vllm_group'] if 'llm-vllm' in (item.value.tags | default([])) else []) +
    (
      ['llm_gpu_engine_group']
      if (
        'llm-vllm' in (item.value.tags | default([])) or
        (
          (tofu_data | default({})).get('llm_gpu_engine', 'llama_cpp') == 'vllm' and
          (
            item.value.llm_gpu_engine_identity | default('') == 'vllm' or
            (
              'llm-gpu' in (item.value.tags | default([])) and
              not (item.value.llm_gpu_engine_legacy_runtime_managed | default(false))
            )
          )
        )
      )
      else []
    ) +
    (
      ['nvidia_gpu_group']
      if 'nvidia-gpu' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['llm_gpu_classify_group']
      if 'llm-gpu-classify' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['n8n_group']
      if 'n8n' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['docker_ai_group']
      if 'docker-ai' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['apt_cacher_group']
      if 'apt-cache' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['git_mirror_group']
      if 'git-mirror' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['registry_group']
      if 'registry' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['object_storage_group']
      if 'object-storage' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['openbao_group']
      if 'openbao' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['technitium_dns_group']
      if 'dns' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['openproject_group']
      if 'openproject' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['healthchecks_group']
      if 'healthcheck' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['netmon_group']
      if 'netmon' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['unifi_metrics_group']
      if 'unifi_metrics' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['prometheus_group']
      if 'prometheus' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['download_vpn_group']
      if 'vpn' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['sonarr_group']
      if 'sonarr' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['radarr_group']
      if 'radarr' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['plex_group']
      if 'plex' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['seerr_group']
      if 'seerr' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['sortarr_group']
      if 'sortarr' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['immich_group']
      if 'immich' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['homeassistant_group']
      if 'homeassistant' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['phpipam_group']
      if 'ipam' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['traefik_group']
      if 'traefik' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['media_group']
      if 'media' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['idrac_kvm_group']
      if 'idrac' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['vikunja_group']
      if 'vikunja' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['homebox_group']
      if 'homebox' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['homarr_group']
      if 'homarr' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['homepage_group']
      if 'homepage' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['glance_group']
      if 'glance' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['wall_group']
      if 'wall' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['status_group']
      if 'status' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['authelia_group']
      if 'authelia' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['zammad_group']
      if 'zammad' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['static_site_group']
      if 'docs-static' in (item.value.tags | default([]))
      else []
    ) +
    (
      ['upgrade_wave_' ~ ((tofu_data.containers | list | sort(case_sensitive=true)).index(item.key) // 12)]
      if tofu_data is defined and item.key is defined
      else []
    )
  }}
