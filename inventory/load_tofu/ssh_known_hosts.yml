---
- name: Pin reviewed inventory host keys in the wrapper-managed known_hosts
  ansible.builtin.known_hosts:
    path: "{{ ssh_known_hosts_file | default(lookup('env', 'SSH_KNOWN_HOSTS_FILE'), true) }}"
    name: "{{ hostvars[item].ansible_host }}"
    key: "{{ hostvars[item].ansible_host }} {{ hostvars[item].ssh_host_key }}"
    state: present
  loop: "{{ groups['all'] | reject('equalto', 'localhost') | list }}"
  when: hostvars[item].ssh_host_key is defined
  register: ssh_known_hosts_pins
