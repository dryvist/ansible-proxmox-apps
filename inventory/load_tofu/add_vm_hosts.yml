---
- name: Resolve Windows local Administrator password from OpenBao
  # `.values()` is load-bearing: tofu_data.vms is a MAPPING (see the
  # `| dict2items` at the VM inventory task below), so iterating it yields
  # key STRINGS and selectattr then probes a str for .ansible_connection.
  # That raises inside a `when:`, which fails the play outright rather than
  # skipping — it took every converge down, not just the Windows path.
  # `selectattr('ansible_connection', 'defined')` first, because most VMs
  # carry no such key at all.
  when:
    - tofu_data.vms is defined
    - >-
      tofu_data.vms.values() | selectattr('ansible_connection', 'defined')
      | selectattr('ansible_connection', 'equalto', 'winrm')
      | list | length > 0
  no_log: true
  block:
    - name: Log in with the ansible AppRole
      community.hashi_vault.vault_login:
        url: "{{ lookup('env', 'BAO_ADDR') }}"
        auth_method: approle
        role_id: "{{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_ROLE_ID') }}"
        secret_id: "{{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_SECRET_ID') }}"
      register: windows_vdi_openbao_login
      failed_when: false
      # Resolving inventory is a read, so it has to happen under --check too.
      # Skipped here, the credential fact below stays empty and the guard at
      # the end of this block fires with a message about the AppRole policy
      # — which is intact. That made every dry run of site.yml fail.
      check_mode: false

    - name: Read the win11-vdi local Administrator credential
      community.hashi_vault.vault_kv2_get:
        url: "{{ lookup('env', 'BAO_ADDR') }}"
        auth_method: token
        token: "{{ windows_vdi_openbao_login.login.auth.client_token }}"
        engine_mount_point: secret
        path: platform/windows-vdi/win11-admin
      register: windows_vdi_admin_secret
      failed_when: false
      when: windows_vdi_openbao_login.login is defined
      check_mode: false

    # Estate-wide defaults. One object, one key per default, so the next
    # default (a username, a limit, a retention) is a new key here rather than
    # a new secret path, a new policy stanza and a new lookup.
    - name: Read the estate-wide defaults
      community.hashi_vault.vault_kv2_get:
        url: "{{ lookup('env', 'BAO_ADDR') }}"
        auth_method: token
        token: "{{ windows_vdi_openbao_login.login.auth.client_token }}"
        engine_mount_point: secret
        path: platform/defaults
      register: platform_defaults_secret
      failed_when: false
      when: windows_vdi_openbao_login.login is defined
      check_mode: false

    - name: Store the resolved Windows admin credential
      ansible.builtin.set_fact:
        # The estate default first, the per-guest build credential second.
        #
        # These are two different values today and the order matters. The build
        # credential is what Packer bakes into the answer file, so it is what a
        # guest answers to until it has been converged once; roles/windows_baseline
        # then sets the account to the estate default, and from that moment the
        # build credential is rejected. A converged guest therefore authenticates
        # with the default and only a never-converged one falls back — which is
        # the precedence a guest moves through in one direction and never back.
        #
        # The end state is one credential: point the Packer build at the same
        # defaults object and this fallback, the second secret and its grants all
        # go away. Until that lands, dropping the fallback would lock automation
        # out of any freshly built guest.
        windows_vdi_admin_password: >-
          {{ platform_defaults_secret.secret.admin_password
             | default(windows_vdi_admin_secret.secret.password | default(''), true) }}
        # Soft on purpose, unlike the credential above. An unreadable defaults
        # object must not break a converge that only needs to log in — the
        # consumer skips instead, and says so.
        platform_defaults: "{{ platform_defaults_secret.secret | default({}) }}"

    # An empty password here is never benign: it produces a WinRM auth
    # failure at converge time that reads like a broken guest rather than a
    # missing grant. Fail where the cause is visible, but only once the
    # AppRole envs were actually supplied — with no envs at all this is an
    # offline run and staying soft is the documented behaviour above.
    - name: Fail when a WinRM host exists but no password could be resolved
      ansible.builtin.fail:
        msg: >-
          Windows guests are published with ansible_connection=winrm but no
          local Administrator password could be read: neither the estate
          default at secret/platform/defaults nor the build credential at
          secret/platform/windows-vdi/win11-admin resolved. Check that the
          ansible AppRole's policy grants read on those exact paths.
      when:
        - lookup('env', 'OPENBAO_APPROLE_ANSIBLE_ROLE_ID') | length > 0
        - windows_vdi_admin_password | length == 0

- name: Add VMs to inventory (SSH or WinRM connection)
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    # windows_group drives a play built entirely from ansible.windows
    # modules, which only work over WinRM. The `windows` tag alone does not
    # imply that: ansible_connection defaults to "ssh" in the tofu inventory
    # (modules/proxmox-stack/variables-vms.tf), so a tagged guest that has
    # not been given winrm joins the group and then fails every task on a
    # connection that cannot carry them. Gate on the connection, which is
    # the thing the play actually requires.
    # vdi_group is tag-driven, not connection-driven, because it is a policy
    # group: "this guest is a virtual desktop and gets the desktop standard".
    # windows_group above stays connection-driven because it is a capability
    # group — its tasks physically cannot run over anything but WinRM.
    groups: >-
      {{
        ['vms', 'all'] +
        (['windows_group']
         if item.value.ansible_connection | default('ssh') == 'winrm'
         else []) +
        (['vdi_group'] if 'vdi' in (item.value.tags | default([])) else []) +
        (['pbs_group'] if 'pbs' in (item.value.tags | default([])) else [])
      }}
    # Normally the published address. The override exists for ONE situation: a
    # guest that announces a name other than its declared hostname, so the
    # lease table — and therefore DNS — publishes the wrong name and the guest
    # is unreachable at the name the inventory calls it.
    #
    # A freshly cloned Windows guest is always in that state: it inherits the
    # template's computer name and announces that in its DHCP request until
    # something renames it. roles/windows_baseline does the rename, but it has
    # to reach the guest first, and it cannot reach it at a name that does not
    # resolve. This breaks that circle for exactly one converge.
    #
    # Keyed per guest deliberately. A bare `-e ansible_host=...` applies to
    # EVERY host in the run, and `--limit` silently matches nothing here because
    # these hosts are add_host'd rather than coming from a static inventory — so
    # the obvious form would point every other guest at this one and converge
    # the wrong machine under the wrong identity.
    #
    #   -e '{"vm_host_overrides": {"win11-vdi": "win11-tmpl"}}'
    ansible_host: "{{ (vm_host_overrides | default({}))[item.key] | default(item.value.ip) }}"
    ansible_connection: "{{ item.value.ansible_connection }}"
    ansible_user: "{{ 'Administrator' if item.value.ansible_connection == 'winrm' else 'debian' }}"
    ansible_ssh_private_key_file: >-
      {{ lookup('env', 'PROXMOX_SSH_KEY_PATH')
         if item.value.ansible_connection == 'ssh' else omit }}
    ansible_password: >-
      {{ windows_vdi_admin_password | default(omit)
         if item.value.ansible_connection == 'winrm' else omit }}
    # group_vars/all.yml sets ansible_become: true for the Linux estate. On a
    # WinRM host that is not merely useless but fatal — "Become plugin sudo is
    # not supported by the Windows exec wrapper" — and it cannot be undone by a
    # play's `become: false` keyword, because a connection var outranks it.
    # Windows guests never need it, so switch it off per host, here, where the
    # connection is defined.
    ansible_become: "{{ false if item.value.ansible_connection == 'winrm' else omit }}"
    ansible_winrm_transport: "{{ 'basic' if item.value.ansible_connection == 'winrm' else omit }}"
    ansible_winrm_scheme: "{{ 'http' if item.value.ansible_connection == 'winrm' else omit }}"
    ansible_port: "{{ 5985 if item.value.ansible_connection == 'winrm' else omit }}"
    host_tags: "{{ item.value.tags | default([]) }}"
    # Split-tunnel inputs for vdi_local_routes. The gateway is per-guest and
    # must come from the inventory: a VDI guest runs a VPN client that owns
    # the default route, so the guest cannot report its own LAN gateway by
    # the time the routes matter. The destinations are estate-wide.
    vdi_gateway: "{{ item.value.gateway | default('') }}"
    vdi_preserved_cidrs: "{{ tofu_data.vdi_preserved_cidrs | default([]) }}"
    # The whole defaults object, not selected keys: a fact set on localhost is
    # not visible to these hosts, so anything a role needs has to cross here.
    # Passing the object means the next default reaches its consumer without
    # touching this file at all.
    platform_defaults: "{{ platform_defaults | default({}) }}"
  loop: "{{ tofu_data.vms | dict2items }}"
  changed_when: false
  no_log: true
  when:
    - tofu_data.vms is defined
    - tofu_data.vms | length > 0
