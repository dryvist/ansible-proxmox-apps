---
# Push tofu_data (and the derived monitor_targets fact) onto every
# dynamically-added host so roles can access tofu_data.constants.* / the
# monitor target lists directly without hostvars['localhost'] indirection,
# and set the guest hostname fact at the same time (add_host cannot set a
# var literally named `hostname` — see below).
#
# hostvars['localhost'] indirection is NOT a substitute for this loop: every
# host here was created at runtime via add_host, and Ansible cannot resolve
# a group_vars/host_vars value for such a host when that value itself needs
# hostvars() of another host (confirmed empirically — group_vars/all.yml:
# `tofu_data: "{{ hostvars['localhost']['tofu_data'] }}"` resolves for
# localhost but stays undefined for every add_host-created guest, and the
# same expression run as a live task ON that guest resolves fine, isolating
# the failure to hostvars-through-hostvars access for a dynamic host). A
# real per-host fact, written here, is the only mechanism that works.
#
# What IS avoidable is the per-host overhead of doing this in two separate
# looped tasks, and of writing the two heavy facts (tofu_data, monitor_targets)
# to hosts this run never touches. Ansible only ever executes ordinary tasks
# on hosts inside --limit, so a full-fleet copy of the two heavy facts is dead
# weight on every run scoped by --limit. `hostname` is the one exception:
# roles/technitium_dns/tasks/main/build_records.yml and
# roles/openbao_voter_health/templates/openbao-voter-health.sh.j2 both read
# `hostvars[<other host>].hostname` for hosts regardless of the current
# --limit (building DNS records for the whole fleet, checking every voter),
# so hostname alone still has to reach every host in groups['all']. Grepped
# the full tree for `hostvars[...].tofu_data` / `.monitor_targets` and found
# no such cross-host read anywhere — every other consumer reads either its
# own bare `tofu_data`/`monitor_targets` (only meaningful on a host this run
# is itself converging, i.e. already inside --limit) or explicit
# `hostvars['localhost'][...]` (always available without propagation).
- name: Determine which hosts this run's --limit actually targets
  ansible.builtin.set_fact:
    propagate_facts_limited_hosts: >-
      {{ query('inventory_hostnames', ansible_limit | default('all', true))
         | intersect(groups['all']) | list }}

- name: Combine every guest dict for the per-host hostname lookup
  ansible.builtin.set_fact:
    propagate_facts_guests: >-
      {{ (tofu_data.containers | default({}))
         | combine(tofu_data.vms | default({}))
         | combine(tofu_data.docker_vms | default({}))
         | combine(tofu_data.splunk_vm | default({})) }}
  when: tofu_data is defined

# add_host CANNOT set a host var literally named `hostname`: it is an alias
# of add_host's `name` option (aliases: host, hostname) and gets silently
# consumed instead of becoming a hostvar. Consumers of `hostname`
# (technitium_dns A-record builder, *_docker site-URL defaults) therefore
# never saw it — set it as a real per-host fact here instead.
#
# One combined set_fact + delegate_facts loop, not two: every host in
# groups['all'] is written to exactly once instead of twice, halving the
# per-host task overhead that (along with the vars: re-render this task used
# to carry) made this file cost 35-50s per Semaphore run at fleet scale.
# `hostname` is passed through `omit` for a host absent from
# propagate_facts_guests, so it is left unset there exactly as the prior
# `when`-guarded task used to leave it unset. `tofu_data`/`monitor_targets`
# are passed through `omit` for a host outside this run's --limit, so those
# hosts keep every OTHER fact (notably `hostname`, needed fleet-wide by the
# consumers above) but skip the two heavy copies nothing on an out-of-limit
# host will ever read.
- name: Propagate tofu_data, monitor_targets and the hostname fact to every host
  ansible.builtin.set_fact:
    tofu_data: "{{ tofu_data if item in propagate_facts_limited_hosts else omit }}"
    monitor_targets: >-
      {{ monitor_targets if item in propagate_facts_limited_hosts else omit }}
    hostname: >-
      {{ propagate_facts_guests[item].hostname
         if item in propagate_facts_guests else omit }}
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] | reject('equalto', 'localhost') | list }}"
  when: tofu_data is defined
