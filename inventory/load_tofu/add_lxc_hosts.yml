---
- name: Assert Cribl Edge and Stream inventory memberships are disjoint
  ansible.builtin.assert:
    that:
      - >-
        not (
          'cribl' in (item.value.tags | default([])) and
          'edge' in (item.value.tags | default([])) and
          'stream' in (item.value.tags | default([]))
        )
    fail_msg: >-
      {{ item.key }} has conflicting Cribl role tags: a container may belong to
      either cribl_edge or cribl_stream_group, but not both.
  loop: "{{ tofu_data.containers | dict2items }}"
  changed_when: false
  when: tofu_data.containers is defined

# Read live container placement from any commissioned node; the first answer is used.
- name: Read live container placement from the cluster
  ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
  delegate_to: "{{ (item.value.role | default(item.key, true)) ~ '.' ~ tofu_data.domain }}"
  vars:
    ansible_connection: ssh
    ansible_user: root
    ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') }}"
  register: add_lxc_hosts_placement
  loop: "{{ tofu_data.nodes | default({}) | dict2items | selectattr('value.commissioned', 'ne', false) | list }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0
  changed_when: false
  failed_when: false
  ignore_unreachable: true

- name: Map each container vmid to its current node and status
  ansible.builtin.set_fact:
    add_lxc_hosts_live_node: >-
      {{ dict(_lxc | map(attribute='vmid') | map('string') | zip(_lxc | map(attribute='node'))) }}
    add_lxc_hosts_live_status: >-
      {{ dict(_lxc | map(attribute='vmid') | map('string') | zip(_lxc | map(attribute='status'))) }}
  vars:
    _answer: >-
      {{ (add_lxc_hosts_placement.results | default([])
          | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
          | map(attribute='stdout') | first | default('[]')) }}
    _lxc: "{{ _answer | from_json | selectattr('type', 'equalto', 'lxc') | list }}"

- name: Warn when live placement is unavailable
  ansible.builtin.debug:
    msg: >-
      No Proxmox node answered /cluster/resources; LXC containers use their
      declared node.
  when:
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0
    - add_lxc_hosts_live_node | length == 0

# A declared container the cluster reports as not running cannot be reached by
# pct. It is left out of the inventory, and the decision is logged, so its
# plays skip it instead of reporting it unreachable.
- name: Log declared containers skipped because they are not running
  ansible.builtin.debug:
    msg: >-
      Skipping {{ item.key }} (vmid {{ item.value.vmid }}): cluster reports
      status '{{ add_lxc_hosts_live_status[item.value.vmid | string] | default('absent') }}'.
  loop: "{{ tofu_data.containers | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - add_lxc_hosts_live_node | default({}) | length > 0
    - add_lxc_hosts_live_status[item.value.vmid | string] | default('absent') != 'running'

# Fail-safe flip: a container's contract can declare ansible_connection: ssh
# before its sshd (and SSH-CA trust) is actually ready. This probes the port
# directly — zero cost for every container that keeps the default
# proxmox_pct_remote, since the loop is empty unless something declares ssh.
- name: Probe SSH readiness for containers whose contract declares ssh
  ansible.builtin.wait_for:
    host: "{{ item.value.fqdn }}"
    port: 22
    timeout: 5
    state: started
  delegate_to: localhost
  loop: >-
    {{ tofu_data.containers | default({}) | dict2items
       | selectattr('value.ansible_connection', 'equalto', 'ssh') | list }}
  loop_control:
    label: "{{ item.key }}"
  register: add_lxc_hosts_ssh_probe
  ignore_errors: true
  changed_when: false
  when:
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0

# The containers that actually answered — never the ones the contract merely
# declares. add_host below gates on membership here, not on the declared
# ansible_connection alone. selectattr('skipped', 'undefined') comes first: a
# real when-skipped loop item on ansible-core 2.21 carries both `skipped:
# true` and `failed: false`, so it would otherwise pass rejectattr('failed')
# and be wrongly counted as ready — the probe never ran for it.
# selectattr('failed', 'defined') then excludes an item with no 'failed' key
# at all, and rejectattr('failed') alone would crash on that missing
# attribute instead of treating the item as not-ready.
- name: Record which ssh-declared containers actually answered the probe
  ansible.builtin.set_fact:
    add_lxc_hosts_ssh_ready: >-
      {{ add_lxc_hosts_ssh_probe.results | default([])
         | selectattr('skipped', 'undefined')
         | selectattr('failed', 'defined') | rejectattr('failed')
         | map(attribute='item') | map(attribute='key') | list }}
  when: tofu_data.containers is defined

- name: Warn about containers declaring ssh whose sshd did not answer
  ansible.builtin.debug:
    msg: >-
      {{ item.key }} declares ansible_connection=ssh but its host did not
      answer the SSH readiness probe within the timeout — falling back to
      community.proxmox.proxmox_pct_remote for this run. Verify sshd and
      SSH-CA trust before the next converge.
  loop: "{{ tofu_data.containers | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.ansible_connection == 'ssh'
    - item.key not in (add_lxc_hosts_ssh_ready | default([]))

- name: Add LXC containers to inventory (proxmox_pct_remote or ssh connection)
  ansible.builtin.add_host:
    name: "{{ item.key }}"
    groups: >-
      {{
        ['lxc_containers', 'all'] +
        (
          ['haproxy_group']
          if ('haproxy' in (item.value.tags | default([]))
              or 'loadbalancer' in (item.value.tags | default([])))
          else []
        ) +
        (
          ['cribl_edge']
          if (
            'edge' in (item.value.tags | default([])) and
            'cribl' in (item.value.tags | default([]))
          )
          else []
        ) +
        (
          ['cribl_stream_group']
          if (
            'stream' in (item.value.tags | default([])) and
            'cribl' in (item.value.tags | default([]))
          )
          else []
        ) +
        (
          ['grafana_group']
          if 'grafana' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['mailpit_group']
          if 'smtp' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['ntfy_group']
          if 'push' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['mssql_group']
          if 'database' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['postgres_group']
          if 'postgres' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['postgres_ai_group']
          if 'postgres_ai' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['nautobot_group']
          if 'nautobot' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['ai_orchestration_group']
          if 'ai-orchestration' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['llm_router_group']
          if 'llm-router' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['llm_vllm_group']
          if 'llm-vllm' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['n8n_group']
          if 'n8n' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['apt_cacher_group']
          if 'apt-cache' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['registry_group']
          if 'registry' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['object_storage_group']
          if 'object-storage' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['openbao_group']
          if 'openbao' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['technitium_dns_group']
          if 'dns' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['openproject_group']
          if 'openproject' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['healthchecks_group']
          if 'healthcheck' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['netmon_group']
          if 'netmon' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['unifi_metrics_group']
          if 'unifi_metrics' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['prometheus_group']
          if 'prometheus' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['download_vpn_group']
          if 'vpn' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['sonarr_group']
          if 'sonarr' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['radarr_group']
          if 'radarr' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['plex_group']
          if 'plex' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['seerr_group']
          if 'seerr' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['sortarr_group']
          if 'sortarr' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['immich_group']
          if 'immich' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['homeassistant_group']
          if 'homeassistant' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['phpipam_group']
          if 'ipam' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['traefik_group']
          if 'traefik' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['media_group']
          if 'media' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['idrac_kvm_group']
          if 'idrac' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['vikunja_group']
          if 'vikunja' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['homarr_group']
          if 'homarr' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['homepage_group']
          if 'homepage' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['glance_group']
          if 'glance' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['wall_group']
          if 'wall' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['status_group']
          if 'status' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['authelia_group']
          if 'authelia' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['zammad_group']
          if 'zammad' in (item.value.tags | default([]))
          else []
        ) +
        (
          ['static_site_group']
          if 'docs-static' in (item.value.tags | default([]))
          else []
        )
      }}
    # A pct-remote host's own vmid, used by pct-only downstream readers
    # (e.g. connection-plugin diagnostics). An ssh-connection container is
    # reached over plain OpenSSH, never pct, so this fact would be present
    # but meaningless there; omit it rather than publish a vmid a reader
    # could mistake for "this host is reachable via pct".
    proxmox_vmid: "{{ item.value.vmid if not _ssh_ready else omit }}"
    # Per-node management FQDN, DERIVED — never a hand-pinned global host.
    # A guest reaches its own node at {node-role}.{domain}, the same pattern
    # terraform-proxmox ingress.tf uses for the Proxmox-UI apex pool; those
    # names resolve internally while the bare cluster member name does not.
    # The container's `node` field already carries the role form; the
    # nodes-map lookup additionally corrects a legacy bare node key to its
    # role, and falls back to the node value itself when the map omits the
    # key (e.g. the generic test-fixture node key). The node is the one the
    # container is live on when the cluster answered, else the declared one.
    #
    # An ssh-connection container that answered the readiness probe above is
    # reached directly at its OWN fqdn (tofu-proxmox's per-guest DNS name)
    # instead of its node's management FQDN. A container whose contract
    # declares ssh but did NOT answer the probe falls back to this same
    # node-derived branch, on the pct_remote transport below — never left
    # half-flipped onto a transport nothing has confirmed is ready.
    ansible_host: >-
      {{ item.value.fqdn if _ssh_ready else
         ((tofu_data.nodes[_node] | default({})).role
          | default(_node, true) ~ '.' ~ tofu_data.domain) }}
    ansible_connection: >-
      {{ 'ssh' if _ssh_ready else 'community.proxmox.proxmox_pct_remote' }}
    ansible_user: root
    ansible_ssh_private_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_PATH') }}"
    # NOTE: no `hostname:` here — add_host treats it as an alias of `name`
    # and silently consumes it (it never becomes a hostvar). The hostname
    # fact is set for every guest by the propagate task at the bottom.
    # The ONE address fact per guest. A leased guest's `ip` is its FQDN (the
    # lease holds the address and the gateway answers for it); a network or
    # critical guest's `ip` is the static address it declared. There is
    # deliberately no second, address-shaped fact alongside it: the pair used
    # to be `container_ip` + `container_reserved_ip`, and every consumer
    # re-implemented the same "prefer the reservation, else the name" choice.
    # Consumers now just read this.
    container_ip: "{{ item.value.ip }}"
    host_tags: "{{ item.value.tags | default([]) }}"
  vars:
    _node: "{{ add_lxc_hosts_live_node[item.value.vmid | string] | default(item.value.node) }}"
    # The contract declares ssh AND the readiness probe above confirmed it —
    # every ansible_host/ansible_connection/proxmox_vmid branch above reads
    # this one flag rather than the declared ansible_connection directly.
    _ssh_ready: >-
      {{ item.value.ansible_connection == 'ssh' and
         item.key in (add_lxc_hosts_ssh_ready | default([])) }}
  loop: "{{ tofu_data.containers | dict2items }}"
  changed_when: false
  when:
    - tofu_data.containers is defined
    - tofu_data.containers | length > 0
    - >-
      add_lxc_hosts_live_node | length == 0 or
      add_lxc_hosts_live_status[item.value.vmid | string] | default('absent') == 'running'
