---
# =============================================================================
# OPT-IN Nautobot GraphQL dynamic inventory (networktocode.nautobot.gql_inventory)
# =============================================================================
# This is a PARALLEL inventory, NOT a replacement for inventory/load_tofu.yml.
# The default path (inventory/hosts.yml + load_tofu.yml, wired in ansible.cfg)
# is unchanged. Cutting over to Nautobot-sourced inventory is the deliberate
# "migration moment" — it happens later, explicitly, by choosing `-i` (and, at
# that point, enabling this plugin in ansible.cfg). Nothing here is referenced
# by hosts.yml or ansible.cfg.
#
# WHY the groups below mirror load_tofu: so a future `-i inventory/nautobot.yml`
# swap is drop-in — every play in site.yml targets a tag-derived `*_group`, and
# this file reproduces that exact tag -> group mapping from Nautobot device/VM
# tags via the `constructed` `groups` option.
#
# -----------------------------------------------------------------------------
# Credentials (env, injection-agnostic — the plugin's native `env:` fallbacks):
#   NAUTOBOT_URL    - API endpoint, shape https://nautobot.<PROXMOX_DOMAIN>
#   NAUTOBOT_TOKEN  - Nautobot API token with read on dcim/virtualization/tags
# An inventory plugin file cannot Jinja-template a group_var the way group_vars
# can, so the URL is not written here — it comes from NAUTOBOT_URL at runtime.
#
# Token: OpenBao secret/apps/nautobot currently holds SUPERUSER creds. Inventory
# should NOT use those — mint a dedicated read-only API token as a follow-up and
# inject it as NAUTOBOT_TOKEN. Superuser will work in the interim but is wrong.
#
# -----------------------------------------------------------------------------
# Opt-in usage (does NOT touch ansible.cfg — enable the plugin per-invocation):
#
#   NAUTOBOT_URL=https://nautobot.<domain> NAUTOBOT_TOKEN=<ro-token> \
#   ANSIBLE_INVENTORY_ENABLED=networktocode.nautobot.gql_inventory \
#     doppler run -- ansible-playbook -i inventory/nautobot.yml \
#       playbooks/site.yml --limit <group>
#
# At the real cutover, add the plugin to ansible.cfg `enable_plugins` and make
# `-i inventory/nautobot.yml` the default instead of load_tofu.
# =============================================================================
plugin: networktocode.nautobot.gql_inventory

# api_endpoint/token intentionally omitted — resolved from NAUTOBOT_URL /
# NAUTOBOT_TOKEN (the plugin's native env fallbacks). validate_certs stays at
# its default (true): the endpoint is Traefik-fronted with a real certificate.

# Pull name, primary IP (-> ansible_host), and tags (-> grouping) for both
# bare-metal devices and virtual machines; Proxmox guests may be modeled as
# either, so query both and let the tag groups sort them.
#
# dns_name comes back alongside the address because Nautobot's IPAddress is the
# intended writer of DNS intent. Nothing here consumes it yet — the technitium
# reconcile reads it at the authority flip — but querying it now means the
# cutover does not also change the inventory query.
query:
  devices:
    name:
    primary_ip4:
      host:
      dns_name:
    tags: name
  virtual_machines:
    name:
    primary_ip4:
      host:
      dns_name:
    tags: name

# Reproduce load_tofu.yml's tag -> group mapping (including the aliased names:
# tag `smtp` -> mailpit_group, `database` -> mssql_group, `dns` ->
# technitium_dns_group, `vpn` -> download_vpn_group, `ipam` -> phpipam_group).
# Left side is the exact group name a site.yml play targets; right side is the
# Nautobot tag condition.
#
# postgres_ai_group and ai_orchestration_group are listed here despite the AI
# roles having moved to ansible-proxmox-ai: site.yml in THIS repo still targets
# both (the postgres_ai backup play, and the ai_orchestration_group:n8n_group
# ingress selector), so omitting them would drop hosts those plays need.
#
# Coverage against load_tofu.yml is complete except windows_group — see the gap
# note below. Verify with:
#   diff <(ansible-inventory -i inventory/hosts.yml --list --yaml | grep -oE '^  [a-z0-9_]+:') \
#        <(ansible-inventory -i inventory/nautobot.yml --list --yaml | grep -oE '^  [a-z0-9_]+:')
#
# The live plugin returns `tags` as a list of {name: <tag>} mappings, so the
# tag NAMES are composed once into `nautobot_tag_names` and every group
# condition below reads that list.
compose:
  nautobot_tag_names: "tags | default([]) | map(attribute='name') | list"

groups:
  haproxy_group: "'haproxy' in nautobot_tag_names or 'loadbalancer' in nautobot_tag_names"
  cribl_edge: "'edge' in nautobot_tag_names and 'cribl' in nautobot_tag_names"
  cribl_stream_group: "'stream' in nautobot_tag_names and 'cribl' in nautobot_tag_names"
  mailpit_group: "'smtp' in nautobot_tag_names"
  ntfy_group: "'push' in nautobot_tag_names"
  mssql_group: "'database' in nautobot_tag_names"
  postgres_group: "'postgres' in nautobot_tag_names"
  nautobot_group: "'nautobot' in nautobot_tag_names"
  n8n_group: "'n8n' in nautobot_tag_names"
  apt_cacher_group: "'apt-cache' in nautobot_tag_names"
  git_mirror_group: "'git-mirror' in nautobot_tag_names"
  registry_group: "'registry' in nautobot_tag_names"
  object_storage_group: "'object-storage' in nautobot_tag_names"
  openbao_group: "'openbao' in nautobot_tag_names"
  technitium_dns_group: "'dns' in nautobot_tag_names"
  openproject_group: "'openproject' in nautobot_tag_names"
  healthchecks_group: "'healthcheck' in nautobot_tag_names"
  netmon_group: "'netmon' in nautobot_tag_names"
  unifi_metrics_group: "'unifi_metrics' in nautobot_tag_names"
  prometheus_group: "'prometheus' in nautobot_tag_names"
  download_vpn_group: "'vpn' in nautobot_tag_names"
  sonarr_group: "'sonarr' in nautobot_tag_names"
  radarr_group: "'radarr' in nautobot_tag_names"
  plex_group: "'plex' in nautobot_tag_names"
  seerr_group: "'seerr' in nautobot_tag_names"
  sortarr_group: "'sortarr' in nautobot_tag_names"
  immich_group: "'immich' in nautobot_tag_names"
  homeassistant_group: "'homeassistant' in nautobot_tag_names"
  phpipam_group: "'ipam' in nautobot_tag_names"
  traefik_group: "'traefik' in nautobot_tag_names"
  media_group: "'media' in nautobot_tag_names"
  idrac_kvm_group: "'idrac' in nautobot_tag_names"
  vikunja_group: "'vikunja' in nautobot_tag_names"
  homarr_group: "'homarr' in nautobot_tag_names"
  homepage_group: "'homepage' in nautobot_tag_names"
  glance_group: "'glance' in nautobot_tag_names"
  wall_group: "'wall' in nautobot_tag_names"
  status_group: "'status' in nautobot_tag_names"
  zammad_group: "'zammad' in nautobot_tag_names"
  static_site_group: "'docs-static' in nautobot_tag_names"
  postgres_ai_group: "'postgres_ai' in nautobot_tag_names"
  ai_orchestration_group: "'ai-orchestration' in nautobot_tag_names"
  authelia_group: "'authelia' in nautobot_tag_names"

# KNOWN GAP — windows_group is NOT reproduced here, and cannot be from tags.
#
# load_tofu.yml derives it from a guest property rather than a tag:
#   ['windows_group'] if item.value.ansible_connection == 'winrm'
# There is no corresponding Nautobot tag, so no `groups` expression over `tags`
# can recreate it. site.yml targets windows_group, so this file is NOT yet at
# full parity and must not be made the default inventory until it is.
#
# Closing it needs one of, decided before cutover rather than here:
#   * query `platform: name` and group on the platform being a Windows one —
#     preferred, since Nautobot already models platform as first-class, but it
#     requires the seed jobs to populate platform, which they currently do not;
#   * have ssot_virtualization write a `windows` tag derived from the same
#     ansible_connection value — cheaper, but encodes a connection detail as a
#     tag, which is what the platform field exists to avoid.
