# LLM router fleet — base-infra overrides (llm_router_group).
#
# The role itself (AI-application config: model registry, budgets, the
# LiteLLM systemd unit) lives in ansible-proxmox-ai; this file carries only
# what the base-infra roles in THIS repo need to treat the group specially.
#
# ansible-proxmox-ai's llm_router role now ships its own dedicated syslog
# route (index=llm, sourcetype=litellm:proxy) ahead of this repo's
# syslog_forwarder catch-all and stops there, so a program-specific route to
# the shared AI ingest port here is unreachable and has been removed.
