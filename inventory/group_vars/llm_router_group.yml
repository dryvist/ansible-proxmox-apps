---
# LLM router fleet — base-infra overrides (llm_router_group).
#
# The role itself (AI-application config: model registry, budgets, the
# LiteLLM systemd unit) lives in ansible-proxmox-ai; this file carries only
# what the base-infra roles in THIS repo need to treat the group specially.

# Ship the LiteLLM router logs to the homelab_llm AI ingest listener
# (-> Cribl Stream ai_stamp -> Splunk index=llm) instead of the linux/os
# catch-all. $programname 'litellm' verified locally via
# `journalctl -o verbose -u litellm | grep _COMM`. Port from tofu constants
# ai_log_routing (mandatory: the route has been live since before this file
# existed, so a missing key means the inventory is stale, not that the port
# predates the map).
#
# This var previously lived here and was dropped when the AI roles split out
# to ansible-proxmox-ai (#996) — the syslog_forwarder role that consumes it
# stayed in this repo, but this group_vars file did not come back with it, so
# the dedicated route silently stopped rendering. litellm's own request lines
# still reach Splunk via the linux/os catch-all (index=os_ai), just without
# the index=llm landing zone this route provides.
syslog_forwarder_program_routes:
  - program: litellm
    port: >-
      {{ tofu_data.constants.ai_log_routing.homelab_llm.port
         | mandatory('ai_log_routing.homelab_llm.port missing from tofu constants') }}
