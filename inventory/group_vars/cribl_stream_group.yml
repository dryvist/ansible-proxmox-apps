---
systemd_restart_policy_services:
  - cribl

# Cribl Stream containers have the `outbound-internal` firewall group applied
# (RFC1918 only), so they cannot reach cdn.cribl.io directly. Serve the
# tarball from the object-storage (RustFS) artifact store, at a key carrying
# the version so a pin bump can never silently reuse a stale object (no
# build hash in the key -- see roles/cribl_stream/tasks/mirror_seed.yml,
# which is the only place that hash gets resolved). Cribl Edge reads this
# exact same key (inventory/group_vars/cribl_edge.yml); the mirror_seed.yml
# task seeds it once for both.
cribl_stream_tarball_url: >-
  http://{{ tofu_data.containers['s3'].ip }}:{{
  tofu_data.constants.service_ports.object_storage_s3 }}/splunk-addons/infra/cribl-{{
  cribl_stream_version }}-linux-x64.tgz

# Langfuse project keypair for the langfuse_otlp output — bao-first with an env
# fallback, the same shape as zammad_group.yml. Canonical home is the
# ai/langfuse KV path (local-llm domain), fetched by the openbao_secrets
# pre-play, which lists cribl_stream_group among its hosts. On a host where
# that domain is not fetched, bao_local_llm_secrets is {} and the env fallback
# resolves it. `lookup('env', ...)` returns "" (not undefined) when unset, so
# `default(undef(), true)` is what actually aborts the converge — naming the
# missing key — instead of templating an empty credential.
cribl_stream_langfuse_public_key: >-
  {{ bao_local_llm_secrets.LANGFUSE_PUBLIC_KEY
     | default(lookup('env', 'LANGFUSE_PUBLIC_KEY'), true)
     | default(undef(), true)
     | mandatory('LANGFUSE_PUBLIC_KEY unset: seed ai/langfuse in OpenBao (local-llm domain) or set the env var') }}
cribl_stream_langfuse_secret_key: >-
  {{ bao_local_llm_secrets.LANGFUSE_SECRET_KEY
     | default(lookup('env', 'LANGFUSE_SECRET_KEY'), true)
     | default(undef(), true)
     | mandatory('LANGFUSE_SECRET_KEY unset: seed ai/langfuse in OpenBao (local-llm domain) or set the env var') }}

# VictoriaMetrics remote_write — the guest FQDN (apex zone) + service_ports
# constant, never a guest IP. The port is internal-only (no Traefik), so the
# ingress subdomain name, which resolves to the ingress VIP, cannot reach it.
cribl_stream_victoriametrics_rw_url: >-
  http://{{ grafana_hostname }}.{{ tofu_data.domain
     | mandatory('tofu_data.domain required for victoriametrics_rw') }}:{{
       tofu_data.constants.service_ports.victoriametrics
       | mandatory('tofu_data.constants.service_ports.victoriametrics missing')
     }}/api/v1/write

# Phoenix ingest API key for the phoenix_otlp output — same bao-first/env
# fallback shape and the same guard as the Langfuse pair above. Canonical home
# is the ai/phoenix KV path (local-llm domain), seeded after the Phoenix guest's
# first boot (ansible-proxmox-ai roles/phoenix_docker).
cribl_stream_phoenix_api_key: >-
  {{ bao_local_llm_secrets.PHOENIX_INGEST_API_KEY
     | default(lookup('env', 'PHOENIX_INGEST_API_KEY'), true)
     | default(undef(), true)
     | mandatory('PHOENIX_INGEST_API_KEY unset: seed ai/phoenix in OpenBao (local-llm domain) or set the env var') }}

# Management API (:9000) local admin credential — vendor ships admin/admin
# until rotated. Generated at source by
# openbao_generated_app_secrets.cribl-stream (secret/apps/cribl-stream,
# field cribl_admin_password), read here bao-first with an env fallback — same
# shape as the Langfuse/Phoenix pairs above. On the first converge after this
# lands, apps/cribl-stream does not exist yet (optional prefetch), so
# bao_apps_secrets.cribl_admin_password is undefined and this falls to the env
# var; a second converge, after the generation play seeds OpenBao, picks up the
# bao value. roles/cribl_stream tasks/rotate_admin_password.yml applies it and
# stops rotating once the vendor default no longer authenticates.
cribl_stream_admin_password: >-
  {{ bao_apps_secrets.cribl_admin_password
     | default(lookup('env', 'CRIBL_ADMIN_PASSWORD'), true)
     | default(undef(), true)
     | mandatory('CRIBL_ADMIN_PASSWORD unset: seed apps/cribl-stream in OpenBao or set the env var') }}

# unpoller's Prometheus /metrics port. Single source of truth for BOTH roles
# that run on this host group: roles/unpoller binds its listener to this
# port, roles/cribl_stream's in_unpoller scraper (defaults/main/
# 30-workers-metrics.yml, cribl_stream_unpoller_scrape_target) reads it
# directly. Lives here, in group_vars, rather than in either role's own
# defaults/main.yml, because the cribl_stream play runs before the unpoller
# play (playbooks/site/02-dns-and-pipeline.yml) and a role's own defaults are
# not visible to a different role's tasks -- group_vars is the only scope
# both plays share.
unpoller_metrics_port: 9130

# Splunk-volume allow-list for the prometheus_to_netmon pipeline's leading
# drop (splunk_hec leg of the prometheus_rw input only). Overrides the
# role default (roles/cribl_stream/defaults/main/30-workers-metrics.yml)
# with the full live job set — also passing the PVE/guest host-metrics
# jobs, which the same pipeline splits into index=host_metrics. The
# victoriametrics_rw leg on the same input carries no such filter, so
# VictoriaMetrics receives every job regardless of this list.
cribl_stream_prometheus_splunk_keep_jobs:
  - blackbox_.*
  - smokeping
  - pve_node_exporter
  - guest_node_exporter
  - gatus
  - traefik
  - llm_router
  - llama_server
  - github_exporter
  - arc_listener
  - openbao
