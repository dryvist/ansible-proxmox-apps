---
# seerr group variables.

# SQLite backups (sqlite_backup role). Directory literal, not the role's own
# `seerr_config_dir` — that role's defaults are out of scope in group_vars, the
# same reason download_vpn_group.yml states its log path literally. It is the
# persistent app-config mount, so the backups written here inherit the storage
# layer's existing snapshot + off-node replication with no transport of their own.
# The database sits one level down from the settings file, which is what the
# role's default scan depth is for.
sqlite_backup_dirs:
  - /opt/seerr/config
