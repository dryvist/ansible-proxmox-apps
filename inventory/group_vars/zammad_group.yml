---
# Zammad ITSM/ticketing + knowledge base — the incident-management system of
# record. tofu-derived FQDNs/ports plus OpenBao-sourced secrets (apps
# domain). OpenBao is the only source: each secret ends in
# `| default(undef(), true) | mandatory(...)`, so an absent or empty value
# aborts the play instead of being rendered over a live credential. Mirrors
# the nautobot_group.yml shape (shared-Postgres app on the
# apps VLAN). The heavy app layer stays enabled here; molecule disables it via
# zammad_manage_app.

# Web port from the published constants (service_ports.zammad_web, 8080 — nginx
# in-guest). Falls back to 8080 when the published inventory predates that key.
zammad_web_port: >-
  {{ (hostvars['localhost']['tofu_data']['constants']['service_ports']['zammad_web'])
     | default(8080) }}

# Postgres has no ingress; reach it by the shared apps cluster's declared
# primary FQDN. A guest hostname is a stable service identifier here, not a
# hard-coded address.
zammad_db_host: >-
  {{ postgres_apps_primary_host }}.{{ hostvars['localhost']['tofu_data']['domain'] }}
zammad_db_password: >-
  {{ bao_apps_secrets.zammad_db_password
     | default(undef(), true)
     | mandatory('ZAMMAD_DB_PASSWORD missing: OpenBao fetch did not supply it') }}

# Admin password from secret/apps/zammad.
zammad_admin_password: >-
  {{ bao_apps_secrets.zammad_admin_password
     | default(undef(), true)
     | mandatory('ZAMMAD_ADMIN_PASSWORD missing: OpenBao fetch did not supply it') }}

# Public UI FQDN (Traefik-fronted): zammad.<ingress subdomain>, matching the
# Traefik router base domain and wildcard certificate from PROXMOX_SUBDOMAIN.
# `lookup('env', …)` returns "" (not undefined) when unset; `or undef()` (empty
# string is falsy) is what actually fails the play when PROXMOX_SUBDOMAIN is
# missing, matching the nautobot_group.yml pattern.
zammad_ui_fqdn: >-
  zammad.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
     or undef('PROXMOX_SUBDOMAIN is required for the Zammad UI FQDN') }}

# API token seeded into Zammad for the Hermes agent. Its canonical home is
# ai/hermes (local-llm domain) so ONE token feeds both the seeding side here
# and the Hermes skill env. The local-llm domain is fetched for every run
# (openbao_secrets fails the play when it cannot be), so an unresolved value
# here is an error, not a cue to fall back.
zammad_hermes_api_token: >-
  {{ bao_local_llm_secrets.ZAMMAD_API_TOKEN
     | default(undef(), true)
     | mandatory('ZAMMAD_API_TOKEN missing: OpenBao fetch did not supply it') }}

# Bearer token for the LiteLLM router (Hermes' brain front door) that Zammad's
# AI provider authenticates with. Canonical home is ai/llm's LLM_ROUTER_MASTER_KEY
# (local-llm domain) — the SAME key Hermes/n8n use — mirroring
# zammad_hermes_api_token, and required rather than falling back.
zammad_ai_provider_token: >-
  {{ bao_local_llm_secrets.LLM_ROUTER_MASTER_KEY
     | default(undef(), true)
     | mandatory('LLM_ROUTER_MASTER_KEY missing: OpenBao fetch did not supply it') }}

# API token for the interactive-AI service account (Claude Code / Codex
# sessions — a separate Zammad user from both hermes and the human admin, so
# the activity stream attributes writes to the real actor). Canonical home is
# apps/zammad alongside the other Zammad secrets.
zammad_ai_api_token: >-
  {{ bao_apps_secrets.zammad_ai_api_token
     | default(undef(), true)
     | mandatory('ZAMMAD_AI_API_TOKEN missing: OpenBao fetch did not supply it') }}

# Outbound notification email relays through the existing Mailpit LXC (SMTP on
# notification_ports.mailpit_smtp). Reached by its guest FQDN — no auth, no TLS
# on the internal relay. Notifications land in the Mailpit web UI, not real mail.
zammad_smtp_host: "mailpit.{{ hostvars['localhost']['tofu_data']['domain'] }}"
zammad_smtp_port: >-
  {{ (hostvars['localhost']['tofu_data']['constants']['notification_ports']['mailpit_smtp'])
     | default(1025) }}

# Robust auto-restart (#17046). Zammad returned 502 through the apps-tier outage
# (nginx up, backend down) and did not self-recover after Postgres came back.
# `zammad` is the packager.io control unit the role starts/restarts; wiring it
# into systemd_restart_policy applies the widened StartLimitIntervalSec/Burst +
# Restart=on-failure drop-in so a backend blip no longer exhausts the restart
# budget and leaves the app dead.
systemd_restart_policy_services:
  - zammad
