---
# Shared native PostgreSQL (issue #138) — backs Nautobot now, Vikunja/EspoCRM
# later. Secrets resolve bao-first (apps domain) with an env fallback; the
# listener is narrowed to the guest's live data-VLAN address.

# listen_addresses is intentionally NOT overridden here — see the role
# default (roles/postgres/defaults/main.yml) for why this cluster listens on
# the wildcard instead of the guest's discovered address.

# Which member of this cluster is the streaming primary. The scoped apps-tier
# authority in group_vars/all.yml is shared with every client, so a normal
# converge cannot point the applications at a different member than the
# replication role declares primary.
#
# That was the live state until 2026-07-29: postgres-apps was a streaming
# primary with an active `standby_postgres` slot feeding the `postgres` guest,
# and none of it was expressed in IaC. A converge or a rebuild would have
# produced two primaries.
postgres_primary_host: "{{ postgres_apps_primary_host }}"

# Databases on this shared cluster. Each password is bao-first
# (secret/apps/<app>) with an env fallback; each client_cidr is the app LXC's
# subnet sourced from the runtime secret store (NETWORK_CIDR_APPS) — the only
# place a CIDR literal is legitimate (pg_hba cannot take an FQDN) and even then
# it is env-derived, not hard-coded.
#
# ADDING AN ENTRY — the env fallback is load-bearing, not decoration. The
# postgres role REFUSES to converge when any managed role resolves an empty
# password, and this play runs BEFORE the play that generates missing app
# secrets. So a new entry whose secret has never been generated fails this
# play on the first run after merge — and because every other app's database
# lives in the same play, it takes them down with it. Add an entry only when
# its password already resolves: either its secret exists, or the env fallback
# is already carried in the converge environment. Do not weaken the assert.
postgres_managed_databases:
  - name: nautobot
    user: nautobot
    password: >-
      {{ bao_apps_secrets.db_password
         | default(lookup('env', 'NAUTOBOT_DB_PASSWORD'), true) }}
    client_cidr: "{{ lookup('env', 'NETWORK_CIDR_APPS') | default('', true) }}"
  - name: vikunja
    user: vikunja
    password: >-
      {{ bao_apps_secrets.vikunja_db_password
         | default(lookup('env', 'VIKUNJA_DB_PASSWORD'), true) }}
    client_cidr: "{{ lookup('env', 'NETWORK_CIDR_APPS') | default('', true) }}"
  - name: zammad
    user: zammad
    password: >-
      {{ bao_apps_secrets.zammad_db_password
         | default(lookup('env', 'ZAMMAD_DB_PASSWORD'), true) }}
    client_cidr: "{{ lookup('env', 'NETWORK_CIDR_APPS') | default('', true) }}"
  # Workflow engine. Its guest sits on the ai subnet rather than the apps one,
  # so its client_cidr differs from its siblings above — still env-derived, and
  # still the one place a CIDR literal would be legitimate at all. Moving it
  # here is what gives its workflow, credential, and execution data the
  # cluster's pgBackRest/WAL/PITR and nightly-dump coverage; a database beside
  # the app has none of that.
  - name: n8n
    user: n8n
    password: >-
      {{ bao_apps_secrets.n8n_db_password
         | default(lookup('env', 'N8N_DB_PASSWORD'), true) }}
    client_cidr: "{{ lookup('env', 'NETWORK_CIDR_AI') | default('', true) }}"
