---
# Grafana — OpenBao-sourced secrets, mirroring homarr_group.yml.
#
# The client secret is generated once in OpenBao and shared with Authelia,
# which registers the matching client (ansible-proxmox-apps roles/authelia) —
# see openbao/defaults/main/01-kv-hierarchy-and-rbac.yml's authelia list.
# There is no env fallback: an absent OR empty value aborts the play. The
# `default(undef(), true)` before `mandatory()` is load-bearing — mandatory
# raises only on undefined, never on an empty string.

grafana_stack_oidc_client_secret: >-
  {{ bao_apps_secrets.authelia_oidc_grafana_client_secret
     | default(undef(), true)
     | mandatory('GRAFANA_OIDC_CLIENT_SECRET missing: OpenBao fetch did not supply it') }}
