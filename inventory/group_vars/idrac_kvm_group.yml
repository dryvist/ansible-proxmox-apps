---
# The secrets collection merges the apps domain flat. Target-prefixed field
# names preserve each target's values without collisions.
idrac_kvm_docker_targets:
  - name: r410
    enabled: false
    host_port: 5410
    compose_prefix: IDRAC_R410
    host: "{{ bao_apps_secrets.idrac_kvm_r410_host | default('', true) }}"
    user: "{{ bao_apps_secrets.idrac_kvm_r410_user | default('', true) }}"
    password: "{{ bao_apps_secrets.idrac_kvm_r410_password | default('', true) }}"
  - name: r710
    enabled: false
    host_port: 5710
    compose_prefix: IDRAC_R710
    host: "{{ bao_apps_secrets.idrac_kvm_r710_host | default('', true) }}"
    user: "{{ bao_apps_secrets.idrac_kvm_r710_user | default('', true) }}"
    password: "{{ bao_apps_secrets.idrac_kvm_r710_password | default('', true) }}"
