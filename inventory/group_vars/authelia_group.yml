---
# Authelia — phone-approved OpenBao elevation clients.
#
# Registers the bao-elevate device-authorization clients. The role fails the
# converge unless AUTHELIA_APPROVE_NETWORKS is set and the trusted client
# secret exists in OpenBao, so this flag never renders a half-configured client.

# On: the converge renders the clients and asserts its required inputs.
authelia_bao_elevation_enabled: true
