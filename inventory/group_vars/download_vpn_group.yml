---
node_exporter_listen_address: >-
  {{ ansible_facts.interfaces | default([])
     | reject('match', '^(lo$|wg|docker|br-|veth|tun|tap|virbr)')
     | map('extract', ansible_facts) | selectattr('ipv4.address', 'defined')
     | map(attribute='ipv4.address') | first
     | mandatory('download_vpn_group requires an IPv4 address on its LAN interface') }}
