---
# Rotator slides appended after MC1-MC5 (roles/wall). One entry per extra
# page; URL composed the same way dashboard_catalog builds a route URL
# (roles/dashboard_catalog/tasks/main.yml: hostname ~ '.' ~ base_domain,
# base_domain = PROXMOX_SUBDOMAIN) — never a literal domain or IP.
#
# The estate's one Glance instance now has two pages: "Services" (the default
# path) and "Network + Media" (roles/glance defaults: glance_network_media_slug
# — kept a literal string here, not a cross-role reference, for the same
# reason dashboard_catalog's own comment gives: a role default is only in
# scope inside its own role).
wall_slides:
  - name: GLANCE
    url: "https://glance.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
  - name: GLANCE B
    url: "https://glance.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/network-media"
