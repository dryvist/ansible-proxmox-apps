---
# UniFi Insights secrets and controller address (apps domain). Each value is
# seeded in OpenBao and prefetched into bao_apps_secrets; the role never
# creates or rotates them.
unifi_insights_docker_postgres_password: >-
  {{ bao_apps_secrets.unifi_insights_postgres_password
     | default(undef(), true)
     | mandatory('UNIFI_INSIGHTS_POSTGRES_PASSWORD missing: OpenBao fetch did not supply it') }}

unifi_insights_docker_secret_key: >-
  {{ bao_apps_secrets.unifi_insights_secret_key
     | default(undef(), true)
     | mandatory('UNIFI_INSIGHTS_SECRET_KEY missing: OpenBao fetch did not supply it') }}

# Controller address, the same value the unpoller role reads.
unifi_insights_docker_unifi_host: >-
  {{ bao_apps_secrets.UNIFI_API
     | default(undef(), true)
     | mandatory('UNIFI_API missing: OpenBao fetch did not supply the UniFi controller address') }}

# Optional. Empty leaves UNIFI_API_KEY out of the container environment; a
# read-only key seeded later turns it on.
unifi_insights_docker_unifi_api_key: "{{ bao_apps_secrets.unifi_insights_unifi_api_key | default('', true) }}"
