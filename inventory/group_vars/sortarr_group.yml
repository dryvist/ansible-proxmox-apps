# sortarr group variables.

# No SQLite backups here, deliberately. This app keeps no database: its data
# directory holds an env file, JSON caches it rebuilds from the APIs it reads,
# and secret files written by the converge. Enrolling it made the backup job
# fail every run with "no databases matched" — correct behaviour from a job
# whose whole purpose is to notice when it has nothing to back up, pointed at a
# host that was never going to have any. Leaving `sqlite_backup_dirs` unset
# makes the role inert here, which is how membership is meant to be expressed.
#
# Do not answer a recurrence by letting the backup script tolerate an empty
# match: that check is the only thing standing between a silently empty backup
# and the apps that really do have databases.
