---
# Workflow engine — OpenBao-sourced secrets (apps domain). OpenBao is the only source: each secret ends in
# `| default(undef(), true) | mandatory(...)`, so an absent or empty value
# aborts the play instead of being rendered over a live credential.
# Mirrors vikunja_group.yml / zammad_group.yml.
#
# Both fields are app-namespaced (n8n_*) so the flat merge into bao_apps_secrets
# never collides with a sibling app's bare field name.
#
# The encryption key is the ONE exception to the no-fallback rule: empty is a
# supported state there (the role reads the guest's existing key file and
# asserts a non-empty result), so it keeps its env fallback.

# Login for this app's role on the shared cluster. It MUST match the postgres
# side (postgres_managed_databases reads the same bao_apps_secrets.n8n_db_password),
# so both ends resolve one canonical value. Generated at source in the secret
# store, never hand-typed.
n8n_docker_db_password: >-
  {{ bao_apps_secrets.n8n_db_password
     | default(undef(), true)
     | mandatory('N8N_DB_PASSWORD missing: OpenBao fetch did not supply it') }}

# The credential-encryption key. PROMOTED into the secret store, never
# generated: it is the only thing that can decrypt the credentials already
# stored in this app's database. A database backup without it restores
# workflows whose every credential is permanently unrecoverable — and does so
# without any error, which is the whole reason it belongs in the secret store
# rather than only in a root-only file on the guest beside the data it unlocks.
#
# Empty here (secret store unavailable AND no env value) does NOT silently
# become a fresh key: the role falls back to the guest's existing file and
# asserts a non-empty result before deploying.
n8n_docker_encryption_key: >-
  {{ bao_apps_secrets.n8n_encryption_key
     | default(lookup('env', 'N8N_ENCRYPTION_KEY'), true) }}

# The shared cluster has no ingress; reach it by the primary guest's FQDN.
# Tracks the shared postgres_primary_host switch (group_vars/all): unset -> the
# stable `postgres` name; set to the apps-tier primary -> that name. A guest
# hostname is a stable service identifier here, not a hard-coded address.
#
# Without this, this app alone keeps the role default while its siblings follow
# the switch — and a cutover reinitializes that guest as a read-only standby,
# so its writes would fail against it.
n8n_docker_db_host: >-
  {{ (postgres_primary_host if (postgres_primary_host | default('', true) | length > 0) else 'postgres')
     }}.{{ hostvars['localhost']['tofu_data']['domain'] }}
