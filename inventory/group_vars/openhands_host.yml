---
# ZCode Web stays off for this group; the dispatcher and ci-resolver keep their
# false role defaults.
agent_sandbox_zcode_web_enabled: false

# Per-conversation containers run on Docker's default bridge and reach the
# allowlisting proxy through the published default-bridge path, via the
# `host.docker.internal` host alias Docker maps to the bridge gateway.
agent_sandbox_default_bridge_proxy_enabled: true
openhands_egress_proxy_url: "http://host.docker.internal:{{ agent_sandbox_proxy_port }}"

# Destinations the default-bridge containers may reach through the proxy, on
# top of the role's static list: the router and Vikunja endpoints, plus the
# build-cache hosts derived from the inventory-published cache URLs.
agent_sandbox_extra_egress_domains:
  - "llm.{{ ingress_domain }}"
  - "vikunja.{{ ingress_domain }}"
  - "{{ hostvars.get('localhost', {}).get('tofu_data', {})
       .get('cache_proxy_urls', {}).get('npm_cache', [])
       | first | default('', true) | urlsplit('hostname') }}"
  - "{{ hostvars.get('localhost', {}).get('tofu_data', {})
       .get('cache_proxy_urls', {}).get('pypi_cache', [])
       | first | default('', true) | urlsplit('hostname') }}"
