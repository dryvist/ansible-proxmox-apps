---
# ZCode Web stays off for this group; the dispatcher and ci-resolver keep their
# false role defaults.
agent_sandbox_zcode_web_enabled: false

agent_sandbox_default_bridge_proxy_enabled: true

# Domains this group adds to the proxy allowlist.
agent_sandbox_extra_egress_domains:
  - "llm.{{ ingress_domain }}"
  - "vikunja.{{ ingress_domain }}"
  - "{{ hostvars.get('localhost', {}).get('tofu_data', {}).get('cache_proxy_urls', {}).get('npm_cache', [])
       | first | default('', true) | urlsplit('hostname') }}"
  - "{{ hostvars.get('localhost', {}).get('tofu_data', {}).get('cache_proxy_urls', {}).get('pypi_cache', [])
       | first | default('', true) | urlsplit('hostname') }}"

# Launcher key agent. The AppRole secret-zero and the store address come from
# the same sources the GitHub runner uses. The role reads only these
# openhands_* names, never the platform variables directly.
openhands_approle_role_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_OPENHANDS_ROLE_ID'] | default('', true) }}
openhands_approle_secret_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_OPENHANDS_SECRET_ID'] | default('', true) }}
openhands_store_subdomain: "{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
openhands_store_addr: "https://openbao.{{ openhands_store_subdomain }}"
# The same release pin the GitHub runner and the git mirror use.
openhands_store_version: "{{ openbao_client_version }}"
# The release asset comes through the site's raw cache, which mirrors GitHub
# releases, so this host never fetches from a public source.
openhands_store_deb_url: >-
  {{ openhands_raw_cache_url.rstrip('/') }}/github_releases/openbao/openbao/releases/download/v{{
  openhands_store_version }}/openbao_{{ openhands_store_version }}_linux_amd64.deb
