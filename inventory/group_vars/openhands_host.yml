---
# ZCode Web stays off for this group; the dispatcher and ci-resolver keep their
# false role defaults.
agent_sandbox_zcode_web_enabled: false

agent_sandbox_default_bridge_proxy_enabled: true

# Domains this group adds to the proxy allowlist.
agent_sandbox_extra_egress_domains:
  - "llm.{{ ingress_domain }}"
  - "vikunja.{{ ingress_domain }}"
  - "{{ hostvars.get('localhost', {}).get('tofu_data', {}).get('cache_proxy_urls', {}).get('npm_cache', [])
       | first | default('', true) | urlsplit('hostname') }}"
  - "{{ hostvars.get('localhost', {}).get('tofu_data', {}).get('cache_proxy_urls', {}).get('pypi_cache', [])
       | first | default('', true) | urlsplit('hostname') }}"

# The scoped router key the OpenHands agents authenticate with, from the flat
# apps merge (dryvist.secrets_management/roles/openbao
# openbao_generated_app_secrets.openhands -> secret/apps/openhands). Empty
# until seeded: the role's service assert names the missing key when
# openhands_service_enabled turns the services on, and nothing reads this var
# while they stay off.
openhands_router_key: "{{ bao_apps_secrets.openhands_router_key | default('', true) }}"
