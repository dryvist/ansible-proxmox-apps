---
systemd_restart_policy_services:
  - apt-cacher-ng

# Listen port from the published constants (service_ports.raw_cache), the port
# the firewall opens and the cache URLs name. Falls back to 8081 when the
# published inventory predates that key.
raw_cache_port: >-
  {{ (hostvars['localhost']['tofu_data']['constants']['service_ports']['raw_cache'])
     | default(8081) }}
