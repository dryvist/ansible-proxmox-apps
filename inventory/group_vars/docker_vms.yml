---
# Docker VM connection settings
#
# No ansible_ssh_private_key_file override. These guests trust the SSH client
# CA (below) and log in as `debian`, whose permitted principal is the one the
# run wrapper's certificate carries, so they authenticate on the same minted
# certificate as every other SSH-reached guest. A dedicated static key here
# was never minted by the wrapper, so it resolved to whatever path the
# environment supplied and could not work on an unattended runner.

# Trust the OpenBao SSH client CA on this VM class (ssh-certificate-authority
# ADR). Additive + lockout-guarded; pinned SSH_CA_FINGERPRINT verified
# fail-closed. See inventory/group_vars/vms.yml — same rollout.
ssh_ca_trust_rollout_enabled: true

# GitHub Actions self-hosted runners — ONE org-level pool, not per-repo.
#
# The replica count is PER HOST, and it is the cap on that host's dockerd.
# Molecule and E2E test containers are created through the bind-mounted
# docker.sock, so they are SIBLINGS on that daemon, not children of the
# runner's cgroup — the runner's own cpu/mem ceiling does not constrain them.
# Each CI guest has its own dockerd, so each needs its own number; this value
# is the default and hosts override it in host_vars.
#
# Per-repo registrations were the defect this replaced. A repo-scoped runner
# serves only its own repo, so each repo's cap held while the SUM did not:
# several public consumers held seven slots on one host that carried about
# two, and pushing branches to several repos at once starved scenarios mid-run.
#
# To raise throughput, grow the guest first, then raise its number. Do not
# raise it to buy speed on an unchanged host — that is the original bug.
#
# There is no repository list here. Runners register to the organization and
# sit in GitHub's Default runner group. Its policy grants all repositories
# access and allows public repositories — GitHub otherwise excludes public
# repositories from organization runner groups. Do not commit a selected-repo
# allowlist; it would either leak private inventory or rot as new repositories
# need CI.
# Workflows still must not send fork PRs to these runners (the org CI gate
# already forces ubuntu-latest for forks) because the fleet bind-mounts
# docker.sock.
# Guests placed on the execution-plane host (Semaphore/Terrakube), never a
# GitHub runner target per operator decision — a plane host's own workload
# competes with anything a job on it might build or test, and a runner
# outage there would take the plane down with it. Extend this list, never a
# node name, if a future guest lands on that same host; host_vars/<name>.yml
# is where each listed host's github_runner_replicas is actually set to 0
# (tests/inventory_load/verify_inventory.yml asserts it stays that way).
github_runner_plane_hosts:
  - iac-platform

github_runner_org: "dryvist"
github_runner_replicas: 3
# Every runner carries the union of every label any consumer job asks for, so
# any runner can serve any job. A specialised label would recreate the
# fragmentation the pool exists to remove: `terraform` (tofu-proxmox
# servarr-config-drift) and `terrakube` (tofu-github).
github_runner_labels: "self-hosted,Linux,X64,proxmox,terraform,terrakube"
# The Default group is the sole X64 pool.  Its GitHub-side policy allows all
# organization repositories and public repositories; keep repository names out
# of this public inventory.
github_runner_group: "Default"

# Docker data disk. /var/lib/docker gets its own filesystem on the guest's
# second block device, so the image and build cache cannot fill the boot disk
# and take every job on the host down with ENOSPC.
#
# By-id, never a kernel name: /dev/sdX is assigned in discovery order and moves
# between reboots, and the role formats whatever this points at. The role
# refuses to run against a device carrying a partition table or another
# filesystem, and refuses a value that is not a /dev/disk/by-* path.
#
# This is the first data disk on the guests' SCSI controller. A guest without
# one fails this play loudly — give it the disk, do not remove the variable.
github_runner_data_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1"

# Ship the runner fleet's _diag log files (github_runner role, bind-mounted
# per pooled slot) to the same syslog pipeline as everything else on this
# host. One wildcard input covers every slot regardless of replica count --
# no per-slot entry to maintain here when github_runner_replicas changes.
# Directory wildcards need rsyslog >= 8.25.0 (Debian bookworm ships newer);
# metadata (which file a line came from) is on by default for a wildcard
# input, so the slot number in the path is not lost even with one shared tag.
#
# Keep this path in sync with github_runner_diag_host_dir
# (roles/github_runner/defaults/main.yml) -- the two roles converge in
# different plays (syslog_forwarder before github_runner), so neither can
# read the other's default at render time and there is no single place left
# to define it once.
syslog_forwarder_imfile_inputs:
  - file: /var/lib/docker/github-runner-diag/*/*.log
    tag: github-runner-diag
