---
# Docker VM connection settings
# docker-host uses a dedicated SSH key separate from the Proxmox host key
ansible_ssh_private_key_file: >-
  {{ lookup('env', 'PROXMOX_DKR_SSH_KEY_PATH')
  | mandatory('PROXMOX_DKR_SSH_KEY_PATH environment variable is required') }}

# Trust the OpenBao SSH client CA on this VM class (ssh-certificate-authority
# ADR). Additive + lockout-guarded; pinned SSH_CA_FINGERPRINT verified
# fail-closed. See inventory/group_vars/vms.yml — same rollout.
ssh_ca_trust_rollout_enabled: true

# GitHub Actions self-hosted runners — multi-repo configuration
# Each entry generates a Compose service with its own replicas.
# docker-host VM (250): 4 CPU, 8GB RAM — per-container limits are ceilings.
github_runner_repositories:
  # Molecule scenarios here create privileged systemd containers through the
  # bind-mounted docker.sock. Those are SIBLINGS on the shared dockerd, not
  # children of the runner's cgroup, so the runner's cpu/mem ceiling does not
  # constrain them. On a 4 CPU / 8 GB host, three concurrent scenarios — one of
  # which runs SQL Server — exhaust it and the kernel kills containers mid-run.
  # Two bounds the peak; the workflow's max-parallel bounds it within one run.
  - repo: "dryvist/ansible-proxmox-apps"
    replicas: 2
    labels: "self-hosted,Linux,X64,proxmox"
  # Repo was renamed terraform-proxmox -> tofu-proxmox. The runner-registration
  # endpoint does not follow GitHub's rename redirect (404s), unlike the rest
  # of the REST API — so this must carry the current name.
  - repo: "dryvist/tofu-proxmox"
    replicas: 1
    labels: "self-hosted,Linux,X64,proxmox,terraform"
  - repo: "dryvist/ansible-splunk"
    replicas: 1
    labels: "self-hosted,Linux,X64,proxmox"
  - repo: "dryvist/ansible-proxmox"
    replicas: 2
    labels: "self-hosted,Linux,X64,proxmox"
  # tofu-github triggers remote Terrakube plan/apply (LAN-only platform);
  # the runner just needs outbound reach to terrakube-api.<domain>.
  - repo: "dryvist/tofu-github"
    replicas: 1
    labels: "self-hosted,Linux,X64,proxmox,terrakube"
