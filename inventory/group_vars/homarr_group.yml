---
# Homarr dashboard — OpenBao-sourced secrets, mirroring vikunja_group.yml /
# n8n_group.yml.
#
# Two domains are in play here, which is unusual and deliberate:
#   - `apps`  carries each instance's own credentials (secret/apps/<hostname>),
#     which the role generates and publishes on first converge. Field names
#     carry the instance prefix (homarr_secret_prefix: `homarr` for the first
#     instance, `homarr_v2` for homarr-v2) because the prefetch merges every
#     apps path into one flat map.
#   - `media` carries the API keys of the services Homarr integrates WITH. They
#     are owned by the media-stack repo; Homarr only reads them. Never copy one into
#     the apps domain — one credential, one home.
#
# Each secret below ends in `| default(undef(), true) | mandatory(...)`: there
# is no env fallback, and an absent OR empty value aborts the play instead of
# being rendered over a live credential. `| mandatory()` on its own would not
# fire on an empty string — it raises only on undefined — which is why the
# `default(undef(), true)` in front of it is load-bearing.
#
# The API key and encryption key (role-minted), the four media integration
# keys and the two Proxmox fields below are the exceptions: empty is a
# supported state. The integration still renders, and
# Homarr's own rejection names the missing credential.

homarr_admin_password: >-
  {{ bao_apps_secrets[homarr_secret_prefix ~ '_admin_password']
     | default(undef(), true)
     | mandatory(homarr_secret_prefix ~ '_admin_password missing: OpenBao fetch did not supply it') }}

# The role mints these two and publishes them back, so empty is the normal
# state before a guest's first converge: the role then falls back to the key
# file / env file on the guest, or mints one (roles/homarr tasks/configure.yml
# and files/homarr_api.py).
homarr_api_key: "{{ bao_apps_secrets[homarr_secret_prefix ~ '_api_key'] | default('', true) }}"
homarr_encryption_key: "{{ bao_apps_secrets[homarr_secret_prefix ~ '_encryption_key'] | default('', true) }}"

# --- SSO (Authelia OIDC) -------------------------------------------------------
# The client secret is generated once in OpenBao and shared with Authelia,
# which registers the matching client (dryvist.secrets_management/roles/authelia) —
# see openbao_generated_app_secrets.authelia. Same bao-first/env-fallback shape
# as every other secret in this file, just read from a different app's path
# since the secret's home is Authelia, not Homarr.
homarr_oidc_issuer: "https://{{ authelia_hostname }}.{{ ingress_domain }}"
homarr_oidc_client_secret: >-
  {{ bao_apps_secrets['authelia_oidc_' ~ homarr_secret_prefix ~ '_client_secret']
     | default(undef(), true)
     | mandatory('authelia_oidc_' ~ homarr_secret_prefix ~ '_client_secret missing: OpenBao fetch did not supply it') }}

# --- Credentials of the integrated services (read-only, owned elsewhere) ------
# Field names are the UPPERCASE ones the media-stack repo already publishes under
# secret/apps/media/<app>; they are app-namespaced, so the flat merge into
# bao_media_secrets cannot collide.

# Empty is supported for all four: each integration still renders, and Homarr
# rejects it by name until its key exists. One rule, no per-app exception.
homarr_sonarr_api_key: "{{ bao_media_secrets.SONARR_API_KEY | default('', true) }}"
homarr_radarr_api_key: "{{ bao_media_secrets.RADARR_API_KEY | default('', true) }}"
homarr_seerr_api_key: "{{ bao_media_secrets.SEERR_API_KEY | default('', true) }}"
homarr_plex_token: "{{ bao_media_secrets.PLEX_TOKEN | default('', true) }}"

# The two Proxmox fields below are the exception to the no-fallback rule above:
# empty is a SUPPORTED state (the integration renders and Homarr rejects it),
# not a lost credential, so they keep their env fallback and are not mandatory.
#
# Proxmox is a SEPARATE, audit-scoped token minted for Homarr alone — never the
# Terraform provider's write-capable credential, because Homarr copies every
# secret it is handed into its own SQLite. Every Homarr instance shares this one
# token: the fields keep their unprefixed names on purpose.
homarr_proxmox_token_id: >-
  {{ bao_apps_secrets.homarr_proxmox_token_id
     | default(lookup('env', 'HOMARR_PROXMOX_TOKEN_ID'), true) }}

homarr_proxmox_token_secret: >-
  {{ bao_apps_secrets.homarr_proxmox_token_secret
     | default(lookup('env', 'HOMARR_PROXMOX_TOKEN_SECRET'), true) }}

# Public Proxmox CA certificate for Homarr v2's trusted-certificate store.
# It is distributed by the PVE token role in the same app bucket.
homarr_proxmox_ca: "{{ bao_apps_secrets.homarr_proxmox_ca | default('', true) }}"
