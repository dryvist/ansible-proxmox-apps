---
# Homarr dashboard — bao-first secrets with an env fallback, mirroring
# vikunja_group.yml / n8n_group.yml.
#
# Two domains are in play here, which is unusual and deliberate:
#   - `apps`  carries Homarr's own credentials (secret/apps/homarr), which this
#     role generates and publishes on first converge.
#   - `media` carries the API keys of the services Homarr integrates WITH. They
#     are owned by ansible-servarr; Homarr only reads them. Never copy one into
#     the apps domain — one credential, one home.
#
# The `| default(x, true)` second argument is mandatory: without it an empty
# string satisfies the default and the fallback never fires.

homarr_admin_password: >-
  {{ bao_apps_secrets.homarr_admin_password
     | default(lookup('env', 'HOMARR_ADMIN_PASSWORD'), true) }}

homarr_api_key: >-
  {{ bao_apps_secrets.homarr_api_key
     | default(lookup('env', 'HOMARR_API_KEY'), true) }}

homarr_encryption_key: >-
  {{ bao_apps_secrets.homarr_encryption_key
     | default(lookup('env', 'HOMARR_ENCRYPTION_KEY'), true) }}

# --- SSO (Authelia OIDC) -------------------------------------------------------
# The client secret is generated once in OpenBao and shared with Authelia,
# which registers the matching client (ansible-proxmox-apps roles/authelia) —
# see openbao_generated_app_secrets.authelia. Same bao-first/env-fallback shape
# as every other secret in this file, just read from a different app's path
# since the secret's home is Authelia, not Homarr.
homarr_oidc_issuer: "https://authelia.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
homarr_oidc_client_secret: >-
  {{ bao_apps_secrets.authelia_oidc_homarr_client_secret
     | default(lookup('env', 'HOMARR_OIDC_CLIENT_SECRET'), true) }}

# --- Credentials of the integrated services (read-only, owned elsewhere) ------
# Field names are the UPPERCASE ones ansible-servarr already publishes under
# secret/apps/media/<app>; they are app-namespaced, so the flat merge into
# bao_media_secrets cannot collide.

homarr_sonarr_api_key: >-
  {{ bao_media_secrets.SONARR_API_KEY
     | default(lookup('env', 'SONARR_API_KEY'), true) }}

homarr_radarr_api_key: >-
  {{ bao_media_secrets.RADARR_API_KEY
     | default(lookup('env', 'RADARR_API_KEY'), true) }}

homarr_seerr_api_key: >-
  {{ bao_media_secrets.SEERR_API_KEY
     | default(lookup('env', 'SEERR_API_KEY'), true) }}

homarr_plex_token: >-
  {{ bao_media_secrets.PLEX_TOKEN
     | default(lookup('env', 'PLEX_TOKEN'), true) }}

# Proxmox is a SEPARATE, audit-scoped token minted for Homarr alone — never the
# Terraform provider's write-capable credential, because Homarr copies every
# secret it is handed into its own SQLite. Absent = the integration is skipped.
homarr_proxmox_token_id: >-
  {{ bao_apps_secrets.homarr_proxmox_token_id
     | default(lookup('env', 'HOMARR_PROXMOX_TOKEN_ID'), true) }}

homarr_proxmox_token_secret: >-
  {{ bao_apps_secrets.homarr_proxmox_token_secret
     | default(lookup('env', 'HOMARR_PROXMOX_TOKEN_SECRET'), true) }}
