---
# plex group variables
systemd_restart_policy_services:
  - plexmediaserver

# Deliberately NOT wired into the sqlite_backup role, unlike its siblings in the
# media stack. Its library database is roughly an order of magnitude larger than
# every other media app's combined, and the app already writes its own scheduled
# database backup into the same persistent app-config mount — which the storage
# layer's snapshot + off-node replication then carries. A second full copy on
# the same cadence would roughly double the footprint of the largest database in
# the stack to duplicate protection that already exists.
#
# What this DOES depend on is that scheduled task actually being enabled in the
# app's own settings. That is a live-state check, not something this file can
# assert — verify it rather than assuming it.
