---
# Nautobot IPAM/DCIM (issue #138). tofu-derived FQDNs/ports plus
# OpenBao-sourced secrets (apps domain). OpenBao is the only source: each secret ends in
# `| default(undef(), true) | mandatory(...)`, so an absent or empty value
# aborts the play instead of being rendered over a live credential. The heavy app layer stays enabled here; molecule
# disables it separately.

# Web port from the published constants (WS-C adds service_ports.nautobot_web,
# 8080). Falls back to 8080 when the published inventory predates that key.
nautobot_web_port: >-
  {{ (hostvars['localhost']['tofu_data']['constants']['service_ports']['nautobot_web'])
     | default(8080) }}

# Postgres has no ingress; reach it by the shared apps cluster's declared
# primary FQDN. A guest hostname is a stable service identifier here, not a
# hard-coded address.
nautobot_db_host: >-
  {{ postgres_apps_primary_host }}.{{ hostvars['localhost']['tofu_data']['domain'] }}
nautobot_db_password: >-
  {{ bao_apps_secrets.db_password
     | default(undef(), true)
     | mandatory('NAUTOBOT_DB_PASSWORD missing: OpenBao fetch did not supply it') }}

# Public UI FQDN (Traefik-fronted): nautobot.<ingress subdomain>, matching the
# Traefik router base domain and wildcard certificate from PROXMOX_SUBDOMAIN.
# The guest zone stays available for east-west service discovery only.
# `lookup('env', …)` returns "" (not undefined) when unset, and `| mandatory`
# does NOT fire on an empty string — so `or undef()` (empty string is falsy)
# is what actually fails the play when PROXMOX_SUBDOMAIN is missing (#840 review).
nautobot_ui_fqdn: >-
  nautobot.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
     or undef('PROXMOX_SUBDOMAIN is required for the Nautobot UI FQDN') }}

# SECRET_KEY + superuser password from secret/apps/nautobot.
nautobot_secret_key: >-
  {{ bao_apps_secrets.secret_key
     | default(undef(), true)
     | mandatory('NAUTOBOT_SECRET_KEY missing: OpenBao fetch did not supply it') }}
nautobot_superuser_password: >-
  {{ bao_apps_secrets.superuser_password
     | default(undef(), true)
     | mandatory('NAUTOBOT_SUPERUSER_PASSWORD missing: OpenBao fetch did not supply it') }}

# Export artifact target — the object-store bucket the published Ansible
# inventory already lives in, which the sibling IaC repo declares as a plain
# committed default. It is a bucket name, not a credential, so it is declared
# rather than sourced from the environment; the environment only overrides it.
#
# The default is what keeps absence from resolving to an empty string: an empty
# bucket renders into the runtime EnvironmentFile exactly like a real one, so
# the converge stays green and only the next scheduled export fails.
nautobot_export_s3_bucket: >-
  {{ lookup('env', 'NAUTOBOT_EXPORT_S3_BUCKET')
     | default(nautobot_export_s3_bucket_default, true) }}

# Collection flows stay disabled until their switches are set explicitly.
nautobot_collection_curated_components: []
nautobot_collection_pve_components: []
nautobot_collection_plan_only: true

# Secret source metadata is kept here so each path and field has one owner.
nautobot_collection_read_token_secret:
  path: apps/nautobot/pipeline
  field: pipeline_ro_token
nautobot_collection_write_token_secret:
  path: apps/nautobot/sync-write
  field: sync_write_token
nautobot_collection_app_secret:
  path: apps/nautobot
  fields:
    nautobot_url: inventory_url
    pve_token_id: nautobot_proxmox_token_id
    pve_token_secret: nautobot_proxmox_token_secret
    pve_ca: nautobot_proxmox_ca

# The published inventory's node map is keyed by stable node identity. Missing
# commissioned flags mean commissioned, matching the inventory contract.
nautobot_collection_pve_api_url: >-
  {{
    'https://'
    ~ (
        (
          (
            tofu_data.nodes
            | dict2items
            | selectattr('value.commissioned', 'undefined')
            | list
          )
          +
          (
            tofu_data.nodes
            | dict2items
            | selectattr('value.commissioned', 'equalto', true)
            | list
          )
        )
        | sort(attribute='key')
        | first
        | default(undef(hint='No commissioned node exists in tofu_data.nodes'))
      ).value.role
    ~ '.'
    ~ tofu_data.domain
    ~ ':8006'
  }}

# Curated inputs intentionally have no implicit source data.
nautobot_collection_racks: []
nautobot_collection_devices: []
nautobot_collection_hardware_devices: []
nautobot_collection_hardware_modules: []
nautobot_collection_wan_circuits: []
nautobot_collection_vlans: []
nautobot_collection_prefixes: []
nautobot_collection_reservations: []

# Saved GraphQL query the export renders, defined by the collection's Bootstrap data.
nautobot_collection_export_query_name: nautobot-export

# Drift events post to the Cribl Stream HEC input (same listener the Grafana
# alert path uses); the drift role appends /services/collector/event. The token
# is the Cribl input's own drift token and stays empty until it is provisioned,
# which makes the drift playbook fail closed.
nautobot_collection_drift_hec_url: "http://syslog.{{ ingress_domain }}:{{ cribl_hec_input_port }}"
nautobot_collection_drift_hec_token: "{{ lookup('env', 'NAUTOBOT_DRIFT_HEC_TOKEN') }}"

# Source inventory keys that hold guests, and the source domains Nautobot has no
# models for; the drift event lists the latter.
nautobot_collection_drift_source_groups:
  - containers
  - vms
  - docker_vms
  - splunk_vm
nautobot_collection_drift_unmodelled_domains:
  - firewall groups/rules
  - DNS records
  - WLANs
  - port profiles/port-forwards
  - static + traffic routes
  - RADIUS
  - VPN
  - cables
  - physical device interfaces
