---
# OpenBao — Authelia-issued elevation logins (auth/authelia, elevate-* roles).
#
# The converge fails unless OPENBAO_AUTHELIA_ISSUER_URL, OPENBAO_ELEVATE_SUBJECT
# and the workstation CIDR class are set, so this flag never configures the
# auth method half-way.

# On: the converge configures auth/authelia and asserts its required inputs.
openbao_authelia_elevation_enabled: true
