---
# Vikunja task management (issue #141) — OpenBao-sourced secrets (apps
# domain). OpenBao is the only source: each secret ends in
# `| default(undef(), true) | mandatory(...)`, so an absent or empty value
# aborts the play instead of being rendered over a live credential. Mirrors
# nautobot_group.yml / zammad_group.yml. Only the fields
# with a home in secret/apps/vikunja (the openbao_promoted_app_secrets.vikunja promotion map)
# are wired bao-first here. As of the apps-tier cutover (#17039) all three of the
# role's required secrets — vikunja_db_password, vikunja_jwt_secret,
# vikunja_admin_password — have a bao home and are wired to it below.
#
# The database password is app-namespaced (vikunja_db_password) so the flat merge
# into bao_apps_secrets never collides with Nautobot's bare db_password. It MUST
# match the postgres side (postgres_managed_databases reads the same
# bao_apps_secrets.vikunja_db_password), so both ends resolve one canonical value.
# An unfetched apps domain fails the openbao_secrets pre-play, so it can no
# longer reach this line as an empty value.
vikunja_db_password: >-
  {{ bao_apps_secrets.vikunja_db_password
     | default(undef(), true)
     | mandatory('VIKUNJA_DB_PASSWORD missing: OpenBao fetch did not supply it') }}

# JWT signing secret + initial admin password bao-first (secret/apps/vikunja
# fields vikunja_jwt_secret / vikunja_admin_password, promoted via
# openbao_promoted_app_secrets.vikunja). App-namespaced so the flat merge into
# bao_apps_secrets never collides with a sibling app's bare field name. The
# role's secrets-assert requires all three; seeding these two closes the
# half-migrated gap that blocked converge (#17039). The JWT secret is a stable
# value promoted from the live guest, NOT regenerated — rotating it would
# invalidate every issued session/API token.
vikunja_jwt_secret: >-
  {{ bao_apps_secrets.vikunja_jwt_secret
     | default(undef(), true)
     | mandatory('VIKUNJA_JWT_SECRET missing: OpenBao fetch did not supply it') }}
vikunja_admin_password: >-
  {{ bao_apps_secrets.vikunja_admin_password
     | default(undef(), true)
     | mandatory('VIKUNJA_ADMIN_PASSWORD missing: OpenBao fetch did not supply it') }}

# Postgres has no ingress; reach it by the shared apps cluster's declared
# primary FQDN. A guest hostname is a stable service identifier here, not a
# hard-coded address.
vikunja_db_host: >-
  {{ postgres_apps_primary_host }}.{{ hostvars['localhost']['tofu_data']['domain'] }}

# MCP service-account passwords bao-first (secret/apps/vikunja fields
# svc_mcp_ro_password / svc_mcp_rw_password). Redefines the role-default list so
# the accounts the role creates and the tokens the MCP mint step later issues
# resolve the same canonical password. Usernames match the role defaults.
vikunja_service_users:
  - username: svc-mcp-ro
    password: >-
      {{ bao_apps_secrets.svc_mcp_ro_password
         | default(undef(), true)
         | mandatory('VIKUNJA_SVC_MCP_RO_PASSWORD missing: OpenBao fetch did not supply it') }}
  - username: svc-mcp-rw
    password: >-
      {{ bao_apps_secrets.svc_mcp_rw_password
         | default(undef(), true)
         | mandatory('VIKUNJA_SVC_MCP_RW_PASSWORD missing: OpenBao fetch did not supply it') }}

# Robust auto-restart (#17046). The vikunja.service unit already carries
# Restart=on-failure inline, but with systemd's default start-rate limiter it
# gave up during the apps-tier backend outage and stayed dead after Postgres
# recovered. Wiring the service into systemd_restart_policy adds the widened
# StartLimitIntervalSec/Burst drop-in so it keeps retrying until the backend
# returns and self-heals after a blip.
systemd_restart_policy_services:
  - vikunja
