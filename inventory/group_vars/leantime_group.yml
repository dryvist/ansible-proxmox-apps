---
# Leantime project management — OpenBao-sourced secrets (apps domain), mirroring
# vikunja_group.yml. Each secret ends in `| default(undef(), true) | mandatory(...)`,
# so an absent or empty value aborts the play instead of rendering over live
# config. `default(undef(), true)` is load-bearing: mandatory raises only on
# undefined, never on an empty string.
#
# The database and session secrets are app-namespaced (leantime_db_password,
# leantime_session_password) so the flat merge into bao_apps_secrets never
# collides with a sibling app. The OIDC client secret lives under its Authelia
# name: Authelia registers the matching client, the same arrangement grafana uses.
leantime_db_password: >-
  {{ bao_apps_secrets.leantime_db_password
     | default(undef(), true)
     | mandatory('LEANTIME_DB_PASSWORD missing: OpenBao fetch did not supply it') }}
leantime_session_password: >-
  {{ bao_apps_secrets.leantime_session_password
     | default(undef(), true)
     | mandatory('LEANTIME_SESSION_PASSWORD missing: OpenBao fetch did not supply it') }}
leantime_oidc_client_secret: >-
  {{ bao_apps_secrets.authelia_oidc_leantime_client_secret
     | default(undef(), true)
     | mandatory('LEANTIME_OIDC_CLIENT_SECRET missing: OpenBao fetch did not supply it') }}
