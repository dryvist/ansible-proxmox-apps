---
# Server-room wall release pins, read by roles/wall. One org-wide var per
# upstream repo so every consumer moves together; Renovate proposes bumps.
#
# Lives in group_vars/all/ (the `all` group) so it applies to every host,
# exactly as these vars did when they sat inline in all.yml.
# renovate: datasource=github-releases depName=dryvist/homelab-wall
homelab_wall_version: "latest"
# renovate: datasource=github-releases depName=dryvist/homelab-wall-feed
homelab_wall_feed_version: "latest"

# The ONE list of pages the wall rotates through after MC1-MC5 (roles/wall
# config.json.j2), and the source of both kiosk bypasses. The wall embeds each
# page in an iframe, and Authelia's login/denial response sets
# X-Frame-Options: DENY, so a gated page renders blank. Authelia
# (authelia_wall_kiosk_domains) and Traefik (traefik_wall_kiosk_route_names)
# therefore skip the gate for exactly these routes, for the kiosk clients' own
# /32s only (WALL_KIOSK_CLIENTS); every other client still logs in.
#
# `route` is the Traefik route name. The URL is derived:
# https://<route>.<ingress_domain><path>.
wall_slides:
  # Glance ships no auth of its own; outside the kiosk bypass its route stays
  # SSO-gated.
  - name: GLANCE
    route: glance
  # The second Homarr guest's public kiosk board (inventory/host_vars/homarr-v2.yml).
  - name: HOMARR
    route: homarr-v2
    path: "/boards/{{ homarr_wall_board }}"
  # UniFi Insights (roles/unifi_insights_docker). The app's own login is off; the
  # Authelia-gated route is the only login, and the kiosk route is IP-scoped.
  - name: UNIFI INSIGHTS
    route: unifi-insights
wall_kiosk_route_names: "{{ ['wall'] + wall_slides | map(attribute='route') | list }}"
homarr_wall_board: wall
