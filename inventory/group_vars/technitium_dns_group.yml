---
# Technitium DNS overrides for the technitium_dns_group.

# Guest hostnames retired for good: their A records are deleted from the zone so
# they stop resolving to addresses no longer in service. The record-add path is
# add/overwrite-only and never removes a name, so a name only stops resolving
# once it is listed here. Bare hostnames only. A name being rebuilt under the
# SAME hostname is refreshed by the overwrite path and must NOT be listed here.
technitium_dns_retired_records:
  - hermes-infer
  - hermes-chat
  - claude-code-01
  - claude-code-02
  - gemini-01
  - gemini-02

# Neutral capability name for the heavy-tier serving gate on the Studio:
# llm-large.<zone> -> the machine's own cert-covered hostname (verbatim FQDN
# target; the router pool dials this name with the gate bearer). The Studio's
# name lives at the APEX (parent of the guest zone), so derive it from
# PROXMOX_SUBDOMAIN — PROXMOX_DOMAIN holds the guest zone in this environment.
# The Studio host itself comes from `llm_large_serving_host` (all.yml single
# source), never a literal repeated here.
technitium_dns_extra_cname_records:
  - name: llm-large
    # An external LLM_LARGE_RUNNER_HOST is already a full FQDN — use it verbatim.
    # Otherwise build the local record from the single-source short host + apex.
    target: >-
      {{ lookup('env', 'LLM_LARGE_RUNNER_HOST')
      or (llm_large_serving_host ~ '.' ~ (lookup('env', 'PROXMOX_SUBDOMAIN')
      | mandatory('PROXMOX_SUBDOMAIN required')
      | split('.', 1) | last)) }}

# Heavy-tier serving host reservation. Hostname + IP come from the
# `llm_large_serving_*` single source in all.yml, which now reads
# tofu-proxmox's published constants.serving rather than a value committed in
# this repository — so the reservation is described in exactly one place across
# the whole estate, not once per repository. This publishes the apex A record
# the router chain resolves.
#
# A LOCAL host with no address is a defect, not a configuration: it would write
# a hostname the router dials with nothing behind it. The empty-IP case is only
# legitimate for an EXTERNAL runner host (see all.yml), which is why the guard
# below is conditional rather than absolute.
#
# cribl-stream-01: INC-17123 band-aid. Guest FQDNs are built from the bare apex
# domain (tofu_data.domain), but the automatic per-guest record builder in the
# technitium_dns role only ever writes into the PROXMOX_SUBDOMAIN child zone —
# Technitium is separately authoritative for the apex too, so an unlisted apex
# name hard-NXDOMAINs there instead of falling through anywhere. This publishes
# cribl-stream-01 directly at the apex via the same escape hatch as the Mac
# Studio above. IP comes from the live tofu reservation, not a literal, so it
# tracks any future re-IP automatically. The underlying domain-naming mismatch
# (every guest using bare-apex FQDNs is exposed to the same gap) is tracked
# separately — see ansible-proxmox-apps issue (INC-17123 follow-up). Its IP keeps
# default('') so an incomplete inventory during a rebuild (cribl-stream-01 not yet
# loaded) yields a blank IP the writer's truthy filter skips, instead of an
# undefined-var error that aborts the play (#17136).
# Out-of-band management (BMC) addresses, as `<node>=<address>` pairs from the
# PROXMOX_BMC_ADDRESSES single source. A BMC vends its own default hostname from
# the CHASSIS MODEL or the vendor service tag, so the only names that resolve to
# one identify the metal, not the node running on it — aiming a power or console
# action by node name is then pure inference, and inferring it wrongly power-cycled
# a live node (Zammad #17188). Publishing `idrac-<node>` gives that name.
#
# Env-sourced, never literals: this repo is public and a BMC address is the
# privileged out-of-band interface. Unset env yields an empty map, hence no
# records — the writer's truthy filter skips a blank IP, so a node whose BMC is
# absent (consumer boards have none) simply contributes nothing.
#
# regex_replace collapses whitespace around `=` before the split, so the
# natural operator spelling `<node> = <address>` yields a clean key/value
# instead of a record name with an embedded space the API would reject.
technitium_dns_bmc_addresses: >-
  {{ dict(lookup('env', 'PROXMOX_BMC_ADDRESSES') | default('', true)
     | split(',') | map('trim') | reject('equalto', '')
     | map('regex_replace', '\s*=\s*', '=') | map('split', '=') | list) }}

technitium_dns_extra_a_records: >-
  {{ [
       {'name': llm_large_serving_host, 'ip': llm_large_serving_ip},
       {'name': 'cribl-stream-01',
        'ip': hostvars['cribl-stream-01'].container_ip | default('', true),
        'zone': technitium_dns_apex_domain},
     ]
     + (dict(technitium_dns_bmc_addresses.keys() | map('regex_replace', '^', 'idrac-')
             | zip(technitium_dns_bmc_addresses.values()))
        | dict2items(key_name='name', value_name='ip')) }}
