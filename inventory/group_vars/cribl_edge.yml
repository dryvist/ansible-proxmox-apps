---
systemd_restart_policy_services:
  - cribl-edge

# Cribl Edge containers have the `outbound-internal` firewall group applied
# (RFC1918 only), so they cannot reach cdn.cribl.io directly. Serve the
# tarball from the object-storage (RustFS) artifact store, reusing the same
# anonymous-read `splunk-addons` bucket already populated for Splunk, at the
# same versioned key cribl_stream_group.yml reads (Edge and Stream ship the
# same x64 tarball). Staged by roles/object_storage/tasks/infra_mirrors.yml
# under a key derived from the shared catalog version.
cribl_edge_tarball_url: >-
  http://{{ tofu_data.containers['s3'].ip }}:{{
  tofu_data.constants.service_ports.object_storage_s3 }}/splunk-addons/infra/cribl-{{
  cribl_version }}-linux-x64.tgz

# Same bucket, same anonymous-read pattern, for the dryvist.homelab.cribl_packs
# role: playbooks/sync-cribl-packs.yml mirrors every dryvist/cc-* pack release
# here and publishes cribl-packs/manifest.json; the role installs by NAME from
# that manifest, never a literal version or GitHub URL.
cribl_packs_object_storage_base_url: >-
  http://{{ tofu_data.containers['s3'].ip }}:{{
  tofu_data.constants.service_ports.object_storage_s3 }}/splunk-addons/cribl-packs

# UniFi IPS/IDS -> Slack #security-ids + Zammad "Security IDS", straight from
# this Edge (homelab-contracts cribl_edge cribl_edge_unifi_ids_*; pack
# cc-edge-internal-unifi-ids). Stays unrendered until the pack is deployed and
# the webhook is seeded at secrets-external/platform/slack-webhooks key
# security-ids -- the same store the ntfy hub's per-topic webhooks live in.
cribl_edge_unifi_ids_pack_deployed: false
cribl_edge_unifi_ids_slack_webhook: "{{ bao_ntfy_secrets['security-ids'] | default('', true) }}"
cribl_edge_unifi_ids_zammad_url: "https://zammad.{{ ingress_domain }}/api/v1/tickets"
cribl_edge_unifi_ids_zammad_token: "{{ bao_apps_secrets.zammad_cribl_api_token | default('', true) }}"
