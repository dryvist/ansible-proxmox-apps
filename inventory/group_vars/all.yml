---
# Global variables for all hosts

# System
ansible_become: true
ansible_become_method: sudo

# Shared media request-quality default. Define the profile name once so every
# media consumer uses the same existing *arr profile.
media_default_quality_profile: "HD - 720p/1080p"

# NTP: point at the self-hosted Proxmox stratum-2 servers when Doppler
# provides PROXMOX_NTP_SERVERS (comma-separated bare IPs/hostnames).
# The regex_replace appends "iburst" to entries that contain no spaces
# (i.e., bare addresses) so initial sync is fast; entries that already
# include chrony options (e.g. "192.168.0.10 iburst prefer") are passed
# through unchanged. Empty value falls back to the role's ntp_pools
# default plus the public Debian pool acts as fallback when present.
ntp_servers: >-
  {{ lookup('env', 'PROXMOX_NTP_SERVERS')
     | split(',') | map('trim') | reject('equalto', '')
     | map('regex_replace', '^([^ ]+)$', '\1 iburst') | list }}

# Cribl Edge HEC input listener port for the netmon Telegraf push path
# (roles/netmon -> roles/cribl_edge). Reuses the standard Splunk-HEC port from
# the tofu constants so the value stays DRY across both roles; falls back to
# 8088 when tofu_data is absent (e.g. molecule).
cribl_hec_input_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['splunk_hec']
     | default(8088) }}

# Heavy-tier LLM serving host — short hostname and reserved address, read from
# the inventory artifact and NEVER written here.
#
# This host is a fixed-address reservation made by the network IaC rather than
# a PVE guest, so it is absent from the tofu inventory's guest list and its
# address cannot be derived the way every other host's is. Until
# tofu-proxmox#827 there was nothing to read, so this repository and
# ansible-proxmox-ai each carried their own copy of the two values, with a
# comment in each telling the reader to change both together. Both repositories
# are PUBLIC, which made those copies committed topology rather than a
# committed convention.
#
# tofu-proxmox now publishes both as constants.serving.host/.ip, supplied from
# the private deployment object at apply time. The env vars remain as the
# operator override and as the supply path while the published artifact is
# still catching up; what is gone is the third option, a value baked into a
# public file.
#
# DELIBERATELY NO FALLBACK VALUE. An address that merely looks plausible is
# worse here than no address at all, because this repository is where the A
# record is WRITTEN — a wrong value would not fail on this host, it would be
# published to the whole estate as authoritative DNS.
llm_large_serving_host: >-
  {{ ((tofu_data.constants.serving | default({})).host | default('', true))
     or (lookup('env', 'LLM_LARGE_RUNNER_HOST') | split('.') | first) }}
# Resolves empty when an EXTERNAL LLM_LARGE_RUNNER_HOST is configured without
# its own address: the A-record truthy filter then skips the record, which is
# correct — an external name must never be pointed at a local address. That is
# the one legitimate empty case, and it is why absence is asserted where the
# record is built (technitium_dns_group.yml) rather than unconditionally here.
llm_large_serving_ip: >-
  {{ ((tofu_data.constants.serving | default({})).ip | default('', true))
     or lookup('env', 'LLM_LARGE_RUNNER_IP') }}

# NOTE: the `llm-large` CNAME record lives in group_vars/technitium_dns_group.yml,
# NOT here — an `extra_cname_records` list defined in the more-specific group file
# REPLACES (not merges) any list here, so a definition here would be silently
# ignored for the technitium hosts. Keep the single authoritative definition there.

# Resource-domain secrets fetched from OpenBao by the openbao_secrets pre-play,
# one dict per domain. Defaults to an empty dict for each so every consumer's
# `bao_<domain>_secrets.X | default(lookup('env','X'), true)` resolves even
# when the fetch is skipped (BAO_ADDR unset, or that domain's role_id/secret_id
# envs unset) or the host is outside the openbao_secrets play. The pre-play
# overrides these per host when active. `local-llm` replaces the old
# `ai-readonly`-backed `bao_ai_secrets` for the LLM serving stack — ai-readonly
# is now reserved for AI AGENT identities, not the serving stack itself.
bao_local_llm_secrets: {}
bao_observability_secrets: {}
bao_local_cloud_secrets: {}
bao_monitoring_secrets: {}
bao_media_secrets: {}
# `apps` domain — shared-Postgres app secrets (Nautobot #138: db_password,
# secret_key, superuser_password under secret/apps/nautobot).
bao_apps_secrets: {}

# Shared-Postgres primary host — the switch for the streaming-replication
# topology (issue #138). Empty = single-primary: every postgres-tagged guest is
# its own primary and apps reach the DB by the stable `postgres` name. Set to
# the primary guest's inventory hostname to make that guest primary and every
# OTHER postgres-tagged guest a hot standby streaming from it.
#
# This env lookup is only the fallback for groups WITHOUT a committed
# declaration: the apps cluster declares its primary in postgres_group.yml
# (group_vars beats all.yml, so POSTGRES_PRIMARY_HOST cannot reach it). For a
# deliberate failover there, override with `-e postgres_primary_host=...`.
# The postgres role and the app *_db_host both read this.
postgres_primary_host: "{{ lookup('env', 'POSTGRES_PRIMARY_HOST') | default('', true) }}"

# One routing authority for the shared apps PostgreSQL cluster and all of its
# clients. Keeping this scoped name in all.yml makes it visible to the
# postgres, Nautobot, Vikunja, and Zammad groups without exposing those hosts
# to each other's role vars. Override this one value for a deliberate apps-tier
# failover; unrelated PostgreSQL tiers do not consume it.
postgres_apps_primary_host: >-
  {{ lookup('env', 'POSTGRES_APPS_PRIMARY_HOST') | default('postgres-apps', true) }}

# Traefik's dedicated Prometheus metrics entryPoint. Two roles on two different
# guests must agree on this number — traefik binds it, prometheus_stack scrapes
# it — and a role default is not visible across hosts, so the one definition
# lives here. It is deliberately NOT `websecure`: keeping /metrics on its own
# port keeps it off the public listener and out of reach of any router rule.
ingress_metrics_port: 8082

# Splunk ingress endpoints — the ONE place every HEC/mgmt consumer in this repo
# reads its host from. `splunk.<domain>` is the WEB UI, Traefik-fronted with an
# ACME cert (tofu-proxmox modules/proxmox-stack/locals-ingress-backends.tf) — it
# has never served HEC or the REST API and must not be dialed for either.
# splunk-hec and splunk-mgmt are separate Traefik-fronted names on the SAME
# standard TLS entrypoint (no port suffix — Traefik forwards to the backend
# port itself); a consumer that reconstructs "splunk.<domain>:<port>" locally
# black-holes the moment the web-UI route changes (apps#588 was exactly this
# for Cribl HEC). Change the Splunk ingress topology in exactly this one spot.
splunk_hec_base_url: "https://splunk-hec.{{ tofu_data.domain }}"
splunk_mgmt_base_url: "https://splunk-mgmt.{{ tofu_data.domain }}"
