---
# group_vars for prometheus_group — the monitoring LXC that runs prometheus_stack
# AND network_quality (smokeping_prober) co-located.
#
# Wire the co-located smokeping_prober scrape job into Prometheus: prometheus_stack
# appends prometheus_stack_extra_scrape_configs to prometheus.yml and the
# "Reload prometheus config" handler hot-reloads (no restart, no scrape gap).
#
# This lives in group_vars (not the network_quality role defaults) because the
# prometheus_stack play does not load network_quality's defaults — the scrape job
# must be visible to whichever play renders prometheus.yml. The port comes from the
# tofu service_ports constant (default 9374), DRY with the network_quality role.
smokeping_scrape_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['smokeping_prober']
     | default(9374) }}

# PVE host metrics (B9): scrape each commissioned node's pinned node_exporter
# through this container's Prometheus + the existing remote_write leg —
# the Cribl prometheus SCRAPER source is not allowed on the standalone
# Edge/Stream deployments, so the scrape has to happen here. Targets derive
# from the inventory nodes map. The map KEY is the Proxmox node_name, which is
# what DNS actually publishes; `role` is a label (node-1|node-2|node-3) with no
# DNS record, so building a target from it yields a name that never resolves.
# Stream's prometheus_to_netmon pipeline splits this job into the
# host_metrics metric index.
node_exporter_scrape_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['node_exporter']
     | default(9100) }}
pve_node_exporter_scrape_targets: >-
  {%- set out = [] -%}
  {%- for name, node in (hostvars['localhost']['tofu_data']['nodes'] | default({})) | dictsort -%}
  {%- if node.commissioned | default(true) -%}
  {%- set _ = out.append(name ~ '.'
      ~ hostvars['localhost']['tofu_data']['domain'] ~ ':' ~ node_exporter_scrape_port) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ out }}

# Gatus metrics on the status guest (tag `status`). Empty list when the guest
# is absent — Prometheus accepts an empty targets list (no scrapes).
gatus_scrape_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['gatus_web']
     | default(8080) }}
gatus_scrape_targets: >-
  {{ tofu_data['containers'] | default({}) | dict2items
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'status')
     | map(attribute='value.ip', default='') | reject('equalto', '')
     | map('regex_replace', '^(.+)$', '\1:' ~ (gatus_scrape_port | string))
     | list }}

# ARC (GitHub Actions self-hosted runner listener) metrics port, once that
# guest is tagged `arc-listener` (no such guest exists yet). Empty targets
# list renders a job with nothing to scrape rather than omitting the job, so
# the named target is visible in Prometheus config before the guest exists.
arc_listener_scrape_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['arc_listener_metrics']
     | default(8080) }}
arc_listener_scrape_targets: >-
  {{ (tofu_data['containers'] | default({}) | combine(tofu_data['vms'] | default({}))
      | combine(tofu_data['docker_vms'] | default({}))) | dict2items
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'arc-listener')
     | map(attribute='value.ip', default='') | reject('equalto', '')
     | map('regex_replace', '^(.+)$', '\1:' ~ (arc_listener_scrape_port | string))
     | list }}

# github_exporter (roles/github_exporter) binds localhost-only and is scraped
# from this same host, so the address is fixed rather than derived from
# tofu_data. Defined here, not in the role's defaults, because this
# group_vars file (not the role) renders the scrape job that consumes it —
# a role default is not in scope when group_vars is evaluated outside the
# role's own play.
github_exporter_web_address: "127.0.0.1:9504"

# The router scrape job's bearer, from the flat apps merge (roles/openbao
# openbao_generated_app_secrets.prometheus -> secret/apps/prometheus, read via
# roles/openbao_secrets apps/prometheus). Empty until seeded, which omits the
# job rather than rendering one that 401s.
prometheus_stack_llm_router_bearer: "{{ bao_apps_secrets.prometheus_llm_router_key | default('', true) }}"

prometheus_stack_extra_scrape_configs: |
  - job_name: smokeping
    static_configs:
      - targets: ["127.0.0.1:{{ smokeping_scrape_port }}"]
  - job_name: pve_node_exporter
    scrape_interval: 60s
    static_configs:
      - targets: {{ pve_node_exporter_scrape_targets | to_json }}
  - job_name: agentgateway
    # The agentgateway DNS name is a Traefik ingress alias, so scrape the guest
    # directly by its inventory address (no literal IP). agentgateway is
    # critical-tier, so `ip` is its declared static address.
    static_configs:
      - targets: ["{{ hostvars['localhost']['tofu_data']['containers']['agentgateway']['ip'] }}:{{
          hostvars['localhost']['tofu_data']['constants']['service_ports']['agentgateway_metrics'] }}"]
  - job_name: gatus
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: {{ gatus_scrape_targets | to_json }}
  # Co-located github_exporter (roles/github_exporter). 5-minute interval,
  # not the global default: the runners collector polls the GitHub API live
  # on every scrape, and a shorter interval risks the installation token's
  # hourly rate limit once more collectors are enabled later.
  - job_name: github_exporter
    scrape_interval: 5m
    static_configs:
      - targets: ["{{ github_exporter_web_address }}"]
  # ARC's own listener metrics (gha_job_startup_duration_seconds and the
  # assigned/started/completed counters) — the native queue-time source for
  # the self-hosted pool once apps #1932 lands and exposes it on a
  # NodePort. Ships with an empty target list until that guest is tagged.
  - job_name: arc_listener
    static_configs:
      - targets: {{ arc_listener_scrape_targets | to_json }}

# Forward blackbox + smokeping metrics to Cribl Stream → Splunk (index=netmon_metrics).
# Points at cribl-stream-01 directly (no HAProxy — WAL provides delivery durability).
prometheus_stack_remote_write_url: >-
  http://{{ hostvars['localhost']['tofu_data']['containers']['cribl-stream-01']['ip']
  }}:9201/api/v1/write

# The remote_write keep relabel must also pass the PVE host-metrics job —
# Stream's prometheus_to_netmon pipeline splits it into index=host_metrics.
prometheus_stack_remote_write_keep_jobs:
  - blackbox_.*
  - smokeping
  - pve_node_exporter
  - gatus
  - traefik
  - llm_router
  - github_exporter
  - arc_listener

# Organization for github_exporter to poll — same separation
# github_runner_org uses (roles/github_exporter defaults stay blank).
github_exporter_org: dryvist
