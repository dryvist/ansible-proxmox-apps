---
# MCP gateway (IBM mcp-context-forge) — OpenBao-sourced secrets (apps
# domain). OpenBao is the only source: each secret ends in
# `| default(undef(), true) | mandatory(...)`, so an absent or empty value
# aborts the play instead of being rendered over a live credential. Mirrors
# vikunja_group.yml. Fields have a home in secret/apps/mcp-gateway (the
# openbao_generated_app_secrets.mcp-gateway list) — OpenBao mints each at
# init time, nothing here ever supplies a value by hand.
mcp_gateway_admin_password: >-
  {{ bao_apps_secrets.mcp_gateway_admin_password
     | default(undef(), true)
     | mandatory('MCP_GATEWAY_ADMIN_PASSWORD missing: OpenBao fetch did not supply it') }}
mcp_gateway_jwt_secret: >-
  {{ bao_apps_secrets.mcp_gateway_jwt_secret
     | default(undef(), true)
     | mandatory('MCP_GATEWAY_JWT_SECRET missing: OpenBao fetch did not supply it') }}
mcp_gateway_encryption_secret: >-
  {{ bao_apps_secrets.mcp_gateway_encryption_secret
     | default(undef(), true)
     | mandatory('MCP_GATEWAY_ENCRYPTION_SECRET missing: OpenBao fetch did not supply it') }}

# Robust auto-restart, same treatment as vikunja/zammad.
systemd_restart_policy_services:
  - mcp-gateway
