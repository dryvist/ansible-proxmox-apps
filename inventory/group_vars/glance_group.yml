---
# Glance dashboard. The deployment-profile tile is on for this group; its
# bearer is the scoped router key from the flat apps merge (roles/openbao
# openbao_generated_app_secrets.glance -> secret/apps/glance, read via
# roles/openbao_secrets apps/glance). Empty until seeded, in which case the
# role's input assert names the missing bearer instead of rendering a tile
# that would 401.
glance_llm_profile_enabled: true
glance_llm_profile_bearer_token: "{{ bao_apps_secrets.glance_llm_router_key | default('', true) }}"
