---
# group_vars for prometheus_group — the monitoring LXC that runs prometheus_stack
# AND network_quality (smokeping_prober) co-located.
# Where its metrics go.
prometheus_stack_remote_write_receiver_enabled: true

# Forward blackbox + smokeping metrics to Cribl Stream → Splunk (index=netmon_metrics)
# and VictoriaMetrics (in_prometheus_rw dual connection). FQDN, not the guest
# IP: cribl-stream-01 is published directly at the apex zone as an INC-17123
# escape hatch (inventory/group_vars/technitium_dns_group.yml) specifically
# so it can be addressed this way — no HAProxy in front (WAL provides
# delivery durability).
prometheus_stack_remote_write_url: >-
  http://cribl-stream-01.{{ hostvars['localhost']['tofu_data']['domain'] }}:9201/api/v1/write

# Every scrape job ships unfiltered (no write_relabel keep list) — the
# Splunk-volume allow-list moved to cribl_stream_group.yml
# (cribl_stream_prometheus_splunk_keep_jobs), which gates only the
# splunk_hec leg of Cribl's prometheus_rw input.

prometheus_stack_direct_histogram_write_enabled: true
prometheus_stack_direct_histogram_write_url: >-
  http://{{ grafana_hostname }}.{{ tofu_data.domain }}:{{
    tofu_data.constants.service_ports.victoriametrics }}/api/v1/write
