---
# The runner organization is declared on the docker_vms inventory group
# (inventory/group_vars/docker_vms.yml). Read it from the first docker_vms
# host rather than duplicating it on the metrics guest.
github_actions_exporter_org: >-
  {{ hostvars[(groups['docker_vms'] | default([]) | first | default('localhost'))]
     .github_runner_org | default('', true) }}

# The exporter runs beside Prometheus on this same guest.
prometheus_stack_github_actions_exporter_address: >-
  {{ prometheus_stack_pve_exporter_address
     | regex_replace(':[0-9]+$', ':' ~ (github_actions_exporter_port | default(9222) | string)) }}
