---
# Mac scrape targets come from the published workstation inventory by role.
prometheus_stack_macmon_workstation_roles:
  - role: mac-primary-serving
    accelerator: mac-primary
  - role: mac-secondary-serving
    accelerator: mac-secondary
prometheus_stack_macmon_workstations: >-
  {{ hostvars['localhost'].tofu_data.workstations | default({}) }}
prometheus_stack_macmon_missing_roles: >-
  {%- set missing = [] -%}
  {%- for expected in prometheus_stack_macmon_workstation_roles -%}
  {%- set found = [] -%}
  {%- for workstation in prometheus_stack_macmon_workstations | dict2items -%}
  {%- if expected.role in (workstation.value.roles | default([])) -%}
  {%- set _ = found.append(workstation.value.host) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- if found | length == 0 -%}
  {%- set _ = missing.append(expected.role) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ missing }}
prometheus_stack_macmon_static_configs: >-
  {%- set configs = [] -%}
  {%- for expected in prometheus_stack_macmon_workstation_roles -%}
  {%- for workstation in prometheus_stack_macmon_workstations | dict2items -%}
  {%- if expected.role in (workstation.value.roles | default([])) -%}
  {%- set _ = configs.append({
    'targets': [workstation.value.host ~ ':9090'],
    'labels': {'accelerator': expected.accelerator}
  }) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ configs }}
