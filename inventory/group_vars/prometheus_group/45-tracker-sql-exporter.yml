---
# Tracker metrics exporter. The read-only login passwords come from the apps
# domain (secret/apps/tracker-metrics) through the shared OpenBao prefetch; the
# database endpoints match the ones the Vikunja and Zammad roles use.
prometheus_stack_sql_exporter_enabled: true
prometheus_stack_sql_exporter_vikunja_password: >-
  {{ bao_apps_secrets.tracker_metrics_vikunja_password
     | default(undef(), true)
     | mandatory('tracker_metrics_vikunja_password missing from apps/tracker-metrics') }}
prometheus_stack_sql_exporter_zammad_password: >-
  {{ bao_apps_secrets.tracker_metrics_zammad_password
     | default(undef(), true)
     | mandatory('tracker_metrics_zammad_password missing from apps/tracker-metrics') }}
prometheus_stack_sql_exporter_db_host: >-
  {{ postgres_apps_primary_host }}.{{ hostvars['localhost']['tofu_data']['domain'] }}
prometheus_stack_sql_exporter_db_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['postgres_default'] }}
prometheus_stack_sql_exporter_vikunja_db_name: vikunja
prometheus_stack_sql_exporter_zammad_db_name: zammad
