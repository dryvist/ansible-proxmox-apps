---
# GPU serving guest (llm-vllm tofu tag) — base-infra overrides.
#
# The role itself (llama.cpp/llama-swap config, model registry) lives in
# ansible-proxmox-ai; this file carries only what the base-infra roles in
# THIS repo need to treat the group specially.
#
# Ship the llama-server serving logs to the homelab_llm AI ingest listener
# (-> Cribl Stream ai_stamp -> Splunk index=llm) instead of only the linux/os
# catch-all. Same fix as llm_router_group.yml (litellm): the AI roles split
# out to ansible-proxmox-ai in #996, the syslog_forwarder role that consumes
# this var stayed in this repo, and this group_vars file was never created
# here — so the dedicated route has never fired for this group. Confirmed via
# Splunk: llm-4080 ships ~60k events/6h into index=os, zero into index=llm.
syslog_forwarder_program_routes:
  - program: llama-server
    port: >-
      {{ tofu_data.constants.ai_log_routing.homelab_llm.port
         | mandatory('ai_log_routing.homelab_llm.port missing from tofu constants') }}
