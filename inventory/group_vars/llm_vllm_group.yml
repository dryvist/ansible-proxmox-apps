---
# GPU serving guest (llm-vllm tofu tag) — base-infra overrides.
#
# The role itself (llama.cpp/llama-swap config, model registry) lives in
# ansible-proxmox-ai; this file carries only what the base-infra roles in
# THIS repo need to treat the group specially.
#
# Keep services with their own AI log contract on the dedicated route.
llm_gpu_syslog_route_port: >-
  {{ tofu_data.constants.ai_log_routing.homelab_llm.port
     | mandatory('ai_log_routing.homelab_llm.port missing from tofu constants') }}

syslog_forwarder_program_routes:
  - program: llama-server
    port: "{{ tofu_data.constants.syslog_port_map.llm_serving.standard }}"
  - program: sglang
    port: "{{ llm_gpu_syslog_route_port }}"
  - program: strata
    port: "{{ llm_gpu_syslog_route_port }}"
