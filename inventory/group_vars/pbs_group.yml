---
# Proxmox Backup Server guests.
#
# Membership is tag-driven (`pbs` in the guest's tags), matching how vdi_group
# is derived — see inventory/load_tofu/add_vm_hosts.yml. Nothing here names a
# host, so a second PBS guest needs only the tag.

# The datastore name is what every backup job and every `proxmox-backup-client`
# invocation addresses, so it is a stable identifier rather than a description
# of the disk behind it.
proxmox_backup_server_datastore_name: backup

# The vendor's own convention for datastore mountpoints. It is the mountpoint
# of the dedicated datastore filesystem, not a directory on the boot disk —
# the role asserts that on every converge.
proxmox_backup_server_datastore_path: /mnt/datastore/backup

# The guest's second SCSI disk, addressed by its stable by-id path. A kernel
# name (/dev/sdb) is assigned in discovery order and moves between reboots,
# and the role writes a filesystem to whatever this points at.
#
# A guest tagged `pbs` without this disk fails the play loudly. That is
# deliberate: a datastore silently sharing the boot filesystem is the failure
# this variable exists to prevent, and it is invisible until the boot disk
# fills and takes the backup tier down with the guest.
proxmox_backup_server_datastore_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1"
