---
# Pre-playbook that loads OpenTofu infrastructure data dynamically
# This playbook runs first to populate the Ansible inventory from OpenTofu outputs,
# eliminating hardcoded VM IDs and IPs from Ansible configuration.

- name: Load OpenTofu Infrastructure Inventory
  hosts: localhost
  become: false
  gather_facts: false
  tags: always

  # Inventory source resolution (priority order, first that resolves wins):
  #   1. TOFU_INVENTORY_PATH  — explicit local path / pin (tests, overrides)
  #   2. RustFS published artifact — the tofu-proxmox Terrakube workspace
  #      publishes the raw inventory; the shared role reads store credentials
  #      natively from OpenBao and fetches it with amazon.aws.
  vars:
    # Override global ansible_become for localhost tasks
    ansible_become: false
    # True only when the run is limited to the object-store group. That play
    # is the one that repairs the object store, and the published inventory
    # this loader fetches is served FROM that same store, so a store outage
    # would otherwise make the store unrepairable through the normal converge
    # route. --limit is the only signal a run scoped to the store can give
    # this loader (tags never reach it); scoped limits are comma-joined and
    # must include localhost (docs/agents/commands-and-testing.md), so the
    # membership check splits per entry. inventory/load_tofu/validate.yml
    # relaxes the shared role's terminal resolution failure for this run and
    # no other.
    object_storage_repair_run: >-
      {{ 'object_storage_group'
         in ((ansible_limit | default('')) | split(',') | map('trim') | list) }}
    # The global inventory pins ansible_python_interpreter to /usr/bin/python3
    # (correct for the Debian LXC targets). That system python lacks boto3, so
    # the amazon.aws S3 fetch below fails to import it. Discover the interpreter
    # for this localhost play instead, so it picks the dev-shell python that
    # carries boto3/botocore. Scoped to this play only — remote-host resolution
    # is untouched. (ansible-proxmox sets interpreter_python=auto_silent globally
    # and has no such pin, which is why its identical loader already works.)
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Resolve tofu_data and validate it carries what this repo needs
      ansible.builtin.include_tasks: load_tofu/validate.yml

    - name: Pin reviewed Proxmox node host keys before the live-placement read
      ansible.builtin.include_tasks: load_tofu/pin_node_host_keys.yml
      when: lookup('env', 'SSH_KNOWN_HOSTS_FILE') | length > 0

    - name: Exclude guest keys published in more than one guest map
      ansible.builtin.include_tasks: load_tofu/ambiguous_host_keys.yml

    - name: Add LXC containers to inventory, grouped by role tag
      ansible.builtin.include_tasks: load_tofu/add_lxc_hosts.yml

    - name: Resolve Windows credentials and add VMs to inventory
      ansible.builtin.include_tasks: load_tofu/add_vm_hosts.yml

    - name: Probe group_vars loading
      ansible.builtin.import_tasks: load_tofu/debug_probe.yml

    - name: Load the wall slide vars onto every host
      ansible.builtin.include_tasks: load_tofu/load_wall_slides.yml

    - name: Add the Splunk VM and Docker VMs to inventory
      ansible.builtin.include_tasks: load_tofu/add_splunk_and_docker_hosts.yml

    - name: Materialize reviewed host keys on the controller before SSH
      ansible.builtin.include_tasks: load_tofu/ssh_known_hosts.yml
      when: lookup('env', 'SSH_KNOWN_HOSTS_FILE') | length > 0

    - name: Build the monitor_targets fact from tofu inventory data
      ansible.builtin.include_tasks: load_tofu/monitor_targets.yml

    - name: Propagate tofu_data and the hostname fact to every host
      ansible.builtin.include_tasks: load_tofu/propagate_facts.yml

    - name: Best-effort load of the published UniFi network list (Cribl VLAN lookup)
      ansible.builtin.include_tasks: load_tofu/load_unifi_networks.yml
