---
# Original CI guest. Pools here must fit the pool-limit gate
# (validate_pool_limits.yml): 8 vCPUs and about 12 GiB, less the reserve.
github_runner_replicas: 3
# One of this host's slots joins the org-wide 4-slot review pool (see
# docker-host-540 for the other three), so AI-review jobs never queue behind this
# host's own Molecule matrix.
github_runner_review_slots: 1
# The organization review pools run on docker-host-540 only.
github_runner_review_orgs: []
# Measured 7-day peak of a pooled slot: 2.9 GiB.
github_runner_memory_limit: "3g"
