---
# Original CI guest. Operator directive: raise concurrency now; capacity
# is never the bottleneck. github_runner_memory_limit (role default 2 GiB)
# is a per-container cgroup CAP, not a reservation, so 4 containers here is
# ordinary overcommit on this guest's current allocation, same reasoning as
# docker-host-540.
github_runner_replicas: 4
