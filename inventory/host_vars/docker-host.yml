---
# Original CI guest. Operator directive: raise concurrency now. At the
# role's default per-container ceiling (github_runner_memory_limit, 2 GiB)
# 4 replicas claim 8 GiB of this guest's 12 GiB allocation, leaving
# headroom for the OS, dockerd, and the token agent -- no per-container
# override needed here, unlike docker-host-540.
github_runner_replicas: 4
