---
# Route Semaphore's Docker logs to its dedicated syslog family.
# The role derives its port from tofu ai_log_routing and skips absent routes.
syslog_forwarder_program_names:
  - semaphore

# No runner pool on this host — it is the execution plane
# (github_runner_plane_hosts, inventory/group_vars/docker_vms.yml). 0, not
# `github_runner_enabled: false`: the role must still CONVERGE here to stop
# and deregister any runner units a previous 3-replica converge already
# started, not merely stop being asked to. A disabled-and-skipped role can
# never tear down what it already deployed.
github_runner_replicas: 0
