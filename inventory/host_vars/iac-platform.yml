---
# Split Semaphore's own stdout/stderr into the dedicated ai syslog family
# (-> Splunk, once tofu-proxmox publishes the route) instead of the linux/os
# catch-all. $programname 'semaphore' matches the docker container/service
# name (verified live: `docker exec semaphore ...`).
#
# No `default()` fallback port: this is a new family with no prior port to
# fall back to, so it renders as an empty (no-op) list — the linux/os
# catch-all keeps carrying Semaphore's logs unchanged — until tofu-proxmox
# publishes constants.ai_log_routing.semaphore_docker. See inventory/host_vars/dify.yml
# for the same pattern.
syslog_forwarder_program_routes: >-
  {{
    [{'program': 'semaphore',
      'port': tofu_data.constants.ai_log_routing.semaphore_docker.port}]
    if 'semaphore_docker' in (tofu_data.constants.ai_log_routing | default({}))
    else []
  }}

# No CI runners on this guest. It is the management plane: the identities that
# mutate the estate run here, and a runner executes pull-request code. The
# github-runner AppRole's source-address class does not admit this guest, by
# design, so a pool here can never mint a registration token; the units it
# once carried cycled every RestartSec against a stale token instead. Capacity
# for CI is added on the ephemeral runner host (its own host_vars), never here.
github_runner_replicas: 0
