---
# Split this Docker-in-LXC stack's own stdout/stderr into the dedicated ai
# syslog family (-> Splunk index=ai) instead of the linux/os catch-all.
# $programname 'langfuse' matches the Compose `logging.options.tag` shared by
# every service in this stack (web/worker/postgres/clickhouse/redis) in
# ansible-proxmox-ai's langfuse_docker role, which is what puts each
# container's journald-driver output under that identifier in the first
# place. No `default()`: the route is a new family with no prior port to
# fall back to, so it renders as an empty (no-op) list — the existing
# linux/os catch-all keeps working unchanged — until tofu-proxmox publishes
# constants.ai_log_routing.langfuse_docker.
syslog_forwarder_program_routes: >-
  {{
    [{'program': 'langfuse',
      'port': tofu_data.constants.ai_log_routing.langfuse_docker.port}]
    if 'langfuse_docker' in (tofu_data.constants.ai_log_routing | default({}))
    else []
  }}
