---
# Untrusted-agent Docker host. It carries no CI runner pool: the runner role
# stays off (and its deadman check with it), and the host is not a plane host.
github_runner_enabled: false
github_runner_replicas: 0
ssh_host_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJQ+W5/yZjq3WPnvOkeqIs8PdAJGZ7pAjEQEREzR3fh7
ssh_ca_trust_principals:
  debian: [ansible, semaphore]
  root: [ansible, semaphore]
# Operator workstation key for the terminal and job dispatcher (forced command).
agent_sandbox_dispatch_access_enabled: true
agent_sandbox_dispatch_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGxVf3CUM3LHtw+pRNQxVZKiezG1uvaQqdsSW5EJypeq zcode-dispatch
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAHHNGa4Mi5QVmyp+0TMuAdhzrhXTolaKKN1kc4Dhx0S zcode-dispatch
# Operator workstation key for the allowlist command (forced command).
agent_sandbox_allow_access_enabled: true
agent_sandbox_allow_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGf70yYHkv0yre7l4IuB7Usi9sjr1W7sZKF37dcOwaUB agent-allow
# The ZCode Web service (compose service, secret group, credential-file check)
# is not deployed on this host.
agent_sandbox_zcode_web_enabled: false
