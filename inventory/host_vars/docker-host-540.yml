---
# Second CI guest, on the Xeon Gold node. It carries more slots than the
# original because its host is not the constraint the original one was: 80 CPUs
# against 24, and the runner containers get their own dockerd rather than
# sharing the one every repo was crowding onto.
#
# This is a capacity add, not overflow. GitHub Actions has no priority,
# ordering, or weighting between runners that match a job's labels — it exposes
# labels and groups and nothing else — so jobs land here as readily as on the
# original host. Anyone expecting spillover semantics will not get them.
#
# github_runner_memory_limit is a per-container cgroup CAP, not a reservation.
# Do not infer safe concurrency from the cap or the guest memory ceiling alone:
# check current CPU, memory, storage pressure, and queue data before changing
# github_runner_replicas.
github_runner_replicas: 7
github_runner_review_slots: 3
# Per-slot caps sized so every pool on this host fits the pool-limit gate
# (validate_pool_limits.yml) next to the organization review pools. Measured
# 7-day peaks: a review slot 1.4 GiB, a pooled slot 2.9 GiB.
github_runner_cpu_limit: "0.85"
github_runner_memory_limit: "3584m"
