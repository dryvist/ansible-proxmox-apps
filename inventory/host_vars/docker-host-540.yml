---
# Second CI guest, on the Xeon Gold node. It carries more slots than the
# original because its host is not the constraint the original one was: 80 CPUs
# against 24, and the runner containers get their own dockerd rather than
# sharing the one every repo was crowding onto.
#
# This is a capacity add, not overflow. GitHub Actions has no priority,
# ordering, or weighting between runners that match a job's labels — it exposes
# labels and groups and nothing else — so jobs land here as readily as on the
# original host. Anyone expecting spillover semantics will not get them.
#
# Operator directive: raise concurrency now rather than wait on a guest
# memory increase. At the default per-container ceiling
# (github_runner_memory_limit, 2 GiB) 6 replicas would claim 12 GiB -- the
# guest's entire current allocation, with nothing left for the OS, dockerd,
# or the token agent. Lowered per-container to 1900m here (6 x 1900m =
# 11.4 GiB) so 6 fit under today's 12 GiB with headroom; the CPU ceiling is
# left at the role default. The guest's own memory_dedicated MAXIMUM (how
# much RAM this VM could ever be given) is a separate, tofu-side change —
# raising it does not by itself change how many runner containers this
# role starts, which is what github_runner_replicas controls.
github_runner_replicas: 6
github_runner_memory_limit: "1900m"
