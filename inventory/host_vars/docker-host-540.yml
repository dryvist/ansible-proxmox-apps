---
# Second CI guest, on the Xeon Gold node. It carries more slots than the
# original because its host is not the constraint the original one was: 80 CPUs
# against 24, and the runner containers get their own dockerd rather than
# sharing the one every repo was crowding onto.
#
# This is a capacity add, not overflow. GitHub Actions has no priority,
# ordering, or weighting between runners that match a job's labels — it exposes
# labels and groups and nothing else — so jobs land here as readily as on the
# original host. Anyone expecting spillover semantics will not get them.
#
# Operator directive: raise concurrency now; capacity is never the
# bottleneck. github_runner_memory_limit is a per-container cgroup CAP, not
# a reservation -- 6 containers at the role's default 2 GiB cap on this
# guest is normal overcommit (most jobs use a small fraction of that; only
# a Molecule job approaches it, and the scenario selector already bounds
# how many run at once), so the default is left as-is here. The guest's own
# memory ceiling is raised separately on the tofu side (48 GiB max / 12 GiB
# floor, already in the desired state) -- that is independent of
# github_runner_replicas, which is what actually controls how many
# containers this role starts.
github_runner_replicas: 6
# One of this host's slots joins the org-wide 2-slot review pool (see
# docker-host for the other), so AI-review jobs never queue behind this
# host's own Molecule matrix.
github_runner_review_slots: 1
