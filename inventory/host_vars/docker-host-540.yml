---
# Second CI guest, on the Xeon Gold node. It carries more slots than the
# original because its host is not the constraint the original one was: 80 CPUs
# against 24, and the runner containers get their own dockerd rather than
# sharing the one every repo was crowding onto.
#
# This is a capacity add, not overflow. GitHub Actions has no priority,
# ordering, or weighting between runners that match a job's labels — it exposes
# labels and groups and nothing else — so jobs land here as readily as on the
# original host. Anyone expecting spillover semantics will not get them.
#
# RAM ceiling check (scratchpad/runner-ram.md, live Proxmox API read): this
# guest's current 12 GiB allocation, at the role's own per-container ceiling
# (github_runner_cpu_limit/_memory_limit, 2 GiB each), supports
# floor(0.80 x 12 / 2) = 4 -- exactly the value below, so it is unchanged
# here. Raising it further needs the tofu-side memory_dedicated increase to
# ~17.8-18.2 GiB the same report identifies (a reboot, not this PR); once
# applied, the same ceiling supports 7.
github_runner_replicas: 4
