---
# Split this Docker-in-LXC service's own stdout/stderr into the dedicated ai
# syslog family (-> Splunk index=ai) instead of the linux/os catch-all.
# $programname 'hindsight' matches the Compose `logging.options.tag` set on
# the service in ansible-proxmox-ai's hindsight_docker role (shared with the
# hindsight-2 replica — same identifier, same route), which is what puts the
# container's journald-driver output under that identifier in the first
# place. No `default()`: the route is a new family with no prior port to
# fall back to, so it renders as an empty (no-op) list — the existing
# linux/os catch-all keeps working unchanged — until tofu-proxmox publishes
# constants.ai_log_routing.hindsight_docker.
syslog_forwarder_program_routes: >-
  {{
    [{'program': 'hindsight',
      'port': tofu_data.constants.ai_log_routing.hindsight_docker.port}]
    if 'hindsight_docker' in (tofu_data.constants.ai_log_routing | default({}))
    else []
  }}
