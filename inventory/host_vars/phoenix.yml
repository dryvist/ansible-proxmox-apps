---
# Split this Docker-in-LXC stack's own stdout/stderr into the dedicated ai
# syslog family (-> Splunk index=ai) instead of the linux/os catch-all.
# $programname 'phoenix' matches the Compose `logging.options.tag` shared by
# both services in this stack (phoenix/postgres) in ansible-proxmox-ai's
# phoenix_docker role — the same contract as host_vars/langfuse.yml. No
# `default()`: the route renders as an empty (no-op) list until tofu-proxmox
# publishes constants.ai_log_routing.phoenix_docker.
syslog_forwarder_program_routes: >-
  {{
    [{'program': 'phoenix',
      'port': tofu_data.constants.ai_log_routing.phoenix_docker.port}]
    if 'phoenix_docker' in (tofu_data.constants.ai_log_routing | default({}))
    else []
  }}
