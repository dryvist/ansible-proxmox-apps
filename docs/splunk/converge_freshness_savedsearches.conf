## Converge-freshness alerts.
##
## Producer: ansible-proxmox-apps callback_plugins/converge_telemetry.py
## Design + SPL rationale: ansible-proxmox-apps docs/CONVERGE_FRESHNESS.md
##
## This repository does NOT own Splunk. Deploy these stanzas from ansible-splunk
## into an app's local/savedsearches.conf, and create the `ansible` index there
## first (indexes.conf). Notification actions are intentionally left unset —
## ansible-splunk owns which channel (ntfy / Zammad) alerts route to.

[Ansible - Stale converge (no success in 7 days)]
description = A host reported a successful converge at some point in the last 30 \
days but not in the last 7. Configuration drift is now unmanaged on that host.
search = index=ansible sourcetype="ansible:converge" status=success earliest=-30d \
| stats max(_time) AS last_converge, latest(playbook) AS playbook, latest(git_sha) AS git_sha BY host \
| eval age_days = round((now() - last_converge) / 86400, 1) \
| where age_days > 7 \
| eval last_converge = strftime(last_converge, "%Y-%m-%d %H:%M:%S") \
| sort - age_days \
| table host, last_converge, age_days, playbook, git_sha
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
cron_schedule = 17 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 12h

[Ansible - Orphan host (in inventory, never converged)]
description = A host is present in the Ansible inventory roster but has no \
successful converge event in the last 30 days. It is provisioned and unmanaged.
search = index=ansible (sourcetype="ansible:converge:roster" OR (sourcetype="ansible:converge" status=success)) earliest=-30d \
| stats max(eval(if(sourcetype=="ansible:converge:roster", _time, null()))) AS last_in_inventory, max(eval(if(sourcetype=="ansible:converge", _time, null()))) AS last_converge BY host \
| where isnotnull(last_in_inventory) AND last_in_inventory > relative_time(now(), "-7d") AND isnull(last_converge) \
| eval last_in_inventory = strftime(last_in_inventory, "%Y-%m-%d %H:%M:%S") \
| table host, last_in_inventory
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
cron_schedule = 40 6 * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 24h

[Ansible - Low host count]
description = A converge run targeted zero hosts or fewer than half its seven-day playbook median after three prior runs.
search = index=ansible sourcetype="ansible:converge:run" earliest=-7d \
| eval host_count=tonumber(hosts) \
| where isnum(host_count) AND isnotnull(playbook) \
| sort 0 playbook _time \
| streamstats current=f window=0 count as history_count median(host_count) as median_hosts by playbook \
| where _time >= relative_time(now(), "-15m") AND (host_count=0 OR (history_count>=3 AND host_count < median_hosts * 0.5)) \
| table _time, playbook, host_count, median_hosts, history_count, repo, git_sha
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
is_visible = 1
disabled = 0
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = playbook
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
