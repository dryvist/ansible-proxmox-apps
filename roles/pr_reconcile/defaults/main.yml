---
pr_reconcile_user: pr-reconcile
pr_reconcile_group: pr-reconcile
pr_reconcile_root: /opt/pr-reconcile
pr_reconcile_src_dir: /opt/pr-reconcile/src
pr_reconcile_bun_dir: /opt/pr-reconcile/bun
pr_reconcile_config_dir: /etc/pr-reconcile
pr_reconcile_approle_dir: /etc/pr-reconcile/approle
pr_reconcile_runtime_dir: /run/pr-reconcile
pr_reconcile_metrics_dir: /var/lib/pr-reconcile
pr_reconcile_metrics_file: /var/lib/pr-reconcile/pr_reconcile.prom
pr_reconcile_node_exporter_dir: /var/lib/node_exporter/textfile_collector
pr_reconcile_bao_bin: /usr/bin/bao
pr_reconcile_bao_addr: "https://openbao.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
pr_reconcile_bao_version: "{{ openbao_client_version }}"
pr_reconcile_bao_deb_url: >-
  https://github.com/openbao/openbao/releases/download/v{{ pr_reconcile_bao_version
  }}/openbao_{{ pr_reconcile_bao_version }}_linux_amd64.deb
pr_reconcile_bao_token_file: /run/pr-reconcile/openbao-token
pr_reconcile_bao_role_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     .get('OPENBAO_APPROLE_PR_RECONCILE_ROLE_ID', '') }}
pr_reconcile_bao_secret_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     .get('OPENBAO_APPROLE_PR_RECONCILE_SECRET_ID', '') }}

# Pinned Bun runtime. The zip checksum comes from the release's SHASUMS256.txt.
pr_reconcile_bun_version: "1.4.4"
pr_reconcile_bun_sha256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
pr_reconcile_bun_url: >-
  https://github.com/oven-sh/bun/releases/download/bun-v{{ pr_reconcile_bun_version
  }}/bun-linux-x64.zip
pr_reconcile_download_dir: /opt/pr-reconcile/downloads
pr_reconcile_bun_bin: "{{ pr_reconcile_bun_dir }}/{{ pr_reconcile_bun_version }}/bun-linux-x64/bun"

# Comma list of owner and repo names the CLI may act on (trailing * = prefix).
# Read from the controller environment. The CLI refuses to start when it is empty.
pr_reconcile_fence: "{{ lookup('env', 'PR_RECONCILE_FENCE') | default('', true) }}"
pr_reconcile_fence_env_file: "{{ pr_reconcile_config_dir }}/fence.env"
pr_reconcile_mint_bin: /usr/local/libexec/pr-reconcile-mint
pr_reconcile_tick_bin: /usr/local/libexec/pr-reconcile-tick
pr_reconcile_repo_url: https://github.com/JacobPEvans/.github-ai.git
pr_reconcile_cli_path: "{{ pr_reconcile_src_dir }}/scripts/pr-reconcile-cli.js"
pr_reconcile_mirror_runtime_dir: /run/git-mirror

# The reconcile CLI source is checked out at this tag and must resolve to
# this full commit SHA. Both are set by the deployment; neither has a default.
# renovate: datasource=github-tags depName=JacobPEvans/.github-ai
pr_reconcile_ref: ""
pr_reconcile_commit: ""

# Each token path is a GitHub App installation-token permission set. The role
# mints one token per owner at every tick; no token is stored on disk.
pr_reconcile_owners:
  - owner: JacobPEvans-ai
    token_path: github-admin/token/pr-reconcile-JacobPEvans-ai
  - owner: JacobPEvans
    token_path: github-admin/token/pr-reconcile-JacobPEvans
