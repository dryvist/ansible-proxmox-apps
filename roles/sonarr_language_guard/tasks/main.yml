---
# sonarr_language_guard — deploy the post-import audio-language check and
# wire it into Sonarr as a Custom Script connection.

- name: Install script dependencies (jq for API parsing, ffmpeg for the ffprobe fallback)
  ansible.builtin.apt:
    name:
      - jq
      - ffmpeg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the audio-language guard script
  ansible.builtin.template:
    src: sonarr-language-guard.sh.j2
    dest: "{{ sonarr_language_guard_bin_dir }}/{{ sonarr_language_guard_script_name }}"
    owner: root
    group: root
    mode: "0755"

# Wiring the Custom Script connection needs a running Sonarr to talk to —
# skipped under Molecule/CI (no live app) same as the sonarr role's own
# API-key self-own.
- name: Wire the Custom Script connection into Sonarr (live only)
  ansible.builtin.include_tasks: wire_connection.yml
  when: sonarr_language_guard_manage_services | bool
