---
# Generic OnFailure=ntfy-unit-failure@%n.service hook: any systemd service in
# this estate can page the ntfy alert hub on failure without a bespoke script
# per role. Mirrors roles/systemd_restart_policy's shape (a plain list of unit
# names drives per-unit drop-ins) rather than inventing a second convention.

# Units to wire OnFailure= for. Empty by default -- a role/play opts in by
# appending its own service name(s) via group_vars, the same shape as
# systemd_restart_policy_services.
ntfy_unit_failure_services: []

# Same FQDN-first idiom as roles/ntfy_docker's ntfy_docker_base_url: the
# reverse-proxied "ntfy" service name over HTTPS, never a node hostname.
# Topic defaults to "keystone" -- the existing catch-all wired to both Slack
# and Zammad (roles/ntfy_docker's ntfy_docker_slack_routes /
# ntfy_docker_zammad_topic_groups) -- so a unit that opts in pages through an
# already-seeded route with no new webhook/topic to provision.
ntfy_unit_failure_topic: keystone
ntfy_unit_failure_ntfy_url: >-
  https://ntfy.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/{{ ntfy_unit_failure_topic }}

# ntfy priority/tag for a unit-failure alert (see https://docs.ntfy.sh/publish/#message-priority).
ntfy_unit_failure_priority: high
ntfy_unit_failure_tags: warning
