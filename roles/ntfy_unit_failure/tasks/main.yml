---
# Deploy the shared alert unit once, then wire OnFailure= into each opted-in
# service via a drop-in override -- never edit the service's own unit file.
- name: Deploy the ntfy-unit-failure instantiated systemd unit
  ansible.builtin.template:
    src: ntfy-unit-failure@.service.j2
    dest: /etc/systemd/system/ntfy-unit-failure@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Create systemd override directory for opted-in services
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ ntfy_unit_failure_services }}"

- name: Deploy OnFailure= drop-in for opted-in services
  ansible.builtin.template:
    src: onfailure-override.conf.j2
    dest: "/etc/systemd/system/{{ item }}.service.d/99-ntfy-on-failure.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ntfy_unit_failure_services }}"
  notify: Reload systemd daemon
