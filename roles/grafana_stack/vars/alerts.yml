---
# Alert thresholds — declared once, rendered by templates/alerting/rules*.yml.j2.
# Loaded via vars_files in tasks/provisioning.yml before the rule templates
# render. Kept out of defaults/main.yml so that file stays under its token
# budget without a defaults/main/ directory (which Ansible ignores when
# defaults/main.yml exists).

# Thresholds — declared once here, never as a magic number in the rule file.
grafana_stack_alert_wan_latency_seconds: 0.5
grafana_stack_alert_disk_levels:
  - {pct: 80, uid: disk-usage-warning, title: Disk usage warning, severity: info}
  - {pct: 90, uid: disk-usage-high, title: Disk usage high, severity: warning}
  - {pct: 95, uid: disk-usage-critical, title: Disk usage critical, severity: critical}
grafana_stack_alert_secret_age_days: 47
grafana_stack_alert_workstation_load5: 24
grafana_stack_alert_pve_load_per_core_ratio: 2.0
# Last successful Git mirror sync age before a warning fires.
grafana_stack_alert_git_mirror_max_age_seconds: 1800
# Expected Hindsight replica count — derived from the hindsight-tagged
# inventory entries, same tag-filter source prometheus_stack_hindsight_targets
# uses, so an HA expansion needs no edit here.
grafana_stack_alert_hindsight_min_replicas: >-
  {{ tofu_data['containers'] | default({}) | dict2items
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'hindsight')
     | list | length }}
# Oldest Phoenix PostgreSQL transaction age in seconds before a warning fires.
grafana_stack_alert_phoenix_postgres_max_transaction_seconds: 600

# PVE quorum alerts count commissioned exporter targets from inventory.
grafana_stack_alert_pve_expected_nodes: >-
  {{ pve_exporter_scrape_targets
     | default(undef(), true)
     | mandatory('PVE exporter targets must derive from commissioned-node inventory')
     | length }}
grafana_stack_alert_pve_quorum_for: 2m

# AI alert rules (templates/alerting/rules-ai.yml.j2). Each list renders into
# a PromQL regex, anchored by the label matcher.
# Virtual-key aliases whose traffic must stay on zero-data-retention backends.
grafana_stack_alert_zdr_only_keys:
  - litellm-local-workstation
  - hindsight
# Model groups and models without zero data retention.
grafana_stack_alert_zdr_false_models:
  - free-zdrless
# Hermes virtual-key alias pattern.
grafana_stack_alert_hermes_key_regex: "hermes-.*"
# Hermes server errors within 15 minutes before hermes-llm-failures fires.
grafana_stack_alert_hermes_error_count: 3
grafana_stack_alert_hermes_scheduler_max_heartbeat_age_seconds: 600
grafana_stack_alert_hermes_max_last_success_age_seconds: 7200
