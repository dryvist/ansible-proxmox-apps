---
galaxy_info:
  author: JacobPEvans
  description: >-
    Grafana OSS + VictoriaMetrics single-node as a single Docker-in-LXC compose
    stack (one project, two services). AI coding-agent observability backend:
    VictoriaMetrics receives Prometheus remote_write from the stream pipeline
    and serves as the sole Grafana datasource; dashboards are file-provisioned
    so the UI carries no hand-built state and rebuilds clean.
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - grafana
    - victoriametrics
    - monitoring
    - metrics
    - observability
    - docker

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). No daemon.json (the registry-mirror play in site.yml owns
  # /etc/docker/daemon.json) and no venv: deploys via docker_compose_v2 (CLI).
  - role: docker_engine
