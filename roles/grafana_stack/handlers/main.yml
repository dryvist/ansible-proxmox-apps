---
# grafana_stack handlers

# Any rendered-file change (compose, datasource, dashboard provider, dashboard
# JSON) recreates the stack. Grafana reads provisioning only at start; the two
# TSDBs (grafana.db, VictoriaMetrics data) persist in named volumes across the
# recreate.
- name: Restart grafana stack
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_stack_data_dir }}"
    state: present
    recreate: always
