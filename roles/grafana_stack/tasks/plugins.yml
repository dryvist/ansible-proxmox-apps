---
- name: Require the plugin mirror URL
  ansible.builtin.assert:
    that:
      - grafana_stack_plugins_base_url | trim | length > 0
    fail_msg: "Set grafana_plugins_object_storage_base_url and run playbooks/sync-grafana-plugins.yml first."

- name: Read the published Grafana plugin manifest from object storage
  ansible.builtin.uri:
    url: "{{ grafana_stack_plugins_base_url }}/manifest.json"
    return_content: true
    status_code: 200
    timeout: 30
  register: grafana_stack_plugins_manifest_response
  changed_when: false
  check_mode: false

- name: Keep the published plugin manifest
  ansible.builtin.set_fact:
    grafana_stack_plugin_manifest: "{{ grafana_stack_plugins_manifest_response.content | from_json }}"

- name: Require a complete mirrored registry and matching pins
  ansible.builtin.assert:
    that:
      - grafana_stack_plugin_manifest[item.name].version | default('') | length > 0
      - grafana_stack_plugin_manifest[item.name].key == 'grafana-plugins/' ~ item.name ~ '.zip'
      - grafana_stack_plugin_manifest[item.name].sha256 is match('^[0-9a-f]{64}$')
      - >-
        item.pin_version | default('') | length == 0
        or grafana_stack_plugin_manifest[item.name].version == item.pin_version
    fail_msg: "Plugin {{ item.name }} is missing or stale; run playbooks/sync-grafana-plugins.yml first."
  loop: "{{ grafana_stack_plugins }}"
  loop_control:
    label: "{{ item.name }}"
