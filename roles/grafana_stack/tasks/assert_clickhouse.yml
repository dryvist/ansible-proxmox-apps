---
- name: Require an inventory endpoint and read-only ClickHouse credentials
  ansible.builtin.assert:
    that:
      - grafana_stack_clickhouse_host | trim | length > 0
      - grafana_stack_clickhouse_port | int > 0
      - grafana_stack_clickhouse_port | int <= 65535
      - grafana_stack_clickhouse_user == 'grafana'
      - grafana_stack_clickhouse_password | default('', true) | trim | length > 0
    fail_msg: >-
      Enabled ClickHouse provisioning requires an inventory endpoint and the
      existing read-only Grafana user credential.
    quiet: true
  when: grafana_stack_clickhouse_enabled | bool
  no_log: true
