---
# Runs after provisioning.yml: Grafana reads provisioning only at start, so a
# broken provisioned file fails these checks until provisioning replaces it.

- name: Deploy and verify the grafana stack
  block:
    - name: Deploy the grafana stack via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ grafana_stack_data_dir }}"
        state: present
      register: grafana_stack_compose

    - name: Restart grafana stack before health checks
      ansible.builtin.meta: flush_handlers

    # =========================================================================
    # Health checks — prove both containers run and both serve, not just
    # "compose exited 0".
    # =========================================================================
    - name: Verify both stack containers are running
      ansible.builtin.command: >-
        docker ps -q --filter name={{ item }} --filter status=running
      register: grafana_stack_running
      check_mode: false
      when: >-
        not ansible_check_mode or
        (
          not (grafana_stack_compose.skipped | default(false)) and
          not (grafana_stack_compose.changed | default(false)) and
          (grafana_stack_compose.actions | default([]) | length == 0)
        )
      changed_when: false
      retries: 6
      delay: 5
      until: grafana_stack_running.stdout != ''
      loop: >-
        {{ [grafana_stack_container_name, grafana_stack_vm_container_name]
           + ([grafana_stack_vmauth_container_name] if grafana_stack_vmauth_enabled | bool else []) }}

    - name: Verify VictoriaMetrics answers /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_stack_vm_port }}/health"
        status_code: 200
      register: grafana_stack_vm_health
      check_mode: false
      when: >-
        not ansible_check_mode or
        (
          not (grafana_stack_compose.skipped | default(false)) and
          not (grafana_stack_compose.changed | default(false)) and
          (grafana_stack_compose.actions | default([]) | length == 0)
        )
      retries: 12
      delay: 5
      until: grafana_stack_vm_health.status | default(0) == 200
      changed_when: false

    - name: Verify grafana answers /api/health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_stack_port }}/api/health"
        status_code: 200
      register: grafana_stack_health
      check_mode: false
      when: >-
        not ansible_check_mode or
        (
          not (grafana_stack_compose.skipped | default(false)) and
          not (grafana_stack_compose.changed | default(false)) and
          (grafana_stack_compose.actions | default([]) | length == 0)
        )
      retries: 12
      delay: 5
      until: grafana_stack_health.status | default(0) == 200
      changed_when: false

    # End-to-end: Grafana must actually reach VictoriaMetrics through the
    # provisioned datasource, not just serve its own UI.
    - name: Verify the provisioned datasource resolves in grafana
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_stack_port }}/api/datasources/uid/victoriametrics"
        user: admin
        password: "{{ grafana_stack_effective_admin_password }}"
        force_basic_auth: true
        status_code: 200
      retries: 6
      delay: 5
      register: grafana_stack_ds
      until: grafana_stack_ds.status | default(0) == 200
      check_mode: false
      when: >-
        not ansible_check_mode or
        (
          not (grafana_stack_compose.skipped | default(false)) and
          not (grafana_stack_compose.changed | default(false)) and
          (grafana_stack_compose.actions | default([]) | length == 0)
        )
      changed_when: false
      no_log: true

    # vmauth quota route (grafana_stack_vmauth_enabled). The reader token runs
    # the one allowed query. Either token on any other route is refused:
    # vmauth answers a route it does not map with 400 Bad Request, so 400, 401
    # and 403 all count as a refusal. The writer token imports to its one path.
    # A request without a token gets 401.
    - name: Verify the vmauth quota route
      when: >-
        grafana_stack_vmauth_enabled | bool and (
          not ansible_check_mode or
          (
            not (grafana_stack_compose.skipped | default(false)) and
            not (grafana_stack_compose.changed | default(false)) and
            (grafana_stack_compose.actions | default([]) | length == 0)
          )
        )
      block:
        - name: Verify vmauth answers the authorized quota query
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ grafana_stack_vmauth_port }}/api/v1/query?query={{
                grafana_stack_vmauth_quota_expr | urlencode }}
            headers:
              Authorization: "Bearer {{ grafana_stack_vmauth_quota_token }}"
            status_code: 200
          register: grafana_stack_vmauth_ok
          check_mode: false
          retries: 12
          delay: 5
          until: grafana_stack_vmauth_ok.status | default(0) == 200
          changed_when: false
          no_log: true

        - name: Verify vmauth refuses another query with the same token
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ grafana_stack_vmauth_port }}/api/v1/query?query=up"
            headers:
              Authorization: "Bearer {{ grafana_stack_vmauth_quota_token }}"
            status_code: [400, 401, 403]
          check_mode: false
          changed_when: false
          no_log: true

        # The writer token imports one probe sample (204). The probe series
        # carries the writer label and is written on every verify run.
        - name: Verify vmauth accepts a writer import
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ grafana_stack_vmauth_port }}/api/v1/import/prometheus"
            method: POST
            headers:
              Authorization: "Bearer {{ grafana_stack_vmauth_write_token }}"
            body: "agent_quota_vmauth_probe 1\n"
            body_format: raw
            status_code: 204
          register: grafana_stack_vmauth_write_ok
          check_mode: false
          retries: 12
          delay: 5
          until: grafana_stack_vmauth_write_ok.status | default(0) == 204
          changed_when: false
          no_log: true

        - name: Verify vmauth refuses the writer token on the query route
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ grafana_stack_vmauth_port }}/api/v1/query?query=up"
            headers:
              Authorization: "Bearer {{ grafana_stack_vmauth_write_token }}"
            status_code: [400, 401, 403]
          check_mode: false
          changed_when: false
          no_log: true

        - name: Verify vmauth refuses the reader token on the import path
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ grafana_stack_vmauth_port }}/api/v1/import/prometheus"
            method: POST
            headers:
              Authorization: "Bearer {{ grafana_stack_vmauth_quota_token }}"
            body: "agent_quota_vmauth_probe 1\n"
            body_format: raw
            status_code: [400, 401, 403]
          check_mode: false
          changed_when: false
          no_log: true

        - name: Verify vmauth refuses a request without a token
          ansible.builtin.uri:
            url: >-
              http://127.0.0.1:{{ grafana_stack_vmauth_port }}/api/v1/query?query={{
                grafana_stack_vmauth_quota_expr | urlencode }}
            status_code: 401
          check_mode: false
          changed_when: false

  rescue:
    - name: Capture stack diagnostics on failure
      ansible.builtin.command: "{{ item }}"
      loop:
        - "docker ps -a"
        - "docker logs --tail 50 {{ grafana_stack_container_name }}"
        - "docker logs --tail 50 {{ grafana_stack_vm_container_name }}"
      register: grafana_stack_diag
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Fail with stack diagnostics
      ansible.builtin.fail:
        msg: |-
          grafana stack failed to deploy/verify on {{ inventory_hostname }}.
          {{ grafana_stack_diag.results | default([]) | map(attribute='stdout') | join('\n--- next ---\n') }}
