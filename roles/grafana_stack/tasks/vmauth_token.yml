---
- name: Read the vmauth quota tokens from OpenBao
  community.hashi_vault.vault_kv2_get:
    url: "{{ lookup('env', 'BAO_ADDR') | regex_replace('/+$', '') }}"
    auth_method: token
    token: "{{ lookup('env', 'BAO_TOKEN') }}"
    engine_mount_point: secret
    path: apps/agent-quota
    ca_cert: "{{ openbao_ca_path }}"
    proxies:
      http: ""
      https: ""
  register: grafana_stack_vmauth_secret
  when: grafana_stack_vmauth_enabled | bool
  check_mode: false
  changed_when: false
  failed_when: false
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true

- name: Reject vmauth quota secret read errors other than an absent bucket
  ansible.builtin.assert:
    that:
      - >-
        grafana_stack_vmauth_secret.msg is not defined
        or grafana_stack_vmauth_secret.msg is search('^Invalid or missing path')
    fail_msg: "Reading the vmauth quota tokens failed; token resolution was refused."
    quiet: true
  when: grafana_stack_vmauth_enabled | bool
  no_log: true

- name: Resolve the vmauth quota reader and writer tokens
  ansible.builtin.set_fact:
    grafana_stack_vmauth_quota_token: >-
      {{ (grafana_stack_vmauth_secret.secret | default({}))
         .get('agent_quota_reader_token', '') }}
    grafana_stack_vmauth_write_token: >-
      {{ (grafana_stack_vmauth_secret.secret | default({}))
         .get('agent_quota_write_token', '') }}
  when: grafana_stack_vmauth_enabled | bool
  no_log: true

- name: Require the vmauth quota reader token
  ansible.builtin.assert:
    that:
      - grafana_stack_vmauth_quota_token | default('', true) | trim | length > 0
    fail_msg: "OpenBao bucket apps/agent-quota is missing field agent_quota_reader_token"
    quiet: true
  when: grafana_stack_vmauth_enabled | bool

- name: Require the vmauth quota writer token
  ansible.builtin.assert:
    that:
      - grafana_stack_vmauth_write_token | default('', true) | trim | length > 0
    fail_msg: "OpenBao bucket apps/agent-quota is missing field agent_quota_write_token"
    quiet: true
  when: grafana_stack_vmauth_enabled | bool
