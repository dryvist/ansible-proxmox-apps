---
# grafana_stack vmauth route defaults (split from 00-core.yml to keep each file within the token limit).
# --- vmauth quota route (optional, read-only) --------------------------------
# vmauth (VictoriaMetrics' auth proxy) listens in front of VictoriaMetrics with
# up to three clients: the quota reader (one instant query), the writer (one
# import path) and an optional read-only metrics reader. Off by default; the
# compose service and config render only when enabled.
grafana_stack_vmauth_enabled: false
# Same release line and tag style as grafana_stack_vm_image.
grafana_stack_vmauth_image: "victoriametrics/vmauth:v1.157.0"
grafana_stack_vmauth_container_name: vmauth
grafana_stack_vmauth_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['vmauth']
     | default(8427) }}
# Host label for the reverse-proxy route to this listener. The route is an
# ingress entry in the tofu inventory; this role does not create it.
grafana_stack_vmauth_hostname: vmauth
grafana_stack_vmauth_url: "https://{{ grafana_stack_vmauth_hostname }}.{{ ingress_domain }}"
# The single PromQL selector the client may run as an instant query.
grafana_stack_vmauth_quota_expr: '{__name__=~"agent_quota_.*"}'
# Reader bearer token. Set by tasks/vmauth_token.yml from the OpenBao bucket
# apps/agent-quota (field agent_quota_reader_token) when vmauth is enabled.
grafana_stack_vmauth_quota_token: ''
# Writer bearer token. Set by tasks/vmauth_token.yml from the same bucket
# (field agent_quota_write_token) when vmauth is enabled.
grafana_stack_vmauth_write_token: ''
# Read-only reader bearer token for program proofs. Set by tasks/vmauth_token.yml
# from the OpenBao bucket apps/metrics-reader (field metrics_reader_token) when
# vmauth is enabled; empty renders no reader client.
grafana_stack_vmauth_metrics_reader_token: ''
# The read-only query paths (vmauth src_paths regexes) the metrics reader may use.
grafana_stack_vmauth_metrics_reader_paths:
  - "/api/v1/query"
  - "/api/v1/query_range"
  - "/api/v1/series"
  - "/api/v1/labels"
  - "/api/v1/label/[^/]+/values"
# Value of the writer label that vmauth adds to every imported series.
grafana_stack_vmauth_writer_label: agent-quota-mac
grafana_stack_vmauth_config_host_path: "{{ grafana_stack_data_dir }}/vmauth.yml"
grafana_stack_vmauth_config_container_path: /etc/vmauth/config.yml
