---
# grafana_stack — Grafana OSS + VictoriaMetrics single-node as ONE Docker-in-LXC
# compose stack (one project, two services, both host networking). The AI
# coding-agent observability backend: the stream pipeline remote_writes agent
# metrics into VictoriaMetrics; Grafana renders the provisioned dashboards.
# Contract: terraform-proxmox docs/AI_OBSERVABILITY.md.
#
# NOTE: all role vars carry the grafana_stack_ prefix
# (ansible-lint var-naming[no-role-prefix]).

# --- container images (pinned; bump via Renovate or manual review) ---
grafana_stack_image: "grafana/grafana:13.3.1"
grafana_stack_container_name: grafana
grafana_stack_vm_image: "victoriametrics/victoria-metrics:v1.156.0"
grafana_stack_vm_container_name: victoriametrics

grafana_stack_data_dir: /opt/grafana-stack

# Single source of truth for provisioning/<subdir> names: tasks/main.yml
# creates each host dir and renders into it, docker-compose.yml.j2 mounts
# each one read-only into the container. Add a new provisioning kind here
# only — creating it without mounting it (or vice versa) is how the
# alerting directory shipped rendered-but-invisible-to-Grafana.
grafana_stack_provisioning_subdirs:
  - datasources
  - dashboards
  - alerting
  - plugins

# Listen ports — from the tofu constants when available, else upstream defaults.
grafana_stack_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['grafana_web']
     | default(3000) }}
grafana_stack_vm_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['victoriametrics']
     | default(8428) }}

# Long-retention TSDB for subscription-trend dashboards; usePrometheusNaming
# normalizes OTLP-originated metric names to the Prometheus form the public
# Claude Code dashboards query.
grafana_stack_vm_retention: "2y"
grafana_stack_vm_stream_aggr_config_host_path: "{{ grafana_stack_data_dir }}/stream-aggregation.yml"
grafana_stack_vm_stream_aggr_config_container_path: /etc/stream-aggregation.yml
grafana_stack_vm_stream_aggr_metrics:
  - "llm_span_.*"
  - agent_runs
grafana_stack_vm_extra_flags:
  - "-opentelemetry.usePrometheusNaming"
  - "-search.latencyOffset=1s"

# --- vmauth quota route (optional, read-only) --------------------------------
# vmauth (VictoriaMetrics' auth proxy) listens in front of VictoriaMetrics and
# lets one bearer token run one instant query. Off by default; the compose
# service and config render only when enabled.
grafana_stack_vmauth_enabled: false
# Same release line and tag style as grafana_stack_vm_image.
grafana_stack_vmauth_image: "victoriametrics/vmauth:v1.156.0"
grafana_stack_vmauth_container_name: vmauth
grafana_stack_vmauth_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['vmauth']
     | default(8427) }}
# Host label for the reverse-proxy route to this listener. The route is an
# ingress entry in the tofu inventory; this role does not create it.
grafana_stack_vmauth_hostname: vmauth
grafana_stack_vmauth_url: "https://{{ grafana_stack_vmauth_hostname }}.{{ ingress_domain }}"
# The single PromQL selector the client may run as an instant query.
grafana_stack_vmauth_quota_expr: '{__name__=~"agent_quota_.*"}'
# Reader bearer token. Set by tasks/vmauth_token.yml from the OpenBao bucket
# apps/agent-quota (field agent_quota_reader_token) when vmauth is enabled.
grafana_stack_vmauth_quota_token: ''
# Writer bearer token. Set by tasks/vmauth_token.yml from the same bucket
# (field agent_quota_write_token) when vmauth is enabled.
grafana_stack_vmauth_write_token: ''
# Value of the writer label that vmauth adds to every imported series.
grafana_stack_vmauth_writer_label: agent-quota-mac
grafana_stack_vmauth_config_host_path: "{{ grafana_stack_data_dir }}/vmauth.yml"
grafana_stack_vmauth_config_container_path: /etc/vmauth/config.yml

# Grafana is reached through the Authelia-gated Traefik vhost; root_url makes
# redirects and rendered links carry the fronted name instead of the guest.
grafana_stack_root_url: "https://{{ grafana_hostname }}.{{ ingress_domain }}"

# Opt in through shared inventory after authenticating the kiosk to Grafana.
# Cross-origin framing removes Grafana's clickjacking protection globally.
grafana_stack_allow_embedding: >-
  {{ wall_grafana_slides_enabled | default(false) | bool
     and (grafana_stack_root_url | urlsplit('scheme') != 'https'
          or grafana_stack_root_url | urlsplit('netloc') != 'wall.' ~ ingress_domain) }}

# The Grafana LLM app reaches the OpenAI-compatible router through its existing
# ingress route. The plugin appends /v1 unless apiPath is set explicitly.
grafana_stack_llm_router_url: "https://llm.{{ ingress_domain }}"
grafana_stack_llm_router_env_file: "{{ grafana_stack_data_dir }}/llm-router.env"

# Admin credential: empty here means "generate on first converge and persist"
# (same decide/persist pattern as the homarr role). The persisted file is owned
# by the container's grafana uid so GF_SECURITY_ADMIN_PASSWORD__FILE can read
# it. Grafana only honors it at first init; later changes go through the UI/API.
grafana_stack_admin_password: ""
grafana_stack_admin_password_file: "{{ grafana_stack_data_dir }}/admin-password"
# Upstream grafana image runs as this fixed uid; host networking + no
# userns remap means the same uid owns the file on the LXC.
grafana_stack_grafana_uid: "472"

# --- SSO (Authelia OIDC) -----------------------------------------------------
# Confidential generic_oauth client, mirroring Langfuse (ansible-proxmox-apps
# dryvist.secrets_management/roles/authelia). Grafana still keeps its own login form as a break-glass
# path if Authelia is ever down — GF_AUTH_OAUTH_AUTO_LOGIN just makes SSO the
# default so a human never needs the generated admin password day to day.
# client_secret is generated once in OpenBao and shared with Authelia, which
# registers the matching client; see inventory/group_vars/grafana_group.yml
# for the bao-first/env-fallback read, same shape as homarr_group.yml.
grafana_stack_oidc_client_id: "{{ grafana_hostname }}"
grafana_stack_oidc_issuer: "https://{{ authelia_hostname }}.{{ ingress_domain }}"

# --- Infrastructure metrics datasource --------------------------------------
# This stack's VictoriaMetrics is the AI-agent observability backend, fed by
# OTLP and a remote_write. Infrastructure metrics — node_exporter on every PVE
# node, the blackbox probes, Traefik RED — live in the SEPARATE prometheus_stack
# guest, which retains them locally. With no datasource pointed there, an
# imported community dashboard reports a successful import and renders empty
# panels: the failure is invisible at the point you would look for it.
#
# The address is derived from the tofu inventory exactly as prometheus_stack
# derives its own Traefik targets — a container carrying the `prometheus` tag,
# never a literal. Empty when no such container exists, which omits the
# datasource rather than provisioning one that cannot resolve.
grafana_stack_prometheus_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['prometheus_web']
     | default(9090) }}
grafana_stack_prometheus_host: >-
  {{ (tofu_data['containers'] | default({}) | dict2items
      | selectattr('value.tags', 'defined')
      | selectattr('value.tags', 'contains', 'prometheus')
      | map(attribute='value.ip', default='') | reject('equalto', '')
      | list | first) | default('', true) }}
grafana_stack_prometheus_url: >-
  {{ ('http://' ~ (grafana_stack_prometheus_host | trim) ~ ':'
      ~ (grafana_stack_prometheus_port | trim))
     if (grafana_stack_prometheus_host | trim | length > 0) else '' }}

# LiteLLM's public model price catalogue, read by dashboards through Infinity.
grafana_stack_litellm_prices_enabled: true
grafana_stack_litellm_prices_allowed_host: "https://raw.githubusercontent.com"

# Opt-in ClickHouse reader; endpoint comes from the published inventory.
grafana_stack_clickhouse_enabled: false
grafana_stack_clickhouse_host: >-
  {{ (tofu_data['containers'] | default({}) | dict2items
      | selectattr('value.tags', 'defined')
      | selectattr('value.tags', 'contains', 'clickhouse')
      | map(attribute='value.hostname', default='') | reject('equalto', '')
      | map('regex_replace', '$', '.' ~ (tofu_data.domain
          | mandatory('tofu_data.domain required for the ClickHouse datasource')))
      | list | first) | default('', true) }}
grafana_stack_clickhouse_port: >-
  {{ tofu_data.constants.service_ports.clickhouse_http
     | mandatory('Published inventory must supply clickhouse_http') }}
grafana_stack_clickhouse_user: grafana
grafana_stack_clickhouse_database: default

# Dashboard JSON source: a release of dryvist/grafana-dashboards. The role
# extracts its dashboards/*.json into the provisioned dashboard directory.
# renovate: datasource=github-tags depName=dryvist/grafana-dashboards
grafana_stack_dashboards_version: "v1.50.0"
grafana_stack_dashboards_url: >-
  https://github.com/dryvist/grafana-dashboards/archive/refs/tags/{{ grafana_stack_dashboards_version }}.tar.gz
# The alert rule files deployed from the pinned release, in one list:
# tasks/provisioning.yml unpacks these (plus the contact point) and
# playbooks/verify-grafana-dashboards.yml asserts every rule in them is loaded.
grafana_stack_release_alert_rule_files:
  - accelerator-underutilized.yml
  - pay-per-token-spend.yml
  - hermes-cron-jobs.yml
  - runner-guest-blocked.yml
  - tracker-exporter-health.yml
  - postgres-resilience.yml

grafana_stack_community_dashboards:
  - dashboard: "7242"
    name: "LLM Spans (Grafana)"
    title: "LLM spans"
    folder: "AI Observability"
    overwrite: true
    tags: []
  - dashboard: "21029"
    name: "LiteLLM (LiteLLM)"
    title: "LLM proxy (LiteLLM)"
    folder: "AI Observability"
    overwrite: true
    tags: []
# Datasource the community dashboards import against. The public LLM
# dashboards query the LLM-proxy metrics, so they point at this stack's
# own VictoriaMetrics rather than the prometheus_stack datasource above.
# The uid is a fixed constant — a role-level var, not an Ansible variable,
# so the community-datasource render task and the import task that rewrites
# the datasource id agree without a lookup.
grafana_stack_community_datasource_uid: grafana-stack-prometheus

# --- Unified alerting (file-provisioned) -------------------------------------
# Contact point, notification policy and alert rules under
# provisioning/alerting/. Rules query the "prometheus" datasource above, so
# templates/alerting/rules.yml.j2 renders zero rule groups when
# grafana_stack_prometheus_url is empty — same guard as the community
# dashboards, for the same reason (no datasource to query yet).
grafana_stack_alert_contact_point_name: cribl-alerts
grafana_stack_alert_cribl_hec_url: >-
  http://syslog.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
  | mandatory('PROXMOX_SUBDOMAIN must be set in the environment')
  }}:{{ cribl_hec_input_port }}/services/collector/raw?index=ansible&source=grafana-alert&sourcetype=grafana%3Aalert
grafana_stack_alert_cribl_hec_token: >-
  {{ lookup('env', 'SPLUNK_HEC_TOKEN')
     | default(undef('SPLUNK_HEC_TOKEN is empty'), true)
     | mandatory('SPLUNK_HEC_TOKEN must be set in the environment') }}
grafana_stack_alert_cribl_token_file: "{{ grafana_stack_data_dir }}/alert-cribl-token.env"
# Slack alerting env for the Grafana container: the homelabops bot token
# (OpenBao secrets-external/slack/homelab-ops/rw, the entry the slack-ops
# AppRole reads) and the channel ID critical notifications post to. The
# converge reads both from the environment with the same undef/mandatory
# shape as the HEC token above, so an unset or empty value fails loudly
# instead of provisioning a contact point that cannot authenticate.
grafana_stack_alert_slack_bot_token: >-
  {{ lookup('env', 'GRAFANA_ALERT_SLACK_BOT_TOKEN')
     | default(undef('GRAFANA_ALERT_SLACK_BOT_TOKEN is empty'), true)
     | mandatory('GRAFANA_ALERT_SLACK_BOT_TOKEN must be set in the environment') }}
grafana_stack_alert_slack_critical_channel_id: >-
  {{ lookup('env', 'GRAFANA_ALERT_SLACK_CRITICAL_CHANNEL_ID')
     | default(undef('GRAFANA_ALERT_SLACK_CRITICAL_CHANNEL_ID is empty'), true)
     | mandatory('GRAFANA_ALERT_SLACK_CRITICAL_CHANNEL_ID must be set in the environment') }}
grafana_stack_alert_slack_env_file: "{{ grafana_stack_data_dir }}/alert-slack.env"
grafana_stack_alert_folder: Alerting
grafana_stack_alert_eval_interval: 1m
grafana_stack_github_actions_open_pr_count_threshold: 40
grafana_stack_alert_repeat_interval: 24h
grafana_stack_alert_warning_repeat_interval: 24h
grafana_stack_alert_critical_repeat_interval: 4h

# Alert thresholds live in vars/alerts.yml, loaded via vars_files in
# tasks/provisioning.yml before the alert rule templates render.
