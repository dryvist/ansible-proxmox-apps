---
raw_cache_nginx_version: "1.30.6"
raw_cache_nginx_package_version: >-
  {{ {'bookworm': '1.30.6-1~bookworm', 'trixie': '1.30.6-1~trixie'}[ansible_distribution_release] }}
raw_cache_port: 8080
raw_cache_bind_address: 0.0.0.0
raw_cache_cache_dir: /var/cache/raw-cache
raw_cache_cache_max_size: 20g
raw_cache_resolvers: "{{ ansible_dns.nameservers | default([]) }}"
raw_cache_upstreams:
  - name: github_raw
    upstream: https://raw.githubusercontent.com
  - name: github_releases
    upstream: https://github.com
  - name: hermes_assets
    upstream: https://hermes-assets.nousresearch.com
