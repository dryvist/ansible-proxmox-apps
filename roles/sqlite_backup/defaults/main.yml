---
# Scheduled online-consistent SQLite backups.
#
# For apps that keep their state in SQLite on a persistent app-config dataset.
# That dataset is already snapshotted and replicated off-node by the storage
# layer, so this role deliberately adds NO transport of its own — it writes
# beside the live database, on the same dataset, and the existing snapshot and
# replication schedule carries the result off-box.
#
# What it adds is consistency. A filesystem-level snapshot of a live SQLite
# database is crash-consistent: it recovers on open, but it is a copy of
# whatever was mid-flight. `.backup` uses SQLite's own online backup API, which
# produces a file that is transactionally complete and directly openable. It is
# also the ONLY safe way to copy a live SQLite database — `cp` of a database
# with an active WAL yields a file that can be silently short of committed data.
#
# Inert until sqlite_backup_dirs is set.

sqlite_backup_enabled: true

# sqlite3 provides the .backup command; nothing else is needed.
sqlite_backup_packages:
  - sqlite3

# Directories to scan for SQLite databases. Each entry is a path on the guest;
# every *.db / *.sqlite3 file directly inside it (see sqlite_backup_patterns) is
# backed up. Directories, not filenames: the exact database filenames are the
# app's business and change across versions, and a hard-coded name that an
# upgrade renames would leave the converge green while backing up nothing.
sqlite_backup_dirs: []

# Filename patterns treated as SQLite databases. `-wal` and `-shm` sidecars are
# NOT matched and must never be copied independently — the .backup command
# folds their contents into the output file.
sqlite_backup_patterns:
  - "*.db"
  - "*.sqlite3"

# How deep under each configured directory to look. 2 rather than 1 because
# several apps keep the database one level down (a `db/` or `data/`
# subdirectory) while their settings file sits at the top — scanning only the
# top level would find the settings and miss the database.
sqlite_backup_max_depth: 2

# Subdirectory (created inside each scanned directory) that holds the backups,
# so they land on the same persistent, snapshotted, replicated dataset as the
# live database without a second mount to arrange. Pruned from the scan, so a
# run never backs up its own output.
sqlite_backup_subdir: .backups

# Daily, offset from the storage layer's own schedules so a backup is not being
# written at the moment a snapshot is taken.
sqlite_backup_on_calendar: "*-*-* 04:15:00"
sqlite_backup_randomized_delay_sec: 900
# Run a missed schedule on next boot — sensible for a backup job on a guest
# that may be down at its window.
sqlite_backup_persistent: true

# Keep this many days of backups locally. Deeper history comes from the
# dataset's own snapshot retention, not from piling copies up here.
sqlite_backup_retention_days: 7

# Optional healthchecks.io URL; "<url>" pinged on success, "<url>/fail" on
# failure — same shape as the database and snapshot jobs elsewhere. Without
# this, a backup that silently stops running is exit-code-only.
sqlite_backup_healthcheck_url: ""
