---
# Windows baseline defaults

windows_baseline_winrm_port: 5985
windows_baseline_winrm_wait_timeout: 1800

# The estate default local Administrator password, from secret/platform/defaults
# via the inventory (inventory/load_tofu/add_vm_hosts.yml). Empty when that
# object is unreadable — an offline run, or a policy that has not been converged
# yet — and the task that consumes it skips rather than setting a blank
# password on a live account. Absence is the sentinel, so this must stay empty
# here and never carry a literal fallback.
windows_baseline_default_password: "{{ platform_defaults.admin_password | default('') }}"
