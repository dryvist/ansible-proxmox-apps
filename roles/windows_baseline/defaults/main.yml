---
# Windows baseline defaults

windows_baseline_winrm_port: 5985

# Seconds to wait for the WinRM listener. This is a ROUTINE-CONVERGE timeout: a
# guest that is up answers in under a second, and one that is unreachable is
# unreachable — waiting is not going to change that. It was 1800, a figure taken
# from how long an unattended install takes, which meant every ordinary converge
# against an unreachable guest blocked for half an hour before failing. Nothing
# was learned in minutes 1 through 30.
#
# Raise it per-run for a fresh build, where the long wait is the point:
#   -e windows_baseline_winrm_wait_timeout=1800
windows_baseline_winrm_wait_timeout: 60

# The estate default local Administrator password, from secret/platform/defaults
# via the inventory (inventory/load_tofu/add_vm_hosts.yml). Empty when that
# object is unreadable — an offline run, or a policy that has not been converged
# yet — and the task that consumes it skips rather than setting a blank
# password on a live account. Absence is the sentinel, so this must stay empty
# here and never carry a literal fallback.
windows_baseline_default_password: "{{ platform_defaults.admin_password | default('') }}"
