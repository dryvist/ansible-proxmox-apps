---
# The OpenHands trigger bot. One service user, the hand-created trigger
# project shared with it, its own status labels, and one API token scoped to
# commenting on tasks and swapping labels — minted and published by
# tasks/mcp_tokens.yml from the row in vikunja_openhands_token_users below.
#
# The trigger project and the `openhands` trigger label are created by hand
# under the operator's account; this role never creates either. The project is
# matched by ID, the labels by title — a Vikunja label is visible only to its
# creator and to users who can see a task carrying it, so its id is never a
# stable reference across accounts.
#
# models.Permission: 0 = Read, 1 = Read & Write. Write is the lowest share
# that lets a grantee comment on tasks and change the labels on them; the
# token's own action list below is the real restrictor.
vikunja_openhands_project_id: 90
vikunja_openhands_permission: 1

# Exactly the calls the bot makes: read the trigger project and its tasks,
# comment on them, and apply or remove its own status labels on tasks.
# Applying or removing a label resolves it by title through the labels read
# route first, which is why the only labels action is a read.
vikunja_openhands_permissions:
  labels: [read_all]
  projects: [read_all]
  tasks: [read_all, read_one]
  tasks_comments: [create]
  tasks_labels: [create, delete]

# The status labels, pre-created as the openhands user (looked up by title,
# created only when absent) so the bot can apply them to trigger tasks.
vikunja_openhands_labels:
  - openhands-running
  - openhands-done
  - openhands-failed

# The token row rides tasks/mcp_tokens.yml beside the shared MCP rows: exact
# permission table and its own OpenBao target, published to the app's own
# bucket under the apps KV layout — never the shared Vikunja token path.
vikunja_openhands_token_users:
  - username: openhands
    title: openhands-trigger
    permissions: "{{ vikunja_openhands_permissions }}"
    openbao_mount: secret
    openbao_path: apps/openhands-vikunja
    kv_fields: [token]
