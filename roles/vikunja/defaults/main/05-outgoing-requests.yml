---
# Sets Vikunja's outgoingrequests.allownonroutableips. It lives in its own
# defaults file because 00-base.yml is at its .token-limits.yaml budget (4000
# tokens) and cannot take more lines; Ansible merges every file under
# defaults/main/ into one map, so nothing else changes. See
# roles/vikunja/README.md, "Outgoing requests", for what the default assumes.
vikunja_outgoing_requests_allow_non_routable_ips: true
