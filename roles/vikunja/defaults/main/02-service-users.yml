---
# Service accounts for API automation, split out of 00-base.yml because that
# file is at its .token-limits.yaml budget. Ansible merges every file under
# defaults/main/ into one map, so nothing else changes. Passwords default to
# empty: an empty password skips the account everywhere (user creation,
# token minting, trigger reconciliation) instead of guessing one. The bao-first
# values live in inventory/group_vars/vikunja_group.yml.
vikunja_service_users:
  - username: svc-mcp-ro
    password: "{{ lookup('env', 'VIKUNJA_SVC_MCP_RO_PASSWORD') }}"
  - username: svc-mcp-rw
    password: "{{ lookup('env', 'VIKUNJA_SVC_MCP_RW_PASSWORD') }}"
  - username: svc-mcp-clerk
    password: ""
  # OpenHands trigger bot; an empty password skips it, like the accounts above.
  - username: openhands
    password: "{{ lookup('env', 'VIKUNJA_OPENHANDS_PASSWORD') }}"
