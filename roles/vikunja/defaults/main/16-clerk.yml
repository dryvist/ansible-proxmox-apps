---
# The task clerk gets two distinct, narrowly scoped API tokens for separate
# direct API and HTTP gateway use. Stable titles let the shared task reuse a
# matching token and replace it only if its permission scope has drifted.
# No delete action in any group: the clerk adds labels, relations and comments
# and never removes anything. Projects read lets it resolve a project by name.
vikunja_clerk_task_permissions:
  labels: [read_all]
  projects: [read_all]
  tasks: [create, read_all, read_one, update]
  tasks_comments: [create]
  tasks_labels: [create]
  tasks_relations: [create]

# The Hermes clerk also lists comments (contract cases V5 and W4).
vikunja_hermes_clerk_permissions: >-
  {{ vikunja_clerk_task_permissions | combine({'tasks_comments': ['create', 'read_all']}) }}

# One allowed project list for both clerks: the Dify clerk's share-only tier and
# the Hermes clerk's agent tier in 10-agent-tiers.yml.
vikunja_clerk_project_allowlist: >-
  {{ lookup('env', 'DIFY_VIKUNJA_CLERK_ALLOWED_PROJECTS') | default('[]', true)
     | from_json | map('int') | list }}

vikunja_clerk_token_users:
  - username: svc-mcp-clerk
    title: mcp-vikunja-clerk-api
    permissions: "{{ vikunja_clerk_task_permissions }}"
    kv_field: VIKUNJA_MCP_TOKEN_VIKUNJA_CLERK
  - username: svc-mcp-clerk
    title: mcp-vikunja-clerk-http
    permissions: "{{ vikunja_clerk_task_permissions }}"
    kv_field: VIKUNJA_MCP_HTTP_TOKEN_VIKUNJA_CLERK

# Share-only tier: exact direct shares for the clerk's service user on the same allowed
# list the Dify clerk enforces. No token or leaf; the tokens above cover the clerk.
# An empty list leaves the clerk's shares untouched.
vikunja_clerk_share_password: >-
  {{ (vikunja_service_users | selectattr('username', 'equalto', 'svc-mcp-clerk')
      | first | default({})).password | default('', true) }}
vikunja_share_only_tiers:
  - id: vikunja-clerk
    username: svc-mcp-clerk
    password_field: vikunja_clerk_share_password
    share_permission: 1
    project_allowlist: "{{ vikunja_clerk_project_allowlist }}"
