---
# The task clerk gets two distinct, narrowly scoped API tokens for separate
# direct API and HTTP gateway use. Stable titles let the shared task reuse a
# matching token and replace it only if its permission scope has drifted.
vikunja_clerk_task_permissions:
  tasks: [create, read_all, read_one, update]

vikunja_clerk_token_users:
  - username: svc-mcp-clerk
    title: mcp-vikunja-clerk-api
    permissions: "{{ vikunja_clerk_task_permissions }}"
    kv_field: VIKUNJA_MCP_TOKEN_VIKUNJA_CLERK
  - username: svc-mcp-clerk
    title: mcp-vikunja-clerk-http
    permissions: "{{ vikunja_clerk_task_permissions }}"
    kv_field: VIKUNJA_MCP_HTTP_TOKEN_VIKUNJA_CLERK
