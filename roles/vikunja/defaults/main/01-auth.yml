---
# --- Sign-in: OpenID Connect through Authelia, local auth kept ----------------
# Authelia registers the matching client (dryvist.secrets_management/roles/authelia,
# client id vikunja). Its redirect URI's trailing path segment authelia is the
# provider key below; the Vikunja frontend composes the full URI from its own
# origin, so no redirect URL is configured here. authurl is Authelia's issuer
# URL; OIDC discovery handles the endpoints.
vikunja_oidc_provider_url: "https://{{ authelia_hostname }}.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
vikunja_oidc_client_id: vikunja
vikunja_oidc_client_secret: "{{ lookup('env', 'VIKUNJA_OIDC_CLIENT_SECRET') }}"
