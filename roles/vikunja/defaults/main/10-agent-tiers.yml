---
# Agent passwords are resolved from each tier's exact OpenBao leaf by
# tasks/read_agent_tier_values.yml before account creation or token login.
vikunja_agent_read_password: >-
  {{ (vikunja_agent_tier_secret_values | default({}, true)).get('vikunja_agent_read_password', '') }}
vikunja_agent_write_password: >-
  {{ (vikunja_agent_tier_secret_values | default({}, true)).get('vikunja_agent_write_password', '') }}

# Project titles visible to the app-agent accounts. Shares use Vikunja's Read
# (0) or Read & Write (1) permission; parent/child checks run before sharing.
vikunja_agent_read_allowlist:
  - Hermes
vikunja_agent_write_allowlist:
  - Hermes

# One row owns every app-agent identity choice. Add a tier here to provision its
# service user, mint its scoped API token, reconcile its exact shares, publish
# its own OpenBao leaf, and verify effective API visibility.
vikunja_agent_tiers:
  - id: vikunja-read
    username: svc-agent-ro
    password_field: vikunja_agent_read_password
    token_tier: read-only
    openbao_mount: agent-tier
    openbao_path: vikunja-read
    token_field: VIKUNJA_AGENT_READ_TOKEN
    allowlist_field: VIKUNJA_AGENT_READ_ALLOWLIST
    share_permission: 0
    project_allowlist: "{{ vikunja_agent_read_allowlist }}"
  - id: vikunja-write
    username: svc-agent-rw
    password_field: vikunja_agent_write_password
    token_tier: read-write
    openbao_mount: agent-tier
    openbao_path: vikunja-write
    token_field: VIKUNJA_AGENT_WRITE_TOKEN
    share_permission: 1
    project_allowlist: "{{ vikunja_agent_write_allowlist }}"
