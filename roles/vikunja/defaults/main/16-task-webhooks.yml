---
# Project webhooks that wake an agent on task events. One row per project:
#   {project_id: <id>, owner: <automation account>, target_url: <url>, events: [<event>, ...]}
# `owner` must hold write on the project (Vikunja lets project writers manage
# its webhooks) and appear in the owner password map. Events are Vikunja event
# names, e.g. task.assignee.created. Every webhook is signed with the one
# route-only secret below; the receiving route reads the same secret.
# Rows are created when absent and never deleted; a row whose events differ
# from the live webhook fails the run instead of being silently left.
vikunja_task_webhooks: []
vikunja_task_webhook_secret: "{{ lookup('env', 'VIKUNJA_TASK_WEBHOOK_SECRET') }}"

# Optional task-change feed. Its target is the Vikunja task-events HTTP source
# on the first Cribl Stream worker, at the address and service port the
# inventory publishes for it (the same lookup the netmon role uses). The source
# takes one JSON object per request on its event API path.
vikunja_task_events_enabled: false
vikunja_task_events_owner: "{{ vikunja_mcp_ro_share_owner_usernames | first }}"
vikunja_task_events_basic_user: vikunja-task-events
vikunja_task_events_basic_password: "{{ lookup('ansible.builtin.env', 'VIKUNJA_TASK_EVENTS_PASSWORD') }}"
vikunja_task_events_cribl_host: >-
  {{ hostvars[groups['cribl_stream_group'][0]].get('container_ip', '')
     if (groups['cribl_stream_group'] | default([]) | length) > 0 else '' }}
vikunja_task_events_cribl_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports'].get('vikunja_task_events', '') }}
vikunja_task_events_url: >-
  {{ ('http://' ~ vikunja_task_events_cribl_host ~ ':' ~ vikunja_task_events_cribl_port ~ '/cribl/_bulk')
     if vikunja_task_events_cribl_host | length > 0
        and vikunja_task_events_cribl_port | string | length > 0 else '' }}
# Names as the tracker's own event list returns them (GET /api/v1/webhooks/events).
vikunja_task_events_events:
  - task.created
  - task.updated
  - task.deleted
  - task.restored
  - task.purged
  - task.comment.created
  - task.comment.edited
  - task.comment.deleted
  - task.assignee.created
  - task.assignee.deleted
  - task.relation.created
  - task.relation.deleted
  - task.attachment.created
  - task.attachment.deleted
