---
# Vikunja task-management app (issue #141) — a single native Go binary
# (web + API on one port), state in the shared native Postgres cluster
# (issue #138), file attachments on a persistent ZFS bind mount.

# --- Version / controller-staged, checksum-verified download ----------------
# LXCs in this repo are firewalled outbound-internal-only, so the release
# bundle is downloaded and checksum-verified on the CONTROLLER (unrestricted
# egress), then the extracted binary is copied to the target — same pattern
# as roles/openbao (its .deb) and roles/technitium_install (its mirrored
# .tgz). The pin is GitHub's own published digest for this exact asset
# (go-vikunja/vikunja publishes no separate checksums.txt); get_url verifies
# it before anything is extracted.
vikunja_version: "2.3.0"
# renovate: datasource=github-releases depName=go-vikunja/vikunja
vikunja_release_zip: "vikunja-v{{ vikunja_version }}-linux-amd64-full.zip"
vikunja_release_zip_url: >-
  https://github.com/go-vikunja/vikunja/releases/download/v{{ vikunja_version }}/{{ vikunja_release_zip }}
vikunja_release_zip_sha256: "c37f8291698e288cd95198b52b826ffca40c3665d351041b93358e142862994d"
vikunja_binary_name: "vikunja-v{{ vikunja_version }}-linux-amd64"

# --- System user / paths ------------------------------------------------------
vikunja_user: vikunja
vikunja_group: vikunja
vikunja_install_dir: /opt/vikunja
vikunja_binary_path: "{{ vikunja_install_dir }}/vikunja"
vikunja_config_dir: /etc/vikunja
vikunja_config_file: "{{ vikunja_config_dir }}/config.yml"
# Attachments live on the persistent ZFS bind mount at /var/lib/vikunja
# (provisioned by terraform-proxmox), never under the ephemeral install dir.
vikunja_files_dir: /var/lib/vikunja/files

# --- Network -------------------------------------------------------------------
vikunja_port: "{{ tofu_data.constants.service_ports.vikunja_web }}"
# Must match the Traefik router FQDN (<name>.<ingress base domain>) — Vikunja
# uses it for generated links and CORS, so the bare container domain is wrong.
vikunja_public_url: "https://vikunja.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"

# --- Database: the shared native Postgres cluster (issue #138) --------------
# FQDN + port are DERIVED, never literals. The vikunja database/role itself is
# provisioned by roles/postgres's postgres_managed_databases list (a follow-up
# once #831 merges) — this role only needs somewhere to connect to.
vikunja_db_host: "postgres.{{ tofu_data.domain }}"
vikunja_db_port: "{{ tofu_data.constants.service_ports.postgres_default }}"
vikunja_db_name: vikunja
vikunja_db_user: vikunja

# --- Secrets: injection-agnostic plain env lookups (AGENTS.md convention) ---
# Populated today via `doppler run --`; validated fail-loud in tasks/main.yml.
vikunja_db_password: "{{ lookup('env', 'VIKUNJA_DB_PASSWORD') }}"
vikunja_jwt_secret: "{{ lookup('env', 'VIKUNJA_JWT_SECRET') }}"
vikunja_admin_user: admin
vikunja_admin_email: "{{ vikunja_admin_user }}@{{ tofu_data.domain }}"
vikunja_admin_password: "{{ lookup('env', 'VIKUNJA_ADMIN_PASSWORD') }}"

# Tiered service accounts for API automation (vikunja-mcp et al.). Created
# idempotently like the admin; project shares + scoped API tokens are minted
# against these accounts (read-only vs read-write tiers; admin token = admin).
vikunja_service_users:
  - username: svc-mcp-ro
    password: "{{ lookup('env', 'VIKUNJA_SVC_MCP_RO_PASSWORD') }}"
  - username: svc-mcp-rw
    password: "{{ lookup('env', 'VIKUNJA_SVC_MCP_RW_PASSWORD') }}"

# --- Operator (human) account + project access ------------------------------
# THREE IDENTITIES, three purposes. Keeping them separate is the point:
#   jevans      — the operator's DAILY-USE account (this block). An ordinary
#                 user; never used as the admin account.
#   admin       — BREAK-GLASS ONLY. Rare, deliberate, never routine. Its
#                 credential already lives in OpenBao at secret/apps/vikunja
#                 (field vikunja_admin_password, via the openbao_vikunja_secrets
#                 promotion map) — that is its canonical home; do not create a
#                 competing path. It must KEEP WORKING: never disable or lock it.
#   svc-mcp-rw  — the AUTOMATION service account. Keeps ownership of its
#                 projects; the Hermes bridge polls project 64 through it and
#                 every agent MCP session authenticates as it.
#
# AUTH MODEL: this deployment authenticates LOCALLY. Confirmed live against the
# instance (GET /api/v1/info: auth.local.enabled true, auth.openid_connect
# .enabled false with no providers, auth.ldap.enabled false; GET / returns 200
# with no redirect, so nothing gates it) and consistent with the rendered
# config, which carries no `auth:` block at all and so takes upstream v2.3.0's
# defaults, plus the published ingress row's sso: false. There is therefore no
# OIDC identity to attach an operator account to, and declaring OIDC wiring here
# would be actively harmful: a Vikunja OIDC login provisions a SEPARATE account
# keyed on issuer+subject, which would shadow the local account and inherit none
# of the project shares granted below. Local account is the correct declaration
# today; an SSO migration is a distinct change that must move the shares too.
#
# Self-registration is off (service.enableregistration false), so this account
# cannot be self-served — it is declared here and reconciled by the same CLI
# path the admin and service accounts already use.
#
# Credentials are read injection-agnostically. These two are Doppler-native
# (project iac-conf-mgmt/prd) and have no home in the secret/apps/vikunja
# promotion map, so unlike the vikunja_* secrets there is no bao-first wiring
# to mirror in group_vars — a plain env lookup is the whole contract.
vikunja_operator_username: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) }}"
vikunja_operator_password: "{{ lookup('env', 'DEFAULT_PASSWORD') | default('', true) }}"
vikunja_operator_email: "{{ vikunja_operator_username }}@{{ tofu_data.domain }}"

# ACCESS MODEL: Vikunja projects are per-user. A project is visible only to its
# owner and to the users/teams it has been explicitly shared with, and there is
# no super-user override — `admin` is NOT a superset of every other account. A
# new account lands on an empty board list until these shares exist.
#
# Permission does, however, CASCADE DOWN a project tree. checkPermissionsForProjects
# walks the hierarchy upward and grants 2 at any level where owner_id matches,
# and LEFT JOINs users_projects at every level too, nearest grant winning. So
# both ownership AND a share on an ancestor reach every descendant. This role
# still reconciles a share on EVERY owned project explicitly rather than relying
# on the cascade: an explicit grant survives any later reparenting, where an
# inherited one silently disappears the moment a project is moved.
#
# SHARE, NEVER TRANSFER. Sharing is additive — the owning account keeps
# ownership and its full permission, which the Hermes bridge and every agent
# session depend on. It is also the only option: Vikunja cannot transfer
# ownership at all. There is no owner/transfer route, UpdateProject writes an
# explicit column allowlist that excludes owner_id (so an owner sent in an
# update is silently ignored), and Create hardcodes the owner to the caller.
# This costs little, because permission 2 IS the ownership code path: IsAdmin()
# is true if the user is the owner OR holds Admin via a share, and CanDelete()
# = IsAdmin(). A permission-2 sharee can update, delete, reparent, and re-share.
#
# Accounts whose owned projects are shared with the operator, BY USERNAME only.
# The password for each is resolved at converge time from the canonical sources
# already wired in this role (vikunja_admin_password and vikunja_service_users),
# so the bao-first values group_vars sets are picked up automatically and no
# secret is restated here.
vikunja_operator_share_owner_usernames:
  - "{{ vikunja_admin_user }}"
  - svc-mcp-rw

# models.Permission: 0 = Read, 1 = Read & Write, 2 = Admin. Admin so the
# operator can manage the boards themselves, not merely the tasks on them.
vikunja_operator_permission: 2

vikunja_api_timeout: 30

# --- MCP API tokens -> OpenBao (issue #141) ---------------------------------
# Mint a long-lived Vikunja API token per MCP service user and publish the
# shared connection to OpenBao secret/ai/mcp/vikunja. Mirrors ansible-splunk's
# splunk_docker manage_one_user pattern: mint-if-absent + sibling-preserving
# KV-v2 write, gated on a publish flag. Inert by default — the converge enables
# it with -e '{"vikunja_token_publish_openbao": true}' once a write-capable
# OpenBao AppRole (BAO_ADDR/BAO_TOKEN) is in the CONTROLLER environment.
vikunja_token_publish_openbao: false
vikunja_token_openbao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
vikunja_token_openbao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
vikunja_token_openbao_mount: "secret"
vikunja_token_openbao_path: "ai/mcp/vikunja"
vikunja_url_openbao_key: "VIKUNJA_MCP_URL"

# Shared MCP connection URL published alongside the tokens. Derived from the
# role's own ingress wiring (vikunja_public_url — the FQDN Vikunja uses for
# links/CORS) so the client-facing base can never drift from it; + the API base.
vikunja_mcp_url: "{{ vikunja_public_url | regex_replace('/+$', '') }}/api/v1"

# Minted token lifetime. Rotation is a re-mint: delete the mcp-<user> token in
# Vikunja and re-converge.
vikunja_token_expiry_days: 365

# Route groups (GET /api/v1/routes keys) the MCP tokens may act on. RO tokens
# get the read_* actions on these groups; RW tokens get every action. Bounded
# to the task-management surface — never the whole route set (which includes
# user, migration, and token-management routes). Group keys and actions are
# validated against the live route set at mint time, so an unknown name here is
# skipped, not fatal.
vikunja_mcp_token_scopes:
  - tasks
  - projects
  - labels
  - filters

# Service users that receive an MCP token, the tier each gets, and the OpenBao
# field its token publishes to. Passwords come from vikunja_service_users.
vikunja_mcp_token_users:
  - username: svc-mcp-ro
    readonly: true
    kv_field: VIKUNJA_MCP_TOKEN_RO
  - username: svc-mcp-rw
    readonly: false
    kv_field: VIKUNJA_MCP_TOKEN_RW
