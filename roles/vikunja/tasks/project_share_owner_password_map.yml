---
# Resolve share-owner passwords from the role's canonical secret sources.
- name: Build the project-share owner credential map
  ansible.builtin.set_fact:
    vikunja_project_share_owner_password_map: >-
      {{ {vikunja_admin_user: vikunja_admin_password}
         | combine(dict(vikunja_service_users | map(attribute='username')
                        | zip(vikunja_service_users | map(attribute='password')))) }}
  no_log: true
