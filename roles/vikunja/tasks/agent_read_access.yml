---
# Share only the configured project titles with the read-only agent. The owner
# login and share API use the existing automation-project reconciliation path.
- name: Build the owner credential map from canonical app credentials
  ansible.builtin.include_tasks: project_share_owner_password_map.yml

- name: Share allowlisted projects with the read-only agent, per owning account
  ansible.builtin.include_tasks: operator_access_one.yml
  loop: "{{ vikunja_operator_share_owner_usernames }}"
  loop_control:
    loop_var: vikunja_share_owner
    label: "{{ vikunja_share_owner }}"
  vars:
    vikunja_share_grantee_username: svc-agent-ro
    vikunja_share_permission: 0
    vikunja_share_project_titles: "{{ vikunja_agent_read_allowlist }}"
  when: >-
    vikunja_project_share_owner_password_map.get(vikunja_share_owner, '')
    | default('', true) | length > 0
