---
# Resolve ONE Hermes bridge identity's local Vikunja login password and make
# it STABLE across converges. The create-user task in hermes_bridge_identities.yml
# is idempotent (skipped once the user exists), so a value that differs
# between the run that created the user and a later run that logs in as it
# breaks every login from that point on — it must not be re-derived fresh
# each run. Nothing outside this role ever reads it; the identity's minted
# API token (hermes_bridge_identity_one.yml) is the only credential handed to
# a consumer. Included per item from hermes_bridge_identities.yml with
# loop_var: vikunja_hermes_identity.
#
# Precedence: an operator-supplied VIKUNJA_<USERNAME>_PASSWORD env var (same
# naming idiom as vikunja_service_users' own passwords) wins if set; otherwise
# a previously-generated value at the identity's own OpenBao path; otherwise
# generate one now and persist it there — merge-preserving, the identical
# read/write idiom hermes_bridge_identity_one.yml already uses to publish the
# minted token to the same path.

- name: "Read the current OpenBao login-password secret for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: >-
      {{ vikunja_token_openbao_addr }}/v1/{{ vikunja_hermes_identity.openbao_mount
        }}/data/{{ vikunja_hermes_identity.openbao_path }}
    method: GET
    headers:
      X-Vault-Token: "{{ vikunja_token_openbao_token }}"
    validate_certs: false
    status_code: [200, 404]
  register: vikunja_hermes_password_bao_current
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true

- name: "Resolve the stable login password for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.set_fact:
    vikunja_hermes_resolved_password: >-
      {{ (vikunja_hermes_resolved_password | default({}))
         | combine({vikunja_hermes_identity.username: (
             lookup('env', 'VIKUNJA_' ~ (vikunja_hermes_identity.username | upper) ~ '_PASSWORD')
             | default(vikunja_hermes_password_bao_current_value, true)
             | default(lookup('community.general.random_string', length=32, special=false), true)
           )}) }}
  vars:
    vikunja_hermes_password_bao_current_value: >-
      {{ (vikunja_hermes_password_bao_current.json | default({}, true)).get('data', {}).get('data', {})
         .get(vikunja_hermes_identity.username ~ '_login_password', '') }}
  no_log: true

- name: "Persist the newly-generated login password for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: >-
      {{ vikunja_token_openbao_addr }}/v1/{{ vikunja_hermes_identity.openbao_mount
        }}/data/{{ vikunja_hermes_identity.openbao_path }}
    method: POST
    headers:
      X-Vault-Token: "{{ vikunja_token_openbao_token }}"
    body_format: json
    body:
      data: >-
        {{ (vikunja_hermes_password_bao_current.json | default({}, true)).get('data', {}).get('data', {})
           | combine({vikunja_hermes_identity.username ~ '_login_password':
                      vikunja_hermes_resolved_password[vikunja_hermes_identity.username]}) }}
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
    vikunja_hermes_password_bao_current_value: >-
      {{ (vikunja_hermes_password_bao_current.json | default({}, true)).get('data', {}).get('data', {})
         .get(vikunja_hermes_identity.username ~ '_login_password', '') }}
  when: vikunja_hermes_password_bao_current_value | length == 0
  no_log: true
