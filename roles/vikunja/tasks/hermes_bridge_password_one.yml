---
# Resolve ONE Hermes bridge identity's login password from
# bao_apps_secrets (field <username>_login_password, generated at
# secret/apps/vikunja by the openbao role). Included per item from
# hermes_bridge_identities.yml with loop_var: vikunja_hermes_identity.

- name: "Resolve the login password for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.set_fact:
    vikunja_hermes_resolved_password: >-
      {{ (vikunja_hermes_resolved_password | default({}))
         | combine({vikunja_hermes_identity.username: (
             bao_apps_secrets[vikunja_hermes_identity.username ~ '_login_password']
             | default(undef(), true)
             | mandatory(vikunja_hermes_identity.username ~ '_LOGIN_PASSWORD missing: OpenBao fetch did not supply it')
           )}) }}
  no_log: true
