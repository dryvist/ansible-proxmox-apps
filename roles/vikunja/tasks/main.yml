---
# Fail closed when any declared app-agent tier lacks its dedicated credential.
- name: Read app-agent credentials from their exact OpenBao leaves
  ansible.builtin.include_tasks: read_agent_tier_values.yml
  when: vikunja_agent_tiers | length > 0

# The bespoke version of this check lived here; it is now the shared guard in
# openbao_secrets so every consumer gets the same fail-closed behaviour and the
# same message instead of each role re-implementing (or forgetting) it.
- name: Validate Vikunja secrets are set
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: assert_nonempty.yml
  vars:
    openbao_secrets_required_vars:
      - vikunja_db_password
      - vikunja_jwt_secret
      - vikunja_admin_password
      - vikunja_oidc_client_secret
  no_log: true

# Group, user, directories, the staged release binary and the rendered config.
- name: Install the Vikunja binary and render its config
  ansible.builtin.import_tasks: install.yml

# Under --check a first install only previews, so the service steps below skip.
- name: Check for the Vikunja systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/vikunja.service
  register: vikunja_unit_file
  when: ansible_check_mode

- name: Install the vikunja systemd unit
  ansible.builtin.template:
    src: vikunja.service.j2
    dest: /etc/systemd/system/vikunja.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart vikunja

- name: Enable and start Vikunja
  ansible.builtin.systemd:
    name: vikunja
    state: started
    enabled: true
    daemon_reload: true
  register: vikunja_service
  when: not ansible_check_mode or vikunja_unit_file.stat.exists

# Flush so a config/unit/binary change is live before the health check and
# CLI user-management tasks below run against it.
- name: Apply any pending Vikunja restart
  ansible.builtin.meta: flush_handlers

- name: Wait for Vikunja to answer its info endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/info"
    method: GET
    status_code: [200]
    timeout: "{{ vikunja_api_timeout }}"
  register: vikunja_health
  until: vikunja_health.status == 200
  retries: 10
  delay: 3
  changed_when: false
  check_mode: false
  when: >-
    not ansible_check_mode or
    not (vikunja_service.changed | default(false))

# `vikunja user list` needs no --config flag — the CLI shares the server's
# config auto-discovery (rootpath -> /etc/vikunja/ -> ~/.config/vikunja -> .),
# and /etc/vikunja/ is always searched regardless of cwd.
- name: List existing Vikunja users
  ansible.builtin.command:
    argv:
      - "{{ vikunja_binary_path }}"
      - user
      - list
  register: vikunja_user_list
  changed_when: false

- name: Create the Vikunja admin user (idempotent — skipped if already present)
  ansible.builtin.command:
    argv:
      - "{{ vikunja_binary_path }}"
      - user
      - create
      - "--username={{ vikunja_admin_user }}"
      - "--email={{ vikunja_admin_email }}"
      - "--password={{ vikunja_admin_password }}"
  # Match the exact username as a whole table cell in `vikunja user list`
  # output. A `\b` word boundary is wrong here: `-` is a non-word char, so
  # `\badmin\b` would match "admin" inside "admin-helper". Anchor on
  # start/whitespace/pipe (the table delimiters) instead. `default('', true)`
  # guards against an undefined stdout when the list task is skipped.
  when: >-
    not (vikunja_user_list.stdout | default('', true)
         | regex_search('(?:^|\\s|\\|)' ~ vikunja_admin_user ~ '(?:\\s|\\||$)'))
  changed_when: true
  no_log: true

- name: Create Vikunja service users (idempotent — skipped if already present)
  ansible.builtin.command:
    argv:
      - "{{ vikunja_binary_path }}"
      - user
      - create
      - "--username={{ item.username }}"
      - "--email={{ item.username }}@{{ tofu_data.domain }}"
      - "--password={{ item.password }}"
  loop: "{{ vikunja_service_users }}"
  loop_control:
    label: "{{ item.username }}"
  # Whole-cell match (see the admin task above): a `\b` boundary would let
  # `svc-mcp-ro` false-match inside a hypothetical `svc-mcp-ro-x` and skip
  # a real creation.
  when:
    - item.password | length > 0
    - >-
      not (vikunja_user_list.stdout | default('', true)
           | regex_search('(?:^|\\s|\\|)' ~ item.username ~ '(?:\\s|\\||$)'))
  changed_when: true
  no_log: true

- name: Create Vikunja app-agent users (idempotent — skipped if already present)
  ansible.builtin.command:
    argv:
      - "{{ vikunja_binary_path }}"
      - user
      - create
      - "--username={{ vikunja_agent_tier.username }}"
      - "--email={{ vikunja_agent_tier.username }}@{{ tofu_data.domain }}"
      - "--password={{ lookup('vars', vikunja_agent_tier.password_field) }}"
  loop: "{{ vikunja_agent_tiers }}"
  loop_control:
    loop_var: vikunja_agent_tier
    label: "{{ vikunja_agent_tier.id }}"
  when:
    - lookup('vars', vikunja_agent_tier.password_field) | length > 0
    - >-
      not (vikunja_user_list.stdout | default('', true)
           | regex_search('(?:^|\\s|\\|)' ~ vikunja_agent_tier.username ~ '(?:\\s|\\||$)'))
  changed_when: true
  no_log: true

- name: Create Vikunja agent role users (idempotent — skipped if already present)
  ansible.builtin.command:
    argv:
      - "{{ vikunja_binary_path }}"
      - user
      - create
      - "--username={{ vikunja_agent_role.username }}"
      - "--email={{ vikunja_agent_role.username }}@{{ tofu_data.domain }}"
      - "--password={{ lookup('vars', vikunja_agent_role.password_field) }}"
  loop: >-
    {{ vikunja_agent_roles_active }}
  loop_control:
    loop_var: vikunja_agent_role
    label: "{{ vikunja_agent_role.role }}"
  when:
    - lookup('vars', vikunja_agent_role.password_field) | length > 0
    - >-
      not (vikunja_user_list.stdout | default('', true)
           | regex_search('(?:^|\\s|\\|)' ~ vikunja_agent_role.username ~ '(?:\\s|\\||$)'))
  changed_when: true
  no_log: true

# Keep the role's direct shares aligned with its declared project/right map.
# This runs after users exist and before MCP token verification uses them.
- name: Reconcile Vikunja agent role project shares
  ansible.builtin.include_tasks: agent_role_shares.yml
  when:
    - not ansible_check_mode
    - vikunja_agent_roles_active | length > 0
  tags: vikunja_agent_access

# Validate per-user MCP API token scopes on every ordinary converge. Token
# mutation and OpenBao publication remain deferred behind the publication flag.
# Runs before both project-share reconciles, which read shares project by
# project, so a token change never waits on them.
- name: Validate MCP API token scopes and publish when enabled
  ansible.builtin.include_tasks: mcp_tokens.yml
  when:
    - not ansible_check_mode
  tags: vikunja_mcp_tokens
  no_log: true

- name: Note MCP token minting is deferred
  ansible.builtin.debug:
    msg: >-
      Vikunja MCP token minting is deferred (vikunja_token_publish_openbao is
      off). Service users exist; enable with
      -e '{"vikunja_token_publish_openbao": true}' plus a write-capable OpenBao
      AppRole (BAO_ADDR/BAO_TOKEN) to mint mcp-<user> tokens and publish
      {{ vikunja_url_openbao_key }} + per-tier tokens to
      {{ vikunja_token_openbao_mount }}/{{ vikunja_token_openbao_path }}.
  when: not (vikunja_token_publish_openbao | bool)
  no_log: true

- name: Reconcile app-agent Vikunja project access
  ansible.builtin.include_tasks: agent_read_access.yml
  when:
    - not ansible_check_mode
  tags: vikunja_agent_access

- name: Create the Vikunja operator user (idempotent — skipped if already present)
  ansible.builtin.command:
    argv:
      - "{{ vikunja_binary_path }}"
      - user
      - create
      - "--username={{ vikunja_operator_username }}"
      - "--email={{ vikunja_operator_email }}"
      - "--password={{ vikunja_operator_password }}"
  # Whole-cell match, same reasoning as the admin/service-user tasks above.
  when:
    - vikunja_operator_username | length > 0
    - vikunja_operator_password | length > 0
    - >-
      not (vikunja_user_list.stdout | default('', true)
           | regex_search('(?:^|\\s|\\|)' ~ vikunja_operator_username ~ '(?:\\s|\\||$)'))
  changed_when: true
  no_log: true

# Share every project the automation accounts own with the operator's
# accounts — the local human account plus the SSO account a first OIDC login
# provisions (vikunja_operator_share_users). Vikunja projects are per-owner
# with no super-user override, so without this each login sees an empty board
# list. Additive only — the owning accounts keep ownership and access.
- name: Grant the operator access to the automation-owned projects
  ansible.builtin.include_tasks: operator_access.yml
  when:
    - vikunja_operator_username | length > 0
    - vikunja_operator_password | length > 0
    - not ansible_check_mode
  tags: vikunja_operator_access
  no_log: true

# ansible.builtin.uri has no check-mode support, so every request in the share
# reconciliation would be skipped and the facts derived from them left
# undefined. Skipping the include outright and saying so is honest; running it
# half-evaluated would fail on undefined vars and prove nothing.
- name: Note operator project sharing is not evaluated in check mode
  ansible.builtin.debug:
    msg: >-
      Operator project sharing is skipped in check mode (ansible.builtin.uri
      does not support it). Run without --check to reconcile the operator's
      share on the automation-owned projects.
  when:
    - vikunja_operator_username | length > 0
    - vikunja_operator_password | length > 0
    - ansible_check_mode
  tags: vikunja_operator_access
  no_log: true

# Read shares for the read-only tracker service account: svc-mcp-ro reads every
# project the read-write automation account owns. The project list is derived
# at run time from the owner's own project pages, so a project moved between
# parents keeps its explicit grant. Reuses operator_access_one.yml verbatim,
# additive only. Runs independently of the operator block above, so the tracker
# keeps its reads even when the human operator account is not provisioned.
- name: Reconcile read shares for the read-only tracker service account
  ansible.builtin.include_tasks: mcp_read_access.yml
  when:
    - not ansible_check_mode
  tags: vikunja_mcp_read_access
  no_log: true

- name: Note the tracker read shares are not evaluated in check mode
  ansible.builtin.debug:
    msg: >-
      The read-only tracker account's project read shares are skipped in check
      mode (ansible.builtin.uri does not support it). Run without --check to
      reconcile the read shares on the automation-owned projects.
  when: ansible_check_mode
  tags: vikunja_mcp_read_access
  no_log: true

- name: Note operator account provisioning is skipped
  ansible.builtin.debug:
    msg: >-
      Vikunja operator provisioning is skipped — DEFAULT_USERNAME and/or
      DEFAULT_PASSWORD are absent from the converge environment. Set both to
      create the human account and share the automation-owned projects with it.
  when: not (vikunja_operator_username | length > 0 and vikunja_operator_password | length > 0)
  no_log: true

- name: Provision the OpenHands trigger bot
  ansible.builtin.include_tasks: openhands_trigger.yml
  tags: vikunja_openhands_trigger
  no_log: true

- name: Reconcile the declared project webhooks
  ansible.builtin.include_tasks: task_webhooks.yml
  when: vikunja_task_webhooks | length > 0
  tags: vikunja_task_webhooks
  no_log: true

# Provision Hermes bridge identities (their own Vikunja user, project shares,
# and a token scoped to an exact permission table) and publish each one's
# token to its own OpenBao field. Deferred by default — a SEPARATE flag from
# vikunja_token_publish_openbao above; see that flag's default in
# defaults/main.yml for why.
- name: Provision Hermes bridge identities and publish their tokens to OpenBao
  ansible.builtin.include_tasks: hermes_bridge_identities.yml
  when:
    - vikunja_hermes_bridge_publish_openbao | bool
    - vikunja_hermes_bridge_identities | length > 0
    - not ansible_check_mode
  tags: vikunja_hermes_bridge

# The AI Jobs dispatcher identity reuses the bridge tasks with its own list. A
# SEPARATE flag again, so neither rollout waits on the other's prerequisites.
- name: Provision the AI Jobs dispatcher identity and publish its token to OpenBao
  ansible.builtin.include_tasks: hermes_bridge_identities.yml
  vars:
    vikunja_hermes_bridge_identities: "{{ vikunja_ai_jobs_identities }}"
    vikunja_hermes_bridge_usernames: []
  when:
    - vikunja_ai_jobs_publish_openbao | bool
    - not ansible_check_mode
  tags: vikunja_ai_jobs

# Same reason as the operator-sharing note: these includes are uri chains
# whose registered results check mode would leave undefined.
- name: Note API token publishing is not evaluated in check mode
  ansible.builtin.debug:
    msg: >-
      MCP, Hermes bridge and AI Jobs token publishing is skipped in check mode
      (ansible.builtin.uri does not support it). Run without --check to
      reconcile the tokens.
  when:
    - ansible_check_mode
    - vikunja_token_publish_openbao | bool
      or vikunja_hermes_bridge_publish_openbao | bool
      or vikunja_ai_jobs_publish_openbao | bool
  tags: [vikunja_mcp_tokens, vikunja_hermes_bridge, vikunja_ai_jobs]
  no_log: true

- name: Note Hermes bridge identity provisioning is deferred
  ansible.builtin.debug:
    msg: >-
      Hermes bridge identity provisioning is deferred
      (vikunja_hermes_bridge_publish_openbao is off). Enable with
      -e '{"vikunja_hermes_bridge_publish_openbao": true}'.
  when: >-
    not (vikunja_hermes_bridge_publish_openbao | bool)
    or (vikunja_hermes_bridge_identities | length == 0)

- name: Reconcile the tracker conventions
  ansible.builtin.include_tasks: tracker_conventions.yml
  tags: [vikunja_tracker_labels, vikunja_tracker_board, vikunja_tracker_conventions]
