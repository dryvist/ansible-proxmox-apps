---
# Ensure one service identity has a live scoped API token and publish it to its
# declared OpenBao leaf. The tier row owns the app-agent token field, path,
# permissions, and allowlist. Shared MCP identities retain their existing row
# shape and shared URL publication.

- name: "Resolve token title, permissions, and OpenBao target for {{ vikunja_mcp_user.username }}"
  ansible.builtin.set_fact:
    vikunja_mcp_token_title: "{{ vikunja_mcp_user.title | default('mcp-' ~ vikunja_mcp_user.username) }}"
    vikunja_mcp_token_permissions: >-
      {{ vikunja_mcp_user.permissions if vikunja_mcp_user.permissions is defined
         else (vikunja_ro_permissions if
               (vikunja_mcp_user.token_tier | default('') == 'read-only'
                or vikunja_mcp_user.readonly | default(false)) else vikunja_rw_permissions) }}
    vikunja_mcp_token_mount: "{{ vikunja_mcp_user.openbao_mount | default(vikunja_token_openbao_mount) }}"
    vikunja_mcp_token_path: "{{ vikunja_mcp_user.openbao_path | default(vikunja_token_openbao_path) }}"
    vikunja_mcp_token_field: "{{ vikunja_mcp_user.token_field | default(vikunja_mcp_user.kv_field | default('')) }}"
    vikunja_mcp_token_fields: >-
      {{ vikunja_mcp_user.kv_fields if vikunja_mcp_user.kv_fields is defined
         else [vikunja_mcp_token_field] }}
    vikunja_mcp_token_static_fields: >-
      {{ ({vikunja_url_openbao_key: vikunja_mcp_url}
          if (vikunja_mcp_token_mount == vikunja_token_openbao_mount
              and vikunja_mcp_token_path == vikunja_token_openbao_path) else {})
         | combine(dict([(vikunja_mcp_user.allowlist_field,
                          vikunja_mcp_user.project_allowlist | to_json)])
                   if vikunja_mcp_user.allowlist_field is defined else {}) }}
  no_log: true

- name: "Log in to Vikunja as {{ vikunja_mcp_user.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/login"
    method: POST
    body_format: json
    body:
      username: "{{ vikunja_mcp_user.username }}"
      password: >-
        {{ lookup('vars', vikunja_mcp_user.password_field)
           if vikunja_mcp_user.password_field is defined else
           (vikunja_service_users
            | selectattr('username', 'equalto', vikunja_mcp_user.username)
            | first).password }}
    status_code: [200]
  register: vikunja_mcp_login
  no_log: true

- name: "List existing API tokens for {{ vikunja_mcp_user.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/tokens"
    method: GET
    headers:
      Authorization: "Bearer {{ vikunja_mcp_login.json.token }}"
    status_code: [200]
  register: vikunja_mcp_token_list
  no_log: true

# The list omits the secret value (returned exactly once at creation), so a live
# token with this title means "already provisioned" — do not re-mint.
- name: "Detect a live token for {{ vikunja_mcp_user.username }}"
  ansible.builtin.set_fact:
    vikunja_mcp_token_exists: >-
      {{ (vikunja_mcp_token_list.json | default([], true))
         | selectattr('title', 'defined')
         | selectattr('title', 'equalto', vikunja_mcp_token_title)
         | list | length > 0 }}
  no_log: true

- name: "Mint API token for {{ vikunja_mcp_user.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/tokens"
    method: PUT
    headers:
      Authorization: "Bearer {{ vikunja_mcp_login.json.token }}"
    body_format: json
    body:
      title: "{{ vikunja_mcp_token_title }}"
      permissions: "{{ vikunja_mcp_token_permissions }}"
      expires_at: >-
        {{ '%Y-%m-%dT%H:%M:%SZ'
           | strftime((now(utc=true).timestamp() | int) + (vikunja_token_expiry_days | int * 86400), utc=true) }}
    status_code: [200, 201]
  register: vikunja_mcp_token_mint
  when: not vikunja_mcp_token_exists
  no_log: true

- name: "Read current OpenBao secret at {{ vikunja_mcp_token_path }}"
  ansible.builtin.uri:
    url: "{{ vikunja_token_openbao_addr }}/v1/{{ vikunja_mcp_token_mount }}/data/{{ vikunja_mcp_token_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ vikunja_token_openbao_token }}"
    validate_certs: false
    status_code: [200, 404]
  register: vikunja_bao_current
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true

# KV v2 replaces the whole secret, so merge canonical fields over current data
# to preserve siblings. Shared MCP rows publish the URL; app-agent rows publish
# their allowlist. A token is added only when freshly minted because Vikunja
# returns the key exactly once.
- name: "Publish the token to OpenBao for {{ vikunja_mcp_user.username }}"
  ansible.builtin.uri:
    url: "{{ vikunja_token_openbao_addr }}/v1/{{ vikunja_mcp_token_mount }}/data/{{ vikunja_mcp_token_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vikunja_token_openbao_token }}"
    body_format: json
    body:
      data: >-
        {{ (vikunja_bao_current.json | default({}, true)).get('data', {}).get('data', {})
           | combine(vikunja_mcp_token_static_fields)
           | combine(dict(vikunja_mcp_token_fields | zip_longest([], fillvalue=vikunja_mcp_token_mint.json.token))
                     if (vikunja_mcp_token_mint is not skipped) else {}) }}
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  when: >-
    vikunja_mcp_token_mint is not skipped
    or ((vikunja_bao_current.json | default({}, true)).get('data', {}).get('data', {})
        | dict2items | selectattr('key', 'in', vikunja_mcp_token_static_fields)
        | items2dict != vikunja_mcp_token_static_fields)
  no_log: true
