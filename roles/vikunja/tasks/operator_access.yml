---
# Share the projects owned by each automation account with the operator's
# accounts — vikunja_operator_share_users, the local human account plus the
# SSO account a first OIDC login provisions (resolved at converge time by the
# vikunja_operator_sso_usernames fact in tasks/main.yml). Vikunja projects are
# per-owner with no super-user override — an account sees only what it owns or
# what has been explicitly shared with it — so a login created in
# tasks/main.yml is worthless on its own.
#
# Sharing is strictly ADDITIVE: the owning account keeps ownership and its full
# permission, which the Hermes bridge (polling its project every 60s) and every
# agent MCP session authenticate as and depend on. Ownership is never moved, and
# no share is ever revoked here.
#
# Not included in check mode — see the guard in tasks/main.yml. ansible.builtin.uri
# does not support check mode, so every request task below would be skipped and
# the facts derived from them would be undefined.

# A first OIDC login provisions a NEW Vikunja account keyed on issuer+subject,
# with a site-specific username Vikunja generates itself — it cannot be
# declared in this public repo. Read it out of the same user-list table the
# create tasks in tasks/main.yml match against, one positional match per table
# row: the CLI prints the columns ID, USERNAME, EMAIL, STATUS, ISSUER,
# SUBJECT, CREATED, UPDATED, so a row is kept only when its EMAIL cell equals
# the operator's email and its ISSUER cell is anything but `local` (SSO rows
# carry the IdP's issuer, local rows carry `local`), and its USERNAME cell is
# captured. Border separators are normalised to `|` first (the CLI draws with
# `│`), empty captures are filtered before the list is returned, and the list
# is empty when the operator has not completed a first OIDC login yet.
- name: Resolve the operator's SSO usernames from the user list
  ansible.builtin.set_fact:
    vikunja_operator_sso_usernames: >-
      {{ vikunja_user_list.stdout | default('', true)
         | regex_replace('│', '|')
         | regex_findall(
             '^\|\s*[^|\n]*\|\s*([^|\n]*?)\s*\|\s*'
             ~ (vikunja_operator_email | regex_escape)
             ~ '\s*\|\s*[^|\n]*\|(?!\s*local\s*(?:\||$))\s*[^|\n]*\|.*$',
             multiline=True)
         | reject('equalto', '')
         | unique | list }}
  no_log: true

# Resolved from the role's canonical secret sources rather than restated, so the
# bao-first values inventory/group_vars/vikunja_group.yml sets for the admin and
# the MCP service accounts are picked up automatically. Restating them as env
# lookups here would silently bypass OpenBao on any host where the apps domain
# was fetched.
- name: Build the owner credential map from canonical app credentials
  ansible.builtin.include_tasks: project_share_owner_password_map.yml
  no_log: true

# One include per (grantee, owner) pair, so every grantee in
# vikunja_operator_share_users gets every owned project. operator_access_one.yml
# is the shared reconciler — agent_tier_reconcile.yml includes it with the same
# loop_var contract — so it is reused verbatim, never copied. The flatten keeps
# an overridden share list that carries nested lists working; the when skips
# the empty username an unset DEFAULT_USERNAME renders and owners without a
# resolvable credential, exactly as before the SSO grantee was added.
- name: Share automation-owned projects with the operator, per owning account
  ansible.builtin.include_tasks: operator_access_one.yml
  loop: >-
    {{ vikunja_operator_share_users | flatten
       | product(vikunja_operator_share_owner_usernames) | list }}
  loop_control:
    loop_var: vikunja_share_pair
    label: "{{ vikunja_share_pair[0] }}:{{ vikunja_share_pair[1] }}"
  vars:
    vikunja_share_owner: "{{ vikunja_share_pair[1] }}"
    vikunja_share_grantee_username: "{{ vikunja_share_pair[0] }}"
    vikunja_share_permission: "{{ vikunja_operator_permission }}"
  when: >-
    vikunja_share_pair[0] | length > 0 and
    vikunja_project_share_owner_password_map.get(vikunja_share_pair[1], '')
    | default('', true) | length > 0
  no_log: true
