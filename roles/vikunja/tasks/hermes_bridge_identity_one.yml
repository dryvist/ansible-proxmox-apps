---
# Provision ONE Hermes bridge identity end to end: its declared project
# shares, a token scoped to its own exact permission table, and the OpenBao
# publish. Included per item from hermes_bridge_identities.yml with
# loop_var: vikunja_hermes_identity ({username, project_shares,
# token_permissions, openbao_mount, openbao_path, kv_field}) plus
# vars: vikunja_hermes_identity_password (resolved by the caller via
# hermes_bridge_password_one.yml). The user itself is created by the caller,
# in the same batch as the admin/service-user creation in tasks/main.yml.

- name: "Grant declared project shares to {{ vikunja_hermes_identity.username }}"
  ansible.builtin.include_tasks: hermes_bridge_share_one.yml
  loop: "{{ vikunja_hermes_identity.project_shares }}"
  loop_control:
    loop_var: vikunja_hermes_share
    label: "{{ vikunja_hermes_share.project_id }}"

- name: "Log in to Vikunja as {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/login"
    method: POST
    body_format: json
    body:
      username: "{{ vikunja_hermes_identity.username }}"
      password: "{{ vikunja_hermes_identity_password }}"
    status_code: [200]
  register: vikunja_hermes_login
  no_log: true

- name: "Read current OpenBao secret at {{ vikunja_hermes_identity.openbao_path }}"
  ansible.builtin.uri:
    url: >-
      {{ vikunja_token_openbao_addr }}/v1/{{ vikunja_hermes_identity.openbao_mount
        }}/data/{{ vikunja_hermes_identity.openbao_path }}
    method: GET
    headers:
      X-Vault-Token: "{{ vikunja_token_openbao_token }}"
    validate_certs: false
    status_code: [200, 404]
  register: vikunja_hermes_bao_current
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true

# The publish writes the minted token's Vikunja id next to the value, in
# <kv_field>_ID, so the stored value can be tied to the titled token below.
- name: "Resolve the stored token for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.set_fact:
    vikunja_hermes_stored_token: >-
      {{ (vikunja_hermes_bao_current.json | default({}, true)).get('data', {}).get('data', {})
         .get(vikunja_hermes_identity.kv_field, '') }}
    vikunja_hermes_stored_token_id: >-
      {{ (vikunja_hermes_bao_current.json | default({}, true)).get('data', {}).get('data', {})
         .get(vikunja_hermes_identity.kv_field ~ '_ID', '') }}
  no_log: true

# A title match on Vikunja's own list only proves a token was minted once; it
# says nothing about whether the value actually stored at openbao_path still
# authenticates (missing field, a stale/foreign value, or one Vikunja has
# since revoked all read the same on the list endpoint). Call a cheap
# authenticated endpoint with the STORED value itself — one every bridge
# identity's own token_permissions actually grants (vikunja_hermes_bridge_
# permissions always includes projects: read_all), unlike /api/v1/user,
# which sits outside every bridge identity's scope and would read 401/403
# even for a freshly-minted, fully working token. An identity whose token
# holds no read route declares its own `probe`: a route it IS granted, and the
# statuses that mean the token authenticated (authenticated_statuses).
- name: "Verify the stored token still authenticates for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}{{ vikunja_hermes_identity.probe.path | default('/api/v1/projects') }}"
    method: "{{ vikunja_hermes_identity.probe.method | default('GET') }}"
    headers:
      Authorization: "Bearer {{ vikunja_hermes_stored_token }}"
    body_format: json
    body: "{{ vikunja_hermes_identity.probe.body | default(omit) }}"
    status_code: >-
      {{ ([200, 401, 403] + (vikunja_hermes_identity.probe.authenticated_statuses | default([]))) | unique }}
  register: vikunja_hermes_stored_token_check
  when: vikunja_hermes_stored_token | length > 0
  ignore_errors: true
  no_log: true

- name: "Record whether the stored token is usable for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.set_fact:
    vikunja_hermes_stored_token_works: >-
      {{ vikunja_hermes_stored_token_check.status is defined
         and vikunja_hermes_stored_token_check.status
             in (vikunja_hermes_identity.probe.authenticated_statuses | default([200])) }}

# Always listed: whether the stored token is current depends on the titled
# token's declared permissions, not only on the stored value authenticating.
- name: "List existing API tokens for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/tokens"
    method: GET
    headers:
      Authorization: "Bearer {{ vikunja_hermes_login.json.token }}"
    status_code: [200]
  register: vikunja_hermes_token_list
  no_log: true

- name: "Find the existing titled token for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.set_fact:
    vikunja_hermes_titled_token: >-
      {{ (vikunja_hermes_token_list.json | default([], true))
         | selectattr('title', 'defined')
         | selectattr('title', 'equalto', 'hermes-bridge-' ~ vikunja_hermes_identity.username)
         | list | first | default({}, true) }}

# The stored value is current only if it authenticates AND a token titled
# hermes-bridge-<user> exists whose permissions equal the declared map
# (action lists compared sorted) AND the stored id names that titled token.
# An untitled stored token, a titled one whose permissions drifted from the
# declaration, or a titled one minted but never published, is replaced.
- name: "Record whether the stored token is current for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.set_fact:
    vikunja_hermes_existing_token_id: "{{ vikunja_hermes_titled_token.id | default('', true) }}"
    vikunja_hermes_token_current: >-
      {%- set have = vikunja_hermes_titled_token.permissions | default({}, true) -%}
      {%- set want = vikunja_hermes_identity.token_permissions -%}
      {{ vikunja_hermes_stored_token_works
         and (vikunja_hermes_titled_token | length > 0)
         and (vikunja_hermes_stored_token_id | string) == (vikunja_hermes_titled_token.id | default('', true) | string)
         and dict(have.keys() | zip(have.values() | map('sort')))
             == dict(want.keys() | zip(want.values() | map('sort'))) }}

# A stale or drifted token is worthless; remove the titled token (if Vikunja
# still has one) so a fresh mint below does not accumulate an orphaned entry
# under the same title.
- name: "Delete the stale API token for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/tokens/{{ vikunja_hermes_existing_token_id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ vikunja_hermes_login.json.token }}"
    status_code: [200, 204, 404]
  when:
    - not vikunja_hermes_token_current
    - vikunja_hermes_existing_token_id | default('', true) | string | length > 0
  no_log: true

- name: "Mint API token for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: "http://localhost:{{ vikunja_port }}/api/v1/tokens"
    method: PUT
    headers:
      Authorization: "Bearer {{ vikunja_hermes_login.json.token }}"
    body_format: json
    body:
      title: "hermes-bridge-{{ vikunja_hermes_identity.username }}"
      permissions: "{{ vikunja_hermes_identity.token_permissions }}"
      expires_at: >-
        {{ '%Y-%m-%dT%H:%M:%SZ'
           | strftime((now(utc=true).timestamp() | int) + (vikunja_token_expiry_days | int * 86400), utc=true) }}
    status_code: [200, 201]
  register: vikunja_hermes_token_mint
  when: not vikunja_hermes_token_current
  no_log: true

# KV v2 replaces the whole secret, so merge over current data to preserve
# siblings — this path also holds the one-time Hermes credential seed (see
# dryvist.secrets_management/roles/openbao/templates/hermes-write-policy.hcl.j2). Guarded on an actual
# delta: once the stored token is current, later converges no-op here.
- name: "Publish the minted token to OpenBao for {{ vikunja_hermes_identity.username }}"
  ansible.builtin.uri:
    url: >-
      {{ vikunja_token_openbao_addr }}/v1/{{ vikunja_hermes_identity.openbao_mount
        }}/data/{{ vikunja_hermes_identity.openbao_path }}
    method: POST
    headers:
      X-Vault-Token: "{{ vikunja_token_openbao_token }}"
    body_format: json
    body:
      # Check-and-set against the version read above (0 = the path must not
      # exist yet): a writer that lands in between makes this write fail
      # instead of dropping that writer's fields. A deleted-latest 404 body
      # still carries the metadata version.
      options:
        cas: >-
          {{ (vikunja_hermes_bao_current.json | default({}, true)).get('data', {}).get('metadata', {})
             .get('version', 0) | int }}
      data: >-
        {{ (vikunja_hermes_bao_current.json | default({}, true)).get('data', {}).get('data', {})
           | combine({vikunja_hermes_identity.kv_field: vikunja_hermes_token_mint.json.token,
                      (vikunja_hermes_identity.kv_field ~ '_ID'): vikunja_hermes_token_mint.json.id}) }}
    validate_certs: false
    status_code: [200, 204]
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  when: vikunja_hermes_token_mint is not skipped
  no_log: true
