---
# The tracker conventions the agents and people share: the declared label set
# and the declared kanban buckets on every board project. main.yml includes
# this file last, so every project, share and webhook exists before the
# conventions reach the tracker. Both reconciles are additive — neither ever deletes a label or a
# bucket, and a bucket outside the declarations is only renamed by the
# declared rename map, never emptied.
- name: Reconcile the declared tracker labels
  ansible.builtin.include_tasks: tracker_labels.yml
  when: vikunja_tracker_labels | length > 0
  tags: [vikunja_tracker_labels, vikunja_tracker_conventions]

- name: Reconcile the declared tracker board buckets
  ansible.builtin.include_tasks: tracker_board.yml
  when: vikunja_tracker_board_projects | length > 0
  tags: [vikunja_tracker_board, vikunja_tracker_conventions]
