---
# cAdvisor (Google's container-metrics exporter) on Docker-in-LXC/VM guests.
# Read-only: reports per-container CPU/memory/network/disk stats for whatever
# the guest's docker_engine is already running. Applies only to docker_vms —
# it has nothing to report where Docker does not run.

cadvisor_image: >-
  ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
cadvisor_container_name: cadvisor
cadvisor_port: 8080
cadvisor_data_dir: /opt/cadvisor
