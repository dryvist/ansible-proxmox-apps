---
galaxy_info:
  author: ansible-proxmox-apps
  description: >-
    cAdvisor container-metrics exporter on Docker-in-LXC/VM guests — reports
    per-container CPU/memory/network/disk stats on port 8080 for the central
    Prometheus scrape.
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - cadvisor
    - docker
    - prometheus
    - metrics
    - monitoring

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). No venv: deploys via docker_compose_v2 (CLI).
  - role: docker_engine
    docker_engine_configure_daemon_json: true
