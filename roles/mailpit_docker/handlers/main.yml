---
# Mailpit Docker handlers

- name: Restart docker
  # Never on the plane host (inventory/group_vars/all.yml plane_host):
  # restarting the Docker daemon there kills the Semaphore container
  # running the converge task itself.
  when: inventory_hostname != (plane_host | default('iac-platform'))
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart mailpit
  community.docker.docker_compose_v2:
    project_src: "{{ mailpit_docker_data_dir }}"
    state: present
    recreate: always
