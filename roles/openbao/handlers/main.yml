---
# Notified by the config and unit tasks. Flags each notified voter; the handler
# below restarts the flagged voters one at a time.
- name: Flag openbao voter for restart
  ansible.builtin.set_fact:
    openbao_restart_pending: true
    openbao_restart_api_addr: "{{ openbao_api_addr }}"
  listen: Restart openbao
  when: ansible_virtualization_type | default('') != 'docker'

# Defined after the flag handler, so it runs once per flush after every flag is
# set. Restarts only the flagged voters, one at a time, active voter last.
- name: Restart flagged openbao voters one at a time
  ansible.builtin.include_tasks: restart_rolling.yml
  listen: Restart openbao
  run_once: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: ansible_virtualization_type | default('') != 'docker'

- name: Restart openbao snapshot timer
  ansible.builtin.systemd:
    name: "{{ openbao_snapshot_service_name }}.timer"
    state: restarted
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'

# One handler for every rotator: a per-notify topic can't carry which
# rotator's files changed (vanilla Ansible handlers take no arguments), so
# this restarts every ACTIVE rotator's own timer whenever any of them
# notifies "Restart openbao rotate timer". Restarting an unchanged timer is
# a harmless no-op — the timer unit itself didn't change, only the
# in-flight countdown resets.
- name: Restart openbao rotate timer
  ansible.builtin.systemd:
    name: "openbao-rotate-{{ item.key }}.timer"
    state: restarted
    daemon_reload: true
  loop: "{{ openbao_rotators | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  listen: "Restart openbao rotate timer"
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - item.value.enabled | bool
    - (item.value.role_id | default('')) | length > 0
    - (item.value.secret_id | default('')) | length > 0

- name: Restart openbao voter-health timer
  ansible.builtin.systemd:
    name: "{{ openbao_voter_health_service_name }}.timer"
    state: restarted
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'

- name: Restart openbao secret-age timer
  ansible.builtin.systemd:
    name: "{{ openbao_secret_age_service_name }}.timer"
    state: restarted
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'
