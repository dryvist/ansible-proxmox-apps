---
- name: Initialize OpenBao (recovery keys via static-key auto-unseal)
  ansible.builtin.command:
    cmd: >-
      bao operator init
      -recovery-shares={{ openbao_recovery_shares }}
      -recovery-threshold={{ openbao_recovery_threshold }}
      -format=json
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
  register: openbao_init_raw
  no_log: true
  changed_when: true
  when: openbao_do_fresh_init

- name: Capture init result
  ansible.builtin.set_fact:
    openbao_init: "{{ openbao_init_raw.stdout | from_json }}"
  no_log: true
  when: openbao_do_fresh_init

# Break-glass: write recovery shares + root token to a 0600 file ON THE
# CONTROLLER (gitignored), then shout at the operator to move it to paper.
- name: Write break-glass recovery material to controller (0600)
  ansible.builtin.copy:
    content: "{{ openbao_init | to_nice_json }}\n"
    dest: "{{ openbao_recovery_file }}"
    mode: "0600"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  when: openbao_do_fresh_init

- name: WARN — transcribe recovery material to paper, then delete the file
  ansible.builtin.debug:
    msg: >-
      ============================================================
      OpenBao cluster INITIALIZED on the bootstrap node
      {{ inventory_hostname }}. Recovery shares + the initial root
      token were written to:
        {{ openbao_recovery_file }}
      (0600, on this controller, gitignored). TRANSCRIBE the
      recovery shares to PAPER, store them offline split across
      custodians, then SECURELY DELETE this file. With static-key
      auto-unseal the recovery shares are the break-glass path if
      the seal key is ever lost. Do NOT commit it. Do NOT leave it
      on disk.
      ============================================================
  when: openbao_do_fresh_init

# Root token: from this run's init output on the FIRST bootstrap. On a cluster
# that's already initialized, provisioning (new policies/AppRoles) only runs
# if the operator supplies a privileged token out-of-band via
# OPENBAO_PROVISIONING_TOKEN — without one, every step below skips
# cleanly, so a routine converge that isn't adding RBAC stays a no-op.
- name: Set the bootstrap token for provisioning (first init)
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_init.root_token }}"
  no_log: true
  when: openbao_do_fresh_init

- name: Use the supplied provisioning token against a live cluster
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_provisioning_token }}"
  no_log: true
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length > 0

# Routine reconciliation. A change to the CONTENT of an already-declared policy
# needs no operator: openbao-reconcile owns exactly the names this repo declares
# and cannot reach the break-glass tiers or its own policy. Trying it here is
# what removes the "declared two weeks ago, never actually live" failure.
#
# A failure is NOT fatal -- on a cluster that has never had a privileged run the
# identity does not exist yet -- but it MUST be loud, because a silent failure
# here reproduces the exact false green this block exists to remove.
# Delegated, like every other vault_login in this repo (see
# openbao_secrets/tasks/publish.yml): community.hashi_vault needs hvac, which
# lives in the controller's dev shell and NOT on the guests. Run on the guest it
# fails to import, and `failed_when: false` then turns that into a silent "ok"
# with no .login key -- indistinguishable from a rejected credential.
#
# openbao_api_addr is the node's own bind address and is not reachable from the
# controller, so a delegated login must use the ambient BAO_ADDR the runner
# already exports.
#
# ansible_become: false because a delegated task inherits the PLAY's become
# regardless of any task-level setting, and would otherwise try to escalate on
# the control node.
# Preferred over secret-zero: whatever supplies a token is maintaining it.
# Checked BEFORE the login so a host carrying both mints nothing extra.
- name: Use the pre-issued reconcile token when one is supplied
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_reconcile_token }}"
    openbao_reconcile_mode: true
  no_log: true
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - openbao_reconcile_token | length > 0

- name: Log in as the reconcile identity for routine RBAC reconciliation
  community.hashi_vault.vault_login:
    url: "{{ openbao_reconcile_addr }}"
    auth_method: approle
    role_id: "{{ openbao_reconcile_role_id }}"
    secret_id: "{{ openbao_reconcile_secret_id }}"
  delegate_to: localhost
  vars:
    ansible_become: false
  register: openbao_reconcile_login
  no_log: true
  # ignore_errors, NOT `failed_when: false`: measured, the latter leaves the
  # result with no `msg` at all, so the failure below cannot name the cause.
  ignore_errors: true
  when:
    - openbao_status.initialized
    - openbao_provisioning_token | length == 0
    - openbao_reconcile_token | length == 0
    - openbao_reconcile_role_id | length > 0
    - openbao_reconcile_secret_id | length > 0
    - openbao_reconcile_addr | length > 0

- name: Use the reconcile token when it authenticated
  ansible.builtin.set_fact:
    openbao_bootstrap_token: "{{ openbao_reconcile_login.login.auth.client_token }}"
    openbao_reconcile_mode: true
  no_log: true
  when:
    - openbao_reconcile_login is defined
    - not (openbao_reconcile_login.skipped | default(false))
    - (openbao_reconcile_login.login | default({})).auth is defined

# Secret-zero presence IS the discriminator, so no marker file is needed:
#   creds absent  -> never bootstrapped        -> skip loudly (debug, below)
#   creds present -> login MUST succeed        -> anything else is a regression
# Failing red here is the point. A warn-and-continue leaves RBAC silently
# unreconciled while the recap still reads failed=0 — the exact false green
# this whole path exists to remove.
- name: FAIL — the reconcile identity was configured but could not authenticate
  ansible.builtin.fail:
    msg: >-
      OpenBao reconcile login returned no token on {{ inventory_hostname }},
      so RBAC was NOT reconciled. Secret-zero IS present, so this is not the
      never-bootstrapped case.
      What the store actually said:
      {{ (openbao_reconcile_login.msg | default('(no message -- the module did not run)'))
         | regex_replace('\\s+', ' ') }}
      Read that message first; it distinguishes a rejected credential from an
      endpoint the CONTROLLER cannot reach, which is where this login is
      delegated. A rejection on source-address grounds is the CIDR class doing
      its job and means this identity may not reconcile from HERE -- do not add
      a range to get past it.
      To deliberately fall back to the loud skip, unset
      OPENBAO_APPROLE_OPENBAO_RECONCILE_{ROLE,SECRET}_ID.
  when:
    - openbao_reconcile_login is defined
    - not (openbao_reconcile_login.skipped | default(false))
    - (openbao_reconcile_login.login | default({})).auth is not defined

# The reconcile identity is deliberately narrower than a provisioning token: it
# cannot write the break-glass policies, nor create the inert human-gated
# AppRoles. Filter the managed set to what this run's identity may actually
# touch, so a routine converge reconciles everything it owns instead of failing
# on the first path it was never granted.
- name: Resolve the RBAC set this run's identity may manage
  ansible.builtin.set_fact:
    openbao_manageable_policies: >-
      {{ openbao_policies
         if not (openbao_reconcile_mode | default(false))
         else (openbao_policies
               | rejectattr('name', 'in', openbao_reconcile_excluded_policies)
               | list) }}
    openbao_manageable_approles: >-
      {{ openbao_approles
         if not (openbao_reconcile_mode | default(false))
         else (openbao_approles
               | rejectattr('manage_secret_id', 'defined')
               | rejectattr('name', 'in', openbao_reconcile_excluded_policies)
               | list) }}
  when: openbao_bootstrap_token is defined

- name: Report that this run reconciles as the least-privilege identity
  ansible.builtin.debug:
    msg: >-
      OpenBao RBAC reconciling on {{ inventory_hostname }} as openbao-reconcile
      (no operator token): {{ openbao_manageable_policies | length }} of
      {{ openbao_policies | length }} policies and
      {{ openbao_manageable_approles | length }} of
      {{ openbao_approles | length }} AppRoles are in scope. The remainder are
      the break-glass and inert human-gated tiers, which this identity cannot
      write BY DESIGN -- a change to one of those needs a run with
      OPENBAO_PROVISIONING_TOKEN.
  when: openbao_reconcile_mode | default(false)

# Skipping provisioning is the intended default for a routine converge, but it
# is indistinguishable from having provisioned: every gated step below reports
# neither ok nor changed, and the play recap is green either way. That silence
# is what makes a NEWLY DECLARED policy, AppRole or generated app secret look
# applied when it was never written -- the consumer then fails somewhere else
# entirely, pointing at OpenBao rather than at the converge that skipped.
#
# One line, always, naming what was not reconciled. Cheap on a routine run and
# the only signal on the run that mattered.
- name: Report that provisioning was skipped for want of a token
  ansible.builtin.debug:
    msg: >-
      OpenBao provisioning SKIPPED on {{ inventory_hostname }}: no
      OPENBAO_PROVISIONING_TOKEN and this is not a fresh init, so policies,
      AppRoles and app secrets were NOT reconciled
      ({{ openbao_generated_app_secrets | default({}) | length }} generated-secret
      apps, {{ openbao_promoted_app_secrets | default({}) | length }} promoted,
      {{ openbao_policies | default([]) | length }} policies left untouched).
      Routine reconciliation is supposed to happen WITHOUT a provisioning token,
      as the reconcile identity. Reaching this message means this host carries
      NEITHER of the two ways to be that identity: no OPENBAO_RECONCILE_TOKEN
      (a token that already holds the policy, maintained by an agent on the
      host -- the intended shape for an unattended plane), and no secret-zero
      (OPENBAO_APPROLE_OPENBAO_RECONCILE_ROLE_ID / _SECRET_ID). Supply one of
      them. Until then a declared policy change does NOT land, on this run or
      any future one, and the recap stays green while it does not.
  when: openbao_bootstrap_token is not defined

