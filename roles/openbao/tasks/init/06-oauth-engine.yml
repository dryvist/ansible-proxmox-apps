---
- name: Read the staged OAuthapp plugin binary's sha256
  ansible.builtin.stat:
    path: "{{ openbao_plugin_dir }}/{{ openbao_oauthapp_plugin_command }}"
    checksum_algorithm: sha256
  register: openbao_oauthapp_plugin_stat
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool

- name: Assert the OAuthapp plugin binary is staged
  ansible.builtin.assert:
    that:
      - openbao_oauthapp_plugin_stat.stat.exists
    fail_msg: >-
      {{ openbao_plugin_dir }}/{{ openbao_oauthapp_plugin_command }} is missing.
      Re-run the full role so every Raft voter receives the plugin first.
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool

- name: Check whether the OAuthapp plugin version is registered
  ansible.builtin.command:
    cmd: >-
      bao plugin info -format=json
      -version={{ openbao_oauthapp_plugin_catalog_version }}
      secret {{ openbao_oauthapp_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_oauthapp_plugin_check
  no_log: true
  changed_when: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool

- name: Register the OAuthapp plugin version
  ansible.builtin.command:
    cmd: >-
      bao plugin register
      -sha256={{ openbao_oauthapp_plugin_stat.stat.checksum }}
      -command={{ openbao_oauthapp_plugin_command }}
      -version={{ openbao_oauthapp_plugin_catalog_version }}
      secret {{ openbao_oauthapp_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool
    - (openbao_oauthapp_plugin_check.rc | default(1)) != 0

- name: Enable the OAuthapp secrets engine
  ansible.builtin.command:
    cmd: >-
      bao secrets enable -path={{ openbao_oauthapp_mount }}
      -plugin-version={{ openbao_oauthapp_plugin_catalog_version }}
      {{ openbao_oauthapp_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool
    - (openbao_oauthapp_mount ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

- name: Tune the existing OAuthapp mount to the declared plugin version
  ansible.builtin.command:
    cmd: >-
      bao secrets tune -plugin-version={{ openbao_oauthapp_plugin_catalog_version }}
      {{ openbao_oauthapp_mount }}/
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_oauthapp_plugin_tune
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool
    - (openbao_oauthapp_mount ~ '/') in (openbao_mounts_raw.stdout | from_json).keys()
    - >-
      ((openbao_mounts_raw.stdout | from_json)[openbao_oauthapp_mount ~ '/'].plugin_version
       | default('')) != openbao_oauthapp_plugin_catalog_version

- name: Reload the OAuthapp plugin across the Raft cluster after an upgrade
  ansible.builtin.command:
    cmd: "bao plugin reload -plugin={{ openbao_oauthapp_plugin_name }} -scope=global"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_oauthapp_engine_enabled | bool
    - openbao_oauthapp_plugin_tune is changed

# --- SSH secrets engine (builtin — the SSH client CA) ------------------------
# Signed short-TTL client certificates per the ssh-certificate-authority ADR.
# Builtin engine: no plugin staging/registration, just enable + write-once CA
# + add-if-missing roles. Host trust is distributed elsewhere (ansible-proxmox
# ssh_ca_trust role) against a pinned CA fingerprint.
