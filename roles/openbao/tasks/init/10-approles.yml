---
# --- CIDR binding: fail on an empty class rather than create an unbound role --
# Every declared AppRole resolves to a named CIDR class (see
# 08-admin-and-ttls.yml). A class whose CIDRs were never supplied would silently
# produce exactly the unbound, redeemable-from-anywhere secret_id the binding
# exists to prevent — and it would look like a clean converge. So the classes
# actually in use are asserted before anything is written.
- name: Assert every CIDR class in use has been supplied
  ansible.builtin.assert:
    that:
      - openbao_approle_unsupplied_cidr_classes | length == 0
    fail_msg: >-
      CIDR classes {{ openbao_approle_unsupplied_cidr_classes | join(', ') }}
      are used by declared AppRoles but their variables are empty, so those
      secret_ids would be redeemable from ANY source address.
      Supply them via env (OPENBAO_MANAGEMENT_CIDRS / OPENBAO_WORKSTATION_CIDRS /
      OPENBAO_CI_CIDRS, comma-separated) from the iac secret store. To bootstrap
      a cluster before the CIDRs are known, set
      OPENBAO_APPROLE_ALLOW_UNBOUND_CIDRS to accept unbound roles explicitly.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_approle_allow_unbound_cidrs | bool)

- name: Warn loudly about every AppRole that will be created without a CIDR bind
  ansible.builtin.debug:
    msg: >-
      OPENBAO_APPROLE_ALLOW_UNBOUND_CIDRS is set and these CIDR classes are
      empty: {{ openbao_approle_unsupplied_cidr_classes | join(', ') }}.
      Their AppRoles' secret_ids will be accepted from ANY source address.
      This is an accepted-risk bootstrap mode, not a steady state — supply the
      CIDRs and re-converge.
  when:
    - openbao_bootstrap_token is defined
    - openbao_approle_allow_unbound_cidrs | bool

- name: Assert every AppRole this run creates has a source-address class
  vars:
    _unclassed: >-
      {{ openbao_manageable_approles | map(attribute='name')
         | reject('in', openbao_approle_cidr_class_map | list) | list }}
  ansible.builtin.assert:
    that:
      - _unclassed | length == 0
    fail_msg: >-
      AppRoles {{ _unclassed | join(', ') }} are created by this converge but
      resolve to no source-address class, so nothing decides where their
      secret_ids may be redeemed. openbao_approle_cidr_class_map is built from
      openbao_approles; a role declared anywhere else must be added to that
      list, or given the `unbound` class in
      openbao_approle_cidr_class_overrides with a one-line reason on the entry.
      Unbound is a decision that gets written down, never a default.
    quiet: true
  when: openbao_bootstrap_token is defined

# The sibling failure, and the quiet one: the class map is a `combine` of the
# defaults with the override map, so an override key that matches no declared
# role adds a phantom entry and the role it was meant to move stays on the
# machine default. Nothing errors, the converge is green, and the role is bound
# to the wrong segment until somebody reads the live roles back.
- name: Assert every CIDR class override names a declared AppRole
  ansible.builtin.assert:
    that:
      - openbao_approle_unknown_cidr_class_overrides | length == 0
    fail_msg: >-
      openbao_approle_cidr_class_overrides names
      {{ openbao_approle_unknown_cidr_class_overrides | join(', ') }}, which no
      declared AppRole matches. That override is a silent no-op: the role it was
      written for is created in the
      {{ openbao_approle_default_cidr_class }} class instead. Fix the name or
      drop the entry.
    quiet: true
  when: openbao_bootstrap_token is defined

# --- Undeclared-live coverage: fail on an identity code never visits --------
# The sibling of the two asserts above: those catch a role this converge
# CREATES with no source-address class. This one catches the complementary
# case -- a role that exists live and this converge never even LOOPS, because
# it is declared nowhere. Every task in this file (including those two
# asserts) iterates openbao_manageable_approles, which is derived from
# openbao_approles -- the DECLARED set. An identity created in the store by
# any other path (a rename that left the old name behind, a manual
# break-glass create that was never backfilled into code) is a member of
# neither set, so reconciliation never visits it, never bounds it, and never
# notices it again. That is the worst case a converge can produce, and this
# is the only place that can catch it: everywhere else in this file assumes
# the declared list is the whole truth.
#
# `bao list` on this path needs the `list` capability on `auth/approle/role`
# itself (see the list stanza in openbao-reconcile-policy.hcl.j2, added
# alongside this assert) -- a reconcile identity that has not yet had that
# policy rewritten by a provisioning run gets a 403 here, which is caught and
# named below rather than silently read as "no identities exist".
- name: List every AppRole that actually exists in the store
  ansible.builtin.command:
    cmd: "bao list -format=json auth/approle/role"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_approle_live_list
  no_log: true
  changed_when: false
  failed_when: false
  when: openbao_bootstrap_token is defined

# A 403 here is the same trap as the per-role existence check above: it says
# nothing about which identities exist, so the diff below MUST NOT run on a
# denied listing -- an empty read on denial would report a clean converge
# while the live set is invisible.
- name: FAIL -- the AppRole listing was DENIED, so live identities cannot be enumerated
  ansible.builtin.fail:
    msg: >-
      `bao list auth/approle/role` was denied (403), so this run cannot compare
      declared AppRoles against what actually exists in the store -- an
      undeclared identity would be invisible instead of caught. This identity
      needs the `list` capability on `auth/approle/role`, added to
      openbao-reconcile-policy.hcl.j2; one run with OPENBAO_PROVISIONING_TOKEN
      rewrites the policy and closes the gap.
  when:
    - openbao_bootstrap_token is defined
    - (openbao_approle_live_list.rc | default(0)) != 0
    - openbao_approle_live_list.stderr | default('') is search('403')

# A non-zero rc that is NOT a 403 (an empty mount on a brand-new cluster reads
# this way too) legitimately means zero live identities, so it resolves to []
# rather than being treated as denial -- only the FAIL above owns "unknown".
- name: Resolve the set of AppRole names that actually exist live
  ansible.builtin.set_fact:
    openbao_approle_live_names: >-
      {{ ((openbao_approle_live_list.stdout | default('{}') | from_json).data['keys']
          | default([]))
         if (openbao_approle_live_list.rc | default(1)) == 0 else [] }}
  when: openbao_bootstrap_token is defined

- name: Assert every live AppRole is either declared or a named exception
  vars:
    _declared: "{{ openbao_approles | map(attribute='name') | list }}"
    _excepted: >-
      {{ openbao_approle_undeclared_exceptions | map(attribute='name') | list }}
    _undeclared: >-
      {{ openbao_approle_live_names | reject('in', _declared + _excepted) | list }}
  ansible.builtin.assert:
    that:
      - _undeclared | length == 0
    fail_msg: >-
      AppRoles {{ _undeclared | join(', ') }} exist live in the store but are
      declared NOWHERE in openbao_approles, so reconciliation never visits
      them and they keep whatever bounds they were created with indefinitely.
      Add each one to openbao_base_approles (or its generated siblings) so it
      is managed, or -- only for a genuine, deliberate exception -- add it to
      openbao_approle_undeclared_exceptions in
      07c-approle-undeclared-exceptions.yml, with a reason.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - (openbao_approle_live_list.rc | default(1)) == 0 or
      not (openbao_approle_live_list.stderr | default('') is search('403'))

# The reverse direction is a real signal but not the same failure: a role
# declared in code and not yet live is the ordinary shape of "about to be
# created" (first bootstrap, or a role just added to openbao_approles this
# run) or of a break-glass tier this identity deliberately cannot see. Failing
# the converge on it would make every routine rollout of a new AppRole a red
# run. Warn so it stays visible without blocking the create that follows.
- name: Warn about declared AppRoles that reconciliation cannot see live
  vars:
    _missing: >-
      {{ openbao_manageable_approles | map(attribute='name')
         | reject('in', openbao_approle_live_names) | list }}
  ansible.builtin.debug:
    msg: >-
      Declared AppRoles not (yet) visible live: {{ _missing | join(', ') }}.
      Expected on a first create this run; if that is not what is happening,
      the identity may be missing or the create step below failed.
  when:
    - openbao_bootstrap_token is defined
    - (openbao_approle_live_list.rc | default(1)) == 0
    - _missing | length > 0

- name: Check whether each AppRole already exists
  ansible.builtin.command:
    cmd: "bao read -format=json auth/approle/role/{{ item.name }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_manageable_approles }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_approle_checks
  no_log: true
  changed_when: false
  failed_when: false
  when: openbao_bootstrap_token is defined

# A DENIED read is not an ABSENT role. `failed_when: false` above makes both
# return a non-zero rc, and the create below treats any non-zero rc as "this
# role does not exist yet" -- so a 403 fires a privileged create that 403s in
# turn, and the run dies reporting a create failure rather than the access gap
# that actually caused it.
#
# This is reachable by design, not only by misconfiguration. The reconcile
# policy enumerates AppRole paths BY NAME and is excluded from its own managed
# set, so a newly declared AppRole has no grant for the reconcile identity
# until an operator run rewrites that policy. Every reconcile run in between
# hits exactly this path. Name the gap instead of failing on its symptom.
- name: FAIL -- the existence check was DENIED, so absence cannot be concluded
  vars:
    _denied: >-
      {{ openbao_approle_checks.results | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0)
         | selectattr('stderr', 'search', '403')
         | map(attribute='item') | map(attribute='name') | list }}
  ansible.builtin.fail:
    msg: >-
      The AppRole existence check was denied (403) for: {{ _denied | join(', ') }}.
      A denied read says NOTHING about whether the role exists, so this run must
      not conclude it is missing and attempt to create it. This identity holds
      no grant on those paths. If a role was declared recently, the reconcile
      policy enumerates AppRole paths by name and is excluded from its own
      managed set -- one run with OPENBAO_PROVISIONING_TOKEN rewrites it and
      closes the gap.
  when:
    - openbao_bootstrap_token is defined
    - _denied | length > 0

# Resolution order for each bound, most specific first:
#   1. the role's own declaration in openbao_base_approles (most visible)
#   2. the per-role override map in 08-admin-and-ttls.yml
#   3. the global default
# `vars:` is evaluated per loop item, so `item` is in scope here and the command
# stays readable instead of carrying three nested defaults inline.
- name: Create the missing AppRoles bound to their policy
  vars:
    approle_cidr_class: "{{ openbao_approle_cidr_class_map[item.0.name] }}"
    # An explicitly declared but EMPTY secret_id_bound_cidrs (ai-runner, whose
    # value is env-delivered) falls back to its class rather than to unbound.
    approle_bound_cidrs: >-
      {{ item.0.secret_id_bound_cidrs | default('', true)
         or openbao_approle_cidr_classes[approle_cidr_class] }}
    approle_secret_id_ttl: >-
      {{ item.0.secret_id_ttl
         | default(openbao_approle_secret_id_ttl_overrides[item.0.name]
                   | default(openbao_approle_secret_id_ttl)) }}
    # `in` rather than `default()`: an override of 0 is a real value, and
    # `default()` with a boolean-true second argument would discard it.
    approle_secret_id_num_uses: >-
      {{ item.0.secret_id_num_uses
         | default(openbao_approle_secret_id_num_uses_overrides[item.0.name]
                   if item.0.name in openbao_approle_secret_id_num_uses_overrides
                   else openbao_approle_secret_id_num_uses) }}
  ansible.builtin.command:
    cmd: >-
      bao write auth/approle/role/{{ item.0.name }}
      token_policies={{ (item.0.token_policies | default([item.0.policy])) | join(',') }}
      token_ttl={{ item.0.token_ttl | default(openbao_approle_token_ttl) }}
      token_max_ttl={{ item.0.token_max_ttl | default(openbao_approle_token_max_ttl) }}
      secret_id_ttl={{ approle_secret_id_ttl }}
      secret_id_num_uses={{ approle_secret_id_num_uses }}
      {{ ('secret_id_bound_cidrs=' ~ approle_bound_cidrs ~
          ' token_bound_cidrs=' ~ approle_bound_cidrs)
         if (approle_bound_cidrs | length > 0) else '' }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_manageable_approles | zip(openbao_approle_checks.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(0)) != 0
    # absence only -- a denied read is caught by the arm above, and must never
    # reach a privileged create
    - not (item.1.stderr | default('') is search('403'))

# Policy-attachment drift on EXISTING AppRoles is reconciled through the
# dedicated /policies sub-endpoint: it updates token_policies ONLY and does
# not mint a secret_id. TTL / num_uses / token TTL / CIDRs are a sibling
# task below; that write MUST pass the same complete field set as create,
# because a partial `bao write auth/approle/role/<name>` resets omitted
# fields to defaults. Break-glass roles are not in openbao_manageable_approles
# during reconcile and stay inert here BY DESIGN — do not widen the set
# to retune them.
- name: Reconcile token_policies on existing AppRoles
  ansible.builtin.command:
    cmd: >-
      bao write auth/approle/role/{{ item.0.name }}/policies
      token_policies={{ (item.0.token_policies | default([item.0.policy])) | join(',') }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_manageable_approles | zip(openbao_approle_checks.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(1)) == 0
    - >-
      ((item.1.stdout | from_json).data.token_policies | default([]) | sort)
      != ((item.0.token_policies | default([item.0.policy])) | sort)

- name: Reconcile TTL and token bounds on existing AppRoles
  ansible.builtin.include_tasks: 10c-approle-ttl-bounds.yml

# Issuing the credentials for whatever was just created is the other half of
# this job and lives in its own file: everything above DECLARES roles (create,
# reconcile policies, and reconcile bounds on ones that already exist),
# everything below ISSUES credentials for the ones that were new. Split
# because the combined file exceeded the repo's per-file token budget —
# which is the budget working as intended: an agent changing the mint path
# should not have to read the declaration path to find it. Included last so
# ordering is unchanged; the facts it consumes (openbao_approle_checks,
# openbao_manageable_approles) are set above and cross the include intact.
- name: Issue credentials for the AppRoles created this run
  ansible.builtin.include_tasks: 10b-approle-secret-ids.yml
