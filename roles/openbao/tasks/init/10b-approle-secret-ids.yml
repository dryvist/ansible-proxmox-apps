---
# Credential issuance for AppRoles created by 10-approles.yml, which includes
# this file as its final step. Split out of it to stay inside the per-file
# token budget; the seam is DECLARE (there) vs ISSUE (here).
#
# Every loop below iterates the SAME zipped (approle, existence-check) pairs as
# the create task in 10-approles.yml, under the SAME per-item guard, so the
# registered .results lists line up positionally — that alignment is why these
# tasks cannot be reordered or filtered independently, and why they moved as
# one block rather than being split further.

# --- Liveness probe: a stored secret_id can go stale between converges (an
# expired/redeemed-out secret_id, or a hand-rotated pair) with no
# create/absence signal at all — the existence check above only proves the
# ROLE is there, not that its currently-deployed secret_id still works. Every
# existing AppRole with an ambient credential is probed here, in EVERY mode,
# so a dead credential is never silently carried forward (Vikunja 3197: the
# converge's own recap read `ok=5 changed=0` while every domain behind an
# expired secret_id sat isolated for the rest of the play). The probe itself
# needs no privilege — it is an ordinary (public) AppRole login attempt —
# only acting on a dead result is privileged, gated below.
#
# Credentials come from the SAME env-var shape every credential helper in
# this estate already uses for an AppRole's secret-zero (name upper-cased,
# non-alphanumerics -> '_'); see playbooks/verify-approle-ttls.yml, this
# probe's read-only sibling.
- name: Look up ambient credentials for a login probe of each existing AppRole
  ansible.builtin.set_fact:
    openbao_approle_probe_candidates: >-
      {{ (openbao_approle_probe_candidates | default([])) + [{
           'name': item.0.name,
           'role_id': lookup('env', 'OPENBAO_APPROLE_'
             ~ (item.0.name | upper | regex_replace('[^A-Z0-9]', '_'))
             ~ '_ROLE_ID') | default('', true),
           'secret_id': lookup('env', 'OPENBAO_APPROLE_'
             ~ (item.0.name | upper | regex_replace('[^A-Z0-9]', '_'))
             ~ '_SECRET_ID') | default('', true),
         }] }}
  loop: "{{ openbao_manageable_approles | zip(openbao_approle_checks.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - (item.1.rc | default(1)) == 0
    - item.0.manage_secret_id | default(true)

- name: Keep only probe candidates with both halves of a credential present
  ansible.builtin.set_fact:
    openbao_approle_probe_testable: >-
      {{ (openbao_approle_probe_candidates | default([]))
         | selectattr('role_id') | selectattr('secret_id') | list }}
  no_log: true
  when: openbao_bootstrap_token is defined

- name: Probe whether each existing AppRole's stored secret_id still authenticates
  ansible.builtin.uri:
    url: "{{ openbao_write_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ item.role_id }}"
      secret_id: "{{ item.secret_id }}"
    status_code: [200, 400, 403]
  loop: "{{ openbao_approle_probe_testable | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_approle_probes
  no_log: true
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - (openbao_approle_probe_testable | default([])) | length > 0

# OpenBao returns the SAME HTTP 400 for "this secret_id is actually dead"
# and for "this secret_id is fine but your CIDR-bound role refuses this
# source address" (e.g. github-runner, scoped to CI-runner subnets only —
# this probe never runs from one). status_code alone cannot tell them apart;
# only the error text can ("... unauthorized by CIDR restrictions on the
# role"). Treating a CIDR refusal as "dead" was reminting a perfectly good
# secret_id on every privileged run, discarding a credential a real consumer
# may still be using.
- name: Determine which existing AppRoles hold a dead stored secret_id
  ansible.builtin.set_fact:
    openbao_approle_dead_names: >-
      {%- set _dead = [] -%}
      {%- for result in (openbao_approle_probes.results | default([])) -%}
      {%- if not (result.skipped | default(false)) and (result.status | default(200)) != 200 -%}
      {%- set _errs = (result.json.errors | default([])) | join(' ') -%}
      {%- if 'CIDR restrictions' not in _errs -%}
      {%- set _ = _dead.append(result.item.name) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _dead }}
  no_log: true
  when: openbao_bootstrap_token is defined

# Same probe results, the CIDR-refused half: not proven dead, not provable
# alive from this host either — surfaced so an operator can distinguish
# "needs reminting" from "needs probing from an allowed host", instead of
# both looking identical in the recap.
- name: Determine which existing AppRoles could not be probed from this host (CIDR-bound)
  ansible.builtin.set_fact:
    openbao_approle_cidr_inconclusive_names: >-
      {%- set _names = [] -%}
      {%- for result in (openbao_approle_probes.results | default([])) -%}
      {%- if not (result.skipped | default(false)) and (result.status | default(200)) != 200 -%}
      {%- set _errs = (result.json.errors | default([])) | join(' ') -%}
      {%- if 'CIDR restrictions' in _errs -%}
      {%- set _ = _names.append(result.item.name) -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _names }}
  no_log: true
  when: openbao_bootstrap_token is defined

- name: Report which existing AppRoles' stored secret_id failed to authenticate
  ansible.builtin.debug:
    msg: >-
      Dead stored secret_id (login probe failed): {{ (openbao_approle_dead_names | default([])) | join(', ') }}
  when:
    - openbao_bootstrap_token is defined
    - (openbao_approle_dead_names | default([])) | length > 0

- name: Report which existing AppRoles' stored secret_id could not be probed (CIDR-bound role)
  ansible.builtin.debug:
    msg: >-
      Skipped as inconclusive, not reminted (source address refused by the
      role's own CIDR bind, not a dead credential): {{ (openbao_approle_cidr_inconclusive_names | default([])) | join(', ') }}
  when:
    - openbao_bootstrap_token is defined
    - (openbao_approle_cidr_inconclusive_names | default([])) | length > 0

# A routine reconcile CANNOT mint (see the gate on the mint task below) — so
# a dead credential found here must be loud, never a silent carry. This is
# the assertion that removes the exact false green from the memory note: a
# recap of `ok=N changed=0` that looks clean while every domain behind an
# expired secret_id fails for the rest of the play.
- name: FAIL -- a routine reconcile found a dead stored secret_id it cannot remint
  ansible.builtin.fail:
    msg: >-
      These AppRoles hold a stored secret_id that failed to authenticate:
      {{ (openbao_approle_dead_names | default([])) | join(', ') }}. Minting
      belongs to a privileged provisioning-token run, not the reconcile
      identity — a routine converge must not silently carry a dead credential
      forward. Re-run with OPENBAO_PROVISIONING_TOKEN to remint it.
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - (openbao_approle_dead_names | default([])) | length > 0

# Surface role_id + a fresh secret_id for any AppRole that either was JUST
# created THIS run (the check above found it missing) OR already exists but
# its stored secret_id just failed the liveness probe above — so re-runs
# never mint new credentials silently, whether this is the very first
# bootstrap (everything is new), a later run against an already-live cluster
# that only adds a few new identities, or a repair run reminting a domain
# whose secret_id expired between converges. Each task below loops over the
# SAME zipped (approle, existence-check) pairs as "Create the missing
# AppRoles" above, with the SAME per-item `when` guard, so every registered
# .results list lines up positionally — skipped iterations stay skipped in
# lockstep across role_id read, secret_id generation, and the final
# break-glass write.
- name: Determine which AppRole names need a secret_id minted this run
  ansible.builtin.set_fact:
    openbao_approle_mint_names: >-
      {{ ((openbao_approle_checks.results | default([])
           | rejectattr('skipped', 'defined')
           | rejectattr('rc', 'equalto', 0)
           | map(attribute='item') | map(attribute='name') | list)
          + (openbao_approle_dead_names | default([]))) | unique | list }}
  when: openbao_bootstrap_token is defined

# Runs on the controller (openbao_cli_host, resolved in init/02): one module
# execution per AppRole minted this run. Same CLI, same rc/stdout, so the
# secret_id mint further down reads unchanged.
- name: Read newly-created AppRole role_ids
  ansible.builtin.command:
    cmd: "bao read -format=json auth/approle/role/{{ item.0.name }}/role-id"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_manageable_approles | zip(openbao_approle_checks.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  register: openbao_role_ids
  no_log: true
  changed_when: false
  when:
    - openbao_bootstrap_token is defined
    - item.0.name in (openbao_approle_mint_names | default([]))
    # Inert (manage_secret_id:false) roles are excluded from role_id read,
    # secret_id mint, break-glass write, AND the derived "newly created" list, so
    # the "publish creds to Doppler" instruction never names a role with no
    # standing creds. Their role_id is retrievable on demand at grant time.
    - item.0.manage_secret_id | default(true)

# manage_secret_id:false roles (ai-apply-<domain>, ai-admin) deliberately get NO
# standing secret_id — the human-gated access model mints a single-use,
# response-wrapped secret_id on demand instead. The role is created inert above;
# skipping here (and in the break-glass write below) keeps a skipped result in
# .results at this index so the positional zip in the break-glass write stays
# aligned, exactly like an already-existing role is skipped.
#
# The mint passes the role's ttl/num_uses EXPLICITLY rather than relying on the
# role's own defaults. The drop file this produces is an unpublished credential
# sitting on a controller's disk until an operator moves it into the store and
# deletes it; when the role was created with secret_id_ttl=0 that file was a
# credential that never expired, so a forgotten one stayed live forever. Naming
# the bounds at the mint also makes them correct for a role that already exists
# on the cluster with looser bounds.
#
# SKIPPED IN RECONCILE MODE. Minting now belongs to approle-issuer, not to
# openbao-reconcile, so the reconcile identity holds no secret-id grant and this
# would 403. A reconcile run may CREATE a newly declared role with the right
# bounds; issuing its first credential is a separate, deliberate act. The
# instruction task below names any role left in that state — an unattended run
# must not leave a credential-less role reported as a clean converge.
- name: Generate newly-created AppRole secret_ids
  vars:
    approle_secret_id_ttl: >-
      {{ item.0.secret_id_ttl
         | default(openbao_approle_secret_id_ttl_overrides[item.0.name]
                   | default(openbao_approle_secret_id_ttl)) }}
    approle_secret_id_num_uses: >-
      {{ item.0.secret_id_num_uses
         | default(openbao_approle_secret_id_num_uses_overrides[item.0.name]
                   if item.0.name in openbao_approle_secret_id_num_uses_overrides
                   else openbao_approle_secret_id_num_uses) }}
  ansible.builtin.command:
    cmd: >-
      bao write -format=json auth/approle/role/{{ item.0.name }}/secret-id
      ttl={{ approle_secret_id_ttl }}
      num_uses={{ approle_secret_id_num_uses }}
  environment:
    BAO_ADDR: "{{ openbao_write_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_manageable_approles | zip(openbao_approle_checks.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.name }}"
  register: openbao_secret_ids
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - item.0.name in (openbao_approle_mint_names | default([]))
    - item.0.manage_secret_id | default(true)
    - not (openbao_reconcile_mode | default(false))

- name: Write each newly-created AppRole's break-glass material to controller (0600)
  ansible.builtin.copy:
    content: |
      {
        "approle": "{{ item.0.0.name }}",
        "policy": "{{ (item.0.0.token_policies | default([item.0.0.policy])) | join(',') }}",
        "vault_addr": "{{ openbao_api_addr }}",
        "role_id": "{{ (item.1.stdout | from_json).data.role_id }}",
        "secret_id": "{{ (item.2.stdout | from_json).data.secret_id }}"
      }
    dest: "{{ openbao_approle_file_prefix }}-{{ item.0.0.name }}-{{ inventory_hostname }}.json"
    mode: "0600"
  loop: >-
    {{ (openbao_manageable_approles | zip(openbao_approle_checks.results | default([])) | list)
       | zip(openbao_role_ids.results | default([]),
             openbao_secret_ids.results | default([]))
       | list }}
  loop_control:
    label: "{{ item.0.0.name }}"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - item.0.0.name in (openbao_approle_mint_names | default([]))
    - item.0.0.manage_secret_id | default(true)
    - not (openbao_reconcile_mode | default(false))

# Derive the list of names actually created THIS run (for the instruction
# message below) from the role_id-read results: Ansible preserves `item` on
# every registered loop result including skipped ones, so filtering out
# entries with `skipped` defined leaves exactly the AppRoles that were new.
- name: Determine which AppRole names were newly created this run
  ansible.builtin.set_fact:
    openbao_new_approle_names: >-
      {{ openbao_role_ids.results | default([])
         | rejectattr('skipped', 'defined')
         | map(attribute='item')
         | map(attribute='0')
         | map(attribute='name')
         | list }}
  when: openbao_bootstrap_token is defined

- name: INSTRUCT — a reconcile run created AppRoles but cannot issue credentials
  ansible.builtin.debug:
    msg: >-
      ============================================================
      Created on this reconcile run, WITHOUT a secret_id:
      {{ (openbao_new_approle_names | default([])) | join(', ') }}.
      Minting belongs to approle-issuer, not to the reconcile identity, so
      these roles exist with the right bounds but hold no usable credential
      yet. Issue each one deliberately (approle-issuer, or a run with
      OPENBAO_PROVISIONING_TOKEN) and publish it. Until then any consumer of
      these roles fails to authenticate — this is a known gap, not a clean run.
      ============================================================
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - (openbao_new_approle_names | default([])) | length > 0

- name: INSTRUCT — publish each new AppRole's creds to Doppler tier-0, then delete
  ansible.builtin.debug:
    msg: >-
      ============================================================
      New AppRoles created: {{ (openbao_new_approle_names | default([])) | join(', ') }}.
      Each role_id + secret_id was written to a 0600 file on this
      controller: {{ openbao_approle_file_prefix }}-<role>-{{ inventory_hostname }}.json
      (gitignored). Each secret_id now EXPIRES ({{ openbao_approle_secret_id_ttl }}
      by default) and is redemption-capped, so a drop file left behind stops
      being a working credential instead of staying live forever — but publish
      promptly or the credential expires before it is used.
      Publish each to Doppler tier-0, consumed as ambient
      env under `doppler run` (see terraform-proxmox
      docs/SECRETS_HIERARCHY.md), except:
        - `public` -> ships ambiently, needs no secret-zero (it's the
          anonymous, non-exploitable-facts identity)
      Then SECURELY DELETE these files. Prefer the OpenBao ingress
      FQDN for BAO_ADDR (node-independent, survives a single node
      loss) over a raw node IP. Do NOT commit these files. Do NOT
      leave them on disk.
      ============================================================
  when:
    - openbao_bootstrap_token is defined
    - (openbao_new_approle_names | default([])) | length > 0
    - not (openbao_reconcile_mode | default(false))
