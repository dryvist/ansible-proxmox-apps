---
# The SSH ENGINE (mount + CA key) is bootstrap work: the reconcile identity's
# policy grants <ssh_mount>/roles/<name> but nothing on sys/mounts or
# ssh/config/ca, so each of these 403s under a reconcile-mode run. Note the
# reconcile login assigns its token to openbao_bootstrap_token, so
# `openbao_bootstrap_token is defined` no longer means "operator token" and
# cannot gate a privileged task on its own.
#
# The CA probe is gated too, not just the write: it runs under
# failed_when: false, and a DENIED read returns rc != 0 exactly like an absent
# CA — which then triggers the privileged key generation that cannot succeed.
#
# The SSH signing ROLES below stay ungated: they are in the reconcile policy by
# design, and skipping them would silently stop reconciling them.
- name: Enable the SSH secrets engine
  ansible.builtin.command:
    cmd: "bao secrets enable -path={{ openbao_ssh_mount }} ssh"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  no_log: true
  changed_when: true
  when:
    - not (openbao_reconcile_mode | default(false))
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool
    - (openbao_ssh_mount ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

# Write-once: the CA keypair is generated INSIDE OpenBao on first configuration
# and never exported; a routine converge with a CA already configured leaves it
# untouched (rotation is a deliberate operator action via the multi-issuer API).
- name: Check whether the SSH CA is already configured
  ansible.builtin.command:
    cmd: "bao read -format=json {{ openbao_ssh_mount }}/config/ca"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_ssh_ca_check
  no_log: true
  changed_when: false
  failed_when: false
  when:
    - not (openbao_reconcile_mode | default(false))
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

- name: Generate the SSH CA signing key (first configuration only, never exported)
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/{{ openbao_ssh_mount }}/config/ca"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    # key_type per the ADR (ed25519). If the deployed OpenBao rejects it the
    # converge fails loudly here — do NOT silently fall back; see defaults.
    body: >-
      {{ {'generate_signing_key': true}
         | combine({'key_type': openbao_ssh_ca_key_type} if openbao_ssh_ca_key_type | length > 0 else {}) }}
    status_code:
      - 200
      - 204
  no_log: true
  changed_when: true
  when:
    - not (openbao_reconcile_mode | default(false))
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool
    - (openbao_ssh_ca_check.rc | default(1)) != 0

# Surface the CA public key + fingerprint ONCE, in this verified bootstrap
# session — this is the trusted ceremony the ssh_ca_trust role's pinned
# fingerprint comes from (committed as reviewable IaC data, human-reviewed
# before any trust rollout). Public material only; safe to log.
- name: Read the SSH CA public key
  ansible.builtin.command:
    cmd: "bao read -field=public_key {{ openbao_ssh_mount }}/config/ca"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_ssh_ca_public_key
  changed_when: false
  when:
    - not (openbao_reconcile_mode | default(false))
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

- name: Show the SSH CA public key fingerprint (pin this in ssh_ca_trust)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      printf '%s\n' "{{ openbao_ssh_ca_public_key.stdout }}"
      | ssh-keygen -l -f /dev/stdin
    executable: /bin/bash
  register: openbao_ssh_ca_fingerprint
  changed_when: false
  when:
    - not (openbao_reconcile_mode | default(false))
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

- name: Report the SSH CA fingerprint
  ansible.builtin.debug:
    msg: "SSH CA fingerprint (pin in ansible-proxmox ssh_ca_trust): {{ openbao_ssh_ca_fingerprint.stdout }}"
  when:
    - not (openbao_reconcile_mode | default(false))
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

- name: Warn when no source-address restriction is configured for SSH certs
  ansible.builtin.debug:
    msg: >-
      OPENBAO_SSH_SOURCE_CIDRS is unset — SSH certificates will be valid from
      ANY source address. Documented residual: compensated by the guest
      firewall default-deny layer. Set the env var (Doppler) to add the
      source-address critical option.
  when:
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool
    - openbao_ssh_source_address_cidrs | length == 0

- name: Check which SSH signing roles already exist
  ansible.builtin.command:
    cmd: "bao read -format=json {{ openbao_ssh_mount }}/roles/{{ item.name }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_ssh_roles }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_ssh_role_checks
  no_log: true
  changed_when: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

# Explicit principals only — never allowed_users="*" (documented upstream
# wildcard bug, and a wildcard would defeat the per-principal-class design).
# ttl == max_ttl: a sign request may shorten a cert's life, never extend it.
- name: Reconcile the SSH signing roles
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/{{ openbao_ssh_mount }}/roles/{{ item.0.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body: >-
      {{ {
           'key_type': 'ca',
           'allow_user_certificates': true,
           'allowed_users': item.0.principal,
           'default_user': item.0.principal,
           'ttl': item.0.ttl,
           'max_ttl': item.0.ttl,
           'allowed_extensions': item.0.extensions.keys() | join(','),
           'default_extensions': item.0.extensions,
           'algorithm_signer': 'default'
         }
         | combine({'default_critical_options': {'source-address': openbao_ssh_source_address_cidrs}}
                   if openbao_ssh_source_address_cidrs | length > 0 else {}) }}
    status_code:
      - 200
      - 204
  loop: >-
    {{ openbao_ssh_roles
       | zip(openbao_ssh_role_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  changed_when: >-
    (item.1.rc | default(1)) != 0
    or (item.1.stdout | from_json).data.max_ttl != item.0.ttl
  when:
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

# --- Fail-closed guard: no AI capability leaf for the control plane / kernel --
# The base read-/write- leaves are rendered blindly from openbao_ai_domains +
# openbao_ai_readonly_extra_subtrees. A typo or malicious entry naming the IaC
# kernel or a control-plane mount (infra / sys / auth) would mint a leaf granting
# it, and every rollup composed of leaves would inherit it — the one way the
# enumerated-allowlist proof could be subverted. Refuse before rendering anything.
- name: Assert no AI capability subtree names a forbidden control-plane path
  ansible.builtin.assert:
    that:
      - (openbao_ai_domains + openbao_ai_readonly_extra_subtrees)
        | map('lower') | select('in', openbao_ai_forbidden_subtrees) | list | length == 0
    fail_msg: >-
      An AI capability subtree names a forbidden control-plane/kernel path
      ({{ openbao_ai_forbidden_subtrees | join(', ') }}). Refusing to render base
      read-/write- leaves — this would grant the IaC kernel or the policy/auth
      control plane and break the self-escalation invariant.
    success_msg: "AI capability subtrees are all outside the control plane/kernel."
  when: openbao_bootstrap_token is defined

# Companion guard for the ssh-sign leaves: they are the one DELIBERATE grant
# class outside secret/, allowlisted to exactly <ssh mount>/sign/<enumerated
# role>. Refuse if the mount collides with a control-plane path or a sign leaf
# names a role outside the enumerated openbao_ssh_roles table.
- name: Assert ssh-sign leaves stay inside the enumerated SSH CA sign allowlist
  ansible.builtin.assert:
    that:
      - openbao_ssh_mount not in (openbao_ai_forbidden_subtrees + [openbao_kv_mount])
      - >-
        openbao_ssh_sign_policies | map(attribute='ssh_role')
        | reject('in', openbao_ssh_roles | map(attribute='name') | list)
        | list | length == 0
    fail_msg: >-
      An ssh-sign policy targets a mount or role outside the enumerated SSH CA
      allowlist ({{ openbao_ssh_mount }}/sign/<{{ openbao_ssh_roles | map(attribute='name') | join('|') }}>).
      Refusing to render.
    success_msg: "ssh-sign leaves are confined to the enumerated SSH CA sign endpoints."
  when:
    - openbao_bootstrap_token is defined
    - openbao_ssh_engine_enabled | bool

# --- RBAC policies (write-if-missing-or-changed) ----------------------------
# Rendered on the TARGET: `bao policy write` below executes there and reads
# the file from its local filesystem (a controller-side render is unreachable
# from the target). Policy HCL is non-secret — it comes from the committed
# templates. Rendered into openbao_config_dir (/etc/openbao, 0750 root:openbao)
# rather than world-writable /tmp, so the write is not exposed to symlink races
# or other local users on the host.
