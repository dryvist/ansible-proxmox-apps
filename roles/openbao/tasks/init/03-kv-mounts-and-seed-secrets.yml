---
- name: List enabled secrets engines
  ansible.builtin.command:
    cmd: bao secrets list -format=json
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_mounts_raw
  no_log: true
  changed_when: false
  when: openbao_bootstrap_token is defined

# Each tier is its OWN mount, never a path prefix inside another: a prefix
# shares one policy namespace, so an existing wildcard grant reaches straight
# across it. openbao_kv_mounts (defaults/main.yml) declares all three —
#   secret            internal-only service credentials
#   secrets-external  credentials for internet-reachable vendor APIs, so a leak
#                     is scoped to its own blast radius (literal here and in the
#                     policy templates — see the secrets-policy split doc)
#   config            non-secret configuration, read by exactly one AppRole
# — so adding a tier is a row of data, not another copy of this task.
- name: Assert the declared KV mounts are distinct and outside the control plane
  ansible.builtin.assert:
    that:
      - (openbao_kv_mounts | map(attribute='path') | list | unique | length)
        == (openbao_kv_mounts | length)
      - openbao_kv_mounts | map(attribute='path') | map('lower')
        | select('in', openbao_ai_forbidden_subtrees) | list | length == 0
    fail_msg: >-
      openbao_kv_mounts declares a duplicate mount path, or names a
      control-plane path ({{ openbao_ai_forbidden_subtrees | join(', ') }}).
      Refusing to enable — a duplicate would make one tier's policies reach
      another's data, which is the whole reason these are separate mounts.
    success_msg: "KV mounts are distinct and outside the control plane."
  when: openbao_bootstrap_token is defined

- name: Enable the declared KV v2 mounts (add-if-missing)
  ansible.builtin.command:
    cmd: "bao secrets enable -path={{ item.path }} -version=2 kv"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_kv_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (item.path ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

# Version retention, for the mounts that declare one. Runs AFTER the enable
# above so a mount created in this same run is tuned immediately rather than
# spending its first converge on the KV v2 default.
- name: Read the current version-retention config of each tuned KV mount
  ansible.builtin.command:
    cmd: "bao read -format=json {{ item.path }}/config"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_kv_tuned_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: openbao_kv_config_checks
  no_log: true
  changed_when: false
  failed_when: false
  when: openbao_bootstrap_token is defined

# delete_version_after is left alone on purpose: its default of 0 means
# versions never time-expire, and history that silently ages out cannot be
# rolled back to. max_versions alone bounds the growth.
- name: Set KV v2 version retention on the tuned mounts (write-if-changed)
  ansible.builtin.command:
    cmd: "bao write {{ item.0.path }}/config max_versions={{ item.0.max_versions | int }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: >-
    {{ openbao_kv_tuned_mounts
       | zip(openbao_kv_config_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.path }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - >-
      (item.1.rc | default(1)) != 0
      or ((item.1.stdout | default('{}', true) | from_json).data.max_versions
          | default(0, true) | int) != (item.0.max_versions | int)

# --- App-secret promotion (merge-preserving, write-if-changed) ---------------
# Promote each app's EXISTING service credentials into secret/apps/<app> so
# OpenBao is their canonical home. Values come from the converge environment,
# mapped field -> env var by openbao_promoted_app_secrets. Runs only on the
# bootstrap host under the admin token. See promote_app_secret.yml for the
# merge-preserving contract.
- name: Promote per-app service secrets into OpenBao (write-if-changed)
  ansible.builtin.include_tasks: ../promote_app_secret.yml
  loop: "{{ openbao_promoted_app_secrets | dict2items }}"
  loop_control:
    loop_var: openbao_promote_item
    label: "{{ openbao_promote_item.key }}"
  vars:
    openbao_promote_app: "{{ openbao_promote_item.key }}"
    openbao_promote_fields: "{{ openbao_promote_item.value }}"
  when: openbao_bootstrap_token is defined

# --- App-secret generation (generate-if-absent) -----------------------------
# Generate + seed each app's service credentials directly in OpenBao, replacing
# the retired terraform-proxmox vault-secrets root. Human-gated: runs only on
# the bootstrap host under the admin token. Each secret is created ONCE when
# absent and never rewritten, so a live credential is never rotated (same
# create-once contract the tofu root had via random_password + ignore_changes).
- name: Generate + seed per-app service secrets in OpenBao (generate-if-absent)
  ansible.builtin.include_tasks: ../seed_generated_app_secret.yml
  loop: "{{ openbao_generated_app_secrets | dict2items }}"
  loop_control:
    loop_var: openbao_seed_item
    label: "{{ openbao_seed_item.key }}"
  vars:
    openbao_seed_app: "{{ openbao_seed_item.key }}"
    openbao_seed_fields: "{{ openbao_seed_item.value }}"
  when: openbao_bootstrap_token is defined

# --- AWS secrets engine (external plugin: register + enable, add-if-missing) -
# Dynamic STS creds for role/tf-proxmox — replaces the laptop's static
# aws-vault base key. The engine is NOT builtin: main.yml staged the plugin
# binary on every node; here the bootstrap host registers it in the
# cluster-replicated catalog (pinned to the staged binary's sha256), then
# mounts it. See defaults/main.yml for the var docs.
