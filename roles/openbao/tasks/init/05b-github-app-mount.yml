---
# One GitHub App mount (loop var `gm`, from openbao_github_app_mounts): enable,
# configure the App, refuse silent App-ID drift, reconcile its permission sets
# and delete undeclared ones. The App is (re)configured only when a private key
# is supplied: first configuration, or a deliberate key or App change. Plugin
# registration is shared with the admin mount (05-github-engine.yml runs first).
- name: "Enable GitHub App mount {{ gm.mount }}"
  ansible.builtin.command:
    cmd: >-
      bao secrets enable -path={{ gm.mount }}
      -plugin-version={{ openbao_github_plugin_catalog_version }}
      {{ openbao_github_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_write_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  no_log: true
  changed_when: true
  when: (gm.mount ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

- name: "Read the configuration on mount {{ gm.mount }}"
  ansible.builtin.command:
    cmd: "bao read -format=json {{ gm.mount }}/config"
  environment:
    BAO_ADDR: "{{ openbao_write_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_github_app_mount_config
  no_log: true
  changed_when: false
  failed_when: false

- name: "Determine whether the App is configured on mount {{ gm.mount }}"
  ansible.builtin.set_fact:
    openbao_github_app_mount_configured: >-
      {{ (openbao_github_app_mount_config.rc | default(1)) == 0
         and ((openbao_github_app_mount_config.stdout | default('{}', true)
               | from_json).data.app_id | default(0, true) | int) != 0 }}

- name: "Configure the App credentials (first or deliberate) on mount {{ gm.mount }}"
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/{{ gm.mount }}/config"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      app_id: "{{ gm.app_id | int }}"
      prv_key: "{{ gm.private_key }}"
      exclude_repository_metadata: true
    status_code:
      - 200
      - 204
  no_log: true
  register: openbao_github_app_mount_configure
  when:
    - gm.app_id | length > 0
    - gm.private_key | length > 0

- name: "Refuse an unexpected App ID drift on mount {{ gm.mount }}"
  ansible.builtin.assert:
    that:
      - >-
        (openbao_github_app_mount_config.stdout | from_json).data.app_id | string
        == gm.app_id | string
    fail_msg: >-
      The App ID configured on {{ gm.mount }} differs from the declared one.
      Rotate deliberately; a routine converge will not replace it.
  when:
    - openbao_github_app_mount_configured | bool
    - gm.app_id | length > 0
    - openbao_github_app_mount_configure is skipped

- name: "Assert every set declares an administration-free ceiling on mount {{ gm.mount }}"
  ansible.builtin.assert:
    that:
      - item.permissions is mapping
      - item.permissions | length > 0
      - "'administration' not in item.permissions"
      - "'organization_administration' not in item.permissions"
      - item.installation_id | int > 0
    fail_msg: >-
      {{ gm.mount }}/permissionset/{{ item.name }} must carry an explicit,
      non-empty permission map without administration, and an installation ID.
    quiet: true
  loop: "{{ gm.permission_sets }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Read the public repositories for sets that are public-only on mount {{ gm.mount }}"
  ansible.builtin.uri:
    url: >-
      https://api.github.com/orgs/{{ item.public_repos_of }}/repos?type=public&per_page=100
    headers:
      Accept: application/vnd.github+json
    return_content: true
  loop: "{{ gm.permission_sets | selectattr('public_repos_of', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_github_app_mount_public_repos

# ponytail: one page of 100; add pagination when the org passes 100 public repos.
- name: "Resolve the set repository lists on mount {{ gm.mount }}"
  ansible.builtin.set_fact:
    openbao_github_app_mount_sets: >-
      {{ openbao_github_app_mount_sets | default([])
         + [item | combine({'repositories': (openbao_github_app_mount_public_repos.results
               | selectattr('item.name', 'equalto', item.name) | first).json
               | map(attribute='name') | sort | list}
             if item.public_repos_of is defined else {})] }}
  loop: "{{ gm.permission_sets }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Refuse a public-only set with an empty or full-page repository list on mount {{ gm.mount }}"
  ansible.builtin.assert:
    that:
      - item.repositories | length > 0
      - item.repositories | length < 100
    fail_msg: >-
      {{ gm.mount }}/permissionset/{{ item.name }} resolved
      {{ item.repositories | length }} public repositories. An empty list would
      store an unbounded set; 100 means the page is full and the list is
      truncated.
    quiet: true
  loop: "{{ openbao_github_app_mount_sets | selectattr('public_repos_of', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Read the permission sets on mount {{ gm.mount }}"
  ansible.builtin.command:
    cmd: "bao read -format=json {{ gm.mount }}/permissionset/{{ item.name }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_github_app_mount_sets }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_github_app_mount_set_checks
  no_log: true
  changed_when: false
  failed_when: false

- name: "Reconcile the permission sets on mount {{ gm.mount }}"
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/{{ gm.mount }}/permissionset/{{ item.0.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body: >-
      {{ {'installation_id': item.0.installation_id | int,
          'permissions': item.0.permissions}
         | combine({'repositories': item.0.repositories}
                   if item.0.repositories is defined else {}) }}
    status_code:
      - 200
      - 204
  loop: >-
    {{ openbao_github_app_mount_sets
       | zip(openbao_github_app_mount_set_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  when: >-
    (item.1.rc | default(1)) != 0
    or ((item.1.stdout | from_json).data.installation_id | int)
       != (item.0.installation_id | int)
    or ((item.1.stdout | from_json).data.permissions | default({}, true))
       != item.0.permissions
    or ((item.1.stdout | from_json).data.repositories | default([], true))
       != (item.0.repositories | default([], true))

- name: "List the permission sets on mount {{ gm.mount }}"
  ansible.builtin.command:
    cmd: "bao list -format=json {{ gm.mount }}/permissionset"
  environment:
    BAO_ADDR: "{{ openbao_write_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_github_app_mount_set_list
  no_log: true
  changed_when: false
  failed_when: false

# A set left over from another App (this mount's previous backing App) would
# otherwise keep minting at the new App's full ceiling.
- name: "Delete undeclared permission sets on mount {{ gm.mount }}"
  ansible.builtin.command:
    cmd: "bao delete {{ gm.mount }}/permissionset/{{ item }}"
  environment:
    BAO_ADDR: "{{ openbao_write_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: >-
    {{ ((openbao_github_app_mount_set_list.stdout | default('[]', true)) | from_json)
       | difference(openbao_github_app_mount_sets | map(attribute='name') | list) }}
  no_log: true
  changed_when: true
  when: (openbao_github_app_mount_set_list.rc | default(1)) == 0

- name: "Reset the per-mount set list after {{ gm.mount }}"
  ansible.builtin.set_fact:
    openbao_github_app_mount_sets: []
