---
# Split out of init/02-initialize-cluster.yml (which import_tasks'ds this
# file at the same point) purely to keep that file under the repo's per-file
# token-limit gate -- no behavioral change from being its own file.
#
# --- Resolve where provisioning writes go -----------------------------------
# Everything below this point in init.yml WRITES: policies, AppRoles, engine
# config, KV seeds, rotation-exempt metadata. Raft accepts a write only on the
# active node. Sending it to this host's own listener makes every one of those
# writes depend on the standby->leader forwarding hop, which is the hop that
# intermittently fails here — see openbao_write_addr in
# defaults/main/00-install-and-node.yml for the full reasoning and the audit
# signature it produces.
#
# The status is re-read rather than reusing init/01's: a fresh init may have
# happened in between, and 01's copy predates the leader existing.
#
# `bao status` exits 2 on a sealed node and 0 otherwise; a sealed node has no
# leader to resolve, so both are tolerated and the fallback covers it.
#
# Resolved here (immediately after the reconcile login), not further down:
# the policy-sync pair right below needs it, and every write task after that
# needs it too.
- name: Read OpenBao status again to resolve the current Raft leader
  ansible.builtin.command:
    cmd: bao status -format=json
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
  register: openbao_leader_status_raw
  changed_when: false
  failed_when: false

# leader_address is the leader's advertised api_addr, reachable from this host
# on the same VLAN the retry_join peers use. Absent, empty, or unparseable
# status all fall back to this node's own listener — the pre-existing
# behaviour, so a resolution failure degrades rather than breaks the converge.
- name: Point provisioning writes at the Raft leader
  ansible.builtin.set_fact:
    openbao_write_addr: >-
      {{ ((openbao_leader_status_raw.stdout | default('{}', true) | from_json)
          .leader_address | default('', true)) or openbao_api_addr }}

- name: Report where this run's provisioning writes are going
  ansible.builtin.debug:
    msg: >-
      OpenBao provisioning writes on {{ inventory_hostname }} target
      {{ openbao_write_addr }}
      ({{ 'the Raft leader' if openbao_write_addr != openbao_api_addr
          else 'this node itself — no leader resolved, so writes depend on the
                standby forwarding hop' }}).

# A reconcile-mode run may manage only what its OWN policy grants. That policy
# is excluded from the set reconcile can rewrite (it cannot widen its own
# grants), so the live policy drifts BEHIND the declared set the moment a new
# policy is declared -- and every read/write of the new name then 403s.
#
# Ask the server what this token can actually do rather than inferring it from
# the declared set, and fail LOUDLY naming the shortfall. Silently narrowing to
# what happens to work is the exact false green this block exists to prevent:
# a declared policy would never be written and nothing would say so.
# The prefix is added by matching '^' rather than capturing the whole name and
# substituting \1. A backreference does not survive the trip: YAML, Jinja and
# `command`'s shlex.split each get a say in what a backslash means, and the net
# effect was that all 60 paths rendered as the single literal
# `sys/policies/acl/1` -- a policy that does not exist, so the server answered
# `deny` and the gate concluded the identity could write nothing. It had never
# once asked about a real path.
# policy-sync: bring the reconcile policy itself in step with the declared set
# BEFORE any other init step consumes a reconcile grant for a newly declared
# name. init/07 (SSH signing roles) and init/10 (AppRoles) each write to a
# path keyed by name -- exactly what a stale reconcile policy 403s on the
# moment a new name is declared, aborting the play before this pair ever gets
# a chance to run. Only a token carrying policy-sync passes the capability
# check below; any other reconcile identity skips.
#
# The only identity that ever passes that check is the inert
# openbao-policy-sync AppRole (defaults/main/07f-workstation-approles.yml),
# which is bound to the WORKSTATION CIDR class
# (defaults/main/08b-cidr-and-unlock.yml) -- a token issued to it is usable
# only from the controller. Running this pair on the node against
# openbao_write_addr (the node's OWN bind address, per
# defaults/main/00-install-and-node.yml) therefore always fails the
# capability check for the one token that could ever pass it: observed live,
# "Ask..." came back ok but without the update capability, and "Sync..."
# SKIPPED -- which then starved init/07's controller-delegated calls of the
# sync they needed. Delegate exactly like every other reconcile-gated
# read/write in this role from init/03 onward: openbao_cli_host/_addr/_become
# (resolved in defaults/main/00-install-and-node.yml, same switch the
# reconcile login itself uses via openbao_reconcile_addr) instead of the
# node's own address.
- name: Ask whether this identity may sync the reconcile policy
  ansible.builtin.command:
    cmd: >-
      bao write -format=json sys/capabilities-self
      paths=sys/policies/acl/{{ openbao_reconcile_policy_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_policy_sync_caps
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)

- name: Sync the reconcile policy from the declared set (policy-sync)
  ansible.builtin.command:
    cmd: "bao policy write {{ openbao_reconcile_policy_name }} -"
    stdin: "{{ lookup('template', 'openbao-reconcile-policy.hcl.j2') | trim }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - (openbao_policy_sync_caps.rc | default(1)) == 0
    - >-
      'update' in ((openbao_policy_sync_caps.stdout | from_json).get('data', {})
      | combine(openbao_policy_sync_caps.stdout | from_json))
      .get('sys/policies/acl/' ~ openbao_reconcile_policy_name, [])
