---
# A reconcile-mode run may manage only what its OWN policy grants. That policy
# is excluded from the set reconcile can rewrite (it cannot widen its own
# grants), so the live policy drifts BEHIND the declared set the moment a new
# policy is declared -- and every read/write of the new name then 403s.
#
# Ask the server what this token can actually do rather than inferring it from
# the declared set, and fail LOUDLY naming the shortfall. Silently narrowing to
# what happens to work is the exact false green this block exists to prevent:
# a declared policy would never be written and nothing would say so.
- name: Ask the server which declared policies this identity may actually write
  ansible.builtin.command:
    cmd: >-
      bao write -format=json sys/capabilities-self
      {{ openbao_manageable_policies
         | map(attribute='name')
         | map('regex_replace', '^(.+)$', 'paths=sys/policies/acl/\\1')
         | join(' ') }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_policy_capabilities
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)

# sys/capabilities-self returns the per-path capability lists BOTH at the top
# level and under `data`, and which of the two a given client surfaces is not
# something to bet a hard failure on. Reading only `data` yielded an empty dict
# against a live policy that demonstrably grants create/read/update on every
# path asked about -- and an empty dict reads as "denied everything", so the
# gate blocked a converge that should have proceeded.
- name: Resolve what the server said this identity may write
  ansible.builtin.set_fact:
    openbao_policy_caps: >-
      {{ (_body.get('data', {}) | combine(_body)) | dict2items
         | selectattr('key', 'match', '^sys/policies/acl/') | items2dict }}
  vars:
    _body: "{{ openbao_policy_capabilities.stdout | default('{}') | from_json }}"
  # Keep only real policy paths, rather than removing a hand-listed set of
  # envelope keys. The response also carries `capabilities`, `mount_type`,
  # `mount_class` and friends, and any future field would join them -- a
  # denylist would have to grow to stay correct. A stray key surviving here
  # would be compared against declared policy NAMES below (the prefix is
  # stripped, not filtered, at that point), so a collision would mark a policy
  # writable that is not: a false green in the guard built to prevent one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - (openbao_policy_capabilities.rc | default(1)) == 0

# An uninformative probe is NOT a denial. If the response carried no capability
# entry for ANY declared path, the probe itself is broken (a shape change, a
# malformed request) and saying "the identity may write none of these" would be
# a confident false red -- the same absent-vs-denied confusion this whole block
# exists to eliminate. Fail, but say which failure it is.
- name: FAIL -- the capability probe returned nothing usable
  ansible.builtin.fail:
    msg: >-
      Asked sys/capabilities-self about
      {{ openbao_manageable_policies | length }} policy paths and the response
      carried a capability entry for NONE of them. That is a broken probe, not
      a permission finding -- do not read it as "this identity may write
      nothing". Check the request shape and the response envelope before
      concluding anything about grants.
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - (openbao_policy_capabilities.rc | default(1)) == 0
    - openbao_manageable_policies | length > 0
    - (openbao_policy_caps | default({}) | length) == 0

- name: FAIL -- the reconcile identity cannot manage every declared policy
  vars:
    _caps: "{{ openbao_policy_caps | default({}) }}"
    _unwritable: >-
      {{ openbao_manageable_policies | map(attribute='name') | reject('in',
         (_caps | dict2items
                | selectattr('value', 'contains', 'update')
                | map(attribute='key')
                | map('regex_replace', '^sys/policies/acl/', '')
                | list)) | list | sort }}
  ansible.builtin.fail:
    msg: >-
      The openbao-reconcile identity is declared as managing
      {{ openbao_manageable_policies | length }} policies but the live
      openbao-reconcile policy grants update on none of these
      {{ _unwritable | length }}: {{ _unwritable | join(', ') }}.
      Reconcile CANNOT widen its own grants -- openbao-reconcile is in
      openbao_reconcile_excluded_policies by design -- so this only clears with
      one operator-token run (OPENBAO_PROVISIONING_TOKEN), which rewrites the
      reconcile policy from the current declared set. Refusing to continue:
      writing only the reachable subset would leave the rest declared but never
      written, with the converge still reporting success.
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - (openbao_policy_capabilities.rc | default(1)) == 0
    - _unwritable | length > 0

# Rendered on the CONTROLLER, not the target. The previous shape wrote each
# policy to the guest with `template`, read it back with `slurp`, and deleted it
# again -- three remote round trips per policy purely to move content this
# process already had in memory. Over 60 policies that is 180 operations on a
# proxmox_pct_remote connection, and each one is a full paramiko connect plus a
# `pct exec`: the render step alone measured 776 SECONDS (12.9 min, ~13s per
# policy) writing a few KB per file.
#
# `lookup('template', ...)` resolves against the same role templates/ directory
# the module used and renders with the same variable context, so the content is
# identical -- it just never leaves the controller. The write below feeds it to
# `bao policy write` on stdin, so no file is created and none has to be cleaned
# up. Remote operations for this phase: 180 -> 0.
- name: Render the RBAC policies on the controller
  ansible.builtin.set_fact:
    openbao_rendered_policy_map: >-
      {{ openbao_rendered_policy_map | default({})
         | combine({ item.name: lookup('template', item.template) }) }}
  loop: "{{ openbao_manageable_policies }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: openbao_bootstrap_token is defined

- name: List existing policies
  ansible.builtin.command:
    cmd: bao policy list -format=json
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_policies_raw
  no_log: true
  changed_when: false
  when: openbao_bootstrap_token is defined

- name: Read existing RBAC policy contents
  ansible.builtin.command:
    cmd: "bao policy read -format=json {{ item.name }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_manageable_policies }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_existing_policy_reads
  no_log: true
  changed_when: false
  # Every other probe in this file tolerates a non-zero rc; this one did not, so
  # a single denied read aborted the whole block before any policy was written.
  # The map build below already guards on `rc == 0`, so a failed read is an
  # expected, handled input -- not a reason to stop. The capability gate above
  # is what turns a genuine scope shortfall into a loud failure.
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - item.name in (openbao_policies_raw.stdout | from_json)

- name: Build the existing RBAC policy content map
  ansible.builtin.set_fact:
    openbao_existing_policy_map: >-
      {{ openbao_existing_policy_map | default({})
         | combine({ item.item.name: ((item.stdout | default('{}') | from_json).data.policy | default('')) }) }}
  loop: "{{ openbao_existing_policy_reads.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - not (item.skipped | default(false))
    - (item.rc | default(1)) == 0

- name: Write the RBAC policies that are missing or changed
  ansible.builtin.command:
    cmd: "bao policy write {{ item.name }} -"
    stdin: "{{ (openbao_rendered_policy_map | default({}))[item.name] }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  loop: "{{ openbao_manageable_policies }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - >-
      item.name not in (openbao_policies_raw.stdout | from_json)
      or
      (openbao_existing_policy_map | default({})).get(item.name, '')
      !=
      (openbao_rendered_policy_map | default({})).get(item.name, '')

