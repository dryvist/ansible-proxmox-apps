---
# Each Terrakube workspace policy references its workspace BY LIST INDEX
# (openbao_terrakube_workspaces[N]) while carrying the workspace's name in its
# own `name`. Nothing structural keeps the two in step: inserting a workspace
# anywhere but the end, or mistyping an index, silently points a policy at a
# DIFFERENT workspace — which grants that workspace's KV paths to the wrong
# job identity and reads as a working converge.
#
# Compare the two ORDERED lists rather than their sets: a set comparison passes
# on exactly the swap this is guarding against, since both names are still
# present.
- name: Assert every Terrakube workspace policy names the workspace it points at
  ansible.builtin.assert:
    that:
      - _tk_policy_names == _tk_workspace_derived_names
    fail_msg: >-
      A Terrakube workspace policy references the wrong entry in
      openbao_terrakube_workspaces. Declared policy names:
      {{ _tk_policy_names }}; names derived from the workspaces each one
      actually points at: {{ _tk_workspace_derived_names }}.
    success_msg: "All {{ _tk_policy_names | length }} Terrakube workspace policies point at their own workspace."
  vars:
    _tk_policies: "{{ openbao_base_policies | selectattr('workspace', 'defined') | list }}"
    _tk_policy_names: "{{ _tk_policies | map(attribute='name') | list }}"
    _tk_workspace_derived_names: >-
      {{ _tk_policies | map(attribute='workspace.name')
         | map('regex_replace', '^', 'terrakube-') | list }}
  run_once: true
  delegate_to: localhost
  become: false

# openbao-reconcile-policy.hcl.j2 grants `sys/policies/acl/*` (deny stanzas
# carve out the excluded/break-glass names), so this identity's own policy
# can never drift behind the declared set the way the by-name enumeration
# used to: a newly declared, non-excluded policy name is reachable the moment
# it is declared, with no operator-token run required. The capabilities-self
# probe-and-fail that used to live here existed only to catch that drift and
# is now permanently a no-op, so it is removed rather than kept as dead
# weight -- see openbao-access-model.mdx, "How a declared policy reaches the
# cluster", for the current behaviour.

# Rendered on the CONTROLLER, not the target. The previous shape wrote each
# policy to the guest with `template`, read it back with `slurp`, and deleted it
# again -- three remote round trips per policy purely to move content this
# process already had in memory. Over 60 policies that is 180 operations on a
# proxmox_pct_remote connection, and each one is a full paramiko connect plus a
# `pct exec`: the render step alone measured 776 SECONDS (12.9 min, ~13s per
# policy) writing a few KB per file.
#
# `lookup('template', ...)` resolves against the same role templates/ directory
# the module used and renders with the same variable context, so the content is
# identical -- it just never leaves the controller. The write below feeds it to
# `bao policy write` on stdin, so no file is created and none has to be cleaned
# up. Remote operations for this phase: 180 -> 0.
# A per-item `combine` here re-copies the whole accumulated dict on every
# iteration (O(n^2) over ~60 policies). Appending {key, value} pairs to a
# plain list is O(1) per item; items2dict builds the final dict once.
#
# `item` inside the for-loop below is a Jinja loop variable local to THIS
# expression's own render pass -- it is never added to the task's vars, which
# is the context `lookup('template', ...)` hands to the sub-template it
# renders. A policy template that references `item` (terrakube-workspace-
# policy.hcl.j2 does, for `item.workspace.name`) therefore renders against a
# context where `item` was never set, failing with "'item' is undefined".
# `template_vars` injects it into that sub-render explicitly.
- name: Render the RBAC policies on the controller
  ansible.builtin.set_fact:
    openbao_rendered_policy_map: "{{ _openbao_rendered_policy_pairs | items2dict }}"
  vars:
    _openbao_rendered_policy_pairs: >-
      {%- set _pairs = [] -%}
      {%- for item in openbao_manageable_policies -%}
      {%- set _rendered = lookup('template', item.template, template_vars={'item': item}) | trim -%}
      {%- set _ = _pairs.append({'key': item.name, 'value': _rendered}) -%}
      {%- endfor -%}
      {{ _pairs }}
  no_log: true
  when: openbao_bootstrap_token is defined

# The docs-publisher permission set only materializes when its repository
# list is non-empty (see openbao_github_docs_publisher_permission_sets); when
# the env var is unset the set drops out of openbao_github_permission_sets
# entirely, and github-docs-publisher-policy.hcl.j2's loop then has nothing to
# emit. The assert below refuses to WRITE that empty render; this is the
# separate visibility half, naming the input so the cause is not left to be
# guessed from the assert failure alone.
- name: Warn when the docs-publisher repo list is unset (its policy set drops out of the render)
  ansible.builtin.debug:
    msg: >-
      OPENBAO_GITHUB_DOCS_PUBLISHER_REPOS is unset -- the docs-publisher
      GitHub permission set is omitted from openbao_github_permission_sets,
      so any policy template that only emits paths for that set (e.g.
      github-docs-publisher-policy.hcl.j2) renders with no grants. Set the
      env var (Doppler) to restore it, or leave it unset deliberately if the
      publisher identity is not yet meant to exist.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_docs_publisher_repos | default([]) | length == 0

# `bao policy write <name> -` REPLACES the whole stored ACL document; there is
# no merge. A policy template whose only content is conditional on some other
# input (a permission set, a workspace list, ...) renders as comment lines
# with no `path` stanza when that input is empty -- and the write task above
# would then happily overwrite a live policy with a document that grants
# nothing, reporting success. Refuse before that write ever runs, for EVERY
# policy scheduled to be written, not one hardcoded name: a future
# conditionally-rendered policy is covered by construction.
- name: Assert no scheduled RBAC policy rendered empty
  ansible.builtin.assert:
    that:
      - _openbao_empty_rendered_policies | length == 0
    fail_msg: >-
      {{ _openbao_empty_rendered_policies | length }} RBAC polic{{ 'y' if
      _openbao_empty_rendered_policies | length == 1 else 'ies' }} rendered
      with no `path` stanza and would REPLACE the live stored policy with an
      empty document ({{ _openbao_empty_rendered_policies | join(', ') }}).
      Likely cause: a gating input this policy's template loops over (a
      permission set, workspace list, or similar, often built from an env
      var) resolved empty at render time. Fix the input, or if the policy is
      genuinely meant to grant nothing, remove it from
      openbao_manageable_policies instead of writing an empty ACL.
    success_msg: >-
      All {{ openbao_manageable_policies | length }} scheduled RBAC policies
      rendered with at least one path stanza.
  vars:
    _openbao_rendered: "{{ openbao_rendered_policy_map | default({}) }}"
    _openbao_non_empty_names: >-
      {{ _openbao_rendered | dict2items
         | selectattr('value', 'search', 'path\s+"')
         | map(attribute='key') | list }}
    _openbao_empty_rendered_policies: >-
      {{ openbao_manageable_policies | map(attribute='name') | list
         | reject('in', _openbao_non_empty_names) | list | sort }}
  when: openbao_bootstrap_token is defined

- name: Read the stored RBAC policies and write what differs
  ansible.builtin.include_tasks: 08b-rbac-policy-writes.yml

