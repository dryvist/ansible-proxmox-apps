---
- name: Read the generated router-key source buckets for open-llm
  ansible.builtin.command:
    cmd: "bao kv get -format=json {{ openbao_kv_mount }}/apps/{{ item.source_app }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_open_llm_router_key_source_reads
  loop: "{{ openbao_open_llm_router_key_mirrors }}"
  loop_control:
    label: "{{ item.source_app }}/{{ item.source_field }}"
  changed_when: false
  no_log: true

- name: Set source values for the open-llm promoted fields
  ansible.builtin.set_fact:
    "{{ item.item.source_variable }}": >-
      {{ (item.stdout | from_json).data.data[item.item.source_field] }}
  loop: "{{ openbao_open_llm_router_key_source_reads.results }}"
  loop_control:
    label: "{{ item.item.target_field }}"
  no_log: true

- name: Promote the mirrored values into the open-llm bucket
  ansible.builtin.include_tasks:
    file: promote_app_secret.yml
    apply:
      tags:
        - openbao_kv_seed
  vars:
    openbao_promote_app: open-llm
    openbao_promote_fields: "{{ openbao_promoted_app_secrets['open-llm'] }}"
  tags:
    - openbao_kv_seed
