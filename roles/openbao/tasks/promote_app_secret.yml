---
# Promote one app's EXISTING service credentials into secret/apps/<app> so
# OpenBao becomes their canonical home. Values come from the converge
# environment, mapped field -> env var by openbao_promoted_app_secrets. Called
# per app from init.yml with openbao_promote_app + openbao_promote_fields.
#
# Promotion, not generation: these are values that already exist and MUST keep
# their current value. Anything that may simply be created fresh belongs in
# openbao_generated_app_secrets instead.
#
# MERGE-PRESERVING: the desired map is the CURRENTLY-STORED fields overlaid with
# whatever env-derived keys this converge actually carries. A converge that
# exposes only SOME of the mapped env vars therefore updates just those fields
# and can never wipe the siblings a partial run doesn't know about. Idempotent:
# no env var present, or all present values already stored -> desired == current,
# so no write.
- name: Read the app's currently-stored secret fields
  ansible.builtin.command:
    cmd: "bao kv get -format=json {{ openbao_kv_mount }}/apps/{{ openbao_promote_app }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_promote_current
  # A DENIED read is not an ABSENT path. Collapsing a denial to {} makes the
  # write below carry only the env-derived fields, wiping every sibling -- the
  # exact outcome the MERGE-PRESERVING contract above promises is impossible.
  # That contract holds only when this read SUCCEEDED, so tolerate genuine
  # absence ONLY and fail on a denial.
  failed_when:
    - openbao_promote_current.rc != 0
    - openbao_absent_stderr_marker not in (openbao_promote_current.stderr | default(''))
  changed_when: false
  no_log: true

- name: Capture the stored fields (empty map when the path is absent)
  ansible.builtin.set_fact:
    openbao_promote_current_data: >-
      {{ (openbao_promote_current.stdout | default('{}', true) | from_json).data.data
         | default({}, true)
         if (openbao_promote_current.rc | default(1)) == 0 else {} }}
    openbao_promote_desired: >-
      {{ (openbao_promote_current.stdout | default('{}', true) | from_json).data.data
         | default({}, true)
         if (openbao_promote_current.rc | default(1)) == 0 else {} }}
  no_log: true

- name: Overlay the converge-env values onto the stored fields
  ansible.builtin.set_fact:
    openbao_promote_desired: >-
      {{ openbao_promote_desired | combine({item.key: lookup('env', item.value)}) }}
  loop: "{{ openbao_promote_fields | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  when: lookup('env', item.value) | length > 0

- name: Seed or update the app secrets in OpenBao (merge-preserving, write-if-changed)
  ansible.builtin.command:
    argv: >-
      {{ ['bao', 'kv', 'put', openbao_kv_mount ~ '/apps/' ~ openbao_promote_app]
         + (openbao_promote_desired.keys() | zip(openbao_promote_desired.values())
            | map('join', '=') | list) }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  no_log: true
  changed_when: true
  when: openbao_promote_desired != openbao_promote_current_data
