---
# OpenBao bootstrap — runs ONLY on the bootstrap host (gated by the include in
# main.yml: inventory_hostname == openbao_bootstrap_host). It initializes the
# cluster, then provisions the KV mount, the RBAC policies, and the AppRoles
# (terraform-apply / Terrakube JWT / ansible-converge / observability /
# local-cloud / monitoring / media / local-llm / public / ai-readonly /
# ai-elevated / snapshot — see docs/SECRETS_HIERARCHY.md). The other Raft
# peers never run this: they join the leader automatically (retry_join in
# openbao.hcl) and self-unseal via the static seal. Every step is guarded so
# re-runs are no-ops: nothing is created if it already exists, and break-glass
# material is only emitted for AppRoles that were newly created THIS run —
# whether that's the very first bootstrap or a later run against an
# already-live cluster (supplied a privileged BAO_TOKEN) that only grows the
# RBAC surface with a few more identities.
#
# Break-glass safety: recovery shares + root token (and every new AppRole's
# role_id/secret_id) are written ONLY to 0600 files on the Ansible CONTROLLER
# under playbook_dir, and a LOUD warning tells the operator to transcribe to
# paper / load into the right store and delete. These values are NEVER
# written into the repo or onto a target host, and the `bao` invocations that
# touch them run with no_log: true.

- name: Refuse stale break-glass material and probe peers for a live cluster (data-loss guard)
  ansible.builtin.include_tasks: init/01-preflight-and-cluster-probe.yml

- name: Initialize the cluster and resolve the provisioning token
  ansible.builtin.include_tasks: init/02-initialize-cluster.yml

# Plugin registration is deliberately OUTSIDE the openbao-reconcile grant: its
# policy carries no sys/plugins/catalog path at all, because registering a
# plugin is break-glass.
#
# These three files probe with `bao plugin read` under `failed_when: false` and
# treat a non-zero rc as "not registered". Under reconcile that read is DENIED,
# which is also non-zero, so the probe concludes the plugin is absent and
# attempts the privileged register -- failing the run partway through. A denied
# read is not an absent object.
#
# Sibling of the 09 gate below: measured live, `bao secrets list` (sys/mounts)
# 403s under the reconcile identity exactly like `bao auth list` (sys/auth)
# does for 09 -- the "reconcile may read sys/mounts" assumption this comment
# used to make was never true. A denied read reads as rc != 0 under
# failed_when: false, which the file's own listing task then turns into a hard
# fail rather than "absent" (unlike 04/05/06/07's plugin probes), aborting the
# rest of init.yml -- including every AppRole/CIDR reconcile after it -- on
# every workstation-run converge. Enabling a mount is bootstrap work; it needs
# OPENBAO_PROVISIONING_TOKEN, same as auth methods below.
- name: Enable the KV mounts and seed per-app service secrets
  ansible.builtin.include_tasks: init/03-kv-mounts-and-seed-secrets.yml
  when: not (openbao_reconcile_mode | default(false))

- name: Register and configure the AWS secrets engine
  ansible.builtin.include_tasks: init/04-aws-engine.yml
  when: not (openbao_reconcile_mode | default(false))

- name: Register and configure the GitHub secrets engine
  ansible.builtin.include_tasks: init/05-github-engine.yml
  when: not (openbao_reconcile_mode | default(false))

- name: Register and configure the OAuthapp secrets engine
  ansible.builtin.include_tasks: init/06-oauth-engine.yml
  when: not (openbao_reconcile_mode | default(false))

- name: Configure the SSH CA and its signing roles
  ansible.builtin.include_tasks: init/07-ssh-ca-engine.yml

- name: Render and reconcile the RBAC policies
  ansible.builtin.include_tasks: init/08-rbac-policies.yml

- name: Enable AppRole/JWT auth and reconcile Terrakube workspace JWT roles
  ansible.builtin.include_tasks: init/09-auth-methods-and-terrakube-jwt.yml
  # sys/auth and auth/terrakube/* are outside the reconcile identity's policy
  # (it grants sys/policies/acl, auth/approle/role/<name> and <ssh>/roles/<name>
  # only), so every write here 403s under a reconcile-mode run. These are all
  # add-if-missing against a live listing, and a denied READ returns rc != 0
  # under failed_when: false — which reads as "absent" and triggers exactly the
  # privileged create that cannot succeed. Enabling an auth method is bootstrap
  # work; it needs OPENBAO_PROVISIONING_TOKEN.
  when: not (openbao_reconcile_mode | default(false))

- name: Create the AppRoles and write their break-glass material
  ansible.builtin.include_tasks: init/10-approles.yml

# --- Rotation-exempt tagging (idempotent, write-if-changed) ------------------
# Stamp custom_metadata.rotation=exempt on every operator-declared
# encryption/signing path (openbao_rotation_exempt) so the secret-age auditor
# never flags it "overdue" for a rotation that would destroy already-stored
# data. Runs LAST, after the RBAC/AppRole reconcile above, so a metadata patch
# this identity is not yet granted (a stale reconcile policy) cannot fail the
# run before the policies and AppRoles it depends on are reconciled. It still
# runs after promotion/generation (init/03) so a path declared exempt in the
# same converge that creates it is tagged immediately rather than waiting for
# a second converge.
- name: Tag operator-declared rotation-exempt paths (write-if-changed)
  ansible.builtin.include_tasks: tag_rotation_exempt.yml
  loop: "{{ openbao_rotation_exempt }}"
  loop_control:
    loop_var: openbao_rotation_exempt_entry
  when: openbao_bootstrap_token is defined
