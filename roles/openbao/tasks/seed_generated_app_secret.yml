---
# Generate-if-absent seeding of one app's service secrets in OpenBao. Generates a
# random value for every declared field that is not already stored, then writes
# the secret merge-preserving. A field that already holds a value is never
# rewritten, so a live credential is never rotated. Called per app from init.yml
# with openbao_seed_app + openbao_seed_fields. Replaces the retired
# terraform-proxmox vault-secrets root.
#
# Per FIELD, not per PATH. The existence check used to be on the secret itself,
# so once secret/apps/<app> existed for any reason, a field added to
# openbao_seed_fields later was never generated — the converge reported success
# and the consumer resolved an empty value. That also made the outcome depend on
# whether a promotion (promote_app_secret.yml) had already created the path,
# which is ordering the caller should not have to reason about.
- name: Reset the per-app OpenBao seed accumulator
  ansible.builtin.set_fact:
    openbao_seed_desired: {}

- name: Read the app secret's currently-stored fields
  ansible.builtin.command:
    cmd: "bao kv get -format=json {{ openbao_kv_mount }}/apps/{{ openbao_seed_app }}"
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  register: openbao_seed_current
  # A DENIED read is not an ABSENT path. Both return a non-zero rc, and the
  # capture below collapses a non-zero rc to {} -- which makes EVERY declared
  # field look unset, mints a fresh random value for each, and writes them over
  # the live secret. That silently rotates credentials this file's own header
  # promises are "never rewritten". Tolerate genuine absence ONLY.
  failed_when:
    - openbao_seed_current.rc != 0
    - openbao_absent_stderr_marker not in (openbao_seed_current.stderr | default(''))
  changed_when: false
  no_log: true

- name: Capture the stored fields (empty map when the path is absent)
  ansible.builtin.set_fact:
    openbao_seed_current_data: >-
      {{ (openbao_seed_current.stdout | default('{}', true) | from_json).data.data
         | default({}, true)
         if (openbao_seed_current.rc | default(1)) == 0 else {} }}
  no_log: true

# A field named *_username becomes a real login (UNIX account, Samba passdb),
# so it cannot use the password alphabet: `useradd` rejects a name that starts
# with a digit, NAME_REGEX is lowercase by convention, and the 40-char password
# length exceeds the 32-character limit Linux enforces on a login name. Those
# rejections surface at converge time as a failed user creation, not as a bad
# secret, so the constraint belongs here where the value is minted.
#
# Keyed on the field-name suffix, the same way secret_key already selects its
# own length above.
- name: Generate a random value for each field that is not yet stored
  ansible.builtin.set_fact:
    openbao_seed_desired: >-
      {{ openbao_seed_desired | combine({
           item: lookup('community.general.random_string',
                        length=(openbao_app_secret_username_length
                                if item.endswith(openbao_app_secret_username_suffix)
                                else openbao_app_secret_key_length if item == 'secret_key'
                                else openbao_app_secret_length),
                        special=false,
                        upper=(not item.endswith(openbao_app_secret_username_suffix)),
                        numbers=(not item.endswith(openbao_app_secret_username_suffix))) }) }}
  loop: "{{ openbao_seed_fields }}"
  no_log: true
  when: openbao_seed_current_data[item] | default('', true) | length == 0

- name: Write the generated app secret to OpenBao (merge-preserving)
  ansible.builtin.command:
    argv: >-
      {{ ['bao', 'kv', 'put', openbao_kv_mount ~ '/apps/' ~ openbao_seed_app]
         + (openbao_seed_merged.keys() | zip(openbao_seed_merged.values())
            | map('join', '=') | list) }}
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  vars:
    openbao_seed_merged: >-
      {{ openbao_seed_current_data | combine(openbao_seed_desired) }}
  changed_when: true
  no_log: true
  when: openbao_seed_desired | length > 0
