---
# Slack app-config token rotation (on-box, timer-driven). Included from
# main.yml on every openbao node when the rotation timer is enabled AND the
# slack-admin AppRole creds are present. The creds are injected at converge
# from tier-0 (never committed); until they exist the include is skipped (see
# the guard in main.yml), so a first-bootstrap converge stays green.
#
# Deployed on every node, same as the snapshot timer, but WITHOUT a
# leader-gate: the Slack refresh token is single-use, which is already the
# mutex, and OpenBao's CAS write-back means a losing node just adopts the
# winner's result (see openbao-slack-rotate.sh.j2) instead of needing to know
# who the leader is.

- name: Render the Slack rotation AppRole EnvironmentFile
  ansible.builtin.template:
    src: openbao-slack-rotate.env.j2
    dest: "{{ openbao_slack_rotate_env_file }}"
    owner: root
    group: "{{ openbao_group }}"
    mode: "0600"
  no_log: true
  notify: Restart openbao slack rotate timer

- name: Deploy the Slack rotation script
  ansible.builtin.template:
    src: openbao-slack-rotate.sh.j2
    dest: "{{ openbao_slack_rotate_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart openbao slack rotate timer

- name: Deploy the Slack rotation systemd service unit
  ansible.builtin.template:
    src: openbao-slack-rotate.service.j2
    dest: "/etc/systemd/system/{{ openbao_slack_rotate_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao slack rotate timer

- name: Deploy the Slack rotation systemd timer unit
  ansible.builtin.template:
    src: openbao-slack-rotate.timer.j2
    dest: "/etc/systemd/system/{{ openbao_slack_rotate_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao slack rotate timer

# Skipped under Docker (molecule) — no functional systemd init in the container.
- name: Enable and start the Slack rotation timer
  ansible.builtin.systemd:
    name: "{{ openbao_slack_rotate_service_name }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'
