---
# The listener trusts an ingress X-Forwarded-For header only while
# openbao_xff_authorized_addrs holds usable addresses: templates/openbao.hcl.j2
# omits the whole block when the list is empty, and OpenBao then reads the
# socket peer on every request. Through the ingress that peer is the proxy, and
# the proxy's address sits inside the broadest bound CIDR, so an AppRole's
# secret_id_bound_cidrs / token_bound_cidrs admit every client and nothing
# anywhere turns red. Both list inputs are derived from the inventory, and a
# leased guest's container_ip is an FQDN rather than an address, so neither is
# guaranteed to yield something OpenBao can match on. Assert instead of
# discovering it from an audit log.
- name: Assert the ingress addresses trusted for X-Forwarded-For are usable
  ansible.builtin.assert:
    that:
      - openbao_xff_authorized_addrs | length > 0
      - >-
        openbao_xff_authorized_addrs | map('ansible.utils.ipaddr')
        | select('equalto', false) | list | length == 0
    fail_msg: >-
      The ingress group exists but yielded no usable X-Forwarded-For address
      ({{ openbao_xff_authorized_addrs }}). The listener would silently fall
      back to the proxy's own address for every fronted request, and every
      AppRole CIDR bind would stop discriminating. Check that each ingress
      host carries an address-valued container_ip.
  when: groups['traefik_group'] | default([]) | length > 0

- name: Render OpenBao server config
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_file }}"
    owner: root
    group: "{{ openbao_group }}"
    mode: "0640"
  notify: Restart openbao

- name: Render OpenBao static-seal EnvironmentFile
  ansible.builtin.template:
    src: openbao.env.j2
    dest: "{{ openbao_env_file }}"
    owner: root
    group: "{{ openbao_group }}"
    mode: "0600"
  no_log: true
  notify: Restart openbao

- name: Install OpenBao systemd unit
  ansible.builtin.template:
    src: openbao.service.j2
    dest: /etc/systemd/system/openbao.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao

# --- Phase 7: enable + start -------------------------------------------------
# Skipped under Docker so the role can be molecule-tested in containers without
# a functional systemd init; the init/bootstrap phase is likewise gated.
- name: Enable and start OpenBao
  ansible.builtin.systemd:
    name: openbao
    state: "{{ openbao_service_state }}"
    enabled: "{{ openbao_service_enabled }}"
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'

# Flush so the restart handler fires before init.yml probes the live socket.
- name: Apply any pending OpenBao restart before bootstrap
  ansible.builtin.meta: flush_handlers

# --- Phase 8: wait for the API ----------------------------------------------
# A sealed-but-up OpenBao still answers /v1/sys/health with 200/429/501/503.
# With static-key auto-unseal a joined node reaches 200 (initialized+unsealed)
# or 429 (standby); a fresh node returns 501 (not initialized). Any of those
# means the listener is accepting connections, which is all we need before
# init.yml runs (on the bootstrap host only).
- name: Wait for the OpenBao listener to accept connections
  ansible.builtin.uri:
    url: "{{ openbao_api_addr }}/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
  register: openbao_health
  until: openbao_health.status is defined
  retries: 10
  delay: 3
  changed_when: false
  when: ansible_virtualization_type | default('') != 'docker'

# --- Phase 9: bootstrap (idempotent, bootstrap host only) -------------------
# Only the bootstrap host runs init/provisioning. The other Raft peers join the
# leader automatically (retry_join) and self-unseal via the static seal, so they
# need nothing here.
# Everything init.yml owns -- cluster init, the RBAC policies, the AppRoles and
# their TTL bounds, and the audit that catches an identity declared nowhere --
# happens on exactly one host. If that host drops out of the run, the include
# below is simply false everywhere and ALL of it silently does not happen,
# while the remaining hosts converge green.
#
# init.yml has its own loud notice for the case where provisioning is skipped
# for want of a token, but that notice lives INSIDE init.yml, so it cannot fire
# when init.yml itself is what was skipped. The guard has to be out here.
#
# Measured: the store's provisioning path last executed 2026-09-06 and went
# unnoticed for three days, because the bootstrap host was unreachable on most
# runs and nothing said so.
#
# The two lists together are what separates the two cases, and only one is a
# fault. ansible_play_hosts_all is the play's hosts INCLUDING those that went
# unreachable; ansible_play_hosts is those still active. So:
#
#   in _all, not in _hosts  -> the host was meant to be here and dropped out.
#   in neither              -> the run was deliberately scoped elsewhere.
#
# Only the first fails. Firing on the second would make every targeted --limit
# run red, and a guard with false positives is a guard someone switches off.
# run_once keeps it to one message rather than one per host.
- name: FAIL -- the store's provisioning host dropped out of this run, so nothing it owns will happen
  ansible.builtin.fail:
    msg: >-
      {{ openbao_bootstrap_host }} is the only host that runs cluster
      initialization, RBAC policy reconciliation, AppRole reconciliation and
      the undeclared-identity audit, and it is not among the hosts still active
      in this play. Every one of those steps would be skipped and the run would
      still report success. Fix the host's reachability and re-run; do not work
      around this by pointing openbao_bootstrap_host at a different member,
      which is what the fresh-init data-loss guard exists to prevent.
  run_once: true
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - openbao_bootstrap_host in ansible_play_hosts_all
    - openbao_bootstrap_host not in ansible_play_hosts

- name: Bootstrap OpenBao (init, KV, policies, AppRoles)
  ansible.builtin.include_tasks: ../init.yml
  when:
    - ansible_virtualization_type | default('') != 'docker'
    - inventory_hostname == openbao_bootstrap_host

# --- Phase 10: audit device + shipping (all nodes) ---------------------------
# File audit device (enable is token-gated + bootstrap-host-gated inside) plus
# the rsyslog imfile ruleset that ships each node's audit log to the
# openbao_audit AI ingest listener. Skipped under Docker (no systemd/live API),
# matching the bootstrap/snapshot phases.
- name: Enable the audit device and ship the audit log
  ansible.builtin.include_tasks: ../audit.yml
  when:
    - openbao_audit_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'

# --- Phase 11: automated raft snapshots (all nodes; script leader-gates) -----
# Deployed on every openbao node so the surviving nodes keep snapshotting after
# a leadership change. Previously ALSO gated on the snapshot AppRole creds
# being non-empty, keyed on OPENBAO_SNAPSHOT_ROLE_ID/SECRET_ID -- the wrong
# names (every other AppRole in this repo is OPENBAO_APPROLE_<NAME>_*; the
# converge environment carries OPENBAO_APPROLE_SNAPSHOT_ROLE_ID/SECRET_ID,
# see defaults/main/09), so the lookup was permanently empty and the gate
# permanently false: the timer/service/env-file were never deployed to any
# node (verified: no openbao-snapshot.timer/.service or
# /etc/openbao/openbao-snapshot.env on any of the 9 live nodes). Fixed the
# var names AND deploy unconditionally behind the enabled flag, same as
# voter-health below -- defaults/main/09 now makes the creds mandatory() so
# a converge that would render a timer with empty credentials fails at
# render time instead of shipping one that fails every 6h.
- name: Deploy the automated raft snapshot timer
  ansible.builtin.include_tasks: ../snapshot.yml
  when:
    - openbao_snapshot_enabled | bool

# --- Phase 12: voter health telemetry (all nodes; read-only, script leader-gates) -
# Deployed on every openbao node so any voter can take over the sweep after a
# leadership change. No AppRole creds are required (unauthenticated sys/health
# + sys/leader only), so unlike the snapshot timer this has no credential gate.
- name: Deploy the voter-health telemetry timer
  ansible.builtin.include_tasks: ../voter_health.yml
  when:
    - openbao_voter_health_enabled | bool
    - ansible_virtualization_type | default('') != 'docker'

# --- Phase 13: credential rotation timers (all nodes; deadman-covered) -----
# Table-driven (openbao_rotators, defaults/main/09) — one entry per rotated
# credential (Slack app-config token, Splunk MCP token, ...). rotate.yml
# itself skips any entry that is disabled or whose AppRole creds are not yet
# present, so a first-bootstrap converge stays green.
- name: Deploy the credential rotation timers
  ansible.builtin.include_tasks: ../rotate.yml
  when: openbao_rotators | default({}) | length > 0

# Retirement runs unconditionally alongside the deploy above (not gated on
# openbao_rotators being populated) — a node that already converged with the
# pre-table Slack-only rotator needs its old units removed regardless of
# whether the new table currently has any active rows.
- name: Retire the pre-table Slack-only rotation timer, if present
  ansible.builtin.include_tasks: ../retire_slack_rotate.yml

# --- Phase 14: secret-age auditor (all nodes; script leader-gates) ----------
# Deployed on every openbao node, same shape as the snapshot timer: gated on
# the secret-age-audit AppRole creds being present so a pre-provisioning
# converge (creds not yet minted) stays green instead of rendering an
# empty-cred EnvironmentFile.
- name: Deploy the secret-age auditor timer
  ansible.builtin.include_tasks: ../secret_age.yml
  when:
    - openbao_secret_age_enabled | bool
    - openbao_secret_age_role_id | length > 0
    - openbao_secret_age_secret_id | length > 0
