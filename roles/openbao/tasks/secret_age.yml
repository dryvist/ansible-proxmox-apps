---
# Automated secret-age audit (on-box, timer-driven). Included from
# main/configure_and_bootstrap.yml on every openbao node when the auditor is
# enabled AND the secret-age-audit AppRole creds are present — the same
# bootstrap-safe gate the Slack rotator uses. The script leader-gates at
# runtime (only the active node measures + pages), so this deploys
# identically on every node and survives a leadership change.

# The report's parent directory. Idempotent alongside audit.yml's identical
# task — audit.yml only runs when openbao_audit_enabled is true, but
# secret-age can be enabled independently of it, so this role must be able
# to create openbao_audit_log_dir itself rather than assume audit.yml
# already did. Deliberately NOT openbao_data_dir (0700, no group bits — see
# 09b-secret-age.yml's comment on openbao_secret_age_report_path): the
# syslog-group reader below needs directory SEARCH permission, which 0700
# never grants regardless of the report file's own mode.
- name: Create the OpenBao audit log directory (also holds the secret-age report)
  ansible.builtin.file:
    path: "{{ openbao_audit_log_dir }}"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "0750"

- name: Render the OpenBao secret-age AppRole EnvironmentFile
  ansible.builtin.template:
    src: openbao-secret-age.env.j2
    dest: "{{ openbao_secret_age_env_file }}"
    owner: root
    group: "{{ openbao_group }}"
    mode: "0600"
  no_log: true
  notify: Restart openbao secret-age timer

- name: Deploy the OpenBao secret-age script
  ansible.builtin.template:
    src: openbao-secret-age.sh.j2
    dest: "{{ openbao_secret_age_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart openbao secret-age timer

- name: Deploy the OpenBao secret-age systemd service unit
  ansible.builtin.template:
    src: openbao-secret-age.service.j2
    dest: "/etc/systemd/system/{{ openbao_secret_age_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao secret-age timer

- name: Deploy the OpenBao secret-age systemd timer unit
  ansible.builtin.template:
    src: openbao-secret-age.timer.j2
    dest: "/etc/systemd/system/{{ openbao_secret_age_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao secret-age timer

# Skipped under Docker (molecule) — no functional systemd init in the container.
- name: Enable and start the OpenBao secret-age timer
  ansible.builtin.systemd:
    name: "{{ openbao_secret_age_service_name }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'

# Ship the report to Splunk over its own dedicated rsyslog ruleset (same
# openbao_audit_log_dir as the audit log, but a distinct tag —
# openbao-secret-age — so it never lands in the openbao_audit sourcetype).
# The report is rewritten whole each run (atomic mktemp+mv), not appended,
# producing a NEW inode at the same path each time. The audit-log ruleset
# this mirrors (openbao-audit-rsyslog.conf.j2) sets no explicit `Mode=` on
# its imfile input, so it runs in rsyslog's default `inotify` mode, which
# watches the directory entry and follows a rename-over transparently —
# see the template's own comment for the rest of the reasoning.
#
# rsyslog is installed defensively here too (audit.yml already does this when
# the audit device is enabled, but secret-age can be enabled independently of
# it) — apt with update_cache: false, same reasoning as audit.yml: these
# guests are firewalled to internal-only egress.
- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: false

# The report file is written 0640 openbao:openbao_group by the script itself
# (systemd unit sets User=/Group={{ openbao_group }}) into the now-0750
# openbao_audit_log_dir — rsyslog runs as the syslog user, so group
# membership is what grants both directory traversal and file read, same as
# the audit log.
- name: Add the syslog user to the openbao group for secret-age report read access
  ansible.builtin.user:
    name: syslog
    groups: "{{ openbao_group }}"
    append: true
  notify: Restart rsyslog

- name: Deploy the secret-age-report rsyslog shipping ruleset
  ansible.builtin.template:
    src: openbao-secret-age-rsyslog.conf.j2
    dest: "{{ openbao_secret_age_rsyslog_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Validate the full rsyslog configuration (secret-age ruleset)
  ansible.builtin.command: rsyslogd -N1
  changed_when: false
