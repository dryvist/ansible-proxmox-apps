---
# Automated secret-age audit (on-box, timer-driven). Included from
# main/configure_and_bootstrap.yml on every openbao node when the auditor is
# enabled AND the secret-age-audit AppRole creds are present — the same
# bootstrap-safe gate the Slack rotator uses. The script leader-gates at
# runtime (only the active node measures + pages), so this deploys
# identically on every node and survives a leadership change. The report's
# rsyslog shipping lives in secret_age_rsyslog.yml, included without the
# creds gate.

# The report's parent directory. Idempotent alongside audit.yml's identical
# task — audit.yml only runs when openbao_audit_enabled is true, but
# secret-age can be enabled independently of it, so this role must be able
# to create openbao_audit_log_dir itself rather than assume audit.yml
# already did. Deliberately NOT openbao_data_dir (0700, no group bits — see
# 09b-secret-age.yml's comment on openbao_secret_age_report_path): the
# syslog-group reader below needs directory SEARCH permission, which 0700
# never grants regardless of the report file's own mode.
- name: Create the OpenBao audit log directory (also holds the secret-age report)
  ansible.builtin.file:
    path: "{{ openbao_audit_log_dir }}"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "0750"

- name: Render the OpenBao secret-age AppRole EnvironmentFile
  ansible.builtin.template:
    src: openbao-secret-age.env.j2
    dest: "{{ openbao_secret_age_env_file }}"
    owner: root
    group: "{{ openbao_group }}"
    mode: "0600"
  no_log: true
  notify: Restart openbao secret-age timer

- name: Deploy the OpenBao secret-age script
  ansible.builtin.template:
    src: openbao-secret-age.sh.j2
    dest: "{{ openbao_secret_age_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart openbao secret-age timer

- name: Deploy the OpenBao secret-age systemd service unit
  ansible.builtin.template:
    src: openbao-secret-age.service.j2
    dest: "/etc/systemd/system/{{ openbao_secret_age_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao secret-age timer

- name: Deploy the OpenBao secret-age systemd timer unit
  ansible.builtin.template:
    src: openbao-secret-age.timer.j2
    dest: "/etc/systemd/system/{{ openbao_secret_age_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openbao secret-age timer

# Skipped under Docker (molecule) — no functional systemd init in the container.
- name: Enable and start the OpenBao secret-age timer
  ansible.builtin.systemd:
    name: "{{ openbao_secret_age_service_name }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_virtualization_type | default('') != 'docker'
