---
# Split out of 05b-domain-policy-approle-names.yml (that file hit the repo's
# per-file token gate) rather than inline there. Subject: the ui-synthetic
# identity that the ai-workflows-testing `_ui-live.yml` reusable workflow uses
# to read the synthetic UI login and generate its TOTP code.
openbao_ui_synthetic_policy_name: ui-synthetic
# TOTP secrets engine mount, enabled by playbooks/provision-synthetic-totp.yml.
openbao_totp_mount: totp
# ui-synthetic authenticates via GitHub Actions OIDC (see
# init/09c-github-oidc.yml), not an AppRole: _ui-live.yml runs on the
# ui-synthetic self-hosted runner group, so the job's own GitHub-minted token
# is the credential — nothing is stored on the runner. Bound to the reusable
# workflow itself (stable across every repo that calls it), not to a caller
# repository, plus the org that may call it.
openbao_ui_synthetic_job_workflow_ref: >-
  dryvist/ai-workflows-testing/.github/workflows/_ui-live.yml@refs/heads/main
openbao_ui_synthetic_repository_owner: dryvist
openbao_ui_synthetic_token_ttl: 10m
openbao_ui_synthetic_token_max_ttl: 15m
