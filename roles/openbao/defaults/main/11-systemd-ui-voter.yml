---
# --- systemd hardening -------------------------------------------------------
# NOTE: OpenBao 2.x dropped mlock support (a `disable_mlock` line is a fatal
# config error since 2.5), so there is no mlock toggle here. Swap hygiene comes
# from the guest itself: the OpenBao LXCs set memory_swap = 0 in deployment.json.
openbao_service_state: started
openbao_service_enabled: true

# --- UI ----------------------------------------------------------------------
openbao_enable_ui: true

# --- Voter health telemetry (read-only; no Raft/policy/AppRole changes) -----
# An on-box systemd timer, deployed on every openbao_group member, samples
# every voter's OWN plain-HTTP api_addr (never the Traefik ingress VIP — see
# .claude/rules/ip-addressing.md; a backend has no loopback listener and an
# https:// probe to it lies with a 000). The script leader-gates via
# /v1/sys/leader (mirrors templates/openbao-snapshot.sh.j2): only the current
# leader performs the full cross-cluster sweep each cycle, so standbys no-op
# and exactly one set of events ships per cycle. See README.md
# "Voter health scoring" for the SPL scorecard and the keep/demote evidence
# thresholds this telemetry feeds — membership changes stay operator-gated.
openbao_voter_health_enabled: true
openbao_voter_health_service_name: openbao-voter-health
openbao_voter_health_script_path: /usr/local/bin/openbao-voter-health.sh
openbao_voter_health_env_file: "{{ openbao_config_dir }}/openbao-voter-health.env"

# systemd OnUnitActiveSec cadence between sweeps.
openbao_voter_health_interval: "5min"
# Per-request curl timeout (seconds); a voter that doesn't answer within this
# window is recorded as an unreachable sample, not skipped.
openbao_voter_health_timeout_seconds: 5

# Splunk HEC shipping. Host/port come from tofu_data (never hardcoded — see
# .claude/rules/ip-addressing.md); the token is delivered the same way every
# other HEC consumer in this repo gets it (SPLUNK_HEC_TOKEN).
openbao_voter_health_hec_url: >-
  https://splunk.{{ tofu_data.domain }}:{{ tofu_data.constants.service_ports.splunk_hec }}/services/collector/event
openbao_voter_health_hec_token: "{{ lookup('env', 'SPLUNK_HEC_TOKEN') | default('', true) }}"
openbao_voter_health_splunk_index: openbao
openbao_voter_health_splunk_sourcetype: "openbao:voter:health"

# Raft apply-lag (authenticated, currently unavailable): sys/storage/raft/
# autopilot/state needs a token with sys/ read capability, and no existing
# least-privilege AppRole grants that (all are KV-scoped — see the RBAC
# section above). Minting a new AppRole/policy for this telemetry is out of
# scope for this change (no OpenBao policy/AppRole edits — see README.md
# "Known gap"). When role_id/secret_id for a future least-privilege
# `voter-health` AppRole are supplied, the script authenticates and includes
# per-voter raft applied-index lag; until then raft_lag_ms ships as null.
openbao_voter_health_role_id: "{{ lookup('env', 'OPENBAO_VOTER_HEALTH_ROLE_ID') | default('', true) }}"
openbao_voter_health_secret_id: "{{ lookup('env', 'OPENBAO_VOTER_HEALTH_SECRET_ID') | default('', true) }}"
