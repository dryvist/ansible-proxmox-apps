---
# Workstation-run converge identities. Separate file rather than more rows in
# 07b: that file is at the per-file size budget CI enforces, and the remedy for
# that budget is always splitting the source.
openbao_workstation_approles:
  # openbao-node-converge: the converge identity for the OpenBao-node play
  # (`--tags openbao` on `openbao_group`) — the single converge still run from
  # a workstation, because its inputs are the seal key and the provisioning
  # identities (docs/agents/commands-and-testing.md).
  #
  # It is NOT ansible-converge with a wider source range. That identity serves
  # every plane-triggered converge in the estate, so adding a workstation range
  # to it would widen the broadest converge credential there is to unblock one
  # play. This one carries a strict SUBSET of its grant (see the policy
  # template) plus the same SSH signing leaf, bound to the workstation class in
  # 08b-cidr-and-unlock.yml.
  #
  # INERT, like the other break-glass tiers: the play it serves already
  # requires a human-obtained provisioning token, so the operator is at the
  # unlock console either way and a standing credential buys nothing. What it
  # would cost is a laptop-resident credential that can mint `ansible`-principal
  # SSH certificates for the whole estate. manage_secret_id: false also moves
  # it from approle-issuer's unattended mint set onto human-unlock's, and
  # excludes it from what openbao-reconcile may rewrite — both derive from this
  # one marker, so neither list needs an entry.
  #
  # token_max_ttl 2h, not the 4h default: the certificate this token is
  # minted to sign expires at 2h (openbao_ssh_roles), so a token outliving it
  # can do nothing the run still needs.
  - name: openbao-node-converge
    token_policies: >-
      {{ ['openbao-node-converge']
         + (['ssh-sign-automation-ansible'] if openbao_ssh_engine_enabled else []) }}
    token_max_ttl: 2h
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_approle_human_secret_id_ttl }}"
    secret_id_num_uses: 1
  # github-admin-claude: unattended repository creation and organization
  # settings for the `claude` macOS account only. Two narrow sets:
  # dryvist-repo-create (administration:write) and dryvist-org-admin
  # (organization_administration:write). INERT, so neither the converge nor
  # approle-issuer ever mints its secret_id. The only standing path to one is
  # github-admin-claude-issuer, attached solely to the identity whose
  # secret-zero lives in that account; each secret_id it mints is single-use and
  # lives 15m, so nothing long-lived exists. Token lives 10m.
  - name: "{{ openbao_github_admin_claude_approle_name }}"
    token_policies:
      - "{{ openbao_github_repo_create_policy_name }}"
      - "{{ openbao_github_org_admin_policy_name }}"
    token_ttl: 10m
    token_max_ttl: 10m
    manage_secret_id: false
    secret_id_ttl: 15m
    secret_id_num_uses: 1
  # claude-identity: the `claude` macOS account's own OpenBao identity. Its
  # only grant is minting github-admin-claude secret_ids, and its pair lives
  # only in that account's own store, so nothing else reaches the admin path.
  # INERT and non-expiring: issued once, never re-minted by the converge or
  # approle-issuer; bounded by the workstation class and a one-path policy.
  - name: "{{ openbao_claude_identity_approle_name }}"
    policy: "{{ openbao_github_admin_claude_issuer_policy_name }}"
    token_ttl: 10m
    token_max_ttl: 10m
    manage_secret_id: false
    secret_id_ttl: "0s"
    secret_id_num_uses: 0
  # openbao-policy-sync: the only holder of policy-sync, used solely by a
  # provisioning run that syncs the reconcile policy. INERT and single-use, so
  # no credential for it is stored anywhere, including the execution plane.
  - name: "{{ openbao_policy_sync_approle_name }}"
    token_policies:
      - "{{ openbao_reconcile_policy_name }}"
      - "{{ openbao_policy_sync_policy_name }}"
    token_max_ttl: 2h
    manage_secret_id: false
    secret_id_ttl: "{{ openbao_approle_human_secret_id_ttl }}"
    secret_id_num_uses: 1
