---
# --- PKI secrets engine(s) for etcd peer/client TLS (Patroni HA mode) -------
# Builtin engine — no plugin staging, same as the SSH CA above (05-ssh-ca-
# engine.yml). Empty list by default: NO pki mount exists until an entry is
# added here, and no cluster runs Patroni mode yet (ansible-proxmox-apps
# roles/postgres, postgres_ha_manager: patroni, defaults to 'native').
#
# One CA per cluster scope, mirroring the one-bucket-per-workload convention
# secret/apps/<app> already follows for KV: a scope's etcd members trust only
# that scope's own CA, never a CA shared with another cluster. The CA keypair
# is generated INSIDE OpenBao on first configuration and never exported — the
# same write-once shape as the SSH CA's config/ca (ssh-ca-engine.yml).
#
# `scope` must match roles/postgres' own postgres_ha_scope (derived from
# postgres_cluster_group there — see that role's 03-patroni.yml) so the
# mount/role names the postgres role expects
# (postgres_ha_pki_mount/postgres_ha_pki_role) actually exist.
openbao_pki_etcd_engines: []
# Example entry — added only as part of the SEPARATE, deliberate change that
# cuts a real cluster over to Patroni mode, never bundled with a role PR:
#   - scope: postgres-ai
#     mount: pki-postgres-ai-etcd
#     role: postgres-ai-etcd
#     allowed_domain: "postgres-ai-*.{{ tofu_data.domain | default('', true) }}"
#     # 180d — comfortably above the postgres role's own 14-day reissue
#     # window (postgres_ha_etcd_cert_renew_before_days), never a literal
#     # tracked by Renovate: it bounds a CA policy, not a package version.
#     max_ttl: 4320h0m0s
# init/07b-etcd-pki-engine.yml also reconciles a second, client-auth-only
# role on this same mount for Patroni's own etcd identity (never the etcd
# member's own server+peer role above): "{{ role }}-patroni", allowed_domain
# "patroni-{{ allowed_domain }}" -- both DERIVED from this entry, not a
# second field to fill in here.
