---
# --- Deliberate exceptions to the undeclared-live-identity assert -------------
# init/10-approles.yml compares every AppRole that actually exists in the store
# against openbao_approles (07b-base-approles.yml) and fails naming any live
# identity this list does not cover. That is the whole point: a role
# reconciliation never visits because it was never declared here keeps
# whatever weak bounds it was created with, forever, invisible to every
# future converge.
#
# There is no other way out of that failure. A role that legitimately should
# not be managed by this repo is named HERE, with a reason, so the exception
# is as visible as the declaration it stands in for -- never a variable
# tucked away where the failure message can't point at it. Empty is the
# healthy state; an entry here is a decision, not a default.
#
# Split into its own file (rather than living beside openbao_approles in
# 07b-base-approles.yml) purely to stay under this repo's per-file token
# budget -- Ansible's defaults/main/ directory auto-loads every file here, so
# the split is not a behavior change.
openbao_approle_undeclared_exceptions: []
# Example shape (do not add speculatively):
#   - name: some-vendor-managed-role
#     reason: provisioned by <tool>, out of this repo's control
