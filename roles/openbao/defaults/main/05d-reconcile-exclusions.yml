---
# The RBAC set the routine reconcile identity may NOT touch.
#
# Split out of the names file purely for size: that file is at its budget and
# this list grows every time an identity earns an exclusion, so keeping them
# together meant the next entry would be the one that could not be added.
#
# The list is matched against POLICY names when filtering policies and against
# APPROLE names when filtering AppRoles, so a name belongs here for either
# half. Anything that can rewrite its own grant, or grant the break-glass
# unlock, goes here — an identity able to edit its own bounds has no bounds.
# policy-sync: one capability, write the reconcile policy. Held only by the
# inert openbao-policy-sync AppRole (07f), never by the execution plane's
# identity, so a plane converge cannot rewrite the reconcile policy.
openbao_policy_sync_policy_name: policy-sync
openbao_reconcile_excluded_policies:
  - "{{ openbao_approle_issuer_policy_name }}"
  # Anything that can rewrite this policy can grant itself the break-glass
  # unlock, so the unattended identity must not reach it.
  - "{{ openbao_human_unlock_policy_name }}"
  - "{{ openbao_ai_admin_policy_name }}"
  - "{{ openbao_github_admin_policy_name }}"
  - "{{ openbao_slack_admin_policy_name }}"
  - "{{ openbao_reconcile_policy_name }}"
  # policy-sync may rewrite the reconcile policy, so reconcile must not be able
  # to rewrite policy-sync.
  - "{{ openbao_policy_sync_policy_name }}"
  - "{{ openbao_ai_admin_session_approle_name }}"
  # This list is matched against POLICY names when filtering policies and
  # against APPROLE names when filtering AppRoles, so a name belongs here for
  # either half. This entry is the AppRole half.
  #
  # The execution plane's identity now holds the reconcile policy, so a routine
  # converge runs AS it. Without this exclusion that run could rewrite its own
  # AppRole — including the non-expiring secret_id whose defensibility rests
  # entirely on the grant it carries. An identity able to edit its own bounds
  # has no bounds.
  #
  # The consequence is deliberate: this AppRole is created and changed only by
  # a privileged run, which is the human checkpoint the non-expiring credential
  # is traded against.
  - "{{ openbao_semaphore_approle_name }}"
