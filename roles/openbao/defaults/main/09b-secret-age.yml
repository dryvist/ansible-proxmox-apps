---
# --- Secret-age auditor (automated, on-box timer) ---------------------------
# Every secret in OpenBao is supposed to be rotated within
# openbao_secret_age_target_days and never left older than
# openbao_secret_age_max_days. Nothing measured that before this file — the
# rotators (snapshot, Slack) prove their OWN secret gets refreshed, but
# nothing swept the rest of the KV tree or the AppRole secret-id population
# for staleness. This is the measurement + paging half; a sibling package
# owns the rotators themselves and the `secret-age-audit` AppRole/policy this
# timer logs in with (07b-base-approles.yml) — consumed by name here, not
# declared.
#
# Same bootstrap-safe shape as the snapshot/slack-rotate timers: the AppRole
# creds come from tier-0 at converge time, and an empty pair means "not yet
# provisioned" — the include is skipped rather than rendering a
# guaranteed-to-fail EnvironmentFile.
openbao_secret_age_enabled: true
openbao_secret_age_interval: "24h"
# Target and max age, in days. A secret between target and max is "due"
# (digest-only); at or past max it is "overdue" (paged immediately). These
# reference the estate-wide policy declared once by the rotator package
# (openbao_rotation_target_days/max_days, 09-snapshots-and-rotation.yml) —
# no local fallback, so the number lives in exactly one place rather than
# two copies that can drift.
openbao_secret_age_target_days: "{{ openbao_rotation_target_days }}"
openbao_secret_age_max_days: "{{ openbao_rotation_max_days }}"
openbao_secret_age_script_path: /usr/local/bin/openbao-secret-age.sh
openbao_secret_age_env_file: "{{ openbao_config_dir }}/openbao-secret-age.env"
openbao_secret_age_service_name: openbao-secret-age
# Report path. NOT under openbao_data_dir (0700 openbao:openbao,
# tasks/main/install.yml — the group class has no bits at all, so the
# syslog-group reader added in secret_age.yml could never even traverse
# into it: every imfile read would EACCES at the directory, not the file,
# and the whole shipping pipeline would silently ship nothing). Uses
# openbao_audit_log_dir instead — 0750 openbao:openbao_group
# (tasks/audit.yml), the same directory the audit-log rsyslog ruleset
# already reads from, so the group-member reader can actually traverse it.
openbao_secret_age_report_path: "{{ openbao_audit_log_dir }}/secret-age.json"
openbao_secret_age_rsyslog_config_path: /etc/rsyslog.d/21-openbao-secret-age.conf
# secret-age-audit AppRole creds. Named per the OPENBAO_APPROLE_<NAME>_*
# convention every other AppRole in this repo uses (see 09's comment on the
# snapshot AppRole). Empty ⇒ the include is skipped — bootstrap-safe, same as
# the Slack rotator.
openbao_secret_age_role_id: "{{ lookup('env', 'OPENBAO_APPROLE_SECRET_AGE_AUDIT_ROLE_ID') | default('', true) }}"
openbao_secret_age_secret_id: "{{ lookup('env', 'OPENBAO_APPROLE_SECRET_AGE_AUDIT_SECRET_ID') | default('', true) }}"
# ntfy alert target — same topic as the other OpenBao-owned rotation/backup
# automation (see 09's comment on the snapshot ntfy_url).
openbao_secret_age_ntfy_url: >-
  https://ntfy.{{ ingress_domain }}/secrets-security
# healthchecks deadman ping URL; EMPTY => ping skipped (ntfy + journal alert
# still fire). Set per-node from the healthchecks LXC, same as the snapshot
# and Slack-rotate timers.
openbao_secret_age_healthcheck_url: "{{ lookup('env', 'OPENBAO_SECRET_AGE_HC_URL') | default('', true) }}"

# Paths (mount:path) whose FIELDS are encryption/signing material that must
# never be rotated — rotating them would make already-stored ciphertext
# permanently unreadable rather than merely requiring a re-login. The
# converge stamps `custom_metadata.rotation=exempt` on each of these (see
# tag_rotation_exempt.yml) so the auditor skips the whole path.
#
# Marked at PATH granularity because KV v2 custom_metadata is per-secret, not
# per-field — a path here is skipped in full even though not every field at
# it is encryption material (e.g. vikunja also carries an admin password at
# the same path). That trade favors never flagging a signing/encryption key
# as due over precisely excluding only the one field; splitting the
# non-exempt fields to a separate path is a larger migration than this
# package's scope.
#
# Populated from openbao_promoted_app_secrets fields matching
# *encryption_key*, *secret_key*, *jwt_secret*, *hmac*, *jwks*, or *session*:
#   - apps/n8n     — n8n_encryption_key (decrypts every stored credential)
#   - apps/vikunja — vikunja_jwt_secret (invalidates every issued session/API
#                    token if rotated)
openbao_rotation_exempt:
  - "{{ openbao_kv_mount }}:apps/n8n"
  - "{{ openbao_kv_mount }}:apps/vikunja"
