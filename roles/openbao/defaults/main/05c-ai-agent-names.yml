---
# Policy and AppRole names for the AI agent identities (Hermes, Donna) and the
# narrow single-purpose writers they share a shape with.
openbao_hermes_policy_name: hermes
openbao_hermes_approle_name: hermes
openbao_hermes_private_agent_policy_name: hermes-private-agent
openbao_hermes_private_agent_approle_name: hermes-private-agent
# The auth role name is distinct from the private Hermes domain's env prefix.
openbao_approle_env_prefix_overrides:
  hermes-private-agent: hermes-private
  # ai-donna's converge domain is named donna.
  ai-donna: donna
# Router virtual keys for the Hermes operating profiles. Shared reader for
# now (one AppRole, four leaves); a per-profile split is a later follow-up.
# One secret/apps/<name> leaf each, read only — see
# openbao_generated_app_secrets.
openbao_hermes_router_key_apps:
  - hermes-default
  - hermes-splunk-admin
  - hermes-homelab-admin
  - hermes-github-maint
openbao_hermes_write_policy_name: hermes-write
openbao_hermes_write_approle_name: hermes-write
# llm-router-write: single-purpose writer for the llm-router Redis credential
# (secret/ai/llm-router, field LLM_ROUTER_REDIS_PASSWORD) — same shape as
# hermes-write, so the missing-credential seed never needs a superuser token.
openbao_llm_router_write_policy_name: llm-router-write
openbao_llm_router_write_approle_name: llm-router-write
# ai-donna: a second Hermes agent's dedicated, least-privilege reader — its own
# isolated credential domain (secret/ai/donna), sharing nothing with hermes.
openbao_ai_donna_policy_name: ai-donna
openbao_ai_donna_approle_name: ai-donna
