---
# App service secrets GENERATED (random, generate-if-absent) in OpenBao itself,
# replacing the retired terraform-proxmox vault-secrets root. Each app maps to
# its field list; every field gets a random alnum value created once at
# secret/apps/<app> and never rotated (init.yml → seed_generated_app_secret.yml).
# openbao_secrets then exposes these paths to the nautobot/zammad roles.
#
# Split out of 01b-app-secrets.yml, which was at its token budget. See that
# file's header for the promote-vs-generate distinction; this file only holds
# the generated side.
openbao_generated_app_secrets:
  nautobot: [db_password, secret_key, superuser_password]
  # Zammad fields are app-namespaced (zammad_*) so the flat merge into
  # bao_apps_secrets (openbao_secrets reads apps/nautobot + apps/zammad +
  # apps/vikunja into one dict) never collides with Nautobot's bare
  # db_password. The consumers already read the namespaced names
  # (inventory/group_vars/{zammad_group,postgres_group}.yml).
  zammad: [zammad_db_password, zammad_admin_password, zammad_hermes_api_token,
           zammad_splunk_api_token, zammad_ntfy_api_token]
  # Streaming-replication credential for the shared-apps Postgres pair (the
  # postgres role's primary creates the replicator login with it; the standby
  # puts it in .pgpass). Bare name is safe in the flat bao_apps_secrets merge —
  # no other app path carries a replication_password field.
  postgres: [replication_password]
  # MCP gateway (IBM mcp-context-forge): admin basic-auth password, JWT signing
  # secret, and the AES encryption key for its stored per-upstream auth
  # headers. No db_password — it defaults to SQLite. Any upstream MCP server's
  # own API key (e.g. Hugging Face, Postman) is a pre-existing external
  # credential, NOT generated here; it belongs in secrets-external/ and is
  # referenced by the gateway's per-server config, never written to this map.
  mcp-gateway: [mcp_gateway_admin_password, mcp_gateway_jwt_secret, mcp_gateway_encryption_secret]
  # Hindsight agent-memory service: its dedicated Postgres cluster's DB +
  # replication credentials, the Control Plane UI access key, and its own
  # router key (same per-caller-key contract as open-webui/langgraph below:
  # generated here, read by ansible-proxmox-ai's llm_router role).
  hindsight: [hindsight_db_password, hindsight_replication_password, hindsight_cp_access_key, hindsight_llm_router_key]
  # LiteLLM router login on the SAME ai-VLAN cluster Hindsight uses. The router
  # keeps its learned per-model quality estimates in Postgres; without them it
  # restarts onto cold-start priors and behaves like a working router that is
  # permanently worse. GENERATED, not promoted: this creates a new role on an
  # existing cluster, so no stored data depends on the previous value.
  # App-namespaced for the flat bao_apps_secrets merge. The router's master key
  # and Redis password are NOT here — they live at ai/llm and ai/llm-router in
  # the local-llm domain, hand-seeded, and must keep their current values.
  llm-router: [llm_router_db_password]
  # Per-caller virtual keys for the router. Generated HERE so the router never
  # mints or distributes a credential — it registers a value it merely READS
  # (ansible-proxmox-ai, roles/llm_router/tasks/seed-keys.yml), and reads are
  # pre-authorized. Replaces these two consumers' use of the shared router
  # master key for router calls, which made spend unattributable and made
  # revoking one tool a rotation for everyone. App-namespaced for the flat
  # bao_apps_secrets merge, same as every other field here.
  open-webui: [open_webui_llm_router_key]
  langgraph: [langgraph_llm_router_key]
  # Same shape: one field, generated here, read by ansible-proxmox-ai's
  # llm_router role (56-virtual-keys.yml) and each consumer's own role
  # (agentgateway_docker, dify_docker, llamaindex), replacing their prior use
  # of the shared router master key.
  agentgateway: [agentgateway_llm_router_key]
  dify: [dify_llm_router_key]
  llamaindex: [llamaindex_llm_router_key]
  # Same shape again: Langfuse's own "litellm-router" LLM connection, replacing
  # its prior use of the shared router master key.
  langfuse: [langfuse_llm_router_key]
  # CI's router key. Generated here like the two above; the workflows that use
  # it read it as an Actions secret, so an operator copies the value into the
  # org secret sync once. Scoped to the delegated-work aliases only, so CI
  # cannot spend on the lead tier and revoking it touches nothing else.
  github-actions: [github_actions_llm_router_key]
  # Open-source-repository CI review key ("oss" is the scope word; never
  # "public" in a credential name). The consumer declares apps/github-actions-oss
  # in ansible-proxmox-ai roles/openbao_secrets (apps domain, optional) and
  # registers it as the `github-actions-oss` virtual key in roles/llm_router.
  github-actions-oss: [github_actions_oss_llm_router_key]
  # The metrics scraper's router key, same contract as the two above. Lands at
  # secret/apps/prometheus. TWO readers, both of which read this exact field:
  # roles/prometheus_stack here (inventory/group_vars/prometheus_group.yml puts
  # it in the scrape job's bearer) and ansible-proxmox-ai's roles/llm_router
  # (defaults/main/56-virtual-keys.yml registers it as the `prometheus-scrape`
  # virtual key, scoped to no model). One field, both ends, so the credential
  # the scraper presents and the one the router accepts cannot drift.
  prometheus: [prometheus_llm_router_key]
  # Cribl Stream management API (:9000) local admin password — rotated off
  # the vendor default by roles/cribl_stream tasks/rotate_admin_password.yml.
  # Consumed by inventory/group_vars/cribl_stream_group.yml.
  cribl-stream: [cribl_admin_password]
  # Same shape as the four entries above: one field per app.
  opencode: [opencode_llm_router_key]
  raycast: [raycast_llm_router_key]
  codex: [codex_llm_router_key]
  cursor: [cursor_llm_router_key]
  litellm-local: [litellm_local_llm_router_key]
  # Trusted-tier harness key; the consumer declares apps/claude-code in
  # ansible-proxmox-ai roles/openbao_secrets (apps domain, optional) and
  # registers it as the `claude-code` virtual key in roles/llm_router.
  claude-code: [claude_code_llm_router_key]
  hermes-default: [hermes_default_llm_router_key]
  hermes-splunk-admin: [hermes_splunk_admin_llm_router_key]
  hermes-homelab-admin: [hermes_homelab_admin_llm_router_key]
  hermes-github-maint: [hermes_github_maint_llm_router_key]
  # hermes-ui companion web guest (ai VLAN): hermes-workspace's bind password
  # plus mission-control's auth pair. App-namespaced for the flat
  # bao_apps_secrets merge. hermes_ui_hermes_api_token is deliberately NOT
  # here — it must MATCH hermes_agent's HERMES_API_SERVER_KEY rather than be
  # generated independently, and the consumer treats it as optional (empty
  # just means the workspace UI dials the gateway unauthenticated).
  hermes-ui: [hermes_ui_workspace_password, hermes_ui_mission_control_auth_user, hermes_ui_mission_control_auth_pass]
  # AI session-history backup. One RustFS bucket per vendor
  # (ai-sessions-{claude,codex,gemini}), each with a read-only and a
  # read-write key, so a machine pushing its own history cannot read or write
  # any other bucket — the writers are laptops, and an account-wide key on a
  # laptop is exactly what the per-bucket split exists to prevent.
  #
  # Only the secrets are generated here; the access key IDs are the fixed
  # names ai-sessions-<vendor>-{ro,rw}, created as RustFS users from these
  # values. Fields are app-namespaced for the flat bao_apps_secrets merge.
  ai-sessions:
    - claude_ro_secret
    - claude_rw_secret
    - codex_ro_secret
    - codex_rw_secret
    - gemini_ro_secret
    - gemini_rw_secret
  # Workflow-engine login for the shared Postgres cluster. Generated, not
  # promoted: the cutover creates a NEW role on the shared cluster, so nothing
  # depends on the previous value. The encryption key for the same app is in
  # openbao_promoted_app_secrets — the two must not be confused.
  # App-namespaced for the flat bao_apps_secrets merge.
  #
  # n8n_llm_router_key: n8n's LiteLLM Request node, scoped to the one model
  # it calls (roles/n8n_docker n8n_docker_seed_model) in ansible-proxmox-ai's
  # roles/llm_router `n8n` virtual key.
  n8n: [n8n_db_password, n8n_llm_router_key]
  # Homarr dashboard. Only the admin password is generated: it is the service
  # account the homarr role uses to mint an API key, and Homarr's own API key
  # cannot be minted without a session. The other two fields at this path
  # (homarr_api_key, homarr_encryption_key) are PUBLISHED by the role rather
  # than seeded here — the API key is issued by Homarr, and the encryption key
  # is adopted from whatever the app already has on disk, because it decrypts
  # every stored integration credential and a fresh one would not invalidate
  # them, it would make them permanently unreadable.
  #
  # Listing the app here is also what grants the `apps` AppRole read on
  # secret/apps/homarr at all (openbao_apps_read_apps derives the grant from
  # these maps' keys), which is what the published fields are read back through.
  homarr: [homarr_admin_password]
  # Local Vikunja login password for each Hermes bridge identity
  # (roles/vikunja hermes_bridge_identities.yml). Read-only from the apps
  # converge, same as the other fields at this path.
  vikunja: [donna_login_password]
  # Samba accounts for the per-node SMB shares (ansible-proxmox nas_storage).
  # Two accounts, named by ROLE rather than by person: a service account and a
  # human-facing one. BOTH the username and the password are generated, because
  # a login name is half of a credential and cannot be rotated once published --
  # so it is never written into the desired-state object or into converge logs,
  # and the role resolves it from here at converge time.
  #
  # The *_username fields take the login-safe alphabet and length (see
  # openbao_app_secret_username_suffix); the passwords take the normal one.
  nas:
    - smb_service_account_username
    - smb_service_account_password
    - smb_user_username
    - smb_user_password
  # Shared static token both the Semaphore server and its runner read as
  # SEMAPHORE_RUNNER_REGISTRATION_TOKEN, letting the runner self-register.
  semaphore: [semaphore_runner_registration_token]
  # Confidential OIDC client secrets for apps that need a real shared secret
  # rather than Hermes/Donna's public-PKCE pattern (Homarr, Langfuse, Phoenix,
  # Semaphore, terrakube-dex, Grafana — all server-side apps). Authelia's role hashes the plaintext
  # into its own config; the consuming app's role reads the same plaintext back
  # via bao_apps_secrets. Listing the app here grants the `apps` AppRole read on
  # secret/apps/authelia (same mechanism as the homarr note above).
  authelia:
    [
      authelia_uicheck_password,
      authelia_oidc_homarr_client_secret,
      authelia_oidc_langfuse_client_secret,
      authelia_oidc_phoenix_client_secret,
      authelia_oidc_semaphore_client_secret,
      authelia_oidc_terrakube_dex_client_secret,
      authelia_oidc_grafana_client_secret,
      authelia_oidc_litellm_client_secret,
    ]

# Random length/format tunables for these generated secrets:
# see 01b-app-secret-generation.yml.
