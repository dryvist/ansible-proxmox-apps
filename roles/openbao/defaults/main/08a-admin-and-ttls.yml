---
# Machine-identity AppRole pairs from the env document (secret/platform/
# ansible/env), read once per run by the localhost prefetch play in
# playbooks/site/00-load-and-telemetry.yml.
openbao_platform_env: "{{ hostvars['localhost'].openbao_platform_env_doc | default({}) }}"
# --- External admin token (provisioning against an ALREADY-LIVE cluster) -----
# The initial `bao operator init` only happens once; after that, adding new
# policies/AppRoles (e.g. growing openbao_approles/openbao_policies above)
# needs a privileged token supplied out-of-band, since there is no longer a
# fresh root token to mint one from. Set via env, never committed/logged.
openbao_provisioning_token: >-
  {{ lookup('env', 'OPENBAO_PROVISIONING_TOKEN') | default('', true) }}

# --- Per-call reconcile identity ---------------------------------------------
# Never read a stored openbao-reconcile secret_id, or reuse CONVERGE_* for the
# reconcile login. The routine path authenticates to approle-issuer, mints one
# target secret_id, logs in as openbao-reconcile, then destroys that secret_id.
openbao_approle_issuer_role_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_APPROLE_ISSUER_ROLE_ID') | default('', true) }}
openbao_approle_issuer_secret_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_APPROLE_ISSUER_SECRET_ID') | default('', true) }}

# The reconcile login is delegated to the controller, so it needs the address
# the CONTROLLER can reach -- openbao_api_addr is the guest's own bind address.
# BAO_ADDR is already ambient for every runner invocation.
openbao_reconcile_addr: >-
  {{ lookup('env', 'BAO_ADDR') | default('', true) }}

# --- AppRole token TTLs -------------------------------------------------------
openbao_approle_token_ttl: 1h
openbao_approle_token_max_ttl: 4h

# --- secret_id lifetime -------------------------------------------------------
# A secret_id is the long-lived half of an AppRole credential: the role_id is a
# public identifier, the secret_id is the password. `secret_id_ttl: 0` means it
# NEVER expires and `secret_id_num_uses: 0` means it may be redeemed forever —
# so a copy that leaks (a drop file left on a controller, a value pasted into a
# shell history, an operator's clipboard) stays a working credential until
# somebody notices and revokes it by hand. Nothing here rotates it, so "rotate
# manually" was, in practice, never.
#
# The defaults below are therefore finite for every identity:
#
#   machine / guest / CI identities  secret_id_ttl 24h, num_uses 30
#     24h bounds an unredeemed grant to one day. num_uses 30 bounds a redeemed
#     one to roughly a day of converge logins — generous for a loop that logs
#     in once or twice per run, tight enough that a copied value cannot serve
#     an attacker indefinitely.
#   human-unlocked identities        secret_id_ttl 15m, num_uses 1
#     Already the shape of the elevated tiers (openbao_ai_elevated_secret_id_ttl
#     in 07a); named here so the human tier is one constant, not a literal.
#
# Machine AppRoles in openbao_manageable_approles: create is add-if-missing;
# init/10-approles.yml then reconciles secret_id_ttl / num_uses / token TTLs
# on existing roles with the same complete field set as create (a partial
# write would reset omitted fields). That does not mint a secret_id and does
# not expire already-issued ones. Break-glass / inert human-gated roles are
# excluded from the reconcile-managed set BY DESIGN — tightening a default
# here does not retune them, and a routine converge must not grant an admin
# token to make that happen.
openbao_approle_secret_id_ttl: 24h
openbao_approle_secret_id_num_uses: 30
# Shared bounds for secret_ids issued per call and the reconcile token window.
openbao_approle_per_call_secret_id_ttl: 15m
openbao_approle_per_call_secret_id_num_uses: 1
openbao_reconcile_approle_token_ttl: 8h
openbao_reconcile_approle_secret_id_num_uses: 1
# The human-unlock tier: one wrapped, single-use secret_id per window.
openbao_approle_human_secret_id_ttl: 15m

# The declared secret_id_ttl for every AppRole playbooks/openbao-rotate-
# approles.yml mints: the openbao_secrets converge-domain prefetch
# identities (openbao_secrets_domain_approle_names -- 07b-base-approles.yml
# declares their policy but
# not their ttl, see the comment there) plus the scheduled rotate identity
# itself, rotating its own secret_id last. Nothing here re-mints ANY of
# these EXCEPT that scheduled rotation, so the ttl must outlast a missed
# run, never a single cycle.
#
# iac-platform tofu/semaphore/schedules.tf's openbao_rotate_scheduled
# schedule (Semaphore project schedule id 5, template 40, resource
# semaphoreui_project_schedule.openbao_rotate_scheduled) runs
# openbao-rotate-approles-scheduled on cron "13 3,15 * * *" -- every 12h,
# declared once here as openbao_rotate_scheduled_interval.
# 3x that interval is the margin for one missed run before a domain's
# env-document credential goes stale (Vikunja 3197's isolation failure,
# the reason #1963 made these never-expire in the first place -- scheduled
# rotation is now the thing that re-mints them, so a finite bound no
# longer reproduces that failure).
openbao_rotate_scheduled_interval: 12h
openbao_rotated_domain_secret_id_ttl: 36h

# Per-role overrides, name -> value. An entry in openbao_base_approles wins over
# these (it is the more visible declaration); these win over the globals above.
#
# playbooks/openbao-rotate-approles.yml reads this map directly, by role
# name, to learn each rotated identity's declared secret_id_ttl without a
# live `auth/approle/role/<name>` read the rotate identity's policy does
# not (and must not) grant. Every entry shares the one variable above --
# never a per-role literal, so the missed-run margin is a single number to
# tune.
openbao_approle_secret_id_ttl_overrides:
  observability: "{{ openbao_rotated_domain_secret_id_ttl }}"
  local-cloud: "{{ openbao_rotated_domain_secret_id_ttl }}"
  monitoring: "{{ openbao_rotated_domain_secret_id_ttl }}"
  media: "{{ openbao_rotated_domain_secret_id_ttl }}"
  ntfy: "{{ openbao_rotated_domain_secret_id_ttl }}"
  apps: "{{ openbao_rotated_domain_secret_id_ttl }}"
  local-llm: "{{ openbao_rotated_domain_secret_id_ttl }}"
  local-llm-workstation: "{{ openbao_rotated_domain_secret_id_ttl }}"
  cribl-edge-mac-a: "{{ openbao_rotated_domain_secret_id_ttl }}"
  cribl-edge-mac-b: "{{ openbao_rotated_domain_secret_id_ttl }}"
  agent-ssh-sign: "{{ openbao_rotated_domain_secret_id_ttl }}"
  hermes: "{{ openbao_rotated_domain_secret_id_ttl }}"
  hermes-private-agent: "{{ openbao_rotated_domain_secret_id_ttl }}"
  ai-donna: "{{ openbao_rotated_domain_secret_id_ttl }}"
  open-llm: "{{ openbao_rotated_domain_secret_id_ttl }}"
  approle-secret-id-rotate-scheduled: "{{ openbao_rotated_domain_secret_id_ttl }}"
  # Standing identities outside the scheduled rotation: their secret_id is
  # rendered onto the host (or held by the operator's deploy) at converge
  # time, and nothing re-mints it. Non-expiring, bounded by the source-address
  # class each carries in 08b, the same shape as the roles declared "0s" in
  # 07b/07d. slack-admin and slack-ops take the same value from 04.
  iac-platform-deploy: "0s"
  snapshot: "0s"
  splunk-mcp-rotate: "0s"
  secret-age-audit: "0s"
  github-runner: "0s"
  macos-vm-runner: "0s"
# num_uses 0 (unlimited redemptions) is permitted ONLY with a reason on the line.
openbao_approle_secret_id_num_uses_overrides:
  # Its secret_id is live, non-expiring, and in active use by every agent
  # session; capping redemptions here would strand them at an arbitrary login.
  # Bounded instead by the CIDR class below until it is deliberately re-minted.
  ai-orchestrator: 0
  # The dispatcher redeems its secret_id once per job and once per renewal, so
  # a use cap empties it between rotations. Bounded by the 24h ttl, the
  # scheduled 12h rotation and its single-host CIDR instead.
  open-llm: 0
  # The standing, non-expiring identities above: each systemd timer, runner
  # agent or deploy redeems its one secret_id on every run, so a redemption
  # cap would strand it mid-schedule. Bounded by its 08b source class instead.
  iac-platform-deploy: 0  # operator deploy, redeemed per run
  snapshot: 0  # snapshot timer, redeemed per run
  splunk-mcp-rotate: 0  # splunk-mcp rotator timer, redeemed per run
  secret-age-audit: 0  # secret-age timer, redeemed per run
  github-runner: 0  # runner bao agent, redeemed per job
  macos-vm-runner: 0  # macOS VM runner agent, redeemed per job
  slack-admin: 0  # slack-admin rotator timer, redeemed per run
  slack-ops: 0  # workstation Slack helper, redeemed per call
  # github-read / github-write moved to their 07b declarations, next to the
  # secret_id_ttl they pair with.
  # The write realm roles (github-write-work etc.) keep the default 30-use cap
  # deliberately: each is redeemed once per realm session, not once per
  # token mint, so 30 redemptions/day does not exhaust the same way.

# The AppRole auth mount's own login lockout. OpenBao's lockout config exists
# only per auth mount, so this tune applies to every AppRole on the mount, not
# only the shared workstation aliases -- the compensating controls for that
# breadth are the other roles' high-entropy secret_ids and per-role address
# classes. Shared workstation aliases are redeemed by many concurrent
# sessions; the mount default of 5 failures per 15 min locks the alias on
# ordinary retry noise. lockout_counter_reset is left at the mount default
# (15 min = 900s) so the sustainable failed-login rate is 5x the default, not
# 15x. The two durations are declared in seconds (not "5m"/"15m") because the
# tune read returns them as integer seconds, and the drift check below
# compares them directly.
openbao_approle_lockout_threshold: 25
openbao_approle_lockout_duration: 300
openbao_approle_lockout_counter_reset: 900
