---
# --- GitHub secrets engine (ephemeral GitHub App installation tokens) ------
# Independent from the AWS engine: it has its own mount, catalog entry,
# configuration, permission sets, policy grant, and leases. The App private key
# is required only for first configuration/rotation and is never stored in KV.
openbao_github_engine_enabled: true
# The infra/admin App's mount. Everyday read and write tokens come from the
# `github` mount (03b-github-app-mounts.yml), backed by a different App.
openbao_github_mount: github-admin
openbao_github_plugin_name: vault-plugin-secrets-github
openbao_github_plugin_version: "2.3.2"
openbao_github_plugin_catalog_version: "v{{ openbao_github_plugin_version }}"
openbao_github_plugin_release_base_url: >-
  https://github.com/martinbaillie/vault-plugin-secrets-github/releases/download
openbao_github_plugin_release_tag: "v{{ openbao_github_plugin_version }}"
openbao_github_plugin_asset: vault-plugin-secrets-github-linux-amd64
openbao_github_plugin_command: >-
  {{ openbao_github_plugin_asset }}-v{{ openbao_github_plugin_version }}
openbao_github_plugin_asset_url: >-
  {{ openbao_github_plugin_release_base_url }}/{{ openbao_github_plugin_release_tag
  }}/{{ openbao_github_plugin_asset }}
openbao_github_plugin_checksums_filename: SHA256SUMS
openbao_github_plugin_checksums_url: >-
  {{ openbao_github_plugin_release_base_url }}/{{ openbao_github_plugin_release_tag
  }}/{{ openbao_github_plugin_checksums_filename }}
openbao_github_plugin_checksums_signature_url: >-
  {{ openbao_github_plugin_checksums_url }}.sig
openbao_github_app_id: "{{ lookup('env', 'OPENBAO_GITHUB_APP_ID') | default('', true) }}"
openbao_github_app_private_key: >-
  {{ lookup('env', 'OPENBAO_GITHUB_APP_PRIVATE_KEY') | default('', true) }}
openbao_github_dryvist_installation_id: >-
  {{ lookup('env', 'OPENBAO_GITHUB_ADMIN_DRYVIST_INSTALLATION_ID') | default('', true) }}
openbao_github_personal_installation_id: >-
  {{ lookup('env', 'OPENBAO_GITHUB_ADMIN_PERSONAL_INSTALLATION_ID') | default('', true) }}
# Read-tier permission map: what a group-scoped read token may do. Applied to
# ALL repos of the installation (no repositories list on the read sets — the
# blast radius of a leaked read token is "can read", not "can change").
openbao_github_read_permissions:
  contents: read
  metadata: read
  pull_requests: read
  issues: read
  actions: read
  checks: read
  statuses: read
  # Code-scanning and Dependabot findings. `checks`/`statuses` only expose the
  # pass/fail rollup of an analysis, not the alerts themselves, so without
  # these a read token gets 403 "Resource not accessible by integration" from
  # the code-scanning and Dependabot alert endpoints — which is most of the
  # point of a read tier for CI triage. Both are read-only here and well inside
  # the App's ceiling (it is granted security_events: write).
  security_events: read
  vulnerability_alerts: read
# repo-create tier: exactly one permission, exactly this value. Widening it
# defeats the narrow-tier design (add a new tier instead of broadening this
# one) — asserted verbatim in tasks/init/05-github-engine.yml.
openbao_github_repo_create_permissions:
  administration: write
# org-admin tier: exactly one permission, organization-level. Org rulesets and
# other organization settings; asserted verbatim like the repo-create map.
openbao_github_org_admin_permissions:
  organization_administration: write
# Runner registration is organization-scoped.  This is deliberately separate
# from repository read/write credentials: it cannot read source or name a
# repository, and only mints the short-lived registration token a runner needs.
openbao_github_runner_permissions:
  organization_self_hosted_runners: write
# CI-metrics exporter (github_exporter role, prometheus host). Read-only,
# organization-scoped: `actions:read` for the workflow_runs/workflow_jobs/
# runners collectors, `administration:read` for the org-level runners listing.
# No `contents`/`pull_requests`/`issues` — this identity never reads source.
openbao_github_exporter_permissions:
  actions: read
  administration: read
# Publish tier: the ONE set that both WRITES and is repository-scoped. The
# scope lives in the set itself — installation_id, the repository list and the
# permission map are all stored server-side, and the permission-set token path
# ignores request bodies at plugin v2.3.2, so a holder can widen none of them.
# That is why this is a set rather than a github-write realm: a publisher runs
# unattended and should carry no ability to name its own target.
openbao_github_docs_publisher_set_name: docs-publisher
openbao_github_docs_publisher_permissions:
  contents: write
  pull_requests: write
# The repository name is supplied by the iac secret store, NOT inline: this
# repository is public and the installation covers private repositories, the
# same reasoning as OPENBAO_GITHUB_WRITE_REPOS. Unset yields no set at all
# rather than a set with an empty repository list — an omitted `repositories`
# on a permission set means the WHOLE installation, so an unconfigured
# publisher must not exist rather than exist unbounded. Explicit literals
# only, never a glob, for the reason recorded with the write allowlist.
openbao_github_docs_publisher_repos: >-
  {{ (lookup('env', 'OPENBAO_GITHUB_DOCS_PUBLISHER_REPOS') | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
# App bucket the publisher policy may read (01c-app-secrets-generated.yml).
openbao_github_docs_publisher_kv_app: github-actions
openbao_github_docs_publisher_permission_sets: >-
  {{ [{'name': openbao_github_docs_publisher_set_name,
       'tier': 'publish',
       'installation_id': openbao_github_dryvist_installation_id,
       'repositories': openbao_github_docs_publisher_repos,
       'permissions': openbao_github_docs_publisher_permissions}]
     if openbao_github_docs_publisher_repos | length > 0 else [] }}
# open-llm write tier: same shape as docs-publisher — the ONE set that
# both writes and is repository-scoped, scope stored server-side so the
# holder (the open-llm AppRole) cannot widen it. Lets open-llm push a
# branch and open a PR (step 4 smoke test) on an explicit allowlist of
# PUBLIC dryvist repos only — no contents/pull_requests grant exists
# anywhere else on the open-llm policy. Unset env -> no set, same as
# docs-publisher: an unconfigured allowlist must not exist unbounded.
openbao_github_open_llm_set_name: open-llm-write
openbao_github_open_llm_permissions:
  contents: write
  pull_requests: write
openbao_github_open_llm_repos: >-
  {{ (lookup('env', 'OPENBAO_GITHUB_OPEN_LLM_REPOS') | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
openbao_github_open_llm_permission_sets: >-
  {{ [{'name': openbao_github_open_llm_set_name,
       'tier': 'publish',
       'installation_id': openbao_github_dryvist_installation_id,
       'repositories': openbao_github_open_llm_repos,
       'permissions': openbao_github_open_llm_permissions}]
     if openbao_github_open_llm_repos | length > 0 else [] }}
# tier drives which identities may mint a set (see the github-*-policy
# templates): `read` sets are ambient; `admin` sets (installation-wide, full
# App ceiling) are minted only through the inert, human-gated github-admin
# identity. Per-repo WRITE tokens intentionally have NO set here — they use
# the raw github/token endpoint, parameter-pinned by the github-write policy
# to exactly one allowlisted repository per request (a stored set cannot be
# narrowed by the request body at plugin v2.3.2, so per-repo scoping must
# ride the raw endpoint).
openbao_github_base_permission_sets:
  - name: dryvist-full-automation
    tier: admin
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
  - name: personal-full-automation
    tier: admin
    installation_id: "{{ openbao_github_personal_installation_id }}"
  # repo-create: administration:write ONLY — narrow enough to call
  # `POST /orgs/dryvist/repos` and nothing else (no contents, no pull_requests,
  # so this token cannot push). No `repositories` key: administration at the
  # org level cannot be scoped to a repo that does not exist yet. Dryvist only
  # — a personal-account counterpart is not shipped, see docs/secrets-engines.md
  # for why a personal one buys nothing.
  - name: dryvist-repo-create
    tier: repo-create
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_repo_create_permissions }}"
  - name: dryvist-org-admin
    tier: org-admin
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_org_admin_permissions }}"
  - name: runner-register-dryvist
    tier: runner
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_runner_permissions }}"
  - name: exporter-dryvist
    tier: exporter
    installation_id: "{{ openbao_github_dryvist_installation_id }}"
    permissions: "{{ openbao_github_exporter_permissions }}"
# Full set list = the static base above + the publish tier, which exists only
# when its repository list is configured.
# Sets on the admin mount only; 05-github-engine.yml reconciles exactly these.
openbao_github_admin_permission_sets: >-
  {{ openbao_github_base_permission_sets
     + openbao_github_docs_publisher_permission_sets
     + openbao_github_open_llm_permission_sets }}
# Every set on every GitHub mount, each tagged with its mount, for the policy
# templates.
openbao_github_permission_sets: >-
  {{ (openbao_github_admin_permission_sets
      | map('combine', {'mount': openbao_github_mount}) | list)
     + (openbao_github_read_permission_sets
        | map('combine', {'mount': openbao_github_everyday_mount}) | list)
     + (openbao_github_agents_permission_sets
        | map('combine', {'mount': openbao_github_agents_mount}) | list) }}
