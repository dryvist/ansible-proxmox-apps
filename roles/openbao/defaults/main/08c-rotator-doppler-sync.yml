---
# playbooks/openbao-rotate-approles.yml also republishes the workstation
# domains' rotated pairs into Doppler (the six below), so a workstation
# reading iac-conf-mgmt/prd never sees a stale role_id/secret_id after a
# rotation run. `ntfy` is deliberately excluded: it has no workstation
# consumer, only plane-side ones already reading secret/platform/ansible/env
# directly.
#
# The token that authenticates the Doppler write is never ambient env and
# never lives in Doppler itself -- it is minted once (read/write, scoped to
# exactly this one project/config) and stored at
# openbao_rotate_doppler_token_kv_path, read by the rotate identity's own already-
# authenticated OpenBao token (see the matching grant in
# templates/approle-secret-id-rotate-policy.hcl.j2).
openbao_rotate_doppler_project: iac-conf-mgmt
openbao_rotate_doppler_config: prd
openbao_rotate_doppler_token_kv_path: platform/rotator/doppler-sync-token
openbao_rotate_doppler_sync_domains:
  - apps
  - local-llm
  - media
  - monitoring
  - local-cloud
  - observability
