---
# --- openbao_rotators wave: rotator + audit identities ----------------------
#   splunk-mcp-rotate — mints+publishes the shared Splunk MCP bearer token;
#                        read secret/apps/splunk-rotator (its own minter
#                        creds), read+update secret/ai/mcp/splunk, read+patch
#                        its metadata. Nothing else.
#   secret-age-audit   — read-only sibling auditor: list+read every KV
#                        metadata path (to read rotated_<field> stamps and
#                        updated_time) plus AppRole secret-id accessor lookup
#                        (to age secret_ids too). NO data/ capability
#                        anywhere — it audits freshness, it never reads a
#                        secret value.
#   ai-rotate          — human-gated on-demand writer scoped to secret/ai/*
#                        (rotate-key.yml): no standing secret_id, single-use
#                        wrap is the approval — see 07e-rotation-approles.yml.
#   apps-rotate        — same, scoped to secret/apps/*.
#   rustfs-rotate      — same, scoped to secret/rustfs/*.
openbao_splunk_mcp_rotate_policy_name: splunk-mcp-rotate
openbao_splunk_mcp_rotate_approle_name: splunk-mcp-rotate
openbao_secret_age_audit_policy_name: secret-age-audit
openbao_secret_age_audit_approle_name: secret-age-audit
openbao_ai_rotate_policy_name: ai-rotate
openbao_ai_rotate_approle_name: ai-rotate
openbao_apps_rotate_policy_name: apps-rotate
openbao_apps_rotate_approle_name: apps-rotate
openbao_rustfs_rotate_policy_name: rustfs-rotate
openbao_rustfs_rotate_approle_name: rustfs-rotate
# approle-secret-id-rotate — narrower than approle-issuer: it may mint and
# destroy a secret-id ONLY for the openbao_secrets domain AppRoles, and CAS
# read+write the one KV document those domains' credentials live in
# (secret/platform/ansible/env) -- approle-issuer can mint for every
# issuable role but holds neither the destroy nor the KV-write capability.
# Same human-gated, inert, single-use shape as ai-rotate/apps-rotate: minting
# a fresh domain credential and retiring the old one is a deliberate act, not
# a routine unattended one.
openbao_approle_secret_id_rotate_policy_name: approle-secret-id-rotate
openbao_approle_secret_id_rotate_approle_name: approle-secret-id-rotate
# approle-secret-id-rotate-scheduled — the SAME policy as above, attached to
# a second, standing-credential AppRole so a scheduled run (no operator to
# wrap a secret_id every cycle) can authenticate. Same machine class and
# same secret_id lifetime as every other unattended machine identity
# (openbao_approle_cidr_class_map's default + openbao_approle_secret_id_ttl
# / _num_uses -- no override, see splunk-mcp-rotate for the identical
# precedent): liveness-probed and re-minted by a provisioning run exactly
# like the domain AppRoles this identity itself rotates.
openbao_approle_secret_id_rotate_scheduled_approle_name: approle-secret-id-rotate-scheduled
