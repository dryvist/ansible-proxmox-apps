---
# --- KV hierarchy -------------------------------------------------------------
# Secret hierarchy (see terraform-proxmox docs/SECRETS_HIERARCHY.md):
#   secret/infra/*     IaC kernel (proxmox/aws/network) — terraform-apply writes
#   secret/platform/*  shared platform services (dns/traefik/terrakube/splunk/
#                      cribl/object-storage/compute/...)
#   secret/apps/*      application credentials (media/monitoring/home-automation)
#   secret/ai/*        LLM stack + AI-agent creds
#   secret/ci/*        CI/CD tokens
openbao_kv_mount: secret
# Non-secret configuration mount. Holds values that are sensitive-but-not-
# exploitable — operator selections, tunables, thresholds, coordination and
# inventory-ish facts — that today sit inside the credential mounts.
#
# It is a separate MOUNT, not a path prefix, for the same reason
# secrets-external is: a prefix shares one policy namespace, so every wildcard
# already granted on `secret/` reaches across it and the boundary is decorative.
# A distinct mount is unreachable by any policy that does not name it.
#
# Named `config` rather than a `secret*` sibling deliberately: an operator
# reading `bao secrets list` sees `secret/`, `secrets-external/`, `config/` and
# can tell at a glance which mount is not a credential store. A name like
# `secrets-internal-public` would blend into the credential mounts it must be
# distinguished from.
openbao_config_mount: config
# KV v2 version retention for the config mount. Browsable history and rollback
# are half the reason this mount exists, so retention is set explicitly rather
# than left on the KV v2 default of 10. Config values are short strings that
# change rarely, so 30 versions is years of history at negligible Raft cost,
# while still bounding what a runaway writer can grow. delete_version_after is
# deliberately left at its default (0 = versions never time-expire): history
# that silently ages out is not history you can roll back to.
openbao_config_mount_max_versions: 30
# Every KV v2 mount this role provisions (add-if-missing, then tuned to the
# declared retention). `max_versions` is optional — omit it to leave a mount on
# the KV v2 default, which is what the two credential mounts do today.
openbao_kv_mounts:
  - path: "{{ openbao_kv_mount }}"
  # External-SaaS credentials; a literal here for the same reason the policy
  # templates use a literal (see tasks/init.yml).
  - path: secrets-external
  - path: "{{ openbao_config_mount }}"
    max_versions: "{{ openbao_config_mount_max_versions }}"
# Derived: the subset that declares retention. Defined once because init.yml
# zips it against its own read results — the two loops must be the same list in
# the same order, which two separate inline filters would not guarantee.
openbao_kv_tuned_mounts: >-
  {{ openbao_kv_mounts | selectattr('max_versions', 'defined') | list }}
# Legacy demo subtree the terraform-proxmox vault-secrets proof writes to; kept
# writable by the terraform-apply policy so that read/write proof keeps working.
openbao_homelab_path: homelab
