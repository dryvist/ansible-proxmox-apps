---
# --- App secret maps -----------------------------------------------------------
# App secrets PROMOTED into secret/apps/<app> so OpenBao is their canonical
# home. Each app maps each KV field to the converge-env var carrying its value.
# The promote step (init.yml → promote_app_secret.yml) runs only on the
# bootstrap host under the admin token, writes only when a value differs from
# what is already stored, and skips any field whose env var is empty — so a
# converge without those values (or with unchanged values) writes nothing.
#
# Promotion vs generation: a value that ALREADY EXISTS and must keep its current
# value goes here. A value that may simply be created fresh goes in
# openbao_generated_app_secrets (01c-app-secrets-generated.yml). Getting this
# backwards on a key that decrypts stored data destroys that data silently.
openbao_promoted_app_secrets:
  vikunja:
    token_ro: VIKUNJA_MCP_TOKEN_RO
    token_rw: VIKUNJA_MCP_TOKEN_RW
    token_admin: VIKUNJA_MCP_TOKEN_ADMIN
    svc_mcp_ro_password: VIKUNJA_SVC_MCP_RO_PASSWORD
    svc_mcp_rw_password: VIKUNJA_SVC_MCP_RW_PASSWORD
    # App-namespaced DB password (matches the postgres_managed_databases +
    # vikunja_group.yml consumers reading bao_apps_secrets.vikunja_db_password).
    vikunja_db_password: VIKUNJA_DB_PASSWORD
    # JWT signing secret + initial admin password (#17039). App-namespaced to
    # match the vikunja_group.yml consumers reading bao_apps_secrets.
    # vikunja_jwt_secret / .vikunja_admin_password. These are promoted from the
    # live guest, not generated here — the JWT secret must stay stable (rotating
    # it invalidates every issued session/API token), so they belong in this
    # promotion map, never in openbao_generated_app_secrets.
    vikunja_jwt_secret: VIKUNJA_JWT_SECRET
    vikunja_admin_password: VIKUNJA_ADMIN_PASSWORD
    # Optional human operator account. PROMOTED into this app's own bucket
    # rather than wired to the general-purpose path the pair occupies today:
    # that path carries exactly these two values, so pointing a domain at it
    # would stand up a whole resource domain to deliver one account, against
    # one-bucket-per-workload. Promoting here retires the path instead.
    # Not app-namespaced like the fields above because these are already
    # distinct names in the flat merge, and no sibling app declares them.
    #
    # ORDER MATTERS. Promotion reads FROM the converge environment, so the
    # bootstrap rows must still exist while this runs. The consumer stays on
    # its env lookup until a converge has been observed writing these fields;
    # only then is the bao-first wiring added and the bootstrap rows removed.
    # Doing both halves at once deletes the source the promotion reads from.
    operator_username: DEFAULT_USERNAME
    operator_password: DEFAULT_PASSWORD
  n8n:
    # The workflow engine's credential-encryption key. PROMOTED, never
    # generated: it is the only thing that can decrypt the credentials already
    # stored in the app's database, so a fresh value would leave a database
    # that restores cleanly and whose every stored credential is permanently
    # unreadable — a backup that looks like it worked. It also must not live
    # only on the guest beside the data it unlocks, which is why it belongs
    # here at all. Internal KV mount (openbao_kv_mount): the engine is not
    # internet-reachable.
    n8n_encryption_key: N8N_ENCRYPTION_KEY
  # prometheus-pve-exporter's read-only PVE API token (roles/prometheus_pve_exporter,
  # Wave 3b). PROMOTED, not generated: OpenBao cannot mint a PVE API token
  # itself — an operator creates a read-only, audit-scoped token with
  # `pveum user token add` (never the Terraform provider's write-capable
  # credential) and this converge-env pair promotes it in, mirroring
  # homarr_proxmox_token_id/_secret (inventory/group_vars/homarr_group.yml) —
  # a separate token per consumer, not a shared one. Absent is a SUPPORTED
  # state: the role skips deploying the exporter rather than rendering a
  # container that would 401 forever.
  pve-exporter:
    pve_exporter_token_id: PVE_EXPORTER_TOKEN_ID
    pve_exporter_token_secret: PVE_EXPORTER_TOKEN_SECRET
  # Splunk admin password and HEC token for the CI runner's e2e suite
  # (tests/e2e/conftest.py reads SPLUNK_PASSWORD / SPLUNK_HEC_TOKEN). PROMOTED,
  # not generated: both are set on the Splunk side by its own converge and
  # shipped to every log producer, so a fresh value here would match nothing.
  # No engine mints Splunk credentials, so KV is the right home. The runner
  # tier reads this one bucket (templates/github-runner-policy.hcl.j2) and its
  # OpenBao Agent renders the pair into the e2e environment file
  # (roles/github_runner). App-namespaced for the flat bao_apps_secrets merge.
  splunk:
    splunk_admin_password: SPLUNK_PASSWORD
    splunk_hec_token: SPLUNK_HEC_TOKEN
  # Actions Runner Controller pilot (roles/github_runner_arc): a dedicated
  # GitHub App, separate from dryvist-full-automation, scoped to Self-hosted
  # runners (read/write) only. PROMOTED, never generated — same reasoning as
  # the main App's key (03-github-engine.yml). App-namespaced for the flat
  # bao_apps_secrets merge.
  github-runner-arc:
    github_runner_arc_app_id: GITHUB_RUNNER_ARC_APP_ID
    github_runner_arc_installation_id: GITHUB_RUNNER_ARC_INSTALLATION_ID
    github_runner_arc_app_private_key: GITHUB_RUNNER_ARC_APP_PRIVATE_KEY
  # open-llm (successor-harness automation identity, open-llm-policy.hcl.j2):
  # copies of the tokens that identity needs, plus its Z.ai key. PROMOTED,
  # not generated — reuses the SAME converge env vars the vikunja/zammad
  # domains already promote from, so this is a second read leaf on an
  # existing value, not a new secret. Deliberately its own small bucket
  # rather than granting open-llm the wider apps/vikunja or apps/zammad
  # paths directly (one-bucket-per-workload).
  # Field names are UPPERCASE, unlike every other bucket here: this one
  # is read directly via `openbao-run --secrets apps/open-llm`, which
  # exports each stored key verbatim as an env var (no case conversion) —
  # so the stored field name IS the consumer's env var name.
  open-llm:
    ZAI_SUBSCRIPTION_KEY: ZAI_SUBSCRIPTION_KEY
    # Stored field renamed to VIKUNJA_API_TOKEN — that is the env var name
    # the vikunja-mcp server itself reads (nix-ai modules/mcp/catalog.nix
    # secretsRun -> openbao-run --secrets, which exports the stored field
    # name verbatim). Source (right side) is unchanged: the same converge
    # env var vikunja's own bucket already promotes from.
    VIKUNJA_API_TOKEN: VIKUNJA_MCP_TOKEN_RO
    ZAMMAD_HTTP_TOKEN: ZAMMAD_HTTP_TOKEN
    # Not secret — the vikunja/zammad API base URLs, same value the `claude`
    # identity already gets from Doppler (VIKUNJA_URL/ZAMMAD_URL fields).
    # Source is a plain Ansible var (below), not a converge env var, because
    # promote_app_secret.yml's overlay checks Ansible vars before OS env.
    VIKUNJA_URL: openbao_open_llm_vikunja_url
    ZAMMAD_URL: openbao_open_llm_zammad_url

# Not secret — plain Ansible vars, not promoted fields with their own env var.
# Built from PROXMOX_SUBDOMAIN, the same domain variable zammad_group.yml's
# zammad_ui_fqdn uses, so this can never carry a literal hostname.
openbao_open_llm_vikunja_url: >-
  https://vikunja.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
     or undef('PROXMOX_SUBDOMAIN is required for the open-llm vikunja URL') }}/api/v1
openbao_open_llm_zammad_url: >-
  https://zammad.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
     or undef('PROXMOX_SUBDOMAIN is required for the open-llm zammad URL') }}/api/v1

# The ONLY `bao` CLI stderr text that means "this path does not exist". A read
# that fails for any OTHER reason -- 403, an unreachable server, a malformed
# response -- says NOTHING about whether the path exists, and concluding
# "absent" from it fires a privileged write against a path this identity cannot
# see. Every read whose result decides a write must therefore tolerate THIS
# string and fail on everything else, rather than blanket `failed_when: false`.
#
# Five instances of that defect were fixed across #1641/#1653/#1656/#1659/#1661;
# these are the rest. See docs-starlight `d/conventions/absent-is-not-denied`.
openbao_absent_stderr_marker: No value found
