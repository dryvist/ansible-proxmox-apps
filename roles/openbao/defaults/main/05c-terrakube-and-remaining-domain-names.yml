---
openbao_terrakube_jwt_auth_path: terrakube
openbao_terrakube_jwt_issuer: "https://terrakube-api.{{ lookup('env', 'PROXMOX_SUBDOMAIN') | default('local', true) }}"
openbao_terrakube_jwt_audience: openbao.workload.identity
openbao_terrakube_jwt_token_ttl: 90m
# Org login that Terrakube stamps into the JWT `sub`
# (`organization:<name>:workspace:<name>`, from job.getOrganization().getName()).
# Must equal the Terrakube organization name — set by iac-platform's
# `organization_name` var (mirrors the GitHub org login). The tofu inventory
# does not carry an `organization` key, so this is sourced directly here;
# override in group_vars/host_vars for a different environment.
openbao_terrakube_organization: dryvist
# Environment-specific workspace names, read from the runtime environment
# (secret store) rather than committed. Each is both the Terrakube workspace
# name and, for the AWS one, its STS role name. Unset = the converge fails on
# first use instead of rendering a blank policy name.
openbao_terrakube_network_workspace: >-
  {{ lookup('env', 'OPENBAO_TERRAKUBE_NETWORK_WORKSPACE')
     | default(undef('OPENBAO_TERRAKUBE_NETWORK_WORKSPACE is empty'), true) }}
openbao_terrakube_aws_workspace: >-
  {{ lookup('env', 'OPENBAO_TERRAKUBE_AWS_WORKSPACE')
     | default(undef('OPENBAO_TERRAKUBE_AWS_WORKSPACE is empty'), true) }}
openbao_terrakube_workspaces:
  - name: iac-platform
    # apps/authelia: the deploy script needs the plaintext semaphore /
    # terrakube-dex OIDC client secrets to configure those two apps —
    # Authelia's role only ever writes the pbkdf2 digest into its own config,
    # never the plaintext, so the consumer reads it back from OpenBao directly.
    kv_read: [platform/terrakube/main, apps/authelia]
  - name: tofu-github
    # Mints an installation token per run instead of reading a stored one. The
    # workspace previously read a static GITHUB_TOKEN out of KV
    # (infrastructure/github, on both mounts); that value expired and every plan
    # failed with `401 Bad credentials`, which is the failure mode a stored PAT
    # has and an engine-minted token does not.
    #
    # dryvist-full-automation is the admin-tier set: installation-wide, full App
    # ceiling. That is the ceiling this workspace already had via the stored
    # token, so this is not a widening — but it IS wider than the work needs,
    # because the set carries no permissions map. The narrower fix is a
    # dedicated permission set scoped to what org configuration actually
    # touches; that is a follow-up, and it is a change to
    # openbao_github_permission_sets rather than to this entry.
    github_mint: [dryvist-full-automation]
  - name: "{{ openbao_terrakube_network_workspace }}"
    # platform/object-storage: that workspace reads the published inventory and
    # the desired-state object out of the store to derive its DNS records and
    # every subnet it configures, so it needs the same store credential
    # tofu-proxmox holds. Its plans failed at the ephemeral read without it.
    kv_read: [infrastructure/unifi, platform/object-storage]
  - name: "{{ openbao_terrakube_aws_workspace }}"
    api_update: ["aws/sts/{{ openbao_terrakube_aws_workspace }}"]
    # The webhook endpoint leaf (02-aws-and-plugins.yml).
    kv_write: ["{{ openbao_hermes_webhook_kv_path }}"]
  - name: tofu-runs-on
    api_update: [aws/sts/tofu-runs-on]
  - name: tofu-proxmox
    kv_read: [infrastructure/proxmox, platform/object-storage]
    # ssh-client-ca/config/ca: read-only (api_read) access to the SSH-CA
    # public key.
    api_read: [ssh-client-ca/config/ca]
  - name: tofu-proxmox-aws-infra
    api_update: [aws/sts/tf-proxmox]
  - name: tofu-proxmox-servarr-config
    kv_read: [apps/media]
  - name: iac-platform-semaphore
    # Declares Semaphore's own project, repositories, inventories, templates
    # and schedules. Reads exactly one path, for exactly one field: the
    # Semaphore API token its provider authenticates with. Deliberately NOT
    # granted apps/authelia — unlike the iac-platform workspace above, this one
    # configures an application through its own API and never touches an OIDC
    # client secret.
    #
    # apps/semaphore, not platform/terrakube/main. Two reasons, and the second
    # is the load-bearing one:
    #   - Scope. That platform path carries the whole Terrakube stack's
    #     credentials (Dex OIDC, object store, database, signing keys). Reading
    #     all of it to obtain one API token is a grant far wider than the need.
    #   - Writability. `platform` is in openbao_ai_readonly_extra_subtrees, so
    #     it has a read leaf and no write leaf by design; `apps` is in
    #     openbao_ai_domains and has both. A credential the deploy must be able
    #     to CREATE cannot live in a subtree the model deliberately keeps
    #     read-only — siting it there turns a routine mint into a request to
    #     widen the access model.
    kv_read: [apps/semaphore]
openbao_ansible_converge_policy_name: ansible-converge
openbao_ansible_converge_approle_name: ansible-converge
# semaphore — the unattended execution plane's own identity. It attaches the
# ansible-converge policy PLUS this delta (semaphore-policy.hcl.j2), and signs
# its SSH certificates under its own principal rather than borrowing
# `ansible`. Kept distinct from ansible-converge because the two callers are
# not equally trusted: see the header of semaphore-policy.hcl.j2.
openbao_semaphore_policy_name: semaphore
openbao_semaphore_approle_name: semaphore
openbao_observability_policy_name: observability
openbao_observability_approle_name: observability
openbao_local_cloud_policy_name: local-cloud
openbao_local_cloud_approle_name: local-cloud
openbao_monitoring_policy_name: monitoring
openbao_monitoring_approle_name: monitoring
openbao_media_policy_name: media
openbao_media_approle_name: media
# ntfy — read-side AppRole for the ntfy alert hub's Slack fan-out
# (openbao_secrets domain "ntfy"). Read-only on the single secrets-external
# entry holding the Slack incoming-webhook URLs keyed by topic; that path is
# internet-reachable Slack infrastructure, so it lives in secrets-external,
# not secret/apps like every other ntfy_docker consumer.
openbao_ntfy_policy_name: ntfy
openbao_ntfy_approle_name: ntfy
# disclosure-denylist — org-wide GitHub disclosure-gate deny terms, one fixed
# string per line. GitHub-consumed (dryvist/.github's reusable
# _disclosure-gate.yml reads it as the org secret DISCLOSURE_DENYLIST, org
# dryvist, visibility: all), so it lives in secrets-external like
# slack-webhooks above, not secret/apps. No Ansible converge fetches this
# path — it has no openbao_secrets_domains entry — so declare_disclosure_
# denylist_metadata.yml (init.yml) only stamps custom_metadata here; the term
# list itself is seeded out of band, never through this converge.
openbao_disclosure_denylist_mount: secrets-external
openbao_disclosure_denylist_path: platform/disclosure-denylist
openbao_disclosure_denylist_field: terms
openbao_disclosure_denylist_metadata:
  owner: dryvist/.github
  reader: "GitHub org secret DISCLOSURE_DENYLIST (org dryvist, visibility: all)"
  docs: "dryvist/.github _disclosure-gate.yml"
  rotation: "manual -- edit the term list directly; no scheduled rotation"
# Narrow read-only leaf (disclosure-denylist-read-policy.hcl.j2), registered
# in openbao_base_policies (07c) but deliberately unattached to any AppRole:
# reads today go through the admin tier's existing per-mount grant
# (ai-admin-policy.hcl.j2 loops openbao_kv_mounts, which already covers every
# secrets-external path). This leaf exists so a future GitHub-sync identity
# scopes to exactly this one entry instead of inheriting break-glass.
openbao_disclosure_denylist_policy_name: disclosure-denylist-read
# apps — read-side AppRole for the shared-Postgres application tier
# (openbao_secrets domain "apps": Nautobot, Zammad). apps-seed above is the
# WRITER; this is the enumerated read-only consumer the converge logs in with
# via APPS_VAULT_ROLE_ID / APPS_VAULT_SECRET_ID.
openbao_apps_policy_name: apps
openbao_apps_approle_name: apps
# Apps the read-side `apps` policy grants read on = the union of both seeding
# maps plus openbao_apps_read_published_apps, so an app that is only promoted
# (never generated) still gets its read grant. Derived rather than listed: a
# hand-maintained list silently missed the promoted apps, and the failure mode
# is a consumer resolving an empty secret.
# openbao_apps_read_published_apps: buckets the `apps` domain reads that no
# seeding map here fills, because another repository's converge publishes them
# (pve-exporter: ansible-proxmox's pve_api_tokens). A read the policy denies
# fails the whole domain fetch, even for a path declared optional.
openbao_apps_read_published_apps:
  - pve-exporter
openbao_apps_read_apps: >-
  {{ ((openbao_generated_app_secrets.keys() | list)
      + (openbao_promoted_app_secrets.keys() | list)
      + openbao_apps_read_published_apps) | unique | sort }}
openbao_local_llm_policy_name: local-llm
openbao_local_llm_approle_name: local-llm
openbao_local_llm_workstation_policy_name: local-llm-workstation
openbao_local_llm_workstation_approle_name: local-llm-workstation
# Host identities whose secret-zero is delivered to guests through the env
# document (secret/platform/ansible/env) rather than the converge operator's
# environment. openbao-rotate-approles.yml writes them only on an explicit
# `-e bootstrap_seed_only=true` run; scheduled rotation skips them.
openbao_host_secret_zero_approle_names:
  - "{{ openbao_slack_admin_approle_name }}"
  - "{{ openbao_slack_ops_approle_name }}"
  - "{{ openbao_terraform_approle_name }}"
  - "{{ openbao_approle_audit_approle_name }}"
  - "{{ openbao_approle_issuer_approle_name }}"
  - "{{ openbao_reconcile_approle_name }}"
  - "{{ openbao_flow_lock_approle_name }}"
  - iac-platform-deploy
# Every scheduled-rotation AppRole, by name; approle-secret-id-rotate-policy.hcl.j2
# scopes its secret-id mint/destroy grants to this one list.
openbao_secrets_domain_approle_names: >-
  {{ [openbao_observability_approle_name,
      openbao_local_cloud_approle_name,
      openbao_monitoring_approle_name,
      openbao_media_approle_name,
      openbao_ntfy_approle_name,
      openbao_apps_approle_name,
      openbao_local_llm_approle_name,
      openbao_local_llm_workstation_approle_name,
      openbao_agent_ssh_sign_approle_name,
      openbao_hermes_approle_name,
      openbao_open_llm_approle_name]
     + ([openbao_hermes_private_agent_approle_name]
        if openbao_hermes_private_agent_secret_id_cidr | length > 0 else []) }}
# Provider-level API credentials live on exact leaves under a separately
# supplied external KV location. Public configuration carries no path literal.
openbao_ai_api_key_mount: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_MOUNT')
     | default(undef('OPENBAO_AI_API_KEY_MOUNT is empty'), true)
     | mandatory('OPENBAO_AI_API_KEY_MOUNT must be supplied by private configuration') }}
openbao_ai_api_key_path_prefix: >-
  {{ lookup('ansible.builtin.env', 'OPENBAO_AI_API_KEY_PATH_PREFIX')
     | default(undef('OPENBAO_AI_API_KEY_PATH_PREFIX is empty'), true)
     | mandatory('OPENBAO_AI_API_KEY_PATH_PREFIX must be supplied by private configuration') }}
# One data list derives both policy objects and AppRole attachments.
openbao_ai_api_key_providers:
  - openrouter
  - gemini
  - alibaba
  - openai
  - anthropic
  - grok
  - deepseek
  - zai
  - nvidia
  - moonshotai
  # opencode — subscription-backed provider whose key is read by the
  # router's local-llm domain. The leaf may be unseeded; the policy grants the
  # read either way so an absent key surfaces as 404, never 403.
  - opencode
# config-read: THE DEFAULT identity on the non-secret `config` mount — read +
# list across every path in it, and nothing anywhere else. Everything that only
# consumes config uses this. Nothing in the mount is a secret, so per-path
# least privilege would buy nothing and cost policy churn on every new key.
openbao_config_read_policy_name: config-read
openbao_config_read_approle_name: config-read
# approle-audit: read-only visibility into `auth/approle/role/*` — the
# credential-bound settings (secret_id TTL/uses, source-address binding, token
# TTL/max TTL) that no reachable non-break-glass identity could read back
# before this (verified live 2026-09-12: every tested AppRole, including
# roles reading their own definition, got permission denied). A declared
# control nobody can read back cannot be shown to hold. Not break-glass:
# read + list only, no write/create/delete/sudo anywhere.
openbao_approle_audit_policy_name: approle-audit
openbao_approle_audit_approle_name: approle-audit
# config-write: a capability policy ATTACHED to the three IaC systems that
# author config (OpenTofu / Ansible / Terrakube), never a standalone AppRole —
# see the template header for why a fourth credential would be the wrong shape.
openbao_config_write_policy_name: config-write
# Terrakube workspaces whose JWT role also carries config-write. Every declared
# workspace by default, since Terrakube is named as a config author; narrowing
# it is one edit here rather than a policy change. NOTE: Terrakube runs
# VCS-driven, potentially untrusted plans, so this is the one config-write
# grant whose blast radius is worth revisiting — it cannot reach a credential
# mount, but it can rewrite config that other systems read.
openbao_config_write_terrakube_workspaces: >-
  {{ openbao_terrakube_workspaces | map(attribute='name') | list }}
# ai-public: the fabric-brain runtime domain (secret/ai/public/*, field
# active_model). Its OWN narrow read-only credential — NOT local-llm's broader
# ai/* read — held by the hermes_agent / open_webui brain-sync timers to
# re-point the brain from OpenBao without a converge. See ansible-proxmox-ai
# roles/openbao_secrets (ai-public domain) + roles/hermes_agent brain-sync.
openbao_ai_public_policy_name: ai-public
openbao_ai_public_approle_name: ai-public
# Router virtual keys for the desktop CLIs that authenticate to OpenBao as
# this same ai-public AppRole (see ~/CLAUDE.local.md "Untrusted tier"). One
# secret/apps/<name> leaf each, read only — see openbao_generated_app_secrets.
openbao_ai_public_router_key_apps: [opencode, raycast, codex, cursor]
openbao_ai_orchestrator_policy_name: ai-orchestrator
openbao_ai_orchestrator_approle_name: ai-orchestrator
# open-llm — the untrusted-tier dispatcher identity: reads its own bucket and
# mints GitHub tokens from the agents mount only. See open-llm-policy.hcl.j2.
openbao_open_llm_policy_name: open-llm
openbao_open_llm_approle_name: open-llm
# The dispatcher host's single address as a /32 (init/10-approles.yml asserts
# the shape). Empty falls back to the machine class.
openbao_open_llm_secret_id_cidr: >-
  {{ lookup('env', 'OPENBAO_AI_SANDBOX_SECRET_ID_CIDR') | default('', true) }}
# ai-readonly / ai-elevated are now ACTOR ROLES that ATTACH base capability
# policies (below) — they no longer own a standalone `ai-*` policy object. Only
# the AppRole names survive as vars; their token_policies are composed rollups.
openbao_ai_readonly_approle_name: ai-readonly
openbao_ai_elevated_approle_name: ai-elevated
