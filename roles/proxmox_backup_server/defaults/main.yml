---
# proxmox_backup_server role defaults

# Proxmox Backup Server is GPL; only the `pbs-enterprise` component is
# subscription-gated. This role adds the community component and never the
# enterprise one — an enterprise entry on a host without a subscription makes
# every `apt update` fail with 401.
#
# Plain HTTP is deliberate and is what the vendor documents: the download
# host is a round-robin over CDN nodes whose certificate does not name it, so
# HTTPS fails hostname verification there. Archive integrity comes from the
# signed-by keyring below, not from the transport.
proxmox_backup_server_repo_url: http://download.proxmox.com/debian/pbs
proxmox_backup_server_repo_component: pbs-no-subscription

# Suite tracks the host's own Debian release rather than a pinned codename, so
# the role keeps working across a distribution upgrade.
proxmox_backup_server_repo_suite: "{{ ansible_distribution_release }}"

# Per-release archive signing key. Served from the host whose certificate is
# valid; the key itself is public and needs no subscription. The filename
# carries the codename, so it follows the suite above.
proxmox_backup_server_release_key_url: >-
  https://enterprise.proxmox.com/debian/proxmox-release-{{ proxmox_backup_server_repo_suite }}.gpg
proxmox_backup_server_keyring_path: /etc/apt/keyrings/proxmox-release.gpg

# Datastore. Both are required and deliberately have no default: the path is a
# site decision (which pool, which mount), and guessing one would silently put
# backups on the root filesystem.
proxmox_backup_server_datastore_name: ""
proxmox_backup_server_datastore_path: ""

# The package creates this account; the datastore directory must belong to it
# or the daemon cannot write chunks.
proxmox_backup_server_user: backup
proxmox_backup_server_group: backup
