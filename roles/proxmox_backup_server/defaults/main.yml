---
# proxmox_backup_server role defaults

# Proxmox Backup Server is GPL; only the `pbs-enterprise` component is
# subscription-gated. This role adds the community component and never the
# enterprise one — an enterprise entry on a host without a subscription makes
# every `apt update` fail with 401.
#
# Plain HTTP is deliberate and is what the vendor documents: the download
# host is a round-robin over CDN nodes whose certificate does not name it, so
# HTTPS fails hostname verification there. Archive integrity comes from the
# signed-by keyring below, not from the transport.
proxmox_backup_server_repo_url: http://download.proxmox.com/debian/pbs
proxmox_backup_server_repo_component: pbs-no-subscription

# Suite tracks the host's own Debian release rather than a pinned codename, so
# the role keeps working across a distribution upgrade.
proxmox_backup_server_repo_suite: "{{ ansible_facts['distribution_release'] }}"

# Per-release archive signing key. Served from the host whose certificate is
# valid; the key itself is public and needs no subscription. The filename
# carries the codename, so it follows the suite above.
proxmox_backup_server_release_key_url: >-
  https://enterprise.proxmox.com/debian/proxmox-release-{{ proxmox_backup_server_repo_suite }}.gpg
proxmox_backup_server_keyring_path: /etc/apt/keyrings/proxmox-release.gpg

# Datastore. Both are required and deliberately have no default: the path is a
# site decision (which pool, which mount), and guessing one would silently put
# backups on the root filesystem.
proxmox_backup_server_datastore_name: ""
proxmox_backup_server_datastore_path: ""

# The package creates this account; the datastore directory must belong to it
# or the daemon cannot write chunks.
proxmox_backup_server_user: backup
proxmox_backup_server_group: backup

# Datastore disk. The datastore gets its own filesystem on a dedicated block
# device, so backups cannot fill the boot disk and take the backup tier down
# together with the guest it runs on.
#
# By-id, never a kernel name: /dev/sdX is assigned in discovery order and moves
# between reboots, and this role writes a filesystem to whatever this points
# at. The role refuses a value that is not a /dev/disk/by-* path, and refuses a
# device already carrying a partition table or another filesystem.
#
# Empty (the default) means the datastore path is already a mount of its own,
# such as a host dataset bind-mounted into an LXC. The role verifies that mount
# and never formats anything. Set a by-id path only for a guest that has a
# dedicated datastore disk, which the role then formats and mounts.
proxmox_backup_server_datastore_device: ""
proxmox_backup_server_datastore_fstype: ext4

# PBS calendar events use the server timezone and do not accept a UTC suffix.
# The role sets it before declaring any jobs.
proxmox_backup_server_timezone: Etc/UTC

# PBS housekeeping jobs for the configured datastore.
proxmox_backup_server_prune_job_id: pve-backups-prune
proxmox_backup_server_prune_schedule: "06:55"
proxmox_backup_server_prune_keep_daily: 7
proxmox_backup_server_prune_keep_weekly: 4
proxmox_backup_server_prune_keep_monthly: 6
proxmox_backup_server_gc_schedule: "sat 08:23"
proxmox_backup_server_verify_job_id: pve-backups-verify
proxmox_backup_server_verify_schedule: "sun 08:29"
proxmox_backup_server_verify_ignore_verified: true
proxmox_backup_server_verify_outdated_after: 30

# PVE backup identity publication is opt-in. The token's secret is only
# returned once, so publication must be enabled before creating that token.
proxmox_backup_server_publish_openbao: false
proxmox_backup_server_openbao_mount: secret
proxmox_backup_server_openbao_path: platform/pbs/pve-nodes
proxmox_backup_server_backup_user_id: pve-backup@pbs
proxmox_backup_server_backup_token_name: pve

# The status file is shipped by the estate log pipeline.
proxmox_backup_server_status_directory: /var/log/data-protection
proxmox_backup_server_status_randomized_delay_sec: 10min
proxmox_backup_server_snapshot_max_age_hours: 26

# How long to wait for `datastore create` to finish building the chunk store.
#
# Creation lays out 65536 chunk directories, and the `datastore list` read is
# only meaningful once that worker has finished. How long that takes is a
# property of the backing storage, not of the software: near-instant on NVMe,
# minutes on a large parity pool of spinning disks. The former budget of 60s
# (12 x 5s) was sized for the fast case and turns a slow-but-healthy pool into
# a converge failure — with the chunk store then half-built.
#
# Overridable so a site on slow storage can raise it without patching the role.
proxmox_backup_server_datastore_create_retries: 90
proxmox_backup_server_datastore_create_delay: 10
