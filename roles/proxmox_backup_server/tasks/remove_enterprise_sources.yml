---
# The package ships the enterprise repository enabled; without a subscription
# the vendor host answers with an error and every `apt update` fails. Debian
# releases name the file differently (.list or deb822 .sources), so match on
# the vendor host instead of a file name.
- name: Find the vendor enterprise repository sources
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*.list"
      - "*.sources"
    contains: 'enterprise\.proxmox\.com'
  register: proxmox_backup_server_enterprise_sources

- name: Remove the vendor enterprise repository sources
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ proxmox_backup_server_enterprise_sources.files }}"
  loop_control:
    label: "{{ item.path }}"
