---
# proxmox_backup_server — install Proxmox Backup Server on a plain Debian guest
# from the community `pbs-no-subscription` component, and declare one datastore
# on a caller-supplied path.

- name: Gather OS facts
  ansible.builtin.setup:
    filter:
      - ansible_distribution*
      - ansible_architecture

- name: Assert the datastore is declared
  ansible.builtin.assert:
    that:
      - proxmox_backup_server_datastore_name | length > 0
      - proxmox_backup_server_datastore_name is match('^[A-Za-z0-9_.-]+$')
      - proxmox_backup_server_datastore_path | length > 0
      - proxmox_backup_server_datastore_path is match('/')
    fail_msg: >-
      proxmox_backup_server_datastore_name and
      proxmox_backup_server_datastore_path (absolute) are both required.

# The vendor ships amd64 only. Failing here beats a mystery "package not
# found" from apt three tasks later.
- name: Assert the host architecture is one the vendor publishes
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      Proxmox Backup Server is published for amd64 only; this host is
      {{ ansible_facts['architecture'] }}.

- name: Set the PBS server timezone
  community.general.timezone:
    name: "{{ proxmox_backup_server_timezone }}"

# A VM can use a dedicated disk; an LXC can use a pre-mounted host dataset.
# Both paths are verified before package work, and only the VM path formats.
- name: Prepare a dedicated datastore disk
  ansible.builtin.include_tasks: datastore_disk.yml
  when: proxmox_backup_server_datastore_device | default('') | length > 0

- name: Verify the pre-mounted datastore
  ansible.builtin.include_tasks: datastore_mount.yml
  when: proxmox_backup_server_datastore_device | default('') | length == 0

# Remove the enterprise source before the first apt refresh; package install may recreate it.
- name: Remove the enterprise repository before the first apt refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pbs-enterprise.list
    state: absent

- name: Refresh the apt package cache
  ansible.builtin.command:
    argv:
      - apt-get
      - update
  register: proxmox_backup_server_apt_update
  retries: 3
  delay: 5
  until: proxmox_backup_server_apt_update.rc == 0
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Fail when the apt package cache refresh fails
  ansible.builtin.fail:
    msg: >-
      apt-get update failed with return code
      {{ proxmox_backup_server_apt_update.rc }}. Last 20 lines of combined
      stderr and stdout:
      {{
        (
          (proxmox_backup_server_apt_update.stderr | default(''))
          ~ '\n'
          ~ (proxmox_backup_server_apt_update.stdout | default(''))
        ).splitlines()[-20:] | join('\n')
      }}
  when:
    - not ansible_check_mode
    - proxmox_backup_server_apt_update.rc != 0

- name: Install apt transport prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: false

- name: Create keyrings directory
  ansible.builtin.file:
    path: "{{ proxmox_backup_server_keyring_path | dirname }}"
    state: directory
    mode: "0755"

- name: Add the Proxmox release key
  ansible.builtin.get_url:
    url: "{{ proxmox_backup_server_release_key_url }}"
    dest: "{{ proxmox_backup_server_keyring_path }}"
    mode: "0644"

- name: Add the Proxmox Backup Server no-subscription repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ proxmox_backup_server_keyring_path }}]
      {{ proxmox_backup_server_repo_url }}
      {{ proxmox_backup_server_repo_suite }}
      {{ proxmox_backup_server_repo_component }}
    state: present
    filename: proxmox-backup-server

# Under --check a first install only previews, so the service steps below skip.
- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
    update_cache: true
  register: proxmox_backup_server_package_install

# The package ships /etc/apt/sources.list.d/pbs-enterprise.list ENABLED as one
# of its own conffiles. Without a subscription that repository answers 401, and
# every subsequent `apt update` on the host fails outright — including the next
# converge. Removing it is part of installing the community build, not an
# optional tidy-up.
- name: Remove the vendor-shipped enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pbs-enterprise.list
    state: absent

# Wrapped in block/rescue purely for diagnosability: a failed control
# process gives Ansible/systemd's own error, never the journal line that
# says why. On failure, dump each service's journal before re-raising so CI
# logs carry the real cause instead of just "exited with error code".
- name: Start and enable the Proxmox Backup Server services
  block:
    - name: Start and enable the Proxmox Backup Server services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - proxmox-backup.service
        - proxmox-backup-proxy.service
      when: not (ansible_check_mode and proxmox_backup_server_package_install is changed)
  rescue:
    - name: Dump the failed service's journal
      ansible.builtin.command: journalctl -xeu {{ item }} --no-pager -n 200
      loop:
        - proxmox-backup.service
        - proxmox-backup-proxy.service
      changed_when: false
      register: proxmox_backup_server_journal

    - name: Show the journal
      ansible.builtin.debug:
        var: proxmox_backup_server_journal.results

    - name: Re-raise the original failure
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('Service start failed; see journal above.') }}"

- name: Create the datastore directory
  ansible.builtin.file:
    path: "{{ proxmox_backup_server_datastore_path }}"
    state: directory
    owner: "{{ proxmox_backup_server_user }}"
    group: "{{ proxmox_backup_server_group }}"
    mode: "0755"

- name: List the configured datastores
  ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
  register: proxmox_backup_server_datastore_list
  check_mode: false
  changed_when: false

# `proxmox-backup-manager datastore create` spawns a worker task and polls it.
# The poll is racy: it can return "task failed (status unknown)" with rc 255
# while the worker's own log records TASK OK and the chunk store is fully
# built (observed here — 65536 chunk directories present, `datastore list`
# showing the store, on a run the CLI called a failure).
#
# So the exit code is not trustworthy either way, and the block below does not
# rely on it: creation is followed by a fresh read of the datastore list and an
# assertion against that. A real failure still fails the play, on ground truth
# rather than on the CLI's opinion.
- name: Declare the datastore
  when: >-
    proxmox_backup_server_datastore_name not in
    (proxmox_backup_server_datastore_list.stdout | from_json
     | map(attribute='name') | list)
  block:
    - name: Create the datastore
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - datastore
          - create
          - "{{ proxmox_backup_server_datastore_name }}"
          - "{{ proxmox_backup_server_datastore_path }}"
      register: proxmox_backup_server_create
      changed_when: true
      failed_when: false

    # The list is briefly stale after the worker task finishes — observed
    # returning [] for a store whose chunk directories were already all
    # present, then showing it moments later. Retry rather than read once;
    # `failed_when: false` keeps the assertion below as the thing that
    # reports the failure, with the command output attached.
    - name: Re-read the datastores after creation
      ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
      register: proxmox_backup_server_datastore_recheck
      check_mode: false
      changed_when: false
      failed_when: false
      when: >-
        not ansible_check_mode or
        proxmox_backup_server_datastore_name in
        (proxmox_backup_server_datastore_list.stdout | from_json
         | map(attribute='name') | list)
      until: >-
        proxmox_backup_server_datastore_name in
        (proxmox_backup_server_datastore_recheck.stdout | default('[]') | from_json
         | map(attribute='name') | list)
      retries: "{{ proxmox_backup_server_datastore_create_retries }}"
      delay: "{{ proxmox_backup_server_datastore_create_delay }}"

    - name: Assert the datastore now exists on the declared path
      ansible.builtin.assert:
        that:
          - proxmox_backup_server_datastore_name in (declared | map(attribute='name') | list)
          - (declared | selectattr('name', 'eq', proxmox_backup_server_datastore_name)
             | map(attribute='path') | first) == proxmox_backup_server_datastore_path
        fail_msg: >-
          Datastore creation failed. Configured datastores: {{ declared }}.
          Command rc={{ proxmox_backup_server_create.rc }},
          stdout={{ proxmox_backup_server_create.stdout }},
          stderr={{ proxmox_backup_server_create.stderr }}.
      vars:
        declared: "{{ proxmox_backup_server_datastore_recheck.stdout | from_json }}"
      when: >-
        not ansible_check_mode or
        proxmox_backup_server_datastore_name in
        (proxmox_backup_server_datastore_list.stdout | from_json
         | map(attribute='name') | list)

- name: Assert an existing datastore uses the declared path
  ansible.builtin.assert:
    that:
      - (existing | map(attribute='path') | first) == proxmox_backup_server_datastore_path
    fail_msg: >-
      Existing datastore {{ proxmox_backup_server_datastore_name }} uses
      {{ existing | map(attribute='path') | first }}, not
      {{ proxmox_backup_server_datastore_path }}.
  vars:
    existing: >-
      {{ proxmox_backup_server_datastore_list.stdout | from_json
         | selectattr('name', 'equalto', proxmox_backup_server_datastore_name)
         | list }}
  when: >-
    proxmox_backup_server_datastore_name in
    (proxmox_backup_server_datastore_list.stdout | from_json
     | map(attribute='name') | list)

- name: Reconcile PBS prune, verify, and garbage-collection jobs
  ansible.builtin.include_tasks: maintenance_jobs.yml

- name: Configure the PVE backup identity and publish it to OpenBao
  ansible.builtin.include_tasks: backup_identity.yml
  when:
    - proxmox_backup_server_publish_openbao | bool
    - not ansible_check_mode

- name: Install the PBS data-protection status service
  ansible.builtin.include_tasks: status_file.yml
