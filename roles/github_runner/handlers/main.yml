---
# A runner mid-job is stopped gracefully by the unit's ExecStop, which gives
# `docker stop` github_runner_stop_timeout seconds. Restarting the whole pool at
# once is acceptable here: every runner is ephemeral, so a job it was serving is
# re-queued to another rather than lost, and the pool is small enough that a
# rolling restart would add moving parts for no benefit.
- name: Restart github runners
  ansible.builtin.systemd:
    name: "github-runner@{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ range(1, github_runner_replicas | int + 1) | list }}"

# Restarted rather than reloaded: `bao agent` re-reads its config and re-runs
# auto_auth only on start. A stale agent holds a session for a secret_id that
# may already have been replaced by this converge.
- name: Restart the runner token agent
  ansible.builtin.systemd:
    name: openbao-github-runner-agent.service
    state: restarted
    daemon_reload: true
