---
github_runner_image_name: "github-runner"
github_runner_work_dir: "/opt/github-runner"

# github_runner_image_tag is NOT set here — tasks/main.yml derives it from a
# hash of the build context. A fixed tag is what let a host serve jobs from an
# image built out of a different Dockerfile: the tag never changed, so compose
# saw no config change and never recreated the containers. Pass it as an extra
# var only to pin a known-good build during an incident.

# ---------------------------------------------------------------------------
# One org-level pool. Set these per host group (see docker_vms.yml), not here.
# ---------------------------------------------------------------------------
github_runner_org: ""
github_runner_group: ""
github_runner_replicas: 1
github_runner_labels: "self-hosted,Linux,X64,proxmox"
github_runner_name_prefix: "proxmox-runner"
# Ceilings on the runner container itself. They do NOT bound the test
# containers it starts through docker.sock — those are siblings on the shared
# daemon. What bounds those is github_runner_replicas.
github_runner_cpu_limit: "1.0"
github_runner_memory_limit: "2g"

# OpenBao secret-zero for the github-runner AppRole. The container exchanges
# these for a short-lived token, mints a GitHub App installation token limited
# to organization_self_hosted_runners:write, and asks GitHub for a
# registration token — at every start, because registration tokens expire in
# an hour and these containers restart.
#
# This replaced a long-lived fine-grained PAT held in the container env. The
# AppRole is revocable, audited, and cannot read repository content; the PAT
# was none of those. Do not reintroduce a PAT path as a fallback — a fallback
# that works is the credential everyone ends up on.
github_runner_bao_addr: "{{ lookup('env', 'BAO_ADDR') | default(lookup('env', 'VAULT_ADDR'), true) }}"
github_runner_bao_role_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_GITHUB_RUNNER_ROLE_ID') | default('', true) }}
github_runner_bao_secret_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_GITHUB_RUNNER_SECRET_ID') | default('', true) }}
github_runner_bao_permission_set: "runner-register-dryvist"
github_runner_bao_github_mount: "github"

# SOPS age private key (raw key content, not path).
# Passed into runner containers so E2E tests can decrypt secrets.enc.yaml.
github_runner_sops_age_key: "{{ lookup('env', 'SOPS_AGE_KEY') | default(omit, true) }}"
