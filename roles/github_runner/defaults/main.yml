---
github_runner_image: "myoung34/github-runner:ubuntu-noble"
github_runner_work_dir: "/opt/github-runner"

# ---------------------------------------------------------------------------
# One org-level pool. Set these per host group (see docker_vms.yml), not here.
# ---------------------------------------------------------------------------
github_runner_org: ""
github_runner_group: ""
github_runner_replicas: 1
github_runner_labels: "self-hosted,Linux,X64,proxmox"
github_runner_name_prefix: "proxmox-runner"

# Docker container name prefix; the systemd instance number is appended.
# Distinct from github_runner_name_prefix, which names the runner to GitHub.
github_runner_container_prefix: "github-runner"
github_runner_network: ci_runners
github_runner_env_file: /etc/github-runner/runner.env
# Seconds given to `docker stop` before SIGKILL. A runner mid-job needs long
# enough to finish or abandon it cleanly; the unit's TimeoutStopSec adds 30s
# on top so systemd never kills the stop itself.
github_runner_stop_timeout: 120
# Ceilings on the runner container itself. They do NOT bound the test
# containers it starts through docker.sock — those are siblings on the shared
# daemon. What bounds those is github_runner_replicas.
github_runner_cpu_limit: "1.0"
github_runner_memory_limit: "2g"

# ---------------------------------------------------------------------------
# Docker data disk (see tasks/data_disk.yml).
#
# No default value: this must be the stable /dev/disk/by-id path of THIS
# guest's data disk, and a wrong guess is a mkfs against the wrong device.
# Declared per host group in the inventory. Left empty here so a guest that
# has not been given one fails loudly at converge rather than silently letting
# the image cache fill its boot disk.
# ---------------------------------------------------------------------------
github_runner_data_device: ""
github_runner_data_fstype: ext4

# Every directory Docker writes bulk data into. The converge-time guard asserts
# each one is off the boot disk.
#
# /var/lib/containerd is here because Docker's default snapshotter is the
# containerd one, and it stores image layers and container writable layers
# there rather than under Docker's own root. A guard that checked only
# /var/lib/docker passed while the boot disk filled — the mount it verified was
# real, it just was not where the bytes were going.
github_runner_data_paths:
  - /var/lib/docker
  - /var/lib/containerd

github_runner_access_token: "{{ lookup('env', 'GH_PAT_RUNNER_TOKEN') | default('', true) }}"

# SOPS age private key (raw key content, not path).
# Passed into runner containers so E2E tests can decrypt secrets.enc.yaml.
github_runner_sops_age_key: "{{ lookup('env', 'SOPS_AGE_KEY') | default(omit, true) }}"
