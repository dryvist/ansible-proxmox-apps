---
galaxy_info:
  author: JacobPEvans
  description: Ephemeral org-level GitHub Actions runners on a Docker host
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - github
    - actions
    - runner
    - docker
    - ci

dependencies:
  # The role drives `docker run` and migrates /var/lib/docker onto a data disk,
  # so Docker is a hard requirement -- but it was never declared. On the
  # original CI guest the daemon happened to be present because
  # cribl_docker_stack pulls docker_engine in and both roles target the same
  # group, so the dependency was satisfied by coincidence of ordering rather
  # than by declaration.
  #
  # A second CI guest made the omission visible: it was provisioned, added to
  # the inventory and given its own replica count, and the runner role then
  # failed on it with "Could not find the requested service docker.service".
  # That message names systemd, not the missing dependency, so the guest read
  # as broken rather than as unconfigured -- and because the play isolates its
  # own failure, the run recap stayed green while the host ran no runners at
  # all.
  #
  # Same options as the other CI-host consumer: the runner containers are
  # siblings on this daemon, so the storage driver and daemon.json belong to
  # the host, not to this role. No venv -- this role uses community.docker's
  # modules against the system interpreter and adds no SDK-based tasks.
  - role: docker_engine
    docker_engine_install_fuse_overlayfs: false
