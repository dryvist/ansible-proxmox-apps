---
- name: Create the runner seccomp profile directory
  ansible.builtin.file:
    path: "{{ github_runner_container_seccomp_profile_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "{{ github_runner_container_seccomp_profile_directory_mode }}"

- name: Read the installed Docker Engine server version
  ansible.builtin.command:
    argv:
      - docker
      - version
      - --format
      - "{{ '{{' }}.Server.Version{{ '}}' }}"
  register: github_runner_container_docker_server_version
  changed_when: false

- name: Require a versioned Docker Engine release
  ansible.builtin.assert:
    that:
      - github_runner_container_docker_server_version.stdout | trim is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: Docker Engine did not report a Moby release version.

- name: Fetch the Docker Engine default seccomp profile
  ansible.builtin.get_url:
    url: >-
      {{ github_runner_container_seccomp_default_profile
         | format(github_runner_container_docker_server_version.stdout | trim) }}
    dest: "{{ github_runner_container_seccomp_profile_path }}.upstream"
    owner: root
    group: root
    mode: "{{ github_runner_container_seccomp_profile_file_mode }}"

- name: Read the fetched Docker Engine seccomp profile
  ansible.builtin.slurp:
    src: "{{ github_runner_container_seccomp_profile_path }}.upstream"
  register: github_runner_container_seccomp_profile_source

- name: Parse the fetched Docker Engine seccomp profile
  ansible.builtin.set_fact:
    github_runner_container_seccomp_default_profile_data: >-
      {{ github_runner_container_seccomp_profile_source.content | b64decode | from_json }}

- name: Require a valid Docker Engine seccomp policy
  ansible.builtin.assert:
    that:
      - github_runner_container_seccomp_default_profile_data is mapping
      - github_runner_container_seccomp_default_profile_data.defaultAction is defined
      - github_runner_container_seccomp_default_profile_data.syscalls is sequence
      - github_runner_container_seccomp_default_profile_data.syscalls | length > 0
    fail_msg: The fetched Docker Engine seccomp profile is invalid.

- name: Deploy the runner seccomp profile
  ansible.builtin.template:
    src: github-runner-seccomp.json.j2
    dest: "{{ github_runner_container_seccomp_profile_path }}"
    owner: root
    group: root
    mode: "{{ github_runner_container_seccomp_profile_file_mode }}"
  notify: Restart github runners
