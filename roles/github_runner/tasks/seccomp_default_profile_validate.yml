---
- name: Parse the Docker Engine default seccomp profile
  ansible.builtin.set_fact:
    github_runner_container_seccomp_default_profile_data: >-
      {{ github_runner_container_seccomp_default_profile_content
         if github_runner_container_seccomp_default_profile_content is mapping
         else github_runner_container_seccomp_default_profile_content | from_json }}

- name: Require a valid deny-by-default seccomp policy
  ansible.builtin.assert:
    that:
      - github_runner_container_seccomp_default_profile_data is mapping
      - github_runner_container_seccomp_default_profile_data.defaultAction is defined
      - >-
        github_runner_container_seccomp_default_profile_data.defaultAction
        != github_runner_container_seccomp_allow_action
      - github_runner_container_seccomp_default_profile_data.syscalls is defined
      - github_runner_container_seccomp_default_profile_data.syscalls is sequence
      - github_runner_container_seccomp_default_profile_data.syscalls is not string
      - github_runner_container_seccomp_default_profile_data.syscalls | length > 0
    fail_msg: The Docker Engine default seccomp profile is invalid.
