---
- name: Validate the native organization runner pool
  ansible.builtin.assert:
    that:
      - github_runner_org | length > 0
      - github_runner_group | length > 0
      - github_runner_replicas | int > 0
      - github_runner_openbao_role_id | length > 0
      - github_runner_openbao_secret_id | length > 0
    fail_msg: >-
      The runner pool needs an organization, runner group, positive replica
      count, and the github-runner AppRole secret-zero
      (OPENBAO_APPROLE_GITHUB_RUNNER_ROLE_ID / _SECRET_ID) in the converge
      environment.

# Runs before anything touches Docker: the migration stops and restarts the
# daemon, and the converge-time assertion must fail before runners are started
# onto a boot disk that is about to fill.
- name: Place /var/lib/docker on the dedicated data disk
  ansible.builtin.include_tasks: data_disk.yml

- name: Check for a legacy compose-managed fleet
  ansible.builtin.stat:
    path: "{{ github_runner_work_dir }}/docker-compose.yml"
  register: github_runner_compose_stat

- name: Create GitHub runner work directory
  ansible.builtin.file:
    path: "{{ github_runner_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look up the host docker group GID
  ansible.builtin.getent:
    database: group
    key: docker

- name: Set docker GID fact
  ansible.builtin.set_fact:
    github_runner_docker_gid: "{{ getent_group.docker[1] }}"

- name: Stat the Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: github_runner_docker_sock

- name: Validate runner Docker socket access
  ansible.builtin.assert:
    that:
      - github_runner_docker_sock.stat.exists
      - github_runner_docker_sock.stat.gid | int == github_runner_docker_gid | int

# ---------------------------------------------------------------------------
# The compose project this replaced. Left running it would be a second fleet
# racing the systemd one for the same runner group, and its containers are
# exactly the ones whose writable layers filled the boot disk.
# ---------------------------------------------------------------------------
- name: Retire the compose-managed runner fleet
  community.docker.docker_compose_v2:
    project_src: "{{ github_runner_work_dir }}"
    project_name: github-runner
    state: absent
    remove_orphans: true
  when: github_runner_legacy_compose.stat.exists
  vars:
    github_runner_legacy_compose: "{{ github_runner_compose_stat }}"

- name: Remove the retired compose file
  ansible.builtin.file:
    path: "{{ github_runner_work_dir }}/docker-compose.yml"
    state: absent

# compose created this network as part of the project. Nothing does now.
- name: Ensure the runner network exists
  community.docker.docker_network:
    name: "{{ github_runner_network }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.enable_ip_masquerade: "true"

- name: Create the runner environment directory
  ansible.builtin.file:
    path: "{{ github_runner_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ---------------------------------------------------------------------------
# Registration credential. Ansible delivers the AppRole secret-zero and the
# agent that spends it; it never renders a GitHub token itself, because a
# GitHub App installation token outlives its usefulness in about an hour and
# converges are days apart.
# ---------------------------------------------------------------------------
- name: Install the OpenBao client (bao agent mints the registration token)
  ansible.builtin.apt:
    deb: "{{ github_runner_openbao_deb_url }}"
    state: present

- name: Create the AppRole credential directory
  ansible.builtin.file:
    path: "{{ github_runner_approle_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Two bare-value files, not KEY=VALUE: role_id_file_path/secret_id_file_path
# read the whole file as the value, so an env-file shape would authenticate as
# the literal string "OPENBAO_APPROLE_...=..." and fail.
- name: Deploy the AppRole secret-zero
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ github_runner_approle_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: role_id
      value: "{{ github_runner_openbao_role_id }}"
    - name: secret_id
      value: "{{ github_runner_openbao_secret_id }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart the runner token agent

- name: Deploy the OpenBao Agent configuration
  ansible.builtin.template:
    src: openbao-agent.hcl.j2
    dest: "{{ github_runner_agent_config }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart the runner token agent

- name: Deploy the OpenBao Agent systemd unit
  ansible.builtin.template:
    src: openbao-github-runner-agent.service.j2
    dest: /etc/systemd/system/openbao-github-runner-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the runner token agent

- name: Enable and start the runner token agent
  ansible.builtin.systemd:
    name: openbao-github-runner-agent.service
    state: started
    enabled: true
    daemon_reload: true

# Without this, a changed agent config would not take effect until the end of
# the play -- after the runner units had already been started against the old
# one. The wait below would then be checking the wrong agent.
- name: Apply any pending agent restart before the runners depend on it
  ansible.builtin.meta: flush_handlers

# The runner units refuse to start without this file, so a converge that got
# this far but cannot mint should say so here rather than surface as N failed
# runner units with an opaque docker error.
- name: Wait for the agent to render a registration token
  ansible.builtin.wait_for:
    path: "{{ github_runner_token_env_file }}"
    search_regex: "ACCESS_TOKEN=."
    timeout: 60

- name: Deploy the runner environment file
  ansible.builtin.template:
    src: runner.env.j2
    dest: "{{ github_runner_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart github runners

- name: Deploy the runner systemd unit
  ansible.builtin.template:
    src: github-runner@.service.j2
    dest: /etc/systemd/system/github-runner@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart github runners

- name: Pull the runner image
  community.docker.docker_image:
    name: "{{ github_runner_image }}"
    source: pull
    force_source: true

- name: Name the units this replica count wants
  ansible.builtin.set_fact:
    github_runner_wanted_units: >-
      {{ range(1, github_runner_replicas | int + 1)
         | map('regex_replace', '^', 'github-runner@')
         | map('regex_replace', '$', '.service') | list }}

- name: Enable and start the pooled runners
  ansible.builtin.systemd:
    name: "github-runner@{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ range(1, github_runner_replicas | int + 1) | list }}"

# A replica removed from the pool must be stopped, not merely un-enabled: the
# unit template still exists, so the container would keep serving jobs.
- name: Read the installed services
  ansible.builtin.service_facts:

- name: Stop runners above the configured replica count
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: >-
    {{ ansible_facts.services | select('match', '^github-runner@\\d+\\.service$')
       | difference(github_runner_wanted_units) | list }}

# Re-read after the changes above so the assertion sees current state rather
# than the snapshot taken before the pool was started.
- name: Re-read the installed services
  ansible.builtin.service_facts:

- name: Assert every pooled runner unit is running
  vars:
    # `activating` counts: systemd reports it while `docker run` is pulling the
    # image or the runner is registering, which a converge passes through
    # normally. Anything else -- failed, inactive, absent -- is a real fault.
    _bad: >-
      {{ github_runner_wanted_units
         | reject('in', ansible_facts.services
                        | dict2items
                        | selectattr('value.state', 'in', ['running', 'activating'])
                        | map(attribute='key') | list)
         | list }}
  ansible.builtin.assert:
    that:
      - _bad | length == 0
    fail_msg: >-
      Runner unit(s) not running: {{ _bad | join(', ') }}. Check
      `journalctl -u github-runner@N` on the host; a failed `docker run` here
      means the pool is smaller than {{ github_runner_replicas }} and jobs will
      queue without any other symptom.
