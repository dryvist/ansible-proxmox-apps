---
- name: Validate the native organization runner pool
  ansible.builtin.assert:
    that:
      - github_runner_org | length > 0
      - github_runner_group | length > 0
      # 0 is a supported state — a host being torn down (github_runner_plane_hosts)
      # or never enrolled. The role must still run at 0: that is what stops
      # and deregisters units a previous nonzero converge already started,
      # rather than a skip that leaves them running and registered forever.
      - github_runner_replicas | int >= 0
      # A review-slot count above the pool size, or negative, would either
      # silently label zero slots (harmless) or -- worse -- be read by a
      # future caller as "every slot" once replicas shrinks below it. Fail
      # loudly here instead of at a Jinja range() that just clamps quietly.
      - github_runner_review_slots | int >= 0
      - github_runner_review_slots | int <= github_runner_replicas | int
      - github_runner_openbao_role_id | length > 0
      - github_runner_openbao_secret_id | length > 0
      - github_runner_subdomain | length > 0
    fail_msg: >-
      The runner pool needs an organization, runner group, a replica count
      >= 0, a review-slot count between 0 and the replica count, and the
      github-runner AppRole secret-zero
      (OPENBAO_APPROLE_GITHUB_RUNNER_ROLE_ID / _SECRET_ID) and
      PROXMOX_SUBDOMAIN in the converge environment. An empty PROXMOX_SUBDOMAIN
      is checked here rather than with `mandatory`, which cannot see it: an env
      lookup yields an empty string, not Undefined.

# Runs before anything touches Docker: the migration stops and restarts the
# daemon, and the converge-time assertion must fail before runners are started
# onto a boot disk that is about to fill.
- name: Place /var/lib/docker on the dedicated data disk
  ansible.builtin.include_tasks: data_disk.yml

- name: Check for a legacy compose-managed fleet
  ansible.builtin.stat:
    path: "{{ github_runner_work_dir }}/docker-compose.yml"
  register: github_runner_compose_stat

- name: Create GitHub runner work directory
  ansible.builtin.file:
    path: "{{ github_runner_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look up the host docker group GID
  ansible.builtin.getent:
    database: group
    key: docker

- name: Set docker GID fact
  ansible.builtin.set_fact:
    github_runner_docker_gid: "{{ getent_group.docker[1] }}"

- name: Stat the Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: github_runner_docker_sock

- name: Validate runner Docker socket access
  ansible.builtin.assert:
    that:
      - github_runner_docker_sock.stat.exists
      - github_runner_docker_sock.stat.gid | int == github_runner_docker_gid | int

# ---------------------------------------------------------------------------
# The compose project this replaced. Left running it would be a second fleet
# racing the systemd one for the same runner group, and its containers are
# exactly the ones whose writable layers filled the boot disk.
# ---------------------------------------------------------------------------
- name: Retire the compose-managed runner fleet
  community.docker.docker_compose_v2:
    project_src: "{{ github_runner_work_dir }}"
    project_name: github-runner
    state: absent
    remove_orphans: true
  when: github_runner_legacy_compose.stat.exists
  vars:
    github_runner_legacy_compose: "{{ github_runner_compose_stat }}"

- name: Remove the retired compose file
  ansible.builtin.file:
    path: "{{ github_runner_work_dir }}/docker-compose.yml"
    state: absent

# compose created this network as part of the project. Nothing does now.
- name: Ensure the runner network exists
  community.docker.docker_network:
    name: "{{ github_runner_network }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.enable_ip_masquerade: "true"

- name: Create the runner environment directory
  ansible.builtin.file:
    path: "{{ github_runner_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ---------------------------------------------------------------------------
# Registration credential. Ansible delivers the AppRole secret-zero and the
# agent that spends it; it never renders a GitHub token itself, because a
# GitHub App installation token outlives its usefulness in about an hour and
# converges are days apart.
# ---------------------------------------------------------------------------
- name: Install the OpenBao client (bao agent mints the registration token)
  ansible.builtin.apt:
    deb: "{{ github_runner_openbao_deb_url }}"
    state: present

- name: Create the AppRole credential directory
  ansible.builtin.file:
    path: "{{ github_runner_approle_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Two bare-value files, not KEY=VALUE: role_id_file_path/secret_id_file_path
# read the whole file as the value, so an env-file shape would authenticate as
# the literal string "OPENBAO_APPROLE_...=..." and fail.
- name: Deploy the AppRole secret-zero
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ github_runner_approle_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: role_id
      value: "{{ github_runner_openbao_role_id }}"
    - name: secret_id
      value: "{{ github_runner_openbao_secret_id }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart the runner token agent

- name: Deploy the OpenBao Agent configuration
  ansible.builtin.template:
    src: openbao-agent.hcl.j2
    dest: "{{ github_runner_agent_config }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart the runner token agent

- name: Deploy the OpenBao Agent systemd unit
  ansible.builtin.template:
    src: openbao-github-runner-agent.service.j2
    dest: /etc/systemd/system/openbao-github-runner-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the runner token agent

- name: Enable and start the runner token agent
  ansible.builtin.systemd:
    name: openbao-github-runner-agent.service
    state: started
    enabled: true
    daemon_reload: true

# Without this, a changed agent config would not take effect until the end of
# the play -- after the runner units had already been started against the old
# one. The wait below would then be checking the wrong agent.
- name: Apply any pending agent restart before the runners depend on it
  ansible.builtin.meta: flush_handlers

# The runner units refuse to start without this file, so a converge that got
# this far but cannot mint should say so here rather than surface as N failed
# runner units with an opaque docker error.
- name: Wait for the agent to render a registration token
  ansible.builtin.wait_for:
    path: "{{ github_runner_token_env_file }}"
    search_regex: "ACCESS_TOKEN=."
    timeout: 60

# The inventory this converge resolved, for the e2e suite. Not a secret in the
# sense of a credential, but it is a topology map, so it stays root-only in a
# 0700 directory and reaches the container only through a read-only bind
# mount -- never through the image or the checkout.
- name: Deploy the published inventory for the e2e suite
  ansible.builtin.copy:
    content: "{{ tofu_data | to_nice_json }}\n"
    dest: "{{ github_runner_inventory_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart github runners

# `docker run --env-file` refuses a missing file, and the agent writes this
# one only once it can read the Splunk bucket. An empty placeholder keeps the
# fleet starting either way; the e2e job checks the values and fails on its
# own when they are absent. force: false so a rendered file is never blanked.
- name: Ensure the e2e environment file exists before the agent renders it
  ansible.builtin.copy:
    content: ""
    dest: "{{ github_runner_e2e_env_file }}"
    owner: root
    group: root
    mode: "0600"
    force: false

# One directory per pooled slot, bind-mounted into that slot's container
# below (github-runner@.service.j2) so _diag survives past --rm. Idempotent
# and safe to run every converge, including when replicas shrinks -- a slot
# no longer wanted just stops getting new files; nothing here deletes one.
- name: Create the runner diagnostics directories
  ansible.builtin.file:
    path: "{{ github_runner_diag_host_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ range(1, github_runner_replicas | int + 1) | list }}"

# Every _diag directory grows a new file per job forever without this --
# systemd-tmpfiles-clean.timer (already enabled on every systemd host) reads
# it, so nothing role-specific needs to run or be scheduled.
- name: Deploy the runner diagnostics retention policy
  ansible.builtin.template:
    src: github-runner-diag-tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/github-runner-diag.conf
    owner: root
    group: root
    mode: "0644"

# One file per slot, not one shared file: LABELS must differ for the first
# github_runner_review_slots slots, and the unit is a systemd template where
# %i is expanded by systemd at service-start time -- Jinja never sees it, so
# a single shared render cannot vary by slot. github-runner@.service.j2 reads
# "{{ github_runner_env_file }}-%i" to match.
- name: Deploy the runner environment file
  ansible.builtin.template:
    src: runner.env.j2
    dest: "{{ github_runner_env_file }}-{{ github_runner_slot }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ range(1, github_runner_replicas | int + 1) | list }}"
  loop_control:
    loop_var: github_runner_slot
  no_log: true
  notify: Restart github runners

- name: Deploy the runner systemd unit
  ansible.builtin.template:
    src: github-runner@.service.j2
    dest: /etc/systemd/system/github-runner@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart github runners

- name: Pull the runner image
  community.docker.docker_image:
    name: "{{ github_runner_image }}"
    source: pull
    force_source: true

- name: Name the units this replica count wants
  ansible.builtin.set_fact:
    github_runner_wanted_units: >-
      {{ range(1, github_runner_replicas | int + 1)
         | map('regex_replace', '^', 'github-runner@')
         | map('regex_replace', '$', '.service') | list }}

- name: Enable and start the pooled runners
  ansible.builtin.systemd:
    name: "github-runner@{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ range(1, github_runner_replicas | int + 1) | list }}"

# A replica removed from the pool must be stopped, not merely un-enabled: the
# unit template still exists, so the container would keep serving jobs.
- name: Read the installed services
  ansible.builtin.service_facts:

- name: Stop runners above the configured replica count
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: >-
    {{ ansible_facts.services | select('match', '^github-runner@\\d+\\.service$')
       | difference(github_runner_wanted_units) | list }}

# A changed unit file or env file has notified a pool restart. Apply it BEFORE
# the assertion below: a failed assert ends the play for this host, and
# handlers flush only at the end of a play that reaches it, so a unit still
# running the previous unit file would keep running it on every later converge
# too -- each one failing the same assert, none ever restarting the pool.
- name: Apply any pending runner restart before checking the pool
  ansible.builtin.meta: flush_handlers

# Re-read after the changes above so the assertion sees current state rather
# than the snapshot taken before the pool was started. An ephemeral runner
# leaves `running` for RestartSec after every job it finishes, so a single
# read can catch a healthy unit between jobs; keep reading until every wanted
# unit is up, and only then judge.
- name: Re-read the installed services
  ansible.builtin.service_facts:
  register: github_runner_service_read
  until: >-
    github_runner_wanted_units
    | reject('in', github_runner_service_read.ansible_facts.services
                   | dict2items
                   | selectattr('value.state', 'in', ['running', 'activating'])
                   | map(attribute='key') | list)
    | list | length == 0
  retries: 6
  delay: 10
  failed_when: false

- name: Assert every pooled runner unit is running
  vars:
    # `activating` counts: systemd reports it while `docker run` is pulling the
    # image or the runner is registering, which a converge passes through
    # normally. Anything else -- failed, inactive, absent -- is a real fault.
    _bad: >-
      {{ github_runner_wanted_units
         | reject('in', ansible_facts.services
                        | dict2items
                        | selectattr('value.state', 'in', ['running', 'activating'])
                        | map(attribute='key') | list)
         | list }}
  ansible.builtin.assert:
    that:
      - _bad | length == 0
    fail_msg: >-
      Runner unit(s) not running: {{ _bad | join(', ') }}. Check
      `journalctl -u github-runner@N` on the host; a failed `docker run` here
      means the pool is smaller than {{ github_runner_replicas }} and jobs will
      queue without any other symptom.

# Runs LAST, after every wanted-unit stop above: a unit stop sends the
# container SIGTERM, and the image's own entrypoint deregisters from GitHub
# on that signal using the token this agent renders -- stopping the agent
# first would leave nothing to deregister with. At 0 replicas nothing will
# ever consume a fresh token again, so the agent itself is torn down too,
# rather than left polling OpenBao and minting tokens no container reads.
- name: Stop the runner token agent when no replicas are wanted
  ansible.builtin.systemd:
    name: openbao-github-runner-agent.service
    state: stopped
    enabled: false
  when: github_runner_replicas | int == 0
