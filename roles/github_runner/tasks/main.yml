---
- name: Validate the native organization runner pool
  ansible.builtin.assert:
    that:
      - github_runner_org | length > 0
      - github_runner_group | length > 0
      - github_runner_replicas | int > 0
      - github_runner_access_token | length > 0
    fail_msg: >-
      The runner pool needs an organization, runner group, positive replica
      count, and GH_PAT_RUNNER_TOKEN in the converge environment.

# Runs before anything touches Docker: the migration stops and restarts the
# daemon, and the converge-time assertion must fail before runners are started
# onto a boot disk that is about to fill.
- name: Place /var/lib/docker on the dedicated data disk
  ansible.builtin.include_tasks: data_disk.yml

- name: Create GitHub runner work directory
  ansible.builtin.file:
    path: "{{ github_runner_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Look up the host docker group GID
  ansible.builtin.getent:
    database: group
    key: docker

- name: Set docker GID fact
  ansible.builtin.set_fact:
    github_runner_docker_gid: "{{ getent_group.docker[1] }}"

- name: Stat the Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: github_runner_docker_sock

- name: Validate runner Docker socket access
  ansible.builtin.assert:
    that:
      - github_runner_docker_sock.stat.exists
      - github_runner_docker_sock.stat.gid | int == github_runner_docker_gid | int

- name: Deploy native runner compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ github_runner_work_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Pull and converge native GitHub Actions runners
  community.docker.docker_compose_v2:
    project_src: "{{ github_runner_work_dir }}"
    project_name: github-runner
    state: present
    pull: always
    remove_orphans: true

- name: Verify exactly the pooled runner replicas are running
  ansible.builtin.command:
    # --all keeps the count stable across the ephemeral lifecycle: each
    # replica briefly reports exited between finishing one job and its next
    # registration, and the default listing would drop it mid-cycle.
    cmd: docker compose -p github-runner ps --all --format json
    chdir: "{{ github_runner_work_dir }}"
  register: github_runner_ps
  changed_when: false

- name: Assert runner replica count
  vars:
    _runner_count: "{{ github_runner_ps.stdout_lines | map('from_json') | list | length }}"
  ansible.builtin.assert:
    that:
      - _runner_count | int == github_runner_replicas | int
