---
# Retires the former per-host Molecule image build units, if present. An
# enabled timer left in place would keep firing a build nothing consumes.
# Stat-gated rather than firing `systemd: state=stopped/enabled=false`
# unconditionally: disabling a unit whose file does not exist fails loudly
# on real systemd, which would turn "nothing to retire" into a converge
# failure on a host that never had it.

- name: Check whether the old Molecule image build timer unit is present
  ansible.builtin.stat:
    path: /etc/systemd/system/github-runner-molecule-image.timer
  register: github_runner_old_molecule_image_timer_unit

- name: Stop and disable the old Molecule image build timer
  ansible.builtin.systemd:
    name: github-runner-molecule-image.timer
    state: stopped
    enabled: false
  when: github_runner_old_molecule_image_timer_unit.stat.exists

- name: Stop and disable the old Molecule image build service
  ansible.builtin.systemd:
    name: github-runner-molecule-image.service
    state: stopped
    enabled: false
  when: github_runner_old_molecule_image_timer_unit.stat.exists

- name: Remove the old Molecule image build unit files and Dockerfile context
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/github-runner-molecule-image.timer
    - /etc/systemd/system/github-runner-molecule-image.service
    - /etc/github-runner/molecule-image
  register: github_runner_retired_old_molecule_image_files

- name: Reload systemd after removing the old Molecule image build units
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - github_runner_old_molecule_image_timer_unit.stat.exists
    - github_runner_retired_old_molecule_image_files.results | selectattr('changed') | list | length > 0
