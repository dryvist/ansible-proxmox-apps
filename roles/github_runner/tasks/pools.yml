---
# Validates github_runner_review_orgs and github_runner_extra_orgs and selects
# the pools this host runs. Every pool of either kind flows through the same
# deploy and reconcile machinery; the kinds differ only in their per-kind
# defaults (replicas, runner group, resolved in deploy_pool.yml) and in the
# labels and host mounts a slot registers with (runner.env.j2):
#
#   review  — the AI-review lane: no Docker socket, no self-hosted label,
#             `review` in place of the pooled label.
#   general — another organization's general runners: the main pool's labels
#             and host mounts, registered into that org's runner group.
- name: Validate each optional review runner pool
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.org is defined
      - item.org is string
      - item.org is match('^[A-Za-z0-9-]+$')
      - (item.replicas | default(2)) is integer
      - (item.replicas | default(2) | int) >= 1
      - (item.group | default('pr-agent')) is string
      - (item.group | default('pr-agent')) | length > 0
      - (item.cpu_limit | default('1.0')) is match('^[0-9]+(\.[0-9]+)?$')
      - (item.memory_limit | default('4g')) is match('(?i)^[0-9]+[kmg]?b?$')
      - (item.labels | default('')) is string
      - "'proxmox' not in (item.labels | default('')).split(',')"
    fail_msg: >-
      Each github_runner_review_orgs entry needs an org matching
      ^[A-Za-z0-9-]+$ and an integer replicas value >= 1; replicas defaults
      to 2 and group defaults to pr-agent. The optional per-pool overrides
      need cpu_limit as a docker --cpus number, memory_limit as a docker
      size such as 4g, and labels as a comma-separated string that never
      contains proxmox.
  loop: "{{ github_runner_review_orgs }}"
  loop_control:
    label: "{{ item.org | default('(invalid entry)') }}"

- name: Validate each optional general extra-org runner pool
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.org is defined
      - item.org is string
      - item.org is match('^[A-Za-z0-9-]+$')
      - (item.replicas | default(1)) is integer
      - (item.replicas | default(1) | int) >= 1
      - (item.group | default('Default')) is string
      - (item.group | default('Default')) | length > 0
      - (item.cpu_limit | default('1.0')) is match('^[0-9]+(\.[0-9]+)?$')
      - (item.memory_limit | default('4g')) is match('(?i)^[0-9]+[kmg]?b?$')
      - (item.labels | default('')) is string
    fail_msg: >-
      Each github_runner_extra_orgs entry needs an org matching
      ^[A-Za-z0-9-]+$ and an integer replicas value >= 1; replicas defaults
      to 1 and group defaults to Default. The optional per-pool overrides
      need cpu_limit as a docker --cpus number, memory_limit as a docker
      size such as 4g, and labels as a comma-separated string.
  loop: "{{ github_runner_extra_orgs }}"
  loop_control:
    label: "{{ item.org | default('(invalid entry)') }}"

# One organization per pool across BOTH kinds, and none of them the native
# organization: two pools for one org would render two unit templates, two
# token files and two container prefixes racing for the same registrations.
- name: Keep every pool organization distinct from the native runner organization
  ansible.builtin.assert:
    that:
      - >-
        ((github_runner_review_orgs | map(attribute='org') | list)
        + (github_runner_extra_orgs | map(attribute='org') | list))
        | unique | list | length
        == (github_runner_review_orgs | length) + (github_runner_extra_orgs | length)
      - github_runner_org not in (github_runner_review_orgs | map(attribute='org') | list)
      - github_runner_org not in (github_runner_extra_orgs | map(attribute='org') | list)
    fail_msg: >-
      github_runner_review_orgs and github_runner_extra_orgs must contain
      unique organizations distinct from github_runner_org.

# The execution-plane exclusion is expressed by the existing replicas: 0
# override. Do not start per-org pools there, even if the same group inventory
# supplies non-empty pool lists to other runner hosts. Each entry keeps its
# caller's keys and gains its `kind`, which selects the per-kind defaults in
# deploy_pool.yml and reconcile_pool_units.yml and the slot labels and mounts
# in runner.env.j2 / runner-mounts.env.j2.
- name: Select the pools only on runner hosts
  ansible.builtin.set_fact:
    github_runner_active_pools: >-
      {{ ((github_runner_review_orgs | map('combine', {'kind': 'review'}) | list)
          + (github_runner_extra_orgs | map('combine', {'kind': 'general'}) | list))
         if (github_runner_replicas | int > 0) else [] }}

# Review slots must never carry the heavy-pool label: the lane exists to keep
# jobs pinning the pooled label off them. A general extra-org slot carries
# the pooled label on purpose -- it is a general runner -- so this guard
# stays scoped to hosts that run review pools.
- name: Keep the heavy-pool label off review runner hosts
  ansible.builtin.assert:
    that:
      - "'proxmox' not in github_runner_labels_common.split(',')"
    fail_msg: >-
      Review runners inherit github_runner_labels_common and must never carry
      the proxmox label.
  when: >-
    github_runner_active_pools | selectattr('kind', 'equalto', 'review')
    | list | length > 0
