---
# Mirrors reconcile_review_runner_units.yml for the optional heavy pool, and
# like it runs on EVERY converge, enabled or not: flipping
# github_runner_heavy_pool_enabled off must stop and deregister the units a
# previous converge started, not leave them running and registered forever.
# Unlike the review pools there is one fixed unit template name, so the
# wanted lists collapse to empty when the flag is off.
- name: Name the heavy runner units and template this pool wants
  ansible.builtin.set_fact:
    github_runner_heavy_wanted_units: >-
      {{ (range(1, github_runner_heavy_pool_replicas | int + 1)
         | map('regex_replace', '^', 'github-runner-heavy@')
         | map('regex_replace', '$', '.service') | list)
         if github_runner_heavy_pool_enabled | bool else [] }}
    github_runner_heavy_wanted_templates: >-
      {{ ['/etc/systemd/system/github-runner-heavy@.service']
         if github_runner_heavy_pool_enabled | bool else [] }}

- name: Check for the heavy runner systemd unit template
  ansible.builtin.stat:
    path: /etc/systemd/system/github-runner-heavy@.service
  register: github_runner_heavy_unit_file
  when: ansible_check_mode and (github_runner_heavy_pool_enabled | bool)

# `list-units` resolves the instance glob against the running units directly,
# for the same reason reconcile_runner_units.yml gives in full: a systemd
# TEMPLATE shows up in list-unit-files under its bare generic name, so
# service_facts never carries the instantiated units this stop loop needs.
- name: List every heavy runner instance systemd currently knows about  # noqa command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl list-units --all --plain --no-legend "github-runner-heavy@*.service"
  changed_when: false
  register: github_runner_installed_heavy_units

- name: Stop heavy runners removed from the configured pool
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: >-
    {{ github_runner_installed_heavy_units.stdout_lines | map('trim')
       | map('regex_replace', ' .*$', '')
       | difference(github_runner_heavy_wanted_units) | list }}

- name: Find deployed heavy runner unit templates
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "github-runner-heavy*@.service"
    file_type: file
  register: github_runner_heavy_unit_files

- name: Name heavy runner unit templates no longer configured
  ansible.builtin.set_fact:
    github_runner_stale_heavy_unit_files: >-
      {{ github_runner_heavy_unit_files.files | map(attribute='path') | list
         | difference(github_runner_heavy_wanted_templates) }}

- name: Remove heavy runner unit templates no longer configured
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ github_runner_stale_heavy_unit_files }}"

- name: Reload systemd after removing heavy runner unit templates
  ansible.builtin.systemd:
    daemon_reload: true
  when: github_runner_stale_heavy_unit_files | length > 0

- name: Enable and start the configured heavy runners
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ github_runner_heavy_wanted_units }}"
  when: >-
    not ansible_check_mode or
    (github_runner_heavy_unit_file.stat.exists | default(false))

- name: Include heavy units in the runner health check
  ansible.builtin.set_fact:
    github_runner_all_wanted_units: >-
      {{ github_runner_all_wanted_units + github_runner_heavy_wanted_units }}
