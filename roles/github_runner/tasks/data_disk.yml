---
# =============================================================================
# Dedicated Docker data disk
# =============================================================================
# The CI guests carry a second block device for /var/lib/docker. Without it the
# image and build cache share the boot filesystem and fill it, and every job on
# the host then fails with ENOSPC regardless of what it was testing.
#
# The device is addressed by its /dev/disk/by-id path. Kernel names (/dev/sdb)
# are assigned in discovery order and are not stable across reboots — a mkfs
# against the wrong one destroys the boot disk.
#
# The filesystem is written to the whole device, with no partition table. A
# single-purpose data disk gains nothing from one, and it makes "does this
# device already carry something" a single blkid question instead of a
# partition-table-plus-partition walk.

- name: Validate the Docker data device is declared
  ansible.builtin.assert:
    that:
      - github_runner_data_device is defined
      - github_runner_data_device | length > 0
      - github_runner_data_device is match('^/dev/disk/by-(id|uuid|path)/')
    fail_msg: >-
      github_runner_data_device must name this guest's Docker data disk by a
      stable /dev/disk/by-id (or by-uuid, by-path) path. Kernel names are not
      stable across reboots.

- name: Resolve the Docker data device
  ansible.builtin.stat:
    path: "{{ github_runner_data_device }}"
    follow: true
  register: github_runner_data_dev

- name: Assert the Docker data device is present
  ansible.builtin.assert:
    that:
      - github_runner_data_dev.stat.exists
      - github_runner_data_dev.stat.isblk
    fail_msg: >-
      {{ github_runner_data_device }} does not resolve to a block device on
      this host. Attach the data disk to the guest before converging; nothing
      here formats a device it cannot identify.

- name: Read existing signatures on the Docker data device
  ansible.builtin.command:
    cmd: "blkid -p -o export {{ github_runner_data_device }}"
  register: github_runner_data_blkid
  changed_when: false
  # blkid exits 2 when it finds no signature at all — the expected state for a
  # never-used disk. Any other non-zero is a real error.
  failed_when: github_runner_data_blkid.rc not in [0, 2]

- name: Refuse to format a device that already carries data
  vars:
    _signatures: "{{ github_runner_data_blkid.stdout | default('') }}"
  ansible.builtin.assert:
    that:
      - _signatures is not search('^PTTYPE=', multiline=True)
      - >-
        _signatures is not search('^TYPE=', multiline=True)
        or _signatures is search('^TYPE=' ~ github_runner_data_fstype ~ '$',
        multiline=True)
    fail_msg: >-
      {{ github_runner_data_device }} already carries a partition table, or a
      filesystem that is not {{ github_runner_data_fstype }}. Refusing to touch
      it. Signatures found: {{ github_runner_data_blkid.stdout_lines | default([]) | join(' ') }}

- name: Create the Docker data filesystem
  community.general.filesystem:
    dev: "{{ github_runner_data_device }}"
    fstype: "{{ github_runner_data_fstype }}"
    # `force` is deliberately absent. The module is a no-op when the requested
    # filesystem is already present, and errors rather than overwriting a
    # different one.

- name: Read the Docker data filesystem UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value {{ github_runner_data_device }}"
  register: github_runner_data_uuid
  changed_when: false

- name: Check whether /var/lib/docker already has its own filesystem
  ansible.builtin.command:
    cmd: findmnt -no SOURCE /var/lib/docker
  register: github_runner_docker_mount
  changed_when: false
  failed_when: false

# ---------------------------------------------------------------------------
# One-shot migration of an existing /var/lib/docker off the boot disk.
#
# WHY A MOUNT AT /var/lib/docker RATHER THAN Docker's `data-root`:
# the mount leaves Docker's own configuration at its default, so exactly one
# thing has to survive a rebuild — the fstab entry. `data-root` needs BOTH a
# daemon.json that survives and the mount that backs it, and the docker_engine
# role here only writes daemon.json when a flag is set, so a data-root would
# have to take ownership of that file away from it. One thing to survive
# instead of two is the more honest choice, and the converge-time assertion
# below catches either one regressing.
# ---------------------------------------------------------------------------

- name: Migrate an existing /var/lib/docker onto the data disk
  when: github_runner_docker_mount.rc != 0
  block:
    - name: Stop Docker for the data-disk migration
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket

    - name: Mount the data filesystem at a staging path
      ansible.posix.mount:
        path: /mnt/docker-data
        src: "UUID={{ github_runner_data_uuid.stdout }}"
        fstype: "{{ github_runner_data_fstype }}"
        state: ephemeral

    - name: Copy the existing Docker tree onto the data disk
      ansible.builtin.command:
        cmd: cp -a /var/lib/docker/. /mnt/docker-data/
        creates: /mnt/docker-data/image

    - name: Unmount the staging path
      ansible.posix.mount:
        path: /mnt/docker-data
        state: absent

    - name: Set the pre-migration tree aside
      ansible.builtin.command:
        cmd: mv /var/lib/docker /var/lib/docker.pre-datadisk
        creates: /var/lib/docker.pre-datadisk

- name: Mount the Docker data disk at /var/lib/docker
  ansible.posix.mount:
    path: /var/lib/docker
    src: "UUID={{ github_runner_data_uuid.stdout }}"
    fstype: "{{ github_runner_data_fstype }}"
    opts: defaults
    state: mounted

# ---------------------------------------------------------------------------
# containerd's own root, which is NOT under Docker's.
#
# Modern Docker defaults to the containerd snapshotter
# (`driver-type: io.containerd.snapshotter.v1`). Under it, image layers and
# every container's writable layer live in /var/lib/containerd, NOT in
# /var/lib/docker — so mounting the data disk at /var/lib/docker moves almost
# nothing. Observed on two guests: a dedicated 100G data disk sat at 935M / 1%
# used while 90G of snapshots filled the 99G boot disk and took the host down,
# with the old guard passing the whole time because the mount it checked was
# real and correct.
#
# Bind-mounting it into the data disk keeps the "one filesystem, addressed by a
# surviving fstab entry" shape the block above chose deliberately, and works
# whichever snapshotter is active.
# ---------------------------------------------------------------------------

- name: Read the filesystem backing /
  ansible.builtin.command:
    cmd: findmnt -no SOURCE --target /
  register: github_runner_root_fs
  changed_when: false

- name: Set the root filesystem fact
  ansible.builtin.set_fact:
    github_runner_fs_root_source: "{{ github_runner_root_fs.stdout | trim }}"

- name: Create the containerd directory on the data disk
  ansible.builtin.file:
    path: /var/lib/docker/containerd
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: Check whether /var/lib/containerd is already redirected
  ansible.builtin.command:
    cmd: findmnt -no SOURCE --target /var/lib/containerd
  register: github_runner_containerd_mount
  changed_when: false
  failed_when: false

- name: Migrate an existing /var/lib/containerd onto the data disk
  when: >-
    github_runner_containerd_mount.stdout | trim
    == github_runner_fs_root_source | default('', true) | trim
    or github_runner_containerd_mount.rc != 0
  block:
    - name: Stop Docker and containerd for the migration
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - docker.service
        - docker.socket
        - containerd.service

    - name: Copy the existing containerd tree onto the data disk
      ansible.builtin.command:
        cmd: cp -a /var/lib/containerd/. /var/lib/docker/containerd/
      register: github_runner_containerd_copy
      changed_when: true
      # An empty or absent source is the fresh-guest case, not a failure.
      failed_when: >-
        github_runner_containerd_copy.rc != 0
        and 'No such file or directory' not in github_runner_containerd_copy.stderr

    - name: Set the pre-migration containerd tree aside
      ansible.builtin.command:
        cmd: mv /var/lib/containerd /var/lib/containerd.pre-datadisk
        creates: /var/lib/containerd.pre-datadisk

    - name: Recreate the containerd mount point
      ansible.builtin.file:
        path: /var/lib/containerd
        state: directory
        owner: root
        group: root
        mode: "0711"

- name: Bind /var/lib/containerd onto the data disk
  ansible.posix.mount:
    path: /var/lib/containerd
    src: /var/lib/docker/containerd
    fstype: none
    opts: bind
    state: mounted

- name: Ensure Docker and containerd are running on the data disk
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - containerd
    - docker

# =============================================================================
# Converge-time guard
# =============================================================================
# This runs on EVERY converge, not only during the migration. Without it the
# change regresses silently on the next rebuild, and the only symptom is an
# ENOSPC failure in an unrelated job.

- name: Read the filesystems backing / and every Docker data path
  ansible.builtin.command:
    cmd: "findmnt -no SOURCE --target {{ item }}"
  loop: "{{ ['/'] + github_runner_data_paths }}"
  register: github_runner_fs_sources
  changed_when: false

- name: Assert no Docker data path is on the root filesystem
  vars:
    _root_fs: "{{ github_runner_fs_sources.results[0].stdout | trim }}"
    _offenders: >-
      {{ github_runner_fs_sources.results[1:]
         | selectattr('stdout', 'search', '^' ~ _root_fs ~ '$')
         | map(attribute='item') | list }}
  ansible.builtin.assert:
    that:
      - _offenders | length == 0
    fail_msg: >-
      {{ _offenders | join(', ') }} {{ 'is' if _offenders | length == 1 else 'are' }}
      on the root filesystem ({{ _root_fs }}). Docker's image and container data
      will fill the boot disk and every job on this runner will fail with ENOSPC
      — as will anything else on the guest, including sshd. Check the fstab
      entries for {{ github_runner_data_paths | join(' and ') }}.
    success_msg: >-
      Every Docker data path ({{ github_runner_data_paths | join(', ') }}) is
      off the root filesystem ({{ _root_fs }}).

# The mount above proves where the directories live. It does not prove Docker
# is USING them: `data-root` in a daemon.json, or a storage driver whose data
# lives somewhere else entirely, both move the bytes without moving the mount.
# Ask the daemon directly.
- name: Read Docker's own data root
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{" }}.DockerRootDir{{ "}}" }}'
  register: github_runner_docker_root
  changed_when: false

- name: Assert Docker's reported data root is a path this role placed off the boot disk
  vars:
    _reported: "{{ github_runner_docker_root.stdout | trim }}"
  ansible.builtin.assert:
    that:
      - _reported is search('^' ~ (github_runner_data_paths | first))
    fail_msg: >-
      Docker reports its data root as {{ _reported }}, which is not
      {{ github_runner_data_paths | first }}. The mounts this role manages are
      then guarding a directory the daemon does not write to, and the boot disk
      will fill anyway. A daemon.json `data-root` is the usual cause.

# Reclaim the boot disk only once the mounts are proven, never before. Either
# migration can happen without the other: a guest converged before the
# containerd bind mount existed already has /var/lib/docker on the data disk.
- name: Reclaim the boot disk after a successful migration
  when: >-
    github_runner_docker_mount.rc != 0
    or github_runner_containerd_mount.rc != 0
  block:
    - name: Remove the pre-migration trees from the boot disk
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/docker.pre-datadisk
        - /var/lib/containerd.pre-datadisk

    - name: Prune dangling Docker data
      ansible.builtin.command:
        cmd: docker system prune --force
      register: github_runner_prune
      changed_when: "'Total reclaimed space: 0B' not in github_runner_prune.stdout"
