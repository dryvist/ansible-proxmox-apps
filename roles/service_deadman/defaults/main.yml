---
# service_deadman — timer-driven liveness watchdog for keystone SPOF services.
#
# The cluster concentrates shared-infra keystones (DNS, the Traefik ingress, the
# syslog/netflow load balancer) on a single node. #421 added Restart= drop-ins so
# those services self-heal, but a service that exhausts its restart budget — or
# hangs while still "active" — fails silently. This role adds the missing
# VISIBILITY layer: a systemd timer runs a validator that probes each keystone
# every cycle and reports to two deadman receivers (Gatus external endpoint,
# healthchecks) plus an ntfy alert, mirroring the proven download_vpn killswitch-validator
# pattern. A crash, a restart-loop that gives up, or a stalled validator all page
# instead of going unnoticed.

# systemd timer cadence (OnUnitActiveSec). Deadman semantics rely on regular runs.
service_deadman_interval: "60s"

# ntfy alert target — FQDN-first: the Traefik-fronted service name
# (https://ntfy.<ingress_domain>), never an IP-valued hostvar. DNS owns the
# address; this config only ever knows the name.
service_deadman_ntfy_url: >-
  https://ntfy.{{ ingress_domain }}/{{ service_deadman_ntfy_topic }}
service_deadman_ntfy_topic: "keystone"

# Deadman receivers. Every check pings both every cycle; each URL is derived
# from the check name, so a new check needs no per-check secret or env var.
#
# Gatus external endpoint (status_stack renders one per name under the
# `deadman` group with a heartbeat): POST
# <gatus>/api/v1/endpoints/deadman_<name>/external?success=<bool>&error=<msg>
# with the shared bearer token. EMPTY token => Gatus ping skipped.
service_deadman_gatus_url: "https://gatus.{{ ingress_domain }}"
service_deadman_gatus_token: "{{ bao_monitoring_secrets.GATUS_EXTERNAL_TOKEN | default('') }}"

# Healthchecks ping-by-slug: <hc>/ping/<ping key>/<name>, with `?create=1` so
# the check is created on first contact. The URL is empty — and the ping
# skipped — until the healthchecks backend is in the published ingress table.
service_deadman_hc_url: >-
  {{ ('https://healthchecks.' ~ ingress_domain)
     if (tofu_data.ingress | default([]) | map(attribute='hostname')
         | select('equalto', 'healthchecks') | list | length > 0)
     else '' }}
service_deadman_hc_ping_key: "{{ bao_monitoring_secrets.HEALTHCHECK_PING_KEY | default('') }}"

# Per-group keystone checks. The role selects every check whose group this host
# belongs to (group_names), so one site.yml play covers all keystones and each
# host watches only its own services. Each check:
#   name            - label used in alerts and the monitor slug (must match a
#                     status_stack_deadman_endpoints entry)
#   probe_command   - shell returning 0 when healthy (functional, not just
#                     "systemd thinks it's up"); unit names verified live
service_deadman_group_checks:
  technitium_dns_group:
    - name: technitium-dns
      # dns.service is Technitium; rc 0 from dig proves the resolver answered
      # (NOERROR or NXDOMAIN both count) independent of any upstream forwarder.
      probe_command: >-
        systemctl is-active --quiet dns.service &&
        dig +tries=1 +time=3 @127.0.0.1 . NS >/dev/null 2>&1
  traefik_group:
    - name: traefik
      probe_command: >-
        systemctl is-active --quiet traefik.service &&
        timeout 5 bash -c '</dev/tcp/127.0.0.1/443'
  haproxy_group:
    # The LB host runs BOTH the HAProxy TCP VIP and the nginx UDP syslog/netflow
    # balancer; nginx is the one #421 found shipping no Restart=. nginx listens
    # UDP-only, so a port probe is unreliable — assert the unit instead.
    - name: haproxy-vip
      probe_command: "systemctl is-active --quiet haproxy.service"
    - name: nginx-syslog-lb
      probe_command: "systemctl is-active --quiet nginx.service"
  openbao_group:
    # `bao status` exits 0 only when THIS node is unsealed (2 = sealed, 1 =
    # error/unreachable) — a direct seal+liveness probe. Hit the node's own VLAN
    # IP: OpenBao has no loopback listener. standby-unsealed still exits 0, so
    # every peer reports its own seal state independently, and a node that seals
    # (e.g. lost its static seal key) or dies pages instead of failing silently.
    - name: openbao
      probe_command: >-
        systemctl is-active --quiet openbao &&
        BAO_ADDR="http://{{ container_ip | default(ansible_host) }}:8200"
        bao status >/dev/null 2>&1
  docker_vms:
    # The pooled GitHub Actions runner fleet is not a keystone SPOF, but it
    # shares the same silent-failure shape: github_runner's converge-time
    # assertion (tasks/main.yml) only proves the pool healthy AT converge
    # time, and nothing has watched it between converges. A dead fleet has
    # gone unnoticed for days three times running. `systemctl is-active`
    # given multiple units returns 0 only if every one is active, matching
    # the converge-time assertion's own definition of "healthy".
    - name: github-runner-pool
      probe_command: >-
        systemctl is-active --quiet
        {{ range(1, github_runner_replicas | int + 1)
           | map('regex_replace', '^', 'github-runner@')
           | map('regex_replace', '$', '.service') | join(' ') }}
    # A full Docker data disk fails every Molecule scenario on the host with
    # apt reporting a truncated index as an "invalid signature" — a disk
    # problem that reads exactly like a broken package mirror. The recurring
    # prune timer (github_runner role) is the fix; this is the visibility
    # layer for the case it falls behind between converges.
    - name: github-runner-data-disk
      probe_command: >-
        [ "$(df --output=pcent /var/lib/docker | tail -1 | tr -dc 0-9)"
        -lt {{ service_deadman_disk_floor_pct }} ]

# Resolved set of checks for THIS host — every group's checks the host is in.
service_deadman_checks: >-
  {{ service_deadman_group_checks | dict2items
     | selectattr('key', 'in', group_names)
     | map(attribute='value') | flatten | list }}

# Capacity floor for the github-runner-data-disk check: page once the Docker
# data disk crosses this percent used, well before the 100% that fails every
# job's apt update with a signature error that has nothing to do with GPG.
service_deadman_disk_floor_pct: 90

# Deployed paths (rarely overridden).
service_deadman_script_path: /usr/local/bin/service-deadman-validate.sh
service_deadman_service_name: service-deadman-validate
