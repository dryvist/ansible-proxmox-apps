---
# Reload only when a unit/config changed, so an unchanged converge stays
# idempotent. The app-service restart is gated on zammad_manage_app: under
# molecule the packages are not installed, so the services do not exist and a
# restart would fail (same pattern as the nautobot role).

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart redis
  ansible.builtin.systemd:
    name: redis-server
    state: restarted
  when: not (ansible_check_mode and zammad_system_packages_install is changed)

- name: Restart elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    state: restarted
  when:
    - zammad_manage_app | bool
    - not (ansible_check_mode and zammad_elasticsearch_install is changed)

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when:
    - zammad_manage_app | bool
    - not (ansible_check_mode and zammad_system_packages_install is changed)

- name: Restart zammad
  ansible.builtin.systemd:
    name: zammad
    state: restarted
  when:
    - zammad_manage_app | bool
    - not (ansible_check_mode and not zammad_configured)
