---
# =========================================================================
# Phase 8: nginx reverse proxy
# =========================================================================
- name: Deploy the Zammad nginx vhost
  ansible.builtin.template:
    src: zammad.nginx.conf.j2
    dest: /etc/nginx/sites-available/zammad.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the Zammad nginx vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/zammad.conf
    dest: /etc/nginx/sites-enabled/zammad.conf
    state: link
  notify: Reload nginx

- name: Remove the default nginx vhost
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Apply pending restarts before health checks + bootstrap
  ansible.builtin.meta: flush_handlers

- name: Enable and start the Zammad + nginx services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - zammad
    - nginx
  when:
    - not (ansible_check_mode and zammad_system_packages_install is changed)
    - not (ansible_check_mode and not zammad_configured)

# =========================================================================
# Phase 9: Idempotent bootstrap (settings incl. es_url, admin, per-actor
# AI service accounts + their tokens, Incidents group, P1-P4 severities,
# Mailpit channel, KB). The ruby prints
# ZAMMAD_BOOTSTRAP_CHANGED on drift. Runs BEFORE the search-index rebuild so
# es_url is set first.
# =========================================================================
- name: Validate the bootstrap secrets are present
  ansible.builtin.assert:
    that:
      - zammad_admin_password | length > 0
      - zammad_hermes_api_token | length > 0
      - zammad_ai_api_token | length > 0
      - zammad_agent_write_api_token | length > 0
      - zammad_splunk_api_token | length > 0
      - zammad_ntfy_api_token | length > 0
      - zammad_cribl_api_token | length > 0
      - zammad_triage_api_token | length > 0
      - zammad_clerk_api_token | length > 0
      # Never let auth_sso be enabled with a blank trusted-IP list:
      # verify_sso_trusted_ip! treats blank as "skip the check", so an empty
      # value here silently accepts an SSO assertion from any source.
      - zammad_sso_trusted_ips | length > 0
      # When AI is enabled, the router model + bearer must be present: a blank
      # token would silently 401 against the LiteLLM router (custom_open_ai
      # treats it as optional, but OUR router requires it).
      - not (zammad_ai_enabled | bool) or (zammad_ai_model | length > 0)
      - not (zammad_ai_enabled | bool) or (zammad_ai_provider_token | length > 0)
    fail_msg: >-
      ZAMMAD_ADMIN_PASSWORD, ZAMMAD_API_TOKEN, ZAMMAD_AI_API_TOKEN,
      ZAMMAD_AGENT_WRITE_API_TOKEN,
      ZAMMAD_SPLUNK_API_TOKEN, ZAMMAD_NTFY_API_TOKEN, ZAMMAD_CRIBL_API_TOKEN,
      ZAMMAD_TRIAGE_API_TOKEN and ZAMMAD_CLERK_API_TOKEN
      must be set in the
      environment before the first converge, and zammad_sso_trusted_ips must
      be non-empty
      (a blank value disables Zammad's SSO source check entirely). With
      zammad_ai_enabled, zammad_llm_router_key (OpenBao apps/zammad) and a
      model must also be set for the Zammad AI provider.
    quiet: true
  no_log: true

# =========================================================================
# Phase 8b: declared webhooks + triggers (off by default). Validated BEFORE
# anything is staged or written, so a bad entry fails the play with the
# entry's name and changes nothing.
# =========================================================================
- name: Validate each declared Zammad webhook entry
  vars:
    # Whitelist projection: the loop items land in task output on a failure,
    # so secret-bearing keys are never part of what this task can print.
    webhooks_inspectable: >-
      {{ zammad_webhooks | map('dict2items')
         | map('selectattr', 'key', 'in', ['name', 'endpoint', 'ssl_verify', 'active', 'note', 'custom_payload'])
         | map('items2dict') | list }}
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name | string | length > 0
      - item.endpoint is defined and item.endpoint is match('^https://')
      - item.custom_payload is not defined or item.custom_payload is none
        or ((item.custom_payload | regex_replace('#\{[^}]*\}', 'PLACEHOLDER')) | from_json) is mapping
    fail_msg: >-
      zammad_webhooks entry '{{ item.name | default('<unnamed>', true) }}' is
      invalid: every entry needs a name, an endpoint starting with https://,
      and a custom_payload that is valid JSON once its ticket placeholders are
      replaced.
  loop: "{{ webhooks_inspectable }}"

- name: Validate each declared Zammad trigger entry
  vars:
    webhook_names: "{{ zammad_webhooks | selectattr('name', 'defined') | map(attribute='name') | list }}"
  ansible.builtin.assert:
    that:
      - item.name is defined and item.name | string | length > 0
      - item.condition is defined and item.condition is mapping and item.condition | length > 0
      - item.webhook is defined and item.webhook in webhook_names
    fail_msg: >-
      zammad_triggers entry '{{ item.name | default('<unnamed>', true) }}' is
      invalid: every entry needs a name, a non-empty condition hash, and a
      webhook that names an entry in zammad_webhooks.
  loop: "{{ zammad_triggers }}"

- name: Require unique Zammad webhook and trigger names
  vars:
    webhook_names: "{{ zammad_webhooks | selectattr('name', 'defined') | map(attribute='name') | list }}"
    trigger_names: "{{ zammad_triggers | selectattr('name', 'defined') | map(attribute='name') | list }}"
  ansible.builtin.assert:
    that:
      - webhook_names | unique | length == webhook_names | length
      - trigger_names | unique | length == trigger_names | length
    fail_msg: >-
      Duplicate names are not allowed. zammad_webhooks names:
      {{ webhook_names | join(', ') | default('(none)', true) }};
      zammad_triggers names: {{ trigger_names | join(', ') | default('(none)', true) }}.

- name: Stage the bootstrap script on the target
  ansible.builtin.copy:
    src: zammad_bootstrap.rb
    dest: "{{ zammad_root }}/ansible_bootstrap.rb"
    owner: "{{ zammad_user }}"
    group: "{{ zammad_group }}"
    mode: "0640"

- name: Stage the Zammad bootstrap fragments on the target
  ansible.builtin.copy:
    src: zammad_bootstrap/
    dest: "{{ zammad_root }}/ansible_bootstrap/"
    owner: "{{ zammad_user }}"
    group: "{{ zammad_group }}"
    mode: "0640"
    directory_mode: "0750"

# A fragment the role no longer ships (renamed or reverted) must not stay
# staged on the guest: the entrypoint evals every *.rb in the directory, so a
# stale file would keep running after the role moved on. copy alone never
# deletes, hence this sweep — driven by the role's CURRENT fragment list, so
# objects the variables stop naming are never touched, only unshipped files.
- name: Record the bootstrap fragments the role ships
  vars:
    role_fragments_glob: zammad_bootstrap/*.rb
  ansible.builtin.set_fact:
    zammad_bootstrap_shipped_fragments: >-
      {{ query('ansible.builtin.fileglob', role_fragments_glob) | map('basename') | sort | list }}

- name: List the staged Zammad bootstrap fragments on the target
  ansible.builtin.find:
    paths: "{{ zammad_root }}/ansible_bootstrap"
    patterns: '*.rb'
    file_type: file
  register: zammad_bootstrap_staged_fragments

- name: Remove staged bootstrap fragments the role no longer ships
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ zammad_bootstrap_staged_fragments.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in zammad_bootstrap_shipped_fragments

# The run task lives in its own file (import, not include, so the tests
# below can read it in place); it is referenced here as a block.
- name: Run the Zammad bootstrap and name the failing fragment on failure
  ansible.builtin.import_tasks: bootstrap_run.yml
# Verifies what the bootstrap above produced (its stdout and the live rights);
# check mode skips the bootstrap, so there is nothing to verify there.
- name: Verify svc-agent-write effective roles and group access
  ansible.builtin.include_tasks: ../verify_agent_write_rights.yml
  when: not ansible_check_mode

# Lists every API row the readback found: row name, owner login and the date it
# was last used. Only rows of that exact names-only shape are shown.
- name: Show the Zammad API rows (names only)
  no_log: false
  vars:
    zammad_api_row_name: '^[A-Za-z0-9 _.:@-]{1,64}$'
    zammad_api_row_last_used: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
  ansible.builtin.debug:
    msg: >-
      {%- set shown = [] -%}
      {%- for row in (zammad_agent_write_readback | default({})).api_rows | default([]) -%}
      {%- if row.name is string and row.name is match(zammad_api_row_name)
            and row.owner is string and (row.owner == '' or row.owner is match(zammad_api_row_name))
            and (row.last_used_at is none
                 or (row.last_used_at is string and row.last_used_at is match(zammad_api_row_last_used))) -%}
      {%- set _ = shown.append(row.name ~ ' owner=' ~ (row.owner or '-')
                               ~ ' last_used=' ~ (row.last_used_at or 'never')) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ shown }}
  when: not ansible_check_mode

# =========================================================================
# Phase 9b: Incident schema + backdated history (opt-in)
# Runs after the bootstrap (needs its groups/org/admin) and before the
# search-index rebuild, so seeded tickets land in the first index build.
# The two tasks are ordered: the custom fields must exist before the
# incident seed can set them.
# =========================================================================
- name: Seed incident custom fields and backdated incident history
  # `zammad_seed` is declared on the included tasks, so `--tags zammad_seed`
  # reaches the seed directly without the full converge.
  ansible.builtin.include_tasks: main/incident_seed.yml
