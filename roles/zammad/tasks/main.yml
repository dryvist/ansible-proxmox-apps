---
# Zammad ITSM/ticketing + KB — native packager.io DEB, colocated Elasticsearch +
# Redis, state in the shared external Postgres (#138). The whole body is gated on
# zammad_manage_app (default true) so a molecule/dry run can no-op the network +
# package + DB work; a real converge runs it all.
#
# The install is deterministic and avoids a local PostgreSQL despite the .deb's
# hard `Depends: postgresql`: an equivs dummy satisfies the dependency, then
# download-only + dpkg --unpack creates /opt/zammad WITHOUT running the postinst,
# we template database.yml (pointing at the shared cluster), and only then
# dpkg --configure runs the postinst — which takes its "database.yml exists"
# branch (migrate against the remote DB) instead of creating a local one.

- name: Configure Zammad
  when: zammad_manage_app | bool
  become: true
  block:
    - name: Phases 1-4 -- packages, Redis, signing keys, apt repos
      ansible.builtin.include_tasks: main/packages_and_signing.yml

    - name: Phases 5-7 -- Elasticsearch, equivs dummy, the Zammad package
      ansible.builtin.include_tasks: main/elasticsearch_and_package.yml

    # import, NOT include: the bootstrap seed inside carries its own tag so it
    # can be run on its own without the full converge. A dynamic include hides
    # that tag from selection, which would silently turn `--tags zammad_seed`
    # into a run that matches nothing.
    - name: Phases 8-9b -- nginx reverse proxy and idempotent bootstrap
      ansible.builtin.import_tasks: main/nginx_and_bootstrap.yml

    - name: Phases 10-11 -- search-index rebuild and health check
      ansible.builtin.include_tasks: main/search_and_health.yml

# Publish the Zammad MCP connection to OpenBao (task #12). Deferred: gated on
# zammad_token_publish_openbao (default false); the converge flips it with -e.
- name: Publish Zammad MCP connection to OpenBao
  ansible.builtin.include_tasks: publish_mcp.yml
  when: zammad_token_publish_openbao | bool
  tags: zammad_mcp_publish
