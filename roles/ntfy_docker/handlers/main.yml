---
# ntfy Docker handlers

- name: Restart ntfy
  community.docker.docker_compose_v2:
    project_src: "{{ ntfy_docker_data_dir }}"
    state: present
    recreate: always

- name: Restart ntfy-to-slack instances
  ansible.builtin.systemd:
    name: "ntfy-to-slack@{{ item }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ ntfy_docker_slack_instances | default({}) | list }}"
  when: not ansible_check_mode or ntfy_docker_slack_unit_file.stat.exists

- name: Restart ntfy subscriber
  ansible.builtin.systemd:
    name: ntfy-subscribe.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or ntfy_docker_subscriber_unit_file.stat.exists

- name: Restart ntfy canary timer
  ansible.builtin.systemd:
    name: ntfy-canary.timer
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or ntfy_docker_canary_timer_unit_file.stat.exists
