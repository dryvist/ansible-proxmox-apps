---
# ntfy Docker handlers

- name: Restart docker
  # Never on the plane host (inventory/group_vars/all.yml plane_host):
  # restarting the Docker daemon there kills the Semaphore container
  # running the converge task itself.
  when: inventory_hostname != plane_host
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart ntfy
  community.docker.docker_compose_v2:
    project_src: "{{ ntfy_docker_data_dir }}"
    state: present
    recreate: always

- name: Restart ntfy-to-slack instances
  ansible.builtin.systemd:
    name: "ntfy-to-slack@{{ item.key }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ ntfy_docker_slack_active_routes | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Restart ntfy subscriber
  ansible.builtin.systemd:
    name: ntfy-subscribe.service
    state: restarted
    daemon_reload: true
