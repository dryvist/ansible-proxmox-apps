---
# ntfy-to-slack (https://github.com/ozskywalker/ntfy-to-slack) instances, one
# instantiated systemd unit (ntfy-to-slack@.service, %i = instance name):
#
#   all-<topic>  every topic in ntfy_docker_topics -> the all-alerts channel
#                (ntfy_docker_slack_alerts_key), message prefixed with the topic
#   <topic>      each topic in ntfy_docker_slack_routes -> its own channel
#
# ponytail: one forwarder per topic, since ntfy-to-slack subscribes to a single
# topic; a multi-topic subscriber only if the instance count ever matters.
#
# Every webhook these need must be seeded. A missing one fails the converge
# here, before anything is deployed, so a route can never be skipped silently.

- name: Validate the webhooks and compute the ntfy-to-slack instances
  ansible.builtin.include_tasks: slack_fanout_plan.yml

- name: Create the ntfy-to-slack env directory
  ansible.builtin.file:
    path: "{{ ntfy_docker_to_slack_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download the ntfy-to-slack release tarball
  ansible.builtin.get_url:
    url: "{{ ntfy_docker_to_slack_release_base }}/{{ ntfy_docker_to_slack_asset }}"
    dest: "/tmp/{{ ntfy_docker_to_slack_asset }}"
    # get_url reads the release's checksums file and takes the line for this
    # asset's file name.
    checksum: "sha256:{{ ntfy_docker_to_slack_checksums_url }}"
    mode: "0644"

- name: Extract the ntfy-to-slack binary
  ansible.builtin.unarchive:
    src: "/tmp/{{ ntfy_docker_to_slack_asset }}"
    remote_src: true
    dest: "{{ ntfy_docker_to_slack_install_dir }}"
    include: ntfy-to-slack
    owner: root
    group: root
    mode: "0755"

# Bare-value env file (no other secret shares this path), mode 0600: it holds
# a live Slack webhook URL.
- name: Deploy the per-instance ntfy-to-slack environment file
  ansible.builtin.template:
    src: ntfy-to-slack.env.j2
    dest: "{{ ntfy_docker_to_slack_env_dir }}/{{ item.key }}.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ ntfy_docker_slack_instances | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart ntfy-to-slack instances

- name: Deploy the ntfy-to-slack instantiated systemd unit
  ansible.builtin.template:
    src: ntfy-to-slack@.service.j2
    dest: /etc/systemd/system/ntfy-to-slack@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ntfy-to-slack instances

- name: Enable and start every ntfy-to-slack instance
  ansible.builtin.systemd:
    name: "ntfy-to-slack@{{ item }}.service"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ ntfy_docker_slack_instances.keys() | list }}"

# A retired instance (topic or route removed) must stop and disable -- otherwise
# it keeps forwarding a topic the operator believed was retired.
- name: Find any deployed ntfy-to-slack env files
  ansible.builtin.find:
    paths: "{{ ntfy_docker_to_slack_env_dir }}"
    patterns: "*.env"
  register: ntfy_docker_to_slack_deployed_envs

- name: Retire ntfy-to-slack instances no longer declared
  vars:
    ntfy_docker_to_slack_stale: >-
      {{ (ntfy_docker_to_slack_deployed_envs.files | map(attribute='path')
         | map('basename') | map('regex_replace', '\.env$', '') | list)
         | difference(ntfy_docker_slack_instances.keys() | list) }}
  when: ntfy_docker_to_slack_stale | length > 0
  block:
    - name: Stop and disable retired ntfy-to-slack instances
      ansible.builtin.systemd:
        name: "ntfy-to-slack@{{ item }}.service"
        state: stopped
        enabled: false
      loop: "{{ ntfy_docker_to_slack_stale }}"

    - name: Remove retired ntfy-to-slack env files
      ansible.builtin.file:
        path: "{{ ntfy_docker_to_slack_env_dir }}/{{ item }}.env"
        state: absent
      loop: "{{ ntfy_docker_to_slack_stale }}"
