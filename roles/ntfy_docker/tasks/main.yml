---
# ntfy Docker Deployment Tasks
# Deploys ntfy push notification server as a Docker container

# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: ntfy deploys via docker_compose_v2, which uses the docker compose CLI
# (not the docker SDK), so compose runs under the system interpreter.

# =============================================================================
# ntfy Data Directories
# =============================================================================

- name: Create ntfy cache directory
  ansible.builtin.file:
    path: "{{ ntfy_docker_data_dir }}/cache"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create ntfy config directory
  ansible.builtin.file:
    path: "{{ ntfy_docker_data_dir }}/config"
    state: directory
    owner: root
    group: root
    mode: "0755"

# =============================================================================
# ntfy Configuration
# =============================================================================

- name: Deploy ntfy server configuration
  ansible.builtin.template:
    src: server.yml.j2
    dest: "{{ ntfy_docker_data_dir }}/config/server.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ntfy

- name: Deploy ntfy docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ntfy_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ntfy

# =============================================================================
# Deploy via Docker Compose
# =============================================================================

- name: Deploy ntfy via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ ntfy_docker_data_dir }}"
    state: present

# =============================================================================
# Health Check
# =============================================================================

- name: Wait for ntfy HTTP port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ntfy_docker_http_port }}"
    timeout: 60

- name: Verify ntfy health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ntfy_docker_http_port }}/v1/health"
    method: GET
    status_code: 200
  register: ntfy_docker_health
  retries: 10
  delay: 5
  until: ntfy_docker_health.status == 200
  changed_when: false

# =============================================================================
# Alert hub: Slack fan-out, Zammad subscriber, end-to-end canary
# =============================================================================

# Each stage runs isolated so one unseeded credential cannot hold back the
# others: Slack is the alert path that must always deploy. Failures are
# collected and fail the converge once every stage has run.
- name: Deploy the Slack fan-out (ntfy-to-slack per instance)
  block:
    - name: Include the Slack fan-out
      ansible.builtin.include_tasks: slack_fanout.yml
  rescue:
    - name: Record the Slack fan-out failure
      ansible.builtin.set_fact:
        ntfy_docker_stage_failures: >-
          {{ ntfy_docker_stage_failures | default([])
             + ['slack fan-out: ' ~ (ansible_failed_result.msg | default('failed'))] }}

- name: Deploy the Zammad subscriber (native ntfy CLI)
  when: ntfy_docker_zammad_manage_subscriber | bool
  block:
    - name: Include the Zammad subscriber
      ansible.builtin.include_tasks: zammad_subscriber.yml
  rescue:
    - name: Record the Zammad subscriber failure
      ansible.builtin.set_fact:
        ntfy_docker_stage_failures: >-
          {{ ntfy_docker_stage_failures | default([])
             + ['zammad subscriber: ' ~ (ansible_failed_result.msg | default('failed'))] }}

- name: Deploy the end-to-end canary
  block:
    - name: Include the canary
      ansible.builtin.include_tasks: canary.yml
  rescue:
    - name: Record the canary failure
      ansible.builtin.set_fact:
        ntfy_docker_stage_failures: >-
          {{ ntfy_docker_stage_failures | default([])
             + ['canary: ' ~ (ansible_failed_result.msg | default('failed'))] }}

# Restart what the stages that did succeed changed before failing the host.
- name: Flush handlers for the alert-hub stages
  ansible.builtin.meta: flush_handlers

- name: Fail when an alert-hub stage failed
  ansible.builtin.fail:
    msg: "{{ ntfy_docker_stage_failures | join('; ') }}"
  when: ntfy_docker_stage_failures | default([]) | length > 0
