---
ntfy_docker_image: "binwiederhier/ntfy:v2.28.0"
ntfy_docker_container_name: ntfy
ntfy_docker_http_port: 8080
ntfy_docker_data_dir: /opt/ntfy
ntfy_docker_cache_duration: "12h"
ntfy_docker_attachment_cache_dir: /var/cache/ntfy/attachments

# Public URL clients reach this server on — the reverse-proxied service FQDN over
# HTTPS, matching what every publisher role already targets. It is NOT cosmetic:
# ntfy stamps it into the links it emits and uses it as the origin for the web
# app and for web-push subscriptions, so a value that no client can reach makes
# those paths unusable even while direct POSTs still succeed.
#
# Derived from the same ingress base the reverse-proxy role uses
# (traefik_base_domain), so the service name is written once and the environment
# supplies the domain. Never a node hostname and never plain HTTP: a node
# hostname is an implementation detail that moves when the guest moves, and the
# proxy only serves TLS.
ntfy_docker_base_url: >-
  https://{{ ntfy_docker_container_name }}.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}

# =============================================================================
# Alert hub: Slack fan-out
# =============================================================================
# Every topic the hub carries. Each one is forwarded to the all-alerts Slack
# channel and is a Zammad candidate. A publisher on a topic missing here
# reaches neither, so adding a publisher topic is an edit to this list.
ntfy_docker_topics:
  - keystone
  - secrets-security
  - observability
  - network
  - proxmox
  - ai
  - ai-jobs
  - openbao
  - media
  - hardware
  - hermes-all
  - hermes-noise
  - hermes-alerts
  - router-budget

# Webhook key (in ntfy_docker_slack_webhooks) of the one high-priority channel
# every topic above is forwarded to. Required: the converge fails while it is
# unseeded.
ntfy_docker_slack_alerts_key: keystone

# Topics that ALSO post to a channel of their own, keyed by the same topic name
# in ntfy_docker_slack_webhooks. Optional extras on top of the all-alerts
# channel, but required once listed: the converge fails while any listed
# topic's webhook is unseeded.
ntfy_docker_slack_routes: []

# Slack incoming-webhook URLs keyed by webhook key, from OpenBao
# secrets-external/platform/slack-webhooks (openbao_secrets domain "ntfy" --
# see roles/openbao_secrets).
ntfy_docker_slack_webhooks: "{{ bao_ntfy_secrets | default({}, true) }}"

# Slack text for the all-alerts channel (ntfy-to-slack Go template), so a
# message there names the topic it came from.
ntfy_docker_slack_alerts_template: >-
  {% raw %}[{{ .Topic }}] {{ if .Title }}*{{ .Title }}*: {{ end }}{{ .Message }}{% endraw %}

ntfy_docker_to_slack_version: v3.0.0
ntfy_docker_to_slack_arch: Linux-x86_64
ntfy_docker_to_slack_release_base: >-
  https://github.com/ozskywalker/ntfy-to-slack/releases/download/{{ ntfy_docker_to_slack_version }}
ntfy_docker_to_slack_asset: "ntfy-to-slack-{{ ntfy_docker_to_slack_arch }}.tar.gz"
ntfy_docker_to_slack_checksums_url: "{{ ntfy_docker_to_slack_release_base }}/checksums.txt"
ntfy_docker_to_slack_install_dir: /usr/local/bin
ntfy_docker_to_slack_env_dir: /etc/ntfy-to-slack

# =============================================================================
# Alert hub: Zammad subscriber (native ntfy CLI, one shared subscribe service)
# =============================================================================
# Every hub topic is a Zammad candidate; ntfy_docker_zammad_topic_groups below
# decides where each one files.
ntfy_docker_zammad_topics: "{{ ntfy_docker_topics }}"
# low/min priority messages stay Slack-only and never open a ticket.
ntfy_docker_zammad_priority_filter: "default,high,urgent"
ntfy_docker_zammad_apt_keyring: /etc/apt/keyrings/ntfy.gpg
ntfy_docker_zammad_client_config: /etc/ntfy/client.yml
ntfy_docker_zammad_env_file: /etc/ntfy-zammad/ntfy-zammad.env
ntfy_docker_zammad_script_path: /usr/local/bin/ntfy-zammad
ntfy_docker_zammad_state_dir: /var/lib/ntfy-zammad
# Consecutive Zammad-API failures before the subscriber gives up opening its
# own ticket and instead pages ntfy_docker_zammad_keystone_topic directly
# (tagged no-zammad, so that publish can never recurse into another failed
# attempt).
ntfy_docker_zammad_failure_threshold: 3
ntfy_docker_zammad_keystone_topic: keystone
# topic -> Zammad group. Falls back to "Incidents" (the catch-all seeded by
# every zammad_group.yml deployment) for a topic with no explicit mapping.
# Every value here MUST be a group zammad_groups actually seeds.
ntfy_docker_zammad_topic_groups:
  secrets-security: Homelab Infrastructure
  observability: Homelab Infrastructure
  network: Homelab Infrastructure
  proxmox: Homelab Infrastructure
  ai: AI/LLM Serving
  media: Media
  hardware: Homelab Infrastructure
  keystone: Incidents
  openbao: Homelab Infrastructure
  ai-jobs: AI/LLM Serving
# Zammad connection for the subscriber's own token (svc-ntfy, seeded by
# roles/zammad's zammad_bootstrap.rb). Bao-first via the apps domain,
# matching zammad_ntfy_api_token's own source in the zammad role.
ntfy_docker_zammad_api_url: "https://zammad.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/api/v1"
ntfy_docker_zammad_api_token: "{{ bao_apps_secrets.zammad_ntfy_api_token | default('', true) }}"
# Off by default in a dry run/molecule: the subscriber needs a live Zammad
# token that only exists after roles/zammad has converged at least once.
ntfy_docker_zammad_manage_subscriber: true

# =============================================================================
# End-to-end canary
# =============================================================================
# A timer on the hub publishes to ntfy_docker_canary_topic through the fronted
# URL (DNS, ingress, ntfy), reads the message back through the same URL, then
# pings the off-site deadman. When any stage stops, the off-site service pages
# without the hub. The topic is not in ntfy_docker_topics, so it never reaches
# Slack or Zammad. An unseeded off-site URL skips only the ping, with a
# warning, matching service_deadman's off-site receiver.
ntfy_docker_canary_topic: canary
ntfy_docker_canary_interval: 5min
ntfy_docker_canary_script_path: /usr/local/bin/ntfy-canary
ntfy_docker_canary_offsite_url: "{{ bao_monitoring_secrets.HEALTHCHECKS_OFFSITE_PING_URL | default('', true) }}"
ntfy_docker_canary_check_name: ntfy-canary

# =============================================================================
# ai-jobs publisher
# =============================================================================
# Off by default. On: the server opens its auth database, one publish-only
# user holds write-only access to ntfy_docker_ai_jobs_topic, and that user's
# single access token is published to the open-llm bucket.
#
# ponytail: server-wide default access stays read-write, so anonymous callers
# read and publish every topic, and this token publishes to any topic. The
# user's ACL only denies the token reads on the topic. `ntfy access everyone
# <topic> read-only` would limit publishing on the topic to token holders.
ntfy_docker_ai_jobs_enabled: false
ntfy_docker_ai_jobs_topic: ai-jobs
ntfy_docker_ai_jobs_user: ai-jobs-publisher
ntfy_docker_ai_jobs_token_label: ai-jobs-dispatcher
ntfy_docker_auth_dir: "{{ ntfy_docker_data_dir }}/auth"
ntfy_docker_auth_file: /var/lib/ntfy/user.db
