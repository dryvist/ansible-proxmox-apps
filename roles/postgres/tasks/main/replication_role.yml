---
# =============================================================================
# The LOGIN + REPLICATION role standbys authenticate as. Primary-only: a
# standby is read-only and inherits the role through streaming. Applied on
# every converge so a rotated password reaches the role.
# Native mode: included from replication_primary.yml (Phase 3b).
# Patroni mode: included from main.yml once the leader is resolved (Phase 2g)
# — Patroni >= 4 no longer creates users from bootstrap.users.
# =============================================================================
- name: Ensure the replication login role exists
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_replication_user }}"
    password: "{{ postgres_replication_password }}"
    role_attr_flags: LOGIN,REPLICATION
    state: present
  when: postgres_role == 'primary'
  no_log: true
