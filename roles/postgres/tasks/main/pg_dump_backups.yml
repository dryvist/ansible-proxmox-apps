---
# =============================================================================
# Phase 5: pg_dump backups on the persistent mount, via a systemd timer
# =============================================================================
- name: Configure pg_dump backups
  when: postgres_backup_enabled | bool
  block:
    - name: Create the backup directory on the persistent mount
      ansible.builtin.file:
        path: "{{ postgres_backup_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"

    - name: Deploy the pg_dump backup script
      ansible.builtin.template:
        src: pg-backup.sh.j2
        dest: /usr/local/bin/pg-backup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the pg_dump backup systemd service
      ansible.builtin.template:
        src: pg-backup.service.j2
        dest: /etc/systemd/system/pg-backup.service
        owner: root
        group: root
        mode: "0644"

    - name: Deploy the pg_dump backup systemd timer
      ansible.builtin.template:
        src: pg-backup.timer.j2
        dest: /etc/systemd/system/pg-backup.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start the pg_dump backup timer
      ansible.builtin.systemd:
        name: pg-backup.timer
        state: started
        enabled: true
        daemon_reload: true

# Trust the standby node's puller so ansible-proxmox roles/postgres_standby can
# rsync the backup directory into the replicated archive (Tier 1 of the
# Database DR Standard). Env-gated: no key supplied, no trust installed.
#
# rrsync is the forced command rather than a pinned `rsync --server --sender`
# argv: the argv the client sends changes with rsync's flags, so pinning it
# breaks the pull silently on an upgrade. rrsync ships in the rsync package.
#
# Both tasks also carry their own tag so the trust can be (re)applied on its
# own — rotating a puller's key should not require converging the whole
# engine on a live database guest:
#
#   --tags postgres_standby_trust -e postgres_standby_pull_pubkeys="$(...)"
#
# Pass the keys as an EXTRA VAR, not an exported environment variable.
# `VAR=x doppler run -- ...` does not override a Doppler-managed variable —
# Doppler's injected value wins over the caller's export, silently — so an
# export is ignored and whatever the secret holds is authorized instead, at
# rc=0 with changed=true. The default binding no longer reads any env var
# (it fed the stale pve2 puller key on every converge); an extra var is the
# only resolution path.
- name: Install rsync for the standby puller's forced command
  ansible.builtin.apt:
    name: rsync
    state: present
  when: postgres_standby_pull_pubkeys | length > 0
  tags:
    - postgres_standby_trust

- name: Authorize the standby puller's SSH key(s) for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ postgres_standby_pull_pubkeys }}"
    # The puller anchors its source path at "/" — rrsync resolves that to this
    # directory. An absolute path would be prefixed with it and match nothing.
    key_options: 'restrict,command="rrsync -ro {{ postgres_backup_dir }}"'
  when: postgres_standby_pull_pubkeys | length > 0
  tags:
    - postgres_standby_trust

# Declared state includes the absence: the decommissioned pve2 puller's key
# (forced rrsync command, comment root@pve2) was re-authorised by every
# converge while the env binding above still fed the stale Doppler secret
# (Zammad #17250). Not gated on pubkeys — this scrubs even when no puller is
# being trusted, and matches only that puller's line so human and current
# puller keys are untouched. The current pullers' keys carry the
# postgres-standby-pull comment instead.
- name: Remove trust for the decommissioned pve2 backup puller
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    regexp: 'rrsync -ro .*\broot@pve2$'
    state: absent
  tags:
    - postgres_standby_trust
