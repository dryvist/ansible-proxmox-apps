---
# =============================================================================
# Patroni install + config + service. Runs on every converge once
# postgres_ha_manager is 'patroni' — safe for a FRESH cluster (empty
# postgres_data_dir: Patroni's own bootstrap.dcs block runs initdb the first
# time it starts) and for a cluster Patroni already owns (idempotent config
# render + ensure-started).
#
# It REFUSES to start Patroni against a PRE-EXISTING, not-yet-adopted data
# directory — that is patroni_adopt.yml's job, explicitly gated and never run
# by a normal converge. Same interlock SHAPE as standby_bootstrap.yml's reinit
# guard: a stray postgres_ha_manager flip can identify a cluster as Patroni-
# managed, but it cannot make this file touch a live, unmigrated primary.
# =============================================================================
- name: Check whether Patroni is already managing this node
  ansible.builtin.systemd:
    name: patroni
  register: postgres_ha_patroni_unit_status
  check_mode: true
  changed_when: false
  failed_when: false

- name: Refuse to start Patroni against unadopted existing data
  ansible.builtin.fail:
    msg: >-
      {{ postgres_data_dir }} already holds a PostgreSQL cluster and Patroni
      has never managed this node
      ({{ postgres_ha_patroni_unit_status.status.ActiveState | default('not-found') }}).
      Starting Patroni here would take over that data directory outside the
      reviewed adoption procedure. Run the explicit adoption path first:
      --tags patroni_adopt -e postgres_ha_patroni_adopt=true (see
      tasks/main/patroni_adopt.yml), in a maintenance window, after a
      pgBackRest full backup.
  when:
    - postgres_existing_data_version.stat.exists | default(false)
    - (postgres_ha_patroni_unit_status.status.ActiveState | default('inactive')) != 'active'
    - not (postgres_ha_patroni_adopt | bool)

- name: Install Patroni and its etcd client library
  ansible.builtin.apt:
    name:
      - "{{ postgres_ha_patroni_package }}"
      - "{{ postgres_ha_patroni_etcd_client_package }}"
    state: present
    update_cache: true

- name: Ensure the Patroni config directory exists
  ansible.builtin.file:
    path: "{{ postgres_ha_patroni_config_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Deploy the Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ postgres_ha_patroni_config_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: Restart patroni

- name: Deploy the Patroni systemd unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  register: postgres_ha_patroni_unit_file

- name: Ensure the Patroni service is started and enabled
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
    daemon_reload: "{{ postgres_ha_patroni_unit_file.changed }}"

# Generous timeout: a fresh member's first start runs initdb + (for a
# replica) a full pgBackRest/basebackup restore before it can answer at all.
- name: Wait for this node's Patroni REST API to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ postgres_ha_patroni_rest_port }}/health"
  register: postgres_ha_patroni_health
  until: postgres_ha_patroni_health.status is defined
  retries: 60
  delay: 10
  changed_when: false
  failed_when: false
