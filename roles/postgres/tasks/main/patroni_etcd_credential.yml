---
# Patroni's own etcd credential, keyed to the CLUSTER (postgres_ha_scope),
# never to one app. This role serves every postgres cluster (postgres_group,
# postgres_ai_group, and any future one), and more than one may eventually
# run patroni mode -- an app-scoped OpenBao field (secret/apps/hindsight/*,
# this PR's first attempt) would silently belong to whichever app happened to
# adopt patroni mode first and resolve empty for every other cluster.
#
# Path follows the ratified grammar (EPIC 887, docs d/conventions/secret-paths):
# <mount>/<service>/<instance>/<role> = secret/etcd/{{ postgres_ha_scope }}/rw,
# a bare UPPER_SNAKE field (PASSWORD -- etcd's own term for the concept; there
# is no vendor-documented env var, since Patroni reads this from patroni.yml,
# not from etcd's own environment). The username (patroni-dcs) is a fixed
# literal, not a secret, so only the password lives in OpenBao.
#
# Skipped entirely when postgres_ha_etcd_patroni_password already has a
# value -- a Molecule/test converge sets it directly as a play var, the same
# way it already does for the three bao_apps_secrets-sourced passwords next
# to it in 03-patroni.yml, precisely so this file never has to dial the
# scenario's fake, unreachable postgres_ha_pki_addr.
#
# Otherwise: generated at source, once, by whichever member gets there first
# (never all three racing a different random value into the same path);
# every member, including that one, then reads back the same stored value in
# the final task below, so all three render an identical patroni.yml.
# postgres_ha_pki_addr/_token are this role's existing generic OpenBao base
# address/token (already asserted non-empty by patroni_prereqs.yml) -- reused
# here for a KV write, not just the PKI issue calls they were first added for.
- name: Resolve Patroni's own etcd credential
  when: postgres_ha_etcd_patroni_password | length == 0
  block:
    - name: Check whether this cluster's Patroni etcd credential already exists
      ansible.builtin.uri:
        url: "{{ postgres_ha_pki_addr }}/v1/secret/data/etcd/{{ postgres_ha_scope }}/rw"
        method: GET
        headers:
          X-Vault-Token: "{{ postgres_ha_pki_token }}"
        status_code: [200, 404]
      register: postgres_ha_etcd_credential_check
      no_log: true
      changed_when: false

    # run_once, not inventory_hostname == (postgres_ha_cluster_members | first):
    # run_once elects whichever host in the current batch actually reaches
    # this task, so it survives the literal first member being unreachable
    # (an index into a static list would not — nothing would ever generate
    # the credential, and hosts 2/3 would spin forever on a path that never
    # gets created). The read-back below still runs on every member.
    - name: Generate this cluster's Patroni etcd credential (once per cluster)
      ansible.builtin.uri:
        url: "{{ postgres_ha_pki_addr }}/v1/secret/data/etcd/{{ postgres_ha_scope }}/rw"
        method: POST
        headers:
          X-Vault-Token: "{{ postgres_ha_pki_token }}"
        body_format: json
        body:
          data:
            PASSWORD: >-
              {{ lookup('community.general.random_string',
                         length=postgres_ha_etcd_credential_length,
                         special=false, upper=true, numbers=true) }}
        status_code: [200]
      run_once: true
      no_log: true
      changed_when: true
      when: postgres_ha_etcd_credential_check.status == 404

    - name: Read this cluster's Patroni etcd credential
      ansible.builtin.uri:
        url: "{{ postgres_ha_pki_addr }}/v1/secret/data/etcd/{{ postgres_ha_scope }}/rw"
        method: GET
        headers:
          X-Vault-Token: "{{ postgres_ha_pki_token }}"
        status_code: [200]
      register: postgres_ha_etcd_credential_fetch
      no_log: true
      changed_when: false

    - name: Set the Patroni etcd credential fact
      ansible.builtin.set_fact:
        postgres_ha_etcd_patroni_password: "{{ postgres_ha_etcd_credential_fetch.json.data.data.PASSWORD }}"
      no_log: true
