---
# Patroni's own etcd credential, keyed to the CLUSTER (postgres_ha_scope),
# never to one app. The username (patroni-dcs) is a fixed literal, so only
# PASSWORD lives in OpenBao at secret/etcd/<scope>/rw.
#
# A Molecule/test converge may set postgres_ha_etcd_patroni_password directly;
# otherwise each active member seeds the same path on the controller through
# the shared seed_generated task. throttle: 1 runs those seeds one member at a
# time, so the first one generates the value and the rest read it back
# unchanged, because seed_generated never rewrites a stored field. The shared
# ansible-converge token never reaches a postgres guest.
- name: Resolve Patroni's own etcd credential
  when: postgres_ha_etcd_patroni_password | length == 0
  block:
    - name: Seed this cluster's Patroni etcd credential on the controller
      delegate_to: localhost
      connection: local
      become: false
      vars:
        ansible_become: false
      throttle: 1
      no_log: true
      block:
        - name: Seed the etcd password through the shared seed_generated task
          ansible.builtin.include_role:
            name: dryvist.homelab.openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
            openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
            openbao_secrets_seed_expected_writer_policy: ansible-converge
            openbao_secrets_seed_mount: secret
            openbao_secrets_seed_path: "etcd/{{ postgres_ha_scope }}/rw"
            openbao_secrets_seed_fields:
              - name: PASSWORD
                length: "{{ postgres_ha_etcd_credential_length }}"
                charset: alnum
            openbao_secrets_seed_register: postgres_ha_etcd_credential_seed

    - name: Set the Patroni etcd credential fact
      ansible.builtin.set_fact:
        postgres_ha_etcd_patroni_password: "{{ postgres_ha_etcd_credential_seed.PASSWORD }}"
      no_log: true
