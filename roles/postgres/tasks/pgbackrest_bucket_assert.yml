---
# Runs on every host that renders pgbackrest.conf, primary or standby, before
# pgbackrest.yml. Kept in its own file so each task file stays small.
- name: Assert the pgBackRest bucket names are set
  ansible.builtin.assert:
    that:
      - postgres_backup_s3_bucket | length > 0
      - >-
        not (postgres_pgbackrest_repo2_enabled | bool)
        or not (postgres_backup_repo2_s3_bucket is match('example-'))
    fail_msg: >-
      A pgBackRest bucket name is not set. repo1 reads BUCKET from the
      postgres_backup_s3 credential record; repo2, when enabled, reads
      POSTGRES_BACKUP_REPO2_S3_BUCKET.
    quiet: true
  when:
    - postgres_pgbackrest_enabled | bool
    - postgres_pgbackrest_credentials_present | bool
