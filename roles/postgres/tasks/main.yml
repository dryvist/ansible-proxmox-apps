---
# Native PostgreSQL (PGDG) for the shared homelab database backend (issue #138).
# All persistent state lives on the container's ZFS bind mount at
# postgres_data_root, so a ChaosMonkey rebuild reconstructs the cluster config,
# roles, and databases from Ansible while the data on the mount survives.

- name: Phase 1 -- add the PGDG apt repository
  ansible.builtin.include_tasks: main/install_pgdg.yml

- name: Phase 2 -- install PostgreSQL and create the cluster
  ansible.builtin.include_tasks: main/install_and_create_cluster.yml

- name: Phase 2b -- bootstrap the streaming standby
  ansible.builtin.include_tasks: main/standby_bootstrap.yml

- name: Phase 3 -- apply idempotent cluster GUCs
  ansible.builtin.include_tasks: main/cluster_config.yml

- name: Phase 3b -- configure the replication primary
  ansible.builtin.include_tasks: main/replication_primary.yml

- name: Phase 3c -- assert the declared topology matches the running one
  ansible.builtin.include_tasks: main/verify_topology.yml

- name: Phase 4 -- provision managed roles, databases, and pg_hba
  ansible.builtin.include_tasks: main/roles_and_databases.yml

# import, NOT include: this file's standby-trust tasks carry
# postgres_standby_trust so the puller's key can be applied on its own. A
# dynamic include hides inner tags from tag selection, so
# `--tags postgres_standby_trust` skipped the include outright and the run
# reported success having authorized nothing. Same reason as Phase 5b below.
- name: Phase 5 -- configure pg_dump backups on the persistent mount
  ansible.builtin.import_tasks: main/pg_dump_backups.yml

# import, NOT include: this file holds the DR-restore path, whose tasks carry
# never/dr_restore/pgbackrest_restore. A dynamic include hides those tags from
# tag selection, so `--tags dr_restore` would skip the include outright and the
# restore runbook would report success having done nothing. A static import
# applies the inner tags exactly as if the tasks were still inline.
- name: Phase 5b -- object-storage PITR backups and DR restore
  ansible.builtin.import_tasks: main/pitr_and_dr.yml

- name: Phase 6 -- health check
  ansible.builtin.include_tasks: main/health_check.yml
