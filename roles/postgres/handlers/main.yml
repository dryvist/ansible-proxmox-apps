---
# A config change that only needs the running server to re-read it (pg_hba,
# most GUCs) triggers a reload; listen_addresses/port changes need a full
# restart. postgresql_alter_system reports restart_required, so the tasks
# notify the right handler explicitly rather than restarting on every reload.
- name: Reload postgresql
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_cluster_version }}-{{ postgres_cluster_name }}"
    state: reloaded

- name: Restart postgresql
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_cluster_version }}-{{ postgres_cluster_name }}"
    state: restarted

# Needed after a unit FILE is added or removed on disk, which systemd does not
# notice on its own. Unrelated to the postgresql service handlers above.
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

# --- Patroni mode -------------------------------------------------------------
# A restart here affects only the ONE host this converge is running against —
# this role has no play-level serial control of its own. Converging every
# member of a live Patroni cluster in the same run restarts etcd/Patroni on
# all of them without staggering; invoke this role with `serial: 1` (or
# `--limit` one host at a time) against a live patroni-mode cluster, the same
# caution the L1 upgrade lane already documents for the Hindsight worker pool.
- name: Restart etcd
  ansible.builtin.systemd:
    name: etcd
    state: restarted

- name: Restart patroni
  ansible.builtin.systemd:
    name: patroni
    state: restarted
