---
- name: Ensure the trusted certificate directory exists
  ansible.builtin.file:
    path: "{{ homarr_trusted_certificates_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - (homarr_version | regex_replace('^v', '') | split('.') | first | int) >= 2
    - homarr_proxmox_ca | length > 0

- name: Install the Proxmox cluster CA for Homarr v2
  ansible.builtin.copy:
    content: "{{ homarr_proxmox_ca }}"
    dest: "{{ homarr_trusted_certificates_dir }}/proxmox-cluster-ca.pem"
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify: Restart Homarr
  when:
    - (homarr_version | regex_replace('^v', '') | split('.') | first | int) >= 2
    - homarr_proxmox_ca | length > 0
