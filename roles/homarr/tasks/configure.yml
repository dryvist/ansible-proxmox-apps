---
# Own the runtime environment file the borrowed installer wrote once.

- name: Read the existing environment file
  ansible.builtin.slurp:
    src: "{{ homarr_env_file }}"
  register: homarr_env_existing
  failed_when: false
  no_log: true

# The encryption key is DATA, not a credential. It decrypts every row in
# `integrationSecret` (AES-256-CBC), so a fresh one does not invalidate those
# rows — it makes them permanently undecryptable, and the only symptom is every
# integration failing at once with no obvious cause. OpenBao comes first: every
# converge publishes the key in use, so the stored copy is the one the database
# was written with. The on-disk file is NOT safe to trust first: when a
# homarr_cs_tag bump re-runs the borrowed installer, it rewrites this file with
# a fresh random key before this task runs. Mint only when neither exists.
- name: Determine the effective encryption key
  ansible.builtin.set_fact:
    homarr_effective_encryption_key: >-
      {{ homarr_encryption_key
         or (homarr_env_existing.content | default('') | b64decode
             | regex_search("SECRET_ENCRYPTION_KEY='([^']+)'", '\1')
             | first | default('', true))
         or (lookup('community.general.random_string',
                    length=64, upper=false, special=false, numbers=true)
             | lower) }}
  no_log: true

- name: Deploy the Homarr environment file
  ansible.builtin.template:
    src: homarr.env.j2
    dest: "{{ homarr_env_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart Homarr

# The API calls that follow must not race a restarting service.
- name: Apply any environment change before touching the API
  ansible.builtin.meta: flush_handlers

- name: Publish the Homarr encryption key to OpenBao
  ansible.builtin.include_role:
    name: openbao_secrets
    tasks_from: publish.yml
  vars:
    openbao_secrets_publish_app: "{{ homarr_instance }}"
    openbao_secrets_publish_reason: (integration secret encryption key)
    openbao_secrets_publish_data: >-
      {{ {homarr_secret_prefix ~ '_encryption_key': homarr_effective_encryption_key} }}
  when: homarr_publish_credentials | bool
