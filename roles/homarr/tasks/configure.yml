---
# Own the runtime environment file the borrowed installer wrote once.

- name: Read the existing environment file
  ansible.builtin.slurp:
    src: "{{ homarr_env_file }}"
  register: homarr_env_existing
  failed_when: false
  no_log: true

# The encryption key decrypts every integrationSecret row. Seed the existing
# key into OpenBao only when the field is absent; never replace a stored value.
- name: Extract the existing Homarr encryption key
  ansible.builtin.set_fact:
    homarr_existing_encryption_key: >-
      {{ (homarr_env_preinstall.content | default('') | b64decode
          | regex_search("SECRET_ENCRYPTION_KEY='([^']+)'", '\1')
          | default([], true)
          | first | default('', true))
         or (homarr_env_existing.content | default('') | b64decode
             | regex_search("SECRET_ENCRYPTION_KEY='([^']+)'", '\1')
             | default([], true)
             | first | default('', true)) }}
  no_log: true

# The writes run on the controller: the writer token must never reach the guest.
- name: Seed Homarr's encryption key in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the Homarr encryption key through the shared seed_generated task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_path: "apps/{{ homarr_instance }}"
        openbao_secrets_seed_fields:
          - name: "{{ homarr_secret_prefix }}_encryption_key"
            length: 64
            charset: lower
            value: "{{ homarr_encryption_key or homarr_existing_encryption_key }}"
        openbao_secrets_seed_local_values: >-
          {{ {homarr_secret_prefix ~ '_encryption_key':
               (homarr_encryption_key or homarr_existing_encryption_key)} }}
        openbao_secrets_seed_register: homarr_encryption_seed

- name: Resolve Homarr's encryption key from OpenBao
  ansible.builtin.set_fact:
    homarr_effective_encryption_key: >-
      {{ homarr_encryption_seed[homarr_secret_prefix ~ '_encryption_key']
         | default(homarr_encryption_key or homarr_existing_encryption_key, true) }}
  no_log: true

- name: Require the existing Homarr encryption key to match OpenBao
  ansible.builtin.assert:
    that:
      - homarr_existing_encryption_key == homarr_effective_encryption_key
    fail_msg: >-
      Homarr environment file differs from the stored field
      {{ homarr_secret_prefix }}_encryption_key
  when:
    - homarr_encryption_seed[homarr_secret_prefix ~ '_encryption_key'] != '(placeholder in check mode)'
    - homarr_existing_encryption_key | length > 0
  no_log: true

- name: Require a Homarr encryption key
  ansible.builtin.assert:
    that:
      - homarr_effective_encryption_key | length > 0
    fail_msg: "Homarr encryption key is empty"
  no_log: true

- name: Deploy the Homarr environment file
  ansible.builtin.template:
    src: homarr.env.j2
    dest: "{{ homarr_env_file }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart Homarr

# The API calls that follow must not race a restarting service.
- name: Apply any environment change before touching the API
  ansible.builtin.meta: flush_handlers
