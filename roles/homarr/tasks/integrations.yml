---
# Converge Homarr's API key and integrations. Everything here addresses the
# guest DIRECTLY (homarr_api_base) — never the Traefik vhost, whose SSO gate
# answers an HTML login page that Homarr's own integration test then fails to
# parse as JSON. That is precisely how this instance ended up with zero
# integrations despite the UI reporting nothing useful.

# Two files, one directory: homarr_api.py imports homarr_trpc from beside
# itself via Python's own sys.path[0]. That needs no packaging and no
# PYTHONPATH, but it does mean they cannot be split across directories --
# hence a dedicated libexec dir rather than /usr/local/sbin.
- name: Ensure the Homarr converger directory exists
  ansible.builtin.file:
    path: /usr/local/libexec/homarr
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy the Homarr API converger
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: /usr/local/libexec/homarr/
    owner: root
    group: root
    mode: preserve

# The converger used to live here as a single file. Left behind it would be a
# second, stale copy of a credential-handling script that still runs if anything
# invokes it by the old path.
- name: Remove the pre-split converger
  ansible.builtin.file:
    path: /usr/local/sbin/homarr-api
    state: absent

# OpenBao owns the admin password. A persisted file seeds a missing field and
# must match the value returned from KV on every later converge.
- name: Check for the persisted Homarr admin password
  ansible.builtin.stat:
    path: "{{ homarr_admin_password_file }}"
  register: homarr_admin_pw_stat

- name: Read the persisted Homarr admin password
  ansible.builtin.slurp:
    src: "{{ homarr_admin_password_file }}"
  register: homarr_admin_pw_stored
  when: homarr_admin_pw_stat.stat.exists
  no_log: true

# The writes run on the controller: the writer token must never reach the guest.
- name: Seed Homarr's admin password in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the Homarr admin password through the shared seed_generated task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_path: "apps/{{ homarr_instance }}"
        openbao_secrets_seed_fields:
          - name: "{{ homarr_secret_prefix }}_admin_password"
            length: 40
            charset: alnum
            value: >-
              {{ homarr_admin_password
                 or (homarr_admin_pw_stored.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_local_values: >-
          {{ {homarr_secret_prefix ~ '_admin_password':
               (homarr_admin_password
                or (homarr_admin_pw_stored.content | default('') | b64decode | trim))} }}
        openbao_secrets_seed_register: homarr_admin_password_seed

- name: Resolve Homarr's admin password from OpenBao
  ansible.builtin.set_fact:
    homarr_effective_admin_password: "{{ homarr_admin_password_seed[homarr_secret_prefix ~ '_admin_password'] }}"
  no_log: true

- name: Require the persisted admin password to match OpenBao
  ansible.builtin.assert:
    that:
      - >-
        not homarr_admin_pw_stat.stat.exists
        or (homarr_admin_pw_stored.content | b64decode | trim)
           == homarr_effective_admin_password
    fail_msg: >-
      Homarr admin password file differs from the stored field
      {{ homarr_secret_prefix }}_admin_password
  when:
    - homarr_effective_admin_password != '(placeholder in check mode)'
  no_log: true

- name: Ensure the credential directory exists
  ansible.builtin.file:
    path: "{{ homarr_admin_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Persist the admin password for the next converge
  ansible.builtin.copy:
    content: "{{ homarr_effective_admin_password }}\n"
    dest: "{{ homarr_admin_password_file }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - homarr_effective_admin_password != '(placeholder in check mode)'
  no_log: true

- name: Converge the API key, every integration, and the board tiles
  # The spec goes in on stdin so no credential is ever written to disk or to a
  # command line. Every integration is always attempted; one Homarr rejects
  # for a missing/bad credential is named in the converger's own output and
  # never takes down the rest of the sync.
  ansible.builtin.command:
    cmd: /usr/local/libexec/homarr/homarr_api.py
    stdin: "{{ homarr_api_spec | to_json }}"
  vars:
    homarr_api_spec:
      api_base: "{{ homarr_api_base }}"
      admin_username: "{{ homarr_admin_username }}"
      admin_password: "{{ homarr_effective_admin_password }}"
      db_path: "{{ homarr_db_url }}"
      bcrypt_module: "{{ homarr_install_dir }}/node_modules/bcrypt"
      api_key: "{{ homarr_api_key }}"
      api_key_file: "{{ homarr_api_key_file }}"
      force_secret_sync: "{{ homarr_force_secret_sync }}"
      major: "{{ homarr_version | regex_replace('^v', '') | split('.') | first | int }}"
      # 2.x declarative boards (homarr_boards.py); empty keeps the 1.x tiles.
      boards: "{{ homarr_boards }}"
      widgets: "{{ homarr_widgets }}"
      integrations: "{{ homarr_integrations + homarr_proxmox_integration }}"
      board:
        name: "{{ homarr_board_name }}"
        # Every fronted service, UI and API alike — the converger places each
        # into the matching Category section (see homarr_api.py:sync_board),
        # UI first. Homarr used to get only the UI half; the operator wants
        # every URL clickable from every board, API included.
        apps: "{{ dashboard_catalog_services }}"
  register: homarr_api_result
  # `no_log` is required here — the spec on stdin carries every credential —
  # but it also censors the failure, which turns any bug into "Module failed"
  # with no cause. So this task never fails on its own; the next one reports
  # the reason. The converger writes only diagnostics to stderr, never secrets,
  # which is what makes surfacing it safe.
  failed_when: false
  changed_when:
    - homarr_api_result.rc == 0
    - (homarr_api_result.stdout | from_json).changed | bool
  no_log: true

- name: Surface a converger failure with its reason
  ansible.builtin.fail:
    msg: "homarr-api failed (rc={{ homarr_api_result.rc }}): {{ homarr_api_result.stderr | default('no stderr') }}"
  when:
    - not ansible_check_mode
    - homarr_api_result.rc != 0

# Under --check the converger is skipped, so it has no output to report or publish.
- name: Report what the converger did
  ansible.builtin.debug:
    msg: "{{ (homarr_api_result.stdout | from_json).actions }}"
  when: not ansible_check_mode

# Every integration always renders — see homarr_integrations in defaults —
# so a missing credential never disappears; it surfaces above as Homarr's
# own rejection, named here once so it can't go unnoticed in the action list.
- name: Warn when an integration has no credential resolved
  ansible.builtin.debug:
    msg: >-
      {%- set _missing = [] -%}
      {%- for i in (homarr_integrations + homarr_proxmox_integration) -%}
      {%-   if i.secrets | selectattr('value', 'eq', '') | list | length > 0 -%}
      {%-     set _ = _missing.append(i.name) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- if _missing -%}
      WARNING: no credential resolved for: {{ _missing | join(', ') }}. Each
      still renders on the board; Homarr's own rejection is in the action
      list above.{%- else -%}
      Every integration has a credential.{%- endif %}

- name: Publish the Homarr API key to OpenBao
  ansible.builtin.include_role:
    name: dryvist.homelab.openbao_secrets
    tasks_from: publish.yml
  vars:
    openbao_secrets_publish_app: "{{ homarr_instance }}"
    openbao_secrets_publish_reason: (API key issued by Homarr)
    openbao_secrets_publish_data: >-
      {{ {homarr_secret_prefix ~ '_api_key': (homarr_api_result.stdout | from_json).api_key} }}
  when:
    - not ansible_check_mode
    - homarr_publish_credentials | bool
