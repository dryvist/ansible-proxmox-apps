---
# --- Board tiles ---------------------------------------------------------------
# One bookmark "app" tile per fronted route (dashboard_catalog_services, every
# row) — same catalog Glance and Homepage already render from, so a new
# fronted service appears here too without a second list to maintain. Placed
# into one of two Category sections by `ui` (see homarr_api.py:sync_board),
# UI first. Homarr seeds a board named "default" on first launch; a
# differently-named board is created by hand first.
homarr_board_name: default

# --- Integrations -------------------------------------------------------------
# Every URL here is a direct guest FQDN:port. Never a `*.pve.` name.
#
# `kind` and the `secrets[].kind` values are Homarr's own vocabulary
# (packages/validation/src/integration.ts). Homarr connection-TESTS on create
# and update and refuses to persist a failing one, so a row existing is proof
# the credential works — that server-side test is the verification, and this
# role deliberately adds no second health check of its own.
#
# Excluded on purpose, so their absence reads as a decision and not an
# oversight: prowlarr / qbittorrent (the download-vpn guest refuses connections
# on its admin ports from every host tested — a pre-existing fault, tracked
# separately) and Home Assistant (reachable, but no long-lived token is managed
# anywhere in the estate yet).
#
# Every URL displays always: an app is always in the list below, key or no
# key. OpenBao not yet seeding one shows up as a visible rejection on the
# board, never a row that silently isn't there. Proxmox (below) keeps its
# own var — its secret shape (token + realm) is not a single api_key.
homarr_radarr_api_key: ""
homarr_seerr_api_key: ""
homarr_plex_token: ""
homarr_sonarr_api_key: ""
homarr_proxmox_ca: ""

# Jellyseerr's public route is SSO-gated, including its API path. Build the
# backend URL from the shared catalog and the published service port instead.
homarr_seerr_endpoint: >-
  {{ 'http://'
     ~ (dashboard_catalog_services
        | selectattr('name', 'equalto', 'seerr')
        | map(attribute='fqdn') | first)
     ~ ':' ~ tofu_data.constants.media_ports.seerr_web }}

homarr_media_integration_candidates:
  - name: Radarr
    kind: radarr
    url: "https://radarr.{{ ingress_domain }}"
    secrets:
      - kind: apiKey
        value: "{{ homarr_radarr_api_key }}"
  # The public route is SSO-gated and cannot take an Authelia bypass because
  # its sign-in and session routes share the /api prefix. The service FQDN and
  # port come from the shared dashboard catalog and published inventory.
  - name: Jellyseerr
    kind: jellyseerr
    url: "{{ homarr_seerr_endpoint }}"
    secrets:
      - kind: apiKey
        value: "{{ homarr_seerr_api_key }}"
  - name: Plex
    kind: plex
    url: "https://plex.{{ ingress_domain }}"
    secrets:
      - kind: apiKey
        value: "{{ homarr_plex_token }}"
  - name: Sonarr
    kind: sonarr
    url: "https://sonarr.{{ ingress_domain }}"
    secrets:
      - kind: apiKey
        value: "{{ homarr_sonarr_api_key }}"

# Always rendered, key or no key — an empty secret is a visible, reported
# rejection (roles/homarr/files/homarr_api.py:sync_integrations), never a
# silently omitted row. roles/homarr/tasks/integrations.yml warns by name
# at the end of the play for whichever ones have no credential.
homarr_integrations: "{{ homarr_media_integration_candidates }}"

# Proxmox is a SEPARATE, audit-scoped token — never the Terraform provider's
# write-capable credential, because Homarr copies every secret it is handed
# into its own SQLite.
#
# The endpoint is derived, never a pinned node name. `ansible_host` for an LXC
# is already its own node's management FQDN ({node-role}.{domain}, see
# inventory/load_tofu/add_lxc_hosts.yml), and any cluster member answers for the
# whole cluster — so this follows the guest if it is ever migrated.
homarr_proxmox_endpoint: >-
  https://{{ ansible_host }}:{{ tofu_data.constants.service_ports.proxmox_web }}
homarr_proxmox_token_id: ""
homarr_proxmox_token_secret: ""

# The token id is the full identity `user@realm!tokenname` (the same shape
# roles/prometheus_pve_exporter documents). Homarr's proxmox kind wants the
# three parts as separate secrets, plus the token value as `apiKey`.
homarr_proxmox_token_parts: >-
  {{ (homarr_proxmox_token_id | regex_findall('^([^@]+)@([^!]+)!(.+)$') | first)
     | default(['', '', ''], true) }}

# Always rendered too, same rule as the media candidates above.
homarr_proxmox_integration:
  - name: Proxmox
    kind: proxmox
    url: "{{ homarr_proxmox_endpoint }}"
    secrets:
      - kind: username
        value: "{{ homarr_proxmox_token_parts[0] }}"
      - kind: tokenId
        value: "{{ homarr_proxmox_token_parts[2] }}"
      - kind: apiKey
        value: "{{ homarr_proxmox_token_secret }}"
      - kind: realm
        value: "{{ homarr_proxmox_token_parts[1] }}"

# Gatus (a 2.x integration kind) needs no credential. Homarr reads its status
# API from the status guest directly, because the fronted route is gated; the
# catalog row's probe_url is that direct address.
homarr_gatus_integration:
  - name: Gatus
    kind: gatus
    url: >-
      {{ dashboard_catalog_services | selectattr('name', 'eq', 'gatus')
         | map(attribute='probe_url') | first | default('', true) }}
    secrets: []
