---
- name: Reload systemd and clear failed units
  # reset-failed matters as much as the reload here. systemd rate-limits
  # restarts, so a unit that already failed five times stays in
  # "start request repeated too quickly" and will not come up just because the
  # drop-in that fixes it arrived.
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - systemctl daemon-reload
    - systemctl reset-failed redis-server.service
  changed_when: true
  failed_when: false

- name: Restart Homarr
  ansible.builtin.systemd_service:
    name: "{{ homarr_service_name }}"
    state: restarted
  # The API tasks that follow flush this handler and then talk to the port, so
  # a restart that has not finished would surface as a connection refusal.
  # wait_for below is cheaper than debugging that once.
  notify: Wait for Homarr to answer again

- name: Wait for Homarr to answer again
  ansible.builtin.wait_for:
    port: "{{ homarr_port }}"
    host: 127.0.0.1
    timeout: 120
