---
galaxy_info:
  author: ansible-proxmox-apps
  description: >-
    Deploy the pinned GitHub Actions Prometheus exporter beside the metrics
    store, with its read-only API token supplied through OpenBao.
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - github
    - actions
    - prometheus
    - metrics
    - monitoring

dependencies:
  - role: docker_engine
    docker_engine_configure_daemon_json: true
