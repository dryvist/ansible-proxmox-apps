---
# Pin the third-party Prometheus exporter to an immutable release tag.
# renovate: datasource=docker depName=ghcr.io/drumandbytes/github-actions-runner-exporter
github_actions_exporter_image: "ghcr.io/drumandbytes/github-actions-runner-exporter:v1.4.1"
github_actions_exporter_container_name: github-actions-runner-exporter
github_actions_exporter_port: 9222
github_actions_exporter_data_dir: /opt/github-actions-runner-exporter

# The organization is supplied by inventory; keep its value out of this role.
github_actions_exporter_org: ""

# OpenBao publishes the field in bao_apps_secrets. The environment fallback
# matches the existing exporter role convention for local or gated runs.
github_actions_exporter_token: >-
  {{ bao_apps_secrets.github_actions_exporter_token
     | default(lookup('env', 'GITHUB_ACTIONS_EXPORTER_TOKEN'), true) }}
