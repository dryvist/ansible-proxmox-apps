---
# UniFi Insights (UniFi-Insights-Plus) runs as one Docker container on the
# unifi-insights VM. The published image is the only vendor-shipped form.

# renovate: datasource=docker depName=ghcr.io/jmasarweh/unifi-log-insight
unifi_insights_docker_image: >-
  {{ 'ghcr.io/jmasarweh/unifi-log-insight:3.7.2@sha256:'
     ~ 'c1e68d7028cd308e7bb2c50a89f8574cf4dc0e8414ee6e9db1059c9f1aaaae7a' }}

unifi_insights_docker_data_dir: /opt/unifi-insights
unifi_insights_docker_restart_policy: unless-stopped

# Host ports are published by tofu-proxmox; container ports follow the image.
unifi_insights_docker_web_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['unifi_insights_web']
     | mandatory('tofu_data.constants.service_ports.unifi_insights_web missing') }}
unifi_insights_docker_syslog_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['unifi_insights_syslog']
     | mandatory('tofu_data.constants.service_ports.unifi_insights_syslog missing') }}
unifi_insights_docker_web_container_port: 8000
unifi_insights_docker_syslog_container_port: 514

# Application settings. Secrets and the controller address come from the apps
# OpenBao prefetch in inventory/group_vars/unifi_insights.yml.
unifi_insights_docker_tz: UTC
unifi_insights_docker_log_level: INFO
unifi_insights_docker_unifi_site: default
unifi_insights_docker_unifi_verify_ssl: "true"
# The app's own login stays on; the Traefik gate is a second layer.
unifi_insights_docker_auth_enabled: "true"
