---
# One Docker container for UniFi Insights. The role stops before rendering
# anything when a required OpenBao value is absent.

- name: Validate UniFi Insights required secrets
  ansible.builtin.assert:
    that:
      - unifi_insights_docker_postgres_password | length > 0
      - unifi_insights_docker_secret_key | length > 0
    fail_msg: >-
      UniFi Insights needs unifi_insights_postgres_password and
      unifi_insights_secret_key in the apps OpenBao domain. Seed both before
      converging this role.
    quiet: true
  no_log: true

- name: Create UniFi Insights deployment directory
  ansible.builtin.file:
    path: "{{ unifi_insights_docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the UniFi Insights MaxMind directory
  ansible.builtin.file:
    path: "{{ unifi_insights_docker_data_dir }}/maxmind"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render UniFi Insights docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ unifi_insights_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart UniFi Insights

- name: Deploy UniFi Insights via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ unifi_insights_docker_data_dir }}"
    state: present
    remove_orphans: true
  no_log: true

- name: Wait for UniFi Insights web port to accept TCP connections
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ unifi_insights_docker_web_port }}"
    timeout: 220
  changed_when: false
