---
# n8n Docker deployment.
#
# Installs Docker + Compose on the target LXC, resolves the N8N_ENCRYPTION_KEY,
# then deploys the n8nio/n8n image via Docker Compose against the shared
# PostgreSQL cluster. Sets up the instance owner and seeds a minimal "hello"
# workflow via the LiteLLM router.
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: n8n deploys via docker_compose_v2, which uses the docker compose CLI
# (not the docker SDK), so compose runs under the system interpreter.

# =============================================================================
# Data Directories
# n8n runs as `node` (uid 1000) and CANNOT chown its own home, so the .n8n
# mount is chowned to 1000:1000 up front.
# =============================================================================

- name: Create n8n data directory
  ansible.builtin.file:
    path: "{{ n8n_docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create n8n app home (.n8n) + seed subdir owned by the container's node uid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ n8n_docker_app_uid }}"
    group: "{{ n8n_docker_app_gid }}"
    mode: "0755"
  loop:
    - "{{ n8n_docker_app_data_dir }}"
    - "{{ n8n_docker_seed_dir }}"

# =============================================================================
# N8N_ENCRYPTION_KEY
# =============================================================================
# The key that decrypts every credential stored in the database. The secrets
# registry generates it into OpenBao (supplied here as n8n_docker_encryption_key).
# This role never generates it: the stored field is authoritative, and the
# on-guest file is rendered from it.

- name: Check for the on-guest n8n encryption key
  ansible.builtin.stat:
    path: "{{ n8n_docker_encryption_key_path }}"
  register: n8n_docker_encryption_key_stat

- name: Read the on-guest n8n encryption key
  ansible.builtin.slurp:
    src: "{{ n8n_docker_encryption_key_path }}"
  register: n8n_docker_encryption_key_file
  when: n8n_docker_encryption_key_stat.stat.exists
  no_log: true

# The encryption key is generated by the secrets registry, never by this role. Deploying without
# it would make every credential already stored in the database permanently undecryptable, so an
# absent field fails the converge. The on-guest file is rendered from the stored field.
- name: Assert the stored n8n encryption key is present
  ansible.builtin.assert:
    that:
      - n8n_docker_encryption_key | length > 0
    fail_msg: >-
      n8n_encryption_key is absent from the apps OpenBao path. The secrets registry generates it:
      run the registry for apps/n8n, then converge this role again. Nothing is generated here.
    quiet: true

- name: Require the on-guest n8n key to match the stored field
  ansible.builtin.assert:
    that:
      - >-
        not n8n_docker_encryption_key_stat.stat.exists
        or (n8n_docker_encryption_key_file.content | b64decode | trim) == n8n_docker_encryption_key
    fail_msg: "n8n encryption key file differs from the stored field n8n_encryption_key"
  no_log: true

- name: Render the n8n encryption key from the stored field
  ansible.builtin.copy:
    content: "{{ n8n_docker_encryption_key }}"
    dest: "{{ n8n_docker_encryption_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# =============================================================================
# Compose File + seed workflow
# =============================================================================

- name: Render n8n docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ n8n_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains encryption key + DB password
  no_log: true
  notify: Restart n8n

- name: Install seed workflow
  # Static JSON — every value resolves from n8n {{ '$env' }} at runtime, so there
  # are no Ansible vars to template (and no Jinja/{{ '{{ }}' }} conflict to escape).
  ansible.builtin.copy:
    src: seed-hello-workflow.json
    dest: "{{ n8n_docker_seed_dir }}/hello.json"
    owner: "{{ n8n_docker_app_uid }}"
    group: "{{ n8n_docker_app_gid }}"
    mode: "0644"
  when: n8n_docker_seed_workflow

# =============================================================================
# Deploy via Docker Compose
# =============================================================================

- name: Deploy n8n via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_docker_data_dir }}"
    state: present
  register: n8n_docker_compose_result
  changed_when: >-
    (n8n_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# =============================================================================
# Health Check
# First boot can take a couple of minutes: postgres initdb, then n8n running its
# database migrations against the fresh DB before /healthz answers 200.
#
# 220s, not 300: task_timeout (ansible.cfg) is 240 and wraps this whole
# wait_for call as one attempt. Above 240 the two race — ansible-core's
# blunter task_timeout kill could fire before wait_for's own clean timeout
# error, depending on scheduler jitter. 220 leaves wait_for's own message
# room to win that race deterministically.
# =============================================================================

- name: Wait for n8n web port to accept TCP connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ n8n_docker_web_port }}"
    timeout: 220

- name: Verify n8n /healthz endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_docker_web_port }}/healthz"
    method: GET
    status_code: 200
  register: n8n_docker_health
  retries: 30
  delay: 10
  until: n8n_docker_health.status == 200
  check_mode: false
  when: >-
    not ansible_check_mode or
    (
      not (n8n_docker_compose_result.skipped | default(false)) and
      (n8n_docker_compose_result.actions | default([]) | length == 0)
    )
  changed_when: false

# =============================================================================
# Instance owner (idempotent — only when the setup wizard is still pending)
# =============================================================================

- name: Read n8n frontend settings (owner-setup state)
  # /healthz answers 200 slightly before the REST router finishes mounting, so
  # this can 404 for a few seconds even after the port-accepting/healthz waits
  # above pass. Retry with the same backoff as the healthz check.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_docker_web_port }}/rest/settings"
    method: GET
    status_code: 200
  register: n8n_docker_settings
  retries: 12
  delay: 5
  until: n8n_docker_settings.status == 200
  check_mode: false
  when: >-
    not ansible_check_mode or
    (
      not (n8n_docker_compose_result.skipped | default(false)) and
      (n8n_docker_compose_result.actions | default([]) | length == 0)
    )
  changed_when: false

- name: Create the n8n instance owner (first run only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_docker_web_port }}/rest/owner/setup"
    method: POST
    body_format: json
    body:
      email: "{{ n8n_docker_owner_email }}"
      firstName: "{{ n8n_docker_owner_firstname }}"
      lastName: "{{ n8n_docker_owner_lastname }}"
      password: "{{ n8n_docker_owner_password }}"
    status_code: [200, 201]
  when: >-
    n8n_docker_settings.json.data.userManagement.showSetupOnFirstLoad | default(false)
  no_log: true

# =============================================================================
# Seed workflow (idempotent via a marker file; import is best-effort/non-fatal)
# =============================================================================

- name: Check for the seed-import marker
  ansible.builtin.stat:
    path: "{{ n8n_docker_data_dir }}/.seed_imported"
  register: n8n_docker_seed_marker
  when: n8n_docker_seed_workflow

- name: Import the seed workflow (first run only)
  ansible.builtin.command:
    cmd: >-
      docker exec {{ n8n_docker_container_name }}
      n8n import:workflow --input={{ n8n_docker_app_internal_data }}/seed/hello.json
  register: n8n_docker_seed_import
  changed_when: n8n_docker_seed_import.rc == 0
  failed_when: false
  when:
    - n8n_docker_seed_workflow
    - not n8n_docker_seed_marker.stat.exists

- name: Record the seed-import marker
  ansible.builtin.copy:
    dest: "{{ n8n_docker_data_dir }}/.seed_imported"
    content: "imported {{ ansible_facts['date_time']['iso8601'] | default('unknown') }}\n"
    owner: root
    group: root
    mode: "0644"
  when:
    - n8n_docker_seed_workflow
    - not n8n_docker_seed_marker.stat.exists
    - n8n_docker_seed_import.rc | default(1) == 0
