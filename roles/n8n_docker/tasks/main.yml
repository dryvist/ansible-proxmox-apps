---
# n8n Docker deployment.
#
# Installs Docker + Compose on the target LXC, resolves the N8N_ENCRYPTION_KEY,
# then deploys the n8nio/n8n image via Docker Compose against the shared
# PostgreSQL cluster. Sets up the instance owner and seeds a minimal "hello"
# workflow via the LiteLLM router.
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: n8n deploys via docker_compose_v2, which uses the docker compose CLI
# (not the docker SDK), so compose runs under the system interpreter.

# =============================================================================
# Data Directories
# n8n runs as `node` (uid 1000) and CANNOT chown its own home, so the .n8n
# mount is chowned to 1000:1000 up front.
# =============================================================================

- name: Create n8n data directory
  ansible.builtin.file:
    path: "{{ n8n_docker_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create n8n app home (.n8n) + seed subdir owned by the container's node uid
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ n8n_docker_app_uid }}"
    group: "{{ n8n_docker_app_gid }}"
    mode: "0755"
  loop:
    - "{{ n8n_docker_app_data_dir }}"
    - "{{ n8n_docker_seed_dir }}"

# =============================================================================
# N8N_ENCRYPTION_KEY
# =============================================================================
# The key that decrypts every credential stored in the database. Order of
# authority: the secret store (supplied as n8n_docker_encryption_key), then the
# generate-once file on the guest.
#
# The file remains the greenfield bootstrap, but it is NOT the durable home: a
# key that lives only beside the data it unlocks is lost with that guest, and a
# database restored without it yields workflows whose credentials cannot be
# recovered — while reporting success. Once the secret store holds the key it
# wins, and the on-guest copy is only a local fallback.

- name: Check for the on-guest n8n encryption key
  ansible.builtin.stat:
    path: "{{ n8n_docker_encryption_key_path }}"
  register: n8n_docker_encryption_key_stat

- name: Generate an n8n encryption key on the guest (greenfield bootstrap only)
  ansible.builtin.copy:
    dest: "{{ n8n_docker_encryption_key_path }}"
    # 48 alphanumeric chars. Character set specified by unambiguous boolean flags
    # rather than the password lookup's implicit keyword expansion.
    content: >-
      {{ lookup('community.general.random_string',
                length=48,
                upper=true, lower=true, numbers=true,
                special=false) }}
    owner: root
    group: root
    mode: "0600"
  when:
    - not n8n_docker_encryption_key_stat.stat.exists
    - n8n_docker_encryption_key | length == 0
  no_log: true

- name: Re-check for the on-guest n8n encryption key
  ansible.builtin.stat:
    path: "{{ n8n_docker_encryption_key_path }}"
  register: n8n_docker_encryption_key_stat

- name: Read the on-guest n8n encryption key into memory
  ansible.builtin.slurp:
    src: "{{ n8n_docker_encryption_key_path }}"
  register: n8n_docker_encryption_key_file
  when: n8n_docker_encryption_key_stat.stat.exists
  no_log: true

- name: Resolve the effective encryption key (secret store, then on-guest file)
  ansible.builtin.set_fact:
    n8n_docker_encryption_key: >-
      {{ n8n_docker_encryption_key
         if n8n_docker_encryption_key | length > 0
         else ((n8n_docker_encryption_key_file.content | default('') | b64decode | trim)
               if n8n_docker_encryption_key_stat.stat.exists else '') }}
  no_log: true

# Deploying with an empty key is the one failure this role must never convert
# into a silent success: n8n would come up, re-encrypt under an empty key, and
# every credential already in the database would become unreadable. Everything
# about that looks healthy — the container is up, /healthz answers 200, the
# workflows are listed — until a workflow actually runs.
- name: Assert an encryption key resolved
  ansible.builtin.assert:
    that:
      - n8n_docker_encryption_key | length > 0
    fail_msg: >-
      No n8n encryption key resolved from the secret store or the guest.
      Deploying without it would make every credential already stored in the
      database permanently undecryptable. Re-run under the secrets environment
      so the apps domain is fetched, or restore the guest's key file — do NOT
      let this converge proceed with a freshly generated value.
    quiet: true

# Back the key up into OpenBao, which the comment above already names as the
# durable home. Until the key is there, the greenfield bootstrap file beside the
# database is the only copy, and a database restored without it yields workflows
# whose credentials cannot be decrypted. The field is the app-namespaced
# `n8n_encryption_key` that inventory/group_vars/n8n_group.yml already reads, so
# a published key wins on the next converge.
- name: Publish the n8n encryption key to OpenBao
  ansible.builtin.include_role:
    name: openbao_secrets
    tasks_from: publish.yml
  vars:
    openbao_secrets_publish_app: n8n
    openbao_secrets_publish_reason: (credential-store encryption key)
    openbao_secrets_publish_data:
      n8n_encryption_key: "{{ n8n_docker_encryption_key }}"

# =============================================================================
# Compose File + seed workflow
# =============================================================================

- name: Render n8n docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ n8n_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains encryption key + DB password
  no_log: true
  notify: Restart n8n

- name: Install seed workflow
  # Static JSON — every value resolves from n8n {{ '$env' }} at runtime, so there
  # are no Ansible vars to template (and no Jinja/{{ '{{ }}' }} conflict to escape).
  ansible.builtin.copy:
    src: seed-hello-workflow.json
    dest: "{{ n8n_docker_seed_dir }}/hello.json"
    owner: "{{ n8n_docker_app_uid }}"
    group: "{{ n8n_docker_app_gid }}"
    mode: "0644"
  when: n8n_docker_seed_workflow

# =============================================================================
# Deploy via Docker Compose
# =============================================================================

- name: Deploy n8n via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_docker_data_dir }}"
    state: present
  register: n8n_docker_compose_result
  changed_when: >-
    (n8n_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# =============================================================================
# Health Check
# First boot can take a couple of minutes: postgres initdb, then n8n running its
# database migrations against the fresh DB before /healthz answers 200.
# =============================================================================

- name: Wait for n8n web port to accept TCP connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ n8n_docker_web_port }}"
    timeout: 300

- name: Verify n8n /healthz endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_docker_web_port }}/healthz"
    method: GET
    status_code: 200
  register: n8n_docker_health
  retries: 30
  delay: 10
  until: n8n_docker_health.status == 200
  changed_when: false

# =============================================================================
# Instance owner (idempotent — only when the setup wizard is still pending)
# =============================================================================

- name: Read n8n frontend settings (owner-setup state)
  # /healthz answers 200 slightly before the REST router finishes mounting, so
  # this can 404 for a few seconds even after the port-accepting/healthz waits
  # above pass. Retry with the same backoff as the healthz check.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_docker_web_port }}/rest/settings"
    method: GET
    status_code: 200
  register: n8n_docker_settings
  retries: 12
  delay: 5
  until: n8n_docker_settings.status == 200
  changed_when: false

- name: Create the n8n instance owner (first run only)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ n8n_docker_web_port }}/rest/owner/setup"
    method: POST
    body_format: json
    body:
      email: "{{ n8n_docker_owner_email }}"
      firstName: "{{ n8n_docker_owner_firstname }}"
      lastName: "{{ n8n_docker_owner_lastname }}"
      password: "{{ n8n_docker_owner_password }}"
    status_code: [200, 201]
  when: >-
    n8n_docker_settings.json.data.userManagement.showSetupOnFirstLoad | default(false)
  no_log: true

# =============================================================================
# Seed workflow (idempotent via a marker file; import is best-effort/non-fatal)
# =============================================================================

- name: Check for the seed-import marker
  ansible.builtin.stat:
    path: "{{ n8n_docker_data_dir }}/.seed_imported"
  register: n8n_docker_seed_marker
  when: n8n_docker_seed_workflow

- name: Import the seed workflow (first run only)
  ansible.builtin.command:
    cmd: >-
      docker exec {{ n8n_docker_container_name }}
      n8n import:workflow --input={{ n8n_docker_app_internal_data }}/seed/hello.json
  register: n8n_docker_seed_import
  changed_when: n8n_docker_seed_import.rc == 0
  failed_when: false
  when:
    - n8n_docker_seed_workflow
    - not n8n_docker_seed_marker.stat.exists

- name: Record the seed-import marker
  ansible.builtin.copy:
    dest: "{{ n8n_docker_data_dir }}/.seed_imported"
    content: "imported {{ ansible_date_time.iso8601 | default('unknown') }}\n"
    owner: root
    group: root
    mode: "0644"
  when:
    - n8n_docker_seed_workflow
    - not n8n_docker_seed_marker.stat.exists
    - n8n_docker_seed_import.rc | default(1) == 0
