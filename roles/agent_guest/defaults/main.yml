---
# Autonomous AI agent guest: converges a pooled Debian LXC into a host that
# runs headless CLI agent tasks off a queue. The LXC (disposable, rebuilt from
# IaC) is the isolation boundary here — the same role the container plays for
# roles/agent_sandbox.

# --- Identity ---------------------------------------------------------------
# uid 1000 matches the transcript paths baked by the nix-ai autonomous render
# (homeDir=/home/agent). No sudo: the runner never needs root, and a task that
# thinks it does is a bug to fix upstream, not a privilege to grant.
agent_guest_user: agent
agent_guest_uid: 1000
agent_guest_home: "/home/{{ agent_guest_user }}"
agent_guest_config_dir: /etc/agent-guest

# --- CLI toolchain ----------------------------------------------------------
# Versions unpinned on purpose (AGENTS.md "Version management"): the three agent
# CLIs ship breaking-fast and the newest stable is the supported one. Only
# gitleaks carries a version, because it is a GitHub release tarball with no apt
# channel — Renovate keeps it fresh.
agent_guest_apt_packages:
  - ca-certificates
  - curl
  - git
  - gpg          # apt_repository needs a gpg binary on minimal LXC templates
  - jq
  - nodejs
  - npm
  - ripgrep
  - tar
agent_guest_npm_clis:
  - "@anthropic-ai/claude-code"
  - "@openai/codex"
  - "@google/gemini-cli"
agent_guest_gh_keyring: /etc/apt/keyrings/githubcli.asc
agent_guest_gitleaks_version: "8.30.0"
agent_guest_gitleaks_url: >-
  https://github.com/gitleaks/gitleaks/releases/download/v{{
  agent_guest_gitleaks_version }}/gitleaks_{{ agent_guest_gitleaks_version
  }}_linux_x64.tar.gz

# --- Autonomous config mirror ----------------------------------------------
# Committed mirror of dryvist/nix-ai `profiles.autonomous.residualDeny` — that
# repo is the source of truth for all three tools' deny policy. Regenerate with:
#   nix eval github:dryvist/nix-ai#lib.profiles.autonomous.residualDeny --json
#
# This ONE list is what nix-ai's three renderers consume, so it is what this
# role mirrors — not their five rendered outputs. The templates below reproduce
# each tool's native format from it (Claude `Bash(<prefix> *)` deny entries,
# Codex `prefix_rule` tokens, Gemini Policy-Engine `commandPrefix` rules),
# exactly as `nix eval github:dryvist/nix-ai#lib.renderAutonomous` does.
agent_guest_residual_deny:
  - gh repo delete
  - gh repo archive
  - gh repo edit
  - gh secret
  - gh variable
  - gh release delete
  - gh auth
  - gh api -X DELETE
  - gh api --method DELETE
  - git push --force
  - git push -f
  - git push --delete
  - npm publish
  - cargo publish

# Claude Code enforces permissions.deny even under bypassPermissions, so the
# residual deny is real protection here, not decoration.
agent_guest_claude_settings:
  $schema: https://json.schemastore.org/claude-code-settings.json
  permissions:
    allow: []
    ask: []
    defaultMode: bypassPermissions
    deny: >-
      {{ agent_guest_residual_deny | map('regex_replace', '^(.*)$', 'Bash(\1 *)') | list }}

# Gemini's own container sandbox is off — the LXC is already the boundary.
agent_guest_gemini_policy_path: "{{ agent_guest_home }}/.gemini/policies/autonomous.toml"
agent_guest_gemini_settings:
  $schema: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/schemas/settings.schema.json
  general:
    defaultApprovalMode: yolo
  policyPaths:
    - "{{ agent_guest_gemini_policy_path }}"
  tools:
    sandbox: false

# --- Task queue -------------------------------------------------------------
# v0 stub: the queue is an S3/RustFS bucket, addressed as a plain s3:// URI so
# the runner needs only the aws CLI already used by the inventory resolver.
# Layout under the URI, and the claim contract, are in templates/agent-task-run.sh.j2.
agent_guest_queue_url: ""
agent_guest_queue_poll_interval: 2min
# Per-task wall clock ceiling. A wedged CLI is killed, not left holding a lease.
agent_guest_task_max_sec: 3600
agent_guest_task_default_base: develop
agent_guest_runner_bin: /usr/local/bin/agent-task-run
agent_guest_queue_poll_bin: /usr/local/bin/agent-queue-poll

# --- OpenBao Agent (process-supervisor mode) --------------------------------
# The task runner never holds a static credential: `bao agent` authenticates
# with the guest's own AppRole, renders GITHUB_TOKEN (github secrets engine —
# never a KV PAT, see .claude/rules/openbao-plugins-first.md) into the child
# process environment, and execs the runner as its supervised child.
# Keep in sync with roles/openbao `openbao_version` (one client, one estate).
agent_guest_openbao_version: "2.5.5"
agent_guest_openbao_deb_url: >-
  https://github.com/openbao/openbao/releases/download/v{{
  agent_guest_openbao_version }}/openbao_{{ agent_guest_openbao_version
  }}_linux_amd64.deb
agent_guest_bao_bin: /usr/bin/bao
# AppRole credentials are seeded out of band into this dir (0700 root); the role
# creates it but never writes a secret into it. See README.
agent_guest_approle_dir: "{{ agent_guest_config_dir }}/approle"
agent_guest_bao_addr: >-
  https://openbao.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN environment variable is required (Doppler)') }}
# GitHub App installation token set minted per task. Read-tier by default; a
# write lease is the task runner's own `gh` call, not a standing grant.
agent_guest_github_token_path: github/token/agent-guest
# Claude's long-lived headless token (KV v2 — note the data/ infix). Seeded by
# the operator token runbook; codex/gemini auth files are seeded out of band
# beside the AppRole creds (they self-refresh; env_template cannot render files).
agent_guest_claude_token_path: secret/data/ai/saas/claude

# --- CLI trace telemetry (OTLP -> Cribl Stream -> Langfuse + Splunk) ---------
# One endpoint, Cribl forks. http/protobuf is load-bearing: Cribl in_otel and
# Langfuse are both HTTP-only — grpc silently fails. Claude spans are beta and
# need both CLAUDE_CODE_* flags. GEMINI_CLI_TRUST_WORKSPACE skips the headless
# folder-trust prompt. Never add ANTHROPIC_API_KEY here — it outranks
# CLAUDE_CODE_OAUTH_TOKEN in claude's auth precedence and flips billing.
agent_guest_otel_endpoint: >-
  https://otel.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN environment variable is required (Doppler)') }}
agent_guest_task_env:
  CLAUDE_CODE_ENABLE_TELEMETRY: "1"
  CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ agent_guest_otel_endpoint }}"
  GEMINI_CLI_TRUST_WORKSPACE: "true"
# Codex reads trace config from config.toml, not OTEL_* env. Off until the
# [otel] TOML schema is verified against the installed codex at canary — a
# config.toml parse error would kill every codex task.
agent_guest_codex_otel_enabled: false

# --- Transcript shipping (standalone Cribl Edge) ----------------------------
# The three CLIs write their transcripts under the agent's home. A per-guest
# Cribl Edge tails them and ships to the HAProxy-fronted Stream frontends.
# Journal is NOT duplicated here — roles/syslog_forwarder already ships this
# guest's journal estate-wide (index=os).
# Keep the version in sync with roles/cribl_edge `cribl_edge_version`.
agent_guest_cribl_version: "4.12.2"
agent_guest_cribl_tarball_url: >-
  https://cdn.cribl.io/dl/{{ agent_guest_cribl_version }}/cribl-{{
  agent_guest_cribl_version }}-linux-x64.tgz
agent_guest_cribl_install_dir: /opt/cribl
agent_guest_cribl_user: cribl
agent_guest_cribl_group: cribl
agent_guest_cribl_service_name: cribl-edge
# Destination: the stable `syslog` CNAME -> HAProxy, which balances the Cribl
# Stream per-CLI frontends (same target roles/syslog_forwarder uses). FQDN only.
agent_guest_cribl_stream_host: >-
  syslog.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN environment variable is required (Doppler)') }}
# Ports come from the tofu `ai_log_routing` constant — never a literal here.
agent_guest_log_routing: >-
  {{ hostvars['localhost']['tofu_data']['constants']['ai_log_routing'] }}
agent_guest_cribl_ports:
  claude: "{{ agent_guest_log_routing['claude_code']['port'] }}"
  codex: "{{ agent_guest_log_routing['codex_cli']['port'] }}"
  gemini: "{{ agent_guest_log_routing['agy_cli']['port'] }}"
