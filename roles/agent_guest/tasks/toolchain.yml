---
# CLI toolchain for the agent user. The guest downloads directly from
# github.com rather than via the controller-staging pattern the openbao/minio
# roles use: an agent guest clones repos and opens PRs, so GitHub egress is a
# hard requirement of the workload, not something to design around.

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ agent_guest_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: "{{ agent_guest_gh_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add GitHub CLI apt key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: "{{ agent_guest_gh_keyring }}"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}
      signed-by={{ agent_guest_gh_keyring }}]
      https://cli.github.com/packages stable main
    state: present
    filename: github-cli

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

# Unpinned on purpose: the agent CLIs ship breaking-fast and the newest stable
# is the supported one (AGENTS.md "Version management"). The npm module compares
# against the registry, so a converge with nothing to upgrade reports no change.
- name: Install agent CLIs globally from npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  loop: "{{ agent_guest_npm_clis }}"

- name: Install gitleaks
  ansible.builtin.unarchive:
    src: "{{ agent_guest_gitleaks_url }}"
    dest: /usr/local/bin
    remote_src: true
    include:
      - gitleaks
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/gitleaks

- name: Install the OpenBao client (bao agent supervises every task)
  ansible.builtin.apt:
    deb: "{{ agent_guest_openbao_deb_url }}"
    state: present
