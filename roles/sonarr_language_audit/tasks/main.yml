---
# sonarr_language_audit — deploy the read-only audit script + its systemd
# timer. No Sonarr setting or connection is touched; the script only ever
# reads Sonarr's API.

- name: Install script dependencies (jq for API parsing, ffmpeg for the ffprobe fallback)
  ansible.builtin.apt:
    name:
      - jq
      - ffmpeg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the audio-language audit script
  ansible.builtin.template:
    src: sonarr-language-audit.sh.j2
    dest: "{{ sonarr_language_audit_bin_dir }}/{{ sonarr_language_audit_script_name }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy the audit systemd service unit
  ansible.builtin.template:
    src: sonarr-language-audit.service.j2
    dest: /etc/systemd/system/sonarr-language-audit.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for sonarr_language_audit

- name: Deploy the audit systemd timer unit
  ansible.builtin.template:
    src: sonarr-language-audit.timer.j2
    dest: /etc/systemd/system/sonarr-language-audit.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for sonarr_language_audit

# Gated like every other role's live service management here — no running
# Sonarr to audit under Molecule/CI.
- name: Enable + start the audit timer
  ansible.builtin.systemd:
    name: sonarr-language-audit.timer
    state: started
    enabled: true
    daemon_reload: true
  when: sonarr_language_audit_manage_services | bool
