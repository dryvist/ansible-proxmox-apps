---
# Server-room wall: the homelab-wall static pages plus the homelab-wall-feed
# nginx gateway, both fetched as release assets and served by native nginx.
# Neither repo carries topology; this role supplies it (config.json, the
# metrics-query upstream).

# Org-wide pins (inventory/group_vars/all.yml, Renovate-managed).
wall_version: "{{ homelab_wall_version | default('latest', true) }}"
wall_feed_version: "{{ homelab_wall_feed_version | default('latest', true) }}"

wall_release_base: https://github.com/dryvist
wall_site_asset: homelab-wall-site.tar.gz
wall_feed_asset: homelab-wall-feed-nginx.tar.gz

wall_home: /var/lib/wall
wall_config_dir: /etc/wall
# Version-scoped so a bump unpacks fresh instead of reusing a stale tree.
wall_site_dir: "{{ wall_home }}/site/{{ wall_version }}"
wall_feed_dir: "{{ wall_home }}/feed/{{ wall_feed_version }}"

wall_port: >-
  {{ tofu_data.constants.service_ports.wall_web
     | mandatory('tofu_data.constants.service_ports.wall_web missing — regenerate the published inventory') }}

# VictoriaMetrics is the superset metrics store (fed by both the
# prometheus_stack remote_write and Cribl's native metric pipelines), so
# the gateway reads it instead of Prometheus directly — its
# Prometheus-compatible /api/v1/query means the gateway's proxy path needs
# no change. Derived exactly as grafana_stack derives its own
# infrastructure-metrics datasource address: the container carrying the
# `grafana` tag (grafana_stack co-locates VictoriaMetrics with Grafana in
# one compose project), never a literal. Var names kept (wall_prometheus_*)
# to avoid a wider rename across the role/templates/tests.
wall_prometheus_port: >-
  {{ tofu_data.constants.service_ports.victoriametrics | default(8428) }}
wall_prometheus_host: >-
  {{ (tofu_data['containers'] | default({}) | dict2items
      | selectattr('value.tags', 'defined')
      | selectattr('value.tags', 'contains', 'grafana')
      | map(attribute='value.ip', default='') | reject('equalto', '')
      | list | first) | default('', true) }}

# ClickHouse HTTP interface for the gateway's /api/words and /api/llm/recent
# proxies: the container carrying the `clickhouse` tag, resolved from the
# published inventory the same way cribl_stream's clickhouse_llm_* outputs
# derive theirs — never a literal host; the port is the published constant.
wall_clickhouse_http_port: >-
  {{ tofu_data.constants.service_ports.clickhouse_http
     | mandatory('tofu_data.constants.service_ports.clickhouse_http missing — regenerate the published inventory') }}
wall_clickhouse_host: >-
  {{ (tofu_data['containers'] | default({}) | dict2items
      | selectattr('value.tags', 'defined')
      | selectattr('value.tags', 'contains', 'clickhouse')
      | map(attribute='value.ip', default='') | reject('equalto', '')
      | list | first) | default('', true) }}

# nginx-light runs its workers as Debian's www-data; the ClickHouse auth
# include is readable by that group and root only.
wall_nginx_group: www-data

# Read-only ClickHouse credential for the gateway's /api/words and
# /api/llm/recent proxies; nginx adds it to each upstream request as
# X-ClickHouse-User/-Key, so the browser never carries one. The password is
# key WALL_READER_PASSWORD in the clickhouse-wall secret domain. No env
# fallback. When the domain was not fetched, the include answers 503 on the
# two ClickHouse routes instead of carrying an empty credential, so the rest
# of the wall keeps serving.
wall_clickhouse_password: >-
  {{ (bao_clickhouse_wall_secrets | default({})).WALL_READER_PASSWORD
     | default('', true) }}

wall_title: HOMELAB
wall_refresh_seconds: 15
# Non-PVE nodes shown as pending until their exporter exists:
# [{name: <instance short name>, role: <label>}]
wall_extra_nodes: []
# Extra rotator slides appended after the built-in MC1..MC6:
# [{name: <slide name>, route: <Traefik route name>, path: <optional>,
#   seconds: <optional>}]. config.json.j2 derives each URL as
# https://<route>.<ingress_domain><path>. Empty by default; the estate's list
# is in inventory/group_vars/all.yml, where it also drives the kiosk bypasses.
wall_slides: []
