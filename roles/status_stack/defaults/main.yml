---
# status_stack — Gatus + Uptime Kuma as ONE Docker-in-LXC compose project on
# the tofu `status` guest. Gatus is the catalog / OIDC / keystone synthetics
# SoR. Uptime Kuma is the operator status UI (no automated monitor sync —
# there is no maintained first-party Ansible API; duplicating Gatus into Kuma
# is not worth a sidecar or a stale collection).

# renovate: datasource=docker depName=ghcr.io/twin/gatus
status_stack_gatus_image: "ghcr.io/twin/gatus:v5.17.0"
status_stack_gatus_container_name: gatus

# renovate: datasource=docker depName=louislam/uptime-kuma
status_stack_kuma_image: "louislam/uptime-kuma:2.5.3"
status_stack_kuma_container_name: uptime-kuma

status_stack_data_dir: /opt/status-stack

status_stack_gatus_port: >-
  {{ tofu_data.constants.service_ports.gatus_web
     | mandatory('tofu_data.constants.service_ports.gatus_web missing — regenerate the published inventory') }}
status_stack_kuma_port: >-
  {{ tofu_data.constants.service_ports.uptime_kuma_web
     | mandatory('tofu_data.constants.service_ports.uptime_kuma_web missing — regenerate the published inventory') }}

# Universal cadence — every Gatus endpoint defaults to 60s.
status_stack_interval: "60s"

# Authelia OAuth error markers that must NEVER appear in a followed response
# body (Hermes-style invalid_client). Plain substring patterns for Gatus pat().
status_stack_authelia_error_patterns:
  - "invalid_client"
  - "Client authentication failed"
  - "OAuth 2.0 Client does not exist"

# OIDC client registration probes — client_id + redirect_uri pairs already
# declared in the authelia role. No secrets; authorize URL only.
status_stack_authelia_public_url: "https://authelia.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
status_stack_oidc_clients:
  - name: hermes-dashboard
    client_id: "{{ authelia_oidc_hermes_client_id | default('hermes-dashboard') }}"
    redirect_uri: >-
      {{ authelia_oidc_hermes_redirect_uri
         | default('https://hermes.' ~ lookup('env', 'PROXMOX_SUBDOMAIN')
                    ~ '/auth/callback') }}
  - name: hermes-donna-dashboard
    client_id: "{{ authelia_oidc_donna_client_id | default('hermes-donna-dashboard') }}"
    redirect_uri: >-
      {{ authelia_oidc_donna_redirect_uri
         | default('https://hermes-donna.' ~ lookup('env', 'PROXMOX_SUBDOMAIN')
                    ~ '/auth/callback') }}
  - name: homarr
    client_id: "{{ authelia_oidc_homarr_client_id | default('homarr') }}"
    redirect_uri: >-
      {{ authelia_oidc_homarr_redirect_uri
         | default('https://homarr.' ~ lookup('env', 'PROXMOX_SUBDOMAIN')
                    ~ '/api/auth/callback/oidc') }}
  - name: grafana
    client_id: "{{ authelia_oidc_grafana_client_id | default('grafana') }}"
    redirect_uri: >-
      {{ authelia_oidc_grafana_redirect_uri
         | default('https://grafana.' ~ lookup('env', 'PROXMOX_SUBDOMAIN')
                    ~ '/login/generic_oauth') }}
  - name: langfuse
    client_id: "{{ authelia_oidc_langfuse_client_id | default('langfuse') }}"
    redirect_uri: >-
      {{ authelia_oidc_langfuse_redirect_uri
         | default('https://langfuse.' ~ lookup('env', 'PROXMOX_SUBDOMAIN')
                    ~ '/api/auth/callback/custom') }}
  - name: semaphore
    client_id: "{{ authelia_oidc_semaphore_client_id | default('semaphore') }}"
    redirect_uri: >-
      {{ authelia_oidc_semaphore_redirect_uri
         | default('https://semaphore.' ~ lookup('env', 'PROXMOX_SUBDOMAIN')
                    ~ '/api/auth/oidc/authelia/redirect') }}

# Keystone URLs for the Gatus keystone group (and as a reference list for any
# manual Uptime Kuma monitors an operator adds in the UI).
status_stack_kuma_keystones:
  - name: Traefik HTTPS
    url: "https://traefik.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"
  - name: Authelia
    url: "https://authelia.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"
  - name: Gatus
    url: "https://gatus.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"
  - name: Prometheus
    url: "https://prometheus.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"
  - name: OpenBao
    url: "https://openbao.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"
  - name: Healthchecks
    url: "https://healthchecks.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}/"

# Deadman receivers: one Gatus external endpoint per pusher, group `deadman`.
# Pushers POST /api/v1/endpoints/deadman_<name>/external?success=<bool> with
# the shared bearer token; a heartbeat that goes quiet for longer than
# `heartbeat` marks the endpoint unhealthy and alerts. Names must match the
# pusher's slug: service_deadman_group_checks (this repo), the media stack's
# validators, and the mlx watchdog.
status_stack_deadman_endpoints:
  - { name: technitium-dns, heartbeat: 5m }
  - { name: traefik, heartbeat: 5m }
  - { name: haproxy-vip, heartbeat: 5m }
  - { name: nginx-syslog-lb, heartbeat: 5m }
  - { name: openbao, heartbeat: 5m }
  - { name: github-runner-pool, heartbeat: 5m }
  - { name: github-runner-data-disk, heartbeat: 5m }
  - { name: download-vpn, heartbeat: 10m }
  - { name: sqlite-backup, heartbeat: 26h }
  - { name: mlx-watchdog, heartbeat: 15m }
status_stack_deadman_token: >-
  {{ bao_monitoring_secrets.GATUS_EXTERNAL_TOKEN
     | default(undef(), true)
     | mandatory('bao_monitoring_secrets.GATUS_EXTERNAL_TOKEN is missing: the '
                 + 'monitoring domain fetch did not carry the Gatus push token') }}

# Uptime Kuma admin (generate-once + OpenBao publish when wired).
status_stack_kuma_admin_username: admin
status_stack_kuma_admin_password: ""
status_stack_kuma_admin_password_file: "{{ status_stack_data_dir }}/.kuma_admin_password"

# Optional API-key overlays for Gatus (name must match catalog service name).
# Empty by default — populate from inventory when Homarr/OpenBao secrets are
# already available. Each entry: {name, url, headers:{Header: value}}
status_stack_authenticated_endpoints: []

# Per-name Gatus success-status override for the dashboard-catalog loop. A
# service whose generic `< 500` catalog condition would itself BE the failure
# — LiteLLM's /health is an authenticated router that answers 401 when it is
# healthy and unauthenticated, so a bare 200 would be the actual problem.
status_stack_catalog_status_overrides:
  litellm: [401]

# --- monitor_targets — ICMP/TCP/HTTP endpoints derived from tofu inventory
# (inventory/load_tofu/monitor_targets.yml), propagated to every host. Same
# fact both Gatus and the AutoKuma sidecar below render from.
status_stack_monitor_targets: "{{ monitor_targets | default({'icmp': [], 'tcp': [], 'http': []}) }}"

# --- AutoKuma sidecar (BigBoot/AutoKuma) — syncs Uptime Kuma monitors from
# status_stack_monitor_targets via its own socket.io API, so Ansible never
# needs the first-party Kuma API this role's README previously ruled out.
# Static-monitors mode: AUTOKUMA__STATIC_MONITORS is a DIRECTORY of one
# .json file per monitor (id = filename), not inline content.
# renovate: datasource=docker depName=ghcr.io/bigboot/autokuma
status_stack_autokuma_image: "ghcr.io/bigboot/autokuma:v2.0.0"
status_stack_autokuma_container_name: autokuma
status_stack_autokuma_static_monitors_dir: "{{ status_stack_data_dir }}/autokuma/static-monitors"
status_stack_autokuma_kuma_url: "http://127.0.0.1:{{ status_stack_kuma_port | trim }}"

# --- Alerting — ntfy, shared by Gatus and AutoKuma/Uptime Kuma ---
# Topic name STRINGS only, sourced from these variables rather than written
# inline in the templates. The ntfy_docker role's own topic vars land in a
# parallel package; not depended on here, so these default to the same
# sensible topic name strings rather than that role's variables.
status_stack_ntfy_url: >-
  {{ ntfy_docker_base_url
     | default('http://127.0.0.1:' ~ (ntfy_docker_http_port | default(8080)), true) }}
status_stack_ntfy_topic_urgent: "keystone"
status_stack_ntfy_topic_degraded: "observability"
status_stack_ntfy_priority_urgent: 5
status_stack_ntfy_priority_degraded: 3
status_stack_ntfy_username: ""
status_stack_ntfy_password: ""
status_stack_failure_threshold: 3
