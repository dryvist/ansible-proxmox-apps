    Docker-in-LXC compose stack.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - gatus
    - uptimekuma
    - monitoring
    - docker

dependencies:
  - role: docker_engine
