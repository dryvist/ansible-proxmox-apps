---
# status_stack — Gatus + Uptime Kuma compose on the status guest.

- name: Build the shared service catalog
  ansible.builtin.include_role:
    name: dashboard_catalog

- name: Assert dashboard catalog is available for Gatus
  ansible.builtin.assert:
    that:
      - dashboard_catalog_services_monitor is defined
      - dashboard_catalog_services_monitor | length > 0
      - dashboard_catalog_base_domain is defined
      - dashboard_catalog_base_domain | trim | length > 0
    fail_msg: >-
      status_stack needs dashboard_catalog_services_monitor from the
      dashboard_catalog role, including its base domain for public probes.
    quiet: true

- name: Create status stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ status_stack_data_dir }}"
    - "{{ status_stack_data_dir }}/gatus"
    - "{{ status_stack_gatus_data_dir }}"
    - "{{ status_stack_data_dir }}/uptime-kuma"

- name: Read any persisted Uptime Kuma admin password
  ansible.builtin.stat:
    path: "{{ status_stack_kuma_admin_password_file }}"
  register: status_stack_kuma_pw_stat

- name: Read the persisted Uptime Kuma admin password
  ansible.builtin.slurp:
    src: "{{ status_stack_kuma_admin_password_file }}"
  register: status_stack_kuma_pw_stored
  when: status_stack_kuma_pw_stat.stat.exists
  no_log: true

# The writes run on the controller: the writer token must never reach the guest.
- name: Seed Uptime Kuma's admin password in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the Uptime Kuma admin password through the shared seed_generated task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_path: apps/status-stack
        openbao_secrets_seed_fields:
          - name: status_stack_kuma_admin_password
            length: 32
            charset: alnum
            value: >-
              {{ status_stack_kuma_admin_password
                 or (status_stack_kuma_pw_stored.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_local_values:
          status_stack_kuma_admin_password: >-
            {{ status_stack_kuma_admin_password
               or (status_stack_kuma_pw_stored.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_register: status_stack_kuma_password_seed

- name: Resolve Uptime Kuma's admin password from OpenBao
  ansible.builtin.set_fact:
    status_stack_effective_kuma_password: "{{ status_stack_kuma_password_seed.status_stack_kuma_admin_password }}"
  no_log: true

- name: Require the persisted Uptime Kuma password to match OpenBao
  ansible.builtin.assert:
    that:
      - >-
        not status_stack_kuma_pw_stat.stat.exists
        or (status_stack_kuma_pw_stored.content | b64decode | trim)
           == status_stack_effective_kuma_password
    fail_msg: >-
      Uptime Kuma password file differs from the stored field
      status_stack_kuma_admin_password
  when:
    - status_stack_kuma_password_seed.status_stack_kuma_admin_password != '(placeholder in check mode)'
  no_log: true

- name: Persist Uptime Kuma's admin password
  ansible.builtin.copy:
    content: "{{ status_stack_effective_kuma_password }}\n"
    dest: "{{ status_stack_kuma_admin_password_file }}"
    owner: root
    group: root
    mode: "0400"
  when:
    - status_stack_kuma_password_seed.status_stack_kuma_admin_password != '(placeholder in check mode)'
  no_log: true

# Root-only: the config carries the external-endpoint bearer token.
- name: Render Gatus configuration
  ansible.builtin.template:
    src: gatus-config.yaml.j2
    dest: "{{ status_stack_data_dir }}/gatus/config.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart status stack

- name: Render status stack docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ status_stack_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains the Uptime Kuma admin password (AutoKuma env)
  no_log: true
  notify: Restart status stack

# AutoKuma syncs Uptime Kuma monitors from the SAME monitor_targets fact
# Gatus renders from (one generator, N renderers). AUTOKUMA__STATIC_MONITORS
# is a DIRECTORY of one .json file per monitor — the filename (minus
# extension) becomes the AutoKuma id, so group files are named group-<group>
# and each target file is named <type>-<name> to stay unique. Every file is
# rendered on the controller and shipped in one transfer — see the included
# file for why (AutoKuma has no multi-monitor-per-file mode) and how.
- name: Render and ship the AutoKuma static-monitor set
  ansible.builtin.include_tasks: autokuma_static_monitors.yml

- name: Deploy status stack via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ status_stack_data_dir }}"
    state: present
  register: status_stack_compose

- name: Flush handlers so health checks see the new containers
  ansible.builtin.meta: flush_handlers

- name: Wait for Gatus HTTP port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ status_stack_gatus_port | trim }}"
    timeout: 120

- name: Wait for Uptime Kuma HTTP port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ status_stack_kuma_port | trim }}"
    timeout: 120

- name: Verify Gatus answers /
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ status_stack_gatus_port | trim }}/"
    status_code: [200]
  register: status_stack_gatus_health
  retries: 10
  delay: 3
  until: status_stack_gatus_health.status | default(0) == 200
  check_mode: false
  when: >-
    not ansible_check_mode or
    (
      not (status_stack_compose.skipped | default(false)) and
      (status_stack_compose.actions | default([]) | length == 0)
    )
  changed_when: false

# Uptime Kuma's own first-run HTTP endpoint — no collection, no sidecar, no
# monitor sync. Gatus is the uptime-probe SoR; Kuma is the operator status UI.
- name: Probe whether Uptime Kuma still needs initial setup
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ status_stack_kuma_port | trim }}/api/entry-page"
    return_content: true
  register: status_stack_kuma_entry
  retries: 10
  delay: 3
  until: status_stack_kuma_entry.status | default(0) == 200
  check_mode: false
  when: >-
    not ansible_check_mode or
    (
      not (status_stack_compose.skipped | default(false)) and
      (status_stack_compose.actions | default([]) | length == 0)
    )
  changed_when: false

- name: Create Uptime Kuma initial admin
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ status_stack_kuma_port | trim }}/setup"
    method: POST
    body_format: json
    body:
      username: "{{ status_stack_kuma_admin_username }}"
      password: "{{ status_stack_effective_kuma_password }}"
    status_code: [200, 201]
  when: status_stack_kuma_entry.json.needSetup | default(false) | bool
  no_log: true
