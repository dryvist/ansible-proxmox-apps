---
- name: Restart status stack
  community.docker.docker_compose_v2:
    project_src: "{{ status_stack_data_dir }}"
    state: present
    recreate: always
    services: "{{ status_stack_compose_services | default(omit, true) }}"
  tags: [gatus, uptime_kuma, autokuma, status, dashboard, observability, collaboration]
