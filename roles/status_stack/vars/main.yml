---
# Component-tagged runs reconcile only their services; broad and untagged runs
# omit the selector so Docker Compose handles the whole project as before.
status_stack_compose_services: >-
  {{
    (
      (['gatus'] if 'gatus' in ansible_run_tags else [])
      + (['uptime-kuma', 'autokuma'] if 'uptime_kuma' in ansible_run_tags else [])
      + (['autokuma'] if 'autokuma' in ansible_run_tags else [])
    ) | unique | list
    if (
      ansible_run_tags | intersect(['gatus', 'uptime_kuma', 'autokuma']) | length > 0
      and ansible_run_tags | intersect(['status', 'dashboard', 'observability', 'collaboration']) | length == 0
    ) else []
  }}
