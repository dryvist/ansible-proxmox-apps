---
# openbao_secrets role defaults — a controller-side pre-play that logs in to
# OpenBao, once per resource-domain identity, and reads that domain's KV
# subtree into a per-domain fact (`bao_<domain>_secrets`, hyphens become
# underscores — e.g. `local-cloud` -> `bao_local_cloud_secrets`). Consumer
# roles then read from OpenBao and fail when the value is absent or empty:
#   X: >-
#     {{ bao_<domain>_secrets.X | default(undef(), true)
#        | mandatory('X missing: OpenBao fetch did not supply it') }}
#
# Each domain authenticates with its OWN least-privilege AppRole (see
# terraform-proxmox docs/SECRETS_HIERARCHY.md) rather than one broad shared
# identity — a domain's credentials only ever unlock that domain's KV subtree.
#
# FAILS LOUD. A fetch that cannot happen is an error, never an empty value:
#   - No OpenBao endpoint configured at all (BAO_ADDR unset AND no openbao-tagged
#     node in the tofu inventory): the role no-ops. This is the only silent path,
#     and it is the pre-migration case where nothing was ever asked of OpenBao.
#   - Configured but NO candidate endpoint answers /v1/sys/health 200: the role
#     FAILS. A total-OpenBao outage stops the converge instead of handing every
#     consumer an empty secret.
#   - A domain whose role_id/secret_id envs are missing: the role FAILS, unless
#     that domain is named in `openbao_secrets_optional_domains` — the documented
#     opt-out for migrating one domain at a time.
#   - A KV read that errors: the role FAILS, naming the path. The ONE tolerated
#     case is a 404 on a path declared `optional: true` in its mapping form —
#     see openbao_secrets_optional_domains below. A 403 means the credential is
#     wrong, not the secret absent, and always fails.
#
# Under --check the login and the KV reads run FOR REAL (check_mode: false —
# they change no state), so a check run resolves genuine values and templates
# diff against them instead of against blanks. publish.yml WRITES and still
# honours check mode.
# The bite this replaces: every one of the above used to produce an empty value
# that consumers happily rendered, which is how a live database password was
# overwritten with an empty string.
#
# Consumers of a secret-valued variable must therefore NOT carry an env
# fallback; they end in `| default(undef(), true) | mandatory('...')` so an
# absent secret aborts the play. `| default('', true) | mandatory(...)` NEVER
# fires — mandatory only raises on undefined, and '' is defined.

# Shared connection inputs.
openbao_secrets_bao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
# TLS terminates at the OpenBao Traefik ingress (a real cert), so verify by
# default; override only for a direct-to-node http bootstrap endpoint.
openbao_secrets_validate_certs: true
openbao_secrets_kv_mount: secret
# Documented opt-out from the fail-loud contract, by domain NAME.
#
# A single PATH may also be declared optional, independently of its domain, by
# giving it the mapping form instead of a bare string:
#   - mount: secret          # optional, defaults to openbao_secrets_kv_mount
#     path: apps/foo/vendor
#     optional: true
# A 404 on such a path is skipped with a visible warning naming it; a 403 and
# every other error still fail. A bare string path is always REQUIRED, so a 404
# on one fails the play — an undeclared-but-expected key is a real defect.
# A domain
# listed here may have no role_id/secret_id in the environment and is skipped
# with a warning instead of failing the play — the migration escape hatch for
# a domain whose AppRole is not provisioned yet. Empty by default: every
# configured domain is required.
openbao_secrets_optional_domains: []
# Client failover across the OpenBao nodes: probe an ordered candidate list and
# use the first reachable endpoint. See README for the full ordering + rationale.
openbao_secrets_openbao_api_port: "{{ tofu_data['constants']['service_ports']['openbao_api'] | default(8200) }}"
openbao_secrets_node_addrs: >-
  {{ tofu_data['containers'] | default({}) | dict2items
     | selectattr('value.tags', 'defined')
     | selectattr('value.tags', 'contains', 'openbao')
     | map(attribute='value.ip', default='') | reject('equalto', '')
     | map('regex_replace', '^(.+)$', 'http://\1:' ~ (openbao_secrets_openbao_api_port | string))
     | list }}
openbao_secrets_bao_addr_candidates: >-
  {{ (([openbao_secrets_bao_addr] if openbao_secrets_bao_addr | length > 0 else [])
      + openbao_secrets_node_addrs) | unique }}

# --- Credential PUBLISHING (tasks/publish.yml) ---------------------------------
# Identity used to write guest-generated credentials back into OpenBao under
# secret/apps/<app>. This is the ansible-converge AppRole, whose policy is
# extended with create/update (NOT delete, NOT read of unrelated paths) on
# secret/data/apps/* — see roles/openbao `openbao_policies`.
#
# Everything else in this role READS. This is the one write path, and it is
# deliberately confined to a single path prefix so a converge can never rewrite
# platform or external credentials.
openbao_secrets_publish_role_id: "{{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_ROLE_ID') | default('', true) }}"
openbao_secrets_publish_secret_id: "{{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_SECRET_ID') | default('', true) }}"

# One entry per resource-domain identity this Ansible converge fetches for.
# Each domain's role_id/secret_id come from its own env vars — sourced from
# the operator's keychain-backed resolver on macOS, or a root-only systemd
# credential on Linux (never a shared/broad credential). Add a domain here as
# new consumer roles are wired to read bao-first; each needs a matching
# AppRole + policy in roles/openbao's `openbao_approles`/`openbao_policies`.
openbao_secrets_domains:
  - name: observability
    role_id_env: OBSERVABILITY_VAULT_ROLE_ID
    secret_id_env: OBSERVABILITY_VAULT_SECRET_ID
    paths:
      # The store holds the `/main` keys, and the policy grants
      # `platform/<app>/*` — the bare `platform/splunk` is a 403, not a 404.
      - platform/splunk/main
      - platform/cribl/main
  - name: local-cloud
    role_id_env: LOCAL_CLOUD_VAULT_ROLE_ID
    secret_id_env: LOCAL_CLOUD_VAULT_SECRET_ID
    paths:
      # As above: the policy grants `platform/object-storage/*` only, so the
      # bare key is a 403 even though it exists.
      - platform/object-storage/main
      # platform/compute is not declared: the path holds no keys at all.
  - name: monitoring
    role_id_env: MONITORING_VAULT_ROLE_ID
    secret_id_env: MONITORING_VAULT_SECRET_ID
    paths:
      # The policy grants `apps/monitoring/*`; the bare path is a 403.
      - apps/monitoring/main
  - name: media
    role_id_env: MEDIA_VAULT_ROLE_ID
    secret_id_env: MEDIA_VAULT_SECRET_ID
    paths:
      # One path per KV ENTRY. `vault_kv2_get` reads a single entry and does not
      # walk a subtree, and the media policy grants `apps/media/*` — which does
      # NOT match the bare `apps/media`, so that entry is a 403. Its fields are
      # duplicated under the per-app subkeys below, which are the ones declared.
      - apps/media/sonarr
      - apps/media/radarr
      - apps/media/seerr
      - apps/media/plex
      - apps/media/prowlarr
      - apps/media/qbittorrent
  - name: apps
    role_id_env: APPS_VAULT_ROLE_ID
    secret_id_env: APPS_VAULT_SECRET_ID
    paths:
      # Nautobot IPAM/DCIM (issue #138). The apps/nautobot KV path carries the
      # fields db_password, secret_key, superuser_password (the #138 secret
      # contract WS-C seeds), merged flat into bao_apps_secrets. Future apps
      # sharing the Postgres instance (Vikunja P3, EspoCRM P4) add their own
      # `apps/<app>` path here; because the merge is flat, their fields MUST be
      # app-namespaced (e.g. vikunja_db_password) or given a separate domain,
      # so they never collide with Nautobot's bare field names.
      - apps/nautobot
      # Zammad ITSM/ticketing (incident-management system of record). Fields are
      # app-namespaced (zammad_db_password, zammad_admin_password) so the flat
      # merge into bao_apps_secrets never collides with Nautobot's bare names.
      # The Hermes API token is NOT here — it lives in ai/hermes (local-llm
      # domain) so the one token has a single home shared by both sides.
      - apps/zammad
      # Vikunja task-management (issue #141). Fields come from the SOPS->bao
      # promotion map (roles/openbao openbao_promoted_app_secrets.vikunja): vikunja_db_password
      # (app-namespaced, matches the postgres + vikunja_group consumers) plus the
      # MCP svc-account passwords + API tokens. Merged flat into bao_apps_secrets.
      - apps/vikunja
      # Shared-apps Postgres replication credential (generated at source by
      # roles/openbao openbao_generated_app_secrets.postgres); consumed by the
      # postgres role on both the primary and the standby.
      - apps/postgres
      # Hindsight agent-memory (ai VLAN): DB + replication credentials for its
      # dedicated Postgres cluster and the Control Plane access key (generated
      # at source by openbao_generated_app_secrets.hindsight; app-namespaced).
      - apps/hindsight
      # LiteLLM router DB login on the ai-VLAN cluster (llm_router_db_password,
      # generated at source by openbao_generated_app_secrets.llm-router).
      # Consumed here by inventory/group_vars/postgres_ai_group.yml, and in
      # ansible-proxmox-ai by roles/llm_router — one field, both ends, so the
      # two cannot drift.
      - apps/llm-router
      # Workflow engine: n8n_db_password (generated at source for its role on
      # the shared cluster) + n8n_encryption_key (PROMOTED — the key that
      # decrypts the credentials already stored in its database, so it must
      # never be regenerated). App-namespaced for the flat bao_apps_secrets
      # merge. Consumed by inventory/group_vars/{n8n_group,postgres_group}.yml.
      - apps/n8n
      # Homarr dashboard: its own admin service account, API key and — most
      # importantly — homarr_encryption_key, which is PROMOTED, not generated.
      # That key decrypts every stored integration credential; regenerating it
      # does not invalidate them, it makes them permanently unreadable. All
      # fields are app-namespaced for the flat merge. The API keys of the
      # services Homarr integrates WITH are not here: they stay in the media
      # domain, owned by ansible-servarr.
      - apps/homarr
      # Authelia: the OIDC client secrets it shares with its relying parties
      # (authelia_oidc_{homarr,langfuse}_client_secret). The secret's home is
      # Authelia — it hashes the plaintext into its own config while Homarr and
      # Langfuse consume the plaintext — so it is seeded and read here rather
      # than under each consumer. Without this path the fields never reach
      # bao_apps_secrets and Authelia's mandatory() default fails the converge.
      - apps/authelia
  - name: local-llm
    role_id_env: LOCAL_LLM_VAULT_ROLE_ID
    secret_id_env: LOCAL_LLM_VAULT_SECRET_ID
    paths:
      - ai/llm         # LLM_ROUTER_MASTER_KEY, LLM_LARGE_BEARER_TOKEN (single seeded KV path)
      - ai/qdrant      # QDRANT_API_KEY
      - ai/open-webui  # OPEN_WEBUI_SECRET_KEY, OPEN_WEBUI_OPENAI_API_KEY
      - ai/hermes      # GH_PAT_WRITE_PROJECT_ISSUES, HERMES_GITHUB_APP_{ID,INSTALLATION_ID,
                       #   PRIVATE_KEY}.
      - ai/mcp/splunk  # SPLUNK_MCP_URL, SPLUNK_MCP_TOKEN; merged into the same
                       #   bao_local_llm_secrets fact consumed by Hermes
      - ai/langfuse    # LANGFUSE_{POSTGRES_PASSWORD,CLICKHOUSE_PASSWORD,REDIS_AUTH,
                       #   S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,PUBLIC_KEY,SECRET_KEY,
                       #   INIT_USER_EMAIL,INIT_USER_PASSWORD} — fully seeded 2026-07-05
      - ai/phoenix     # PHOENIX_INGEST_API_KEY — the bearer key cribl_stream's
                       #   phoenix_otlp output presents to Arize Phoenix. Seeded
                       #   after the Phoenix guest's first boot (ansible-proxmox-ai
                       #   roles/phoenix_docker); the same path also holds the
                       #   guest's own bootstrap secrets, read only over there.
      - ai/langflow    # LANGFLOW_{SUPERUSER,SUPERUSER_PASSWORD,DB_PASSWORD}
