---
galaxy_info:
  author: ansible-proxmox-apps
  description: >-
    prometheus-pve-exporter (Docker-in-LXC), co-located with prometheus_stack —
    a multi-target exporter for the PVE cluster API, queried via a read-only
    audit-scoped API token.
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble

  galaxy_tags:
    - proxmox
    - prometheus
    - metrics
    - monitoring
    - docker

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). No venv: deploys via docker_compose_v2 (CLI).
  - role: docker_engine
    docker_engine_configure_daemon_json: true
