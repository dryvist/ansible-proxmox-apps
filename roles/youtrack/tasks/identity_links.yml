---
# One include per link keeps each lookup's result local to that link, so no
# task loops over registered URI results (which can carry the request headers).
- name: Reconcile each YouTrack Hub OAuth identity link
  ansible.builtin.include_tasks: identity_link_one.yml
  loop: "{{ youtrack_hub_identity_links }}"
  loop_control:
    loop_var: youtrack_hub_identity_link
    label: "{{ youtrack_hub_identity_link.login | default('') }}"
  when:
    - youtrack_hub_identity_link.login | default('') | length > 0
    - youtrack_hub_identity_link.identifier | default('') | length > 0
