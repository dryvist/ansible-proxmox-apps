---
- name: Read Hub users for configured identity links
  ansible.builtin.uri:
    url: >-
      {{ youtrack_hub_base_url
         ~ '/hub/api/rest/users?query=login:'
         ~ (youtrack_hub_identity_link.login | urlencode)
         ~ '&fields=id,login,details(%24type,identifier,authModule(name))' }}
    method: GET
    headers:
      Authorization: "Bearer {{ youtrack_hub_admin_token }}"
  register: youtrack_hub_identity_user_reads
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ youtrack_hub_identity_links }}"
  loop_control:
    loop_var: youtrack_hub_identity_link
    label: "{{ youtrack_hub_identity_link.login | default('') }}"
  when:
    - youtrack_hub_identity_link.login | default('') | length > 0
    - youtrack_hub_identity_link.identifier | default('') | length > 0
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Require each YouTrack Hub identity-link lookup to return HTTP 200
  ansible.builtin.assert:
    that:
      - youtrack_hub_identity_user_read.status | int == 200
    fail_msg: >-
      YouTrack Hub user lookup failed for "{{ youtrack_hub_identity_user_read.item.login }}"
      (HTTP {{ youtrack_hub_identity_user_read.status | default('no response') }}).
    quiet: true
  loop: >-
    {{ youtrack_hub_identity_user_reads.results
       | selectattr('status', 'defined')
       | list }}
  loop_control:
    loop_var: youtrack_hub_identity_user_read
    label: "{{ youtrack_hub_identity_user_read.item.login }}"
  run_once: true

- name: Require each linked Hub login to exist
  ansible.builtin.assert:
    that:
      - >-
        youtrack_hub_identity_user_read.json
        | selectattr('login', 'equalto', youtrack_hub_identity_user_read.item.login)
        | list | length > 0
    fail_msg: >-
      YouTrack Hub user "{{ youtrack_hub_identity_user_read.item.login }}" does not exist;
      identity links require an existing Hub user.
    quiet: true
  loop: >-
    {{ youtrack_hub_identity_user_reads.results
       | selectattr('status', 'defined')
       | list }}
  loop_control:
    loop_var: youtrack_hub_identity_user_read
    label: "{{ youtrack_hub_identity_user_read.item.login }}"
  run_once: true

- name: Determine whether each OAuth identity link already exists
  ansible.builtin.set_fact:
    youtrack_hub_identity_user_id: "{{ youtrack_hub_identity_user.id }}"
    youtrack_hub_identity_link_present: "{{ youtrack_hub_identity_matching_details | length > 0 }}"
  vars:
    youtrack_hub_identity_user: >-
      {{ youtrack_hub_identity_user_read.json
         | selectattr('login', 'equalto', youtrack_hub_identity_user_read.item.login)
         | list | first }}
    youtrack_hub_identity_details: "{{ youtrack_hub_identity_user.details | default([]) }}"
    youtrack_hub_identity_matching_details: >-
      {{ (youtrack_hub_identity_details
          | selectattr('identifier', 'equalto', youtrack_hub_identity_user_read.item.identifier)
          | selectattr('authModule.name', 'equalto', youtrack_hub_auth_module_name)
          | selectattr('$type', 'equalto', 'Oauth2detailsJSON')
          | list)
         + (youtrack_hub_identity_details
            | selectattr('identifier', 'equalto', youtrack_hub_identity_user_read.item.identifier)
            | selectattr('authModule.name', 'equalto', youtrack_hub_auth_module_name)
            | selectattr('type', 'equalto', 'Oauth2detailsJSON')
            | list) }}
  loop: >-
    {{ youtrack_hub_identity_user_reads.results
       | selectattr('status', 'defined')
       | list }}
  loop_control:
    loop_var: youtrack_hub_identity_user_read
    label: "{{ youtrack_hub_identity_user_read.item.login }}"
  register: youtrack_hub_identity_link_checks
  changed_when: false
  run_once: true

- name: Report missing OAuth identity links in check mode
  ansible.builtin.debug:
    msg: >-
      YouTrack Hub user "{{ youtrack_hub_identity_link_check.item.item.login }}"
      would be linked to the configured Authelia identity.
  loop: "{{ youtrack_hub_identity_link_checks.results }}"
  loop_control:
    loop_var: youtrack_hub_identity_link_check
    label: "{{ youtrack_hub_identity_link_check.item.item.login }}"
  when:
    - not youtrack_hub_identity_link_check.ansible_facts.youtrack_hub_identity_link_present
    - ansible_check_mode
  changed_when: true
  run_once: true

- name: Create missing YouTrack Hub OAuth identity links
  ansible.builtin.uri:
    url: >-
      {{ youtrack_hub_base_url
         ~ '/hub/api/rest/users/'
         ~ youtrack_hub_identity_link_check.ansible_facts.youtrack_hub_identity_user_id
         ~ '/userdetails?fields=id' }}
    method: POST
    headers:
      Authorization: "Bearer {{ youtrack_hub_admin_token }}"
      Content-Type: application/json
    body:
      type: Oauth2detailsJSON
      authModule:
        id: "{{ youtrack_hub_auth_module.id }}"
      identifier: "{{ youtrack_hub_identity_link_check.item.item.identifier }}"
    body_format: json
  register: youtrack_hub_identity_link_creates
  failed_when: false
  changed_when: true
  loop: "{{ youtrack_hub_identity_link_checks.results }}"
  loop_control:
    loop_var: youtrack_hub_identity_link_check
    label: "{{ youtrack_hub_identity_link_check.item.item.login }}"
  when:
    - not youtrack_hub_identity_link_check.ansible_facts.youtrack_hub_identity_link_present
    - not ansible_check_mode
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Require each YouTrack Hub identity-link creation to succeed
  ansible.builtin.assert:
    that:
      - youtrack_hub_identity_link_create.status | default(0) | int in [200, 201, 204]
    fail_msg: >-
      YouTrack Hub rejected the identity link for
      "{{ youtrack_hub_identity_link_create.item.item.item.login }}"
      (HTTP {{ youtrack_hub_identity_link_create.status | default('no response') }}).
    quiet: true
  loop: >-
    {{ youtrack_hub_identity_link_creates.results
       | selectattr('status', 'defined')
       | list }}
  loop_control:
    loop_var: youtrack_hub_identity_link_create
    label: "{{ youtrack_hub_identity_link_create.item.item.item.login }}"
  when: not ansible_check_mode
  run_once: true
