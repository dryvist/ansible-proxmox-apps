---
youtrack_hub_base_url: "https://youtrack.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
youtrack_hub_provider_url: "https://authelia.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"

youtrack_hub_auth_module_name: Authelia
youtrack_hub_auth_module_fields:
  scope: openid profile email
  userIdPath: preferred_username
  fullNamePath: name
  allowedCreateNewUsers: false
  disabled: false
  serverUrl: "{{ youtrack_hub_provider_url }}/api/oidc/authorization"
  tokenUrl: "{{ youtrack_hub_provider_url }}/api/oidc/token"
  userInfoUrl: "{{ youtrack_hub_provider_url }}/api/oidc/userinfo"
  clientId: youtrack

youtrack_hub_identity_links:
  - login: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) }}"
    identifier: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) }}"
