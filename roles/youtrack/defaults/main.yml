---
youtrack_hub_base_url: "https://youtrack.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
youtrack_hub_provider_url: "https://authelia.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
youtrack_validate_certs: true

# Opt-in publication of the YouTrack agent-tier token.
youtrack_agent_token_publish_openbao: false
youtrack_agent_write_login: svc-ai
youtrack_agent_write_token_name: agent-tier-youtrack-write
youtrack_agent_write_token_remint: false
youtrack_agent_write_openbao_mount: agent-tier
youtrack_agent_write_openbao_path: youtrack-write
youtrack_agent_write_openbao_field: YOUTRACK_AGENT_WRITE_TOKEN
youtrack_openbao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
youtrack_openbao_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"

youtrack_hub_auth_module_name: Authelia
youtrack_hub_auth_module_fields:
  scope: openid profile email
  userIdPath: preferred_username
  fullNamePath: name
  allowedCreateNewUsers: false
  disabled: false
  serverUrl: "{{ youtrack_hub_provider_url }}/api/oidc/authorization"
  tokenUrl: "{{ youtrack_hub_provider_url }}/api/oidc/token"
  userInfoUrl: "{{ youtrack_hub_provider_url }}/api/oidc/userinfo"
  clientId: youtrack

youtrack_hub_identity_links:
  - login: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) }}"
    identifier: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) }}"
