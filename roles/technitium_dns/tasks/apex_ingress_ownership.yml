---
- name: Discover the existing direct-node apex writer
  ansible.builtin.service_facts:

- name: Stop direct-node apex reconciliation when ingress owns the cluster
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - technitium-apex-health.timer
    - technitium-apex-health.service
  become: true
  when: "'technitium-apex-health.service' in ansible_facts.services"
