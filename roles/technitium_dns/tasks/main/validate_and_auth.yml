---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - technitium_dns_admin_password | length > 0
      - technitium_dns_zone | length > 0
      - technitium_dns_host is defined
    fail_msg: >-
      Required variables not set. Check: (1) TECHNITIUM_DNS_ADMIN_PASSWORD must be in Doppler
      (add via: doppler secrets set TECHNITIUM_DNS_ADMIN_PASSWORD='<password>');
      (2) PROXMOX_SUBDOMAIN is available via Doppler; (3) technitium_dns_host must be set in
      the play vars.
    quiet: true

# A LOCAL heavy-tier serving host with no address would silently publish nothing:
# the A-record builder's truthy filter skips an empty ip, so the record the
# router chain resolves would just be absent from an otherwise green converge.
# That is the failure this repository is uniquely positioned to cause, because
# this is where the record is WRITTEN rather than merely read.
#
# Conditional, not absolute: an EXTERNAL runner host legitimately has no local
# address, and must not be pointed at one. The guard therefore fires only when a
# local host is named without an address to go with it.
- name: Assert a locally-named heavy-tier serving host has an address to publish
  ansible.builtin.assert:
    quiet: true
    that:
      - llm_large_serving_ip | default('') | trim | length > 0
    fail_msg: >-
      Heavy-tier serving host "{{ llm_large_serving_host }}" is named locally but
      has no address, so its A record would be silently SKIPPED by the truthy
      filter and this converge would report success while the name the router
      pool dials resolves to nothing.
      Supply the address from tofu-proxmox's constants.serving.ip (the
      destination state, published once an apply republishes the inventory
      artifact — tofu-proxmox#827) or from LLM_LARGE_RUNNER_IP.
      This deliberately does NOT fall back to a built-in address: a committed
      default is what this change removed, and here a wrong one would not fail
      locally — it would be published to the estate as authoritative DNS.
    success_msg: >-
      Heavy-tier serving host "{{ llm_large_serving_host }}" has an address to publish.
  when:
    - llm_large_serving_host | default('') | trim | length > 0
    # An external runner host is a full FQDN and owns its own DNS elsewhere.
    - not (lookup('env', 'LLM_LARGE_RUNNER_HOST') | trim | length > 0)

# Technitium API tokens are PER-INSTANCE — one shared token only authenticates the
# node that minted it, so the HA secondaries could not be configured. Log into THIS
# node's API with the shared admin password (technitium_install sets it identically
# on every member) to obtain this node's OWN session token, and use it for every
# API call below. Skipped under technitium_dns_apply=false (molecule/CI, no live API).
#
# WHY EVERY API TASK IN THIS ROLE IS DELEGATED TO THE CONTROLLER.
# technitium_dns_api_url is http://{{ technitium_dns_host }}:5380 — a NETWORK
# address. Running these tasks on the target meant entering the container over
# pct_remote only to turn around and open a network connection back to that same
# container's own IP. The container is not a privileged vantage point for its own
# API; it is just an extra hop, and it cost one SSH channel PER RECORD. The
# A-record loop alone is ~60 of them, and the paramiko-based pct_remote
# connection reset partway through every time, leaving the zone half-written and
# the run unreachable rather than failed.
#
# Delegating removes the hop entirely: same URL, same API, same credentials,
# one fewer failure mode. The task still evaluates the INVENTORY host's
# variables, so each member is configured through its own endpoint exactly as
# before — delegation changes where the HTTP call originates, not which host it
# is about.
#
# This is NOT the "delegate_to: localhost tests the controller, not the target"
# anti-pattern. That rule is about PROBES, where the point is to observe from the
# target's own position — and the two wait_for probes in ingress_and_apex.yml are
# deliberately left undelegated for exactly that reason. These are API writes
# whose subject IS the remote endpoint, so the controller is the correct origin.
- name: Authenticate to this node's Technitium API (per-host session token)
  delegate_to: localhost
  ansible.builtin.uri:
    url: "{{ technitium_dns_api_url }}/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: "{{ technitium_dns_admin_user }}"
      pass: "{{ technitium_dns_admin_password }}"
    return_content: true
    timeout: "{{ technitium_dns_api_timeout }}"
  register: technitium_dns_login
  changed_when: false
  failed_when: technitium_dns_login.json.status | default('') != "ok"
  when: technitium_dns_apply | bool
  no_log: true

- name: Use this node's session token for subsequent API calls
  ansible.builtin.set_fact:
    technitium_dns_api_token: "{{ technitium_dns_login.json.token }}"
  when: technitium_dns_apply | bool
  no_log: true
