---
- name: Build A records from inventory
  # Iterate over groups['all'] explicitly. Iterating `hostvars | dict2items`
  # in Ansible 2.19 returns HostVarsVars proxy objects whose attribute
  # `is defined` checks behave differently from plain dicts and silently
  # skip every host. Using groups + hostvars[host] is the supported pattern.
  #
  # Only guests that HAVE a declared address get a record here, and that is
  # exactly the network/critical tier (resolvers, ingress, secrets) — their
  # `container_ip` is a real address because they are the one exception to the
  # pool-lease default.
  #
  # Leased guests are skipped deliberately, not by oversight. Their address is
  # held solely by the DHCP lease, and the gateway already answers for its own
  # lease-table clients, so `{hostname}.{apex}` resolves without anything here.
  # Publishing a record for them would mean writing the same address down a
  # second time, in a second system, with no way to notice when the two
  # disagreed — which is the failure this addressing model exists to remove. A
  # leased guest's `container_ip` is its FQDN, and the filter below drops it.
  ansible.builtin.set_fact:
    technitium_dns_a_records: >-
      {{
        technitium_dns_a_records | default([]) +
        [{
          'name': hostvars[item].hostname,
          'ip': hostvars[item].container_ip | default(hostvars[item].ansible_host)
        }]
      }}
  loop: "{{ groups['all'] | default([]) | reject('equalto', 'localhost') | list }}"
  when:
    - hostvars[item].hostname is defined
    - (hostvars[item].container_ip is defined) or (hostvars[item].ansible_host is defined)
    # Skip leased guests: a name, not an address, means there is nothing to
    # publish and the lease table already answers for them.
    - (hostvars[item].container_ip | default(hostvars[item].ansible_host))
      is match('^\d{1,3}(\.\d{1,3}){3}$')
    # Fronted-service names are owned by the Traefik ingress A-records below
    # (they resolve to Traefik, not the backend host), so skip them here.
    - hostvars[item].hostname not in (technitium_dns_ingress_aliases | default([]))
  loop_control:
    label: "{{ item }}"

# Fail loud, not silent: a builder that skips every host (e.g. the hostname
# fact missing from the dynamic inventory) yields an empty list and the role
# would "succeed" while creating nothing. There is always at least one guest
# (this DNS host itself), so zero records is always a bug.
- name: Assert the A-record builder produced records
  ansible.builtin.assert:
    that:
      - technitium_dns_a_records | default([]) | length > 0
    fail_msg: >-
      The A-record builder produced ZERO records — every inventory host was
      skipped. Check that inventory/load_tofu.yml set the `hostname` fact and
      `container_ip`/`ansible_host` on the dynamically-added guests.
    quiet: true

# Belt-and-braces: the builder's filter should already have dropped every
# name-valued target, so this can only fire if that filter is weakened. An A
# record pointing at a hostname is stored happily by Technitium and fails at
# resolution time, far from the cause — so reject it before any API call.
- name: Assert every A-record target is an IPv4 address
  ansible.builtin.assert:
    that:
      - >-
        technitium_dns_a_records | default([])
        | rejectattr('ip', 'match', '^\d{1,3}(\.\d{1,3}){3}$')
        | list | length == 0
    fail_msg: >-
      Guest(s) [{{ technitium_dns_a_records | default([])
      | rejectattr('ip', 'match', '^\d{1,3}(\.\d{1,3}){3}$')
      | map(attribute='name') | join(', ') }}] reached the writer with a name,
      not an address. A leased guest must be skipped by the builder above (the
      lease table answers for it); only network/critical guests, which declare a
      static address, belong in this zone.
    quiet: true

- name: Build Proxmox endpoint apex A records
  ansible.builtin.set_fact:
    technitium_dns_proxmox_endpoint_a_records: >-
      {{
        technitium_dns_proxmox_endpoint_a_records | default([]) +
        [{ 'domain': technitium_dns_zone, 'ip': item }]
      }}
  loop: "{{ technitium_dns_proxmox_endpoint_ips | default([]) }}"
  loop_control:
    label: "{{ technitium_dns_zone }} -> {{ item }}"

- name: Assert every Proxmox endpoint A-record target is an IPv4 address
  ansible.builtin.assert:
    that:
      - >-
        technitium_dns_proxmox_endpoint_a_records | default([])
        | rejectattr('ip', 'match', '^\d{1,3}(\.\d{1,3}){3}$')
        | list | length == 0
    fail_msg: >-
      PROXMOX_IP_ADDRESSES contains non-IPv4 target(s): {{
      technitium_dns_proxmox_endpoint_a_records | default([])
      | rejectattr('ip', 'match', '^\d{1,3}(\.\d{1,3}){3}$')
      | map(attribute='ip') | join(', ') }}.
    quiet: true

# --- Derive HA topology (primary = lowest-vmid technitium_dns_group member) ---
# Build a {vmid, ip} list for the group so the primary is the lowest vmid
# (terraform pins technitium-1 lowest). vmid is int-cast so it sorts numerically.
# A single-node group yields one member, so that host becomes its own primary
# and the prior single-node behavior is preserved.
- name: Build Technitium group member list
  ansible.builtin.set_fact:
    technitium_dns_members: >-
      {{
        technitium_dns_members | default([]) +
        [{
          'vmid': hostvars[item].proxmox_vmid | default(0) | int,
          'ip': hostvars[item].container_ip | default(hostvars[item].ansible_host)
        }]
      }}
  loop: "{{ groups['technitium_dns_group'] | default([]) | reject('equalto', 'localhost') | list }}"
  when: (hostvars[item].container_ip is defined) or (hostvars[item].ansible_host is defined)
  loop_control:
    label: "{{ item }}"

- name: Resolve Technitium primary IP (lowest vmid)
  ansible.builtin.set_fact:
    technitium_dns_primary_ip: >-
      {{ technitium_dns_primary_ip if (technitium_dns_primary_ip | length > 0)
         else ((technitium_dns_members | default([]) | sort(attribute='vmid')
                | map(attribute='ip') | list | first) | default(technitium_dns_host)) }}

# The LIVE zone type is the only honest answer to "is this node the primary?".
# The vmid heuristic below is a BOOTSTRAP rule, not a source of truth: it picks
# the lowest-vmid member, which on this estate designated the SECONDARY as
# primary and the PRIMARY as secondary. Every record write then failed on one
# host and was skipped on the other, and the run still exited green (Zammad
# #17246). Ask the server what it actually holds.
- name: Read this node's live zone type (authoritative over any heuristic)
  delegate_to: localhost
  ansible.builtin.uri:
    url: >-
      {{ technitium_dns_api_url }}/api/zones/list?token={{ technitium_dns_api_token }}
    method: GET
    return_content: true
    timeout: "{{ technitium_dns_api_timeout }}"
  register: technitium_dns_zone_list
  changed_when: false
  failed_when: false
  when: technitium_dns_apply | bool
  no_log: true

# Technitium answers a bad token with HTTP 200 and status "invalid-token", so
# `failed_when: false` is not even required for the collapse -- the `default([])`
# below turns ANY unusable answer into "no zones", which is indistinguishable
# from "the zone does not exist yet" and drops straight through to the very
# heuristic the comment above documents as having caused Zammad #17246.
# An unusable answer must stop the run, not silently pick a role.
- name: FAIL -- the zone list was not usable, so the live zone type is unknown
  vars:
    _status: "{{ technitium_dns_zone_list.json.status | default('') }}"
  ansible.builtin.fail:
    msg: >-
      The Technitium zone list did not return status "ok"
      (status={{ _status | default('<none>', true) }},
      http={{ technitium_dns_zone_list.status | default('<none>') }}).
      That says NOTHING about which zones exist, so this run must not fall back
      to the lowest-vmid heuristic -- doing so is what designated the SECONDARY
      as primary in Zammad #17246 while the run still exited green.
  when:
    - technitium_dns_apply | bool
    - _status != 'ok'

- name: Derive this node's live zone type
  ansible.builtin.set_fact:
    technitium_dns_live_zone_type: >-
      {{ (technitium_dns_zone_list.json.response.zones | default([]))
         | selectattr('name', 'equalto', technitium_dns_zone)
         | map(attribute='type') | first | default('') }}

- name: Resolve Technitium role and secondary IPs
  ansible.builtin.set_fact:
    # Precedence: an explicit override, then the LIVE zone type, then the
    # bootstrap heuristic for a zone that does not exist yet.
    technitium_dns_role: >-
      {{ technitium_dns_role if (technitium_dns_role | length > 0)
         else ('primary' if technitium_dns_live_zone_type == 'Primary'
               else ('secondary' if technitium_dns_live_zone_type | length > 0
                     else ('primary' if technitium_dns_host == technitium_dns_primary_ip
                           else 'secondary'))) }}
    technitium_dns_secondary_ips: >-
      {{ technitium_dns_secondary_ips if (technitium_dns_secondary_ips | length > 0)
         else (technitium_dns_members | default([]) | map(attribute='ip')
               | reject('equalto', technitium_dns_primary_ip) | list) }}

# Re-derive the ADDRESSES from the live roles, now that every member has
# published its own.
#
# THE BUG THIS EXISTS FOR. Correcting technitium_dns_role from the live zone
# type was not enough: technitium_dns_primary_ip above is still the lowest-vmid
# guess, and technitium_dns_secondary_ips is "every member except that guess".
# When the guess names the real SECONDARY, the "secondaries" list comes out
# holding the PRIMARY'S OWN address — and the AXFR authorisation task in
# ingress_and_apex.yml then writes a transfer ACL permitting the primary to
# transfer from itself while refusing the actual secondary. Every transfer is
# denied, the secondary keeps serving its last successful copy for the whole
# expiry window (a week here), and NOTHING reports an error: the primary sees a
# healthy zone, the converge exits 0, and only the secondary's `syncFailed` flag
# says otherwise. That is the same silent-divergence failure the SOA guard in
# health_check.yml exists to catch, arriving by a different route.
#
# Ansible completes a task across every host in the play before starting the
# next, so by this point each member's technitium_dns_role is readable from
# hostvars. Fall back to the values above when nothing is resolvable — a
# single-host run (--limit) cannot see its peers, and must not blank the ACL.
# Addresses come from `container_ip`/`ansible_host` — the same source the member
# list above uses — NOT from technitium_dns_host. technitium_dns_host is a
# PLAY-level var, and play vars are not reliably readable out of hostvars for
# OTHER hosts, so filtering on it silently yielded an empty peer list and this
# whole task fell through to the broken heuristic values it exists to replace.
- name: Map each member's live role to its address
  ansible.builtin.set_fact:
    technitium_dns_role_map: >-
      {{ (technitium_dns_role_map | default([])) + [{
           'role': hostvars[item].technitium_dns_role | default(''),
           'ip': hostvars[item].container_ip
                 | default(hostvars[item].ansible_host | default(''), true)
         }] }}
  loop: >-
    {{ groups['technitium_dns_group'] | default([])
       | reject('equalto', 'localhost') | select('in', hostvars) | list }}
  loop_control:
    label: "{{ item }}"

- name: Re-derive primary/secondary addresses from the live roles
  vars:
    _live_primaries: >-
      {{ technitium_dns_role_map | default([])
         | selectattr('role', 'equalto', 'primary')
         | map(attribute='ip') | reject('equalto', '') | list }}
    _live_secondaries: >-
      {{ technitium_dns_role_map | default([])
         | selectattr('role', 'equalto', 'secondary')
         | map(attribute='ip') | reject('equalto', '') | list }}
  ansible.builtin.set_fact:
    technitium_dns_primary_ip: >-
      {{ _live_primaries | first | default(technitium_dns_primary_ip, true) }}
    technitium_dns_secondary_ips: >-
      {{ _live_secondaries if (_live_secondaries | length > 0)
         else technitium_dns_secondary_ips }}

# Technitium authenticates API calls via `?token=...` query parameter,
# NOT via an X-Api-Token header. The header is silently ignored and
# the server responds with "Parameter 'token' missing."
- name: Check if DNS zone exists
  delegate_to: localhost
  ansible.builtin.uri:
    url: "{{ technitium_dns_api_url }}/api/zones/list?token={{ technitium_dns_api_token }}"
    method: GET
    return_content: true
    timeout: "{{ technitium_dns_api_timeout }}"
  register: technitium_dns_zones_response
  changed_when: false
  when: technitium_dns_apply | bool
  no_log: true

- name: Parse existing zones
  ansible.builtin.set_fact:
    technitium_dns_existing_zones: >-
      {{ technitium_dns_zones_response.json.response.zones | default([]) | map(attribute='name') | list }}
  when: technitium_dns_apply | bool
