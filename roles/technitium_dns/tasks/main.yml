---
# Technitium DNS Configuration Tasks
# Configures internal DNS zone with A records for all infrastructure hosts

- name: Validate required variables and authenticate to this node's API
  ansible.builtin.include_tasks: main/validate_and_auth.yml

- name: Build A-record data from inventory and resolve group topology
  ansible.builtin.include_tasks: main/build_records.yml

- name: Configure upstream forwarders and create the DNS zones
  ansible.builtin.include_tasks: main/forwarders_and_zones.yml

- name: Create/prune infrastructure A records and service CNAME aliases
  ansible.builtin.include_tasks: main/infra_a_records.yml

- name: Probe the ingress VIP and write the Traefik/Proxmox apex records
  ansible.builtin.include_tasks: main/ingress_and_apex.yml

- name: Verify the zone is active and configure the health-checked apex
  ansible.builtin.include_tasks: main/health_check.yml
