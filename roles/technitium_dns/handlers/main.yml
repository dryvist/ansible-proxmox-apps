---
- name: Restart Technitium DNS
  ansible.builtin.systemd_service:
    name: dns.service
    state: restarted
    daemon_reload: true

- name: Restart apex health timer
  ansible.builtin.systemd_service:
    name: technitium-apex-health.timer
    state: restarted
    daemon_reload: true
  become: true
