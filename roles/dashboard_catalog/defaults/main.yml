---
# The service catalog every estate dashboard renders from.
#
# Built ONCE, here, and consumed by the homarr, homepage and glance roles. The
# alternative — each board extracting its own list — is three places to forget a
# service and three ways for the boards to disagree.
#
# The source is the tofu-owned ingress table, which is already the single
# enumeration of everything Traefik fronts. So a service reaches every board by
# having a route, never by being added to a per-board list, and nothing here
# needs touching when one is added.

# The published route table. Same source the traefik role consumes.
dashboard_catalog_ingress: "{{ tofu_data.ingress | default([], true) }}"

# The ingress subdomain. Deliberately the SAME expression the traefik role uses
# (roles/traefik/defaults/main.yml) rather than a second definition — a board
# that composed hostnames differently would publish links that resolve nowhere.
dashboard_catalog_base_domain: "{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"

# Routes that should never appear on a board: machine/API surfaces a person
# cannot use, and the boards themselves.
dashboard_catalog_exclude:
  - s3
  - otel
  - splunk-hec
  - splunk-mgmt
  - homarr
  - homepage
  - glance

# Group display order. Anything not listed sorts after these, alphabetically.
dashboard_catalog_group_order:
  - apps
  - ai
  - media_svc
  - mgmt
  - siem
  - data
  - nonprod
  - other
