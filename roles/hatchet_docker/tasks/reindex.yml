---
- name: Validate Hatchet reindex activation
  ansible.builtin.assert:
    that:
      - hatchet_docker_worker_enabled | bool
      - hatchet_docker_worker_reindex_qdrant_url | length > 0
      - hatchet_docker_worker_reindex_router_url | length > 0
      - >-
        hatchet_docker_worker_reindex_repos | length > 0
        or hatchet_docker_worker_reindex_hindsight_export | length > 0
    fail_msg: Reindex requires an enabled worker, router and Qdrant URLs, and a source.

- name: Create the durable Hatchet reindex checkpoint and metrics directory
  ansible.builtin.file:
    path: "{{ hatchet_docker_worker_reindex_output_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
