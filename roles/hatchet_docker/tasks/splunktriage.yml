---
- name: Require explicit Splunk triage endpoints and worker
  ansible.builtin.assert:
    that:
      - hatchet_docker_worker_enabled | bool
      - hatchet_docker_worker_splunktriage_splunk_url | length > 0
      - hatchet_docker_worker_splunktriage_local_model_url | length > 0
    fail_msg: Splunk triage requires the worker and explicit Splunk and direct local model endpoints.
    quiet: true
  no_log: true

- name: Create private Splunk triage state directory
  ansible.builtin.file:
    path: "{{ hatchet_docker_worker_splunktriage_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
