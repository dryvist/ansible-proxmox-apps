---
# Hatchet's split OSS control plane runs on each Docker AI guest.
# Both guests share the existing PostgreSQL database and Postgres message queue.

# renovate: datasource=docker depName=ghcr.io/hatchet-dev/hatchet/hatchet-migrate
hatchet_docker_migrate_image: >-
  {{ 'ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.114.2@sha256:'
     ~ 'fee74780773f7e76c4d090437a1cbdebad12a5ae90a5705ffad4e306d69b70d8' }}
# renovate: datasource=docker depName=ghcr.io/hatchet-dev/hatchet/hatchet-admin
hatchet_docker_admin_image: >-
  {{ 'ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.114.2@sha256:'
     ~ 'e5d8fd721d196d51cb631871d11d120b06fd3a4f29fa063c06955d8ec8930873' }}
# renovate: datasource=docker depName=ghcr.io/hatchet-dev/hatchet/hatchet-engine
hatchet_docker_engine_image: >-
  {{ 'ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.114.2@sha256:'
     ~ '247120b5fabb0085784d3adcf4aebfaca670a400c950d7f53d7ea95c858b4f21' }}
# renovate: datasource=docker depName=ghcr.io/hatchet-dev/hatchet/hatchet-dashboard
hatchet_docker_dashboard_image: >-
  {{ 'ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:v0.114.2@sha256:'
     ~ 'f65358c7fcdaeb2b48abf23b737012bc9fd834bef3b976dd9f26a983cb4be0d8' }}

hatchet_docker_data_dir: /opt/hatchet
hatchet_docker_restart_policy: unless-stopped

# Host ports are published by ToFu; container ports follow the Hatchet image contract.
hatchet_docker_web_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hatchet_web']
     | mandatory('tofu_data.constants.service_ports.hatchet_web missing') }}
hatchet_docker_grpc_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hatchet_grpc']
     | mandatory('tofu_data.constants.service_ports.hatchet_grpc missing') }}
hatchet_docker_health_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hatchet_health']
     | mandatory('tofu_data.constants.service_ports.hatchet_health missing') }}
hatchet_docker_ui_container_port: 80
hatchet_docker_api_container_port: 8080
hatchet_docker_grpc_container_port: 7070
hatchet_docker_health_container_port: 8733

# PostgreSQL database identity. The password is supplied by docker_ai_group.yml.
hatchet_docker_db_name: hatchet
hatchet_docker_db_user: hatchet
hatchet_docker_db_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['postgres_default']
     | mandatory('tofu_data.constants.service_ports.postgres_default missing') }}
hatchet_docker_db_ssl_mode: disable
hatchet_docker_database_url: >-
  {{ 'postgresql://' ~ hatchet_docker_db_user ~ ':'
     ~ (hatchet_docker_db_password | urlencode | replace('/', '%2F'))
     ~ '@' ~ hatchet_docker_db_host ~ ':' ~ hatchet_docker_db_port
     ~ '/' ~ hatchet_docker_db_name ~ '?sslmode=' ~ (hatchet_docker_db_ssl_mode | urlencode) }}

hatchet_docker_subdomain: >-
  {{ lookup('env', 'PROXMOX_SUBDOMAIN')
     | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
     | mandatory('PROXMOX_SUBDOMAIN required') }}
hatchet_docker_fqdn: "hatchet.{{ hatchet_docker_subdomain }}"
hatchet_docker_engine_fqdn: "hatchet-engine.{{ hatchet_docker_subdomain }}"
hatchet_docker_server_url: "https://{{ hatchet_docker_fqdn }}"
hatchet_docker_engine_broadcast_address: "{{ hatchet_docker_engine_fqdn }}:443"
hatchet_docker_admin_email: >-
  admin@{{ hostvars['localhost']['tofu_data']['domain'] }}
hatchet_docker_admin_name: Hatchet Admin

# --- HA topology --------------------------------------------------------------
# Every member of the control-plane group runs a full engine+API replica behind
# Traefik, all sharing the apps PostgreSQL primary and its Postgres-backed
# queue. Hosts are parameterized by inventory, never named here: tofu-proxmox
# tags guests `docker-ai` and load_tofu builds the group from that tag, so a
# replica is added or removed in deployment.json alone.

# Minimum engine+API replicas the HA contract requires. Kill test A exercises
# exactly the two-guest pair; more members are fine — migration and seeding
# stay run-once. The converge refuses to deploy below this floor, so a
# degraded group fails loudly instead of silently un-HA-ing the control plane.
hatchet_docker_min_replicas: 2

# Group holding the control plane. Keep in step with the `hosts:` of the
# hatchet_docker play in playbooks/site/03-notifications-and-core-apps.yml.
# .get keeps the expression renderable when the group does not exist yet
# (template-render, pytest) — same shape as the postgres role's slot list.
hatchet_docker_control_plane_group: docker_ai_group
hatchet_docker_replicas: >-
  {{ groups.get(hatchet_docker_control_plane_group, []) | length }}

# The published ingress rows for the two fronted names. tofu-proxmox owns the
# table (locals.tf `ingress_services`); this role only reads it — the same
# derive-don't-copy contract as object_storage's "s3" route and traefik's
# traefik_ingress_routes.
hatchet_docker_ingress_routes: >-
  {{ hostvars['localhost']['tofu_data']['ingress'] | default([], true) }}
hatchet_docker_ui_ingress_route: >-
  {{ hatchet_docker_ingress_routes
     | selectattr('name', 'equalto', 'hatchet') | list | first | default({}) }}
hatchet_docker_engine_ingress_route: >-
  {{ hatchet_docker_ingress_routes
     | selectattr('name', 'equalto', 'hatchet-engine') | list | first | default({}) }}

# A row names either a single backend (`ip`) or a pool (`backends`); count both
# shapes the way the traefik route builder normalizes servers.
hatchet_docker_ui_ingress_backends: >-
  {{ (hatchet_docker_ui_ingress_route.backends
      | default([hatchet_docker_ui_ingress_route.ip | default('')], true))
     | reject('equalto', '') | list }}
hatchet_docker_engine_ingress_backends: >-
  {{ (hatchet_docker_engine_ingress_route.backends
      | default([hatchet_docker_engine_ingress_route.ip | default('')], true))
     | reject('equalto', '') | list }}

# HA is ingress-ready when each published route pools at least the replica
# floor behind Traefik's own backend health check — an ejecting health check is
# what turns a dead guest into a routing no-op instead of a black hole.
hatchet_docker_ui_ingress_ha_ready: >-
  {{ (hatchet_docker_ui_ingress_backends | length >= hatchet_docker_min_replicas | int)
     and (hatchet_docker_ui_ingress_route.health_check | default(false) | bool) }}
hatchet_docker_engine_ingress_ha_ready: >-
  {{ (hatchet_docker_engine_ingress_backends | length >= hatchet_docker_min_replicas | int)
     and (hatchet_docker_engine_ingress_route.health_check | default(false) | bool) }}
hatchet_docker_ingress_ha_ready: >-
  {{ (hatchet_docker_ui_ingress_ha_ready | bool)
     and (hatchet_docker_engine_ingress_ha_ready | bool) }}
