---
# Hatchet Lite is the single-container path for development and low-volume use.
# It uses the shared apps PostgreSQL cluster for durable workflow state.

# renovate: datasource=docker depName=ghcr.io/hatchet-dev/hatchet/hatchet-lite
hatchet_docker_image: >-
  ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.110.23@sha256:d4c8e8234d423cc93ba20f3dad7ac30de71a836e9c5888a7ebdf76dc2e417e13

hatchet_docker_container_name: hatchet
hatchet_docker_data_dir: /opt/hatchet
hatchet_docker_restart_policy: unless-stopped

# Host ports are published by the later ToFu inventory change. The container
# ports are part of the Hatchet Lite image contract.
hatchet_docker_web_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hatchet_web']
     | mandatory('tofu_data.constants.service_ports.hatchet_web missing') }}
hatchet_docker_grpc_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['hatchet_grpc']
     | mandatory('tofu_data.constants.service_ports.hatchet_grpc missing') }}
hatchet_docker_web_container_port: 8888
hatchet_docker_grpc_container_port: 7070

# PostgreSQL database identity. The password is supplied by hatchet_group.yml.
hatchet_docker_db_name: hatchet
hatchet_docker_db_user: hatchet
hatchet_docker_db_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['postgres_default']
     | mandatory('tofu_data.constants.service_ports.postgres_default missing') }}
hatchet_docker_db_ssl_mode: disable

hatchet_docker_subdomain: >-
  {{ lookup('env', 'PROXMOX_SUBDOMAIN')
     | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
     | mandatory('PROXMOX_SUBDOMAIN required') }}
hatchet_docker_fqdn: "hatchet.{{ hatchet_docker_subdomain }}"
hatchet_docker_engine_fqdn: "hatchet-engine.{{ hatchet_docker_subdomain }}"
hatchet_docker_server_url: "https://{{ hatchet_docker_fqdn }}"
hatchet_docker_engine_broadcast_address: "{{ hatchet_docker_engine_fqdn }}:443"
hatchet_docker_admin_email: >-
  admin@{{ hostvars['localhost']['tofu_data']['domain'] }}
hatchet_docker_admin_name: Hatchet Admin

# Optional Hatchet worker that dispatches one agent run per task. It has no GPU
# access; concurrency is enforced by Hatchet per configured LLM role.
hatchet_docker_worker_enabled: false
hatchet_docker_worker_roles:
  medium:
    max_runs: 3
  gpu-4080:
    max_runs: 1
# Configure each platform with name, run_url, auth_env (or null), timeout_s,
# and auth_secret_key when auth_env is set. Secret values stay in OpenBao.
hatchet_docker_worker_platforms: []

# renovate: datasource=docker depName=python
hatchet_docker_worker_image: >-
  python:3.13.18-slim-trixie@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
# renovate: datasource=pypi depName=hatchet-sdk
hatchet_docker_worker_sdk_version: "1.44.0"
