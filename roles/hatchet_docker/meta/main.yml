---
galaxy_info:
  author: Jacob Evans
  description: >-
    Self-hosted Hatchet batch workflow control plane using Hatchet Lite,
    Docker Compose, and the shared PostgreSQL cluster.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
  galaxy_tags:
    - ai
    - automation
    - docker
    - hatchet

dependencies:
  - role: docker_engine
    docker_engine_configure_daemon_json: true

collections:
  - community.docker
