---
galaxy_info:
  author: JacobPEvans
  description: >-
    OpenHands AI agent platform: the Agent Canvas install plus the agent
    server and automation service.
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - docker
    - agents
    - openhands

dependencies:
  # Shared Docker bootstrap (docker-ce + compose plugin). The service user joins
  # the docker group, so the daemon must be installed before the role runs.
  - role: docker_engine
    docker_engine_configure_daemon_json: true
