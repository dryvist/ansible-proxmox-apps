---
# OpenHands: identities and state, then the Agent Canvas install. The service
# comes in a later PR; the role reads no secret facts.

- name: Create the OpenHands group
  ansible.builtin.group:
    name: "{{ openhands_user }}"
    system: true

- name: Create the OpenHands system user
  ansible.builtin.user:
    name: "{{ openhands_user }}"
    group: "{{ openhands_user }}"
    system: true
    create_home: false
    home: "{{ openhands_state_dir }}"
    shell: /bin/sh
    password_lock: true
    # Conversation containers are launched through the host's Docker daemon,
    # so the service user needs direct daemon access.
    groups: docker
    append: true

- name: Create the OpenHands state directory
  ansible.builtin.file:
    path: "{{ openhands_state_dir }}"
    state: directory
    owner: "{{ openhands_user }}"
    group: "{{ openhands_user }}"
    mode: "0750"

- name: Install Agent Canvas and its runtimes
  ansible.builtin.include_tasks: install.yml
