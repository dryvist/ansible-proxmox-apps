---
# OpenHands skeleton: identity and state directory only. The install (Agent
# Canvas, agent server, automation server) and the service arrive in later
# PRs. Sandbox guests receive empty secret facts by design, so this role
# never reads any secret fact: credentials arrive through an on-host AppRole.

- name: Create the OpenHands group
  ansible.builtin.group:
    name: "{{ openhands_user }}"
    system: true

- name: Create the OpenHands system user
  ansible.builtin.user:
    name: "{{ openhands_user }}"
    group: "{{ openhands_user }}"
    system: true
    create_home: false
    home: "{{ openhands_state_dir }}"
    shell: /bin/sh
    password_lock: true
    # Conversation containers are launched through the host's Docker daemon,
    # so the service user needs direct daemon access.
    groups: docker
    append: true

- name: Create the OpenHands state directory
  ansible.builtin.file:
    path: "{{ openhands_state_dir }}"
    state: directory
    owner: "{{ openhands_user }}"
    group: "{{ openhands_user }}"
    mode: "0750"
