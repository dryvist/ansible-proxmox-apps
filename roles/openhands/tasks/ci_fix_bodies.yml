---
# Build the CI-fix and scheduled automation request bodies as a fact from the validated config
# and the resolved profile ids (_openhands_ci_fix_profile_ids). No API calls.

- name: Render the CI-fix trigger filter for each visibility
  ansible.builtin.set_fact:
    _openhands_ci_fix_filter: >-
      workflow_run.conclusion == 'failure'
      && contains({{ openhands_ci_fix_gate_workflows | to_json | replace('"', "'") }}, workflow_run.name)
      && length(workflow_run.pull_requests) > `0`
      && workflow_run.head_repository.full_name == workflow_run.repository.full_name
      && repository.private == `PRIVATE`
      && contains({{ _openhands_ci_fix.owners | to_json | replace('"', "'") }}, repository.owner.login)

- name: Build the CI-fix automation request bodies
  vars:
    _ids: "{{ _openhands_ci_fix_profile_ids }}"
    _trigger:
      type: event
      source: "{{ openhands_ci_fix_event_source }}"
      "on": workflow_run.completed
      destination: continue_conversation
      subject_key_expr: >-
        join('#', [repository.full_name, to_string(workflow_run.pull_requests[0].number), workflow_run.name])
    _common:
      enabled: false
      timeout: 3600
      tags: [ci-fix]
      prompt: "{{ openhands_ci_fix_prompt }}"
  ansible.builtin.set_fact:
    _openhands_ci_fix_bodies:
      - >-
        {{ _common | combine({'name': 'ci-fix-public', 'agent_profile_id': _ids[_openhands_ci_fix.profile_public],
           'trigger': _trigger | combine({'filter': _openhands_ci_fix_filter | replace('PRIVATE', 'false')})}) }}
      - >-
        {{ _common | combine({'name': 'ci-fix-private', 'agent_profile_id': _ids[_openhands_ci_fix.profile_private],
           'trigger': _trigger | combine({'filter': _openhands_ci_fix_filter | replace('PRIVATE', 'true')})}) }}

# The scheduled-automation prompt lives in a Jinja template next to the role
# (templates/repo-fit-audit.prompt.md.j2), not in the defaults. The agent-platform
# conformance schema caps every prompt value in role YAML at five logical lines,
# so the defaults carry only a short loader and the full audit text is rendered
# here, at body-build time, into the request body.

- name: Add the scheduled automation request bodies
  ansible.builtin.set_fact:
    _openhands_ci_fix_bodies: >-
      {{ _openhands_ci_fix_bodies + [{
           'name': item.name,
           'enabled': item.enabled | default(false) | bool,
           'timeout': item.timeout | default(1800) | int,
           'tags': ['scheduled'],
           'prompt': lookup('ansible.builtin.template', _openhands_repo_fit_audit_template),
           'agent_profile_id': _openhands_ci_fix_profile_ids[_openhands_ci_fix[item.profile]],
           'trigger': {'type': 'cron', 'schedule': item.schedule, 'timezone': 'UTC'}}] }}
  loop: "{{ openhands_scheduled_automations }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _openhands_repo_fit_audit_template: >-
      {{ (role_path | default('', true) or playbook_dir + '/../../../roles/openhands')
         + '/templates/repo-fit-audit.prompt.md.j2' }}
