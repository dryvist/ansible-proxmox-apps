---
- name: Assert the service startup inputs
  ansible.builtin.assert:
    that:
      - openhands_router_key_file | trim | length > 0
      - openhands_router_base_url | length > 0
      - openhands_router_model | length > 0
      - openhands_backend_key_file | trim | length > 0
    fail_msg: >-
      The enabled service requires openhands_router_key_file and
      openhands_backend_key_file to name root-only key files, along with the
      router base URL and model.
    quiet: true
  when: openhands_service_enabled | bool
