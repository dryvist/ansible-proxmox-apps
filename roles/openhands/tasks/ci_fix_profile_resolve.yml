---
# Map the listed agent profiles (_openhands_ci_fix_profiles) by name to id and
# find which configured CI-fix profile names are missing. With
# _openhands_ci_fix_require true, a missing profile stops the run.

- name: Resolve the CI-fix profile names to ids
  vars:
    _wanted: "{{ [_openhands_ci_fix.profile_public, _openhands_ci_fix.profile_private] }}"
    _known: "{{ _openhands_ci_fix_profiles | items2dict(key_name='name', value_name='id') }}"
  ansible.builtin.set_fact:
    _openhands_ci_fix_profile_ids: "{{ _known }}"
    _openhands_ci_fix_profile_missing: "{{ _wanted | difference(_known.keys() | list) }}"

- name: Report the CI-fix profiles
  ansible.builtin.debug:
    msg: >-
      CI-fix profiles found:
      {{ [_openhands_ci_fix.profile_public, _openhands_ci_fix.profile_private]
         | difference(_openhands_ci_fix_profile_missing) | join(', ') or 'none' }};
      missing: {{ _openhands_ci_fix_profile_missing | join(', ') or 'none' }}

- name: Stop when a CI-fix profile is missing
  ansible.builtin.fail:
    msg: >-
      Missing OpenHands agent profile(s) for the CI-fix automations:
      {{ _openhands_ci_fix_profile_missing | join(', ') }}.
  when:
    - _openhands_ci_fix_require | bool
    - _openhands_ci_fix_profile_missing | length > 0
