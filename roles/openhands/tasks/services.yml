---
# The Agent Canvas launcher: the agent server and automation venv install, the
# generate-once secrets the launcher loads, its systemd unit, and the unit's
# enable state. Units and files from earlier revisions are removed on every
# converge.

- name: Require the service inputs when enabled
  ansible.builtin.include_tasks: assert_service_inputs.yml

- name: Create the services virtualenv
  # Guarded by a versioned marker, not bin/python, so a bump of
  # openhands_services_python_version rebuilds the venv.
  ansible.builtin.command:
    argv:
      - "{{ openhands_uv_venv }}/bin/uv"
      - venv
      - --clear
      - --python
      - "{{ openhands_services_python_version }}"
      - "{{ openhands_services_venv }}"
  args:
    creates: "{{ openhands_services_venv }}/.python-{{ openhands_services_python_version }}"
  environment:
    UV_PYTHON_INSTALL_DIR: "{{ openhands_python_install_dir }}"
    UV_PYTHON_INSTALL_MIRROR: "{{ openhands_python_install_mirror }}"
  when: not (ansible_check_mode and openhands_install_packages is changed)

- name: Mark the services virtualenv's Python version
  ansible.builtin.copy:
    content: "{{ openhands_services_python_version }}\n"
    dest: "{{ openhands_services_venv }}/.python-{{ openhands_services_python_version }}"
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and openhands_install_packages is changed)

- name: Read the installed service releases
  ansible.builtin.command:
    argv:
      - "{{ openhands_services_venv }}/bin/python"
      - -c
      - "from importlib.metadata import version; print(version('{{ item }}'))"
  loop:
    - openhands-agent-server
    - openhands-automation
  loop_control:
    label: "{{ item }}"
  register: openhands_services_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the agent server and automation through the PyPI cache
  ansible.builtin.command:
    argv:
      - "{{ openhands_uv_venv }}/bin/uv"
      - pip
      - install
      - --python
      - "{{ openhands_services_venv }}/bin/python"
      - "--index-url={{ openhands_pypi_cache_url }}"
      - "openhands-agent-server=={{ openhands_agent_server_version }}"
      - "openhands-automation=={{ openhands_automation_version }}"
  vars:
    _openhands_installed_versions: >-
      {{ dict(
           openhands_services_installed.results | map(attribute='item')
           | zip(openhands_services_installed.results
                 | map(attribute='stdout', default=''))) }}
  # Reinstalled only when an installed release is not exactly the pin; the
  # automation package itself pins the matching openhands-sdk release.
  when: >-
    _openhands_installed_versions['openhands-agent-server']
    != openhands_agent_server_version
    or _openhands_installed_versions['openhands-automation']
    != openhands_automation_version
  changed_when: true
  notify: Restart the OpenHands launcher

- name: Create the service secrets directory
  ansible.builtin.file:
    path: "{{ openhands_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: openhands_service_enabled | bool

- name: Read the generate-once service secrets
  ansible.builtin.slurp:
    src: "{{ openhands_secrets_dir }}/{{ item }}"
  loop:
    - secret-key
    - automation-kv-secret
  register: openhands_service_secret_files
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: openhands_service_enabled | bool

- name: Generate the service secrets a first enable is missing
  # python3's own secrets module, so the generation needs no extra package.
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import secrets; print(secrets.token_hex(32))"
  loop: >-
    {{ openhands_service_secret_files.results
       | default([], true)
       | rejectattr('content', 'defined')
       | map(attribute='item')
       | list }}
  loop_control:
    label: "{{ item }}"
  register: openhands_service_secrets_generated
  changed_when: true
  no_log: true
  # Under --check a first enable previews everything without generating, so
  # the resolved secrets below resolve empty and the launcher renders unarmed.
  when: openhands_service_enabled | bool and not ansible_check_mode

- name: Store the generated service secrets
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ openhands_secrets_dir }}/{{ item.item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ openhands_service_secrets_generated.results | default([], true) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item is not skipped
  no_log: true
  notify: Restart the OpenHands launcher

- name: Resolve the effective service secrets
  ansible.builtin.set_fact:
    openhands_service_secrets: >-
      {{ dict(
           openhands_service_secret_files.results | default([], true)
           | map(attribute='item')
           | zip(openhands_service_secret_files.results | default([], true)
                 | map(attribute='content', default='')
                 | map('b64decode')
                 | map('trim')))
         | combine(dict(
             openhands_service_secrets_generated.results | default([], true)
             | map(attribute='item')
             | zip(openhands_service_secrets_generated.results
                   | default([], true)
                   | map(attribute='stdout', default='')
                   | map('trim')))) }}
  no_log: true
  when: openhands_service_enabled | bool

- name: Require the resolved service secrets
  ansible.builtin.assert:
    that:
      - openhands_service_secrets['secret-key'] | length > 0
      - openhands_service_secrets['automation-kv-secret'] | length > 0
    fail_msg: >-
      The service secrets did not resolve. A real (non-check) run with the
      service enabled must find or generate both values under
      {{ openhands_secrets_dir }}.
    quiet: true
  when: openhands_service_enabled | bool and not ansible_check_mode

- name: Find the retired OpenHands units
  # The agent-server and automation units from earlier revisions. A host
  # converged from one of them still has both, so they are stopped and removed.
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop:
    - openhands-agent-server
    - openhands-automation
  loop_control:
    label: "{{ item }}"
  register: openhands_retired_units
  check_mode: false

- name: Stop and disable the retired OpenHands units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ openhands_retired_units.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove the retired OpenHands units, environment file and secrets
  # The shared environment file held every service secret in one place. The
  # two secrets below were read only by the retired units.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/openhands-agent-server.service
    - /etc/systemd/system/openhands-automation.service
    - "{{ openhands_install_dir }}/openhands.env"
    - "{{ openhands_secrets_dir }}/session-api-key"
    - "{{ openhands_secrets_dir }}/automation-local-api-key"
  loop_control:
    label: "{{ item }}"

- name: Install the Agent Canvas launcher unit
  ansible.builtin.template:
    src: openhands-canvas.service.j2
    dest: /etc/systemd/system/openhands-canvas.service
    owner: root
    group: root
    mode: "0644"
  vars:
    _service_hardening_template: >-
      {{ role_path }}/../_shared/templates/systemd-service-hardening.conf.j2
    _service_common_template: "{{ role_path }}/templates/openhands-service-common.conf.j2"
  notify: Restart the OpenHands launcher

- name: Set the Agent Canvas launcher's enable state
  ansible.builtin.systemd_service:
    name: openhands-canvas
    enabled: "{{ openhands_service_enabled | bool }}"
    state: "{{ 'started' if (openhands_service_enabled | bool) else 'stopped' }}"
    daemon_reload: true

- name: Wait for the Agent Canvas launcher to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ openhands_canvas_port }}"
    timeout: 90
  changed_when: false
  when: openhands_service_enabled | bool and not ansible_check_mode

- name: Verify the Agent Canvas launcher answers on loopback
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openhands_canvas_port }}/"
    method: GET
    status_code: "{{ openhands_canvas_health_statuses }}"
  register: openhands_canvas_health
  retries: 12
  delay: 5
  until: openhands_canvas_health.status in openhands_canvas_health_statuses
  changed_when: false
  check_mode: false
  when: openhands_service_enabled | bool and not ansible_check_mode
