---
# Validate the parsed CI-fix config. No API calls are made here.

- name: Assert the CI-fix config has the expected shape
  vars:
    # The agent server's profile name pattern.
    _name: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    _cfg: "{{ _openhands_ci_fix }}"
  ansible.builtin.assert:
    that:
      - _cfg.owners is sequence and _cfg.owners is not string
      - _cfg.owners | length > 0
      - _cfg.owners | reject('string') | list | length == 0
      - _cfg.profile_public is string and _cfg.profile_public is match(_name)
      - _cfg.profile_private is string and _cfg.profile_private is match(_name)
      - _cfg.profile_public != _cfg.profile_private
      - not openhands_ci_fix_profiles_create or (_cfg.route_public | default('') | string | length > 0)
      - not openhands_ci_fix_profiles_create or (_cfg.route_private | default('') | string | length > 0)
    fail_msg: >-
      The CI-fix config must have a non-empty owners list of strings and two
      different profile names in profile_public and profile_private, plus
      route_public and route_private when profile creation is on.
    quiet: true
