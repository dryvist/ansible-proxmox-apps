---
# Install unpoller (UniFi controller poller) as a pinned-version systemd
# service, mirroring roles/node_exporter's controller-staged binary pattern
# (#2162): egress-restricted guests cannot reach github.com themselves, so
# the release is fetched once on the controller and copied to the guest.

- name: Assert critical variables are defined and valid
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
      - unpoller_version is defined and unpoller_version | length > 0
      - unpoller_controller_url | length > 0
      - unpoller_controller_url is not match('^https?://\\d+\\.\\d+\\.\\d+\\.\\d+')
      - unpoller_controller_user | length > 0
      - unpoller_controller_password | length > 0
    fail_msg: >-
      One or more critical configuration variables (architecture, unpoller
      version, or controller URL/credentials) are undefined, empty, or the
      controller URL is a literal IP instead of an FQDN.
    quiet: true
  no_log: true
  tags:
    - unpoller

- name: Create unpoller system user
  ansible.builtin.user:
    name: "{{ unpoller_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags:
    - unpoller

- name: Create unpoller install directory
  ansible.builtin.file:
    path: "{{ unpoller_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - unpoller

# Staged on the controller (unrestricted egress), never downloaded by the
# guest itself -- see roles/node_exporter/tasks/main.yml for the precedent.
# throttle: 1 serializes this one task across every host in the play so two
# guests sharing an arch never race writing the same controller-side dest;
# get_url's own checksum check then makes every host after the first a no-op.
- name: Stage the pinned unpoller release tarball on the controller
  ansible.builtin.get_url:
    url: "{{ unpoller_download_url }}"
    dest: "/tmp/{{ unpoller_release }}.tar.gz"
    checksum: "sha256:{{ unpoller_checksums_url }}"
    mode: "0644"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  throttle: 1
  tags:
    - unpoller

- name: Copy the staged release tarball to the guest
  ansible.builtin.copy:
    src: "/tmp/{{ unpoller_release }}.tar.gz"
    dest: "{{ unpoller_install_dir }}/{{ unpoller_release }}.tar.gz"
    owner: root
    group: root
    mode: "0644"
  tags:
    - unpoller

- name: Create the versioned unpack directory
  ansible.builtin.file:
    path: "{{ unpoller_install_dir }}/{{ unpoller_release }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - unpoller

# The unpoller release tarball has no wrapping directory (binary + LICENSE +
# examples/ all sit at tar root), unlike node_exporter's -- unpack into the
# versioned directory created above, guarded by the binary's own presence.
- name: Unpack the unpoller release
  ansible.builtin.unarchive:
    src: "{{ unpoller_install_dir }}/{{ unpoller_release }}.tar.gz"
    dest: "{{ unpoller_install_dir }}/{{ unpoller_release }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ unpoller_install_dir }}/{{ unpoller_release }}/unpoller"
  tags:
    - unpoller

- name: Install the unpoller binary
  ansible.builtin.copy:
    src: "{{ unpoller_install_dir }}/{{ unpoller_release }}/unpoller"
    dest: /usr/local/bin/unpoller
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart unpoller
  tags:
    - unpoller

- name: Deploy the unpoller environment file
  ansible.builtin.template:
    src: unpoller.env.j2
    dest: /etc/unpoller.env
    owner: "{{ unpoller_user }}"
    group: "{{ unpoller_user }}"
    mode: "0600"
  no_log: true
  notify: Restart unpoller
  tags:
    - unpoller

- name: Deploy the unpoller systemd unit
  ansible.builtin.template:
    src: unpoller.service.j2
    dest: /etc/systemd/system/unpoller.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart unpoller
  tags:
    - unpoller

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers
  tags:
    - unpoller

- name: Enable and start unpoller
  ansible.builtin.systemd:
    name: unpoller
    state: started
    enabled: true
  tags:
    - unpoller
