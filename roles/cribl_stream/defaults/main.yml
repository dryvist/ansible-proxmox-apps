---
# Cribl Stream native install role defaults

# Installation
# Pinned to 4.12.2 alongside Cribl Edge (single fleet version; routes-based
# input fan-out requires >= 4.12). GATED on the L19 single-node 4.12.2 spike.
# NOTE: the cribl_stream_group group_vars override the tarball URL with the
# object-storage mirror; re-stage the mirrored object with the 4.12.2 build
# together with this bump.
cribl_stream_version: "4.12.2"
cribl_stream_tarball_base: "https://cdn.cribl.io/dl"
# Upstream release URL. Cribl's CDN uses two different filename patterns:
#   - versioned release: https://cdn.cribl.io/dl/4.12.2/cribl-4.12.2-linux-x64.tgz
#   - rolling "latest":  https://cdn.cribl.io/dl/latest/cribl-linux-x64.tgz    (no version in filename)
# Group vars for the `cribl_stream_group` override this with an object-storage mirror URL
# because the cribl-stream containers have the `outbound-internal` firewall
# and cannot reach cdn.cribl.io directly.
cribl_stream_tarball_url: >-
  {{ cribl_stream_tarball_base }}/{{ cribl_stream_version }}/{{
  'cribl-linux-x64.tgz' if cribl_stream_version == 'latest'
  else 'cribl-' + cribl_stream_version + '-linux-x64.tgz' }}
cribl_stream_install_dir: /opt/cribl

# Service user
cribl_stream_user: cribl
cribl_stream_group: cribl

# Service configuration
cribl_stream_service_name: cribl
cribl_stream_service_state: started
cribl_stream_service_enabled: true

# NetFlow port from tofu constants
cribl_stream_netflow_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['netflow_ports']['unifi'] }}

# Cribl-to-Cribl (S2S) listener for remote Edge nodes, fronted by HAProxy.
# Port from tofu constants (single source of truth).
cribl_stream_s2s_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['cribl_s2s'] }}

# OTLP/HTTP trace-ingest listener, fronted by the otel Traefik ingress.
# Port from tofu constants (single source of truth).
cribl_stream_otel_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['otel_traces_http'] }}

# Langfuse OTLP destination for the LLM fabric traces. The output and its
# input connection render unconditionally: a missing key aborts the converge
# instead of silently dropping the destination from the rendered config.
# `lookup('env', ...)` returns "" (a *defined* empty string) when the var is
# unset, which `mandatory` would happily pass through, so `default(undef(),
# true)` coerces the empty string to undefined first.
# The OTLP *base*, with no signal path. The open_telemetry output appends the
# per-signal path (`/v1/traces`) itself, so carrying it here renders
# `/api/public/otel/v1/traces/v1/traces`, which the backend answers 404 — a
# destination that fails every POST while the input and pipeline both stay
# green. Keep this at the base and let the output type append.
cribl_stream_langfuse_url: >-
  https://langfuse.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required') }}/api/public/otel
cribl_stream_langfuse_public_key: >-
  {{ lookup('env', 'LANGFUSE_PUBLIC_KEY')
     | default(undef(), true)
     | mandatory('LANGFUSE_PUBLIC_KEY is required for the langfuse_otlp output') }}
cribl_stream_langfuse_secret_key: >-
  {{ lookup('env', 'LANGFUSE_SECRET_KEY')
     | default(undef(), true)
     | mandatory('LANGFUSE_SECRET_KEY is required for the langfuse_otlp output') }}

# Arize Phoenix OTLP destination — the second leg of the same in_otel input,
# rendered unconditionally for the same reason as Langfuse above. Phoenix
# authenticates OTLP/HTTP with a bearer API key (minted in its UI, seeded to
# ai/phoenix as PHOENIX_INGEST_API_KEY); the bao-first read with the env
# fallback lives in inventory/group_vars/cribl_stream_group.yml.
#
# BASE URL ONLY, for the same reason spelled out for Langfuse above: the
# open_telemetry destination appends the per-signal path itself. Phoenix serves
# OTLP at /v1/traces off the root, so writing that path here produces
# /v1/traces/v1/traces — a 404 on every POST while the input, the pipeline and
# the converge all stay green. Test cribl_stream_phoenix.yml asserts the
# rendered endpoint carries no signal path.
cribl_stream_phoenix_url: >-
  https://phoenix.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required') }}
cribl_stream_phoenix_api_key: >-
  {{ lookup('env', 'PHOENIX_INGEST_API_KEY')
     | default(undef(), true)
     | mandatory('PHOENIX_INGEST_API_KEY is required for the phoenix_otlp output') }}

# Splunk HEC output configuration. Host comes from the one shared
# splunk_hec_base_url (inventory/group_vars/all.yml) — never reconstructed
# here (apps#588: a local "splunk.<zone>:8088" build black-holed every HEC
# POST the moment the bare `splunk` alias stopped resolving direct-to-host).
cribl_stream_splunk_hec_token: "{{ lookup('env', 'SPLUNK_HEC_TOKEN') }}"
# Per-index HEC (one index = one token). When HEC_NAMESPACE (Doppler) is set,
# single-index inputs send to a dedicated splunk_hec_<index> output whose token
# is derived as uuid5('splunk-hec-<index>', HEC_NAMESPACE) — identical to the
# Splunk side. Only netflow (in_ipfix) is single-index; the S2S input
# (in_cribl_s2s) fans one TCP stream into many indexes by datatype and stays
# on the shared legacy output. Since 4.12 a routes table COULD split it per
# index (the Edge otel input already fans out that way) — kept as-is here
# because the per-datatype token split is a separate migration.
cribl_stream_hec_namespace: "{{ lookup('env', 'HEC_NAMESPACE') | default('', true) }}"

# AI/LLM log routing from tofu constants (single source of truth): per source
# name — HAProxy-fronted TCP port plus the Splunk index/sourcetype the ai_stamp
# pipeline stamps. Guarded with default({}) so an inventory that predates
# ai_log_routing renders no AI inputs instead of failing.
cribl_stream_ai_log_routing: >-
  {{ hostvars['localhost']['tofu_data']['constants']['ai_log_routing']
     | default({}) }}

# Input type per AI source. Default is tcpjson (agent CLIs / serving hosts ship
# newline-delimited JSON over TCP). rsyslog senders (omfwd) speak RFC3164/5424,
# so their inputs must be syslog-type instead. Names here are the pre-`_docker`
# rsyslog senders that need an explicit override; every `*_docker` name (the
# journald-driver-tagged Docker-in-LXC AI services, syslog_forwarder role)
# classifies as syslog by suffix in inputs.yml.j2 — no per-service entry
# needed here as tofu-proxmox adds more of them.
cribl_stream_ai_input_types:
  homelab_llm: syslog
  openbao_audit: syslog
  hermes_agent: syslog

# Per-index HEC outputs to render: netflow (in_ipfix), otel_traces and
# ai_usage (in_otel spans and log records), plus every unique index named in
# ai_log_routing (claude/codex/gemini/openai/
# vscode/llm/openbao_audit/hermes with the current tofu constants) — derived,
# never hand-maintained.
cribl_stream_per_index_indexes: >-
  {{ (['netflow', 'otel_traces', 'ai_usage']
      + (cribl_stream_ai_log_routing.values() | map(attribute='index') | list))
     | unique | list }}
# Post-processing pipeline applied to every splunk_hec output, base and
# per-index alike. It names a pipeline inside the redaction pack, addressed
# `<pack>/<pipeline>`; the pack is installed by dryvist.homelab.cribl_packs,
# not by this role, so the value is declared here rather than discovered at
# converge time and does not depend on when the pack lands. Set it to an empty
# string to render no post-processing at all, which is the escape hatch if the
# pack is ever unavailable on a node.
cribl_stream_splunk_hec_post_processing_pipeline: cc-stream-secret-redaction-io/secret_redaction
cribl_stream_splunk_hec_tls: true
cribl_stream_splunk_hec_tls_verify: false  # Self-signed cert in lab
# Single definition shared by the template and the drift check in tasks.
# Generic /services/collector, NOT /services/collector/event: the events-only
# endpoint silently discards metric payloads, which kept every metric index
# (host_metrics/netmon_metrics/unifi_metrics/llm_metrics) empty. The generic
# endpoint accepts event and metric payloads alike.
cribl_stream_splunk_hec_url: "{{ splunk_hec_base_url }}/services/collector"

# Persistent queue
cribl_stream_pq_enabled: true

# Prometheus remote_write receiver — port for the prometheus_rw HTTP input.
# Not in Terraform service_ports (internal-only; no Traefik/DNS needed).
cribl_stream_prometheus_rw_port: 9201
# API path Cribl listens on for Prometheus remote_write POST requests.
# Must match the path in prometheus_stack_remote_write_url (/api/v1/write).
cribl_stream_prometheus_rw_api_path: /api/v1/write

# VictoriaMetrics remote_write destination (grafana guest, internal-only).
# Live URL is set in inventory/group_vars/cribl_stream_group.yml (FQDN +
# service_ports.victoriametrics). Placeholder here so include_vars in
# template-render tests does not require PROXMOX_SUBDOMAIN/tofu_data.
# Tests override this explicitly.
cribl_stream_victoriametrics_rw_url: "http://grafana.invalid:8428/api/v1/write"

# --- Langfuse leg: enrichment, noise removal, redaction ----------------------
# Everything below is DATA the otel_traces pipeline template loops over, not
# logic embedded in the template. Adding a span name, a noisy attribute or a
# redaction pattern is a one-line change here with no template edit, and the
# same lists are what the render test asserts against.

# Attribute-name precedence for each Langfuse field. The template renders these
# as `attributes['a'] || attributes['b'] || undefined`, so order is precedence
# and an empty list yields an unset field rather than a fabricated one.
#
# These attributes are ALREADY emitted today — the coding-agent CLI sends
# user.id and session.id on every span. Nothing downstream ever read them, so
# every trace lands with a null user and no session. This is a mapping gap, not
# a collection gap.
cribl_stream_otel_user_id_sources:
  - user.id                          # coding-agent CLI (hashed account id)
  - metadata.user_api_key_user_id    # LLM proxy, once virtual keys are issued
  - user.email
# Session ids are NEVER synthesized. A collector-derived session (a time-window
# hash, say) invents boundaries that do not exist, merges unrelated activity
# from one principal, and sends late-arriving spans into a different session
# than their siblings. Absent is correct when unknown.
cribl_stream_otel_session_id_sources:
  - session.id
# Fallback chain for the trace label; a third of spans arrive with an empty
# name and render as a blank, unclickable row.
cribl_stream_otel_trace_name_sources:
  - gen_ai.operation.name
  - http.route
  - service.name
cribl_stream_otel_trace_name_fallback: unnamed-span
# Attributes promoted to trace tags — this is what makes the live dashboard
# filterable. Empty members are dropped so a missing attribute never becomes a
# blank facet.
cribl_stream_otel_tag_sources:
  - service.name
  - host.name
  - gen_ai.system
  - model
cribl_stream_otel_default_environment: homelab

# Token-usage aliases: emitters disagree on attribute names and the backend
# reads the OpenTelemetry GenAI semantic convention. Without this mapping every
# generation shows zero usage and cost panels stay empty even though the
# numbers arrived. Key = canonical target, value = emitter-specific source.
cribl_stream_otel_usage_aliases:
  gen_ai.usage.input_tokens: input_tokens
  gen_ai.usage.output_tokens: output_tokens
  gen_ai.usage.cache_read_input_tokens: cache_read_tokens
  gen_ai.usage.cache_creation_input_tokens: cache_creation_tokens
# Extra attributes copied into trace metadata, keyed by the metadata name.
cribl_stream_otel_metadata_passthrough:
  agent_id: agent_id
  cache_read_tokens: cache_read_tokens
  cache_creation_tokens: cache_creation_tokens

# Span names dropped from the LANGFUSE leg only — they continue to Splunk via
# otel_stamp, so latency and failure evidence survives. These are MCP-server
# plumbing (connection setup, transport workers, rollout persistence, plugin
# discovery): no model, no tokens, no message content, and roughly a fifth of
# ingest volume crowding out real generations in every list view.
cribl_stream_otel_drop_span_names:
  - auth
  - transport_worker
  - persist_rollout_items
  - recommended_plugins_mode_for_config
  - realtime_conversation.running_state
  - handle_tool_call_with_source

# Always-empty attributes the LLM proxy emits on every span (~20 per span):
# noise in the attribute inspector and dead weight in every payload.
cribl_stream_otel_noise_attributes:
  - metadata.spend_logs_metadata
  - metadata.requester_metadata
  - metadata.prompt_management_metadata
  - metadata.applied_guardrails
  - metadata.mcp_tool_call_metadata
  - metadata.vector_store_request_metadata
  - metadata.routing_decision
  - metadata.requester_custom_headers
  - metadata.cold_storage_object_key
  - metadata.user_api_key_auth_metadata
# Dropped outright: multi-KB Python tracebacks on every failed call, the single
# largest field on this leg, and they can carry prompt fragments, filesystem
# paths and credentials. Splunk keeps the full trace.
cribl_stream_otel_drop_attributes:
  - error.stack_trace

# Credential redaction. Server-side masking is a licensed feature of the
# backend, so masking belongs in the pipeline — this is the correct free-tier
# placement, not a workaround. It must be in place BEFORE message-content
# capture is enabled at the emitters.
#
# Schema note (same trap as force_splunk_meta): matchRegex/replaceExpr with a
# regex LITERAL. The regex/replacement keys are invalid and make the whole
# pipeline fail to load — taking the entire Langfuse leg down, not just the
# masking.
cribl_stream_otel_redaction_rules:
  - matchRegex: '/sk-[A-Za-z0-9_-]{16,}/g'
    replaceExpr: "'sk-REDACTED'"
  - matchRegex: '/pk-lf-[A-Za-z0-9-]{8,}/g'
    replaceExpr: "'pk-lf-REDACTED'"
  - matchRegex: '/Bearer\s+[A-Za-z0-9._~+\/-]{12,}/g'
    replaceExpr: "'Bearer REDACTED'"
  - matchRegex: '/AKIA[0-9A-Z]{16}/g'
    replaceExpr: "'AKIA-REDACTED'"
  - matchRegex: '/hvs\.[A-Za-z0-9._-]{16,}/g'
    replaceExpr: "'hvs.REDACTED'"
# Span attribute KEYS themselves contain dots (gen_ai.prompt, error.message),
# so an explicit field path is ambiguous and would silently mask nothing. The
# wildcard covers prompt, completion and error text wherever an emitter puts it.
cribl_stream_otel_redaction_fields:
  - 'attributes.*'
