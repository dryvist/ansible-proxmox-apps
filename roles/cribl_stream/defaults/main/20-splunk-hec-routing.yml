---
# Splunk HEC output configuration. Host comes from the one shared
# splunk_hec_base_url (inventory/group_vars/all.yml) — never reconstructed
# here (apps#588: a local "splunk.<zone>:8088" build black-holed every HEC
# POST the moment the bare `splunk` alias stopped resolving direct-to-host).
cribl_stream_splunk_hec_token: >-
  {{ (lookup('env', 'SPLUNK_HEC_TOKEN') | default('', true))
     or undef(hint='SPLUNK_HEC_TOKEN must be set in the environment') }}
# Per-index HEC (one index = one token). When HEC_NAMESPACE (Doppler) is set,
# single-index inputs send to a dedicated splunk_hec_<index> output whose token
# is derived as uuid5('splunk-hec-<index>', HEC_NAMESPACE) — identical to the
# Splunk side. Only netflow (in_ipfix) is single-index; the S2S input
# (in_cribl_s2s) fans one TCP stream into many indexes by datatype and stays
# on the shared legacy output. Since 4.12 a routes table COULD split it per
# index (the Edge otel input already fans out that way) — kept as-is here
# because the per-datatype token split is a separate migration.
cribl_stream_hec_namespace: "{{ lookup('env', 'HEC_NAMESPACE') | default('', true) }}"

# AI/LLM log routing from tofu constants (single source of truth): per source
# name — HAProxy-fronted TCP port plus the Splunk index/sourcetype the ai_stamp
# pipeline stamps. Guarded with default({}) so an inventory that predates
# ai_log_routing renders no AI inputs instead of failing.
cribl_stream_ai_log_routing: >-
  {{ hostvars['localhost']['tofu_data']['constants']['ai_log_routing']
     | default({}) }}

# Input type per AI source. Default is tcpjson (agent CLIs / serving hosts ship
# newline-delimited JSON over TCP). rsyslog senders (omfwd) speak RFC3164/5424,
# so their inputs must be syslog-type instead. Names here are the pre-`_docker`
# rsyslog senders that need an explicit override; every `*_docker` name (the
# journald-driver-tagged Docker-in-LXC AI services, syslog_forwarder role)
# classifies as syslog by suffix in inputs.yml.j2 — no per-service entry
# needed here as tofu-proxmox adds more of them.
cribl_stream_ai_input_types:
  homelab_llm: syslog
  openbao_audit: syslog
  hermes_agent: syslog
  llm_router: syslog
  llamaindex: syslog

# Per-index HEC outputs to render: netflow (in_ipfix), ai_usage (in_otel log
# records), cribl_internal (the built-in CriblLogs/CriblMetrics source),
# unifi_metrics (in_unpoller — also shipped by a separate Docker-Telegraf
# path), plus every unique index named in ai_log_routing — derived, never
# hand-maintained.
cribl_stream_per_index_indexes: >-
  {{ (['netflow', 'ai_usage', 'cribl_internal', 'unifi_metrics']
      + (cribl_stream_ai_log_routing.values() | map(attribute='index') | list))
     | unique | list }}
# Post-processing pipeline applied to every splunk_hec output, base and
# per-index alike. It is the role-owned secret_redaction pipeline, rendered
# with every other pipeline by this role, so it exists on the node before any
# output names it. An output that names a pipeline the node does not have
# ships its events unmasked, with no error.
cribl_stream_splunk_hec_post_processing_pipeline: secret_redaction

# Credential redaction, one list for every route that leaves Stream: the
# secret_redaction pipeline (all Splunk outputs) and both trace legs
# (otel_traces, otel_traces_phoenix). The patterns cover public, documented
# credential formats. They match the mask the sending hosts apply, so a value
# masked there and a value masked here carry the same marker.
#
# Schema note (same trap as force_splunk_meta): matchRegex/replaceExpr with a
# regex LITERAL. The regex/replacement keys are invalid and make the whole
# pipeline fail to load, which takes the whole leg down, not only the masking.
cribl_stream_secret_redaction_rules:
  # GitHub tokens (classic and App tokens) and fine-grained PATs.
  - matchRegex: '/\b(gh[pousr]_[A-Za-z0-9_.\-]{30,}|github_pat_[A-Za-z0-9_]{40,})/g'
    replaceExpr: "'<redacted:github>'"
  # Secret-store tokens (service, batch and recovery prefixes).
  - matchRegex: '/\b(hv[sbr]|s|b|r)\.[A-Za-z0-9_\-]{24,}/g'
    replaceExpr: "'<redacted:bao>'"
  - matchRegex: '/\bdp\.(st|pt|ct|sa|scim|audit)\.[A-Za-z0-9_.\-]{20,}/g'
    replaceExpr: "'<redacted:doppler>'"
  - matchRegex: '/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g'
    replaceExpr: "'<redacted:private-key>'"
  - matchRegex: '/\beyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}/g'
    replaceExpr: "'<redacted:jwt>'"
  - matchRegex: '/\bxox[abposr]-[A-Za-z0-9\-]{10,}/g'
    replaceExpr: "'<redacted:slack>'"
  - matchRegex: '/\bsk-(ant-)?[A-Za-z0-9_\-]{16,}/g'
    replaceExpr: "'<redacted:api-key>'"
  - matchRegex: '/\bpk-lf-[A-Za-z0-9\-]{8,}/g'
    replaceExpr: "'<redacted:langfuse>'"
  - matchRegex: '/\b(AKIA|ASIA)[0-9A-Z]{16}\b/g'
    replaceExpr: "'<redacted:aws>'"
  - matchRegex: '/Bearer\s+[A-Za-z0-9._~+\/-]{12,}/g'
    replaceExpr: "'Bearer <redacted>'"
cribl_stream_splunk_hec_tls: true
cribl_stream_splunk_hec_tls_verify: false  # Self-signed cert in lab
# Single definition shared by the template and the drift check in tasks.
# Generic /services/collector, NOT /services/collector/event: the events-only
# endpoint silently discards metric payloads, which kept every metric index
# (host_metrics/netmon_metrics/unifi_metrics/llm_metrics) empty. The generic
# endpoint accepts event and metric payloads alike.
cribl_stream_splunk_hec_url: "{{ splunk_hec_base_url }}/services/collector"
