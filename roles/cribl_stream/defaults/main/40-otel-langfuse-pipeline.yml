---
# --- Langfuse leg: enrichment, noise removal, redaction ----------------------
# Everything below is DATA the otel_traces pipeline template loops over, not
# logic embedded in the template. Adding a span name, a noisy attribute or a
# redaction pattern is a one-line change here with no template edit, and the
# same lists are what the render test asserts against.

# Attribute-name precedence for each Langfuse field. The template renders these
# as `attributes['a'] || attributes['b'] || undefined`, so order is precedence
# and an empty list yields an unset field rather than a fabricated one.
#
# These attributes are ALREADY emitted today — the coding-agent CLI sends
# user.id and session.id on every span. Nothing downstream ever read them, so
# every trace lands with a null user and no session. This is a mapping gap, not
# a collection gap.
cribl_stream_otel_user_id_sources:
  - langfuse.user.id
  - litellm.metadata.trace_user_id
  - user.id                          # coding-agent CLI (hashed account id)
  - metadata.user_api_key_user_id    # LLM proxy, once virtual keys are issued
  - user.email
# Session ids are NEVER synthesized. A collector-derived session (a time-window
# hash, say) invents boundaries that do not exist, merges unrelated activity
# from one principal, and sends late-arriving spans into a different session
# than their siblings. Absent is correct when unknown.
cribl_stream_otel_session_id_sources:
  - langfuse.session.id
  - litellm.metadata.session_id
  - session.id
# Fallback chain for the trace label; a third of spans arrive with an empty
# name and render as a blank, unclickable row.
cribl_stream_otel_trace_name_sources:
  - gen_ai.operation.name
  - http.route
  - service.name
cribl_stream_otel_trace_name_fallback: unnamed-span
# Attributes promoted to trace tags — this is what makes the live dashboard
# filterable. Empty members are dropped so a missing attribute never becomes a
# blank facet.
cribl_stream_otel_tag_sources:
  - service.name
  - host.name
  - gen_ai.system
  - model
cribl_stream_otel_default_environment: homelab

# Token-usage aliases: emitters disagree on attribute names and the backend
# reads the OpenTelemetry GenAI semantic convention. Without this mapping every
# generation shows zero usage and cost panels stay empty even though the
# numbers arrived. Key = canonical target, value = emitter-specific source.
cribl_stream_otel_usage_aliases:
  gen_ai.usage.input_tokens: input_tokens
  gen_ai.usage.output_tokens: output_tokens
  gen_ai.usage.cache_read_input_tokens: cache_read_tokens
  gen_ai.usage.cache_creation_input_tokens: cache_creation_tokens
# Extra attributes copied into trace metadata, keyed by the metadata name.
cribl_stream_otel_metadata_passthrough:
  agent_id: agent_id
  client: litellm.metadata.client
  runtime: litellm.metadata.runtime
  runner: litellm.metadata.runner
  purpose: litellm.metadata.purpose
  tier: litellm.metadata.tier
  environment: litellm.metadata.environment
  release: litellm.metadata.release
  session_id: litellm.metadata.session_id
  trace_user_id: litellm.metadata.trace_user_id
  trace_name: litellm.metadata.trace_name
  generation_name: litellm.metadata.generation_name
  tool_category: litellm.metadata.tool_category
  tool_name: litellm.metadata.tool_name
  engine: litellm.metadata.engine
  profile: litellm.metadata.profile
  quant: litellm.metadata.quant
  kv_dtype: litellm.metadata.kv_dtype
  ctx_per_slot: litellm.metadata.ctx_per_slot
  slots: litellm.metadata.slots
  concurrency: litellm.metadata.concurrency
  power_limit: litellm.metadata.power_limit
  thinking: litellm.metadata.thinking
  suite: litellm.metadata.suite
  dataset: litellm.metadata.dataset
  run_id: litellm.metadata.run_id
  cache_read_tokens: cache_read_tokens
  cache_creation_tokens: cache_creation_tokens

# Span names dropped before either trace destination. These are MCP-server
# plumbing (connection setup, transport workers, rollout persistence, plugin
# discovery): no model, no tokens, no message content, and roughly a fifth of
# ingest volume crowding out real generations in every list view.
cribl_stream_otel_drop_span_names:
  - auth
  - transport_worker
  - persist_rollout_items
  - recommended_plugins_mode_for_config
  - realtime_conversation.running_state
  - handle_tool_call_with_source

# Always-empty attributes the LLM proxy emits on every span (~20 per span):
# noise in the attribute inspector and dead weight in every payload.
cribl_stream_otel_noise_attributes:
  - metadata.spend_logs_metadata
  - metadata.requester_metadata
  - metadata.prompt_management_metadata
  - metadata.applied_guardrails
  - metadata.mcp_tool_call_metadata
  - metadata.vector_store_request_metadata
  - metadata.routing_decision
  - metadata.requester_custom_headers
  - metadata.cold_storage_object_key
  - metadata.user_api_key_auth_metadata
# Dropped outright: multi-KB Python tracebacks on every failed call, the single
# largest field on these trace legs, and they can carry prompt fragments,
# filesystem paths and credentials.
cribl_stream_otel_drop_attributes:
  - error.stack_trace

# Credential redaction rules are cribl_stream_secret_redaction_rules
# (20-splunk-hec-routing.yml): one list shared by both trace legs and every
# Splunk output.
#
# Span attribute KEYS themselves contain dots (gen_ai.prompt, error.message),
# so an explicit field path is ambiguous and would silently mask nothing. The
# wildcard covers prompt, completion and error text wherever an emitter puts it.
cribl_stream_otel_redaction_fields:
  - 'attributes.*'
