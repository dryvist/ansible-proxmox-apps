---
# Single source of truth for the Cribl Stream entry tags.
cribl_stream_entry_tags:
  install: cribl_stream_install
  settings: cribl_stream_settings
  inputs: cribl_stream_inputs
  outputs: cribl_stream_outputs
  pipelines: cribl_stream_pipelines
  bmc_collector: cribl_stream_bmc_collector
  litellm_prices: cribl_stream_litellm_prices
  github_actions: cribl_stream_github_actions
  probe: cribl_stream_probe
  admin: cribl_stream_admin

# Collector runs also reconcile the routing files their sources require.
cribl_stream_entry_prerequisites:
  install: []
  settings: []
  inputs: []
  outputs: []
  pipelines: []
  bmc_collector: [pipelines]
  litellm_prices: [outputs, pipelines]
  github_actions: [outputs, pipelines]
  probe: []
  admin: []

cribl_stream_selector_tags:
  full: [all, cribl_stream, cribl, pipeline]
  compatibility: [cribl_stream_admin_probe, bmc_provision]
