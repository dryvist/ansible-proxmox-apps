---
# UniFi-derived metrics: firewall action counts (syslog) and per-VLAN/WAN
# byte counters (NetFlow/IPFIX). See pipelines/unifi_syslog_to_metrics and
# pipelines/ipfix_to_metrics, and templates/lookups/unifi_vlan_map.csv.j2.

# VLAN id -> network name, for the unifi_vlan_map.csv lookup table both new
# pipelines join against. Each item: {vlan: <int>, name: <string>}. Populated
# from the tofu-unifi RustFS-published object (inventory/load_tofu/
# load_unifi_networks.yml); defaults to empty so a run without that object
# still renders (every vlan_id then falls through to the raw id as the label
# — see the pipeline eval `vlan || vlan_id`). Network names are estate
# topology and never committed here — see infra-standards.
cribl_stream_unifi_networks: >-
  {{ hostvars['localhost']['unifi_networks_data'] | default([]) }}
