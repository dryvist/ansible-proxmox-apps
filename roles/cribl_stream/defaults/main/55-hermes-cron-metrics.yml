---
# Duplicate Hermes records share the embedded millisecond timestamp and
# message, even when rsyslog forwards them from different source files.
cribl_stream_hermes_cron_suppress_seconds: 600
# Two outcome lines of one run (no_agent jobs log two silent lines) arrive
# within seconds; a job never runs twice inside this window.
cribl_stream_hermes_cron_outcome_suppress_seconds: 30
