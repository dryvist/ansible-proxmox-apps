---
# r540 (iDRAC9) hardware sensor polling via Cribl Stream's REST Collector,
# scheduled against the Redfish Thermal and Power endpoints. r710 (iDRAC6) has
# no Redfish and Cribl Stream has no native SNMP-polling source (only an SNMP
# Trap push listener) — see docs/ or the PR description for that finding;
# nothing here targets r710.
#
# Master switch: off until a real r540 BMC hostname is set below.
cribl_stream_idrac_r540_enabled: false

# BMC FQDN, never a literal IP — the estate-wide rule (see idrac_power role).
# Set from inventory/group_vars or host_vars, e.g.:
#   cribl_stream_idrac_r540_bmc_host: "pve-r540-idrac.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
cribl_stream_idrac_r540_bmc_host: ""

# Redfish chassis member id (default Dell iDRAC9 naming).
cribl_stream_idrac_r540_chassis: System.Embedded.1

# Cron schedule for the poll (every 2 minutes).
cribl_stream_idrac_r540_schedule: "*/2 * * * *"

# Credentials. Cribl's own dedicated least-privilege read-only Redfish user
# (created by tasks/provision_idrac_readonly_user.yml, opt-in — see there) is
# preferred once provisioned; until then this falls back to the SAME BMC
# admin credential the idrac_power role in ansible-proxmox already uses
# (IDRAC_USERNAME/IDRAC_PASSWORD, Doppler-injected env vars) — the "existing
# read path" named in the task brief.
cribl_stream_idrac_r540_readonly_user: cribl-ro
cribl_stream_idrac_r540_username: >-
  {{ bao_apps_secrets.idrac_r540_cribl_username
     | default(lookup('env', 'IDRAC_USERNAME'), true)
     | default('', true) }}
cribl_stream_idrac_r540_password: >-
  {{ bao_apps_secrets.idrac_r540_cribl_password
     | default(lookup('env', 'IDRAC_PASSWORD'), true)
     | default('', true) }}

# TLS: iDRAC ships a self-signed cert (same posture as cribl_stream_splunk_hec_tls_verify).
cribl_stream_idrac_r540_tls_verify: false

# Opt-in one-time play (tasks/provision_idrac_readonly_user.yml) that creates
# cribl_stream_idrac_r540_readonly_user via the Redfish AccountService, using
# the existing admin credential above, and writes the generated password to
# OpenBao (secret/apps/cribl-stream, field idrac_r540_cribl_password). Off by
# default: it mutates live BMC state and needs a real, reachable r540 BMC to
# run against, so it is invoked deliberately (--tags idrac_provision), never
# as part of the normal converge.
cribl_stream_idrac_provision_account: false
