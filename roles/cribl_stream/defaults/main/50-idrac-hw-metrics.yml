---
# The r540 node (iDRAC9) hardware sensor polling via Cribl Stream REST Collectors.
cribl_stream_idrac_r540_enabled: false
cribl_stream_idrac_r540_bmc_host: ""
cribl_stream_idrac_r540_chassis: System.Embedded.1
cribl_stream_idrac_r540_schedule: "*/2 * * * *"
cribl_stream_idrac_r540_tls_verify: false

# Cribl's own read-only account, from OpenBao only — no other fallback.
# Empty until tasks/provision_idrac_readonly_user.yml has run.
cribl_stream_idrac_r540_readonly_user: cribl-ro
cribl_stream_idrac_r540_username: "{{ bao_apps_secrets.idrac_r540_cribl_username | default('', true) }}"
cribl_stream_idrac_r540_password: "{{ bao_apps_secrets.idrac_r540_cribl_password | default('', true) }}"

# BMC admin credential, used only by the opt-in provisioning play below to
# create the read-only account — never by the collectors themselves.
cribl_stream_idrac_r540_admin_username: "{{ lookup('env', 'IDRAC_USERNAME') }}"
cribl_stream_idrac_r540_admin_password: "{{ lookup('env', 'IDRAC_PASSWORD') }}"

# Off by default; run explicitly with --tags idrac_provision.
cribl_stream_idrac_provision_account: false
