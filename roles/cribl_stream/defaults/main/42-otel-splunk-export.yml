---
# Keep only span identity, timing, status, model and token counts at the final
# Splunk HEC boundary. Request and response content remains excluded.
cribl_stream_otel_splunk_safe_attributes:
  - service.name
  - service.namespace
  - deployment.environment
  - gen_ai.operation.name
  - gen_ai.request.model
  - gen_ai.response.model
  - gen_ai.usage.input_tokens
  - gen_ai.usage.output_tokens
  - gen_ai.usage.cache_read_input_tokens
  - gen_ai.usage.cache_creation_input_tokens
  - llm.model_name
  - llm.token_count.prompt
  - llm.token_count.completion
  - model

# Keep only the metadata fields defined for OTLP log records at the Splunk
# HEC boundary. The five run tags come from cribl_stream_otel_run_tags.
cribl_stream_otel_splunk_safe_log_attributes:
  - event
  - status
  - exit
  - reason
  - score_name
  - score_value
  - secs
  - source
  - mode
  - route
  - run_id
