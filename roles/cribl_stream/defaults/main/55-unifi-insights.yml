---
# UniFi gateway syslog fan-out to the UniFi Insights VM. The VM is the docker_vms
# view of the tofu inventory entry tagged unifi-insights; its published ip is
# the DNS-first FQDN. The host is empty when no such VM is declared, and the
# output and its connection are then omitted from outputs.yml.j2 and
# inputs.yml.j2.
cribl_stream_unifi_insights_syslog_host: >-
  {{ (hostvars['localhost']['tofu_data']['docker_vms'] | default({}) | dict2items
      | selectattr('value.tags', 'defined')
      | selectattr('value.tags', 'contains', 'unifi-insights')
      | map(attribute='value.ip') | list | first) | default('', true) }}

cribl_stream_unifi_insights_syslog_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['unifi_insights_syslog']
     | mandatory('tofu_data.constants.service_ports.unifi_insights_syslog missing') }}
