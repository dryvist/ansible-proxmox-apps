---
# Cribl Stream native install role defaults

# Installation
# Pinned to Cribl's current GA release, resolved from the CDN's own
# `dl/latest-x64` pointer file (not the "latest" filename alias, which is
# unversioned and has been observed frozen on a stale build).
cribl_stream_version: "4.20.0"
# Cribl's real filenames carry a build hash after the version
# (cribl-{version}-{hash}-linux-x64.tgz); a bare cribl-{version}-linux-x64.tgz
# 404s. Read the hash for a version bump from `dl/latest-x64`'s content or
# the version's own release notes -- it is not guessable.
cribl_stream_build_hash: "cee79842"
# SHA256 of the pinned tarball, from the CDN's own
# cribl-{version}-{hash}-linux-x64.tgz.sha256 sidecar. Verified by get_url's
# checksum param on every download, install and upgrade alike.
cribl_stream_tarball_sha256: "8602d5bcb239d402a8b7ad28140f739059278edb292dfe8d6675e8b263fc4e9f"
cribl_stream_tarball_base: "https://cdn.cribl.io/dl"
# Upstream release URL. Cribl's CDN uses two filename patterns:
#   - versioned release: https://cdn.cribl.io/dl/4.20.0/cribl-4.20.0-cee79842-linux-x64.tgz
#   - rolling "latest":  https://cdn.cribl.io/dl/latest/cribl-linux-x64.tgz    (no version in filename)
# Group vars for the `cribl_stream_group` override this with an object-storage mirror URL
# because the cribl-stream containers have the `outbound-internal` firewall
# and cannot reach cdn.cribl.io directly.
cribl_stream_tarball_url: >-
  {{ cribl_stream_tarball_base }}/{{ cribl_stream_version }}/{{
  'cribl-linux-x64.tgz' if cribl_stream_version == 'latest'
  else 'cribl-' + cribl_stream_version + '-' + cribl_stream_build_hash + '-linux-x64.tgz' }}
cribl_stream_install_dir: /opt/cribl

# Service user
cribl_stream_user: cribl
cribl_stream_group: cribl

# Service configuration
cribl_stream_service_name: cribl
cribl_stream_service_state: started
cribl_stream_service_enabled: true
