---
# Cribl Stream native install role defaults

# roles/cribl_stream/tasks/pipelines.yml looks up its own templates by path
# and needs the role's directory to do it. The role_path magic variable only
# resolves when a task file is included the way this role includes it
# (roles:/include_role) -- reading it here, once, into a plain var lets
# pipelines.yml be included directly (as tests/cribl_stream_pipelines_render/
# verify.yml does) by simply setting this same var itself, no role_path
# resolution required.
cribl_stream_role_dir: "{{ role_path }}"

# Installation reads the full build ID from the homelab-contracts catalog.
cribl_stream_version: "{{ cribl_version }}"
cribl_stream_tarball_base: "https://cdn.cribl.io/dl"
# The directory uses the public version; the filename keeps the build ID.
cribl_stream_tarball_url: >-
  {{ cribl_stream_tarball_base }}/{{ cribl_stream_version.split('-')[0] }}/cribl-{{
  cribl_stream_version }}-linux-x64.tgz
cribl_stream_install_dir: /opt/cribl

# Every pipeline config directory this role manages. Single source for both
# the directory-create loop and the config-deploy loop in tasks/main.yml --
# a pipeline exists here exactly once, so adding one is a single list entry
# in both places rather than a name that can drift between two loops.
cribl_stream_pipelines:
  - ipfix
  - force_splunk_meta
  - ansible_converge
  - prometheus_to_netmon
  - prometheus_to_unifi_metrics
  - ai_stamp
  - otel_traces
  - otel_metrics_to_splunk
  - otel_metrics_to_victoriametrics
  - otel_logs
  - otel_traces_phoenix
  - cribl_internal
  - unifi_syslog_to_metrics
  - ipfix_to_metrics
  - bmc_hw_metrics
  - pve_metrics_normalize
  - mlx_metrics_normalize
  - secret_redaction
  - grafana_alerts_ntfy

# Service user
cribl_stream_user: cribl
cribl_stream_group: cribl

# Service configuration
cribl_stream_service_name: cribl
cribl_stream_service_state: started
cribl_stream_service_enabled: true

# Management API (:9000) local admin credential. Cribl ships the vendor
# default admin/admin until it is explicitly rotated. Bao-first with
# an env fallback is applied in inventory/group_vars/cribl_stream_group.yml;
# here a plain env lookup keeps the role usable standalone (molecule, ad-hoc
# runs). Rotation happens in tasks/rotate_admin_password.yml.
cribl_stream_admin_user: admin
cribl_stream_default_password: admin
cribl_stream_admin_password: "{{ lookup('env', 'CRIBL_ADMIN_PASSWORD') }}"
cribl_stream_api_url: "http://127.0.0.1:9000"
cribl_stream_api_timeout: 30
