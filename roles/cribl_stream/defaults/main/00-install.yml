---
# Cribl Stream native install role defaults

# Installation
# Reads the single org-wide pin (inventory/group_vars/all.yml cribl_version)
# rather than declaring its own -- see the comment there. No literal version
# lives in this role; `default('latest', true)` only covers a run where
# cribl_version itself is somehow unset (e.g. a stray unit test), never the
# normal path.
cribl_stream_version: "{{ cribl_version | default('latest', true) }}"
cribl_stream_tarball_base: "https://cdn.cribl.io/dl"
# Upstream release URL. Cribl's CDN uses two filename patterns:
#   - versioned release: https://cdn.cribl.io/dl/4.20.0/cribl-4.20.0-<hash>-linux-x64.tgz
#   - rolling "latest":  https://cdn.cribl.io/dl/latest/cribl-linux-x64.tgz    (no version in filename)
# The versioned filename also carries a per-build hash this role does not
# pin literally (no committed build hash -- see roles/cribl_stream/tasks/
# mirror_seed.yml, which resolves it at run time from the CDN's own
# `dl/latest-x64` pointer). This default CDN URL is therefore dead in
# practice: cribl_stream_group.yml always overrides it with the
# object-storage mirror URL, because these hosts sit behind the
# outbound-internal firewall and cannot reach cdn.cribl.io directly. Kept
# only as a template-render fallback (tests, `latest`); a hash-bearing
# pinned-version request against the real CDN through this branch would
# 404, same as it always has for an unpinned filename.
cribl_stream_tarball_url: >-
  {{ cribl_stream_tarball_base }}/{{ cribl_stream_version }}/{{
  'cribl-linux-x64.tgz' if cribl_stream_version == 'latest'
  else 'cribl-' + cribl_stream_version + '-linux-x64.tgz' }}
cribl_stream_install_dir: /opt/cribl

# Service user
cribl_stream_user: cribl
cribl_stream_group: cribl

# Service configuration
cribl_stream_service_name: cribl
cribl_stream_service_state: started
cribl_stream_service_enabled: true

# Management API (:9000) local admin credential. Cribl ships the vendor
# default admin/admin until it is explicitly rotated. Bao-first with
# an env fallback is applied in inventory/group_vars/cribl_stream_group.yml;
# here a plain env lookup keeps the role usable standalone (molecule, ad-hoc
# runs). Rotation happens in tasks/rotate_admin_password.yml.
cribl_stream_admin_user: admin
cribl_stream_default_password: admin
cribl_stream_admin_password: "{{ lookup('env', 'CRIBL_ADMIN_PASSWORD') }}"
cribl_stream_api_url: "http://127.0.0.1:9000"
cribl_stream_api_timeout: 30
