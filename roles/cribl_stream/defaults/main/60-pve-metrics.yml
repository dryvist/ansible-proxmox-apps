---
# PVE's native External Metric Server (tofu-proxmox proxmox_metrics_server,
# type=graphite/tcp) -> Cribl Stream's Metrics source. Port from tofu
# constants (single source of truth).
cribl_stream_pve_metrics_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['cribl_pve_metrics'] }}

# PVE Graphite's qemu/lxc paths carry a vmid but no guest identity. Keep the
# lookup sourced from the same guest inventory propagated to dynamic hosts.
cribl_stream_pve_guest_containers: >-
  {{ hostvars['localhost']['tofu_data']['containers'] | default({}) }}
cribl_stream_pve_guest_vms: >-
  {{ (hostvars['localhost']['tofu_data']['vms'] | default({}))
     | combine(hostvars['localhost']['tofu_data']['docker_vms'] | default({}))
     | combine(hostvars['localhost']['tofu_data']['splunk_vm'] | default({})) }}
