---
# GitHub Actions REST/GraphQL collection through a loopback OpenBao Agent
# proxy. The GitHub App token itself is returned only to Cribl's Login auth.
# Opt-in: enable once the github-exporter AppRole pair is in the env document.
cribl_stream_github_actions_enabled: false
# Owners come from the runtime platform env (the admin App installation map,
# owner=id pairs) plus the runner org; no owner names live in this repo.
cribl_stream_github_actions_owners: >-
  {{ [cribl_stream_github_actions_runners_org]
     + ((lookup('env', 'OPENBAO_GITHUB_REPO_CREATE_INSTALLATION_IDS') | default('', true)).split(',')
        | map('trim') | reject('equalto', '') | map('regex_replace', '=.*$', '') | list) }}
cribl_stream_github_actions_runners_org: dryvist
cribl_stream_github_actions_api_base_url: https://api.github.com
cribl_stream_github_actions_graphql_url: "{{ cribl_stream_github_actions_api_base_url }}/graphql"
cribl_stream_github_actions_schedule: "*/5 * * * *"
cribl_stream_github_actions_lookback_seconds: 7200
cribl_stream_github_actions_repo_page_size: 100
cribl_stream_github_actions_max_discovery_pages: 0
cribl_stream_github_actions_open_pr_page_size: 100
cribl_stream_github_actions_commit_page_size: 5
cribl_stream_github_actions_suite_page_size: 5
cribl_stream_github_actions_check_run_page_size: 10

# The listener uses the local Cribl API host and the already-published
# OpenBao API service port; it binds to the local interface only.
cribl_stream_github_actions_agent_proxy_address: >-
  {{ cribl_stream_api_url | urlsplit('hostname') }}:{{ tofu_data.constants.service_ports.openbao_api }}
cribl_stream_github_actions_agent_proxy_url: >-
  {{ cribl_stream_api_url | urlsplit('scheme') }}://{{ cribl_stream_github_actions_agent_proxy_address }}
cribl_stream_github_actions_openbao_addr: >-
  https://openbao.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}
cribl_stream_github_actions_openbao_version: "{{ openbao_client_version }}"
cribl_stream_github_actions_openbao_deb_url: >-
  https://github.com/openbao/openbao/releases/download/v{{ cribl_stream_github_actions_openbao_version
  }}/openbao_{{ cribl_stream_github_actions_openbao_version }}_linux_amd64.deb
cribl_stream_github_actions_openbao_bin: /usr/bin/bao
cribl_stream_github_actions_approle_dir: /etc/cribl/openbao-approle
cribl_stream_github_actions_agent_config: /etc/cribl/openbao-agent.hcl
cribl_stream_github_actions_agent_service: openbao-cribl-stream-agent.service
cribl_stream_github_actions_openbao_role_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_GITHUB_EXPORTER_ROLE_ID') | default('', true) }}
cribl_stream_github_actions_openbao_secret_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_GITHUB_EXPORTER_SECRET_ID') | default('', true) }}
