---
# Worker Process sizing: 2048 MB/process default (docs.cribl.io/stream/
# scaling#worker-processes). CRIBL_MAX_WORKERS is Kubernetes-only
# (docs.cribl.io/stream/environment-variables); the non-k8s keys are
# workers.count/workers.memory in cribl.yml (docs.cribl.io/stream/criblyml).
# Derived from converge-time RAM: floor((RAM - 512) / heap), clamped to
# [1, vCPUs]. Merged into the live file in tasks/main.yml — see there.
cribl_stream_worker_heap_mb: 2048
cribl_stream_worker_count: >-
  {{ [
       [ ((ansible_memtotal_mb | int - 512) // cribl_stream_worker_heap_mb), 1 ] | max,
       (ansible_processor_vcpus | default(ansible_processor_count | default(1))) | int
     ] | min }}

# Persistent queue
cribl_stream_pq_enabled: true

# Prometheus remote_write receiver — port for the prometheus_rw HTTP input.
# Not in Terraform service_ports (internal-only; no Traefik/DNS needed).
cribl_stream_prometheus_rw_port: 9201
# API path Cribl listens on for Prometheus remote_write POST requests.
# Must match the path in prometheus_stack_remote_write_url (/api/v1/write).
cribl_stream_prometheus_rw_api_path: /api/v1/write

# Job allow-list for the prometheus_to_netmon pipeline's leading drop
# (splunk_hec leg of the prometheus_rw input only — Splunk license-volume
# gate). A job absent from this list is dropped before it reaches Splunk;
# the victoriametrics_rw leg on the same input carries no such filter, so
# VictoriaMetrics remains the superset store for every Prometheus job.
cribl_stream_prometheus_splunk_keep_jobs:
  - blackbox_.*
  - smokeping
  - pve_node_exporter
  - traefik
  - llm_router
  - llama_server
  - guest_node_exporter
  - hindsight
  - agentgateway

# Keep only the bounded node-exporter health families in Splunk. This applies
# to PVE and guest jobs on the Splunk leg; the sibling VictoriaMetrics leg
# remains the complete series store.
cribl_stream_prometheus_splunk_node_metrics:
  - node_boot_time_seconds
  - node_load5
  - node_memory_MemAvailable_bytes
  - node_memory_MemTotal_bytes
  - node_memory_SwapFree_bytes
  - node_memory_SwapTotal_bytes
  - node_pressure_cpu_waiting_seconds_total
  - node_pressure_io_stalled_seconds_total
  - node_pressure_io_waiting_seconds_total
  - node_pressure_memory_stalled_seconds_total
  - node_pressure_memory_waiting_seconds_total
  - node_zfs_arc_size
  - node_zfs_zpool_state

# VictoriaMetrics remote_write destination (grafana guest, internal-only).
# Live URL is set in inventory/group_vars/cribl_stream_group.yml (FQDN +
# service_ports.victoriametrics). Placeholder here so include_vars in
# template-render tests does not require PROXMOX_SUBDOMAIN/tofu_data.
# Tests override this explicitly.
cribl_stream_victoriametrics_rw_url: "http://grafana.invalid:8428/api/v1/write"

# Prometheus remote_write receiver for native GPU metric events from Edge.
# Production inventory supplies the guest FQDN and service port.
cribl_stream_prometheus_rw_url: ""
# OTLP/HTTP endpoint base. Cribl's OpenTelemetry destination appends
# /v1/metrics; VictoriaMetrics serves OTLP at /opentelemetry/v1/metrics.
# Derive from the existing single-sourced host/port so the two outputs cannot
# drift when the metrics store moves.
cribl_stream_victoriametrics_otlp_endpoint: >-
  {{ cribl_stream_victoriametrics_rw_url
     | regex_replace('/api/v1/write$', '/opentelemetry') }}

# unpoller Prometheus scraper source (in_unpoller). unpoller runs co-located
# on this same guest (roles/unpoller), so the scrape target is loopback —
# never the guest's own FQDN/IP, which would round-trip through the
# management network for no reason. unpoller_metrics_port (defined once in
# roles/unpoller/defaults/main.yml) is the single source of truth for the
# port; referenced directly here, never re-defaulted. Every data source goes
# to every destination the format fits (operator policy): this fans to BOTH
# victoriametrics_rw and the Splunk unifi_metrics index, next to the
# existing prometheus_rw legs above.
cribl_stream_unpoller_scrape_target: "localhost:{{ unpoller_metrics_port }}"
# Scrape interval in minutes: the Cribl prometheus source schedules in whole
# minutes (1-60, a divisor of 60).
cribl_stream_unpoller_poll_minutes: 1
