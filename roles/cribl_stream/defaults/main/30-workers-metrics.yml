---
# Worker Process sizing: 2048 MB/process default (docs.cribl.io/stream/
# scaling#worker-processes). CRIBL_MAX_WORKERS is Kubernetes-only
# (docs.cribl.io/stream/environment-variables); the non-k8s keys are
# workers.count/workers.memory in cribl.yml (docs.cribl.io/stream/criblyml).
# Derived from converge-time RAM: floor((RAM - 512) / heap), clamped to
# [1, vCPUs]. Merged into the live file in tasks/main.yml — see there.
cribl_stream_worker_heap_mb: 2048
cribl_stream_worker_count: >-
  {{ [
       [ ((ansible_memtotal_mb | int - 512) // cribl_stream_worker_heap_mb), 1 ] | max,
       (ansible_processor_vcpus | default(ansible_processor_count | default(1))) | int
     ] | min }}

# Persistent queue
cribl_stream_pq_enabled: true

# Prometheus remote_write receiver — port for the prometheus_rw HTTP input.
# Not in Terraform service_ports (internal-only; no Traefik/DNS needed).
cribl_stream_prometheus_rw_port: 9201
# API path Cribl listens on for Prometheus remote_write POST requests.
# Must match the path in prometheus_stack_remote_write_url (/api/v1/write).
cribl_stream_prometheus_rw_api_path: /api/v1/write

# VictoriaMetrics remote_write destination (grafana guest, internal-only).
# Live URL is set in inventory/group_vars/cribl_stream_group.yml (FQDN +
# service_ports.victoriametrics). Placeholder here so include_vars in
# template-render tests does not require PROXMOX_SUBDOMAIN/tofu_data.
# Tests override this explicitly.
cribl_stream_victoriametrics_rw_url: "http://grafana.invalid:8428/api/v1/write"

# unpoller Prometheus scraper source (in_unpoller). unpoller runs co-located
# on this same guest (roles/unpoller), so the scrape target is loopback —
# never the guest's own FQDN/IP, which would round-trip through the
# management network for no reason. Every data source goes to every
# destination the format fits (operator policy): this fans to BOTH
# victoriametrics_rw and the Splunk unifi_metrics index, next to the
# existing prometheus_rw legs above.
cribl_stream_unpoller_scrape_target: "127.0.0.1:{{ unpoller_metrics_port | default(9130) }}"
cribl_stream_unpoller_poll_interval: 30
