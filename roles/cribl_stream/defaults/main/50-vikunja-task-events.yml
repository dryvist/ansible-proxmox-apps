---
cribl_stream_vikunja_task_events_enabled: false
cribl_stream_vikunja_task_events_header_value: >-
  {{ 'Basic ' ~ (((vikunja_task_events_basic_user
     | default('vikunja-task-events', true)) ~ ':'
     ~ (lookup('ansible.builtin.env', 'VIKUNJA_TASK_EVENTS_PASSWORD')
        | default(undef(hint='VIKUNJA_TASK_EVENTS_PASSWORD must be set when the task event source is on'), true)))
     | b64encode) }}
cribl_stream_vikunja_task_events_daily_cap_bytes: 20971520
# Upper bound of one kept event: two text fields of 200 characters plus ids and names.
cribl_stream_vikunja_task_events_max_event_bytes: 2048
cribl_stream_vikunja_task_events_hourly_event_cap: >-
  {{ (cribl_stream_vikunja_task_events_daily_cap_bytes | int) // 24
     // (cribl_stream_vikunja_task_events_max_event_bytes | int) }}
cribl_stream_vikunja_task_events_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['vikunja_task_events'] }}

cribl_stream_vikunja_task_events_index: vikunja
cribl_stream_vikunja_task_events_sourcetype: vikunja:task:event
