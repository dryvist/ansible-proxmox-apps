---
# Canonical span tags. Empty or null values take the same defaults as missing tags.
cribl_stream_otel_agent_tag_defaults:
  agent: unknown
  tier: 2
  privacy_class: private
  model: unknown
  accelerator: unknown
  caller: unknown
  correlation_id: unknown

# OTLP base URL and authentication are supplied by the caller.
cribl_stream_arize_url: >-
  {{ lookup('env', 'ARIZE_OTLP_ENDPOINT') | default(undef(), true) | mandatory }}
cribl_stream_arize_api_key: >-
  {{ lookup('env', 'ARIZE_API_KEY') | default(undef(), true) | mandatory }}
cribl_stream_arize_space_id: >-
  {{ lookup('env', 'ARIZE_SPACE_ID') | default(undef(), true) | mandatory }}
