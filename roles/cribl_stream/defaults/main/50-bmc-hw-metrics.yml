---
# A monitored node's BMC hardware sensor polling via Cribl Stream REST
# Collectors, over Redfish.
cribl_stream_bmc_enabled: false
cribl_stream_bmc_host: ""
cribl_stream_bmc_chassis: System.Embedded.1
cribl_stream_bmc_schedule: "*/2 * * * *"
cribl_stream_bmc_tls_verify: false

# The name to publish as the `host` metric dimension — the monitored node,
# never the Cribl worker collecting on its behalf. Left blank disables the
# collectors (see tasks/bmc_hw_metrics.yml), so a real deployment must set it.
cribl_stream_bmc_node_name: ""

# Cribl's own read-only account, from OpenBao only — no other fallback.
# Empty until tasks/provision_bmc_readonly_user.yml has run.
cribl_stream_bmc_readonly_user: cribl-ro
cribl_stream_bmc_username: "{{ bao_apps_secrets.bmc_cribl_username | default('', true) }}"
cribl_stream_bmc_password: "{{ bao_apps_secrets.bmc_cribl_password | default('', true) }}"

# BMC admin credential, used only by the opt-in provisioning play below to
# create the read-only account — never by the collectors themselves.
cribl_stream_bmc_admin_username: "{{ lookup('env', 'BMC_USERNAME') }}"
cribl_stream_bmc_admin_password: "{{ lookup('env', 'BMC_PASSWORD') }}"

# Off by default; run explicitly with --tags bmc_provision.
cribl_stream_bmc_provision_account: false
