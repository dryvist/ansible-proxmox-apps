---
- name: Require the HEC namespace for GitHub Actions telemetry
  ansible.builtin.assert:
    that:
      - cribl_stream_hec_namespace | default('') | length > 0
      - cribl_stream_github_actions_openbao_role_id | length > 0
      - cribl_stream_github_actions_openbao_secret_id | length > 0
      - cribl_stream_github_actions_owners | length == 9
      - cribl_stream_github_actions_owners | unique | length == 9
      - cribl_stream_github_actions_runners_org in cribl_stream_github_actions_owners
      - cribl_stream_api_url | urlsplit('hostname') in ['127.0.0.1', 'localhost']
      - >-
        cribl_stream_github_actions_agent_proxy_address.split(':')[0]
        == cribl_stream_api_url | urlsplit('hostname')
    fail_msg: >-
      GitHub Actions collection requires HEC_NAMESPACE, the Cribl OpenBao
      AppRole secret-zero, all nine unique owners, and a loopback proxy address.
    quiet: true

- name: Install the OpenBao client for the Cribl token proxy
  ansible.builtin.apt:
    deb: "{{ cribl_stream_github_actions_openbao_deb_url }}"
    state: present

- name: Create the Cribl AppRole credential directory
  ansible.builtin.file:
    path: "{{ cribl_stream_github_actions_approle_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy the Cribl AppRole secret-zero
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ cribl_stream_github_actions_approle_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: role_id
      value: "{{ cribl_stream_github_actions_openbao_role_id }}"
    - name: secret_id
      value: "{{ cribl_stream_github_actions_openbao_secret_id }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart Cribl OpenBao Agent

- name: Deploy the Cribl OpenBao Agent proxy configuration
  ansible.builtin.template:
    src: collectors/github_actions/openbao-agent.hcl.j2
    dest: "{{ cribl_stream_github_actions_agent_config }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Cribl OpenBao Agent

- name: Deploy the Cribl OpenBao Agent systemd unit
  ansible.builtin.template:
    src: collectors/github_actions/openbao-agent.service.j2
    dest: /etc/systemd/system/{{ cribl_stream_github_actions_agent_service }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart Cribl OpenBao Agent

- name: Enable and start the Cribl OpenBao Agent proxy
  ansible.builtin.systemd:
    name: "{{ cribl_stream_github_actions_agent_service }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure each generated owner collector directory exists
  ansible.builtin.file:
    path: >-
      {{ cribl_stream_install_dir ~ '/local/cribl/collectors/github_actions_'
         ~ (item | lower | regex_replace('[^a-z0-9_]', '_')) }}
    state: directory
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0755"
  loop: "{{ cribl_stream_github_actions_owners }}"
  loop_control:
    label: "{{ item }}"

- name: Ensure the runner collector directory exists
  ansible.builtin.file:
    path: "{{ cribl_stream_install_dir }}/local/cribl/collectors/github_actions_runners"
    state: directory
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0755"

- name: Deploy one GitHub Actions GraphQL collector per owner
  ansible.builtin.template:
    src: collectors/github_actions/collector.yml.j2
    dest: >-
      {{ cribl_stream_install_dir ~ '/local/cribl/collectors/github_actions_'
         ~ (cribl_stream_github_actions_owner | lower | regex_replace('[^a-z0-9_]', '_'))
         ~ '/collector.yml' }}
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  loop: "{{ cribl_stream_github_actions_owners }}"
  loop_control:
    loop_var: cribl_stream_github_actions_owner
    label: "{{ cribl_stream_github_actions_owner }}"
  notify: Restart cribl stream

- name: Deploy the self-hosted runner REST collector
  ansible.builtin.template:
    src: collectors/github_actions/runners-collector.yml.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/collectors/github_actions_runners/collector.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  notify: Restart cribl stream

- name: Deploy one GitHub Actions schedule per owner collector
  ansible.builtin.template:
    src: collectors/github_actions/schedule.yml.j2
    dest: >-
      {{ cribl_stream_install_dir ~ '/local/cribl/collectors/github_actions_'
         ~ (cribl_stream_github_actions_owner | lower | regex_replace('[^a-z0-9_]', '_'))
         ~ '/schedule.yml' }}
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  vars:
    cribl_stream_github_actions_collector_id: >-
      github_actions_{{ cribl_stream_github_actions_owner | lower | regex_replace('[^a-z0-9_]', '_') }}
  loop: "{{ cribl_stream_github_actions_owners }}"
  loop_control:
    loop_var: cribl_stream_github_actions_owner
    label: "{{ cribl_stream_github_actions_owner }}"
  notify: Restart cribl stream

- name: Deploy the self-hosted runner schedule
  ansible.builtin.template:
    src: collectors/github_actions/schedule.yml.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/collectors/github_actions_runners/schedule.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  vars:
    cribl_stream_github_actions_collector_id: github_actions_runners
  notify: Restart cribl stream
