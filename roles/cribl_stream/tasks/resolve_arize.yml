---
- name: Resolve whether the Arize AX trace sink is configured
  ansible.builtin.set_fact:
    cribl_stream_arize_enabled: >-
      {{ cribl_stream_arize_url | default('') | trim | length > 0
         and cribl_stream_arize_api_key | default('') | trim | length > 0
         and cribl_stream_arize_space_id | default('') | trim | length > 0 }}

- name: Require all or none of the Arize AX sink values
  ansible.builtin.assert:
    that:
      - cribl_stream_arize_enabled | bool
        or (cribl_stream_arize_url | default('') | trim | length == 0
            and cribl_stream_arize_api_key | default('') | trim | length == 0
            and cribl_stream_arize_space_id | default('') | trim | length == 0)
    fail_msg: >-
      Set all three Arize AX values (ARIZE_OTLP_ENDPOINT, ARIZE_API_KEY, and
      ARIZE_SPACE_ID) together, or leave all three unset.

- name: Log that the Arize AX trace sink is disabled
  ansible.builtin.debug:
    msg: Arize AX trace sink is disabled because its endpoint and credentials are unset.
  when: not (cribl_stream_arize_enabled | bool)
  run_once: true
