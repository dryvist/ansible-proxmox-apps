---
# Upgrade an already-installed Cribl Stream node to the pinned version.
# Skipped entirely on a fresh install (the block below in main.yml already
# lands the pinned version). Gated on the running server's own reported
# version, read via its authenticated management API -- declared-then-default
# login, same shape as rotate_admin_password.yml, so a node mid-rotation still
# resolves a working credential.

- name: Try login with the declared admin password
  ansible.builtin.uri:
    url: "{{ cribl_stream_api_url }}/api/v1/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ cribl_stream_admin_user }}"
      password: "{{ cribl_stream_admin_password }}"
    status_code: [200, 401, 403]
    timeout: "{{ cribl_stream_api_timeout }}"
  register: cribl_stream_upgrade_login_configured
  changed_when: false
  failed_when: false
  no_log: true

- name: Try login with the vendor default admin password
  ansible.builtin.uri:
    url: "{{ cribl_stream_api_url }}/api/v1/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ cribl_stream_admin_user }}"
      password: "{{ cribl_stream_default_password }}"
    status_code: [200, 401, 403]
    timeout: "{{ cribl_stream_api_timeout }}"
  register: cribl_stream_upgrade_login_default
  changed_when: false
  failed_when: false
  no_log: true
  when: (cribl_stream_upgrade_login_configured.json.token | default('')) | length == 0

- name: Resolve a working management API token for the version check
  ansible.builtin.set_fact:
    cribl_stream_upgrade_token: >-
      {{ cribl_stream_upgrade_login_configured.json.token
         | default(cribl_stream_upgrade_login_default.json.token | default(''), true) }}
  no_log: true

- name: Read the running server's version
  ansible.builtin.uri:
    url: "{{ cribl_stream_api_url }}/api/v1/system/info"
    method: GET
    headers:
      Authorization: "Bearer {{ cribl_stream_upgrade_token }}"
    return_content: true
    timeout: "{{ cribl_stream_api_timeout }}"
  register: cribl_stream_upgrade_info
  changed_when: false
  failed_when: false
  when: cribl_stream_upgrade_token | length > 0

# BUILD.VERSION may carry trailing build metadata (a dev/alpha build reports
# "4.8.0-alpha.<epoch>-<hash>"; a GA release is expected to report the bare
# semver). Matched as a prefix so either shape is recognised once the
# declared version is actually running.
- name: Upgrade Cribl Stream to the pinned version
  vars:
    _cribl_stream_running_version: >-
      {{ (cribl_stream_upgrade_info.json.items | default([{}]))[0].BUILD.VERSION
         | default('', true) }}
  when:
    - (cribl_stream_upgrade_info.json.items | default([])) | length > 0
    - not (_cribl_stream_running_version is match('^' ~ cribl_stream_version ~ '(\W|$)'))
  block:
    - name: Ensure the backup directory exists
      ansible.builtin.file:
        path: "{{ cribl_stream_install_dir }}/../cribl-stream-backups"
        state: directory
        mode: "0700"

    - name: Stop Cribl Stream before upgrading
      ansible.builtin.systemd:
        name: "{{ cribl_stream_service_name }}"
        state: stopped

    - name: Back up local/ before upgrading (rollback point)
      community.general.archive:
        path: "{{ cribl_stream_install_dir }}/local"
        dest: >-
          {{ cribl_stream_install_dir }}/../cribl-stream-backups/local-{{
          _cribl_stream_running_version | default('unknown', true) }}-{{
          ansible_facts.date_time.epoch }}.tgz
        format: gz
        mode: "0600"

    - name: Download the pinned Cribl Stream tarball (checksum-verified)
      ansible.builtin.get_url:
        url: "{{ cribl_stream_tarball_url }}"
        dest: /tmp/cribl-stream-upgrade.tgz
        checksum: "sha256:{{ cribl_stream_tarball_sha256 }}"
        mode: "0644"

    - name: Extract the new version over the existing install (local/ preserved)
      ansible.builtin.unarchive:
        src: /tmp/cribl-stream-upgrade.tgz
        dest: /opt
        remote_src: true
        owner: "{{ cribl_stream_user }}"
        group: "{{ cribl_stream_group }}"

    - name: Remove the downloaded upgrade tarball
      ansible.builtin.file:
        path: /tmp/cribl-stream-upgrade.tgz
        state: absent

    - name: Start Cribl Stream after upgrading
      ansible.builtin.systemd:
        name: "{{ cribl_stream_service_name }}"
        state: started

    - name: Wait for Cribl Stream to come back after the upgrade
      ansible.builtin.uri:
        url: "{{ cribl_stream_api_url }}/api/v1/health"
        method: GET
        status_code: [200]
        timeout: "{{ cribl_stream_api_timeout }}"
      register: cribl_stream_upgrade_health
      until: cribl_stream_upgrade_health.status | default(0) == 200
      retries: 24
      delay: 5
