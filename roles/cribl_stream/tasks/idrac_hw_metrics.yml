---
# pve-r540 hardware sensor monitoring: pipeline + Redfish REST Collectors.

- name: Deploy idrac_hw_metrics pipeline configuration
  ansible.builtin.template:
    src: pipelines/idrac_hw_metrics/conf.yml.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/pipelines/idrac_hw_metrics/conf.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  notify: Restart cribl stream

- name: Deploy the r540 Redfish hardware sensor collectors
  when:
    - cribl_stream_idrac_r540_bmc_host | length > 0
    - cribl_stream_idrac_r540_username | length > 0
    - cribl_stream_idrac_r540_password | length > 0
  block:
    - name: Ensure each idrac_r540_redfish collector directory exists
      ansible.builtin.file:
        path: "{{ cribl_stream_install_dir }}/local/cribl/collectors/idrac_r540_redfish_{{ item }}"
        state: directory
        owner: "{{ cribl_stream_user }}"
        group: "{{ cribl_stream_group }}"
        mode: "0755"
      loop:
        - thermal
        - power

    - name: Deploy the idrac_r540_redfish collector configurations
      ansible.builtin.template:
        src: "collectors/idrac_r540_redfish_{{ item }}/collector.yml.j2"
        dest: "{{ cribl_stream_install_dir }}/local/cribl/collectors/idrac_r540_redfish_{{ item }}/collector.yml"
        owner: "{{ cribl_stream_user }}"
        group: "{{ cribl_stream_group }}"
        mode: "0600"
      loop:
        - thermal
        - power
      no_log: true
      notify: Restart cribl stream

    - name: Deploy the idrac_r540_redfish collector schedules
      ansible.builtin.template:
        src: "collectors/idrac_r540_redfish_{{ item }}/schedule.yml.j2"
        dest: "{{ cribl_stream_install_dir }}/local/cribl/collectors/idrac_r540_redfish_{{ item }}/schedule.yml"
        owner: "{{ cribl_stream_user }}"
        group: "{{ cribl_stream_group }}"
        mode: "0644"
      loop:
        - thermal
        - power
      notify: Restart cribl stream

- name: Report the r540 hardware sensor collectors as pending
  ansible.builtin.debug:
    msg: >-
      cribl_stream_idrac_r540_bmc_host is set but no read-only credential is
      in OpenBao yet (secret/apps/cribl-stream). Collectors not deployed.
      Run the provisioning play (--tags idrac_provision) to create one.
  when:
    - cribl_stream_idrac_r540_bmc_host | length > 0
    - cribl_stream_idrac_r540_username | length == 0 or cribl_stream_idrac_r540_password | length == 0

- name: Provision the r540 Cribl read-only iDRAC account
  ansible.builtin.include_tasks: provision_idrac_readonly_user.yml
  when: cribl_stream_idrac_provision_account | bool
  tags:
    - never
    - idrac_provision
