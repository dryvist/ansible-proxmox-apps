    dest: "{{ cribl_stream_install_dir }}/local/cribl/pipelines/otel_traces/conf.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  notify: Restart cribl stream

- name: Deploy otel_logs pipeline configuration
  ansible.builtin.template:
    src: pipelines/otel_logs/conf.yml.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/pipelines/otel_logs/conf.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  notify: Restart cribl stream

- name: Deploy otel_traces_phoenix pipeline configuration
  ansible.builtin.template:
    src: pipelines/otel_traces_phoenix/conf.yml.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/pipelines/otel_traces_phoenix/conf.yml"
