---
# Cribl Stream native installation in LXC containers

- name: Require the ntfy destination before enabling Grafana alert cutover
  ansible.builtin.assert:
    that:
      - cribl_stream_alerts_ntfy_url | default('') | length > 0
      - cribl_stream_alerts_ntfy_publish_url | default('') | length > 1
    fail_msg: >-
      cribl_stream_alerts_ntfy_url must be configured before enabling
      cribl_stream_grafana_ntfy_cutover_verified.
  when: cribl_stream_grafana_ntfy_cutover_verified | bool

- name: Require a positive integer for Phoenix trace sampling
  ansible.builtin.assert:
    that:
      - cribl_stream_phoenix_trace_keep_one_in is integer
      - cribl_stream_phoenix_trace_keep_one_in >= 1
    fail_msg: >-
      cribl_stream_phoenix_trace_keep_one_in must be an integer of at least 1.

- name: Install required packages
  # sudo is required because later tasks use `become_user:
  # {{ cribl_stream_user }}` to run `cribl mode-single` as the non-root
  # service user. The Proxmox LXC base image does not ship sudo —
  # without this those tasks fail with `/bin/sh: 1: sudo: not found`.
  # (curl is intentionally omitted — this role uses get_url, not the
  # curl CLI, and the tarball is extracted with ansible.builtin.unarchive.)
  ansible.builtin.apt:
    name:
      - tar
      - sudo
    state: present
    update_cache: true

- name: Create cribl system group
  ansible.builtin.group:
    name: "{{ cribl_stream_group }}"
    system: true
    state: present

- name: Create cribl system user
  ansible.builtin.user:
    name: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    system: true
    create_home: false
    home: "{{ cribl_stream_install_dir }}"
    shell: /usr/sbin/nologin
    state: present

- name: Check if Cribl Stream is already installed
  ansible.builtin.stat:
    path: "{{ cribl_stream_install_dir }}/bin/cribl"
  register: cribl_stream_binary

- name: Upgrade an already-installed Cribl Stream to the pinned version
  ansible.builtin.include_tasks: upgrade.yml
  when: cribl_stream_binary.stat.exists

- name: Download Cribl Stream tarball
  ansible.builtin.get_url:
    url: "{{ cribl_stream_tarball_url }}"
    dest: /tmp/cribl-stream.tgz
    checksum: "sha256:{{ cribl_stream_tarball_url }}.sha256"
    mode: "0644"
  when: not cribl_stream_binary.stat.exists

- name: Create install directory
  ansible.builtin.file:
    path: "{{ cribl_stream_install_dir }}"
    state: directory
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0755"

- name: Extract Cribl Stream tarball
  ansible.builtin.unarchive:
    src: /tmp/cribl-stream.tgz
    dest: /opt
    remote_src: true
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
  when: not cribl_stream_binary.stat.exists

- name: Remove downloaded tarball
  ansible.builtin.file:
    path: /tmp/cribl-stream.tgz
    state: absent

- name: Set Cribl Stream to single-instance mode
  ansible.builtin.command:
    cmd: "{{ cribl_stream_install_dir }}/bin/cribl mode-single"
  become: true
  become_user: "{{ cribl_stream_user }}"
  changed_when: true
  when: not cribl_stream_binary.stat.exists

# cribl.yml is Cribl's own system-settings file (worker sizing, API host,
# whatever the UI or Cribl itself writes there) — this role never owned it
# before this task, and Cribl may materialize its own defaults into it at
# startup the same way it rewrites outputs.yml (see the "Read live Cribl
# Stream outputs configuration" note below). Overwriting it wholesale would
# drop anything already there and re-diff every converge the moment Cribl
# fills in a default this template doesn't know about. Merge instead: keep
# every key already on disk and only set workers.count/workers.memory.
#
# docs.cribl.io/stream/criblyml documents these two keys verbatim:
#   count:   # number of worker processes to spawn, if less than 1 the value is added to CPU count
#   memory:  # [number; min: 1024; default: 2048]
- name: Read live Cribl Stream system settings
  ansible.builtin.slurp:
    src: "{{ cribl_stream_install_dir }}/local/cribl/cribl.yml"
  register: cribl_stream_cribl_yml_live
  failed_when: false

- name: Merge worker-process sizing into the live cribl.yml
  ansible.builtin.set_fact:
    cribl_stream_cribl_yml_merged: >-
      {{ (cribl_stream_cribl_yml_live.content | default('') | b64decode | from_yaml
          | default({}, true))
         | combine({'workers': {'count': cribl_stream_worker_count | int,
                                 'memory': cribl_stream_worker_heap_mb | int}},
                    recursive=true) }}

- name: Deploy the merged Cribl Stream system settings
  ansible.builtin.copy:
    content: "{{ cribl_stream_cribl_yml_merged | to_nice_yaml }}"
    dest: "{{ cribl_stream_install_dir }}/local/cribl/cribl.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  notify: Restart cribl stream

- name: Ensure the Cribl Stream lookups directory exists
  ansible.builtin.file:
    path: "{{ cribl_stream_install_dir }}/local/cribl/lookups"
    state: directory
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0755"

- name: Deploy Cribl Stream inputs configuration
  ansible.builtin.template:
    src: inputs.yml.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/inputs.yml"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  notify: Restart cribl stream

# A restart handler only fires when a task reports changed, so config that is
# already correct on disk but was never LOADED can never repair itself: the
# template reports ok, nothing notifies, and every future converge is a green
# no-op over a listener that does not exist. That state is reachable whenever a
# converge is interrupted between writing config and flushing handlers — which
# the run-time budget makes an ordinary event, not an edge case. Observed live:
# inputs.yml declared the OTLP input and carried the right port while nothing
# was bound to it, so every OTLP producer in the estate got a 503 from the
# ingress in front of it.
#
# So prove the listener rather than inferring it from the file. A refusal marks
# this task changed, which notifies the same handler and repairs the run it is
# found in.
#
# wait_for, not a shell probe: it is pure Python on the target, so it needs
# neither bash nor timeout present. A shell probe that cannot run returns
# non-zero, marks this task changed on EVERY converge, and bounces the service
# every run — the same defect the outputs.yml reconciliation below avoids.
#
# `msg`, NOT `.failed`, is the discriminator: with failed_when false, `.failed`
# is always false, so a guard written against it can never fire — the exact
# shape of false green this task exists to remove.
- name: Prove the OTLP listener is bound
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ cribl_stream_otel_port | trim | int }}"
    timeout: 5
    state: started
  register: cribl_stream_otel_probe
  changed_when: "'Timeout' in (cribl_stream_otel_probe.msg | default(''))"
  failed_when: false
  notify: Restart cribl stream

- name: Reconcile Cribl Stream outputs configuration
  ansible.builtin.include_tasks: outputs.yml

# Pipeline directories + configs, rendered on the controller (see pipelines.yml).
- name: Deploy pipeline directories and configurations
  ansible.builtin.include_tasks: pipelines.yml

- name: Deploy the UniFi VLAN lookup table
  # Cribl's Lookup function crashes ("Cannot read properties of undefined
  # (reading 'forEach')") reading a header-only CSV, so this only deploys
  # (and the two pipelines only reference it — see their conf.yml.j2) once
  # there is at least one row to write.
  ansible.builtin.template:
    src: lookups/unifi_vlan_map.csv.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/lookups/unifi_vlan_map.csv"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  when: cribl_stream_unifi_networks | default([]) | length > 0
  notify: Restart cribl stream

- name: Deploy the PVE guest lookup table
  ansible.builtin.template:
    src: lookups/pve_guest_map.csv.j2
    dest: "{{ cribl_stream_install_dir }}/local/cribl/lookups/pve_guest_map.csv"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0644"
  when: >-
    cribl_stream_pve_guest_containers | length > 0
    or cribl_stream_pve_guest_vms | length > 0
  notify: Restart cribl stream

- name: Deploy BMC hardware sensor monitoring
  ansible.builtin.include_tasks: bmc_hw_metrics.yml

- name: Deploy the LiteLLM price collector
  ansible.builtin.include_tasks: litellm_prices.yml
  when: cribl_stream_litellm_prices_enabled | bool

- name: Enable Cribl Stream boot-start via systemd
  ansible.builtin.command:
    cmd: "{{ cribl_stream_install_dir }}/bin/cribl boot-start enable -m systemd -u {{ cribl_stream_user }}"
    creates: /etc/systemd/system/cribl.service

- name: Ensure Cribl Stream service is running
  ansible.builtin.systemd:
    name: "{{ cribl_stream_service_name }}"
    state: "{{ cribl_stream_service_state }}"
    enabled: "{{ cribl_stream_service_enabled }}"
    daemon_reload: true

# Keep admin checks separate from data-path changes. The probe tag runs only
# when explicitly enabled; routine data-path converges never issue a login.
- name: Probe Cribl admin logins without changing state
  ansible.builtin.include_tasks: probe_admin_logins.yml
  tags:
    - cribl_stream_admin_probe
  when: cribl_stream_admin_probe_only | default(false) | bool

- name: Rotate the management API admin credential off the vendor default
  ansible.builtin.include_tasks: rotate_admin_password.yml
  tags:
    - cribl_stream_admin
