---
# Seed (and re-seed on every version bump) the object-storage mirror both
# Cribl Stream (cribl_stream_group.yml) and Cribl Edge (cribl_edge.yml) read
# their tarball from -- neither can reach cdn.cribl.io directly (the
# `outbound-internal` firewall group), only this controller can.
#
# This is the automated fix for the exact gap the Technitium mirror hit
# (renovate.json's technitium/dns-server comment): a version bump there is
# only a signal Renovate can raise, never something it can act on, because
# nothing re-seeds the mirrored object or re-checksums it. Blocking major
# bumps was the only guard available there. Here the bump IS actionable:
# every cribl_stream converge checks whether the pinned version's object
# already exists and, if not, fetches + re-uploads it right here -- no
# operator step, no block-major packageRule needed.
#
# No build hash or sha256 is committed anywhere in this repo (see
# roles/cribl_stream/defaults/main/00-install.yml): the CDN embeds a build
# hash in its versioned filename that isn't derivable from the version alone,
# so it is resolved here, at run time, from the CDN's own `dl/latest-x64`
# pointer -- which is why this task can only seed the version that is
# CURRENTLY the CDN's latest. A cribl_version pin that lags the CDN's latest
# (e.g. Renovate PR not yet merged) fails this task loudly rather than
# guessing a filename.
- name: Seed the Cribl object-storage mirror
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
    _cribl_stream_mirror_seed_endpoint: >-
      http://{{ tofu_data.containers['s3'].ip }}:{{
      tofu_data.constants.service_ports.object_storage_s3 }}
    _cribl_stream_mirror_seed_key: "infra/cribl-{{ cribl_stream_version }}-linux-x64.tgz"
    _cribl_stream_mirror_seed_aws_env:
      AWS_ACCESS_KEY_ID: >-
        {{ lookup('env', 'OBJECT_STORAGE_ROOT_USER')
           | default(undef(), true)
           | mandatory('OBJECT_STORAGE_ROOT_USER must be set to seed the Cribl mirror') }}
      AWS_SECRET_ACCESS_KEY: >-
        {{ lookup('env', 'OBJECT_STORAGE_ROOT_PASSWORD')
           | default(undef(), true)
           | mandatory('OBJECT_STORAGE_ROOT_PASSWORD must be set to seed the Cribl mirror') }}
      AWS_DEFAULT_REGION: us-east-1
  block:
    - name: Check whether the pinned Cribl tarball is already mirrored
      ansible.builtin.command:
        cmd: >-
          aws --endpoint-url {{ _cribl_stream_mirror_seed_endpoint }} s3api head-object
          --bucket splunk-addons --key {{ _cribl_stream_mirror_seed_key }}
      environment: "{{ _cribl_stream_mirror_seed_aws_env }}"
      register: _cribl_stream_mirror_seed_tarball_stat
      changed_when: false
      failed_when: >-
        _cribl_stream_mirror_seed_tarball_stat.rc != 0 and
        '404' not in (_cribl_stream_mirror_seed_tarball_stat.stderr | default('')) and
        'Not Found' not in (_cribl_stream_mirror_seed_tarball_stat.stderr | default('')) and
        'NoSuchKey' not in (_cribl_stream_mirror_seed_tarball_stat.stderr | default(''))
      no_log: true

    - name: Check whether the pinned Cribl sha256 sidecar is already mirrored
      ansible.builtin.command:
        cmd: >-
          aws --endpoint-url {{ _cribl_stream_mirror_seed_endpoint }} s3api head-object
          --bucket splunk-addons --key {{ _cribl_stream_mirror_seed_key }}.sha256
      environment: "{{ _cribl_stream_mirror_seed_aws_env }}"
      register: _cribl_stream_mirror_seed_sidecar_stat
      changed_when: false
      failed_when: >-
        _cribl_stream_mirror_seed_sidecar_stat.rc != 0 and
        '404' not in (_cribl_stream_mirror_seed_sidecar_stat.stderr | default('')) and
        'Not Found' not in (_cribl_stream_mirror_seed_sidecar_stat.stderr | default('')) and
        'NoSuchKey' not in (_cribl_stream_mirror_seed_sidecar_stat.stderr | default(''))
      no_log: true

    - name: Fetch and re-upload the pinned Cribl objects
      when: >-
        _cribl_stream_mirror_seed_tarball_stat.rc != 0 or
        _cribl_stream_mirror_seed_sidecar_stat.rc != 0
      block:
        - name: Resolve the CDN's current-release pointer
          ansible.builtin.uri:
            url: "{{ cribl_stream_tarball_base }}/latest-x64"
            return_content: true
          register: _cribl_stream_mirror_seed_pointer

        - name: Assert the pinned version matches the CDN's current release
          ansible.builtin.assert:
            that:
              - "cribl_stream_version in _cribl_stream_mirror_seed_pointer.content"
            fail_msg: >-
              cribl_version ({{ cribl_stream_version }}) does not match the
              CDN's current release ({{ _cribl_stream_mirror_seed_pointer.content | trim }}).
              This CDN only exposes a build hash for its CURRENT release, so a
              lagging pin cannot be auto-seeded -- merge/wait for the Renovate
              PR to catch up, or seed infra/{{ _cribl_stream_mirror_seed_key }} by hand.
            success_msg: "CDN release matches the pinned cribl_version."

        - name: Stage the pinned tarball on the controller
          ansible.builtin.get_url:
            url: "{{ _cribl_stream_mirror_seed_pointer.content | trim }}"
            dest: "/tmp/{{ _cribl_stream_mirror_seed_key | basename }}"
            checksum: "sha256:{{ _cribl_stream_mirror_seed_pointer.content | trim }}.sha256"
            mode: "0644"
            force: true

        - name: Stage the tarball's sha256 sidecar on the controller
          ansible.builtin.get_url:
            url: "{{ _cribl_stream_mirror_seed_pointer.content | trim }}.sha256"
            dest: "/tmp/{{ _cribl_stream_mirror_seed_key | basename }}.sha256"
            mode: "0644"
            force: true

        - name: Upload the tarball to the object-storage mirror
          ansible.builtin.command:
            cmd: >-
              aws --endpoint-url {{ _cribl_stream_mirror_seed_endpoint }} s3 cp
              /tmp/{{ _cribl_stream_mirror_seed_key | basename }}
              s3://splunk-addons/{{ _cribl_stream_mirror_seed_key }}
          environment: "{{ _cribl_stream_mirror_seed_aws_env }}"
          changed_when: true
          no_log: true

        - name: Upload the sha256 sidecar to the object-storage mirror
          ansible.builtin.command:
            cmd: >-
              aws --endpoint-url {{ _cribl_stream_mirror_seed_endpoint }} s3 cp
              /tmp/{{ _cribl_stream_mirror_seed_key | basename }}.sha256
              s3://splunk-addons/{{ _cribl_stream_mirror_seed_key }}.sha256
          environment: "{{ _cribl_stream_mirror_seed_aws_env }}"
          changed_when: true
          no_log: true

        - name: Remove staged files from the controller
          ansible.builtin.file:
            path: "/tmp/{{ item }}"
            state: absent
          loop:
            - "{{ _cribl_stream_mirror_seed_key | basename }}"
            - "{{ _cribl_stream_mirror_seed_key | basename }}.sha256"
