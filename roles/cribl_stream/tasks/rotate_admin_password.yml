---
# Rotate the Cribl Stream management API (:9000) admin credential off the
# vendor default. Cribl never sets one itself — a single-node install answers
# to admin/admin until something changes local/cribl/auth/users.json.
#
# Mechanism: Cribl's own documented recovery path is a plaintext "password"
# key in users.json, which it hashes into "passwd" and deletes when it loads
# the file (docs.cribl.io/stream/authentication). The documented 60s
# file-watch reload does not fire on these nodes — a deployed plaintext key
# was observed unhashed days later — so the role restarts the service to load
# it. A plaintext key still present means a rotation never loaded: it is
# finished here rather than failed. That is also the ONLY idempotent path
# for an already-initialised node: there is no REST endpoint to change a
# user's own password, and the file, once hashed, cannot be diffed back
# against the desired plaintext — so idempotency is proven by login, not by
# a file compare. Same shape as roles/technitium_install: try the default,
# rotate if it still works, verify the declared password, fail loudly if
# neither authenticates.
#
# Guard: a pending plaintext key that Cribl already failed to load once
# (service ActiveEnterTimestamp newer than users.json's mtime, still no
# login works) will never load on a second restart either — refuse instead
# of restarting production blind. See rotate_admin_decision.yml.
- name: Assert the declared admin password is set
  ansible.builtin.assert:
    that:
      - cribl_stream_admin_password | length > 0
    fail_msg: >-
      cribl_stream_admin_password is empty. Set CRIBL_ADMIN_PASSWORD in the environment
      before converging.
    quiet: true

- name: Read the live admin user file
  ansible.builtin.slurp:
    src: "{{ cribl_stream_install_dir }}/local/cribl/auth/users.json"
  register: cribl_stream_users_live
  failed_when: false
  no_log: true

- name: Detect a deployed rotation Cribl never loaded
  ansible.builtin.set_fact:
    cribl_stream_rotation_pending: >-
      {{ ((cribl_stream_users_live.content | default('') | b64decode | from_json)
          | default([], true)
          | selectattr('password', 'defined') | list | length) > 0 }}
  no_log: true

- name: Try login with the declared admin password
  ansible.builtin.uri:
    url: "{{ cribl_stream_api_url }}/api/v1/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ cribl_stream_admin_user }}"
      password: "{{ cribl_stream_admin_password }}"
    status_code: [200, 401, 403]
    timeout: "{{ cribl_stream_api_timeout }}"
  register: cribl_stream_configured_login
  retries: 6
  delay: 5
  until: cribl_stream_configured_login.status | default(0) in [200, 401, 403]
  changed_when: false
  failed_when: false
  no_log: true

- name: Try login with the vendor default admin password
  ansible.builtin.uri:
    url: "{{ cribl_stream_api_url }}/api/v1/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ cribl_stream_admin_user }}"
      password: "{{ cribl_stream_default_password }}"
    status_code: [200, 401, 403]
    timeout: "{{ cribl_stream_api_timeout }}"
  register: cribl_stream_default_login
  changed_when: false
  failed_when: false
  no_log: true
  when: cribl_stream_configured_login.status | default(0) != 200

- name: Stat the live admin user file
  ansible.builtin.stat:
    path: "{{ cribl_stream_install_dir }}/local/cribl/auth/users.json"
  register: cribl_stream_users_stat

- name: Read the running Cribl Stream main PID
  ansible.builtin.systemd_service:
    name: "{{ cribl_stream_service_name }}"
  register: cribl_stream_service_status
  changed_when: false

# /proc/<pid>'s mtime is the process start, on the same wall clock as the
# users.json mtime (a monotonic timestamp would need the boot time, which an
# LXC guest reports for itself, not for the kernel).
- name: Stat the running Cribl Stream process
  ansible.builtin.stat:
    path: "/proc/{{ cribl_stream_service_status.status.MainPID | default(0) }}"
  register: cribl_stream_process_stat

- name: Detect whether Cribl was already restarted since users.json was last written
  ansible.builtin.set_fact:
    cribl_stream_rotation_already_restarted: >-
      {{ (cribl_stream_service_status.status.MainPID | default(0) | int) > 0
         and cribl_stream_process_stat.stat.exists | default(false)
         and (cribl_stream_process_stat.stat.mtime | int)
             > (cribl_stream_users_stat.stat.mtime | default(0) | int) }}

- name: Decide whether to rotate, skip, or refuse
  ansible.builtin.include_tasks: rotate_admin_decision.yml

- name: Refuse to restart Cribl blind when a pending credential still won't load
  ansible.builtin.fail:
    msg: >-
      A pending plaintext admin credential is present in users.json, Cribl Stream
      was already restarted after it was written, and neither cribl_stream_admin_password
      nor the vendor default authenticates against {{ cribl_stream_api_url }}. A restart
      that already failed to load this credential will not load it on a second try.
      Not restarting; investigate manually — this Cribl version may not honour the
      users.json recovery key.
  when: cribl_stream_rotation_action == 'refuse'

- name: Rotate the admin credential off the vendor default
  when: cribl_stream_rotation_action == 'rotate'
  block:
    - name: Deploy the rotated admin credential
      ansible.builtin.template:
        src: auth/users.json.j2
        dest: "{{ cribl_stream_install_dir }}/local/cribl/auth/users.json"
        owner: "{{ cribl_stream_user }}"
        group: "{{ cribl_stream_group }}"
        mode: "0600"
      no_log: true

    - name: Restart Cribl Stream to load the rotated credential
      ansible.builtin.systemd:
        name: "{{ cribl_stream_service_name }}"
        state: restarted

    - name: Verify login with the rotated password once the restart lands
      ansible.builtin.uri:
        url: "{{ cribl_stream_api_url }}/api/v1/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ cribl_stream_admin_user }}"
          password: "{{ cribl_stream_admin_password }}"
        status_code: [200, 401, 403]
        timeout: "{{ cribl_stream_api_timeout }}"
      register: cribl_stream_rotated_login
      retries: 14
      delay: 5
      until: cribl_stream_rotated_login.status | default(0) == 200
      changed_when: false
      failed_when: cribl_stream_rotated_login.status | default(0) != 200
      no_log: true

- name: Fail loudly when neither the declared nor the default credential authenticates
  ansible.builtin.assert:
    that:
      - >-
        cribl_stream_configured_login.status | default(0) == 200
        or cribl_stream_rotated_login.status | default(0) == 200
    fail_msg: >-
      Neither cribl_stream_admin_password nor the vendor default authenticates
      against {{ cribl_stream_api_url }} — the admin credential has drifted
      out from under this role. Investigate manually; do not rotate blind.
    quiet: true
