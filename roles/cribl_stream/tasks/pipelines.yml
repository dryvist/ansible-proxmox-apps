---
# Pipeline directories + configs — ONE controller-side render, ONE remote
# transfer, regardless of how many pipelines exist.
#
# Previously: one ansible.builtin.file loop created each pipeline directory
# and a second ansible.builtin.template loop rendered each conf.yml, both
# over the community.proxmox.proxmox_pct_remote connection, whose per-task
# cost does not amortize across loop items (~6s per remote task, ~36s per
# copied file; the directory loop alone measured 98s). cribl_stream_pipelines
# (defaults/main/00-install.yml) now lists a dozen entries, so both loops
# only got more expensive as pipelines were added. Every pipeline directory
# and its conf.yml is instead rendered on the controller
# (delegate_to: localhost — no pct_remote connection, so cost does not scale
# with pipeline count) into a local staging tree, then shipped to the guest
# as a single tar over ONE remote unarchive. Same technique as the AutoKuma
# static-monitor render (roles/status_stack/tasks/autokuma_static_monitors.yml).
#
# --strip-components=1 drops the staging directory's own basename, which
# community.general.archive always includes as the archive's sole top-level
# entry when given a single directory path (it roots the archive at that
# directory's parent and stores members under its basename).
#
# `mode` is deliberately omitted from the unarchive task: tar preserves each
# entry's own permission bits from the archive (directories 0755 from the
# task below, files 0644 from the template task below) when run as root
# (this play's `become: true`), so a single module-level mode would
# overwrite one or the other instead of keeping both as before. owner/group
# ARE uniform across every entry (cribl:cribl), so unarchive applies those
# directly via its own owner/group parameters.

- name: Ensure the pipeline configs parent directory exists
  ansible.builtin.file:
    path: "{{ cribl_stream_install_dir }}/local/cribl/pipelines"
    state: directory
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
    mode: "0755"

- name: Create a local staging directory for the pipeline render (controller-side)
  ansible.builtin.tempfile:
    state: directory
    prefix: cribl-stream-pipelines-
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  register: cribl_stream_pipelines_staging

- name: Create each pipeline directory on the controller
  ansible.builtin.file:
    path: "{{ cribl_stream_pipelines_staging.path }}/{{ item }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  loop: "{{ cribl_stream_pipelines }}"
  loop_control:
    label: "{{ item }}"

- name: Render every pipeline conf.yml on the controller
  ansible.builtin.template:
    src: "pipelines/{{ item }}/conf.yml.j2"
    dest: "{{ cribl_stream_pipelines_staging.path }}/{{ item }}/conf.yml"
    mode: "0644"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  loop: "{{ cribl_stream_pipelines }}"
  loop_control:
    label: "{{ item }}"

- name: Archive the rendered pipeline tree into one tarball
  community.general.archive:
    path: "{{ cribl_stream_pipelines_staging.path }}"
    dest: "{{ cribl_stream_pipelines_staging.path }}.tar.gz"
    format: gz
    mode: "0644"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false

- name: Ship and extract every pipeline directory and config in one transfer
  ansible.builtin.unarchive:
    src: "{{ cribl_stream_pipelines_staging.path }}.tar.gz"
    dest: "{{ cribl_stream_install_dir }}/local/cribl/pipelines"
    remote_src: false
    extra_opts:
      - "--strip-components=1"
    owner: "{{ cribl_stream_user }}"
    group: "{{ cribl_stream_group }}"
  notify: Restart cribl stream

- name: Remove the local pipeline-render staging files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  loop:
    - "{{ cribl_stream_pipelines_staging.path }}"
    - "{{ cribl_stream_pipelines_staging.path }}.tar.gz"
  loop_control:
    label: "{{ item | basename }}"
