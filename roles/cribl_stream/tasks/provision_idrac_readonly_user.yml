---
# Creates Cribl's own read-only account on the r540 node's iDRAC9 via the Redfish
# AccountService, and publishes the generated password to OpenBao. Idempotent.
# Never runs as part of the normal converge — invoke with --tags idrac_provision.

- name: Require a real BMC host before provisioning
  ansible.builtin.assert:
    that:
      - cribl_stream_idrac_r540_bmc_host | length > 0
    fail_msg: "cribl_stream_idrac_r540_bmc_host is unset."
    quiet: true

- name: Check whether the Cribl read-only account already exists
  ansible.builtin.uri:
    url: "https://{{ cribl_stream_idrac_r540_bmc_host }}/redfish/v1/AccountService/Accounts"
    method: GET
    user: "{{ cribl_stream_idrac_r540_admin_username }}"
    password: "{{ cribl_stream_idrac_r540_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ cribl_stream_idrac_r540_tls_verify }}"
    status_code: [200]
  register: cribl_stream_idrac_accounts
  no_log: true

- name: Determine whether the read-only account is already present
  ansible.builtin.set_fact:
    cribl_stream_idrac_ro_exists: >-
      {{ (cribl_stream_idrac_accounts.json.Members | default([]))
         | map(attribute='@odata.id') | select('search', '/Accounts/')
         | list | length > 0
         and (cribl_stream_idrac_accounts.json.Members | default([]))
             | selectattr('UserName', 'defined')
             | selectattr('UserName', 'equalto', cribl_stream_idrac_r540_readonly_user)
             | list | length > 0 }}

- name: Create the Cribl read-only account and publish its password
  when: not cribl_stream_idrac_ro_exists
  block:
    - name: Generate a password for the read-only account
      ansible.builtin.set_fact:
        cribl_stream_idrac_ro_password: >-
          {{ lookup('ansible.builtin.password',
             '/dev/null length=32 chars=ascii_letters,digits') }}
      no_log: true

    - name: Find the first empty account slot (Redfish requires an existing member Id)
      ansible.builtin.set_fact:
        cribl_stream_idrac_ro_slot: >-
          {{ (cribl_stream_idrac_accounts.json.Members | default([]))
             | map(attribute='@odata.id') | map('regex_replace', '^.*/', '')
             | list | first | default('', true) }}

    - name: Create the read-only Redfish account
      ansible.builtin.uri:
        url: >-
          https://{{ cribl_stream_idrac_r540_bmc_host }}/redfish/v1/AccountService/Accounts/{{
          cribl_stream_idrac_ro_slot }}
        method: PATCH
        user: "{{ cribl_stream_idrac_r540_admin_username }}"
        password: "{{ cribl_stream_idrac_r540_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ cribl_stream_idrac_r540_tls_verify }}"
        body_format: json
        body:
          UserName: "{{ cribl_stream_idrac_r540_readonly_user }}"
          Password: "{{ cribl_stream_idrac_ro_password }}"
          RoleId: ReadOnly
          Enabled: true
        status_code: [200]
      no_log: true

    - name: Publish the generated password to OpenBao
      vars:
        openbao_secrets_publish_app: cribl-stream
        openbao_secrets_publish_data:
          idrac_r540_cribl_username: "{{ cribl_stream_idrac_r540_readonly_user }}"
          idrac_r540_cribl_password: "{{ cribl_stream_idrac_ro_password }}"
        openbao_secrets_publish_reason: "iDRAC9 read-only account for Cribl hardware sensor polling"
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: publish.yml
