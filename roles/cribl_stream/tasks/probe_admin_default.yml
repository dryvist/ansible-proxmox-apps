---
- name: Submit one vendor-default admin login attempt
  ansible.builtin.uri:
    url: "{{ cribl_stream_api_url }}/api/v1/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ cribl_stream_admin_user }}"
      password: "{{ cribl_stream_default_password }}"
    status_code: [200, 401, 403]
    timeout: "{{ cribl_stream_api_timeout }}"
  register: cribl_stream_default_login
  changed_when: false
  failed_when: false
  no_log: true
  tags: [always]

- name: Assert the vendor-default probe returned an HTTP status
  ansible.builtin.assert:
    that:
      - cribl_stream_default_login.status is defined
    fail_msg: The vendor-default auth probe returned no HTTP status.
    quiet: true
  tags: [always]

- name: Report the vendor-default login HTTP status
  ansible.builtin.debug:
    msg: "{{ cribl_stream_default_login.status }}"
  tags: [always]
