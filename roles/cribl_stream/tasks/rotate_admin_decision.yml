---
# Split out of rotate_admin_password.yml so the branching logic can be
# exercised directly against literal facts (tests/cribl_stream_rotation/)
# without stubbing the uri/systemd/stat calls that produce
# cribl_stream_configured_login, cribl_stream_default_login,
# cribl_stream_rotation_pending and cribl_stream_rotation_already_restarted.
- name: Decide whether to rotate, skip, or refuse
  ansible.builtin.set_fact:
    cribl_stream_rotation_action: >-
      {{
        'none' if cribl_stream_configured_login.status | default(0) == 200
        else 'refuse' if (cribl_stream_default_login.status | default(0) != 200
          and cribl_stream_rotation_pending | bool
          and cribl_stream_rotation_already_restarted | bool)
        else 'rotate' if (cribl_stream_default_login.status | default(0) == 200
          or cribl_stream_rotation_pending | bool)
        else 'none'
      }}
