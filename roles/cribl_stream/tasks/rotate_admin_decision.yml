---
# Split out of rotate_admin_password.yml so the branching logic can be
# exercised directly against literal facts (tests/cribl_stream_rotation/)
# without stubbing the uri/systemd/stat calls that produce
# cribl_stream_configured_login, cribl_stream_default_login,
# cribl_stream_rotation_pending, cribl_stream_rotation_already_restarted and
# cribl_stream_users_file_array_format.
#
# Decision table (first match wins):
#   vendor default 200                                    -> rotate, even if the
#     managed login also works
#   vendor default != 200 AND configured login 200         -> none
#   default login != 200 AND file is array format          -> rotate (even if
#     already restarted — an array-format file is the old defective write
#     Cribl never loaded, so a prior restart proves nothing)
#   default login != 200 AND a user's "disabled" is a string, not a boolean
#     -> rotate (even if already restarted — Cribl treats any non-empty
#     string, including "false", as truthy and disables the user; a restart
#     can never load it, so a prior restart proves nothing)
#   default login != 200 AND pending AND already restarted -> refuse (a
#     plaintext key Cribl already failed to load once will not load on a
#     second restart)
#   default login 200 OR pending                           -> rotate
#   else                                                    -> none
- name: Decide whether to rotate, skip, or refuse
  ansible.builtin.set_fact:
    cribl_stream_rotation_action: >-
      {{
        'rotate' if cribl_stream_default_login.status | default(0) == 200
        else 'none' if cribl_stream_configured_login.status | default(0) == 200
        else 'rotate' if (cribl_stream_default_login.status | default(0) != 200
          and cribl_stream_users_file_array_format | default(false) | bool)
        else 'rotate' if (cribl_stream_default_login.status | default(0) != 200
          and cribl_stream_users_disabled_string | default(false) | bool)
        else 'refuse' if (cribl_stream_default_login.status | default(0) != 200
          and cribl_stream_rotation_pending | bool
          and cribl_stream_rotation_already_restarted | bool)
        else 'rotate' if (cribl_stream_default_login.status | default(0) == 200
          or cribl_stream_rotation_pending | bool)
        else 'none'
      }}
