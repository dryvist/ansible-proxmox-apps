---
- name: Restart cribl stream
  ansible.builtin.systemd:
    name: "{{ cribl_stream_service_name }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or cribl_stream_unit_file.stat.exists

- name: Restart Cribl OpenBao Agent
  ansible.builtin.systemd:
    name: "{{ cribl_stream_github_actions_agent_service }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or cribl_stream_github_actions_agent_unit_file.stat.exists
