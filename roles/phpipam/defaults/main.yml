---
phpipam_www_image: >-
  phpipam/phpipam-www:v1.8.3@sha256:f76005675587d783eea588457b0c1fca86775b44c6cdac5f7526de49dbebcc25
phpipam_cron_image: >-
  phpipam/phpipam-cron:v1.8.3@sha256:5a31cce1b9ef7d1c7933bbf6ca694de6721ca2385b0bbce09e27507624be489c
phpipam_mariadb_image: "mariadb:12.3.3"

phpipam_container_name: phpipam
phpipam_data_dir: /opt/phpipam
phpipam_mariadb_data_dir: "{{ phpipam_data_dir }}/mariadb"

phpipam_db_host: db
phpipam_db_name: phpipam
phpipam_db_user: phpipam

phpipam_storage_driver: "fuse-overlayfs"

# Port pulled from the OpenTofu pipeline_constants (DRY: no port literal here).
_phpipam_port_err: >-
  tofu_data.constants.service_ports.phpipam_web missing —
  regenerate tofu_inventory.json via
  `tofu output -json ansible_inventory`.
phpipam_port: >-
  {{ hostvars['localhost']['tofu_data']
     ['constants']['service_ports']['phpipam_web']
     | mandatory(_phpipam_port_err) }}

# Secrets — stored in SOPS secrets.enc.yaml.
# Generate with: openssl rand -base64 24
phpipam_db_password: >-
  {{ lookup('env', 'PHPIPAM_DB_PASSWORD')
     | default(undef('PHPIPAM_DB_PASSWORD is empty'), true)
     | mandatory('PHPIPAM_DB_PASSWORD must be set in the environment (generate with: openssl rand -base64 24)') }}
phpipam_db_root_password: >-
  {{ lookup('env', 'PHPIPAM_DB_ROOT_PASSWORD')
     | default(undef('PHPIPAM_DB_ROOT_PASSWORD is empty'), true)
     | mandatory('PHPIPAM_DB_ROOT_PASSWORD must be set in the environment (generate with: openssl rand -base64 24)') }}
