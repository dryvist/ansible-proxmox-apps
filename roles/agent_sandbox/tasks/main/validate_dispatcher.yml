---
- name: Read OpenBao client version as dispatcher account
  ansible.builtin.command:
    argv:
      - "{{ agent_sandbox_dispatch_bao_bin }}"
      - version
  become: true
  become_user: "{{ agent_sandbox_dispatch_user }}"
  register: _agent_sandbox_bao_version
  changed_when: false
  failed_when: false
  # Read-only version probe; keep it available outside check mode.
  check_mode: false
  when: not ansible_check_mode

- name: Require dispatcher account to execute OpenBao client
  ansible.builtin.assert:
    that:
      - _agent_sandbox_bao_version.rc == 0
    fail_msg: >-
      {{ agent_sandbox_dispatch_user }} cannot execute
      {{ agent_sandbox_dispatch_bao_bin }} version.
    quiet: true
  when: not ansible_check_mode
