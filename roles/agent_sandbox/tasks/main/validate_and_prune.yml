---
- name: Flush handlers so the proxy restarts before validation
  ansible.builtin.meta: flush_handlers

- name: Validate squid parses the deployed configuration
  community.docker.docker_container_exec:
    container: "{{ agent_sandbox_proxy_container }}"
    command: squid -k parse
  changed_when: false

# Functional probes from INSIDE the internal network — the same path agent
# containers use. Allow = an origin HTTP status comes back through the CONNECT
# tunnel ('000' means no tunnel); deny = curl fails on the proxy's refusal.
- name: Probe an allowlisted domain through the proxy
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null -w '%{http_code}' --max-time 20
      -x http://{{ agent_sandbox_proxy_alias }}:{{ agent_sandbox_proxy_port }}
      https://api.z.ai
  register: agent_sandbox_allow_probe
  changed_when: false
  failed_when: agent_sandbox_allow_probe.rc != 0 or agent_sandbox_allow_probe.stdout == '000'

- name: Probe a non-allowlisted domain through the proxy (expect denial)
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null -w '%{http_connect}' --max-time 20
      -x http://{{ agent_sandbox_proxy_alias }}:{{ agent_sandbox_proxy_port }}
      https://{{ item }}
  loop: [cdn-zcode.z.ai, example.com]
  register: agent_sandbox_deny_probe
  changed_when: false
  failed_when: agent_sandbox_deny_probe.rc == 0 or agent_sandbox_deny_probe.stdout != '403'

- name: Read squid access evidence for the egress probes
  community.docker.docker_container_exec:
    container: "{{ agent_sandbox_proxy_container }}"
    command: tail -n 20 /var/log/squid/access.log
  register: agent_sandbox_access_log
  changed_when: false

- name: Assert squid allowed the model endpoint and denied both other domains
  ansible.builtin.assert:
    that:
      - agent_sandbox_access_log.stdout is search('TCP_TUNNEL/200.*CONNECT api.z.ai:443')
      - agent_sandbox_access_log.stdout is search('TCP_DENIED/403.*CONNECT cdn-zcode.z.ai:443')
      - agent_sandbox_access_log.stdout is search('TCP_DENIED/403.*CONNECT example.com:443')

- name: Record proxy probe evidence
  ansible.builtin.debug:
    msg:
      origin_http_status: "{{ agent_sandbox_allow_probe.stdout }}"
      squid_access: "{{ agent_sandbox_access_log.stdout_lines }}"

# --- Adversarial bypass probes ----------------------------------------------
# The two probes above test the SUPPORTED path (through the proxy). These test
# that there is NO OTHER path: every one attempts egress AROUND squid and must
# FAIL. A success = a hole in the boundary and fails the converge loudly.
# The invariant: `agents` is internal:true (no route out) and dual-homed squid
# is the sole egress. Codex-reviewed spec.
#
# ACCEPTED RESIDUAL (SNI/Host fronting): squid gates the CONNECT authority, not
# the TLS SNI inside the tunnel, and does no TLS interception. A client CONNECTing
# to an allowlisted host can present a different inner SNI — only exploitable to
# reach a non-allowlisted origin that shares an allowlisted origin's IP. Left as
# documented residual; closing it would need MITM interception we don't want.

- name: "Egress invariant — inspect egress-network membership"
  ansible.builtin.command:
    cmd: "docker network inspect {{ agent_sandbox_egress_network }}"
  register: agent_sandbox_egress_inspect
  changed_when: false

- name: "Egress invariant — inspect internal-network membership"
  ansible.builtin.command:
    cmd: "docker network inspect {{ agent_sandbox_network }}"
  register: agent_sandbox_internal_inspect
  changed_when: false

# The bypass condition is DUAL-HOMING: a container on both the internal agents
# net and the egress net bridges agents around squid. Egress-only members
# (the Cribl Edge shipping spooled session logs) are unreachable from agents and
# are allowed — but only the two declared services, so a surprise container on
# the egress net still fails loudly.
- name: "Egress invariant — only squid may be dual-homed onto the egress network"
  vars:
    _egress_members: >-
      {{ (agent_sandbox_egress_inspect.stdout | from_json | first).Containers.values()
         | map(attribute='Name') | list }}
    _internal_members: >-
      {{ (agent_sandbox_internal_inspect.stdout | from_json | first).Containers.values()
         | map(attribute='Name') | list }}
    _dual_homed: "{{ _egress_members | intersect(_internal_members) }}"
    _egress_allowed:
      - "{{ agent_sandbox_proxy_container }}"
      - "{{ agent_sandbox_cribl_container }}"
  ansible.builtin.assert:
    that:
      - _dual_homed | reject('equalto', agent_sandbox_proxy_container) | list | length == 0
      - _egress_members | difference(_egress_allowed) | length == 0
    fail_msg: >-
      Egress bypass: dual-homed={{ _dual_homed }} (only
      {{ agent_sandbox_proxy_container }} may bridge both networks);
      egress members={{ _egress_members }} (allowed: {{ _egress_allowed }})
    success_msg: >-
      Only {{ agent_sandbox_proxy_container }} bridges the internal and egress
      networks; egress membership limited to {{ _egress_allowed }}.
    quiet: true

- name: "Bypass probe — CONNECT to an allowlisted host on a non-TLS port (expect denial)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --connect-timeout 5 --max-time 15
      -x http://{{ agent_sandbox_proxy_alias }}:{{ agent_sandbox_proxy_port }}
      https://api.anthropic.com:22
  register: agent_sandbox_port_probe
  changed_when: false
  failed_when: agent_sandbox_port_probe.rc == 0

- name: "Bypass probe — CONNECT to a raw external IP via the proxy (expect denial)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --connect-timeout 5 --max-time 15
      -x http://{{ agent_sandbox_proxy_alias }}:{{ agent_sandbox_proxy_port }}
      https://{{ agent_sandbox_probe_external_ip }}:443
  register: agent_sandbox_rawip_probe
  changed_when: false
  failed_when: agent_sandbox_rawip_probe.rc == 0

- name: "Bypass probe — direct TCP to an external IP, no proxy (expect no route)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --noproxy '*' --connect-timeout 5 --max-time 15
      https://{{ agent_sandbox_probe_external_ip }}
  register: agent_sandbox_directtcp_probe
  changed_when: false
  failed_when: agent_sandbox_directtcp_probe.rc == 0

- name: "Bypass probe — allowlisted domain WITHOUT the proxy (expect no route)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --noproxy '*' --connect-timeout 5 --max-time 15
      https://api.anthropic.com
  register: agent_sandbox_proxyunset_probe
  changed_when: false
  failed_when: agent_sandbox_proxyunset_probe.rc == 0

- name: "Bypass probe — DoH to a non-allowlisted resolver via the proxy (expect denial)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --connect-timeout 5 --max-time 15
      -x http://{{ agent_sandbox_proxy_alias }}:{{ agent_sandbox_proxy_port }}
      'https://{{ agent_sandbox_probe_doh_host }}/dns-query?name=example.com&type=A'
  register: agent_sandbox_doh_probe
  changed_when: false
  failed_when: agent_sandbox_doh_probe.rc == 0

- name: "Bypass probe — cloud metadata endpoint, no proxy (expect no route)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --noproxy '*' --connect-timeout 5 --max-time 10
      http://{{ agent_sandbox_probe_metadata_ip }}/
  register: agent_sandbox_metadata_probe
  changed_when: false
  failed_when: agent_sandbox_metadata_probe.rc == 0

# The host filter is the backstop behind `internal: true`. Prove it is loaded
# with its proxy-port allowance and default drop, then prove it bites on the one
# path Docker's own isolation does not cover: a container on the default
# bridge, which has a NAT route out until the filter drops it.
- name: "Host filter — read the loaded container-egress table"
  ansible.builtin.command:
    cmd: "nft list table inet {{ agent_sandbox_nft_table }}"
  register: agent_sandbox_nft_live
  changed_when: false

- name: "Host filter — assert the proxy allowance and the default drop are loaded"
  ansible.builtin.assert:
    that:
      - "'chain DOCKER-USER' in agent_sandbox_nft_live.stdout"
      - >-
        ('tcp dport ' ~ agent_sandbox_proxy_port ~ ' accept')
        in agent_sandbox_nft_live.stdout
      - >-
        agent_sandbox_nft_live.stdout_lines
        | select('search', '^[ ]*iifname "' ~ agent_sandbox_bridge ~ '" .*drop$')
        | list | length > 0
    fail_msg: >-
      The container-egress table is missing its proxy-port allowance or its
      default drop: {{ agent_sandbox_nft_live.stdout }}
    quiet: true

- name: "Bypass probe — default-bridge container, no proxy (expect no route)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network bridge
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null --noproxy '*' --connect-timeout 5 --max-time 15
      https://{{ agent_sandbox_probe_external_ip }}
  register: agent_sandbox_defaultbridge_probe
  changed_when: false
  failed_when: agent_sandbox_defaultbridge_probe.rc == 0

- name: Read the host filter after the default-bridge probe
  ansible.builtin.command:
    cmd: "nft list table inet {{ agent_sandbox_nft_table }}"
  register: agent_sandbox_nft_after
  changed_when: false

- name: Assert the host filter dropped the default-bridge probe packets
  vars:
    _counter_pattern: 'iifname "docker0" counter packets ([0-9]+)'
    _before: "{{ agent_sandbox_nft_live.stdout | regex_findall(_counter_pattern) | first | int }}"
    _after: "{{ agent_sandbox_nft_after.stdout | regex_findall(_counter_pattern) | first | int }}"
  ansible.builtin.assert:
    that: _after | int > _before | int
    success_msg: "Default-bridge drop counter increased from {{ _before }} to {{ _after }} packets."

- name: "Bypass probe — UDP egress to an external resolver (expect no route)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_netprobe_image }}
      timeout 8 nc -u -w3 {{ agent_sandbox_probe_external_ip }} 53
  register: agent_sandbox_udp_probe
  changed_when: false
  failed_when: agent_sandbox_udp_probe.rc == 0

- name: "Bypass probe — ICMP echo to an external IP (expect no route)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_netprobe_image }}
      ping -c1 -W2 {{ agent_sandbox_probe_external_ip }}
  register: agent_sandbox_icmp_probe
  changed_when: false
  failed_when: agent_sandbox_icmp_probe.rc == 0

# IPv6: record global v6 state first so a v6 pass is non-vacuous — it proves
# "no v6 stack/route", not "curl -6 happened to fail".
- name: "IPv6 state — record global v6 addresses (context for the v6 probe)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_netprobe_image }}
      ip -6 addr show scope global
  register: agent_sandbox_v6_state
  changed_when: false
  failed_when: false

- name: "Bypass probe — IPv6 egress to an external address (expect no route/stack)"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_probe_image }}
      -sS -o /dev/null -6 --noproxy '*' --connect-timeout 5 --max-time 15
      'https://[{{ agent_sandbox_probe_external_ip6 }}]'
  register: agent_sandbox_v6_probe
  changed_when: false
  failed_when: agent_sandbox_v6_probe.rc == 0

# Documented residual (NOT a gate): docker's embedded resolver (127.0.0.11)
# forwards recursively, so external names resolve = a low-bandwidth DNS-tunnel
# exfil channel squid cannot see. TCP/UDP egress stays blocked (probes above),
# so it cannot be upgraded to bulk egress. Informational only — never fails the
# converge; pinning the resolver to an internal-only one later is an
# improvement, not a regression this should flag.
- name: "Residual (documented) — embedded DNS resolves external names"
  ansible.builtin.command:
    cmd: >-
      docker run --rm --network {{ agent_sandbox_network }}
      {{ agent_sandbox_netprobe_image }}
      nslookup example.com
  register: agent_sandbox_dns_residual
  changed_when: false
  failed_when: false

# --- Spool retention (Phase D) ----------------------------------------------
# Each <run-id> dir is a self-contained run; a daily timer drops whole runs
# past the retention window. Cheap `find -mtime` prune, no state to track.
- name: Deploy session-log spool prune service
  ansible.builtin.template:
    src: spool-prune.service.j2
    dest: /etc/systemd/system/agent-sandbox-spool-prune.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy session-log spool prune timer
  ansible.builtin.template:
    src: spool-prune.timer.j2
    dest: /etc/systemd/system/agent-sandbox-spool-prune.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable session-log spool prune timer
  ansible.builtin.systemd:
    name: agent-sandbox-spool-prune.timer
    state: started
    enabled: true
    daemon_reload: true
