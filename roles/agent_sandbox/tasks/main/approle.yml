---
- name: Require complete dispatcher credential pair
  ansible.builtin.assert:
    that:
      - agent_sandbox_open_llm_role_id is string
      - agent_sandbox_open_llm_role_id | trim | length > 0
      - agent_sandbox_open_llm_secret_id is string
      - agent_sandbox_open_llm_secret_id | trim | length > 0
    fail_msg: >-
      The dispatcher credential pair must include non-empty role ID and
      secret ID values before delivery.

- name: Ensure dispatcher group exists
  ansible.builtin.group:
    name: "{{ agent_sandbox_dispatch_user }}"
    system: true
    state: present

- name: Create dispatcher credential directory
  ansible.builtin.file:
    path: /etc/agent-dispatch/approle
    state: directory
    owner: root
    group: "{{ agent_sandbox_dispatch_user }}"
    mode: "0750"

- name: Install dispatcher role ID
  ansible.builtin.copy:
    dest: /etc/agent-dispatch/approle/role_id
    content: "{{ agent_sandbox_open_llm_role_id }}"
    owner: root
    group: "{{ agent_sandbox_dispatch_user }}"
    mode: "0440"
  no_log: true

- name: Install dispatcher secret ID
  ansible.builtin.copy:
    dest: /etc/agent-dispatch/approle/secret_id
    content: "{{ agent_sandbox_open_llm_secret_id }}"
    owner: root
    group: "{{ agent_sandbox_dispatch_user }}"
    mode: "0440"
  no_log: true
