---
- name: Require dispatcher refused-login alert settings
  ansible.builtin.assert:
    that:
      - agent_sandbox_dispatch_alert_url is string
      - agent_sandbox_dispatch_alert_url is match('^https://ntfy(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$')
      - agent_sandbox_dispatch_alert_token is string
      - agent_sandbox_dispatch_alert_token is match('^tk_[A-Za-z0-9]+$')
    fail_msg: Refused-login alert settings must contain a valid HTTPS URL and ntfy token.
    quiet: true
  no_log: true

- name: Create the private dispatcher alert settings directory
  ansible.builtin.file:
    path: "{{ agent_sandbox_dispatch_alert_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install dispatcher refused-login alert settings
  ansible.builtin.template:
    src: dispatcher-alert.env.j2
    dest: "{{ agent_sandbox_dispatch_alert_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
