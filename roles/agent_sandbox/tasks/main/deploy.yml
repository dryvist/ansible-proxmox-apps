---
- name: Install host dispatcher prerequisites
  ansible.builtin.apt:
    name: [curl, jq, git, util-linux]
    state: present

- name: Create the host dispatcher state directory
  ansible.builtin.file:
    path: /var/lib/agent-dispatch
    state: directory
    owner: >-
      {{ agent_sandbox_dispatch_user if agent_sandbox_dispatch_access_enabled | bool
      else agent_sandbox_operator_user }}
    group: >-
      {{ agent_sandbox_dispatch_user if agent_sandbox_dispatch_access_enabled | bool
      else agent_sandbox_operator_user }}
    mode: "0700"

- name: Create the logind configuration directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep dispatcher waiters alive after their SSH session exits
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/agent-dispatch.conf
    content: |
      [Login]
      KillUserProcesses=no
    owner: root
    group: root
    mode: "0644"
  notify: Restart sandbox logind

# The nix-agent-sandbox launcher spawns containers over DOCKER_HOST=ssh://
# as this user, which needs direct daemon access (no sudo in that path).
- name: Grant the launcher SSH user docker daemon access
  ansible.builtin.user:
    name: "{{ agent_sandbox_operator_user }}"
    groups: docker
    append: true

- name: Create the ZCode service credential mount directory
  ansible.builtin.file:
    path: "{{ agent_sandbox_zcode_web_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: not agent_sandbox_dispatch_access_enabled | bool

- name: Allow dispatcher traversal without listing secrets
  ansible.builtin.file:
    path: "{{ agent_sandbox_zcode_web_env_file | dirname }}"
    state: directory
    owner: root
    # The service env file stays protected by its independent, empty host
    # secret-reader group.
    group: "{{ agent_sandbox_dispatch_user }}"
    mode: "0710"
  when: agent_sandbox_dispatch_access_enabled | bool

- name: Create the private ZCode service secret-reader group
  ansible.builtin.group:
    name: "{{ agent_sandbox_zcode_web_secret_group }}"
    system: true

- name: Read the private ZCode service secret-reader group
  ansible.builtin.getent:
    database: group
    key: "{{ agent_sandbox_zcode_web_secret_group }}"
  register: _agent_sandbox_zcode_secret_group

- name: Require the ZCode service secret-reader group to have no host members
  vars:
    _zcode_secret_group_facts: "{{ _agent_sandbox_zcode_secret_group.ansible_facts.getent_group }}"
    _zcode_secret_group_name: "{{ agent_sandbox_zcode_web_secret_group }}"
    _zcode_secret_group_members: >-
      {{ _zcode_secret_group_facts[_zcode_secret_group_name][2] }}
  ansible.builtin.assert:
    that:
      - _zcode_secret_group_members | length == 0
    fail_msg: >-
      {{ agent_sandbox_zcode_web_secret_group }} must remain empty on the host;
      only the ZCode service container receives it as a supplemental GID.

- name: Set the ZCode service container's supplemental secret group
  vars:
    _zcode_secret_group_facts: "{{ _agent_sandbox_zcode_secret_group.ansible_facts.getent_group }}"
    _zcode_secret_group_name: "{{ agent_sandbox_zcode_web_secret_group }}"
  ansible.builtin.set_fact:
    agent_sandbox_zcode_web_secret_gid: >-
      {{ _zcode_secret_group_facts[_zcode_secret_group_name][1] }}

- name: Create persistent ZCode Web data directory
  ansible.builtin.file:
    path: "{{ agent_sandbox_zcode_web_data_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Create persistent ZCode Web workspace directory
  ansible.builtin.file:
    path: "{{ agent_sandbox_zcode_web_work_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: Deploy squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ agent_sandbox_dir }}/squid.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent sandbox proxy

- name: Deploy egress domain allowlist
  ansible.builtin.template:
    src: allowed-domains.txt.j2
    dest: "{{ agent_sandbox_dir }}/allowed-domains.txt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent sandbox proxy

# --- Session-log spool + Cribl Edge (Phase D) --------------------------------
# The launcher (nix-agent-sandbox `agent run --host`) creates the per-run leaves
# with a throwaway uid-1000 container, which needs this root to already exist
# world-writable (1777). The Cribl Edge below tails the tree read-only.
- name: Create agent session-log spool root
  ansible.builtin.file:
    path: "{{ agent_sandbox_spool_dir }}"
    state: directory
    owner: root
    group: root
    mode: "1777"

- name: Create Cribl Edge config directory
  ansible.builtin.file:
    path: "{{ agent_sandbox_cribl_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Cribl Edge inputs configuration
  ansible.builtin.template:
    src: cribl/inputs.yml.j2
    dest: "{{ agent_sandbox_cribl_config_dir }}/inputs.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent sandbox proxy

- name: Deploy Cribl Edge outputs configuration
  ansible.builtin.template:
    src: cribl/outputs.yml.j2
    dest: "{{ agent_sandbox_cribl_config_dir }}/outputs.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent sandbox proxy

- name: Deploy Cribl Edge event breaker
  ansible.builtin.template:
    src: cribl/breakers.yml.j2
    dest: "{{ agent_sandbox_cribl_config_dir }}/breakers.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent sandbox proxy

# Worker-level pack pipelines, taken verbatim from the released pack .crbls.
# Fetched on the controller (unrestricted egress) then extracted onto the host —
# the same controller-stage pattern as the cribl_packs role, since docker-host
# has no guaranteed path to github.com.
- name: Create Cribl Edge pipeline directories
  ansible.builtin.file:
    path: "{{ agent_sandbox_cribl_config_dir }}/pipelines/{{ item.pipeline }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ agent_sandbox_cribl_packs }}"
  loop_control:
    label: "{{ item.pipeline }}"

- name: Fetch session-log pack .crbl to controller
  ansible.builtin.get_url:
    url: >-
      https://github.com/{{ item.repo }}/releases/download/{{
      item.version }}/{{ item.name }}-{{ item.version }}.crbl
    dest: "/tmp/agent-sandbox-{{ item.name }}-{{ item.version }}.crbl"
    mode: "0644"
    # Verify the immutable release asset where a pinned digest is known.
    checksum: "{{ ('sha256:' ~ item.sha256) if (item.sha256 | default('')) else omit }}"
  loop: "{{ agent_sandbox_cribl_packs }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false

# Extract only the one pipeline conf each pack contributes; --strip-components=3
# drops the `default/pipelines/<pipeline>/` prefix so conf.yml lands directly in
# the pipeline dir the container bind-mounts.
- name: Install pack pipeline conf as a worker-level pipeline
  ansible.builtin.unarchive:
    src: "/tmp/agent-sandbox-{{ item.name }}-{{ item.version }}.crbl"
    dest: "{{ agent_sandbox_cribl_config_dir }}/pipelines/{{ item.pipeline }}"
    remote_src: false
    include:
      - "default/pipelines/{{ item.pipeline }}/conf.yml"
    extra_opts:
      - "--strip-components=3"
    owner: root
    group: root
  loop: "{{ agent_sandbox_cribl_packs }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.pipeline }}"
  notify: Restart agent sandbox proxy

- name: Remove pack staging files from controller
  ansible.builtin.file:
    path: "/tmp/agent-sandbox-{{ item.name }}-{{ item.version }}.crbl"
    state: absent
  loop: "{{ agent_sandbox_cribl_packs }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false

- name: Deploy agent sandbox docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ agent_sandbox_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart agent sandbox proxy

- name: Inspect the externally provisioned ZCode service credential file
  ansible.builtin.stat:
    path: "{{ agent_sandbox_zcode_web_env_file }}"
  register: _agent_sandbox_zcode_service_env

- name: Require the ZCode service credential file to use the private secret group
  ansible.builtin.assert:
    that:
      - _agent_sandbox_zcode_service_env.stat.exists
      - _agent_sandbox_zcode_service_env.stat.isreg
      - _agent_sandbox_zcode_service_env.stat.pw_name == 'root'
      - _agent_sandbox_zcode_service_env.stat.gr_name == agent_sandbox_zcode_web_secret_group
      - _agent_sandbox_zcode_service_env.stat.mode == '0440'
    fail_msg: >-
      {{ agent_sandbox_zcode_web_env_file }} must be provisioned separately
      as a root:{{ agent_sandbox_zcode_web_secret_group }} mode 0440 file
      containing only the ZCode Web service credentials. This role does not
      deliver credentials.

- name: Deploy agent sandbox networks and proxy via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ agent_sandbox_dir }}"
    state: present
