---
# The host dispatcher (agent-dispatch) and its SSH forced-command entry point
# (dispatch-ssh), both from dryvist/nix-agent-sandbox at one pinned commit.
- name: Fetch the pinned dispatcher sources on the controller
  ansible.builtin.get_url:
    url: >-
      {{ 'https://raw.githubusercontent.com/dryvist/nix-agent-sandbox/'
         ~ agent_sandbox_dispatch_source_commit ~ '/scripts/' ~ item.name }}
    dest: "{{ agent_sandbox_dispatch_stage_prefix }}{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop: "{{ agent_sandbox_dispatch_sources }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  # The target copy below needs these verified controller-side sources in check mode.
  check_mode: false

- name: Stage the OpenBao release checksum manifest on controller
  ansible.builtin.get_url:
    url: >-
      https://github.com/openbao/openbao/releases/download/v{{
      agent_sandbox_dispatch_bao_version }}/checksums.txt
    dest: >-
      /tmp/agent-sandbox-openbao-{{ agent_sandbox_dispatch_bao_version
      }}-checksums.txt
    mode: "0644"
    force: true
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  check_mode: false

- name: Stage the OpenBao release checksum manifest signature on controller
  ansible.builtin.get_url:
    url: >-
      https://github.com/openbao/openbao/releases/download/v{{
      agent_sandbox_dispatch_bao_version }}/checksums.txt.gpgsig
    dest: >-
      /tmp/agent-sandbox-openbao-{{ agent_sandbox_dispatch_bao_version
      }}-checksums.txt.gpgsig
    mode: "0644"
    force: true
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  check_mode: false

- name: Build the OpenBao release verification keyring on controller
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - /tmp/agent-sandbox-openbao.gpg
      - "{{ role_path }}/files/openbao-gpg-pub-20240618.asc"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  changed_when: false
  check_mode: false

- name: Verify the OpenBao release checksum manifest signature
  ansible.builtin.command:
    argv:
      - gpgv
      - --keyring
      - /tmp/agent-sandbox-openbao.gpg
      - >-
        /tmp/agent-sandbox-openbao-{{ agent_sandbox_dispatch_bao_version
        }}-checksums.txt.gpgsig
      - >-
        /tmp/agent-sandbox-openbao-{{ agent_sandbox_dispatch_bao_version
        }}-checksums.txt
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  changed_when: false
  check_mode: false

- name: Read the expected SHA256 for OpenBao client archive
  ansible.builtin.set_fact:
    _agent_sandbox_dispatch_bao_checksum_matches: >-
      {{ lookup('file', '/tmp/agent-sandbox-openbao-' ~
          agent_sandbox_dispatch_bao_version ~ '-checksums.txt')
         | regex_findall('(?m)^\s*([0-9a-f]{64})\s+\*?' ~
             (('openbao_' ~ agent_sandbox_dispatch_bao_version ~
               '_linux_amd64.tar.gz') | regex_escape) ~ '\s*$') }}
  run_once: true

- name: Assert exactly one OpenBao archive checksum was found
  ansible.builtin.assert:
    that:
      - _agent_sandbox_dispatch_bao_checksum_matches | length == 1
    fail_msg: >-
      Expected exactly one OpenBao linux_amd64 archive hash in the signed
      checksums.txt manifest for v{{ agent_sandbox_dispatch_bao_version }}.
  run_once: true

- name: Set OpenBao archive checksum
  ansible.builtin.set_fact:
    agent_sandbox_dispatch_bao_sha256: "{{ _agent_sandbox_dispatch_bao_checksum_matches | first }}"
  run_once: true

- name: Fetch the pinned OpenBao client to controller
  ansible.builtin.get_url:
    url: >-
      https://github.com/openbao/openbao/releases/download/v{{
      agent_sandbox_dispatch_bao_version }}/openbao_{{
      agent_sandbox_dispatch_bao_version }}_linux_amd64.tar.gz
    dest: "{{ agent_sandbox_dispatch_bao_stage_file }}"
    checksum: "sha256:{{ agent_sandbox_dispatch_bao_sha256 }}"
    mode: "0644"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  # The target copy below needs this verified controller-side archive in check mode.
  check_mode: false

- name: Create the OpenBao client staging directory on controller
  ansible.builtin.file:
    path: "{{ agent_sandbox_dispatch_bao_stage_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  # unarchive requires its destination to exist in check mode.
  check_mode: false

- name: Extract the OpenBao client on controller
  ansible.builtin.unarchive:
    src: "{{ agent_sandbox_dispatch_bao_stage_file }}"
    dest: "{{ agent_sandbox_dispatch_bao_stage_dir }}"
    remote_src: true
    include:
      - bao
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  check_mode: false

- name: Install the OpenBao client
  ansible.builtin.copy:
    src: "{{ agent_sandbox_dispatch_bao_stage_dir }}/bao"
    dest: "{{ agent_sandbox_dispatch_bao_bin }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the dispatcher library directory
  ansible.builtin.file:
    path: /usr/local/lib/agent-sandbox
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the pinned dispatcher sources
  ansible.builtin.copy:
    src: "{{ agent_sandbox_dispatch_stage_prefix }}{{ item.name }}"
    dest: "/usr/local/lib/agent-sandbox/{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ agent_sandbox_dispatch_sources }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read the task profiles baked into the pinned job image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --entrypoint
      - cat
      - "{{ agent_sandbox_dispatch_image }}"
      - /home/agent/.agent-profiles.json
  register: _agent_sandbox_task_profiles
  changed_when: false
  # This read changes nothing and the following copy needs its output in check mode.
  check_mode: false
  # The first run of a new image pulls it; polling keeps that attached to this
  # task past the controller's 240-second task_timeout.
  timeout: "{{ agent_sandbox_dispatch_image_pull_timeout }}"
  async: "{{ agent_sandbox_dispatch_image_pull_timeout }}"
  poll: 10

- name: Install the image task profiles for the dispatcher
  ansible.builtin.copy:
    content: "{{ _agent_sandbox_task_profiles.stdout }}\n"
    dest: "{{ agent_sandbox_dir }}/agent-task-profiles.json"
    owner: root
    group: root
    mode: "0644"

- name: Validate the service endpoints the dispatcher requires
  ansible.builtin.assert:
    that:
      - agent_sandbox_git_mirror_url | urlsplit('scheme') == 'https'
      - agent_sandbox_dispatch_vikunja_url | urlsplit('scheme') == 'https'
      - agent_sandbox_dispatch_zammad_url | urlsplit('scheme') == 'https'
    fail_msg: >-
      The dispatcher refuses every job without HTTPS Git mirror, Vikunja and
      Zammad endpoints.
    quiet: true

- name: Configure the dispatcher's profiles, limits and endpoints
  ansible.builtin.template:
    src: agent-dispatch-profile.sh.j2
    dest: /etc/agent-sandbox/agent-dispatch-profile.sh
    owner: root
    group: root
    mode: "0644"

- name: Remove the OpenBao client staging files from controller
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ agent_sandbox_dispatch_bao_stage_file }}"
    - "{{ agent_sandbox_dispatch_bao_stage_dir }}"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  check_mode: false

# The sources carry no shebang: upstream wraps them with writeShellApplication.
- name: Install the dispatcher and its SSH entry point
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /etc/agent-sandbox/agent-dispatch-profile.sh
      source /usr/local/lib/agent-sandbox/{{ item.source }}
    owner: root
    group: root
    mode: "0755"
  loop:
    - { dest: "{{ agent_sandbox_dispatch_dispatcher }}", source: agent-dispatch.sh }
    - { dest: "{{ agent_sandbox_dispatch_upstream_command }}", source: dispatch-ssh.sh }
  loop_control:
    label: "{{ item.dest }}"

# Hourly login check: a credential that stops working alerts before a job
# needs it. systemd reads the root-only alert settings before dropping to the
# dispatcher user.
- name: Check for the dispatcher credential-check timer unit
  ansible.builtin.stat:
    path: /etc/systemd/system/agent-dispatch-check.timer
  register: agent_sandbox_dispatch_check_timer_unit_file
  when: ansible_check_mode

- name: Install the dispatcher credential check service and timer
  ansible.builtin.template:
    src: "dispatch-check.{{ item }}.j2"
    dest: "/etc/systemd/system/agent-dispatch-check.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]

- name: Enable the hourly dispatcher credential check
  ansible.builtin.systemd:
    name: agent-dispatch-check.timer
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or agent_sandbox_dispatch_check_timer_unit_file.stat.exists

- name: Remove the dispatcher staging files from the controller
  ansible.builtin.file:
    path: "{{ agent_sandbox_dispatch_stage_prefix }}{{ item.name }}"
    state: absent
  loop: "{{ agent_sandbox_dispatch_sources }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  # Remove the controller staging files in check mode too.
  check_mode: false
