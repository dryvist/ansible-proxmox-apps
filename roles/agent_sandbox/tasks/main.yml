---
# Agent sandbox egress boundary: internal docker network + allowlisting
# CONNECT proxy on the docker-host VM. Agent containers are NOT managed here —
# dryvist/nix-agent-sandbox's `agent run --host` spawns them ad hoc.

# Docker's data lives on the guest's dedicated data disk, placed by the same
# tasks the runner hosts use (declared once, in the docker_vms group vars).
- name: Place /var/lib/docker on the dedicated data disk
  ansible.builtin.include_role:
    name: github_runner
    tasks_from: data_disk

- name: Load the container-egress filter before any container exists
  ansible.builtin.include_tasks: main/nftables.yml

- name: Prepare the restricted dispatcher account
  ansible.builtin.include_tasks: main/dispatch_account.yml
  when: agent_sandbox_dispatch_access_enabled | bool

- name: Deploy the egress boundary network, squid config, and Cribl Edge sidecar
  ansible.builtin.include_tasks: main/deploy.yml

- name: Validate the boundary with bypass probes and manage the session-log prune timer
  ansible.builtin.include_tasks: main/validate_and_prune.yml

- name: Configure dispatcher client access
  ansible.builtin.include_tasks: main/dispatch_access.yml
  when: agent_sandbox_dispatch_access_enabled | bool

- name: Deliver sandbox credentials
  ansible.builtin.import_tasks: main/approle.yml
  tags:
    - agent_sandbox
    - agent_sandbox_credentials
