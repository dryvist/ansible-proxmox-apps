---
galaxy_info:
  author: JacobPEvans
  description: Egress boundary and host container-egress filter for autonomous agent containers
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - docker
    - agents
    - nftables

dependencies:
  # The role drives `docker compose` and `docker run`, so Docker is a hard
  # requirement. It used to be present only because another role on the same
  # host pulled it in; declaring it keeps a dedicated agent host self-sufficient.
  # The daemon's storage layout belongs to the host, not to this role.
  - role: docker_engine
    docker_engine_install_fuse_overlayfs: false
