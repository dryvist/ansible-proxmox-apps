---
- name: Reload dispatcher SSH access
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart sandbox logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted

- name: Restart agent sandbox proxy
  community.docker.docker_compose_v2:
    project_src: "{{ agent_sandbox_dir }}"
    state: present
    recreate: always

- name: Reload agent sandbox nftables
  ansible.builtin.systemd:
    name: "{{ agent_sandbox_nft_service }}.service"
    state: reloaded
  when: not ansible_check_mode or agent_sandbox_nft_unit_file.stat.exists

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart CI resolver
  ansible.builtin.systemd_service:
    name: ci-resolver.service
    state: restarted
  when: not ansible_check_mode or agent_sandbox_ci_resolver_unit_file.stat.exists
