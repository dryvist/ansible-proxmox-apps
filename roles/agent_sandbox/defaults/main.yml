---
# Egress boundary for autonomous agent containers (dryvist/nix-agent-sandbox)
# on the agent_sandbox_host inventory group (docker_vms members carrying the
# agent-sandbox tag). Creates an internal-only docker network whose sole
# route out is an allowlisting CONNECT proxy, backed by a host nftables
# filter that drops any container packet leaving the agents bridge;
# `agent run --host` attaches fresh containers to it with plain `docker run`
# — no IaC in the loop.

# SSH user the nix-agent-sandbox launcher connects as (DOCKER_HOST=ssh://);
# granted docker group membership so remote `docker run` works without sudo.
agent_sandbox_operator_user: "{{ ansible_user | default('debian') }}"
agent_sandbox_dispatch_access_enabled: false
agent_sandbox_dispatch_user: agent-dispatch
agent_sandbox_open_llm_role_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_OPEN_LLM_ROLE_ID'] | default('', true) }}
agent_sandbox_open_llm_secret_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_OPEN_LLM_SECRET_ID'] | default('', true) }}
agent_sandbox_dispatch_alert_url: >-
  https://ntfy.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
  | mandatory('PROXMOX_SUBDOMAIN must be set in the environment') }}
agent_sandbox_dispatch_alert_token: >-
  {{ (hostvars['localhost'].openbao_secrets_by_domain | default({}))
     .get('apps', {}).get('NTFY_AI_JOBS_TOKEN', '') }}
agent_sandbox_dispatch_command: /usr/local/bin/agent-dispatch-ssh-with-alert
agent_sandbox_dispatch_upstream_command: /usr/local/bin/agent-dispatch-ssh
agent_sandbox_dispatch_root_command: /usr/local/lib/agent-sandbox/agent-dispatch-ssh-root
agent_sandbox_dispatch_sudoers_file: /etc/sudoers.d/agent-dispatch-alert
agent_sandbox_dispatch_authorized_keys: []
agent_sandbox_dir: /opt/agent-sandbox
agent_sandbox_squid_image: "ubuntu/squid:6.6-24.04_beta"
agent_sandbox_probe_image: "curlimages/curl:8.22.0"
# Adversarial-probe helper: busybox has nc/ping/nslookup/ip applets for the
# UDP, ICMP, raw-DNS and IPv6-state checks curl can't do. Public well-known
# literals below are route-existence targets (a bypass would REACH them); they
# are NOT homelab infra, so hardcoding them is intentional, not an IP leak.
agent_sandbox_netprobe_image: "busybox:1.38"
agent_sandbox_probe_external_ip: "1.1.1.1"
agent_sandbox_probe_external_ip6: "2606:4700:4700::1111"
agent_sandbox_probe_doh_host: "cloudflare-dns.com"
agent_sandbox_probe_metadata_ip: "169.254.169.254"
agent_sandbox_proxy_container: agent-squid
# Network + alias names are the contract with the nix-agent-sandbox launcher
# (its AGENT_NETWORK / AGENT_PROXY_URL defaults: agents / http://proxy:3128).
agent_sandbox_network: agents
agent_sandbox_egress_network: agents-egress
agent_sandbox_proxy_alias: proxy
agent_sandbox_proxy_port: 3128

# Always-on authenticated ZCode Web service. The published GHCR manifest is
# pinned here; update it only with the digest produced by the image workflow.
agent_sandbox_zcode_web_image: >-
  {{ 'ghcr.io/dryvist/nix-agent-sandbox/agent@sha256:'
  ~ 'a0d818a658dd93233623ca5523c23bfd0f7b47ec56cb60d9cbc5d05271a01868' }}
agent_sandbox_zcode_web_container: agent-zcode-web
# DHCP-leased Docker VMs publish an FQDN as `ip`; bind to this host's IPv4 fact.
agent_sandbox_zcode_web_bind_address: "{{ ansible_default_ipv4.address }}"
agent_sandbox_zcode_web_host_port: 443
agent_sandbox_zcode_web_port: 8080
agent_sandbox_zcode_web_env_file: /etc/agent-sandbox/zcode-service.env
agent_sandbox_zcode_web_secret_group: agent-sandbox-zcode
agent_sandbox_zcode_web_data_dir: /var/lib/agent-sandbox/zcode/data
agent_sandbox_zcode_web_work_dir: /var/lib/agent-sandbox/zcode/work
agent_sandbox_zcode_web_memory_limit: 4g
agent_sandbox_zcode_web_cpus: "2"
agent_sandbox_zcode_web_pids_limit: 256

# Host dispatcher (dryvist/nix-agent-sandbox agent-dispatch + dispatch-ssh),
# installed when dispatch access is enabled. The job image and both sources
# are pinned to one merged commit; update all three together.
agent_sandbox_dispatch_image: >-
  {{ 'ghcr.io/dryvist/nix-agent-sandbox/agent@sha256:'
  ~ 'a0d818a658dd93233623ca5523c23bfd0f7b47ec56cb60d9cbc5d05271a01868' }}
agent_sandbox_dispatch_source_commit: e2228047a450a37b941d74543e5be82ce686f3a5
agent_sandbox_dispatch_sources:
  - { name: agent-dispatch.sh, sha256: ef3a44544a000aa873a29d2058a0f3e3db9e57c5f9b21309d198245b79c2419c }
  - { name: dispatch-ssh.sh, sha256: 246c813630d38f2801a141b26ce82eea814b914e6c67cf959c6c1b34a3094208 }
agent_sandbox_dispatch_stage_prefix: "/tmp/agent-sandbox-{{ agent_sandbox_dispatch_source_commit[:8] }}-"
agent_sandbox_dispatch_dispatcher: /usr/local/bin/agent-dispatch
agent_sandbox_dispatch_state_dir: /var/lib/agent-dispatch
agent_sandbox_dispatch_alert_env_file: /etc/agent-sandbox/dispatcher-alert/dispatcher-alert.env
agent_sandbox_dispatch_bao_addr: "https://openbao.{{ ingress_domain }}"
agent_sandbox_dispatch_router_base_url: "https://llm.{{ ingress_domain }}/v1"
# Vikunja project that receives each job's fixed-format result (AI Jobs).
agent_sandbox_dispatch_vikunja_project: 55

# The only forwarded path into the agent bridge is the SSO proxy's published
# Web connection. Read addresses from the loaded inventory artifact on
# localhost: limited runs do not propagate tofu_data to out-of-limit hosts.
agent_sandbox_zcode_web_ingress_source_ips: >-
  {{ groups.get('traefik_group', [])
     | map('extract', hostvars['localhost']['tofu_data']['containers'])
     | map(attribute='ip') | list }}

# Host-side identity of the two bridges, so the nftables filter can match them.
# Names are fixed (max 15 characters) because the rules key off the interface
# name; Docker allocates the subnets, so the filter carries no address.
agent_sandbox_bridge: br-agents
agent_sandbox_egress_bridge: br-agents-out

# nftables filter on forwarded container traffic (see tasks/main/nftables.yml).
agent_sandbox_nft_table: agent_sandbox
agent_sandbox_nft_file: "{{ agent_sandbox_dir }}/agent-sandbox.nft"
agent_sandbox_nft_service: agent-sandbox-nft

# Committed mirror of dryvist/nix-agent-sandbox `lib.egressDomains` — that
# repo is the source of truth. Regenerate with:
#   nix eval github:dryvist/nix-agent-sandbox#lib.egressDomains --json
# The model API group includes deployment-specific endpoints beyond upstream;
# a regeneration must keep them.
agent_sandbox_egress_domains:
  modelApis:
    - api.anthropic.com
    - api.openai.com
    - chatgpt.com
    - generativelanguage.googleapis.com
    - cloudcode-pa.googleapis.com
  github:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com
    - ghcr.io
    - pkg-containers.githubusercontent.com
  nix:
    - cache.nixos.org
    - channels.nixos.org
    - install.determinate.systems
  # Exact Z.ai hosts only. The CDN entry below is explicitly allowed; no
  # wildcard CDN, object-store or telemetry domains are included.
  zai:
    - api.z.ai
    - cdn-zcode.z.ai
    - chat.z.ai
    - zcode.z.ai
  cursorAgent:
    - .cursor.sh
    - .cursorapi.com
  internal: []

# --- Session-log shipping (Phase D) ------------------------------------------
# nix-agent-sandbox `agent run --host` bind-mounts each run's per-CLI session-log
# subdir under {{ agent_sandbox_spool_dir }}/<run-id>/<cli>/. A Cribl Edge
# container on this host tails the tree and ships every run's session records to
# Splunk before the --rm agent container is destroyed. Root is mode 1777 so the
# launcher's throwaway uid-1000 container can create the per-run leaves.
agent_sandbox_spool_dir: /var/lib/agent-sandbox/spool
agent_sandbox_spool_retention_days: 7
# Where the spool root is bind-mounted inside the Cribl Edge container (the
# `path` the file inputs tail).
agent_sandbox_spool_mount: /spool

# Cribl Edge (container) that tails the spool. Pinned to the same image the
# cribl_docker_stack role uses so the estate runs one Cribl build; keep in sync.
agent_sandbox_cribl_image: cribl/cribl:latest
agent_sandbox_cribl_container: agent-cribl-edge
agent_sandbox_cribl_config_dir: "{{ agent_sandbox_dir }}/cribl"

# tcpjson destination: the stable `syslog` CNAME -> HAProxy, which load-balances
# the Cribl Stream per-CLI frontends (same target the syslog_forwarder role
# uses). FQDN only, never an IP.
agent_sandbox_cribl_stream_host: >-
  syslog.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
  | mandatory('PROXMOX_SUBDOMAIN must be set in the environment') }}
# Generic Stream S2S ingress (in_cribl_s2s), from the shared Tofu constants.
agent_sandbox_cribl_s2s_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['cribl_s2s'] }}
# One Stream frontend port per CLI so Stream keys routing/enrichment off the
# port (mirrors the Mac Edge cribl_claude/cribl_codex/cribl_agy outputs).
agent_sandbox_cribl_ports:
  claude: 10311
  codex: 10312
  gemini: 10313

# Worker-level session-log pipelines are taken verbatim from the released pack
# .crbls — the same single-source model as the Mac Edge (the pack ships the
# pipeline conf; this role installs it as a worker-level pipeline, since the
# pack-internal routing layer never loads on a standalone Edge). claude ships
# raw (Stream stamps it) and has no pipeline here.
agent_sandbox_cribl_packs:
  - name: cc-edge-codex-io
    repo: dryvist/cc-edge-codex-io
    version: v0.1.1
    pipeline: codex_sessions
  - name: cc-edge-gemini-antigravity-io
    repo: JacobPEvans-personal/cc-edge-gemini-antigravity-io
    version: v0.4.1
    pipeline: llm_normalize
    sha256: 27164d2afe6590cc36dac4c82f79809a5bdee6f6eed3f2aa205fbdd44e2b2fe6
