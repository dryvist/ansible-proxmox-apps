---
# Agent containers on `agent_sandbox_host` use an internal Docker network.
# Its only egress route is the allowlisting CONNECT proxy; host nftables drops
# traffic leaving the agent bridge. `agent run --host` attaches containers with
# `docker run`; no IaC configuration is involved.

# SSH user the nix-agent-sandbox launcher connects as (DOCKER_HOST=ssh://);
# granted docker group membership so remote `docker run` works without sudo.
agent_sandbox_operator_user: "{{ ansible_user | default('debian') }}"
agent_sandbox_dispatch_access_enabled: false
agent_sandbox_dispatch_user: agent-dispatch
agent_sandbox_open_llm_role_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_OPEN_LLM_ROLE_ID'] | default('', true) }}
agent_sandbox_open_llm_secret_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_OPEN_LLM_SECRET_ID'] | default('', true) }}
agent_sandbox_dispatch_alert_url: >-
  https://ntfy.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
  | mandatory('PROXMOX_SUBDOMAIN must be set in the environment') }}
agent_sandbox_dispatch_alert_token: >-
  {{ (hostvars['localhost'].openbao_secrets_by_domain | default({}))
     .get('apps', {}).get('NTFY_AI_JOBS_TOKEN', '') }}
agent_sandbox_dispatch_command: /usr/local/bin/agent-dispatch-ssh-with-alert
agent_sandbox_dispatch_upstream_command: /usr/local/bin/agent-dispatch-ssh
agent_sandbox_dispatch_root_command: /usr/local/lib/agent-sandbox/agent-dispatch-ssh-root
agent_sandbox_dispatch_sudoers_file: /etc/sudoers.d/agent-dispatch-alert
agent_sandbox_dispatch_authorized_keys: []
agent_sandbox_dir: /opt/agent-sandbox
agent_sandbox_squid_image: >-
  ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
agent_sandbox_probe_image: "curlimages/curl:8.22.0"
# busybox adds nc/ping/nslookup/ip for UDP, ICMP, raw-DNS and IPv6 checks that
# curl lacks. The public literals below test route existence, not infrastructure.
agent_sandbox_netprobe_image: "busybox:1.38.0"
agent_sandbox_probe_external_ip: "1.1.1.1"
agent_sandbox_probe_external_ip6: "2606:4700:4700::1111"
agent_sandbox_probe_doh_host: "cloudflare-dns.com"
agent_sandbox_probe_metadata_ip: "169.254.169.254"
agent_sandbox_probe_doppler_url: https://api.doppler.com/
agent_sandbox_probe_laptop_url: ""
agent_sandbox_proxy_container: agent-squid
agent_sandbox_allow_user: agent-allow
agent_sandbox_allow_access_enabled: false
agent_sandbox_allow_authorized_keys: []
agent_sandbox_allow_authorized_keys_file: /etc/ssh/agent-sandbox-allow-keys/agent-allow
agent_sandbox_allow_command: /usr/local/bin/agent-allow
agent_sandbox_allow_sudoers_file: /etc/sudoers.d/agent-sandbox-allow
agent_sandbox_allowlist_log_dir: /var/log/agent-sandbox
agent_sandbox_allowlist_log_file: >-
  {{ agent_sandbox_allowlist_log_dir }}/allowed-domains.log
agent_sandbox_operator_allowlist_dir: /etc/agent-sandbox/allowed-domains.d
agent_sandbox_operator_allowlist_file: >-
  {{ agent_sandbox_operator_allowlist_dir }}/operator.txt
agent_sandbox_mirror_docs_enabled: false
# Public tree of the read-only Git mirror, as published in the inventory; the
# public GitHub origin serves the same repositories when no mirror is published.
agent_sandbox_git_mirror_url: >-
  {{ hostvars.get('localhost', {}).get('tofu_data', {}).get('git_mirror_urls', {}).get('public', '')
     or 'https://github.com' }}
agent_sandbox_docs_checkout_path: /srv/agent-docs
agent_sandbox_docs_container_path: /docs
agent_sandbox_docs_source_path: /var/lib/agent-sandbox/public-docs-source
agent_sandbox_docs_repository_url: >-
  {{ agent_sandbox_git_mirror_url.rstrip('/') }}/dryvist/docs.git
agent_sandbox_docs_branch: main
agent_sandbox_docs_exclude_paths:
  - observability/overview.mdx
  - repositories.mdx
  - .claude/skills/mintlify-docs-update/SKILL.md
# Network + alias names are the contract with the nix-agent-sandbox launcher
# (its AGENT_NETWORK / AGENT_PROXY_URL defaults: agents / http://proxy:3128).
agent_sandbox_network: agents
agent_sandbox_egress_network: agents-egress
agent_sandbox_proxy_alias: proxy
agent_sandbox_proxy_port: 3128

# Authenticated ZCode Web uses the published GHCR digest. Disabling it removes
# the service, secret group and credential-file requirement.
agent_sandbox_zcode_web_enabled: true
agent_sandbox_zcode_web_image: >-
  {{ 'ghcr.io/dryvist/nix-agent-sandbox/agent@sha256:'
  ~ 'a80e790df31a646bcd22a9a0a6e3295dfe73bbb120e5b41f93617983508b9653' }}
agent_sandbox_zcode_web_container: agent-zcode-web
# DHCP-leased Docker VMs publish an FQDN as `ip`; bind to this host's IPv4 fact.
agent_sandbox_zcode_web_bind_address: "{{ ansible_default_ipv4.address }}"
agent_sandbox_zcode_web_host_port: 443
agent_sandbox_zcode_web_port: 8080
agent_sandbox_zcode_web_env_file: /etc/agent-sandbox/zcode-service.env
agent_sandbox_zcode_web_secret_group: agent-sandbox-zcode
agent_sandbox_zcode_web_data_dir: /var/lib/agent-sandbox/zcode/data
agent_sandbox_zcode_web_work_dir: /var/lib/agent-sandbox/zcode/work
agent_sandbox_zcode_web_memory_limit: 4g
agent_sandbox_zcode_web_cpus: "2"
agent_sandbox_zcode_web_pids_limit: 256

# Optional host dispatcher from dryvist/nix-agent-sandbox. Pin its job image
# and both sources to one merged commit, matching the CI resolver source.
agent_sandbox_dispatch_image: >-
  {{ 'ghcr.io/dryvist/nix-agent-sandbox/agent@sha256:'
  ~ 'a80e790df31a646bcd22a9a0a6e3295dfe73bbb120e5b41f93617983508b9653' }}
# Seconds allowed for the first pull of a new job image, which exceeds the
# 240-second task_timeout; the profile read polls instead of blocking.
agent_sandbox_dispatch_image_pull_timeout: 900
agent_sandbox_dispatch_source_commit: 2c1443e07660b9a06bb338948b02661fa2e2122b
agent_sandbox_dispatch_sources:
  - { name: agent-dispatch.sh, sha256: 5613e1e762da8be116f27b31ad68040df61ff5184f44e622aa33ab4d07efdd2a }
  - { name: dispatch-ssh.sh, sha256: d615419e9bd0df811cd52165042a0ec1eacf2508a9f15a093c730f4b70f67688 }
agent_sandbox_dispatch_stage_prefix: "/tmp/agent-sandbox-{{ agent_sandbox_dispatch_source_commit[:8] }}-"
agent_sandbox_dispatch_dispatcher: /usr/local/bin/agent-dispatch
agent_sandbox_dispatch_state_dir: /var/lib/agent-dispatch
# Read the checksum from OpenBao's signed release manifest at converge time.
# renovate: datasource=github-releases depName=openbao/openbao
agent_sandbox_dispatch_bao_version: "2.7.1"
agent_sandbox_dispatch_bao_bin: /usr/local/bin/bao
agent_sandbox_dispatch_bao_stage_file: "/tmp/agent-sandbox-openbao-{{ agent_sandbox_dispatch_bao_version }}.tar.gz"
agent_sandbox_dispatch_bao_stage_dir: "/tmp/agent-sandbox-openbao-{{ agent_sandbox_dispatch_bao_version }}"
agent_sandbox_dispatch_alert_env_file: /etc/agent-sandbox/dispatcher-alert/dispatcher-alert.env
agent_sandbox_dispatch_bao_addr: "https://openbao.{{ ingress_domain }}"
agent_sandbox_router_host: "llm.{{ ingress_domain }}"
agent_sandbox_dispatch_router_base_url: "https://{{ agent_sandbox_router_host }}/v1"
# Vikunja project that receives each job's fixed-format result (AI Jobs).
agent_sandbox_dispatch_vikunja_project: 55
# API base URLs the dispatcher hands to each job for its Vikunja and Zammad MCP servers.
agent_sandbox_dispatch_vikunja_url: "https://vikunja.{{ ingress_domain }}/api/v1"
agent_sandbox_dispatch_zammad_url: "https://zammad.{{ ingress_domain }}/api/v1"
# Repository owners the dispatcher refuses, as a comma-separated list; it fails closed when empty or malformed.
agent_sandbox_dispatch_repo_denylist: JacobPEvans-personal

# CI resolver (dryvist/nix-agent-sandbox scripts/ci-resolver.py).
agent_sandbox_ci_resolver_enabled: false
# The resolver's own GitHub App ID; required when enabled.
agent_sandbox_ci_resolver_app_id: "4282473"
agent_sandbox_ci_resolver_role_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_CI_RESOLVER_ROLE_ID'] | default('', true) }}
agent_sandbox_ci_resolver_secret_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     ['OPENBAO_APPROLE_CI_RESOLVER_SECRET_ID'] | default('', true) }}
agent_sandbox_ci_resolver_source_commit: "{{ agent_sandbox_dispatch_source_commit }}"
agent_sandbox_ci_resolver_source_sha256: ce53312c38d9552ffab68a6402c00967af9985089291db66d98660288e4478c8
agent_sandbox_ci_resolver_stage_file: >-
  /tmp/agent-sandbox-ci-resolver-{{ agent_sandbox_ci_resolver_source_commit[:8] }}.py
agent_sandbox_ci_resolver_script: /usr/local/lib/agent-sandbox/ci-resolver.py
agent_sandbox_ci_resolver_secret_helper: /usr/local/lib/agent-sandbox/ci-resolver-secret
agent_sandbox_ci_resolver_env_file: /etc/agent-sandbox/ci-resolver.env
agent_sandbox_ci_resolver_approle_dir: /etc/ci-resolver/approle
agent_sandbox_ci_resolver_github_mount: github-admin
agent_sandbox_ci_resolver_permission_set: ci-resolver-dryvist
agent_sandbox_ci_resolver_secret_path: secret/data/apps/ci-resolver
agent_sandbox_ci_resolver_state_dir: /var/lib/ci-resolver
agent_sandbox_ci_resolver_checkout_dir: "{{ agent_sandbox_ci_resolver_state_dir }}/prompts"
agent_sandbox_ci_resolver_workbook_dir: >-
  {{ agent_sandbox_ci_resolver_checkout_dir }}/automation/ci-workbook
agent_sandbox_ci_resolver_org: dryvist
agent_sandbox_ci_resolver_token_repo: "{{ agent_sandbox_ci_resolver_org }}/.github"
agent_sandbox_ci_resolver_repos: []
agent_sandbox_ci_resolver_max_attempts: 3
agent_sandbox_ci_resolver_shadow: true
agent_sandbox_ci_resolver_vikunja_project: 44
agent_sandbox_ci_resolver_vikunja_url: "https://vikunja.{{ ingress_domain }}"
agent_sandbox_ci_resolver_zammad_group: Homelab Infrastructure
agent_sandbox_ci_resolver_zammad_url: "https://zammad.{{ ingress_domain }}"

# Forward only the SSO proxy addresses from localhost's loaded inventory;
# limited runs do not propagate tofu_data to out-of-limit hosts.
agent_sandbox_zcode_web_ingress_source_ips: >-
  {{ groups.get('traefik_group', [])
     | map('extract', hostvars['localhost']['tofu_data']['containers'])
     | map(attribute='ip') | list }}

# Host-side identity of the two bridges, so the nftables filter can match them.
# Names are fixed (max 15 characters) because the rules key off the interface
# name; Docker allocates the subnets, so the filter carries no address.
agent_sandbox_bridge: br-agents
agent_sandbox_egress_bridge: br-agents-out

# nftables filter on forwarded container traffic (see tasks/main/nftables.yml).
agent_sandbox_nft_table: agent_sandbox
agent_sandbox_nft_file: "{{ agent_sandbox_dir }}/agent-sandbox.nft"
agent_sandbox_nft_service: agent-sandbox-nft

# Mirror of dryvist/nix-agent-sandbox `lib.egressDomains`; regenerate with
# `nix eval github:dryvist/nix-agent-sandbox#lib.egressDomains --json`. Keep
# deployment-specific model API endpoints when regenerating.
agent_sandbox_egress_domains:
  modelApis:
    - api.anthropic.com
    - api.openai.com
    - chatgpt.com
    - generativelanguage.googleapis.com
    - cloudcode-pa.googleapis.com
  github:
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com
    - ghcr.io
    - pkg-containers.githubusercontent.com
  nix:
    - cache.nixos.org
    - channels.nixos.org
    - install.determinate.systems
  # Exact Z.ai hosts only. The CDN entry below is explicitly allowed; no
  # wildcard CDN, object-store or telemetry domains are included.
  zai:
    - api.z.ai
    - cdn-zcode.z.ai
    - chat.z.ai
    - zcode.z.ai
  cursorAgent:
    - .cursor.sh
    - .cursorapi.com
  internal:
    - "{{ agent_sandbox_router_host }}"
    - "{{ agent_sandbox_dispatch_bao_addr | urlsplit('hostname') }}"

# --- Session-log shipping ----------------------------------------------------
# The launcher bind-mounts per-CLI logs under spool/<run-id>/<cli>. Cribl Edge
# ships them to Splunk before the --rm agent exits. Root uses mode 1777 so the
# launcher container's uid 1000 can create run directories.
agent_sandbox_spool_dir: /var/lib/agent-sandbox/spool
agent_sandbox_spool_retention_days: 7
# Where the spool root is bind-mounted inside the Cribl Edge container (the
# `path` the file inputs tail).
agent_sandbox_spool_mount: /spool

# Cribl Edge (container) that tails the spool. Pinned to the same image the
# cribl_docker_stack role uses so the estate runs one Cribl build; keep in sync.
agent_sandbox_cribl_image: cribl/cribl:4.20.2
agent_sandbox_cribl_container: agent-cribl-edge
agent_sandbox_cribl_config_dir: "{{ agent_sandbox_dir }}/cribl"

# tcpjson destination: the stable `syslog` CNAME -> HAProxy, which load-balances
# the Cribl Stream per-CLI frontends (same target the syslog_forwarder role
# uses). FQDN only, never an IP.
agent_sandbox_cribl_stream_host: >-
  syslog.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
  | mandatory('PROXMOX_SUBDOMAIN must be set in the environment') }}
# Generic Stream S2S ingress (in_cribl_s2s), from the shared Tofu constants.
agent_sandbox_cribl_s2s_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['cribl_s2s'] }}
# One Stream frontend port per CLI so Stream keys routing/enrichment off the
# port (mirrors the Mac Edge cribl_claude/cribl_codex/cribl_agy outputs).
agent_sandbox_cribl_ports:
  claude: 10311
  codex: 10312
  gemini: 10313

# Worker-level session-log pipelines are taken verbatim from the released pack
# .crbls — the same single-source model as the Mac Edge (the pack ships the
# pipeline conf; this role installs it as a worker-level pipeline, since the
# pack-internal routing layer never loads on a standalone Edge). claude ships
# raw (Stream stamps it) and has no pipeline here.
agent_sandbox_cribl_packs:
  - name: cc-edge-codex-io
    repo: dryvist/cc-edge-codex-io
    version: v0.1.1
    pipeline: codex_sessions
  - name: cc-edge-gemini-antigravity-io
    repo: JacobPEvans-personal/cc-edge-gemini-antigravity-io
    version: v0.4.1
    pipeline: llm_normalize
    sha256: 27164d2afe6590cc36dac4c82f79809a5bdee6f6eed3f2aa205fbdd44e2b2fe6
