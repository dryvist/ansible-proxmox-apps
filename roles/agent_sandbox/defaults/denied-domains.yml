---
# Task-tracker web apps agent containers must never reach, even if an operator
# later adds them to either allowlist file. Squid denies them ahead of every
# allow rule (see templates/squid.conf.j2) and agent-allow refuses to add them
# or their subdomains. Names build from PROXMOX_SUBDOMAIN exactly like
# agent_sandbox_cribl_stream_host in main.yml; never write a literal domain.
# Split from main.yml to keep both files inside their token budgets
# (.token-limits.yaml); ansible loads every file in this directory.
agent_sandbox_denied_domains:
  - >-
    youtrack.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
    | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
    | mandatory('PROXMOX_SUBDOMAIN must be set in the environment') }}
  - >-
    vikunja.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
    | default(undef('PROXMOX_SUBDOMAIN is empty'), true)
    | mandatory('PROXMOX_SUBDOMAIN must be set in the environment') }}
