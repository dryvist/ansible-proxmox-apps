---
# Provider quota probes publish node_exporter textfile metrics. Each entry in
# agent_sandbox_quota_probe_executors is one provider executor; a new provider
# is one more entry, with no new tasks or templates.
agent_sandbox_zai_quota_probe_enabled: true
agent_sandbox_quota_probe_calendar: "*:03/5"
agent_sandbox_quota_probe_random_delay_seconds: 60
# The textfile directory's owner, so the probe needs neither root nor membership
# in the credential group, which must stay empty on this host.
agent_sandbox_quota_probe_user: "{{ node_exporter_user | default('node-exporter') }}"
agent_sandbox_quota_probe_textfile_dir: >-
  {{ node_exporter_textfile_collector_dir
     | default('/var/lib/node_exporter/textfile_collector') }}
agent_sandbox_quota_probe_executors:
  - executor: zcode
    enabled: "{{ agent_sandbox_zai_quota_probe_enabled }}"
    url: https://api.z.ai/api/monitor/usage/quota/limit
    env_file: "{{ agent_sandbox_zcode_web_env_file }}"
    # Variable inside env_file that holds the provider API key.
    key_var: ZAI_SUBSCRIPTION_KEY
    # TOKENS_LIMIT unit number -> window label and length in seconds.
    windows:
      3: { window: 5h, seconds: 18000 }
      6: { window: weekly, seconds: 604800 }
    output: "{{ agent_sandbox_quota_probe_textfile_dir }}/agent_quota_zcode.prom"
