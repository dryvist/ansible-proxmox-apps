---
- name: Restart docker
  # The daemon must be installed before a restart. In the site play the
  # dockerd stat guards first installs in both real and check mode; in this
  # role the install probe preserves the same behavior for direct consumers.
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when:
    - inventory_hostname != (plane_host | default(''))
    - >-
      docker_daemon_dockerd.stat.exists | default(false)
      or (not ansible_check_mode and docker_engine_installed.rc | default(1) == 0)
