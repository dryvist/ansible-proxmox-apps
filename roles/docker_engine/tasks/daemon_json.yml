---
# This is the only renderer of /etc/docker/daemon.json. The site play reuses
# it on installed hosts; docker_engine runs it before package installation so
# dockerd reads the final config on its first start.
- name: Check whether the Docker configuration directory exists
  ansible.builtin.stat:
    path: /etc/docker
  register: docker_engine_config_directory

- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker daemon JSON
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_engine_daemon_json | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  register: docker_engine_daemon_config
  notify: Restart docker
  when: not (ansible_check_mode and not docker_engine_config_directory.stat.exists)
