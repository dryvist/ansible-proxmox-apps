---
# Node deploy server configuration (consumed by k3s_server.yml via from_yaml)
# flannel-backend: 'none'
disable-scheduler: true
disable-cloud-controller: true
disable-network-policy: true
disable:
  - coredns
  - traefik
  - servicelb
  - local-storage
  - metrics-server
node-taint:
  - "k3s-controlplane=true:NoExecute"
snapshotter: native
