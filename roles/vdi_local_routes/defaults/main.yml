---
# Split-tunnel routing defaults for VDI guests.
#
# Both values come from the published OpenTofu inventory via load_tofu.yml — the
# empty defaults are an ABSENCE SENTINEL, not a usable configuration. The role
# fails on them rather than adding nothing, because "no routes" is
# indistinguishable at a glance from "routes applied" once the play is green.

# Subnets that must stay reachable over the guest's own LAN. Published as
# tofu_data.vdi_preserved_cidrs, resolved from vdi_preserved_vlans.
vdi_local_routes_destinations: "{{ vdi_preserved_cidrs | default([]) }}"

# The guest's LAN gateway, published per-VM. Not discoverable inside the guest:
# a running VPN client owns the default route, so anything asking Windows for
# "the gateway" gets the tunnel's.
vdi_local_routes_gateway: "{{ vdi_gateway | default('') }}"

# Lower than the VPN client's own routes so the more-specific prefix wins
# outright rather than depending on metric tie-breaks.
vdi_local_routes_metric: 1
