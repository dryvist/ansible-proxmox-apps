---
# One bucket (object_storage_iam_bucket, set by iam_provision.yml's loop):
# provision its ro and rw RustFS user + policy. Own file so the bucket loop
# and the role loop below each get their own loop variable.
- name: Provision this bucket's ro/rw RustFS IAM
  ansible.builtin.include_tasks: iam_provision_bucket_role.yml
  loop: "{{ object_storage_bucket_credentials[object_storage_iam_bucket].keys() | list }}"
  loop_control:
    loop_var: object_storage_iam_role
    label: "{{ object_storage_iam_bucket }}/{{ object_storage_iam_role }}"
