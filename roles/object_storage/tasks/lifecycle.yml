---
# Phase 9: Lifecycle — expire noncurrent versions to bound the data volume.
# Add-if-missing for buckets that take the default, so an operator can tighten
# retention by hand without Ansible reverting it (deliberate).
#
# BUT a bucket that declares `noncurrent_expiration_days` explicitly is
# reconciled to the declared value. Add-if-missing alone is not enough there:
# the rule is applied on first converge, after which the guard skips it
# forever, so correcting a wrong value in code would silently never take
# effect on the live bucket. That is exactly how the backups bucket ended up
# holding a 10-year noncurrent retention while pgBackRest expected its deletes
# to reclaim space. An explicit declaration is an assertion about the bucket,
# not a default, so it wins over a hand edit.
- name: Read current lifecycle configuration on managed buckets
  ansible.builtin.command:
    cmd: >-
      aws --endpoint-url {{ object_storage_endpoint }} s3api
      get-bucket-lifecycle-configuration --bucket {{ item.name }}
  loop: >-
    {{ (object_storage_default_buckets | selectattr('versioning', 'defined') | selectattr('versioning') | list
        + object_storage_default_buckets | selectattr('prefix_lifecycle_rules', 'defined') | list) | unique }}
  loop_control:
    label: "{{ item.name }}"
  environment: "{{ object_storage_aws_env }}"
  register: object_storage_lifecycle_current
  check_mode: false
  changed_when: false
  # Denied vs absent: see the note on the bucket-existence probe above.
  failed_when: >-
    object_storage_lifecycle_current.rc is defined and
    object_storage_lifecycle_current.rc != 0 and
    '404' not in (object_storage_lifecycle_current.stderr | default('')) and
    'Not Found' not in (object_storage_lifecycle_current.stderr | default('')) and
    'NoSuchBucket' not in (object_storage_lifecycle_current.stderr | default('')) and
    'NoSuchLifecycleConfiguration' not in (object_storage_lifecycle_current.stderr | default(''))
  no_log: true

# A malformed prefix rule renders a lifecycle document the S3 API rejects at
# put time; fail at the declaration instead.
- name: Validate prefix-scoped lifecycle rules
  ansible.builtin.assert:
    that:
      - item.1.prefix is string and item.1.prefix | length > 0 and item.1.prefix.endswith('/')
      - item.1.expiration_days is defined or item.1.noncurrent_expiration_days is defined
      - >-
        item.1.expiration_days is not defined or
        (item.1.expiration_days is number and item.1.expiration_days is not boolean and
         item.1.expiration_days | int == item.1.expiration_days and item.1.expiration_days > 0)
      - >-
        item.1.noncurrent_expiration_days is not defined or
        (item.1.noncurrent_expiration_days is number and item.1.noncurrent_expiration_days is not boolean and
         item.1.noncurrent_expiration_days | int == item.1.noncurrent_expiration_days and
         item.1.noncurrent_expiration_days > 0)
    fail_msg: >-
      Bucket {{ item.0.name }}: invalid prefix_lifecycle_rules entry ({{ item.1 }}):
      prefix must be a non-empty string ending in '/', and at least one of expiration_days
      or noncurrent_expiration_days must be present. Each present day value must be a positive
      integer, not a boolean.
  loop: "{{ object_storage_default_buckets | subelements('prefix_lifecycle_rules', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Render lifecycle configuration documents
  ansible.builtin.template:
    src: lifecycle.json.j2
    dest: "{{ object_storage_config_dir }}/lifecycle-{{ item.name }}.json"
    owner: root
    group: root
    mode: "0640"
  loop: >-
    {{ (object_storage_default_buckets | selectattr('versioning', 'defined') | selectattr('versioning') | list
        + object_storage_default_buckets | selectattr('prefix_lifecycle_rules', 'defined') | list) | unique }}
  loop_control:
    label: "{{ item.name }}"

# The S3 put replaces the entire lifecycle document. Refuse to discard rules
# that this bucket declaration does not render, even when another rule differs.
- name: Refuse to replace lifecycle rules not owned by this bucket declaration
  ansible.builtin.assert:
    that:
      - object_storage_lifecycle_foreign_ids | length == 0
    fail_msg: >-
      Bucket {{ item.item.name }} has foreign lifecycle rule IDs:
      {{ object_storage_lifecycle_foreign_ids | join(', ') }}.
      Remove or declare them first.
  vars:
    object_storage_lifecycle_owned_ids: >-
      {{ ['expire-noncurrent']
         + (item.item.prefix_lifecycle_rules | default([]) | selectattr('noncurrent_expiration_days', 'defined')
            | map(attribute='prefix') | map('replace', '/', '-') | map('trim', '-')
            | map('regex_replace', '^', 'expire-noncurrent-') | list)
         + (item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
            | map(attribute='prefix') | map('replace', '/', '-') | map('trim', '-')
            | map('regex_replace', '^', 'expire-current-') | list) }}
    object_storage_lifecycle_foreign_ids: >-
      {{ ((item.stdout | from_json).Rules | map(attribute='ID', default='(missing ID)')
          | difference(object_storage_lifecycle_owned_ids)) if item.rc == 0 else [] }}
  loop: "{{ object_storage_lifecycle_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Report apply lifecycle expiration rules (check mode)
  ansible.builtin.debug:
    msg: "Check mode: would apply lifecycle expiration rules to bucket {{ item.item.name }}"
  loop: "{{ object_storage_lifecycle_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ansible_check_mode
    - >-
        item.rc != 0 or
        (item.stdout | default('')) is not search('NoncurrentVersionExpiration') or
        (
          item.item.noncurrent_expiration_days is defined and
          (
            (item.stdout | from_json).Rules
            | selectattr('ID', 'defined')
            | selectattr('ID', 'equalto', 'expire-noncurrent')
            | map(attribute='NoncurrentVersionExpiration.NoncurrentDays')
            | first | default(-1)
          ) != item.item.noncurrent_expiration_days
        ) or
        (
          (item.item.expire_delete_markers | default(false)) and
          (item.stdout | default('')) is not search('ExpiredObjectDeleteMarker')
        ) or
        (
          (item.item.prefix_lifecycle_rules | default([])) | length > 0 and
          (
            (
              (item.stdout | from_json).Rules
              | selectattr('Filter.Prefix', 'defined')
              | rejectattr('Filter.Prefix', 'equalto', '')
              | selectattr('NoncurrentVersionExpiration', 'defined')
              | map(attribute='NoncurrentVersionExpiration.NoncurrentDays')
              | list
            ) != (
              item.item.prefix_lifecycle_rules
              | selectattr('noncurrent_expiration_days', 'defined')
              | map(attribute='noncurrent_expiration_days')
              | list
            ) or
            (
              (item.stdout | from_json).Rules
              | selectattr('Filter.Prefix', 'defined')
              | rejectattr('Filter.Prefix', 'equalto', '')
              | selectattr('Expiration.ExpiredObjectDeleteMarker', 'defined')
              | length
            ) != (
              item.item.prefix_lifecycle_rules
              | selectattr('noncurrent_expiration_days', 'defined')
              | selectattr('expire_delete_markers', 'defined')
              | selectattr('expire_delete_markers')
              | length
            )
          )
        ) or
        (
          (
            (item.stdout | from_json).Rules
            | selectattr('Filter.Prefix', 'defined') | selectattr('Expiration.Days', 'defined')
            | map(attribute='Filter.Prefix')
            | zip((item.stdout | from_json).Rules
                  | selectattr('Filter.Prefix', 'defined') | selectattr('Expiration.Days', 'defined')
                  | map(attribute='Expiration.Days')) | sort
          ) != (
            item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
            | map(attribute='prefix')
            | zip(item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
                  | map(attribute='expiration_days')) | sort
          )
        )
  changed_when: true

- name: Apply lifecycle expiration rules
  ansible.builtin.command:
    cmd: >-
      aws --endpoint-url {{ object_storage_endpoint }} s3api put-bucket-lifecycle-configuration
      --bucket {{ item.item.name }}
      --lifecycle-configuration file://{{ object_storage_config_dir }}/lifecycle-{{ item.item.name }}.json
  loop: "{{ object_storage_lifecycle_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  environment: "{{ object_storage_aws_env }}"
  when: >-
    item.rc != 0 or
    (item.stdout | default('')) is not search('NoncurrentVersionExpiration') or
    (
      item.item.noncurrent_expiration_days is defined and
      (
        (item.stdout | from_json).Rules
        | selectattr('ID', 'defined')
        | selectattr('ID', 'equalto', 'expire-noncurrent')
        | map(attribute='NoncurrentVersionExpiration.NoncurrentDays')
        | first | default(-1)
      ) != item.item.noncurrent_expiration_days
    ) or
    (
      (item.item.expire_delete_markers | default(false)) and
      (item.stdout | default('')) is not search('ExpiredObjectDeleteMarker')
    ) or
    (
      (item.item.prefix_lifecycle_rules | default([])) | length > 0 and
      (
        (
          (item.stdout | from_json).Rules
          | selectattr('Filter.Prefix', 'defined')
          | rejectattr('Filter.Prefix', 'equalto', '')
          | selectattr('NoncurrentVersionExpiration', 'defined')
          | map(attribute='NoncurrentVersionExpiration.NoncurrentDays')
          | list
        ) != (
          item.item.prefix_lifecycle_rules
          | selectattr('noncurrent_expiration_days', 'defined')
          | map(attribute='noncurrent_expiration_days')
          | list
        ) or
        (
          (item.stdout | from_json).Rules
          | selectattr('Filter.Prefix', 'defined')
          | rejectattr('Filter.Prefix', 'equalto', '')
          | selectattr('Expiration.ExpiredObjectDeleteMarker', 'defined')
          | length
        ) != (
          item.item.prefix_lifecycle_rules
          | selectattr('noncurrent_expiration_days', 'defined')
          | selectattr('expire_delete_markers', 'defined')
          | selectattr('expire_delete_markers')
          | length
        )
      )
    ) or
    (
      (
        (item.stdout | from_json).Rules
        | selectattr('Filter.Prefix', 'defined') | selectattr('Expiration.Days', 'defined')
        | map(attribute='Filter.Prefix')
        | zip((item.stdout | from_json).Rules
              | selectattr('Filter.Prefix', 'defined') | selectattr('Expiration.Days', 'defined')
              | map(attribute='Expiration.Days')) | sort
      ) != (
        item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
        | map(attribute='prefix')
        | zip(item.item.prefix_lifecycle_rules | default([]) | selectattr('expiration_days', 'defined')
              | map(attribute='expiration_days')) | sort
      )
    )
  changed_when: true
  no_log: true
