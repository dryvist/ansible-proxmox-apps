---
# One bucket config (object_storage_iam_bucket_config, set by iam.yml): resolve
# its selected roles, defaulting to ro/rw. Split into its own file so the role
# loop and the file below each get their own loop variable.
- name: Resolve this bucket's configured credentials
  ansible.builtin.include_tasks: iam_bucket_role.yml
  loop: "{{ object_storage_iam_bucket_config.iam_roles | default(object_storage_iam_roles) }}"
  loop_control:
    loop_var: object_storage_iam_role
    label: "{{ object_storage_iam_bucket }}/{{ object_storage_iam_role }}"
