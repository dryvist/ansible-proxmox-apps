---
# One bucket (object_storage_iam_bucket, set by the caller's loop in iam.yml):
# resolve its ro and rw credentials. Split into its own file only to give the
# role loop (bucket) and the file below (ro/rw) each their own loop variable
# -- Ansible cannot nest two `loop:` clauses in one task list.
- name: Resolve this bucket's ro/rw credentials
  ansible.builtin.include_tasks: iam_bucket_role.yml
  loop: "{{ object_storage_iam_roles }}"
  loop_control:
    loop_var: object_storage_iam_role
    label: "{{ object_storage_iam_bucket }}/{{ object_storage_iam_role }}"
