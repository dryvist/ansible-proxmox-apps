---
# RustFS object storage installation and configuration.
# S3-compatible store. Bucket administration uses the `aws`
# CLI (s3api) against the loopback endpoint — RustFS speaks standard S3, so no
# vendor client is needed.

# Phase 1: Install prerequisites
- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - unzip
      - awscli
    state: present
    update_cache: true

# Phase 2: Create system user
- name: Create object-storage system group
  ansible.builtin.group:
    name: "{{ object_storage_group }}"
    system: true
    state: present

- name: Create object-storage system user
  ansible.builtin.user:
    name: "{{ object_storage_user }}"
    group: "{{ object_storage_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /srv/object-storage
    create_home: true
    state: present

# Phase 3: Create directories
- name: Create object-storage data directory
  ansible.builtin.file:
    path: "{{ object_storage_data_dir }}"
    state: directory
    owner: "{{ object_storage_user }}"
    group: "{{ object_storage_group }}"
    mode: "0750"

- name: Create object-storage config directory
  ansible.builtin.file:
    path: "{{ object_storage_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Phase 4: Download + verify + install the RustFS binary.
# Staged on the controller (unrestricted egress) then copied to the target,
# which may sit in the outbound-internal firewall group and cannot reach
# github.com. The pinned URL + SHA256 guarantee a fixed beta build.
- name: Stage RustFS release archive on controller
  ansible.builtin.get_url:
    url: "{{ object_storage_binary_base }}/{{ object_storage_rustfs_version }}/{{ object_storage_binary_asset }}"
    dest: "/tmp/{{ object_storage_binary_asset }}"
    checksum: "sha256:{{ object_storage_checksums_url }}"
    mode: "0644"
    timeout: "{{ object_storage_download_timeout }}"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  check_mode: false

- name: Ensure controller extraction directory exists
  ansible.builtin.file:
    path: "/tmp/rustfs-{{ object_storage_rustfs_version }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  check_mode: false

- name: Extract RustFS binary on controller
  ansible.builtin.unarchive:
    src: "/tmp/{{ object_storage_binary_asset }}"
    dest: "/tmp/rustfs-{{ object_storage_rustfs_version }}"
    remote_src: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  check_mode: false

- name: Locate extracted rustfs binary on controller
  ansible.builtin.find:
    paths: "/tmp/rustfs-{{ object_storage_rustfs_version }}"
    patterns: rustfs
    file_type: file
    recurse: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  register: object_storage_binary_find

- name: Assert the rustfs binary was found in the archive
  ansible.builtin.assert:
    that: object_storage_binary_find.matched | int > 0
    fail_msg: "No 'rustfs' binary found in the downloaded release archive — the asset layout may have changed."
  run_once: true

- name: Copy rustfs binary to target
  ansible.builtin.copy:
    src: "{{ hostvars[ansible_play_hosts[0]].object_storage_binary_find.files[0].path }}"
    dest: "{{ object_storage_install_dir }}/rustfs"
    owner: root
    group: root
    mode: "0755"
  notify: Restart object-storage

# Phase 5: Deploy configuration
- name: Deploy object-storage environment file
  ansible.builtin.template:
    src: object-storage.env.j2
    dest: "{{ object_storage_env_file }}"
    owner: root
    group: "{{ object_storage_group }}"
    mode: "0640"
  no_log: true
  notify: Restart object-storage

# Under --check a first install only previews, so the service steps below skip.
- name: Check for the object-storage systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/object-storage.service
  register: object_storage_unit_file
  when: ansible_check_mode

- name: Deploy object-storage systemd unit file
  ansible.builtin.template:
    src: object-storage.service.j2
    dest: /etc/systemd/system/object-storage.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart object-storage

# Phase 6: Enable and start service
- name: Enable and start object-storage service
  ansible.builtin.systemd:
    name: object-storage
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or object_storage_unit_file.stat.exists

- name: Flush handlers so the service restarts before bucket setup
  ansible.builtin.meta: flush_handlers

# Phase 7: Health check — RustFS S3 API answers on its port once ready
# (an unauthenticated request returns 403, which still proves it is listening).
# 120s, not 60: RustFS's own reference docker-compose healthcheck grants a 40s
# start_period plus 3 retries at a 30s interval (up to ~130s) before declaring
# the server unhealthy -- 60s undercuts the vendor's own documented cold-start
# grace period, especially for a first-ever bucket/erasure-set initialization
# on a shared CI runner.
- name: Wait for object-storage S3 API to accept connections (with journal-on-failure)
  block:
    - name: Wait for object-storage S3 API to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ object_storage_s3_port }}"
        timeout: 120
  rescue:
    - name: Capture the object-storage service journal for diagnosis
      ansible.builtin.command:
        cmd: journalctl -u object-storage --no-pager -n 200
      register: object_storage_startup_journal
      changed_when: false

    - name: Fail loud with the real startup error, not a bare timeout
      ansible.builtin.fail:
        msg: |
          object-storage (RustFS) never opened {{ object_storage_s3_port }} within 120s.
          journalctl -u object-storage --no-pager -n 200:
          {{ object_storage_startup_journal.stdout }}

# Phase 8: create and configure buckets. Split into its own file to keep
# main.yml under the per-file token budget. See tasks/buckets.yml.
- name: Create and configure default buckets
  ansible.builtin.include_tasks: buckets.yml

# Phase 9a: Per-bucket RustFS IAM. Each bucket gets its configured roles
# (ro/rw by default), replacing the shared root credential consumers use
# today. See tasks/iam.yml for why this needs OpenBao and skips cleanly when
# it is not configured.
- name: Generate and provision per-bucket RustFS IAM credentials
  ansible.builtin.include_tasks: iam.yml

# Phase 9b: Offsite copies. Everything above leaves this guest holding the only
# copy of every object in the store; losing it loses all of them at once.
- name: Configure offsite bucket copies
  ansible.builtin.include_tasks: offsite.yml
  when: object_storage_offsite_enabled | bool


# Phase 10: mirror external infrastructure artifacts into the local bucket.
# Split into its own file: with pointer_url/sidecar support this section
# alone exceeded the per-file token budget. See tasks/infra_mirrors.yml.
- name: Mirror external infrastructure artifacts
  ansible.builtin.include_tasks: infra_mirrors.yml
