---
# One (bucket, role) pair -- object_storage_iam_bucket / object_storage_iam_role,
# set by the caller's loop in iam_bucket.yml. Seeds the pair's RustFS key pair
# and derived endpoint and region at secret/rustfs/<bucket>/<role> through the
# shared seed_generated task (dryvist.homelab.openbao_secrets), on the
# controller, with the short-lived ansible-converge token.
#
# seed_generated keeps every stored field. A key pair is generated only while
# absent. The endpoint and region carry a valid_pattern, so a stored value that
# no longer matches the current one is replaced by it, and a matching value is
# not written. The returned fact holds the final value of every declared field.
- name: Seed this bucket/role's RustFS credential through the shared task
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the key pair and reconcile the endpoint and region
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ object_storage_iam_bao_addr }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_mount: "{{ object_storage_iam_kv_mount }}"
        openbao_secrets_seed_path: "rustfs/{{ object_storage_iam_bucket }}/{{ object_storage_iam_role }}"
        openbao_secrets_seed_fields:
          - name: "{{ object_storage_iam_access_key_field }}"
            length: "{{ object_storage_iam_access_key_length }}"
            charset: upper_numeric
          - name: "{{ object_storage_iam_secret_key_field }}"
            length: "{{ object_storage_iam_secret_key_length }}"
            charset: alnum
          - name: "{{ object_storage_iam_endpoint_field }}"
            value: "{{ object_storage_iam_public_endpoint }}"
            valid_pattern: "^{{ object_storage_iam_public_endpoint | regex_escape() }}$"
          - name: "{{ object_storage_iam_region_field }}"
            value: "{{ object_storage_region }}"
            valid_pattern: "^{{ object_storage_region | regex_escape() }}$"
        openbao_secrets_seed_register: object_storage_iam_seed

- name: Accumulate this bucket/role pair into the credential fact
  ansible.builtin.set_fact:
    object_storage_bucket_credentials: >-
      {{ object_storage_bucket_credentials
         | combine({object_storage_iam_bucket:
              (object_storage_bucket_credentials[object_storage_iam_bucket] | default({}))
              | combine({object_storage_iam_role: {
                  'access_key': object_storage_iam_seed[object_storage_iam_access_key_field],
                  'secret_key': object_storage_iam_seed[object_storage_iam_secret_key_field],
                }})}, recursive=True) }}
  no_log: true
