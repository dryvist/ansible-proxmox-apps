---
# Object storage (RustFS) role defaults — S3-compatible store. Split from a
# single defaults/main.yml (org token-limits budget); see 10-iam.yml for the
# per-bucket RustFS IAM credential defaults.
# Object storage (RustFS) role defaults — S3-compatible store.
# RustFS is beta: the version below is pinned deliberately (never the rolling
# "-latest" asset) and is tracked + bumped by Renovate via the annotation.

# renovate: datasource=github-releases depName=rustfs/rustfs
object_storage_rustfs_version: "1.0.5"
object_storage_binary_base: "https://github.com/rustfs/rustfs/releases/download"
# gnu, matching every guest this role actually converges: this estate's one
# shared LXC template (proxmox_ct_template_debian in tofu-proxmox) is Debian
# 13 "trixie" (glibc 2.40), well above what this asset requires (glibc
# >= 2.38). Molecule's own container still runs the repo-wide shared
# debian12 image every scenario is required to share (tests/test_ci_build_
# caches.py) -- its glibc is older than this asset needs, so
# molecule/object_storage/converge.yml overrides this one variable to the
# musl build for that CI container only; production keeps this gnu default.
object_storage_binary_asset: "rustfs-linux-x86_64-gnu-v{{ object_storage_rustfs_version }}.zip"
# Integrity: verify against the release SHA256SUMS, fetched at install time and
# built from the pinned version so it stays correct across Renovate bumps — no
# hardcoded hash to go stale (mirrors the zot_registry/openbao roles).
object_storage_checksums_url: "{{ object_storage_binary_base }}/{{ object_storage_rustfs_version }}/SHA256SUMS"

# Installation paths
object_storage_install_dir: /usr/local/bin
object_storage_data_dir: /srv/object-storage/data
object_storage_env_file: /etc/default/object-storage
object_storage_config_dir: /etc/object-storage
# Netrc file iam_provision.yml writes the root credential to, so
# iam_provision_bucket_role.yml's curl --aws-sigv4 calls authenticate via
# --netrc-file instead of -u (argv, ps/procfs-visible). One base variable,
# not the same path string written out at every consumer.
object_storage_iam_netrc_path: "{{ object_storage_config_dir }}/.rustfs-admin-netrc"

# Service configuration
object_storage_s3_port: 9000
object_storage_console_port: 9001
object_storage_region: us-east-1

# System user
object_storage_user: rustfs
object_storage_group: rustfs

# Root credentials — generated randomly and stored in SOPS (secrets.enc.yaml)
# in THIS repo, the least-shared tier where they are first used. They are NOT
# pre-seeded into a shared store; promote to Doppler only if a cross-repo
# consumer ever needs write access (anonymous read needs no credentials).
# Regenerate with `openssl rand -hex 12` / `-hex 32` then `sops set`.
# `lookup('env', ...)` returns "" (a *defined* empty string) when the var is
# unset, which `mandatory` would happily pass through. `default(undef(), true)`
# coerces that empty string to undefined first, so `mandatory` actually fails
# fast on a missing credential instead of booting RustFS with empty creds.
object_storage_root_user: >-
  {{ lookup('env', 'OBJECT_STORAGE_ROOT_USER')
     | default(undef(), true)
     | mandatory('OBJECT_STORAGE_ROOT_USER must be set in the environment (generate with: openssl rand -hex 12)') }}
object_storage_root_password: >-
  {{ lookup('env', 'OBJECT_STORAGE_ROOT_PASSWORD')
     | default(undef(), true)
     | mandatory('OBJECT_STORAGE_ROOT_PASSWORD must be set in the environment (generate with: openssl rand -hex 32)') }}

# Loopback S3 endpoint for local bucket administration via the aws CLI.
object_storage_endpoint: "http://127.0.0.1:{{ object_storage_s3_port }}"

# Environment applied to every `aws` admin command (loopback, root creds).
object_storage_aws_env:
  AWS_ACCESS_KEY_ID: "{{ object_storage_root_user }}"
  AWS_SECRET_ACCESS_KEY: "{{ object_storage_root_password }}"
  AWS_DEFAULT_REGION: "{{ object_storage_region }}"

# Default buckets: anonymous read on the internal network, versioned,
# lifecycle-bounded.
#
# - splunk-addons: Splunk apps + the Cribl infra mirror (anonymous read).
#   The Cribl entry in object_storage_infra_mirrors below is versioned and
#   re-seeds itself on a version bump (pointer_url + sidecar), the same
#   fix the Technitium comment above describes wanting but never getting.
# - artifacts: public-read mirror of non-secret infra binaries (the Technitium
#   DNS app distribution, etc.) that egress-restricted LXCs fetch anonymously.
#   Objects are operator-staged (no public upstream URL — captured from the
#   official container image), so they are not in object_storage_infra_mirrors.
# - idrac: store for the proprietary iDRAC KVM (AVCT) client build artifact.
#   Anonymous-read on the internal network (the build fetches via plain get_url
#   with no auth); the artifact
#   is gated by the internal-network boundary, not a bucket ACL, exactly like the
#   other buckets. Operator-staged.
# - dryvist-homelab-backups: the guest/database backup target (pgBackRest and the
#   guest vzdump S3 sync leg write here). PRIVATE — no `policy` key, so it never
#   gets the anonymous-read document; backups must never be world-readable on the
#   internal network. Versioned like the others for on-site anti-deletion.
#   `offsite_owner` marks it as owned: its writer maintains the offsite copy
#   itself (pgBackRest repo2, writing every backup and WAL segment to both repos
#   in the same operation), so the scheduled copy below must never touch it. A
#   second, out-of-band writer here can silently copy a truncated subset while
#   reporting success — the exact failure the dual-repo arrangement exists to
#   make structurally impossible.
object_storage_default_buckets:
  - name: splunk-addons
    policy: download
    versioning: true
  - name: artifacts
    policy: download
    versioning: true
  - name: idrac
    policy: download
    versioning: true
  - name: dryvist-homelab-backups
    versioning: true
    offsite_owner: pgbackrest
    # MUST stay short, and this is the one bucket where the 10-year default is
    # actively harmful. pgBackRest reclaims space by DELETING expired WAL and
    # backup objects. On a versioned bucket a delete only writes a delete
    # marker and retains the noncurrent version, so with a 3650-day rule
    # `pgbackrest expire` runs clean, reports success, and frees NOTHING —
    # the volume fills and every database backup in the estate breaks at once.
    # Immutability for this bucket belongs off-site in B2 Object Lock, not in
    # on-prem version retention (an on-prem noncurrent version does not survive
    # the ransomware case it would be there to cover).
    noncurrent_expiration_days: 30
    # Also remove delete markers left with no versions behind them, so the
    # list that `pgbackrest expire` issues does not walk markers forever.
    expire_delete_markers: true
    # pgBackRest owns retention under this prefix; noncurrent versions there
    # only inflate listings, which time out.
    prefix_lifecycle_rules:
      - prefix: postgres/
        noncurrent_expiration_days: 1
        expire_delete_markers: true
  # - dryvist-homelab-pgbackrest: the pgBackRest repository bucket (backups
  #   and WAL segments). Unversioned because pgBackRest manages its own
  #   retention and deletes expired objects itself; `offsite_owner: pgbackrest`
  #   keeps the scheduled offsite copy away from it.
  - name: dryvist-homelab-pgbackrest
    offsite_owner: pgbackrest
  # - dryvist-homebox-backups: the Homebox restic repository (the local copy).
  #   PRIVATE, like the other backup buckets. `offsite_owner` marks it as owned:
  #   restic writes its own Backblaze B2 repository directly, so the scheduled
  #   copy below must never touch it. restic prune deletes objects, and on a
  #   versioned bucket those deletes free no space until the noncurrent versions
  #   expire, so the expiry stays short.
  - name: dryvist-homebox-backups
    versioning: true
    offsite_owner: restic
    noncurrent_expiration_days: 30
  # - ai-harness-history: append-only session logs replicated from the
  #   workstations. PRIVATE — no `policy` key: these carry prompt and response
  #   text and must never be readable without credentials, on any network.
  #
  #   Deliberately NOT `offsite_owner`. The writer here only ever copies in and
  #   never deletes or expires, so unlike the backup bucket it maintains no
  #   offsite copy of its own and the scheduled copy must cover it.
  #
  #   Keeps the 10-year noncurrent default rather than overriding it: nothing
  #   reclaims space by deleting here, so a long retention costs storage
  #   growth only, and the whole point of the bucket is to outlive the short
  #   local retention window on the source machines.
  - name: ai-harness-history
    versioning: true
  # hindsight-bank-exports: nightly `hindsight-admin export-bank` archives for
  # EVERY Hindsight memory bank (ansible-proxmox-ai roles/hindsight_bank_dr),
  # date-prefixed. PRIVATE — no `policy` key: an export carries a bank's full
  # content (documents, facts, observations, mental models) and must never be
  # readable without credentials. Deliberately NOT `offsite_owner`: the writer
  # only ever adds a new date prefix and prunes its OWN old ones script-side
  # (see that role's defaults for why script-side, not a lifecycle Expiration
  # rule) — it maintains no offsite copy of its own, so the scheduled copy
  # below must cover it once a B2 key pair exists for it.
  - name: hindsight-bank-exports
    versioning: true
    noncurrent_expiration_days: 30
  # system1: versioned training datasets and model artifacts for the local
  # System 1 classifier, under immutable version-prefixed keys. PRIVATE — no
  # `policy` key: the datasets carry private text and must never be readable
  # without credentials.
  - name: system1
    versioning: true
  # logos: logo and icon artwork under version-prefixed keys. PRIVATE, with no
  # `policy` key, because some marks belong to other companies.
  - name: logos
    versioning: true
  # The state bucket already exists; declare only its reader credential tier.
  # Omitting policy/versioning leaves the existing bucket configuration alone.
  - name: terrakube
    iam_roles: [ro]

# Lifecycle: expire noncurrent object versions after this many days, bounding
# data-volume growth when artifacts are repeatedly re-uploaded. 10 years =
# effectively "keep forever" with a safety ceiling. This is the DEFAULT for
# artifact buckets, which are re-uploaded rarely and want long history.
# Override per bucket with `noncurrent_expiration_days` (see above) for any
# bucket whose writer manages its own retention by deleting objects.
object_storage_noncurrent_expiration_days: 3650

# Infrastructure artifact mirrors. Roles on egress-restricted LXCs cannot reach
# public CDNs, so the controller (unrestricted egress) stages each artifact and
# uploads it into the anonymous-read bucket for local pulls. Existing objects
# are left alone so manual retention decisions are not clobbered on re-runs
# (the head-object check in tasks/main.yml short-circuits before any of this
# runs).
#
# Each entry takes a plain `url` (used as-is, e.g. a fixed release asset) OR
# `pointer_url` (a URL whose fetched, trimmed body IS the real download URL --
# for a source with no stable per-version URL, like Cribl's CDN). A
# `pointer_url` entry also declares `version`: the pinned version string that
# MUST appear in the resolved pointer content, so a pin that lags the
# resolver's current release fails loudly instead of silently mirroring the
# wrong build (that resolver only exposes a build identifier for its CURRENT
# release -- there is no way to ask it for an older one).
#
# `sidecar: sha256` additionally stages `<resolved url>.sha256` and uploads it
# at `<key>.sha256`, and checksums the main download against it. Omit both
# `pointer_url` and `sidecar` for a plain fixed-URL, unchecksummed mirror
# (unchanged from before this was added).
object_storage_infra_mirrors:
  - name: cribl
    description: Cribl Edge/Stream tarball, versioned to the org-wide cribl_version pin
    bucket: splunk-addons
    key: "infra/cribl-{{ cribl_version }}-linux-x64.tgz"
    url: >-
      https://cdn.cribl.io/dl/{{ cribl_version.split('-')[0] }}/cribl-{{
      cribl_version }}-linux-x64.tgz
    sidecar: sha256
