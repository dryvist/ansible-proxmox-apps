---
# RustFS drive timeout profile, rendered as RUSTFS_DRIVE_TIMEOUT_PROFILE in the
# service environment; an empty string leaves the variable unset.
# shortcut: the high_latency profile works around slow listings in RustFS 1.0.4;
# set it back to empty once the version pin is 1.0.5 or later.
object_storage_drive_timeout_profile: "high_latency"
