---
# Object storage (RustFS) role defaults — S3-compatible store.
# RustFS is beta: the version below is pinned deliberately (never the rolling
# "-latest" asset) and is tracked + bumped by Renovate via the annotation.

# renovate: datasource=github-releases depName=rustfs/rustfs
object_storage_rustfs_version: "1.0.0-beta.8"
object_storage_binary_base: "https://github.com/rustfs/rustfs/releases/download"
object_storage_binary_asset: "rustfs-linux-x86_64-gnu-v{{ object_storage_rustfs_version }}.zip"
# Integrity: verify against the release SHA256SUMS, fetched at install time and
# built from the pinned version so it stays correct across Renovate bumps — no
# hardcoded hash to go stale (mirrors the zot_registry/openbao roles).
object_storage_checksums_url: "{{ object_storage_binary_base }}/{{ object_storage_rustfs_version }}/SHA256SUMS"

# Installation paths
object_storage_install_dir: /usr/local/bin
object_storage_data_dir: /srv/object-storage/data
object_storage_env_file: /etc/default/object-storage
object_storage_config_dir: /etc/object-storage

# Service configuration
object_storage_s3_port: 9000
object_storage_console_port: 9001
object_storage_region: us-east-1

# System user
object_storage_user: rustfs
object_storage_group: rustfs

# Root credentials — generated randomly and stored in SOPS (secrets.enc.yaml)
# in THIS repo, the least-shared tier where they are first used. They are NOT
# pre-seeded into a shared store; promote to Doppler only if a cross-repo
# consumer ever needs write access (anonymous read needs no credentials).
# Regenerate with `openssl rand -hex 12` / `-hex 32` then `sops set`.
# `lookup('env', ...)` returns "" (a *defined* empty string) when the var is
# unset, which `mandatory` would happily pass through. `default(undef(), true)`
# coerces that empty string to undefined first, so `mandatory` actually fails
# fast on a missing credential instead of booting RustFS with empty creds.
object_storage_root_user: >-
  {{ lookup('env', 'OBJECT_STORAGE_ROOT_USER')
     | default(undef(), true)
     | mandatory('OBJECT_STORAGE_ROOT_USER must be set (openssl rand -hex 12; store in SOPS secrets.enc.yaml)') }}
object_storage_root_password: >-
  {{ lookup('env', 'OBJECT_STORAGE_ROOT_PASSWORD')
     | default(undef(), true)
     | mandatory('OBJECT_STORAGE_ROOT_PASSWORD must be set (openssl rand -hex 32; store in SOPS secrets.enc.yaml)') }}

# Loopback S3 endpoint for local bucket administration via the aws CLI.
object_storage_endpoint: "http://127.0.0.1:{{ object_storage_s3_port }}"

# Environment applied to every `aws` admin command (loopback, root creds).
object_storage_aws_env:
  AWS_ACCESS_KEY_ID: "{{ object_storage_root_user }}"
  AWS_SECRET_ACCESS_KEY: "{{ object_storage_root_password }}"
  AWS_DEFAULT_REGION: "{{ object_storage_region }}"

# Default buckets: anonymous read on the internal network, versioned,
# lifecycle-bounded.
#
# - splunk-addons: Splunk apps + the Cribl infra mirror (anonymous read).
# - artifacts: public-read mirror of non-secret infra binaries (the Technitium
#   DNS app distribution, etc.) that egress-restricted LXCs fetch anonymously.
#   Objects are operator-staged (no public upstream URL — captured from the
#   official container image), so they are not in object_storage_infra_mirrors.
# - idrac: store for the proprietary iDRAC KVM (AVCT) client build artifact.
#   Anonymous-read on the internal network (the build fetches via plain get_url
#   with no auth); the artifact
#   is gated by the internal-network boundary, not a bucket ACL, exactly like the
#   other buckets. Operator-staged.
# - dryvist-homelab-backups: the guest/database backup target (pgBackRest and the
#   guest vzdump S3 sync leg write here). PRIVATE — no `policy` key, so it never
#   gets the anonymous-read document; backups must never be world-readable on the
#   internal network. Versioned like the others for on-site anti-deletion.
#   `offsite_owner` marks it as owned: its writer maintains the offsite copy
#   itself (pgBackRest repo2, writing every backup and WAL segment to both repos
#   in the same operation), so the scheduled copy below must never touch it. A
#   second, out-of-band writer here can silently copy a truncated subset while
#   reporting success — the exact failure the dual-repo arrangement exists to
#   make structurally impossible.
object_storage_default_buckets:
  - name: splunk-addons
    policy: download
    versioning: true
  - name: artifacts
    policy: download
    versioning: true
  - name: idrac
    policy: download
    versioning: true
  - name: dryvist-homelab-backups
    versioning: true
    offsite_owner: pgbackrest
    # MUST stay short, and this is the one bucket where the 10-year default is
    # actively harmful. pgBackRest reclaims space by DELETING expired WAL and
    # backup objects. On a versioned bucket a delete only writes a delete
    # marker and retains the noncurrent version, so with a 3650-day rule
    # `pgbackrest expire` runs clean, reports success, and frees NOTHING —
    # the volume fills and every database backup in the estate breaks at once.
    # Immutability for this bucket belongs off-site in B2 Object Lock, not in
    # on-prem version retention (an on-prem noncurrent version does not survive
    # the ransomware case it would be there to cover).
    noncurrent_expiration_days: 30

# Lifecycle: expire noncurrent object versions after this many days, bounding
# data-volume growth when artifacts are repeatedly re-uploaded. 10 years =
# effectively "keep forever" with a safety ceiling. This is the DEFAULT for
# artifact buckets, which are re-uploaded rarely and want long history.
# Override per bucket with `noncurrent_expiration_days` (see above) for any
# bucket whose writer manages its own retention by deleting objects.
object_storage_noncurrent_expiration_days: 3650

# Infrastructure artifact mirrors. Roles on egress-restricted LXCs cannot reach
# public CDNs, so the controller (unrestricted egress) stages each artifact and
# uploads it into the anonymous-read bucket for local pulls. Existing objects
# are left alone so manual retention decisions are not clobbered on re-runs.
object_storage_infra_mirrors:
  - name: cribl
    description: Cribl Edge/Stream tarball (rolling latest)
    url: https://cdn.cribl.io/dl/latest/cribl-linux-x64.tgz
    bucket: splunk-addons
    key: infra/cribl-linux-x64.tgz

# --- Offsite copies --------------------------------------------------------
# Without these, every object in this store exists in exactly one place: this
# guest. Losing it loses the remote state, the published inventory and the
# staged artifacts simultaneously, with nothing left over to signal that it
# happened. A scheduled rclone job copies each listed bucket to an
# S3-compatible offsite target. See tasks/offsite.yml for why it copies rather
# than syncs, and why an owned bucket is excluded.
#
# Off by default: it cannot work without a scoped offsite key per bucket, and
# enabling it without one would install timers that fail every run. Turn it on
# in the same change that provisions the keys.
object_storage_offsite_enabled: false

# One entry per bucket to copy. Environment-specific, so it is supplied by
# inventory rather than named here:
#   - name:        the local bucket
#   - secret_path: its credential in the EXTERNAL secrets mount (an offsite
#                  provider is internet-facing, so its key never belongs on
#                  the internal mount)
# Each offsite bucket gets its own write-scoped key, so a leaked key reaches
# one bucket rather than the whole account.
object_storage_offsite_buckets: []

# Field names inside each credential entry. One convention for every bucket —
# per-bucket field-name variables would be a second thing to keep in sync.
object_storage_offsite_endpoint_field: S3_ENDPOINT
object_storage_offsite_bucket_field: BUCKET
object_storage_offsite_key_id_field: RW_KEY_ID
object_storage_offsite_app_key_field: RW_APP_KEY
object_storage_offsite_secret_fields:
  - "{{ object_storage_offsite_endpoint_field }}"
  - "{{ object_storage_offsite_bucket_field }}"
  - "{{ object_storage_offsite_key_id_field }}"
  - "{{ object_storage_offsite_app_key_field }}"

# Buckets whose writer maintains its own offsite copy. Derived from the bucket
# declarations rather than restated, so marking a bucket `offsite_owner` is the
# single act that both documents and enforces the exclusion.
object_storage_offsite_owner_managed: >-
  {{ object_storage_default_buckets
     | selectattr('offsite_owner', 'defined')
     | map(attribute='name') | list }}

# Where the credential is read from. Same route the rest of the estate uses:
# an AppRole from the environment, never a secret written to a file here.
object_storage_offsite_bao_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
object_storage_offsite_bao_role_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_ROLE_ID') | default('', true) }}
object_storage_offsite_bao_secret_id: >-
  {{ lookup('env', 'OPENBAO_APPROLE_ANSIBLE_SECRET_ID') | default('', true) }}

# Deadman ping per bucket, keyed by bucket name. A bucket with no entry runs
# without one — the copy still happens, but a run that stops happening raises
# nothing, so set one for anything whose loss would matter.
object_storage_offsite_healthcheck_urls: {}

# Schedule. Daily off-peak, splayed so the buckets do not contend for the
# uplink at once. Persistent, so a guest that was down at the scheduled time
# catches up at boot instead of silently skipping a day.
object_storage_offsite_unit: object-storage-offsite
object_storage_offsite_schedule: "*-*-* 02:00:00"
object_storage_offsite_splay: 1800

# Transfer tuning. Concurrency, not per-connection speed, governs throughput
# to a throttling offsite endpoint. The timeout is a stall ceiling for the
# whole bucket, not a target: too low and a large bucket never completes.
object_storage_offsite_transfers: 8
object_storage_offsite_bandwidth_limit: ""
object_storage_offsite_stats_interval: 5m
object_storage_offsite_timeout: 6h

# rclone moves objects between two different endpoints in one pass; the aws
# CLI already installed here cannot, and would have to stage each whole bucket
# on local disk first. Pinned + checksum-verified, matching the version already
# vetted elsewhere in the estate. Renovate bumps the pair together; they must
# never be changed independently.
# renovate: datasource=github-releases depName=rclone/rclone
object_storage_rclone_version: "1.74.4"
object_storage_rclone_zip_sha256: "fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d"
