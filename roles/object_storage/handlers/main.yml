---
- name: Restart object-storage
  ansible.builtin.systemd:
    name: object-storage
    state: restarted
    daemon_reload: true

# Timers only — the copy jobs themselves are oneshot and must not be kicked off
# by a converge. Restarting a timer just re-reads its schedule.
- name: Restart object-storage offsite timers
  ansible.builtin.systemd:
    name: "{{ object_storage_offsite_unit }}@{{ item.name }}.timer"
    state: restarted
    daemon_reload: true
  loop: "{{ object_storage_offsite_buckets }}"
  loop_control:
    label: "{{ item.name }}"
