---
- name: Disable the optional LLM profile tile when an input is unavailable
  ansible.builtin.set_fact:
    glance_llm_profile_enabled: false
  when:
    - glance_llm_profile_enabled | bool
    - >-
      glance_llm_profile_bearer_token | length == 0
      or glance_llm_profile_router_base_url | length == 0
