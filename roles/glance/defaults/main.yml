---
# Glance — the estate's third board, rendered from the same shared
# dashboard_catalog as the other two.
#
# Glance ships NO authentication of its own. The Authelia gate on its Traefik
# route is the only thing in front of it, which is why its ingress row must
# never opt out of SSO and why this service binds where only Traefik reaches it.
#
# Unlike Homepage, upstream DOES publish release binaries, so this is a
# checksum-verified single binary rather than a source build.

glance_user: glance
glance_home: /var/lib/glance
glance_config_dir: /etc/glance
glance_bin: /usr/local/bin/glance
# Version-scoped so a bump unpacks fresh instead of reusing a stale tree.
glance_dist_dir: "/var/lib/glance/dist/{{ glance_version }}"

# renovate: datasource=github-releases depName=glanceapp/glance
glance_version: "v0.8.6"
glance_release_url: >-
  https://github.com/glanceapp/glance/releases/download/{{ glance_version }}/glance-linux-amd64.tar.gz
# sha256 of the pinned asset, computed from the published tarball. A tag can be
# moved; this cannot. Bumping the version REQUIRES recomputing this — an
# unverified fetch is a false green.
glance_release_sha256: "d27fb887eece24859f6ed3881ebb28c9d0a4fe6ae01acfa31bb39543fbf69784"

glance_host: 0.0.0.0
glance_port: >-
  {{ tofu_data.constants.service_ports.glance_web
     | mandatory('tofu_data.constants.service_ports.glance_web missing — regenerate the published inventory') }}

glance_title: "Homelab"

# Dark theme matching the estate's existing brand palette, not an invented
# color. HSL "H S L" strings, per
# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#theme.
# Each HSL value below is computed from the hex it's commented with, not
# eyeballed — hex is the source of truth if the two ever drift.
#
# Glance's own default leaves `positive-color` unset, which falls back to
# `primary-color` (upstream default: gold, HSL 43 50 70) — so a healthy
# monitor and a monitor's own accent color are the SAME gold, and only a
# failure (red) stands out. Every healthy tile then reads as "nothing works"
# next to one that's actually down. Setting positive-color explicitly, and
# different from primary-color, is the fix.
# Near-black, not navy — dark mode always preferred here. A faint reef tint
# on black rather than the docs site's navy dark-background hex, so the
# board reads as black at a glance while still keying off the same hue.
glance_theme_background_color: "210 25 4"
glance_theme_primary_color: "174 40 51" # docs primary/accent #4FB3A9
# Not a docs-palette color: the docs palette has no dedicated "success" hue,
# and reusing the teal primary/accent as positive would repeat the exact bug
# this theme fixes (healthy indistinguishable from the accent). A green
# clearly apart from the teal primary, keeping the same reef saturation/
# lightness range.
glance_theme_positive_color: "150 55 52"
glance_theme_negative_color: "355 75 55" # clear red, apart from the reef hues
# Bumped from Glance's default (1) for the near-black background: text needs
# more lift against near-black than it would against a lighter dark-navy.
glance_theme_contrast_multiplier: 1.2

# Status checks. ON: unauthenticated request against catalog probe_url (guest
# address). Interval 60s matches Gatus / Homepage.
glance_monitor_enabled: true
# Glance monitor widget cache — 1m ≈ 60s cadence.
glance_monitor_interval: "1m"

# Second board page: the estate's network + media VLAN groups only (see
# locals-ingress-groups.tf / var.containers[*].vlan in tofu-proxmox — "dns"
# is Technitium, "media_svc" is Plex/Sonarr/Radarr/autobrr). No new services:
# this filters the same dashboard_catalog_services the Services page already
# renders. The slug is the page's URL path (roles/glance docs: `<host>/<slug>`)
# and is what inventory/group_vars/wall_group.yml's GLANCE B slide points at.
glance_network_media_groups:
  - dns
  - media_svc
glance_network_media_slug: network-media
