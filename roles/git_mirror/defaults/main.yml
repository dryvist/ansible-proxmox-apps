---
git_mirror_user: git-mirror
git_mirror_group: git-mirror
git_mirror_http_group: git-mirror-read
git_mirror_root: /srv/git-mirror
git_mirror_config_dir: /etc/git-mirror
git_mirror_approle_dir: /etc/git-mirror/approle
git_mirror_public_port: 8080
git_mirror_all_port: 8081
git_mirror_public_path: /public
git_mirror_all_path: /all
git_mirror_httpd_bind_address: "*"
git_mirror_sync_interval: 6h
git_mirror_sync_on_boot: 5m
git_mirror_metrics_dir: /var/lib/git-mirror
git_mirror_metrics_file: /var/lib/git-mirror/git_mirror.prom
git_mirror_last_success_file: /var/lib/git-mirror/last-success
git_mirror_node_exporter_dir: /var/lib/node_exporter/textfile_collector
git_mirror_bao_bin: /usr/bin/bao
git_mirror_bao_addr: "https://openbao.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }}"
git_mirror_bao_version: "{{ openbao_client_version }}"
git_mirror_bao_deb_url: >-
  https://github.com/openbao/openbao/releases/download/v{{ git_mirror_bao_version
  }}/openbao_{{ git_mirror_bao_version }}_linux_amd64.deb
git_mirror_bao_token_file: /run/git-mirror/openbao-token
git_mirror_bao_role_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     .get('OPENBAO_APPROLE_GIT_MIRROR_ROLE_ID', '') }}
git_mirror_bao_secret_id: >-
  {{ (hostvars['localhost'].openbao_platform_env_doc | default({}))
     .get('OPENBAO_APPROLE_GIT_MIRROR_SECRET_ID', '') }}

# Each path is a read-only GitHub App installation-token permission set. The
# role requests tokens at sync time; these values never enter a Git remote.
git_mirror_installations:
  - owner: dryvist
    token_path: github-admin/token/git-mirror-dryvist
    private_for_all: true
  - owner: JacobPEvans
    token_path: github-admin/token/git-mirror-JacobPEvans
    private_for_all: true
  - owner: JacobPEvans-personal
    token_path: github-admin/token/git-mirror-JacobPEvans-personal
    private_for_all: false

git_mirror_all_username: mirror
git_mirror_all_password: ""

# Set by the deployment play from the inventory's ingress host addresses.
git_mirror_proxy_sources: []
git_mirror_firewall_enabled: true
git_mirror_manage_services: true
