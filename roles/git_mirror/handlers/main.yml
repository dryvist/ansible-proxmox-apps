---
- name: Restart git-mirror Apache
  ansible.builtin.systemd:
    name: apache2
    state: restarted
    daemon_reload: true

- name: Restart git-mirror OpenBao Agent
  ansible.builtin.systemd:
    name: openbao-git-mirror-agent
    state: restarted
    daemon_reload: true

- name: Reload git-mirror systemd units
  ansible.builtin.systemd:
    daemon_reload: true
