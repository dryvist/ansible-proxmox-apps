---
- name: Restart git-mirror Apache
  ansible.builtin.systemd:
    name: apache2
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and git_mirror_packages_install is changed)

- name: Restart git-mirror OpenBao Agent
  ansible.builtin.systemd:
    name: openbao-git-mirror-agent
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode or git_mirror_agent_unit_file.stat.exists

- name: Reload git-mirror systemd units
  ansible.builtin.systemd:
    daemon_reload: true
