---
# Authelia SSO portal / Traefik forwardAuth provider — a single native Go
# binary. Every Traefik router whose tofu ingress row has sso=true redirects
# unauthenticated browsers here; one passkey login opens every gated UI for
# the session lifetime. Single instance: in-memory sessions + local SQLite
# (one/two users — no Redis, no Postgres).

# --- Version / controller-staged, checksum-verified download ----------------
# LXCs in this repo are firewalled outbound-internal-only, so the release
# tarball is downloaded and checksum-verified on the CONTROLLER, then the
# extracted binary is copied to the target — same pattern as roles/vikunja.
#
# No static sha256 pin here (deliberately -- see the incident below). Renovate
# bumps authelia_version on its own schedule; a hash pinned next to it goes
# stale the moment it does, and every converge then fails at the download's
# checksum mismatch (happened 2026-09, v4.39.22 -> v4.39.27). Instead, the
# expected hash is read at converge time from Authelia's own signed release
# manifest (tasks/main.yml): download checksums.sha256 + checksums.sha256.sig,
# verify the signature against the vendored Authelia Security key
# (files/authelia-security.asc, fingerprint 1920 8591 5BD6 08A4 58AC 58DC E461
# FA15 3128 6EEA per https://www.authelia.com/overview/security/artifact-signing-and-provenance/),
# then pull the matching line for the asset. The manifest is the trust anchor
# now, not a copy of one hash frozen at commit time.
# renovate: datasource=github-releases depName=authelia/authelia
authelia_version: "4.39.28"
authelia_release_tgz: "authelia-v{{ authelia_version }}-linux-amd64.tar.gz"
authelia_release_base_url: "https://github.com/authelia/authelia/releases/download/v{{ authelia_version }}"
authelia_release_tgz_url: "{{ authelia_release_base_url }}/{{ authelia_release_tgz }}"
authelia_release_checksums_filename: checksums.sha256
authelia_release_checksums_url: "{{ authelia_release_base_url }}/{{ authelia_release_checksums_filename }}"
authelia_release_checksums_signature_url: "{{ authelia_release_checksums_url }}.sig"
authelia_binary_name: authelia

# --- System user / paths ------------------------------------------------------
authelia_user: authelia
authelia_group: authelia
authelia_install_dir: /opt/authelia
authelia_binary_path: "{{ authelia_install_dir }}/authelia"
authelia_config_dir: /etc/authelia
authelia_config_file: "{{ authelia_config_dir }}/configuration.yml"
authelia_users_file: "{{ authelia_config_dir }}/users.yml"
# SQLite + notification state live on the persistent bind mount at
# /var/lib/authelia (provisioned by terraform-proxmox), never the ephemeral
# rootfs — WebAuthn credential registrations must survive a rebuild.
authelia_data_dir: /var/lib/authelia
authelia_db_path: "{{ authelia_data_dir }}/db.sqlite3"

# --- Network / domains ---------------------------------------------------------
authelia_port: "{{ tofu_data.constants.service_ports.authelia_portal }}"
# The ingress base domain — the session cookie is scoped to it so ONE login
# covers every <name>.<base> UI. Must match the Traefik router FQDNs.
authelia_cookie_domain: "{{ ingress_domain }}"
authelia_portal_url: "https://authelia.{{ authelia_cookie_domain }}"

# Domains whose API paths bypass the SSO gate. These apps enforce their own
# token auth on every API request; the forwardAuth portal can never be
# satisfied by a non-browser client, so without a bypass an sso-flagged route
# blocks all machine consumers (a 401 from the app's own WWW-Authenticate,
# observed on the first token client 2026-07-17). Browser UIs stay behind the
# portal.
#
# The general rule this expresses: forwardAuth gates HUMAN paths; the app's own
# credential gates its machine API. Authelia is for the operator (and later,
# agents) — it must never sit in front of data ingestion.
#
# `resource` is per-entry because "the API" is not the same path prefix in
# every app. The default below covers an app whose entire /api surface is
# token-authenticated. An app that also serves its BROWSER auth endpoints under
# /api (NextAuth's /api/auth/* being the common case) must narrow it, or the
# bypass hands out its session/sign-in routes unauthenticated.
# Display-only kiosks (the server-room wall) cannot complete a login, so the
# wall host is bypassed for these clients' addresses only. Clients are FQDNs
# from the private env document (WALL_KIOSK_CLIENTS, comma-separated) and are
# resolved on the Authelia host at converge time; Authelia rules take CIDRs,
# so each resolves to a /32. Unset renders no rule at all (fails closed).
authelia_wall_kiosk_clients: >-
  {{ (lookup('env', 'WALL_KIOSK_CLIENTS') | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
authelia_wall_kiosk_domains:
  - "wall.{{ authelia_cookie_domain }}"

authelia_api_bypass_default_resource: "^/api(?:/.*)?$"
authelia_api_bypass_domains:
  - domain: "zammad.{{ authelia_cookie_domain }}"
  # Langfuse serves OTLP trace ingestion under /api/public and its NextAuth
  # browser session routes under /api/auth. Narrowed to /api/public so
  # collectors can deliver spans while the console's auth surface stays gated.
  - domain: "langfuse.{{ authelia_cookie_domain }}"
    resource: "^/api/public(?:/.*)?$"
  # Phoenix serves its OTLP trace ingest at /v1/traces, authenticated by a
  # bearer API key it mints itself. Cribl Stream is a machine client and cannot
  # complete a browser login, so without this bypass every span POST gets a
  # redirect to the portal and is dropped while the whole pipeline stays green.
  # Narrowed to the ingest path: the UI and its login surface stay gated.
  - domain: "phoenix.{{ authelia_cookie_domain }}"
    resource: "^/v1/traces(?:/.*)?$"
  # The metrics store accepts OTLP pushes under /opentelemetry and Prometheus
  # remote_write under /api/v1/write. Every client is a machine exporter that
  # cannot complete a browser login, so without this each push is redirected
  # to the portal and dropped while the exporter reports success.
  #
  # Narrowed to the write paths deliberately. This service carries NO
  # authentication of its own, so the gate is the only thing in front of its
  # query surface and its admin surface -- which includes series deletion.
  # Widening this resource to the whole host would expose both.
  # Two entries rather than one alternation: each anchors plainly at its own
  # machine-API root, which is what the bypass-scope guard checks for.
  - domain: "vm.{{ authelia_cookie_domain }}"
    resource: "^/opentelemetry/v1/(?:metrics|traces|logs)(?:/.*)?$"
  - domain: "vm.{{ authelia_cookie_domain }}"
    resource: "^/api/v1/write(?:/.*)?$"
  # Sonarr and Radarr enforce their API key across their whole /api surface --
  # probed live, every path under it answers 401 without a key, including
  # /api/v3/auth and /api/login. Their browser login is /login, outside the
  # prefix, so the default resource exposes nothing the app does not already
  # guard. Homarr reaches both with an apiKey credential.
  - domain: "sonarr.{{ authelia_cookie_domain }}"
  - domain: "radarr.{{ authelia_cookie_domain }}"
  # Semaphore enforces its own bearer auth on every real API path except
  # /api/auth, which is its unauthenticated browser login/OIDC-initiation
  # surface (probed live: every path below answers 401 without a token,
  # while /api/auth/login and /api/auth/oidc/*/login are reachable). The
  # default resource would hand out that login surface, so this is narrowed
  # to a positive allowlist of the machine-consumed paths instead. Every
  # alternative shares one suffix group admitting either a sub-path or a
  # query string (some endpoints, e.g. GET /project/{id}/users, require
  # `sort`/`order` query params) -- a bare `$` would reject those.
  - domain: "semaphore.{{ authelia_cookie_domain }}"
    resource: "^/api/(?:ping|info|apps|projects|project|users|user|events|runners|options)(?:[/?].*)?$"
  # Deadman receivers. The pushers are machine clients (systemd timers, the
  # media validators, the mlx watchdog) POSTing with the receiver's own token:
  # Gatus external-endpoint reports carry a bearer token, Uptime Kuma push
  # monitors carry theirs in the path. Each bypass is the one report path
  # only; the dashboards and their login stay gated.
  - domain: "gatus.{{ authelia_cookie_domain }}"
    resource: "^/api/v1/endpoints/[^/]+/external(?:[?].*)?$"
  - domain: "uptime-kuma.{{ authelia_cookie_domain }}"
    resource: "^/api/push/[^/]+(?:[?].*)?$"
  # Jellyseerr (seerr) is deliberately ABSENT. It serves its browser auth under
  # the same prefix -- /api/v1/auth/me answers 401 and /api/v1/auth/local answers
  # 405 to a GET, i.e. a reachable login POST -- so the default resource would
  # hand out its sign-in and session routes. Authelia's regex is Go RE2 with no
  # negative lookahead, so a bypass here has to be a positive allowlist of the
  # endpoints its consumers actually call; that list has not been established.
  # Until it is, seerr stays gated and its consumer keeps addressing the guest
  # directly. Narrowing on a guess would either break the integration or open
  # the login route.

# --- Sessions: login once, stay signed in for a week --------------------------
authelia_session_expiration: "12h"
authelia_session_inactivity: "12h"
authelia_session_remember_me: "1w"

# --- Users ---------------------------------------------------------------------
# File backend, seeded once (create-if-absent — the live users.yml is never
# overwritten, it accumulates WebAuthn state via the portal). The bootstrap
# password is generated on the host at first converge (never in Doppler /
# OpenBao — see the generate-at-source rule in AGENTS.md) and persisted
# root-only for one-time retrieval; day-to-day login is the passkey.
# The estate's operator identity, from the same DEFAULT_USERNAME env the vikunja
# role provisions its operator from — one source, not a per-role literal. The
# users template puts this user in the `admins` group, so setting it here is what
# maps the operator to admin across every Authelia-gated service (now including
# the Traefik dashboard). Falls back to the historical literal so an environment
# without DEFAULT_USERNAME still converges instead of rendering an empty user.
authelia_admin_user: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) or 'jevans' }}"
authelia_admin_display_name: "Jacob Evans"
authelia_admin_email: "{{ authelia_admin_user }}@{{ tofu_data.domain }}"
authelia_bootstrap_password_file: "{{ authelia_config_dir }}/.bootstrap_password"

authelia_service_users:
  - username: svc-uicheck
    display_name: UI Check
    email: "svc-uicheck@{{ tofu_data.domain }}"
    groups: [uicheck]
    # `| default('', true) | mandatory(...)` never fires — see the NOTE in
    # roles/authelia/defaults/main/01-oidc-clients.yml. `or undef(hint=...)`
    # raises on both the empty and the undefined case.
    password: >-
      {{ (bao_apps_secrets.authelia_uicheck_password | default('', true))
         or undef(hint='authelia_uicheck_password missing from OpenBao secret/apps/authelia') }}
# Routine rotation-wise no-op (per seed_generated_app_secret.yml). To rotate:
# ansible-playbook playbooks/rotate-key.yml -e rotate_domain=apps
#   -e rotate_mount=secret -e rotate_path=apps/authelia
#   -e rotate_field=authelia_uicheck_password
# then re-converge in a fresh process so this role picks up the new value.
authelia_service_users_rotate_passwords: false

# --- Service secrets: generated at the source, no shared store ---------------
# JWT / session / storage-encryption secrets have no second consumer, so per
# the workspace generate-at-source rule they are generated-if-absent on the
# guest's persistent mount and fed to Authelia via *_FILE env vars. They never
# touch Doppler, OpenBao, or the rendered config.
authelia_secrets_dir: "{{ authelia_data_dir }}/secrets"
authelia_secret_files:
  jwt_secret: "{{ authelia_secrets_dir }}/jwt_secret"
  session_secret: "{{ authelia_secrets_dir }}/session_secret"
  storage_key: "{{ authelia_secrets_dir }}/storage_encryption_key"
  oidc_hmac_secret: "{{ authelia_secrets_dir }}/oidc_hmac_secret"
authelia_oidc_jwks_key_file: "{{ authelia_secrets_dir }}/oidc_jwks_rsa.pem"
