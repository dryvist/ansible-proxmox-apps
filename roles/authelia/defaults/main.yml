---
# Authelia SSO portal / Traefik forwardAuth provider — a single native Go
# binary. Every Traefik router whose tofu ingress row has sso=true redirects
# unauthenticated browsers here; one passkey login opens every gated UI for
# the session lifetime. Single instance: in-memory sessions + local SQLite
# (one/two users — no Redis, no Postgres).

# --- Version / controller-staged, checksum-verified download ----------------
# LXCs in this repo are firewalled outbound-internal-only, so the release
# tarball is downloaded and checksum-verified on the CONTROLLER, then the
# extracted binary is copied to the target — same pattern as roles/vikunja.
# renovate: datasource=github-releases depName=authelia/authelia
authelia_version: "4.39.20"
authelia_release_tgz: "authelia-v{{ authelia_version }}-linux-amd64.tar.gz"
authelia_release_tgz_url: >-
  https://github.com/authelia/authelia/releases/download/v{{ authelia_version }}/{{ authelia_release_tgz }}
authelia_release_tgz_sha256: "1f122add61752d6ef54e64ae7116bec4e026f5c0a6493498288c5a9770d92088"
authelia_binary_name: authelia

# --- System user / paths ------------------------------------------------------
authelia_user: authelia
authelia_group: authelia
authelia_install_dir: /opt/authelia
authelia_binary_path: "{{ authelia_install_dir }}/authelia"
authelia_config_dir: /etc/authelia
authelia_config_file: "{{ authelia_config_dir }}/configuration.yml"
authelia_users_file: "{{ authelia_config_dir }}/users.yml"
# SQLite + notification state live on the persistent bind mount at
# /var/lib/authelia (provisioned by terraform-proxmox), never the ephemeral
# rootfs — WebAuthn credential registrations must survive a rebuild.
authelia_data_dir: /var/lib/authelia
authelia_db_path: "{{ authelia_data_dir }}/db.sqlite3"

# --- Network / domains ---------------------------------------------------------
authelia_port: "{{ tofu_data.constants.service_ports.authelia_portal }}"
# The ingress base domain — the session cookie is scoped to it so ONE login
# covers every <name>.<base> UI. Must match the Traefik router FQDNs.
authelia_cookie_domain: "{{ ingress_domain }}"
authelia_portal_url: "https://authelia.{{ authelia_cookie_domain }}"

# Domains whose API paths bypass the SSO gate. These apps enforce their own
# token auth on every API request; the forwardAuth portal can never be
# satisfied by a non-browser client, so without a bypass an sso-flagged route
# blocks all machine consumers (a 401 from the app's own WWW-Authenticate,
# observed on the first token client 2026-07-17). Browser UIs stay behind the
# portal.
#
# The general rule this expresses: forwardAuth gates HUMAN paths; the app's own
# credential gates its machine API. Authelia is for the operator (and later,
# agents) — it must never sit in front of data ingestion.
#
# `resource` is per-entry because "the API" is not the same path prefix in
# every app. The default below covers an app whose entire /api surface is
# token-authenticated. An app that also serves its BROWSER auth endpoints under
# /api (NextAuth's /api/auth/* being the common case) must narrow it, or the
# bypass hands out its session/sign-in routes unauthenticated.
authelia_api_bypass_default_resource: "^/api(?:/.*)?$"
authelia_api_bypass_domains:
  - domain: "zammad.{{ authelia_cookie_domain }}"
  # Langfuse serves OTLP trace ingestion under /api/public and its NextAuth
  # browser session routes under /api/auth. Narrowed to /api/public so
  # collectors can deliver spans while the console's auth surface stays gated.
  - domain: "langfuse.{{ authelia_cookie_domain }}"
    resource: "^/api/public(?:/.*)?$"

# --- Sessions: login once, stay signed in for a week --------------------------
authelia_session_expiration: "12h"
authelia_session_inactivity: "12h"
authelia_session_remember_me: "1w"

# --- Users ---------------------------------------------------------------------
# File backend, seeded once (create-if-absent — the live users.yml is never
# overwritten, it accumulates WebAuthn state via the portal). The bootstrap
# password is generated on the host at first converge (never in Doppler /
# OpenBao — see the generate-at-source rule in AGENTS.md) and persisted
# root-only for one-time retrieval; day-to-day login is the passkey.
# The estate's operator identity, from the same DEFAULT_USERNAME env the vikunja
# role provisions its operator from — one source, not a per-role literal. The
# users template puts this user in the `admins` group, so setting it here is what
# maps the operator to admin across every Authelia-gated service (now including
# the Traefik dashboard). Falls back to the historical literal so an environment
# without DEFAULT_USERNAME still converges instead of rendering an empty user.
authelia_admin_user: "{{ lookup('env', 'DEFAULT_USERNAME') | default('', true) or 'jevans' }}"
authelia_admin_display_name: "Jacob Evans"
authelia_admin_email: "{{ authelia_admin_user }}@{{ tofu_data.domain }}"
authelia_bootstrap_password_file: "{{ authelia_config_dir }}/.bootstrap_password"

# --- Service secrets: generated at the source, no shared store ---------------
# JWT / session / storage-encryption secrets have no second consumer, so per
# the workspace generate-at-source rule they are generated-if-absent on the
# guest's persistent mount and fed to Authelia via *_FILE env vars. They never
# touch Doppler, OpenBao, or the rendered config.
authelia_secrets_dir: "{{ authelia_data_dir }}/secrets"
authelia_secret_files:
  jwt_secret: "{{ authelia_secrets_dir }}/jwt_secret"
  session_secret: "{{ authelia_secrets_dir }}/session_secret"
  storage_key: "{{ authelia_secrets_dir }}/storage_encryption_key"
  oidc_hmac_secret: "{{ authelia_secrets_dir }}/oidc_hmac_secret"
authelia_oidc_jwks_key_file: "{{ authelia_secrets_dir }}/oidc_jwks_rsa.pem"

# Hermes Dashboard is a public PKCE client. It has no client secret; its exact
# HTTPS callback is the client credential and is intentionally declarative.
authelia_oidc_hermes_client_id: hermes-dashboard
authelia_oidc_hermes_redirect_uri: "https://hermes.{{ authelia_cookie_domain }}/auth/callback"

# Donna is a second, independently-identified Hermes agent instance with its
# own Dashboard at its own vhost, so it needs its own OIDC client — sharing
# Hermes's would let either dashboard's callback redeem the other's PKCE flow.
# Same public-PKCE, no-client-secret shape as above.
authelia_oidc_donna_client_id: hermes-donna-dashboard
authelia_oidc_donna_redirect_uri: "https://hermes-donna.{{ authelia_cookie_domain }}/auth/callback"

# Homarr and Langfuse are confidential clients (server-side NextAuth apps that
# can hold a secret), unlike Hermes/Donna's public-PKCE pattern — per
# Authelia's own documented Homarr integration (pbkdf2-sha512 digest,
# client_secret_basic, no PKCE). The plaintext is generated once in OpenBao
# (openbao_generated_app_secrets.authelia) and read back via bao_apps_secrets;
# Authelia hashes it into its own config in tasks/main.yml and never stores
# the plaintext itself. mandatory() fails loudly if the OpenBao pre-fetch
# wiring (playbooks/site/00-load-and-telemetry.yml hosts list) is missing,
# rather than silently rendering an empty-secret client.
authelia_oidc_homarr_client_id: homarr
authelia_oidc_homarr_redirect_uri: "https://homarr.{{ authelia_cookie_domain }}/api/auth/callback/oidc"

# NOTE on the guard shape below. It used to read
# `| default('', true) | mandatory('...')`, which NEVER FIRES: mandatory raises
# only on an UNDEFINED value, and the default to the left has already turned a
# missing key into an empty string by the time it runs. Verified directly —
# `undef_map.key | default('', true) | mandatory('SHOULD FIRE')` returns "".
# The effect was that a secret absent from the store rendered as an empty
# client secret, got hashed into the config, and left the relying party with a
# credential that can never match — a converge reporting success over a broken
# login. `or undef(hint=...)` raises on both the empty and the undefined case
# and carries the same message.
authelia_oidc_homarr_client_secret_plain: >-
  {{ (bao_apps_secrets.authelia_oidc_homarr_client_secret | default('', true))
     or undef(hint='authelia_oidc_homarr_client_secret missing from OpenBao secret/apps/authelia') }}
authelia_oidc_homarr_client_secret_hash_file: "{{ authelia_secrets_dir }}/oidc_homarr_client_secret_hash"

authelia_oidc_langfuse_client_id: langfuse
authelia_oidc_langfuse_redirect_uri: "https://langfuse.{{ authelia_cookie_domain }}/api/auth/callback/custom"
authelia_oidc_langfuse_client_secret_plain: >-
  {{ (bao_apps_secrets.authelia_oidc_langfuse_client_secret | default('', true))
     or undef(hint='authelia_oidc_langfuse_client_secret missing from OpenBao secret/apps/authelia') }}
authelia_oidc_langfuse_client_secret_hash_file: "{{ authelia_secrets_dir }}/oidc_langfuse_client_secret_hash"

# Semaphore (Ansible/Terraform run UI) and terrakube-dex (the Dex instance
# Terrakube federates through) are confidential clients too — same
# pbkdf2-sha512/client_secret_basic/no-PKCE shape as Homarr and Langfuse above.
authelia_oidc_semaphore_client_id: semaphore
authelia_oidc_semaphore_redirect_uri: "https://semaphore.{{ authelia_cookie_domain }}/api/auth/oidc/authelia/redirect"
authelia_oidc_semaphore_client_secret_plain: >-
  {{ (bao_apps_secrets.authelia_oidc_semaphore_client_secret | default('', true))
     or undef(hint='authelia_oidc_semaphore_client_secret missing from OpenBao secret/apps/authelia') }}
authelia_oidc_semaphore_client_secret_hash_file: "{{ authelia_secrets_dir }}/oidc_semaphore_client_secret_hash"

authelia_oidc_terrakube_dex_client_id: terrakube-dex
authelia_oidc_terrakube_dex_redirect_uri: "https://terrakube-dex.{{ authelia_cookie_domain }}/dex/callback"
authelia_oidc_terrakube_dex_client_secret_plain: >-
  {{ (bao_apps_secrets.authelia_oidc_terrakube_dex_client_secret | default('', true))
     or undef(hint='authelia_oidc_terrakube_dex_client_secret missing from OpenBao secret/apps/authelia') }}
authelia_oidc_terrakube_dex_client_secret_hash_file: "{{ authelia_secrets_dir }}/oidc_terrakube_dex_client_secret_hash"

# Grafana OSS uses its generic_oauth backend — a confidential client with the
# same shape as the others above. client_id and the redirect host both come from
# grafana_hostname (inventory/group_vars/all.yml, read from the deployment
# object) so the name is defined once, never spelled into a URL.
authelia_oidc_grafana_client_id: "{{ grafana_hostname }}"
authelia_oidc_grafana_redirect_uri: "https://{{ grafana_hostname }}.{{ authelia_cookie_domain }}/login/generic_oauth"
authelia_oidc_grafana_client_secret_plain: >-
  {{ (bao_apps_secrets.authelia_oidc_grafana_client_secret | default('', true))
     or undef(hint='authelia_oidc_grafana_client_secret missing from OpenBao secret/apps/authelia') }}
authelia_oidc_grafana_client_secret_hash_file: "{{ authelia_secrets_dir }}/oidc_grafana_client_secret_hash"

# Drives tasks/oidc_client_secrets.yml's create-if-absent hash loop and
# configuration.yml.j2's lookup of the resulting digests. Add a confidential
# client by appending here — never by editing the task file.
authelia_oidc_confidential_clients:
  - name: homarr
    secret_plain: "{{ authelia_oidc_homarr_client_secret_plain }}"
    hash_file: "{{ authelia_oidc_homarr_client_secret_hash_file }}"
  - name: langfuse
    secret_plain: "{{ authelia_oidc_langfuse_client_secret_plain }}"
    hash_file: "{{ authelia_oidc_langfuse_client_secret_hash_file }}"
  - name: semaphore
    secret_plain: "{{ authelia_oidc_semaphore_client_secret_plain }}"
    hash_file: "{{ authelia_oidc_semaphore_client_secret_hash_file }}"
  - name: terrakube_dex
    secret_plain: "{{ authelia_oidc_terrakube_dex_client_secret_plain }}"
    hash_file: "{{ authelia_oidc_terrakube_dex_client_secret_hash_file }}"
  - name: grafana
    secret_plain: "{{ authelia_oidc_grafana_client_secret_plain }}"
    hash_file: "{{ authelia_oidc_grafana_client_secret_hash_file }}"

# --- Notifier: local filesystem, not SMTP -------------------------------------
# One-time codes for passkey enrolment and password reset are written to this
# file on the persistent mount, not emailed. Auth-critical flows must not depend
# on mail/DNS reachability in a single-user homelab; the operator reads the code
# directly. Lives on the persistent mount so it survives a rebuild.
authelia_notification_file: "{{ authelia_data_dir }}/notification.txt"

# --- Behaviour toggles ---------------------------------------------------------
# false in CI/molecule contexts: skips systemd unit install/start and the live
# health check only (binary staging and config render still run).
authelia_manage_services: true

authelia_api_timeout: 30

# --- Terrakube admin group ----------------------------------------------------
# Terrakube resolves "superuser" from ONE group string (io.terrakube.owner, fed
# by TERRAKUBE_ADMIN_GROUP), and every permission check in its API is
# `isSuperUser(user) || checkMembership(user, teams)`. Its Dex instance federates
# two connectors, and they do not emit the same group shape:
#
#   - the GitHub connector's `orgs:` form emits "org:team-slug"
#   - an OIDC connector emits whatever the upstream sends, unprefixed
#
# so a bare `terrakube-admins` from Authelia authenticates and then matches
# nothing. Three shortcuts were checked and rejected:
#
#   - dex's `claimModifications.modifyGroupNames.prefix` would rewrite the group
#     inside dex, but it is master-only and exists in NO released dex (checked
#     v2.42.0 through v2.45.1) — an unknown key here is ignored, not an error,
#     so it would have looked configured and done nothing.
#   - dex's legacy single-`org:` github form emits bare team names, but it
#     resolves groups via teamsForOrg(), which does not assert org membership;
#     the `orgs:` form returns "user not in required orgs or teams" and denies
#     login. Switching would have silently removed that gate.
#   - granting the bare group via a terrakube_team record covers the membership
#     half of every check but not isSuperUser, so organization creation and the
#     internal-service-account paths would still fail.
#
# That leaves emitting the org-qualified name from here. Composed from the same
# two atoms the Terrakube compose file composes TERRAKUBE_ADMIN_GROUP from, so
# the two cannot drift into different shapes; the org itself is never written
# into this repo.
authelia_terrakube_sso_enabled: false
authelia_terrakube_github_org: "{{ lookup('env', 'DEX_GITHUB_ORG') | default('', true) }}"
authelia_terrakube_github_team: "{{ lookup('env', 'DEX_GITHUB_TEAM') | default('', true) }}"
authelia_terrakube_admin_group: >-
  {{ (authelia_terrakube_github_org ~ ':' ~ authelia_terrakube_github_team)
     if (authelia_terrakube_github_org and authelia_terrakube_github_team)
     else '' }}

# Groups the operator account must carry. `admins` is Authelia's own; the
# Terrakube group is appended only when both atoms above resolved, so a run
# without them omits the group rather than seeding a bare name that would look
# granted and match nothing downstream.
authelia_admin_groups: >-
  {{ ['admins']
     + ([authelia_terrakube_admin_group] if authelia_terrakube_admin_group else []) }}

# Owner of the users database. Split out from the literal `root` used elsewhere
# in the role purely so tests/authelia_admin_groups can exercise the reconcile
# without being root; production never overrides it.
authelia_users_file_owner: root
