---
# --- Confidential OIDC client secrets: hash guest-side, once -----------------
# Every server-side (non-PKCE) OIDC client — Homarr, Langfuse, Semaphore,
# terrakube-dex — needs a real client_secret (unlike Hermes/Donna's public PKCE
# clients), and Authelia's config requires the pbkdf2-sha512 DIGEST, never the
# plaintext. Data-driven over authelia_oidc_confidential_clients
# (defaults/main.yml): adding a client is one list entry here, never a change
# to this file.
#
# Create-if-absent on the persisted digest file — same shape as the OIDC
# signing key above — is the load-bearing invariant: Homarr and Langfuse are
# LIVE clients whose apps already hold the current secret. The digest's salt
# is randomized per invocation, so re-hashing on every converge would silently
# rotate the stored digest out from under an app that still presents the old
# secret, locking it out until someone manually resynced both sides. The
# persisted file is therefore the only stable reference, and stat-checking it
# first is what makes a re-converge a no-op for existing clients.
- name: Check whether the OIDC client-secret digests already exist
  ansible.builtin.stat:
    path: "{{ item.hash_file }}"
  loop: "{{ authelia_oidc_confidential_clients }}"
  loop_control:
    label: "{{ item.name }}"
  register: authelia_oidc_client_secret_hash_stats

- name: Hash the OIDC client secrets (create-if-absent, guest-local)
  ansible.builtin.command:
    argv:
      - "{{ authelia_binary_path }}"
      - crypto
      - hash
      - generate
      - pbkdf2
      - --variant
      - sha512
      - --password
      - "{{ item.secret_plain }}"
      - --no-confirm
  loop: "{{ authelia_oidc_confidential_clients }}"
  loop_control:
    index_var: authelia_oidc_client_idx
    label: "{{ item.name }}"
  register: authelia_oidc_hash_out
  changed_when: false
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[authelia_oidc_client_idx].stat.exists

- name: Persist the OIDC client-secret digests
  ansible.builtin.copy:
    # `authelia crypto hash generate` prints "Digest: <hash>"; strip it so the
    # file holds a bare $pbkdf2-sha512$... digest. Authelia does not reject the
    # prefixed form — it accepts it as a PLAINTEXT secret and logs only a
    # deprecation warning, so every login fails "client secret did not match"
    # while the converge reports success.
    #
    # ONE backslash here, deliberately. This is a folded (>-) scalar, which does
    # NOT process backslash escapes, so '\s' arrives at Jinja as two characters
    # and matches a literal backslash — the strip silently no-ops. The same
    # expression in tasks/main.yml is inside a DOUBLE-QUOTED scalar, where YAML
    # collapses '\s' to '\', which is why that one works and this one did not.
    content: >-
      {{ authelia_oidc_hash_out.results[authelia_oidc_client_idx].stdout
         | regex_replace('^Digest:\s*', '') }}
    dest: "{{ item.hash_file }}"
    owner: "{{ authelia_user }}"
    group: "{{ authelia_group }}"
    mode: "0600"
  loop: "{{ authelia_oidc_confidential_clients }}"
  loop_control:
    index_var: authelia_oidc_client_idx
    label: "{{ item.name }}"
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[authelia_oidc_client_idx].stat.exists

- name: Read the OIDC client-secret digests for the protected config render
  ansible.builtin.slurp:
    src: "{{ item.hash_file }}"
  loop: "{{ authelia_oidc_confidential_clients }}"
  loop_control:
    label: "{{ item.name }}"
  register: authelia_oidc_client_secret_hash_files
  no_log: true

# One dict keyed by client name (authelia_oidc_client_secret_hashes.homarr,
# .langfuse, ...) instead of a same-named fact per client — configuration.yml.j2
# looks up by name, so a new client needs no template-side plumbing beyond its
# own client block.
- name: Decode the OIDC client-secret digests for the protected config render
  ansible.builtin.set_fact:
    authelia_oidc_client_secret_hashes: >-
      {{ dict(authelia_oidc_confidential_clients | map(attribute='name')
              | zip(authelia_oidc_client_secret_hash_files.results
                    | map(attribute='content') | map('b64decode') | map('trim')
                    | map('regex_replace', '^Digest:\s*', ''))) }}
  no_log: true

# A prefixed or empty digest is accepted by Authelia as a plaintext secret, so
# it cannot be caught downstream — every client silently gets a credential no
# relying party can match. Assert the shape here, where it is still cheap.
- name: Assert every decoded digest is a bare password hash
  ansible.builtin.assert:
    that:
      - authelia_oidc_client_secret_hashes.values() | select('match', '^\$') | list | length
        == authelia_oidc_client_secret_hashes | length
    fail_msg: >-
      At least one OIDC client-secret digest is not a bare hash (expected a
      leading '$'). A "Digest: " prefix left in the file is the usual cause;
      Authelia then treats the whole string as a plaintext secret and every
      login fails with "client secret did not match" while this converge and
      the Authelia service both report success.
    quiet: true
