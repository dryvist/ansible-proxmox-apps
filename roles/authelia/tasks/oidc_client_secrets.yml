---
# --- Confidential OIDC client secrets: hash guest-side, once -----------------
# Homarr and Langfuse need a real client_secret (unlike Hermes/Donna's public
# PKCE clients), and Authelia's config requires the pbkdf2-sha512 DIGEST, never
# the plaintext. Create-if-absent on the persisted digest file — same shape as
# the OIDC signing key above — so a re-converge does not rotate the digest
# (which would restart Authelia every run for no functional gain; the digest's
# salt is randomized per invocation, so the file itself is the only stable
# reference).
- name: Check whether the OIDC client-secret digests already exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ authelia_oidc_homarr_client_secret_hash_file }}"
    - "{{ authelia_oidc_langfuse_client_secret_hash_file }}"
    - "{{ authelia_oidc_grafana_client_secret_hash_file }}"
  register: authelia_oidc_client_secret_hash_stats

- name: Hash the Homarr OIDC client secret (create-if-absent, guest-local)
  ansible.builtin.command:
    argv:
      - "{{ authelia_binary_path }}"
      - crypto
      - hash
      - generate
      - pbkdf2
      - --variant
      - sha512
      - --password
      - "{{ authelia_oidc_homarr_client_secret_plain }}"
      - --no-confirm
  register: authelia_oidc_homarr_hash_out
  changed_when: false
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[0].stat.exists

- name: Persist the Homarr OIDC client-secret digest
  ansible.builtin.copy:
    # `authelia crypto hash generate` prints "Digest: <hash>"; strip it so the
    # file holds a bare $pbkdf2-sha512$... digest. Same treatment the admin
    # password hash already gets below — Authelia rejects the prefixed form.
    content: "{{ authelia_oidc_homarr_hash_out.stdout | regex_replace('^Digest:\\s*', '') }}"
    dest: "{{ authelia_oidc_homarr_client_secret_hash_file }}"
    owner: "{{ authelia_user }}"
    group: "{{ authelia_group }}"
    mode: "0600"
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[0].stat.exists

- name: Hash the Langfuse OIDC client secret (create-if-absent, guest-local)
  ansible.builtin.command:
    argv:
      - "{{ authelia_binary_path }}"
      - crypto
      - hash
      - generate
      - pbkdf2
      - --variant
      - sha512
      - --password
      - "{{ authelia_oidc_langfuse_client_secret_plain }}"
      - --no-confirm
  register: authelia_oidc_langfuse_hash_out
  changed_when: false
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[1].stat.exists

- name: Persist the Langfuse OIDC client-secret digest
  ansible.builtin.copy:
    # `authelia crypto hash generate` prints "Digest: <hash>"; strip it so the
    # file holds a bare $pbkdf2-sha512$... digest. Same treatment the admin
    # password hash already gets below — Authelia rejects the prefixed form.
    content: "{{ authelia_oidc_langfuse_hash_out.stdout | regex_replace('^Digest:\\s*', '') }}"
    dest: "{{ authelia_oidc_langfuse_client_secret_hash_file }}"
    owner: "{{ authelia_user }}"
    group: "{{ authelia_group }}"
    mode: "0600"
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[1].stat.exists

- name: Hash the Grafana OIDC client secret (create-if-absent, guest-local)
  ansible.builtin.command:
    argv:
      - "{{ authelia_binary_path }}"
      - crypto
      - hash
      - generate
      - pbkdf2
      - --variant
      - sha512
      - --password
      - "{{ authelia_oidc_grafana_client_secret_plain }}"
      - --no-confirm
  register: authelia_oidc_grafana_hash_out
  changed_when: false
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[2].stat.exists

- name: Persist the Grafana OIDC client-secret digest
  ansible.builtin.copy:
    # `authelia crypto hash generate` prints "Digest: <hash>"; strip it so the
    # file holds a bare $pbkdf2-sha512$... digest. Same treatment the admin
    # password hash already gets below — Authelia rejects the prefixed form.
    content: "{{ authelia_oidc_grafana_hash_out.stdout | regex_replace('^Digest:\\s*', '') }}"
    dest: "{{ authelia_oidc_grafana_client_secret_hash_file }}"
    owner: "{{ authelia_user }}"
    group: "{{ authelia_group }}"
    mode: "0600"
  no_log: true
  when: not authelia_oidc_client_secret_hash_stats.results[2].stat.exists

- name: Read the OIDC client-secret digests for the protected config render
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ authelia_oidc_homarr_client_secret_hash_file }}"
    - "{{ authelia_oidc_langfuse_client_secret_hash_file }}"
    - "{{ authelia_oidc_grafana_client_secret_hash_file }}"
  register: authelia_oidc_client_secret_hash_files
  no_log: true

- name: Decode the OIDC client-secret digests for the protected config render
  ansible.builtin.set_fact:
    authelia_oidc_homarr_client_secret_hash: >-
      {{ authelia_oidc_client_secret_hash_files.results[0].content | b64decode | trim }}
    authelia_oidc_langfuse_client_secret_hash: >-
      {{ authelia_oidc_client_secret_hash_files.results[1].content | b64decode | trim }}
    authelia_oidc_grafana_client_secret_hash: >-
      {{ authelia_oidc_client_secret_hash_files.results[2].content | b64decode | trim }}
  no_log: true
