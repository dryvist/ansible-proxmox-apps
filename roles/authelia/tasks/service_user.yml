---
- name: Resolve the current service-user record
  ansible.builtin.set_fact:
    authelia_service_user_current: >-
      {{ authelia_service_user_document.users.get(authelia_service_user.username, {}) }}
  no_log: true

# A stored password that is not an encoded digest (it must begin with '$')
# makes Authelia refuse to start, so it is re-hashed like a new record.
- name: Decide whether the service-user password needs hashing
  ansible.builtin.set_fact:
    authelia_service_user_needs_hash: >-
      {{ not authelia_service_user_current
         or authelia_service_users_rotate_passwords | bool
         or not (authelia_service_user_current.password | default('') | string).startswith('$') }}
  no_log: true

- name: Hash a new, rotated or malformed service-user password
  ansible.builtin.command:
    argv:
      - "{{ authelia_binary_path }}"
      - crypto
      - hash
      - generate
      - argon2
      - --password
      - "{{ authelia_service_user.password }}"
  register: authelia_service_user_hash
  changed_when: false
  no_log: true
  when: authelia_service_user_needs_hash | bool

- name: Compose the required service-user record
  ansible.builtin.set_fact:
    authelia_service_user_required: >-
      {{ authelia_service_user_current | combine({
           'displayname': authelia_service_user.display_name,
           'email': authelia_service_user.email,
           'groups': ((authelia_service_user_current.groups | default([], true))
                      | union(authelia_service_user.groups)),
           'password': (authelia_service_user_hash.stdout | default('')
                        | regex_replace('^Digest:\s*', ''))
             if authelia_service_user_needs_hash | bool
             else authelia_service_user_current.password
         }, recursive=True) }}
  no_log: true

# Authelia's own decoder, before anything is written: a digest it cannot
# parse makes the file provider's startup check fail and the portal
# crash-loop, taking every forward-auth route down with it.
- name: Validate the new service-user digest with Authelia's own decoder
  ansible.builtin.command:
    argv:
      - "{{ authelia_binary_path }}"
      - crypto
      - hash
      - validate
      - --password
      - "{{ authelia_service_user.password }}"
      - --
      - "{{ authelia_service_user_required.password }}"
  changed_when: false
  no_log: true
  when: authelia_service_user_needs_hash | bool

- name: Refuse to write a users database holding a password that is not a digest
  ansible.builtin.assert:
    that:
      - >-
        (authelia_service_user_document
         | combine({'users': {authelia_service_user.username: authelia_service_user_required}}, recursive=True)).users
        | dict2items | map(attribute='value.password') | map('string')
        | reject('match', '\$') | list | length == 0
    fail_msg: >-
      A users.yml record's password does not begin with '$'; Authelia would
      refuse to start on it, so the file is not written.
    quiet: true
  no_log: true

- name: Update a changed service-user record without replacing other users
  ansible.builtin.copy:
    content: >-
      {{ authelia_service_user_document
         | combine({'users': {authelia_service_user.username: authelia_service_user_required}}, recursive=True)
         | to_nice_yaml(indent=2) }}
    dest: "{{ authelia_users_file }}"
    owner: "{{ authelia_users_file_owner }}"
    group: "{{ authelia_group }}"
    mode: "0640"
  when: authelia_service_user_required != authelia_service_user_current
  no_log: true
  notify: Restart authelia

- name: Retain the reconciled service-user document for the next identity
  ansible.builtin.set_fact:
    authelia_service_user_document: >-
      {{ authelia_service_user_document
         | combine({'users': {authelia_service_user.username: authelia_service_user_required}}, recursive=True) }}
  no_log: true
