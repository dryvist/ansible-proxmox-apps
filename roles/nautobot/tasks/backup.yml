---
# Nightly restic backup of the nautobot database to every enabled repository.
# The units are nautobot-backup@<repository> and nautobot-check@<repository>.
# The SECRET_KEY needs no copy: OpenBao is its source and the persisted file is
# rebuilt from it. There is no media root to archive.
- name: Configure the nightly Nautobot database backup
  ansible.builtin.include_role:
    name: restic_backup
  vars:
    restic_backup_name: nautobot
    restic_backup_password: "{{ nautobot_restic_password }}"
    restic_backup_db_host: "{{ nautobot_db_host }}"
    restic_backup_db_port: "{{ nautobot_db_port }}"
    restic_backup_db_name: "{{ nautobot_db_name }}"
    restic_backup_db_user: "{{ nautobot_db_user }}"
    restic_backup_db_password: "{{ nautobot_db_password }}"
    restic_backup_repositories: "{{ nautobot_backup_repositories }}"
