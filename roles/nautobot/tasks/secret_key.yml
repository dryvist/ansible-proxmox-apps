---
# Phase 3 of the nautobot role: resolve SECRET_KEY bao-first, otherwise
# generate once and persist, then publish it back. Split out of
# tasks/main.yml to keep each file to one job; included in the same order.
# =============================================================================
# Phase 3: SECRET_KEY — bao-first, else generate-once and persist
# =============================================================================
- name: Decide whether a SECRET_KEY was supplied (bao/env)
  ansible.builtin.set_fact:
    nautobot_secret_key_supplied: "{{ (nautobot_secret_key | default('', true) | length) > 0 }}"

- name: Persist the supplied SECRET_KEY
  ansible.builtin.copy:
    content: "{{ nautobot_secret_key }}"
    dest: "{{ nautobot_secret_key_file }}"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0600"
  no_log: true
  when: nautobot_secret_key_supplied

- name: Stat the persisted SECRET_KEY
  ansible.builtin.stat:
    path: "{{ nautobot_secret_key_file }}"
  register: nautobot_secret_key_stat

- name: Generate a SECRET_KEY once when none supplied and none persisted
  ansible.builtin.copy:
    content: "{{ lookup('community.general.random_string', length=64, special=false) }}"
    dest: "{{ nautobot_secret_key_file }}"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0600"
  no_log: true
  when:
    - not nautobot_secret_key_supplied
    - not nautobot_secret_key_stat.stat.exists

- name: Read the effective SECRET_KEY
  ansible.builtin.slurp:
    src: "{{ nautobot_secret_key_file }}"
  register: nautobot_secret_key_slurp
  no_log: true

- name: Publish the effective SECRET_KEY fact
  ansible.builtin.set_fact:
    nautobot_effective_secret_key: "{{ nautobot_secret_key_slurp.content | b64decode | trim }}"
  no_log: true

# Back the key up into OpenBao. When it was generated here rather than supplied,
# the guest holds the only copy — and a rotated Django SECRET_KEY invalidates
# every session and every signed value. The field name is the bare `secret_key`
# that inventory/group_vars/nautobot_group.yml already reads, so publishing
# closes the loop: the next converge resolves it bao-first instead.
- name: Publish the Nautobot SECRET_KEY to OpenBao
  ansible.builtin.include_role:
    name: openbao_secrets
    tasks_from: publish.yml
  vars:
    openbao_secrets_publish_app: nautobot
    openbao_secrets_publish_reason: (Django SECRET_KEY)
    openbao_secrets_publish_data:
      secret_key: "{{ nautobot_effective_secret_key }}"
