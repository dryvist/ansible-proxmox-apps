---
# Phase 3 of the nautobot role: seed SECRET_KEY through the shared OpenBao task
# and render the authoritative KV value to the existing file.
# =============================================================================
# Phase 3: SECRET_KEY — seed-if-absent and persist
# =============================================================================
- name: Check for the persisted SECRET_KEY
  ansible.builtin.stat:
    path: "{{ nautobot_secret_key_file }}"
  register: nautobot_secret_key_stat

- name: Read the persisted SECRET_KEY
  ansible.builtin.slurp:
    src: "{{ nautobot_secret_key_file }}"
  register: nautobot_secret_key_stored
  when: nautobot_secret_key_stat.stat.exists
  no_log: true

# The writes run on the controller: the writer token must never reach the guest.
- name: Seed Nautobot SECRET_KEY in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the Nautobot SECRET_KEY through the shared seed_generated task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_path: apps/nautobot
        openbao_secrets_seed_fields:
          - name: secret_key
            length: 64
            charset: alnum
            value: >-
              {{ nautobot_secret_key
                 or (nautobot_secret_key_stored.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_local_values:
          secret_key: >-
            {{ nautobot_secret_key
               or (nautobot_secret_key_stored.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_register: nautobot_secret_key_seed

- name: Resolve Nautobot SECRET_KEY from OpenBao
  ansible.builtin.set_fact:
    nautobot_secret_key: "{{ nautobot_secret_key_seed.secret_key }}"
    nautobot_effective_secret_key: "{{ nautobot_secret_key_seed.secret_key }}"
  no_log: true

- name: Require the persisted SECRET_KEY to match OpenBao
  ansible.builtin.assert:
    that:
      - >-
        not nautobot_secret_key_stat.stat.exists
        or (nautobot_secret_key_stored.content | b64decode | trim)
           == nautobot_effective_secret_key
    fail_msg: "Nautobot SECRET_KEY file differs from the stored field secret_key"
  when:
    - nautobot_secret_key_seed.secret_key != '(placeholder in check mode)'
  no_log: true

- name: Persist Nautobot SECRET_KEY from OpenBao
  ansible.builtin.copy:
    content: "{{ nautobot_effective_secret_key }}"
    dest: "{{ nautobot_secret_key_file }}"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0600"
  when:
    - nautobot_secret_key_seed.secret_key != '(placeholder in check mode)'
  no_log: true
