---
# Phase 3 of the nautobot role: SECRET_KEY is generated by the secrets registry into OpenBao.
# This role reads the stored field (inventory nautobot_secret_key, through the apps read path),
# fails closed when it is absent, and renders the on-guest file from it. It never generates one.
# =============================================================================
# Phase 3: SECRET_KEY — render the stored field to the guest file
# =============================================================================
- name: Check for the persisted SECRET_KEY
  ansible.builtin.stat:
    path: "{{ nautobot_secret_key_file }}"
  register: nautobot_secret_key_stat

- name: Read the persisted SECRET_KEY
  ansible.builtin.slurp:
    src: "{{ nautobot_secret_key_file }}"
  register: nautobot_secret_key_stored
  when: nautobot_secret_key_stat.stat.exists
  no_log: true

- name: Require the persisted SECRET_KEY to match the stored field
  ansible.builtin.assert:
    that:
      - >-
        not nautobot_secret_key_stat.stat.exists
        or (nautobot_secret_key_stored.content | b64decode | trim) == nautobot_secret_key
    fail_msg: "Nautobot SECRET_KEY file differs from the stored field secret_key"
  no_log: true

- name: Render Nautobot SECRET_KEY from the stored field
  ansible.builtin.copy:
    content: "{{ nautobot_secret_key }}"
    dest: "{{ nautobot_secret_key_file }}"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0600"
  no_log: true

- name: Expose the stored SECRET_KEY to this role
  ansible.builtin.set_fact:
    nautobot_effective_secret_key: "{{ nautobot_secret_key }}"
  no_log: true
