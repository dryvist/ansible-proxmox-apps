---
# Native Nautobot (issue #138). Two layers:
#   * always: system deps, user/dirs, Redis, SECRET_KEY, config + env + uWSGI +
#     jobs + systemd units. Deterministic, molecule-tested.
#   * nautobot_manage_app (default true): venv + pip install of Nautobot and
#     apps, migrate/collectstatic, superuser, service start, export schedule,
#     HTTP health. Skipped by molecule; validated live at cutover.

# =============================================================================
# Phases 1-3: system, Redis, SECRET_KEY  (see the included files)
# =============================================================================
- name: Install system packages, the service user, its directories and Redis
  ansible.builtin.include_tasks: system_and_redis.yml

- name: Resolve, persist and publish the SECRET_KEY
  ansible.builtin.include_tasks: secret_key.yml

# =============================================================================
# Phase 4: Python venv + Nautobot install (heavy — gated)
# =============================================================================
- name: Create the Nautobot virtualenv
  ansible.builtin.command:
    cmd: "python3 -m venv {{ nautobot_root }}"
    creates: "{{ nautobot_root }}/bin/python"
  become: true
  become_user: "{{ nautobot_user }}"

- name: Install/upgrade pip tooling in the venv
  ansible.builtin.pip:
    name:
      - pip
      - wheel
    state: latest  # noqa package-latest - pip/wheel bootstrap, not app pinning
    virtualenv: "{{ nautobot_root }}"
  become: true
  become_user: "{{ nautobot_user }}"
  when: nautobot_manage_app | bool

- name: Install Nautobot and apps into the venv
  ansible.builtin.pip:
    name: "{{ nautobot_pip_packages }}"
    state: present
    virtualenv: "{{ nautobot_root }}"
  become: true
  become_user: "{{ nautobot_user }}"
  when: nautobot_manage_app | bool

- name: Pin the app packages in local_requirements for future upgrades
  ansible.builtin.copy:
    content: "{{ nautobot_pip_packages | join('\n') }}\n"
    dest: "{{ nautobot_root }}/local_requirements.txt"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0644"

# =============================================================================
# Phase 5: Configuration, environment, uWSGI, jobs (always)
# =============================================================================
- name: Render nautobot_config.py
  ansible.builtin.template:
    src: nautobot_config.py.j2
    dest: "{{ nautobot_root }}/nautobot_config.py"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0644"
  notify: Restart nautobot services

# Guard the one value that breaks silently. An empty bucket templates into the
# EnvironmentFile exactly like a real one, so the converge stays green and the
# failure surfaces only in the next scheduled export's own log, while the last
# published object keeps answering every consumer. Fail at the write instead.
- name: Refuse to render an environment file with no export bucket
  ansible.builtin.assert:
    that:
      - nautobot_export_s3_bucket | default('', true) | trim | length > 0
    fail_msg: >-
      nautobot_export_s3_bucket resolved to empty, so the scheduled export to
      s3://<bucket>/{{ nautobot_export_s3_key }} would be written with no
      bucket and fail on every run while the previously published object stayed
      in place. Set NAUTOBOT_EXPORT_S3_BUCKET, or leave it unset to take the
      declared default (nautobot_export_s3_bucket_default).
    success_msg: "Export bucket resolved: {{ nautobot_export_s3_bucket }}"
    quiet: true

# A half-configured S3 target is worse than an unconfigured one: with an
# endpoint but no keys, boto3 silently falls back to ambient AWS credentials and
# publishes somewhere nobody is looking.
- name: Refuse a half-configured export credential set
  ansible.builtin.assert:
    that:
      - (nautobot_export_s3_access_key | default('', true) | length > 0)
        == (nautobot_export_s3_secret_key | default('', true) | length > 0)
    fail_msg: >-
      Exactly one of NAUTOBOT_EXPORT_S3_ACCESS_KEY / _SECRET_KEY is set. Set
      both to publish with the export's own key, or neither to fall back to
      ambient credentials — never one.
    quiet: true

- name: Render the root-only environment file
  ansible.builtin.template:
    src: nautobot.env.j2
    dest: "{{ nautobot_root }}/nautobot.env"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0600"
  no_log: true
  notify: Restart nautobot services

- name: Render the uWSGI config
  ansible.builtin.template:
    src: uwsgi.ini.j2
    dest: "{{ nautobot_root }}/uwsgi.ini"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0644"
  notify: Restart nautobot services

- name: Deploy the SSoT/export/onboarding jobs into JOBS_ROOT
  ansible.builtin.copy:
    src: jobs/
    dest: "{{ nautobot_jobs_root }}/"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0644"
  notify: Restart nautobot services

- name: Deploy the Nautobot export schema contract
  ansible.builtin.copy:
    src: contracts/nautobot-export-v1.json
    dest: "{{ nautobot_export_schema_file }}"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0644"
  notify: Restart nautobot services

# =============================================================================
# Phase 6: systemd units (always deployed; started only when managing the app)
# =============================================================================
- name: Deploy the Nautobot systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nautobot-server.service
    - nautobot-worker.service
    - nautobot-scheduler.service
  notify:
    - Reload systemd daemon
    - Restart nautobot services

# =============================================================================
# Phase 6b: Seed-bundle assembly (cutover-gated)
# =============================================================================
- name: Assemble and place the seed bundle
  ansible.builtin.include_tasks: seed_bundle.yml
  when: nautobot_build_seed | bool

# =============================================================================
# Phase 7: Live application bring-up (gated)
# =============================================================================
- name: Bring up the Nautobot application
  when: nautobot_manage_app | bool
  become: true
  block:
    - name: Apply database migrations
      ansible.builtin.command:
        cmd: "{{ nautobot_root }}/bin/nautobot-server migrate"
      environment: "{{ nautobot_env }}"
      register: nautobot_migrate
      changed_when: "'No migrations to apply' not in nautobot_migrate.stdout"
      become: true
      become_user: "{{ nautobot_user }}"

    - name: Collect static files
      ansible.builtin.command:
        cmd: "{{ nautobot_root }}/bin/nautobot-server collectstatic --no-input"
      environment: "{{ nautobot_env }}"
      register: nautobot_collectstatic
      changed_when: "'0 static files copied' not in nautobot_collectstatic.stdout"
      become: true
      become_user: "{{ nautobot_user }}"

    - name: Ensure the Nautobot superuser exists
      ansible.builtin.command:
        cmd: "{{ nautobot_root }}/bin/nautobot-server shell --interface python"
        stdin: "{{ lookup('ansible.builtin.file', 'superuser_bootstrap.py') }}"
      environment: "{{ nautobot_env }}"
      register: nautobot_superuser
      changed_when: "'SUPERUSER_CHANGED' in nautobot_superuser.stdout"
      become: true
      become_user: "{{ nautobot_user }}"
      no_log: true

    - name: Publish a role-managed read-only inventory token to OpenBao
      ansible.builtin.include_tasks: readonly_token.yml
      when: nautobot_token_publish_openbao | bool

    - name: Publish a role-managed read-only MCP token to OpenBao
      ansible.builtin.include_tasks: mcp_token.yml
      when: nautobot_mcp_token_publish_openbao | bool

    - name: Apply pending systemd reload before starting services
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the Nautobot services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nautobot-server
        - nautobot-worker
        - nautobot-scheduler

    - name: Schedule the export Job via celery beat
      ansible.builtin.command:
        cmd: "{{ nautobot_root }}/bin/nautobot-server shell --interface python"
        stdin: "{{ lookup('ansible.builtin.file', 'schedule_export.py') }}"
      environment: >-
        {{ nautobot_env | combine({
             'NAUTOBOT_EXPORT_SCHEDULE_HOUR': nautobot_export_schedule_hour | string,
             'NAUTOBOT_EXPORT_SCHEDULE_MINUTE': nautobot_export_schedule_minute | string}) }}
      register: nautobot_schedule
      changed_when: >-
        {{ 'SCHEDULE_CREATED' in nautobot_schedule.stdout
           or 'SCHEDULE_REENABLED' in nautobot_schedule.stdout }}
      become: true
      become_user: "{{ nautobot_user }}"

    # The export is the only thing that publishes this instance's inventory, and
    # its ordering guard is what makes a stale artifact loud. Both are inert if
    # the schedule is absent. Printing SCHEDULE_SKIPPED and letting the converge
    # continue green lets the export stop publishing with nothing reporting it.
    # A gate that reports its own failure as success is worse than no gate, so
    # the converge fails here instead.
    - name: Assert the export schedule was reconciled
      ansible.builtin.assert:
        that:
          # Both halves are load-bearing. The negative catches a printed
          # SCHEDULE_SKIPPED; the positive catches empty stdout, which would
          # otherwise satisfy the negative and pass on no evidence at all.
          - "'SCHEDULE_SKIPPED' not in nautobot_schedule.stdout"
          - >-
            'SCHEDULE_CREATED' in nautobot_schedule.stdout
            or 'SCHEDULE_REENABLED' in nautobot_schedule.stdout
            or 'SCHEDULE_EXISTS' in nautobot_schedule.stdout
        fail_msg: >-
          The export ScheduledJob was not reconciled: {{
          nautobot_schedule.stdout | trim | default('(no output)', true) }}.
          Without it nothing publishes the inventory artifact and the ordering
          guard cannot fire. Fix the cause — do not skip this task.
        quiet: true

    # Schedule the SSH-CLI discovery sweep (SSOTSyncDevices). Inert unless
    # NAUTOBOT_ONBOARD_TARGETS is set — see the scope note in defaults/main.yml.
    - name: Schedule the device-discovery Job via celery beat
      ansible.builtin.command:
        cmd: "{{ nautobot_root }}/bin/nautobot-server shell --interface python"
        stdin: "{{ lookup('ansible.builtin.file', 'schedule_discovery.py') }}"
      environment: >-
        {{ nautobot_env | combine({
             'NAUTOBOT_ONBOARD_TARGETS': nautobot_onboard_targets,
             'NAUTOBOT_ONBOARD_PLATFORM': nautobot_onboard_platform,
             'NAUTOBOT_ONBOARD_LOCATION': nautobot_onboard_location,
             'NAUTOBOT_ONBOARD_PORT': nautobot_onboard_port | string,
             'NAUTOBOT_DISCOVERY_SCHEDULE_HOUR': nautobot_discovery_schedule_hour | string,
             'NAUTOBOT_DISCOVERY_SCHEDULE_MINUTE': nautobot_discovery_schedule_minute | string}) }}
      register: nautobot_discovery_schedule
      changed_when: "'DISCOVERY_SCHEDULED' in nautobot_discovery_schedule.stdout"
      become: true
      become_user: "{{ nautobot_user }}"

    - name: Wait for the Nautobot web UI to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nautobot_web_port }}/"
        status_code: [200, 302]
        follow_redirects: none
      register: nautobot_health
      until: nautobot_health.status in [200, 302]
      retries: 20
      delay: 6
      changed_when: false

    # The seed jobs enqueue to the worker, which executes them with its
    # EnvironmentFile. Flush any pending restart handler first (covers the
    # nautobot.env-changed case)...
    - name: Restart nautobot services before enqueuing jobs
      ansible.builtin.meta: flush_handlers

    # ...and that is the whole mechanism. An unconditional worker restart used
    # to follow, gated on nautobot_run_seed_jobs "so ordinary converges are
    # untouched". Now that the flag defaults on, every converge is a seed run,
    # so that restart would fire every time: permanently `changed`, and able to
    # kill a scheduled job mid-flight.
    #
    # It is not needed. nautobot.env notifies the restart handler, so a changed
    # env always bounces the worker in the same converge that changed it. A
    # worker running stale env is therefore a real fault, and run_seed_jobs.py
    # exits non-zero when any job is skipped, fails or times out — so it now
    # surfaces as a failed converge instead of being papered over by a restart
    # on every pass.

    # Load the seed bundle into Nautobot by running the additive SSoT DiffSync
    # jobs (and, when NAUTOBOT_RUN_EXPORT is set, the export) once. On by
    # default, paired with nautobot_build_seed, so every converge ingests the
    # inventory it just resolved rather than replaying an aging bundle. The jobs
    # are additive (create/update only), so re-running is safe. The worker
    # executes them with the units' EnvironmentFile, so it already holds the
    # seed-file path + export S3 credentials.
    - name: Run the SSoT seed jobs (and optional export) once
      ansible.builtin.command:
        cmd: "{{ nautobot_root }}/bin/nautobot-server shell --interface python"
        stdin: "{{ lookup('ansible.builtin.file', 'run_seed_jobs.py') }}"
      environment: >-
        {{ nautobot_env | combine({'NAUTOBOT_RUN_EXPORT': nautobot_run_export | string}) }}
      register: nautobot_run_seed
      # A job that FAILED also prints JOB_DONE (with status FAILURE), so match
      # the status too — otherwise a failed run reports `changed`.
      changed_when: nautobot_run_seed.stdout is search('JOB_DONE .+ SUCCESS')
      become: true
      become_user: "{{ nautobot_user }}"
      when: nautobot_run_seed_jobs | bool
