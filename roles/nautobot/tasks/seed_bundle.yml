---
# Controller-side seed-bundle assembly (issue #138). Reads each available
# source, transforms it into its slice of the nautobot_seed.json schema, and
# writes the bundle onto the Nautobot LXC (0600, never committed). Gated by
# nautobot_build_seed (default true). The SSoT seed jobs then DiffSync this
# bundle into Nautobot.
#
# Two stages, in two files, because they are two jobs: resolving a source is
# independent of the schema it eventually feeds, and an agent changing one
# should not have to read the other to find it.
#
#   seed_sources.yml    read + decrypt + validate each optional source
#   seed_transform.yml  shape the parsed facts into the schema, then write
#
# import_tasks, not include_tasks: both stages are unconditional once this file
# runs, and a static import keeps every task visible to --list-tasks and to
# --start-at-task.

- name: Read and validate the seed sources
  ansible.builtin.import_tasks: seed_sources.yml

- name: Transform the sources into the seed bundle and write it
  ansible.builtin.import_tasks: seed_transform.yml
