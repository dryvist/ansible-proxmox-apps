---
# Server layer through the jpe_ansible.nautobot.server collection role: system
# packages, Redis, SECRET_KEY, venv, pinned packages, settings, environment file,
# uWSGI and units, then (nautobot_manage_app) migrations, the first superuser,
# service start and the HTTP health wait. Service accounts and tokens stay with
# tasks/readonly_token.yml and mcp_token.yml (server_manage_accounts is false).
# Every server_* input is mapped from the nautobot_* inputs in
# inventory/group_vars/nautobot_group.yml.
- name: Converge the Nautobot server through the collection role
  ansible.builtin.include_role:
    name: jpe_ansible.nautobot.server

# The tasks that remain in this role read the SECRET_KEY the collection resolved.
- name: Expose the collection's effective SECRET_KEY to this role
  ansible.builtin.set_fact:
    nautobot_effective_secret_key: "{{ server_effective_secret_key }}"
  no_log: true
