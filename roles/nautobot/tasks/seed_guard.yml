---
# Per-array non-empty guard on the assembled seed bundle.
#
# seed_sources.yml skips a run where NO source is available and omits core keys
# whose sources are absent. A supplied source that assembles its core array as
# [] must still stop the bundle before it is written.
#
# Check only core keys that are present. The runner skips absent slices; an empty
# present array is still rejected before it can reach a sync.
#
# Set nautobot_seed_allow_empty for a genuine first seed into an empty Nautobot,
# where some class legitimately has no members yet. It names the classes that
# may be empty rather than switching the guard off wholesale.
- name: Resolve core seed arrays that assembled empty
  ansible.builtin.set_fact:
    # "present core arrays that are empty, minus explicitly allowed classes".
    nautobot_seed_empty_arrays: >-
      {{ nautobot_seed_core_arrays
         | reject('in', nautobot_seed_allow_empty)
         | select('in', (nautobot_seed_bundle | dict2items
                         | map(attribute='key') | list))
         | reject('in', (nautobot_seed_bundle | dict2items
                         | rejectattr('value', 'eq', [])
                         | map(attribute='key') | list))
         | list }}

- name: Refuse a bundle whose core array is empty
  ansible.builtin.assert:
    that:
      - nautobot_seed_empty_arrays | length == 0
    fail_msg: >-
      nautobot seed: these core arrays assembled EMPTY and the bundle was not
      written: {{ nautobot_seed_empty_arrays }}. An empty array is not "no
      changes" to the sync — it is a diff that deletes every member of that
      model class, applied by a job that then reports success. The usual cause
      is a source that resolved to nothing because its path or credential
      variable is unset, not a class that is genuinely empty. Fix the source, or
      name the class in nautobot_seed_allow_empty if it really has no members
      yet.
    quiet: true
