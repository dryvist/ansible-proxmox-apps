---
# Phases 1-2 of the nautobot role: system packages, the service user and
# its directories, then the colocated loopback-only Redis. Split out of
# tasks/main.yml to keep each file to one job; included in the same order.
# =============================================================================
# Phase 1: System packages + user + directories
# =============================================================================
- name: Install Nautobot system packages
  ansible.builtin.apt:
    name: "{{ nautobot_system_packages }}"
    state: present
    update_cache: true

- name: Create the nautobot system group
  ansible.builtin.group:
    name: "{{ nautobot_group }}"
    system: true

- name: Create the nautobot system user
  ansible.builtin.user:
    name: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ nautobot_root }}"
    create_home: true

- name: Create Nautobot directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0755"
  loop:
    - "{{ nautobot_root }}"
    - "{{ nautobot_jobs_root }}"
    - "{{ nautobot_export_schema_dir }}"
    - "{{ nautobot_root }}/static"

# =============================================================================
# Phase 2: Redis — colocated, loopback only
# =============================================================================
- name: Bind Redis to loopback only
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^bind "
    line: "bind {{ nautobot_redis_host }} -::1"
    state: present
  notify: Restart redis

- name: Enforce Redis protected-mode
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "^protected-mode "
    line: "protected-mode yes"
    state: present
  notify: Restart redis

- name: Create Redis systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Redis unprivileged-LXC systemd override
  ansible.builtin.copy:
    dest: /etc/systemd/system/redis-server.service.d/lxc-override.conf
    content: |
      # Managed by Ansible (nautobot role).
      # Debian's Redis unit enables PrivateUsers, which requires user namespace
      # setup that unprivileged Proxmox LXCs deny.
      [Service]
      PrivateUsers=no
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart redis

- name: Apply Redis systemd override before starting Redis
  ansible.builtin.meta: flush_handlers

- name: Enable and start Redis
  ansible.builtin.systemd:
    name: redis-server
    state: started
    enabled: true
