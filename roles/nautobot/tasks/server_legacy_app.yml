---
# The role's own live bring-up: migrations, post-upgrade and the superuser.
# Included from tasks/main.yml inside the become block while
# nautobot_server_via_collection is false; the collection server role does the
# same work when true (tasks/server_collection.yml).
- name: Apply database migrations
  ansible.builtin.shell:
    cmd: >-
      . {{ nautobot_root }}/.nautobot-cmd-env.sh &&
      exec {{ nautobot_root }}/bin/nautobot-server migrate
    executable: /bin/bash
  register: nautobot_migrate
  changed_when: "'No migrations to apply' not in nautobot_migrate.stdout"
  become: true
  become_user: "{{ nautobot_user }}"

# The stamp records the package pins post_upgrade last completed for. A
# converge that installs new packages and then fails before this point
# reports the install as unchanged on the rerun, so the changed flags alone
# would skip post_upgrade (and its collectstatic) for good.
- name: Check which package pins post-upgrade last completed for
  ansible.builtin.stat:
    path: "{{ nautobot_root }}/.post_upgrade_stamp"
    checksum_algorithm: sha1
  register: nautobot_post_upgrade_stamp
  become: true
  become_user: "{{ nautobot_user }}"

- name: Run Nautobot post-upgrade operations after app or Job changes
  ansible.builtin.shell:
    cmd: >-
      . {{ nautobot_root }}/.nautobot-cmd-env.sh &&
      exec {{ nautobot_root }}/bin/nautobot-server post_upgrade --no-migrate
    executable: /bin/bash
  changed_when: true
  become: true
  become_user: "{{ nautobot_user }}"
  when: >-
    nautobot_pip_install.changed | default(false)
    or nautobot_jobs_deploy.changed | default(false)
    or (nautobot_post_upgrade_stamp.stat.checksum | default(''))
    != (nautobot_pip_packages | join(',') | hash('sha1'))

- name: Record the package pins post-upgrade completed for
  ansible.builtin.copy:
    content: "{{ nautobot_pip_packages | join(',') }}"
    dest: "{{ nautobot_root }}/.post_upgrade_stamp"
    owner: "{{ nautobot_user }}"
    group: "{{ nautobot_group }}"
    mode: "0644"

- name: Ensure the Nautobot superuser exists
  ansible.builtin.shell:
    cmd: >-
      . {{ nautobot_root }}/.nautobot-cmd-env.sh &&
      exec {{ nautobot_root }}/bin/nautobot-server shell --interface python
    stdin: "{{ lookup('ansible.builtin.file', 'superuser_bootstrap.py') }}"
    executable: /bin/bash
  register: nautobot_superuser
  changed_when: "'SUPERUSER_CHANGED' in nautobot_superuser.stdout"
  become: true
  become_user: "{{ nautobot_user }}"
  no_log: true
