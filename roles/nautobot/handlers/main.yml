---
# Reload only when a unit file changed (notified by the unit templates), so an
# unchanged converge stays idempotent. Applied before the services start via a
# flush_handlers in the managed-app block.
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart redis
  ansible.builtin.systemd:
    name: redis-server
    state: restarted
  when: not (ansible_check_mode and nautobot_system_packages_install is changed)

# Only meaningful once the app layer is managed (services exist and are
# started). When nautobot_manage_app is false (molecule) the units are deployed
# but not started, so a restart would fail — skip it.
- name: Restart nautobot services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - nautobot-server
    - nautobot-worker
    - nautobot-scheduler
  when:
    - nautobot_manage_app | bool
    - >-
      not ansible_check_mode or
      (
        nautobot_server_unit_file.stat.exists and
        nautobot_worker_unit_file.stat.exists and
        nautobot_scheduler_unit_file.stat.exists
      )
