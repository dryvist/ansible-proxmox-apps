---
# Install prometheus node_exporter as a pinned-version systemd service.
# Everything is versioned: the tarball and unpacked tree live under
# {{ node_exporter_install_dir }}/node_exporter-<version>..., and
# /usr/local/bin/node_exporter is only rewritten when the pinned version
# changes — so re-runs are no-ops and a version bump is one variable.
#
# Inside a system container the unit drops its mount-namespace sandboxing
# (ProtectSystem, PrivateTmp, ...): an unprivileged LXC without the `nesting`
# feature denies the namespace mount and the unit dies with 226/NAMESPACE.

- name: Assert critical variables are defined and valid
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
      - ansible_default_ipv4.address is defined
      - ansible_default_ipv4.address | length > 0
      - node_exporter_version is defined and node_exporter_version | length > 0
      - node_exporter_port is defined and node_exporter_port | string | length > 0
    fail_msg: >-
      One or more critical configuration variables (architecture, default
      IPv4 address, version, or port) are undefined, empty, or unsupported.
    quiet: true
  tags:
    - node_exporter

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags:
    - node_exporter

- name: Create node_exporter install directory
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - node_exporter

# Staged on the controller (unrestricted egress), never downloaded by the
# guest itself -- see node_exporter_download_url in defaults/main.yml for
# why. throttle: 1 serializes this one task across every host in the play so
# two guests sharing an arch never race writing the same controller-side
# dest; get_url's own checksum check then makes every host after the first
# a no-op.
- name: Stage the pinned node_exporter release tarball on the controller
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/{{ node_exporter_release }}.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256sums_url }}"
    mode: "0644"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  throttle: 1
  tags:
    - node_exporter

- name: Copy the staged release tarball to the guest
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_release }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}.tar.gz"
    owner: root
    group: root
    mode: "0644"
  tags:
    - node_exporter

- name: Unpack the node_exporter release
  ansible.builtin.unarchive:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}.tar.gz"
    dest: "{{ node_exporter_install_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}/node_exporter"
  tags:
    - node_exporter

- name: Install the node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_install_dir }}/{{ node_exporter_release }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter
  tags:
    - node_exporter

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_collector_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: "0755"
  when: node_exporter_textfile_collector_enabled
  tags:
    - node_exporter

- name: Detect if running inside a system container
  # systemd-detect-virt --container: exit 0 = inside a container, exit 1 = not.
  ansible.builtin.command: systemd-detect-virt --container
  register: _node_exporter_virt_container
  changed_when: false
  failed_when: false
  tags:
    - node_exporter

- name: Deploy the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter
  tags:
    - node_exporter

- name: Flush handlers to apply systemd changes
  ansible.builtin.meta: flush_handlers
  tags:
    - node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
  tags:
    - node_exporter
