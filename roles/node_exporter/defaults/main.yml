---
# Prometheus node_exporter for every LXC/VM guest in this repo's inventory
# (the PVE-host equivalent, pve_node_exporter, lives in the sibling
# ansible-proxmox repo — that repo owns PVE-node-level roles, this one owns
# guest-level roles). Pinned upstream release installed as a native systemd
# service, exposing host metrics on :9100 for the central Prometheus scrape.

# Pinned upstream release. Single source is node_exporter_version in
# inventory/group_vars/all.yml (Renovate-managed) -- no literal version lives
# in this role, matching the org-wide-var rule cribl_version already follows.

# GOARCH name derived from the host fact; covers the amd64/arm64 fleet.
# Defined here (ahead of its first use below) purely to keep the download-url
# and release-dir lines under the yamllint line-length gate.
node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}"

# The versioned, per-arch release name — shared by the download URL, the
# unpacked directory and the installed-binary source path below, so an
# upgrade only ever touches node_exporter_version in one place.
node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"

# Standard GitHub releases URL. Fetched ONCE on the controller (see
# tasks/main.yml), which has unrestricted egress, and copied from there to
# every guest -- about a dozen guests in this fleet (authelia, haproxy,
# postgres*, splunk-mgmt, unifi-metrics, llm-redis-1, idrac-kvm, ...) sit
# behind the outbound-internal firewall group and cannot reach github.com
# themselves.
node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{
  node_exporter_version }}/{{ node_exporter_release }}.tar.gz

# Upstream's combined checksums manifest (one file, every arch). Passed
# straight to get_url's `checksum:` as a URL: it is fetched and parsed for
# the line matching the downloaded filename, so no literal hash is pinned
# here -- same trick roles/object_storage/defaults/main/00-core.yml already
# uses for its own RustFS binary (object_storage_checksums_url).
node_exporter_sha256sums_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{
  node_exporter_version }}/sha256sums.txt

# Bind to the guest's management IP (the default-route interface fact —
# derived at runtime, never hardcoded) so metrics are only reachable on the
# management VLAN. Set to 0.0.0.0 to listen on every interface.
node_exporter_listen_address: "{{ (ansible_default_ipv4 | default({})).address | default('0.0.0.0') }}"

# Standard node_exporter port — matches pve_node_exporter and the
# monitor_targets/prometheus_stack scrape-side constant of the same name.
node_exporter_port: 9100

# Dedicated no-login system user the service runs as.
node_exporter_user: node-exporter

# Versioned install root; the active binary is /usr/local/bin/node_exporter.
node_exporter_install_dir: /opt/node_exporter

# Optional textfile collector: drop *.prom files into this directory and
# node_exporter exposes them as metrics.
node_exporter_textfile_collector_enabled: true
node_exporter_textfile_collector_dir: /var/lib/node_exporter/textfile_collector

# Extra CLI flags appended verbatim to the service ExecStart (e.g.
# ["--no-collector.wifi"]).
node_exporter_extra_args: []
