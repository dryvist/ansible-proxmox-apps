---
# Healthchecks Docker deployment.
#
# Installs Docker + Compose on the target LXC, generates (and persists) a
# Django SECRET_KEY on first run, then deploys the healthchecks/healthchecks
# image via Docker Compose with a SQLite-backed data directory.
#
# Docker itself (docker-ce + compose plugin, fuse-overlayfs, the fuse-overlayfs
# daemon.json) is installed by the docker_engine meta dependency (meta/main.yml).
# No venv: healthchecks deploys via docker_compose_v2, which uses the docker
# compose CLI (not the docker SDK), so compose runs under the system interpreter.

# =============================================================================
# Healthchecks Data Directories
# =============================================================================

- name: Create healthchecks data directory
  ansible.builtin.file:
    path: "{{ healthchecks_docker_data_dir }}/data"
    state: directory
    owner: root
    group: root
    mode: "0755"

# =============================================================================
# Django SECRET_KEY (OpenBao authoritative)
# =============================================================================
# The existing file seeds a missing OpenBao field. Once stored, KV is
# authoritative and an on-disk mismatch fails before the compose template runs.

- name: Check for existing Django SECRET_KEY
  ansible.builtin.stat:
    path: "{{ healthchecks_docker_data_dir }}/.secret_key"
  register: healthchecks_docker_secret_key_stat

- name: Read the existing Django SECRET_KEY
  ansible.builtin.slurp:
    src: "{{ healthchecks_docker_data_dir }}/.secret_key"
  register: healthchecks_docker_secret_key_file
  when: healthchecks_docker_secret_key_stat.stat.exists
  no_log: true

# The writes run on the controller: the writer token must never reach the guest.
- name: Seed Healthchecks SECRET_KEY in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Seed the Healthchecks SECRET_KEY through the shared seed_generated task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_path: apps/healthchecks
        openbao_secrets_seed_fields:
          - name: secret_key
            length: 50
            charset: alnum
            value: >-
              {{ healthchecks_docker_secret_key
                 or (healthchecks_docker_secret_key_file.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_local_values:
          secret_key: >-
            {{ healthchecks_docker_secret_key
               or (healthchecks_docker_secret_key_file.content | default('') | b64decode | trim) }}
        openbao_secrets_seed_register: healthchecks_docker_secret_seed

- name: Resolve Healthchecks SECRET_KEY from OpenBao
  ansible.builtin.set_fact:
    healthchecks_docker_secret_key: "{{ healthchecks_docker_secret_seed.secret_key }}"
  no_log: true

- name: Require the persisted SECRET_KEY to match OpenBao
  ansible.builtin.assert:
    that:
      - >-
        not healthchecks_docker_secret_key_stat.stat.exists
        or (healthchecks_docker_secret_key_file.content | b64decode | trim)
           == healthchecks_docker_secret_key
    fail_msg: "Healthchecks secret file differs from the stored field secret_key"
  when:
    - healthchecks_docker_secret_seed.secret_key != '(placeholder in check mode)'
  no_log: true

- name: Persist Healthchecks SECRET_KEY
  ansible.builtin.copy:
    content: "{{ healthchecks_docker_secret_key }}"
    dest: "{{ healthchecks_docker_data_dir }}/.secret_key"
    owner: root
    group: root
    mode: "0600"
  when:
    - healthchecks_docker_secret_seed.secret_key != '(placeholder in check mode)'
  no_log: true

# =============================================================================
# Compose Deployment
# =============================================================================

- name: Deploy healthchecks docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ healthchecks_docker_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"  # contains SECRET_KEY
  no_log: true
  notify: Restart healthchecks

# =============================================================================
# Deploy via Docker Compose
# =============================================================================

- name: Deploy healthchecks via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ healthchecks_docker_data_dir }}"
    state: present
  register: healthchecks_docker_compose_result
  changed_when: >-
    (healthchecks_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0
  no_log: true

# =============================================================================
# Health Check
# =============================================================================

- name: Wait for healthchecks HTTP port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ healthchecks_docker_http_port }}"
    timeout: 60

- name: Verify healthchecks login page renders
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ healthchecks_docker_http_port }}/accounts/login/"
    method: GET
    status_code: 200
  register: healthchecks_docker_health
  retries: 10
  delay: 5
  until: healthchecks_docker_health.status == 200
  check_mode: false
  when: >-
    not ansible_check_mode or
    (
      not (healthchecks_docker_compose_result.skipped | default(false)) and
      (healthchecks_docker_compose_result.actions | default([]) | length == 0)
    )
  changed_when: false

# =============================================================================
# Optional admin superuser
# =============================================================================

- name: Create Healthchecks admin superuser (if configured)
  ansible.builtin.command:
    cmd: >-
      docker exec {{ healthchecks_docker_container_name }}
      /opt/healthchecks/manage.py createsuperuser
      --noinput
      --email {{ healthchecks_docker_admin_email }}
  environment:
    DJANGO_SUPERUSER_PASSWORD: "{{ healthchecks_docker_admin_password }}"
  register: healthchecks_docker_superuser
  changed_when: "'created successfully' in (healthchecks_docker_superuser.stdout | default(''))"
  failed_when:
    - healthchecks_docker_superuser.rc != 0
    - "'already exists' not in (healthchecks_docker_superuser.stderr | default(''))"
  when:
    - healthchecks_docker_admin_email | length > 0
    - healthchecks_docker_admin_password | length > 0
  no_log: true

# =============================================================================
# ntfy notification channel (idempotent bootstrap; see defaults/main.yml)
# =============================================================================

- name: Stage the Healthchecks ntfy bootstrap script
  ansible.builtin.copy:
    src: healthchecks_ntfy_bootstrap.py
    dest: "{{ healthchecks_docker_data_dir }}/ntfy_bootstrap.py"
    owner: root
    group: root
    mode: "0600"

- name: Run the idempotent Healthchecks ntfy bootstrap
  ansible.builtin.shell:
    cmd: >-
      docker exec -i {{ healthchecks_docker_container_name }}
      /opt/healthchecks/manage.py shell < {{ healthchecks_docker_data_dir }}/ntfy_bootstrap.py
  environment:
    HEALTHCHECKS_NTFY_URL: "{{ healthchecks_docker_ntfy_url }}"
    HEALTHCHECKS_NTFY_TOPIC: "{{ healthchecks_docker_ntfy_topic }}"
    HEALTHCHECKS_NTFY_TOKEN: "{{ healthchecks_docker_ntfy_token }}"
    HEALTHCHECKS_NTFY_PRIORITY: "{{ healthchecks_docker_ntfy_priority }}"
    HEALTHCHECKS_NTFY_PRIORITY_UP: "{{ healthchecks_docker_ntfy_priority_up }}"
  register: healthchecks_docker_ntfy_bootstrap
  changed_when: "'HEALTHCHECKS_NTFY_BOOTSTRAP_CHANGED' in healthchecks_docker_ntfy_bootstrap.stdout"
  no_log: true
