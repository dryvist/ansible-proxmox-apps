---
- name: Wait for package-manager locks to clear
  ansible.builtin.command:
    argv:
      - lslocks
      - --noheadings
      - --raw
      - --output
      - PID,PATH
  register: apt_recovery_locks
  check_mode: false
  changed_when: false
  retries: "{{ apt_recovery_lock_retries }}"
  delay: "{{ apt_recovery_lock_delay }}"
  until: >-
    apt_recovery_locks.stdout_lines
    | select('search', '(' ~ (apt_recovery_lock_paths | join('|')) ~ ')$')
    | list
    | length == 0

- name: Check for incomplete dpkg configuration
  ansible.builtin.command:
    argv:
      - dpkg
      - --audit
  register: apt_recovery_audit
  check_mode: false
  changed_when: false
  environment:
    LC_ALL: C

- name: Complete pending dpkg configuration
  ansible.builtin.command:
    argv:
      - dpkg
      - --configure
      - -a
  register: apt_recovery_configure
  when: >-
    apt_recovery_audit.stdout | trim | length > 0 or
    apt_recovery_audit.stderr | trim | length > 0
  changed_when: >-
    apt_recovery_configure.stdout is
    search('(?m)^(Setting up|Processing triggers for) ')
  # dpkg returns 1 for package processing errors, including unmet dependencies.
  # Audit and repair those below; fatal invocation errors must still stop here.
  failed_when: apt_recovery_configure.rc not in [0, 1]
  environment:
    LC_ALL: C

- name: Repair and verify remaining package configuration
  when: >-
    apt_recovery_audit.stdout | trim | length > 0 or
    apt_recovery_audit.stderr | trim | length > 0
  environment:
    LC_ALL: C
  block:
    - name: Audit packages after pending dpkg configuration
      ansible.builtin.command:
        argv:
          - dpkg
          - --audit
      register: apt_recovery_post_audit
      check_mode: false
      changed_when: false

    - name: Repair broken dependencies without removing packages
      ansible.builtin.command:
        argv: >-
          {{
            ['apt-get', '-y', '--fix-broken', '--no-remove']
            + (['--simulate'] if ansible_check_mode else [])
            + ['install']
          }}
      # The command module must run for apt-get's explicit check-mode simulation.
      check_mode: false
      changed_when: not ansible_check_mode
      when: >-
        apt_recovery_post_audit.stdout | trim | length > 0 or
        apt_recovery_post_audit.stderr | trim | length > 0
  always:
    # A simulated apt transaction cannot prove recovery. Read the real state
    # even in check mode and retain dpkg's package names in any failure output.
    - name: Verify dpkg configuration is complete
      ansible.builtin.command:
        argv:
          - dpkg
          - --audit
      register: apt_recovery_final_audit
      check_mode: false
      changed_when: false
      # Check mode reports the real state but cannot fail on a repair it only simulated.
      failed_when: >-
        not ansible_check_mode and (
        apt_recovery_final_audit.rc != 0 or
        apt_recovery_final_audit.stdout | trim | length > 0 or
        apt_recovery_final_audit.stderr | trim | length > 0)
