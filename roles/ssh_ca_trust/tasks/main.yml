---
# ssh_ca_trust (VM/guest half) — pinned-fingerprint CA fetch, trust file,
# principals map, sshd drop-in with EFFECTIVE-config assertion, and a static
# break-glass lockout guard. Sibling of the ansible-proxmox role (PVE + LXC);
# keep shapes in lockstep. Live-touch tasks skip under Docker (molecule).

- name: Assert the pinned CA fingerprint and OpenBao address are present
  ansible.builtin.assert:
    that:
      - ssh_ca_trust_ca_fingerprint | length > 0
      - ssh_ca_trust_bao_addr | length > 0
    fail_msg: >-
      ssh_ca_trust needs SSH_CA_FINGERPRINT (the CA fingerprint pinned during
      the certificate authority's trusted ceremony) and BAO_ADDR. Refusing to
      distribute trust without a pin — that would be trust-on-first-use.
  when: ssh_ca_trust_enabled | bool
  tags: [ssh_ca_trust]

# The clock gate is real: a certificate presented against a skewed clock is
# refused before anything else is tried, so trust must not be distributed to a
# host whose time is wrong. But it was sampled ONCE, and the ntp role's restart
# handler runs earlier in the same play. A chrony restart clears
# NTPSynchronized until sync is re-established, so a single sample taken
# straight afterwards fails on exactly the hosts whose clock configuration the
# run just corrected -- the assertion failing because of an action the same run
# took.
#
# Retried, not relaxed. A host that never synchronizes still fails and trust is
# still withheld; only the moment of measurement changed.
- name: Assert the host clock is NTP-synchronized
  when:
    - ssh_ca_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags: [ssh_ca_trust]
  block:
    - name: Wait for the host clock to report NTP synchronization
      ansible.builtin.command:
        cmd: timedatectl show -p NTPSynchronized --value
      register: ssh_ca_trust_ntp
      changed_when: false
      until: ssh_ca_trust_ntp.stdout == 'yes'
      retries: 12
      delay: 10
  rescue:
    # `until` exhausting its retries fails with an EMPTY message, which names
    # neither the clock nor the value seen. Say what was actually observed --
    # this also covers the case where the command itself could not run.
    - name: FAIL -- the host clock did not report NTP synchronization
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} did not report an NTP-synchronized clock
          within {{ 12 * 10 }}s. Last value: '{{ ssh_ca_trust_ntp.stdout
          | default('(command did not run)') }}' (rc
          {{ ssh_ca_trust_ntp.rc | default('unknown') }}). Certificate
          authentication fails closed on clock skew, so trust is not being
          distributed to this host. Check the time daemon here, not the
          certificate path.

- name: Fetch the CA public key from OpenBao
  ansible.builtin.uri:
    url: "{{ ssh_ca_trust_bao_addr }}/v1/{{ ssh_ca_trust_mount }}/public_key"
    return_content: true
    follow_redirects: all
  register: ssh_ca_trust_fetched
  when: ssh_ca_trust_enabled | bool
  tags: [ssh_ca_trust]

- name: Compute the fetched CA key's fingerprint
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >-
      set -o pipefail;
      printf '%s\n' "{{ ssh_ca_trust_fetched.content | trim }}"
      | ssh-keygen -l -f /dev/stdin | awk '{print $2}'
  register: ssh_ca_trust_fetched_fp
  changed_when: false
  when: ssh_ca_trust_enabled | bool
  tags: [ssh_ca_trust]

- name: Verify the fetched CA key against the pinned fingerprint (fail closed)
  ansible.builtin.assert:
    that:
      - ssh_ca_trust_fetched_fp.stdout == ssh_ca_trust_ca_fingerprint
    fail_msg: >-
      CA public key fingerprint mismatch — fetched
      {{ ssh_ca_trust_fetched_fp.stdout }} but the pin is
      {{ ssh_ca_trust_ca_fingerprint }}. Possible endpoint substitution or an
      unrecorded CA rotation. NOT writing trust.
  when: ssh_ca_trust_enabled | bool
  tags: [ssh_ca_trust]

- name: Write the trusted CA keys file
  ansible.builtin.copy:
    dest: "{{ ssh_ca_trust_ca_file }}"
    # One entry per line. A `join('\n')` here is NOT a newline: inside a YAML
    # block scalar the two characters reach the file verbatim, and sshd then
    # reads one malformed entry. A loop is the only rendering that cannot
    # collapse the list.
    content: |
      {% for key in [ssh_ca_trust_fetched.content | trim] + ssh_ca_trust_extra_ca_keys %}
      {{ key }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: ssh_ca_trust_enabled | bool
  notify: Reload sshd
  tags: [ssh_ca_trust]

- name: Create the principals directory
  ansible.builtin.file:
    path: "{{ ssh_ca_trust_principals_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_ca_trust_enabled | bool
  tags: [ssh_ca_trust]

- name: Write the per-user principals files
  ansible.builtin.copy:
    dest: "{{ ssh_ca_trust_principals_dir }}/{{ item.key }}"
    # One principal per line — same reasoning as the CA keys file above. With a
    # single principal the collapsed form was indistinguishable from correct;
    # the second principal turned the file into one 16-character name that
    # matched nobody and locked every certificate out of the VM.
    content: |
      {% for principal in item.value %}
      {{ principal }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ssh_ca_trust_principals | dict2items }}"
  loop_control:
    label: "{{ item.key }}: {{ item.value | join(', ') }}"
  when: ssh_ca_trust_enabled | bool
  notify: Reload sshd
  tags: [ssh_ca_trust]

- name: Install the sshd CA drop-in
  ansible.builtin.copy:
    dest: "{{ ssh_ca_trust_dropin }}"
    content: |
      # Managed by ansible-proxmox-apps ssh_ca_trust — OpenBao SSH client CA
      # trust (ssh-certificate-authority ADR). Late-numbered to win merges.
      TrustedUserCAKeys {{ ssh_ca_trust_ca_file }}
      AuthorizedPrincipalsFile {{ ssh_ca_trust_principals_dir }}/%u
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when:
    - ssh_ca_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  notify: Reload sshd
  tags: [ssh_ca_trust]

- name: Read the effective sshd configuration
  ansible.builtin.command:
    cmd: sshd -T
  register: ssh_ca_trust_effective
  changed_when: false
  when:
    - ssh_ca_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags: [ssh_ca_trust]

- name: Assert the effective sshd config trusts the CA and principals map
  ansible.builtin.assert:
    that:
      - ("trustedusercakeys " ~ ssh_ca_trust_ca_file) in ssh_ca_trust_effective.stdout
      - ("authorizedprincipalsfile " ~ ssh_ca_trust_principals_dir ~ "/%u") in ssh_ca_trust_effective.stdout
    fail_msg: >-
      sshd -T does not show the CA trust directives — another config fragment
      is overriding the drop-in. Effective config must win before certs work.
  when:
    - ssh_ca_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags: [ssh_ca_trust]

# Lockout guard: the converge user's static key is the break-glass secondary
# (ADR hybrid rule) until WS4 rotates it — never strand a guest.
- name: Assert a static authorized_key still exists for the converge user
  ansible.builtin.command:
    cmd: grep -cE '^(ssh|ecdsa)-' "/home/{{ ansible_user | default('debian') }}/.ssh/authorized_keys"
  register: ssh_ca_trust_static_keys
  changed_when: false
  failed_when: ssh_ca_trust_static_keys.stdout | int < 1
  when:
    - ssh_ca_trust_enabled | bool
    - ansible_virtualization_type != 'docker'
  tags: [ssh_ca_trust]
