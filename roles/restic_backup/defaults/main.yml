---
# Nightly restic backup of one service: an optional PostgreSQL dump plus optional
# filesystem paths, to one restic repository per entry of
# restic_backup_repositories. Driven by systemd units only; there is no custom
# script. Each repository has its own template-unit instance, so one failing does
# not skip another. The restic password encrypts every repository and must never
# change after the first backup.

# Short service name. It prefixes the units (<name>-backup@<repository>.service)
# and the config directory. Required.
restic_backup_name: ""
restic_backup_config_dir: "/etc/{{ restic_backup_name }}-backup"
restic_backup_password_file: "{{ restic_backup_config_dir }}/restic-password"
restic_backup_pgpass_file: "{{ restic_backup_config_dir }}/pgpass"

# Set from OpenBao by the caller; never defaulted here.
restic_backup_password: ""

# PostgreSQL dump, skipped while restic_backup_db_name is empty.
restic_backup_db_host: ""
restic_backup_db_port: 5432
restic_backup_db_name: ""
restic_backup_db_user: ""
restic_backup_db_password: ""

# Extra filesystem paths backed up beside the dump.
restic_backup_paths: []

# One entry per repository: name, enabled, bucket, endpoint, access_key_id,
# secret_access_key, region. A repository that is not enabled gets no units, and
# its units are stopped if they were installed earlier.
restic_backup_repositories: []

# Daily backup and Monday integrity check. Explicit UTC keeps the window
# independent of each guest's local timezone.
restic_backup_backup_on_calendar: "*-*-* 06:10:00 UTC"
restic_backup_check_on_calendar: "Mon *-*-* 06:35:00 UTC"
restic_backup_randomized_delay_sec: 600
restic_backup_check_randomized_delay_sec: 300

restic_backup_keep_daily: 14
restic_backup_keep_weekly: 8
restic_backup_keep_monthly: 24
