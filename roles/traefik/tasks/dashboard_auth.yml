---
# OpenBao owns the Traefik dashboard password. The plaintext copy remains
# root-only, and Traefik continues to read the bcrypt htpasswd file.

- name: Check for an existing dashboard htpasswd
  ansible.builtin.stat:
    path: "{{ traefik_dashboard_users_file }}"
  register: traefik_htpasswd_stat

- name: Check for the persisted dashboard password
  ansible.builtin.stat:
    path: "{{ traefik_dashboard_password_file }}"
  register: traefik_dashboard_password_stat

- name: Read the persisted dashboard password
  ansible.builtin.slurp:
    src: "{{ traefik_dashboard_password_file }}"
  register: traefik_dashboard_password_blob
  when: traefik_dashboard_password_stat.stat.exists
  no_log: true

- name: Validate the persisted dashboard password format
  ansible.builtin.assert:
    that:
      - (traefik_dashboard_password_blob.content | b64decode) is search(':')
    fail_msg: "Traefik dashboard password file does not contain a user and password"
  when: traefik_dashboard_password_stat.stat.exists
  no_log: true

- name: Resolve the existing dashboard password candidate
  ansible.builtin.set_fact:
    traefik_dashboard_password_candidate: >-
      {{ traefik_dashboard_password | default('', true)
         or ((traefik_dashboard_password_blob.content | b64decode).strip().split(':', 1) | last
             if traefik_dashboard_password_stat.stat.exists else '') }}
  no_log: true

- name: Require a known password when an htpasswd file already exists
  ansible.builtin.assert:
    that:
      - >-
        not traefik_htpasswd_stat.stat.exists
        or traefik_dashboard_password_candidate | length > 0
    fail_msg: >-
      Traefik has an htpasswd file but no matching plaintext or OpenBao
      dashboard_password field
  no_log: true

- name: Install htpasswd (apache2-utils)
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true
  when: not traefik_htpasswd_stat.stat.exists

# The writes run on the controller: the writer token must never reach the guest.
# Throttled to one host at a time, so hosts racing on a first-ever create cannot
# collide on the check-and-set write.
- name: Seed the Traefik dashboard password in OpenBao
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  no_log: true
  throttle: 1
  block:
    - name: Seed the Traefik dashboard password through the shared seed_generated task
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') }}"
        openbao_secrets_seed_expected_writer_policy: ansible-converge
        openbao_secrets_seed_path: apps/traefik
        openbao_secrets_seed_fields:
          - name: dashboard_password
            length: 24
            charset: alnum
            value: "{{ traefik_dashboard_password_candidate }}"
        openbao_secrets_seed_local_values:
          dashboard_password: "{{ traefik_dashboard_password_candidate }}"
        openbao_secrets_seed_register: traefik_dashboard_password_seed

- name: Resolve the Traefik dashboard password from OpenBao
  ansible.builtin.set_fact:
    traefik_dashboard_password: "{{ traefik_dashboard_password_seed.dashboard_password }}"
  no_log: true

- name: Require the persisted dashboard password to match OpenBao
  ansible.builtin.assert:
    that:
      - >-
        not traefik_dashboard_password_stat.stat.exists
        or ((traefik_dashboard_password_blob.content | b64decode).strip().split(':', 1) | last)
           == traefik_dashboard_password
    fail_msg: "Traefik password file differs from the stored field dashboard_password"
  when:
    - traefik_dashboard_password_seed.dashboard_password != '(placeholder in check mode)'
  no_log: true

- name: Check that the existing htpasswd file matches OpenBao
  ansible.builtin.command:
    cmd: >-
      htpasswd -v -b {{ traefik_dashboard_users_file }}
      {{ traefik_dashboard_user }} {{ traefik_dashboard_password }}
  register: traefik_htpasswd_check
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - traefik_htpasswd_stat.stat.exists
    - traefik_dashboard_password_seed.dashboard_password != '(placeholder in check mode)'
  no_log: true

- name: Require the existing htpasswd value to match OpenBao
  ansible.builtin.assert:
    that:
      - >-
        not traefik_htpasswd_stat.stat.exists
        or traefik_htpasswd_check.rc == 0
    fail_msg: "Traefik htpasswd file does not match the stored field dashboard_password"
  when:
    - traefik_dashboard_password_seed.dashboard_password != '(placeholder in check mode)'
  no_log: true

- name: Persist the plaintext dashboard password (root-only)
  ansible.builtin.copy:
    content: "{{ traefik_dashboard_user }}:{{ traefik_dashboard_password }}\n"
    dest: "{{ traefik_dashboard_password_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - traefik_dashboard_password_seed.dashboard_password != '(placeholder in check mode)'
  no_log: true

- name: Compute the bcrypt htpasswd line
  ansible.builtin.command:
    cmd: "htpasswd -nbB {{ traefik_dashboard_user }} {{ traefik_dashboard_password }}"
  register: traefik_htpasswd_line
  changed_when: true
  when:
    - not traefik_htpasswd_stat.stat.exists
    - traefik_dashboard_password_seed.dashboard_password != '(placeholder in check mode)'
  no_log: true

- name: Install the htpasswd file (basicAuth usersFile)
  ansible.builtin.copy:
    content: "{{ traefik_htpasswd_line.stdout }}\n"
    dest: "{{ traefik_dashboard_users_file }}"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0640"
  when:
    - not traefik_htpasswd_stat.stat.exists
    - traefik_dashboard_password_seed.dashboard_password != '(placeholder in check mode)'
  no_log: true
  notify: Restart traefik

# One writer per run: every traefik host publishes the same fields to the same
# path, so concurrent writers race the check-and-set and the loser fails its
# whole converge. The non-secret user name and break-glass URL are the first
# host's; the password itself is seeded above.
- name: Publish Traefik dashboard metadata to OpenBao
  ansible.builtin.include_role:
    name: dryvist.secrets_management.openbao_secrets
    tasks_from: publish.yml
  vars:
    openbao_secrets_publish_app: traefik
    openbao_secrets_publish_reason: (break-glass dashboard metadata)
    openbao_secrets_publish_data:
      dashboard_user: "{{ traefik_dashboard_user }}"
      dashboard_breakglass_url: >-
        https://{{ container_ip | default(ansible_host) }}:{{ traefik_dashboard_breakglass_port }}/
  when:
    - not ansible_check_mode
    - inventory_hostname == ansible_play_hosts | first
  no_log: true
