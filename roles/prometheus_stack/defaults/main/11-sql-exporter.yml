---
# sql_exporter reads the two tracker databases only when enabled by the
# Prometheus inventory group, which supplies the passwords (from OpenBao) and
# the database endpoint. The collectors come from the pinned checkout of the
# collectors repository; every collectors/*.collector.yml file in it is loaded.
prometheus_stack_sql_exporter_enabled: false
# renovate: datasource=docker depName=burningalchemist/sql_exporter
prometheus_stack_sql_exporter_image: >-
  burningalchemist/sql_exporter:0.24.13@sha256:befda03e0eae3f0c9b9dd0e5e5b968152f50e44dbdc04c1b68370c6fcbda2b7d
prometheus_stack_sql_exporter_container_name: sql-exporter
prometheus_stack_sql_exporter_port: 9399
prometheus_stack_sql_exporter_uid: "65534"
prometheus_stack_sql_exporter_gid: "65534"
prometheus_stack_sql_exporter_config_host_path: "{{ prometheus_stack_data_dir }}/sql-exporter.yml"
prometheus_stack_sql_exporter_config_container_path: /etc/sql_exporter/sql-exporter.yml
# The pin comment is one unbreakable token for Renovate, so it runs past 120.
# yamllint disable-line rule:line-length
# renovate: datasource=git-refs depName=https://github.com/JacobPEvans/prometheus-sql-exporter-collectors currentValue=main
prometheus_stack_sql_exporter_collectors_version: "6d6d25ade544e8e4f22293422e2ef8dd332ea656"
prometheus_stack_sql_exporter_collectors_repository: >-
  https://github.com/JacobPEvans/prometheus-sql-exporter-collectors.git
prometheus_stack_sql_exporter_collectors_checkout_dir: >-
  {{ prometheus_stack_data_dir }}/prometheus-sql-exporter-collectors
prometheus_stack_sql_exporter_collectors_host_path: >-
  {{ prometheus_stack_sql_exporter_collectors_checkout_dir }}/collectors
prometheus_stack_sql_exporter_collectors_container_path: /etc/sql_exporter/collectors
prometheus_stack_sql_exporter_address: >-
  {{ prometheus_stack_blackbox_address
     | regex_replace(':[0-9]+$', ':' ~ (prometheus_stack_sql_exporter_port | string)) }}
