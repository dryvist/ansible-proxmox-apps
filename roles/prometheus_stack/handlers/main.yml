---
# prometheus_stack handlers

# Every rendered file (prometheus.yml, blackbox.yml, docker-compose.yml) is
# bind-mounted into the container as a single file, and
# ansible.builtin.template writes by atomic rename (a new inode) — a
# single-file bind mount does not follow that rename into a running
# container, so a lifecycle-API /-/reload would just re-read the container's
# own stale copy. Recreate is the only handler that actually picks up a
# change; the stack's TSDB persists in the named volume across it.
- name: Restart prometheus stack
  community.docker.docker_compose_v2:
    project_src: "{{ prometheus_stack_data_dir }}"
    state: present
    recreate: always
