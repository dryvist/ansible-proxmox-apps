---
- name: Warn about Mac scrape targets omitted for missing workstation roles
  ansible.builtin.debug:
    msg: >-
      WARNING: omitting the Mac scrape target because tofu_data.workstations
      has no workstation with role "{{ item }}".
  loop: "{{ prometheus_stack_macmon_missing_roles }}"
  loop_control:
    label: "{{ item }}"
  register: prometheus_stack_macmon_missing_role_warnings
