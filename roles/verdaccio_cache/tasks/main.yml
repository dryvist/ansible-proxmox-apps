---
- name: Validate verdaccio_cache inputs
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_architecture in ['x86_64', 'aarch64']
      - verdaccio_cache_port | int >= 1
      - verdaccio_cache_port | int <= 65535
    fail_msg: "verdaccio_cache requires Debian, x86_64 or aarch64, and a TCP port from 1 to 65535."

- name: Install verdaccio_cache runtime packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - xz-utils
    state: present
    update_cache: true
  register: verdaccio_cache_runtime_packages

- name: Create verdaccio_cache service group
  ansible.builtin.group:
    name: "{{ verdaccio_cache_service_group }}"
    system: true
    state: present

- name: Create verdaccio_cache service user
  ansible.builtin.user:
    name: "{{ verdaccio_cache_service_user }}"
    group: "{{ verdaccio_cache_service_group }}"
    home: "{{ verdaccio_cache_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create verdaccio_cache directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ verdaccio_cache_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ verdaccio_cache_data_dir }}"
      owner: "{{ verdaccio_cache_service_user }}"
      group: "{{ verdaccio_cache_service_group }}"
      mode: "0750"
    - path: "{{ verdaccio_cache_storage_dir }}"
      owner: "{{ verdaccio_cache_service_user }}"
      group: "{{ verdaccio_cache_service_group }}"
      mode: "0750"
    - path: /var/cache/verdaccio
      owner: root
      group: root
      mode: "0755"

- name: Install the pinned Node.js runtime
  ansible.builtin.include_tasks: node_runtime.yml
  vars:
    verdaccio_cache_node_runtime_archive_url: "{{ verdaccio_cache_node_archive_url }}"
    verdaccio_cache_node_runtime_archive: >-
      /var/cache/verdaccio/node-v{{ verdaccio_cache_node_version }}-linux-{{ verdaccio_cache_node_arch }}.tar.xz
    verdaccio_cache_node_runtime_sha256: "{{ verdaccio_cache_node_sha256 }}"
    verdaccio_cache_node_runtime_install_root: "{{ verdaccio_cache_root }}"
    verdaccio_cache_node_runtime_dir: "{{ verdaccio_cache_node_dir }}"
    verdaccio_cache_node_runtime_skip_unpack: "{{ ansible_check_mode and verdaccio_cache_runtime_packages is changed }}"

- name: Install pinned Verdaccio release
  ansible.builtin.command:
    argv:
      - "{{ verdaccio_cache_node_dir }}/bin/npm"
      - install
      - --global
      - --prefix
      - "{{ verdaccio_cache_app_dir }}"
      - --no-audit
      - --no-fund
      - "--before={{ verdaccio_cache_dependency_cutoff }}"
      - "verdaccio@{{ verdaccio_cache_version }}"
    creates: "{{ verdaccio_cache_app_dir }}/bin/verdaccio"
  environment:
    PATH: "{{ verdaccio_cache_node_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  when: not (ansible_check_mode and verdaccio_cache_runtime_packages is changed)

- name: Create Verdaccio configuration directory
  ansible.builtin.file:
    path: /etc/verdaccio
    state: directory
    owner: root
    group: "{{ verdaccio_cache_service_group }}"
    mode: "0750"

- name: Create empty Verdaccio htpasswd file
  ansible.builtin.copy:
    dest: "{{ verdaccio_cache_htpasswd_file }}"
    content: ""
    owner: "{{ verdaccio_cache_service_user }}"
    group: "{{ verdaccio_cache_service_group }}"
    mode: "0640"
    force: false

- name: Install Verdaccio configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ verdaccio_cache_config_file }}"
    owner: root
    group: "{{ verdaccio_cache_service_group }}"
    mode: "0640"
  notify: Restart verdaccio_cache

- name: Install Verdaccio systemd unit
  ansible.builtin.template:
    src: verdaccio-cache.service.j2
    dest: /etc/systemd/system/verdaccio-cache.service
    owner: root
    group: root
    mode: "0644"
  vars:
    _service_hardening_template: "{{ role_path }}/../_shared/templates/systemd-service-hardening.conf.j2"
  notify: Restart verdaccio_cache

- name: Enable Verdaccio service
  ansible.builtin.systemd:
    name: verdaccio-cache
    state: started
    enabled: true
    daemon_reload: true
  when: not (ansible_check_mode and verdaccio_cache_runtime_packages is changed)

- name: Apply Verdaccio service changes before health check
  ansible.builtin.meta: flush_handlers

- name: Check Verdaccio health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ verdaccio_cache_port }}/-/ping"
    method: GET
    status_code: 200
    return_content: false
  register: verdaccio_cache_health
  retries: 15
  delay: 2
  until: verdaccio_cache_health.status == 200
  when: not (ansible_check_mode and verdaccio_cache_runtime_packages is changed)
