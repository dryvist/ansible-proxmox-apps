---
# Download and unpack one pinned Node.js release. verdaccio_cache includes it,
# and other roles reuse it with include_role tasks_from; the caller sets all of:
#   verdaccio_cache_node_runtime_archive_url   release archive URL
#   verdaccio_cache_node_runtime_archive       local path of the downloaded archive
#   verdaccio_cache_node_runtime_sha256        archive digest
#   verdaccio_cache_node_runtime_install_root  directory the archive unpacks into
#   verdaccio_cache_node_runtime_dir           unpacked release directory (holds bin/node)
#   verdaccio_cache_node_runtime_skip_unpack   true to skip unpacking (for example under --check
#                               when the xz-utils install was only previewed)

- name: Download the pinned Node.js runtime archive
  ansible.builtin.get_url:
    url: "{{ verdaccio_cache_node_runtime_archive_url }}"
    dest: "{{ verdaccio_cache_node_runtime_archive }}"
    checksum: "sha256:{{ verdaccio_cache_node_runtime_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the pinned Node.js runtime
  ansible.builtin.unarchive:
    src: "{{ verdaccio_cache_node_runtime_archive }}"
    dest: "{{ verdaccio_cache_node_runtime_install_root }}"
    remote_src: true
    creates: "{{ verdaccio_cache_node_runtime_dir }}/bin/node"
  when: not (verdaccio_cache_node_runtime_skip_unpack | bool)
