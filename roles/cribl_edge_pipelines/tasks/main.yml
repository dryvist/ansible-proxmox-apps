---
# Bring the Edge syslog pipeline under version control and apply the
# event-reduction stages it declares.

- name: Create Cribl Edge syslog pipeline directory
  ansible.builtin.file:
    path: "{{ cribl_edge_pipelines_config_dir }}/syslog"
    state: directory
    owner: "{{ cribl_edge_pipelines_user }}"
    group: "{{ cribl_edge_pipelines_group }}"
    mode: "0755"

- name: Deploy Cribl Edge syslog pipeline configuration
  ansible.builtin.template:
    src: pipelines/syslog/conf.yml.j2
    dest: "{{ cribl_edge_pipelines_config_dir }}/syslog/conf.yml"
    owner: "{{ cribl_edge_pipelines_user }}"
    group: "{{ cribl_edge_pipelines_group }}"
    mode: "0644"
  notify: Restart cribl edge
