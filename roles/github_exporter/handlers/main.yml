---
# github_exporter role handlers

- name: Restart github-exporter
  ansible.builtin.systemd:
    name: github-exporter
    state: restarted
    daemon_reload: true
  listen: Restart github-exporter

- name: Restart the exporter token agent
  ansible.builtin.systemd:
    name: openbao-github-exporter-agent.service
    state: restarted
    daemon_reload: true
  listen: Restart the exporter token agent
