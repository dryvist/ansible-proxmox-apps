galaxy_info:
  role_name: github_exporter
  author: ansible-proxmox-apps
  description: Install promhippie/github_exporter as a pinned-version systemd service, credentialed via an OpenBao Agent
  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
