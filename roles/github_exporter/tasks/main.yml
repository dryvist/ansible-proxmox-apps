---
# Install promhippie/github_exporter from its pinned, checksummed .deb
# release (ships its own systemd unit, system user, and state directory —
# unlike roles/node_exporter's tarball, no manual unit/user setup here), then
# credential it with the same OpenBao Agent pattern as roles/github_runner.

- name: Assert critical variables are defined and valid
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64']
      - github_exporter_version is defined and github_exporter_version | length > 0
      - github_exporter_openbao_role_id | length > 0
      - github_exporter_openbao_secret_id | length > 0
      - github_exporter_org | length > 0
    fail_msg: >-
      One or more critical configuration variables (architecture, version,
      AppRole secret-zero, or organization) are undefined or empty.
    quiet: true
  tags:
    - github_exporter

# apt's `deb:` parameter has no checksum option (unlike get_url), so the
# release is fetched and verified first, then installed from the checked
# local path — the same integrity guarantee roles/node_exporter gets from
# get_url, applied to a package install instead of a tarball unpack.
- name: Download the pinned github_exporter release
  ansible.builtin.get_url:
    url: "{{ github_exporter_deb_url }}"
    dest: "/tmp/{{ github_exporter_release }}.deb"
    checksum: "{{ github_exporter_checksum }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - github_exporter

- name: Install the pinned github_exporter release
  ansible.builtin.apt:
    deb: "/tmp/{{ github_exporter_release }}.deb"
  tags:
    - github_exporter

- name: Deploy the exporter's own runtime configuration
  ansible.builtin.template:
    src: github-exporter-defaults.env.j2
    dest: /etc/default/github-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart github-exporter
  tags:
    - github_exporter

# ---------------------------------------------------------------------------
# Registration credential (roles/github_runner's pattern, verbatim). Ansible
# delivers the AppRole secret-zero and the agent that spends it; it never
# renders a GitHub token itself, because a GitHub App installation token
# outlives its usefulness in about an hour and converges are days apart.
# ---------------------------------------------------------------------------
- name: Install the OpenBao client (bao agent mints the exporter's token)
  ansible.builtin.apt:
    deb: "{{ github_exporter_openbao_deb_url }}"
    state: present
  tags:
    - github_exporter

- name: Create the AppRole credential directory
  ansible.builtin.file:
    path: "{{ github_exporter_approle_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - github_exporter

# Two bare-value files, not KEY=VALUE: role_id_file_path/secret_id_file_path
# read the whole file as the value, so an env-file shape would authenticate as
# the literal string "OPENBAO_APPROLE_...=..." and fail.
- name: Deploy the AppRole secret-zero
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ github_exporter_approle_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: role_id
      value: "{{ github_exporter_openbao_role_id }}"
    - name: secret_id
      value: "{{ github_exporter_openbao_secret_id }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart the exporter token agent
  tags:
    - github_exporter

- name: Deploy the OpenBao Agent configuration
  ansible.builtin.template:
    src: openbao-agent.hcl.j2
    dest: "{{ github_exporter_agent_config }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart the exporter token agent
  tags:
    - github_exporter

- name: Deploy the OpenBao Agent systemd unit
  ansible.builtin.template:
    src: openbao-github-exporter-agent.service.j2
    dest: /etc/systemd/system/openbao-github-exporter-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the exporter token agent
  tags:
    - github_exporter

- name: Enable and start the exporter token agent
  ansible.builtin.systemd:
    name: openbao-github-exporter-agent.service
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - github_exporter

# Without this, a changed agent config would not take effect until the end of
# the play — after github-exporter had already (re)started against the old
# token file. The wait below would then be checking the wrong agent.
- name: Apply any pending agent restart before the exporter depends on it
  ansible.builtin.meta: flush_handlers
  tags:
    - github_exporter

# The exporter can start with a stale or absent token and simply return empty
# runner metrics rather than fail its own unit, so a converge that got this
# far but cannot mint should say so here rather than surface only as silent
# gaps in a dashboard days later.
- name: Wait for the agent to render an installation token
  ansible.builtin.wait_for:
    path: "{{ github_exporter_token_env_file }}"
    search_regex: "GITHUB_EXPORTER_TOKEN=."
    timeout: 60
  tags:
    - github_exporter

- name: Enable and start github-exporter
  ansible.builtin.systemd:
    name: github-exporter
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - github_exporter
