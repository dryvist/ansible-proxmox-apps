---
# servarr_wiring role defaults — idempotent cross-app API "self-wiring".
#
# Runs AFTER the download_vpn (Prowlarr + qBittorrent), sonarr, and radarr roles
# have installed their apps. It:
#   1. Sets a DETERMINISTIC API key in each app's config.xml (so cross-app
#      wiring keys are known before converge — never auto-generated).
#   2. Adds public indexers to Prowlarr + wires Prowlarr -> Sonarr/Radarr
#      Applications (full sync).
#   3. Applies *arr media-management settings (hardlinks, recycle bin, min
#      free space).
#
# Root folders + qBittorrent download clients are owned by the devopsarr
# `servarr-config` tofu module; quality profiles + custom formats by the
# `configarr` role (TRaSH). This role no longer touches those.
#
# All API config is idempotent (GET-then-POST/PUT). No bespoke scripts: this is
# ansible.builtin.uri, the same house pattern the download_vpn role uses for
# qBittorrent.

# --- Deterministic API keys (from SOPS env; never committed) -----------------
servarr_wiring_sonarr_api_key: "{{ lookup('env', 'SONARR_API_KEY') | default('', true) }}"
servarr_wiring_radarr_api_key: "{{ lookup('env', 'RADARR_API_KEY') | default('', true) }}"
servarr_wiring_prowlarr_api_key: "{{ lookup('env', 'PROWLARR_API_KEY') | default('', true) }}"

# --- App data dirs (config.xml lives here; match the app roles' -data dirs) ---
servarr_wiring_sonarr_data_dir: /var/lib/sonarr
servarr_wiring_radarr_data_dir: /var/lib/radarr
servarr_wiring_prowlarr_data_dir: /var/lib/prowlarr
servarr_wiring_sonarr_user: media
servarr_wiring_radarr_user: media
servarr_wiring_prowlarr_user: qbittorrent
servarr_wiring_group: media

# --- Endpoints (host:port). Hosts from inventory, ports from OpenTofu. ---
# Sonarr / Radarr are LAN-only LXCs; Prowlarr + qBittorrent live in download-vpn.
# Address resolution: this role runs FROM the download-vpn coordinator, which is
# behind the Proton VPN with Proton DNS — it CANNOT resolve internal FQDNs, so it
# genuinely needs an address here, not a name.
#
# That address is DISCOVERED from the target guest's own running interface, not
# declared anywhere. Sonarr and Radarr are ordinary leased guests: nothing in IaC
# knows their address, and nothing should — the lease holds it. Reading
# ansible_default_ipv4 off the guest is therefore the only source that cannot go
# stale, and it needs no re-apply after a re-IP. (This used to read a declared
# `reserved_ip` from the inventory, which was a second copy of the address and
# could disagree with the lease the guest actually held.)
#
# Falls back to the inventory name only when facts have not been gathered for
# that guest — correct where DNS works, and loud enough to notice where it does not.
servarr_wiring_sonarr_host: >-
  {{ hostvars['sonarr'].ansible_default_ipv4.address
     | default(hostvars['sonarr'].container_ip, true) }}
servarr_wiring_radarr_host: >-
  {{ hostvars['radarr'].ansible_default_ipv4.address
     | default(hostvars['radarr'].container_ip, true) }}
# Prowlarr runs inside download-vpn — this role's own host — so its address is
# just this guest's own interface. No inventory lookup needed at all.
servarr_wiring_prowlarr_host: "{{ ansible_default_ipv4.address }}"

servarr_wiring_sonarr_port: "{{ tofu_data.constants.media_ports.sonarr_web }}"
servarr_wiring_radarr_port: "{{ tofu_data.constants.media_ports.radarr_web }}"
servarr_wiring_prowlarr_port: "{{ tofu_data.constants.media_ports.prowlarr_web }}"

# --- Prowlarr Application sync level: disabled | addOnly | fullSync. ----------
servarr_wiring_sync_level: "fullSync"

# --- Seed criteria: not managed here. ----------------------------------------
# Seeding policy is the qBittorrent global share limits in roles/download_vpn.
# Per-indexer overrides are a manual Prowlarr UI setting.

# --- Public Prowlarr indexers ------------------------------------------------
# Without at least one indexer, Prowlarr has nothing to sync and Sonarr/Radarr
# can never find releases. These are PUBLIC, non-Cloudflare trackers (no
# FlareSolverr needed). Names MUST match Prowlarr's indexer DEFINITION names
# exactly (Indexers -> Add Indexer). The Pirate Bay (general, apibay API) covers
# TV + movies; YTS adds a movie-focused source; Knaben is a meta-search over
# many established trackers (including cached results from retired ones —
# the best reach for older/low-seed releases); LimeTorrents is a
# long-established general tracker. All four verified reachable through the
# tunnel without a Cloudflare solver. Add/remove freely. Deliberately excluded:
# raw DHT crawlers (TorrentProject2, BTdirectory, …) — unmoderated indexes carry
# a high fake/malware-torrent rate.
servarr_wiring_prowlarr_indexers:
  - "The Pirate Bay"
  - "YTS"
  - "Knaben"
  - "LimeTorrents"
# Prowlarr app/sync profile applied to each indexer (1 = the default profile).
servarr_wiring_indexer_app_profile_id: 1

# --- CloudFlare-gated indexers (routed through FlareSolverr) ------------------
# These indexers sit behind CloudFlare, so Prowlarr can only reach them via a
# FlareSolverr proxy (see prowlarr_proxies.yml). They are added WITH the
# flaresolverr tag so Prowlarr routes their requests through the solver.
# Gated on servarr_wiring_flaresolverr_enabled — when false they are skipped
# and the non-CF set above is the whole story.
servarr_wiring_flaresolverr_enabled: true
# FlareSolverr runs co-located in the download_vpn guest, loopback-bound; the
# servarr_wiring coordinator IS that guest, so Prowlarr reaches it on localhost.
servarr_wiring_flaresolverr_host: "http://127.0.0.1:8191"
# The Prowlarr tag that binds the proxy to the CF indexers (shared tag = routed).
servarr_wiring_flaresolverr_tag: flaresolverr
servarr_wiring_prowlarr_cf_indexers:
  - "1337x"
  - "EZTV"

# --- Authentication (Sonarr/Radarr/Prowlarr v4 require a valid auth method) ---
# v4 refuses to serve the UI with AuthenticationMethod=None (it walls off the UI
# until a method is chosen). "External" delegates auth to the reverse proxy, and
# "DisabledForLocalAddresses" lets LAN requests through with no login prompt —
# satisfying the requirement while keeping local access friction-free, and
# forward-compatible with the planned Traefik ingress. Set to Forms/Basic for a
# built-in login instead.
servarr_wiring_auth_method: External
servarr_wiring_auth_required: DisabledForLocalAddresses

# --- Recycler bin (prevents immediate deletion on unmonitor/delete) -----------
# Path on the *arr LXC filesystem. Must be on the same volume as the root folder
# so moves are atomic (no cross-filesystem copy).
servarr_wiring_recycler_bin_path: "/data/media/.recycle"
# Days to keep items in the bin before auto-purge. 0 = keep forever.
servarr_wiring_recycler_bin_days: 14

# --- Minimum free space when importing (MB) -----------------------------------
# *arr's native min-free-space knob (qBittorrent has none): each PVR refuses to
# import when the destination volume has less than this free, so a runaway
# download burst pauses imports instead of filling /data to 0 bytes (which
# previously killed qBittorrent for days). 25600 MB = 25 GiB headroom.
servarr_wiring_min_free_space_mb: 25600

# --- Download client removal settings (qBittorrent) ---------------------------
# Keep seeding after import instead of letting the *arr apps tell qBittorrent to
# remove a torrent (completed or failed) — data survives past the app's own
# import step, and the client keeps any partial data on its own terms.
servarr_wiring_remove_completed_downloads: false
servarr_wiring_remove_failed_downloads: false

# --- Test / orchestration toggle ---------------------------------------------
# When false (Molecule), the role only validates inputs and renders nothing
# live — there are no running *arr apps in CI. The live deploy leaves it true.
servarr_wiring_manage_services: true
