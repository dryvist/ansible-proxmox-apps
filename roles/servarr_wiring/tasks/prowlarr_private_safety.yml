---
# Enforce conservative data-steward defaults on every PRIVATE Prowlarr
# indexer: freeleech-only searches and a seed-criteria floor. Public
# indexers are untouched (they carry no such obligations).
#
# Idempotent, GET-then-conditional-PUT — same house pattern as
# media_management.yml / download_clients.yml. Critically, the PUT body is
# the object GET just returned with ONLY the target keys overlaid: every
# other field (including the indexer's `fields` array, which carries the
# tracker's stored credentials — cookie/passkey/apikey) round-trips
# untouched. We never rebuild `fields` from the schema (that would replace a
# live credential with a schema default) and we never emit an explicit value
# for a credential field ourselves.

- name: Fetch existing Prowlarr indexers (private-tracker safety)
  ansible.builtin.uri:
    url: "http://{{ servarr_wiring_prowlarr_host }}:{{ servarr_wiring_prowlarr_port }}/api/v1/indexer"
    method: GET
    headers:
      X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
    status_code: 200
  register: servarr_wiring_pi_before
  changed_when: false
  no_log: true

# Not every private definition exposes a freeleech search filter — skip that
# one field cleanly rather than fail, and say so.
- name: Warn when a private indexer has no freeleech field to enforce
  ansible.builtin.debug:
    msg: >-
      Private indexer "{{ item.name }}" has no "freeleech" field in its
      definition — nothing to enforce there; seed criteria still apply.
  loop: "{{ servarr_wiring_pi_before.json | selectattr('privacy', 'equalto', 'private') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.fields | selectattr('name', 'equalto', 'freeleech') | list | length) == 0

- name: Enforce freeleech-only + seed-criteria floor on private indexers
  ansible.builtin.uri:
    url: "http://{{ servarr_wiring_prowlarr_host }}:{{ servarr_wiring_prowlarr_port }}/api/v1/indexer/{{ item.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
    body_format: json
    body: >-
      {{ item | combine({'fields': _new_fields, 'torrentBaseSettings': _new_tbs}) }}
    status_code: [200, 202]
  register: servarr_wiring_pi_put
  changed_when: true
  no_log: true
  loop: "{{ servarr_wiring_pi_before.json | selectattr('privacy', 'equalto', 'private') | list }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    _freeleech_field: "{{ item.fields | selectattr('name', 'equalto', 'freeleech') | list }}"
    _has_freeleech: "{{ _freeleech_field | length > 0 }}"
    _new_fields: >-
      {{ (item.fields | rejectattr('name', 'equalto', 'freeleech') | list)
         + ([_freeleech_field | first | combine({'value': true})] if _has_freeleech else []) }}
    _tbs: "{{ item.torrentBaseSettings | default({}) }}"
    _min_ratio: "{{ servarr_wiring_private_indexer_min_seed_ratio | float }}"
    _min_time: "{{ servarr_wiring_private_indexer_min_seed_time_minutes | int }}"
    _new_tbs: >-
      {{ _tbs | combine({
           'seedRatio': [_tbs.seedRatio | default(0) | float, _min_ratio] | max,
           'seedTime': [_tbs.seedTime | default(0) | int, _min_time] | max,
           'packSeedTime': [_tbs.packSeedTime | default(0) | int, _min_time] | max
         }) }}
  when: >-
    (_has_freeleech and not ((_freeleech_field | first).value | default(false) | bool))
    or (_tbs.seedRatio | default(0) | float) < (_min_ratio | float)
    or (_tbs.seedTime | default(0) | int) < (_min_time | int)
    or (_tbs.packSeedTime | default(0) | int) < (_min_time | int)

# Re-fetch so the assertion below checks what Prowlarr actually persisted,
# not just what we computed and sent.
- name: Re-fetch Prowlarr indexers to verify enforcement
  ansible.builtin.uri:
    url: "http://{{ servarr_wiring_prowlarr_host }}:{{ servarr_wiring_prowlarr_port }}/api/v1/indexer"
    method: GET
    headers:
      X-Api-Key: "{{ servarr_wiring_prowlarr_api_key }}"
    status_code: 200
  register: servarr_wiring_pi_after
  changed_when: false
  no_log: true

# Hard fail — a private indexer that isn't freeleech-only (where the
# definition supports it) or below the seed floor is a policy violation,
# not a warning.
- name: Assert private-tracker safety is enforced
  ansible.builtin.assert:
    that:
      - not _has_freeleech or ((_freeleech_field | first).value | default(false) | bool)
      - (_tbs.seedRatio | default(0) | float) >= (_min_ratio | float)
      - (_tbs.seedTime | default(0) | int) >= (_min_time | int)
      - (_tbs.packSeedTime | default(0) | int) >= (_min_time | int)
    fail_msg: >-
      Private indexer "{{ item.name }}" does not meet the enforced
      freeleech/seed-criteria floor after wiring.
    quiet: true
  loop: "{{ servarr_wiring_pi_after.json | selectattr('privacy', 'equalto', 'private') | list }}"
  loop_control:
    label: "{{ item.name }}"
  # An indexer's fields carry its credentials, and assert prints the whole loop
  # item on failure — which published the account password into the run log the
  # first time this fired. fail_msg names the indexer, which is what an
  # operator needs to act.
  no_log: true
  vars:
    _freeleech_field: "{{ item.fields | selectattr('name', 'equalto', 'freeleech') | list }}"
    _has_freeleech: "{{ _freeleech_field | length > 0 }}"
    # The seed settings are entries in the fields array keyed by name, not
    # members of a nested object. Reading the nested path yielded the default
    # for every indexer, so the comparison was zero against the floor: it could
    # only fail, and only for the wrong reason — it reported a correctly wired
    # indexer as non-compliant, and disclosed its credentials doing so.
    _tbs: >-
      {{ dict(item.fields | default([]) | map(attribute='name') | list
              | map('regex_replace', '^torrentBaseSettings\.', '') | list
              | zip(item.fields | default([])
                    | map(attribute='value', default='') | list)) }}
    _min_ratio: "{{ servarr_wiring_private_indexer_min_seed_ratio | float }}"
    _min_time: "{{ servarr_wiring_private_indexer_min_seed_time_minutes | int }}"
