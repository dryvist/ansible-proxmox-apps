---
# The one docker_vms member that acts as the OpenTofu execution host. Every
# LAN-touching CLI operation (init against the remote backend, plan, state ops)
# runs here rather than on a workstation; the site play gates the role on this.
opentofu_cli_host: iac-platform

# Official OpenTofu apt repository (two keys by upstream design: the release
# key and the package-host key). Armoured keys are stored as .asc so apt reads
# them without a dearmour step.
opentofu_cli_keyring_dir: /etc/apt/keyrings
opentofu_cli_release_key_url: https://get.opentofu.org/opentofu.gpg
opentofu_cli_repo_key_url: https://packages.opentofu.org/opentofu/tofu/gpgkey
opentofu_cli_repo_uri: https://packages.opentofu.org/opentofu/tofu/any/

# Latest stable by default — the workspace pins the version it requires and a
# hardcoded pin here would drift against it.
opentofu_cli_package_state: present

# Adjacent tooling the same execution host needs for the documented remote-plan
# flow (docs/EXECUTION_HOSTS.md in tofu-proxmox): direnv loads the shared
# nix-devenv backend-coordinate helper, jq is used by inventory/secret tooling.
# Both ship in Debian's default archive, so no extra apt repo is needed for them.
opentofu_cli_extra_packages:
  - direnv
  - jq

# Doppler CLI (secret-zero for the operator shell). Not in Debian's archive —
# same two-file-keyring-dir pattern as the OpenTofu repo above, but Doppler
# only publishes one key, already ASCII-armoured, so no dearmour step is needed
# (apt reads .asc keyrings directly, same as opentofu_cli_repo_key_url).
opentofu_cli_doppler_key_url: https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key
opentofu_cli_doppler_repo_uri: https://packages.doppler.com/public/cli/deb/debian
