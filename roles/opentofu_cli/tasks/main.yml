---
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ opentofu_cli_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the OpenTofu release signing key
  ansible.builtin.get_url:
    url: "{{ opentofu_cli_release_key_url }}"
    dest: "{{ opentofu_cli_keyring_dir }}/opentofu.gpg"
    owner: root
    group: root
    mode: "0644"

- name: Install the OpenTofu package-host signing key
  ansible.builtin.get_url:
    url: "{{ opentofu_cli_repo_key_url }}"
    dest: "{{ opentofu_cli_keyring_dir }}/opentofu-repo.asc"
    owner: root
    group: root
    mode: "0644"


# One-line format on purpose: it is the only sources syntax whose multi-keyring
# `signed_by` separator is unambiguous, and upstream needs two keyrings.
- name: Add the OpenTofu apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/opentofu.list
    content: >-
      deb [signed-by={{ opentofu_cli_keyring_dir }}/opentofu.gpg,{{
      opentofu_cli_keyring_dir }}/opentofu-repo.asc]
      {{ opentofu_cli_repo_uri }} any main

    owner: root
    group: root
    mode: "0644"

- name: Install the OpenTofu CLI
  ansible.builtin.apt:
    name: tofu
    state: "{{ opentofu_cli_package_state }}"
    update_cache: true

- name: Record the installed OpenTofu version
  ansible.builtin.command: tofu version
  changed_when: false
  register: opentofu_cli_version

- name: Show the installed OpenTofu version
  ansible.builtin.debug:
    msg: "{{ opentofu_cli_version.stdout_lines | first }}"

- name: Install the Doppler CLI signing key
  ansible.builtin.get_url:
    url: "{{ opentofu_cli_doppler_key_url }}"
    dest: "{{ opentofu_cli_keyring_dir }}/doppler.asc"
    owner: root
    group: root
    mode: "0644"

- name: Add the Doppler CLI apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/doppler-cli.list
    content: >-
      deb [signed-by={{ opentofu_cli_keyring_dir }}/doppler.asc]
      {{ opentofu_cli_doppler_repo_uri }} any-version main
    owner: root
    group: root
    mode: "0644"

- name: Install execution-host tooling (doppler, direnv, jq)
  ansible.builtin.apt:
    name: "{{ ['doppler'] + opentofu_cli_extra_packages }}"
    state: present
    update_cache: true
