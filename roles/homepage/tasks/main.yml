---
# Homepage: render the board from the shared catalog, run the vendor image.
# See defaults/main.yml for why the image and not a source build.

- name: Build the shared service catalog
  ansible.builtin.include_role:
    name: dashboard_catalog

- name: Create the homepage config directory
  ansible.builtin.file:
    path: "{{ homepage_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Bind-mounted at /app/config. The container runs as root, so root ownership is
# what it can read; nothing here is secret.
- name: Render the generated config
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ homepage_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - services.yaml
    - settings.yaml
    - widgets.yaml
  notify: Restart homepage

- name: Deploy the homepage docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homepage

- name: Check for the retired source-build homepage unit
  ansible.builtin.stat:
    path: /etc/systemd/system/homepage.service
  register: homepage_retired_unit

# Stops the unit that earlier converges installed on the compose port, before
# the compose project binds that port.
- name: Stop and disable the retired source-build homepage unit
  ansible.builtin.systemd_service:
    name: homepage
    state: stopped
    enabled: false
  when: homepage_retired_unit.stat.exists

- name: Remove the retired source-build homepage unit
  ansible.builtin.file:
    path: /etc/systemd/system/homepage.service
    state: absent
  notify: Reload systemd

- name: Deploy homepage via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_data_dir }}"
    state: present

# A rendered board that lists nothing converges green and looks healthy. Assert
# the artifact actually carries services rather than trusting the render.
- name: Verify the rendered board is not empty
  ansible.builtin.command:
    cmd: "grep -c 'href:' {{ homepage_config_dir }}/services.yaml"
  register: homepage_href_count
  changed_when: false
  failed_when: homepage_href_count.stdout | int < 1
