---
galaxy_info:
  author: JacobPEvans
  description: Deploy the gethomepage dashboard as a Docker container
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
  galaxy_tags:
    - homepage
    - docker
    - dashboard

dependencies:
  # Shared Docker-in-LXC bootstrap (docker-ce + compose plugin, LXC-conditional
  # fuse-overlayfs). configure_daemon_json pins the fuse-overlayfs storage
  # driver, required on ZFS-backed LXC.
  - role: docker_engine
    docker_engine_configure_daemon_json: true
