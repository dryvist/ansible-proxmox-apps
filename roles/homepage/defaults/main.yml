---
# Homepage (gethomepage) — the estate service launcher.
#
# Its whole service list is RENDERED from the shared dashboard_catalog, so a
# service appears here by having a Traefik route; nothing in this role
# enumerates services. Config is plain YAML, so a re-render is idempotent by
# byte comparison — which is why this role needs no API converger the way the
# homarr role does.
#
# Runs the vendor image, not a source build. Upstream publishes no release
# binary, and building the Next.js app on the guest needs a pinned Node, pnpm
# and ~2 GB of build RAM this 1-core/512 MB guest does not have — it OOM'd.
# The image already contains all of that, and the estate has nine other
# *_docker roles on the same docker_engine bootstrap.

# renovate: datasource=docker depName=ghcr.io/gethomepage/homepage
homepage_image: "ghcr.io/gethomepage/homepage:v2.1.2"
homepage_container_name: homepage
homepage_data_dir: /opt/homepage
homepage_config_dir: "{{ homepage_data_dir }}/config"

homepage_port: >-
  {{ tofu_data.constants.service_ports.homepage_web
     | mandatory('tofu_data.constants.service_ports.homepage_web missing — regenerate the published inventory') }}

# Required since upstream v1.0: homepage rejects any request whose Host header
# is not listed, so without the public vhost every proxied request 400s while
# the container stays healthy. localhost:3000 is always allowed implicitly; the
# guest's own name is added so a direct probe works too. Never "*".
homepage_allowed_hosts: >-
  homepage.{{ lookup('env', 'PROXMOX_SUBDOMAIN') }},{{ inventory_hostname }}:{{ homepage_port | trim }}

homepage_title: "Homelab"

# Status dots. OFF by default: the widget issues an unauthenticated HEAD, so it
# is only meaningful against the guest address the catalog carries, never the
# gated public URL. Turning it on uses catalog probe_url, never url.
homepage_site_monitor_enabled: false
