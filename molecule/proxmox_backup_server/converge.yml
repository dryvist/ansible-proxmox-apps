---
# Converge the proxmox_backup_server role with a datastore on a scenario-local
# path. Name, path and datastore device are the inputs the role has no
# default for.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    proxmox_backup_server_datastore_name: molecule
    proxmox_backup_server_datastore_path: /srv/molecule-datastore
    # Stand-in data disk published by prepare.yml as a by-id symlink onto a
    # loop device, so the role's by-id validation is exercised rather than
    # bypassed.
    proxmox_backup_server_datastore_device: /dev/disk/by-id/molecule-datastore

    # The role's default wait is sized for a parity pool of spinning disks,
    # where laying out the chunk store legitimately takes minutes. Here it is a
    # loop-backed filesystem and creation is quick, so the budget is cut down:
    # a genuine failure should surface in a couple of minutes rather than
    # spending the production budget waiting for something that will not
    # arrive.
    proxmox_backup_server_datastore_create_retries: 24
    proxmox_backup_server_datastore_create_delay: 5

  tasks:
    - name: Include proxmox_backup_server role
      ansible.builtin.include_role:
        name: proxmox_backup_server
