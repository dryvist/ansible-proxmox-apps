---
# Molecule scenario for the proxmox_backup_server role. A privileged systemd
# container installs the real package from the community repository, the
# daemons start, and the verify play asserts the repository wiring, the
# services, and — through `proxmox-backup-manager` itself — that the declared
# datastore exists on the declared path.
#
# `platform: linux/amd64` is load-bearing: the vendor publishes amd64 only, so
# on an arm64 workstation the scenario runs emulated. CI runners are amd64 and
# ignore it.
#
# No secrets: the role reads none.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: pbs-test${CI_INSTANCE_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    platform: linux/amd64
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - proxmox_backup_server_group

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: proxmox_backup_server
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
