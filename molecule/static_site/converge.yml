---
# Converge the static_site role against the committed fixture site. The source
# directory is the one input the role has no default for — live callers pass
# their own built output here, and the role fails loudly when it is missing.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    static_site_source_dir: "{{ playbook_dir }}/files/site"

  tasks:
    - name: Include static_site role
      ansible.builtin.include_role:
        name: static_site
