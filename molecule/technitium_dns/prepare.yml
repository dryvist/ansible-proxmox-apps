---
# Molecule preparation for the technitium_dns scenario.
# The role makes no live API calls in CI (technitium_dns_apply=false), so the
# only setup needed is confirming the containers are reachable.

- name: Prepare
  # Not `all`: leasedguest40-test is an inventory-only fixture with no container
  # behind it (see converge.yml), so there is no connection to wait for.
  hosts: technitium_dns_group
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        # 30s was tight enough that a container which simply started slowly
        # under a loaded runner failed before it was ever asked to do
        # anything, reported as ok=0 and passing on a rerun. A container that
        # is going to answer does so in seconds, so a longer ceiling costs
        # nothing on the healthy path.
        timeout: 180
