---
# Molecule preparation playbook
# Sets up the test container before running the mssql_docker role

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache (Debian/Ubuntu)
      # cache_valid_time removed: pulled Docker images can have stale or
      # corrupt /var/lib/apt/lists that passes the timestamp freshness check
      # but contains no package metadata (observed when the upstream image's
      # :latest tag was re-pushed minutes before a CI run). Forcing update
      # every run is the correct behavior for CI; retries handle transient
      # mirror failures.
      ansible.builtin.apt:
        update_cache: true
      register: _apt_update_result
      until: _apt_update_result is succeeded
      retries: 3
      delay: 10
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install base packages for Docker role
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - procps
          - systemd
          - iptables
          - python3-pip
          - python3-venv
          - python3-full
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Create Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker vfs storage driver for Docker-in-Docker
      # containerd-snapshotter is pinned off alongside the driver. The
      # containerd image store replaces the graph-driver stack entirely, so
      # with it on, "storage-driver" is read and then has no effect: layers
      # unpack through containerd's overlayfs snapshotter regardless. That
      # snapshotter turns a layer's `.wh.` entries into overlayfs whiteouts
      # with mknod(char 0/0), and this snapshotter root sits on the test
      # container's own overlayfs rootfs, which the kernel does not accept as
      # an overlay upper. Images whose layers carry no whiteout entry still
      # extract, so the breakage looks image-specific rather than
      # configuration-wide. Docker Engine 29 turns the containerd image store
      # on for fresh installs, and this role installs docker-ce unpinned.
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs",
            "features": {
              "containerd-snapshotter": false
            }
          }
        mode: "0644"
