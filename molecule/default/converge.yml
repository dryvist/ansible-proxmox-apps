---
# Molecule converge playbook
# Tests the mssql_docker role against the test container

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Fixture SA password for the throwaway test container; not a live credential.
    mssql_docker_sa_password: "Molecule-Fixture-1"
    # Disable sample database restore to avoid large downloads in tests
    mssql_docker_restore_samples: false

  tasks:
    - name: Include mssql_docker role
      ansible.builtin.include_role:
        name: mssql_docker
