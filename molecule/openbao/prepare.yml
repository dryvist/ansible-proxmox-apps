---
# Molecule preparation playbook — set up the test container before the role.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        # 30s was tight enough that a container which simply started slowly
        # under a loaded runner failed before it was ever asked to do
        # anything, reported as ok=0 and passing on a rerun. A container that
        # is going to answer does so in seconds, so a longer ceiling costs
        # nothing on the healthy path.
        timeout: 180

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      register: _apt_update_result
      until: _apt_update_result is succeeded
      retries: 3
      delay: 10
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install base packages for the openbao role
      ansible.builtin.apt:
        name:
          - ca-certificates
          - jq
        state: present
      when: ansible_facts['os_family'] == 'Debian'
