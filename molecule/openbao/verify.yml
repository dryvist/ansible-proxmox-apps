---
# Molecule verification playbook — validates install + config without a live
# OpenBao (the service does not start under Docker).

- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    openbao_user: openbao
    openbao_data_dir: /opt/openbao/data
    openbao_config_dir: /etc/openbao
    openbao_config_file: /etc/openbao/openbao.hcl
    openbao_env_file: /etc/openbao/openbao.env
    openbao_terrakube_workspace_names:
      - iac-platform
      - tofu-github
      - tofu-unifi
      - tofu-aws-production
      - tofu-runs-on
      - tofu-proxmox
      - tofu-proxmox-aws-infra
      - tofu-proxmox-servarr-config

  tasks:
    - name: Verify the binary, user, data dir, config, env file, and systemd unit
      ansible.builtin.include_tasks: verify/install_and_service.yml

    - name: Verify the snapshot and Slack-rotation timer daemons render
      ansible.builtin.include_tasks: verify/timers.yml

    - name: Verify RBAC policy templates and the generated-policy composition invariants
      ansible.builtin.include_tasks: verify/rbac_composition.yml

    - name: Verify staged plugin binaries and specific policy grants (terraform-apply, ai-orchestrator)
      ansible.builtin.include_tasks: verify/plugins_and_policies.yml

    - name: Verify the SSH CA signing-role table and actor attachments match the ADR
      ansible.builtin.include_tasks: verify/ssh_signing.yml
