---
# Molecule converge playbook — runs the openbao role against the test container.
# Under Docker, the systemd start, health-wait, and bootstrap phases are skipped
# by the role's `ansible_virtualization_type != 'docker'` guards, so converge
# exercises install + user/dir creation + config templating only.

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Provider locations are required private inputs in production. Molecule
    # uses inert values so policy composition can be exercised offline.
    openbao_ai_api_key_mount: test-external
    openbao_ai_api_key_path_prefix: test/provider-keys
    # container_ip is supplied as a HOSTVAR via molecule.yml (mirrors production
    # load_tofu.yml) so the role can build the Raft peer list from hostvars.
    # The static seal key is injected from Doppler tier-0 at runtime; stub it so
    # the config + env templates render. The service never starts under Docker,
    # so this is an inert placeholder (not a real key).
    openbao_seal_key_id: "static-test-1"
    openbao_static_seal_key: "ZXhhbXBsZS1zdGF0aWMtc2VhbC1rZXktMzJieXRlcy0wMA=="
    # Snapshot AppRole creds + alert targets come from tier-0 / load_tofu in
    # production; stub them so the snapshot daemon templates render under Docker.
    # The timer never starts here (the systemd task is guarded off under Docker),
    # so these are inert placeholders. Literal alert URLs avoid a tofu_data
    # dependency the container has no inventory for.
    openbao_snapshot_role_id: "test-snapshot-role-id"
    openbao_snapshot_secret_id: "test-snapshot-secret-id"
    openbao_snapshot_ntfy_url: "http://ntfy.test/openbao"
    openbao_snapshot_healthcheck_url: ""
    # Slack rotation AppRole creds + alert targets — same reasoning as the
    # snapshot stubs above: the timer never starts under Docker, so these are
    # inert placeholders that only need to make the templates render.
    openbao_slack_rotate_role_id: "test-slack-rotate-role-id"
    openbao_slack_rotate_secret_id: "test-slack-rotate-secret-id"
    openbao_slack_rotate_ntfy_url: "http://ntfy.test/openbao"
    openbao_slack_rotate_healthcheck_url: ""
    # Splunk MCP rotation AppRole creds + alert target — same reasoning:
    # overriding the standalone knobs (defaults/main/09) rather than setting
    # the OPENBAO_APPROLE_SPLUNK_MCP_ROTATE_* env vars, since those lookups
    # run on the Ansible CONTROLLER at template-render time, not in the
    # container — an env var set here would need to exist in the shell that
    # invokes `molecule test`, not the play. This also exercises the row
    # without depending on `ingress_domain`, which this scenario's inventory
    # never sets.
    openbao_splunk_mcp_rotate_role_id: "test-splunk-mcp-rotate-role-id"
    openbao_splunk_mcp_rotate_secret_id: "test-splunk-mcp-rotate-secret-id"
    openbao_splunk_mcp_rotate_ntfy_url: "http://ntfy.test/secrets-security"
    openbao_splunk_mcp_rotate_healthcheck_url: ""
    # Secret-age auditor AppRole creds + alert target — same reasoning as the
    # rotator stubs above: the timer never starts under Docker, so these are
    # inert placeholders that only need to make Phase 14's templates render.
    # openbao_secret_age_ntfy_url already points at a standalone knob (not a
    # dict2items-looped table row like the rotators), so it was never at risk
    # of the ingress_domain-render-before-guard bug those rows had — this
    # override exists only to exercise the templates, not to route around it.
    openbao_secret_age_role_id: "test-secret-age-role-id"
    openbao_secret_age_secret_id: "test-secret-age-secret-id"
    openbao_secret_age_ntfy_url: "http://ntfy.test/secrets-security"
    openbao_secret_age_healthcheck_url: ""
    # Exercise the OAuthapp download/extract/immutable-command path. Bootstrap
    # is Docker-guarded, so no Slack client secret or live API is required.
    openbao_oauthapp_engine_enabled: true

  tasks:
    - name: Include openbao role
      ansible.builtin.include_role:
        name: openbao
