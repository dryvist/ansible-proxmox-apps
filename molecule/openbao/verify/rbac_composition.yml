---

# RBAC bootstrap (policies/AppRoles) only runs against a live, unsealed
# server — unreachable under this Docker scenario — so it can't be
# exercised here. What CAN be checked without a live server: every policy
# template the role's defaults reference actually exists, catching a
# rename/typo before it reaches a live cluster. Live AppRole/policy
# behavior (capabilities, cross-domain isolation) is proven separately
# against the real cluster.
- name: Check every RBAC policy template referenced in role defaults exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../roles/openbao/templates/{{ item }}"
  loop:
    - terraform-apply-policy.hcl.j2
    - terrakube-workspace-policy.hcl.j2
    - ansible-converge-policy.hcl.j2
    - observability-policy.hcl.j2
    - local-cloud-policy.hcl.j2
    - monitoring-policy.hcl.j2
    - media-policy.hcl.j2
    - local-llm-policy.hcl.j2
    - public-policy.hcl.j2
    - config-read-policy.hcl.j2
    - config-write-policy.hcl.j2
    - kv-capability-policy.hcl.j2
    - github-mint-policy.hcl.j2
    - ai-admin-policy.hcl.j2
    - snapshot-policy.hcl.j2
  register: bao_policy_templates
  delegate_to: localhost
  become: false

- name: Assert every RBAC policy template is present
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing OpenBao policy template: {{ item.item }}"
  loop: "{{ bao_policy_templates.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- Self-escalation invariant for the leaf->rollup composition model -------
# The base read-/write- capability policies + the rollups composed from them
# (read-all, read-write-all) must be an ENUMERATED union that provably EXCLUDES
# the control plane and the IaC kernel: sys/policies*, auth/* (incl.
# .../secret-id), auth/token/create, and secret/infra/*. Composition attaches
# policy NAMES to a token, so if every base leaf excludes those paths, so does
# every union of leaves. We prove it by rendering every generated capability
# policy and scanning its GRANT lines (dropping `#` comment lines, which name
# the excluded paths in prose). `ai-admin` is the ONE self-modify role and is
# deliberately NOT part of this composition — it is asserted separately.
- name: Load OpenBao role defaults (rendered) for the composition invariant
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../roles/openbao/defaults/main.yml"

- name: Render every generated base capability policy (read-/write-/github-mint)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../roles/openbao/templates/{{ item.template }}"
    dest: "/tmp/cap-{{ item.name }}.hcl"
    mode: "0600"
  loop: "{{ openbao_ai_capability_policies }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false

- name: Slurp the rendered base capability policies back
  ansible.builtin.slurp:
    src: "/tmp/cap-{{ item.name }}.hcl"
  loop: "{{ openbao_ai_capability_policies }}"
  loop_control:
    label: "{{ item.name }}"
  register: bao_cap_policy_reads
  delegate_to: localhost
  become: false

- name: Assert NO base capability leaf grants a control-plane / kernel path
  vars:
    # Concatenate every leaf's GRANT lines (reject `#` comment lines).
    cap_grants: >-
      {{ bao_cap_policy_reads.results
         | map(attribute='content') | map('b64decode')
         | map('regex_replace', '(?m)^#.*$', '') | join('\n') }}
  ansible.builtin.assert:
    that:
      - "'sys/policies' not in cap_grants"
      - "'auth/approle' not in cap_grants"
      - "'auth/token' not in cap_grants"
      - "'/secret-id' not in cap_grants"
      - "'secret/data/infra' not in cap_grants"
      - "'secret/metadata/infra' not in cap_grants"
      # Positive: the write leaves DO grant scoped create/update/delete/patch.
      - "'create\", \"update\", \"delete\", \"patch' in cap_grants"
    fail_msg: >-
      A base read-/write- capability leaf gained a self-escalation grant
      (policy edit / auth mint / secret-id / token mint / infra kernel), so
      every rollup composed from the leaves would inherit it.

# --- config mount: isolation, read-only, and the KV v2 metadata grant ------
# The whole point of a separate `config` mount is that its policy cannot
# reach the credential mounts, and the whole point of its version retention
# is history you can list and roll back to — which needs the `metadata/`
# prefix as well as `data/`. A policy that grants only `data/` renders and
# writes cleanly, then silently cannot list a single key, so assert both.
- name: Render the config-read policy
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../roles/openbao/templates/config-read-policy.hcl.j2"
    dest: /tmp/cap-config-read.hcl
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Slurp the rendered config-read policy back
  ansible.builtin.slurp:
    src: /tmp/cap-config-read.hcl
  register: bao_config_read_policy
  delegate_to: localhost
  become: false

- name: Assert the config-read policy is mount-isolated, read-only, and lists
  vars:
    # GRANT lines only — the `#` prose names the other mounts by design.
    config_grants: >-
      {{ bao_config_read_policy.content | b64decode
         | regex_replace('(?m)^#.*$', '') }}
  ansible.builtin.assert:
    that:
      # Reads the values, and reads AND lists the version history.
      - "'\"' ~ openbao_config_mount ~ '/data/*\"' in config_grants"
      - "'\"' ~ openbao_config_mount ~ '/metadata/*\"' in config_grants"
      # Root listing requests `<mount>/metadata` with no trailing segment,
      # which the glob above does not match.
      - "'\"' ~ openbao_config_mount ~ '/metadata\"' in config_grants"
      - "'list' in config_grants"
      # Mount isolation: it cannot name either credential mount.
      - "openbao_kv_mount ~ '/' not in config_grants"
      - "'secrets-external/' not in config_grants"
      # Read-only: no write verb anywhere in the grants.
      - "'create' not in config_grants"
      - "'update' not in config_grants"
      - "'delete' not in config_grants"
      - "'patch' not in config_grants"
      - "'sudo' not in config_grants"
    fail_msg: >-
      The config-read policy lost its mount isolation, gained a write
      capability, or dropped the KV v2 metadata grant it needs to list keys
      and reach version history.

# config-write may write VALUES but must never erase HISTORY. The two
# capabilities that erase it are `destroy` (permanent removal of specific
# versions) and `delete` on metadata/* (permanent removal of the key AND
# its whole history). Both would render and apply silently, so pin the
# metadata block to exactly read+list rather than merely grepping for a verb.
- name: Render the config-write policy
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../roles/openbao/templates/config-write-policy.hcl.j2"
    dest: /tmp/cap-config-write.hcl
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Slurp the rendered config-write policy back
  ansible.builtin.slurp:
    src: /tmp/cap-config-write.hcl
  register: bao_config_write_policy
  delegate_to: localhost
  become: false

- name: Assert config-write can author values but never erase history
  vars:
    write_grants: >-
      {{ bao_config_write_policy.content | b64decode
         | regex_replace('(?m)^#.*$', '') }}
  ansible.builtin.assert:
    that:
      # Authors values, including partial update.
      - "'create' in write_grants"
      - "'update' in write_grants"
      - "'patch' in write_grants"
      # Soft delete is paired with the ability to reverse it.
      - "'\"' ~ openbao_config_mount ~ '/undelete/*\"' in write_grants"
      # History is READ-ONLY: the metadata block is exactly read + list.
      - >-
        write_grants is search('path "' ~ openbao_config_mount
        ~ '/metadata/\\*" \\{\\s*capabilities = \\["read", "list"\\]\\s*\\}')
      # Neither history-erasing capability appears anywhere.
      - "'destroy' not in write_grants"
      - "'sudo' not in write_grants"
      # Mount isolation, same as the read policy.
      - "openbao_kv_mount ~ '/' not in write_grants"
      - "'secrets-external/' not in write_grants"
    fail_msg: >-
      config-write gained a history-erasing capability (destroy, or delete
      on metadata/*), lost its mount isolation, or lost the patch grant that
      keeps three independent authors from clobbering each other.

- name: Assert config-write is attached to all three IaC authors and nothing else
  vars:
    write_holders: >-
      {{ openbao_approles
         | selectattr('token_policies', 'defined')
         | selectattr('token_policies', 'contains',
                      openbao_config_write_policy_name)
         | map(attribute='name') | list }}
  ansible.builtin.assert:
    that:
      # OpenTofu and Ansible compose it onto their existing identity...
      - openbao_terraform_apply_approle_name in write_holders
      - openbao_ansible_converge_approle_name in write_holders
      # ...and nothing else does.
      - (write_holders | sort) == ([openbao_ansible_converge_approle_name,
                                    openbao_terraform_apply_approle_name] | sort)
      # Terrakube gets it through its JWT roles, not an AppRole — assert no
      # standalone config-write AppRole was minted as a shortcut.
      - openbao_config_write_policy_name
        not in (openbao_approles | map(attribute='name') | list)
      - openbao_config_write_terrakube_workspaces | length > 0
      # config-read stays a pure reader: it must never hold the write policy.
      - openbao_config_read_approle_name not in write_holders
    fail_msg: >-
      config-write attachment drifted: it must be composed onto exactly
      terraform-apply and ansible-converge, reach Terrakube via its JWT
      roles, and never exist as a standalone AppRole or land on config-read.

- name: Assert the declared KV mounts are distinct and the config mount is tuned
  ansible.builtin.assert:
    that:
      - (openbao_kv_mounts | map(attribute='path') | list | unique | length)
        == (openbao_kv_mounts | length)
      - openbao_config_mount in (openbao_kv_mounts | map(attribute='path') | list)
      - openbao_config_mount
        in (openbao_kv_tuned_mounts | map(attribute='path') | list)
      - (openbao_config_mount_max_versions | int) > 0
    fail_msg: >-
      openbao_kv_mounts has a duplicate path, or the config mount is missing
      or left on the KV v2 default retention — browsable version history is
      half the reason that mount exists.

- name: Read OpenBao defaults source for the remaining structural assertions
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../../roles/openbao/defaults/main.yml"
  register: bao_defaults_source
  delegate_to: localhost
  become: false

# The read-write-all rollup must be a union of ONLY the generated read-/write-
# base leaf names — never a hand-added admin/control policy — so it cannot
# smuggle in `ai-admin`, a terrakube policy, etc.
- name: Assert read-write-all is exactly the read-/write- leaves of the source list
  vars:
    rw_expected: >-
      {{ (openbao_ai_domains | map('regex_replace', '^(.+)$', 'read-\1') | list)
         + (openbao_ai_domains | map('regex_replace', '^(.+)$', 'write-\1') | list) }}
  ansible.builtin.assert:
    that:
      - (openbao_read_write_all_policies | sort) == (rw_expected | sort)
      # No member outside the read-/write- namespace (no admin/control policy).
      - (openbao_read_write_all_policies | select('match', '^(?!read-|write-).*') | list | length) == 0
    fail_msg: >-
      read-write-all contains a policy that is not a read-/write- base leaf of
      openbao_ai_domains — the composition could carry a control-plane grant.

# Every apply/admin actor role must carry NO standing secret_id — the
# human-gated model mints a single-use wrapped one on demand. Uses the RENDERED
# openbao_approles (Jinja-composed), covering the generated ai-apply-<svc>.
- name: Assert every apply/admin actor role carries no standing secret_id
  vars:
    gated_roles: >-
      {{ (openbao_ai_domains | map('regex_replace', '^(.+)$', 'ai-apply-\1') | list)
         + ['ai-apply-all', 'ai-admin'] }}
  ansible.builtin.assert:
    that:
      - >-
        openbao_approles
        | selectattr('name', 'in', gated_roles)
        | selectattr('manage_secret_id', 'equalto', false)
        | list | length == (gated_roles | length)
    fail_msg: "An apply/admin AI actor role (ai-apply-*/ai-admin) is missing manage_secret_id:false"

# ai-admin is the ONLY role permitted to self-modify (policy/auth/token). Prove
# it attaches its own standalone ai-admin policy, NOT the composed base leaves.
- name: Assert ai-admin is the sole self-modify role (standalone policy, not composed leaves)
  vars:
    admin_role: "{{ openbao_approles | selectattr('name', 'equalto', 'ai-admin') | first }}"
  ansible.builtin.assert:
    that:
      - admin_role.policy | default('') == 'ai-admin'
      - admin_role.token_policies is not defined
    fail_msg: "ai-admin must attach the standalone ai-admin policy, not composed base leaves."

- name: Assert all nine exact-claim Terrakube JWT roles are declared
  ansible.builtin.assert:
    that:
      - >-
        item in ((bao_defaults_source.content | b64decode | from_yaml).openbao_terrakube_workspaces
        | map(attribute='name', default='') | reject('equalto', '') | list)
    fail_msg: "Missing Terrakube JWT workspace declaration: {{ item }}"
  loop: "{{ openbao_terrakube_workspace_names }}"
