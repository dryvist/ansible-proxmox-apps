---
# --- Automated raft snapshot daemon (rendered when snapshot creds are set;
# converge.yml stubs them). The timer never starts under Docker, but the
# script/env/service/timer templates must all render. ---
- name: Stat the snapshot daemon files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/openbao-snapshot.sh
    - /etc/openbao/openbao-snapshot.env
    - /etc/systemd/system/openbao-snapshot.service
    - /etc/systemd/system/openbao-snapshot.timer
  register: bao_snap_files

- name: Assert the snapshot script, env, service, and timer all rendered
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "snapshot daemon file missing: {{ item.item }}"
  loop: "{{ bao_snap_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert the snapshot env file is 0600 (holds the AppRole creds)
  ansible.builtin.assert:
    that:
      - bao_snap_files.results[1].stat.mode == '0600'
    fail_msg: >-
      openbao-snapshot.env must be 0600
      ({{ bao_snap_files.results[1].stat.mode | default('absent') }})

- name: Read the rendered snapshot script
  ansible.builtin.slurp:
    src: /usr/local/bin/openbao-snapshot.sh
  register: bao_snap_script

- name: Assert the snapshot script leader-gates, verifies, and alerts
  ansible.builtin.assert:
    that:
      # Leader-gated: only the active node snapshots.
      - "'/v1/sys/leader' in (bao_snap_script.content | b64decode)"
      - "'is_self' in (bao_snap_script.content | b64decode)"
      - "'sys/leader unreachable' in (bao_snap_script.content | b64decode)"
      - "'no on-box IPv4' in (bao_snap_script.content | b64decode)"
      # Takes + integrity-checks the snapshot.
      - "'operator raft snapshot save' in (bao_snap_script.content | b64decode)"
      - "'gzip -t' in (bao_snap_script.content | b64decode)"
      # Least-privilege snapshot AppRole login, not a root token.
      - "'auth/approle/login' in (bao_snap_script.content | b64decode)"
      # Names the real cause. A missing binary used to surface as the
      # leader-gate message above, which points at the cluster instead.
      - "'required binary not installed' in (bao_snap_script.content | b64decode)"
    fail_msg: >-
      openbao-snapshot.sh missing leader-gate, snapshot-save, integrity,
      approle-login, or dependency-check logic

# The timer never starts under Docker, so nothing else here would notice the
# script being unrunnable. These two checks are what the live failure needed:
# the script parses, and every binary it declares is actually installed by the
# role. Deriving the list from the script's own marker means a new dependency
# is covered without editing this file.
- name: Syntax-check the rendered snapshot script and resolve its dependencies
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      bash -n /usr/local/bin/openbao-snapshot.sh || exit 1
      missing=""
      for bin in $(sed -n 's/^# requires: //p' /usr/local/bin/openbao-snapshot.sh); do
        command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"
      done
      printf '%s' "${missing# }"
    executable: /bin/bash
  register: bao_snap_deps
  changed_when: false

- name: Assert the role installed every binary the snapshot script calls
  ansible.builtin.assert:
    that:
      - bao_snap_deps.stdout | length == 0
    fail_msg: >-
      openbao-snapshot.sh declares binaries the role does not install:
      {{ bao_snap_deps.stdout }}. Every timer run fails on the first command
      that needs one.
    success_msg: openbao-snapshot.sh parses and every binary it declares is installed

# --- Table-driven credential rotators (openbao_rotators, defaults/main/09).
# converge.yml stubs creds for BOTH declared rows (slack-admin, splunk-mcp)
# so both render under the generic openbao-rotate-<name>.* naming. Same
# shape as the snapshot check above: file presence + perms here; the actual
# rotate-decision, CAS-adopt, and stamp BEHAVIOR is exercised (not just
# grepped for) by tests/openbao_slack_rotate/verify_rotate_logic.yml and
# tests/openbao_rotate/verify_splunk_mcp_logic.yml, which run the rendered
# scripts against a stubbed curl. ---
- name: Stat each active rotator's daemon files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/openbao-rotate-slack-admin.sh
    - /etc/openbao/openbao-rotate-slack-admin.env
    - /etc/systemd/system/openbao-rotate-slack-admin.service
    - /etc/systemd/system/openbao-rotate-slack-admin.timer
    - /usr/local/bin/openbao-rotate-splunk-mcp.sh
    - /etc/openbao/openbao-rotate-splunk-mcp.env
    - /etc/systemd/system/openbao-rotate-splunk-mcp.service
    - /etc/systemd/system/openbao-rotate-splunk-mcp.timer
  register: bao_rotate_files

- name: Assert every active rotator's script, env, service, and timer all rendered
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "rotator daemon file missing: {{ item.item }}"
  loop: "{{ bao_rotate_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert every active rotator's env file is 0600 (holds the AppRole creds)
  ansible.builtin.assert:
    that:
      - item.stat.mode == '0600'
    fail_msg: >-
      {{ item.item }} must be 0600 ({{ item.stat.mode | default('absent') }})
  loop: "{{ bao_rotate_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.item is search('\.env$')

# --- Old pre-table Slack-only rotator, retired ------------------------------
# roles/openbao/tasks/retire_slack_rotate.yml runs unconditionally alongside
# the deploy above. This scenario never had the old units to begin with (it
# converges straight onto the table-driven role), so this also proves the
# retirement task's stat-gated design is a true no-op when there is nothing
# to retire — it must NOT create, and must not error over the absence of,
# any of these four paths.
- name: Stat the old pre-table Slack-only rotator's paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/openbao-slack-rotate.sh
    - /etc/openbao/openbao-slack-rotate.env
    - /etc/systemd/system/openbao-slack-rotate.service
    - /etc/systemd/system/openbao-slack-rotate.timer
  register: bao_old_slack_rotate_files

- name: Assert the old pre-table Slack-only rotator's paths are ABSENT
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      {{ item.item }} exists — the old pre-table Slack-only rotator was
      never retired (or was re-created), which races the new
      openbao-rotate-slack-admin.timer for the same single-use Slack refresh
      token and the same KV path.
  loop: "{{ bao_old_slack_rotate_files.results }}"
  loop_control:
    label: "{{ item.item }}"

# --- Secret-age auditor daemon (rendered when secret-age-audit creds are
# set; converge.yml stubs them). Same shape as the snapshot check above:
# file presence + perms + the dedicated rsyslog shipping ruleset here; the
# actual age-classification, false-green, and alert-storm BEHAVIOR is
# exercised (not just grepped for) by
# tests/openbao_secret_age/verify_age_logic.yml and
# verify_age_logic_guards.yml, which run the rendered script against a
# stubbed bao/curl. ---
- name: Stat the secret-age auditor daemon files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/openbao-secret-age.sh
    - /etc/openbao/openbao-secret-age.env
    - /etc/systemd/system/openbao-secret-age.service
    - /etc/systemd/system/openbao-secret-age.timer
    - /etc/rsyslog.d/21-openbao-secret-age.conf
  register: bao_secret_age_files

- name: Assert the secret-age auditor's script, env, service, timer, and rsyslog conf all rendered
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "secret-age auditor file missing: {{ item.item }}"
  loop: "{{ bao_secret_age_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert the secret-age auditor env file is 0600 (holds the AppRole creds)
  ansible.builtin.assert:
    that:
      - bao_secret_age_files.results[1].stat.mode == '0600'
    fail_msg: >-
      openbao-secret-age.env must be 0600
      ({{ bao_secret_age_files.results[1].stat.mode | default('absent') }})
