---
# Molecule preparation for github_runner_arc — the scenario exercises only
# the disabled (github_runner_arc_enabled: false) path, so no package install
# happens in converge; this just brings the container to a ready state and
# points apt at the estate cache like every other prebuilt-image scenario.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Gather facts
      ansible.builtin.setup:

    - name: Point apt at the estate cache when one is declared
      ansible.builtin.include_tasks: ../resources/tasks/apt_proxy.yml
