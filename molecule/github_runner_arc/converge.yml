---
# Molecule converge for github_runner_arc.
#
# github_runner_arc_enabled defaults to false and is left at its default
# here: the role's every task sits behind that flag, so this proves the
# disabled path is a clean no-op (no k3s, no Helm, no privileged container)
# rather than standing up a real cluster in CI.

- name: Converge
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Include github_runner_arc role
      ansible.builtin.include_role:
        name: github_runner_arc
