---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

# github_runner_arc_enabled defaults to false, so this scenario exercises the
# disabled path only: the role must no-op cleanly (no k3s, no Helm, no
# privileged container) rather than actually standing up a cluster in CI.
# Unprivileged, no cgroup/tmpfs plumbing needed — nothing here touches systemd
# or a container runtime.
platforms:
  - name: github-runner-arc-test${CI_INSTANCE_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: github_runner_arc
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
