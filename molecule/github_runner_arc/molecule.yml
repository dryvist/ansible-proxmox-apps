---

# github_runner_arc_enabled defaults to false, so this scenario exercises the
# disabled path only: the role must no-op cleanly (no k3s, no Helm, no
# privileged container) rather than actually standing up a cluster in CI.
# Same platform shape as every other scenario on this image: its default
# command is systemd, which exits at once without the cgroup/tmpfs plumbing,
# leaving nothing for Ansible to connect to.
platforms:
  - name: github-runner-arc-test${CI_INSTANCE_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

scenario:
  name: github_runner_arc
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
