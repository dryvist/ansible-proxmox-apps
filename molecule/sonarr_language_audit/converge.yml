---
# Molecule converge for the sonarr_language_audit scenario.
#
# Runs the role with sonarr_language_audit_manage_services=false: package
# install and the script/unit render all execute, but enabling/starting the
# live timer is skipped — there is no running Sonarr in CI. verify.yml
# asserts on the deployed artifacts instead.

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    sonarr_language_audit_manage_services: false
    # Mirror load_tofu.yml so the role's tofu_data lookups resolve.
    tofu_data:
      domain: example.net
      constants:
        media_ports:
          sonarr_web: 8989

  tasks:
    - name: Include sonarr_language_audit role
      ansible.builtin.include_role:
        name: sonarr_language_audit
