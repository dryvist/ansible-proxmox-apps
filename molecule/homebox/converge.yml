---
# Converge the homebox role on one container with the database and the backups
# swapped out through variables. sqlite3 stands in for the shared Postgres
# cluster, and the backup units are not rendered. The binary install, the
# systemd unit, the environment file and the status-endpoint health check all
# run for real.
- name: Converge
  hosts: all
  become: true
  gather_facts: false

  vars:
    homebox_database_driver: sqlite3
    homebox_backup_enabled: false
    # Test-only value. It is not a secret, and the scenario reads none.
    homebox_api_key_pepper: "molecule-test-only-pepper-not-a-secret-0123456789abcdef"

  tasks:
    - name: Include homebox role
      ansible.builtin.include_role:
        name: homebox
