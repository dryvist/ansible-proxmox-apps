---
# Bring the test container to a ready state before converge.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        # A container that is going to answer does so in seconds; a longer
        # ceiling costs nothing on the healthy path, and a slow runner should
        # not fail before it is asked to do anything.
        timeout: 180

    - name: Wait for the instance to finish booting
      ansible.builtin.include_tasks: ../resources/tasks/wait_for_boot.yml

    - name: Gather facts
      ansible.builtin.setup:

    - name: Point apt at the estate cache when one is declared
      ansible.builtin.include_tasks: ../resources/tasks/apt_proxy.yml
