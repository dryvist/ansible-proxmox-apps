---
# Converge the homarr role with its committed pin. The install half takes no
# scenario-specific vars — the pin, the checksums and the artifact list are the
# role's own defaults, so it exercises exactly what production would.
#
# The configure/integrate half does need overrides, for two honest reasons:
#   - `tofu_data` does not exist here, so the API base and the integration
#     table (which derive host and port from the published inventory) have no
#     source. They are pinned to the container itself instead.
#   - There are no Sonarr/Radarr/Plex/Jellyseerr guests to connect to, and
#     Homarr connection-TESTS before it persists, so a fake integration could
#     not be created even in principle. The list is therefore empty and what
#     this scenario actually proves is the part the live guest can no longer
#     exercise: onboarding and API-key bootstrap from an EMPTY database.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    homarr_api_base: "http://127.0.0.1:7575"
    homarr_integrations: []
    homarr_admin_password: molecule-not-a-real-secret
    # dashboard_catalog reads tofu_data.ingress + PROXMOX_SUBDOMAIN, neither of
    # which exist here for the same reason homarr_integrations is empty above —
    # no published inventory in this scenario. One fixture route exercises the
    # real board-sync path instead of skipping it.
    dashboard_catalog_base_domain: molecule.test
    tofu_data:
      ingress:
        - name: molecule-fixture
          hostname: molecule-fixture
          ui: true
          group: other
          sso: false

  tasks:
    - name: Include homarr role
      ansible.builtin.include_role:
        name: homarr
