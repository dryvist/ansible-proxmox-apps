---
# Converge the homarr role with its committed pin. No scenario-specific vars:
# the pin, the checksums and the artifact list are the role's own defaults, so
# the scenario exercises exactly what production would.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Include homarr role
      ansible.builtin.include_role:
        name: homarr
