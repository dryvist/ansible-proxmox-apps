---
# Molecule scenario for the homarr role — the pilot for borrowing the
# community-scripts install layer.
#
# What this scenario is actually for: proving the PIN is enforced and the
# borrowed installer is fully offline-sourced after task 3. Verifying that
# Homarr serves a page is the easy half; the half worth a scenario is that a
# wrong checksum stops the converge and that no helper is fetched from `main`.
#
# The container is privileged with systemd because the borrowed installer
# creates and starts real units (redis-server, homarr). It needs outbound
# internet: the installer resolves the Homarr release and the Node build from
# upstream at run time, which is precisely the recipe-vs-artifact gap the ADR
# records — the scenario does not hide it.
#
# No secrets: the role reads none. Homarr's encryption key is generated in the
# guest by the installer, at the least-shared tier that needs it.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: homarr-test${CI_INSTANCE_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - homarr_group
      - lxc_containers

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles

verifier:
  name: ansible

scenario:
  name: homarr
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
