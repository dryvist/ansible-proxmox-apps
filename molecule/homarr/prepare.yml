---
# Bring the test container to a ready state before converge.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        # 30s was tight enough that a container which simply started slowly
        # under a loaded runner failed before it was ever asked to do
        # anything, reported as ok=0 and passing on a rerun. A container that
        # is going to answer does so in seconds, so a longer ceiling costs
        # nothing on the healthy path.
        timeout: 180

    - name: Gather facts
      ansible.builtin.setup:

    # No package seeding here on purpose. The prerequisites the borrowed
    # installer assumes are the ROLE's responsibility (task 0), because a
    # tofu-created container is just as bare as this one. Seeding them in the
    # fixture would hide that from the test.
