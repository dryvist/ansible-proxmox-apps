---
# The release the homarr-v2 guest pins, read from its host_vars rather than
# restated. playbook_dir is molecule/homarr (the shared playbooks).
homarr_version: >-
  {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../inventory/host_vars/homarr-v2.yml')
  | from_yaml).homarr_version }}

# One widget that renders alone and one whose integration does not exist here,
# so the converge exercises both the save and the skip.
homarr_widgets:
  clock:
    kind: clock
    size: {base: [3, 1], mobile: [3, 1]}
  health:
    kind: stats
    integrations: [gatus]
    stats_metrics: {gatus: [up]}
    size: {base: [3, 1], mobile: [3, 1]}

homarr_boards:
  - name: molecule
    columns: 12
    public: true
    home: true
    apps: true
    widgets: [clock, health]
