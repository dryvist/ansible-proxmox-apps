---
# The homarr scenario's playbooks against the 2.x line: same fixture, same
# assertions, plus the declarative boards (vars.yml, passed as extra vars so
# they also outrank the role defaults verify.yml loads).

platforms:
  - name: homarr-v2-test${CI_INSTANCE_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - homarr_group
      - lxc_containers

provisioner:
  name: ansible
  options:
    extra-vars: "@${MOLECULE_SCENARIO_DIRECTORY}/vars.yml"
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  playbooks:
    prepare: ../homarr/prepare.yml
    converge: ../homarr/converge.yml
    verify: ../homarr/verify.yml

scenario:
  name: homarr_v2
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
