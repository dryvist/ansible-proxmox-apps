---
# Molecule preparation for keepalived — bring the test containers to a ready
# state. The role renders config with keepalived_manage_services=false, so no
# package install is exercised here; this just ensures the connection + facts.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        # 30s was tight enough that a container which simply started slowly
        # under a loaded runner failed before it was ever asked to do
        # anything, reported as ok=0 and passing on a rerun. A container that
        # is going to answer does so in seconds, so a longer ceiling costs
        # nothing on the healthy path.
        timeout: 180

    - name: Gather facts
      ansible.builtin.setup:
