---
# Molecule preparation for the download_vpn scenario.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      register: _apt_update
      until: _apt_update is succeeded
      retries: 3
      delay: 10
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install base packages the role expects pre-present
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - iproute2
          - procps
          - systemd
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    # Live, /data is a bind-mount created host-side (media_lxc_features) as
    # root:media 2775; the role creates the qBittorrent profile tree there AS the
    # media-group service user via group-write, because container-root cannot
    # write the host-root-owned (idmap-unmapped) /data inode. This plain Docker
    # container has no idmap, so /data would default to root:root and the
    # service-user mkdir would EPERM. Stage /data to the same ownership/mode
    # contract so the group-write path the role relies on is actually exercised.
    - name: Stage the shared media group (mirrors the host-side idmap contract)
      ansible.builtin.group:
        name: media
        gid: 13000
        state: present

    - name: Stage /data as the host-side bind-mount contract (root:media, setgid)
      ansible.builtin.file:
        path: /data
        state: directory
        owner: root
        group: media
        mode: "2775"

    # Reproduce the exact live failure mode the LAN-IP derivation must
    # tolerate: a dummy interface named like the WireGuard tunnel, carrying a
    # documentation-range address (RFC 5737 TEST-NET-2 — not a real tunnel or
    # LAN value), present alongside the real LAN NIC (default route untouched,
    # so the rest of this scenario's networking is unaffected). A regression
    # that ever falls back to "any interface with an IPv4 address" instead of
    # excluding the tunnel by name fails verify.yml's assertion.
    - name: Add a dummy wg0 interface carrying a fake tunnel address (no route change)
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - ip link add wg0 type dummy
        - ip addr add 198.51.100.5/32 dev wg0
        - ip link set wg0 up
      changed_when: true
      failed_when: false  # tolerate re-prepare where wg0 already exists

    # The role consumes tofu_data.constants.media_ports and the host's
    # container_ip (normally injected by load_tofu.yml). Provide a minimal
    # stand-in so the role renders without the full tofu inventory.
    - name: Inject minimal tofu_data + inventory facts for the role
      ansible.builtin.set_fact:
        container_ip: "192.168.0.210"
        tofu_data:
          constants:
            media_ports:
              qbittorrent_web: 8080
              prowlarr_web: 9696
            notification_ports:
              ntfy_http: 8080
