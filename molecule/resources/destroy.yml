---
# Shared destroy playbook, referenced by every scenario's
# provisioner.playbooks.destroy so the retry below is declared once. Based on
# the molecule-plugins docker driver's own bundled destroy.yml, with the
# container-removal task made synchronous and retried instead of dispatched
# async: the daemon that removes a container here is shared by every
# scenario in the matrix, and a transient "tried to kill container, but did
# not receive an exit event" from a busy daemon otherwise fails the whole
# scenario instead of retrying.
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  tags:
    - always
  tasks:
    - name: Destroy molecule instance(s)
      vars:
        _docker_cert_dir: "{{ lookup('env', 'DOCKER_CERT_PATH') }}"
      community.docker.docker_container:
        name: "{{ item.name }}"
        docker_host: >-
          {{ item.docker_host
             | default(lookup('env', 'DOCKER_HOST') or 'unix://var/run/docker.sock') }}
        cacert_path: >-
          {{ item.cacert_path
             | default(_docker_cert_dir + '/ca.pem' if _docker_cert_dir else omit) }}
        cert_path: >-
          {{ item.cert_path
             | default(_docker_cert_dir + '/cert.pem' if _docker_cert_dir else omit) }}
        key_path: >-
          {{ item.key_path
             | default(_docker_cert_dir + '/key.pem' if _docker_cert_dir else omit) }}
        tls_verify: "{{ item.tls_verify | default(lookup('env', 'DOCKER_TLS_VERIFY')) or false }}"
        state: absent
        force_kill: "{{ item.force_kill | default(true) }}"
        keep_volumes: "{{ item.keep_volumes | default(true) }}"
        container_default_behavior: >-
          {{ item.container_default_behavior
             | default('compatibility' if ansible_version.full is version_compare('2.10', '>=') else omit) }}
      register: destroy_result
      until: destroy_result is succeeded
      retries: 3
      delay: 5
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: false

    # molecule-plugins' own molecule_get_docker_networks filter only
    # resolves for a playbook running from inside its own package (Ansible
    # discovers a filter_plugins/ directory relative to the playbook file),
    # so this reproduces its logic in native Jinja instead of vendoring it:
    # a docker_networks-declared network is kept as-is (extra keys and all)
    # with a labels key added if missing; a networks-declared network is
    # added only if no docker_networks entry already claimed that name --
    # matching the upstream filter exactly, quirks included (two platforms
    # both naming the same network only via `networks:` are NOT deduped
    # against each other, since only docker_networks entries populate the
    # dedup set).
    - name: Delete docker networks(s)
      ansible.builtin.include_tasks: tasks/delete_network.yml
      vars:
        _docker_networks: >-
          {%- set ns = namespace(list=[], names=[]) -%}
          {%- for platform in molecule_yml.platforms -%}
          {%- for net in platform.docker_networks | default([]) -%}
          {%- if net.name is defined -%}
          {%- set _ = ns.list.append(net | combine({'labels': net.labels | default({})})) -%}
          {%- set _ = ns.names.append(net.name) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- for net in platform.networks | default([]) -%}
          {%- if net.name is defined and net.name not in ns.names -%}
          {%- set _ = ns.list.append({'name': net.name, 'labels': {}}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ ns.list }}
      loop: "{{ _docker_networks }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: false
