---
# Point apt inside a test container at the estate's cache when the runner host
# hands one over (APT_PROXY_URL, rendered into the runner's env by
# roles/github_runner). Unset -- a developer workstation -- means go direct, so
# a scenario behaves the same everywhere and only its download time differs.
#
# Included from every scenario's prepare.yml. The scenarios that build from
# molecule/resources/Dockerfile.j2 get the same file baked into the image so
# the build-time apt runs are cached too.
- name: Point apt at the estate cache when one is declared
  when: lookup('env', 'APT_PROXY_URL') | length > 0
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01proxy
    content: |
      Acquire::http::Proxy "{{ lookup('env', 'APT_PROXY_URL') }}";
    owner: root
    group: root
    mode: "0644"
