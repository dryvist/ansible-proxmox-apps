---
# Included by ../destroy.yml, one iteration per molecule-managed network.
# Copied from the molecule-plugins docker driver's own bundled task of the
# same name -- unchanged, since only the container-removal task above needed
# a retry.
- name: Retrieve network info
  community.docker.docker_network_info:
    name: "{{ item.name }}"
  register: docker_netname

- name: Delete docker network(s)
  community.docker.docker_network:
    name: "{{ item.name }}"
    state: "absent"
  when:
    - docker_netname.exists
    - docker_netname.network.Labels.owner is defined
    - docker_netname.network.Labels.owner == 'molecule'
