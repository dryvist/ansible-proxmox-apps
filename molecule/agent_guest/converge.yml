---
# Molecule converge for the agent_guest scenario.
#
# The toolchain and Cribl Edge installs are tagged molecule-notest (skipped by
# molecule's --skip-tags) because they need apt repos, the npm registry and
# release tarballs. What is left is the surface worth testing: the autonomous
# config mirror renderers, the systemd units, and the no-sudo user contract.

- name: Converge
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Include agent_guest role
      ansible.builtin.include_role:
        name: agent_guest
