---
# Molecule preparation for the agent_guest scenario.

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install git (the role's hook wiring needs it; toolchain.yml is skipped here)
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
