---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: seerr-test
    # No stable version tags available; geerlingguy only publishes :latest
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    # Ceiling on shared docker-host: these containers are unbounded
    # siblings on one dockerd, not children of the runner's cgroup --
    # bound memory so a burst of concurrent scenarios can't OOM each
    # other. No CPU-limit key exists in this driver's platform schema
    # (molecule_plugins.docker.schema.driver.json) -- memory is the
    # only lever available here.
    memory: 1536m
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    groups:
      - seerr_group
      - lxc_containers

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  env:
    # Deterministic test key (32 hex). Real value comes from SOPS in production.
    SEERR_API_KEY: "${SEERR_API_KEY:-0123456789abcdef0123456789abcdef}"

verifier:
  name: ansible

scenario:
  name: seerr
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
