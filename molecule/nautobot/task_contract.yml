---
- name: Check Nautobot task command inputs
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check each Nautobot task file
      ansible.builtin.include_tasks: tasks/task_contract_tasks.yml
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../../roles/nautobot/tasks/*.yml') }}"
      loop_control:
        loop_var: nautobot_task_file
        label: "{{ nautobot_task_file | basename }}"
      vars:
        nautobot_tasks_to_check: "{{ lookup('ansible.builtin.file', nautobot_task_file) | from_yaml }}"
