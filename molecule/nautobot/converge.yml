---
# Converge the nautobot role with the live app layer disabled, once per server
# layer: the role's own (first play) and the collection server role (second
# play, the nautobot_collection_server group). Secrets are left empty to
# exercise the SECRET_KEY generate-once path; the DB password is a placeholder
# (no DB is contacted with nautobot_manage_app=false). These vars stand in for
# what group_vars/nautobot_group.yml supplies live.
- name: Converge the role's own server layer
  hosts: nautobot_group:!nautobot_collection_server
  become: true
  gather_facts: true

  vars:
    nautobot_manage_app: false
    # Seed assembly is gated on its own flag, not on nautobot_manage_app, so it
    # would run here. There is no resolved tofu inventory and no sibling-repo
    # source under molecule, so seed_bundle.yml's "at least one seed source"
    # assert would fail the scenario. It also stamps generated_at, which breaks
    # the idempotence check. Live converges build the bundle; molecule validates
    # the deterministic config/unit/redis/jobs layer.
    nautobot_build_seed: false
    nautobot_db_host: postgres.example.test
    nautobot_db_password: molecule-db-pw
    nautobot_ui_fqdn: nautobot.example.test
    nautobot_superuser_password: molecule-super-pw

  tasks:
    - name: Include nautobot role
      ansible.builtin.include_role:
        name: nautobot

# The same inputs, with the server layer owned by the collection. The server_*
# lines repeat the mapping in inventory/group_vars/nautobot_group.yml that the
# live converge uses, minus the OpenBao inputs: with nautobot_manage_app false
# the collection role never reads or writes OpenBao.
- name: Converge the server layer through the collection role
  hosts: nautobot_collection_server
  become: true
  gather_facts: true

  vars:
    nautobot_manage_app: false
    nautobot_build_seed: false
    nautobot_db_host: postgres.example.test
    nautobot_db_password: molecule-db-pw
    nautobot_ui_fqdn: nautobot.example.test
    nautobot_superuser_password: molecule-super-pw
    nautobot_server_via_collection: true
    server_root: "{{ nautobot_root }}"
    server_user: "{{ nautobot_user }}"
    server_group: "{{ nautobot_group }}"
    server_system_packages: "{{ nautobot_system_packages }}"
    server_version: "{{ nautobot_version }}"
    server_ssot_version: "{{ nautobot_ssot_version }}"
    server_device_onboarding_version: "{{ nautobot_device_onboarding_version }}"
    server_pip_packages: "{{ nautobot_pip_packages }}"
    server_plugins: "{{ nautobot_plugins }}"
    server_web_port: "{{ nautobot_web_port }}"
    server_web_bind: "{{ nautobot_web_bind }}"
    server_uwsgi_processes: "{{ nautobot_uwsgi_processes }}"
    server_uwsgi_threads: "{{ nautobot_uwsgi_threads }}"
    server_db_host: "{{ nautobot_db_host }}"
    server_db_port: "{{ nautobot_db_port }}"
    server_db_name: "{{ nautobot_db_name }}"
    server_db_user: "{{ nautobot_db_user }}"
    server_db_password: "{{ nautobot_db_password }}"
    server_redis_host: "{{ nautobot_redis_host }}"
    server_redis_port: "{{ nautobot_redis_port }}"
    server_ui_fqdn: "{{ nautobot_ui_fqdn }}"
    server_allowed_hosts: "{{ nautobot_allowed_hosts }}"
    server_trust_proxy_ssl_header: "{{ nautobot_trust_proxy_ssl_header }}"
    server_manage_app: "{{ nautobot_manage_app }}"
    server_manage_accounts: false
    server_secret_key: "{{ nautobot_secret_key }}"
    server_secret_key_file: "{{ nautobot_secret_key_file }}"
    server_env: "{{ nautobot_env_without_secret_key }}"
    server_superuser_name: "{{ nautobot_superuser_name }}"
    server_superuser_email: "{{ nautobot_superuser_email }}"
    server_superuser_password: "{{ nautobot_superuser_password }}"

  tasks:
    - name: Include nautobot role
      ansible.builtin.include_role:
        name: nautobot
