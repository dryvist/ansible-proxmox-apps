---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

platforms:
  - name: immich-test
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    command: ""
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The inner Docker daemon this scenario starts writes its image and
      # container layers here. Without these, that root is a directory on
      # the instance's own overlayfs rootfs, and the kernel does not accept
      # an overlay as the upper layer of another overlay: unpacking a layer
      # that carries a whiteout entry fails on the mknod that records it,
      # while layers without one extract normally. Anonymous volumes put the
      # root on the outer daemon's volume filesystem instead, and go away
      # with the instance.
      #
      # Both paths, because which one holds the layers depends on the image
      # store the inner daemon selected: the graph drivers keep them under
      # Docker's own root, the containerd image store under containerd's.
      - /var/lib/docker
      - /var/lib/containerd
    cgroupns_mode: host

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  env:
    IMMICH_DB_PASSWORD: "molecule-test-password"

verifier:
  name: ansible
