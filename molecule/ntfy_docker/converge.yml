---
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars.yml

  vars:
    # Docker-in-Docker requires vfs (fuse-overlayfs is unavailable in the test
    # container). Production keeps the docker_engine default.
    docker_engine_storage_driver: vfs

  tasks:
    - name: Include the ntfy_docker Zammad subscriber
      ansible.builtin.include_role:
        name: ntfy_docker
        tasks_from: zammad_subscriber
