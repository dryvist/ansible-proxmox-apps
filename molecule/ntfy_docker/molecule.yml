---
# Molecule scenario for the ntfy_docker role's Zammad subscriber. Converges
# only tasks/zammad_subscriber.yml: the ntfy CLI install, the subscriber env
# file, and the systemd unit. The role's docker_engine meta dependency runs
# with it, so the instance nests Docker. The ntfy server container and the Slack fan-out
# need a live Zammad and a live ntfy, so they are not exercised here.
#
# The Zammad connection is pinned to fixtures in vars.yml. No secrets.

platforms:
  - name: ntfy-docker-test${CI_INSTANCE_SUFFIX}
    image: geerlingguy/docker-debian12-ansible:latest
    privileged: true
    command: ""
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # docker_engine is a meta dependency of this role, so converge installs
      # and starts an inner Docker daemon. Its layers must not sit on the
      # instance's overlay rootfs; see tests/test_molecule_inner_docker_volumes.py.
      - /var/lib/docker
      - /var/lib/containerd
    cgroupns_mode: host

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
