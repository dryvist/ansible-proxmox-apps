---
# Molecule verification for servarr_wiring (defaults-contract layer).
#
# The role is almost entirely live API wiring (skipped in CI), so this verify
# guards the CONTRACTS the live run depends on:
#   1. Endpoint resolution reads each guest's DISCOVERED address off its own
#      interface (the coordinator runs behind the VPN and cannot resolve
#      internal FQDNs, so getting a real address here is load-bearing).
#   2. Ports come from the OpenTofu constants, never literals.
#   3. The auth policy pins a v4-valid method (never None).
#   4. Data dirs / owners match the app roles' install contract (the
#      config.xml delegation writes into these exact paths as these users).
#   5. At least one indexer is defined, and the download-client removal
#      settings stay off so the client keeps its data after import.
#   6. The private-tracker seed-criteria floor stays at or above parity.

- name: Verify
  hosts: all
  become: false
  gather_facts: false

  vars:
    # Same synthetic fixture as converge.yml — the defaults under test template
    # lazily against whatever tofu_data is in scope here.
    container_ip: "192.168.0.210"
    # The coordinator's own interface — what prowlarr_host resolves to.
    ansible_default_ipv4: { address: "192.168.0.210" }
    tofu_data:
      containers: {}
      constants:
        media_ports:
          sonarr_web: 8989
          radarr_web: 7878
          prowlarr_web: 9696
          qbittorrent_web: 8080

  tasks:
    # Sonarr/Radarr are leased guests: nothing declares their address, so the
    # role reads it off each guest's own gathered facts. Add them as real
    # inventory hosts carrying that fact — `hostvars` is read-only and cannot be
    # faked with a play var, and going through the real lookup is the stronger
    # test anyway. `sonarr-nofacts` stands in for a guest whose facts were never
    # gathered, exercising the fallback to the inventory name.
    - name: Add stand-in target guests carrying their discovered address
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: servarr_wiring_fixture
        ansible_default_ipv4: "{{ item.addr | default(omit) }}"
        container_ip: "{{ item.fqdn | default(omit) }}"
      loop:
        - { name: sonarr, addr: { address: "192.168.0.212" } }
        - { name: radarr, addr: { address: "192.168.0.213" } }
        - { name: sonarr-nofacts, fqdn: "sonarr.example.net" }
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Load the role defaults (the contract under test)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/servarr_wiring/defaults/main.yml"

    - name: Assert endpoint hosts resolve to each guest's discovered address
      ansible.builtin.assert:
        that:
          - servarr_wiring_sonarr_host == '192.168.0.212'
          - servarr_wiring_radarr_host == '192.168.0.213'
          # Prowlarr is co-located, so it is this host's own interface.
          - servarr_wiring_prowlarr_host == '192.168.0.210'
        fail_msg: "endpoint host resolution no longer reads the guest's own address"

    - name: Assert resolution falls back to the inventory name without gathered facts
      vars:
        # Same expression as the role default, against the facts-less stand-in.
        _fallback_host: >-
          {{ hostvars['sonarr-nofacts'].ansible_default_ipv4.address
             | default(hostvars['sonarr-nofacts'].container_ip, true) }}
      ansible.builtin.assert:
        that:
          - _fallback_host == 'sonarr.example.net'
        fail_msg: "endpoint resolution no longer falls back to the inventory name"

    - name: Assert ports come from the OpenTofu constants
      ansible.builtin.assert:
        that:
          - servarr_wiring_sonarr_port | int == tofu_data.constants.media_ports.sonarr_web
          - servarr_wiring_radarr_port | int == tofu_data.constants.media_ports.radarr_web
          - servarr_wiring_prowlarr_port | int == tofu_data.constants.media_ports.prowlarr_web
        fail_msg: "*arr ports drifted from the tofu constants"

    - name: Assert the auth policy is a v4-valid method (never None)
      ansible.builtin.assert:
        that:
          - servarr_wiring_auth_method in ['Forms', 'Basic', 'External']
          - servarr_wiring_auth_required in ['Enabled', 'DisabledForLocalAddresses']
        fail_msg: >-
          servarr_wiring_auth_method/_required must be a combination *arr v4
          accepts — AuthenticationMethod=None walls off the UI.

    - name: Assert data dirs and owners match the app roles' install contract
      ansible.builtin.assert:
        that:
          - servarr_wiring_sonarr_data_dir == '/var/lib/sonarr'
          - servarr_wiring_radarr_data_dir == '/var/lib/radarr'
          - servarr_wiring_prowlarr_data_dir == '/var/lib/prowlarr'
          - servarr_wiring_sonarr_user == 'media'
          - servarr_wiring_radarr_user == 'media'
          - servarr_wiring_prowlarr_user == 'qbittorrent'
          - servarr_wiring_group == 'media'
        fail_msg: >-
          servarr_wiring's data-dir/owner contract drifted from the app roles —
          the delegated config.xml writes would land on the wrong path or owner.

    # Seeding policy lives in roles/download_vpn's global share limits and is
    # asserted in that scenario, not here.
    - name: Assert indexer presence and sync contract
      ansible.builtin.assert:
        that:
          # Without an indexer, Prowlarr syncs nothing and the *arrs find nothing.
          - servarr_wiring_prowlarr_indexers | length >= 1
          - servarr_wiring_indexer_app_profile_id | int >= 1
          - servarr_wiring_sync_level in ['disabled', 'addOnly', 'fullSync']
        fail_msg: "indexer contract regressed"

    - name: Assert download client removal settings keep seeding after import
      ansible.builtin.assert:
        that:
          - servarr_wiring_remove_completed_downloads == false
          - servarr_wiring_remove_failed_downloads == false
        fail_msg: "download client removal-on-import contract regressed"

    - name: Assert the private-tracker safety floor stays enforceable
      ansible.builtin.assert:
        that:
          - servarr_wiring_private_indexer_min_seed_time_minutes | int > 0
          - servarr_wiring_private_indexer_min_seed_ratio | float >= 1.0
        fail_msg: "private-tracker seed-criteria floor regressed"

    - name: Assert the built-in updater is enabled with a non-package mechanism
      ansible.builtin.assert:
        that:
          - servarr_wiring_update_automatically == true
          - servarr_wiring_update_mechanism == 'BuiltIn'
        fail_msg: >-
          servarr_wiring_update_automatically/_mechanism regressed — each app
          installs from a rolling tarball URL and only extracts once, so
          without the built-in updater enabled it never reaches upstream latest.

    - name: Assert import safety knobs stay sane
      ansible.builtin.assert:
        that:
          # The recycler must share the /data volume (atomic moves) and the
          # min-free-space floor must keep real headroom.
          - servarr_wiring_recycler_bin_path is match('^/data/')
          - servarr_wiring_recycler_bin_days | int >= 0
          - servarr_wiring_min_free_space_mb | int >= 1024
        fail_msg: "recycler-bin/min-free-space import safety contract regressed"
