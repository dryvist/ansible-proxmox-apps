---
# Bring the three test containers to a ready state before converge: wait for
# connectivity, then seed a local self-signed CA + per-node certificates at
# the exact paths patroni_etcd_tls.yml expects. There is no live OpenBao PKI
# endpoint in CI (same boundary the default postgres scenario already draws
# around the pgBackRest S3 endpoint) — pre-seeding valid, long-lived certs
# means patroni_etcd_tls.yml's own "already valid, skip reissue" idempotency
# check is what runs during converge, never an actual call to
# postgres_ha_pki_addr, so the etcd/Patroni cluster itself still forms with
# real TLS between real member processes.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  vars:
    postgres_ha_etcd_tls_dir: /etc/etcd/tls
    postgres_ha_etcd_user: etcd

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Wait for the instance to finish booting
      ansible.builtin.include_tasks: ../resources/tasks/wait_for_boot.yml

    - name: Gather facts
      ansible.builtin.setup:

    - name: Point apt at the estate cache when one is declared
      ansible.builtin.include_tasks: ../resources/tasks/apt_proxy.yml

    # Creates the etcd system user (postinst), so the cert files below can be
    # owned correctly before etcd itself is configured in converge.
    - name: Install etcd so its system user exists
      ansible.builtin.apt:
        name: etcd-server
        state: present
        update_cache: true

    - name: Ensure the etcd TLS directory exists
      ansible.builtin.file:
        path: "{{ postgres_ha_etcd_tls_dir }}"
        state: directory
        owner: "{{ postgres_ha_etcd_user }}"
        group: "{{ postgres_ha_etcd_user }}"
        mode: "0750"

    # A fresh unique scratch dir per run (not a fixed /tmp path — a fixed name
    # here would race a concurrent CI job on the same runner).
    - name: Create a scratch directory for the test CA on the controller
      ansible.builtin.tempfile:
        state: directory
        prefix: molecule-postgres-patroni-ca-
      register: postgres_ha_test_ca_dir
      delegate_to: localhost
      become: false
      run_once: true

    - name: Generate the test CA key and self-signed certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -days
          - "3650"
          - -subj
          - /CN=molecule-postgres-patroni-ca
          - -keyout
          - "{{ postgres_ha_test_ca_dir.path }}/ca-key.pem"
          - -out
          - "{{ postgres_ha_test_ca_dir.path }}/ca.pem"
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: true

    - name: Generate this node's key and certificate signing request
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -newkey
          - rsa:2048
          - -nodes
          - -subj
          - "/CN={{ inventory_hostname }}"
          - -keyout
          - "{{ postgres_ha_test_ca_dir.path }}/{{ inventory_hostname }}-key.pem"
          - -out
          - "{{ postgres_ha_test_ca_dir.path }}/{{ inventory_hostname }}.csr"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Sign this node's certificate with the test CA
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -req
          - -in
          - "{{ postgres_ha_test_ca_dir.path }}/{{ inventory_hostname }}.csr"
          - -CA
          - "{{ postgres_ha_test_ca_dir.path }}/ca.pem"
          - -CAkey
          - "{{ postgres_ha_test_ca_dir.path }}/ca-key.pem"
          - -CAcreateserial
          - -days
          - "3650"
      delegate_to: localhost
      become: false
      register: postgres_ha_test_cert_signed
      changed_when: true

    - name: Write the signed certificate on the controller
      ansible.builtin.copy:
        content: "{{ postgres_ha_test_cert_signed.stdout }}\n"
        dest: "{{ postgres_ha_test_ca_dir.path }}/{{ inventory_hostname }}-cert.pem"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Push the CA certificate to this node
      ansible.builtin.copy:
        src: "{{ postgres_ha_test_ca_dir.path }}/ca.pem"
        dest: "{{ postgres_ha_etcd_tls_dir }}/ca.pem"
        owner: "{{ postgres_ha_etcd_user }}"
        group: "{{ postgres_ha_etcd_user }}"
        mode: "0644"

    - name: Push this node's certificate and key
      ansible.builtin.copy:
        src: "{{ postgres_ha_test_ca_dir.path }}/{{ item.src }}"
        dest: "{{ postgres_ha_etcd_tls_dir }}/{{ item.dest }}"
        owner: "{{ postgres_ha_etcd_user }}"
        group: "{{ postgres_ha_etcd_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ inventory_hostname }}-cert.pem", dest: cert.pem, mode: "0644" }
        - { src: "{{ inventory_hostname }}-key.pem", dest: key.pem, mode: "0600" }
      loop_control:
        label: "{{ item.dest }}"

    - name: Remove the controller-side scratch directory
      ansible.builtin.file:
        path: "{{ postgres_ha_test_ca_dir.path }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
