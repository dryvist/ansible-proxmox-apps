---
# Converge all three containers as one Patroni/etcd cluster. Vars below stand
# in for what a real postgres_ai_group.yml-style group_vars file supplies live
# (bao-derived passwords, the real ai-VLAN replication CIDR, a real OpenBao
# PKI endpoint) — see prepare.yml for why the PKI endpoint itself is never
# actually reached in this scenario.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    postgres_ha_manager: patroni
    postgres_cluster_group: postgres_patroni_test_group
    postgres_primary_host: ""
    # postgres_ha_scope derives to "postgres-patroni-test" (postgres_group.yml
    # -> strip _group -> replace _ with -). patroni_prereqs.yml now asserts
    # this cluster's scope is a member of postgres_ha_patroni_scopes, and
    # roles/openbao's 07b-etcd-pki-engine.yml derives openbao_pki_etcd_engines
    # from the same list — a real cluster declares its scope in
    # inventory/group_vars/all.yml; this scenario declares its own here.
    postgres_ha_patroni_scopes:
      - postgres-patroni-test

    # ponytail: 0.0.0.0/0 is deliberately broad — this is an isolated,
    # single-scenario Docker network with no other tenant, not a live VLAN.
    # A real cluster's group_vars always supplies a real subnet CIDR
    # (NETWORK_CIDR_AI); molecule has no equivalent to derive one from.
    postgres_replication_cidr: 0.0.0.0/0

    postgres_replication_password: molecule-replication-pw
    postgres_ha_etcd_root_password: molecule-etcd-root-pw
    # Set directly, same as the three passwords above: this one is normally
    # generated at converge time against a real per-cluster OpenBao KV path
    # (patroni_etcd_credential.yml), which would otherwise dial the fake
    # postgres_ha_bao_addr below. A non-empty value here short-circuits that
    # task file's own generate-if-absent gate.
    postgres_ha_etcd_patroni_password: molecule-patroni-dcs-pw
    postgres_ha_patroni_api_password: molecule-patroni-api-pw
    postgres_ha_superuser_password: molecule-superuser-pw

    # Non-empty but unreachable: patroni_prereqs.yml only asserts these are
    # SET. Nothing ever dials out on them: patroni_etcd_tls.yml and
    # patroni_client_tls.yml never reissue because prepare.yml already
    # seeded valid certificates (see that file's "already valid, skip
    # reissue" checkend gate), and patroni_etcd_credential.yml is short-
    # circuited by postgres_ha_etcd_patroni_password above -- each task
    # file's own ansible-converge login only runs when its own gate decides
    # a real OpenBao call is needed, so this fake identity is never actually
    # presented to a server.
    postgres_ha_bao_addr: "https://molecule-pki.invalid:8200"
    postgres_ha_bao_role_id: molecule-fake-role-id
    postgres_ha_bao_secret_id: molecule-fake-secret-id

    # The object-storage PITR tier needs a real S3-compatible endpoint the
    # default postgres scenario already cannot supply in CI; same boundary
    # here. Template rendering for the pgBackRest+Patroni integration
    # (patroni.yml.j2's pgbackrest/archive_command sections) is covered by
    # tests/template_render/verify_templates.yml instead, which needs no
    # endpoint.
    postgres_pgbackrest_enabled: false

    postgres_managed_databases:
      - name: patroni_test
        user: patroni_test
        password: molecule-patroni-test-db-pw
        client_cidr: 0.0.0.0/0
        extensions: [vector]

  tasks:
    - name: Converge the postgres role, diagnosing any etcd/Patroni service
        failure via journalctl before failing the play
      block:
        - name: Include postgres role
          ansible.builtin.include_role:
            name: postgres
      rescue:
        # ponytail: dumped only on failure, never on a clean converge — a
        # unit that never started has no useful journal without this, and
        # the systemd module's own error message only names the symptom
        # ("timeout was exceeded"), not the cause.
        - name: Capture etcd's own journal for diagnosis
          ansible.builtin.command:
            cmd: journalctl -xeu etcd --no-pager -n 200
          register: postgres_ha_debug_etcd_journal
          changed_when: false
          failed_when: false

        - name: Show etcd's journal
          ansible.builtin.debug:
            var: postgres_ha_debug_etcd_journal.stdout_lines

        - name: Capture patroni's own journal for diagnosis
          ansible.builtin.command:
            cmd: journalctl -xeu patroni --no-pager -n 200
          register: postgres_ha_debug_patroni_journal
          changed_when: false
          failed_when: false

        - name: Show patroni's journal
          ansible.builtin.debug:
            var: postgres_ha_debug_patroni_journal.stdout_lines

        - name: Re-raise the original converge failure
          ansible.builtin.fail:
            msg: "postgres role converge failed — see the journal dumps above."
