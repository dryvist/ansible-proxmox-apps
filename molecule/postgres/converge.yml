---
# Converge the postgres role with a local-only listener and a single managed
# database (nautobot). The client CIDR is loopback so the verify play can prove
# scram auth over TCP without a second host. These vars stand in for what
# group_vars/postgres_group.yml supplies live (bao password, data-VLAN address,
# apps-subnet CIDR).
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    postgres_listen_addresses: localhost
    # Make this single container its own primary so the replication/slot block
    # runs. No second container exists, so pin the expected-standby slot list
    # rather than deriving it from group membership. This is what lets the
    # verify play assert the slot create + orphan reconcile behaviour.
    postgres_primary_host: postgres-test
    postgres_replication_password: molecule-replication-pw
    postgres_expected_replication_slots:
      - standby_fake_standby
    # The object-storage PITR tier is on by default, and the role asserts an S3
    # endpoint and credentials are set before configuring it. CI has no
    # S3-compatible endpoint to point at, so this scenario cannot satisfy that
    # by construction. The template's rendering is covered instead by
    # tests/template_render/verify_templates.yml, which needs no endpoint.
    postgres_pgbackrest_enabled: false
    # The slot above is deliberately fake and there is no second container, so
    # nothing can ever stream to it. The converge-time topology assertion
    # requires a real peer, so it is unsatisfiable here by construction — not
    # flaky, not a bug being papered over. It stays ON everywhere real.
    postgres_assert_topology: false
    # Standby-puller trust. Live this comes from POSTGRES_STANDBY_SSH_PUBKEYS;
    # pinned here so the verify play can prove the key lands RESTRICTED — an
    # unrestricted root key on every database guest is the failure this guards.
    postgres_standby_pull_pubkeys: >-
      ssh-ed25519
      AAAAC3NzaC1lZDI1NTE5AAAAIKmMoleculeFakePullKeyForTestingOnly00000000
      postgres-standby-pull
    postgres_managed_databases:
      - name: nautobot
        user: nautobot
        password: molecule-nautobot-pw
        client_cidr: 127.0.0.1/32

  tasks:
    - name: Include postgres role
      ansible.builtin.include_role:
        name: postgres
