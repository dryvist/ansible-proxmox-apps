---
# YAML-only source contract for the narrow Phase 4 tag. Run this play with
# `--tags postgres_roles_contract` to verify it without a Molecule container.
- name: Verify postgres_roles tag contract
  hosts: localhost
  connection: local
  gather_facts: false
  tags:
    - postgres_roles_contract
  vars:
    postgres_role_path: "{{ playbook_dir }}/../../roles/postgres"
    postgres_main_tasks_path: "{{ playbook_dir }}/../../roles/postgres/tasks/main.yml"
    postgres_phase4_tasks_path: "{{ playbook_dir }}/../../roles/postgres/tasks/main/roles_and_databases.yml"
    postgres_version_discovery_path: "{{ postgres_role_path }}/tasks/main/discover_cluster_version.yml"
    postgres_phase4_task_name: Phase 4 -- provision managed roles, databases, and pg_hba
  tasks:
    - name: Check the Phase 4 task file exists
      ansible.builtin.stat:
        path: "{{ postgres_phase4_tasks_path }}"
      register: postgres_phase4_task_file

    - name: Assert the Phase 4 task file exists
      ansible.builtin.assert:
        that:
          - postgres_phase4_task_file.stat.exists
        quiet: true

    - name: Read the PostgreSQL task files as YAML
      ansible.builtin.set_fact:
        postgres_main_tasks: >-
          {{ lookup('ansible.builtin.file', postgres_main_tasks_path) | from_yaml }}
        postgres_phase4_tasks: >-
          {{ lookup('ansible.builtin.file', postgres_phase4_tasks_path) | from_yaml }}
        postgres_version_discovery_tasks: >-
          {{ lookup('ansible.builtin.file', postgres_version_discovery_path) | from_yaml }}

    - name: Assert postgres_roles selects only the static Phase 4 import
      ansible.builtin.assert:
        that:
          - postgres_roles_tagged_tasks | length == 1
          - postgres_roles_tagged_tasks[0].name == postgres_phase4_task_name
          - postgres_roles_tagged_tasks[0]['ansible.builtin.import_tasks'] == 'main/roles_and_databases.yml'
          - postgres_roles_tagged_tasks | map(attribute='name') | list == [postgres_phase4_task_name]
        quiet: true
      vars:
        postgres_roles_tagged_tasks: >-
          {{ postgres_main_tasks
             | selectattr('tags', 'defined')
             | selectattr('tags', 'contains', 'postgres_roles')
             | list }}

    - name: Assert Phase 4 tasks are not tagged never
      ansible.builtin.assert:
        that:
          - "'never' not in phase4_task_tags"
        quiet: true
      vars:
        phase4_tasks_with_blocks: >-
          {{ postgres_phase4_tasks
             + (postgres_phase4_tasks | map(attribute='block', default=[]) | flatten) }}
        phase4_task_tags: >-
          {{ phase4_tasks_with_blocks
             | selectattr('tags', 'defined')
             | map(attribute='tags')
             | flatten }}

    - name: Assert the tags-only path discovers the PostgreSQL major before its guard
      ansible.builtin.assert:
        that:
          - postgres_phase4_tasks[0]['ansible.builtin.import_tasks'] == 'discover_cluster_version.yml'
          - "'postgres_roles' in postgres_phase4_tasks[0].tags"
          - "'postgres_cluster_version' in (postgres_phase4_tasks[0].when | string)"
          - postgres_phase4_tasks[1]['ansible.builtin.assert'] is defined
          - >-
            postgres_phase4_tasks[1]['ansible.builtin.assert']['that']
            | join(' ') is search('postgres_cluster_version')
          - postgres_version_discovery_tasks[0]['ansible.builtin.command'].argv == ['psql', '--version']
          - postgres_version_discovery_tasks[1]['ansible.builtin.set_fact'].postgres_cluster_version is defined
          - postgres_version_discovery_tasks[0].check_mode is false
          - postgres_version_discovery_tasks[0].changed_when is false
          - postgres_version_discovery_tasks[0].failed_when is false
        quiet: true

    - name: Assert read-only probes run in check mode
      ansible.builtin.assert:
        that:
          - >-
            (postgres_check_mode_tasks
             | selectattr('name', 'equalto', item.name)
             | selectattr('check_mode', 'defined')
             | selectattr('check_mode', 'equalto', false)
             | list | length) == 1
        fail_msg: "{{ item.file }}: {{ item.name }} must set check_mode: false"
        quiet: true
      vars:
        postgres_check_mode_task_file: >-
          {{ lookup('ansible.builtin.file', postgres_role_path ~ '/' ~ item.file) | from_yaml }}
        postgres_check_mode_tasks: >-
          {{ [postgres_check_mode_task_file,
              postgres_check_mode_task_file | map(attribute='block', default=[]) | flatten] | flatten }}
      loop:
        - file: tasks/main/discover_cluster_version.yml
          name: Discover installed PostgreSQL major
        - file: tasks/main/cluster_config.yml
          name: List the bound PostgreSQL sockets
        - file: tasks/main/cluster_config.yml
          name: Re-read the bound PostgreSQL sockets after the repair restart
        - file: tasks/main/patroni_adopt.yml
          name: Record the system identifier before adoption (comparison baseline)
        - file: tasks/main/patroni_adopt.yml
          name: Record the system identifier after adoption
        - file: tasks/main/patroni_client_tls.yml
          name: Check whether Patroni's client certificate is nearing expiry
        - file: tasks/main/patroni_etcd.yml
          name: Check the installed etcd version
        - file: tasks/main/patroni_etcd.yml
          name: Wait for this etcd member to answer over TLS
        - file: tasks/main/patroni_etcd_auth.yml
          name: Check whether the etcd root user already exists
        - file: tasks/main/patroni_etcd_tls.yml
          name: Check whether the existing certificate is nearing expiry
        - file: tasks/pgbackrest.yml
          name: Check whether the stanza already holds a base backup
      loop_control:
        label: "{{ item.file }}: {{ item.name }}"

# Verify the cluster is up, the nautobot role can authenticate over TCP with
# scram from its allowed CIDR, the database exists and is owned correctly, and
# the backup timer is scheduled.
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  vars:
    nautobot_db_password: molecule-nautobot-pw
    postgres_cluster_name: main
    # This play re-runs the role (see the reconcile task below), so it needs
    # the same override converge.yml carries: the PITR tier is on by default
    # and asserts an S3 endpoint CI cannot supply. Set at play level so any
    # future role re-run inherits it rather than rediscovering this.
    postgres_pgbackrest_enabled: false
    drill_managed_databases:
      - name: nautobot
        user: nautobot
        password: molecule-nautobot-pw
        client_cidr: 127.0.0.1/32

  tasks:
    - name: Discover installed PostgreSQL major
      ansible.builtin.command:
        argv:
          - psql
          - --version
      register: postgres_psql_version
      changed_when: false

    - name: Set PostgreSQL config directory
      ansible.builtin.set_fact:
        postgres_conf_dir: >-
          /etc/postgresql/{{
            postgres_psql_version.stdout | regex_search('[0-9]+')
          }}/{{ postgres_cluster_name }}

    - name: Ping the cluster as the postgres superuser
      become: true
      become_user: postgres
      community.postgresql.postgresql_ping:
        login_db: postgres
      register: postgres_ping
      changed_when: false

    - name: Assert the cluster answered
      ansible.builtin.assert:
        that:
          - postgres_ping.is_available | bool
        fail_msg: "PostgreSQL did not answer postgresql_ping"

    - name: Connect as the nautobot role over TCP with scram
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        login_user: nautobot
        login_password: "{{ nautobot_db_password }}"
        login_db: nautobot
        query: "SELECT current_user AS who, current_database() AS db"
      register: nautobot_conn
      changed_when: false

    - name: Assert the nautobot role reached its own database
      ansible.builtin.assert:
        that:
          - nautobot_conn.query_result[0].who == 'nautobot'
          - nautobot_conn.query_result[0].db == 'nautobot'
        fail_msg: "nautobot role could not authenticate to the nautobot database over TCP"

    - name: Read pg_hba.conf
      ansible.builtin.slurp:
        src: "{{ postgres_conf_dir }}/pg_hba.conf"
      register: pg_hba

    - name: Assert pg_hba carries the scram rule for nautobot
      ansible.builtin.assert:
        that:
          - "'nautobot' in hba"
          - "'scram-sha-256' in hba"
        fail_msg: "pg_hba.conf is missing the scram host rule for nautobot"
      vars:
        hba: "{{ pg_hba.content | b64decode }}"

    - name: Stat the backup timer unit
      ansible.builtin.stat:
        path: /etc/systemd/system/pg-backup.timer
      register: pg_backup_timer

    - name: Assert the backup timer is installed
      ansible.builtin.assert:
        that:
          - pg_backup_timer.stat.exists
        fail_msg: "pg-backup.timer was not installed"

    # --- Replication-slot orphan reconcile (Zammad #17050) ---
    # converge created standby_fake_standby (the one expected standby). Seed a
    # stale slot with no matching standby, re-run the role, and prove the
    # reconcile drops the orphan while keeping the expected (also inactive) slot.
    - name: Gather facts before re-running the role
      ansible.builtin.setup:

    - name: Seed a stale orphan physical slot with no matching standby
      become: true
      become_user: postgres
      community.postgresql.postgresql_slot:
        name: standby_stale_orphan
        slot_type: physical
        state: present

    - name: Re-run the role so the primary reconcile drops the orphan
      ansible.builtin.include_role:
        name: postgres
      vars:
        postgres_listen_addresses: localhost
        postgres_primary_host: "{{ inventory_hostname }}"
        postgres_replication_password: molecule-replication-pw
        postgres_expected_replication_slots:
          - standby_fake_standby
        # Same reason as converge.yml: the slot above is deliberately fake and
        # there is no second container, so the converge-time topology assertion
        # is unsatisfiable here by construction. This re-run exercises the
        # orphan-slot reconcile, not replication health.
        postgres_assert_topology: false
        postgres_managed_databases:
          - name: nautobot
            user: nautobot
            password: molecule-nautobot-pw
            client_cidr: 127.0.0.1/32

    - name: Query physical replication slots after reconcile
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: postgres
        query: "SELECT slot_name FROM pg_replication_slots WHERE slot_type = 'physical'"
      register: postgres_slots_after
      changed_when: false

    # A genuinely active=true slot needs a streaming standby, impossible
    # single-node. The expected-but-inactive standby_fake_standby covers the same
    # keep-guard (active=false slots that ARE expected must survive) that protects
    # a live standby briefly down; add a two-container scenario only if it regresses.
    - name: Assert the orphan was dropped and the expected slot kept
      ansible.builtin.assert:
        that:
          - "'standby_stale_orphan' not in slot_names"
          - "'standby_fake_standby' in slot_names"
        fail_msg: >-
          reconcile did not drop the orphan or dropped an expected slot;
          slots present: {{ slot_names }}
      vars:
        slot_names: "{{ postgres_slots_after.query_result | map(attribute='slot_name') | list }}"

    - name: Read root's authorized_keys
      ansible.builtin.slurp:
        src: /root/.ssh/authorized_keys
      register: postgres_root_authorized_keys

    # The pull key is a standing credential on every database guest, so the
    # restriction is the whole of its safety. Without key_options the same key
    # is an unrestricted root shell; that renders as a line STARTING with the
    # key type, which is what the first assertion catches.
    - name: Assert the standby puller's key is installed under a forced command
      ansible.builtin.assert:
        that:
          - "not (authorized_keys_text is search('(?m)^ssh-ed25519 '))"
          - "'restrict,command=\"rrsync -ro ' ~ backup_dir ~ '\"' in authorized_keys_text"
          - "'postgres-standby-pull' in authorized_keys_text"
        fail_msg: >-
          the standby puller's key is missing or UNRESTRICTED in
          /root/.ssh/authorized_keys
      vars:
        authorized_keys_text: "{{ postgres_root_authorized_keys.content | b64decode }}"
        # Spelled out rather than read from postgres_backup_dir: a verify play
        # does not include the role, so its defaults are not in scope here.
        backup_dir: /var/lib/postgresql/backups

    # --- DR restore drill (docs/DATABASE_DR_STANDARD.md) ---
    # The role is included for its defaults; dr_restore.yml is included directly
    # because its never/dr_restore tags only apply on the import in pitr_and_dr.yml.
    - name: Seed rows in the live nautobot database for the drill to compare
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: nautobot
        query: CREATE TABLE IF NOT EXISTS dr_probe AS SELECT generate_series(1, 25) AS n

    - name: Refuse to restore over the live database
      block:
        - name: Attempt a restore into the managed database
          ansible.builtin.include_role:
            name: postgres
            tasks_from: main/dr_restore.yml
          vars:
            postgres_dr_restore_db: nautobot
            postgres_dr_restore_source_db: nautobot
            postgres_managed_databases: "{{ drill_managed_databases }}"
        - name: Fail if the guard let it through
          ansible.builtin.fail:
            msg: the managed-database guard did not fire
      rescue:
        - name: Assert the guard is what refused
          ansible.builtin.assert:
            that:
              - "'is a managed database' in ansible_failed_result.msg"

    - name: Refuse a key table name that is not a plain identifier
      block:
        - name: Attempt a restore with an injected table name
          ansible.builtin.include_role:
            name: postgres
            tasks_from: main/dr_restore.yml
          vars:
            postgres_dr_restore_db: nautobot_drill
            postgres_dr_restore_source_db: nautobot
            postgres_dr_restore_checksum_tables: ["dr_probe; SELECT 1"]
            postgres_managed_databases: "{{ drill_managed_databases }}"
        - name: Fail if the name check let it through
          ansible.builtin.fail:
            msg: the key-table name check did not fire
      rescue:
        - name: Assert the name check is what refused
          ansible.builtin.assert:
            that:
              - "'plain identifiers' in ansible_failed_result.msg"

    - name: Restore the newest nautobot dump into a scratch database and compare
      ansible.builtin.include_role:
        name: postgres
        tasks_from: main/dr_restore.yml
      vars:
        postgres_dr_restore_db: nautobot_drill
        postgres_dr_restore_source_db: nautobot
        postgres_dr_restore_drop_after: true
        postgres_dr_restore_checksum_tables: [dr_probe]
        postgres_managed_databases: "{{ drill_managed_databases }}"

    - name: List databases and the live probe rows after the drill
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        login_db: "{{ item.db }}"
        query: "{{ item.query }}"
      loop:
        - {db: postgres, query: "SELECT datname AS v FROM pg_database"}
        - {db: nautobot, query: "SELECT count(*) AS v FROM dr_probe"}
      register: postgres_drill_after
      changed_when: false

    - name: Assert the scratch database is gone and the live one is untouched
      ansible.builtin.assert:
        that:
          - "'nautobot_drill' not in names"
          - "'nautobot' in names"
          - postgres_drill_after.results[1].query_result[0].v == 25
      vars:
        names: "{{ postgres_drill_after.results[0].query_result | map(attribute='v') | list }}"

    # The module's own unix-socket session to the postgres database is the one
    # row the report must show, with no client address.
    - name: Report the clients connected to the postgres database
      ansible.builtin.include_role:
        name: postgres
        tasks_from: main/connection_report.yml
      vars:
        postgres_connection_report_db: postgres

    - name: Assert the report lists this play's own local session
      ansible.builtin.assert:
        that:
          - postgres_connection_report.query_result | selectattr('client', 'eq', 'local') | list | length == 1
