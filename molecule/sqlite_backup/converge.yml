---
# Molecule converge for the sqlite_backup scenario. The role's proof-run task
# executes the backup script during the converge, so a broken script fails here
# rather than silently at the scheduled time.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    sqlite_backup_dirs:
      - /opt/molecule-appdata

  tasks:
    - name: Include sqlite_backup role
      ansible.builtin.include_role:
        name: sqlite_backup
