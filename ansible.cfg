[defaults]
inventory = inventory/hosts.yml
roles_path = roles
callback_plugins = callback_plugins
# converge_telemetry ships per-host converge-freshness events to Splunk HEC at
# end of run. It stays inert unless the playbook publishes its configuration via
# set_stats (only site.yml does), so enabling it here costs nothing elsewhere.
# ansible.posix.profile_tasks gives per-task wall clock. Without it a slow
# converge can only be guessed at from round-trip counts, which is how a
# fan-out that did not exist was once proposed as the fix for a single-host
# task. It is a reporting callback: no effect on what runs.
callbacks_enabled = converge_telemetry, ansible.posix.profile_tasks
# Host identities are verified against the reviewed pinned known_hosts that
# scripts/run-ansible.sh materializes from SSH_KNOWN_HOSTS (Doppler). A rebuilt
# guest fails closed until re-harvested. LXC converges use pct, not SSH.
host_key_checking = True
deprecation_warnings = True
retry_files_enabled = False
# Ansible starts at most one worker per host in the current play, so a value
# far above the host count costs nothing -- there is no "auto" here, and no
# reason to keep re-tuning by hand as groups grow. Set it well clear of any
# group this repo converges (largest today is 9) and leave it alone. At the old
# forks=5 a 9-host group ran as two serial batches, which dominated the run.
#
# Measured on proxmox_pct_remote: 9 hosts cost 1.75x one host for the same
# task, not 9x -- fan-out is already parallel. What remains is a flat ~6s per
# task per host of transport overhead, which no value here addresses.
forks = 50
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# NOTE: allow_world_readable_tmpfiles = True is disabled for security
# If plugins fail due to permission issues, investigate root cause rather than
# globally disabling file permissions. This setting exposes sensitive data in tmp files.
# allow_world_readable_tmpfiles = True

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s


[paramiko_connection]
# automation-ansible SSH certificates intentionally omit permit-pty. The PCT
# connection only needs an exec channel, so requesting a PTY would make the
# Proxmox SSH server reject the channel after successful authentication.
pty = False
