[defaults]
inventory = inventory/hosts.yml
roles_path = roles
callback_plugins = callback_plugins
# converge_telemetry ships per-host converge-freshness events to Splunk HEC at
# end of run. It stays inert unless the playbook publishes its configuration via
# set_stats (only site.yml does), so enabling it here costs nothing elsewhere.
# ansible.posix.profile_tasks gives per-task wall clock. Without it a slow
# converge can only be guessed at from round-trip counts, which is how a
# fan-out that did not exist was once proposed as the fix for a single-host
# task. It is a reporting callback: no effect on what runs.
callbacks_enabled = converge_telemetry, ansible.posix.profile_tasks
# Host identities are verified against the reviewed pinned known_hosts that
# scripts/run-ansible.sh materializes from SSH_KNOWN_HOSTS. A rebuilt guest
# fails closed until re-harvested.
#
# LXC converges DO use SSH: proxmox_pct_remote connects to the node over SSH
# and runs pct there, so the node's host key is verified on every container
# task. The claim that once stood here — that they use pct and not SSH — is
# why the pin was materialized only for the OpenSSH transport and was inert
# for every container host. run-ansible.sh now writes it to the path the
# in-process transport actually reads as well.
host_key_checking = True
deprecation_warnings = True
retry_files_enabled = False
# Ansible starts at most one worker per host in the current play. The reason
# this is not simply "well clear of the largest group" is the remote end:
# every LXC task opens an SSH connection to a NODE, and site.yml has plays
# targeting every container at once, so a high value points dozens of
# simultaneous connections at three machines rather than spreading them.
#
# OpenSSH 10 penalises a source that opens connections and disconnects before
# authenticating (noauth), per /32, for up to ten minutes. A wide fan-out
# produces exactly that pattern whenever any connection aborts early, and the
# penalty then drops OTHER hosts' connections — which surfaces as "No existing
# session" or "Error reading SSH protocol banner" on a random subset, looking
# like flaky guests rather than self-inflicted rate limiting. Runs at 50 also
# lost workers outright ("a worker was found in a dead state").
#
# 20 keeps every group this repo converges fully parallel while staying under
# what one node will accept from one source. Raising it needs evidence from
# the node's own connection log, not just a host count.
#
# Measured on proxmox_pct_remote: 9 hosts cost 1.75x one host for the same
# task, not 9x -- fan-out is already parallel. What remains is a flat ~6s per
# task per host of transport overhead, which no value here addresses.
forks = 20
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
# NOTE: allow_world_readable_tmpfiles = True is disabled for security
# If plugins fail due to permission issues, investigate root cause rather than
# globally disabling file permissions. This setting exposes sensitive data in tmp files.
# allow_world_readable_tmpfiles = True

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s


[paramiko_connection]
# automation-ansible SSH certificates intentionally omit permit-pty. The PCT
# connection only needs an exec channel, so requesting a PTY would make the
# Proxmox SSH server reject the channel after successful authentication.
pty = False
