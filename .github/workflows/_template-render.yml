---
name: Template Rendering Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  render:
    name: Template Rendering Tests
    runs-on: >-
      ${{ (github.event.repository.private == false ||
      github.event.pull_request.head.repo.fork) &&
      'ubuntu-latest' || 'proxmox' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 6 || 20 }} # pr-policy: timeout-exception measured-template-render-duration
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      - name: Install Ansible and dependencies
        run: |
          uv pip install --system \
            'ansible-core>=2.16'

      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.ANSIBLE_HOME }}/collections
            ${{ env.ANSIBLE_HOME }}/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
          restore-keys: |
            ansible-galaxy-v2-${{ runner.os }}-

      - name: Install Ansible collections
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 4
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: python3 scripts/install_galaxy_requirements.py
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      - name: Run template rendering tests
        run: ansible-playbook tests/template_render/verify_templates.yml -c local
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          PROXMOX_SUBDOMAIN: example.invalid
