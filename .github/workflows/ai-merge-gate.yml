---
name: AI Merge Gate
on:
  pull_request:
    # The canonical caller's types: an edited description or a changed label is reviewed again.
    types: [opened, ready_for_review, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  checks: read
  contents: read
  pull-requests: write
jobs:
  gate:
    uses: JacobPEvans/.github-ai/.github/workflows/_ai-merge-gate.yml@v2
    with:
      runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'ubuntu-latest' }}
    secrets: inherit
