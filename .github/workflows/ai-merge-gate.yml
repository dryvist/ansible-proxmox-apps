---
name: AI Merge Gate
on: pull_request
permissions: read-all
jobs:
  gate:
    uses: JacobPEvans/.github-ai/.github/workflows/_ai-merge-gate.yml@v2
    with:
      runner_label: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'review' || 'ubuntu-latest' }}
    secrets: inherit
