---
# Exports this repository's router model selections and checks them against the shared lane contract.

name: Lane Alias Parity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lane-alias-names:
    name: Export router names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Export the n8n router model
        run: >-
          python -c 'import json, yaml; from pathlib import Path; data = yaml.safe_load(Path("roles/n8n_docker/defaults/main.yml").read_text()); print(json.dumps({"source": "ansible-proxmox-apps", "names": [data["n8n_docker_seed_model"]]}, sort_keys=True))'
          > lane-alias-parity-apps.json
      - name: Upload router names
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-alias-names
          path: lane-alias-parity-apps.json
          if-no-files-found: error

  # The shared check job sets its own timeout-minutes: 5.
  lane-alias-parity:
    name: Shared lane alias parity
    needs: lane-alias-names
    uses: dryvist/homelab-contracts/.github/workflows/alias-parity.yml@11feff66a8778f64faa83d89879559f203f1f170 # v5.23.0
    with:
      names-artifact: lane-alias-names
      names-files: lane-alias-parity-apps.json
      router-contract-ref: v2.7.0
