---
name: Alert Delivery Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  alert-delivery:
    name: Verify durable alert delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client golang-go prometheus
          python3 -m pip install --disable-pip-version-check pyyaml jinja2 'ansible-core>=2.19,<2.20'
      - name: Verify delivery graphs and queue behavior
        env:
          ALERT_DELIVERY_TEST_DSN: postgresql://delivery_test:synthetic_test_only@localhost:5432/delivery_test
        run: python3 -m unittest discover -s tests -p 'test_alert_delivery.py' -v
      - name: Verify deployment boundaries
        run: python3 -m unittest discover -s tests -p 'test_alert_deployment.py' -v
      - name: Verify channel provisioning
        run: python3 -m unittest discover -s tests -p 'test_alert_channels.py' -v
      - name: Verify publisher payloads and subscriber retirement
        run: python3 -m unittest discover -s tests -p 'test_alert_publisher_contracts.py' -v
