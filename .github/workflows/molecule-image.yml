---
name: Molecule base image

# Publishes the Molecule base image (molecule/resources/Dockerfile) to GHCR.
# Every Molecule scenario runs on this image (MOLECULE_BASE_IMAGE in
# runner.env); building it here, once, replaces a per-host `docker build` on
# every runner host in the fleet.
on:
  push:
    branches: [develop]
    paths:
      - molecule/resources/Dockerfile
      - .github/workflows/molecule-image.yml
  schedule:
    # Weekly refresh so a re-published upstream base (geerlingguy/docker-
    # debian12-ansible) and Debian security updates reach the fleet even
    # when the Dockerfile itself hasn't changed.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dryvist/molecule-debian12

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: molecule/resources
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
