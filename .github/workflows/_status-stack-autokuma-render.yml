---
# Reusable: status_stack AutoKuma Bulk Render Tests
#
# Split into its own reusable workflow rather than a step on _molecule.yml's
# template-render job — same pattern as _nautobot-seed.yml, which that file's
# own comment says is because _molecule.yml reached the per-file token budget.
# Called only from _molecule.yml's `status-stack-autokuma-render` job — not a
# standalone entry point.
#
# Covers roles/status_stack/tasks/autokuma_static_monitors.yml: a fixture of
# 50 monitor targets must render to the expected file set, and re-running
# against the SAME target directory must report changed=0 (the checksum
# marker matches). Neither Molecule scenario for status_stack exercises this
# path twice against a stable directory, so it needs its own job.
name: _status-stack-autokuma-render

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  render:
    name: status_stack AutoKuma Bulk Render Tests
    # Hosted, ephemeral runner: fully offline, and the role owns its rendered
    # files as root — this needs the runner's passwordless sudo, which the
    # pre-baked self-hosted image does not grant this way.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Ansible and dependencies
        run: |
          uv pip install --system \
            'ansible-core>=2.16'

      # Cache Galaxy content keyed on requirements.yml. Hosted, ephemeral
      # runner, so the default ~/.ansible path is safe here. Same key/paths as
      # dryvist/.github's _ansible-ci.yml so a warm run of either workflow
      # warms the other.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        # Galaxy flakes with 504s and read timeouts; a retry beats rerunning
        # the whole job. Same four attempts and backoff the retry script used.
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 4
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: ansible-galaxy install -r requirements.yml
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      # Two SEPARATE ansible-playbook processes against the same fixed target
      # directory, exactly like an operator re-running the role — the second
      # must report changed=0 because the checksum marker matches. Fails
      # loudly (grep) rather than eyeballing the recap.
      - name: Run the AutoKuma bulk-render test (first pass)
        run: ansible-playbook tests/status_stack_autokuma_render/verify.yml -c local
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Run the AutoKuma bulk-render test again and require changed=0
        run: |
          set -euo pipefail
          OUTPUT="$(ansible-playbook tests/status_stack_autokuma_render/verify.yml -c local)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -E 'localhost[[:space:]]*:.*changed=0' || {
            echo "::error::second run was not idempotent (expected changed=0)"
            exit 1
          }
        env:
          PY_COLORS: "0"
          ANSIBLE_FORCE_COLOR: "0"

      - name: Clean up the fixture's target directory
        if: always()
        run: sudo rm -rf /tmp/status_stack_autokuma_render_verify
