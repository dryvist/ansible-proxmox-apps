---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# dryvist/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across ansible-proxmox, ansible-splunk and this repo.
#
# Molecule stays LOCAL here: this repo's molecule job has a deliberate
# least-privilege Doppler handling (it maps only the three secrets the scenarios
# consume into the test step, never inject-env-vars) plus a wide scenario matrix
# and a template-render job. Routing it through the shared molecule (which uses
# inject-env-vars) would regress that. So the shared workflow runs lint only
# (molecule:false) and this wrapper keeps _molecule.yml, _data-contract.yml, and
# the self-hosted _e2e-tests.yml local, aggregating everything in its own
# required "Merge Gate". All local jobs gate on the shared workflow's exported
# filter outputs — one change-detection definition.
#
# E2E Runner Guard:
# E2E tests require self-hosted runners. The e2e job checks the repository
# variable `E2E_RUNNERS_ENABLED`; set to 'true' after deploying runners:
# `gh variable set E2E_RUNNERS_ENABLED --body true`.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_ansible-ci.yml@main
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      emit_gate: false

  # The shared `ansible` filter matches '**.yml' deliberately — it also gates
  # lint, and narrowing it once let a test-only PR merge green having never run
  # (see the comment on that filter upstream). It is the right filter for LINT
  # and the wrong one for DEPLOYMENT checks: editing a workflow file made it
  # true, which ran 5 data-contract jobs and 8 e2e jobs against infrastructure
  # that had not changed.
  #
  # Deployment scope is therefore decided here, rather than by narrowing a
  # shared filter that five repos depend on. Promotion into main forces it
  # true — a guaranteed full sweep at that boundary is what makes narrowing
  # safe everywhere else.
  scope:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: >-
        ${{ steps.filter.outputs.deploy == 'true'
            || github.event.pull_request.base.ref == 'main' }}
      molecule: >-
        ${{ steps.filter.outputs.molecule == 'true'
            || github.event.pull_request.base.ref == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            deploy:
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'tests/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
            molecule:
              - 'roles/**'
              - 'molecule/**'
              - 'inventory/**'
              - 'playbooks/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
              - '.github/workflows/ci-gate.yml'
              - '.github/workflows/_molecule.yml'
              - '.github/scripts/select-molecule-scenarios.py'

  data-contract:
    name: Data Contract
    needs: [ci, scope]
    if: >-
      needs.ci.outputs.ansible == 'true' &&
      needs.scope.outputs.deploy == 'true'
    uses: ./.github/workflows/_data-contract.yml

  molecule:
    name: Molecule
    needs: [ci, scope]
    # Scenario selection happens inside the called workflow, which derives the
    # role-to-scenario map from the tree and runs everything on a promotion.
    if: >-
      needs.ci.outputs.molecule == 'true' ||
      needs.scope.outputs.molecule == 'true'
    uses: ./.github/workflows/_molecule.yml
    secrets: inherit

  e2e:
    name: E2E Tests
    needs: [ci, scope]
    # Self-hosted. e2e exercises deployed infrastructure, so it follows the
    # deploy scope above rather than the lint filter.
    # (PR e2e also runs on its own schedule / workflow_dispatch.)
    if: >-
      needs.ci.outputs.ansible == 'true' &&
      needs.scope.outputs.deploy == 'true' &&
      vars.E2E_RUNNERS_ENABLED == 'true'
    uses: ./.github/workflows/_e2e-tests.yml

  gate:
    name: Merge Gate
    # `scope` is a dependency and is NOT in allowed-skips. It decides whether
    # the deployment checks run, so a failure there skips them — and a skip the
    # gate forgives is a green board with nothing having run. The job that
    # decides what to skip can never itself be skippable.
    needs: [ci, scope, data-contract, molecule, e2e]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: data-contract, molecule, e2e
          jobs: ${{ toJSON(needs) }}
