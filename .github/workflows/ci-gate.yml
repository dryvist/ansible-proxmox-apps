---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# dryvist/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across ansible-proxmox, ansible-splunk and this repo.
#
# Molecule stays LOCAL here: this repo's molecule job has a deliberate
# least-privilege Doppler handling (it maps only the three secrets the scenarios
# consume into the test step, never inject-env-vars) plus a wide scenario matrix
# and a template-render job. Routing it through the shared molecule (which uses
# inject-env-vars) would regress that. So the shared workflow runs lint only
# (molecule:false) and this wrapper keeps _molecule.yml, _data-contract.yml, and
# the self-hosted _e2e-tests.yml local, aggregating everything in its own
# required "Merge Gate". All local jobs gate on the shared workflow's exported
# filter outputs — one change-detection definition.
#
# E2E tests require the enabled self-hosted runner pool. They run on main
# promotions and pushes to main, and only for same-repository promotion PRs.

name: CI Gate

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_ansible-ci.yml@6feaed7ba31d1917b6aaae9667cf7943f9924171 # v1.8.4
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      molecule_scenario_filters: |
        default:
          - 'roles/docker_engine/**'
          - 'roles/mssql_docker/**'
          - 'molecule/default/**'
          - '.github/workflows/ci-gate.yml'
          - '.github/workflows/_molecule.yml'
          - '.github/scripts/select-molecule-scenarios.py'
        github_runner_arc:
          - 'roles/github_runner_arc/**'
          - 'molecule/github_runner_arc/**'
        homarr:
          - 'roles/apt_recovery/**'
          - 'roles/dashboard_catalog/**'
          - 'roles/homarr/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/homarr/**'
        homarr_v2:
          - 'roles/apt_recovery/**'
          - 'roles/dashboard_catalog/**'
          - 'roles/homarr/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/homarr_v2/**'
        immich:
          - 'roles/docker_engine/**'
          - 'roles/immich/**'
          - 'molecule/immich/**'
        keepalived:
          - 'roles/keepalived/**'
          - 'molecule/keepalived/**'
        nautobot:
          - 'roles/nautobot/**'
          - 'roles/openbao_secrets/**'
          - 'molecule/nautobot/**'
        netmon:
          - 'roles/docker_engine/**'
          - 'roles/netmon/**'
          - 'molecule/netmon/**'
        ntfy_docker:
          - 'roles/ntfy_docker/**'
          - 'molecule/ntfy_docker/**'
        object_storage:
          - 'roles/object_storage/**'
          - 'molecule/object_storage/**'
        openbao:
          - 'roles/openbao/**'
          - 'molecule/openbao/**'
        postgres:
          - 'roles/nautobot/**'
          - 'roles/openbao_secrets/**'
          - 'roles/postgres/**'
          - 'molecule/postgres/**'
        postgres_patroni:
          - 'roles/postgres/**'
          - 'molecule/postgres_patroni/**'
        proxmox_backup_server:
          - 'roles/proxmox_backup_server/**'
          - 'molecule/proxmox_backup_server/**'
        ssh_ca_trust:
          - 'roles/ssh_ca_trust/**'
          - 'molecule/ssh_ca_trust/**'
        static_site:
          - 'roles/static_site/**'
          - 'molecule/static_site/**'
        technitium_dns:
          - 'roles/technitium_dns/**'
          - 'molecule/technitium_dns/**'
      molecule_contract_filters: |
        contract_only:
          - 'requirements.yml'
          - '.github/workflows/_data-contract.yml'
          - '.github/workflows/_inventory-contract.yml'
          - '.github/workflows/_secrets-contract.yml'
          - 'tests/test_ci_molecule_branch_policy.py'
          - 'tests/ci_molecule_branch_policy/**'
          - 'tests/test_ntfy_publisher_urls.py'
          - 'tests/test_openbao_approle_lockout_tune.py'
          - 'tests/test_openbao_init_cli_host.py'
          # Run by the _data-contract.yml pytest suite.
          - 'tests/openbao_secrets/**'
          - 'tests/test_*.py'
          # Run by _secrets-contract.yml.
          - 'tests/plane_identity_bounds/**'
          # No molecule scenario exists for this role; the template-render
          # harness in _data-contract.yml is its coverage.
          - 'roles/ntfy_docker/**'
          - 'tests/template_render/**'
          # Roles with no Molecule scenario whose changes are exercised by the
          # _data-contract.yml suites (template_render verify plays, pytest
          # contract tests, or role-specific verify playbooks). A role is
          # listed only when one of those suites tests it; any other role
          # still fails selection until it gets a scenario or such a test.
          - 'roles/agent_sandbox/**'
          - 'roles/apt_cacher_ng/**'
          - 'roles/authelia/**'
          - 'roles/cribl_docker_stack/**'
          - 'roles/cribl_stream/**'
          - 'roles/github_runner/**'
          - 'roles/glance/**'
          - 'roles/grafana_stack/**'
          - 'roles/haproxy/**'
          - 'roles/mailpit_docker/**'
          - 'roles/n8n_docker/**'
          - 'roles/ntfy_unit_failure/**'
          - 'roles/openbao_voter_health/**'
          - 'roles/openproject_docker/**'
          - 'roles/prometheus_stack/**'
          - 'roles/service_deadman/**'
          - 'roles/status_stack/**'
          - 'roles/syslog_forwarder/**'
          - 'roles/technitium_install/**'
          - 'roles/traefik/**'
          - 'roles/unifi_metrics/**'
          - 'roles/unpoller/**'
          - 'roles/vikunja/**'
          - 'roles/wall/**'
          - 'roles/wan_hop_discovery/**'
          - 'roles/workstation_connections/**'
          - 'roles/zammad/**'

  # Repository-local deployment contracts share this deterministic scope.
  # Promotion into main forces them on; Molecule selection comes from the
  # shared Ansible workflow below.
  scope:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A push forces both true because paths-filter may not have the prior
      # commit in a shallow checkout. For PRs, `main` forces a full run while
      # `develop` follows the changed paths.
      deploy: >-
        ${{ steps.filter.outputs.deploy == 'true'
            || github.event_name == 'push'
            || github.event.pull_request.base.ref == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # paths-filter needs the pre-push commit to diff against.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            deploy:
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'tests/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
              # A PR that only edits one of these workflow files must exercise
              # the contract job it defines.
              - '.github/workflows/ci-gate.yml'
              - '.github/workflows/_data-contract.yml'
              - '.github/workflows/_inventory-contract.yml'
              - '.github/workflows/_secrets-contract.yml'

  data-contract:
    name: Data Contract
    needs: [ci, scope]
    # `ci.outputs.ansible` comes from the shared workflow, whose own change
    # filter is shallow-checkout bound and therefore false on a push. Accept a
    # push directly so the post-merge sweep is not gated on a filter that
    # cannot answer for this event.
    if: >-
      needs.scope.outputs.deploy == 'true' &&
      (needs.ci.outputs.ansible == 'true' ||
       github.event_name == 'push' ||
       github.event.pull_request.base.ref == 'main')
    uses: ./.github/workflows/_data-contract.yml

  # The inventory half of the same contract, split out because the source file
  # reached the per-file size budget. Same trigger conditions as its sibling —
  # they are one contract in two files, not two policies.
  inventory-contract:
    name: Inventory Contract
    needs: [ci, scope]
    if: >-
      needs.scope.outputs.deploy == 'true' &&
      (needs.ci.outputs.ansible == 'true' ||
       github.event_name == 'push' ||
       github.event.pull_request.base.ref == 'main')
    uses: ./.github/workflows/_inventory-contract.yml

  # The OpenBao/secrets half of the same contract, split out of
  # inventory-contract when IT reached the per-file size budget. Same trigger
  # conditions as its siblings — one contract in three files, not three
  # policies.
  secrets-contract:
    name: Secrets Contract
    needs: [ci, scope]
    if: >-
      needs.scope.outputs.deploy == 'true' &&
      (needs.ci.outputs.ansible == 'true' ||
       github.event_name == 'push' ||
       github.event.pull_request.base.ref == 'main')
    uses: ./.github/workflows/_secrets-contract.yml

  molecule:
    name: Molecule
    needs: ci
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main') ||
       (needs.ci.outputs.molecule == 'true' &&
        needs.ci.outputs.molecule_scenarios != '' &&
        needs.ci.outputs.molecule_scenarios != '[]'))
    uses: ./.github/workflows/_molecule.yml
    with:
      scenarios: >-
        ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main')) &&
        needs.ci.outputs.molecule_scenarios || '' }}
    secrets: inherit

  e2e:
    name: E2E Tests
    needs: scope
    # This suite reads integrated service health through the self-hosted pool.
    # Never run fork-controlled code on those runners.
    if: >-
      !cancelled() &&
      vars.E2E_RUNNERS_ENABLED == 'true' &&
      needs.scope.outputs.deploy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/_e2e-tests.yml

  gate:
    name: Merge Gate
    # `scope` is a dependency and is NOT in allowed-skips. It decides whether
    # the deployment checks run, so a failure there skips them — and a skip the
    # gate forgives is a green board with nothing having run. The job that
    # decides what to skip can never itself be skippable.
    needs: [ci, scope, data-contract, inventory-contract, secrets-contract, molecule, e2e]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          # Main-target PRs and main pushes require the complete Molecule
          # matrix. Develop uses the shared focused selection and retains
          # the classifier and local contracts in this gate.
          allowed-skips: >-
            ${{ (github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == 'develop' &&
            'data-contract, inventory-contract, secrets-contract, molecule, e2e') ||
            ((github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name != github.repository) &&
            'e2e') ||
            ((github.event_name == 'push' && github.ref == 'refs/heads/develop') &&
            'e2e, molecule') || '' }}
          jobs: ${{ toJSON(needs) }}
