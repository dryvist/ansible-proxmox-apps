---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# dryvist/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across ansible-proxmox, ansible-splunk and this repo.
#
# Molecule stays LOCAL here: this repo's molecule job has a deliberate
# least-privilege Doppler handling (it maps only the three secrets the scenarios
# consume into the test step, never inject-env-vars) plus a wide scenario matrix
# and a template-render job. Routing it through the shared molecule (which uses
# inject-env-vars) would regress that. So the shared workflow runs lint only
# (molecule:false) and this wrapper keeps _molecule.yml, _data-contract.yml, and
# the self-hosted _e2e-tests.yml local, aggregating everything in its own
# required "Merge Gate". All local jobs gate on the shared workflow's exported
# filter outputs — one change-detection definition.
#
# E2E Runner Guard:
# E2E tests require self-hosted runners. The e2e job checks the repository
# variable `E2E_RUNNERS_ENABLED`; set to 'true' after deploying runners:
# `gh variable set E2E_RUNNERS_ENABLED --body true`.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Content-aware classifier (dryvist/ai-workflows' scope-classify.yml,
  # "Jev"). Named `jev`, not `scope` - this repo's own deterministic
  # paths-filter job below is already named `scope`. AUTHORITATIVE for
  # Molecule/e2e below: its `molecule`/`e2e` outputs decide on their own;
  # the deterministic `ci`/`scope` filter outputs are consulted ONLY when
  # `jev.outputs.source == 'fallback'` (classifier unreachable), which is
  # also the one case scope-classify.yml's own fail-safe already forces
  # every output to full/yes - so a jev failure or an untouched
  # TYPESAFE_API_KEY still runs Molecule/e2e, never skips them.
  jev:
    name: Classify CI scope (Jev)
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/ai-workflows/.github/workflows/scope-classify.yml@main
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_ansible-ci.yml@main
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false

  # The shared `ansible` filter matches '**.yml' deliberately — it also gates
  # lint, and narrowing it once let a test-only PR merge green having never run
  # (see the comment on that filter upstream). It is the right filter for LINT
  # and the wrong one for DEPLOYMENT checks: editing a workflow file made it
  # true, which ran 5 data-contract jobs and 8 e2e jobs against infrastructure
  # that had not changed.
  #
  # Deployment scope is therefore decided here, rather than by narrowing a
  # shared filter that five repos depend on. Promotion into main forces it
  # true — a guaranteed full sweep at that boundary is what makes narrowing
  # safe everywhere else.
  scope:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A push to `main` forces both true. Not a shortcut: on a push
      # dorny/paths-filter diffs against github.event.before, which a
      # fetch-depth:1 checkout does not contain, so every filter returned false
      # and the whole suite skipped behind a green board. Forcing also matches
      # the rule the trigger exists to implement — a merge into `main` runs
      # everything, regardless of what the diff looks like.
      deploy: >-
        ${{ steps.filter.outputs.deploy == 'true'
            || github.event_name == 'push'
            || github.event.pull_request.base.ref == 'main' }}
      molecule: >-
        ${{ steps.filter.outputs.molecule == 'true'
            || github.event_name == 'push'
            || github.event.pull_request.base.ref == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # paths-filter needs the pre-push commit to diff against.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            deploy:
              - 'roles/**'
              - 'playbooks/**'
              - 'inventory/**'
              - 'tests/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
              # A PR that only edits one of these three files skipped the
              # job it defines entirely (deploy stayed false), so the job's
              # own definition could merge unexercised. Same reasoning as
              # molecule's own workflow-file entries below.
              - '.github/workflows/ci-gate.yml'
              - '.github/workflows/_data-contract.yml'
              - '.github/workflows/_inventory-contract.yml'
              - '.github/workflows/_secrets-contract.yml'
            molecule:
              - 'roles/**'
              - 'molecule/**'
              - 'playbooks/**'
              - 'requirements.yml'
              - 'requirements-ci.txt'
              - '.github/workflows/ci-gate.yml'
              - '.github/workflows/_molecule.yml'
              - '.github/scripts/select-molecule-scenarios.py'

  data-contract:
    name: Data Contract
    needs: [ci, scope]
    # `ci.outputs.ansible` comes from the shared workflow, whose own change
    # filter is shallow-checkout bound and therefore false on a push. Accept a
    # push directly so the post-merge sweep is not gated on a filter that
    # cannot answer for this event.
    if: >-
      needs.scope.outputs.deploy == 'true' &&
      (needs.ci.outputs.ansible == 'true' || github.event_name == 'push')
    uses: ./.github/workflows/_data-contract.yml

  # The inventory half of the same contract, split out because the source file
  # reached the per-file size budget. Same trigger conditions as its sibling —
  # they are one contract in two files, not two policies.
  inventory-contract:
    name: Inventory Contract
    needs: [ci, scope]
    if: >-
      needs.scope.outputs.deploy == 'true' &&
      (needs.ci.outputs.ansible == 'true' || github.event_name == 'push')
    uses: ./.github/workflows/_inventory-contract.yml

  # The OpenBao/secrets half of the same contract, split out of
  # inventory-contract when IT reached the per-file size budget. Same trigger
  # conditions as its siblings — one contract in three files, not three
  # policies.
  secrets-contract:
    name: Secrets Contract
    needs: [ci, scope]
    if: >-
      needs.scope.outputs.deploy == 'true' &&
      (needs.ci.outputs.ansible == 'true' || github.event_name == 'push')
    uses: ./.github/workflows/_secrets-contract.yml

  molecule:
    name: Molecule
    needs: [ci, scope, jev]
    # Scenario selection happens inside the called workflow, which derives the
    # role-to-scenario map from the tree and runs everything on a promotion.
    # Jev is AUTHORITATIVE: runs whenever it says anything other than "none".
    # The deterministic ci/scope filter is consulted only as the fallback
    # when jev is unreachable (source == 'fallback') - which itself always
    # answers molecule: full, so this OR is redundant-but-explicit defense
    # in depth against a future change to that fallback guarantee, not
    # load-bearing today.
    if: >-
      !cancelled() &&
      (needs.jev.outputs.molecule != 'none' ||
       (needs.jev.outputs.source == 'fallback' &&
        (needs.ci.outputs.molecule == 'true' || needs.scope.outputs.molecule == 'true')))
    uses: ./.github/workflows/_molecule.yml
    secrets: inherit

  e2e:
    name: E2E Tests
    needs: [ci, scope, jev]
    # Self-hosted. e2e exercises deployed infrastructure, so it follows the
    # deploy scope above rather than the lint filter.
    # (PR e2e also runs on its own schedule / workflow_dispatch.)
    #
    # Restricted to `push` so it runs on merge into main and never blocks a PR.
    # `Merge Gate` already forgives an e2e skip, so PRs stay green without it.
    # Deliberately NOT gated on the shared workflow's change filter: that filter
    # cannot answer on a push, and a post-merge sweep that silently skips is the
    # failure this trigger exists to prevent.
    #
    # Jev-authoritative on `e2e`, same fallback pattern as Molecule above.
    # In practice this never narrows anything here: every push is a
    # non-pull_request event, which scope-classify.yml's own ALWAYS-FULL
    # override always answers e2e: yes for - kept for consistency with
    # Molecule's gating, not because it changes behavior today.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      vars.E2E_RUNNERS_ENABLED == 'true' &&
      needs.scope.outputs.deploy == 'true' &&
      (needs.jev.outputs.e2e != 'no' ||
       (needs.jev.outputs.source == 'fallback' && needs.scope.outputs.deploy == 'true'))
    uses: ./.github/workflows/_e2e-tests.yml

  gate:
    name: Merge Gate
    # `scope` is a dependency and is NOT in allowed-skips. It decides whether
    # the deployment checks run, so a failure there skips them — and a skip the
    # gate forgives is a green board with nothing having run. The job that
    # decides what to skip can never itself be skippable.
    needs: [ci, scope, jev, data-contract, inventory-contract, secrets-contract, molecule, e2e]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: data-contract, inventory-contract, secrets-contract, molecule, e2e
          # `jev` never skips (no `if:`), so it needs allowed-FAILURES, not
          # allowed-skips - a classifier infra failure is visible as a red
          # job but never blocks this gate, since Molecule/e2e above already
          # defer to the deterministic filter whenever jev's own source
          # isn't 'fallback' from a clean success (an outright job failure
          # leaves `molecule`/`e2e` outputs empty, and empty != 'none'/'no'
          # is true, so both still run - the safe direction).
          allowed-failures: jev
          jobs: ${{ toJSON(needs) }}
