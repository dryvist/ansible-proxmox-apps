---
name: Molecule

on:
  workflow_call:
    secrets:
      DOPPLER_TOKEN:
        description: Doppler service token
        required: true
      DOCKERHUB_USERNAME:
        description: >-
          Docker Hub username, for authenticated image pulls on a hosted
          runner. Optional — the test job runs unauthenticated when unset.
        required: false
      DOCKERHUB_TOKEN:
        description: >-
          Docker Hub read-only access token, paired with DOCKERHUB_USERNAME.
          Optional — the test job runs unauthenticated when unset.
        required: false

permissions:
  contents: read

jobs:
  # Which scenarios does this change actually need? Hosted, cheap, and off the
  # fleet — deciding what to run must never queue behind the thing it decides.
  scenarios:
    name: Select scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.select.outputs.list }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The selection diffs against the merge base, which shallow history
          # cannot resolve.
          fetch-depth: 0
      # Fail loudly if the parser stops resolving roles. A silently-broken
      # parser selects `default` alone: green, fast, and testing almost nothing.
      - name: Verify the selector still resolves roles
        run: python3 .github/scripts/select-molecule-scenarios.py --self-check

      - name: Select scenarios
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRODUCTION_BRANCH: main
        run: python3 .github/scripts/select-molecule-scenarios.py

  test:
    name: Molecule (${{ matrix.scenario }})
    needs: scenarios
    # Hosted for a public repo and for fork PRs; self-hosted only for a
    # private repo's own PRs.
    runs-on: >-
      ${{ (github.event.repository.private == false ||
      github.event.pull_request.head.repo.fork) &&
      'ubuntu-latest' || 'proxmox' }}
    timeout-minutes: 45
    # A hosted run pulls scenario container images anonymously and can hit
    # Docker Hub's per-IP rate limit; log in when the org secret pair exists
    # so the pull is authenticated instead.
    env:
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      fail-fast: false
      # No max-parallel here. The test containers are created through the
      # bind-mounted docker.sock, so they are SIBLINGS of the runner on the
      # shared dockerd -- not children of its cgroup -- and the runner's own
      # cpus/mem_limit does not apply to them. What bounds that shared daemon is
      # the fleet's runner-slot count (inventory/group_vars/docker_vms.yml), and
      # it bounds every repo at once.
      #
      # max-parallel bounded ONE run, and the slot count already held it to the
      # same number, so it never did anything -- while its comment claimed a
      # fleet guarantee it could not provide. That wrong claim is what sent a
      # flakiness investigation after per-PR concurrency instead of the real
      # defect: a cap fragmented across five per-repo registrations, summing to
      # more slots than the host carried.
      #
      # The scenario list is chosen per change, not listed here. A hardcoded
      # list ran all twenty on every pull request, and would have drifted from
      # the scenarios that actually exist. `select-molecule-scenarios.py`
      # explains the rules and writes its choice to the step summary, so a
      # narrowed run says what it skipped and why.
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.list) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Per-job Ansible state. The fleet runners share ~/.ansible, and
      # concurrent `ansible-galaxy collection install` runs race in it — the
      # git-sourced collection is tar-built under ANSIBLE_HOME/tmp, so two
      # jobs on one host corrupt each other's build and every later job on
      # that runner dies with "Collection tar file member MANIFEST.json does
      # not contain a valid json string". RUNNER_TEMP is unique per job. A
      # $GITHUB_ENV step, not job-level env: the runner context is not
      # available to jobs.<id>.env.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      # Scenarios share one dockerd; the role's own reclaim is a daily timer
      # with a 24h age filter and cannot come between jobs that finish in
      # minutes. No --all: in-use and tagged images stay, only stopped
      # containers, dangling images, build cache and unused volumes go.
      # Best-effort by design, so a prune error never fails the scenario.
      - name: Reclaim shared Docker space before testing
        run: docker system prune --force --volumes
        continue-on-error: true

      - name: Install Molecule and dependencies
        run: |
          uv pip install --system \
            molecule \
            'molecule-plugins[docker]>=23.0.0' \
            'ansible-core>=2.16' \
            'docker>=7.0.0' \
            netaddr \
            ansible-lint

      # Cache Galaxy content keyed on requirements.yml, under this job's
      # isolated ANSIBLE_HOME (never the shared runner-wide ~/.ansible) so the
      # cache restore can't reintroduce the cross-job race that isolation
      # exists to prevent. Same key convention as dryvist/.github's
      # _ansible-ci.yml.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.ANSIBLE_HOME }}/collections
            ${{ env.ANSIBLE_HOME }}/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        # Galaxy flakes with 504s and read timeouts; a retry beats rerunning
        # the whole job. Same four attempts and backoff the retry script used.
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 4
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: ansible-galaxy install -r requirements.yml
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      # Least-privilege secret handling: this action (pinned v2.0.0) has NO
      # allowlist input — it always fetches the token's entire config.
      # With inject-env-vars it would export EVERY key into the job environment
      # for every subsequent step. We deliberately omit inject-env-vars so no
      # secret lands in the ambient job env, then map ONLY the three keys the
      # molecule scenarios actually consume into the test step's own env below.
      # Each value is still registered with the runner's mask (the action calls
      # core.setSecret per key), so it is redacted in logs. The values remain
      # available as masked step outputs (steps.doppler.outputs.<KEY>).
      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Run molecule tests
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          # Instance names are fixed per scenario, so two concurrent runs of the
          # same scenario against one Docker daemon act on each other's
          # containers: create adopts the other's, destroy removes it mid-run.
          # This suffix makes the names unique per job. Unset locally, where it
          # interpolates to nothing and developer runs are unchanged.
          CI_INSTANCE_SUFFIX: "-${{ github.run_id }}-${{ github.run_attempt }}"
          # Molecule's ephemeral directory (inventory + state.yml) is keyed by
          # scenario under $HOME, which is likewise shared. RUNNER_TEMP is
          # unique per job.
          MOLECULE_EPHEMERAL_DIRECTORY: ${{ runner.temp }}/molecule-${{ matrix.scenario }}
          # community.docker's `timeout` defaults to 60s on the Docker API
          # socket. molecule-plugins' create/destroy playbooks never pass it,
          # so the fallback env var is the only lever. With the whole matrix
          # sharing one daemon, removing a privileged systemd container can
          # exceed 60s and destroy fails with "Error removing container ...
          # UnixHTTPConnectionPool ... Read timed out. (read timeout=60)" —
          # the removal itself succeeds, only the client gives up early.
          DOCKER_TIMEOUT: "300"
          # Only the secrets the scenarios reference (verified against
          # molecule/*/molecule.yml provisioner.env and the exercised roles):
          #   default     -> MSSQL_SA_PASSWORD
          #   download_vpn-> QBITTORRENT_ADMIN_PASSWORD (Proton WG keys use
          #                  built-in dummy fallbacks; services not started in CI)
          #   seerr       -> none (SEERR_API_KEY uses a built-in dummy
          #                  fallback; container not started in CI)
          #   servarr_wiring -> none (SONARR/RADARR/PROWLARR_API_KEY use
          #                  built-in dummy fallbacks; manage_services=false,
          #                  no live *arr APIs in CI)
          #   configarr   -> none (SONARR/RADARR_API_KEY dummy fallbacks;
          #                  container run tagged molecule-notest)
          #   sonarr/radarr -> none (API keys dummy fallbacks;
          #                  manage_services=false, no live app in CI)
          #   sonarr_language_audit -> none (the deployed script reads
          #                  Sonarr's API key from config.xml at runtime;
          #                  no secret touches this role at all)
          #   plex        -> none (claim/library/publish gated on
          #                  manage_services=false; apt install only)
          #   sortarr     -> none (SONARR_API_KEY/RADARR_API_KEY/
          #                  SORTARR_BASIC_AUTH_PASS use built-in dummy
          #                  fallbacks; container not started in CI)
          #   static_site -> none (role reads no secrets; the fixture site
          #                  is committed alongside the scenario)
          #   technitium_dns -> none (PROXMOX_DOMAIN/SUBDOMAIN +
          #                  TECHNITIUM_DNS_API_TOKEN use built-in dummy
          #                  fallbacks; technitium_dns_apply=false, no live API)
          #   openbao     -> none (static seal key stubbed in converge;
          #                  service + bootstrap gated off under Docker)
          #   ssh_ca_trust -> none (activation gate held closed in both
          #                  converge cases; no live OpenBao CA fetch)
          MSSQL_SA_PASSWORD: ${{ steps.doppler.outputs.MSSQL_SA_PASSWORD }}
          QBITTORRENT_ADMIN_PASSWORD: ${{ steps.doppler.outputs.QBITTORRENT_ADMIN_PASSWORD }}
        run: molecule test -s "$MOLECULE_SCENARIO"

  template-render:
    name: Template Rendering Tests
    # Hosted for a public repo and for fork PRs; self-hosted only for a
    # private repo's own PRs.
    runs-on: >-
      ${{ (github.event.repository.private == false ||
      github.event.pull_request.head.repo.fork) &&
      'ubuntu-latest' || 'proxmox' }}
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state — see the `test` job above for why.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Ansible and dependencies
        run: |
          uv pip install --system \
            'ansible-core>=2.16'

      # Cache Galaxy content keyed on requirements.yml, under this job's
      # isolated ANSIBLE_HOME (never the shared runner-wide ~/.ansible) so the
      # cache restore can't reintroduce the cross-job race that isolation
      # exists to prevent. Same key convention as dryvist/.github's
      # _ansible-ci.yml.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.ANSIBLE_HOME }}/collections
            ${{ env.ANSIBLE_HOME }}/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        # Galaxy flakes with 504s and read timeouts; a retry beats rerunning
        # the whole job. Same four attempts and backoff the retry script used.
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 4
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: ansible-galaxy install -r requirements.yml
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      - name: Run template rendering tests
        run: ansible-playbook tests/template_render/verify_templates.yml -c local
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          # A reserved, never-resolvable placeholder (RFC 2606), not the real
          # zone. The harness used to run with this unset, which only worked
          # because the guards on it could never fire: an unset env lookup
          # rendered empty and every URL built from it came out malformed but
          # green. With the guards repaired the harness must supply a value,
          # and supplying a fake one is what makes the rendering assertions
          # meaningful rather than vacuous.
          PROXMOX_SUBDOMAIN: example.invalid

  # Separate job, not another step on template-render: an unrelated failure
  # there would otherwise mask this one, since a failing step stops the job
  # before later steps run. Split into its own reusable workflow (see
  # _nautobot-seed.yml) because this file reached the per-file token budget —
  # same pattern as _data-contract.yml / _inventory-contract.yml.
  nautobot-seed:
    name: Nautobot Seed Bundle Tests
    uses: ./.github/workflows/_nautobot-seed.yml
