---
name: Molecule

on:
  workflow_call:
    secrets:
      DOPPLER_TOKEN:
        description: Doppler service token
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Molecule (${{ matrix.scenario }})
    # Self-hosted (pre-baked toolchain); fork PRs fall back to a hosted runner
    # so fork-author code never runs on the fleet.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'proxmox' }}
    strategy:
      fail-fast: false
      # Concurrency is the only lever that bounds Molecule's load here.
      #
      # The test containers are created through the bind-mounted docker.sock,
      # so they are SIBLINGS of the runner on the shared dockerd -- not children
      # of its cgroup. The runner's own cpus/mem_limit therefore does not apply
      # to them, and the host is deliberately oversubscribed, so an unbounded
      # matrix can starve a scenario mid-run and the container dies.
      #
      # Capping concurrency bounds that without capping any single container.
      # A per-container `memory:` ceiling was tried and reverted: 1536m killed
      # download_vpn outright while the same scenario passed on develop, and no
      # measurement existed to justify any particular number. Bound what is
      # actually shared; do not guess a limit for each consumer of it.
      max-parallel: 2
      matrix:
        scenario:
          - default
          - configarr
          - download_vpn
          - plex
          - radarr
          - seerr
          - servarr_wiring
          - sonarr
          - sortarr
          - static_site
          - technitium_dns
          - netmon
          - immich
          - openbao
          - keepalived
          - postgres
          - nautobot
          - ssh_ca_trust

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state. The fleet runners share ~/.ansible, and
      # concurrent `ansible-galaxy collection install` runs race in it — the
      # git-sourced collection is tar-built under ANSIBLE_HOME/tmp, so two
      # jobs on one host corrupt each other's build and every later job on
      # that runner dies with "Collection tar file member MANIFEST.json does
      # not contain a valid json string". RUNNER_TEMP is unique per job. A
      # $GITHUB_ENV step, not job-level env: the runner context is not
      # available to jobs.<id>.env.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      # Hosted-only provisioning: fleet runners use the image's pre-baked
      # toolchain — setup-python's standalone build needs a newer CPU ISA
      # level than the runner VMs expose, and the apt python3 is PEP-668
      # externally-managed so uv --system installs are refused there.
      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Molecule and dependencies
        if: runner.environment == 'github-hosted'
        run: |
          uv pip install --system \
            molecule \
            'molecule-plugins[docker]>=23.0.0' \
            'ansible-core>=2.16' \
            'docker>=7.0.0' \
            netaddr \
            ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy install -r requirements.yml --force

      # Least-privilege secret handling: this action (pinned v2.0.0) has NO
      # allowlist input — it always fetches the token's entire config.
      # With inject-env-vars it would export EVERY key into the job environment
      # for every subsequent step. We deliberately omit inject-env-vars so no
      # secret lands in the ambient job env, then map ONLY the three keys the
      # molecule scenarios actually consume into the test step's own env below.
      # Each value is still registered with the runner's mask (the action calls
      # core.setSecret per key), so it is redacted in logs. The values remain
      # available as masked step outputs (steps.doppler.outputs.<KEY>).
      - name: Fetch secrets from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Run molecule tests
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          # community.docker's `timeout` defaults to 60s on the Docker API
          # socket. molecule-plugins' create/destroy playbooks never pass it,
          # so the fallback env var is the only lever. With the whole matrix
          # sharing one daemon, removing a privileged systemd container can
          # exceed 60s and destroy fails with "Error removing container ...
          # UnixHTTPConnectionPool ... Read timed out. (read timeout=60)" —
          # the removal itself succeeds, only the client gives up early.
          DOCKER_TIMEOUT: "300"
          # Only the secrets the scenarios reference (verified against
          # molecule/*/molecule.yml provisioner.env and the exercised roles):
          #   default     -> MSSQL_SA_PASSWORD
          #   download_vpn-> QBITTORRENT_ADMIN_PASSWORD (Proton WG keys use
          #                  built-in dummy fallbacks; services not started in CI)
          #   seerr       -> none (SEERR_API_KEY uses a built-in dummy
          #                  fallback; container not started in CI)
          #   servarr_wiring -> none (SONARR/RADARR/PROWLARR_API_KEY use
          #                  built-in dummy fallbacks; manage_services=false,
          #                  no live *arr APIs in CI)
          #   configarr   -> none (SONARR/RADARR_API_KEY dummy fallbacks;
          #                  container run tagged molecule-notest)
          #   sonarr/radarr -> none (API keys dummy fallbacks;
          #                  manage_services=false, no live app in CI)
          #   plex        -> none (claim/library/publish gated on
          #                  manage_services=false; apt install only)
          #   sortarr     -> none (SONARR_API_KEY/RADARR_API_KEY/
          #                  SORTARR_BASIC_AUTH_PASS use built-in dummy
          #                  fallbacks; container not started in CI)
          #   static_site -> none (role reads no secrets; the fixture site
          #                  is committed alongside the scenario)
          #   technitium_dns -> none (PROXMOX_DOMAIN/SUBDOMAIN +
          #                  TECHNITIUM_DNS_API_TOKEN use built-in dummy
          #                  fallbacks; technitium_dns_apply=false, no live API)
          #   openbao     -> none (static seal key stubbed in converge;
          #                  service + bootstrap gated off under Docker)
          #   ssh_ca_trust -> none (activation gate held closed in both
          #                  converge cases; no live OpenBao CA fetch)
          MSSQL_SA_PASSWORD: ${{ steps.doppler.outputs.MSSQL_SA_PASSWORD }}
          QBITTORRENT_ADMIN_PASSWORD: ${{ steps.doppler.outputs.QBITTORRENT_ADMIN_PASSWORD }}
        run: molecule test -s "$MOLECULE_SCENARIO"

  template-render:
    name: Template Rendering Tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'proxmox' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state — see the `test` job above for why.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      # Hosted-only provisioning — same constraint as the test job above.
      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Ansible and dependencies
        if: runner.environment == 'github-hosted'
        run: |
          uv pip install --system \
            'ansible-core>=2.16'

      - name: Install Ansible collections
        run: ansible-galaxy install -r requirements.yml --force

      - name: Run template rendering tests
        run: ansible-playbook tests/template_render/verify_templates.yml -c local
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  # Separate job, not another step on template-render: an unrelated failure
  # there would otherwise mask this one, since a failing step stops the job
  # before later steps run.
  nautobot-seed:
    name: Nautobot Seed Bundle Tests
    # Hosted, unlike the jobs above: this test is fully offline and needs no
    # fleet resources, and the role's json_query filter needs jmespath, which
    # the pre-baked self-hosted image does not carry (and cannot gain via pip —
    # its system python is PEP-668 externally managed).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Ansible and dependencies
        run: |
          uv pip install --system \
            'ansible-core>=2.16' \
            jmespath

      - name: Install Ansible collections
        run: ansible-galaxy install -r requirements.yml --force

      # Covers roles/nautobot/tasks/seed_bundle.yml, which the nautobot Molecule
      # scenario cannot reach (it pins nautobot_build_seed false).
      - name: Run nautobot seed-bundle assembly tests
        run: ansible-playbook tests/nautobot_seed/verify_seed_bundle.yml -c local
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
