---
# The inventory half of this repo's data contract, split out of
# _data-contract.yml.
#
# The split is mechanical: these three jobs all assert that the published
# inventory is loadable and correctly shaped, and the file they came from had
# reached the per-file size budget CI enforces. That budget is never raised, so
# the remedy is always to split the source. Both halves are called by ci-gate
# and both are named in the Merge Gate's dependency list — a check that is not
# a gate dependency is decoration.

name: Inventory Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax Check
    # Self-hosted (pre-baked ansible + collections); fork PRs fall back to a
    # hosted runner so fork-author code never runs on the fleet.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'proxmox' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state. The fleet runners share ~/.ansible, and
      # concurrent `ansible-galaxy collection install` runs race in it — the
      # git-sourced collection is tar-built under ANSIBLE_HOME/tmp, so two
      # jobs on one host corrupt each other's build and every later job on
      # that runner dies with "Collection tar file member MANIFEST.json does
      # not contain a valid json string". RUNNER_TEMP is unique per job. A
      # $GITHUB_ENV step, not job-level env: the runner context is not
      # available to jobs.<id>.env.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'

      - name: Install Ansible
        run: |
          uv pip install --system 'ansible-core>=2.16'

      - name: Install Ansible collections
        run: |
          scripts/ansible-galaxy-install-retry.sh
      - name: Syntax check playbooks
        run: |
          # Top level only: playbooks/tasks/ holds include_tasks task lists,
          # which are not Plays — `ansible-playbook --syntax-check` cannot
          # parse them (ansible-lint in the ci job covers them instead).
          for playbook in playbooks/*.{yml,yaml}; do
            if [ -f "$playbook" ]; then
              echo "Checking syntax: $playbook"
              ansible-playbook "$playbook" --syntax-check
            fi
          done
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'

      # Runs in this job because the callback plugin imports ansible.plugins,
      # which only this data-contract job already has installed.
      - name: Verify converge-freshness telemetry contract
        run: python3 tests/test_converge_telemetry.py -v

      # The event-construction half, split out to keep each file within
      # the per-file budget. Both must run; a suite that is not invoked
      # reports nothing at all.
      - name: Verify converge telemetry event construction
        run: python3 tests/test_converge_telemetry_events.py -v

      # Both ingress transports must bound their backend timeouts. A
      # named transport inherits nothing, so covering only the default
      # one leaves the unbounded hang reachable.
      - name: Verify ingress backend forwarding timeouts
        run: python3 tests/traefik_timeouts/test_backend_timeouts.py -v

  validate-inventory-schema:
    name: Validate Inventory Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate tofu_inventory.json against schema
        run: python3 tests/inventory_load/validate_schema.py

  verify-inventory-load:
    name: Verify Inventory Load
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'proxmox' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state — see syntax-check above for why.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'

      - name: Install Ansible and collections
        run: |
          uv pip install --system 'ansible-core>=2.16'

      # load_tofu.yml (imported by verify_inventory.yml) include_role's the
      # shared inventory_resolve role by FQCN, so this run is what proves the
      # collection actually resolves it.
      - name: Install Ansible dependencies
        run: |
          scripts/ansible-galaxy-install-retry.sh
      - name: Verify inventory loads and groups are assigned correctly
        run: >-
          ansible-playbook tests/inventory_load/verify_inventory.yml
          -i inventory/hosts.yml -c local
        env:
          # Pin the fixture explicitly (resolution priority 1) so the test is
          # hermetic even on a runner with ambient AWS creds — the S3 artifact
          # (priority 2) must never feed a test.
          TOFU_INVENTORY_PATH: ${{ github.workspace }}/tests/inventory_load/tofu_inventory.json
          PROXMOX_SSH_KEY_PATH: /dev/null
          PROXMOX_DKR_SSH_KEY_PATH: /dev/null
          ANSIBLE_HOST_KEY_CHECKING: 'false'

      - name: Verify apps PostgreSQL primary routing
        run: ansible-playbook tests/postgres_apps_primary/verify.yml -c local

      # The guard this covers protects everything the secrets store's single
      # provisioning host owns. When that host drops out of a run, all of it
      # skips and the run still reports success.
      - name: Verify the bootstrap-host-absent guard
        run: >-
          ansible-playbook tests/openbao_bootstrap_host/verify.yml
          -i localhost, -c local

      # The reconcile identity's source-address class: machine-only would
      # refuse its documented workstation callers once applied.
      - name: Verify the AppRole source-address class map
        run: >-
          ansible-playbook tests/approle_cidr_class/verify.yml
          -i localhost, -c local

      - name: Verify the execution plane's credential is bounded elsewhere
        run: >-
          ansible-playbook tests/plane_identity_bounds/verify.yml
          -i localhost, -c local

      - name: Verify every non-expiring secret_id has a compensating control
        run: >-
          ansible-playbook tests/nonexpiring_secret_ids/verify.yml
          -i localhost, -c local

      - name: Verify AppRole login outcomes are attributed
        run: python3 tests/test_approle_login_attribution.py -v

      - name: Verify the reconcile identity credential paths
        run: python3 tests/test_reconcile_identity_paths.py -v

      - name: Verify the clock gate waits and still fails closed
        run: python3 tests/test_clock_gate_waits.py -v

      - name: Verify the apt proxy autodetect hook
        run: python3 tests/test_apt_proxy_detect.py -v

      # Static paths only — no workflow-context interpolation in this step.
      - name: Verify DNS primary/secondary derivation
        run: >-
          ansible-playbook tests/technitium_dns_derivation/verify.yml
          -i localhost, -c local

      # Both object-storage tests guard a condition that fails silently when it
      # regresses: a lifecycle rule that stops reconciling, and an offsite copy
      # that starts mirroring deletions. Neither was reachable from CI before.
      - name: Verify object-storage lifecycle reconcile condition
        run: >-
          ansible-playbook
          tests/object_storage_lifecycle/verify_reconcile_condition.yml -c local

      - name: Verify object-storage offsite copy guard
        run: >-
          ansible-playbook
          tests/object_storage_offsite/verify_offsite_guard.yml -c local

      # Executes the rendered openbao-slack-rotate.sh against a stubbed curl
      # (no live OpenBao, no live Slack) to prove the rotate-needed decision
      # and the CAS-rejection adopt path, not just that the code exists.
      - name: Verify Slack app-config rotation script logic
        run: >-
          ansible-playbook
          tests/openbao_slack_rotate/verify_rotate_logic.yml -c local

      # Executes the rendered generic+splunk-mcp composed script against a
      # stubbed curl (no live OpenBao, no live Splunk) to prove the
      # skip-when-fresh decision, the probe-fail-leaves-KV-untouched path,
      # the CAS-conflict-fails-loud path, and the rotation-clock stamp plus
      # token reconciliation on success.
      - name: Verify Splunk MCP rotation script logic
        run: >-
          ansible-playbook
          tests/openbao_rotate/verify_splunk_mcp_logic.yml -c local

      # Executes the rendered secret-age auditor script against stubbed
      # curl/bao (no live OpenBao) to prove the age classification
      # (overdue/due/exempt/fallback-source), not just that the code exists.
      - name: Verify secret-age auditor classification logic
        run: >-
          ansible-playbook
          tests/openbao_secret_age/verify_age_logic.yml -c local

      # Same fixture, the false-green and alert-storm guard cases: a denied
      # (not absent) mount-root list must fail the whole audit, an
      # unparseable rotation timestamp must count as an error rather than
      # silently vanish, and overdue items must page as one digest — never
      # one push per item.
      - name: Verify secret-age auditor false-green and alert-storm guards
        run: >-
          ansible-playbook
          tests/openbao_secret_age/verify_age_logic_guards.yml -c local

      # Runs playbooks/rotate-key.yml against a stubbed OpenBao (stdlib
      # http.server, no live OpenBao) to prove the rotate/refuse decisions,
      # not just that the playbook parses.
      - name: Verify on-demand secret rotation playbook
        run: >-
          ansible-playbook
          tests/rotate_key/verify_rotate_key.yml -c local
