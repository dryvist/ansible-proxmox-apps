---
name: OpenHands CI Fix

# Started when CI Gate fails, and by the PR Reconcile sweep: one
# workflow_dispatch per head commit of a pull request whose code checks failed.
# The called workflow handles gating, attempt caps, daily limits and concurrency.
on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failure_run_id:
        description: ID of the failed run
        required: true
        type: string
      failure_head_branch:
        description: Head branch of the failed run
        required: true
        type: string

# The called workflow's jobs request exactly these scopes (fix commit, pull
# request comment through the issues API, run logs); a caller that grants
# less fails at graph validation.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    uses: JacobPEvans/.github-ai/.github/workflows/cc-ci-fix.yml@4e79125ab1f3eaed907468e6af987d57fa638148 # v2.57.0
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      GH_APP_CLAUDE_BOT_ID: ${{ secrets.GH_APP_CLAUDE_BOT_ID }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
    with:
      # Hosted runners cannot reach the model router; the review pool can.
      runner_label: review
      agent: openhands
      local_model: medium
      daily_run_limit: "20"
      # Empty on workflow_run: the called workflow reads the failed run from the event.
      failure_conclusion: ${{ github.event_name == 'workflow_dispatch' && 'failure' || '' }}
      failure_run_id: ${{ inputs.failure_run_id }}
      failure_head_branch: ${{ inputs.failure_head_branch }}
      failure_head_repository: ${{ github.event_name == 'workflow_dispatch' && github.repository || '' }}
      failure_actor: ${{ github.event_name == 'workflow_dispatch' && github.actor || '' }}
      repo_context: "Ansible playbooks and roles for applications on Proxmox VMs/containers"
      ci_structure: "ansible-lint.yml (ansible-lint + ansible-playbook --syntax-check)"
      extra_tools: "Bash(ansible-lint:*),Bash(ansible-playbook:*)"
