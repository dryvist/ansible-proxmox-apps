---
# Repo-specific data-contract checks for ansible-proxmox-apps.
#
# ansible-lint is centralized in dryvist/.github/_ansible-ci.yml. The jobs here
# assert THIS repo's data contract — playbook syntax, the tofu inventory schema,
# and that the inventory loads with correct group assignments. They are not
# generic ansible CI, so they stay local and are aggregated by the wrapper's
# "Merge Gate".

name: Data Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runner-contract:
    name: Verify Ansible Runner Token Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Verify runner token ownership and cleanup
        run: python3 tests/test_run_ansible_runner.py -v

  # The nautobot-export contract had a shape check (tests/nautobot_export_shape.py)
  # that nothing ever ran, so the export job and its schema could drift apart
  # silently. Its own job, not a step on another, so an unrelated failure cannot
  # stop it before it runs.
  export-contract:
    name: Verify Nautobot Export Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      # jsonschema is optional for the check, which degrades to a keys-only
      # comparison without it. Install it so CI always does the full validation.
      - name: Install jsonschema
        run: python3 -m pip install --upgrade jsonschema

      - name: Verify export shape matches the contract schema
        run: python3 tests/nautobot_export_shape.py

      # Runs here rather than in its own job because it imports the stubs from
      # nautobot_export_shape.py — same module, same setup. No PYTHONPATH: the
      # script's own directory is on sys.path, so tests/ resolves already.
      - name: Verify the export refuses to publish ahead of an ingest
        run: python3 tests/nautobot_export_ordering.py

      # Self-contained (stubs django + nautobot itself), but grouped with the
      # other two because it covers the same failure class: a converge that
      # reports success while nothing is actually publishing.
      - name: Verify the export schedule is reconciled, not just present
        run: python3 tests/nautobot_schedule_export.py

      # Placement is the part of the hardware seed that fails silently: a
      # module written with both a location and a parent bay, or one hung off
      # an invented chassis, still looks like a successful ingest.
      - name: Verify hardware seed placement (spares, bays, missing chassis)
        run: python3 tests/nautobot_hardware_seed.py

      # The drive sync is the only seed job that DELETES, so an empty source is
      # destructive rather than a no-op. Two guards stop that — the runner does
      # not enrol the job without drives in the bundle, and the job refuses an
      # empty slice — and both fail silently if they regress.
      - name: Verify the drive sync refuses an empty source
        run: python3 tests/nautobot_drives_seed.py

      # A seed job enqueued the wrong way does not fail the converge loudly —
      # it reports JOB_ERROR for that one job while the rest go green, which
      # reads as a successful run that seeded only part of the database.
      - name: Verify the seed-job enqueue contract (both Nautobot signatures)
        run: python3 tests/nautobot_run_seed_jobs.py

      # Node devices are keyed on name alone and their delete is a no-op, so a
      # renamed node is created alongside the device it was meant to replace
      # and nothing later removes the orphan. This file existed but no step ran
      # it, so that behaviour was documented and ungated at the same time.
      - name: Verify the node seed preserves curated fields and refuses renames
        run: python3 tests/nautobot_nodes_seed.py

      # The scenario list drives the Molecule matrix and is no longer duplicated
      # in the workflow, so it has to stay true to molecule/ on disk. A scenario
      # on disk but unlisted never runs and nothing says so.
      - name: Verify the Molecule scenario list matches molecule/
        run: python3 scripts/select_molecule_scenarios.py --check-disk molecule

      - name: Verify the Molecule scenario selector fails safe
        run: python3 scripts/select_molecule_scenarios.py --demo

  syntax-check:
    name: Syntax Check
    # Self-hosted (pre-baked ansible + collections); fork PRs fall back to a
    # hosted runner so fork-author code never runs on the fleet.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'proxmox' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state. The fleet runners share ~/.ansible, and
      # concurrent `ansible-galaxy collection install` runs race in it — the
      # git-sourced collection is tar-built under ANSIBLE_HOME/tmp, so two
      # jobs on one host corrupt each other's build and every later job on
      # that runner dies with "Collection tar file member MANIFEST.json does
      # not contain a valid json string". RUNNER_TEMP is unique per job. A
      # $GITHUB_ENV step, not job-level env: the runner context is not
      # available to jobs.<id>.env.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'

      - name: Install Ansible
        run: |
          uv pip install --system 'ansible-core>=2.16'

      - name: Install Ansible collections
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Syntax check playbooks
        run: |
          # Top level only: playbooks/tasks/ holds include_tasks task lists,
          # which are not Plays — `ansible-playbook --syntax-check` cannot
          # parse them (ansible-lint in the ci job covers them instead).
          for playbook in playbooks/*.{yml,yaml}; do
            if [ -f "$playbook" ]; then
              echo "Checking syntax: $playbook"
              ansible-playbook "$playbook" --syntax-check
            fi
          done
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'

      # Runs in this job because the callback plugin imports ansible.plugins,
      # which only this data-contract job already has installed.
      - name: Verify converge-freshness telemetry contract
        run: python3 tests/test_converge_telemetry.py -v

  validate-inventory-schema:
    name: Validate Inventory Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate tofu_inventory.json against schema
        run: python3 tests/inventory_load/validate_schema.py

  verify-inventory-load:
    name: Verify Inventory Load
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'proxmox' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state — see syntax-check above for why.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'

      - name: Install Ansible and collections
        run: |
          uv pip install --system 'ansible-core>=2.16'

      # load_tofu.yml (imported by verify_inventory.yml) include_role's the
      # shared inventory_resolve role by FQCN, so this run is what proves the
      # collection actually resolves it.
      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Verify inventory loads and groups are assigned correctly
        run: >-
          ansible-playbook tests/inventory_load/verify_inventory.yml
          -i inventory/hosts.yml -c local
        env:
          # Pin the fixture explicitly (resolution priority 1) so the test is
          # hermetic even on a runner with ambient AWS creds — the S3 artifact
          # (priority 2) must never feed a test.
          TOFU_INVENTORY_PATH: ${{ github.workspace }}/tests/inventory_load/tofu_inventory.json
          PROXMOX_SSH_KEY_PATH: /dev/null
          PROXMOX_DKR_SSH_KEY_PATH: /dev/null
          ANSIBLE_HOST_KEY_CHECKING: 'false'

      - name: Verify apps PostgreSQL primary routing
        run: ansible-playbook tests/postgres_apps_primary/verify.yml -c local

      # Both object-storage tests guard a condition that fails silently when it
      # regresses: a lifecycle rule that stops reconciling, and an offsite copy
      # that starts mirroring deletions. Neither was reachable from CI before.
      - name: Verify object-storage lifecycle reconcile condition
        run: >-
          ansible-playbook
          tests/object_storage_lifecycle/verify_reconcile_condition.yml -c local

      - name: Verify object-storage offsite copy guard
        run: >-
          ansible-playbook
          tests/object_storage_offsite/verify_offsite_guard.yml -c local

      # Executes the rendered openbao-slack-rotate.sh against a stubbed curl
      # (no live OpenBao, no live Slack) to prove the rotate-needed decision
      # and the CAS-rejection adopt path, not just that the code exists.
      - name: Verify Slack app-config rotation script logic
        run: >-
          ansible-playbook
          tests/openbao_slack_rotate/verify_rotate_logic.yml -c local
