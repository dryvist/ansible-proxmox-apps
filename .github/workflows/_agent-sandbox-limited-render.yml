---
# Reusable: Agent Sandbox Limited Inventory Render
#
# Exercises the service bind and ingress rules with the ingress host present
# in inventory but excluded by --limit, matching a limited deployment run.

name: _agent-sandbox-limited-render

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  render:
    name: Agent Sandbox Limited Inventory Render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"

      # The community package bundles community.general, whose filters the role uses.
      - name: Install Ansible
        run: uv pip install --system ansible

      - name: Render the agent sandbox with a limited inventory
        run: >-
          ansible-playbook
          tests/template_render/verify/agent_sandbox_limited.yml
          -i tests/template_render/inventory/agent_sandbox_limited.yml
          --limit sandbox_fixture,localhost
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
