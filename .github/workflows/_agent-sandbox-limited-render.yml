---
# Reusable: Agent Sandbox Limited Inventory Render
#
# Exercises the service bind and ingress rules with the ingress host present
# in inventory but excluded by --limit, matching a limited deployment run.

name: _agent-sandbox-limited-render

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  render:
    name: Agent Sandbox Limited Inventory Render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Ansible
        run: uv pip install --system 'ansible-core>=2.16'

      - name: Render the agent sandbox with a limited inventory
        run: >-
          ansible-playbook
          tests/template_render/verify/agent_sandbox_limited.yml
          -i tests/template_render/inventory/agent_sandbox_limited.yml
          --limit sandbox_fixture,localhost
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
