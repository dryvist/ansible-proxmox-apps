---
name: E2E Pipeline Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Smoke gates the data-flow suites -- no point chasing data through Splunk if
# the live endpoints are down. Every suite after it is one matrix entry so each
# layer's pass/fail stays independently visible with one job definition.
#
# Inputs the suite reads (tests/e2e/conftest.py, fixtures.py) arrive from the
# runner host, not from this workflow: TOFU_INVENTORY_PATH points at the
# inventory the host's converge bind mounts into every runner container, and
# SPLUNK_PASSWORD / SPLUNK_HEC_TOKEN come from an env file the host's OpenBao
# Agent renders from secret/apps/splunk (roles/github_runner). Nothing here
# decrypts anything, and the only package the suite needs beyond the standard
# library is pytest.

jobs:
  smoke:
    name: Smoke tests (service health)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # conftest.py skips every inventory-dependent test when the file is
      # absent, which would turn a runner-host misconfiguration into a green
      # run. Missing input is a failure here, not a skip.
      - name: Require the inventory the suite reads
        run: test -s "$TOFU_INVENTORY_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: pytest tests/e2e/test_smoke.py
        run: uv run --no-project --with pytest python -m pytest tests/e2e/test_smoke.py -v

  suite:
    name: ${{ matrix.name }}
    needs: smoke
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Syslog pipeline data flow
            file: test_pipeline.py
            args: ""
          - name: Splunk component
            file: test_splunk.py
            args: ""
          - name: Cribl Edge component
            file: test_cribl_edge.py
            args: ""
          - name: HAProxy component
            file: test_haproxy.py
            args: ""
          - name: NetFlow forwarding
            file: test_forwarding.py
            args: ""
          - name: Ingest family matrix
            file: test_family_matrix.py
            args: -n 8
          # The audit trail is the one stream whose absence is a security
          # finding rather than a monitoring gap. Un-skipping the test without
          # an entry here changed nothing: no job referenced the file, so the
          # suite stayed green through a four-hour outage of that trail.
          - name: OpenBao audit-trail freshness
            file: test_openbao_audit.py
            args: ""
          - name: macOS pipeline freshness
            file: test_macos.py
            args: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GitHub masks only what it is told about. The credentials arrive as
      # plain environment from the runner host, so register them before any
      # step can echo one into a log.
      - name: Mask the Splunk credentials
        run: |
          echo "::add-mask::$SPLUNK_PASSWORD"
          echo "::add-mask::$SPLUNK_HEC_TOKEN"

      # Same rule as smoke: conftest.py skips the Splunk tests when either
      # value is unset, and the agent leaves the file empty until it can read
      # the store. Absent credentials fail the job rather than hollow it out.
      - name: Require the inventory and the Splunk credentials
        run: test -s "$TOFU_INVENTORY_PATH" && test -n "$SPLUNK_PASSWORD" && test -n "$SPLUNK_HEC_TOKEN"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: pytest tests/e2e/${{ matrix.file }}
        env:
          E2E_FILE: ${{ matrix.file }}
          E2E_ARGS: ${{ matrix.args }}
        run: |
          read -ra E2E_ARGS_ARR <<< "$E2E_ARGS"
          uv run --no-project --with pytest --with pytest-xdist \
            python -m pytest "tests/e2e/$E2E_FILE" -v "${E2E_ARGS_ARR[@]}"
