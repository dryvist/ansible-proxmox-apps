---
# The OpenBao/secrets half of this repo's data contract, split out of
# _inventory-contract.yml, which had reached the per-file size budget CI
# enforces. That budget is never raised, so the remedy is always to split
# the source. Named in the Merge Gate's dependency list alongside its
# siblings — a check that is not a gate dependency is decoration.

name: Secrets Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-secrets-contract:
    name: Verify Secrets Contract
    # Hosted for a public repo and for fork PRs; self-hosted only for a
    # private repo's own PRs. Every step here runs against a stubbed local
    # server or a rendered script under a stubbed curl -- nothing estate-only.
    runs-on: >-
      ${{ (github.event.repository.private == false ||
      github.event.pull_request.head.repo.fork) &&
      'ubuntu-latest' || 'proxmox' }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Per-job Ansible state — see _inventory-contract.yml's syntax-check
      # job for why.
      - name: Isolate per-job ANSIBLE_HOME
        run: echo "ANSIBLE_HOME=$RUNNER_TEMP/ansible-home" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 'latest'

      - name: Install Ansible and collections
        run: |
          uv pip install --system 'ansible-core>=2.16'

      # Cache Galaxy content keyed on requirements.yml, under this job's
      # isolated ANSIBLE_HOME (never the shared runner-wide ~/.ansible) so the
      # cache restore can't reintroduce the cross-job race that isolation
      # exists to prevent. Same key convention as dryvist/.github's
      # _ansible-ci.yml.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.ANSIBLE_HOME }}/collections
            ${{ env.ANSIBLE_HOME }}/roles
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible dependencies
        # Galaxy flakes with 504s and read timeouts; a retry beats rerunning
        # the whole job. Same four attempts and backoff the retry script used.
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 4
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: ansible-galaxy install -r requirements.yml
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      # The guard this covers protects everything the secrets store's single
      # provisioning host owns. When that host drops out of a run, all of it
      # skips and the run still reports success.
      - name: Verify the bootstrap-host-absent guard
        run: >-
          ansible-playbook tests/openbao_bootstrap_host/verify.yml
          -i localhost, -c local

      # The reconcile identity's source-address class: machine-only would
      # refuse its documented workstation callers once applied.
      - name: Verify the AppRole source-address class map
        run: >-
          ansible-playbook tests/approle_cidr_class/verify.yml
          -i localhost, -c local

      - name: Verify the execution plane's credential is bounded elsewhere
        run: >-
          ansible-playbook tests/plane_identity_bounds/verify.yml
          -i localhost, -c local

      - name: Verify every non-expiring secret_id has a compensating control
        run: >-
          ansible-playbook tests/nonexpiring_secret_ids/verify.yml
          -i localhost, -c local

      - name: Verify AppRole login outcomes are attributed
        run: python3 tests/test_approle_login_attribution.py -v

      - name: Verify the reconcile identity credential paths
        run: python3 tests/test_reconcile_identity_paths.py -v

      - name: Verify provisioning writes are sent to the Raft leader
        run: python3 tests/test_openbao_writes_target_leader.py -v

      - name: Verify the clock gate waits and still fails closed
        run: python3 tests/test_clock_gate_waits.py -v

      - name: Verify the apt proxy autodetect hook
        run: python3 tests/test_apt_proxy_detect.py -v

      - name: Verify the CI build caches reach every consumer
        run: python3 tests/test_ci_build_caches.py -v

      - name: Verify every bao_media_secrets consumer group is published
        run: python3 tests/test_media_secrets_publish_coverage.py -v

      # Static paths only — no workflow-context interpolation in this step.
      - name: Verify DNS primary/secondary derivation
        run: >-
          ansible-playbook tests/technitium_dns_derivation/verify.yml
          -i localhost, -c local

      # Both object-storage tests guard a condition that fails silently when it
      # regresses: a lifecycle rule that stops reconciling, and an offsite copy
      # that starts mirroring deletions. Neither was reachable from CI before.
      - name: Verify object-storage lifecycle reconcile condition
        run: >-
          ansible-playbook
          tests/object_storage_lifecycle/verify_reconcile_condition.yml -c local

      - name: Verify object-storage offsite copy guard
        run: >-
          ansible-playbook
          tests/object_storage_offsite/verify_offsite_guard.yml -c local

      # Executes the rendered openbao-slack-rotate.sh against a stubbed curl
      # (no live OpenBao, no live Slack) to prove the rotate-needed decision
      # and the CAS-rejection adopt path, not just that the code exists.
      - name: Verify Slack app-config rotation script logic
        run: >-
          ansible-playbook
          tests/openbao_slack_rotate/verify_rotate_logic.yml -c local

      # Executes the rendered generic+splunk-mcp composed script against a
      # stubbed curl (no live OpenBao, no live Splunk) to prove the
      # skip-when-fresh decision, the probe-fail-leaves-KV-untouched path,
      # the CAS-conflict-fails-loud path, and the rotation-clock stamp plus
      # token reconciliation on success.
      - name: Verify Splunk MCP rotation script logic
        run: >-
          ansible-playbook
          tests/openbao_rotate/verify_splunk_mcp_logic.yml -c local

      # Executes the rendered secret-age auditor script against stubbed
      # curl/bao (no live OpenBao) to prove the age classification
      # (overdue/due/exempt/fallback-source), not just that the code exists.
      - name: Verify secret-age auditor classification logic
        run: >-
          ansible-playbook
          tests/openbao_secret_age/verify_age_logic.yml -c local

      # Same fixture, the false-green and alert-storm guard cases: a denied
      # (not absent) mount-root list must fail the whole audit, an
      # unparseable rotation timestamp must count as an error rather than
      # silently vanish, and overdue items must page as one digest — never
      # one push per item.
      - name: Verify secret-age auditor false-green and alert-storm guards
        run: >-
          ansible-playbook
          tests/openbao_secret_age/verify_age_logic_guards.yml -c local

      # Runs playbooks/rotate-key.yml against a stubbed OpenBao (stdlib
      # http.server, no live OpenBao) to prove the rotate/refuse decisions,
      # not just that the playbook parses.
      - name: Verify on-demand secret rotation playbook
        run: >-
          ansible-playbook
          tests/rotate_key/verify_rotate_key.yml -c local

      # The rotation-exempt metadata tag is patched only when the server says
      # this identity may patch, and only when the marker is not already set;
      # an identity without the grant stays green and says so.
      - name: Verify the rotation-exempt tag's capability gate
        run: >-
          ansible-playbook
          tests/openbao_exempt_tag/verify_capability_gate.yml -c local
