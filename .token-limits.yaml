---
# Per-file token budgets, counted with the same offline tiktoken encoding an
# agent's context is measured in (scripts/check-token-limits.py in the org
# shared repo). First matching glob wins, so specific patterns come first.
#
# The point is NOT file size for its own sake. It is that an agent asked to
# change one thing should not have to read six unrelated things to find it.
# A file over budget is a file doing too many jobs; the fix is to split it into
# atomic, well-named files so the agent reads only the one it needs. Raising a
# budget to accommodate a file inverts that and is not the remedy.
limits:
  # A deployed shell script is a single runtime artifact: splitting it into
  # sourced fragments would add deployment and failure modes without giving a
  # reader less to read, since the whole script is the unit of behaviour.
  # Budgeted separately and higher for that reason, not grandfathered.
  "*.sh.j2": 6000

  "*.yml": 4000
  "*.yaml": 4000
  "*.j2": 4000
  "*.py": 4000
  "*.md": 4000

exclude:
  # Generated: compiled from the source workflow, never read or edited by hand.
  - ".github/workflows/*.lock.yml"
  - ".github/aw/*"
  # Append-only release history — length is inherent and it is read by section.
  - "CHANGELOG.md"
