---
# Merged first, then each scenario's own molecule.yml deep-merges on top
# (molecule.util.merge_dicts — dicts merge key by key, lists replace
# wholesale). Molecule finds this file by walking up from cwd looking for a
# `.git` DIRECTORY, so it applies whether a scenario is run from the repo
# root or from inside molecule/<scenario>/ in a normal checkout (including
# CI's).
#
# It does NOT auto-discover inside a `git worktree` checkout: there `.git`
# is a file (a pointer to the main repo's `.git/worktrees/<name>`), not a
# directory, so the upward walk never matches and Molecule silently falls
# back to its built-in defaults (`driver: default`, not `docker` — no
# error, just the wrong driver). Run `molecule --base-config
# .config/molecule/config.yml <command>` from inside a worktree.
#
# Only keys byte-identical across every molecule/*/molecule.yml belong here.
# A scenario needing a different value overrides the whole key in its own
# file; a scenario needing an additional sibling key (provisioner.env,
# provisioner.inventory) still gets one, since the merge is per-key, not
# whole-block replacement.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

verifier:
  name: ansible
