---
# Merged first, then each scenario's own molecule.yml deep-merges on top
# (molecule.util.merge_dicts — dicts merge key by key, lists replace
# wholesale). Molecule finds this file by walking up from cwd looking for a
# `.git` DIRECTORY, so it applies whether a scenario is run from the repo
# root or from inside molecule/<scenario>/ in a normal checkout (including
# CI's).
#
# Inside a `git worktree` checkout (this org's convention: a worktree per
# change, under `<repo>/.worktrees/<name>`) the worktree's own `.git` is a
# FILE (a pointer to the main checkout's `.git/worktrees/<name>`), not a
# directory, so it fails the upward walk's directory check there — but the
# walk keeps climbing past `.worktrees/` into the MAIN checkout, whose
# `.git` IS a directory, and stops there. The config it reads is therefore
# the MAIN checkout's `.config/molecule/config.yml`, on whatever branch
# that checkout happens to be on — not the worktree's own copy, and
# possibly absent or stale relative to it. This is silent: no error, no
# warning, just a config from a different branch than the one being
# tested. Run `molecule --base-config .config/molecule/config.yml
# <command>` from inside a worktree to force it to read the worktree's own
# copy instead.
#
# Only keys byte-identical across every molecule/*/molecule.yml belong here.
# A scenario needing a different value overrides the whole key in its own
# file; a scenario needing an additional sibling key (provisioner.env,
# provisioner.inventory) still gets one, since the merge is per-key, not
# whole-block replacement.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

provisioner:
  name: ansible
  # Molecule's generated inventory never loads the real repository's
  # inventory/group_vars/all.yml, so any var a role/playbook reads from
  # there (plane_host among them) is otherwise undefined under every
  # scenario. Declared once, here, rather than a `| default(...)` literal
  # repeated at each guard that reads it — this is the one base variable
  # every scenario gets it from. Merges per-key with a scenario's own
  # provisioner.inventory (hosts/host_vars), never replaces it.
  inventory:
    group_vars:
      all:
        plane_host: iac-platform

verifier:
  name: ansible
