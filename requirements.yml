---
# Ansible collections required for this repository
# Note: ansible.builtin is not listed as it's included with ansible-core
collections:
  - name: amazon.aws
    version: ">=9.0.0"  # RustFS inventory resolver: s3_object

  - name: ansible.posix
    version: ">=1.3.0"

  - name: ansible.utils
    version: ">=2.10.0"  # ipaddr/ipv4 filters used by the download_vpn role

  - name: community.general
    version: ">=10.3.0"  # Required for proxmox_pct_remote connection plugin

  # community.proxmox 2.0.0's proxmox_pct_remote connection plugin calls
  # self._raise_paramiko_connect_exception(), a helper a ruff-style refactor
  # (upstream PR #372, commit 0ffe419) extracted a call to but never actually
  # added — the method has never existed. Any LXC connect failure other than
  # a bad host key or a failed auth (closed port, timeout, DNS, no route to
  # host) crashes with an unrelated AttributeError instead of a real message,
  # masking the actual cause. Confirmed present in every released version
  # (1.6.0 through 2.0.0) and on the collection's current main branch; not a
  # paramiko-version issue — reproduced identically regardless of paramiko
  # version. Tracked upstream at
  # https://github.com/ansible-collections/community.proxmox/issues/477, fix
  # pending in https://github.com/ansible-collections/community.proxmox/pull/492
  # (MERGED 2026-08-12) -- but no release carries it yet: Galaxy's newest
  # published version is still 2.0.0. So the fork pin stays until upstream
  # publishes, then this whole entry is replaced by a plain Galaxy pin.
  #
  # Two annotations, because they answer different questions. The upstream
  # watch below bumps `upstream-latest` when community.proxmox publishes --
  # that PR IS the signal to delete the fork. Digest-tracking the fork alone
  # would only ever say "the fork moved", never "you can stop using it", which
  # is how a workaround outlives its cause.
  # renovate: datasource=galaxy depName=community.proxmox
  # upstream-latest: 2.0.0
  # renovate: datasource=git-refs depName=https://github.com/viniciussaporto/community.proxmox.git currentValue=main
  - name: https://github.com/viniciussaporto/community.proxmox.git
    type: git
    version: de9df0164413ef813844cc38464b843b03ae23fe

  - name: community.docker
    version: ">=3.6.0"  # docker_compose_v2 module added in 3.6.0

  - name: community.hashi_vault
    version: ">=6.0.0"  # openbao_secrets role: vault_login (approle) + vault_kv2_get (needs python hvac)

  - name: kubernetes.core
    version: ">=5.0.0"  # github_runner_arc role: k8s/k8s_info/helm modules against the pilot's k3s cluster

  - name: ansible.windows
    version: ">=2.0.0"  # windows_baseline: win_regedit, win_shell; vdi_local_routes: win_powershell (WinRM targets)

  - name: community.postgresql
    version: ">=5.0.0"  # postgres role: postgresql_user/_db/_privs idempotent role+db creation;
    # postgresql_alter_system (replaces the removed postgresql_set) requires 5.0.0+

  - name: networktocode.nautobot
    version: ">=6.2.0"  # gql_inventory plugin (inventory/nautobot.yml) — opt-in parallel inventory

  # Shared homelab roles (cribl_edge, cribl_packs, inventory_resolve). A
  # collection, not `roles:` git entries: `ansible-galaxy role install`
  # archives the whole repo, then picks what to install by taking the SHORTEST
  # path above any meta/main.yml it finds. The name in the entry selects
  # nothing. A repo holding one role resolves to that role and looks correct;
  # add a second role that sorts shorter and the same pin silently installs
  # that one instead, still under the requested name — at this pin it installed
  # cribl_edge as roles/inventory_resolve. A collection installs from the
  # subdirectory holding galaxy.yml, so every role is addressed by FQCN.
  # The Cribl roles moved to homelab-contracts because ansible-proxmox also
  # needs them — Cribl Edge is required on every Proxmox host, not just these
  # containers. Referenced by FQCN (dryvist.homelab.cribl_edge) in playbooks.
  # PIN: v3.2.2 at fd486a9..., includes #106 Edge trace routing.
  # Also carries #101 (converge_gate task names fit this repo's 120-column
  # lint, now reaches the role because budget-gate.yml runs it by FQCN), #100
  # (openbao_secrets reads OPENBAO_APPROLE_<DOMAIN>_ROLE_ID/_SECRET_ID before
  # the legacy <DOMAIN>_VAULT_* names), #98
  # (drops the collection's unused service_deadman copy), #89
  # (shared converge_gate playbook, imported by FQCN as
  # dryvist.homelab.converge_gate), #62
  # (inventory_resolve exports tofu_desired_state_published/_live/_current/
  # _changed_at, so a converge can detect an apply owed before it runs; omits
  # all four facts on a failed live read instead of reporting no drift), #60
  # (removes the local-cache tier and its inventory_resolve_local_cache /
  # inventory_resolve_allow_stale escape hatch — unused by this repo), and
  # #56 (Edge's own system_metrics source — the role templates the whole of
  # inputs.yml, so every source Edge ships enabled by default was dropped on
  # the first converge and no host metrics reached Splunk). Also carries the
  # CDN pointer fix (#52), the by-host split of the os catch-all (#54), and
  # #58 (inventory_resolve reports the real failure reason on every path).
  # An immutable SHA, not a branch — a moving ref would let an unreviewed
  # contracts change reach a converge here without a PR in this repo. The
  # annotation does not weaken that: Renovate proposes the bump as a PR, which
  # is exactly the review gate the pin exists to create. Untracked, the SHA
  # simply froze and nothing ever said so. Also carries the shared router
  # benchmark/program key catalog.
  # renovate: datasource=git-refs depName=https://github.com/dryvist/homelab-contracts.git currentValue=main
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: 6c7769c74c0f509adca2cca7a573ba177eb6205b

# Single-node k3s server for the github_runner_arc pilot (Actions Runner
# Controller). Renovate's ansible-galaxy manager reads both the `collections:`
# and `roles:` sections of this file natively — no customManager needed.
# renovate: datasource=galaxy-role depName=xanmanning.k3s
roles:
  - name: xanmanning.k3s
    version: "v3.6.4"

# Install with `ansible-galaxy install -r requirements.yml`: it covers both
# sections above, while `collection install` and `role install` each silently
# ignore the other and still exit zero.
