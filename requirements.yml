---
# Ansible collections required for this repository
# Note: ansible.builtin is not listed as it's included with ansible-core
collections:
  # RustFS inventory resolver: s3_object
  - name: amazon.aws
    version: "12.0.0"

  - name: ansible.posix
    version: "2.2.2"

  # ipaddr/ipv4 filters used by the download_vpn role
  - name: ansible.utils
    version: "6.1.1"

  # Required for proxmox_pct_remote connection plugin
  - name: community.general
    version: "13.5.0"

  # proxmox_pct_remote connection plugin (LXC) and the local backend.
  - name: community.proxmox
    version: "2.1.0"

  # docker_compose_v2 module added in 3.6.0
  - name: community.docker
    version: "5.4.0"

  # openbao_secrets role: vault_login (approle) + vault_kv2_get (needs python hvac)
  - name: community.hashi_vault
    version: "7.1.0"

  # github_runner_arc role: k8s/k8s_info/helm modules against the pilot's k3s cluster
  - name: kubernetes.core
    version: "6.6.0"

  # windows_baseline: win_regedit, win_shell; vdi_local_routes: win_powershell (WinRM targets)
  - name: ansible.windows
    version: "3.9.2"

  # postgres role: postgresql_user/_db/_privs idempotent role+db creation;
  - name: community.postgresql
    version: "5.1.0"
    # postgresql_alter_system (replaces the removed postgresql_set) requires 5.0.0+

  # gql_inventory plugin (inventory/nautobot.yml) — opt-in parallel inventory
  - name: networktocode.nautobot
    version: "6.3.0"

  # Shared homelab roles (cribl_edge, cribl_packs, inventory_resolve). A
  # collection, not `roles:` git entries: `ansible-galaxy role install`
  # archives the whole repo, then picks what to install by taking the SHORTEST
  # path above any meta/main.yml it finds. The name in the entry selects
  # nothing. A repo holding one role resolves to that role and looks correct;
  # add a second role that sorts shorter and the same pin silently installs
  # that one instead, still under the requested name — at this pin it installed
  # cribl_edge as roles/inventory_resolve. A collection installs from the
  # subdirectory holding galaxy.yml, so every role is addressed by FQCN.
  # The Cribl roles moved to homelab-contracts because ansible-proxmox also
  # needs them — Cribl Edge is required on every Proxmox host, not just these
  # containers. Referenced by FQCN (dryvist.homelab.cribl_edge) in playbooks.
  # Renovate follows released versions; each install uses an exact commit.
  # renovate: datasource=github-tags depName=dryvist/homelab-contracts currentValue=v5.55.0
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: 88d2c7980531e5da1a7d56d9332f4c58d123801a

  # dryvist.secrets_management collection (OpenBao and Authelia roles), pinned by SHA.
  # v0.80.0 tag.
  # renovate: datasource=github-tags depName=dryvist/ansible-secrets-management currentValue=v0.80.0
  - name: https://github.com/dryvist/ansible-secrets-management.git
    type: git
    version: aedf593f64fe72af64d89360416f983cefd25eec

  # sync_out_homebox first ships in v0.5.0, which publishes git tags only, no GitHub Releases.
  # renovate: datasource=github-tags depName=jpe-ansible/ansible-nautobot currentValue=v0.6.0
  - name: https://github.com/jpe-ansible/ansible-nautobot.git
    type: git
    version: 44f80f01cce46b560cbd61ff8e0218bfd21dfaae

# Single-node k3s server for the github_runner_arc pilot (Actions Runner
# Controller). Renovate's ansible-galaxy manager reads both the `collections:`
# and `roles:` sections of this file natively — no customManager needed.
# renovate: datasource=galaxy-role depName=xanmanning.k3s
roles:
  - name: xanmanning.k3s
    version: "v3.6.4"

# Install with `python3 scripts/install_galaxy_requirements.py` to refresh Git
# collections while keeping satisfied Galaxy packages and roles cached.
